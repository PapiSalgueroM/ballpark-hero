      - name: Locked installation and complete dependency inventory
        id: dependencies
        timeout-minutes: 6
        run: |
          set -euo pipefail
          out="$REPORT_RED_OUT"
          set +e
          timeout --signal=TERM --kill-after=15s 5m npm ci 2>&1 | tee "$out/install.log"
          statuses=("${PIPESTATUS[@]}")
          set -e
          printf '%s\n' "${statuses[0]}" > "$out/install.exit";printf '%s\n' "${statuses[1]}" > "$out/install.tee.exit"
          test "${#statuses[@]}" -eq 2;test "${statuses[0]}" -eq 0;test "${statuses[1]}" -eq 0
          find node_modules -path node_modules/.vite -prune -o -type f -print0 | sort -z > "$out/dependency-members.before"
          test "$(tr -cd '\000' < "$out/dependency-members.before" | wc -c)" -eq 24466
          xargs -0 sha256sum < "$out/dependency-members.before" > "$out/dependencies.sha256"
      - name: Actual app types with the original eager footer launcher
        id: types
        timeout-minutes: 6
        run: |
          set -euo pipefail
          out="$REPORT_RED_OUT"
          set -o noclobber;: > "$out/types.transport";set +o noclobber
          set +e
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$out/types.transport" timeout --signal=TERM --kill-after=15s 5m node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee "$out/types.log"
          statuses=("${PIPESTATUS[@]}")
          set -e
          printf '%s\n' "${statuses[0]}" > "$out/types.exit";printf '%s\n' "${statuses[1]}" > "$out/types.tee.exit"
          test "${#statuses[@]}" -eq 2;test "${statuses[0]}" -eq 0;test "${statuses[1]}" -eq 0
          test -f "$out/types.transport" && test ! -s "$out/types.transport"
      - name: All 33 original report outcomes without any test body or import change
        id: old
        timeout-minutes: 9
        run: |
          set -euo pipefail
          out="$REPORT_RED_OUT"
          set -o noclobber;: > "$out/old.transport";set +o noclobber
          set +e
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$out/old.transport" timeout --signal=TERM --kill-after=15s 8m node_modules/.bin/vitest run src/test/reportDetails.test.tsx src/test/reportDraftLifecycle.test.tsx --maxWorkers=1 --no-file-parallelism --reporter=default --reporter=json --outputFile="$out/old.json" 2>&1 | tee "$out/old.log"
          statuses=("${PIPESTATUS[@]}")
          set -e
          printf '%s\n' "${statuses[0]}" > "$out/old.exit";printf '%s\n' "${statuses[1]}" > "$out/old.tee.exit"
          test "${#statuses[@]}" -eq 2;test "${statuses[0]}" -eq 0;test "${statuses[1]}" -eq 0
          test -f "$out/old.transport" && test ! -s "$out/old.transport"
      - name: Require every original 19 details and 14 lifecycle title to pass
        id: old_classifier
        timeout-minutes: 2
        run: |
          set -euo pipefail
          out="$REPORT_RED_OUT"
          sha256sum -c "$out/inspector.sha256" > "$out/inspector-before-old-classifier.log"
          set -o noclobber;: > "$out/old-classifier.transport";set +o noclobber
          status=0
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$out/old-classifier.transport" node "$out/inspector.cjs" old > "$out/old-classifier.stdout.log" 2> "$out/old-classifier.stderr.log" || status=$?
          printf '%s\n' "$status" > "$out/old-classifier.exit";test "$status" -eq 0
          test -f "$out/old-classifier.transport" && test ! -s "$out/old-classifier.transport"
      - name: One actual primary case must reach its owned immediate Dialog count RED
        id: primary
        timeout-minutes: 9
        run: |
          set -euo pipefail
          out="$REPORT_RED_OUT"
          set -o noclobber;: > "$out/primary.transport";set +o noclobber
          set +e
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$out/primary.transport" timeout --signal=TERM --kill-after=15s 8m node_modules/.bin/vitest run src/test/ReportSiteIssue.pending.test.tsx --maxWorkers=1 --no-file-parallelism --reporter=default --reporter=json --outputFile="$out/primary.json" 2>&1 | tee "$out/primary.log"
          statuses=("${PIPESTATUS[@]}")
          set -e
          printf '%s\n' "${statuses[0]}" > "$out/primary.exit";printf '%s\n' "${statuses[1]}" > "$out/primary.tee.exit"
          test "${#statuses[@]}" -eq 2;test "${statuses[0]}" -eq 1;test "${statuses[1]}" -eq 0
          test -f "$out/primary.transport" && test ! -s "$out/primary.transport"
      - name: Admit only the exact native old-eager AssertionError with actual1 expected0
        id: primary_classifier
        timeout-minutes: 2
        run: |
          set -euo pipefail
          out="$REPORT_RED_OUT"
          sha256sum -c "$out/inspector.sha256" > "$out/inspector-before-primary-classifier.log"
          set -o noclobber;: > "$out/primary-classifier.transport";set +o noclobber
          status=0
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$out/primary-classifier.transport" node "$out/inspector.cjs" red > "$out/primary-classifier.stdout.log" 2> "$out/primary-classifier.stderr.log" || status=$?
          printf '%s\n' "$status" > "$out/primary-classifier.exit";test "$status" -eq 0
          test -f "$out/primary-classifier.transport" && test ! -s "$out/primary-classifier.transport"
      - name: Always retain actual raw results and require all physical end holds
        id: holds
        if: ${{ always() }}
        timeout-minutes: 3
        run: |
          set -uo pipefail
          out="$REPORT_RED_OUT";failed=0
          if test -f "$out/source-before.sha256";then
            sha256sum -c "$out/source-before.sha256" > "$out/final-source-hold.log" 2>&1 || failed=1
            git ls-files -z | sort -z > "$out/source-members.after" || failed=1
            cmp "$out/source-members.before" "$out/source-members.after" > "$out/final-source-members.log" 2>&1 || failed=1
            xargs -0 sha256sum < "$out/source-members.after" > "$out/source-after.sha256" || failed=1
            cmp "$out/source-before.sha256" "$out/source-after.sha256" > "$out/final-source-sha.log" 2>&1 || failed=1
          else failed=1;fi
          if test -f "$out/dependencies.sha256";then
            sha256sum -c "$out/dependencies.sha256" > "$out/final-dependencies-hold.log" 2>&1 || failed=1
            find node_modules -path node_modules/.vite -prune -o -type f -print0 | sort -z > "$out/dependency-members.after" || failed=1
            cmp "$out/dependency-members.before" "$out/dependency-members.after" > "$out/final-dependency-members.log" 2>&1 || failed=1
            xargs -0 sha256sum < "$out/dependency-members.after" > "$out/dependencies-end.sha256" || failed=1
            cmp "$out/dependencies.sha256" "$out/dependencies-end.sha256" > "$out/final-dependency-sha.log" 2>&1 || failed=1
          else failed=1;fi
          if test -f "$out/inspector.sha256";then sha256sum -c "$out/inspector.sha256" > "$out/inspector-source-final.log" 2>&1 || failed=1;else failed=1;fi
          git rev-parse HEAD > "$out/head-after.txt" || failed=1
          cmp "$out/head.txt" "$out/head-after.txt" > "$out/final-head.log" 2>&1 || failed=1
          git diff --exit-code HEAD > "$out/final-source-diff.log" 2>&1 || failed=1
          git status --porcelain --untracked-files=all > "$out/final-status.txt" || failed=1
          test ! -s "$out/final-status.txt" || failed=1
          final_status=1
          if test -f "$out/inspector.cjs";then
            set -o noclobber;: > "$out/final.transport";set +o noclobber
            final_status=0
            NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$out/final.transport" node "$out/inspector.cjs" final > "$out/final-binding.stdout.log" 2> "$out/final-binding.stderr.log" || final_status=$?
          fi
          printf '%s\n' "$final_status" > "$out/final-binding.exit";test "$final_status" -eq 0 || failed=1
          if test -f "$out/inspector.sha256";then sha256sum -c "$out/inspector.sha256" > "$out/inspector-after-final-process.log" 2>&1 || failed=1;else failed=1;fi
          for name in source types old old-classifier primary primary-classifier final;do test -f "$out/$name.transport" && test ! -s "$out/$name.transport" || failed=1;done
          for name in source install install.tee types types.tee old old.tee old-classifier primary.tee primary-classifier;do test -f "$out/$name.exit" && test "$(cat "$out/$name.exit")" = 0 || failed=1;done
          test -f "$out/primary.exit" && test "$(cat "$out/primary.exit")" = 1 || failed=1
          printf '%s\n' "$failed" > "$out/final-holds.exit";test "$failed" -eq 0
      - name: Always preserve scoped stages, manifest and original logs
        if: ${{ always() }}
        env:
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          TYPES_OUTCOME: ${{ steps.types.outcome }}
          OLD_OUTCOME: ${{ steps.old.outcome }}
          PRIMARY_OUTCOME: ${{ steps.primary.outcome }}
          PRIMARY_CLASSIFIER_OUTCOME: ${{ steps.primary_classifier.outcome }}
          HOLDS_OUTCOME: ${{ steps.holds.outcome }}
        run: |
          set -euo pipefail
          out="$REPORT_RED_OUT"
          printf '%s\n' 'phase=old-eager-owned-RED' "source=$GITHUB_SHA" "sourceGate=$SOURCE_OUTCOME" "types=$TYPES_OUTCOME" "original33=$OLD_OUTCOME" "primaryProcess=$PRIMARY_OUTCOME" "ownedPrimaryClassifier=$PRIMARY_CLASSIFIER_OUTCOME" "finalHolds=$HOLDS_OUTCOME" 'applicationFixed=false' 'browserExecuted=false' 'buildExecuted=false' 'fullSuiteExecuted=false' 'existingCapsUnwaived=true' 'published=false' > "$out/stages.txt"
          find "$out" ! -type d ! -type f -print > "$out/evidence-nonregular.txt";test ! -s "$out/evidence-nonregular.txt"
          (cd "$out" && find . -type f ! -name evidence.sha256 -print0 | sort -z | xargs -0 sha256sum > evidence.sha256)
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: report-form-old-eager-red-${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ env.REPORT_RED_OUT }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

