name: Report form lazy load functional proof
on:
  push:
    branches: [codex/report-form-lazy-load-20261024]
    paths-ignore: ['docs/**']
permissions:
  contents: read
concurrency:
  group: report-form-lazy-green-${{ github.sha }}
  cancel-in-progress: false
env:
  BASE_SOURCE: 5e6cbdc0d4c73c8a7c342d1f1c53d58339822da8
  EXPECTED_PARENT: 9a796b82c98d4943043a580f66a8cf1a162ccba5
  CI: '1'
  SIM_NETWORK: offline
  TZ: UTC
jobs:
  report_functional_green:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Fresh outside-checkout raw evidence
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/report-form-lazy-green";test ! -e "$base";mkdir -m 700 "$base"
          out="$base/evidence";mkdir -m 700 "$out"
          export REPORT_GREEN_OUT="$out";echo "REPORT_GREEN_OUT=$out" >> "$GITHUB_ENV"
          printf '%s\n' "$GITHUB_SHA" > "$out/head.txt"
          printf '%s\n' "$GITHUB_RUN_ID" > "$out/run-id.txt"
          printf '%s\n' "$GITHUB_RUN_ATTEMPT" > "$out/run-attempt.txt"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - name: Exact three-path proof repair child with all products and tests held, cumulative fourteen paths
        id: source
        timeout-minutes: 3
        run: |
          set -euo pipefail
          out="$REPORT_GREEN_OUT"
          test "$GITHUB_REPOSITORY" = PapiSalgueroM/ballpark-hero
          test "$GITHUB_REPOSITORY_ID" = 1195729679
          test "$GITHUB_REF" = refs/heads/codex/report-form-lazy-load-20261024
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git show -s --format=%P HEAD)" = "$EXPECTED_PARENT"
          test "$(git rev-parse "$EXPECTED_PARENT^{tree}")" = b37078e90c1f9dedf8a57207258c7b084ac31fda
          test "$(git rev-parse "$BASE_SOURCE^{tree}")" = f0835f57707bdbafb9de5a2b03da142af2eb9d82
          git diff --name-status "$EXPECTED_PARENT" HEAD > "$out/direct-paths.txt"
          printf 'M\t.github/workflows/report-form-lazy-load.yml\nM\tscripts/simReportDraftLifecycle.mjs\nM\tscripts/simReportRelay.mjs\n' | cmp - "$out/direct-paths.txt"
          git diff --exit-code "$EXPECTED_PARENT" HEAD -- . ':!.github/workflows/report-form-lazy-load.yml' ':!scripts/simReportDraftLifecycle.mjs' ':!scripts/simReportRelay.mjs' > "$out/all-parent-source-held.log"
          git diff --name-status "$BASE_SOURCE" HEAD > "$out/cumulative-paths.txt"
          printf 'A\t.github/workflows/report-form-lazy-load.yml\nM\tscripts/qa/playReportDraftLifecycle.mjs\nM\tscripts/simReportContext.mjs\nM\tscripts/simReportDraftLifecycle.mjs\nM\tscripts/simReportRelay.mjs\nM\tsrc/components/game/ReportSiteIssue.tsx\nA\tsrc/components/game/ReportSiteIssueForm.tsx\nA\tsrc/test/ReportSiteIssue.cancel-pending.test.tsx\nA\tsrc/test/ReportSiteIssue.cancel-queued.test.tsx\nA\tsrc/test/ReportSiteIssue.integration.test.tsx\nA\tsrc/test/ReportSiteIssue.load-error.test.tsx\nA\tsrc/test/ReportSiteIssue.pending.test.tsx\nM\tsrc/test/reportDetails.test.tsx\nM\tsrc/test/reportDraftLifecycle.test.tsx\n' | cmp - "$out/cumulative-paths.txt"
          git diff --exit-code "$BASE_SOURCE" HEAD -- . ':!src/components/game/ReportSiteIssueForm.tsx' ':!src/test/ReportSiteIssue.pending.test.tsx' ':!.github/workflows/report-form-lazy-load.yml' ':!scripts/qa/playReportDraftLifecycle.mjs' ':!scripts/simReportContext.mjs' ':!scripts/simReportDraftLifecycle.mjs' ':!scripts/simReportRelay.mjs' ':!src/components/game/ReportSiteIssue.tsx' ':!src/test/ReportSiteIssue.cancel-pending.test.tsx' ':!src/test/ReportSiteIssue.cancel-queued.test.tsx' ':!src/test/ReportSiteIssue.integration.test.tsx' ':!src/test/ReportSiteIssue.load-error.test.tsx' ':!src/test/reportDetails.test.tsx' ':!src/test/reportDraftLifecycle.test.tsx' > "$out/all-old-source-held.log"
          git rev-parse HEAD^{tree} > "$out/tree.txt"
          git ls-files -z | sort -z > "$out/source-members.before"
          test "$(tr -cd '\000' < "$out/source-members.before" | wc -c)" -eq 5340
          xargs -0 sha256sum < "$out/source-members.before" > "$out/source-before.sha256"
          git status --porcelain --untracked-files=all > "$out/status-before.txt";test ! -s "$out/status-before.txt"
          for name in NODE_OPTIONS NO_DOUBLE_SWAP US_BOARD_CONTROL_ALIAS US_BOARD_CONTROL_FILE TYCOON_AWAY_CONTROL COMPLETION_HOOK OWNED_TIMEOUTS_HOOK CONQUEST_NBA_HOOK CONQUEST_NBA_BOARD POLL_FIXTURES DAILY_RECORD_CONTROL TYCOON_ROOMS_PAGE TYCOON_LOADS_STADIUM_HOOK TYCOON_LOADS_ACADEMY_HOOK TYCOON_LOADS_STADIUM_LIB TYCOON_LOADS_ACADEMY_LIB TYCOON_PITCH_COMPONENT TYCOON_PACKS_REWARDS TYCOON_PACKS_PANEL SIM_REPORT_CONTROL REPORT_RELAY_CONTROL REPORT_DRAFT_MODE REPORT_DRAFT_OUT ONLY BROWSER;do
            if printenv "$name" > /dev/null;then printf '%s\n' "Inherited application override refused: $name" >&2;exit 1;fi
          done
