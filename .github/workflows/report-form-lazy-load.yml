      - name: Locked installation and complete dependency inventory
        id: dependencies
        timeout-minutes: 6
        run: |
          set -euo pipefail
          out="$REPORT_GREEN_OUT"
          set +e
          timeout --signal=TERM --kill-after=15s 5m npm ci 2>&1 | tee "$out/install.log"
          statuses=("${PIPESTATUS[@]}")
          set -e
          printf '%s\n' "${statuses[0]}" > "$out/install.exit";printf '%s\n' "${statuses[1]}" > "$out/install.tee.exit"
          test "${#statuses[@]}" -eq 2;test "${statuses[0]}" -eq 0;test "${statuses[1]}" -eq 0
          find node_modules -path node_modules/.vite -prune -o -type f -print0 | sort -z > "$out/dependency-members.before"
          test "$(tr -cd '\000' < "$out/dependency-members.before" | wc -c)" -eq 24466
          xargs -0 sha256sum < "$out/dependency-members.before" > "$out/dependencies.sha256"
      - name: Actual app types with the selected lazy launcher and real form
        id: types
        timeout-minutes: 6
        run: |
          set -euo pipefail
          out="$REPORT_GREEN_OUT"
          set -o noclobber;: > "$out/types.transport";set +o noclobber
          set +e
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$out/types.transport" timeout --signal=TERM --kill-after=15s 5m node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee "$out/types.log"
          statuses=("${PIPESTATUS[@]}")
          set -e
          printf '%s\n' "${statuses[0]}" > "$out/types.exit";printf '%s\n' "${statuses[1]}" > "$out/types.tee.exit"
          test "${#statuses[@]}" -eq 2;test "${statuses[0]}" -eq 0;test "${statuses[1]}" -eq 0
          test -f "$out/types.transport" && test ! -s "$out/types.transport"
      - name: All 33 original report outcomes with only the admitted actual-form import adapters
        id: old
        timeout-minutes: 9
        run: |
          set -euo pipefail
          out="$REPORT_GREEN_OUT"
          set -o noclobber;: > "$out/old.transport";set +o noclobber
          set +e
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$out/old.transport" timeout --signal=TERM --kill-after=15s 8m node_modules/.bin/vitest run src/test/reportDetails.test.tsx src/test/reportDraftLifecycle.test.tsx --maxWorkers=1 --no-file-parallelism --reporter=default --reporter=json --outputFile="$out/old.json" 2>&1 | tee "$out/old.log"
          statuses=("${PIPESTATUS[@]}")
          set -e
          printf '%s\n' "${statuses[0]}" > "$out/old.exit";printf '%s\n' "${statuses[1]}" > "$out/old.tee.exit"
          test "${#statuses[@]}" -eq 2;test "${statuses[0]}" -eq 0;test "${statuses[1]}" -eq 0
          test -f "$out/old.transport" && test ! -s "$out/old.transport"
      - name: Require every original 19 details and 14 lifecycle title to pass
        id: old_classifier
        timeout-minutes: 2
        run: |
          set -euo pipefail
          out="$REPORT_GREEN_OUT"
          sha256sum -c "$out/inspector.sha256" > "$out/inspector-before-old-classifier.log"
          set -o noclobber;: > "$out/old-classifier.transport";set +o noclobber
          status=0
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$out/old-classifier.transport" node "$out/inspector.cjs" old > "$out/old-classifier.stdout.log" 2> "$out/old-classifier.stderr.log" || status=$?
          printf '%s\n' "$status" > "$out/old-classifier.exit";test "$status" -eq 0
          test -f "$out/old-classifier.transport" && test ! -s "$out/old-classifier.transport"
      - name: All seven actual lazy-wrapper cases must pass without pending or unhandled outcomes
        id: primary
        timeout-minutes: 9
        run: |
          set -euo pipefail
          out="$REPORT_GREEN_OUT"
          set -o noclobber;: > "$out/primary.transport";set +o noclobber
          set +e
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$out/primary.transport" timeout --signal=TERM --kill-after=15s 8m node_modules/.bin/vitest run src/test/ReportSiteIssue.pending.test.tsx src/test/ReportSiteIssue.cancel-queued.test.tsx src/test/ReportSiteIssue.cancel-pending.test.tsx src/test/ReportSiteIssue.integration.test.tsx src/test/ReportSiteIssue.load-error.test.tsx --maxWorkers=1 --no-file-parallelism --reporter=default --reporter=json --outputFile="$out/primary.json" 2>&1 | tee "$out/primary.log"
          statuses=("${PIPESTATUS[@]}")
          set -e
          printf '%s\n' "${statuses[0]}" > "$out/primary.exit";printf '%s\n' "${statuses[1]}" > "$out/primary.tee.exit"
          test "${#statuses[@]}" -eq 2;test "${statuses[0]}" -eq 0;test "${statuses[1]}" -eq 0
          test -f "$out/primary.transport" && test ! -s "$out/primary.transport"
      - name: Require every named lazy-wrapper case and the exact normal forty-case rollup
        id: primary_classifier
        timeout-minutes: 2
        run: |
          set -euo pipefail
          out="$REPORT_GREEN_OUT"
          sha256sum -c "$out/inspector.sha256" > "$out/inspector-before-primary-classifier.log"
          set -o noclobber;: > "$out/primary-classifier.transport";set +o noclobber
          status=0
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$out/primary-classifier.transport" node "$out/inspector.cjs" green > "$out/primary-classifier.stdout.log" 2> "$out/primary-classifier.stderr.log" || status=$?
          printf '%s\n' "$status" > "$out/primary-classifier.exit";test "$status" -eq 0
          test -f "$out/primary-classifier.transport" && test ! -s "$out/primary-classifier.transport"
      - name: Five physical copied-source faults, healthy foundations and exact restored cases
        id: source_controls
        if: ${{ !cancelled() && steps.primary_classifier.outcome == 'success' }}
        timeout-minutes: 33
        run: |
          set -euo pipefail
          out="$REPORT_GREEN_OUT"
          sha256sum -c "$out/inspector.sha256" > "$out/inspector-before-source-controls.log"
          set -o noclobber;: > "$out/source-controls.transport";set +o noclobber
          status=0
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$out/source-controls.transport" timeout --signal=TERM --kill-after=15s 32m node "$out/inspector.cjs" controls > "$out/source-controls.stdout.log" 2> "$out/source-controls.stderr.log" || status=$?
          printf '%s\n' "$status" > "$out/source-controls.exit";test "$status" -eq 0
          test -f "$out/source-controls.transport" && test ! -s "$out/source-controls.transport"
      - name: Three actual offline report sims, live Relay schema explicitly unverified
        id: report_sims
        if: ${{ !cancelled() && steps.types.outcome == 'success' }}
        timeout-minutes: 15
        run: |
          set -euo pipefail
          out="$REPORT_GREEN_OUT";failed=0
          for spec in context:simReportContext:2m relay:simReportRelay:3m draft:simReportDraftLifecycle:8m;do
            IFS=: read -r name script bound <<< "$spec"
            set -o noclobber;: > "$out/sim-$name.transport";set +o noclobber
            set +e
            NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$out/sim-$name.transport" REPORT_DRAFT_MODE=fixed REPORT_DRAFT_OUT="$out/sim-draft" timeout --signal=TERM --kill-after=15s "$bound" node "scripts/$script.mjs" 2>&1 | tee "$out/sim-$name.log"
            statuses=("${PIPESTATUS[@]}")
            set -e
            printf '%s\n' "${statuses[0]}" > "$out/sim-$name.exit";printf '%s\n' "${statuses[1]}" > "$out/sim-$name.tee.exit"
