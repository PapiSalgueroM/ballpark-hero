          for name in source types old old-classifier primary primary-classifier source-controls sim-context sim-relay sim-draft sims-classifier sim-record-controls final;do test -f "$out/$name.transport" && test ! -s "$out/$name.transport" || failed=1;done
          for name in source install install.tee types types.tee old old.tee old-classifier primary.tee primary-classifier source-controls sim-context sim-context.tee sim-relay sim-relay.tee sim-draft sim-draft.tee sims-classifier sim-record-controls;do test -f "$out/$name.exit" && test "$(cat "$out/$name.exit")" = 0 || failed=1;done
          test -f "$out/primary.exit" && test "$(cat "$out/primary.exit")" = 0 || failed=1
          for id in omit-initial-opening cancel-does-not-clear-queued-form accept-cancelled-success-token ignore-one-initial-opening-guard hide-refused-explicit-refresh;do
            for arm in healthy fault restored;do
              file="$out/source-controls/$id/$arm/actual.transport"
              test -f "$file" && test ! -s "$file" || failed=1
            done
          done
          for name in normal bare original completion-owner timer-owner restored;do
            file="$out/sim-draft/unit/$name.transport"
            test -f "$file" && test ! -L "$file" && test ! -s "$file" || failed=1
          done
          for name in old new classifier finder finder-classifier route route-classifier;do
            file="$out/menu26/$name.transport";test -f "$file" && test ! -s "$file" || failed=1
          done
          for name in old new classifier finder finder-classifier route route-tee route-classifier;do
            file="$out/menu26/$name.exit";test -f "$file" && test "$(cat "$file")" = 0 || failed=1
          done
          test -f "$out/menu26/route-focus-admission.json" || failed=1
          while IFS= read -r -d '' file;do test ! -s "$file" || failed=1;done < <(find "$out" -type f -name '*.transport' -print0)
          printf '%s\n' "$failed" > "$out/final-holds.exit";test "$failed" -eq 0
      - name: Always preserve scoped stages, manifest and original logs
        if: ${{ always() }}
        env:
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          TYPES_OUTCOME: ${{ steps.types.outcome }}
          OLD_OUTCOME: ${{ steps.old.outcome }}
          PRIMARY_OUTCOME: ${{ steps.primary.outcome }}
          PRIMARY_CLASSIFIER_OUTCOME: ${{ steps.primary_classifier.outcome }}
          CONTROLS_OUTCOME: ${{ steps.source_controls.outcome }}
          SIMS_OUTCOME: ${{ steps.report_sims.outcome }}
          SIMS_CLASSIFIER_OUTCOME: ${{ steps.sims_classifier.outcome }}
          HOLDS_OUTCOME: ${{ steps.holds.outcome }}
        run: |
          set -euo pipefail
          out="$REPORT_GREEN_OUT"
          printf '%s\n' 'phase=lazy-report-functional-green' "source=$GITHUB_SHA" "sourceGate=$SOURCE_OUTCOME" "types=$TYPES_OUTCOME" "original33=$OLD_OUTCOME" "primaryProcess=$PRIMARY_OUTCOME" "wrapperClassifier=$PRIMARY_CLASSIFIER_OUTCOME" "sourceControls=$CONTROLS_OUTCOME" "reportSims=$SIMS_OUTCOME" "reportSimsClassifier=$SIMS_CLASSIFIER_OUTCOME" "finalHolds=$HOLDS_OUTCOME" 'expectedNormalCases=40' 'plannedSelectedSourceControlProcesses=15' 'applicationFixed=false' 'browserExecuted=false' 'buildExecuted=false' 'fullSuiteExecuted=false' 'existingCapsUnwaived=true' 'published=false' > "$out/stages.txt"
          printf 'phase=separate-current-menu-finder26\nsource=%s\noldMenu10=%s\nhost6=%s\nfinder8=%s\nroute2=%s\nrouteClassifier=%s\nsimRecordControls=%s\nexpectedSeparateMenuCases=26\nnormalReportCases=40\naggregateApplicationQualified=false\n' "$GITHUB_SHA" '${{ steps.menu_old.outcome }}' '${{ steps.menu_new.outcome }}' '${{ steps.menu_finder.outcome }}' '${{ steps.menu_route.outcome }}' '${{ steps.menu_route_classifier.outcome }}' '${{ steps.sim_record_controls.outcome }}' > "$out/menu26-stages.txt"
          find "$out" ! -type d ! -type f -print > "$out/evidence-nonregular.txt";test ! -s "$out/evidence-nonregular.txt"
          (cd "$out" && find . -type f ! -name evidence.sha256 -print0 | sort -z | xargs -0 sha256sum > evidence.sha256)
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: report-form-lazy-green-${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ env.REPORT_GREEN_OUT }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

