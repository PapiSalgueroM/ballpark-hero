          set -e
          printf '%s\n' "${statuses[0]}" > "$out/types.exit";printf '%s\n' "${statuses[1]}" > "$out/types.tee.exit"
          test "${#statuses[@]}" -eq 2;test "${statuses[0]}" -eq 0;test "${statuses[1]}" -eq 0
          test -f "$out/types.transport" && test ! -s "$out/types.transport"
      - name: All 33 original report outcomes with only the admitted actual-form import adapters
        id: old
        timeout-minutes: 9
        run: |
          set -euo pipefail
          out="$REPORT_GREEN_OUT"
          set -o noclobber;: > "$out/old.transport";set +o noclobber
          set +e
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$out/old.transport" timeout --signal=TERM --kill-after=15s 8m node_modules/.bin/vitest run src/test/reportDetails.test.tsx src/test/reportDraftLifecycle.test.tsx --maxWorkers=1 --no-file-parallelism --reporter=default --reporter=json --outputFile="$out/old.json" 2>&1 | tee "$out/old.log"
          statuses=("${PIPESTATUS[@]}")
          set -e
          printf '%s\n' "${statuses[0]}" > "$out/old.exit";printf '%s\n' "${statuses[1]}" > "$out/old.tee.exit"
          test "${#statuses[@]}" -eq 2;test "${statuses[0]}" -eq 0;test "${statuses[1]}" -eq 0
          test -f "$out/old.transport" && test ! -s "$out/old.transport"
      - name: Require every original 19 details and 14 lifecycle title to pass
        id: old_classifier
        timeout-minutes: 2
        run: |
          set -euo pipefail
          out="$REPORT_GREEN_OUT"
          sha256sum -c "$out/inspector.sha256" > "$out/inspector-before-old-classifier.log"
          set -o noclobber;: > "$out/old-classifier.transport";set +o noclobber
          status=0
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$out/old-classifier.transport" node "$out/inspector.cjs" old > "$out/old-classifier.stdout.log" 2> "$out/old-classifier.stderr.log" || status=$?
          printf '%s\n' "$status" > "$out/old-classifier.exit";test "$status" -eq 0
          test -f "$out/old-classifier.transport" && test ! -s "$out/old-classifier.transport"
      - name: All seven actual lazy-wrapper cases must pass without pending or unhandled outcomes
        id: primary
        timeout-minutes: 9
        run: |
          set -euo pipefail
          out="$REPORT_GREEN_OUT"
          set -o noclobber;: > "$out/primary.transport";set +o noclobber
          set +e
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$out/primary.transport" timeout --signal=TERM --kill-after=15s 8m node_modules/.bin/vitest run src/test/ReportSiteIssue.pending.test.tsx src/test/ReportSiteIssue.cancel-queued.test.tsx src/test/ReportSiteIssue.cancel-pending.test.tsx src/test/ReportSiteIssue.integration.test.tsx src/test/ReportSiteIssue.load-error.test.tsx --maxWorkers=1 --no-file-parallelism --reporter=default --reporter=json --outputFile="$out/primary.json" 2>&1 | tee "$out/primary.log"
          statuses=("${PIPESTATUS[@]}")
          set -e
          printf '%s\n' "${statuses[0]}" > "$out/primary.exit";printf '%s\n' "${statuses[1]}" > "$out/primary.tee.exit"
          test "${#statuses[@]}" -eq 2;test "${statuses[0]}" -eq 0;test "${statuses[1]}" -eq 0
          test -f "$out/primary.transport" && test ! -s "$out/primary.transport"
      - name: Require every named lazy-wrapper case and the exact normal forty-case rollup
        id: primary_classifier
        timeout-minutes: 2
        run: |
          set -euo pipefail
          out="$REPORT_GREEN_OUT"
          sha256sum -c "$out/inspector.sha256" > "$out/inspector-before-primary-classifier.log"
          set -o noclobber;: > "$out/primary-classifier.transport";set +o noclobber
          status=0
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$out/primary-classifier.transport" node "$out/inspector.cjs" green > "$out/primary-classifier.stdout.log" 2> "$out/primary-classifier.stderr.log" || status=$?
          printf '%s\n' "$status" > "$out/primary-classifier.exit";test "$status" -eq 0
          test -f "$out/primary-classifier.transport" && test ! -s "$out/primary-classifier.transport"
      - name: Five physical copied-source faults, healthy foundations and exact restored cases
        id: source_controls
        if: ${{ !cancelled() && steps.primary_classifier.outcome == 'success' }}
        timeout-minutes: 33
        run: |
          set -euo pipefail
          out="$REPORT_GREEN_OUT"
          sha256sum -c "$out/inspector.sha256" > "$out/inspector-before-source-controls.log"
          set -o noclobber;: > "$out/source-controls.transport";set +o noclobber
          status=0
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$out/source-controls.transport" timeout --signal=TERM --kill-after=15s 32m node "$out/inspector.cjs" controls > "$out/source-controls.stdout.log" 2> "$out/source-controls.stderr.log" || status=$?
          printf '%s\n' "$status" > "$out/source-controls.exit";test "$status" -eq 0
          test -f "$out/source-controls.transport" && test ! -s "$out/source-controls.transport"
      - name: Three actual report source and lifecycle sims with held original oracles
        id: report_sims
        if: ${{ !cancelled() && steps.types.outcome == 'success' }}
        timeout-minutes: 15
        run: |
          set -euo pipefail
          out="$REPORT_GREEN_OUT";failed=0
          for spec in context:simReportContext:2m relay:simReportRelay:3m draft:simReportDraftLifecycle:8m;do
            IFS=: read -r name script bound <<< "$spec"
            set -o noclobber;: > "$out/sim-$name.transport";set +o noclobber
            set +e
            NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$out/sim-$name.transport" REPORT_DRAFT_MODE=fixed REPORT_DRAFT_OUT="$out/sim-draft" timeout --signal=TERM --kill-after=15s "$bound" node "scripts/$script.mjs" 2>&1 | tee "$out/sim-$name.log"
            statuses=("${PIPESTATUS[@]}")
            set -e
            printf '%s\n' "${statuses[0]}" > "$out/sim-$name.exit";printf '%s\n' "${statuses[1]}" > "$out/sim-$name.tee.exit"
            test "${#statuses[@]}" -eq 2 || failed=1
            test "${statuses[0]}" -eq 0 && test "${statuses[1]}" -eq 0 || failed=1
            test -f "$out/sim-$name.transport" && test ! -s "$out/sim-$name.transport" || failed=1
          done
          test "$failed" -eq 0
      - name: Require all original report sim footers and actual lifecycle holds
        id: sims_classifier
        if: ${{ !cancelled() && steps.types.outcome == 'success' }}
        timeout-minutes: 2
        run: |
          set -euo pipefail
          out="$REPORT_GREEN_OUT"
          sha256sum -c "$out/inspector.sha256" > "$out/inspector-before-sims-classifier.log"
          set -o noclobber;: > "$out/sims-classifier.transport";set +o noclobber
          status=0
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$out/sims-classifier.transport" node "$out/inspector.cjs" sims > "$out/sims-classifier.stdout.log" 2> "$out/sims-classifier.stderr.log" || status=$?
          printf '%s\n' "$status" > "$out/sims-classifier.exit";test "$status" -eq 0
          test -f "$out/sims-classifier.transport" && test ! -s "$out/sims-classifier.transport"
      - name: Always retain actual raw results and require all physical end holds
        id: holds
        if: ${{ always() }}
        timeout-minutes: 3
        run: |
          set -uo pipefail
          out="$REPORT_GREEN_OUT";failed=0
          if test -f "$out/source-before.sha256";then
            sha256sum -c "$out/source-before.sha256" > "$out/final-source-hold.log" 2>&1 || failed=1
            git ls-files -z | sort -z > "$out/source-members.after" || failed=1
            cmp "$out/source-members.before" "$out/source-members.after" > "$out/final-source-members.log" 2>&1 || failed=1
            xargs -0 sha256sum < "$out/source-members.after" > "$out/source-after.sha256" || failed=1
            cmp "$out/source-before.sha256" "$out/source-after.sha256" > "$out/final-source-sha.log" 2>&1 || failed=1
          else failed=1;fi
          if test -f "$out/dependencies.sha256";then
            sha256sum -c "$out/dependencies.sha256" > "$out/final-dependencies-hold.log" 2>&1 || failed=1
            find node_modules -path node_modules/.vite -prune -o -type f -print0 | sort -z > "$out/dependency-members.after" || failed=1
            cmp "$out/dependency-members.before" "$out/dependency-members.after" > "$out/final-dependency-members.log" 2>&1 || failed=1
            xargs -0 sha256sum < "$out/dependency-members.after" > "$out/dependencies-end.sha256" || failed=1
            cmp "$out/dependencies.sha256" "$out/dependencies-end.sha256" > "$out/final-dependency-sha.log" 2>&1 || failed=1
          else failed=1;fi
          if test -f "$out/inspector.sha256";then sha256sum -c "$out/inspector.sha256" > "$out/inspector-source-final.log" 2>&1 || failed=1;else failed=1;fi
          git rev-parse HEAD > "$out/head-after.txt" || failed=1
          cmp "$out/head.txt" "$out/head-after.txt" > "$out/final-head.log" 2>&1 || failed=1
          git diff --exit-code HEAD > "$out/final-source-diff.log" 2>&1 || failed=1
          git status --porcelain --untracked-files=all > "$out/final-status.txt" || failed=1
          test ! -s "$out/final-status.txt" || failed=1
          final_status=1
          if test -f "$out/inspector.cjs";then
            set -o noclobber;: > "$out/final.transport";set +o noclobber
            final_status=0
            NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$out/final.transport" node "$out/inspector.cjs" final > "$out/final-binding.stdout.log" 2> "$out/final-binding.stderr.log" || final_status=$?
          fi
          printf '%s\n' "$final_status" > "$out/final-binding.exit";test "$final_status" -eq 0 || failed=1
          if test -f "$out/inspector.sha256";then sha256sum -c "$out/inspector.sha256" > "$out/inspector-after-final-process.log" 2>&1 || failed=1;else failed=1;fi
          for name in source types old old-classifier primary primary-classifier source-controls sim-context sim-relay sim-draft sims-classifier final;do test -f "$out/$name.transport" && test ! -s "$out/$name.transport" || failed=1;done
          for name in source install install.tee types types.tee old old.tee old-classifier primary.tee primary-classifier source-controls sim-context sim-context.tee sim-relay sim-relay.tee sim-draft sim-draft.tee sims-classifier;do test -f "$out/$name.exit" && test "$(cat "$out/$name.exit")" = 0 || failed=1;done
          test -f "$out/primary.exit" && test "$(cat "$out/primary.exit")" = 0 || failed=1
          for id in omit-initial-opening cancel-does-not-clear-queued-form accept-cancelled-success-token ignore-one-initial-opening-guard hide-refused-explicit-refresh;do
            for arm in healthy fault restored;do
              file="$out/source-controls/$id/$arm/actual.transport"
              test -f "$file" && test ! -s "$file" || failed=1
            done
          done
          while IFS= read -r -d '' file;do test ! -s "$file" || failed=1;done < <(find "$out" -type f -name '*.transport' -print0)
          printf '%s\n' "$failed" > "$out/final-holds.exit";test "$failed" -eq 0
      - name: Always preserve scoped stages, manifest and original logs
        if: ${{ always() }}
        env:
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          TYPES_OUTCOME: ${{ steps.types.outcome }}
          OLD_OUTCOME: ${{ steps.old.outcome }}
          PRIMARY_OUTCOME: ${{ steps.primary.outcome }}
          PRIMARY_CLASSIFIER_OUTCOME: ${{ steps.primary_classifier.outcome }}
          CONTROLS_OUTCOME: ${{ steps.source_controls.outcome }}
          SIMS_OUTCOME: ${{ steps.report_sims.outcome }}
          SIMS_CLASSIFIER_OUTCOME: ${{ steps.sims_classifier.outcome }}
          HOLDS_OUTCOME: ${{ steps.holds.outcome }}
        run: |
          set -euo pipefail
          out="$REPORT_GREEN_OUT"
          printf '%s\n' 'phase=lazy-report-functional-green' "source=$GITHUB_SHA" "sourceGate=$SOURCE_OUTCOME" "types=$TYPES_OUTCOME" "original33=$OLD_OUTCOME" "primaryProcess=$PRIMARY_OUTCOME" "wrapperClassifier=$PRIMARY_CLASSIFIER_OUTCOME" "sourceControls=$CONTROLS_OUTCOME" "reportSims=$SIMS_OUTCOME" "reportSimsClassifier=$SIMS_CLASSIFIER_OUTCOME" "finalHolds=$HOLDS_OUTCOME" 'expectedNormalCases=40' 'plannedSelectedSourceControlProcesses=15' 'applicationFixed=false' 'browserExecuted=false' 'buildExecuted=false' 'fullSuiteExecuted=false' 'existingCapsUnwaived=true' 'published=false' > "$out/stages.txt"
          find "$out" ! -type d ! -type f -print > "$out/evidence-nonregular.txt";test ! -s "$out/evidence-nonregular.txt"
          (cd "$out" && find . -type f ! -name evidence.sha256 -print0 | sort -z | xargs -0 sha256sum > evidence.sha256)
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: report-form-lazy-green-${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ env.REPORT_GREEN_OUT }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

