name: Report form old eager owned RED
on:
  push:
    branches: [codex/report-form-lazy-load-20261024]
    paths-ignore: ['docs/**']
permissions:
  contents: read
concurrency:
  group: report-form-old-eager-red-${{ github.sha }}
  cancel-in-progress: false
env:
  BASE_SOURCE: 5e6cbdc0d4c73c8a7c342d1f1c53d58339822da8
  EXPECTED_PARENT: 5e6cbdc0d4c73c8a7c342d1f1c53d58339822da8
  CI: '1'
  SIM_NETWORK: offline
  TZ: UTC
jobs:
  old_eager_red:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - name: Fresh outside-checkout raw evidence
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/report-form-old-eager-red";test ! -e "$base";mkdir -m 700 "$base"
          out="$base/evidence";mkdir -m 700 "$out"
          export REPORT_RED_OUT="$out";echo "REPORT_RED_OUT=$out" >> "$GITHUB_ENV"
          printf '%s\n' "$GITHUB_SHA" > "$out/head.txt"
          printf '%s\n' "$GITHUB_RUN_ID" > "$out/run-id.txt"
          printf '%s\n' "$GITHUB_RUN_ATTEMPT" > "$out/run-attempt.txt"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - name: Exact three additions on immutable 5e with all old application and tests held
        id: source
        timeout-minutes: 3
        run: |
          set -euo pipefail
          out="$REPORT_RED_OUT"
          test "$GITHUB_REPOSITORY" = PapiSalgueroM/ballpark-hero
          test "$GITHUB_REPOSITORY_ID" = 1195729679
          test "$GITHUB_REF" = refs/heads/codex/report-form-lazy-load-20261024
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git show -s --format=%P HEAD)" = "$EXPECTED_PARENT"
          test "$EXPECTED_PARENT" = "$BASE_SOURCE"
          test "$(git rev-parse "$BASE_SOURCE^{tree}")" = f0835f57707bdbafb9de5a2b03da142af2eb9d82
          git diff --name-status "$EXPECTED_PARENT" HEAD > "$out/direct-and-cumulative-paths.txt"
          printf 'A\t.github/workflows/report-form-lazy-load.yml\nA\tsrc/components/game/ReportSiteIssueForm.tsx\nA\tsrc/test/ReportSiteIssue.pending.test.tsx\n' | cmp - "$out/direct-and-cumulative-paths.txt"
          git diff --exit-code "$BASE_SOURCE" HEAD -- . ':!.github/workflows/report-form-lazy-load.yml' ':!src/components/game/ReportSiteIssueForm.tsx' ':!src/test/ReportSiteIssue.pending.test.tsx' > "$out/all-old-source-held.log"
          git rev-parse HEAD^{tree} > "$out/tree.txt"
          git ls-files -z | sort -z > "$out/source-members.before"
          test "$(tr -cd '\000' < "$out/source-members.before" | wc -c)" -eq 5336
          xargs -0 sha256sum < "$out/source-members.before" > "$out/source-before.sha256"
          git status --porcelain --untracked-files=all > "$out/status-before.txt";test ! -s "$out/status-before.txt"
          for name in NODE_OPTIONS NO_DOUBLE_SWAP US_BOARD_CONTROL_ALIAS US_BOARD_CONTROL_FILE TYCOON_AWAY_CONTROL COMPLETION_HOOK OWNED_TIMEOUTS_HOOK CONQUEST_NBA_HOOK CONQUEST_NBA_BOARD POLL_FIXTURES DAILY_RECORD_CONTROL TYCOON_ROOMS_PAGE TYCOON_LOADS_STADIUM_HOOK TYCOON_LOADS_ACADEMY_HOOK TYCOON_LOADS_STADIUM_LIB TYCOON_LOADS_ACADEMY_LIB TYCOON_PITCH_COMPONENT TYCOON_PACKS_REWARDS TYCOON_PACKS_PANEL;do
            if printenv "$name" > /dev/null;then printf '%s\n' "Inherited application override refused: $name" >&2;exit 1;fi
          done
