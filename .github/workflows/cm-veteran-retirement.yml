name: Club Manager veteran retirement functional pilot
on:
  push:
    branches: [codex/cm-veteran-retirement-20261023]
    paths-ignore: ['docs/**']
permissions:
  contents: read
concurrency:
  group: cm-veteran-retirement-${{ github.sha }}
  cancel-in-progress: false
env:
  BASE_SOURCE: 3ac9d8ea8a13db824f88be2deb660e7f2e31fc35
  EXPECTED_PARENT: 290a52e4b1957d8bc127efbf9f7930788e7188b8
  CI: '1'
  SIM_NETWORK: offline
