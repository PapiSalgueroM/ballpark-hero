          for(const id of ids){assert.equal(fonts.filter(x=>x.contextId===id&&x.resourceType==='stylesheet').length,1);assert(fonts.some(x=>x.contextId===id&&x.resourceType==='font'));}
          for(const row of fonts){assert(ids.includes(row.contextId));assert(manifest.has(row.url));assert.equal(row.sha256,manifest.get(row.url).sha256);assert.equal(row.manifestSha256,process.env.FONT_CACHE_MANIFEST_SHA256);}
          for(const row of flags){const u=new URL(row.url);assert(ids.includes(row.contextId));assert.equal(row.method,'GET');assert.equal(row.resourceType,'image');assert.equal(row.action,'LOCAL_ABORT');assert.equal(u.origin,'https://flagcdn.com');assert(!u.username&&!u.password&&!u.search&&!u.hash);assert.match(u.pathname,/^\/(?:w[1-9][0-9]{0,2}\/|h[1-9][0-9]{0,2}\/|[1-9][0-9]{0,2}x[1-9][0-9]{0,2}\/)?[a-z]{2}(?:-[a-z0-9]{1,8})?\.(?:png|webp|svg)$/);}
          fs.writeFileSync(out+'/caps-font-summary.json',JSON.stringify({complete:true,source:process.env.GITHUB_SHA,capRows:15,contexts:15,fontRows:fonts.length,localFlagDenials:flags.length,capSourceUnchanged:true},null,2)+'\n',{flag:'wx'});
          NODE
          test ! -s "$out/caps-server.transport";test ! -s "$out/caps.transport"
      - name: Always retain raw pilot evidence and all physical holds
        if: always()
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/cm-veteran-styled-release";mkdir -p "$out";failed=0
          for manifest in source-before dependencies;do
            if test -f "$out/$manifest.sha256";then sha256sum --check "$out/$manifest.sha256" > "$out/final-$manifest-hold.log" 2>&1 || failed=1;else failed=1;fi
          done
          browser_attempt='${{ steps.browser_python.outcome }}'
          if test "$browser_attempt" != skipped;then
            case "$browser_attempt" in success|failure|cancelled) ;; *) failed=1;;esac
            for manifest in browser-tools font-cache;do
              if test -f "$out/$manifest.sha256";then sha256sum --check "$out/$manifest.sha256" > "$out/final-$manifest-hold.log" 2>&1 || failed=1;else failed=1;fi
            done
          else printf '%s\n' 'NOT_ATTEMPTED' > "$out/browser-provisioning-holds.txt";fi
          git ls-files -z | sort -z > "$out/source-members.after"
          if test -f "$out/source-members.before";then cmp "$out/source-members.before" "$out/source-members.after" || failed=1;else failed=1;fi
          git diff --exit-code HEAD > "$out/final-source-diff.log" || failed=1
          git status --porcelain --untracked-files=all > "$out/final-status.txt";test ! -s "$out/final-status.txt" || failed=1
          if test -f "$out/dependency-members.before";then find node_modules -path node_modules/.vite -prune -o -type f -print0 | sort -z > "$out/dependency-members.after";cmp "$out/dependency-members.before" "$out/dependency-members.after" || failed=1;else failed=1;fi
          if test "$browser_attempt" != skipped;then
            if test -f "$out/browser-members.before";then find "$RUNNER_TEMP/cm-veteran-browser-tools/node_modules" -type f -print0 | sort -z > "$out/browser-members.after";cmp "$out/browser-members.before" "$out/browser-members.after" || failed=1;else failed=1;fi
            if test -f "$out/font-members.before";then find "$out/font-cache" -type f -print0 | sort -z > "$out/font-members.after";cmp "$out/font-members.before" "$out/font-members.after" || failed=1;else failed=1;fi
          fi
          if test -f "$out/weights-preload-binding.json";then node -e 'const f=require("node:fs"),a=require("node:assert/strict"),h=require("node:crypto").createHash("sha256").update(f.readFileSync(process.env.CM_VETERAN_STYLE_OUT+"/weights-cached-fonts.cjs")).digest("hex");a.equal(h,JSON.parse(f.readFileSync(process.env.CM_VETERAN_STYLE_OUT+"/weights-preload-binding.json")).copySha256)' > "$out/final-weights-preload-hold.log" 2>&1 || failed=1;fi
          if test -f "$out/dist.sha256";then
            find dist ! -type d ! -type f -print > "$out/dist-nonregular.after";test ! -s "$out/dist-nonregular.after" || failed=1
            sha256sum --check "$out/dist.sha256" > "$out/final-dist-hold.log" 2>&1 || failed=1
            find dist -type f -print0 | sort -z > "$out/dist-members.after";cmp "$out/dist-members.before" "$out/dist-members.after" || failed=1
          fi
          if test -f "$out/fixture-dist.sha256";then
            find "$out/cm-veteran/fixture-dist" ! -type d ! -type f -print > "$out/fixture-nonregular.after";test ! -s "$out/fixture-nonregular.after" || failed=1
            sha256sum --check "$out/fixture-dist.sha256" > "$out/final-fixture-hold.log" 2>&1 || failed=1
            find "$out/cm-veteran/fixture-dist" -type f -print0 | sort -z > "$out/fixture-members.after";cmp "$out/fixture-members.before" "$out/fixture-members.after" || failed=1
          fi
          if test -f "$out/browser-binding.json";then node -e 'const f=require("node:fs"),a=require("node:assert/strict"),h=b=>require("node:crypto").createHash("sha256").update(b).digest("hex"),p=process.env.CM_VETERAN_STYLE_OUT,r=JSON.parse(f.readFileSync(p+"/source-binding.json"));a.equal(h(f.readFileSync(p+"/browser-binding.json")),r.bindingSha256)' > "$out/final-binding-hold.log" 2>&1 || failed=1;fi
          for required in types.transport build.transport fixture-build.transport veteran-browser.transport cm-veteran/browser/server.transport readers-server.transport homefold.transport caps-server.transport caps.transport simAdsense.transport simBrand.transport simHeadTags.transport simHiddenPages.transport simHubs.transport simIndexNow.transport simIndexing.transport simInternalLinks.transport simNoRivalNames.transport simPrerender.transport simPrerenderBoot.transport simRetiredRoutes.transport simSchema.transport simSitemap.transport simSnapshotAssets.transport simSiteSearch.transport simGuideHeadings.transport simLegalPages.transport;do
            test -f "$out/$required" && test ! -s "$out/$required" || failed=1
          done
          while IFS= read -r -d '' file;do test ! -s "$file" || failed=1;done < <(find "$out" -type f -name '*.transport' -print0)
          printf 'phase=styled-cm-veteran\napplicationQualified=false\nsource=%s\nappDependencies=%s\ntypes=%s\nbrowserPython=%s\nbrowserProvision=%s\nbuild=%s\nfixture=%s\nbrowser=%s\nreaders=%s\ncaps=%s\nfinalHoldsExit=%s\n' "$GITHUB_SHA" '${{ steps.app_dependencies.outcome }}' '${{ steps.types.outcome }}' '${{ steps.browser_python.outcome }}' '${{ steps.browser_provision.outcome }}' '${{ steps.build.outcome }}' '${{ steps.fixture.outcome }}' '${{ steps.browser.outcome }}' '${{ steps.readers.outcome }}' '${{ steps.caps.outcome }}' "$failed" > "$out/stages.txt"
          (cd "$out";find . -type f ! -path ./evidence.sha256 -print0 | sort -z | xargs -0 sha256sum) > "$out/evidence.sha256"
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cm-veteran-styled-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cm-veteran-styled-release/
          if-no-files-found: error
          retention-days: 14
