name: Soccer loan appearance guard
on:
  push:
    branches: [codex/soccer-master-integration-20261105]
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      SIM_NETWORK: offline
      SIM_OFFLINE_RECEIPT: loan-guard-artifacts/offline.log
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - name: Locked install and held sources
        run: |
          mkdir -p loan-guard-artifacts
          git rev-parse HEAD > loan-guard-artifacts/head.txt
          git ls-files -s > loan-guard-artifacts/source-before.txt
          sha256sum package.json package-lock.json > loan-guard-artifacts/locks-before.txt
          npm ci
      - name: Positive complete loan harness
        run: |
          ONLY=simLoanSpell node scripts/runAllSims.mjs --browser 2>&1 | tee loan-guard-artifacts/positive.log
      - name: Effective injured-total negative control
        run: |
          LOAN_CONTROL=injury-total NODE_OPTIONS="--max-old-space-size=6144 --require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/simLoanSpell.mjs 2>&1 | tee loan-guard-artifacts/injury-control.log
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const log=fs.readFileSync('loan-guard-artifacts/injury-control.log','utf8');
          assert(log.includes('NEGATIVE CONTROL ON (injury-total)'));
          const match=log.match(/simLoanSpell control \(injury-total\): green\. LOAN_APPEARANCE_TOTAL caught all (\d+) injured fringe draws\./);
          assert(match&&Number(match[1])>0,'actual injured outcomes changed and every one was caught');
          NODE
      - name: Existing shut control still catches the closed market
        run: |
          LOAN_CONTROL=shut NODE_OPTIONS="--max-old-space-size=6144 --require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/simLoanSpell.mjs 2>&1 | tee loan-guard-artifacts/shut-control.log
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const log=fs.readFileSync('loan-guard-artifacts/shut-control.log','utf8');
          assert(log.includes('NEGATIVE CONTROL ON (shut)'));
          assert(log.includes('simLoanSpell control (shut): green. Shutting the loan market was caught'));
          NODE
      - name: Changed script source fences
        run: |
          ONLY=simHarnessAnchors,simNoRivalNames node scripts/runAllSims.mjs --browser 2>&1 | tee loan-guard-artifacts/source-fences.log
      - name: Source lock and offline holds
        if: always()
        run: |
          git ls-files -s > loan-guard-artifacts/source-after.txt
          cmp loan-guard-artifacts/source-before.txt loan-guard-artifacts/source-after.txt
          git diff --exit-code HEAD -- src scripts package.json package-lock.json
          sha256sum package.json package-lock.json > loan-guard-artifacts/locks-after.txt
          cmp loan-guard-artifacts/locks-before.txt loan-guard-artifacts/locks-after.txt
          if test -f loan-guard-artifacts/offline.log; then test ! -s loan-guard-artifacts/offline.log; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soccer-loan-appearance-guard-${{ github.run_id }}
          path: loan-guard-artifacts
          retention-days: 7
          if-no-files-found: error
