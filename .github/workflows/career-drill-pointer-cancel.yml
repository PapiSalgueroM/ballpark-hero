            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" -eq 1
          failed=0
          printf 'harness\texit\tlines\tverdict\n' > career-drill-pointer-cancel-artifacts/readers.tsv
          for harness in simAdsense simBrand simHeadTags simHiddenPages simHubs simIndexNow simIndexing simInternalLinks simNoRivalNames simPrerender simPrerenderBoot simRetiredRoutes simSchema simSitemap simSnapshotAssets; do
            capture "$harness" env SIM_NETWORK=offline ENGINES=chromium NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$PWD/career-drill-pointer-cancel-artifacts/$harness.transport.log" BASE=http://127.0.0.1:4173 SWEEP_BASE=http://127.0.0.1:4173 node "scripts/$harness.mjs" || failed=1
            status="$(cat "career-drill-pointer-cancel-artifacts/$harness.exit")"
            lines="$(cat "career-drill-pointer-cancel-artifacts/$harness.stdout" "career-drill-pointer-cancel-artifacts/$harness.stderr" | awk 'NF && $0 !~ /^\[SIM_OFFLINE_BLOCK\]/ {n++} END {print n+0}')"
            verdict=PASS
            if test "$status" -ne 0; then verdict=FAIL; failed=1; fi
            if test "$status" -eq 0 && test "$lines" -lt 4; then verdict=EMPTY; failed=1; fi
            if grep -E '(^|[[:space:]])(FAIL|SKIP|EMPTY)([[:space:]]|$)|^\[SIM_OFFLINE_BLOCK\]' "career-drill-pointer-cancel-artifacts/$harness.stdout" "career-drill-pointer-cancel-artifacts/$harness.stderr" > /dev/null; then verdict=FAIL; failed=1; fi
            if test -s "career-drill-pointer-cancel-artifacts/$harness.transport.log"; then verdict=FAIL; failed=1; fi
            printf '%s\t%s\t%s\t%s\n' "$harness" "$status" "$lines" "$verdict" >> career-drill-pointer-cancel-artifacts/readers.tsv
            printf '%s: %s (exit %s, %s complete output lines)\n' "$harness" "$verdict" "$status" "$lines"
          done
          test "$(tail -n +2 career-drill-pointer-cancel-artifacts/readers.tsv | wc -l)" -eq 15
          exit "$failed"
      - name: Whole source and package holds
        if: always()
        run: |
          set -euo pipefail
          source career-drill-pointer-cancel-artifacts/capture.sh
          git diff --binary HEAD > career-drill-pointer-cancel-artifacts/generated.patch
          cp package.json career-drill-pointer-cancel-artifacts/package.after.json
          cp package-lock.json career-drill-pointer-cancel-artifacts/package-lock.after.json
          failed=0
          capture source-hold sha256sum -c career-drill-pointer-cancel-artifacts/source-hold.sha256 || failed=1
          capture consumer-final-hold sha256sum -c career-drill-pointer-cancel-artifacts/proof-consumer.sha256 || failed=1
          capture source-whole-hold git diff --exit-code HEAD -- . ':!public/**' ':!scripts/data/lastmod.json' || failed=1
          capture source-extra git ls-files --others --exclude-standard -- src scripts .github/workflows docs || failed=1
          test ! -s career-drill-pointer-cancel-artifacts/source-extra.stdout || failed=1
          capture locked-final node scripts/qa/soccerAgentReviewDependencies.mjs after || failed=1
          if test -f soccer-agent-review-artifacts/dependencies-after.json; then cp soccer-agent-review-artifacts/dependencies-after.json career-drill-pointer-cancel-artifacts/dependencies-final.json; fi
          capture package-hold cmp package.json career-drill-pointer-cancel-artifacts/package.before.json || failed=1
          capture lock-hold cmp package-lock.json career-drill-pointer-cancel-artifacts/package-lock.before.json || failed=1
          exit "$failed"
      - name: Preserve complete generated bodies and self-inclusive cap
        if: always()
        run: |
          set -euo pipefail
          mkdir -p career-drill-pointer-cancel-artifacts
          paths=()
          for item in public dist scripts/data/lastmod.json; do
            if test -e "$item"; then paths+=("$item"); fi
          done
          tar -czf career-drill-pointer-cancel-artifacts/generated.tar.gz "${paths[@]}"
          node --input-type=module <<'FOOTER'
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          const out='career-drill-pointer-cancel-artifacts';
          const files=dir=>fs.readdirSync(dir,{withFileTypes:true}).flatMap(row=>row.isDirectory()?files(path.join(dir,row.name)):[path.join(dir,row.name)]);
          const count=()=>files(out).reduce((sum,file)=>sum+fs.statSync(file).size,0);
          const target=path.join(out,'size.json');
          fs.writeFileSync(target,JSON.stringify({bytes:0,cap:500000000}));
          let bytes=count();
          for(let i=0;i<3;i++){fs.writeFileSync(target,JSON.stringify({bytes,cap:500000000}));bytes=count();}
          if(bytes>=500000000){
            fs.writeFileSync(path.join(out,'cap-failure.json'),JSON.stringify({bytes,cap:500000000,retainedAllEvidence:true}));
            for(let i=0;i<3;i++){bytes=count();fs.writeFileSync(target,JSON.stringify({bytes,cap:500000000}));}
            bytes=count();
          }
          assert.equal(JSON.parse(fs.readFileSync(target)).bytes,count(),'Exact whole self-inclusive footer byte join');
          assert(bytes<500000000,'Whole self-inclusive evidence remains below500M; retain all failures without pruning');
          FOOTER
      - name: Upload complete evidence even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: career-drill-pointer-cancel-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: error
          path: career-drill-pointer-cancel-artifacts/
