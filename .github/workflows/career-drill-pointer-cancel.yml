          source career-drill-pointer-cancel-artifacts/capture.sh
          capture proof env SOCCER_DRILL_CANCEL_OUT=career-drill-pointer-cancel-artifacts/proof SIM_OFFLINE_RECEIPT="$PWD/career-drill-pointer-cancel-artifacts/proof.transport.log" node scripts/qa/soccerDrillPointerCancelProof.mjs
          test ! -s career-drill-pointer-cancel-artifacts/proof.transport.log
      - name: Independently reopen complete cases, Source fault and whole undo
