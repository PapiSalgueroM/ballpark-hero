            if test -s "career-drill-pointer-cancel-artifacts/$harness.transport.log"; then verdict=FAIL; failed=1; fi
            printf '%s\t%s\t%s\t%s\n' "$harness" "$status" "$lines" "$verdict" >> career-drill-pointer-cancel-artifacts/related.tsv
