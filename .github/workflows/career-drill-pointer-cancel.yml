          assert(process.env.CI);assert.equal(process.env.SOCCER_DRILL_CANCEL_OUT,'career-drill-pointer-cancel-artifacts/proof');
          const ROOT=process.cwd(),OUT=path.resolve(ROOT,process.env.SOCCER_DRILL_CANCEL_OUT);assert(!fs.existsSync(path.join(OUT,'consumer-result.json')));
          const result={status:'running',checks:[],references:[],errors:[]};
          const hash=b=>createHash('sha256').update(b).digest('hex'),same=(a,b)=>assert.deepEqual(a,b);
          const check=(id,fn)=>{const row={id,status:'running'};result.checks.push(row);try{fn();row.status='pass';}catch(error){row.status='fail';row.error=String(error.stack||error);throw error;}};
          const keys=(v,w)=>same(Object.keys(v).sort(),[...w].sort());
          const safe=name=>{assert.equal(typeof name,'string');assert(name&&!path.isAbsolute(name)&&!name.includes('\\')&&name.split('/').every(x=>x&&x!=='.'&&x!=='..'));const full=path.resolve(OUT,name);assert(full.startsWith(OUT+path.sep));return full;};
          const body=ref=>{assert(ref&&Number.isSafeInteger(ref.bytes)&&ref.bytes>=0&&/^[a-f0-9]{64}$/.test(ref.sha256));const raw=fs.readFileSync(safe(ref.path)),row={path:ref.path,expectedBytes:ref.bytes,expectedSHA:ref.sha256,bytes:raw.length,sha256:hash(raw),status:'running'};result.references.push(row);assert.equal(raw.length,ref.bytes);assert.equal(row.sha256,ref.sha256);row.status='pass';return raw;};
          const json=ref=>JSON.parse(body(ref)),walk=x=>{if(!x||typeof x!=='object')return;if(typeof x.path==='string'&&Number.isSafeInteger(x.bytes)&&typeof x.sha256==='string')body(x);for(const v of Object.values(x))walk(v);};
          const files=dir=>fs.readdirSync(dir,{withFileTypes:true}).flatMap(x=>x.isDirectory()?files(path.join(dir,x.name)):x.isFile()?[path.join(dir,x.name)]:(()=>{throw Error('Only regular proof files');})());
          const APP='src/components/soccer-career/DrillBoard.tsx',UNIT='src/test/drillBoardMatch.test.tsx',MARKUP='src/test/drillBoardMarkup.test.tsx';
