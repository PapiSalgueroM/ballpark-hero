          const PINS=[[APP,42504,'42591173de244f05f7e21166035ee6b7fe2d04ac78a8dc54c69bbd817038a99e'],[UNIT,12037,'3641efe7c96f24e6500745940ce8957f2e9f686fe3bc2c739d189f4af7727c42'],['scripts/qa/soccerDrillPointerCancelProof.mjs',11998,'c61ac628e640d4ccb0373c54cf7dd55db21da4b66a80f204e75dea4d97f81840'],['docs/CAREER-DRILL-POINTER-CANCEL.md',2000,'57df6eeec63e74ee6b5382c97ac8377fc4573fc30cc514c3d2d78d7ec205b921']];
