name: Career drill pointer cancellation verification
on:
  push:
    branches: [codex/career-drill-pointer-cancel]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      SIM_NETWORK: offline
      ENGINES: chromium
      VITEST_MAX_FORKS: 1
      VITEST_MIN_FORKS: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retain source and capture commands
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = codex/career-drill-pointer-cancel
          mkdir career-drill-pointer-cancel-artifacts
          git cat-file -e 4a5f759aeab6d0e7b8d29e55d3cd624c8ad20c54^{commit}
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse '4a5f759aeab6d0e7b8d29e55d3cd624c8ad20c54^{tree}')" = 8f8078136ba98fc07c944553aeaa53c307a68554
          git -c core.autocrlf=false archive --format=zip HEAD > career-drill-pointer-cancel-artifacts/source.zip
          git -c core.autocrlf=false archive --format=zip 4a5f759aeab6d0e7b8d29e55d3cd624c8ad20c54 > career-drill-pointer-cancel-artifacts/base.zip
          git ls-tree -r HEAD > career-drill-pointer-cancel-artifacts/source-inventory.txt
          git ls-tree -r 4a5f759aeab6d0e7b8d29e55d3cd624c8ad20c54 > career-drill-pointer-cancel-artifacts/base-inventory.txt
          sha256sum career-drill-pointer-cancel-artifacts/source.zip career-drill-pointer-cancel-artifacts/base.zip > career-drill-pointer-cancel-artifacts/source-archives.sha256
          node --input-type=module <<'SCOPE'
          import fs from 'node:fs';import assert from 'node:assert/strict';import {execFileSync} from 'node:child_process';
          const base='4a5f759aeab6d0e7b8d29e55d3cd624c8ad20c54',allowed=['src/components/soccer-career/DrillBoard.tsx','src/test/drillBoardMatch.test.tsx','scripts/qa/soccerDrillPointerCancelProof.mjs','.github/workflows/career-drill-pointer-cancel.yml','docs/CAREER-DRILL-POINTER-CANCEL.md'];
          const changed=execFileSync('git',['diff','--name-only','-z',base,'HEAD']).toString().split('\0').filter(Boolean);
          fs.writeFileSync('career-drill-pointer-cancel-artifacts/source-scope.json',JSON.stringify({base,allowed,changed},null,2));assert.deepEqual([...changed].sort(),[...allowed].sort());
          SCOPE
          node --input-type=module <<'PINS'
          import fs from 'node:fs';import assert from 'node:assert/strict';import {createHash} from 'node:crypto';
          const pins=[["src/components/soccer-career/DrillBoard.tsx",42504,"42591173de244f05f7e21166035ee6b7fe2d04ac78a8dc54c69bbd817038a99e"],["src/test/drillBoardMatch.test.tsx",12037,"3641efe7c96f24e6500745940ce8957f2e9f686fe3bc2c739d189f4af7727c42"],["scripts/qa/soccerDrillPointerCancelProof.mjs",11998,"c61ac628e640d4ccb0373c54cf7dd55db21da4b66a80f204e75dea4d97f81840"],["docs/CAREER-DRILL-POINTER-CANCEL.md",2000,"57df6eeec63e74ee6b5382c97ac8377fc4573fc30cc514c3d2d78d7ec205b921"]];
          fs.writeFileSync('career-drill-pointer-cancel-artifacts/expected-source-pins.json',JSON.stringify(pins,null,2));for(const [file,bytes,sha256] of pins){const body=fs.readFileSync(file);assert.equal(body.length,bytes);assert.equal(createHash('sha256').update(body).digest('hex'),sha256);}
          PINS
          git rev-parse HEAD HEAD^{tree} > career-drill-pointer-cancel-artifacts/head-tree.txt
          cp package.json career-drill-pointer-cancel-artifacts/package.before.json
          cp package-lock.json career-drill-pointer-cancel-artifacts/package-lock.before.json
          sha256sum src/components/soccer-career/DrillBoard.tsx src/test/drillBoardMatch.test.tsx scripts/qa/soccerDrillPointerCancelProof.mjs .github/workflows/career-drill-pointer-cancel.yml docs/CAREER-DRILL-POINTER-CANCEL.md src/lib/careerDrills.ts src/lib/dailyRecord.ts src/hooks/useArcadeFlight.ts src/test/drillBoardMarkup.test.tsx src/test/fixtures/drillBoardMarkup.recorded.json scripts/simCareerDrills.mjs scripts/simCareerTraining.mjs scripts/simFreeKick.mjs scripts/simFreeKickPractice.mjs scripts/qa/soccerAgentReviewDependencies.mjs scripts/lib/offlineTransport.cjs scripts/lib/hostLikeServer.mjs > career-drill-pointer-cancel-artifacts/source-hold.sha256
          cat > career-drill-pointer-cancel-artifacts/capture.sh <<'CAPTURE'
          capture() {
            local label="$1"; shift
            printf '%s\0' "$@" > "career-drill-pointer-cancel-artifacts/$label.argv"
            set +e
            "$@" > "career-drill-pointer-cancel-artifacts/$label.stdout" 2> "career-drill-pointer-cancel-artifacts/$label.stderr"
            local code=$?
            set -e
            echo "$code" > "career-drill-pointer-cancel-artifacts/$label.exit"
            cat "career-drill-pointer-cancel-artifacts/$label.stdout"
            cat "career-drill-pointer-cancel-artifacts/$label.stderr" >&2
            return "$code"
          }
          CAPTURE
      - name: Install remote verification dependencies
        id: dependencies
        run: |
          set -euo pipefail
          source career-drill-pointer-cancel-artifacts/capture.sh
          capture npm-ci npm ci
          capture locked-before node scripts/qa/soccerAgentReviewDependencies.mjs before
          cp soccer-agent-review-artifacts/dependencies-before.json career-drill-pointer-cancel-artifacts/dependencies-before.json
          browser_tools="$RUNNER_TEMP/drill-pointer-cancel-seo-browser-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$browser_tools"
          printf '{"private":true,"dependencies":{"playwright":"1.64.0"}}\n' > "$browser_tools/package.json"
          capture playwright-package npm install --prefix "$browser_tools" --ignore-scripts --no-audit --no-fund
          test ! -e node_modules/playwright
          test ! -e node_modules/playwright-core
          ln -s "$browser_tools/node_modules/playwright" node_modules/playwright
          ln -s "$browser_tools/node_modules/playwright-core" node_modules/playwright-core
          cp "$browser_tools/package.json" career-drill-pointer-cancel-artifacts/browser-package.json
          cp "$browser_tools/package-lock.json" career-drill-pointer-cancel-artifacts/browser-package-lock.json
          capture chromium node "$browser_tools/node_modules/playwright/cli.js" install --with-deps chromium
          capture locked-after-setup node scripts/qa/soccerAgentReviewDependencies.mjs after
          cp soccer-agent-review-artifacts/dependencies-after.json career-drill-pointer-cancel-artifacts/dependencies-after-setup.json
          node --input-type=module <<'PLAYWRIGHT'
          import fs from 'node:fs';import assert from 'node:assert/strict';for(const name of ['playwright','playwright-core'])assert.equal(JSON.parse(fs.readFileSync('node_modules/'+name+'/package.json')).version,'1.64.0');
          PLAYWRIGHT
          capture fonts python -m pip install fonttools pillow
          cmp package.json career-drill-pointer-cancel-artifacts/package.before.json
          cmp package-lock.json career-drill-pointer-cancel-artifacts/package-lock.before.json
      - name: Actual application type gate
        id: types
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          set -euo pipefail
          source career-drill-pointer-cancel-artifacts/capture.sh
          capture types node_modules/.bin/tsc --noEmit -p tsconfig.app.json
      - name: Retain independently reviewed consumer Source
        id: consumer_source
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.types.outcome == 'success' }}
        run: |
          set -euo pipefail
          test ! -e career-drill-pointer-cancel-artifacts/proof-consumer.mjs
          cat > career-drill-pointer-cancel-artifacts/proof-consumer.mjs <<'DRILLCONSUMER'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
