           check('exact-original-binding-and-full-same-copy-undo',()=>{const c=report.sourceControl;assert.equal(c.id,'original-pointer-cancel-binding');assert.equal(c.status,'pass');same(c.errors,[]);same([c.changed,c.actualSameCopyReversed,report.temporaryRemoved],[true,true,true]);same([c.from,c.to],['        onPointerCancel={onCancel}','        onPointerCancel={onUp}']);const before=body(c.before),fault=body(c.fault),undo=body(c.undo);assert(before.equals(body(report.sourceBefore.find(x=>x.file===APP))));assert.equal(before.toString('utf8').split(c.from).length-1,1);assert.equal(fault.toString('utf8'),before.toString('utf8').replace(c.from,c.to));assert(!fault.equals(before));assert.equal(fault.toString('utf8').split(c.to).length-1,1);assert.equal(fault.toString('utf8').replace(c.to,c.from),before.toString('utf8'));assert(undo.equals(before));assert.equal(report.temporarySource.path,c.copyPath);assert(body(report.temporarySource.body).equals(before));assert(!fs.existsSync(c.copyPath));assert(path.basename(c.copyPath).match(/^__drill_pointer_cancel_[0-9]+\.tsx$/));assert.equal(path.dirname(c.copyPath),path.join(ROOT,'src/components/soccer-career'));});
           check('all-eighteen-unit-plus-five-markup-assertions',()=>{same(report.arms.map(x=>x.id),IDS);same(report.processes.map(x=>x.id),IDS);result.assertions=[];for(let i=0;i<IDS.length;i++){const arm=report.arms[i],processRow=report.processes[i],isMarkup=i===3,titles=isMarkup?MARKUP_TITLES:TITLES,failed=i===1?NEW:[],test=isMarkup?MARKUP:UNIT,output=path.join(OUT,'arms',arm.id,'vitest.json');assert.equal(arm.status,'pass');same(arm.errors,[]);same(arm.process,processRow);same([arm.test,arm.titles,arm.expectedFailures],[test,titles,failed]);same([processRow.command,processRow.cwd,processRow.status,processRow.exit,processRow.signal,processRow.error],[process.execPath,ROOT,'closed',failed.length?1:0,null,null]);same(processRow.args,['--require',path.join(ROOT,'scripts/lib/offlineTransport.cjs'),path.join(ROOT,'node_modules/vitest/vitest.mjs'),'run',test,'--no-cache','--maxWorkers=1','--no-file-parallelism','--reporter=default','--reporter=json',`--outputFile=${output}`]);const env=isMarkup?{NO_DOUBLE_SWAP:'',RECORD_DRILL_MARKUP:''}:{NO_DOUBLE_SWAP:i===0?'':JSON.stringify({'@/components/soccer-career/DrillBoard':report.sourceControl.copyPath})};same(processRow.env,env);const streams=body(processRow.stdout).toString('utf8')+'\n'+body(processRow.stderr).toString('utf8');assert(body(processRow.stdout).length>0);assert(!/^\[SIM_OFFLINE_BLOCK\]/m.test(streams));assert(body(arm.vitest).equals(fs.readFileSync(output)));const value=json(arm.vitest);assert.equal(value.testResults.length,1);const file=value.testResults[0];same([file.name,file.message,file.status],[path.join(ROOT,test),'',failed.length?'failed':'passed']);const rows=file.assertionResults;same(rows.map(x=>x.title).sort(),[...titles].sort());same([value.numTotalTests,value.numPassedTests,value.numFailedTests,value.numPendingTests,value.numTodoTests,value.numPendingTestSuites],[titles.length,titles.length-failed.length,failed.length,0,0,0]);same(rows.filter(x=>x.status==='failed').map(x=>x.title).sort(),[...failed].sort());for(const row of rows){assert.equal(row.status,failed.includes(row.title)?'failed':'passed');if(failed.includes(row.title)){const marker=row.title===NEW[0]?'DRILL_POINTER_CANCEL_wallshot':'DRILL_POINTER_CANCEL_gloves';assert(row.failureMessages.length&&row.failureMessages.every(x=>x.includes(marker)));}else same(row.failureMessages,[]);}same(json(arm.assertions),rows);result.assertions.push({arm:arm.id,rows});}assert.equal(result.assertions.flatMap(x=>x.rows).length,23);});
           check('four-effective-complete-runtime-diagnostic-copies',()=>{same(report.diagnostics.map(x=>x.id),IDS);for(const row of report.diagnostics){assert.equal(row.status,'pass');same(row.errors,[]);same([row.changed,row.actualSameFaultReversed],[true,true]);const child=report.processes.find(x=>x.id===row.id);same([row.stdout,row.stderr],[child.stdout,child.stderr]);const actual=stripVTControlCharacters(body(child.stdout).toString('utf8')+'\n'+body(child.stderr).toString('utf8')),a=body(row.before).toString('utf8'),f=body(row.fault).toString('utf8'),u=body(row.undo).toString('utf8'),banner='\nUnhandled Errors\n',detect=s=>/\b(?:Unhandled Errors|Unhandled Error|Unhandled Rejection|Failed Suites|Source Errors)\b/.test(s);assert.equal(a,actual);assert.equal(f,a+banner);assert.equal(f.slice(0,-banner.length),u);assert.equal(u,a);same([row.beforeFindings,row.faultFindings,row.undoFindings],[[],['vitest-runtime-diagnostic'],[]]);same([detect(a),detect(f),detect(u)],[false,true,false]);}});
