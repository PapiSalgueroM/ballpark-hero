              row.geometry=await measure(page,['[data-career-chance-wheel] h2','[data-wheel-result]','[data-wheel-continue]']);assert.deepEqual(geometryFailures(row.geometry),[]);
              const file=id+'-settled-visible.png';await page.screenshot({path:path.join(out,file)});row.shot={file,sha256:sha(fs.readFileSync(path.join(out,file)))};
              row.resultText=await result.textContent();row.expected=fixture.resultLabel;row.bodyAfter=await bodyState(page);assert.deepEqual(row.bodyAfter,row.bodyBefore,'only inner body scroll, no page/body change');
              row.after=await page.evaluate(key=>localStorage.getItem(key),fixture.key);row.draws=await page.evaluate(()=>({values:window.__readValues,stacks:window.__readStacks}));assert.deepEqual(factFailures(row),[]);assert.equal(row.draws.values.length,row.draws.stacks.length);assert.equal(await dialog.locator('[data-wheel-continue]').textContent(),'Continue');
