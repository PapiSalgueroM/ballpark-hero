name: Veteran talks output and settled-image diagnostics
on:
  push:
    branches: [codex/career-veteran-talks]
    paths: [.github/workflows/career-veteran-talks-diagnostics.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: career-veteran-talks-diagnostics-${{ github.sha }}
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      SIM_NETWORK: offline
      ENGINES: chromium
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Pin all four complete sources and locked packages
        id: prep
        run: |
          mkdir -p veteran-talks-diagnostic-artifacts/sources diagnostic-sources
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          git diff --exit-code 5d7bc586c71f177a710721c98ca9d6bd13313d40 HEAD -- src scripts package.json package-lock.json
          git rev-parse HEAD > veteran-talks-diagnostic-artifacts/driver-head.txt
          git rev-parse 'HEAD^{tree}' > veteran-talks-diagnostic-artifacts/driver-tree.txt
          git archive --format=zip --output=veteran-talks-diagnostic-artifacts/driver-source.zip HEAD
          git ls-tree -r HEAD > veteran-talks-diagnostic-artifacts/driver-inventory.txt
          while read -r label ref tree; do
            test "$(git rev-parse "$ref^{tree}")" = "$tree"
            test "$(git rev-parse "$ref:scripts/simSoccerContractMoves.mjs")" = 094fd0eb16aa9d0c58fa4fd63157ac385084a205
            test "$(git rev-parse "$ref:scripts/runAllSims.mjs")" = 9c58b4fe9f708610e09cd72db4a9bf7e88838690
            test "$(git rev-parse "$ref:scripts/lib/careerAwardsNightProbe.mjs")" = 547ec7f40ff1780d22a2c5927da781066abe0ac9
            git diff --exit-code 5d7bc586c71f177a710721c98ca9d6bd13313d40 "$ref" -- package.json package-lock.json scripts/simSoccerContractMoves.mjs scripts/runAllSims.mjs scripts/lib/seedRandom.mjs scripts/lib/careerAwardsNightProbe.mjs scripts/lib/offlineTransport.cjs
            git archive --format=zip --output="veteran-talks-diagnostic-artifacts/sources/$label.zip" "$ref"
            git ls-tree -r "$ref" > "veteran-talks-diagnostic-artifacts/sources/$label-inventory.txt"
            printf '%s %s\n' "$ref" "$tree" > "veteran-talks-diagnostic-artifacts/sources/$label-ref.txt"
            mkdir -p "diagnostic-sources/$label"
            unzip -q "veteran-talks-diagnostic-artifacts/sources/$label.zip" -d "diagnostic-sources/$label"
            (cd "diagnostic-sources/$label" && find src scripts -type f -print0 | sort -z | xargs -0 sha256sum) > "veteran-talks-diagnostic-artifacts/sources/$label-before.txt"
          done <<'REFS'
          f3 f3c32fcb7937b80f5be3ac67152c781dd4cc4a8c 89e22cb9828cea7ecd734f9662e13424b4fed9b3
          5d 5d7bc586c71f177a710721c98ca9d6bd13313d40 1a5368e0229b754ce7f494119946eb63524b9e02
          f780 f78037dcddea12c1a02586c7d5c0e185efb86121 1c9e7dcb11992442060cb162c288d0bcf37db0c2
          6b 6b1bc27abf56f093c418bdb66296de4fe49144c9 868729dd50d9322d6c388899b5d001290eb1b8e4
          REFS
          sha256sum package.json package-lock.json > veteran-talks-diagnostic-artifacts/packages-before.txt
          npm ci
          cat > diagnostic-dependencies.mjs <<'JS'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const lock=JSON.parse(fs.readFileSync('package-lock.json','utf8')),installed=[],omitted=[];
          const fits=(rules,value)=>!rules||(!rules.some(x=>x==='!'+value)&&(rules.every(x=>x.startsWith('!'))||rules.includes(value)));
          for(const [directory,expected]of Object.entries(lock.packages)){
            if(!directory.startsWith('node_modules/')||!expected.version)continue;
            const file=directory+'/package.json';
            if(!fs.existsSync(file)){assert.equal(expected.optional,true,directory+' required dependency missing');assert((expected.os&&!fits(expected.os,process.platform))||(expected.cpu&&!fits(expected.cpu,process.arch)),directory+' optional omission needs a platform reason');omitted.push({directory,version:expected.version,optional:expected.optional,os:expected.os??null,cpu:expected.cpu??null});continue;}
            const actual=JSON.parse(fs.readFileSync(file,'utf8'));assert.equal(actual.version,expected.version,directory);assert.equal(typeof actual.name,'string');installed.push({directory,name:actual.name,version:actual.version});
          }
          assert.equal(installed.length,521);assert.equal(omitted.length,78);assert.equal(installed.length+omitted.length,599);
          fs.writeFileSync(process.argv[2],JSON.stringify({platform:process.platform,arch:process.arch,installed,omitted},null,2));
          console.log('PASS full locked census:521 installed and78 platform-qualified omissions');
          JS
          node diagnostic-dependencies.mjs veteran-talks-diagnostic-artifacts/dependencies-before.json
          npm install --no-save playwright@1.64.0
          node --input-type=module -e "import fs from 'node:fs';import assert from 'node:assert/strict';assert.equal(JSON.parse(fs.readFileSync('node_modules/playwright/package.json')).version,'1.64.0');"
          npx playwright install --with-deps chromium
          for label in f3 5d f780 6b; do ln -s "$PWD/node_modules" "diagnostic-sources/$label/node_modules"; done
          sha256sum package.json package-lock.json > veteran-talks-diagnostic-artifacts/packages-after-setup.txt
          cmp veteran-talks-diagnostic-artifacts/packages-before.txt veteran-talks-diagnostic-artifacts/packages-after-setup.txt
      - name: Actual held candidate app types
        id: types
        if: ${{ !cancelled() && steps.prep.outcome == 'success' }}
        run: NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee veteran-talks-diagnostic-artifacts/types.log
      - name: Immutable actual5d artifact inputs
        id: inputs
        if: ${{ !cancelled() && steps.prep.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/PapiSalgueroM/ballpark-hero/actions/artifacts/11688936531 -o veteran-talks-diagnostic-artifacts/input-artifact-metadata.json
          node --input-type=module - <<'JS'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const v=JSON.parse(fs.readFileSync('veteran-talks-diagnostic-artifacts/input-artifact-metadata.json','utf8'));
          assert.equal(v.id,11688936531);assert.equal(v.name,'career-veteran-talks-early-38100689967-1');assert.equal(v.workflow_run.id,38100689967);assert.equal(v.workflow_run.head_sha,'5d7bc586c71f177a710721c98ca9d6bd13313d40');assert.equal(v.size_in_bytes,62465695);assert.equal(v.digest,'sha256:ce7f41649c99008477ff47cffeaa36409ca7dca20bc03ff04f3ada422b1e9ce4');assert.equal(v.expired,false);
          JS
          curl --fail --silent --show-error -L -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/PapiSalgueroM/ballpark-hero/actions/artifacts/11688936531/zip -o veteran-talks-diagnostic-artifacts/input-artifact.zip
          printf '%s\n' 'ce7f41649c99008477ff47cffeaa36409ca7dca20bc03ff04f3ada422b1e9ce4  veteran-talks-diagnostic-artifacts/input-artifact.zip' | sha256sum --check
          python3 - <<'PY'
          import hashlib,json,pathlib,shutil,stat,zipfile
          destination=pathlib.Path('diagnostic-input').resolve();destination.mkdir()
          files=[];seen=set()
          with zipfile.ZipFile('veteran-talks-diagnostic-artifacts/input-artifact.zip') as archive:
            for member in archive.infolist():
              name=member.filename
              assert '\\' not in name and not name.startswith('/') and ':' not in name
              parts=pathlib.PurePosixPath(name).parts
              assert parts and '..' not in parts and '.' not in parts
              key=name.casefold();assert key not in seen;seen.add(key)
              assert not stat.S_ISLNK(member.external_attr >> 16)
              target=destination.joinpath(*parts);assert target==destination or destination in target.parents
              if member.is_dir():target.mkdir(parents=True,exist_ok=True);continue
              target.parent.mkdir(parents=True,exist_ok=True)
              with archive.open(member) as source,target.open('xb') as output:shutil.copyfileobj(source,output)
              body=target.read_bytes();assert len(body)==member.file_size
              files.append({'file':name,'bytes':len(body),'sha256':hashlib.sha256(body).hexdigest()})
          pathlib.Path('veteran-talks-diagnostic-artifacts/input-member-inventory.json').write_text(json.dumps(files,indent=2))
          assert hashlib.sha256(pathlib.Path('diagnostic-input/source.zip').read_bytes()).hexdigest()=='c12ba8dd4147353c784599fbe88249941ffb56b9d82a05dbba421fdf31c2d2dd'
          assert pathlib.Path('diagnostic-input/source.zip').read_bytes()==pathlib.Path('veteran-talks-diagnostic-artifacts/sources/5d.zip').read_bytes()
          assert hashlib.sha256(pathlib.Path('diagnostic-input/proof/browser-fixtures.json').read_bytes()).hexdigest()=='c7d5d6b4c76efac0740f7c0a49a2ebbf07da2f1795ab685aab0800542e3a961d'
          assert hashlib.sha256(pathlib.Path('diagnostic-input/font-cache/manifest.json').read_bytes()).hexdigest()=='3171c3241bbb489c22f51489f8b2cd94c880f071dfe9760a5c9aabdf48363d82'
          PY
      - name: Four unchanged ContractMoves executions and unaccepted runner classification
        if: ${{ !cancelled() && steps.prep.outcome == 'success' && steps.types.outcome == 'success' }}
        run: |
          set +e
          failed=0
          for label in f3 5d f780 6b; do
            (cd "diagnostic-sources/$label" && SIM_OFFLINE_RECEIPT="$PWD/../../veteran-talks-diagnostic-artifacts/$label-direct-traffic.log" NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/simSoccerContractMoves.mjs) 2>&1 | tee "veteran-talks-diagnostic-artifacts/$label-direct.log"
            direct_status=${PIPESTATUS[0]}
            printf '%s\n' "$direct_status" > "veteran-talks-diagnostic-artifacts/$label-direct-status.txt"
            (cd "diagnostic-sources/$label" && ONLY=simSoccerContractMoves node scripts/runAllSims.mjs --browser) 2>&1 | tee "veteran-talks-diagnostic-artifacts/$label-runner.log"
            runner_status=${PIPESTATUS[0]}
            printf '%s\n' "$runner_status" > "veteran-talks-diagnostic-artifacts/$label-runner-status.txt"
            if [ "$direct_status" -ne 0 ] || [ "$runner_status" -ne 0 ]; then failed=1; fi
          done
          exit "$failed"
      - name: Held production Vite build for supplemental pixels, no SEO credit
        id: build
        if: ${{ !cancelled() && steps.prep.outcome == 'success' && steps.types.outcome == 'success' && steps.inputs.outcome == 'success' }}
        run: |
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" npm run build 2>&1 | tee veteran-talks-diagnostic-artifacts/vite-build.log
          mkdir -p veteran-talks-diagnostic-artifacts/compiled
          cp dist/index.html veteran-talks-diagnostic-artifacts/compiled/index.html
          cp -a dist/assets veteran-talks-diagnostic-artifacts/compiled/assets
          find dist/assets -type f -print0 | sort -z | xargs -0 sha256sum > veteran-talks-diagnostic-artifacts/compiled-assets-sha256.txt
      - name: Five actual committed results naturally scrolled into view
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node --input-type=module - <<'JS' 2>&1 | tee veteran-talks-diagnostic-artifacts/settled-browser.log
          import assert from 'node:assert/strict';import fs from 'node:fs';import path from 'node:path';import {createHash} from 'node:crypto';import {createServer} from 'node:http';import pw from './scripts/lib/playwrightLoader.mjs';
          const out=path.resolve('veteran-talks-diagnostic-artifacts/settled320');fs.mkdirSync(out,{recursive:true});
          const sha=v=>createHash('sha256').update(v).digest('hex'),json=v=>JSON.stringify(v),copy=v=>JSON.parse(json(v));
          const fixtureFile='diagnostic-input/proof/browser-fixtures.json',fixtures=JSON.parse(fs.readFileSync(fixtureFile,'utf8'));assert.equal(fixtures.length,5);
          const fontDir='diagnostic-input/font-cache',manifest=JSON.parse(fs.readFileSync(path.join(fontDir,'manifest.json'),'utf8')),fonts=new Map(manifest.map(v=>{const body=fs.readFileSync(path.join(fontDir,v.file));assert.equal(sha(body),v.sha256);return[v.url,{body,contentType:v.contentType}];}));
          fs.cpSync(fontDir,path.join(out,'font-cache'),{recursive:true});fs.copyFileSync(fixtureFile,path.join(out,'browser-fixtures.json'));
          const assetRoot=path.resolve('dist'),server=createServer((request,response)=>{
            const pathname=new URL(request.url,'http://localhost').pathname;
            const file=pathname==='/'||pathname==='/soccer-career'?path.join(assetRoot,'index.html'):path.resolve(assetRoot,'.'+decodeURIComponent(pathname));
            if(!file.startsWith(assetRoot+path.sep)||!fs.existsSync(file)||!fs.statSync(file).isFile()){response.writeHead(404);response.end('Not found');return;}
            const ext=path.extname(file),types={'.html':'text/html','.js':'application/javascript','.css':'text/css','.json':'application/json','.svg':'image/svg+xml','.woff2':'font/woff2','.png':'image/png'};
            response.writeHead(200,{'Content-Type':types[ext]||'application/octet-stream'});fs.createReadStream(file).pipe(response);
          });
          await new Promise(resolve=>server.listen(0,'127.0.0.1',resolve));const base='http://127.0.0.1:'+server.address().port;
          const report={scope:'Supplemental production Vite pixels from actual5d committed saves. Actual Show result and inner scroll only; no acknowledgment, new roll, SEO/full-suite/release credit.',fixtureSha256:sha(fs.readFileSync(fixtureFile)),cases:[],controls:[]};
          const write=(name,value)=>{const file=name+'.json';fs.writeFileSync(path.join(out,file),JSON.stringify(value,null,2));return{file,sha256:sha(fs.readFileSync(path.join(out,file)))};};
          function geometryFailures(v){return [...(Math.abs(v.inner.width-320)>1||Math.abs(v.inner.height-568)>1||Math.abs(v.client.width-320)>1||Math.abs(v.client.height-568)>1||!v.visual||Math.abs(v.visual.width-320)>1||Math.abs(v.visual.height-568)>1||Math.abs(v.visual.scale-1)>.01?['viewport']:[]),...(v.sideways?['overflow']:[]),...(v.targets.some(t=>!t.inside||t.clipped||!t.painted)?['painted']:[]),...(v.targets.some(t=>t.button&&(t.rect.width<43.5||t.rect.height<43.5))?['touch']:[]),...(v.frames<4||v.finite||v.fonts!=='loaded'||v.faces.some(f=>f.status==='error')?['readiness']:[])];}
          function factFailures(v){return [...(v.after!==v.before?['raw-save']:[]),...(v.draws.values.length?['read-draw']:[]),...(v.resultText!==v.expected?['result-text']:[]),...(json(v.bodyAfter)!==json(v.bodyBefore)?['body-page']:[])];}
          async function measure(page,selectors){
            await page.evaluate(()=>document.fonts.ready);
            return page.evaluate(async selectors=>{
              const rect=r=>({x:r.x,y:r.y,left:r.left,right:r.right,top:r.top,bottom:r.bottom,width:r.width,height:r.height});
              const sample=()=>{
                const targets=selectors.map(selector=>{const e=document.querySelector(selector);if(!e)throw Error('Missing measured target '+selector);const r=e.getBoundingClientRect(),style=getComputedStyle(e),ix=Math.min(10,r.width/4),iy=Math.min(10,r.height/4),points=[[r.x+r.width/2,r.y+r.height/2],[r.left+ix,r.y+r.height/2],[r.right-ix,r.y+r.height/2],[r.x+r.width/2,r.top+iy],[r.x+r.width/2,r.bottom-iy]].map(([x,y])=>{const hit=document.elementFromPoint(x,y);return{x,y,tag:hit?.tagName,text:hit?.textContent,inside:!!hit&&(hit===e||e.contains(hit))};});
                  const clip={left:0,right:320,top:0,bottom:568};for(let p=e.parentElement;p;p=p.parentElement){const s=getComputedStyle(p),b=p.getBoundingClientRect();if(/auto|scroll|hidden|clip/.test(s.overflowX)){clip.left=Math.max(clip.left,b.left);clip.right=Math.min(clip.right,b.right);}if(/auto|scroll|hidden|clip/.test(s.overflowY)){clip.top=Math.max(clip.top,b.top);clip.bottom=Math.min(clip.bottom,b.bottom);}}
                  return{selector,text:e.textContent,button:e.matches('button'),rect:rect(r),points,clip,inside:r.left>=0&&r.right<=320&&r.top>=0&&r.bottom<=568,clipped:r.left<clip.left-.5||r.right>clip.right+.5||r.top<clip.top-.5||r.bottom>clip.bottom+.5,painted:Number(style.opacity)===1&&points.every(p=>p.inside)};});
                return{inner:{width:innerWidth,height:innerHeight},client:{width:document.documentElement.clientWidth,height:document.documentElement.clientHeight},visual:visualViewport?{width:visualViewport.width,height:visualViewport.height,scale:visualViewport.scale}:null,sideways:document.documentElement.scrollWidth>320,targets,finite:document.getAnimations().filter(a=>a.playState==='running'&&Number.isFinite(a.effect?.getComputedTiming().endTime)).length,fonts:document.fonts.status,faces:[...document.fonts].map(f=>({family:f.family,status:f.status}))};
              };
              const start=performance.now();let last='',frames=0,value;do{await new Promise(requestAnimationFrame);value=sample();const signature=JSON.stringify(value);frames=signature===last?frames+1:1;last=signature;if(frames>=4&&!value.finite&&value.fonts==='loaded')return{...value,frames};}while(performance.now()-start<10000);return{...value,frames};
            },selectors);
          }
          async function bodyState(page){return page.evaluate(()=>({pageY:scrollY,style:Array.from(document.body.style).map(k=>[k,document.body.style.getPropertyValue(k),document.body.style.getPropertyPriority(k)]),locked:document.body.getAttribute('data-scroll-locked'),overflow:getComputedStyle(document.body).overflow,pointerEvents:getComputedStyle(document.body).pointerEvents,position:getComputedStyle(document.body).position,marginRight:getComputedStyle(document.body).marginRight}));}
          const browser=await pw.chromium.launch({headless:true});
          try{for(const fixture of fixtures){
            const id='320-'+fixture.id,row={id,errors:[],assets:[],blocked:[]};report.cases.push(row);
            const rawFile='diagnostic-input/browser/'+id+'-raw-committed.json',saved=JSON.parse(fs.readFileSync(rawFile,'utf8'));assert.equal(sha(saved.value),saved.sha256);assert.equal(saved.value,json(fixture.expected));assert.equal(fixture.expected.chanceWheel.seen,false);
            fs.copyFileSync(rawFile,path.join(out,id+'-actual-committed-input.json'));row.input={file:id+'-actual-committed-input.json',sha256:sha(fs.readFileSync(rawFile))};
            const context=await browser.newContext({viewport:{width:320,height:568},hasTouch:true,isMobile:true}),page=await context.newPage();
            page.on('pageerror',e=>row.errors.push(String(e)));page.on('requestfailed',r=>{if(r.url().startsWith(base+'/assets/'))row.assets.push({url:r.url(),error:r.failure()?.errorText});});page.on('response',r=>{if(r.url().startsWith(base+'/assets/')&&r.status()>=400)row.assets.push({url:r.url(),status:r.status()});});
            await context.route('**/*',route=>{const r=route.request(),url=r.url();if(url.startsWith(base+'/')||url.startsWith('data:'))return route.continue();if(fonts.has(url))return route.fulfill(fonts.get(url));row.blocked.push({url,method:r.method()});if(r.method()!=='GET')return route.fulfill({status:200,contentType:'application/json',body:'{}'});if(url.includes('/rest/v1/'))return route.fulfill({status:200,contentType:'application/json',body:'[]'});return route.abort();});
            await context.addInitScript(()=>{const OriginalDate=Date;window.Date=class extends OriginalDate{constructor(...args){super(...(args.length?args:[1800000000000]));}static now(){return 1800000000000;}};const original=Math.random;window.__readValues=[];window.__readStacks=[];Math.random=()=>{const value=original();window.__readValues.push(value);window.__readStacks.push(new Error('unfiltered startup/read draw').stack);return value;};});
            try{
              await page.goto(base+'/',{waitUntil:'networkidle'});const consent=page.getByRole('region',{name:'Cookie choices',exact:true});await consent.waitFor();await consent.getByRole('button',{name:'Essential only',exact:true}).click();await consent.waitFor({state:'hidden'});assert.equal(await page.evaluate(()=>localStorage.getItem('cookie-consent')),'essential');
              row.consentStartup=write(id+'-consent-startup',await page.evaluate(()=>({values:window.__readValues,stacks:window.__readStacks})));
              await page.evaluate(({key,value,currency})=>{localStorage.setItem(key,value);localStorage.setItem('dukb-soccer-currency',currency);},{key:fixture.key,value:saved.value,currency:fixture.currency});
              await page.goto(base+'/soccer-career',{waitUntil:'networkidle'});const dialog=page.locator('[data-career-chance-wheel]');await dialog.waitFor();assert.equal(await dialog.count(),1);await page.waitForFunction(()=>document.querySelector('[data-career-chance-wheel] h2')===document.activeElement);
              row.startup=write(id+'-career-startup',await page.evaluate(()=>({values:window.__readValues,stacks:window.__readStacks})));
