      - name: All source and package bodies held, complete bounded artifact
        if: ${{ !cancelled() && steps.prep.outcome == 'success' }}
        run: |
          for label in f3 5d f780 6b; do
            (cd "diagnostic-sources/$label" && find src scripts -type f -print0 | sort -z | xargs -0 sha256sum) > "veteran-talks-diagnostic-artifacts/sources/$label-after.txt"
            cmp "veteran-talks-diagnostic-artifacts/sources/$label-before.txt" "veteran-talks-diagnostic-artifacts/sources/$label-after.txt"
          done
          git diff --exit-code HEAD -- src scripts .github/workflows package.json package-lock.json > veteran-talks-diagnostic-artifacts/source-held.log
          sha256sum package.json package-lock.json > veteran-talks-diagnostic-artifacts/packages-final.txt
          cmp veteran-talks-diagnostic-artifacts/packages-before.txt veteran-talks-diagnostic-artifacts/packages-final.txt
          node diagnostic-dependencies.mjs veteran-talks-diagnostic-artifacts/dependencies-final.json
          cmp veteran-talks-diagnostic-artifacts/dependencies-before.json veteran-talks-diagnostic-artifacts/dependencies-final.json
          printf '%s\n' 'Diagnostic only. Existing ContractMoves EMPTY and any actual failure remain unaccepted. No SEO/full-suite/release credit. Supplemental5 images use actual immutable committed saves and only Show result plus inner scrolling.' > veteran-talks-diagnostic-artifacts/scope.txt
          du -sb veteran-talks-diagnostic-artifacts > veteran-talks-diagnostic-artifacts/artifact-size.log
          test "$(du -sb veteran-talks-diagnostic-artifacts | cut -f1)" -lt 500000000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: career-veteran-talks-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: veteran-talks-diagnostic-artifacts/
          retention-days: 5
          if-no-files-found: error
