name: Budget Builder first signing diagnostic
on:
  push:
    branches: [codex/budget-score-breakdown-qa-20261105]
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arm: [original, fixed]
    defaults:
      run:
        shell: bash
    env:
      SIM_NETWORK: offline
      SIM_OFFLINE_RECEIPT: budget-first-sign-${{ matrix.arm }}/offline.log
      BB_DIAGNOSTIC_OUT: budget-first-sign-${{ matrix.arm }}
      BB_SIGN_DIAGNOSTIC_ARM: ${{ matrix.arm }}
      BB_SIGN_DIAGNOSTIC_OUT: budget-first-sign-${{ matrix.arm }}/browser
      BB_DIAGNOSTIC_SOURCE: 3509eb0956ce07b4baa48cbb27028ba593b8fa6d
      BB_DIAGNOSTIC_ORIGINAL: 011039ded2a01ba95c47a1c824241d5d4383fb49
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Pin common source install and exact physical arm
        run: |
          set -euo pipefail
          mkdir -p "$BB_DIAGNOSTIC_OUT"
          touch "$SIM_OFFLINE_RECEIPT"
          git rev-parse HEAD > "$BB_DIAGNOSTIC_OUT/head.txt"
          git rev-parse 'HEAD^{tree}' > "$BB_DIAGNOSTIC_OUT/tree.txt"
          git ls-files -s > "$BB_DIAGNOSTIC_OUT/source-before.txt"
          sha256sum package.json package-lock.json > "$BB_DIAGNOSTIC_OUT/locks-before.txt"
          git diff --exit-code HEAD -- .
          git fetch --no-tags --depth=1 origin "$BB_DIAGNOSTIC_SOURCE"
          git fetch --no-tags --depth=1 origin "$BB_DIAGNOSTIC_ORIGINAL"
          test "$(git rev-parse HEAD:src/hooks/useBudgetBuilder.ts)" = 0220c215cb2530a632abc477810ec38b095982c7
          test "$(git rev-parse HEAD:src/components/budget-builder/BudgetBuilderBoard.tsx)" = f9111c2782f61ec9b976aee52baed4ae095f0d6b
          test "$(git rev-parse HEAD:scripts/qa/diagnoseBudgetFirstSigning.mjs)" = 68a7f58bc644503cd49c07bc40e1a083e3d7894b
          test "$(git rev-parse "$BB_DIAGNOSTIC_ORIGINAL:src/hooks/useBudgetBuilder.ts")" = 02ec7d7971bbcf96723e4a15fe285c5c0edf2ad2
          test "$(git rev-parse "$BB_DIAGNOSTIC_ORIGINAL:src/components/budget-builder/BudgetBuilderBoard.tsx")" = 526213213e4a5e1b625e1b6505227b623f76ad26
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import {execFileSync} from 'node:child_process';import {createHash} from 'node:crypto';import assert from 'node:assert/strict';
          const out=process.env.BB_DIAGNOSTIC_OUT,helper='scripts/qa/diagnoseBudgetFirstSigning.mjs';
          const tree=ref=>execFileSync('git',['ls-tree','-r','-z',ref,'--','src','public','scripts'],{encoding:'utf8'}).split('\0').filter(Boolean).filter(line=>line.split('\t')[1]!==helper);
          const base=tree(process.env.BB_DIAGNOSTIC_SOURCE),head=tree('HEAD');assert.deepEqual(head,base,'Every common source blob equals3509, excluding only new diagnostic helper');
          const files=execFileSync('git',['ls-files','-z'],{encoding:'utf8'}).split('\0').filter(Boolean);
          const rows=files.map(file=>{const b=fs.readFileSync(file);return{file,bytes:b.length,sha256:createHash('sha256').update(b).digest('hex')};});
          fs.writeFileSync(out+'/tracked-head.json',JSON.stringify(rows));fs.writeFileSync(out+'/source-provenance.json',JSON.stringify({sourceRef:process.env.BB_DIAGNOSTIC_SOURCE,originalRef:process.env.BB_DIAGNOSTIC_ORIGINAL,commonSourceRows:head.length,onlyExcludedHelper:helper,scope:'Two physical source arms on one common source tree. Diagnostic only.'},null,2));
          NODE
          npm ci 2>&1 | tee "$BB_DIAGNOSTIC_OUT/install.log"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const lock=JSON.parse(fs.readFileSync('package-lock.json')),rows=Object.keys(lock.packages).filter(p=>p.startsWith('node_modules/')&&fs.existsSync(p+'/package.json')).map(p=>[p,JSON.parse(fs.readFileSync(p+'/package.json')).version]);
          assert.equal(rows.length,521);fs.writeFileSync(process.env.BB_DIAGNOSTIC_OUT+'/installed-before.json',JSON.stringify(rows));
          NODE
          if [ "$BB_SIGN_DIAGNOSTIC_ARM" = original ]; then
            git show "$BB_DIAGNOSTIC_ORIGINAL:src/hooks/useBudgetBuilder.ts" > src/hooks/useBudgetBuilder.ts
            git show "$BB_DIAGNOSTIC_ORIGINAL:src/components/budget-builder/BudgetBuilderBoard.tsx" > src/components/budget-builder/BudgetBuilderBoard.tsx
          fi
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import {execFileSync} from 'node:child_process';import {createHash} from 'node:crypto';import assert from 'node:assert/strict';
          const out=process.env.BB_DIAGNOSTIC_OUT,original=process.env.BB_SIGN_DIAGNOSTIC_ARM==='original',files=execFileSync('git',['ls-files','-z'],{encoding:'utf8'}).split('\0').filter(Boolean);
          const rows=files.map(file=>{const b=fs.readFileSync(file);return{file,bytes:b.length,sha256:createHash('sha256').update(b).digest('hex')};});
          const blob=file=>{const b=fs.readFileSync(file);return createHash('sha1').update(Buffer.concat([Buffer.from('blob '+b.length+'\0'),b])).digest('hex');};
          const physical={hook:blob('src/hooks/useBudgetBuilder.ts'),board:blob('src/components/budget-builder/BudgetBuilderBoard.tsx')};
          assert.equal(physical.hook,original?'02ec7d7971bbcf96723e4a15fe285c5c0edf2ad2':'0220c215cb2530a632abc477810ec38b095982c7');assert.equal(physical.board,original?'526213213e4a5e1b625e1b6505227b623f76ad26':'f9111c2782f61ec9b976aee52baed4ae095f0d6b');
          const head=JSON.parse(fs.readFileSync(out+'/tracked-head.json')),changed=rows.filter((row,index)=>JSON.stringify(row)!==JSON.stringify(head[index])).map(row=>row.file).sort();
          assert.deepEqual(changed,original?['src/components/budget-builder/BudgetBuilderBoard.tsx','src/hooks/useBudgetBuilder.ts']:[],'Only the two explicit physical source files differ');
          fs.writeFileSync(out+'/tracked-arm-before.json',JSON.stringify(rows));fs.writeFileSync(out+'/physical-before.json',JSON.stringify(physical,null,2));
          NODE
      - name: Proper App types
        run: |
          set -euo pipefail
          node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee budget-first-sign-${{ matrix.arm }}/types.log
      - name: Normal production build and retained bytes
        id: build
        run: |
          set -euo pipefail
          NODE_OPTIONS="--max-old-space-size=6144 --require=$PWD/scripts/lib/offlineTransport.cjs" npm run build 2>&1 | tee budget-first-sign-${{ matrix.arm }}/build.log
          tar -czf budget-first-sign-${{ matrix.arm }}/dist.tgz dist
          sha256sum budget-first-sign-${{ matrix.arm }}/dist.tgz > budget-first-sign-${{ matrix.arm }}/dist.sha256
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import {createHash} from 'node:crypto';import assert from 'node:assert/strict';
          const walk=dir=>fs.readdirSync(dir,{withFileTypes:true}).sort((a,b)=>a.name.localeCompare(b.name)).flatMap(e=>e.isDirectory()?walk(dir+'/'+e.name):e.isFile()?[dir+'/'+e.name]:[]);
          const rows=walk('dist').map(file=>{const b=fs.readFileSync(file);return {file,bytes:b.length,sha256:createHash('sha256').update(b).digest('hex')};});
          assert.equal(rows.length,850);fs.writeFileSync('budget-first-sign-${{ matrix.arm }}/dist-before.json',JSON.stringify(rows));
          const b=fs.readFileSync('budget-first-sign-${{ matrix.arm }}/dist.tgz');fs.writeFileSync('budget-first-sign-${{ matrix.arm }}/build-provenance.json',JSON.stringify({arm:process.env.BB_SIGN_DIAGNOSTIC_ARM,physical:JSON.parse(fs.readFileSync(process.env.BB_DIAGNOSTIC_OUT+'/physical-before.json')),distFiles:rows.length,tarBytes:b.length,tarSHA256:createHash('sha256').update(b).digest('hex'),scope:'Normal build of this exact physical arm. Diagnostic only.'},null,2));
          NODE
      - name: Isolated pinned Playwright and Chromium
        id: browser_setup
        timeout-minutes: 12
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/budget-sign-browser" --no-save --package-lock=false playwright@1.64.1 2>&1 | tee budget-first-sign-${{ matrix.arm }}/browser-install.log
          test ! -e node_modules/playwright
          ln -s "$RUNNER_TEMP/budget-sign-browser/node_modules/playwright" node_modules/playwright
          node "$RUNNER_TEMP/budget-sign-browser/node_modules/playwright/cli.js" install --with-deps chromium 2>&1 | tee budget-first-sign-${{ matrix.arm }}/chromium-install.log
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const before=JSON.parse(fs.readFileSync('budget-first-sign-${{ matrix.arm }}/installed-before.json'));
          const after=before.map(([p])=>[p,JSON.parse(fs.readFileSync(p+'/package.json')).version]);assert.deepEqual(after,before);
          const pw=JSON.parse(fs.readFileSync('node_modules/playwright/package.json'));assert.equal(pw.version,'1.64.1');
          fs.writeFileSync('budget-first-sign-${{ matrix.arm }}/installed-after.json',JSON.stringify(after));fs.writeFileSync('budget-first-sign-${{ matrix.arm }}/browser-package.json',JSON.stringify({version:pw.version,target:fs.realpathSync('node_modules/playwright')}));
          NODE
      - name: Observe native first signing at three widths
        timeout-minutes: 12
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.browser_setup.outcome == 'success' }}
        run: |
          set -euo pipefail
          set +e
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/qa/diagnoseBudgetFirstSigning.mjs > "$BB_DIAGNOSTIC_OUT/browser.log" 2>&1
          browser_code=$?
          set -e
          printf '%s\n' "$browser_code" > "$BB_DIAGNOSTIC_OUT/browser.exit"
          cat "$BB_DIAGNOSTIC_OUT/browser.log"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import path from 'node:path';import {createHash} from 'node:crypto';import assert from 'node:assert/strict';
          const out=process.env.BB_DIAGNOSTIC_OUT,dir=out+'/browser',report=JSON.parse(fs.readFileSync(dir+'/report.json'));
          assert.equal(Number(fs.readFileSync(out+'/browser.exit','utf8').trim()),0,'Diagnostic helper completed');
          assert.equal(report.status,'observed');assert.equal(report.arm,process.env.BB_SIGN_DIAGNOSTIC_ARM);assert(!report.error);
          assert.deepEqual(report.physical,JSON.parse(fs.readFileSync(out+'/physical-before.json')));
          assert.deepEqual(report.distBefore,JSON.parse(fs.readFileSync(out+'/dist-before.json')),'Browser observes its own exact physical-arm build');
          assert(report.sourceHeld&&report.distHeld);assert.deepEqual(report.sourceBefore,report.sourceAfter);assert.deepEqual(report.distBefore,report.distAfter);
          assert.deepEqual(report.journeys.map(j=>[j.width,j.status]),[[320,'observed'],[390,'observed'],[1280,'observed']]);assert.equal(report.screenshots.length,6);
          const read=ref=>{const b=fs.readFileSync(path.join(dir,ref.file));assert.equal(b.length,ref.bytes);assert.equal(createHash('sha256').update(b).digest('hex'),ref.sha256);return ref.file.endsWith('.json')?JSON.parse(b):null;};
          const observations=[];
          for(const j of report.journeys){
            assert(!j.error);assert.equal(j.errors.length,0);assert.equal(j.assetErrors.length,0);assert.equal(j.routeErrors.length,0);
            const v=j.confirmation;assert(v.diagnosticOnly);assert.equal(v.assertedZeroScroll,false);assert(v.fullStorageHeld);
            assert(Number.isFinite(v.deltaScroll.y)&&Number.isFinite(v.deltaDocumentHeight),'Actual measured deltas');
            for(const ref of [...j.frames,...j.actions])read(ref);const before=read(v.beforeLayout),after=read(v.afterLayout);
            assert(after.destination.focused);assert.equal(after.picker,null);assert(before.picker);
            observations.push({width:j.width,deltaScroll:v.deltaScroll,deltaDocumentHeight:v.deltaDocumentHeight,readability:v.readability,hypotheticalDestinationAtOldScroll:v.hypotheticalDestinationAtOldScroll,scrollDeltaEqualsHeightDelta:v.scrollDeltaEqualsHeightDelta,afterAtScrollRangeEnd:v.afterAtScrollRangeEnd});
          }
          for(const shot of report.screenshots){read(shot);read(shot.layout);read(shot.frame);}
          fs.writeFileSync(out+'/diagnostic-admission.json',JSON.stringify({status:'diagnostic-observed',arm:report.arm,observations,scope:'Observed first-signing data only. No zero-scroll/readability qualification, waiver, reader, cap, unit, whole-XI, Final or backend-write credit.'},null,2));
          console.log('Observed diagnostic data only: '+JSON.stringify(observations));
          NODE
      - name: Retain physical holds and restore HEAD source exactly
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$BB_DIAGNOSTIC_OUT"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import {execFileSync} from 'node:child_process';import {createHash} from 'node:crypto';import assert from 'node:assert/strict';
          const out=process.env.BB_DIAGNOSTIC_OUT,files=execFileSync('git',['ls-files','-z'],{encoding:'utf8'}).split('\0').filter(Boolean),issues=[];
          const capture=()=>files.map(file=>{const b=fs.readFileSync(file);return{file,bytes:b.length,sha256:createHash('sha256').update(b).digest('hex')};});
          try{
            const after=capture();fs.writeFileSync(out+'/tracked-arm-after.json',JSON.stringify(after));
            assert.deepEqual(after,JSON.parse(fs.readFileSync(out+'/tracked-arm-before.json')),'Every physical-arm tracked byte held through type/build/browser');
          }catch(error){issues.push(String(error.stack||error));}
          finally{
            for(const file of ['src/hooks/useBudgetBuilder.ts','src/components/budget-builder/BudgetBuilderBoard.tsx'])fs.writeFileSync(file,execFileSync('git',['show','HEAD:'+file]));
          }
          const restored=capture();fs.writeFileSync(out+'/tracked-restored.json',JSON.stringify(restored));assert.deepEqual(restored,JSON.parse(fs.readFileSync(out+'/tracked-head.json')),'All tracked bytes restored to common HEAD');
          const lock=JSON.parse(fs.readFileSync('package-lock.json')),versions=Object.keys(lock.packages).filter(p=>p.startsWith('node_modules/')&&fs.existsSync(p+'/package.json')).map(p=>[p,JSON.parse(fs.readFileSync(p+'/package.json')).version]);
          fs.writeFileSync(out+'/installed-final.json',JSON.stringify(versions));assert.equal(versions.length,521);assert.deepEqual(versions,JSON.parse(fs.readFileSync(out+'/installed-before.json')));
          const walk=dir=>fs.readdirSync(dir,{withFileTypes:true}).sort((a,b)=>a.name.localeCompare(b.name)).flatMap(e=>e.isDirectory()?walk(dir+'/'+e.name):e.isFile()?[dir+'/'+e.name]:[]);
          if(fs.existsSync(out+'/dist-before.json')){const dist=walk('dist').map(file=>{const b=fs.readFileSync(file);return{file,bytes:b.length,sha256:createHash('sha256').update(b).digest('hex')};});fs.writeFileSync(out+'/dist-after.json',JSON.stringify(dist));assert.deepEqual(dist,JSON.parse(fs.readFileSync(out+'/dist-before.json')));}
          assert(fs.existsSync(process.env.SIM_OFFLINE_RECEIPT));assert.equal(fs.statSync(process.env.SIM_OFFLINE_RECEIPT).size,0);
          fs.writeFileSync(out+'/restoration.json',JSON.stringify({restored:true,physicalHolds:issues.length===0,issues,scope:'Restoring HEAD source does not rebuild or replace this diagnostic arm dist.'},null,2));
          assert.equal(issues.length,0,'Physical source holds failed; source restoration was still completed');
          NODE
          git ls-files -s > "$BB_DIAGNOSTIC_OUT/source-after.txt"
          cmp "$BB_DIAGNOSTIC_OUT/source-before.txt" "$BB_DIAGNOSTIC_OUT/source-after.txt"
          git diff --exit-code HEAD -- .
          sha256sum package.json package-lock.json > "$BB_DIAGNOSTIC_OUT/locks-after.txt"
          cmp "$BB_DIAGNOSTIC_OUT/locks-before.txt" "$BB_DIAGNOSTIC_OUT/locks-after.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: budget-first-sign-diagnostic-${{ matrix.arm }}-${{ github.run_id }}
          path: budget-first-sign-${{ matrix.arm }}
          retention-days: 14
          if-no-files-found: error
