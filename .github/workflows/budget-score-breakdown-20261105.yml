name: Budget Builder original score visibility proof
on:
  push:
    branches: [codex/budget-score-breakdown-qa-20261105]
permissions:
  contents: read
jobs:
  original:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      SIM_NETWORK: offline
      SIM_OFFLINE_RECEIPT: budget-score-original/offline.log
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - name: Exact original Budget and locked dependencies
        run: |
          mkdir -p budget-score-original
          touch budget-score-original/offline.log
          git rev-parse HEAD > budget-score-original/head.txt
          git ls-files -s > budget-score-original/source-before.txt
          sha256sum package.json package-lock.json > budget-score-original/locks-before.txt
          test "$(git rev-parse HEAD:src/hooks/useBudgetBuilder.ts)" = 02ec7d7971bbcf96723e4a15fe285c5c0edf2ad2
          test "$(git rev-parse HEAD:src/components/budget-builder/BudgetBuilderBoard.tsx)" = 526213213e4a5e1b625e1b6505227b623f76ad26
          test "$(git rev-parse HEAD:src/test/budgetSigning.test.tsx)" = 97cb3fa452184995a52a77381c7ecc45d25d2c03
          npm ci
      - name: Proper app types
        run: node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee budget-score-original/types.log
      - name: Original missing earned-score business census
        run: |
          set +e
          BB_SCORE_BREAKDOWN_RAW="$PWD/budget-score-original/raw.json" NODE_OPTIONS="--max-old-space-size=6144 --require=$PWD/scripts/lib/offlineTransport.cjs" node node_modules/vitest/vitest.mjs run src/test/budgetScoreBreakdown.test.tsx --maxWorkers=1 --minWorkers=1 --reporter=default --reporter=json --outputFile=budget-score-original/owned.json 2>&1 | tee budget-score-original/owned.log
          owned_status=${PIPESTATUS[0]}
          set -e
          echo "$owned_status" > budget-score-original/owned-exit.txt
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const r=JSON.parse(fs.readFileSync('budget-score-original/owned.json')),raw=JSON.parse(fs.readFileSync('budget-score-original/raw.json')),log=fs.readFileSync('budget-score-original/owned.log','utf8');
          assert.equal(fs.readFileSync('budget-score-original/owned-exit.txt','utf8').trim(),'1');
          assert.equal(r.numTotalTests,10);assert.equal(r.numFailedTests,9);assert.equal(r.numPassedTests,1);assert.equal(r.numPendingTests,0);
          const rows=r.testResults.flatMap(s=>s.assertionResults),failed=rows.filter(x=>x.status==='failed'),passed=rows.filter(x=>x.status==='passed');
          assert.equal(rows.length,10);assert(passed[0].title.startsWith('BB_SCORE_PRESERVE'));
          for(const row of failed){assert(row.title.startsWith('BB_SCORE_')&&!row.title.startsWith('BB_SCORE_PRESERVE'));assert(row.failureMessages.every(m=>m.includes('AssertionError')&&m.includes(row.title)),'Named actual business failure: '+row.title);}
          assert.equal(raw.caseTitles.length,10);assert.equal(Object.keys(raw.cases).length,10);assert(Object.values(raw.cases).every(x=>x.frames.length>0));
          assert(!/Unhandled Errors|Unhandled Rejection|Uncaught Exception|Failed to resolve import/.test(log));
          console.log('PASS original9namedbusiness AssertionErrors and1preservation case, all10RAW cases retained');
          NODE
      - name: Existing signing outcomes held
        if: ${{ !cancelled() }}
        run: |
          NODE_OPTIONS="--max-old-space-size=6144 --require=$PWD/scripts/lib/offlineTransport.cjs" node node_modules/vitest/vitest.mjs run src/test/budgetSigning.test.tsx --maxWorkers=1 --minWorkers=1 --reporter=default --reporter=json --outputFile=budget-score-original/existing.json 2>&1 | tee budget-score-original/existing.log
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';const r=JSON.parse(fs.readFileSync('budget-score-original/existing.json'));assert.equal(r.numTotalTests,9);assert.equal(r.numPassedTests,9);assert.equal(r.numFailedTests,0);assert.equal(r.numPendingTests,0);
          NODE
      - name: Original source locks and offline held
        if: always()
        run: |
          git ls-files -s > budget-score-original/source-after.txt
          cmp budget-score-original/source-before.txt budget-score-original/source-after.txt
          git diff --exit-code HEAD -- src scripts public package.json package-lock.json
          sha256sum package.json package-lock.json > budget-score-original/locks-after.txt
          cmp budget-score-original/locks-before.txt budget-score-original/locks-after.txt
          test -f budget-score-original/offline.log
          test ! -s budget-score-original/offline.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: budget-score-original-${{ github.run_id }}
          path: budget-score-original
          retention-days: 14
          if-no-files-found: error
