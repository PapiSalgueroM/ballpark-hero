          export QA_OUT="$OUT" QA_REF QA_BASE_SRC QA_BASE_DIST
          printf 'QA_OUT=%s\nQA_REF=%s\nQA_BASE_SRC=%s\nQA_BASE_DIST=%s\n' "$OUT" "$QA_REF" "$QA_BASE_SRC" "$QA_BASE_DIST" >> "$GITHUB_ENV"
          git worktree add --detach "$QA_BASE_SRC" "$BASELINE_CORE" > "$OUT/logs/baseline-checkout.log" 2>&1
