          const git=(...a)=>execFileSync('git',a,{encoding:'utf8'}).trim(),sha=b=>createHash('sha256').update(b).digest('hex');
          assert.match(e.MOBILE_BROWSER_BLOB,/^[a-f0-9]{40}$/);
          assert.equal(git('rev-parse','HEAD^'),e.PRODUCT_CORE);assert.equal(git('rev-parse','HEAD^^{tree}'),e.PRODUCT_TREE);
          assert.equal(git('rev-parse',e.BASELINE_CORE+'^{tree}'),e.BASELINE_TREE);assert.equal(git('rev-parse',e.PUBLISHED_MERGE+'^{tree}'),e.BASELINE_TREE);
          assert.deepEqual(git('cat-file','-p',e.PRODUCT_CORE).split('\n').filter(s=>s.startsWith('parent ')).map(s=>s.slice(7)),[e.PUBLISHED_MERGE]);
          assert.deepEqual(git('diff','--name-status','--no-renames',e.BASELINE_CORE,e.PRODUCT_CORE).split('\n'),['M\t'+target]);
          assert.equal(git('rev-parse',e.BASELINE_CORE+':'+target),'b4a61d1683f5df42602d86ed3b1dae19eead86bd');
          assert.equal(git('rev-parse',e.PRODUCT_CORE+':'+target),'90b29619567c0eca31b4939de622c01c24fc130a');
          const delta=git('diff','--name-status','--no-renames','HEAD^','HEAD').split('\n').map(s=>s.split('\t'));assert.deepEqual(delta,[['A',workflow],['A',helper]]);
          assert.equal(git('hash-object',helper),e.MOBILE_BROWSER_BLOB);assert.equal(git('status','--porcelain=v1','--untracked-files=all'),'');
          fs.writeFileSync(out+'/qa-source-role.json',JSON.stringify({candidate:{commit:e.PRODUCT_CORE,tree:e.PRODUCT_TREE},baseline:{commit:e.BASELINE_CORE,tree:e.BASELINE_TREE},publishedMerge:e.PUBLISHED_MERGE,sourceOnlyChangedPath:target,qa:{commit:git('rev-parse','HEAD'),tree:git('rev-parse','HEAD^{tree}'),additions:delta},wholeOnePathInverse:e.BASELINE_TREE,wholeTwoQAAdditionInverse:e.PRODUCT_TREE,scope:'One UI layout path only. No model/data/seed/threshold change. Baseline reuses actual Build6 compiled output; candidate must earn one new normal build.'},null,2)+'\n');
          fs.writeFileSync(out+'/workflow.yml',fs.readFileSync(workflow));fs.writeFileSync(out+'/helper-source.mjs',fs.readFileSync(helper));
          fs.writeFileSync(out+'/workflow-source.json',JSON.stringify({head:git('rev-parse','HEAD'),tree:git('rev-parse','HEAD^{tree}'),path:workflow,gitBlob:git('hash-object',workflow)})+'\n');
          PINS
          git ls-files -z | sort -z | xargs -0 sha256sum > "$OUT/source-before.sha256"
          git ls-files -s > "$OUT/index-before.txt"
          git ls-files -z > "$OUT/tracked-before.bin"
