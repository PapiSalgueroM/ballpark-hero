          git -C "$QA_BASE_SRC" ls-files -s > "$OUT/baseline-index-before.txt"
          git -C "$QA_BASE_SRC" status --porcelain=v1 --untracked-files=all > "$OUT/baseline-status-before.txt"
          test ! -s "$OUT/baseline-status-before.txt"
