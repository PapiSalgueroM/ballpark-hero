          fs.writeFileSync(out+'/build-proof.json',JSON.stringify({status:'compiled-gates-passed',product:process.env.PRODUCT_CORE,productTree:process.env.PRODUCT_TREE,normalBuilds:1,readers,readersCount:20,seoSplitScope:['/soccer-career','/club-manager','/nba-my-career'],allCapsUnchanged:true,extraCmLeagueRules:false,scope:'Four-cohort Soccer completed build qualification. All16 existing route caps including Soccer840KiB and the original measurement window are unchanged. Known wider-suite failures remain unwaived',tar:{bytes:tar.length,sha256:crypto.createHash('sha256').update(tar).digest('hex')},distInventorySHA256:crypto.createHash('sha256').update(dist).digest('hex'),distFiles:dist.toString('utf8').trim().split('\n').length,soccerChunkSizes:JSON.parse(fs.readFileSync(out+'/soccer-chunk-sizes.json','utf8')),fourAppBridge:JSON.parse(fs.readFileSync(out+'/four-app-source-bridge.json','utf8')),native:false,public:false},null,2)+'\n');
