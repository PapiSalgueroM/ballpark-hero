name: Rating and draft report baseline
on:
  push:
    branches: [codex/ratings-draft-red-20261102]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      CI: '1'
      SIM_NETWORK: offline
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies and record source
        run: |
          set -euo pipefail
          mkdir -p report-baseline
          git rev-parse HEAD HEAD^{tree} > report-baseline/source.txt
          git ls-files -z | sort -z | xargs -0 sha256sum > report-baseline/source-before.sha256
          npm ci --no-audit --no-fund > report-baseline/install.log 2>&1
      - name: Actual app types
        run: |
          set -euo pipefail
          node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee report-baseline/types.log
      - name: Observe both report regressions without editing application source
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          export SC_CREATION_ROLL_RAW="$PWD/report-baseline/sc-rating-raw"
          for spec in soccerCareerCreationRoll fantasyDraftFormation; do
            set +e
            SIM_OFFLINE_RECEIPT="$PWD/report-baseline/$spec.transport.log" node node_modules/vitest/vitest.mjs run "src/test/$spec.test.tsx" --maxWorkers=1 --minWorkers=1 --reporter=default --reporter=json --outputFile="report-baseline/$spec.json" 2>&1 | tee "report-baseline/$spec.log"
            status=${PIPESTATUS[0]}
            set -e
            printf '%s\n' "$status" > "report-baseline/$spec.exit"
          done
          git diff --exit-code HEAD
          sha256sum --check report-baseline/source-before.sha256 > report-baseline/source-held.log
          cp src/test/soccerCareerCreationRoll.test.tsx src/test/fantasyDraftFormation.test.tsx report-baseline/
          test ! -s report-baseline/soccerCareerCreationRoll.transport.log
          test ! -s report-baseline/fantasyDraftFormation.transport.log
          test "$(cat report-baseline/soccerCareerCreationRoll.exit)" -eq 0
          test "$(cat report-baseline/fantasyDraftFormation.exit)" -eq 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rating-draft-baseline-${{ github.run_id }}
          path: report-baseline
          retention-days: 14
          if-no-files-found: error
