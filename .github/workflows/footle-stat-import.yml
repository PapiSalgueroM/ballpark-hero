name: Footle unknown stat import verification

on:
  pull_request:
    paths:
      - .github/workflows/footle-stat-import.yml
      - scripts/bakePlayers.mjs
      - scripts/simPlayersPool.mjs
      - scripts/simFootleStatImport.mjs

permissions:
  contents: read
concurrency:
  group: footle-stat-import-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      SIM_NETWORK: offline
      ENGINES: chromium
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verification dependencies
        run: |
          mkdir -p footle-stat-import-artifacts
          npm ci
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          python -m pip install fonttools pillow
      - name: Type check and build
        id: build
        run: |
          node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee footle-stat-import-artifacts/types.log
          npm run build 2>&1 | tee footle-stat-import-artifacts/build.log
      - name: Offline import outcomes and effective controls
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/simFootleStatImport.mjs 2>&1 | tee footle-stat-import-artifacts/import.log
      - name: All built readers and source checks
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          failed=0
          for harness in simAdsense simBrand simHeadTags simHiddenPages simHubs simIndexNow simIndexing simInternalLinks simNoRivalNames simPrerender simPrerenderBoot simRetiredRoutes simSchema simSitemap simSnapshotAssets simGuideHeadings simHarnessAnchors; do
            ONLY="$harness" node scripts/runAllSims.mjs --browser 2>&1 | tee "footle-stat-import-artifacts/$harness.log" || failed=1
          done
          exit "$failed"
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: footle-stat-import-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 1
          path: footle-stat-import-artifacts/
