          const locks=Object.fromEntries(['package.json','package-lock.json','bun.lock','bun.lockb','yarn.lock','pnpm-lock.yaml'].map(p=>[p,fs.existsSync(p)?sha(fs.readFileSync(p)):null]));fs.writeFileSync(out+'/all-locks-after.json',JSON.stringify(locks)+'\n');assert.deepEqual(locks,JSON.parse(fs.readFileSync(out+'/all-locks-before.json')));
          if(fs.existsSync(out+'/input-reference-before.json')){const actual=Buffer.from(JSON.stringify(inventory(process.env.QA_REF))+'\n');fs.writeFileSync(out+'/input-reference-after.json',actual);assert(actual.equals(fs.readFileSync(out+'/input-reference-before.json')));}
          if(fs.existsSync(out+'/dist-before.json')){const actual=Buffer.from(JSON.stringify(inventory(process.env.QA_DIST))+'\n');fs.writeFileSync(out+'/dist-after.json',actual);assert(actual.equals(fs.readFileSync(out+'/dist-before.json')));}
          const expectedReceipts=['browser.log','server.log','types.log'];assert.deepEqual(fs.readdirSync(out+'/transport').sort(),expectedReceipts);
          for(const file of expectedReceipts)assert.equal(fs.readFileSync(out+'/transport/'+file).length,0,file);
          const report=JSON.parse(fs.readFileSync(out+'/browser/report.json')),manifest=JSON.parse(fs.readFileSync(out+'/input/native-manifest.json'));
          assert.equal(report.status,'passed');assert.equal(report.sourceHeld,true);assert.equal(report.distHeld,true);
          assert.deepEqual(report.contexts.map(c=>[c.width,c.flow]),[320,390,1280].flatMap(width=>['cm','sc-current','sc-historical'].map(flow=>[width,flow])));
          assert.equal(report.screenshots.length,84);assert.equal(new Set(report.screenshots).size,84);
          for(const c of report.contexts){assert.equal(c.status,'passed');assert(c.frames.length>0);assert(c.photos.length>0);assert(c.documentRequests.length>0);assert(c.documentBodies.length>0);assert(c.assetBodies.length>0);
            for(const key of ['photoOmissionControl','documentControl']){assert.equal(c[key].changed,true);assert.equal(c[key].wholeInverseExact,true);assert.equal(c[key].actualHeld,true);}
            if(c.flow==='cm'){assert.equal(c.committed,true);for(const key of ['savedBytesControl','tableOmissionControl','teamEvidenceControls']){assert.equal(c[key].changed,true);assert.equal(c[key].wholeInverseExact,true);assert.equal(c[key].actualHeld,true);}}
            for(const row of c.frames){const stored=fs.readFileSync(out+'/browser/'+row.file),decoded=gunzipSync(stored);assert.equal(stored.length,row.bytes);assert.equal(sha(stored),row.sha256);assert.equal(decoded.length,row.decodedBytes);assert.equal(sha(decoded),row.decodedSHA256);assert(JSON.parse(decoded));}
            for(const body of [...c.assetBodies,...c.documentBodies]){const bytes=fs.readFileSync(out+'/browser/'+body.file);assert.equal(bytes.length,body.bytes);assert.equal(sha(bytes),body.sha256);const reference=manifest.distBefore.find(v=>v.file===body.path);assert(reference);assert.equal(reference.bytes,body.bytes);assert.equal(reference.sha256,body.sha256);}
            for(const key of ['unexpectedConsole','unexpectedPageErrors','unexpectedExternalAborts','localHttpErrors','assetErrors'])assert.equal(c[key].length,0,key);
          }
          const images=report.screenshots.map(file=>{assert(/^[a-z0-9-]+\.png$/.test(file));const b=fs.readFileSync(out+'/browser/'+file);assert(b.length>8&&b.subarray(0,8).equals(Buffer.from([137,80,78,71,13,10,26,10])));return{file,bytes:b.length,sha256:sha(b)};});fs.writeFileSync(out+'/screenshots.json',JSON.stringify(images,null,2)+'\n');
          for(const[p,digest]of Object.entries(manifest.sourceAfter))assert.equal(sha(fs.readFileSync(p)),digest,p);
          fs.writeFileSync(out+'/source-dist-input-held.json',JSON.stringify({source:true,index:true,tracked:true,status:true,locks:true,completeInputHeld:true,distFiles:manifest.distBefore.length,distDigest:manifest.distDigest,nineContexts:true,eightyFourPhotos:true,AppBuilds:0,modelOrFixtureGeneration:false,visualReview:'PENDING_HUMAN_OR_INDEPENDENT_IMAGE_REVIEW'},null,2)+'\n',{flag:'wx'});
          HOLDS
          printf '0\n' > "$QA_OUT/logs/final-source-holds.exit" || exit 1
      - name: Retain bounded complete native proof or fatal diagnostic
        id: evidence
        if: always()
        shell: bash
        run: |
          set +e
          set -uo pipefail
          archive="$RUNNER_TEMP/k-league-native.tar.gz"
          tar -czf "$archive" -C "$QA_OUT" . > "$RUNNER_TEMP/k-league-native-pack.log" 2>&1
          pack_exit=$?
          printf '%s\n' "$pack_exit" > "$QA_OUT/pack-native.exit" || exit 1
          if [[ "$pack_exit" == 0 && -f "$archive" && "$(stat -c %s "$archive")" -le 50000000 ]]; then
            sha256sum "$archive" > "$archive.sha256" || exit 1
            printf 'archive=%s\n' "$archive" >> "$GITHUB_OUTPUT" || exit 1
            exit 0
          fi
          printf '%s\n' 'DIAGNOSTIC_ONLY_NO_COMPLETE_NATIVE_OR_IMAGE_PROOF: full pack failed or exceeded50000000bytes' > "$QA_OUT/DIAGNOSTIC-ONLY.txt" || exit 1
          cp "$RUNNER_TEMP/k-league-native-pack.log" "$QA_OUT/pack.log" || exit 1
          node --input-type=module <<'DIAGNOSTIC'
          import fs from 'node:fs';import path from 'node:path';import crypto from 'node:crypto';
          const root=process.env.QA_OUT,sha=b=>crypto.createHash('sha256').update(b).digest('hex'),rows=[];
          function walk(rel=''){for(const entry of fs.readdirSync(path.join(root,rel),{withFileTypes:true})){const file=path.posix.join(rel,entry.name);if(entry.isDirectory())walk(file);else if(entry.isFile()){const bytes=fs.readFileSync(path.join(root,file));rows.push({file,bytes:bytes.length,sha256:sha(bytes)});}}}walk();
          fs.writeFileSync(root+'/fatal-full-output-inventory.json',JSON.stringify({status:'DIAGNOSTIC_ONLY',completeNativeProof:false,fullArchive:fs.existsSync(path.join(process.env.RUNNER_TEMP,'k-league-native.tar.gz'))?{bytes:fs.statSync(path.join(process.env.RUNNER_TEMP,'k-league-native.tar.gz')).size,sha256:sha(fs.readFileSync(path.join(process.env.RUNNER_TEMP,'k-league-native.tar.gz')))}:null,fullOutput:rows.sort((a,b)=>a.file<b.file?-1:a.file>b.file?1:0),omittedFromDiagnostic:['browser/frames','browser/bodies','ordinary and failure PNG files'],note:'Successful evidence is never truncated. This diagnostic has no runtime or image qualification.'},null,2)+'\n');
          DIAGNOSTIC
          test "$?" = 0 || exit 1
          diagnostic="$RUNNER_TEMP/k-league-native-diagnostic.tar.gz"
          diagnostic_dir="$RUNNER_TEMP/k-league-native-diagnostic"
          mkdir -p "$diagnostic_dir/logs" "$diagnostic_dir/transport" "$diagnostic_dir/input" "$diagnostic_dir/browser" || exit 1
          find "$QA_OUT" -maxdepth 1 -type f -exec cp '{}' "$diagnostic_dir/" \; || exit 1
          cp -R "$QA_OUT/logs/." "$diagnostic_dir/logs/" || exit 1
          cp -R "$QA_OUT/transport/." "$diagnostic_dir/transport/" || exit 1
          cp -R "$QA_OUT/input/." "$diagnostic_dir/input/" || exit 1
          if test -d "$QA_OUT/browser"; then find "$QA_OUT/browser" -maxdepth 1 -type f -name '*.json' -exec cp '{}' "$diagnostic_dir/browser/" \; || exit 1; fi
          tar -czf "$diagnostic" -C "$diagnostic_dir" . || exit 1
          test "$(stat -c %s "$diagnostic")" -le 50000000 || exit 1
          sha256sum "$diagnostic" > "$diagnostic.sha256" || exit 1
          printf 'archive=%s\n' "$diagnostic" >> "$GITHUB_OUTPUT" || exit 1
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k-league-native
          path: |
            ${{ steps.evidence.outputs.archive }}
            ${{ steps.evidence.outputs.archive }}.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
