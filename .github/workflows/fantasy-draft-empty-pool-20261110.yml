              raw: write(id + '.json', json(raw)), screenshots: raw.screenshots};
          }
          
          let browser;
          try {
            browser = await playwright.chromium.launch({headless: true});
            report.browserVersion = browser.version();
            const workers = await Promise.allSettled(widths.map(async ([width]) => {
              for (const plan of plans.filter(row => row.width === width)) report.cases.push(await run(browser, plan));
            }));
            report.cases.sort((left, right) => plans.findIndex(row => row.id === left.id) - plans.findIndex(row => row.id === right.id));
            const failedWorker = workers.find(worker => worker.status === 'rejected');
            if (failedWorker) throw failedWorker.reason;
            assert.deepEqual(report.cases.map(row => [row.id, row.status]), plans.map(row => [row.id, 'passed']));
            report.census = Object.fromEntries(Object.keys(report.cases[0].census).map(key =>
              [key, report.cases.reduce((sum, row) => sum + row.census[key], 0)]));
            assert.deepEqual(report.census, {humanPicks: 12, aiPicks: 18, playerReads: 24, criterionReads: 12,
              documentReads: 12, browserResponses: 36, trustedClicks: 36, screenshots: 24, externalForwards: 0});
            await browser.close();
            browser = null;
            report.status = 'passed';
            console.log('PASS 12 native Fantasy Draft empty-pool recovery journeys');
          } catch (error) {
            report.status = 'failed';
            report.error = String(error.stack || error);
            throw error;
          } finally {
            if (browser) await browser.close().catch(error => { report.browserCloseError = String(error.stack || error); });
            write('report.json', json(report));
          }
          FD_EMPTY_NATIVE
          printf '%s  %s\n' '8be8665666264ba991661a1d8ee7876ffde30c75db078534dc6a625f3e71e3c9' "$EVIDENCE/native-helper.mjs" | sha256sum -c -
          touch "$EVIDENCE/browser.transport.log"
          node scripts/lib/hostLikeServer.mjs dist 4174 > "$EVIDENCE/browser-host.log" 2>&1 &
          host=$!
          trap 'kill "$host" 2>/dev/null || true; wait "$host" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 40); do
            kill -0 "$host"
            if curl --noproxy '*' --silent --fail --max-time 1 http://127.0.0.1:4174/ -o /dev/null; then ready=1; break; fi
            sleep 0.25
          done
          test "$ready" -eq 1
          result=0
          CI=true FD_EMPTY_POOL_BASE=http://127.0.0.1:4174 FD_EMPTY_POOL_BROWSER_OUT="$EVIDENCE/browser" \
            FD_EMPTY_POOL_FIXED_RAW="$PWD/$EVIDENCE/fixed-reference.raw.json" \
            SIM_OFFLINE_RECEIPT="$PWD/$EVIDENCE/browser.transport.log" NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" \
            node "$EVIDENCE/native-helper.mjs" > "$EVIDENCE/browser.log" 2>&1 || result=$?
          printf '%s\n' "$result" > "$EVIDENCE/browser-exit.txt"
          cat "$EVIDENCE/browser.log"
          test "$result" -eq 0
          test ! -s "$EVIDENCE/browser.transport.log"
      - name: Fresh production rebuild, complete byte comparison, and admission
        run: |
          set -euo pipefail
          node "$EVIDENCE/dist-measure.mjs" dist after
          cmp "$EVIDENCE/dist-before.json" "$EVIDENCE/dist-after.json"
          test ! -e "$RUNNER_TEMP/fantasy-draft-empty-first-dist"
          mv dist "$RUNNER_TEMP/fantasy-draft-empty-first-dist"
          NODE_OPTIONS="--max-old-space-size=6144" npm run build 2>&1 | tee "$EVIDENCE/fresh-build.log"
          node "$EVIDENCE/dist-measure.mjs" dist fresh
          cmp "$EVIDENCE/dist-before.json" "$EVIDENCE/dist-fresh.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          const out=process.env.EVIDENCE;
          const read=file=>fs.readFileSync(out+'/'+file);
          const json=file=>JSON.parse(read(file));
          const sha=body=>createHash('sha256').update(body).digest('hex');
          const source=json('source-join.json'),native=json('browser/report.json'),unit=json('unit.json');
          assert.equal(unit.success,true);
          assert.deepEqual([unit.numFailedTests,unit.numPendingTests,unit.numTodoTests],[0,0,0]);
          assert.deepEqual([unit.numTotalTests,unit.numPassedTests],[15,15]);
          assert.deepEqual(unit.testResults.map(s=>[s.name.split('/').at(-1),s.assertionResults.length]).sort((a,b)=>a[0].localeCompare(b[0])),
            [['fantasyDraftCriteriaStart.test.tsx',4],['fantasyDraftFormation.test.tsx',3],['fantasyDraftPoolRecovery.test.tsx',8]]);
          assert(unit.testResults.every(s=>s.status==='passed'&&s.assertionResults.every(row=>row.status==='passed'&&row.failureMessages.length===0)));
          assert(read('readers.log').toString('utf8').includes('All 20 harnesses green.'));
          const weight=read('weight.log').toString('utf8');
          assert(weight.includes('sweepWeight: green.'));
          assert.equal(weight.split('\n').filter(line=>/^\s+\/\S*\s+\d+K gz over/.test(line)).length,16);
          assert.deepEqual([read('offline.log').length,read('browser.transport.log').length],[0,0]);
          const dist=json('dist-fresh.json');
          assert.equal(dist.length,850);
          const checked=(()=>{
          const target='http://127.0.0.1:4174/fantasy-draft';
          const census={"humanPicks":12,"aiPicks":18,"playerReads":24,"criterionReads":12,"documentReads":12,"browserResponses":36,"trustedClicks":36,"screenshots":24,"externalForwards":0};
          const expectedWire={"criteria":{"bytes":60,"sha256":"ddf428a9b97b966d8898ee997817f45d7761f95662de1f1a77ec8b57571c6659"},"null":{"bytes":4,"sha256":"74234e98afe7498fb5daf1f36ac2d78acc339464f950703b8c019892f982b90b"},"array":{"bytes":2,"sha256":"4f53cda18c2baa0c0354bb5f9a3ecbe5ed12ab4d8e11ba873c2f11161202b945"},"retry":{"bytes":4209,"sha256":"d903ce9ed14be109bf32da37f8f844fc14591639829690cabe312a94c33b5454"}};
          const refs=(file,body)=>({file,bytes:body.length,sha256:sha(body)});
          assert.deepEqual([native.version,native.status,native.target,native.nodeVersion],[1,'passed',target,'24.22.1']);
          assert.deepEqual(native.census,census);
          assert.deepEqual(native.wireBodies,expectedWire);
          assert.deepEqual(native.fixedRaw,source.inputs.qualified.raw);
          const doc=read('browser/built-document.html'),fixture=read('browser/fixture.json');
          assert.deepEqual(native.files,{document:refs('built-document.html',doc),fixture:refs('fixture.json',fixture)});
          assert.deepEqual({bytes:fixture.length,sha256:sha(fixture)},expectedWire.retry);
          assert.deepEqual(JSON.parse(fixture),json('fixed-reference.raw.json').fixture);
          assert.deepEqual(dist.find(row=>row.file==='dist/fantasy-draft/index.html'),{file:'dist/fantasy-draft/index.html',bytes:doc.length,sha256:sha(doc)});
          assert(fs.readFileSync('dist/fantasy-draft/index.html').equals(doc));
          const cases=[[320,780],[390,844],[1280,900]].flatMap(([width,height])=>
            ['null','array'].flatMap(reply=>['user','ai'].map(seat=>({id:[width,reply,seat].join('-'),width,height,reply,seat}))));
          const steps=['ready','firstPending','empty','emptyIdle','retryPending','admitted','humanReady','resumed'];
          assert.deepEqual(native.cases.map(({id,width,height,reply,seat,status})=>({id,width,height,reply,seat,status})),cases.map(x=>({...x,status:'passed'})));
          const names=new Set(JSON.parse(fixture).filter(p=>p.age<=25).map(p=>p.name));
          const nonces=new Set();
          const docBody={bytes:doc.length,sha256:sha(doc)};
          const entries=['report.json','built-document.html','fixture.json'];
          for(const row of native.cases){
            const {id,width,height,reply,seat}=row;
            const body=read('browser/'+id+'.json'),raw=JSON.parse(body),frames=raw.snapshots;
            assert.deepEqual(row.raw,refs(id+'.json',body));
            assert.deepEqual([raw.id,raw.width,raw.height,raw.reply,raw.seat,raw.status],[id,width,height,reply,seat,'passed']);
            assert.deepEqual(row.census,{humanPicks:1,aiPicks:seat==='user'?2:1,playerReads:2,criterionReads:1,documentReads:1,
              browserResponses:3,trustedClicks:3,screenshots:2,externalForwards:0});
            assert.deepEqual([raw.problems,raw.webSockets,raw.externalForwards,raw.consent],[[],[],0,'rejected']);
            assert(raw.local.length>0);
            assert.equal(raw.documentRequests.length,1);
            const [req]=raw.documentRequests;
            assert.deepEqual([req.url,req.method,req.resourceType,req.mainFrame,req.redirected,req.status,req.body],
              [target,'GET','document',true,false,200,docBody]);
            assert.deepEqual([raw.documentResponse.url,raw.documentResponse.method,raw.documentResponse.status,raw.documentResponse.redirected,raw.documentResponse.body],
              [target,'GET',200,false,docBody]);
            const order=['criteria',reply,'retry'];
            assert.deepEqual(raw.wire.map(x=>x.kind),order);
            assert.deepEqual(raw.responses.map(x=>x.kind),order);
            for(const [i,kind] of order.entries()){
              const req=raw.wire[i],res=raw.responses[i],method=i===0?'POST':'GET',path=i===0?'/functions/v1/fantasy-draft-daily':'/rest/v1/fantasy_draft_players';
              assert.deepEqual([req.method,req.path,req.status,req.requestBody,req.forwarded,req.response],[method,path,200,null,false,expectedWire[kind]]);
              assert.deepEqual([res.method,res.status,new URL(res.url).pathname,res.body],[method,200,path,expectedWire[kind]]);
              assert(req.at<=req.releasedAt&&req.releasedAt<=req.fulfilledAt);
              assert.deepEqual(req.query,i===0?[]:[['select','id,name,position,nationality,market_value_millions,dominant_foot,age'],['order','name.asc']]);
            }
            assert(raw.knownRefused.every(x=>x.forwarded===false));
            assert.deepEqual(Object.keys(frames),steps);
            const nonce=frames.ready.nonce;
            assert.match(nonce,/^[0-9a-f-]{36}$/);
            assert(!nonces.has(nonce));
            nonces.add(nonce);
            assert.deepEqual(steps.map(k=>frames[k].playerReads),[0,1,1,1,2,2,2,2]);
            for(const f of Object.values(frames)){
              assert.deepEqual([f.url,f.width,f.height,f.nonce,f.immutableNonce,f.signedOut,f.completed],[target,width,height,nonce,true,true,false]);
              assert(f.scrollWidth<=width&&f.visible);
            }
            const opening={seat,round:1,pick:1,total:22,human:[],ai:[]};
            for(const k of ['firstPending','empty','emptyIdle','retryPending','admitted']){
              assert.deepEqual(frames[k].progress,opening);
              assert.deepEqual([frames[k].criterion,frames[k].ruleMode],['Under 25s: Every player must be 25 or younger','Enforced']);
            }
            for(const k of ['empty','emptyIdle']){
              const f=frames[k];
              assert.deepEqual([f.retryCount,f.retryEnabled,f.loading,f.pool,f.slots],[1,true,false,false,[0,0]]);
            }
            assert(frames.emptyIdle.recordedAt-frames.empty.recordedAt>=2300);
            assert.deepEqual([frames.retryPending.retryCount,frames.retryPending.loading,frames.retryPending.pool],[0,true,false]);
            assert.deepEqual([frames.admitted.retryCount,frames.admitted.loading,frames.admitted.pool,frames.admitted.slots],[0,false,true,[11,11]]);
            const resumed=frames.resumed.progress,used=[...resumed.human,...resumed.ai];
            assert.deepEqual([resumed.seat,resumed.round,resumed.pick,resumed.total,resumed.human.length,resumed.ai.length],
              ['user',2,seat==='user'?4:3,22,1,seat==='user'?2:1]);
            assert(new Set(used).size===used.length&&used.every(name=>names.has(name)));
            assert.deepEqual(raw.actions.map(a=>a.label),['Start Draft','Retry players',resumed.human[0]]);
            assert(raw.actions.every(a=>a.trusted&&a.pointerType===(width<1000?'touch':'mouse')));
            assert(raw.actions[0].at<=raw.wire[1].at&&raw.actions[1].at>=frames.emptyIdle.recordedAt&&raw.actions[1].at<=raw.wire[2].at);
            const photos=['empty','resumed'].map(k=>{
              const file=id+'-'+k+'.png',png=read('browser/'+file);
              assert(png.subarray(0,8).equals(Buffer.from([137,80,78,71,13,10,26,10])));
              assert.deepEqual([png.readUInt32BE(16),png.readUInt32BE(20)],[width,height]);
              return refs(file,png);
            });
            assert.deepEqual(row.screenshots,photos);
            assert.deepEqual(raw.screenshots,photos);
            entries.push(id+'.json',...photos.map(x=>x.file));
          }
          assert.deepEqual(fs.readdirSync(out+'/browser').sort(),entries.sort());
          return {status:'passed',cases:12,census,exactBuiltDocument:native.files.document,reportSHA256:sha(read('browser/report.json')),
            scope:'Native isolated HTTP200 null and empty-list recovery for both seats across three widths.'};
          })();
          assert.equal(checked.status,'passed');
          fs.writeFileSync(out+'/full-clean-result.json',JSON.stringify({status:'passed',head:source.head,tree:source.tree,
            codeConfigRows:source.codeConfigRows,productionBuilds:2,distFiles:dist.length,distTupleSHA256:sha(read('dist-fresh.json')),
            builtReaders:20,routeCaps:16,unitPassed:unit.numPassedTests,native:checked,sourceOfflineBytes:0,browserOfflineBytes:0,
            scope:'Fixed source, built route and fresh byte-identical rebuild. Fictional data and no publication.'},null,2)+'\n',{flag:'wx'});
          NODE
      - name: Verify unchanged physical source and locked offline run
