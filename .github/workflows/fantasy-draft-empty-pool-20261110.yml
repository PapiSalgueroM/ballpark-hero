name: Fantasy Draft empty pool full and clean production proof
on:
  push:
    branches: [codex/fantasy-draft-empty-pool-full-clean-qa-20261110]
permissions:
  actions: read
  contents: read
jobs:
  full-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    env:
      TZ: UTC
      SIM_NETWORK: offline
      SEO_SPLIT_BASE_REF: '3b14650d360b010b25b525de33a5f32f33de2798'
      EVIDENCE: fantasy-draft-empty-pool-full-clean
      SIM_OFFLINE_RECEIPT: fantasy-draft-empty-pool-full-clean/offline.log
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Join exact clean candidate with qualified source and fixed unit fixture
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test ! -e "$EVIDENCE"
          mkdir "$EVIDENCE"
          touch "$SIM_OFFLINE_RECEIPT"
          git rev-parse HEAD > "$EVIDENCE/head.txt"
          git rev-parse 'HEAD^{tree}' > "$EVIDENCE/tree.txt"
          git ls-files -s > "$EVIDENCE/source-before.txt"
          sha256sum package.json package-lock.json > "$EVIDENCE/locks-before.txt"
          git diff --exit-code HEAD -- .
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          import {execFileSync} from 'node:child_process';

          const inputs={"base":{"pr":543,"head":"71a7184a1c546767932ec259617d53d60a178901","tree":"57574165d664a30ba69dad567a412d7b9111ac50"},"qualified":{"run":42850968546,"job":129951206533,"artifact":13781041294,"steps":11,"zipBytes":2682452,"zipSHA256":"0fe93b0e011b4a5e02f310c6498e8947a0cd6e536c2f7e59133326a4b62f963e","head":"b72403765a30c5d01ae380490d792524bfbdc666","tree":"4c13ca3e21e210caa48e594bc107a86f3c61084f","workflow":"a6b5fb1fb4f4b5f098405b77f3daf8e266e31d42","path":".github/workflows/fantasy-draft-empty-pool-20261110.yml","branch":"codex/fantasy-draft-empty-pool-fixed-controls-qa-20261110","auditSHA256":"4592e93fe2bd9ec05d1631e35ca0d38881201de49a7776b52fa9eb07ca69fda1","raw":{"bytes":6538847,"sha256":"91e377ec6c7861a5fd90938b445bfc48349d72527d0efc17db70e06dc37c4995"}},"page":{"path":"src/pages/FantasyDraft.tsx","blob":"328b8632eea964f0010465d9e7bcd04990819853","bytes":25890,"sha256":"e34a7fa46c434d1a8f82da61bf8535228df1997ff83d84264bbcaae754e0f066","priorBlob":"a1ec7dda9bd2c7a7fc674b5471fc0dad63a67509","priorBytes":25883,"priorSHA256":"1d87eebfd41c85576edf2fc28f9f7d3df738e87dc143e8fce807d406885e6560"},"test":{"path":"src/test/fantasyDraftPoolRecovery.test.tsx","blob":"2f202331b41768892e888b4daa97bd54c4048446","sha256":"6e023d5273d08a3beca11de130dcd9b0311dceea3a9fb5ade85bb29d38841f8b","bytes":29976},"plan":{"path":"docs/plans/2026-11-10-fantasy-draft-empty-pool.md","blob":"f090008f80c10ee1fd220e19516d636d2f6adf39","sha256":"cd88200e546d7e00b079fcef1646f1fd42d37305d42317b83eeb15d6d3a1a01d","bytes":896}};
          const {base,qualified,page,test,plan}=inputs;
          const out=process.env.EVIDENCE,repo='PapiSalgueroM/ballpark-hero',workflow=qualified.path;
          const git=(...args)=>execFileSync('git',args,{encoding:'utf8',maxBuffer:16*1024*1024}).trimEnd();
          const sha=(algorithm,body)=>createHash(algorithm).update(body).digest('hex');
          const blob=body=>sha('sha1',Buffer.concat([Buffer.from('blob '+body.length+'\0'),body]));
          const head=git('rev-parse','HEAD'),tree=git('rev-parse','HEAD^{tree}');
          assert.equal(head,process.env.GITHUB_SHA);
          assert.equal(process.env.GITHUB_REPOSITORY,repo);
          assert.deepEqual(git('rev-list','--parents','-n','1',head).split(' '),[head,base.head]);
          assert.equal(git('rev-parse',base.head+'^{tree}'),base.tree);
          git('fetch','--no-tags','--depth=1','origin',qualified.head);
          assert.equal(git('rev-parse',qualified.head+'^{tree}'),qualified.tree);
          assert.equal(git('rev-parse',qualified.head+':'+workflow),qualified.workflow);
          const all=ref=>git('ls-tree','-r','-z',ref).split('\0').filter(Boolean);
          const at=row=>row.split('\t')[1];
          const owned=[page.path,test.path,plan.path,workflow];
          const held=rows=>rows.filter(row=>!owned.includes(at(row)));
          const prev=all(base.head),curr=all(head),passed=all(qualified.head);
          assert.deepEqual([prev.length,curr.length,held(curr).length,passed.length],[5802,5804,5800,5804]);
          assert.deepEqual(held(curr),held(prev));
          assert.deepEqual(curr.filter(row=>at(row)!==workflow),passed.filter(row=>at(row)!==workflow));
          assert.deepEqual(git('diff','--name-status','--no-renames',base.head,head).split('\n').sort(),
            ['M\t'+page.path,'M\t'+test.path,'A\t'+plan.path,'A\t'+workflow].sort());
          for(const item of [page,test,plan]){
            const body=fs.readFileSync(item.path);
            assert.deepEqual([body.length,sha('sha256',body),blob(body)],[item.bytes,item.sha256,item.blob]);
          }
          const configs=new Set(['index.html','package.json','package-lock.json','bun.lock','bun.lockb','vite.config.ts','tailwind.config.ts',
            'postcss.config.js','tsconfig.json','tsconfig.app.json','tsconfig.node.json']);
          const scoped=curr.filter(row=>/^(src|public|scripts)\//.test(at(row))||configs.has(at(row)));
          assert.equal(scoped.length,4680);
          assert.equal(scoped.filter(row=>configs.has(at(row))).length,11);
          const api=process.env.GITHUB_API_URL+'/repos/'+repo;
          const get=async suffix=>{
            const response=await fetch(api+suffix,{headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+process.env.GH_TOKEN,
              'X-GitHub-Api-Version':'2022-11-28'},redirect:'error'});
            assert.equal(response.status,200,suffix);
            return response.json();
          };
          const [run,jobs,artifacts]=await Promise.all([get('/actions/runs/'+qualified.run),get('/actions/runs/'+qualified.run+'/jobs?per_page=100'),get('/actions/runs/'+qualified.run+'/artifacts?per_page=100')]);
          assert.deepEqual([run.id,run.status,run.conclusion,run.event,run.run_attempt,run.path,run.head_sha,run.head_commit.tree_id,run.head_branch],
            [qualified.run,'completed','success','push',1,workflow,qualified.head,qualified.tree,qualified.branch]);
          assert.deepEqual([jobs.jobs.length,artifacts.artifacts.length],[1,1]);
          const [job]=jobs.jobs,[archive]=artifacts.artifacts;
          assert.deepEqual([job.id,job.name,job.steps.length,archive.id,archive.size_in_bytes,archive.digest,archive.expired,archive.workflow_run.id,archive.workflow_run.head_sha],
            [qualified.job,'fixed-controls',qualified.steps,qualified.artifact,qualified.zipBytes,'sha256:'+qualified.zipSHA256,false,qualified.run,qualified.head]);
          assert(job.steps.every(step=>step.status==='completed'&&step.conclusion==='success'));
          fs.copyFileSync(workflow,out+'/candidate-workflow.yml');
          fs.copyFileSync(page.path,out+'/candidate-page.tsx');
          fs.copyFileSync(test.path,out+'/candidate-test.tsx');
          fs.writeFileSync(out+'/code-config-tuples.txt',scoped.join('\n')+'\n');
          fs.writeFileSync(out+'/source-join.json',JSON.stringify({status:'passed',head,tree,parent:base.head,parentTree:base.tree,
            workflow:git('rev-parse','HEAD:'+workflow),trackedRows:5804,heldRows:5800,scopedSourceRows:4669,rootConfigurations:11,codeConfigRows:4680,
            fullProductJoinsQualifiedFixedControls:true,inputs},null,2)+'\n');
          NODE
          fixed_id=$(node -p "require('./$EVIDENCE/source-join.json').inputs.qualified.artifact")
          fixed_size=$(node -p "require('./$EVIDENCE/source-join.json').inputs.qualified.zipBytes")
          fixed_sha=$(node -p "require('./$EVIDENCE/source-join.json').inputs.qualified.zipSHA256")
          fixed_zip="$RUNNER_TEMP/fantasy-draft-empty-fixed-controls.zip"
          gh api "repos/PapiSalgueroM/ballpark-hero/actions/artifacts/$fixed_id/zip" > "$fixed_zip"
          test "$(wc -c < "$fixed_zip")" -eq "$fixed_size"
          printf '%s  %s\n' "$fixed_sha" "$fixed_zip" | sha256sum -c -
          unzip -Z1 "$fixed_zip" > "$EVIDENCE/fixed-zip-entries.txt"
          test "$(grep -Fxc 'fixed/public-cases.raw.json' "$EVIDENCE/fixed-zip-entries.txt")" -eq 1
          unzip -p "$fixed_zip" fixed/public-cases.raw.json > "$EVIDENCE/fixed-reference.raw.json"
          raw_size=$(node -p "require('./$EVIDENCE/source-join.json').inputs.qualified.raw.bytes")
          raw_sha=$(node -p "require('./$EVIDENCE/source-join.json').inputs.qualified.raw.sha256")
          test "$(wc -c < "$EVIDENCE/fixed-reference.raw.json")" -eq "$raw_size"
          printf '%s  %s\n' "$raw_sha" "$EVIDENCE/fixed-reference.raw.json" | sha256sum -c -
      - name: Install locked dependencies, freeze physical source, and verify app types
        run: |
          set -euo pipefail
          npm ci 2>&1 | tee "$EVIDENCE/install.log"
          cat > "$EVIDENCE/physical.mjs" <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          const stage = process.argv[2];
          assert(['before', 'after'].includes(stage));
          const out = process.env.EVIDENCE;
          const index = execFileSync('git', ['ls-files', '-z'], { encoding: 'utf8' }).split('\0').filter(Boolean);
          const source = index.map(file => {
            const bytes = fs.readFileSync(file);
            return [file, bytes.length, createHash('sha256').update(bytes).digest('hex')];
          });
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const installed = Object.entries(lock.packages).filter(([file]) =>
            file.startsWith('node_modules/') && fs.existsSync(file + '/package.json')
          ).map(([file, entry]) => {
            const version = JSON.parse(fs.readFileSync(file + '/package.json', 'utf8')).version;
            assert.equal(version, entry.version, file);
            return [file, version];
          });
          assert.equal(source.length, 5804);
          assert.equal(installed.length, 521);
          assert.equal(fs.statSync(process.env.SIM_OFFLINE_RECEIPT).size, 0);
          for (const [name, data] of [['tracked', source], ['installed', installed]]) {
            const body = JSON.stringify(data);
            if (stage === 'after') assert.equal(body, fs.readFileSync(out + '/' + name + '-before.json', 'utf8'));
            fs.writeFileSync(out + '/' + name + '-' + stage + '.json', body);
          }
          NODE
          node "$EVIDENCE/physical.mjs" before
          node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee "$EVIDENCE/types.log"
      - name: Preserve focused pool, daily criteria, and formation outcomes
        run: |
          set -euo pipefail
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node_modules/.bin/vitest run \
            src/test/fantasyDraftPoolRecovery.test.tsx src/test/fantasyDraftCriteriaStart.test.tsx src/test/fantasyDraftFormation.test.tsx \
            --testTimeout=60000 --no-file-parallelism --reporter=json --outputFile="$EVIDENCE/unit.json" 2>&1 | tee "$EVIDENCE/unit.log"
          test ! -s "$SIM_OFFLINE_RECEIPT"
      - name: Build the qualified production tree and retain every file
        id: build
        run: |
          set -euo pipefail
          test ! -e dist
          NODE_OPTIONS="--max-old-space-size=6144" npm run build 2>&1 | tee "$EVIDENCE/build.log"
          cat > "$EVIDENCE/dist-measure.mjs" <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          const [root,label]=process.argv.slice(2);
          assert.equal(root,'dist');
          assert(['before','after','fresh'].includes(label));
          const walk=dir=>fs.readdirSync(dir,{withFileTypes:true}).flatMap(entry=>{
            const file=dir+'/'+entry.name;
            if(entry.isDirectory())return walk(file);
            assert(entry.isFile(),file);
            return [file];
          });
          const files=walk(root).sort((a,b)=>a.localeCompare(b));
          assert.equal(files.length,850);
          assert.equal(new Set(files).size,850);
          const list=files.map(file=>{
            const body=fs.readFileSync(file);
            return {file,bytes:body.length,sha256:createHash('sha256').update(body).digest('hex')};
          });
          fs.writeFileSync(process.env.EVIDENCE+'/dist-'+label+'.json',JSON.stringify(list),{flag:'wx'});
          NODE
          node "$EVIDENCE/dist-measure.mjs" dist before
          tar -czf "$EVIDENCE/dist.tgz" dist
          sha256sum "$EVIDENCE/dist.tgz" > "$EVIDENCE/dist.sha256"
      - name: Isolated pinned Playwright and Chromium
        id: browser_setup
        timeout-minutes: 12
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          python -m pip install fonttools pillow
          npm install --prefix "$RUNNER_TEMP/fantasy-draft-empty-pool-browser" --no-save --package-lock=false playwright@1.64.1 2>&1 | tee fantasy-draft-empty-pool-full-clean/browser-install.log
          test ! -e node_modules/playwright
          test ! -e node_modules/playwright-core
          ln -s "$RUNNER_TEMP/fantasy-draft-empty-pool-browser/node_modules/playwright" node_modules/playwright
          ln -s "$RUNNER_TEMP/fantasy-draft-empty-pool-browser/node_modules/playwright-core" node_modules/playwright-core
          node "$RUNNER_TEMP/fantasy-draft-empty-pool-browser/node_modules/playwright/cli.js" install --with-deps chromium 2>&1 | tee fantasy-draft-empty-pool-full-clean/chromium-install.log
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const before=JSON.parse(fs.readFileSync('fantasy-draft-empty-pool-full-clean/installed-before.json'));
          const after=before.map(([p])=>[p,JSON.parse(fs.readFileSync(p+'/package.json')).version]);assert.deepEqual(after,before);
          const {createRequire}=await import('node:module');
          const require=createRequire(process.cwd()+'/package.json');
          const target=fs.realpathSync('node_modules/playwright'),coreTarget=fs.realpathSync('node_modules/playwright-core');
          const pw=JSON.parse(fs.readFileSync(target+'/package.json')),core=JSON.parse(fs.readFileSync(coreTarget+'/package.json'));
          assert.deepEqual([pw.version,core.version],['1.64.1','1.64.1']);
          const coreEntry=require.resolve('playwright-core');
          assert(coreEntry.startsWith(coreTarget+'/'));
          assert.equal(createRequire(target+'/package.json').resolve('playwright-core'),coreEntry);
          fs.writeFileSync('fantasy-draft-empty-pool-full-clean/installed-after.json',JSON.stringify(after));
          fs.writeFileSync('fantasy-draft-empty-pool-full-clean/browser-package.json',JSON.stringify({
            version:pw.version,target,coreVersion:core.version,coreTarget,coreEntry,sharedOfflineGuardResolution:true,
          }));
          NODE
      - name: All required built readers and existing source fences
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.browser_setup.outcome == 'success' }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$SEO_SPLIT_BASE_REF"
          export ONLY="simAdsense,simBrand,simHeadTags,simHiddenPages,simHubs,simIndexNow,simIndexing,simInternalLinks,simNoRivalNames,simPrerender,simPrerenderBoot,simRetiredRoutes,simSchema,simSitemap,simSnapshotAssets,simSiteSearch,simGuideHeadings,simSeoMetaSplit,simHomeCopy,simHarnessAnchors"
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/runAllSims.mjs --browser 2>&1 | tee fantasy-draft-empty-pool-full-clean/readers.log
      - name: All original route download limits
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.browser_setup.outcome == 'success' }}
        run: |
          set -euo pipefail
          test ! -s "$SIM_OFFLINE_RECEIPT"
          test ! -e "$EVIDENCE/weight-asset-blocks.jsonl"
          touch "$EVIDENCE/weight-asset-blocks.jsonl"
          owned_weight="$PWD/$(mktemp --suffix=.mjs scripts/.bingo-sweepWeight.XXXXXX)"
          weight_host_pid=''
          cleanup_weight() {
            if test -n "$weight_host_pid"; then
              kill "$weight_host_pid" 2>/dev/null || true
              wait "$weight_host_pid" 2>/dev/null || true
            fi
            rm -f -- "$owned_weight"
          }
          trap cleanup_weight EXIT
          node --input-type=module - "$owned_weight" <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import path from 'node:path';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';

          const spec={"file":"scripts/sweepWeight.mjs","blob":"5a92a68cc0225d5e633c19e041087e7c6c4254e8","bytes":104848,"sha256":"afdd281ce2984ca34158194a0d6102bd053f2f8d242bc844c19f8f536b08d627","changedBytes":105985,"changedSHA256":"b7edf531df56816d5b5103f4c08686790f083b4940f6c6abf7664dc3108de8b6","changedBlob":"2375a75116c540fde0fdd94c3cee074968905b47","anchorOffset":90355,"anchor":"  if (process.env.SWEEP_OFFLINE === '1') await ctx.route(/supabase\\.co/, r => r.abort());","change":"  if (process.env.SWEEP_OFFLINE === '1') {\n    await ctx.route(/supabase\\.co/, r => r.abort());\n    await ctx.route(url => url.origin === 'https://fonts.googleapis.com' || url.origin === 'https://flagcdn.com', async r => {\n      const request = r.request();\n      const url = new URL(request.url());\n      const type = request.resourceType();\n      const fonts = url.origin === 'https://fonts.googleapis.com' && url.pathname === '/css2' &&\n        JSON.stringify([...url.searchParams]) === JSON.stringify([\n          ['family', 'Space Grotesk:wght@400;500;600;700'],\n          ['family', 'Inter:wght@400;500;600;700'],\n          ['display', 'swap'],\n        ]) && type === 'stylesheet';\n      const flag = url.origin === 'https://flagcdn.com' &&\n        /^\\/w(?:20|40|80|160|320)\\/[a-z]{2}(?:-[a-z]{3})?\\.png$/.test(url.pathname) &&\n        !url.search && type === 'image';\n      if (request.method() !== 'GET' || (!fonts && !flag)) return r.fallback();\n      await r.abort('blockedbyclient');\n      fs.appendFileSync(process.env.PLAYER_BINGO_WEIGHT_ASSET_RECEIPT, JSON.stringify({\n        route, url: url.href, method: request.method(), resourceType: type, disposition: 'aborted-before-network',\n      }) + '\\n');\n    });\n  }"};
          const [target]=process.argv.slice(2),out=process.env.EVIDENCE;
          const src=fs.readFileSync(spec.file);
          const sha=(algorithm,bytes)=>createHash(algorithm).update(bytes).digest('hex');
          const blob=bytes=>sha('sha1',Buffer.concat([Buffer.from('blob '+bytes.length+'\0'),bytes]));
          assert.equal(path.dirname(target),path.resolve('scripts'));
          assert.match(path.basename(target),/^\.bingo-sweepWeight\.[A-Za-z0-9]+\.mjs$/);
          assert(fs.lstatSync(target).isFile()&&fs.statSync(target).size===0);
          assert.deepEqual([src.length,sha('sha256',src),blob(src)],[spec.bytes,spec.sha256,spec.blob]);
          assert.equal(execFileSync('git',['rev-parse','HEAD:'+spec.file],{encoding:'utf8'}).trim(),spec.blob);
          const original=src.toString('utf8');
          assert.equal(original.split(spec.anchor).length,2);
          assert.equal(Buffer.byteLength(original.slice(0,original.indexOf(spec.anchor))),spec.anchorOffset);
          const changed=original.replace(spec.anchor,spec.change);
          assert.equal(changed.split(spec.change).length,2);
          assert.equal(changed.replace(spec.change,spec.anchor),original);
          const prepared=Buffer.from(changed);
          assert.deepEqual([prepared.length,sha('sha256',prepared),blob(prepared)],[spec.changedBytes,spec.changedSHA256,spec.changedBlob]);
          fs.writeFileSync(target,prepared);
          fs.writeFileSync(out+'/weight-source-proof.json',JSON.stringify({
            status:'passed',file:spec.file,blob:spec.blob,bytes:spec.bytes,sha256:spec.sha256,
            changedBlob:spec.changedBlob,changedBytes:spec.changedBytes,changedSHA256:spec.changedSHA256,
            anchorOffset:spec.anchorOffset,anchorBytes:Buffer.byteLength(spec.anchor),replacementBytes:Buffer.byteLength(spec.change),
            exactWholeInverse:true,trackedSourceChanged:false,temporarySibling:true,
          },null,2)+'\n',{flag:'wx'});
          NODE
          node scripts/lib/hostLikeServer.mjs dist 4173 > "$EVIDENCE/weight-host.log" 2>&1 &
          weight_host_pid=$!
          weight_ready=0
          for attempt in $(seq 1 40); do
            kill -0 "$weight_host_pid"
            if curl --noproxy '*' --silent --fail --max-time 1 http://127.0.0.1:4173/ -o /dev/null; then
              weight_ready=1
              break
            fi
            sleep 0.25
          done
          test "$weight_ready" -eq 1
          PLAYER_BINGO_WEIGHT_ASSET_RECEIPT="$PWD/$EVIDENCE/weight-asset-blocks.jsonl" SWEEP_OFFLINE=1 \
            BASE=http://127.0.0.1:4173 NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" \
            node "$owned_weight" 2>&1 | tee "$EVIDENCE/weight.log"
          test ! -s "$SIM_OFFLINE_RECEIPT"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';

          const out=process.env.EVIDENCE;
          const raw=fs.readFileSync(out+'/weight-asset-blocks.jsonl','utf8');
          assert(raw.endsWith('\n'));
          const records=raw.trimEnd().split('\n').map(line=>JSON.parse(line));
          const log=fs.readFileSync(out+'/weight.log','utf8');
          const caps=log.split('\n').map(line=>/^\s+(\/\S*)\s+\d+K gz over/.exec(line)?.[1]).filter(Boolean);
          assert.equal(caps.length,16);
          const fonts=new Set();
          let flags=0;
          for(const item of records){
            const url=new URL(item.url);
            assert(caps.includes(item.route));
            assert.deepEqual([item.method,item.disposition],['GET','aborted-before-network']);
            if(url.origin==='https://fonts.googleapis.com'){
              assert.deepEqual([item.resourceType,url.pathname,[...url.searchParams]],['stylesheet','/css2',[
                ['family','Space Grotesk:wght@400;500;600;700'],
                ['family','Inter:wght@400;500;600;700'],
                ['display','swap'],
              ]]);
              fonts.add(item.route);
            }else{
              assert.deepEqual([item.resourceType,url.origin,url.search],['image','https://flagcdn.com','']);
              assert.match(url.pathname,/^\/w(?:20|40|80|160|320)\/[a-z]{2}(?:-[a-z]{3})?\.png$/);
              flags++;
            }
          }
          assert.deepEqual([...fonts].sort(),[...caps].sort());
          assert(flags>0,'At least one exact Flagcdn image intercepted');
          console.log('PASS explicit offline weight asset blocks across all 16 budget routes');
          NODE
      - name: Native successful-empty Fantasy Draft recovery across three viewports
        id: native
        timeout-minutes: 12
        run: |
          set -euo pipefail
          cat > "$EVIDENCE/native-helper.mjs" <<'FD_EMPTY_NATIVE'
          // Remote CI browser proof for successful empty Fantasy Draft player-pool replies.
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import { createHash, randomUUID } from 'node:crypto';
