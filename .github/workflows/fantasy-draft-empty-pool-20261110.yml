name: Fantasy Draft empty player pool original
on:
  push:
    branches: [codex/fantasy-draft-empty-pool-original-retry-qa-20261110]
permissions:
  actions: read
  contents: read
jobs:
  original:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: UTC
      SIM_NETWORK: offline
      SIM_OFFLINE_RECEIPT: fantasy-draft-empty-pool-original/offline.log
      FD_POOL_RECOVERY_RAW: fantasy-draft-empty-pool-original/public-cases.raw.json
      BASE_HEAD: '71a7184a1c546767932ec259617d53d60a178901'
      BASE_TREE: '57574165d664a30ba69dad567a412d7b9111ac50'
      HELPER_BLOB: '2f202331b41768892e888b4daa97bd54c4048446'
      PLAN_BLOB: 'f090008f80c10ee1fd220e19516d636d2f6adf39'
      EVIDENCE: fantasy-draft-empty-pool-original
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - name: Authenticate admitted active entry and exact original Fantasy Draft source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test ! -e "$EVIDENCE"
          if grep -Eq '__[A-Z][A-Z0-9_]*__' .github/workflows/fantasy-draft-empty-pool-20261110.yml; then echo 'Unresolved original workflow binding'; exit 1; fi
          mkdir "$EVIDENCE"
          touch "$SIM_OFFLINE_RECEIPT"
          git rev-parse HEAD > "$EVIDENCE/head.txt"
          git rev-parse 'HEAD^{tree}' > "$EVIDENCE/tree.txt"
          git ls-files -s > "$EVIDENCE/source-before.txt"
          sha256sum package.json package-lock.json > "$EVIDENCE/locks-before.txt"
          git diff --exit-code HEAD -- .
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';

          const { BASE_HEAD, BASE_TREE, HELPER_BLOB, PLAN_BLOB, EVIDENCE: out } = process.env;
          const repo = 'PapiSalgueroM/ballpark-hero';
          const workflow = '.github/workflows/fantasy-draft-empty-pool-20261110.yml';
          const helper = 'src/test/fantasyDraftPoolRecovery.test.tsx';
          const plan = 'docs/plans/2026-11-10-fantasy-draft-empty-pool.md';
          const edge = 'src/pages/FantasyDraft.tsx';
          const preflight = {"run":42846374711,"job":129934813961,"artifact":13777284411,"steps":11,"zipBytes":1015269,"zipSHA256":"bb09a8ebad7621ebc7d4cf619170d853f03ed0223569cb711cc1d88da3d05ea6","head":"1c7d596c845fff2ec9ed03cb8394a11ce214c714","tree":"4dceaa18dce325107fc99f459ac00a2d5e3ad844","branch":"codex/fantasy-draft-empty-pool-preflight-qa-20261110","workflow":"51b1d2247a8f5795f4fe106dc8aa1743c0099409","independentAuditSHA256":"4f78c5d42f30cec04edd97d5d360943950d997d265107c07daaab61d1f760838"};
          const held = {"src/App.tsx":"8bfedf7aaa1d076e0f0c8e2216c7e46632cd8a33","src/data/gameRegistry.ts":"f560b40a74d1468ac72dfde4ee6fec6635a9a255","public/fantasy-draft/index.html":"c2d51909d1e2f4b50c8b37f504d1cd5fdd0f47f5","public/prerender-boot.js":"85939d3b80ef41b26ff6cbefb53a66e383d1a797","src/pages/FantasyDraft.tsx":"a1ec7dda9bd2c7a7fc674b5471fc0dad63a67509","src/lib/fantasyCriteria.ts":"f6f7d27ee0af80e4386e650a9d7128cd89702f90","src/test/fantasyDraftPoolRecovery.test.tsx":"ab43be6a72f000cbf50c0bb557408e1f7108201c","supabase/functions/fantasy-draft-daily/index.ts":"8a717f89d3545593cc37b37631dd0a5929dac80d","src/test/fantasyDraftCriteriaStart.test.tsx":"4e9d54803677696454ef0cbbf155182192e03769","scripts/lib/offlineTransport.cjs":"0fda542a2649fe5da937c6976fd0f5b6073e74b6","scripts/lib/hostLikeServer.mjs":"21059d5e8114669df61106c125d5272d357b6236","index.html":"12598fe720eec4fc88d3d33c53ede612d018150c","package.json":"2ff64986fb76ebc51b706f2fd24765768874008a","package-lock.json":"97d6f12a052f25f400462938c241789a083f0bfe","vite.config.ts":"0112b6ac4f2ad80b2fc04f9ec2f7185300913e7d","tailwind.config.ts":"f83c4f4032d359bc9285828eac3b0961a46c6b17","postcss.config.js":"2aa7205d4b402a1bdfbe07110c61df920b370066","tsconfig.json":"6b68d80b7d92d0c4a5d774897f2bedfa95b42669","tsconfig.app.json":"51f581dd91641b4c1f1219f646788e73cf6bf00c","tsconfig.node.json":"3133162c20350e1741b94b8d2ff77b811bec8363","bun.lockb":"5d9d33a3bf4f45fa099e2aa3014149e034981149","bun.lock":"dff081dcd34a1aa928ddc90d910774a6b855dfe3"};
          assert.equal(process.env.GITHUB_REPOSITORY,repo);
          const api = process.env.GITHUB_API_URL + '/repos/' + repo;
          const request = async path => {
            const response = await fetch(api+path,{headers:{
              Accept:'application/vnd.github+json',Authorization:'Bearer '+process.env.GH_TOKEN,
              'X-GitHub-Api-Version':'2022-11-28',
            },redirect:'error'});
            assert.equal(response.status,200,path);
            return response.json();
          };
          const [run,jobs,artifacts] = await Promise.all([
            request('/actions/runs/'+preflight.run),request('/actions/runs/'+preflight.run+'/jobs?per_page=100'),
            request('/actions/runs/'+preflight.run+'/artifacts?per_page=100'),
          ]);
          assert.deepEqual([run.id,run.status,run.conclusion,run.event,run.run_attempt,run.path,run.head_sha,run.head_commit.tree_id,run.head_branch,run.repository.full_name],
            [preflight.run,'completed','success','push',1,workflow,preflight.head,preflight.tree,preflight.branch,repo]);
          assert.equal(jobs.jobs.length,1);
          const [job] = jobs.jobs;
          assert.deepEqual([job.id,job.run_id,job.name,job.status,job.conclusion,job.head_sha,job.steps.length],
            [preflight.job,preflight.run,'preflight','completed','success',preflight.head,preflight.steps]);
          assert(job.steps.every(step => step.status==='completed' && step.conclusion==='success'));
          assert.equal(artifacts.artifacts.length,1);
          const [artifact] = artifacts.artifacts;
          assert.deepEqual([artifact.id,artifact.name,artifact.expired,artifact.size_in_bytes,artifact.digest,artifact.workflow_run.id,artifact.workflow_run.head_sha],
            [preflight.artifact,'fantasy-draft-empty-pool-active-preflight-'+preflight.run,false,preflight.zipBytes,'sha256:'+preflight.zipSHA256,preflight.run,preflight.head]);
          delete process.env.GH_TOKEN;
          const git = (...args) => execFileSync('git',args,{encoding:'utf8',maxBuffer:16*1024*1024}).trimEnd();
          const sha = (algorithm,body) => createHash(algorithm).update(body).digest('hex');
          const blob = body => sha('sha1',Buffer.concat([Buffer.from('blob '+body.length+'\0'),body]));
          const head = git('rev-parse','HEAD');
          assert.equal(head,process.env.GITHUB_SHA);
          assert.deepEqual(git('rev-list','--parents','-n','1','HEAD').split(' '),[head,BASE_HEAD]);
          assert.equal(git('rev-parse',BASE_HEAD+'^{tree}'),BASE_TREE);
          const pins = {...held,[helper]:HELPER_BLOB,[plan]:PLAN_BLOB};
          for(const [file,want] of Object.entries(pins)){
            assert.match(want,/^[0-9a-f]{40}$/);
            assert.equal(git('rev-parse','HEAD:'+file),want,file);
            assert.equal(blob(fs.readFileSync(file)),want,file+' physical bytes');
            if(Object.hasOwn(held,file)) assert.equal(git('rev-parse',BASE_HEAD+':'+file),held[file],file+' admitted base');
          }
          const owned = [helper,plan,workflow].sort();
          assert.deepEqual(git('diff','--name-status','--no-renames',BASE_HEAD,'HEAD').split('\n').sort(),owned.map(file=>(file===helper?'M':'A')+'\t'+file).sort());
          const tree = ref => git('ls-tree','-r','-z',ref).split('\0').filter(Boolean);
          const pathOf = row => row.split('\t')[1];
          const previous = tree(BASE_HEAD), current = tree('HEAD');
          assert.deepEqual([previous.length,current.length],[5802,5804]);
          assert.deepEqual(current.filter(row => !owned.includes(pathOf(row))),previous.filter(row => pathOf(row)!==helper));
          assert.deepEqual(current.filter(row => owned.includes(pathOf(row))).map(row => row.split(' ')[0]),['100644','100644','100644']);
          assert.equal(current.filter(row => /^(src|public|scripts)\//.test(pathOf(row))).length,4669);
          const selected = { 'held-fantasy-draft-page.tsx':edge, 'candidate-test.tsx':helper, 'candidate-plan.md':plan, 'candidate-workflow.yml':workflow };
          const selectedBodies = Object.entries(selected).map(([file,path]) => {
            const bytes = fs.readFileSync(path);
            fs.writeFileSync(out+'/'+file,bytes);
            return {file,path,bytes:bytes.length,sha256:sha('sha256',bytes),blob:blob(bytes)};
          });
          fs.writeFileSync(out+'/source-receipt.json',JSON.stringify({
            status:'passed',head,tree:git('rev-parse','HEAD^{tree}'),parent:BASE_HEAD,parentTree:BASE_TREE,basePR:543,
            activePreflight:preflight,route:'/fantasy-draft',category:'Soccer',owned,pins,selectedBodies,
            heldRows:5801,trackedRows:5804,scopedSourceRows:4669,rootConfigurations:11,productUnchanged:true,
          },null,2)+'\n');
          NODE
      - name: Install locked dependencies, freeze physical source, and verify app types
        run: |
          set -euo pipefail
          npm ci 2>&1 | tee "$EVIDENCE/install.log"
          cat > "$EVIDENCE/physical.mjs" <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          const stage = process.argv[2];
          assert(['before', 'after'].includes(stage));
          const out = process.env.EVIDENCE;
          const index = execFileSync('git', ['ls-files', '-z'], { encoding: 'utf8' }).split('\0').filter(Boolean);
          const source = index.map(file => {
            const bytes = fs.readFileSync(file);
            return [file, bytes.length, createHash('sha256').update(bytes).digest('hex')];
          });
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const installed = Object.entries(lock.packages).filter(([file]) =>
            file.startsWith('node_modules/') && fs.existsSync(file + '/package.json')
          ).map(([file, entry]) => {
            const version = JSON.parse(fs.readFileSync(file + '/package.json', 'utf8')).version;
            assert.equal(version, entry.version, file);
            return [file, version];
          });
          assert.equal(source.length, 5804);
          assert.equal(installed.length, 521);
          assert.equal(fs.statSync(process.env.SIM_OFFLINE_RECEIPT).size, 0);
          for (const [name, data] of [['tracked', source], ['installed', installed]]) {
            const body = JSON.stringify(data);
            if (stage === 'after') assert.equal(body, fs.readFileSync(out + '/' + name + '-before.json', 'utf8'));
            fs.writeFileSync(out + '/' + name + '-' + stage + '.json', body);
          }
          NODE
          node "$EVIDENCE/physical.mjs" before
          node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee "$EVIDENCE/types.log"
      - name: Require the original Fantasy Draft empty player-pool mismatch
        run: |
          set -euo pipefail
          test ! -e "$FD_POOL_RECOVERY_RAW"
          export FD_POOL_RECOVERY_RAW="$PWD/$FD_POOL_RECOVERY_RAW"
          result=0
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" timeout --signal=TERM 90s \
            node_modules/.bin/vitest run src/test/fantasyDraftPoolRecovery.test.tsx src/test/fantasyDraftCriteriaStart.test.tsx --testTimeout=60000 --no-file-parallelism --reporter=json --outputFile="$EVIDENCE/vitest-result.json" > "$EVIDENCE/helper.log" 2>&1 || result=$?
          cat "$EVIDENCE/helper.log"
          printf '%s\n' "$result" > "$EVIDENCE/helper-exit.txt"
          test "$result" -eq 1
          test -s "$FD_POOL_RECOVERY_RAW"
          test ! -s "$SIM_OFFLINE_RECEIPT"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';

          const out = process.env.EVIDENCE;
          const marker = 'FD_POOL_EMPTY_';
          const log = fs.readFileSync(out+'/helper.log','utf8');
          const vitest = JSON.parse(fs.readFileSync(out+'/vitest-result.json','utf8'));
          assert.deepEqual([vitest.numTotalTests,vitest.numFailedTests,vitest.numPassedTests,vitest.numPendingTests,vitest.numTodoTests,vitest.success],
            [12,4,8,0,0,false],'Exactly four expected failures and eight healthy outcomes');
          assert.equal(vitest.testResults.length,2);
          const suite = suffix => vitest.testResults.find(row=>row.name.endsWith(suffix));
          const poolSuite=suite('/src/test/fantasyDraftPoolRecovery.test.tsx'),criteriaSuite=suite('/src/test/fantasyDraftCriteriaStart.test.tsx');
          assert.deepEqual([poolSuite.status,criteriaSuite.status],['failed','passed'],'Exact physical test-file outcomes');
          assert.equal(poolSuite.assertionResults.length,8);
          assert.equal(criteriaSuite.assertionResults.length,4);
          assert(criteriaSuite.assertionResults.every(row=>row.status==='passed'&&row.failureMessages.length===0));
          const errors=poolSuite.assertionResults.filter(row=>row.status==='failed').map(row=>{
            assert.equal(row.failureMessages.length,1);
            const message=row.failureMessages[0].replace(/\x1b\[[0-9;]*m/g,'');
            assert(message.startsWith('AssertionError: '+marker),'Only owned actual empty pool failures');
            return {title:row.title,message:message.split('\n')[0]};
          });
          assert.equal(errors.length,4);
          assert(!/UnhandledPromiseRejection|ERR_MODULE_NOT_FOUND|ERR_UNKNOWN_FILE_EXTENSION|SIM_OFFLINE_BLOCK|Unhandled Errors/i.test(log));
          const raw = fs.readFileSync(process.env.FD_POOL_RECOVERY_RAW);
          const evidence = JSON.parse(raw.toString('utf8'));
          const checks = (() => {
          assert.equal(raw.toString('utf8'),JSON.stringify(evidence)+'\n');
          assert.equal(evidence.version,1);
          assert.equal(evidence.criteria,'Under 25s: Every player must be 25 or younger');
          assert.equal(evidence.fixture.length,27);
          assert(evidence.fixture.every(p=>p.id.startsWith('fixture-')&&p.name.startsWith('Fixture ')));
          const expected=[
            ['normalUser','user','success',null],['normalAi','ai','success',null],
            ['errorUser','user','resolved-error',null],['errorAi','ai','resolved-error',null],
            ['nullUser','user','resolved-null','FD_POOL_EMPTY_NULL_USER'],['nullAi','ai','resolved-null','FD_POOL_EMPTY_NULL_AI'],
            ['emptyUser','user','resolved-empty','FD_POOL_EMPTY_ARRAY_USER'],['emptyAi','ai','resolved-empty','FD_POOL_EMPTY_ARRAY_AI'],
          ];
          assert.deepEqual(evidence.cases.map(c=>[c.key,c.seat,c.firstPoolResponse]),expected.map(row=>row.slice(0,3)));
          assert.deepEqual(errors.map(e=>e.message.match(/^AssertionError: (FD_POOL_EMPTY_[A-Z_]+)\b/)?.[1]),expected.slice(4).map(row=>row[3]));
          const poolRows=new Map(poolSuite.assertionResults.map(row=>[row.title,row]));
          assert.equal(poolRows.size,8);
          const formation = (p,side) => p?.rosters[side]?.slots.filter(s=>s.name!==null).map(s=>s.name)??[];
          const progress=p=>({turn:p?.turn,round:p?.round,pick:p?.pick,total:p?.total,human:formation(p,'human'),ai:formation(p,'ai')});
          const finalBySeat={
            user:{turn:'user',round:2,pick:4,total:22,human:['Fixture FWD 00'],ai:['Fixture FWD 01','Fixture FWD 02']},
            ai:{turn:'user',round:3,pick:6,total:22,human:['Fixture FWD 00','Fixture FWD 01'],ai:['Fixture FWD 05','Fixture MID 00','Fixture MID 01']},
          };
          const observation=evidence.cases.map((c,i)=>{
            const row=poolRows.get(c.title),marker=expected[i][3],byLabel=name=>c.frames.find(f=>f.label===name);
            assert.equal(row?.status,marker?'failed':'passed',c.key);
            if(marker)assert(errors.some(e=>e.title===c.title&&e.message.startsWith('AssertionError: '+marker+':')),c.key);
            else assert.deepEqual(row.failureMessages,[],c.key);
            assert.equal(c.complete,true,c.key);
            assert.equal(c.error,null,c.key);
            assert(c.frames.every(f=>f.failures.length===0&&f.unexpectedTransport.length===0&&f.completions.length===0),c.key);
            const pending=byLabel('first-pool-pending');
            const settled=byLabel(marker?'first-pool-'+c.firstPoolResponse:c.firstPoolResponse==='success'?'first-pool-success':'first-pool-error');
            assert(pending&&settled,c.key+' exact pending and response labels');
            const final=byLabel('legal-progress-complete'),last=c.frames.at(-1);
            assert.equal(last.label,'after-teardown',c.key);
            assert.equal(last.page,null,c.key);
            assert.equal(last.pendingResponses,0,c.key);
            assert.equal(last.clock.fakeTimers,0,c.key);
            const firstPlayers=settled.transport.find(r=>r.kind==='players');
            assert(firstPlayers&&firstPlayers.response&&firstPlayers.settledAt!==null,c.key);
            assert.deepEqual(firstPlayers.calls.map(v=>[v.method,v.args]),[
              ['from',['fantasy_draft_players']],['select',['id, name, position, nationality, market_value_millions, dominant_foot, age']],['order',['name']],
            ],c.key);
            const heldAtOne={turn:c.seat,round:1,pick:1,total:22,human:[],ai:[]};
            assert.deepEqual(progress(pending.page),heldAtOne,c.key);
            if(marker){
              assert.deepEqual(firstPlayers.response,{data:c.firstPoolResponse==='resolved-null'?null:[],error:null,count:null,status:200,statusText:'OK'},c.key);
              assert.deepEqual(progress(settled.page),heldAtOne,c.key);
              assert.deepEqual(progress(final.page),heldAtOne,c.key);
              assert.deepEqual(settled.page.retry,[],c.key);
              assert.equal(final.actions.find(a=>a.name==='retry-player-pool')?.details.clicked,false,c.key);
              assert.equal(final.actions.find(a=>a.name==='settle-retry-pool')?.details.delivered,false,c.key);
              assert.equal(final.transport.filter(r=>r.kind==='players').length,1,c.key);
            }else{
              assert.deepEqual(progress(final.page),finalBySeat[c.seat],c.key);
              const count=c.firstPoolResponse==='resolved-error'?2:1;
              assert.equal(final.transport.filter(r=>r.kind==='players').length,count,c.key);
            }
            return {case:c.key,seat:c.seat,response:c.firstPoolResponse,marker,firstStatus:firstPlayers.response.status,
              firstRetryButtons:settled.page.retry.length,lastPick:final.page.pick,playerReads:final.transport.filter(r=>r.kind==='players').length};
          });
          return {status:'passed',cases:observation.length,expectedFailures:4,heldPoolPasses:4,heldCriteriaPasses:4,observations:observation,
            limits:'Fictional successful-empty pool replies. This source finding does not establish a reported live cause.'};
          })();
          assert.equal(checks.status,'passed');
          fs.writeFileSync(out+'/original-result.json',JSON.stringify({
            status:'expected-original-fantasy-draft-empty-pool-mismatch',marker,expectedProcessExit:1,
            assertions:errors,rawBytes:raw.length,rawSHA256:createHash('sha256').update(raw).digest('hex'),checks,
          },null,2)+'\n',{flag:'wx'});
          NODE
      - name: Verify unchanged physical source and locked offline run
        if: always()
        run: |
          set -euo pipefail
          git ls-files -s > "$EVIDENCE/source-after.txt"
          sha256sum package.json package-lock.json > "$EVIDENCE/locks-after.txt"
          cmp "$EVIDENCE/source-before.txt" "$EVIDENCE/source-after.txt"
          cmp "$EVIDENCE/locks-before.txt" "$EVIDENCE/locks-after.txt"
          git diff --exit-code HEAD -- .
          node "$EVIDENCE/physical.mjs" after
          test ! -s "$SIM_OFFLINE_RECEIPT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fantasy-draft-empty-pool-original-${{ github.run_id }}
          path: fantasy-draft-empty-pool-original
          retention-days: 14
          if-no-files-found: error
