name: Fantasy Draft empty pool fixed and physical controls
on:
  push:
    branches: [codex/fantasy-draft-empty-pool-fixed-controls-qa-20261110]
permissions:
  actions: read
  contents: read
jobs:
  fixed-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      TZ: UTC
      SIM_NETWORK: offline
      EVIDENCE: fantasy-draft-empty-pool-fixed-controls
      SIM_OFFLINE_RECEIPT: fantasy-draft-empty-pool-fixed-controls/offline.log
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - name: Authenticate exact original, fixed source, and retained original RAW
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test ! -e "$EVIDENCE"
          mkdir "$EVIDENCE"
          touch "$SIM_OFFLINE_RECEIPT"
          git rev-parse HEAD > "$EVIDENCE/head.txt"
          git rev-parse 'HEAD^{tree}' > "$EVIDENCE/tree.txt"
          git ls-files -s > "$EVIDENCE/source-before.txt"
          sha256sum package.json package-lock.json > "$EVIDENCE/locks-before.txt"
          git diff --exit-code HEAD -- .
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          const inputs = {"base":{"pr":543,"head":"71a7184a1c546767932ec259617d53d60a178901","tree":"57574165d664a30ba69dad567a412d7b9111ac50"},"original":{"run":42849772916,"job":129946912061,"artifact":13779408695,"steps":11,"zipBytes":1411799,"zipSHA256":"93a616e1969e2ef32ad10fddd1af561fa5b6e02aa594e04d7997e37e6bb45589","head":"0391e62a0704270e9fbd06d44f339c9e54b450d3","tree":"01d825fa15a845a5cdfcb07bb74267dc0cc4e854","workflow":"d5b45558af1eee4cddff2e5c20669d51ba315801","path":".github/workflows/fantasy-draft-empty-pool-20261110.yml","branch":"codex/fantasy-draft-empty-pool-original-retry-qa-20261110","auditSHA256":"6422570d421d9c26093651520f4086ca618475b14ce4bdf58b86a78b2ca17a85","raw":{"bytes":6461011,"sha256":"7394808c1e25a04a8db26889c1428822f343d369cc89b9ec888ec5d673f0cb0d"}},"page":{"path":"src/pages/FantasyDraft.tsx","blob":"328b8632eea964f0010465d9e7bcd04990819853","bytes":25890,"sha256":"e34a7fa46c434d1a8f82da61bf8535228df1997ff83d84264bbcaae754e0f066","priorBlob":"a1ec7dda9bd2c7a7fc674b5471fc0dad63a67509","priorBytes":25883,"priorSHA256":"1d87eebfd41c85576edf2fc28f9f7d3df738e87dc143e8fce807d406885e6560"},"test":{"path":"src/test/fantasyDraftPoolRecovery.test.tsx","blob":"2f202331b41768892e888b4daa97bd54c4048446","sha256":"6e023d5273d08a3beca11de130dcd9b0311dceea3a9fb5ade85bb29d38841f8b","bytes":29976},"plan":{"path":"docs/plans/2026-11-10-fantasy-draft-empty-pool.md","blob":"f090008f80c10ee1fd220e19516d636d2f6adf39","sha256":"cd88200e546d7e00b079fcef1646f1fd42d37305d42317b83eeb15d6d3a1a01d","bytes":896}};
          const {original,base,page,test,plan}=inputs;
          const out=process.env.EVIDENCE,repo='PapiSalgueroM/ballpark-hero';
          const git=(...args)=>execFileSync('git',args,{encoding:'utf8',maxBuffer:16*1024*1024}).trimEnd();
          const hash=(algorithm,body)=>createHash(algorithm).update(body).digest('hex');
          const blob=body=>hash('sha1',Buffer.concat([Buffer.from('blob '+body.length+'\0'),body]));
          const head=git('rev-parse','HEAD'),tree=git('rev-parse','HEAD^{tree}');
          assert.equal(process.env.GITHUB_REPOSITORY,repo);
          assert.equal(process.env.GITHUB_SHA,head);
          assert.deepEqual(git('rev-list','--parents','-n','1',head).split(' '),[head,original.head]);
          assert.deepEqual(git('rev-list','--parents','-n','1',original.head).split(' '),[original.head,base.head]);
          assert.equal(git('rev-parse',base.head+'^{tree}'),base.tree);
          assert.equal(git('rev-parse',original.head+'^{tree}'),original.tree);
          assert.equal(git('rev-parse',original.head+':'+original.path),original.workflow);
          const diff=git('diff','--name-status','--no-renames',original.head,head).split('\n').sort();
          assert.deepEqual(diff,['M\t'+page.path,'M\t'+original.path].sort());
          const all=ref=>git('ls-tree','-r','-z',ref).split('\0').filter(Boolean);
          const held=rows=>rows.filter(x=>![page.path,original.path].includes(x.split('\t')[1]));
          const before=all(original.head),after=all(head);
          assert.deepEqual([before.length,after.length,held(after).length],[5804,5804,5802]);
          assert.deepEqual(held(before),held(after));
          assert.equal(after.filter(row=>/^(src|public|scripts)\//.test(row.split('\t')[1])).length,4669);
          const initialPage=execFileSync('git',['show',original.head+':'+page.path]);
          const fixedPage=fs.readFileSync(page.path);
          assert.deepEqual([blob(initialPage),initialPage.length,hash('sha256',initialPage)],[page.priorBlob,page.priorBytes,page.priorSHA256]);
          assert.deepEqual([blob(fixedPage),fixedPage.length,hash('sha256',fixedPage)],[page.blob,page.bytes,page.sha256]);
          assert.equal(blob(fs.readFileSync(test.path)),test.blob);
          assert.equal(blob(fs.readFileSync(plan.path)),plan.blob);
          const api=process.env.GITHUB_API_URL+'/repos/'+repo;
          const get=async suffix=>{
            const response=await fetch(api+suffix,{headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+process.env.GH_TOKEN,
              'X-GitHub-Api-Version':'2022-11-28'},redirect:'error'});
            assert.equal(response.status,200,suffix);
            return response.json();
          };
          const [run,jobs,artifacts]=await Promise.all([get('/actions/runs/'+original.run),get('/actions/runs/'+original.run+'/jobs?per_page=100'),get('/actions/runs/'+original.run+'/artifacts?per_page=100')]);
          assert.deepEqual([run.id,run.status,run.conclusion,run.event,run.run_attempt,run.path,run.head_sha,run.head_commit.tree_id,run.head_branch],
            [original.run,'completed','success','push',1,original.path,original.head,original.tree,original.branch]);
          assert.equal(jobs.jobs.length,1);
          assert.equal(artifacts.artifacts.length,1);
          const [job]=jobs.jobs,[artifact]=artifacts.artifacts;
          assert.deepEqual([job.id,job.name,job.conclusion,job.steps.length],[original.job,'original','success',original.steps]);
          assert(job.steps.every(row=>row.status==='completed'&&row.conclusion==='success'));
          assert.deepEqual([artifact.id,artifact.size_in_bytes,artifact.digest,artifact.expired,artifact.workflow_run.id,artifact.workflow_run.head_sha],
            [original.artifact,original.zipBytes,'sha256:'+original.zipSHA256,false,original.run,original.head]);
          fs.writeFileSync(out+'/held-original-page.tsx',initialPage);
          fs.writeFileSync(out+'/candidate-fixed-page.tsx',fixedPage);
          fs.copyFileSync(test.path,out+'/candidate-test.tsx');
          fs.copyFileSync(original.path,out+'/candidate-workflow.yml');
          fs.writeFileSync(out+'/source-receipt.json',JSON.stringify({status:'passed',head,tree,parent:original.head,parentTree:original.tree,
            workflow:git('rev-parse','HEAD:'+original.path),inputs,trackedRows:5804,heldRows:5802,scopedSourceRows:4669,rootConfigurations:11},null,2)+'\n');
          NODE
          original_id=$(node -p "require('./$EVIDENCE/source-receipt.json').inputs.original.artifact")
          original_size=$(node -p "require('./$EVIDENCE/source-receipt.json').inputs.original.zipBytes")
          original_sha=$(node -p "require('./$EVIDENCE/source-receipt.json').inputs.original.zipSHA256")
          original_zip="$RUNNER_TEMP/fantasy-draft-empty-original.zip"
          gh api "repos/PapiSalgueroM/ballpark-hero/actions/artifacts/$original_id/zip" > "$original_zip"
          test "$(wc -c < "$original_zip")" -eq "$original_size"
          printf '%s  %s\n' "$original_sha" "$original_zip" | sha256sum -c -
          unzip -Z1 "$original_zip" > "$EVIDENCE/original-zip-entries.txt"
          test "$(grep -Fxc 'public-cases.raw.json' "$EVIDENCE/original-zip-entries.txt")" -eq 1
          unzip -p "$original_zip" public-cases.raw.json > "$EVIDENCE/original-reference.raw.json"
          raw_size=$(node -p "require('./$EVIDENCE/source-receipt.json').inputs.original.raw.bytes")
          raw_sha=$(node -p "require('./$EVIDENCE/source-receipt.json').inputs.original.raw.sha256")
          test "$(wc -c < "$EVIDENCE/original-reference.raw.json")" -eq "$raw_size"
          printf '%s  %s\n' "$raw_sha" "$EVIDENCE/original-reference.raw.json" | sha256sum -c -
      - name: Install locked dependencies, freeze physical source, and verify app types
        run: |
          set -euo pipefail
          npm ci 2>&1 | tee "$EVIDENCE/install.log"
          cat > "$EVIDENCE/physical.mjs" <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          const stage = process.argv[2];
          assert(['before', 'after'].includes(stage));
          const out = process.env.EVIDENCE;
          const index = execFileSync('git', ['ls-files', '-z'], { encoding: 'utf8' }).split('\0').filter(Boolean);
          const source = index.map(file => {
            const bytes = fs.readFileSync(file);
            return [file, bytes.length, createHash('sha256').update(bytes).digest('hex')];
          });
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const installed = Object.entries(lock.packages).filter(([file]) =>
            file.startsWith('node_modules/') && fs.existsSync(file + '/package.json')
          ).map(([file, entry]) => {
            const version = JSON.parse(fs.readFileSync(file + '/package.json', 'utf8')).version;
            assert.equal(version, entry.version, file);
            return [file, version];
          });
          assert.equal(source.length, 5804);
          assert.equal(installed.length, 521);
          assert.equal(fs.statSync(process.env.SIM_OFFLINE_RECEIPT).size, 0);
          for (const [name, data] of [['tracked', source], ['installed', installed]]) {
            const body = JSON.stringify(data);
            if (stage === 'after') assert.equal(body, fs.readFileSync(out + '/' + name + '-before.json', 'utf8'));
            fs.writeFileSync(out + '/' + name + '-' + stage + '.json', body);
          }
          NODE
          node "$EVIDENCE/physical.mjs" before
          node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee "$EVIDENCE/types.log"
      - name: Run the fixed Page, physical original rollback, and exact restoration
        run: |
          set -euo pipefail
          cat > "$EVIDENCE/fixed-validator.mjs" <<'FD_EMPTY_VALIDATOR'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          
          const UNDER25 = 'Under 25s: Every player must be 25 or younger';
          const POOL_FILE = '/src/test/fantasyDraftPoolRecovery.test.tsx';
          const CRITERIA_FILE = '/src/test/fantasyDraftCriteriaStart.test.tsx';
          const POOL_CALLS = [
            ['from', ['fantasy_draft_players']],
            ['select', ['id, name, position, nationality, market_value_millions, dominant_foot, age']],
            ['order', ['name']],
          ];
          const CASES = [
            ['normalUser', 'user', 'success', 'preserves ordinary user-first pool admission legal picks and the snake AI turns', null],
            ['normalAi', 'ai', 'success', 'preserves ordinary AI-first pool admission legal picks and the snake AI turns', null],
            ['errorUser', 'user', 'resolved-error', 'recovers the user-first round through a public retry after a resolved pool error', null],
            ['errorAi', 'ai', 'resolved-error', 'recovers the AI-first round through a public retry after a resolved pool error', null],
            ['nullUser', 'user', 'resolved-null', 'recovers the user-first round after a successful null player-pool reply', 'FD_POOL_EMPTY_NULL_USER'],
            ['nullAi', 'ai', 'resolved-null', 'recovers the AI-first round after a successful null player-pool reply', 'FD_POOL_EMPTY_NULL_AI'],
            ['emptyUser', 'user', 'resolved-empty', 'recovers the user-first round after a successful empty player-pool reply', 'FD_POOL_EMPTY_ARRAY_USER'],
            ['emptyAi', 'ai', 'resolved-empty', 'recovers the AI-first round after a successful empty player-pool reply', 'FD_POOL_EMPTY_ARRAY_AI'],
          ];
          const CRITERIA_TITLES = [
            'FD_RULES_PENDING_SUCCESS refuses premature admission and resumes after the deferred callback',
            'FD_RULES_PENDING_REJECTION refuses premature admission and resumes after the deferred callback',
            'FD_RULES_SETTLED_NULL preserves permissive picks and the original AI turn sequence',
            'FD_RULES_SETTLED_LEGACY preserves permissive picks and the original AI turn sequence',
          ];
          const FINISH = {
            user: { turn: 'user', round: 2, pick: 4, total: 22, human: ['Fixture FWD 00'], ai: ['Fixture FWD 01', 'Fixture FWD 02'] },
            ai: { turn: 'user', round: 3, pick: 6, total: 22, human: ['Fixture FWD 00', 'Fixture FWD 01'], ai: ['Fixture FWD 05', 'Fixture MID 00', 'Fixture MID 01'] },
          };
          
          const rawPin = raw => ({ bytes: raw.length, sha256: createHash('sha256').update(raw).digest('hex') });
          const playerReads = frame => frame.transport.filter(read => read.kind === 'players');
          const pickOne = seat => ({ turn: seat, round: 1, pick: 1, total: 22, human: [], ai: [] });
          const successfulReply = data => ({ data, error: null, count: null, status: 200, statusText: 'OK' });
          const rosterNames = (page, side) => page.rosters[side]?.slots.filter(slot => slot.name !== null).map(slot => slot.name) ?? [];
          function progress({ page }) {
            assert(page, 'Expected an actual mounted draft frame');
            const { turn, round, pick, total } = page;
            return { turn, round, pick, total, human: rosterNames(page, 'human'), ai: rosterNames(page, 'ai') };
          }
          function parseRaw(raw) {
            assert(Buffer.isBuffer(raw) && raw.length > 0, 'Exact retained RAW bytes are required');
            const text = raw.toString('utf8');
            const evidence = JSON.parse(text);
            assert.equal(text, JSON.stringify(evidence) + '\n', 'Canonical compact RAW');
            assert.equal(evidence.version, 1);
            assert.equal(evidence.criteria, UNDER25);
            assert.equal(evidence.fixture.length, 27);
            assert(evidence.fixture.every(row => row.id.startsWith('fixture-') && row.name.startsWith('Fixture ')));
            assert.deepEqual(evidence.cases.map(row => [row.key, row.seat, row.firstPoolResponse, row.title]), CASES.map(row => row.slice(0, 4)));
            return evidence;
          }
          
          function unitResults(vitest, rollback) {
            const failed = rollback ? 4 : 0;
            assert.deepEqual([
              vitest.numTotalTests, vitest.numFailedTests, vitest.numPassedTests,
              vitest.numPendingTests, vitest.numTodoTests, vitest.success,
            ], [12, failed, 12 - failed, 0, 0, !rollback], 'Exact unit result census');
            assert.equal(vitest.testResults.length, 2, 'Exactly the two qualified suites');
            const pool = vitest.testResults.find(suite => suite.name.endsWith(POOL_FILE));
            const criteria = vitest.testResults.find(suite => suite.name.endsWith(CRITERIA_FILE));
            assert(pool && criteria, 'Exact pool and criteria suite paths');
            assert.deepEqual([pool.status, criteria.status], [rollback ? 'failed' : 'passed', 'passed'], 'Exact physical test-file statuses');
            assert.deepEqual(pool.assertionResults.map(row => row.title), CASES.map(row => row[3]));
            assert.deepEqual(criteria.assertionResults.map(row => row.title), CRITERIA_TITLES);
            assert(criteria.assertionResults.every(row => row.status === 'passed' && row.failureMessages.length === 0));
            const errors = [];
            for (const [index, row] of pool.assertionResults.entries()) {
              const marker = CASES[index][4];
              if (rollback && marker) {
                assert.equal(row.status, 'failed', row.title);
                assert.equal(row.failureMessages.length, 1, row.title);
                const message = row.failureMessages[0].replace(/\x1b\[[0-9;]*m/g, '');
                assert(message.startsWith('AssertionError: ' + marker + ':'), row.title);
                assert(!/UnhandledPromiseRejection|ERR_MODULE_NOT_FOUND|ERR_UNKNOWN_FILE_EXTENSION|SIM_OFFLINE_BLOCK/i.test(message));
                errors.push(marker);
              } else {
                assert.equal(row.status, 'passed', row.title);
                assert.deepEqual(row.failureMessages, [], row.title);
              }
            }
            return { tests: 12, passed: 12 - failed, failed, criteria: CRITERIA_TITLES, markers: errors };
          }
          
          function observeCase(testCase, fixture, rollback) {
            const { key, seat, firstPoolResponse: reply, frames, complete, error } = testCase;
            const empty = reply === 'resolved-null' || reply === 'resolved-empty';
            assert.deepEqual([complete, error], [true, null], key);
            assert(frames.every(frame => !frame.failures.length && !frame.unexpectedTransport.length && !frame.completions.length), key);
            const byLabel = new Map(frames.map(frame => [frame.label, frame]));
            assert.equal(byLabel.size, frames.length, key + ' unique frames');
            const frame = label => {
              assert(byLabel.has(label), key + ' missing frame ' + label);
              return byLabel.get(label);
            };
            const pending = frame('first-pool-pending');
            const settled = frame(empty ? 'first-pool-' + reply : reply === 'success' ? 'first-pool-success' : 'first-pool-error');
            const final = frame('legal-progress-complete');
            const teardown = frames.at(-1);
            assert.deepEqual([teardown.label, teardown.page, teardown.pendingResponses, teardown.clock.fakeTimers], ['after-teardown', null, 0, 0], key);
            assert.deepEqual(progress(pending), pickOne(seat), key + ' opening seat and pick');
            assert.equal(pending.pendingResponses, 1, key + ' initial read in flight');
            const [first] = playerReads(settled);
            assert(first && first.settledAt !== null && first.consumedAt !== null, key + ' actual first player reply');
            assert.deepEqual(first.calls.map(call => [call.method, call.args]), POOL_CALLS, key);
            const allPlayers = playerReads(final);
            const criteriaReads = final.transport.filter(read => read.kind === 'criteria');
            assert.equal(criteriaReads.length, 1, key + ' held single daily criteria read');
            assert.deepEqual(criteriaReads[0].response, { data: { criteria: UNDER25 }, error: null }, key);
            assert.equal(final.page.criterion, UNDER25, key + ' held rule');
            const retryButton = settled.page.retry.filter(button => button.disabled === false);
            const tried = final.actions.find(action => action.name === 'retry-player-pool');
            const delivered = final.actions.find(action => action.name === 'settle-retry-pool');
            if (empty) assert.deepEqual(first.response, successfulReply(reply === 'resolved-null' ? null : []), key);
            else if (reply === 'success') assert.deepEqual(first.response, successfulReply(fixture), key);
            else assert.deepEqual([first.response.status, first.response.error.code], [503, 'FIXTURE_POOL_UNAVAILABLE'], key);
          
            const stillStuck = rollback && empty;
            assert.deepEqual(progress(final), stillStuck ? pickOne(seat) : FINISH[seat], key + ' exact final pick and rosters');
            if (stillStuck) {
              for (const hold of [settled, frame('error-after-service-wait'), frame('retry-pending'), frame('duplicate-retry-pending'), frame('retry-pool-settled'), final]) {
                assert.deepEqual(progress(hold), pickOne(seat), key + ' rollback held pick');
                assert.deepEqual(hold.page.retry, [], key + ' rollback has no Retry');
                assert.equal(playerReads(hold).length, 1, key + ' rollback has no second read');
              }
              assert.deepEqual([tried?.details.clicked, delivered?.details.delivered], [false, false], key);
            } else if (reply !== 'success') {
              assert.deepEqual([settled.page.retry.length, retryButton.map(button => button.text?.trim())], [1, ['Retry players']], key);
              const waiting = frame('error-after-service-wait');
              assert.deepEqual([waiting.page.retry.length, playerReads(waiting).length, waiting.draws], [1, 1, settled.draws], key);
              const recovered = frame('retry-pool-settled');
              for (const hold of [settled, waiting, frame('retry-pending'), frame('duplicate-retry-pending'), recovered]) {
                assert.deepEqual(progress(hold), pickOne(seat), key + ' same seat and pick through Retry');
                assert.equal(hold.page.criterion, UNDER25, key);
              }
              for (const label of ['retry-pending', 'duplicate-retry-pending']) {
                const inFlight = frame(label);
                assert.deepEqual([inFlight.pendingResponses, inFlight.page.retry.length, playerReads(inFlight).length], [1, 0, 2], key);
              }
              assert.deepEqual([tried?.details.clicked, delivered?.details.delivered, recovered.pendingResponses, recovered.draws],
                [true, true, 0, settled.draws], key);
              assert.equal(final.actions.find(action => action.name === 'duplicate-retry-opportunity')?.details.clicked, false, key);
              assert.equal(allPlayers.length, 2, key + ' exactly one Retry read');
              const second = allPlayers[1];
              assert.deepEqual(second.calls.map(call => [call.method, call.args]), POOL_CALLS, key);
              assert(second.consumedAt !== null && second.settledAt !== null, key + ' actual second settled reply');
              assert.deepEqual(second.response, successfulReply(fixture), key + ' exact nonempty fictional retry pool');
              assert.equal(recovered.page.retry.length, 0, key);
            } else {
              assert.equal(allPlayers.length, 1, key + ' healthy nonempty success reads once');
              assert.deepEqual(settled.page.retry, [], key);
            }
            return { case: key, seat, firstResponse: reply, firstStatus: first.response.status, firstEnabledRetries: retryButton.length,
              lastPick: final.page.pick, playerReads: allPlayers.length };
          }
          
          /** Receives authenticated retained RAW buffers and the parsed role-specific Vitest JSON report. */
          export function validateFantasyDraftEmptyPool({ mode, raw, vitest, exitCode, originalRaw, fixedRaw }) {
            assert(['fixed', 'original', 'restored'].includes(mode), 'Exact physical Page role');
            const rollback = mode === 'original';
            assert.equal(exitCode, rollback ? 1 : 0, 'Expected runner process exit for the role');
            const evidence = parseRaw(raw);
            const original = parseRaw(originalRaw);
            assert.deepEqual([evidence.version, evidence.scope, evidence.criteria, evidence.fixture, evidence.cases.slice(0, 4)],
              [original.version, original.scope, original.criteria, original.fixture, original.cases.slice(0, 4)],
              'Exact four existing pool RAW cases and fixtures remain held');
            if (rollback) assert(raw.equals(originalRaw), 'Physical original reproduces the entire authenticated original RAW');
            if (mode === 'fixed') assert(!raw.equals(originalRaw), 'Fixed RAW must demonstrate a change');
            if (mode === 'restored') assert(Buffer.isBuffer(fixedRaw) && raw.equals(fixedRaw), 'Restored RAW exactly reproduces the fixed role');
            const unit = unitResults(vitest, rollback);
            return { status: 'passed', mode, exitCode, ...unit, raw: rawPin(raw), originalRaw: rawPin(originalRaw),
              restoredMatchesFixed: mode === 'restored' ? true : null,
              cases: evidence.cases.map(testCase => observeCase(testCase, evidence.fixture, rollback)) };
          }
          FD_EMPTY_VALIDATOR
          cat > "$EVIDENCE/control-driver.mjs" <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import {createHash} from 'node:crypto';
          import {execFileSync,spawnSync} from 'node:child_process';
          import {validateFantasyDraftEmptyPool} from './fixed-validator.mjs';
          const out=process.env.EVIDENCE,source=JSON.parse(fs.readFileSync(out+'/source-receipt.json'));
          const {page,test}=source.inputs;
          const originalRaw=fs.readFileSync(out+'/original-reference.raw.json');
          const fixedPage=fs.readFileSync(out+'/candidate-fixed-page.tsx');
          const originalPage=fs.readFileSync(out+'/held-original-page.tsx');
          const sha=body=>createHash('sha256').update(body).digest('hex');
          const git=(...args)=>execFileSync('git',args,{encoding:'utf8',maxBuffer:16*1024*1024});
          const index=git('ls-files','-s');
          const held=JSON.parse(fs.readFileSync(out+'/tracked-before.json')).filter(([file])=>file!==page.path);
          assert.equal(held.length,5803);
          const verify=(mode,body)=>{
            assert.equal(git('ls-files','-s'),index);
            const expected=mode==='original'?'M\t'+page.path:'';
            assert.equal(git('diff','--name-status','--no-renames','HEAD').trimEnd(),expected);
            assert(fs.readFileSync(page.path).equals(body));
            assert.equal(fs.statSync(process.env.SIM_OFFLINE_RECEIPT).size,0);
            for(const [file,bytes,hash] of held){
              const current=fs.readFileSync(file);
              assert.deepEqual([current.length,sha(current)],[bytes,hash],file);
            }
          };
          const modes=['fixed','original','restored'],results={};
          let fixedRaw;
          try {
            for(const mode of modes){
              const body=mode==='original'?originalPage:fixedPage;
              if(mode!=='fixed'){
                assert(!fs.readFileSync(page.path).equals(body),mode+' physical changed Page');
                fs.writeFileSync(page.path,body);
              }
              verify(mode,body);
              const dir=out+'/'+mode;
              fs.mkdirSync(dir);
              const rawPath=path.resolve(dir,'public-cases.raw.json');
              const result=spawnSync(process.execPath,['node_modules/vitest/vitest.mjs','run',test.path,'src/test/fantasyDraftCriteriaStart.test.tsx',
                '--testTimeout=60000','--no-file-parallelism','--reporter=json','--outputFile='+dir+'/vitest-result.json'],{
                env:{...process.env,FD_POOL_RECOVERY_RAW:rawPath,NODE_OPTIONS:'--require='+process.cwd()+'/scripts/lib/offlineTransport.cjs'},
                timeout:180000,maxBuffer:16*1024*1024,
              });
              assert.equal(result.error,undefined,mode);
              assert.equal(result.signal,null,mode);
              const log=Buffer.concat([result.stdout??Buffer.alloc(0),result.stderr??Buffer.alloc(0)]);
              fs.writeFileSync(dir+'/helper.log',log);
              fs.writeFileSync(dir+'/helper-exit.txt',String(result.status)+'\n');
              assert(!/UnhandledPromiseRejection|ERR_MODULE_NOT_FOUND|ERR_UNKNOWN_FILE_EXTENSION|SIM_OFFLINE_BLOCK|Unhandled Errors/i.test(log.toString('utf8')));
              const raw=fs.readFileSync(rawPath),vitest=JSON.parse(fs.readFileSync(dir+'/vitest-result.json'));
              results[mode]=validateFantasyDraftEmptyPool({mode,raw,vitest,exitCode:result.status,originalRaw,fixedRaw});
              if(mode==='fixed') fixedRaw=raw;
              assert.equal(results[mode].status,'passed',mode);
              verify(mode,body);
            }
          } finally {
            if(!fs.readFileSync(page.path).equals(fixedPage))fs.writeFileSync(page.path,fixedPage);
          }
          verify('restored',fixedPage);
          fs.writeFileSync(out+'/admission.json',JSON.stringify({status:'passed',roles:modes,onlyPhysicalProductPath:page.path,
            exactRestoredPage:true,exactRestoredRaw:true,exactOriginalRaw:true,results},null,2)+'\n',{flag:'wx'});
          NODE
          node "$EVIDENCE/control-driver.mjs" 2>&1 | tee "$EVIDENCE/control-driver.log"
      - name: Verify unchanged physical source and locked offline run
        if: always()
        run: |
          set -euo pipefail
          git ls-files -s > "$EVIDENCE/source-after.txt"
          sha256sum package.json package-lock.json > "$EVIDENCE/locks-after.txt"
          cmp "$EVIDENCE/source-before.txt" "$EVIDENCE/source-after.txt"
          cmp "$EVIDENCE/locks-before.txt" "$EVIDENCE/locks-after.txt"
          git diff --exit-code HEAD -- .
          node "$EVIDENCE/physical.mjs" after
          test ! -s "$SIM_OFFLINE_RECEIPT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fantasy-draft-empty-pool-fixed-controls-${{ github.run_id }}
          path: fantasy-draft-empty-pool-fixed-controls
          retention-days: 14
          if-no-files-found: error
