          fs.writeFileSync(out+'/host-build-source-bridge.json',JSON.stringify({source:process.env.HOST_SOURCE_SHA,tree:process.env.HOST_TREE_SHA,publishedSource:process.env.PUBLIC_RELEASE_SHA,allPublishedBodiesHeld:held,distDigest:payload.distDigest,meaning:'Separate Bun-locked compile on exact published source. The prior d3b build, fixtures, source and payload checks remain intact. Only public asset byte comparisons use this host-matched reference.'},null,2)+'\n');
          NODE
          tar -tzf "$HOST/completed-dist.tar.gz" > "$QA_OUT/host-completed-dist-members.txt"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const rows=fs.readFileSync(process.env.QA_OUT+'/host-completed-dist-members.txt','utf8').trim().split('\n');assert(rows.length>100);assert(rows.every(p=>(p==='dist/'||p.startsWith('dist/'))&&!p.split('/').includes('..')));
          NODE
          (
            cd "$HOST_PAYLOAD"
            tar --no-same-owner -xzf "$HOST/completed-dist.tar.gz"
            find dist -type f -print0 | sort -z | xargs -0 sha256sum > "$QA_OUT/host-dist-before.sha256"
            cmp "$HOST/dist-before.sha256" "$QA_OUT/host-dist-before.sha256"
            sha256sum --check "$QA_OUT/host-dist-before.sha256" > "$QA_OUT/host-dist-input-held.log"
