      - name: Install held application and isolated browser tools
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund 2>&1 | tee "$QA_OUT/logs/npm-ci.log"
          git diff --exit-code -- package.json package-lock.json
          npm install --prefix "$RUNNER_TEMP/flagship-public-tools" --package-lock=false --no-audit --no-fund playwright@1.64.0 2>&1 | tee "$QA_OUT/logs/playwright-install.log"
          test ! -e node_modules/playwright
          test ! -e node_modules/playwright-core
          ln -s "$RUNNER_TEMP/flagship-public-tools/node_modules/playwright" node_modules/playwright
          ln -s "$RUNNER_TEMP/flagship-public-tools/node_modules/playwright-core" node_modules/playwright-core
          "$RUNNER_TEMP/flagship-public-tools/node_modules/.bin/playwright" install --with-deps chromium 2>&1 | tee "$QA_OUT/logs/chromium-install.log"
      - name: Record cache-busted public entry and route chunks, and run existing GET-only HTML audit
        run: |
          set -euo pipefail
          unset NODE_OPTIONS
          cat > "$QA_OUT/probe-public.mjs" <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';import crypto from 'node:crypto';
          const base='https://douknowball.com',release=process.env.PUBLIC_RELEASE_SHA,label=process.argv[2],out=process.env.QA_OUT;
          assert.match(release,/^[a-f0-9]{40}$/);assert.ok(['before','after'].includes(label));
          const hash=b=>crypto.createHash('sha256').update(b).digest('hex'),rows=[];
          const manifest=JSON.parse(fs.readFileSync(out+'/carrier-host/dist-manifest.json','utf8')),reference=new Map(manifest.map(row=>['/'+row.file,row]));
          const entryRows=manifest.filter(row=>/^assets\/index-[A-Za-z0-9_-]+\.js$/.test(row.file)),styleRows=manifest.filter(row=>/^assets\/index-[A-Za-z0-9_-]+\.css$/.test(row.file));
          assert.equal(entryRows.length,1);assert.equal(styleRows.length,1);
          const prefixes=['SoccerCareer-','ClubManager-','StadiumTycoon-','FrontOffice-','NbaMyCareer-','NflMyCareer-'];
          const chunksOf=js=>[...new Set([...js.replace(/\/\*[\s\S]*?\*\//g,'').matchAll(/["'](?:\.\/)?(?:assets\/)?((?:SoccerCareer|ClubManager|StadiumTycoon|FrontOffice|NbaMyCareer|NflMyCareer)-[A-Za-z0-9_-]+\.js)["']/g)].map(m=>m[1]))].sort();
          const expectedChunks=chunksOf(fs.readFileSync(process.env.QA_HOST_PAYLOAD+'/dist/'+entryRows[0].file,'utf8'));
          for(const prefix of prefixes)assert.equal(expectedChunks.filter(p=>p.startsWith(prefix)).length,1,prefix+' selected entry reference');
          const get=async path=>{
            const url=new URL(path,base);assert.equal(url.origin,base);url.searchParams.set('qa-release',release);
            const response=await fetch(url,{method:'GET',redirect:'manual',signal:AbortSignal.timeout(30000),headers:{'cache-control':'no-cache','user-agent':'DoUKnowBall release verification'}});
            assert.equal(response.status,200,url.href);const bytes=Buffer.from(await response.arrayBuffer());
            const file=path.split('/').pop()||'home.html';fs.writeFileSync(out+'/public-'+label+'-'+file,bytes);
            const expected=path.startsWith('/assets/')?reference.get(path):null;if(path.startsWith('/assets/')){assert(expected,path+' in selected manifest');assert.equal(bytes.length,expected.bytes,path+' selected bytes');assert.equal(hash(bytes),expected.sha256,path+' exact selected payload');}
            rows.push({path,method:'GET',status:response.status,bytes:bytes.length,sha256:hash(bytes),expectedSelectedSHA256:expected?.sha256??null,etag:response.headers.get('etag'),cacheControl:response.headers.get('cache-control')});return bytes;
          };
          const html=(await get('/')).toString('utf8').replace(/<!--[\s\S]*?-->/g,'');
          const matches=[...html.matchAll(/<script\b[^>]+\bsrc=["'](\/assets\/index-[^"']+\.js)["']/g)];assert.equal(matches.length,1,'One real public entry script');
          const entry=matches[0][1];assert.equal(entry,'/'+entryRows[0].file,'Public entry path equals the selected completed build');
          const js=(await get(entry)).toString('utf8'),chunks=chunksOf(js);assert.deepEqual(chunks,expectedChunks);
          for(const prefix of prefixes)assert.equal(chunks.filter(p=>p.startsWith(prefix)).length,1,prefix+' actual entry reference');
          const styles=[...html.matchAll(/<link\b[^>]+\bhref=["'](\/assets\/index-[A-Za-z0-9_-]+\.css)["']/g)].map(m=>m[1]);assert.deepEqual([...new Set(styles)],['/'+styleRows[0].file]);
          await get('/'+styleRows[0].file);for(const chunk of chunks)await get('/assets/'+chunk);
          assert.equal(rows.filter(row=>row.path.startsWith('/assets/')).length,8);
          fs.writeFileSync(out+'/public-'+label+'.json',JSON.stringify({releaseAssociation:release,selectedBuild:process.env.BUILD_SOURCE_SHA,hostBuild:process.env.HOST_SOURCE_SHA,entry,rows,exactSelectedAssets:8,meaning:'Actual home plus entry/style and six requested route asset GETs. All eight asset byte counts and SHA256 values equal the separate host-matched compiled manifest before and after flows. Root supplies the Git/deployment association externally; this is not a claim that all845 payloads were fetched publicly.'},null,2)+'\n');
          NODE
          node "$QA_OUT/probe-public.mjs" before
          BASE="$BASE" node scripts/auditLive.mjs / /soccer-career /club-manager 2>&1 | tee "$QA_OUT/logs/auditLive.log"
      - name: Run actual public feature flows in isolated disposable guest contexts
        timeout-minutes: 18
        run: |
          set -euo pipefail
          unset NODE_OPTIONS
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import crypto from 'node:crypto';import assert from 'node:assert/strict';
          const out=process.env.QA_OUT,before=JSON.parse(fs.readFileSync(out+'/source-before.json','utf8')),after=Object.fromEntries(Object.keys(before).map(p=>[p,crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex')]));
          fs.writeFileSync(out+'/source-before-browser.json',JSON.stringify(after,null,2)+'\n');assert.deepEqual(after,before);
          NODE
          sha256sum --check "$QA_OUT/dist-before.sha256" > "$QA_OUT/dist-before-browser-held.log"
          set +e
          node scripts/qa/cmCustomTacticsPublicBrowser.mjs --base-url "$BASE" --fixtures "$QA_OUT/fixtures-cm" --out "$QA_OUT/cm/browser" 2>&1 | tee "$QA_OUT/logs/browser-cm.log"
          codes=("${PIPESTATUS[@]}")
          printf '%s\n' "${codes[0]}" > "$QA_OUT/cm.exit"
          test "${codes[1]}" -eq 0 || exit 1
          node scripts/qa/soccerCareerRecordsPublicBrowser.mjs --base-url "$BASE" --fixtures "$QA_OUT/fixtures-sc" --out "$QA_OUT/sc/browser" 2>&1 | tee "$QA_OUT/logs/browser-sc.log"
          codes=("${PIPESTATUS[@]}")
          printf '%s\n' "${codes[0]}" > "$QA_OUT/sc.exit"
          test "${codes[1]}" -eq 0 || exit 1
          set -e
          test "$(cat "$QA_OUT/cm.exit")" = 0
          test "$(cat "$QA_OUT/sc.exit")" = 0
      - name: Admit actual public flows and unchanged photo contracts
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';import crypto from 'node:crypto';
          const out=process.env.QA_OUT,cm=JSON.parse(fs.readFileSync(out+'/cm/browser/report.json','utf8')),sc=JSON.parse(fs.readFileSync(out+'/sc/browser/report.json','utf8'));
          for(const value of [cm,sc]){assert.equal(value.status,'passed');assert.equal(value.sourceHeld,true);assert.equal(value.distHeld,true);assert.equal(value.browserClockOrRngOverrides,false);}
          for(const value of [cm,sc])assert.equal(value.publicRelease,process.env.PUBLIC_RELEASE_SHA);
          for(const profile of [...cm.contexts,...sc.profiles]){assert.ok(profile.continuedReadRequests.length>0);assert.ok(profile.continuedReadRequests.every(r=>['GET','HEAD'].includes(r.method)));}
          assert.deepEqual(cm.contexts.map(p=>p.width),[320,390,430,1440]);assert.ok(cm.contexts.every(p=>p.status==='passed'&&p.moves.length===11&&p.cancel.rawHeld&&p.pageErrors.length===0));
          assert.deepEqual([cm.completeProfiles,cm.movedSlots,cm.cancellations,cm.quotaFaults,cm.keptDataJourneys,cm.liveJourneys],[4,44,4,1,1,1]);
          const cmPhotos=['320-edited-pitch.png','320-reapplied-plan.png','320-save-refused.png','390-edited-pitch.png','390-reapplied-plan.png','390-live-custom.png','390-halftime-custom.png','430-edited-pitch.png','430-reapplied-plan.png','1440-edited-pitch.png','1440-reapplied-plan.png','1440-kept-data.png'].sort();
          assert.deepEqual([...cm.screenshots].sort(),cmPhotos);
          assert.deepEqual(sc.profiles.map(p=>p.width),[320,390,430,1440]);assert.ok(sc.profiles.every(p=>p.status==='passed'&&p.scenarios.every(s=>s.status==='passed'&&s.pageErrors.length===0)));
          assert.equal(sc.fixturesHeld,true);
          assert.deepEqual(sc.actualCensus,{profiles:4,creation:4,completed:4,quota:1,future:1,clipControls:4,originalScreenshots:19,controlScreenshots:1});
          const scPhotos=['320-creation.png','320-grid.png','320-details.png','320-help.png','390-creation.png','390-grid.png','390-details.png','390-help.png','430-creation.png','430-grid.png','430-details.png','430-help.png','1440-creation.png','1440-grid.png','1440-details.png','1440-help.png','320-quota-refused.png','320-quota-recovered.png','320-future-readonly.png','320-control-clipped.png'].sort();
          assert.deepEqual(sc.screenshots.map(row=>row.file).sort(),scPhotos);
          const photos=[];
          for(const[game,names]of [['cm',cmPhotos],['sc',scPhotos]])for(const file of names){
            const bytes=fs.readFileSync(out+'/'+game+'/browser/'+file);assert.ok(bytes.length>1000);assert.equal(bytes.subarray(0,8).toString('hex'),'89504e470d0a1a0a');
            photos.push({game,file,bytes:bytes.length,sha256:crypto.createHash('sha256').update(bytes).digest('hex'),control:game==='sc'&&file==='320-control-clipped.png'});
          }
          assert.equal(photos.length,32);assert.equal(photos.filter(p=>p.control).length,1);
          fs.writeFileSync(out+'/actual-admission.json',JSON.stringify({status:'passed',source:process.env.GITHUB_SHA,publishedReleaseAssociation:process.env.PUBLIC_RELEASE_SHA,referenceAppSource:process.env.APP_SOURCE_SHA,selectedBuildSource:process.env.BUILD_SOURCE_SHA,hostBuildSource:process.env.HOST_SOURCE_SHA,finalCore:process.env.FINAL_CORE_SHA,contexts:8,pageJourneys:14,cm:{profiles:4,moves:44,cancellations:4,quota:1,future:1,live:1},sc:sc.actualCensus,photos,limits:'Repeated widths earn no additional unique engine credit. Real public flows use only fictional localStorage in disposable guest contexts. No mutating HTTP, rebuild, natural progression, actual-font or provider availability claim. Local reference holds are not live JS byte attestation. Every console/request event needs manual classification.'},null,2)+'\n');
          NODE
      - name: Retain actual public traffic, version boundaries and local reference closures
        if: always()
        run: |
          set -euo pipefail
          test -n "$QA_OUT"
          probe_status=0
          if [[ -f "$QA_OUT/probe-public.mjs" ]]; then node "$QA_OUT/probe-public.mjs" after || probe_status=$?; else probe_status=1; fi
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import crypto from 'node:crypto';import {execFileSync} from 'node:child_process';
          const out=process.env.QA_OUT,sha=p=>crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex'),read=file=>fs.existsSync(file)?JSON.parse(fs.readFileSync(file,'utf8')):null;
          const cm=read(out+'/cm/browser/report.json'),sc=read(out+'/sc/browser/report.json');
          const traffic={
            cm:cm?.contexts.map(row=>({width:row.width,status:row.status,error:row.error??null,continuedReadRequests:row.continuedReadRequests,blockedRequests:row.blockedRequests,requestFailures:row.requestFailures,consoleMessages:row.consoleMessages,pageErrors:row.pageErrors,pointerAttempts:row.pointerAttempts??[],failureScreenshot:row.failureScreenshot??null}))??[],
            sc:sc?.profiles.map(row=>({width:row.width,status:row.status,error:row.error??null,continuedReadRequests:row.continuedReadRequests,blockedRequests:row.blockedRequests,scenarios:row.scenarios.map(scene=>({name:scene.name,status:scene.status,error:scene.error??null,requestFailures:scene.requestFailures,consoleMessages:scene.consoleMessages,pageErrors:scene.pageErrors}))}))??[],
            meaning:'Every continued browser HTTP request is same-origin GET/HEAD. Every other HTTP request, including all mutating requests and RPC, aborts and remains listed. No backend availability, all-protocol or zero-traffic claim. Root must classify every raw console and resource event.'
          };
          fs.writeFileSync(out+'/transport-summary.json',JSON.stringify(traffic,null,2)+'\n');
          const photos=[];for(const game of ['cm','sc'])if(fs.existsSync(out+'/'+game+'/browser'))for(const file of fs.readdirSync(out+'/'+game+'/browser').filter(p=>p.endsWith('.png')).sort())photos.push({game,file,bytes:fs.statSync(out+'/'+game+'/browser/'+file).size,sha256:sha(out+'/'+game+'/browser/'+file),failure:file.endsWith('-failed.png')});
          fs.writeFileSync(out+'/photo-inventory.json',JSON.stringify(photos,null,2)+'\n');
          const files=execFileSync('git',['ls-files','-z']).toString().split('\0').filter(Boolean).sort(),sourceAfter=Object.fromEntries(files.map(p=>[p,sha(p)])),sourceBefore=read(out+'/source-before.json');
          fs.writeFileSync(out+'/source-after.json',JSON.stringify(sourceAfter,null,2)+'\n');fs.writeFileSync(out+'/working-tree.txt',execFileSync('git',['status','--short']));
          const fixturesAfter={};for(const game of ['cm','sc'])if(fs.existsSync(out+'/fixtures-'+game))for(const file of fs.readdirSync(out+'/fixtures-'+game).sort())fixturesAfter[game+'/'+file]=sha(out+'/fixtures-'+game+'/'+file);
          fs.writeFileSync(out+'/fixtures-after.json',JSON.stringify(fixturesAfter,null,2)+'\n');
          const fixturesBefore=read(out+'/fixtures-before.json'),publicBefore=read(out+'/public-before.json'),publicAfter=read(out+'/public-after.json');
          const assetId=row=>row.path+'\n'+row.status+'\n'+row.bytes+'\n'+row.sha256;
          fs.writeFileSync(out+'/closure.json',JSON.stringify({sourceHeld:sourceBefore!==null&&JSON.stringify(sourceAfter)===JSON.stringify(sourceBefore),fixturesHeld:fixturesBefore!==null&&JSON.stringify(fixturesAfter)===JSON.stringify(fixturesBefore),referenceTarHeld:fs.existsSync(out+'/completed-dist.tar.gz')&&sha(out+'/completed-dist.tar.gz')===process.env.DIST_TAR_SHA256,selectedTarHeld:fs.existsSync(out+'/selected-completed-dist.tar.gz')&&sha(out+'/selected-completed-dist.tar.gz')===process.env.BUILD_DIST_TAR_SHA256,hostTarHeld:fs.existsSync(out+'/host-completed-dist.tar.gz')&&sha(out+'/host-completed-dist.tar.gz')===process.env.HOST_DIST_TAR_SHA256,publicEntryAndRouteChunksStable:publicBefore!==null&&publicAfter!==null&&publicBefore.entry===publicAfter.entry&&JSON.stringify(publicBefore.rows.filter(r=>r.path.startsWith('/assets/')).map(assetId))===JSON.stringify(publicAfter.rows.filter(r=>r.path.startsWith('/assets/')).map(assetId)),meaning:'Public entry/style and six route asset GETs match exact host-reproduced bytes and stay stable across real flows. Historical local oracle, d3b source qualification and host asset references remain separate. Git/deployment association remains Root supplied.'},null,2)+'\n');
          NODE
          dist_status=0
          if [[ -f "$QA_OUT/dist-before.sha256" ]]; then
            find dist -type f -print0 | sort -z | xargs -0 sha256sum > "$QA_OUT/dist-after.sha256"
            cmp "$QA_OUT/dist-before.sha256" "$QA_OUT/dist-after.sha256" || dist_status=$?
            sha256sum --check "$QA_OUT/dist-before.sha256" > "$QA_OUT/dist-held.log" || dist_status=$?
          else dist_status=1; fi
          selected_status=0
          if [[ -f "$QA_OUT/selected-dist-before.sha256" && -n "$QA_SELECTED_PAYLOAD" ]]; then
            (
              cd "$QA_SELECTED_PAYLOAD"
              find dist -type f -print0 | sort -z | xargs -0 sha256sum > "$QA_OUT/selected-dist-after.sha256"
              cmp "$QA_OUT/selected-dist-before.sha256" "$QA_OUT/selected-dist-after.sha256"
              sha256sum --check "$QA_OUT/selected-dist-before.sha256" > "$QA_OUT/selected-dist-held.log"
            ) || selected_status=$?
          else selected_status=1; fi
          host_status=0
          if [[ -f "$QA_OUT/host-dist-before.sha256" && -n "$QA_HOST_PAYLOAD" ]]; then
            (
              cd "$QA_HOST_PAYLOAD"
              find dist -type f -print0 | sort -z | xargs -0 sha256sum > "$QA_OUT/host-dist-after.sha256"
              cmp "$QA_OUT/host-dist-before.sha256" "$QA_OUT/host-dist-after.sha256"
              sha256sum --check "$QA_OUT/host-dist-before.sha256" > "$QA_OUT/host-dist-held.log"
            ) || host_status=$?
          else host_status=1; fi
          git diff --exit-code HEAD > "$QA_OUT/source-diff.txt"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const value=JSON.parse(fs.readFileSync(process.env.QA_OUT+'/closure.json','utf8'));
          for(const key of ['sourceHeld','fixturesHeld','referenceTarHeld','selectedTarHeld','hostTarHeld','publicEntryAndRouteChunksStable'])assert.equal(value[key],true,key);
          NODE
          test "$dist_status" -eq 0
          test "$probe_status" -eq 0
          test "$selected_status" -eq 0
          test "$host_status" -eq 0
      - name: Bound retained public guest evidence
        id: artifact
        if: always()
        run: |
          set -euo pipefail
          test -d "$QA_OUT"
          test "$(du -sb "$QA_OUT" | cut -f1)" -lt 150000000
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.artifact.outputs.ready == 'true' }}
        with:
          name: flagship-release-public-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/flagship-release-public
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
