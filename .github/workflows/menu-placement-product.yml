            for pair in "deps:node_modules" "browser:$PLACEMENT_TOOLS" "fonts:$FREE_KICK_FONT_CACHE" "dist:dist";do label="${pair%%:*}";dir="${pair#*:}";find "$dir" -type f -print0 | sort -z > "$out/$label.members.final";cmp "$out/$label.members" "$out/$label.members.final" || failed=1;sha256sum -c "$out/$label.sha256" > "$out/$label-held.log" 2>&1 || failed=1;done
            find node_modules -type l -printf '%p -> %l\n' | sort > "$out/dependency-links.final";cmp "$out/dependency-links.before" "$out/dependency-links.final" || failed=1
          fi
          while IFS= read -r -d '' file;do test ! -s "$file" || failed=1;done < <(find "$out" -type f \( -name '*.transport' -o -name transport.jsonl \) -print0)
          if test -f "$out/full-suite/reporter.before.sha256";then sha256sum -c "$out/full-suite/reporter.before.sha256" > "$out/full-suite/reporter-final-held.log" 2>&1 || failed=1;sha256sum "$out/full-suite/strict-runtime-json-reporter.mjs" > "$out/full-suite/reporter.final.sha256" || failed=1;fi
          printf '%s\n' "$failed" > "$out/final-holds.exit";find "$out" -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/menu-placement-product-evidence.sha256";cp "$RUNNER_TEMP/menu-placement-product-evidence.sha256" "$out/evidence.sha256";exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: menu-placement-product-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/menu-placement-product/
          if-no-files-found: error
          retention-days: 14
