name: Failed-suite setup repair with original native policies
on:
  push:
    branches: [codex/popular-adapter-repair-20261104]
permissions:
  contents: read
  actions: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      CI: '1'
      SIM_NETWORK: offline
      CORE: cfdbb34b755098a2ee6961a9fc05e61cd7202fdf
      CORE_TREE: 9b07dfdf749f748f910f3a3bf80e7662a3c4642a
      QA_PATCHES: '{"scripts/qa/soccerAgentReviewKit.mjs":"c67ae736ce09e55c509526d21e3cd6569c60badd","scripts/qa/soccerFarewellKit.mjs":"512900d26eea41f192f337b39496ed1c835f5e0d","scripts/qa/soccerInternationalReturnKit.mjs":"575bb70913b5a7366dda36e60886c121f1516ee3","src/test/fixtures/careerDecisionOutcome1009.ts":"90008408b2e410d07e4685c689a62e510bc54b68","scripts/qa/careerDecisionOutcome1009.mjs":"ba894e0b6cb29a5f8ff37f3790405a2f7b6d6bae","scripts/simUsBoardParity.mjs":"2e574a8be770d8ac188433964b754415dbc1747b","scripts/qa/careerSeasonReview1008.mjs":"4bf1b9f5de5f0a438a3dcd46fe13a3114a511688"}'
      BUILD: d3b2bb06fa7019509fc5e32bd865191259d4a1d7
      COMPILED: 9650b2e8c01d756e48701dba46bb079db9da8051
      ARTIFACT: 13284398836
      ZIP_SHA: 7603f6ce3f4a489740e0cdcfc4d2404a16eb591dda9003443ef4fb140fb7a10b
      TAR_SHA: f353341a35bde3155872f6f057404e81374fa98e00c93fd64343fefb59d07c59
      PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Reuse the already admitted completed build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/adapter-repair"; PRIOR="$RUNNER_TEMP/compiled"
          mkdir -p "$OUT/logs" "$OUT/exits" "$OUT/transport" "$PRIOR"
          echo "QA_OUT=$OUT" >> "$GITHUB_ENV"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git ls-files -z | sort -z | xargs -0 sha256sum > "$OUT/source-before.sha256"
          test "$(wc -l < "$OUT/source-before.sha256")" -eq 5674
          cp .github/workflows/popular-adapter-repair-20261104.yml "$OUT/workflow.yml"
          git rev-parse HEAD HEAD^{tree} > "$OUT/source.txt"
          curl -fLsS --retry 0 -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/PapiSalgueroM/ballpark-hero/actions/artifacts/$ARTIFACT/zip" -o "$RUNNER_TEMP/build.zip"
          echo "$ZIP_SHA  $RUNNER_TEMP/build.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/build.zip" -d "$PRIOR"
          echo "$TAR_SHA  $PRIOR/completed-dist.tar.gz" | sha256sum --check
          export QA_OUT="$OUT" QA_PRIOR="$PRIOR"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';import {execFileSync as git} from 'node:child_process';
          const ref=x=>git('git',['rev-parse',x]).toString().trim(),out=process.env.QA_OUT,prior=process.env.QA_PRIOR,pins=JSON.parse(process.env.QA_PATCHES),paths=Object.keys(pins).sort();
          assert.equal(ref('HEAD^'),process.env.CORE);assert.equal(ref('HEAD^^{tree}'),process.env.CORE_TREE);assert.equal(ref(process.env.CORE+'^'),process.env.COMPILED);
          assert.equal(git('git',['diff','--name-status','HEAD^','HEAD']).toString(),'A\t.github/workflows/popular-adapter-repair-20261104.yml\n');
          assert.deepEqual(git('git',['diff','--name-status',process.env.COMPILED,process.env.CORE]).toString().trim().split('\n').sort(),paths.map(p=>'M\t'+p).sort());
          for(const p of paths){assert.match(pins[p],/^[a-f0-9]{40}$/);assert.equal(ref('HEAD:'+p),pins[p]);assert.equal(git('git',['hash-object',p]).toString().trim(),pins[p]);}
          const sums=p=>Object.fromEntries(fs.readFileSync(p,'utf8').trim().split('\n').map(l=>[l.slice(66),l.slice(0,64)])),old=sums(prior+'/source-before.sha256'),now=sums(out+'/source-before.sha256'),wf='.github/workflows/popular-pages-build-20261103.yml',next='.github/workflows/popular-adapter-repair-20261104.yml';
          assert.equal(Object.keys(old).length,5674);
          assert.deepEqual(Object.keys(old).filter(p=>p!==wf).sort(),Object.keys(now).filter(p=>p!==next).sort());
          for(const p of Object.keys(old))if(p!==wf&&!paths.includes(p))assert.equal(now[p],old[p],p);
          NODE
          test ! -e dist
          tar -xzf "$PRIOR/completed-dist.tar.gz"
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > "$OUT/dist-before.sha256"
          cmp "$PRIOR/dist-before.sha256" "$OUT/dist-before.sha256"
      - name: Run only Home and the two original native suites
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund > "$QA_OUT/logs/install.log" 2>&1
          npm install --prefix "$RUNNER_TEMP/tools" --no-audit --no-fund --package-lock=false playwright@1.64.0 >> "$QA_OUT/logs/install.log" 2>&1
          ln -s "$RUNNER_TEMP/tools/node_modules/playwright" node_modules/playwright
          ln -s "$RUNNER_TEMP/tools/node_modules/playwright-core" node_modules/playwright-core
          "$RUNNER_TEMP/tools/node_modules/.bin/playwright" install --with-deps chromium >> "$QA_OUT/logs/install.log" 2>&1
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          home_dir="$GITHUB_WORKSPACE/home-search-recovery-artifacts"
          test ! -e "$home_dir"
          echo "$home_dir" > "$QA_OUT/home-owned.path"
          cat > "$QA_OUT/network-policy.txt" <<'POLICY'
          Home Node processes retain the existing offline preload. Home uses its original in-repository output for dependency resolution.
          Only the two unchanged native driver commands unset NODE_OPTIONS. Their original route policy admits local traffic plus the exact template font stylesheet GET and font GET URLs declared by that stylesheet. Every other external request is closed and retained by the drivers. Native font traffic is not claimed as loopback-only or covered by the Home Node receipt.
          POLICY
          : > "$QA_OUT/transport/home.log"
          failed=0
          run(){ local n="$1"; shift; set +e; SIM_OFFLINE_RECEIPT="$QA_OUT/transport/$n.log" "$@" > "$QA_OUT/logs/$n.log" 2>&1; local rc=$?; set -e; echo "$rc" > "$QA_OUT/exits/$n"; tail -n 3 "$QA_OUT/logs/$n.log"; if [ "$rc" != 0 ]; then failed=1; fi; }
          run home env -u HOME_SEARCH_RECOVERY_ARTIFACTS HOME_SEARCH_RECOVERY_CONTROL=all node scripts/simHomeSearchRecovery.mjs
          run native-season env -u NODE_OPTIONS CAREER_SEASON_REVIEW_NATIVE_ARTIFACTS="$QA_OUT/native-season" node scripts/qa/careerSeasonReview1008.mjs
          run native-decision env -u NODE_OPTIONS CAREER_DECISION_OUTCOME_NATIVE_ARTIFACTS="$QA_OUT/native-decision" node scripts/qa/careerDecisionOutcome1009.mjs
          test ! -s "$QA_OUT/transport/home.log"
          echo "$failed" > "$QA_OUT/checks.exit"
          test "$failed" = 0
      - name: Always retain raw and source and payload holds
        if: always()
        run: |
          set -euo pipefail
          test -d "$QA_OUT"
          if [ -f "$QA_OUT/home-owned.path" ]; then
            home_dir="$(cat "$QA_OUT/home-owned.path")"
            test "$home_dir" = "$GITHUB_WORKSPACE/home-search-recovery-artifacts"
            if [ -d "$home_dir" ]; then
              test ! -e "$QA_OUT/home"
              cp -a "$home_dir" "$QA_OUT/home"
              diff -qr --no-dereference "$home_dir" "$QA_OUT/home"
              rm -rf -- "$home_dir"
              test ! -e "$home_dir"
            else
              echo "Home produced no output directory; its raw log and native exit remain retained." > "$QA_OUT/home-output-missing.txt"
            fi
          fi
          git ls-files -z | sort -z | xargs -0 sha256sum > "$QA_OUT/source-after.sha256"
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > "$QA_OUT/dist-after.sha256"
          git diff --binary HEAD > "$QA_OUT/source-diff.txt"
          git status --porcelain=v1 --untracked-files=all > "$QA_OUT/status-after.txt"
          cmp "$QA_OUT/source-before.sha256" "$QA_OUT/source-after.sha256"
          cmp "$QA_OUT/dist-before.sha256" "$QA_OUT/dist-after.sha256"
          test ! -s "$QA_OUT/source-diff.txt"
          test ! -s "$QA_OUT/status-after.txt"
      - name: Bound evidence
        id: evidence
        if: always()
        run: |
          set -euo pipefail
          test -d "$QA_OUT"
          test "$(du -sb "$QA_OUT" | cut -f1)" -lt 150000000
          echo ready=true >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.evidence.outputs.ready == 'true' }}
        with:
          name: popular-adapter-repair-${{ github.run_id }}
          path: ${{ env.QA_OUT }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
