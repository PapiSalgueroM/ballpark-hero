      - name: Whole source and installed package bodies held
        if: ${{ !cancelled() && steps.prep.outcome == 'success' }}
        run: |
          find src scripts .github/workflows -type f -print0 | sort -z | xargs -0 sha256sum > career-veteran-world-paths-artifacts/source-after.txt
          cmp career-veteran-world-paths-artifacts/source-before.txt career-veteran-world-paths-artifacts/source-after.txt
          sha256sum package.json package-lock.json > career-veteran-world-paths-artifacts/packages-final.txt
          cmp career-veteran-world-paths-artifacts/packages-before.txt career-veteran-world-paths-artifacts/packages-final.txt
          node --input-type=module - <<'JS'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const before=JSON.parse(fs.readFileSync('career-veteran-world-paths-artifacts/dependencies-before.json','utf8'));
          for(const row of before.installed){const actual=JSON.parse(fs.readFileSync(row.directory+'/package.json','utf8'));assert.equal(actual.name,row.name);assert.equal(actual.version,row.version);}
          for(const row of before.omitted)assert(!fs.existsSync(row.directory+'/package.json'));
          fs.writeFileSync('career-veteran-world-paths-artifacts/dependencies-final.json',JSON.stringify(before,null,2));console.log('PASS all 599 locked dependency identities held');
          JS
          git diff --exit-code HEAD -- src scripts .github/workflows package.json package-lock.json > career-veteran-world-paths-artifacts/source-held.log
          du -sb career-veteran-world-paths-artifacts > career-veteran-world-paths-artifacts/artifact-size.log
          test "$(du -sb career-veteran-world-paths-artifacts | cut -f1)" -lt 500000000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
