          const accepted = checkNoResponseCookie(fixture);
          assert.deepEqual(checkNoResponseCookie({}), []);
          assert.deepEqual(accepted, [{ name: '__cf_bm', purpose: 'hosting bot protection', lifetimeSeconds: 1800, httpOnly: true, secure: true, sameSite: 'None', path: '/', domain: 'douknowball.com' }]);
          const lowerCase = { ...fixture, 'set-cookie': fixture['set-cookie'].replace('HttpOnly', 'httponly').replace('SameSite=None', 'samesite=none').replace('Secure', 'secure').replace('Path=/', 'path=/').replace('Domain=', 'domain=').replace('Expires=', 'expires=') };
          assert.deepEqual(checkNoResponseCookie(lowerCase), accepted);
          const faults = [
