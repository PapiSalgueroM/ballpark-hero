          COOKIEJS
          printf '%s  %s\n' 3f5deb32d6175b50aa0df030df449243a6cf9f208a4ff5727bdfe8ff973c1428 "$READBACK_OUT/security-cookie-policy.cjs" | sha256sum --check > "$READBACK_OUT/security-cookie-policy-initial.log"
          node "$READBACK_OUT/security-cookie-controls.cjs" > "$READBACK_OUT/security-cookie-controls.log" 2>&1
          node <<'JS'
          const fs=require('node:fs'),assert=require('node:assert/strict'),{createHash}=require('node:crypto');const hash=body=>createHash('sha256').update(body).digest('hex'),out=process.env.READBACK_OUT;
          for(const [file,pin] of Object.entries({'scripts/auditLive.mjs':'26c387c01ba5cb2a993bf5205228d7b451770eed1c4836d052574c9dc5e3f2de','scripts/lib/liveIndexability.mjs':'133365fa307e7548b4367508a91d2629af24d6cca207e127df294c1a3e23ac40'})){const body=fs.readFileSync(file);assert.equal(hash(body),pin);assert.throws(()=>assert.equal(hash(Buffer.concat([body,Buffer.from('\n')])),pin));}
          const source=fs.readFileSync('.github/workflows/legal-ai-privacy-public-readback.yml','utf8'),pin='37d187d3bc4659ebfdda5d010fb157972c4c8e797b4bab2b3fc27d20ddfe15cb';assert.equal(hash(source),pin);assert.throws(()=>assert.equal(hash(source+'\n'),pin));
          const start='          cat > "$READBACK_OUT/read-only.cjs" <<\'JS\'\n',end='\n          JS\n';assert.equal(source.split(start).length,2);const rest=source.split(start)[1],finish=rest.indexOf(end);assert(finish>0);let guard=rest.slice(0,finish).replace(/^          /gm,'');assert(guard.trimEnd().endsWith('module.exports = { ORIGIN, checkedURL };'));
          const from=guard.indexOf('const paths = new Set('),to=guard.indexOf('function checkedURL(');assert(from>=0&&to>from&&guard.slice(from,to).includes("addPublic('public')"));
          const sitemap=fs.readFileSync('public/sitemap.xml','utf8');const routes=[...new Set([...sitemap.matchAll(/<loc>https?:\/\/[^/]+([^<]*)<\/loc>/g)].map(m=>(m[1]||'/').replace(/\/$/,'')||'/'))].filter(route=>route!=='/');const count=Math.min(24,routes.length),sample=Array.from({length:count},(_,i)=>routes[Math.floor(i*routes.length/count)]);assert.equal(count,24);assert(sample.every(route=>/^\/(?:[a-z0-9-]+\/)*[a-z0-9-]+$/.test(route)));const pages=[...new Set(['/', '/cookie-policy', '/privacy', '/prerender-boot.js',...(process.env.OPERATOR_MODE==='readback'?sample:[])])];assert(!pages.includes('/__siteprivacy1446_unlisted'));
          guard=guard.slice(0,from)+'const paths = new Set('+JSON.stringify(pages)+');\nconst allowedAssets = () => new Set(JSON.parse(fs.readFileSync(path.join(out, "allowed-assets.json"), "utf8")));\nfunction checkRequestBudget(count) { if (!Number.isSafeInteger(count) || count < 0 || count >= Number(process.env.PUBLIC_REQUEST_LIMIT)) throw new Error("PUBLIC_REQUEST_BUDGET"); }\nconst { checkNoResponseCookie } = require("./security-cookie-policy.cjs");\n'+guard.slice(to);
