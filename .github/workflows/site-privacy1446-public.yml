          printf '%s\n' "$status" > "$READBACK_OUT/network-hold.exit";test "$status" -eq 0 || failed=1
          printf '%s\n' "$failed" > "$READBACK_OUT/final-holds.exit"
          (cd "$READBACK_OUT";find . -type f ! -path ./evidence.sha256 -print0 | sort -z | xargs -0 sha256sum) > "$READBACK_OUT/evidence.sha256"
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: siteprivacy1446-public-strict-${{ github.run_id }}-${{ github.run_attempt }}
          path: siteprivacy1446-public-artifacts/
          if-no-files-found: error
          retention-days: 14
