            const expires = attributes.get('expires'), date = headers.date;
            if (typeof expires !== 'string' || typeof date !== 'string' || !/ GMT$/.test(expires) || !/ GMT$/.test(date)) fail();
            const lifetimeSeconds = (Date.parse(expires) - Date.parse(date)) / 1000;
            if (!Number.isFinite(lifetimeSeconds) || lifetimeSeconds <= 0 || lifetimeSeconds > 31 * 60) fail();
            return [{ name: '__cf_bm', purpose: 'hosting bot protection', lifetimeSeconds, httpOnly: true, secure: true, sameSite: 'None', path: '/', domain: 'douknowball.com' }];
          }
          
          module.exports = { checkNoResponseCookie };
          COOKIEJS
          cat > "$READBACK_OUT/security-cookie-controls.cjs" <<'COOKIEJS'
          'use strict';
          
          const fs = require('node:fs'), assert = require('node:assert/strict'), { createHash } = require('node:crypto');
