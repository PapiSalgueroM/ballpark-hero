name: Site privacy1446 public strict
on:
  workflow_dispatch:
  push:
    branches: [codex/site-privacy1446-public-strict]
permissions:
  contents: read
  actions: read
concurrency:
  group: siteprivacy1446-public-readback-${{ github.sha }}
  cancel-in-progress: false
jobs:
  public_operator:
    if: github.ref == 'refs/heads/codex/site-privacy1446-public-strict'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      OPERATOR_MODE: strict
      READBACK_OUT: siteprivacy1446-public-artifacts
      SOURCE_SHA: 4b4d99ebd64f50ffb45bca9d8f56fba6b7e4dcee
      QUALIFIED_BUILD_SHA: 0dc98659137ead9a6a237d64f1a279e5afee7976
      QUALIFICATION_WORKFLOW_SHA256: 8bc53a9567b49f18bf0e56d8930f01690ca70b12891840433abcde074cc2caf5
      INPUT_RUN_ID: 39732838642
      INPUT_OPERATOR_SHA: 0dc98659137ead9a6a237d64f1a279e5afee7976
      INPUT_ARTIFACT_ID: 12406670154
      INPUT_ZIP_SHA256: a903a5e5b559912d6cd5b632bc0540b9ad492d5f2d51cd6ac3bbc17f00d0be53
      INPUT_WORKFLOW_NAME: Site privacy followup1446
      EXPECTED_DEPLOYMENT: 16a8e658-6527-43a1-85ff-d5c3c7d896a4
      OBSERVED_ENTRY: /assets/index-CSqQNs4Q.js
      ASSET_PINS_JSON: REQUIRED_OBSERVED_FOUR_ROLE_JSON_FOR_READBACK
      ASSET_PINS_SHA256: REQUIRED_OBSERVED_FOUR_ROLE_JSON_64_HEX_FOR_READBACK
      PUBLIC_REQUEST_LIMIT: 23
      OPERATOR_SHA256: 307f2c254d8ce17b37b814f235d5eed9216dc396c3acd6be30d2e57f59bebe48
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fail closed on manual bindings before downloads or public requests
        run: |
          set -euo pipefail
          mkdir "$READBACK_OUT"
          git rev-parse HEAD > "$READBACK_OUT/operator-head.txt"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node <<'JS'
          const fs=require('node:fs'),assert=require('node:assert/strict'),{createHash}=require('node:crypto');
          for(const key of ['SOURCE_SHA','QUALIFIED_BUILD_SHA','INPUT_OPERATOR_SHA'])assert.match(process.env[key]||'',/^[a-f0-9]{40}$/);
          for(const key of ['INPUT_RUN_ID','INPUT_ARTIFACT_ID'])assert.match(process.env[key]||'',/^[1-9][0-9]+$/);
          assert.match(process.env.INPUT_ZIP_SHA256||'',/^[a-f0-9]{64}$/);assert.match(process.env.EXPECTED_DEPLOYMENT||'',/^[a-f0-9]{8}(?:-[a-f0-9]{4}){3}-[a-f0-9]{12}$/);assert.notEqual(process.env.EXPECTED_DEPLOYMENT,'00000000-0000-0000-0000-000000000000');
          assert(['strict','intake','readback'].includes(process.env.OPERATOR_MODE));assert.equal(Number(process.env.PUBLIC_REQUEST_LIMIT),process.env.OPERATOR_MODE==='readback'?67:23);for(const key of ['QUALIFICATION_WORKFLOW_SHA256','OPERATOR_SHA256'])assert.match(process.env[key]||'',/^[a-f0-9]{64}$/);
          if(process.env.OPERATOR_MODE!=='readback'){assert.equal(process.env.INPUT_OPERATOR_SHA,process.env.QUALIFIED_BUILD_SHA);assert.equal(process.env.INPUT_WORKFLOW_NAME,'Site privacy followup1446');assert.match(process.env.OBSERVED_ENTRY||'',/^\/assets\/index-[A-Za-z0-9_-]{8}\.js$/);}
          else{assert.equal(process.env.INPUT_WORKFLOW_NAME,'Site privacy1446 public intake');const pins=JSON.parse(process.env.ASSET_PINS_JSON);assert.deepEqual(Object.keys(pins).sort(),['cookiePolicy','entry','privacy','profile']);const hash=value=>createHash('sha256').update(value).digest('hex');assert.match(process.env.ASSET_PINS_SHA256||'',/^[a-f0-9]{64}$/);assert.equal(hash(process.env.ASSET_PINS_JSON),process.env.ASSET_PINS_SHA256);for(const row of Object.values(pins)){assert.deepEqual(Object.keys(row).sort(),['path','sha256']);assert.match(row.path,/^\/assets\/[A-Za-z0-9_.-]+\.js$/);assert.match(row.sha256,/^[a-f0-9]{64}$/);}for(const row of Object.values(pins))for(const other of Object.values(pins))if(row.path===other.path)assert.equal(row.sha256,other.sha256);assert.match(pins.entry.path,/^\/assets\/index-[A-Za-z0-9_-]{8}\.js$/);assert.equal(process.env.OBSERVED_ENTRY,pins.entry.path);}
          fs.writeFileSync(process.env.READBACK_OUT+'/bindings.json',JSON.stringify(Object.fromEntries(['OPERATOR_MODE','SOURCE_SHA','QUALIFIED_BUILD_SHA','INPUT_RUN_ID','INPUT_OPERATOR_SHA','INPUT_ARTIFACT_ID','INPUT_ZIP_SHA256','INPUT_WORKFLOW_NAME','EXPECTED_DEPLOYMENT','OBSERVED_ENTRY','ASSET_PINS_JSON','ASSET_PINS_SHA256','QUALIFICATION_WORKFLOW_SHA256','OPERATOR_SHA256','PUBLIC_REQUEST_LIMIT'].map(key=>[key,process.env[key]])),null,2)+'\n');
          JS
      - name: Rebind successful input run and download its exact artifact before public guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "/repos/PapiSalgueroM/ballpark-hero/actions/runs/$INPUT_RUN_ID" > "$READBACK_OUT/input-run.json"
          gh api "/repos/PapiSalgueroM/ballpark-hero/actions/runs/$INPUT_RUN_ID/artifacts?per_page=100" > "$READBACK_OUT/input-artifacts.json"
          gh api "/repos/PapiSalgueroM/ballpark-hero/actions/runs/$INPUT_RUN_ID/jobs?per_page=100" > "$READBACK_OUT/input-jobs.json"
          node <<'JS'
          const fs=require('node:fs'),assert=require('node:assert/strict'),out=process.env.READBACK_OUT;const run=JSON.parse(fs.readFileSync(out+'/input-run.json'));assert.equal(String(run.id),process.env.INPUT_RUN_ID);assert.equal(run.head_sha,process.env.INPUT_OPERATOR_SHA);assert.equal(run.status,'completed');assert.equal(run.conclusion,'success');assert.equal(run.name,process.env.INPUT_WORKFLOW_NAME);assert.equal(run.repository.full_name,'PapiSalgueroM/ballpark-hero');const jobs=JSON.parse(fs.readFileSync(out+'/input-jobs.json'));assert.equal(jobs.total_count,process.env.OPERATOR_MODE==='readback'?1:6);assert.equal(jobs.jobs.length,jobs.total_count);assert(jobs.jobs.every(job=>job.status==='completed'&&job.conclusion==='success'));const listed=JSON.parse(fs.readFileSync(out+'/input-artifacts.json'));assert(listed.total_count>0&&listed.total_count<=100);assert.equal(listed.artifacts.length,listed.total_count);const chosen=listed.artifacts.filter(row=>String(row.id)===process.env.INPUT_ARTIFACT_ID);assert.equal(chosen.length,1);assert.equal(chosen[0].expired,false);assert.equal(chosen[0].digest,'sha256:'+process.env.INPUT_ZIP_SHA256);assert.equal(String(chosen[0].workflow_run.id),process.env.INPUT_RUN_ID);assert.equal(chosen[0].workflow_run.head_sha,process.env.INPUT_OPERATOR_SHA);const prefix=process.env.OPERATOR_MODE!=='readback'?'site-privacy1446-build-final-':'siteprivacy1446-public-intake-';assert(chosen[0].name.startsWith(prefix+process.env.INPUT_RUN_ID+'-'));
          JS
          gh api "/repos/PapiSalgueroM/ballpark-hero/actions/artifacts/$INPUT_ARTIFACT_ID/zip" > "$READBACK_OUT/input.zip"
          printf '%s  %s\n' "$INPUT_ZIP_SHA256" "$READBACK_OUT/input.zip" | sha256sum --check > "$READBACK_OUT/input-zip-hold.log"
          python <<'PY'
          import os,pathlib,zipfile,tarfile,hashlib,json,re,stat
          out=pathlib.Path(os.environ['READBACK_OUT']).resolve();target=out/'input';target.mkdir()
          def safe(name):
              part=pathlib.PurePosixPath(name)
              assert name and not part.is_absolute() and '..' not in part.parts and '\\' not in name and ':' not in name
              return part
          with zipfile.ZipFile(out/'input.zip') as archive:
              names=set()
              for item in archive.infolist():
                  safe(item.filename);assert item.filename not in names;names.add(item.filename);assert not stat.S_ISLNK(item.external_attr>>16)
              archive.extractall(target)
          manifest={}
          for line in (target/'evidence.sha256').read_text().splitlines():
              match=re.fullmatch(r'([a-f0-9]{64})  (?:\./)?(.+)',line);assert match
              name=str(safe(match[2]));assert name not in manifest and name!='evidence.sha256';manifest[name]=match[1]
          actual={str(p.relative_to(target)) for p in target.rglob('*') if p.is_file()}-{'evidence.sha256'}
          assert actual==set(manifest) and actual
          for name,expected in manifest.items():assert hashlib.sha256((target/name).read_bytes()).hexdigest()==expected
          if os.environ['OPERATOR_MODE']!='readback':
              assert (target/'head.txt').read_text().strip()==os.environ['QUALIFIED_BUILD_SHA']
              assert (target/'phase.txt').read_text().strip()=='final'
              assert (target/'generated.patch').stat().st_size==0 and (target/'generated-files.txt').stat().st_size==0
              assert (target/'browser.exit').read_text().strip()=='0'
              browser=json.loads((target/'browser/report.json').read_text());assert browser['complete'] is True and browser['status']=='PASS' and browser['source']==os.environ['QUALIFIED_BUILD_SHA'] and browser['phase']=='green'
              assert len(browser['positives'])==4 and len(browser['faults'])==3 and len(browser['restorations'])==3 and not browser['errors'] and browser['actualOutbound']==0 and browser['holds']['unchanged'] is True
              assert all(r['status']=='PASS' for r in browser['positives']) and all(r['detected'] is True for r in browser['faults']) and all(r['status']=='PASS' and r['wholeByteRestoration'] is True for r in browser['restorations'])
              source_rows=(target/'source-before.sha256').read_text().splitlines();assert (os.environ['QUALIFICATION_WORKFLOW_SHA256']+'  .github/workflows/site-privacy-followup-1446.yml') in source_rows
              assert (target/'final-holds.exit').read_text().strip()=='0'
              assert json.loads((target/'transport-hold.json').read_text())['zeroActualAttempts'] is True
              assert all(p.stat().st_size==0 for p in target.rglob('*.transport'))
              dest=out/'input-dist';dest.mkdir()
              with tarfile.open(target/'dist.tar.gz') as archive:
                  for item in archive.getmembers():safe(item.name);assert item.isdir() or item.isfile()
                  archive.extractall(dest,filter='data')
              dist_manifest={}
              for line in (target/'dist.sha256').read_text().splitlines():
                  match=re.fullmatch(r'([a-f0-9]{64})  dist/(.+)',line);assert match
                  name=str(safe(match[2]));assert name not in dist_manifest;dist_manifest[name]=match[1]
              actual_dist={str(p.relative_to(dest)) for p in dest.rglob('*') if p.is_file()}
              assert actual_dist==set(dist_manifest) and actual_dist
              for name,expected in dist_manifest.items():assert hashlib.sha256((dest/name).read_bytes()).hexdigest()==expected
          else:
              prior=json.loads((target/'readback.json').read_text());assert prior['complete'] is True and prior['diagnosticOnly'] is True and prior['mode']=='intake'
              assert prior['operator']==os.environ['INPUT_OPERATOR_SHA'] and str(prior['run'])==os.environ['INPUT_RUN_ID']
              assert prior['source']==os.environ['SOURCE_SHA'] and prior['qualified']==os.environ['QUALIFIED_BUILD_SHA'] and prior['deployment']==os.environ['EXPECTED_DEPLOYMENT']
          (out/'input-provenance.json').write_text(json.dumps({'complete':True,'run':os.environ['INPUT_RUN_ID'],'operator':os.environ['INPUT_OPERATOR_SHA'],'artifact':os.environ['INPUT_ARTIFACT_ID'],'zipSha256':os.environ['INPUT_ZIP_SHA256'],'manifestFiles':len(manifest)},indent=2)+'\n')
          PY
      - name: Hold exact published source and qualified generated patch
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$SOURCE_SHA" > "$READBACK_OUT/source-fetch.log" 2>&1
          git fetch --no-tags --depth=1 origin "$QUALIFIED_BUILD_SHA" >> "$READBACK_OUT/source-fetch.log" 2>&1
          git show "$QUALIFIED_BUILD_SHA:.github/workflows/site-privacy-followup-1446.yml" > "$READBACK_OUT/qualification-workflow.yml"
          printf '%s  %s\n' "$QUALIFICATION_WORKFLOW_SHA256" "$READBACK_OUT/qualification-workflow.yml" | sha256sum --check > "$READBACK_OUT/qualification-workflow-hold.log"
          git diff --exit-code "$SOURCE_SHA" HEAD -- . ':!docs/**' ':!.github/workflows/site-privacy1446-public.yml' > "$READBACK_OUT/published-source-hold.log"
          git diff --exit-code "$QUALIFIED_BUILD_SHA" "$SOURCE_SHA" -- . ':!docs/**' ':!.github/workflows/site-privacy1446-public.yml' > "$READBACK_OUT/qualified-source-hold.log"
          qualified_input="$READBACK_OUT/input";if test "$OPERATOR_MODE" = readback;then qualified_input="$READBACK_OUT/input/input";fi
          test -f "$qualified_input/generated.patch" && test ! -s "$qualified_input/generated.patch"
          test -f "$qualified_input/generated-files.txt" && test ! -s "$qualified_input/generated-files.txt"
          sha256sum "$qualified_input/generated.patch" "$qualified_input/generated-files.txt" > "$READBACK_OUT/qualified-fixed-point.sha256"
          git diff --binary "$QUALIFIED_BUILD_SHA" "$SOURCE_SHA" -- public scripts/data/lastmod.json > "$READBACK_OUT/adopted-generated.patch"
          cmp "$qualified_input/generated.patch" "$READBACK_OUT/adopted-generated.patch" > "$READBACK_OUT/qualified-generated-patch-hold.log"
          git ls-files -z -- . | sort -z | xargs -0 sha256sum > "$READBACK_OUT/source-before.sha256"
      - name: Isolated pinned request and parser tools without an app build or browser installation
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/siteprivacy1446-public-tools"
          npm install --prefix "$tools" --no-save --package-lock=false playwright@1.64.0 jsdom@20.0.3 es-module-lexer@1.7.0 acorn@8.15.0 > "$READBACK_OUT/tooling.log" 2>&1
          test ! -e node_modules;mkdir node_modules
          for package in playwright playwright-core jsdom;do ln -s "$tools/node_modules/$package" "node_modules/$package";done
          echo "NODE_PATH=$tools/node_modules" >> "$GITHUB_ENV"
      - name: Narrow the pinned historical public guard without editing it
        run: |
          set -euo pipefail
          cat > "$READBACK_OUT/security-cookie-policy.cjs" <<'COOKIEJS'
          'use strict';
          
          function checkNoResponseCookie(headers) {
            const fail = () => { throw new Error('PUBLIC_RESPONSE_COOKIE'); };
