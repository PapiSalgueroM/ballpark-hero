            ['wrong-domain', { ...fixture, 'set-cookie': fixture['set-cookie'].replace('Domain=douknowball.com', 'Domain=other.invalid') }],
            ['wrong-same-site', { ...fixture, 'set-cookie': fixture['set-cookie'].replace('SameSite=None', 'SameSite=Lax') }],
            ['missing-expiry', { ...fixture, 'set-cookie': fixture['set-cookie'].replace('; Expires=Thu, 22 Oct 2026 07:30:00 GMT', '') }],
            ['invalid-expiry', { ...fixture, 'set-cookie': fixture['set-cookie'].replace('Expires=Thu, 22 Oct 2026 07:30:00 GMT', 'Expires=CONTROL') }],
            ['invalid-server-date', { ...fixture, date: 'CONTROL GMT' }],
