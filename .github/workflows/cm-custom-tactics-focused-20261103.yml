            cp "$QA_OUT/original/fixed-live.tsx" src/components/club-manager/LiveSimScreen.tsx
          }
          trap restore_leaves EXIT
          run_units() {
            UNIT_PROFILE="$1" node --input-type=module <<'NODE'
