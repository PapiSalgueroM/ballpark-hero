            CM_CUSTOM_STAGE_RAW: 'pitch', CM_CUSTOM_PLAN_STORE_RAW: 'store',
            CM_CUSTOM_STAGE_MISSING_RAW: 'pitch-middle',
          };
          for (const [key, group] of Object.entries(rawGroups)) {
            env[key] = raw + '/' + group; fs.mkdirSync(env[key], { recursive: true });
          }
          const receipt = out + '/transport/' + name + '.log'; fs.writeFileSync(receipt, '');
          env.SIM_OFFLINE_RECEIPT = receipt;
          const reportPath = out + '/units/' + name + '.json';
          const args = ['node_modules/vitest/vitest.mjs', 'run', ...Object.keys(profile.files),
            '--maxWorkers=1', '--minWorkers=1', '--reporter=default', '--reporter=json', '--outputFile=' + reportPath];
          const run = spawnSync(process.execPath, args, { env, encoding: 'utf8', timeout: 25 * 60 * 1000, maxBuffer: 64 * 1024 * 1024 });
          const log = (run.stdout || '') + '\n' + (run.stderr || '');
          fs.writeFileSync(out + '/logs/' + name + '.log', log);
          fs.writeFileSync(out + '/units/' + name + '.exit', String(run.status) + '\n');
          process.stdout.write(log);
          assert.ok(!run.error && !run.signal, 'The actual focused process must finish');
          const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
          const failures = profile.failures, failedNames = Object.keys(failures);
          const total = Object.values(profile.files).reduce((sum, count) => sum + count, 0);
          assert.equal(run.status, failedNames.length ? 1 : 0);
