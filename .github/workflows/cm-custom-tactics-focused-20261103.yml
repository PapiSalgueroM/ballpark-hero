ticsPitch.test.ts":3,"src/test/cmCustomTacticsPitchMissingPlayer.test.ts":1},"failures":{"Club Manager custom live pitch input projects the marked live snapshot into actual pitch input while keeping roles, opponent and feed unchanged":"CM_CUSTOM_STAGE_CURRENT_POINTS","Club Manager custom live pitch input uses the same strictly-after history snapshot and canonical indexes as the live lineup":"CM_CUSTOM_STAGE_HISTORY_POINTS","Club Manager custom pitch with an actual missing player keeps the surviving custom-point indexes after an actual middle-slot red card or injury":"CM_CUSTOM_STAGE_MIDDLE_SLOT_POINTS"},"raw":{"pitch":["current.json","history.json","legacy.json"],"pitch-middle":["middle-departure.json"]}},"restored-live":{"files":{"src/test/cmCustomTacticsPitch.test.ts":3,"src/test/cmCustomTacticsPitchMissingPlayer.test.ts":1},"failures":{},"raw":{"pitch":["current.json","history.json","legacy.json"],"pitch-middle":["middle-departure.json"]}}};
          const name = process.env.UNIT_PROFILE, profile = profiles[name], out = process.env.QA_OUT;
          assert.ok(profile, 'A frozen profile is required');
          const raw = out + '/raw/' + name, env = { ...process.env };
          const rawGroups = {
