          test "$(git hash-object "$OUT/original/ported-hook.ts")" = 2783e5af21cf45a823f232d2a9e9c1d70ad3fc69
          test "$(git hash-object "$OUT/original/main-engine.ts")" = cf378e002c1f253a4cd48a147af66117f982f6b2
          test "$(git hash-object "$OUT/original/main-live.tsx")" = 9f56faecfc7d342046820ab51f8e62bbd2bdd8ba
          npm ci --no-audit --no-fund > "$OUT/install.log" 2>&1
      - name: Proper types and scoped positive and physical-original unit arms
