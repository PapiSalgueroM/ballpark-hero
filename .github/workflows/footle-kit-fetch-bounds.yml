          else failed=1;fi
          if test -f "$out/dependency-members.before";then cmp "$out/dependency-members.before" "$out/dependency-members.after" > "$out/final-dependency-members.log" 2>&1 || failed=1;else failed=1;fi
          if test -f "$out/dependencies-before.sha256";then sha256sum -c "$out/dependencies-before.sha256" > "$out/final-dependency-hash.log" 2>&1 || failed=1;cmp "$out/dependencies-before.sha256" "$out/dependencies-after.sha256" > "$out/final-dependency-manifest.log" 2>&1 || failed=1;else failed=1;fi
          if test -f "$out/generated.sha256";then sha256sum -c "$out/generated.sha256" > "$out/generated-before-final.log" 2>&1;generated=$?;test "$generated" -eq 0 || failed=1;else generated=1;failed=1;fi
          : > "$out/final-binding.transport";: > "$out/holds.transport"
          if test "$generated" -eq 0;then
            NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$out/final-binding.transport" timeout --signal=TERM --kill-after=15s 90s node "$out/inspector.cjs" final > "$out/final-binding.stdout.log" 2> "$out/final-binding.stderr.log"
            final_status=$?;printf '%s\n' "$final_status" > "$out/final-binding.exit"
