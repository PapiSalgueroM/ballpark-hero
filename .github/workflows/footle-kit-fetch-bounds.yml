          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$out/holds.transport" timeout --signal=TERM --kill-after=15s 90s node <<'FOOTLE_FINAL_BINDING' > "$out/holds-binding.stdout.log" 2> "$out/holds-binding.stderr.log"
          const fs=require('node:fs'),path=require('node:path'),a=require('node:assert/strict'),cp=require('node:child_process'),out=process.env.FOOTLE_PROOF_OUT;
          const file=p=>path.join(out,p),read=p=>{const f=file(p);a(fs.existsSync(f),'FOOTLE_REQUIRED_PRESENT_FILE');const s=fs.lstatSync(f);a(s.isFile()&&!s.isSymbolicLink(),'FOOTLE_REQUIRED_REGULAR_FILE');return fs.readFileSync(f);},load=p=>JSON.parse(read(p));
          a.equal(cp.execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),process.env.GITHUB_SHA);
          const final=load('final-admission.json');a.equal(final.status,'SCOPED_BOUNDED_FETCH_PROOF_ADMITTED');a.equal(final.source,process.env.GITHUB_SHA);a.equal(final.run,process.env.GITHUB_RUN_ID);a.equal(final.attempt,process.env.GITHUB_RUN_ATTEMPT);a.equal(final.nativeProofChildren,26);a.equal(new Set(final.distinctPids).size,26);a.equal(final.liveOutcomes,0);a.equal(final.fullSuiteExecuted,false);
          const empty=['source.transport','types.transport','capture.transport','admission.transport','records.transport','final-binding.transport','holds.transport','processes/fixture-cohort/transport.log'];
          for(const id of ['third-attempt','retry-next-range','wrong-delay','lost-terminal-cause','accept-incomplete-ceiling'])for(const role of ['healthy','fault','restored'])empty.push('processes/'+id+'-'+role+'/transport.log');
          for(const id of ['missing-denial','changed-terminal-cause','false-live-success'])for(const role of ['healthy','fault','restored'])empty.push('processes/record-'+id+'-'+role+'/transport.log');
          a.equal(empty.length,32);for(const p of empty)a.equal(read(p).length,0,'FOOTLE_REQUIRED_EMPTY_TRANSPORT');
          const receipt=read('processes/actual-cli/transport.log').toString('utf8'),denial='[SIM_OFFLINE_BLOCK] database fetch https://flawuiqbvjobmkfkauhw.supabase.co\n';a.equal(receipt,denial.repeat(2),'FOOTLE_CLI_TWO_DENIALS');
          for(const name of ['foundation','install','dependency-inventory','source-after-install','source','types','capture','admission','records','final-binding'])a.equal(read(name+'.exit').toString('utf8').trim(),'0','FOOTLE_REQUIRED_NATIVE_ZERO');
          fs.writeFileSync(file('physical-final-binding.json'),JSON.stringify({status:'FULL_NATIVE_COPIES_AND_THIRTY_THREE_RECEIPTS_HELD',source:process.env.GITHUB_SHA,emptyExecutedReceipts:32,typedOriginalCLITwoDenialReceipts:1,recordDataCopiesNotExecutionReceipts:true,nativeProofChildren:26,syntheticNamedCases:7,liveOutcomeCredit:0,fullSuiteExecuted:false},null,2)+'\n',{flag:'wx'});
          FOOTLE_FINAL_BINDING
          holds_status=$?;printf '%s\n' "$holds_status" > "$out/holds-binding.exit"
          test "$holds_status" -eq 0 || failed=1
          if test -f "$out/generated.sha256";then sha256sum -c "$out/generated.sha256" > "$out/generated-after-final.log" 2>&1 || failed=1;else failed=1;fi
          for name in foundation install dependency-inventory source-after-install source types capture admission records final-binding holds-binding;do test -f "$out/$name.exit" && test ! -L "$out/$name.exit" && test "$(cat "$out/$name.exit")" = 0 || failed=1;done
          for name in source types capture admission records final-binding holds;do test -f "$out/$name.transport" && test ! -L "$out/$name.transport" && test ! -s "$out/$name.transport" || failed=1;done
