name: Footle bounded-fetch targeted proof
on:
  push:
    branches: [codex/footle-kit-fetch-bounds-20261024]
    paths-ignore: ['docs/**']
permissions:
  contents: read
concurrency:
  group: footle-kit-fetch-bounds-${{ github.sha }}
  cancel-in-progress: false
env:
  EXPECTED_PARENT: 4b2415c398c8bd0a1544510aa35b760cf5f4bccd
  CI: '1'
  SIM_NETWORK: offline
  TZ: UTC
jobs:
  bounded_fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - name: Fresh outside-checkout evidence
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/footle-kit-fetch-bounds-proof";test ! -e "$base";mkdir -m 700 "$base"
          out="$base/evidence";mkdir -m 700 "$out"
          echo "FOOTLE_PROOF_OUT=$out" >> "$GITHUB_ENV"
          printf '%s\n' "$GITHUB_SHA" > "$out/head.txt"
          printf '%s\n' "$GITHUB_RUN_ID" > "$out/run-id.txt"
          printf '%s\n' "$GITHUB_RUN_ATTEMPT" > "$out/run-attempt.txt"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - name: Exact two proof paths and complete unchanged parent source
        id: foundation
        timeout-minutes: 3
        run: |
          set +e
          set -uo pipefail
          out="$FOOTLE_PROOF_OUT"
          (
            set -euo pipefail
            test "$GITHUB_REPOSITORY" = PapiSalgueroM/ballpark-hero
            test "$GITHUB_REPOSITORY_ID" = 1195729679
            test "$GITHUB_EVENT_NAME" = push
            test "$GITHUB_REF" = refs/heads/codex/footle-kit-fetch-bounds-20261024
            test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
            test "$(git show -s --format=%P HEAD)" = "$EXPECTED_PARENT"
            test "$(git rev-parse "$EXPECTED_PARENT^{tree}")" = be77442e9752576e8cc23f1f687246f123a824dd
            git diff --name-status "$EXPECTED_PARENT" HEAD > "$out/direct-paths.txt"
            printf 'A\t.github/workflows/footle-kit-fetch-bounds.yml\nM\tscripts/simFootleKitNumbers.mjs\n' | cmp - "$out/direct-paths.txt"
            git diff --exit-code "$EXPECTED_PARENT" HEAD -- . ':!.github/workflows/footle-kit-fetch-bounds.yml' ':!scripts/simFootleKitNumbers.mjs' > "$out/all-other-parent-source-held.log"
            test "$(git rev-parse "$EXPECTED_PARENT:scripts/simFootleKitNumbers.mjs")" = 7156493c7aa31e8ef74e5ec418a34d8cb447914a
            test "$(git hash-object scripts/simFootleKitNumbers.mjs)" = 23fb20ede4cc120f7aa3bf86cec9d7f49149fc13
            test -z "$(git ls-tree --name-only "$EXPECTED_PARENT" -- .github/workflows/footle-kit-fetch-bounds.yml)"
            test -z "${FOOTLE_KIT_CONTROL-}"
            for name in NODE_OPTIONS FOOTLE_FIXTURE_OUT FOOTLE_CLI_FATAL;do
              if printenv "$name" > /dev/null;then printf '%s\n' "Inherited proof override refused: $name" >&2;exit 1;fi
            done
            git rev-parse HEAD^{tree} > "$out/tree.txt"
            git ls-files -z | sort -z > "$out/source-members.before"
            test "$(tr -cd '\000' < "$out/source-members.before" | wc -c)" -eq 5344
            xargs -0 sha256sum < "$out/source-members.before" > "$out/source-before.sha256"
            tar --null --files-from="$out/source-members.before" -czf "$out/current-source.tar.gz"
            git status --porcelain --untracked-files=all > "$out/status-before.txt";test ! -s "$out/status-before.txt"
            base64 --decode > "$out/inspector.cjs" <<'FOOTLE_INSPECTOR_BYTES'
