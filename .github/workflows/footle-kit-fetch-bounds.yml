          if test -f "$out/source-before.sha256";then sha256sum -c "$out/source-before.sha256" > "$out/final-source-hash.log" 2>&1 || failed=1;cmp "$out/source-before.sha256" "$out/source-after.sha256" > "$out/final-source-manifest.log" 2>&1 || failed=1;else failed=1;fi
