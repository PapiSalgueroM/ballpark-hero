          inventory=$?;printf '%s\n' "$inventory" > "$out/dependency-inventory.exit"
          sha256sum -c "$out/source-before.sha256" > "$out/source-after-install.log"
          held=$?;printf '%s\n' "$held" > "$out/source-after-install.exit"
          test "$inventory" -eq 0 && test "$held" -eq 0
      - name: Actual source binding and application TypeScript
        id: types
        timeout-minutes: 7
        run: |
