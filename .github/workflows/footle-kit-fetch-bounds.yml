            printf 'b426a5be59f8c430309c32cadd65907c7f7fc0f2b79c2027fdef9218500ba656  %s\n06a7321c9d40ab784f3dcfbe1ad30ef3f54449929dbc4091aea9d391bbb6be98  %s\n678ed8e1b3414d490a3a755d621c66af9c0ff538fb2e1a3947374b7d010207eb  %s\n' "$out/inspector.cjs" "$out/loop-fixtures.cjs" "$out/cli-monitor.cjs" > "$out/generated.sha256"
