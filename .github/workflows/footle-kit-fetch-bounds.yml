      - name: Locked dependencies with complete membership and all body hashes
        id: install
        timeout-minutes: 8
        run: |
          set +e
          set -uo pipefail
          out="$FOOTLE_PROOF_OUT"
          npm ci > "$out/install.stdout.log" 2> "$out/install.stderr.log"
          status=$?;printf '%s\n' "$status" > "$out/install.exit"
