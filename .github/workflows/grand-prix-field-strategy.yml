name: Grand Prix field strategy verification

on:
  push:
    branches: [codex/grand-prix-field-strategy-fixed-20261103]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      CI: '1'
      SIM_NETWORK: offline
      GP_FIELD_PHASE: fixed
      GP_FIELD_OUT: ${{ github.workspace }}/gp-field-artifacts
      GP_FIELD_MUTATIONS: ${{ github.workspace }}/scripts/qa/grandPrixFieldSourceMap.json
      GP_TOOLS: ${{ github.workspace }}/tmp/gp-field-tools
      FREE_KICK_FONT_CACHE: ${{ github.workspace }}/gp-field-artifacts/font-cache
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Exact source fence and capture
        id: source
        run: |
          mkdir -p "$GP_FIELD_OUT"
          echo '127.0.0.1 flawuiqbvjobmkfkauhw.supabase.co' | sudo tee -a /etc/hosts
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          import {createHash} from 'node:crypto';
          const git=(...a)=>execFileSync('git',a,{encoding:'utf8'}).trimEnd(),parent='3de519d296ee1b09013d5f3728b4dbe44dafdcfa';
          assert.equal(git('rev-parse','HEAD^'),parent);
          assert.equal(git('rev-parse','HEAD^^{tree}'),'228582bc5686430b38acdcf971d3608c4a9c6791');
          assert.equal(git('status','--porcelain','--untracked-files=no'),'');
          const bindings={
            'src/pages/GrandPrixBoss.tsx':{git:'3d70b6f41cc090ea88ac7ac899d1e26ebbd809b4',sha256:'e2f816673010d58e48d3ea329fb604ebc90f2695a9660cabaaccebb5191d4161'},
            'scripts/simGrandPrixBossManagement.mjs':{git:'5708d03d6094a293fc701860828b635c95f676c1',sha256:'f7edba7da0f895fb74fb177fb190f02bfecd4c884957b47ffa8f321a504a75dc'},
            'scripts/qa/verifyGrandPrixFieldStrategyUnits.mjs':{git:'ac7288f304c7d8f88bf9c5cae23da202737de6fc',sha256:'162a01a90d9f2a1e5ef561981bec910b93e86e019edee68bf9e4e5f1f9257b76'},
            'scripts/qa/grandPrixFieldPriorIdentities.json':{git:'79ccb7efe6c8ca0ccd33e57302d48c6b7674a039',sha256:'f494151acabeb328174f164c08ceb6fcf3bb3f0a325a8d3bb4cd2ee16f662777'},
            'src/test/grandPrixBossFieldStrategy.test.tsx':{git:'8c402d44b0263be1acd80115065312b56805013e',sha256:'396d114f58dccecea2abb870357cb503c4ec18ad29fb4cc8617f60b91a4140bd'},
            'scripts/qa/grandPrixFieldSourceMap.json':{git:'0767f8efe860b988db21465129d0c0dde7efe529',sha256:'7a64edc58b67d9389d01ec755c2d5e9ea459689edf7ce473f805efa9a60cb065'},
            'scripts/qa/prepareGrandPrixFieldApp.mjs':{git:'aeef0edeeee1072cb662225b118564a74ad14509',sha256:'36ea0b8984eb9a88fa4e17ad7ade5ccb087124c6f6f321ee8c8c749ddc483d5c'},
            'scripts/qa/playGrandPrixFieldApp.mjs':{git:'ff1cb1c46c553c93af302f55f07e617562184bfb',sha256:'5239294d833bc6a44886b4997f9241d71394da1e02078725aa7aa82c16737c53'},
            'scripts/qa/fixtures/siteFonts.captured.json':{git:'6111bd87a083d02447dc6e2c32d7d0e5c0584955',sha256:'a6c24e3ec7711d400f53a1baf10a3a6a3925d1f269e48ee0cd14bdca5b749938'},
          };
          assert(!JSON.stringify(bindings).includes('PENDING_'),'Bind reviewed product/map/prep/driver objects only after actual owned RED');
          const expected=['A\t.github/workflows/grand-prix-field-strategy.yml','A\tscripts/qa/fixtures/siteFonts.captured.json','A\tscripts/qa/grandPrixFieldPriorIdentities.json','A\tscripts/qa/grandPrixFieldSourceMap.json','A\tscripts/qa/playGrandPrixFieldApp.mjs','A\tscripts/qa/prepareGrandPrixFieldApp.mjs','A\tscripts/qa/verifyGrandPrixFieldStrategyUnits.mjs','A\tsrc/test/grandPrixBossFieldStrategy.test.tsx','M\tscripts/simGrandPrixBossManagement.mjs','M\tsrc/pages/GrandPrixBoss.tsx'];
          const actual=git('diff','--name-status',parent,'HEAD').split('\n').filter(Boolean).sort();assert.deepEqual(actual,expected.sort());
          const tree=ref=>new Map(git('ls-tree','-r','--full-tree',ref).split('\n').filter(Boolean).map(line=>{
            const m=line.match(/^(\d+) (blob) ([a-f0-9]{40})\t(.+)$/);assert(m,'Exact blob/mode tree row');return[m[4],{mode:m[1],type:m[2],git:m[3]}];
          }));
          const before=tree(parent),after=tree('HEAD'),modified=new Set(['src/pages/GrandPrixBoss.tsx','scripts/simGrandPrixBossManagement.mjs']);
          assert.equal(before.size,5689);assert.equal(after.size,5697);let held=0;
          for(const [file,row]of before){if(modified.has(file))continue;assert.deepEqual(after.get(file),row,file+' complete parent blob and mode held');held++;}
          assert.equal(held,5687);
          for(const [file,pin]of Object.entries(bindings)){
            const row=after.get(file);assert(row);assert.equal(row.mode,'100644');assert.equal(row.type,'blob');assert.equal(row.git,pin.git,file);
            assert.equal(createHash('sha256').update(fs.readFileSync(file)).digest('hex'),pin.sha256,file);
          }
          fs.writeFileSync(process.env.GP_FIELD_OUT+'/source-fence.json',JSON.stringify({head:git('rev-parse','HEAD'),tree:git('rev-parse','HEAD^{tree}'),parent,parentTree:'228582bc5686430b38acdcf971d3608c4a9c6791',parentBlobs:before.size,sourceBlobs:after.size,parentOtherBlobsHeld:held,changes:actual,bindings,phase:'fixed'},null,2));
          NODE
          git ls-files -z | sort -z | xargs -0 sha256sum > "$GP_FIELD_OUT/source-before.sha256"
          cat > "$GP_FIELD_OUT/capture.sh" <<'SH'
          capture() {
            local label="$1"
            shift
            set +e
            "$@" > "$GP_FIELD_OUT/$label.stdout.log" 2> "$GP_FIELD_OUT/$label.stderr.log"
            local code=$?
            set -e
            printf '%s\n' "$code" > "$GP_FIELD_OUT/$label.exit.txt"
            cat "$GP_FIELD_OUT/$label.stdout.log"
            cat "$GP_FIELD_OUT/$label.stderr.log" >&2
            return "$code"
          }
          SH
          mkdir -p "$GP_FIELD_OUT/selected-source"
          cp src/pages/GrandPrixBoss.tsx src/lib/grandPrixBoss.ts src/hooks/useGrandPrixBoss.ts src/test/grandPrixBossDecisionInfo.test.tsx src/test/grandPrixBossRaceTiming.test.tsx src/test/grandPrixBossFieldStrategy.test.tsx scripts/qa/grandPrixFieldPriorIdentities.json scripts/qa/grandPrixFieldSourceMap.json scripts/qa/verifyGrandPrixFieldStrategyUnits.mjs scripts/qa/prepareGrandPrixFieldApp.mjs scripts/qa/playGrandPrixFieldApp.mjs scripts/simGrandPrixBossManagement.mjs scripts/simGrandPrixBossLifecyclePage.mjs .github/workflows/grand-prix-field-strategy.yml "$GP_FIELD_OUT/selected-source/"
          mkdir -p "$GP_FIELD_OUT/input"
          cp scripts/qa/fixtures/siteFonts.captured.json "$GP_FIELD_OUT/input/"
      - name: Locked application install
        id: install
        run: |
          source "$GP_FIELD_OUT/capture.sh"
          capture install npm ci
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const lock=JSON.parse(fs.readFileSync('package-lock.json')),installed=[];
          for(const [p,entry] of Object.entries(lock.packages)){
            if(!p.startsWith('node_modules/')||!fs.existsSync(p+'/package.json'))continue;
            const version=JSON.parse(fs.readFileSync(p+'/package.json')).version;
            assert.equal(version,entry.version,p);installed.push({path:p,version});
          }
          assert(installed.length>0);
          fs.writeFileSync(process.env.GP_FIELD_OUT+'/installed.json',JSON.stringify({node:process.versions,installed,scope:'Locked installed VERSION receipts, not complete dependency binary/member custody.'},null,2));
          NODE
      - name: Isolated pinned browser and image verification tools
        id: tools
        run: |
          source "$GP_FIELD_OUT/capture.sh"
          test ! -e "$GP_TOOLS"
          mkdir -p "$GP_TOOLS"
          printf '{"private":true,"dependencies":{"playwright":"1.64.1"}}\n' > "$GP_TOOLS/package.json"
          capture browser-install env NODE_OPTIONS='' npm install --prefix "$GP_TOOLS" --ignore-scripts --no-audit --no-fund
          test ! -e node_modules/playwright
          test ! -e node_modules/playwright-core
          ln -s "$GP_TOOLS/node_modules/playwright" node_modules/playwright
          ln -s "$GP_TOOLS/node_modules/playwright-core" node_modules/playwright-core
          cp "$GP_TOOLS/package.json" "$GP_TOOLS/package-lock.json" "$GP_FIELD_OUT/input/"
          capture chromium-install env NODE_OPTIONS='' node "$GP_TOOLS/node_modules/playwright/cli.js" install --with-deps chromium
          capture python-venv env NODE_OPTIONS='' python3 -m venv "$GP_TOOLS/python"
          capture python-install env NODE_OPTIONS='' "$GP_TOOLS/python/bin/python" -m pip install fonttools==4.60.1 Pillow==11.3.0
          "$GP_TOOLS/python/bin/python" -m pip freeze > "$GP_FIELD_OUT/python-versions.txt"
          echo "$GP_TOOLS/python/bin" >> "$GITHUB_PATH"
      - name: Materialize only nine already-held font bodies and cache adapter
        run: |
          set -euo pipefail
          out="$GP_FIELD_OUT"
          env NODE_OPTIONS='' node --input-type=module <<'FONTS'
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { gunzipSync } from 'node:zlib';
          const sha=b=>createHash('sha256').update(b).digest('hex'),raw=fs.readFileSync('scripts/qa/fixtures/siteFonts.captured.json');
          assert.equal(raw.length,1600766);assert.equal(sha(raw),'a6c24e3ec7711d400f53a1baf10a3a6a3925d1f269e48ee0cd14bdca5b749938');
          const rows=JSON.parse(raw).entries,dir=process.env.FREE_KICK_FONT_CACHE;assert.equal(rows.length,9);fs.mkdirSync(dir,{recursive:true});
          const manifest=[];
          for(const row of rows){
            assert.equal(row.encoding,'gzip+hex');assert(['https://fonts.googleapis.com','https://fonts.gstatic.com'].includes(new URL(row.url).origin));
            const body=gunzipSync(Buffer.from(row.body,'hex'));assert.equal(body.length,row.bytes);assert.equal(sha(body),row.sha256);
            const file=path.basename(row.originalFile);assert.equal(file,row.originalFile);assert(/^[a-f0-9]+$/.test(file));
            fs.writeFileSync(path.join(dir,file),body,{flag:'wx'});manifest.push({url:row.url,file,contentType:row.contentType,sha256:row.sha256,bytes:row.bytes});
          }
          assert.equal(new Set(manifest.map(row=>row.url)).size,9);
          fs.writeFileSync(path.join(dir,'manifest.json'),JSON.stringify(manifest,null,2)+'\n');
          fs.writeFileSync(process.env.GP_FIELD_OUT+'/font-custody.json',JSON.stringify({heldFixtureSha256:sha(raw),heldFixtureBytes:raw.length,sourceRun:41443229767,sourceArtifact:13140509319,archiveReacquisitions:0,fontDownloads:0,manifest},null,2)+'\n');
          FONTS
          cat > "$out/cached-fonts.cjs" <<'ADAPTER'
          'use strict';
          const fs=require('node:fs'),path=require('node:path'),assert=require('node:assert/strict'),{createHash}=require('node:crypto');
          const out=process.env.GP_FIELD_OUT,sha=b=>createHash('sha256').update(b).digest('hex');
          const manifest=JSON.parse(fs.readFileSync(path.join(process.env.FREE_KICK_FONT_CACHE,'manifest.json'),'utf8'));
          const cache=new Map(manifest.map(row=>{const body=fs.readFileSync(path.join(process.env.FREE_KICK_FONT_CACHE,row.file));assert.equal(sha(body),row.sha256);return[row.url,{body,contentType:row.contentType,sha256:row.sha256}];}));
          const pw=require(path.join(process.env.GITHUB_WORKSPACE,'node_modules/playwright')),launch=pw.chromium.launch.bind(pw.chromium);
          pw.chromium.launch=async(...args)=>{
            const browser=await launch(...args),newContext=browser.newContext.bind(browser);
            browser.newContext=async(...options)=>{
              const context=await newContext(...options);
              await context.route(/^https:\/\/fonts\.(googleapis|gstatic)\.com\//,async route=>{
                const req=route.request(),url=req.url(),row=cache.get(url);
                if(!row||req.method()!=='GET'){fs.appendFileSync(path.join(out,'font-cache-misses.jsonl'),JSON.stringify({url,method:req.method()})+'\n');return route.abort();}
                fs.appendFileSync(path.join(out,'font-cache-use.jsonl'),JSON.stringify({url,sha256:row.sha256})+'\n');
                return route.fulfill({status:200,body:row.body,contentType:row.contentType});
              });
              for(const [kind,pattern]of[['flag',/^https:\/\/flagcdn\.com\//],['database',/^https:\/\/[^/]+\.supabase\.co\//]])await context.route(pattern,route=>{
                const req=route.request();fs.appendFileSync(path.join(out,'blocked-external.jsonl'),JSON.stringify({kind,url:req.url(),method:req.method(),bodySha256:req.postData()?sha(req.postData()):null})+'\n');return route.abort();
              });
              return context;
            };
            return browser;
          };
          ADAPTER
          find "$FREE_KICK_FONT_CACHE" -type f -print0 | sort -z | xargs -0 sha256sum > "$out/font-files.sha256"
          sha256sum "$out/cached-fonts.cjs" > "$out/cache-adapter.sha256"
      - name: Proper application types and controller syntax
        run: |
          source "$GP_FIELD_OUT/capture.sh"
          capture types env NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node_modules/.bin/tsc --noEmit -p tsconfig.app.json
          for script in scripts/qa/verifyGrandPrixFieldStrategyUnits.mjs scripts/qa/prepareGrandPrixFieldApp.mjs scripts/qa/playGrandPrixFieldApp.mjs scripts/simGrandPrixBossManagement.mjs scripts/simGrandPrixBossLifecyclePage.mjs; do
            capture "syntax-$(basename "$script")" env NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node --check "$script"
          done
      - name: All fifteen prior Grand Prix ordinary unit files
        run: |
          source "$GP_FIELD_OUT/capture.sh"
          capture original-units env NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node node_modules/vitest/vitest.mjs run src/test/grandPrixBoss.test.ts src/test/grandPrixBossFocusSave.test.tsx src/test/grandPrixBossHistoryTies.test.ts src/test/grandPrixBossLifecycle.test.ts src/test/grandPrixBossLifecyclePage.test.tsx src/test/grandPrixBossManagementPage.test.tsx src/test/grandPrixBossMarket.test.ts src/test/grandPrixBossMarketSave.test.tsx src/test/grandPrixBossPage.test.tsx src/test/grandPrixBossRollover.test.ts src/test/grandPrixBossRolloverSave.test.tsx src/test/grandPrixBossSave.test.tsx src/test/grandPrixBossStarterBalance.test.ts src/test/grandPrixBossDecisionInfo.test.tsx src/test/grandPrixBossRaceTiming.test.tsx --reporter=default --reporter=json --outputFile.json="$GP_FIELD_OUT/original-units.json" --maxWorkers=1 --no-file-parallelism
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          const out=process.env.GP_FIELD_OUT,bytes=fs.readFileSync(out+'/original-units.json'),expected=["src/test/grandPrixBoss.test.ts","src/test/grandPrixBossDecisionInfo.test.tsx","src/test/grandPrixBossFocusSave.test.tsx","src/test/grandPrixBossHistoryTies.test.ts","src/test/grandPrixBossLifecycle.test.ts","src/test/grandPrixBossLifecyclePage.test.tsx","src/test/grandPrixBossManagementPage.test.tsx","src/test/grandPrixBossMarket.test.ts","src/test/grandPrixBossMarketSave.test.tsx","src/test/grandPrixBossPage.test.tsx","src/test/grandPrixBossRaceTiming.test.tsx","src/test/grandPrixBossRollover.test.ts","src/test/grandPrixBossRolloverSave.test.tsx","src/test/grandPrixBossSave.test.tsx","src/test/grandPrixBossStarterBalance.test.ts"];
          const expectedIdentities=JSON.parse(fs.readFileSync('scripts/qa/grandPrixFieldPriorIdentities.json','utf8'));
          assert.equal(expectedIdentities.length,112);
          const order=rows=>rows.slice().sort((a,b)=>(a.file+'\0'+a.fullName).localeCompare(b.file+'\0'+b.fullName));
          const validate=r=>{
            assert.equal(r.numTotalTests,112,'GP_ORIGINAL_COUNT');assert.equal(r.numPassedTests,112);assert.equal(r.numFailedTests,0);
            assert.equal(r.numPendingTests,0);assert.equal(r.numTodoTests,0);assert.equal(r.success,true);
            assert.equal(r.testResults.length,15);
            assert.deepEqual(r.testResults.map(f=>path.relative(process.cwd(),path.resolve(f.name)).split(path.sep).join('/')).sort(),expected,'GP_ORIGINAL_FILES');
            const rows=r.testResults.flatMap(f=>{assert.equal(f.message||'','');return f.assertionResults;});
            assert.equal(rows.length,112);for(const row of rows){assert.equal(row.status,'passed','GP_ORIGINAL_STATUS');assert.equal(row.failureMessages.length,0);}
            const identities=r.testResults.flatMap(f=>f.assertionResults.map(row=>({file:path.relative(process.cwd(),path.resolve(f.name)).split(path.sep).join('/'),title:row.title,fullName:row.fullName,status:row.status})));
            assert.deepEqual(order(identities),order(expectedIdentities),'GP_ORIGINAL_IDENTITIES');
            for(const key of ['errors','unhandledErrors'])if(Object.hasOwn(r,key)){assert(Array.isArray(r[key]),'GP_ORIGINAL_ERROR_ARRAY:'+key);assert.equal(r[key].length,0,'GP_ORIGINAL_ERROR_ARRAY:'+key);}
            for(const key of ['numUnhandledErrors','numRuntimeErrorTestSuites','numRuntimeErrorTests'])if(r[key]!==undefined&&r[key]!==null){assert.equal(typeof r[key],'number');assert.equal(r[key],0);}
          };
          const actual=JSON.parse(bytes);validate(actual);const controls=[];
          for(const [id,marker,edit] of [
            ['count','GP_ORIGINAL_COUNT',r=>{r.numTotalTests=113;}],
            ['identity','GP_ORIGINAL_FILES',r=>{r.testResults[0].name=path.resolve('src/test/fixture-missing.test.ts');}],
            ['status','GP_ORIGINAL_STATUS',r=>{r.testResults[0].assertionResults[0].status='pending';}],
            ['full-name','GP_ORIGINAL_IDENTITIES',r=>{r.testResults[0].assertionResults[0].fullName+=' copied-control';}],
            ['errors-nonempty','GP_ORIGINAL_ERROR_ARRAY:errors',r=>{r.errors=['Copied error'];}],
            ['unhandled-nonempty','GP_ORIGINAL_ERROR_ARRAY:unhandledErrors',r=>{r.unhandledErrors=['Copied unhandled error'];}],
            ['errors-null','GP_ORIGINAL_ERROR_ARRAY:errors',r=>{r.errors=null;}],
            ['unhandled-null','GP_ORIGINAL_ERROR_ARRAY:unhandledErrors',r=>{r.unhandledErrors=null;}],
          ]){
            const copy=JSON.parse(bytes);edit(copy);const changed=Buffer.from(JSON.stringify(copy)),file=out+'/reader-'+id+'.json';
            assert.notEqual(createHash('sha256').update(changed).digest('hex'),createHash('sha256').update(bytes).digest('hex'));
            fs.writeFileSync(file,changed);let refusal;
            try{validate(JSON.parse(fs.readFileSync(file)));}catch(e){refusal={name:e.name,message:String(e.message),stack:String(e.stack)};}
            assert.equal(refusal?.name,'AssertionError');assert(String(refusal.message).startsWith(marker));
            fs.writeFileSync(out+'/reader-'+id+'.refusal.json',JSON.stringify(refusal,null,2));
            fs.writeFileSync(out+'/reader-'+id+'.changed.json',fs.readFileSync(file));fs.writeFileSync(file,bytes);
            assert(fs.readFileSync(file).equals(bytes));validate(JSON.parse(fs.readFileSync(file)));
            controls.push({id,marker,changedSHA256:createHash('sha256').update(changed).digest('hex'),restoredSHA256:createHash('sha256').update(bytes).digest('hex')});
          }
          const text=fs.readFileSync(out+'/original-units.stdout.log','utf8')+'\n'+fs.readFileSync(out+'/original-units.stderr.log','utf8');
          assert.doesNotMatch(text,/\bUnhandled (?:Errors?|Rejections?)\b|\bunhandledRejection\b|\buncaughtException\b|\bUnhandledPromiseRejection(?:Warning|Error)?\b|\bSIM_OFFLINE_BLOCK\b/i);
          const runtime=Object.fromEntries(['numUnhandledErrors','numRuntimeErrorTestSuites','numRuntimeErrorTests'].map(k=>[k,actual[k]===undefined||actual[k]===null?{status:'UNKNOWN',value:null}:{status:'REPORTED_ZERO',value:actual[k]}]));
          const errorArrays=Object.fromEntries(['errors','unhandledErrors'].map(key=>[key,Object.hasOwn(actual,key)?{status:'OBSERVED_EMPTY',value:actual[key]}:{status:'UNKNOWN',value:null}]));
          fs.writeFileSync(out+'/original-units-admission.json',JSON.stringify({files:15,executed:112,passed:112,pending:0,todo:0,controls,runtime,errorArrays,identities:order(actual.testResults.flatMap(f=>f.assertionResults.map(r=>({file:path.relative(process.cwd(),path.resolve(f.name)).split(path.sep).join('/'),title:r.title,fullName:r.fullName,status:r.status}))))},null,2));
          NODE
      - name: Current parent-counterfactual and restored four-case proof
        run: |
          source "$GP_FIELD_OUT/capture.sh"
          capture field-units env NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/qa/verifyGrandPrixFieldStrategyUnits.mjs
      - name: Two existing Page harnesses with complete raw child retention
        run: |
          source "$GP_FIELD_OUT/capture.sh"
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          mkdir -p "$GP_FIELD_OUT/permanent"
          export GP_BOSS_MANAGEMENT_OUT="$GP_FIELD_OUT/permanent"
          export GP_BOSS_LIFECYCLE_PAGE_OUT="$GP_FIELD_OUT/permanent"
          failed=0
          for script in scripts/simGrandPrixBossManagement.mjs scripts/simGrandPrixBossLifecyclePage.mjs; do
            status=0
            capture "$(basename "$script" .mjs)" node "$script" || status=$?
            printf '%s\t%s\n' "$script" "$status" >> "$GP_FIELD_OUT/permanent.tsv"
            test "$status" -eq 0 || failed=1
          done
          test "$(wc -l < "$GP_FIELD_OUT/permanent.tsv")" -eq 2
          cat "$GP_FIELD_OUT/permanent.tsv"
          exit "$failed"

      - name: Normal production build
        id: build
        if: always() && steps.source.outcome == 'success' && steps.install.outcome == 'success' && steps.tools.outcome == 'success'
        run: |
          source "$GP_FIELD_OUT/capture.sh"
          capture build env NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" npm run build
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > "$GP_FIELD_OUT/dist.sha256"
      - name: All fifteen required completed-output readers
        id: readers
        if: always() && steps.build.outcome == 'success'
        run: |
          set -euo pipefail
          out="$GP_FIELD_OUT"; source "$out/capture.sh"
          export SIM_NETWORK=offline
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs --require=$out/cached-fonts.cjs"
          node scripts/lib/hostLikeServer.mjs dist 4173 > "$out/readers-server.log" 2>&1 &
          server=$!; trap 'kill "$server" 2>/dev/null || true' EXIT
          ready=0; for attempt in 1 2 3 4 5; do if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then ready=1; break; fi; sleep 1; done; test "$ready" -eq 1
          failed=0
          for reader in simAdsense simBrand simHeadTags simHiddenPages simHubs simIndexNow simIndexing simInternalLinks simNoRivalNames simPrerender simPrerenderBoot simRetiredRoutes simSchema simSitemap simSnapshotAssets; do
            status=0; capture "$reader" env BASE=http://127.0.0.1:4173 SWEEP_BASE=http://127.0.0.1:4173 node "scripts/$reader.mjs" || status=$?
            printf '%s\t%s\n' "$reader" "$status" >> "$out/readers.tsv"; test "$status" -eq 0 || failed=1
          done
          test "$(wc -l < "$out/readers.tsv")" -eq 15
          cat "$out/readers.tsv"
          test ! -s "$out/font-cache-misses.jsonl" || failed=1
          node --input-type=module <<'FONT_SCOPE'
          import fs from 'node:fs';
          const out=process.env.GP_FIELD_OUT,file=out+'/font-cache-use.jsonl';
          const uses=fs.existsSync(file)?fs.readFileSync(file,'utf8').trim().split('\n').filter(Boolean).length:0;
          fs.writeFileSync(out+'/reader-font-scope.json',JSON.stringify({observedFulfills:uses,requiredFulfills:null,scope:'These fifteen readers do not require external font fulfillment. The browser boot reader intentionally aborts external requests. The real font-use liveness gate belongs to the later page-weight sweep.'},null,2));
          FONT_SCOPE
          exit "$failed"
      - name: All sixteen unchanged page weight ceilings
        id: caps
        if: always() && steps.build.outcome == 'success'
        run: |
          set -euo pipefail
          out="$GP_FIELD_OUT"; source "$out/capture.sh"
          export SIM_NETWORK=offline
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs --require=$out/cached-fonts.cjs"
          capture caps-source node --input-type=module <<'CAPS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          const body=fs.readFileSync('scripts/sweepWeight.mjs','utf8'),before=execFileSync('git',['show','3de519d296ee1b09013d5f3728b4dbe44dafdcfa:scripts/sweepWeight.mjs'],{encoding:'utf8'});
          const read=text=>{
            const code=text.replace(/\/\*[\s\S]*?\*\//g,'').replace(/(^|\n)\s*\/\/[^\n]*/g,'$1');
            const start=code.indexOf('const BUDGETS = [');assert(start>=0);const end=code.indexOf('];',start);assert(end>start);
            return [...code.slice(start,end+2).matchAll(/\[\s*(['"])(\/[^'"]*)\1\s*,\s*(\d+)\s*\]/g)].map(row=>({route:row[2],cap:Number(row[3])}));
          };
          const budgets=read(body);assert.equal(budgets.length,16);assert.equal(new Set(budgets.map(row=>row.route)).size,16);assert.deepEqual(budgets,read(before));assert(!budgets.some(row=>row.route==='/grand-prix-boss'));
          fs.writeFileSync(process.env.GP_FIELD_OUT+'/caps16.json',JSON.stringify({sourceSha256:createHash('sha256').update(body).digest('hex'),unchangedParent:'3de519d296ee1b09013d5f3728b4dbe44dafdcfa',budgetCount:16,budgets,newRouteCeiling:null},null,2)+'\n');
          CAPS
          node scripts/lib/hostLikeServer.mjs dist 4173 > "$out/caps-server.log" 2>&1 &
          server=$!; trap 'kill "$server" 2>/dev/null || true' EXIT
          ready=0; for attempt in 1 2 3 4 5; do if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then ready=1; break; fi; sleep 1; done; test "$ready" -eq 1
          capture all-page-caps env BASE=http://127.0.0.1:4173 SWEEP_BASE=http://127.0.0.1:4173 SWEEP_OFFLINE=1 node scripts/sweepWeight.mjs
          test ! -s "$out/font-cache-misses.jsonl"
          test -s "$out/font-cache-use.jsonl"
      - name: Three actual App viewports with saved pit publication and reload
        if: always() && steps.build.outcome == 'success' && steps.readers.outcome == 'success' && steps.caps.outcome == 'success'
        run: |
          source "$GP_FIELD_OUT/capture.sh"
          export GP_FIELD_APP_PREP="$PWD/tmp/gp-field-app-prep"
          export GP_FIELD_APP_OUT="$GP_FIELD_OUT/app"
          export GP_FIELD_APP_FONTS="$GP_FIELD_OUT/input/siteFonts.captured.json"
          status=0
          capture app-prep env NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/qa/prepareGrandPrixFieldApp.mjs || status=$?
          if test -d "$GP_FIELD_APP_PREP"; then cp -R "$GP_FIELD_APP_PREP" "$GP_FIELD_OUT/app-prepared"; fi
          test "$status" -eq 0
          capture actual-app env NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/qa/playGrandPrixFieldApp.mjs

      - name: Final tracked-source and installed-version holds
        if: always()
        run: |
          sha256sum --check "$GP_FIELD_OUT/source-before.sha256" > "$GP_FIELD_OUT/source-hold.log"
          git diff --exit-code > "$GP_FIELD_OUT/tracked.diff"
          if test -f "$GP_FIELD_OUT/dist.sha256"; then sha256sum --check "$GP_FIELD_OUT/dist.sha256" > "$GP_FIELD_OUT/dist-hold.log"; fi
          if test -f "$GP_FIELD_OUT/font-files.sha256"; then sha256sum --check "$GP_FIELD_OUT/font-files.sha256" > "$GP_FIELD_OUT/font-hold.log"; fi
          if test -f "$GP_FIELD_OUT/cache-adapter.sha256"; then sha256sum --check "$GP_FIELD_OUT/cache-adapter.sha256" > "$GP_FIELD_OUT/cache-adapter-hold.log"; fi
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          const out=process.env.GP_FIELD_OUT,r=JSON.parse(fs.readFileSync(out+'/installed.json'));
          for(const row of r.installed)assert.equal(JSON.parse(fs.readFileSync(row.path+'/package.json')).version,row.version,row.path);
          const cache='node_modules/.vite',rows=[];
          if(fs.existsSync(cache)){
            const walk=p=>{const s=fs.lstatSync(p);assert(!s.isSymbolicLink());if(s.isDirectory()){for(const n of fs.readdirSync(p))walk(path.join(p,n));return;}assert(s.isFile());const b=fs.readFileSync(p),rel=path.relative(cache,p),target=path.join(out,'framework-cache',rel);fs.mkdirSync(path.dirname(target),{recursive:true});fs.writeFileSync(target,b);rows.push({path:rel,bytes:b.length,sha256:createHash('sha256').update(b).digest('hex')});};walk(cache);
          }
          fs.writeFileSync(out+'/final-holds.json',JSON.stringify({trackedHashesHeld:true,trackedDiffEmpty:true,installedVersions:r.installed.length,frameworkCache:rows,scope:'No complete dependency binary/member/link or transport census.'},null,2));
          NODE
      - name: Bound retained evidence
        id: evidence
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          const out=process.env.GP_FIELD_OUT,rows=[];
          const walk=p=>{const s=fs.lstatSync(p);assert(!s.isSymbolicLink());if(s.isDirectory()){for(const n of fs.readdirSync(p))walk(path.join(p,n));return;}assert(s.isFile());const b=fs.readFileSync(p);rows.push({path:path.relative(out,p),bytes:b.length,sha256:createHash('sha256').update(b).digest('hex')});};walk(out);
          const bytes=rows.reduce((s,r)=>s+r.bytes,0),manifest=Buffer.from(JSON.stringify({rows,bytes,scope:'Owned raw proof only, manifest-inclusive strict30MB/1000 member ceilings.'},null,2));
          console.log('GP_FIELD_PACKET_INPUT',JSON.stringify({regularMembers:rows.length+1,rawBytes:bytes+manifest.length,manifestBytes:manifest.length}));
          assert(rows.length>0&&rows.length+1<1000);assert(bytes+manifest.length<30000000);
          fs.writeFileSync(out+'/artifact-members.json',manifest);
          NODE
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always() && steps.evidence.outputs.ready == 'true'
        with:
          name: gp-field-fixed-${{ github.run_id }}
          path: gp-field-artifacts/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
