name: Soccer Conquest scene entry width qualification
on:
  push:
    branches: [codex/conquest-scene-width-qualify-20261031]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: 'true'
      SIM_NETWORK: offline
      GIT_OPTIONAL_LOCKS: '0'
      EXPECTED_MAIN: 19911f815ac713e8d3718cd0ee8592942a18fd00
      EXPECTED_BASE: 7a30fe9fccf5fc3879c6faba94247f022193ad7e
      EXPECTED_BASE_TREE: 81b33def9af1bc3ef11953dec9d8270895b9c6e4
      EXPECTED_PARENT: d851458b67fb9ab3a6b16488ecd912855af0c6aa
      EXPECTED_TREE: 02fe9994d7e0f6e018404719bca97d84d12d4343
