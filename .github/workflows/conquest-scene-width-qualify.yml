          printf '{"scope":"SOCCER_CONQUEST_FIRST_CARD_HORIZONTAL_CLIP_QUALIFICATION","source":"%s","main":"%s","productChanged":true,"sceneWidth":"READ_ACTUAL_FIXED_ORIGINAL_RESTORED_ADMISSION","requiredPhases":"primary2PNGs/original0/restored0","physicalOriginalScene":"EXACT_PR447_BUFFER","restoration":"SAME_FIXED_BUFFER_AND_REAL_BUILD","entrySampler":"EXACT_EQUALITY_220MS_5S_400SAMPLES","featureQualified":false,"types":"READ_ACTUAL","build":"READ_ACTUAL","caps16":"READ_ACTUAL_CURRENT21D47_UPSTREAM_UNCHANGED","builtReaders15":"READ_ACTUAL","fullDefaultSuite":"UNRUN","globalSims":"UNRUN","publicSnapshotsRegenerated":false,"fullSEO":"UNRUN","liveGameplay":"UNRUN_FROZEN_SOURCE_LOCALHOST_ONLY","releaseOrPublicationReady":false,"dependencyInventoryScope":"POST_BUILD_ONLY"}\n' "$GITHUB_SHA" "$EXPECTED_MAIN" > "$out/SCOPE.json"
          find "$out" -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/conquest-scene-width-qualify-evidence.sha256"
          cp "$RUNNER_TEMP/conquest-scene-width-qualify-evidence.sha256" "$out/evidence.sha256"
          exit "$failed"
