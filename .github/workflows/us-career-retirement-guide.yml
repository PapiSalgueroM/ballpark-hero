name: US career retirement guide verification
on:
  push:
    branches: [codex/us-career-retirement-guide]
    paths:
      - src/data/gameContent/basketball.ts
      - src/data/gameContent/football.ts
      - src/data/gameContent/baseball.ts
      - src/data/gameContent/hockey.ts
      - .github/workflows/us-career-retirement-guide.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CI: '1'
      SIM_NETWORK: offline
      ENGINES: chromium
      TZ: UTC
      PRERENDER_ONLY: /nba-my-career,/nfl-my-career,/mlb-my-career,/nhl-my-career,/whats-new
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bind exact four additions and preserve all other source
        run: |
          set -euo pipefail
          echo "US_GUIDE_OUT=$RUNNER_TEMP/us-career-retirement-guide" >> "$GITHUB_ENV"
          out="$RUNNER_TEMP/us-career-retirement-guide"; mkdir -p "$out"
          git rev-parse HEAD > "$out/head.txt"; git archive --format=zip HEAD > "$out/source.zip"
          git merge-base --is-ancestor b31c9894ac27283a9b650bf32b53e558b7148834 HEAD
          test -z "$(git status --porcelain --untracked-files=no)"
          generated=(src/data/searchKeywords.json scripts/data/guideHeadingsFrozen.json public/nba-my-career/index.html public/nfl-my-career/index.html public/mlb-my-career/index.html public/nhl-my-career/index.html public/whats-new/index.html public/sitemap.xml scripts/data/lastmod.json)
          printf '%s\n' "${generated[@]}" > "$out/generated-paths.txt"
          excluded=(); for file in "${generated[@]}"; do excluded+=(":!$file"); done
          git diff --exit-code b31c9894ac27283a9b650bf32b53e558b7148834 HEAD -- src scripts public index.html package.json package-lock.json bun.lock bun.lockb .github/workflows "${excluded[@]}" ':!src/data/gameContent/basketball.ts' ':!src/data/gameContent/football.ts' ':!src/data/gameContent/baseball.ts' ':!src/data/gameContent/hockey.ts' ':!.github/workflows/us-career-retirement-guide.yml'
          git ls-files -z -- "${excluded[@]}" | sort -z | xargs -0 sha256sum > "$out/source-files.sha256"
          US_GUIDE_OUT="$out" NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node --input-type=module <<'NODE'
          import fs from 'node:fs'; import assert from 'node:assert/strict'; import {createHash} from 'node:crypto'; import {execFileSync} from 'node:child_process';
          const expected={basketball:'8b0935183e6298cd1035f4345661368b3335a42087bb6dcc30b5878651245549',football:'dca2b18bae39a3bcb5954cec3f5a0db69f2249ce9c3055c57aa4add5851125ac',baseball:'ca72eb728586c6538cd0bd51e6407f9856c388eef746e87288cc3313cce4630d',hockey:'9f47f1e54e88ce7071e5d2975eba6c306cfc554a4d5bda651a418285431a8ffd'};
          const addition='After your playing career, you can go after a coaching job, then choose Retire from coaching and confirm it to end that run with the record and log saved. Undo skip restores a skipped draft showcase before Draft day; on the same draft night screen, Watch it again replays the night once it ends, unless reduced motion is on.';
          const rows=[];
          for(const [sport,wanted] of Object.entries(expected)){
            const file='src/data/gameContent/'+sport+'.ts', text=fs.readFileSync(file,'utf8').replaceAll('\r\n','\n'), sha256=createHash('sha256').update(text).digest('hex'); assert.equal(sha256,wanted,file);
            const lines=text.split('\n'), selected=lines.filter(line=>line.trim()===JSON.stringify(addition)+','); assert.equal(selected.length,1,file+' has exactly one reviewed added item');
            const inverse=lines.filter(line=>line!==selected[0]).join('\n'), original=execFileSync('git',['show','b31c9894ac27283a9b650bf32b53e558b7148834:'+file],{encoding:'utf8'}).replaceAll('\r\n','\n');
            assert.equal(inverse,original,'Every previous guide byte, including retirement and Hall text, is held: '+file); rows.push({file,sha256,addedItems:1,inverseEqualsBase:true});
          }
          fs.writeFileSync(process.env.US_GUIDE_OUT+'/guide-source-bindings.json',JSON.stringify(rows,null,2)+'\n'); console.log('All four exact guide hashes and single-line inverses bind to actual b31 source.');
          NODE
      - name: Locked application and isolated browser tools
        run: |
          set -euo pipefail
          npm ci > "$US_GUIDE_OUT/install.log" 2>&1
          node scripts/qa/soccerAgentReviewDependencies.mjs before > "$US_GUIDE_OUT/dependencies-before.log" 2>&1
          browser_tools="$RUNNER_TEMP/us-guide-browser"
          npm install --prefix "$browser_tools" --no-save --package-lock=false playwright@1.64.0 > "$US_GUIDE_OUT/browser-install.log" 2>&1
          test ! -e node_modules/playwright; test ! -e node_modules/playwright-core
          ln -s "$browser_tools/node_modules/playwright" node_modules/playwright; ln -s "$browser_tools/node_modules/playwright-core" node_modules/playwright-core
          node scripts/qa/soccerAgentReviewDependencies.mjs after > "$US_GUIDE_OUT/dependencies-after.log" 2>&1
          cp soccer-agent-review-artifacts/dependencies-*.json "$US_GUIDE_OUT/"
          node --input-type=module <<'NODE'
          import fs from 'node:fs'; import assert from 'node:assert/strict';
          const out=process.env.US_GUIDE_OUT,before=JSON.parse(fs.readFileSync(out+'/dependencies-before.json')),after=JSON.parse(fs.readFileSync(out+'/dependencies-after.json'));
          assert.equal(before.packages.length,521); assert.equal(after.packages.length,521); assert.deepEqual(after.packages,before.packages); assert.equal(after.addedBrowserPackage,'1.64.0');
          fs.writeFileSync(out+'/node-versions.json',JSON.stringify(process.versions,null,2)+'\n');
          NODE
          node "$browser_tools/node_modules/playwright/cli.js" install --with-deps chromium > "$US_GUIDE_OUT/chromium-install.log" 2>&1
          python -m pip install fonttools pillow > "$US_GUIDE_OUT/fonts-install.log" 2>&1; python -m pip freeze > "$US_GUIDE_OUT/python-packages.txt"
          find node_modules -type f -print0 | sort -z | xargs -0 sha256sum > "$US_GUIDE_OUT/installed-files.sha256"
          find "$browser_tools/node_modules" -type f -print0 | sort -z | xargs -0 sha256sum > "$US_GUIDE_OUT/browser-tool-files.sha256"
      - name: Existing generators and actual application types
        run: |
          set -euo pipefail
          for route in /nba-my-career /nfl-my-career /mlb-my-career /nhl-my-career; do
            SIM_OFFLINE_RECEIPT="$US_GUIDE_OUT/refresh.transport" NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/simGuideHeadings.mjs --refresh "$route" >> "$US_GUIDE_OUT/refresh.log" 2>&1
          done
          SIM_OFFLINE_RECEIPT="$US_GUIDE_OUT/keywords.transport" NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/genSearchKeywords.mjs > "$US_GUIDE_OUT/keywords.log" 2>&1
          SIM_OFFLINE_RECEIPT="$US_GUIDE_OUT/types.transport" NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node_modules/.bin/tsc --noEmit -p tsconfig.app.json > "$US_GUIDE_OUT/types.log" 2>&1
          cat "$US_GUIDE_OUT/refresh.log" "$US_GUIDE_OUT/keywords.log"
      - name: Actual production build and five saved pages
        id: build
        run: |
          set -euo pipefail
          SIM_OFFLINE_RECEIPT="$US_GUIDE_OUT/build.transport" NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" npm run build:seo > "$US_GUIDE_OUT/build.log" 2>&1
          tail -n 6 "$US_GUIDE_OUT/build.log"
      - name: All fifteen built-site readers plus existing guide and search checks
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          failed=0; printf 'method\texit\n' > "$US_GUIDE_OUT/readers.tsv"
          for method in simAdsense simBrand simHeadTags simHiddenPages simHubs simIndexNow simIndexing simInternalLinks simNoRivalNames simPrerender simPrerenderBoot simRetiredRoutes simSchema simSitemap simSnapshotAssets simGuideHeadings simSiteSearch; do
            status=0; SIM_OFFLINE_RECEIPT="$US_GUIDE_OUT/$method.transport" NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node "scripts/$method.mjs" > "$US_GUIDE_OUT/$method.log" 2>&1 || status=$?
            printf '%s\t%s\n' "$method" "$status" >> "$US_GUIDE_OUT/readers.tsv"; tail -n 2 "$US_GUIDE_OUT/$method.log"
            test "$status" -eq 0 || failed=1; test ! -s "$US_GUIDE_OUT/$method.transport" || failed=1
          done
          exit "$failed"
      - name: Retain actual generated source and emitted build bodies
        if: always()
        run: |
          set -euo pipefail
          mapfile -t generated < "$US_GUIDE_OUT/generated-paths.txt"; excluded=(); for file in "${generated[@]}"; do excluded+=(":!$file"); done
          git diff --exit-code HEAD -- src scripts public index.html package.json package-lock.json bun.lock bun.lockb .github/workflows "${excluded[@]}"
          git diff --binary HEAD -- "${generated[@]}" > "$US_GUIDE_OUT/generated.patch"
          git ls-files -z | sort -z | xargs -0 sha256sum > "$US_GUIDE_OUT/validated-source-files.sha256"
          python - <<'PY'
          import os,subprocess,zipfile
          out=os.environ['US_GUIDE_OUT']; files=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          with zipfile.ZipFile(out+'/validated-source.zip','w',zipfile.ZIP_DEFLATED) as archive:
              for file in sorted(filter(None,files)): archive.write(file,file)
          if os.path.isdir('dist'):
              with zipfile.ZipFile(out+'/dist.zip','w',zipfile.ZIP_DEFLATED) as archive:
                  for folder,dirs,names in os.walk('dist'):
                      for name in sorted(names): archive.write(os.path.join(folder,name),os.path.join(folder,name))
          PY
          if test -d dist; then find dist -type f -print0 | sort -z | xargs -0 sha256sum > "$US_GUIDE_OUT/dist-files.sha256"; fi
      - name: Unchanged full download budgets, every failure remains fatal
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          node scripts/lib/hostLikeServer.mjs dist 4173 > "$US_GUIDE_OUT/server.log" 2>&1 &
          task_server_pid=$!; trap 'kill "$task_server_pid" 2>/dev/null || true' EXIT
          for attempt in 1 2 3 4 5; do if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi; sleep 1; done
          curl --fail --silent http://127.0.0.1:4173/ > /dev/null
          status=0; NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SWEEP_OFFLINE=1 BASE=http://127.0.0.1:4173 SWEEP_BASE=http://127.0.0.1:4173 node scripts/sweepWeight.mjs > "$US_GUIDE_OUT/weights.log" 2>&1 || status=$?
          cat "$US_GUIDE_OUT/weights.log"; printf '%s\n' "$status" > "$US_GUIDE_OUT/weights-exit.txt"; exit "$status"
      - name: Complete source, installed, browser-tool and emitted byte holds
        if: always()
        run: |
          set -euo pipefail
          result=0
          for kind in source installed browser-tool validated-source dist; do
            file="$US_GUIDE_OUT/$kind-files.sha256"; if test -f "$file"; then sha256sum --check "$file" > "$US_GUIDE_OUT/$kind-holds.log" 2>&1 || result=1; fi
          done
          for method in refresh keywords types simAdsense simBrand simHeadTags simHiddenPages simHubs simIndexNow simIndexing simInternalLinks simNoRivalNames simPrerender simPrerenderBoot simRetiredRoutes simSchema simSitemap simSnapshotAssets simGuideHeadings simSiteSearch; do test ! -s "$US_GUIDE_OUT/$method.transport" || result=1; done
          # Build and weight external asset denials remain recorded offline method evidence, not ordinary zero-block credit.
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: us-career-retirement-guide-${{ github.sha }}
          path: ${{ env.US_GUIDE_OUT }}
          if-no-files-found: error
          retention-days: 14
