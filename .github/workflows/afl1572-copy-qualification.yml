'working-flags.jsonl');\n  fs.mkdirSync(controlDir);fs.writeFileSync(working,flagBytes,{flag:'wx'});\n  const known=new Set(contexts.map(row=>row.processId+':'+row.contextId));let unused=null;\n  for(let value=1;value<=contexts.length+1;value++)if(!known.has(flags[0].processId+':'+value)){unused=value;break;}\n  a(Number.isSafeInteger(unused)&&unused>0);\n  for(const [id,marker,mutate] of [\n    ['wrong-method','AFL1572_LOCAL_FLAG_METHOD',rows=>{rows[0].method='POST';}],\n    ['unused-context','AFL1572_LOCAL_FLAG_CONTEXT',rows=>{rows[0].contextId=unused;}],\n  ]){\n    a.deepEqual(fs.readFileSync(working),flagBytes);const changedRows=parse(fs.readFileSync(working));mutate(changedRows);\n    const changed=Buffer.from(changedRows.map(row=>JSON.stringify(row)).join('\\n')+'\\n');a(!changed.equals(flagBytes),'Actual receipt bytes must change');\n    const beforeFile=path.join(controlDir,id+'.before.jsonl'),changedFile=path.join(controlDir,id+'.changed.jsonl'),restoredFile=path.join(controlDir,id+'.restored.jsonl');\n    fs.writeFileSync(beforeFile,fs.readFileSync(working),{flag:'wx'});let actualFailure=null;\n    try{\n      fs.writeFileSync(working,changed);a.deepEqual(fs.readFileSync(working),changed);fs.writeFileSync(changedFile,fs.readFileSync(working),{flag:'wx'});\n      try{judge(parse(fs.readFileSync(working)));}catch(error){actualFailure={name:error.name,message:String(error.message)};}\n      a(actualFailure&&actualFailure.name==='AssertionError'&&actualFailure.message.includes(marker),'AFL1572_FLAG_CONTROL_EFFECTIVE:'+id);\n    }finally{\n      fs.writeFileSync(working,flagBytes);a.deepEqual(fs.readFileSync(working),flagBytes);judge(parse(fs.readFileSync(working)));\n      fs.writeFileSync(restoredFile,fs.readFileSync(working),{flag:'wx'});\n      const receipt={id,marker,scope:'ACTUAL_RECEIPT_COPY_CLASSIFIER_ONLY',featurePassCredit:false,beforeFile,changedFile,restoredFile,sameWorkingFile:working,beforeSHA256:sha(flagBytes),changedSHA256:sha(changed),restore