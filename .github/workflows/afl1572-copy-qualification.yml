          git diff --name-only > "$out/qualified-release-diff.initial.txt"
          if grep -Ev '^(public/|scripts/data/lastmod\.json$)' "$out/qualified-release-diff.initial.txt"; then exit 1; fi
      - name: All saved-site fences, copy readers and real current SEO draw
        run: |
          set -euo pipefail
          cd "$QUALIFICATION_ROOT"; source "$PLACEMENT_OUT/helpers/run-gate.sh"
          out="$PLACEMENT_OUT"; : > "$out/final-server.transport"
          SIM_OFFLINE_RECEIPT="$out/final-server.transport" NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/lib/hostLikeServer.mjs dist 4173 > "$out/final-server.log" 2>&1 & server=$!
          trap 'kill "$server" 2>/dev/null || true; wait "$server" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi; sleep 1; done
          curl --fail --silent http://127.0.0.1:4173/ > /dev/null
          export BASE=http://127.0.0.1:4173 SWEEP_BASE=http://127.0.0.1:4173
          for method in simAdsense simBrand simHeadTags simHiddenPages simHubs simIndexNow simIndexing simInternalLinks simNoRivalNames simPrerender simPrerenderBoot simRetiredRoutes simSchema simSitemap simSnapshotAssets simHomeCopy simHomeFront simSiteSearch simSeoTitles simTrustCopy simGuideHeadings playHomeFold; do
            closing="^$method: green\\."
            case "$method" in
              simNoRivalNames) closing='^No rival product names found\. 0 findings\.$' ;;
              simRetiredRoutes) closing='^simRetiredRoutes: all green' ;;
            esac
            run_gate "$method" 0 "$closing" env RC_OUT="$out/reader-images/$method" node "scripts/$method.mjs"
          done
          unset SEO_SPLIT_ONLY SEO_SPLIT_CONTROL SEO_SPLIT_SETTLE SEO_SPLIT_STATIC SEO_SPLIT_BASE_REF
          run_gate seo-origin-main-static 1 "^   RED [0-9]+ routes in origin/main's table;.*1 route\\(s\\) disagree$" env SEO_SPLIT_STATIC=1 node scripts/simSeoMetaSplit.mjs
          node <<'ORIGIN'
          const fs=require('node:fs'),a=require('node:assert/strict'),d=process.env.PLACEMENT_OUT+'/gates/seo-origin-main-static';
          const current='Run an AFL club through 23 rounds, the finals and the draft. Pick your 23, call the quarters, chase a flag. Free footy manager.';
          const previous='Run a fictional Aussie rules club through 23 rounds, the finals and the draft. Pick your 23, call the quarters, chase a flag. Free footy manager.';
          const expected=['committed','built'].map(level=>'  FAIL: /aussie-rules-manager: '+level+' description: the split serves '+JSON.stringify(current)+', origin/main says '+JSON.stringify(previous));
          a.deepEqual(fs.readFileSync(d+'/stderr.log','utf8').trimEnd().split(/\r?\n/),expected,'Only the two actual intentional Manager description differences are expected');
          const stdout=fs.readFileSync(d+'/stdout.log','utf8'),rows=stdout.split(/\r?\n/).filter(x=>/^   RED \d+ routes in origin\/main's table;/.test(x));
          a.equal(rows.length,1);const m=rows[0].match(/^   RED (\d+) routes in origin\/main's table; routes the split serves: committed (\d+), built (\d+); 1 route\(s\) disagree$/);
          a.ok(m);a.ok(Number(m[1])>=100);a.equal(m[1],m[2]);a.equal(m[1],m[3]);a.ok(!/FAIL:/.test(stdout));
          fs.writeFileSync(d+'/EXPECTED-INTENTIONAL-DIFFERENCE.json',JSON.stringify({status:'ACTUAL_ORIGIN_MAIN_STATIC_RED_RETAINED',baseRef:'origin/main',baseSHA:process.env.SEO_ORIGIN_MAIN_BASE_SHA,mainAtPlan:process.env.EXPECTED_MAIN,mainAtStart:process.env.ACTUAL_MAIN_AT_START,rawExit:1,exactFindings:expected,disagreeingRoutes:1,waiver:false,headComparisonIsSupplementary:true},null,2)+'\n',{flag:'wx'});
          ORIGIN
          GATE_TIMEOUT=3600s run_gate seo-head-full-current 0 '^simSeoMetaSplit: green\.' env SEO_SPLIT_BASE_REF=HEAD node scripts/simSeoMetaSplit.mjs
          run_gate seo-old-description-control-driver 0 '^AFL1572_SEO_OLD_DESCRIPTION_CONTROL:' node scripts/qa/afl1572SeoOldDescriptionControl.cjs
          run_gate home-copy-module-control 0 '^simHomeCopy control moduledrift: green\. The planted break was reported by part 6 and nothing else failed\.$' env HOME_COPY_CONTROL=moduledrift node scripts/simHomeCopy.mjs
          unset PLAY_AFL_NAMES_CONTROL
          run_gate final-afl-browser 0 '^playAflClubNames: 36 checks, 0 failures \(a 0, b 0, c 0\), 2 viewports, 4 routes walked, [0-9.]+ s$' env RC_OUT="$out/final-afl-images" node scripts/playAflClubNames.mjs
          run_gate final-afl-bundle-control 1 '^playAflClubNames control bundlename: [1-9][0-9]* scripts rewritten, \(a\) RED, 2 routes walked, [0-9.]+ s\. RED as intended$' env RC_OUT="$out/final-afl-control-images" PLAY_AFL_NAMES_CONTROL=bundlename node scripts/playAflClubNames.mjs
          test ! -s "$out/final-server.transport"
      - name: Always retain physical source, output memberships and final holds
        if: ${{ always() }}
        run: |
          set -euo pipefail
          out="${PLACEMENT_OUT:-$RUNNER_TEMP/afl1572-copy-qualification}"; mkdir -p "$out"; failed=0
          cd "$GITHUB_WORKSPACE"
          git ls-files -z | sort -z > "$out/source-members.final"
          xargs -0 sha256sum < "$out/source-members.final" > "$out/source.final.sha256"
          cmp "$out/source-members.initial" "$out/source-members.final" || failed=1
          cmp "$out/source.initial.sha256" "$out/source.final.sha256" || failed=1
          git ls-files --others --exclude-standard -z | sort -z > "$out/untracked.final"
          cmp "$out/untracked.initial" "$out/untracked.final" || failed=1
          if test -d "${QUALIFICATION_ROOT:-/nonexistent-afl1572-qualified-copy}"; then
            cd "$QUALIFICATION_ROOT"
            git ls-files -z | sort -z > "$out/qualified-members.final"
            cmp "$out/qualified-members.initial" "$out/qualified-members.final" || failed=1
            xargs -0 sha256sum < "$out/qualified-members.final" > "$out/qualified.final.sha256"
            git ls-files --others --exclude-standard -z | sort -z > "$out/qualified-untracked.final"
            tr '\0' '\n' < "$out/qualified-untracked.initial" | grep -Ev '^public/' > "$out/qualified-untracked.nonrelease.initial" || true
            tr '\0' '\n' < "$out/qualified-untracked.final" | grep -Ev '^public/' > "$out/qualified-untracked.nonrelease.final" || true
            cmp "$out/qualified-untracked.nonrelease.initial" "$out/qualified-untracked.nonrelease.final" || failed=1
            node <<'SOURCE_HOLD' || failed=1
          const fs=require('node:fs'),a=require('node:assert/strict'),out=process.env.PLACEMENT_OUT;
          const parse=name=>new Map(fs.readFileSync(out+'/'+name,'utf8').trimEnd().split('\n').map(x=>{a.match(x,/^[a-f0-9]{64}  /);return[x.slice(66),x.slice(0,64)]}));
          const before=parse('qualified.initial.sha256'),after=parse('qualified.final.sha256');a.deepEqual([...before.keys()],[...after.keys()]);
          const changed=[...before].filter(([file,sha])=>after.get(file)!==sha).map(([file])=>file);
          for(const file of changed)a.ok(file.startsWith('public/')||file==='scripts/data/lastmod.json','No app or QA source changes in matched copy: '+file);
          fs.writeFileSync(out+'/QUALIFIED-SOURCE-HOLD.json',JSON.stringify({source:process.env.GITHUB_SHA,head:process.env.EXPECTED_PARENT,mainAtPlan:process.env.EXPECTED_MAIN,mainAtStart:process.env.ACTUAL_MAIN_AT_START,shippingSourceClaim:'immutable',matchedSourceFiles:before.size,allowedChangedFiles:changed,releaseOutputsUnshipped:true,fullRunAllSims:'UNRUN',fullDefaultVitest:'UNRUN'},null,2)+'\n',{flag:'wx'});
          SOURCE_HOLD
            if test -f "$out/dist.sha256"; then
              for pair in "deps:$GITHUB_WORKSPACE/node_modules" "browser:$PLACEMENT_TOOLS" "fonts:$FREE_KICK_FONT_CACHE" "dist:dist"; do
                label="${pair%%:*}"; dir="${pair#*:}"
                find "$dir" -type f -print0 | sort -z > "$out/$label.members.final"
                cmp "$out/$label.members" "$out/$label.members.final" || failed=1
                sha256sum -c "$out/$label.sha256" > "$out/$label-held.log" 2>&1 || failed=1
              done
              find "$GITHUB_WORKSPACE/node_modules" -type l -printf '%p -> %l\n' | sort > "$out/dependency-links.final"
              sha256sum -c "$out/generated-helpers.sha256" > "$out/generated-helpers-held.log" 2>&1 || failed=1
              cmp "$out/dependency-links.before" "$out/dependency-links.final" || failed=1
              find public -type f -print0 | sort -z > "$out/qualified-public.members.final"
              cmp "$out/qualified-public.members" "$out/qualified-public.members.final" || failed=1
              sha256sum -c "$out/qualified-public.sha256" > "$out/qualified-public-held.log" 2>&1 || failed=1
              cmp scripts/data/lastmod.json "$out/qualified-lastmod.json" || failed=1
            else
              printf 'UNRUN: final SEO build and complete dist/font archives not available\n' > "$out/BUILD-ARCHIVES-UNRUN.txt"
              if test -d dist; then tar -cf "$out/available-dist.tar" -C dist .; fi
              if test -d "$FREE_KICK_FONT_CACHE"; then tar -cf "$out/font-cache.tar" -C "$FREE_KICK_FONT_CACHE" .; fi
            fi
          else failed=1; fi
          if test -f "$out/helpers.initial.sha256"; then sha256sum -c "$out/helpers.initial.sha256" > "$out/helpers-held.log" 2>&1 || failed=1; else failed=1; fi
          printf '%s\n' "$failed" > "$out/final-holds.exit"
          find "$out" -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/afl1572-evidence.sha256"
          cp "$RUNNER_TEMP/afl1572-evidence.sha256" "$out/evidence.sha256"
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: afl1572-copy-qualification-v2-${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/afl1572-copy-qualification-v2
          if-no-files-found: error
          retention-days: 14
