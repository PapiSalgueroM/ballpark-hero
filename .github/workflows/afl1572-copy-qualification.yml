name: AFL1572 joined copy qualification, local flag denials
on:
  push:
    branches: [codex/afl1572-copy-joined-proof-v2-20261029]
permissions:
  contents: read
jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CI: 'true'
      ENGINES: chromium
      TZ: UTC
      SIM_NETWORK: offline
      EXPECTED_PARENT: 53ccde1da63d9076e37205e0b0b6a227aab07b2e
      EXPECTED_PRODUCT_TREE: bc5947fc26222d3c0fe7a42130c63a41b461a498
      EXPECTED_MAIN: eb8ae06140185296317999f8b4b2e9300a99fe11
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Bind immutable shipping source and matched-copy scope
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/afl1572-copy-qualification-v2"; fonts="$RUNNER_TEMP/afl1572-copy-fonts"
          test ! -e "$out"; test ! -e "$fonts"; mkdir -p "$out"
          echo "PLACEMENT_OUT=$out" >> "$GITHUB_ENV"; echo "FREE_KICK_FONT_CACHE=$fonts" >> "$GITHUB_ENV"
          test "$GITHUB_REF_NAME" = codex/afl1572-copy-joined-proof-v2-20261029
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-list --parents -n1 HEAD)" = "$GITHUB_SHA $EXPECTED_PARENT"
          test "$(git rev-parse "$EXPECTED_PARENT^{tree}")" = "$EXPECTED_PRODUCT_TREE"
          printf '%s\n' "$EXPECTED_MAIN" > "$out/main-at-plan.txt"
          private_index="$out/main-bridge.private.index";test ! -e "$private_index"
          default_index=$(git rev-parse --git-path index)
          sha256sum "$default_index" > "$out/default-index.before.sha256"
          git for-each-ref --format='%(refname) %(objectname)' > "$out/refs.before.txt"
          git fetch --no-tags --refmap='' origin refs/heads/main > "$out/main-fetch.stdout.log" 2> "$out/main-fetch.stderr.log"
          actual_main=$(git rev-parse --verify 'FETCH_HEAD^{commit}')
          [[ "$actual_main" =~ ^[a-f0-9]{40}$ ]]
          printf '%s\n' "$actual_main" > "$out/main-at-start.txt"
          echo "ACTUAL_MAIN_AT_START=$actual_main" >> "$GITHUB_ENV"
          GIT_INDEX_FILE="$private_index" git read-tree "$EXPECTED_MAIN^{tree}"
          base_tree=$(GIT_INDEX_FILE="$private_index" git write-tree)
          cp "$private_index" "$out/main-bridge.private.index.before"
          before_index_sha=$(sha256sum "$private_index" | cut -d ' ' -f1)
          inspect_main_trees() {
            local base="$1" candidate="$2" prefix="$3" full_raw outside_raw paths_raw base_board candidate_board
            if GIT_INDEX_FILE="$private_index" git diff --name-status "$base" "$candidate" -- > "$prefix.paths.tsv" 2> "$prefix.paths.stderr.log";then paths_raw=0;else paths_raw=$?;fi
            if GIT_INDEX_FILE="$private_index" git diff --exit-code "$base" "$candidate" -- > "$prefix.full.diff" 2> "$prefix.full.stderr.log";then full_raw=0;else full_raw=$?;fi
            if GIT_INDEX_FILE="$private_index" git diff --exit-code "$base" "$candidate" -- . ':!docs/WORKBOARD.md' > "$prefix.nonboard.diff" 2> "$prefix.nonboard.stderr.log";then outside_raw=0;else outside_raw=$?;fi
            printf '%s\n' "$paths_raw" > "$prefix.paths.raw.exit";printf '%s\n' "$full_raw" > "$prefix.full.raw.exit";printf '%s\n' "$outside_raw" > "$prefix.nonboard.raw.exit"
            test "$paths_raw" -eq 0 || return 2
            [[ "$full_raw" =~ ^[01]$ && "$outside_raw" =~ ^[01]$ ]] || return 2
            GIT_INDEX_FILE="$private_index" git ls-tree "$base" -- docs/WORKBOARD.md > "$prefix.base-board.tsv" || return 2
            GIT_INDEX_FILE="$private_index" git ls-tree "$candidate" -- docs/WORKBOARD.md > "$prefix.candidate-board.tsv" || return 2
            base_board=$(cat "$prefix.base-board.tsv");candidate_board=$(cat "$prefix.candidate-board.tsv")
            [[ "$base_board" =~ ^100644\ blob\ [a-f0-9]{40}$'\t'docs/WORKBOARD.md$ && "$candidate_board" =~ ^100644\ blob\ [a-f0-9]{40}$'\t'docs/WORKBOARD.md$ ]] || { printf 'MENU_MAIN_BOARD_REGULAR_MODE\n' > "$prefix.refusal.txt";return 1; }
            if test "$outside_raw" -ne 0;then printf 'MENU_MAIN_NONBOARD_PATH\n' > "$prefix.refusal.txt";return 1;fi
            if test "$full_raw" -eq 0;then
              test ! -s "$prefix.paths.tsv" || return 2
              printf 'SAME\n' > "$prefix.outcome.txt";return 0
            fi
            if ! printf 'M\tdocs/WORKBOARD.md\n' | cmp - "$prefix.paths.tsv";then printf 'MENU_MAIN_OWNED_BOARD_PATH_ONLY\n' > "$prefix.refusal.txt";return 1;fi
            printf 'BOARD_ONLY\n' > "$prefix.outcome.txt"
          }
          inspect_main_trees "$EXPECTED_MAIN" "$actual_main" "$out/main-actual"
          actual_kind=$(cat "$out/main-actual.outcome.txt")
          for control in board app;do
            if test "$control" = board;then target=docs/WORKBOARD.md;else target=src/App.tsx;fi
            cmp "$private_index" "$out/main-bridge.private.index.before"
            test "$(GIT_INDEX_FILE="$private_index" git write-tree)" = "$base_tree"
            cmp "$private_index" "$out/main-bridge.private.index.before"
            GIT_INDEX_FILE="$private_index" git cat-file blob "$EXPECTED_MAIN:$target" > "$out/control-$control.original.body"
            cp "$out/control-$control.original.body" "$out/control-$control.changed.body"
            printf '\n// QA-only private Git-tree %s control.\n' "$control" >> "$out/control-$control.changed.body"
            original_body_sha=$(sha256sum "$out/control-$control.original.body" | cut -d ' ' -f1)
            changed_body_sha=$(sha256sum "$out/control-$control.changed.body" | cut -d ' ' -f1)
            test "$original_body_sha" != "$changed_body_sha"
            original_blob=$(GIT_INDEX_FILE="$private_index" git rev-parse "$EXPECTED_MAIN:$target")
            changed_blob=$(GIT_INDEX_FILE="$private_index" git hash-object -w "$out/control-$control.changed.body")
            test "$changed_blob" != "$original_blob"
            GIT_INDEX_FILE="$private_index" git update-index --cacheinfo 100644 "$changed_blob" "$target"
            changed_tree=$(GIT_INDEX_FILE="$private_index" git write-tree);test "$changed_tree" != "$base_tree"
            changed_index_sha=$(sha256sum "$private_index" | cut -d ' ' -f1);test "$changed_index_sha" != "$before_index_sha"
            cp "$private_index" "$out/control-$control.changed.index"
            if inspect_main_trees "$base_tree" "$changed_tree" "$out/control-$control";then control_raw=0;else control_raw=$?;fi
            printf '%s\n' "$control_raw" > "$out/control-$control.classifier.raw.exit"
            test "$(cat "$out/control-$control.full.raw.exit")" = 1
            printf 'M\t%s\n' "$target" | cmp - "$out/control-$control.paths.tsv"
            if test "$control" = board;then
              test "$control_raw" = 0;test "$(cat "$out/control-board.nonboard.raw.exit")" = 0;test "$(cat "$out/control-board.outcome.txt")" = BOARD_ONLY
            else
              test "$control_raw" = 1;test "$(cat "$out/control-app.nonboard.raw.exit")" = 1;test "$(cat "$out/control-app.refusal.txt")" = MENU_MAIN_NONBOARD_PATH
            fi
            cp "$out/main-bridge.private.index.before" "$private_index"
            cmp "$private_index" "$out/main-bridge.private.index.before"
            restored_tree=$(GIT_INDEX_FILE="$private_index" git write-tree);test "$restored_tree" = "$base_tree"
            cmp "$private_index" "$out/main-bridge.private.index.before"
            restored_index_sha=$(sha256sum "$private_index" | cut -d ' ' -f1);test "$restored_index_sha" = "$before_index_sha"
            cp "$private_index" "$out/control-$control.restored.index"
            inspect_main_trees "$base_tree" "$restored_tree" "$out/control-$control-restored"
            test "$(cat "$out/control-$control-restored.full.raw.exit")" = 0;test "$(cat "$out/control-$control-restored.nonboard.raw.exit")" = 0;test "$(cat "$out/control-$control-restored.outcome.txt")" = SAME
            printf '{"id":"%s","scope":"REMOTE_PRIVATE_GIT_INDEX_TREE_ONLY","target":"%s","classifierRaw":%s,"fullDiffRaw":1,"outsideBoardDiffRaw":%s,"originalBodySHA256":"%s","changedBodySHA256":"%s","originalBlob":"%s","changedBlob":"%s","beforeTree":"%s","changedTree":"%s","restoredTree":"%s","beforeIndexSHA256":"%s","changedIndexSHA256":"%s","restoredIndexSHA256":"%s","samePrivateIndexBytesAndTreeRestored":true,"workingSourceChanged":false,"refWritten":false}\n' "$control" "$target" "$control_raw" "$(cat "$out/control-$control.nonboard.raw.exit")" "$original_body_sha" "$changed_body_sha" "$original_blob" "$changed_blob" "$base_tree" "$changed_tree" "$restored_tree" "$before_index_sha" "$changed_index_sha" "$restored_index_sha" >> "$out/main-bridge-controls.jsonl"
          done
          GIT_OPTIONAL_LOCKS=0 git diff --exit-code HEAD;test -z "$(GIT_OPTIONAL_LOCKS=0 git status --porcelain --untracked-files=no)"
          sha256sum -c "$out/default-index.before.sha256" > "$out/default-index-held.log"
          git for-each-ref --format='%(refname) %(objectname)' > "$out/refs.after.txt";cmp "$out/refs.before.txt" "$out/refs.after.txt"
          printf '{"schema":1,"status":"ACTUAL_MAIN_SAME_OR_REGULAR_WORKBOARD_ONLY_WITH_PHYSICAL_PRIVATE_TREE_CONTROLS","source":"%s","productParent":"%s","mainAtPlan":"%s","mainAtStart":"%s","compatibility":"%s","nonBoardDiffRaw":0,"positiveBoardControl":true,"negativeAppControl":true,"samePrivateIndexBytesAndTreeRestored":true,"defaultIndexAndRefsHeld":true,"sourceOrRefMutation":false}\n' "$GITHUB_SHA" "$EXPECTED_PARENT" "$EXPECTED_MAIN" "$actual_main" "$actual_kind" > "$out/MAIN-BOARD-COMPATIBILITY-ADMISSION.json"
          origin_main=$(git rev-parse --verify 'origin/main^{commit}')
          inspect_main_trees "$EXPECTED_MAIN" "$origin_main" "$out/main-origin-reference"
          echo "SEO_ORIGIN_MAIN_BASE_SHA=$origin_main" >> "$GITHUB_ENV"
          git diff --name-status "$EXPECTED_PARENT" HEAD > "$out/proof-diff.txt"
          printf 'A\t.github/workflows/afl1572-copy-qualification.yml\nA\tscripts/qa/afl1572SeoOldDescriptionControl.cjs\n' > "$out/expected-proof-diff.txt"
          cmp "$out/proof-diff.txt" "$out/expected-proof-diff.txt"
          test "$(git ls-files | wc -l)" -eq 5463
          test "$(git rev-parse HEAD:scripts/sweepWeight.mjs)" = 084cce2062686259437cd2a334093a561c819c36
          test "$(sha256sum scripts/qa/afl1572SeoOldDescriptionControl.cjs | cut -d' ' -f1)" = 2d7f9b1ec07faaffef3c216e57dfc4cdee3f3e3f97385b3bdf464d57ca829d3d
          git ls-files -z | sort -z > "$out/source-members.initial"
          xargs -0 sha256sum < "$out/source-members.initial" > "$out/source.initial.sha256"
          git ls-files --others --exclude-standard -z | sort -z > "$out/untracked.initial"
          git archive --format=tar HEAD > "$out/source.tar"
          git rev-parse HEAD HEAD^{tree} "$EXPECTED_PARENT" "$EXPECTED_PRODUCT_TREE" origin/main > "$out/source-refs.txt"
          printf '{"plannedMain":"%s","observedMain":"%s","originMainReference":"%s","scope":"AFL1572 joined copy and actual feature qualification","shippingSourceImmutable":true,"matchedCopyReleaseOutputsUnshipped":true,"fullRunAllSims":"UNRUN","fullDefaultVitest":"UNRUN","sourceRegularFiles":5463,"productRegularFiles":5461,"qaAdditions":2}\n' "$EXPECTED_MAIN" "$actual_main" "$origin_main" > "$out/SCOPE.json"
      - name: Install locked application dependencies
        run: npm ci > "$PLACEMENT_OUT/npm-ci.stdout.log" 2> "$PLACEMENT_OUT/npm-ci.stderr.log"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Existing brand prerequisites
        run: python -m pip install fonttools pillow > "$PLACEMENT_OUT/brand-tools.log" 2>&1
      - name: Isolated browser tooling and actual prepared fonts
        run: |
          set -euo pipefail
          out="$PLACEMENT_OUT"; tools="$RUNNER_TEMP/menu-placement-browser-tools"; test ! -e "$tools"
          npm install --prefix "$tools" --no-save --package-lock=false playwright@1.64.0 > "$out/browser-install.log" 2>&1
          test ! -e node_modules/playwright; test ! -e node_modules/playwright-core
          ln -s "$tools/node_modules/playwright" node_modules/playwright; ln -s "$tools/node_modules/playwright-core" node_modules/playwright-core
          export PLAYWRIGHT_BROWSERS_PATH="$tools/browsers"; echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"; echo "PLACEMENT_TOOLS=$tools" >> "$GITHUB_ENV"
          executable=$(node -e 'const a=require("node:assert/strict");a.equal(require("playwright/package.json").version,"1.64.0");a.equal(require("playwright-core/package.json").version,"1.64.0");process.stdout.write(require("playwright").chromium.executablePath())')
          if test ! -f "$executable";then node "$tools/node_modules/playwright/cli.js" install --with-deps chromium > "$out/chromium-install.log" 2>&1;fi
          node scripts/qa/freeKickLab1070.mjs --prefetch-fonts-only > "$out/font-prefetch.log" 2>&1
          sha=$(sha256sum "$FREE_KICK_FONT_CACHE/manifest.json" | cut -d ' ' -f1); echo "FONT_CACHE_MANIFEST_SHA256=$sha" >> "$GITHUB_ENV"
      - name: Create exact detached qualification copy and finite command accounting
        run: |
          set -euo pipefail
          out="$PLACEMENT_OUT"; qualified="$RUNNER_TEMP/afl1572-qualified-source"
          test ! -e "$qualified"; git worktree add --detach "$qualified" HEAD > "$out/worktree.log" 2>&1
          ln -s "$GITHUB_WORKSPACE/node_modules" "$qualified/node_modules"
          echo "QUALIFICATION_ROOT=$qualified" >> "$GITHUB_ENV"
          mkdir -p "$out/helpers" "$out/gates"
          node <<'FONT_HELPER'
          const fs=require('node:fs'),out=process.env.PLACEMENT_OUT;
          fs.writeFileSync(out+'/helpers/prepared-fonts.cjs',"'use strict';\nconst fs = require('node:fs');\nconst path = require('node:path');\nconst assert = require('node:assert/strict');\nconst { createHash } = require('node:crypto');\nconst hash = value => createHash('sha256').update(value).digest('hex');\nif ([\"prerender.mjs\",\"playAflClubNames.mjs\",\"playHomeFold.mjs\",\"simPrerenderBoot.mjs\",\"simSeoMetaSplit.mjs\"].includes(path.basename(process.argv[1] || ''))) {\n  const cache = process.env.FREE_KICK_FONT_CACHE;\n  const manifestBytes = fs.readFileSync(path.join(cache, 'manifest.json'));\n  assert.match(process.env.FONT_CACHE_MANIFEST_SHA256 || '', /^[a-f0-9]{64}$/);\n  assert.equal(hash(manifestBytes), process.env.FONT_CACHE_MANIFEST_SHA256, 'Prepared font manifest stays exact');\n  const sheet = [...fs.readFileSync('index.html', 'utf8').matchAll(/<link\\s+href=\"(https:\\/\\/fonts\\.googleapis\\.com\\/[^\\\"]+)\"\\s+rel=\"stylesheet\"/g)].map(m => new URL(m[1]).href);\n  assert.equal(sheet.length, 1, 'Use the actual single template stylesheet');\n  const entries = JSON.parse(manifestBytes);\n  assert(Array.isArray(entries) && entries.length > 1);\n  const fonts = new Map();\n  for (const entry of entries) {\n    assert(!fonts.has(entry.url), 'No duplicate font cache URL');\n    const url = new URL(entry.url);\n    assert(['https://fonts.googleapis.com', 'https://fonts.gstatic.com'].includes(url.origin));\n    assert.equal(url.href, entry.url);\n    assert.equal(entry.file, hash(entry.url));\n    assert.match(entry.sha256, /^[a-f0-9]{64}$/);\n    assert.equal(typeof entry.contentType, 'string');\n    const body = fs.readFileSync(path.join(cache, entry.file));\n    assert.equal(hash(body), entry.sha256, 'Prepared font body stays exact');\n    fonts.set(entry.url, { ...entry, body });\n  }\n  assert(fonts.has(sheet[0]), 'Current template stylesheet is cached');\n  const css = fonts.get(sheet[0]);\n  assert.match(css.contentType, /^text\\/css(?:;|$)/);\n  const declared = [...new Set([...css.body.toString('utf8').matchAll(/url\\(\\s*['\"]?(https:\\/\\/[^)'\"\\s]+)/g)].map(m => m[1]))];\n  assert(declared.length > 0);\n  assert.deepEqual([...fonts.keys()].sort(), [sheet[0], ...declared].sort(), 'Only actual stylesheet dependencies are fulfilled');\n  for (const url of declared) assert.equal(new URL(url).origin, 'https://fonts.gstatic.com');\n  const pw = require(path.join(process.cwd(), 'node_modules/playwright-core'));\n  let contextId = 0;\n  const originalLaunch = pw.chromium.launch.bind(pw.chromium);\n  pw.chromium.launch = async options => {\n    const browser = await originalLaunch(options);\n    const originalContext = browser.newContext.bind(browser);\n    browser.newContext = async options => {\n      const context = await originalContext(options);\n      const id = ++contextId;\n      if (path.basename(process.argv[1] || '') === 'prerender.mjs') {\n        fs.appendFileSync(process.env.PREPARED_CONTEXT_RECEIPT, JSON.stringify({ contextId: id, processId: process.pid, script: 'prerender.mjs' }) + '\\n');\n        await context.route(url => url.origin === \"https://flagcdn.com\", async route => {\n          const request = route.request(), url = new URL(request.url());\n          const validPath = /^\\/(?:w[1-9][0-9]{0,2}\\/|h[1-9][0-9]{0,2}\\/|[1-9][0-9]{0,2}x[1-9][0-9]{0,2}\\/)?[a-z]{2}(?:-[a-z0-9]{1,8})?\\.(?:png|webp|svg)$/.test(url.pathname);\n          if (url.origin !== \"https://flagcdn.com\" || url.username || url.password || url.search || url.hash || !validPath || request.method() !== \"GET\" || request.resourceType() !== \"image\") return route.fallback();\n          await route.abort(\"blockedbyclient\");\n          fs.appendFileSync(process.env.PREPARED_FLAG_RECEIPT, JSON.stringify({ contextId: id, processId: process.pid, script: 'prerender.mjs', method: request.method(), resourceType: request.resourceType(), url: url.href, action: \"LOCAL_ABORT\" }) + '\\n');\n        });\n      }\n      await context.route(/^https:\\/\\/(?:fonts\\.googleapis\\.com|fonts\\.gstatic\\.com)\\//, async route => {\n        const request = route.request(), entry = fonts.get(request.url());\n        if (request.method() !== 'GET' || !entry || !['stylesheet', 'font'].includes(request.resourceType())) return route.fallback();\n        await route.fulfill({ status: 200, contentType: entry.contentType, body: entry.body });\n        fs.appendFileSync(process.env.FONT_CACHE_USE_RECEIPT, JSON.stringify({ contextId: id, url: entry.url, sha256: entry.sha256, manifestSha256: hash(manifestBytes), resourceType: request.resourceType() }) + '\\n');\n      });\n      return context;\n    };\n    return browser;\n  };\n}\n",{flag:'wx'});
