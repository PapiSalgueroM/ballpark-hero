name: Soccer Career saved derby history

on:
  pull_request:
    paths:
      - .github/workflows/career-derby-history.yml
      - src/pages/SoccerCareer.tsx
      - src/components/soccer-career/SoccerDerbyHistory.tsx
      - src/lib/soccerCareerDerbyHistory.ts
      - src/lib/soccerCareerDerbyHistory.test.ts
      - src/lib/soccerCareerDerby.ts
      - src/test/careerSeasonRatings.test.tsx
      - src/test/soccerDerbyHistoryUi.test.tsx
      - scripts/qa/derbyHistory1195.mjs
      - scripts/playDerbyHistory1195.mjs
      - scripts/simSoccerDerbyHistory.mjs
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: career-derby-history-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    defaults:
      run:
        shell: bash
    env:
      SIM_NETWORK: offline
      ENGINES: chromium
      TZ: UTC
      DERBY_HISTORY_ARTIFACTS: career-derby-history-artifacts/outcomes
      SHOTS: career-derby-history-artifacts/native
      FREE_KICK_FONT_CACHE: career-derby-history-artifacts/font-cache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare exact-head remote checks
        run: |
          mkdir -p career-derby-history-artifacts
          git rev-parse HEAD > career-derby-history-artifacts/source-head.txt
          git rev-parse HEAD^{tree} > career-derby-history-artifacts/source-tree.txt
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse 48790763e65446b75c7699498b806637dc5c0111^{tree})" = 24c2d492736512dce864095bf763be208516caa6
          npm ci
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          python -m pip install fonttools pillow
          node scripts/qa/freeKickLab1070.mjs --prefetch-fonts-only 2>&1 | tee career-derby-history-artifacts/fonts.log
      - name: Actual app types then production build
        id: build
        run: |
          node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee career-derby-history-artifacts/types.log
          npm run build 2>&1 | tee career-derby-history-artifacts/build.log
      - name: Focused units and complete unchanged main outcome proof
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          failed=0
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node node_modules/vitest/vitest.mjs run src/lib/soccerCareerDerbyHistory.test.ts src/test/soccerDerbyHistoryUi.test.tsx src/test/careerSeasonRatings.test.tsx src/test/careerStory.test.tsx src/test/seasonCentreWords.test.tsx --maxWorkers=1 --minWorkers=1 --reporter=default --reporter=json --outputFile=career-derby-history-artifacts/focused-unit.json 2>&1 | tee career-derby-history-artifacts/focused-unit.log || failed=1
          DERBY_HISTORY_CONTROL=all NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/simSoccerDerbyHistory.mjs 2>&1 | tee career-derby-history-artifacts/simSoccerDerbyHistory.log || failed=1
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/simHarnessAnchors.mjs 2>&1 | tee career-derby-history-artifacts/simHarnessAnchors.log || failed=1
          node --input-type=module - <<'JS' || failed=1
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const root='career-derby-history-artifacts',read=file=>JSON.parse(fs.readFileSync(root+'/'+file,'utf8'));
          const units=read('focused-unit.json'),report=read('outcomes/healthy/report.json'),controls=read('outcomes/controls.json');
          assert.equal(units.success,true);assert.equal(units.numFailedTests,0);
          for(const [file,count]of[['/src/lib/soccerCareerDerbyHistory.test.ts',63],['/src/test/soccerDerbyHistoryUi.test.tsx',30]]){const suite=units.testResults.find(row=>row.name.replaceAll('\\','/').endsWith(file));assert(suite,file);assert.equal(suite.assertionResults.length,count);assert(suite.assertionResults.every(row=>row.status==='passed'));}
          const head=fs.readFileSync(root+'/source-head.txt','utf8').trim(),tree=fs.readFileSync(root+'/source-tree.txt','utf8').trim();
          assert.equal(report.head,head);assert.equal(report.tree,tree);assert.equal(report.baseHead,'48790763e65446b75c7699498b806637dc5c0111');assert.equal(report.baseTree,'24c2d492736512dce864095bf763be208516caa6');
          assert.equal(report.status,'passed');assert.deepEqual(report.failed,[]);assert.equal(report.cases.length,11);assert(report.cases.every(row=>row.passed));assert.equal(report.sourceHeld,true);assert.deepEqual(report.sourceBefore,report.sourceAfter);
          for(const [key,count]of Object.entries({enginePairs:24,campaignPairs:192,readerPairs:90,seasonRows:84,meetings:180,rivals:18}))assert.equal(report.counts[key],count,key);
          assert(report.originalLoaded.length>0);assert(report.originalLoaded.every(row=>!row.changed&&row.beforeSha256===row.compiledSha256));
          assert.equal(controls.head,head);assert.equal(controls.tree,tree);assert.equal(controls.sourceHeld,true);assert.equal(controls.controls.length,10);assert(controls.controls.every(row=>row.effective&&row.failed.length>0&&row.receipts.length===1));
          console.log('Receipt:63 reader cases,30 UI cases,11 outcome groups,24 full main season/RNG pairs,192 full campaign/RNG pairs,10 effective loaded controls.');
          JS
          exit "$failed"
      - name: Effective copied product scroll and focus controls
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node --input-type=module - <<'JS' 2>&1 | tee career-derby-history-artifacts/ui-controls.log
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import {createHash} from 'node:crypto';
          import {spawnSync} from 'node:child_process';
          const root=process.cwd(),out=path.join(root,'career-derby-history-artifacts'),file=path.join(root,'src/components/soccer-career/SoccerDerbyHistory.tsx'),raw=fs.readFileSync(file),source=raw.toString('utf8').replaceAll('\r\n','\n'),sha=value=>createHash('sha256').update(value).digest('hex');
          const faults=[
            {name:'scroll',from:'body.current.scrollTop = pending.top;',to:'body.current.scrollTop = typeof pending.target === "number" ? 0 : pending.top;'},
            {name:'focus',from:'target?.focus({ preventScroll: true });',to:'if (typeof pending.target !== "number") target?.focus({ preventScroll: true });'},
          ],receipts=[];
          const tempRoot=path.join(root,'.sim-control');fs.mkdirSync(tempRoot,{recursive:true});
          for(const fault of faults){
            assert.equal(source.split(fault.from).length-1,1,fault.name+': unique live product anchor');const faulty=source.replace(fault.from,fault.to);assert.notEqual(sha(faulty),sha(source));const temp=fs.mkdtempSync(path.join(tempRoot,'derby-history-'+fault.name+'-'));assert.equal(path.dirname(temp),tempRoot);
            try{
              const copied=path.join(temp,'SoccerDerbyHistory.tsx');fs.writeFileSync(copied,faulty);
              const output=path.join(out,'ui-control-'+fault.name+'.json'),log=spawnSync(process.execPath,['node_modules/vitest/vitest.mjs','run','src/test/soccerDerbyHistoryUi.test.tsx','--maxWorkers=1','--minWorkers=1','--reporter=json','--outputFile='+output],{cwd:root,env:{...process.env,NO_DOUBLE_SWAP:JSON.stringify({'@/components/soccer-career/SoccerDerbyHistory':copied})},encoding:'utf8',maxBuffer:8*1024*1024});
              process.stdout.write(log.stdout);process.stderr.write(log.stderr);assert.equal(log.status,1,'Copied real product must fail an assertion');
              const result=JSON.parse(fs.readFileSync(output,'utf8')),assertions=result.testResults.flatMap(row=>row.assertionResults),failed=assertions.filter(row=>row.status==='failed');
              assert.equal(result.numTotalTests,30);assert.equal(result.numFailedTests,1);assert.equal(assertions.length,30);assert.deepEqual(failed.map(row=>row.fullName),['saved Soccer derby history UI restores season list scroll and the selected remounted tile after Back']);assert.equal(assertions.filter(row=>row.status==='passed').length,29);assert(failed[0].failureMessages.some(message=>{const plain=message.replace(/\u001b\[[0-9;]*m/g,'');return fault.name==='focus'?plain.includes('expect(element).toHaveFocus()')&&plain.includes('Expected element with focus:')&&plain.includes('Received element with focus:'):/AssertionError|expected/.test(plain);}),'Assertion outcome, not an import error');
              receipts.push({name:fault.name,effective:true,from:fault.from,to:fault.to,originalSha256:sha(source),copiedSha256:sha(faulty),rawHeldSha256:sha(raw),failed:failed.map(row=>row.fullName),unrelatedPassed:29});fs.writeFileSync(path.join(out,'ui-control-'+fault.name+'-source.tsx'),faulty);assert.deepEqual(fs.readFileSync(file),raw);console.log('CONTROL FIRED(UI '+fault.name+'): exact restoration assertion only;29 unrelated cases passed.');
            }finally{assert.equal(path.dirname(path.resolve(temp)),path.resolve(tempRoot));assert(path.basename(temp).startsWith('derby-history-'));fs.rmSync(temp,{recursive:true,force:true});assert.deepEqual(fs.readFileSync(file),raw);}
          }
          fs.writeFileSync(path.join(out,'ui-controls-receipt.json'),JSON.stringify({receipts,sourceHeld:true},null,2));
          JS
      - name: Actual native saved derby history journeys
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/playDerbyHistory1195.mjs 2>&1 | tee career-derby-history-artifacts/playDerbyHistory1195.log
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const root='career-derby-history-artifacts',report=JSON.parse(fs.readFileSync(root+'/native/report.json','utf8'));
          assert.equal(report.head,fs.readFileSync(root+'/source-head.txt','utf8').trim());assert.equal(report.tree,fs.readFileSync(root+'/source-tree.txt','utf8').trim());assert.equal(report.cases.length,9);assert(report.cases.every(row=>row.ok));assert.equal(report.failed,0);assert(report.checks>0);
          assert.equal(report.controls.length,4);assert(report.controls.every(row=>row.changed&&row.restored&&row.failed.length>0));assert.equal(report.forwardedExternalRequests,0);assert(report.fontManifestEntries>0);assert.deepEqual(report.sourceBefore,report.sourceAfter);
          assert(report.cases.every(row=>row.layouts.length===9&&row.readings.length>0&&row.readings.every(read=>read.expectedSha256===read.actualSha256&&read.drawCount===0)&&row.reloads.length===2&&row.reloads.every(reload=>reload.equal)&&row.restorations.length===13&&row.selections.length===7));
          console.log('Receipt:'+report.checks+' actual native checks,9 journeys,81 readable captures,4 copied detectors,all complete career bytes and reading draws held.');
          JS
      - name: Upload early proof and browser evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: career-derby-history-early-${{ github.run_id }}-${{ github.run_attempt }}
          path: career-derby-history-artifacts/
          retention-days: 5
      - name: Existing Derbies Ratings Stats Story and Season Centre outcomes
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          failed=0
          for harness in simCareerDerbies simCareerSeasonRatings simCareerPositionRatings simCareerRecordedStats simCareerStory simSeasonCentreAgreement simSeasonCentreNeutral simSeasonCentreTable simSoccerSeasonCompetitions simNoInventedQuotes simCareerSeasonTruth; do
            ONLY="$harness" node scripts/runAllSims.mjs --browser 2>&1 | tee "career-derby-history-artifacts/$harness.log" || failed=1
          done
          exit "$failed"
      - name: All fifteen built-output readers
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          failed=0
          for harness in simAdsense simBrand simHeadTags simHiddenPages simHubs simIndexNow simIndexing simInternalLinks simNoRivalNames simPrerender simPrerenderBoot simRetiredRoutes simSchema simSitemap simSnapshotAssets; do
            ONLY="$harness" node scripts/runAllSims.mjs --browser 2>&1 | tee "career-derby-history-artifacts/$harness.log" || failed=1
          done
          exit "$failed"
      - name: Source and exact head held
        if: ${{ !cancelled() }}
        run: |
          git diff --exit-code HEAD -- src scripts .github/workflows 2>&1 | tee career-derby-history-artifacts/source-held.log
          test "$(git rev-parse HEAD)" = "$(cat career-derby-history-artifacts/source-head.txt)"
          test "$(git rev-parse HEAD^{tree})" = "$(cat career-derby-history-artifacts/source-tree.txt)"
          du -sb career-derby-history-artifacts | tee career-derby-history-artifacts/artifact-size.log
          test "$(du -sb career-derby-history-artifacts | cut -f1)" -lt 500000000
      - name: Upload complete exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: career-derby-history-final-${{ github.run_id }}-${{ github.run_attempt }}
          path: career-derby-history-artifacts/
          retention-days: 5
