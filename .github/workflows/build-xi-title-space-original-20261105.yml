name: Admit retained Build Your XI title packet
on:
  push:
    branches: [codex/build-xi-title-space-qa-20261105]
permissions:
  contents: read
  actions: read
jobs:
  retained_metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - name: Preserve source and fetch exact immutable packet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p xi-title-fixed-admission
          git rev-parse HEAD > xi-title-fixed-admission/admission-head.txt
          git ls-files -s > xi-title-fixed-admission/admission-source-before.txt
          test "$(git rev-parse HEAD:src/pages/LineupBuilder.tsx)" = dcd727d53ed3f31b38e0c3db1849af3ba09f03b6
          test "$(git rev-parse HEAD:src/components/lineup/TeamSpinner.tsx)" = aecb4220f2ff7bb063478a3ba88aa1ca45ddbaff
          test "$(git rev-parse HEAD:scripts/qa/playBuildXiTitleSpace.mjs)" = e4e053a154b40e6929cee3e8bb9ee1fa5ec7ea90
          gh api repos/PapiSalgueroM/ballpark-hero/actions/artifacts/13476058749 > xi-title-fixed-admission/artifact-metadata.json
          gh api repos/PapiSalgueroM/ballpark-hero/actions/runs/42160100314 > xi-title-fixed-admission/original-run.json
          gh api repos/PapiSalgueroM/ballpark-hero/actions/artifacts/13476058749/zip > xi-title-fixed-admission/retained-packet.zip
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';import {createHash} from 'node:crypto';
          const out='xi-title-fixed-admission',meta=JSON.parse(fs.readFileSync(out+'/artifact-metadata.json')),run=JSON.parse(fs.readFileSync(out+'/original-run.json')),zip=fs.readFileSync(out+'/retained-packet.zip');
          assert.equal(meta.id,13476058749);assert.equal(meta.expired,false);assert.equal(meta.workflow_run.id,42160100314);
          assert.equal(run.id,42160100314);assert.equal(run.head_sha,'6edabe165b8066e6cfc05b8cc7efe0aa3afd66f3');assert.equal(run.status,'completed');assert.equal(run.conclusion,'failure','The original wrapper run remains red');
          assert.equal(zip.length,8858719);const sha=createHash('sha256').update(zip).digest('hex');assert.equal(sha,'6cac6693ad47c4556400e1fd0908dec223fa264932f45ecc6d658b0fc97a31b9');
          fs.writeFileSync(out+'/retained-packet.sha256',sha+'  retained-packet.zip\n');
          NODE
      - name: Correct admission of retained native evidence only
        run: |
          set -euo pipefail
          export RETAINED_PACKET="$RUNNER_TEMP/xi-title-fixed-retained"
          export RETAINED_DIST="$RUNNER_TEMP/xi-title-fixed-dist"
          mkdir -p "$RETAINED_PACKET" "$RETAINED_DIST"
          unzip -q xi-title-fixed-admission/retained-packet.zip -d "$RETAINED_PACKET"
          tar -xzf "$RETAINED_PACKET/dist.tgz" -C "$RETAINED_DIST"
          node --input-type=module <<'NODE' 2>&1 | tee xi-title-fixed-admission/admission.log
          import fs from 'node:fs';import path from 'node:path';import assert from 'node:assert/strict';import {createHash} from 'node:crypto';
          const packet=process.env.RETAINED_PACKET,dist=process.env.RETAINED_DIST,out='xi-title-fixed-admission',browser=path.join(packet,'browser');
          const sha=b=>createHash('sha256').update(b).digest('hex'),blob=b=>createHash('sha1').update(Buffer.concat([Buffer.from('blob '+b.length+'\0'),b])).digest('hex');
          let checks=0,referenceChecks=0;const files=new Set(),ok=(v,label)=>{checks++;assert(v,label);},eq=(a,b,label)=>{checks++;assert.deepEqual(a,b,label);},json=f=>JSON.parse(fs.readFileSync(f)),pair=(a,b)=>eq(fs.readFileSync(path.join(packet,a)),fs.readFileSync(path.join(packet,b)),a+' exact hold');
          const report=json(path.join(browser,'report.json'));
          eq(fs.readFileSync(path.join(packet,'head.txt'),'utf8').trim(),'6edabe165b8066e6cfc05b8cc7efe0aa3afd66f3');
          eq(fs.readFileSync(path.join(packet,'browser.exit'),'utf8').trim(),'0','Actual retained native helper exit0');
          eq([report.status,report.arm,report.checks],['passed','fixed',335]);eq(report.businessFailures,[]);
          eq(report.component.blob,'aecb4220f2ff7bb063478a3ba88aa1ca45ddbaff');eq(report.journeys.map(j=>[j.width,j.status]),[[320,'passed'],[390,'passed'],[1280,'passed']]);eq(report.screenshots.length,3);
          ok(!report.error&&report.sourceHeld&&report.distHeld,'Retained helper passed source/dist holds');eq(report.sourceBefore,report.sourceAfter);eq(report.distBefore,report.distAfter);eq(report.sourceBefore.length,18);eq(report.distBefore.length,850);
          const log=fs.readFileSync(path.join(packet,'browser.log'),'utf8');ok(['PASS 320','PASS 390','PASS 1280'].every(s=>log.includes(s))&&!/AssertionError|setup-or-preserve-failed|Unhandled Rejection|Failed to resolve import/.test(log),'Retained native helper has no failure');
          const read=ref=>{referenceChecks++;files.add(ref.file);const b=fs.readFileSync(path.join(browser,ref.file));eq(b.length,ref.bytes,ref.file+' bytes');eq(sha(b),ref.sha256,ref.file+' SHA');return ref.file.endsWith('.json')?JSON.parse(b):null;};
          let frames=0,actions=0,observations=0,heldRerolls=0,homes=0;const clearances=[],journeys=[];
          for(const j of report.journeys){
            ok(!j.error&&j.errors.length===0&&j.assetErrors.length===0,'No retained setup, App or asset failure');
            ok(j.requests.every(r=>r.outcome==='aborted')&&!j.requests.some(r=>/\/(player_market_values|player_verified_positions|validate-player|evaluate-lineup|game_completions)(\?|$)/.test(r.url)),'No forwarded foreign, player, admission or completion transport');
            ok(j.events.some(e=>e.trusted&&(j.width<1000?e.pointerType==='touch':e.type==='keydown'&&e.key==='Enter')),'Actual native mode retained');
            ok(j.reservationResults.length>=2&&j.reservationResults.every(v=>v===true),'Corrected fixed predicate1: all reservationResults true');
            eq(j.spacePassed,true,'Corrected fixed predicate2: spacePassed true');
            ok(j.rerolls>=0&&j.rerolls<=29&&j.longCapture.requiredForQualification===false,'Bounded optional long-name capture');
            for(const ref of j.frames){const f=read(ref);frames++;eq(f.viewport.width,j.width);ok(f.documentWidth<=j.width,'No retained document overflow');}
            for(const ref of j.actions){
              const a=read(ref);actions++;
              if(a.held){heldRerolls++;eq(a.before.scroll,a.after.scroll,'Exact native prepared scroll hold');eq(a.before.storage,a.after.storage,'Exact native prepared full storage hold');ok(a.name.startsWith('natural-reroll-')&&a.after.body.includes('0/11'),'Reroll did not admit a player');}
              if(a.name==='native-photo-preparation'){homes++;eq(a.after.scroll,{x:0,y:0});eq(a.before.storage,a.after.storage);eq(a.events.filter(e=>e.trusted&&e.type==='keydown'&&e.ctrlKey&&e.key==='Home'&&e.targetId==='dukb-main').length,1,'Actual trusted Home');}
            }
            for(const ref of j.observations){
              const v=read(ref);observations++;
              eq(v.reserved,true,'Corrected fixed predicate3: observation reserved true');
              ok(v.title.contentRight<=v.button.rect.x,'Corrected fixed predicate4: contentRight <= actual reroll.left');
              eq(v.title.paddingRight,48);eq(v.title.contentRight,v.title.rect.right-v.title.borderRight-v.title.paddingRight);eq(v.button.rect.x-v.title.contentRight,17);clearances.push(v.button.rect.x-v.title.contentRight);
              eq([v.button.rect.width,v.button.rect.height],[44,44]);ok(v.title.contentWidth>0&&v.verticalOverlap>0,'Native reroll/title row measured');eq([v.title.overflow,v.title.textOverflow,v.title.whiteSpace],['hidden','ellipsis','nowrap']);
              eq(v.hint.text,'Matching '+v.club+' records from 2010');eq([v.hint.visibility,v.hint.ariaHidden],['visible',null]);
              ok(v.hint.scrollWidth<=v.hint.clientWidth&&v.hint.scrollHeight<=v.hint.clientHeight&&v.hint.ranges.every(r=>r.x>=v.hint.rect.x-.5&&r.right<=v.hint.rect.right+.5&&r.y>=v.hint.rect.y-.5&&r.bottom<=v.hint.rect.bottom+.5),'Full matching hint fits');
            }
            journeys.push({width:j.width,frames:j.frames.length,actions:j.actions.length,observations:j.observations.length,rerolls:j.rerolls,longCapture:j.longCapture});
          }
          for(const shot of report.screenshots){read(shot);const f=read(shot.frame),v=read(shot.observation);eq(f.scroll,{x:0,y:0});ok(v.card.y>=Math.max(0,...shot.chrome.map(e=>e.bottom)),'Actual capture below top chrome');ok(f.body.includes(v.hint.text)&&f.body.includes('0/11'),'Actual frame has full name/year and empty draft');}
          eq([frames,actions,observations,heldRerolls,homes,referenceChecks,files.size],[72,33,21,15,3,135,129],'Exact retained native packet census');
          for(const [a,b]of [['source-before.txt','source-after.txt'],['tracked-before.json','tracked-after.json'],['locks-before.txt','locks-after.txt'],['installed-before.json','installed-after.json'],['installed-before.json','installed-final.json'],['dist-before.json','dist-after.json']])pair(a,b);
          const tracked=json(path.join(packet,'tracked-before.json')),trackedMap=new Map(tracked.map(r=>[r.file,r])),installed=json(path.join(packet,'installed-before.json'));
          eq(tracked.length,5766);eq(trackedMap.size,5766);eq(installed.length,521);ok(tracked.every(r=>r.file&&Number.isInteger(r.bytes)&&r.bytes>=0&&/^[a-f0-9]{64}$/.test(r.sha256)),'Complete valid whole-tracked byte vector');
          const index=fs.readFileSync(path.join(packet,'source-before.txt'),'utf8').trim().split('\n'),indexMap=new Map(index.map(line=>{const m=/^\d+ ([a-f0-9]{40}) \d+\t(.+)$/.exec(line);assert(m,'Valid retained index row');return [m[2],m[1]];}));
          eq(indexMap.size,trackedMap.size);ok([...indexMap.keys()].every(f=>trackedMap.has(f)),'Whole tracked index and body census match');
          eq(indexMap.get('src/pages/LineupBuilder.tsx'),'dcd727d53ed3f31b38e0c3db1849af3ba09f03b6');eq(indexMap.get('src/components/lineup/TeamSpinner.tsx'),'aecb4220f2ff7bb063478a3ba88aa1ca45ddbaff');eq(indexMap.get('scripts/qa/playBuildXiTitleSpace.mjs'),'e4e053a154b40e6929cee3e8bb9ee1fa5ec7ea90');
          for(const r of report.sourceBefore){const prior=trackedMap.get(r.file),b=fs.readFileSync(r.file);ok(prior&&prior.bytes===r.bytes&&prior.sha256===r.sha256,'Report source matches retained whole vector');eq(b.length,r.bytes);eq(sha(b),r.sha256,'Current held App/helper body equals immutable packet');eq(blob(b),r.blob);}
          eq(fs.statSync(path.join(packet,'offline.log')).size,0,'Retained offline receipt0');eq(fs.statSync(path.join(packet,'types.log')).size,0,'Retained proper type log0');
          const pw=json(path.join(packet,'browser-package.json'));eq(pw.version,'1.64.1');
          const tar=fs.readFileSync(path.join(packet,'dist.tgz')),tarHash=sha(tar);eq(tarHash,'9ad704e1f163f73dcd575f487ddf97c57a7ad01a3b881cc53a808331126173cd');ok(fs.readFileSync(path.join(packet,'dist.sha256'),'utf8').startsWith(tarHash+' '),'Retained tar recorded hash');
          const manifest=json(path.join(packet,'dist-before.json')),manifestMap=new Map(manifest.map(r=>[r.file,r]));eq(manifest.length,850);eq(manifestMap.size,850);
          const walk=dir=>fs.readdirSync(dir,{withFileTypes:true}).flatMap(e=>e.isDirectory()?walk(path.join(dir,e.name)):e.isFile()?[path.join(dir,e.name)]:[]);
          const built=walk(path.join(dist,'dist'));eq(built.length,850);
          for(const file of built){const rel=path.relative(dist,file).split(path.sep).join('/'),r=manifestMap.get(rel),b=fs.readFileSync(file);ok(!!r,'Every retained actual archive file is in manifest');eq(b.length,r.bytes);eq(sha(b),r.sha256);}
          for(const r of report.distBefore){const m=manifestMap.get(r.file),b=fs.readFileSync(path.join(dist,r.file));ok(m&&m.bytes===r.bytes&&m.sha256===r.sha256,'Browser vector equals retained build');eq(blob(b),r.blob);}
          const summary={status:'corrected-retained-metadata-admission-passed',artifactId:13476058749,zipBytes:8858719,zipSHA256:'6cac6693ad47c4556400e1fd0908dec223fa264932f45ecc6d658b0fc97a31b9',originalRun:42160100314,originalHead:'6edabe165b8066e6cfc05b8cc7efe0aa3afd66f3',originalRunRemains:'wrapper-failed',actualRetainedHelper:{exit:0,status:report.status,checks:report.checks,frames,actions,observations,heldRerolls,homes,referenceChecks,uniqueReferences:files.size,journeys,minimumContentClearance:Math.min(...clearances),screenshots:3},holds:{sourceFiles:18,wholeTracked:tracked.length,installed:installed.length,distFiles:850,tarSHA256:tarHash,offlineBytes:0,retainedTypeLogBytes:0},checks,scope:'Corrected admission of immutable existing native packet only. Original run stays red. No npm ci, type, build or browser rerun; no reader, cap, full qualification, warning, completion, roster or backend-write credit.'};
          fs.writeFileSync(out+'/admission.json',JSON.stringify(summary,null,2));console.log(JSON.stringify(summary));
          NODE
      - name: Admission source stays unchanged
        if: always()
        run: |
          set -euo pipefail
          git ls-files -s > xi-title-fixed-admission/admission-source-after.txt
          cmp xi-title-fixed-admission/admission-source-before.txt xi-title-fixed-admission/admission-source-after.txt
          git diff --exit-code HEAD -- .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-xi-title-fixed-admission-${{ github.run_id }}
          path: xi-title-fixed-admission
          retention-days: 14
          if-no-files-found: error
