name: Build Your XI title space fixed proof
on:
  push:
    branches: [codex/build-xi-title-space-qa-20261105]
permissions:
  contents: read
jobs:
  original:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      SIM_NETWORK: offline
      SIM_OFFLINE_RECEIPT: xi-title-fixed/offline.log
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Exact fixed source and locked install
        run: |
          set -euo pipefail
          mkdir -p xi-title-fixed
          touch xi-title-fixed/offline.log
          git rev-parse HEAD > xi-title-fixed/head.txt
          git rev-parse 'HEAD^{tree}' > xi-title-fixed/tree.txt
          git ls-files -s > xi-title-fixed/source-before.txt
          test "$(git rev-parse HEAD:src/pages/LineupBuilder.tsx)" = dcd727d53ed3f31b38e0c3db1849af3ba09f03b6
          test "$(git rev-parse HEAD:src/hooks/useLineupBuilder.ts)" = d6ecb6bd9ca7e15d328957294c60126b1d02f1d8
          test "$(git rev-parse HEAD:src/components/lineup/TeamSpinner.tsx)" = aecb4220f2ff7bb063478a3ba88aa1ca45ddbaff
          test "$(git rev-parse HEAD:scripts/qa/playBuildXiTitleSpace.mjs)" = e4e053a154b40e6929cee3e8bb9ee1fa5ec7ea90
          sha256sum package.json package-lock.json > xi-title-fixed/locks-before.txt
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import {execFileSync} from 'node:child_process';import {createHash} from 'node:crypto';
          const files=execFileSync('git',['ls-files','-z'],{encoding:'utf8'}).split('\0').filter(Boolean);
          const rows=files.map(file=>{const b=fs.readFileSync(file);return {file,bytes:b.length,sha256:createHash('sha256').update(b).digest('hex')};});
          fs.writeFileSync('xi-title-fixed/tracked-before.json',JSON.stringify(rows));
          NODE
          npm ci 2>&1 | tee xi-title-fixed/install.log
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const lock=JSON.parse(fs.readFileSync('package-lock.json'));
          const rows=Object.keys(lock.packages).filter(p=>p.startsWith('node_modules/')&&fs.existsSync(p+'/package.json')).map(p=>[p,JSON.parse(fs.readFileSync(p+'/package.json')).version]);
          assert.equal(rows.length,521);fs.writeFileSync('xi-title-fixed/installed-before.json',JSON.stringify(rows));
          NODE
      - name: Proper App types
        run: |
          set -euo pipefail
          node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee xi-title-fixed/types.log
      - name: Normal production build and retained bytes
        id: build
        run: |
          set -euo pipefail
          NODE_OPTIONS="--max-old-space-size=6144" npm run build 2>&1 | tee xi-title-fixed/build.log
          tar -czf xi-title-fixed/dist.tgz dist
          sha256sum xi-title-fixed/dist.tgz > xi-title-fixed/dist.sha256
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import {createHash} from 'node:crypto';import assert from 'node:assert/strict';
          const walk=dir=>fs.readdirSync(dir,{withFileTypes:true}).sort((a,b)=>a.name.localeCompare(b.name)).flatMap(e=>e.isDirectory()?walk(dir+'/'+e.name):e.isFile()?[dir+'/'+e.name]:[]);
          const rows=walk('dist').map(file=>{const b=fs.readFileSync(file);return {file,bytes:b.length,sha256:createHash('sha256').update(b).digest('hex')};});
          assert.equal(rows.length,850);fs.writeFileSync('xi-title-fixed/dist-before.json',JSON.stringify(rows));
          NODE
      - name: Isolated pinned Playwright and Chromium
        id: browser_setup
        timeout-minutes: 12
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/xi-title-browser" --no-save --package-lock=false playwright@1.64.1 2>&1 | tee xi-title-fixed/browser-install.log
          test ! -e node_modules/playwright
          ln -s "$RUNNER_TEMP/xi-title-browser/node_modules/playwright" node_modules/playwright
          node "$RUNNER_TEMP/xi-title-browser/node_modules/playwright/cli.js" install --with-deps chromium 2>&1 | tee xi-title-fixed/chromium-install.log
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const before=JSON.parse(fs.readFileSync('xi-title-fixed/installed-before.json'));
          const after=before.map(([p])=>[p,JSON.parse(fs.readFileSync(p+'/package.json')).version]);assert.deepEqual(after,before);
          const pw=JSON.parse(fs.readFileSync('node_modules/playwright/package.json'));assert.equal(pw.version,'1.64.1');
          fs.writeFileSync('xi-title-fixed/installed-after.json',JSON.stringify(after));fs.writeFileSync('xi-title-fixed/browser-package.json',JSON.stringify({version:pw.version,target:fs.realpathSync('node_modules/playwright')}));
          NODE
      - name: Native fixed title space and all preserves pass
        timeout-minutes: 12
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.browser_setup.outcome == 'success' }}
        run: |
          set -euo pipefail
          set +e
          XI_TITLE_BROWSER_ARM=fixed XI_TITLE_BROWSER_OUT=xi-title-fixed/browser NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/qa/playBuildXiTitleSpace.mjs > xi-title-fixed/browser.log 2>&1
          browser_code=$?
          set -e
          printf '%s\n' "$browser_code" > xi-title-fixed/browser.exit
          cat xi-title-fixed/browser.log
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import path from 'node:path';import assert from 'node:assert/strict';import {createHash} from 'node:crypto';
          const out='xi-title-fixed/browser',report=JSON.parse(fs.readFileSync(out+'/report.json')),log=fs.readFileSync('xi-title-fixed/browser.log','utf8');
          assert.equal(Number(fs.readFileSync('xi-title-fixed/browser.exit','utf8').trim()),0,'Actual fixed helper exit must be0');
          assert.equal(report.status,'passed');assert.equal(report.arm,'fixed');
          assert.deepEqual(report.businessFailures,[]);
          assert.deepEqual(report.journeys.map(j=>[j.width,j.status]),[[320,'passed'],[390,'passed'],[1280,'passed']]);
          assert.equal(report.screenshots.length,3);assert(report.sourceHeld&&report.distHeld);assert.deepEqual(report.sourceBefore,report.sourceAfter);assert.deepEqual(report.distBefore,report.distAfter);
          assert.equal(report.distBefore.length,850);assert(!report.error);
          assert(!/Unhandled Rejection|Uncaught Exception|Failed to resolve import|setup-or-preserve-failed/.test(log));
          const read=ref=>{const b=fs.readFileSync(path.join(out,ref.file));assert.equal(b.length,ref.bytes);assert.equal(createHash('sha256').update(b).digest('hex'),ref.sha256);return ref.file.endsWith('.json')?JSON.parse(b):null;};
          for(const j of report.journeys){
            assert(!j.error);assert.equal(j.errors.length,0);assert.equal(j.assetErrors.length,0);assert(j.requests.every(r=>r.outcome==='aborted'));
            assert(j.reservationResults.length>=2&&j.reservationResults.every(v=>v===false));assert.equal(j.spacePassed,false);
            assert(j.rerolls>=0&&j.rerolls<=29);assert.equal(j.longCapture.requiredForQualification,false);
            for(const ref of j.observations){const v=read(ref);assert.equal(v.reserved,false);assert(v.title.contentRight>v.button.rect.x);assert.equal(v.hint.text,'Matching '+v.club+' records from 2010');}
            for(const ref of [...j.frames,...j.actions])read(ref);
          }
          for(const shot of report.screenshots){read(shot);read(shot.frame);read(shot.observation);}
          const summary={status:'fixed-native-proof-passed',ownedFailures:report.businessFailures.map(f=>f.id),journeys:report.journeys.map(j=>({width:j.width,frames:j.frames.length,actions:j.actions.length,observations:j.observations.length,rerolls:j.rerolls,longCapture:j.longCapture})),screenshots:report.screenshots.length,sourceHeld:report.sourceHeld,distHeld:report.distHeld,limits:'Fixed native title-space proof only. Full output readers and caps remain pending; no warning, draft completion or backend-write credit.'};
          fs.writeFileSync('xi-title-fixed/admission.json',JSON.stringify(summary,null,2));console.log(JSON.stringify(summary));
          NODE
      - name: Final whole source locks installed versions dist and offline holds
        if: always()
        run: |
          set -euo pipefail
          mkdir -p xi-title-fixed
          git ls-files -s > xi-title-fixed/source-after.txt
          cmp xi-title-fixed/source-before.txt xi-title-fixed/source-after.txt
          git diff --exit-code HEAD -- .
          sha256sum package.json package-lock.json > xi-title-fixed/locks-after.txt
          cmp xi-title-fixed/locks-before.txt xi-title-fixed/locks-after.txt
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import {execFileSync} from 'node:child_process';import {createHash} from 'node:crypto';import assert from 'node:assert/strict';
          const hash=file=>{const b=fs.readFileSync(file);return {file,bytes:b.length,sha256:createHash('sha256').update(b).digest('hex')};};
          const files=execFileSync('git',['ls-files','-z'],{encoding:'utf8'}).split('\0').filter(Boolean),tracked=files.map(hash);
          fs.writeFileSync('xi-title-fixed/tracked-after.json',JSON.stringify(tracked));assert.deepEqual(tracked,JSON.parse(fs.readFileSync('xi-title-fixed/tracked-before.json')));
          const before=JSON.parse(fs.readFileSync('xi-title-fixed/installed-before.json')),lock=JSON.parse(fs.readFileSync('package-lock.json'));
          const after=Object.keys(lock.packages).filter(p=>p.startsWith('node_modules/')&&fs.existsSync(p+'/package.json')).map(p=>[p,JSON.parse(fs.readFileSync(p+'/package.json')).version]);
          assert.equal(after.length,521);assert.deepEqual(after,before);fs.writeFileSync('xi-title-fixed/installed-final.json',JSON.stringify(after));
          const walk=dir=>fs.readdirSync(dir,{withFileTypes:true}).sort((a,b)=>a.name.localeCompare(b.name)).flatMap(e=>e.isDirectory()?walk(dir+'/'+e.name):e.isFile()?[dir+'/'+e.name]:[]);
          if(fs.existsSync('xi-title-fixed/dist-before.json')){const rows=walk('dist').map(hash);fs.writeFileSync('xi-title-fixed/dist-after.json',JSON.stringify(rows));assert.deepEqual(rows,JSON.parse(fs.readFileSync('xi-title-fixed/dist-before.json')));}
          assert(fs.existsSync('xi-title-fixed/offline.log'));assert.equal(fs.statSync('xi-title-fixed/offline.log').size,0);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-xi-title-fixed-${{ github.run_id }}
          path: xi-title-fixed
          retention-days: 14
          if-no-files-found: error
