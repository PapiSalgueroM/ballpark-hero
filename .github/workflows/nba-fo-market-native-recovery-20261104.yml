  BUILD_ARTIFACT_BYTES: '12185997'
  BUILD_ARTIFACT_SHA256: 173db820905068bb8d9039bce88d8c73677566a5d5c005d8339705f32d3a8626
  BUILD_TAR_BYTES: '6978609'
