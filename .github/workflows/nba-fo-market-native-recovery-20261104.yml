jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Bind only the two helper hypotheses and recovery workflow
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/nba-fo-market-native-recovery"
          REF="$RUNNER_TEMP/nba-fo-market-native-recovery-reference"
          mkdir -p "$OUT/logs" "$OUT/transport" "$REF"
          echo "QA_OUT=$OUT" >> "$GITHUB_ENV"
          echo "QA_REF=$REF" >> "$GITHUB_ENV"
          export QA_OUT="$OUT" QA_REF="$REF"
          for key in RECOVERY_QA_CORE RECOVERY_QA_TREE ROOT_SOURCE_HEAD ROOT_SOURCE_TREE; do [[ "${!key}" =~ ^[a-f0-9]{40}$ ]]; done
          test "$(git rev-parse HEAD^)" = "$RECOVERY_QA_CORE"
          test "$(git rev-parse HEAD^^{tree})" = "$RECOVERY_QA_TREE"
          test "$(git diff --name-status HEAD^ HEAD)" = $'A\t.github/workflows/nba-fo-market-native-recovery-20261104.yml'
          mapfile -t refs < <(printf '%s\n' "$QUALIFIED_APPLICATION_CORE" "$JOINED_QA_CORE" "$BUILD_SOURCE" "$ROOT_SOURCE_HEAD" | sort -u)
          for ref in "${refs[@]}"; do git fetch --no-tags --depth=1 --filter=blob:none origin "$ref" >> "$OUT/logs/source-ref-fetch.log" 2>&1; done
          test "$(git rev-parse "$QUALIFIED_APPLICATION_CORE^{tree}")" = "$QUALIFIED_APPLICATION_TREE"
          test "$(git rev-parse "$JOINED_QA_CORE^{tree}")" = "$JOINED_QA_TREE"
          test "$(git rev-parse "$BUILD_SOURCE^{tree}")" = "$BUILD_TREE"
          test "$(git rev-parse "$ROOT_SOURCE_HEAD^{tree}")" = "$ROOT_SOURCE_TREE"
          test "$(git rev-parse "$BUILD_SOURCE:.github/workflows/nba-fo-market-build-20261104.yml")" = "$COMPILED_WORKFLOW_BLOB"
          test "$(git diff --name-status "$BUILD_SOURCE" "$RECOVERY_QA_CORE")" = $'M\tscripts/qa/nbaFoMarketBrowser.mjs\nM\tscripts/qa/nbaFoMarketScrollControl.mjs'
          protected=(src public index.html package.json package-lock.json bun.lock bun.lockb vite.config.ts tailwind.config.ts postcss.config.js components.json tsconfig.json tsconfig.app.json tsconfig.node.json)
          for ref in "$QUALIFIED_APPLICATION_CORE" "$JOINED_QA_CORE" "$BUILD_SOURCE" "$ROOT_SOURCE_HEAD"; do git diff --exit-code "$ref" HEAD -- "${protected[@]}" >> "$OUT/application-source-bridges.txt"; done
          git diff --exit-code "$BUILD_SOURCE" HEAD -- scripts ':(exclude)scripts/qa/nbaFoMarketBrowser.mjs' ':(exclude)scripts/qa/nbaFoMarketScrollControl.mjs' > "$OUT/held-script-source-bridge.txt"
          while read -r file pin; do test "$(git hash-object "$file")" = "$pin"; done <<'PINS'
          scripts/qa/nbaFoMarketFixtures.mjs 473594059a1941e20e1816b3f8605cc49cc171c0
          scripts/qa/nbaFoMarketBrowser.mjs 5e25d8b38eb5f42e01a82d22f249fe25fc5ad275
          scripts/qa/nbaFoMarketScrollControl.mjs 35abad4a8d54d2d691bf808e46f7d64a79418291
          scripts/qa/nbaFoMarketAssets.mjs 25abcbb80279d502f4360c3893b9445b07e29fc6
          scripts/qa/nativeScrollReady.mjs 671f460aa088d42b44c435a03594cf26695d6e09
          PINS
          git rev-parse HEAD HEAD^{tree} > "$OUT/source.txt"
          git ls-files -z | sort -z | xargs -0 sha256sum > "$OUT/source-before.sha256"
          git status --porcelain=v1 --untracked-files=all > "$OUT/status-before.txt"
          test ! -s "$OUT/status-before.txt"
          cp .github/workflows/nba-fo-market-native-recovery-20261104.yml "$OUT/workflow.yml"
          for script in nbaFoMarketBrowser nbaFoMarketScrollControl nbaFoMarketAssets nativeScrollReady; do node --check "scripts/qa/$script.mjs"; done
      - name: Acquire once the completed build from its honestly failed native-first run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for pair in "artifacts/$BUILD_ARTIFACT_ID artifact" "jobs/$BUILD_JOB job" "runs/$BUILD_RUN run"; do
            read -r endpoint file <<< "$pair"
            curl --fail --location --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/PapiSalgueroM/ballpark-hero/actions/$endpoint" --output "$QA_OUT/reference-$file.json"
          done
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';const e=process.env,out=e.QA_OUT,m=JSON.parse(fs.readFileSync(out+'/reference-artifact.json')),j=JSON.parse(fs.readFileSync(out+'/reference-job.json')),r=JSON.parse(fs.readFileSync(out+'/reference-run.json'));
          assert.equal(m.id,Number(e.BUILD_ARTIFACT_ID));assert.equal(m.name,e.BUILD_ARTIFACT_NAME);assert.equal(m.expired,false);assert.equal(m.size_in_bytes,Number(e.BUILD_ARTIFACT_BYTES));assert.equal(m.digest,'sha256:'+e.BUILD_ARTIFACT_SHA256);assert.equal(m.workflow_run.id,Number(e.BUILD_RUN));assert.equal(m.workflow_run.head_sha,e.BUILD_SOURCE);
          assert.equal(r.id,Number(e.BUILD_RUN));assert.equal(r.head_sha,e.BUILD_SOURCE);assert.equal(r.status,'completed');assert.equal(r.conclusion,'failure');assert.equal(r.run_attempt,1);assert.equal(r.path,'.github/workflows/nba-fo-market-build-20261104.yml');
          assert.equal(j.id,Number(e.BUILD_JOB));assert.equal(j.run_id,Number(e.BUILD_RUN));assert.equal(j.head_sha,e.BUILD_SOURCE);assert.equal(j.status,'completed');assert.equal(j.conclusion,'failure');
          const native='Source-held NBA3 native journeys on this completed build';assert.deepEqual(j.steps.filter(s=>s.conclusion==='failure').map(s=>s.name),[native]);
          for(const name of ['Proper joined application types','Existing save and home guards, normal build, twenty readers and all unchanged page caps','Retain full source holds and transport evidence','Bound retained focused evidence','Run actions/upload-artifact@v4'])assert(j.steps.some(s=>s.name===name&&s.status==='completed'&&s.conclusion==='success'),'Actual previously passed gate '+name);
          NODE
          curl --fail --location --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/PapiSalgueroM/ballpark-hero/actions/artifacts/$BUILD_ARTIFACT_ID/zip" --output "$QA_REF/reference-original.zip"
          test "$(stat -c%s "$QA_REF/reference-original.zip")" = "$BUILD_ARTIFACT_BYTES"
          echo "$BUILD_ARTIFACT_SHA256  $QA_REF/reference-original.zip" | sha256sum --check
          unzip -q "$QA_REF/reference-original.zip" -d "$QA_REF"
          test "$(stat -c%s "$QA_REF/completed-dist.tar.gz")" = "$BUILD_TAR_BYTES"
          echo "$BUILD_TAR_SHA256  $QA_REF/completed-dist.tar.gz" | sha256sum --check
          echo "$BUILD_SOURCE_INVENTORY_SHA256  $QA_REF/source-before.sha256" | sha256sum --check
          echo "$BUILD_DIST_INVENTORY_SHA256  $QA_REF/dist-before.sha256" | sha256sum --check
          echo "$BUILD_FIXTURE_INVENTORY_SHA256  $QA_REF/fixture-before.sha256" | sha256sum --check
          echo "$BUILD_FIXTURE_MANIFEST_SHA256  $QA_REF/nba-fixtures/manifest.json" | sha256sum --check
          echo "$ORIGINAL_NATIVE_REPORT_SHA256  $QA_REF/nba-native/report.json" | sha256sum --check
          cmp "$QA_REF/source-before.sha256" "$QA_REF/source-after.sha256"
          cmp "$QA_REF/dist-before.sha256" "$QA_REF/dist-after.sha256"
          test ! -s "$QA_REF/source-diff.txt"
          test ! -s "$QA_REF/status-before.txt"
          test ! -s "$QA_REF/status-after.txt"
          test "$(wc -l < "$QA_REF/source-before.sha256")" = 5729
          test "$(wc -l < "$QA_REF/dist-before.sha256")" = 848
          tar -tzf "$QA_REF/completed-dist.tar.gz" > "$QA_OUT/reference-dist-members.txt"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';for(const member of fs.readFileSync(process.env.QA_OUT+'/reference-dist-members.txt','utf8').trimEnd().split('\n'))assert(member==='dist/'||member.startsWith('dist/')&&!member.split('/').includes('..')&&!member.startsWith('/'));
          NODE
          tar -xzf "$QA_REF/completed-dist.tar.gz" -C "$QA_REF"
          (cd "$QA_REF" && sha256sum --check dist-before.sha256) > "$QA_OUT/reference-dist-held.log"
          cp "$QA_REF/dist-before.sha256" "$QA_OUT/reference-dist-before.sha256"
      - name: Preserve the original first stop and bridge only declared QA source metadata
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
