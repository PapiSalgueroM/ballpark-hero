          const sumMap=text=>Object.fromEntries(text.trimEnd().split('\n').map(line=>{const m=/^([a-f0-9]{64})  (.+)$/.exec(line);assert(m);return[m[2],m[1]];}));
          assert.deepEqual(fs.readFileSync(ref+'/source.txt','utf8').trimEnd().split('\n'),[e.BUILD_SOURCE,e.BUILD_TREE]);assert.equal(blob(fs.readFileSync(ref+'/workflow.yml')),e.COMPILED_WORKFLOW_BLOB);
