          cat > "$out/helpers/readers.cjs" <<'READERS'
          const fs=require('node:fs'),path=require('node:path'),a=require('node:assert/strict'),cp=require('node:child_process'),{createHash}=require('node:crypto'),out=process.env.PLACEMENT_OUT,root=path.join(out,'readers'),names=["simAdsense","simBrand","simHeadTags","simHiddenPages","simHubs","simIndexNow","simIndexing","simInternalLinks","simNoRivalNames","simPrerender","simPrerenderBoot","simRetiredRoutes","simSchema","simSitemap","simSnapshotAssets","simGuideHeadings","simSiteSearch"],closings={"simAdsense":"simAdsense: green.","simBrand":"simBrand: green.","simHeadTags":"simHeadTags: green.","simHiddenPages":"simHiddenPages: green.","simHubs":"simHubs: green.","simIndexNow":"simIndexNow: green.","simIndexing":"simIndexing: green.","simInternalLinks":"simInternalLinks: green.","simNoRivalNames":"No rival product names found. 0 findings.","simPrerender":"simPrerender: green.","simPrerenderBoot":"simPrerenderBoot: green.","simRetiredRoutes":"simRetiredRoutes: all green","simSchema":"simSchema: green.","simSitemap":"simSitemap: green.","simSnapshotAssets":"simSnapshotAssets: green.","simGuideHeadings":"simGuideHeadings: green.","simSiteSearch":"simSiteSearch: green."},rows=[];fs.mkdirSync(root);for(const key of ["RESULT_MOMENT_CONTROL","SIM_SEASON_VERDICT_CONTROL"])a.equal(process.env[key],undefined,"NORMAL_RESULT_READER_CONTROL_UNSET:"+key);
          for(const method of names){const dir=path.join(root,method);fs.mkdirSync(dir);const receipt=path.join(dir,'transport.jsonl');fs.writeFileSync(receipt,'',{flag:'wx'});const x=fs.openSync(path.join(dir,'stdout.log'),'w'),y=fs.openSync(path.join(dir,'stderr.log'),'w');let p;try{p=cp.spawnSync(process.execPath,['scripts/'+method+'.mjs'],{env:{...process.env,BASE:'http://127.0.0.1:4173',SWEEP_BASE:'http://127.0.0.1:4173',SIM_OFFLINE_RECEIPT:receipt},timeout:240000,stdio:['ignore',x,y]});}finally{fs.closeSync(x);fs.closeSync(y);}const processRecord={status:p.status,signal:p.signal,error:p.error?String(p.error):null};fs.writeFileSync(path.join(dir,'process.json'),JSON.stringify(processRecord,null,2)+'\n',{flag:'wx'});fs.writeFileSync(path.join(dir,'raw.exit'),String(p.status)+'\n',{flag:'wx'});const cli=(fs.readFileSync(path.join(dir,'stdout.log'),'utf8')+'\n'+fs.readFileSync(path.join(dir,'stderr.log'),'utf8')).replace(/\x1b\[[0-?]*[ -/]*[@-~]/g,''),closing=cli.split(/\r?\n/).filter(line=>line.startsWith(closings[method]));rows.push({method,...processRecord,closingCount:closing.length,closing:closing[0]??null,transportBytes:fs.statSync(receipt).size,scriptSHA256:createHash('sha256').update(fs.readFileSync('scripts/'+method+'.mjs')).digest('hex')});console.log(method+': raw '+p.status+', actual closing rows '+closing.length);}
          fs.writeFileSync(path.join(out,'actual-readers-processes.json'),JSON.stringify(rows,null,2)+'\n',{flag:'wx'});a.deepEqual(rows.map(v=>v.method),names);a.equal(rows.length,17);for(const r of rows){a.equal(r.status,0,'ACTUAL_READER_RAW_ZERO:'+r.method);a.equal(r.signal,null);a.equal(r.error,null);a.equal(r.closingCount,1,'ACTUAL_NORMAL_READER_CLOSING:'+r.method);a.equal(r.transportBytes,0);}fs.writeFileSync(path.join(out,'READERS-ADMISSION.json'),JSON.stringify({status:'ACTUAL_15_BUILT_READERS_GUIDE_AND_SEARCH_PASSED',source:process.env.GITHUB_SHA,savedReaders:15,totalReaderMethods:17,publicSnapshotsRegenerated:true,regeneratedRoutes:['/player-bingo'],methods:rows,fullHarnessSuiteClaim:false},null,2)+'\n',{flag:'wx'});console.log('BINGO_SNAPSHOT_READERS: all15 built readers plus guide and search completed with raw0, normal closings and empty transports.');
          READERS
          sha256sum "$out/helpers/readers.cjs" >> "$out/helpers.sha256";node --check "$out/helpers/readers.cjs"
          run readers 75m env -u GUIDE_HEADINGS_CONTROL -u SIM_SEARCH_CONTROL node "$out/helpers/readers.cjs"
          test "$(cat "$out/readers.exit")" -eq 0;test ! -s "$out/readers-server.transport"
      - name: Existing six effective guide controls and post-qualification dependencies
        run: |
          set -euo pipefail
          out="$BINGO_OUT";source "$out/helpers/run.sh"
          for pair in skiplevel:2 nokeyword:1 lostline:1 careerline:1 unconvert:3 snapdrift:4;do
            control="${pair%:*}";section="${pair#*:}"
            run "guide-$control" 3m env GUIDE_HEADINGS_CONTROL="$control" node scripts/simGuideHeadings.mjs
            test "$(cat "$out/guide-$control.exit")" -eq 1
            grep -Fqx "simGuideHeadings control $control: section $section red and every other section green, the break was caught where it should be (exit 1)" "$out/guide-$control.stdout"
          done
          sha256sum -c "$out/source.generated.sha256" > "$out/source.after-readers-held.log"
          for pair in "deps:node_modules" "tools:$BUZZER_TOOLS";do label="${pair%%:*}";dir="${pair#*:}";find "$dir" -type f -print0 | sort -z > "$out/$label.members";xargs -0 sha256sum < "$out/$label.members" > "$out/$label.sha256";done
          find node_modules -type l -printf '%p -> %l\n' | sort > "$out/dependency-links.before"
          printf '{"scope":"ONE_PLAYER_BINGO_SNAPSHOT_ONLY","source":"%s","parent":"%s","route":"/player-bingo","normalGuide":"REAL_RAW1_BEFORE_RAW0_AFTER","guideControls":6,"builtReaders":15,"normalGuideAndSearch":2,"searchRegenerations":2,"sourceScopeControls":6,"R1571Join":false,"defaultVitest":"UNRUN","globalSims":"UNRUN","weightCaps":"UNRUN","allRoutePrerender":"UNRUN","dependencyInventory":"POST_QUALIFICATION_ONLY","publication":false}\n' "$GITHUB_SHA" "$EXPECTED_PARENT" > "$out/SCOPE.json"
      - name: Always preserve exact source, generated outputs and evidence
        if: ${{ always() }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/bgs";mkdir -p "$out";failed=0
          git ls-files -z | sort -z > "$out/source-members.final";cmp "$out/source-members.initial" "$out/source-members.final" || failed=1
          sha256sum -c "$out/source-inputs.sha256" > "$out/source-inputs.final-held.log" 2>&1 || failed=1
          if test -f "$out/source.generated.sha256";then sha256sum -c "$out/source.generated.sha256" > "$out/source-generated.final-held.log" 2>&1 || failed=1;else printf 'GENERATED_SOURCE_NOT_QUALIFIED\n' > "$out/generated-not-created.txt";failed=1;fi
          git diff --name-status HEAD > "$out/actual-generated.paths";git diff --summary HEAD > "$out/mode-change.summary";test ! -s "$out/mode-change.summary" || failed=1
          git ls-files --others --exclude-standard -z | sort -z > "$out/untracked.final";cmp "$out/untracked.initial" "$out/untracked.final" || failed=1
          git for-each-ref --format='%(refname) %(objectname)' > "$out/refs.after";cmp "$out/refs.before" "$out/refs.after" || failed=1
          sha256sum -c "$out/helpers.sha256" > "$out/helpers.final-held.log" 2>&1 || failed=1
          for pair in "deps:node_modules" "tools:${BUZZER_TOOLS:-}" "fonts:${FREE_KICK_FONT_CACHE:-}" "dist:dist";do
            label="${pair%%:*}";dir="${pair#*:}"
            if test -f "$out/$label.sha256";then find "$dir" -type f -print0 | sort -z > "$out/$label.members.final";cmp "$out/$label.members" "$out/$label.members.final" || failed=1;sha256sum -c "$out/$label.sha256" > "$out/$label.final-held.log" 2>&1 || failed=1;else printf 'POST_PHASE_INVENTORY_MISSING\n' > "$out/$label.not-created";failed=1;fi
          done
          if test -f "$out/dependency-links.before";then find node_modules -type l -printf '%p -> %l\n' | sort > "$out/dependency-links.final";cmp "$out/dependency-links.before" "$out/dependency-links.final" || failed=1;else failed=1;fi
          if test -f "$out/python-packages.initial";then python -m pip freeze > "$out/python-packages.final";cmp "$out/python-packages.initial" "$out/python-packages.final" || failed=1;fi
          printf '%s\n' "$failed" > "$out/final-holds.exit"
          find "$out" -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/bgs-evidence.sha256";cp "$RUNNER_TEMP/bgs-evidence.sha256" "$out/evidence.sha256"
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: player-bingo-loan-snapshot-${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/bgs
          if-no-files-found: error
          retention-days: 14
