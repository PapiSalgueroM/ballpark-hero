name: Player Bingo loan FAQ saved page verification
on:
  push:
    branches: [codex/player-bingo-loan-snapshot-qualify-20261030]
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CI: 'true'
      SIM_NETWORK: offline
      GIT_OPTIONAL_LOCKS: '0'
      EXPECTED_MAIN: 28e7392f38f04a3af6da33e71ec5625ca1e2cd9f
      EXPECTED_PARENT: b3e62110ad7c83a4428924186e132c2a7f21bcd4
      EXPECTED_TREE: a8e559b2748380645bf60f0ff79a1585bce0cb28
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Bind immutable FAQ and search inputs, preserve original source
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/bgs";test ! -e "$out";mkdir -p "$out/helpers" "$out/original" "$out/runtime-tmp"
          echo "BINGO_OUT=$out" >> "$GITHUB_ENV";echo "BUZZER_OUT=$out" >> "$GITHUB_ENV";echo "PLACEMENT_OUT=$out" >> "$GITHUB_ENV"
          echo "TMPDIR=$out/runtime-tmp" >> "$GITHUB_ENV";echo "FREE_KICK_FONT_CACHE=$out/font-cache" >> "$GITHUB_ENV"
          test "$GITHUB_REF_NAME" = codex/player-bingo-loan-snapshot-qualify-20261030
          test "$(git rev-list --parents -n1 HEAD)" = "$GITHUB_SHA $EXPECTED_PARENT"
          test "$(git rev-list --parents -n1 "$EXPECTED_PARENT")" = "$EXPECTED_PARENT $EXPECTED_MAIN"
          test "$(git rev-parse "$EXPECTED_PARENT^{tree}")" = "$EXPECTED_TREE"
          test "$(git ls-files | wc -l)" -eq 5453
          git diff --name-status "$EXPECTED_MAIN" "$EXPECTED_PARENT" > "$out/product.paths"
          printf 'M\tsrc/data/gameContent/soccer1.ts\nM\tsrc/data/searchKeywords.json\n' > "$out/expected-product.paths";cmp "$out/product.paths" "$out/expected-product.paths"
          git diff --name-status "$EXPECTED_PARENT" HEAD > "$out/proof.paths"
          printf 'A\t.github/workflows/player-bingo-loan-snapshot-qualify.yml\n' > "$out/expected-proof.paths";cmp "$out/proof.paths" "$out/expected-proof.paths"
          test "$(git hash-object src/data/gameContent/soccer1.ts)" = 29790104f98538034167db0c528f3c01efd5f309
          test "$(git hash-object src/data/searchKeywords.json)" = 9190aedd474bcd745b9d3bb5a40c6d96d21869ab
          for pair in scripts/prerender.mjs:3d4fb1e595413c48c7bd65b927730d25cc3a2e18 scripts/genSitemap.mjs:08344dfc84be3ca24533c8d56e0f229b02b93c0a scripts/genSearchKeywords.mjs:d0a237a766215631a81d7cd6789f1fa632d3f9b7 scripts/simGuideHeadings.mjs:fa23f7e6ace62d8e71e3585ab6afbe4dbef0f674 scripts/simSiteSearch.mjs:6be8e1603e84e1a8799099e1558c415bc87a42a7;do test "$(git hash-object "${pair%:*}")" = "${pair##*:}";done
          git ls-files -z | sort -z > "$out/source-members.initial"
          xargs -0 sha256sum < "$out/source-members.initial" > "$out/source.initial.sha256"
          git ls-files -z | grep -z -v -x -F -e public/player-bingo/index.html -e public/sitemap.xml -e scripts/data/lastmod.json | sort -z | xargs -0 sha256sum > "$out/source-inputs.sha256"
          git ls-files --others --exclude-standard -z | sort -z > "$out/untracked.initial";test ! -s "$out/untracked.initial"
          git for-each-ref --format='%(refname) %(objectname)' > "$out/refs.before"
          git rev-parse HEAD > "$out/head.txt";git rev-parse 'HEAD^{tree}' > "$out/tree.txt"
          git archive --format=tar HEAD > "$out/source.tar"
          cp public/player-bingo/index.html "$out/original/player-bingo.html";cp public/sitemap.xml "$out/original/sitemap.xml";cp scripts/data/lastmod.json "$out/original/lastmod.json"
          tar -cf "$out/original-generated.tar" public/player-bingo/index.html public/sitemap.xml scripts/data/lastmod.json
          cat > "$out/helpers/run.sh" <<'RUN'
          run() {
            local id="$1" budget="$2"; shift 2
            local raw=0
            : > "$BUZZER_OUT/$id.transport"
            { printf '%q ' "$@"; printf '\n'; } > "$BUZZER_OUT/$id.command"
            NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$BUZZER_OUT/$id.transport" FORCE_COLOR=0 env -u NO_COLOR timeout --signal=TERM --kill-after=15s "$budget" "$@" > "$BUZZER_OUT/$id.stdout" 2> "$BUZZER_OUT/$id.stderr" || raw=$?
            printf '%s\n' "$raw" > "$BUZZER_OUT/$id.exit"
            test ! -s "$BUZZER_OUT/$id.transport"
          }
          RUN
          sha256sum "$out/helpers/run.sh" > "$out/helpers.sha256"
      - name: Locked dependencies, real app types and byte-identical search regeneration
        run: |
          set -euo pipefail
          out="$BINGO_OUT";raw=0
          env -u NODE_OPTIONS npm ci > "$out/npm-ci.stdout" 2> "$out/npm-ci.stderr" || raw=$?
          printf '%s\n' "$raw" > "$out/npm-ci.exit";test "$raw" -eq 0
          source "$out/helpers/run.sh"
          run types 3m node node_modules/typescript/bin/tsc --noEmit -p tsconfig.app.json
          test "$(cat "$out/types.exit")" -eq 0;test ! -s "$out/types.stdout";test ! -s "$out/types.stderr"
          for n in 1 2;do
            run "search-generation-$n" 2m node scripts/genSearchKeywords.mjs
            test "$(cat "$out/search-generation-$n.exit")" -eq 0
            grep -q '^searchKeywords.json:' "$out/search-generation-$n.stdout"
            sha256sum -c "$out/source.initial.sha256" > "$out/search-generation-$n.source-held.log"
          done
      - name: Isolated exact Playwright and real prepared fonts
        run: |
          set -euo pipefail
          out="$BINGO_OUT";tools="$RUNNER_TEMP/bgs-tools";test ! -e "$tools"
          env -u NODE_OPTIONS npm install --prefix "$tools" --no-save --package-lock=false playwright@1.64.0 > "$out/browser-install.log" 2>&1
          test ! -e node_modules/playwright;test ! -e node_modules/playwright-core
          ln -s "$tools/node_modules/playwright" node_modules/playwright;ln -s "$tools/node_modules/playwright-core" node_modules/playwright-core
          export PLAYWRIGHT_BROWSERS_PATH="$tools/browsers"
          echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV";echo "BUZZER_TOOLS=$tools" >> "$GITHUB_ENV";echo "PLACEMENT_TOOLS=$tools" >> "$GITHUB_ENV"
          executable=$(node -e 'const a=require("node:assert/strict");a.equal(require("playwright/package.json").version,"1.64.0");a.equal(require("playwright-core/package.json").version,"1.64.0");process.stdout.write(require("playwright").chromium.executablePath())')
          if test ! -f "$executable";then env -u NODE_OPTIONS node "$tools/node_modules/playwright/cli.js" install chromium > "$out/chromium-install.log" 2>&1;fi
          test -f "$executable";printf '%s\n' "$executable" > "$out/chromium.path"
          env -u NODE_OPTIONS node scripts/qa/freeKickLab1070.mjs --prefetch-fonts-only > "$out/font-prefetch.log" 2>&1
          sha=$(sha256sum "$FREE_KICK_FONT_CACHE/manifest.json" | cut -d' ' -f1);echo "FONT_CACHE_MANIFEST_SHA256=$sha" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Existing Brand-reader Python tools only
        run: |
          env -u NODE_OPTIONS python -m pip install fonttools pillow > "$BUZZER_OUT/python-install.log" 2>&1
          python -m pip freeze > "$BUZZER_OUT/python-packages.initial"
      - name: Initial build and actual normal stale-guide RED
        run: |
          set -euo pipefail
          out="$BINGO_OUT";source "$out/helpers/run.sh"
          unset PRERENDER_ONLY PRERENDER_CONTROL PRERENDER_SETTLE GUIDE_HEADINGS_CONTROL SIM_SEARCH_CONTROL
          run routes-only 2m node scripts/genSitemap.mjs --routes-only;test "$(cat "$out/routes-only.exit")" -eq 0
          run initial-build 5m npm run build -- --manifest;test "$(cat "$out/initial-build.exit")" -eq 0
          sha256sum -c "$out/source-inputs.sha256" > "$out/source.initial-build-held.log"
          run original-normal-guide 5m node scripts/simGuideHeadings.mjs
          test "$(cat "$out/original-normal-guide.exit")" -eq 1
          test "$(grep -c '^  FAIL:' "$out/original-normal-guide.stderr")" -eq 1
          grep -Fq '/player-bingo: the saved page' "$out/original-normal-guide.stderr"
          grep -Fq 'render at h3 "Do loans count on the club squares?"' "$out/original-normal-guide.stderr"
          grep -Ei '\(saved h3 ".*free.*"\)' "$out/original-normal-guide.stderr"
          grep -Fqx 'simGuideHeadings: RED, 1 failure in section 4' "$out/original-normal-guide.stderr"
      - name: Exact prepared-font prerender preload, one route, sitemap and final build
        run: |
          set -euo pipefail
          out="$BINGO_OUT";source "$out/helpers/run.sh"
          cat > "$out/prerender-fonts.canonical.cjs" <<'FONTS'
