          run prerender 15m env PRERENDER_ONLY=/player-bingo FONT_CACHE_USE_RECEIPT="$out/prerender-font-use.jsonl" NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs --require=$out/prerender-fonts.cjs" node scripts/prerender.mjs
