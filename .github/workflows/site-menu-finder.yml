          for transport in types old new classifier finder finder-classifier;do test -f "$out/$transport.transport" && test ! -s "$out/$transport.transport" || failed=1;done
          while IFS= read -r -d '' file;do test ! -s "$file" || failed=1;done < <(find "$out" -type f -name '*.transport' -print0)
          printf 'phase=menu-finder-functional-green-candidate\nsource=%s\ntypes=%s\nold=%s\nnew=%s\nclassifier=%s\nfinder=%s\nfinderClassifier=%s\nfinalHoldsExit=%s\n' "$GITHUB_SHA" '${{ steps.types.outcome }}' '${{ steps.old.outcome }}' '${{ steps.new.outcome }}' '${{ steps.classifier.outcome }}' '${{ steps.finder.outcome }}' '${{ steps.finder_classifier.outcome }}' "$failed" > "$out/stages.txt"
          printf '%s\n' "$failed" > "$out/final-holds.exit"
          (cd "$out";find . -type f ! -path ./evidence.sha256 -print0 | sort -z | xargs -0 sha256sum) > "$out/evidence.sha256"
