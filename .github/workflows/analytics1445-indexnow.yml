name: Index verified Analytics1445 Privacy page

on:
  push:
    branches: [codex/analytics1445-indexnow]

permissions:
  contents: read
  actions: read

jobs:
  index_privacy_page:
    if: github.ref == 'refs/heads/codex/analytics1445-indexnow'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SOURCE_SHA: 554a3b18641044ec5164bff9acab4d338237078c
      READBACK_RUN: '39691562482'
      READBACK_SHA: d03d471f05c7bf46a04484a2aa0d3288529b4a8a
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Require successful public readback and unchanged published source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir indexnow-evidence
          git fetch --no-tags --depth=1 origin "$SOURCE_SHA" > indexnow-evidence/published-source-fetch.log 2>&1
          git cat-file -e "$SOURCE_SHA^{commit}"
          gh api "repos/PapiSalgueroM/ballpark-hero/actions/runs/$READBACK_RUN" --jq '[.head_sha,.status,.conclusion,.name] | @tsv' > indexnow-evidence/public-readback.tsv
          expected="$(printf '%s\tcompleted\tsuccess\tAnalytics1445 public readback' "$READBACK_SHA")"
          test "$(cat indexnow-evidence/public-readback.tsv)" = "$expected"
          git diff --exit-code "$SOURCE_SHA" HEAD -- src public scripts supabase package.json package-lock.json > indexnow-evidence/source-hold.log
          git rev-parse HEAD > indexnow-evidence/head.txt
          sha256sum scripts/indexnowSubmit.mjs public/16211a5a50cff8f3434e5db883a21d8f.txt > indexnow-evidence/source-before.sha256
      - name: Submit only the verified Privacy page
        env:
          URLS: /privacy
        run: |
          set -euo pipefail
          status=0
          timeout --signal=TERM --kill-after=5s 2m node scripts/indexnowSubmit.mjs > indexnow-evidence/indexnow.log 2>&1 || status=$?
          printf '%s\n' "$status" > indexnow-evidence/indexnow.exit
          cat indexnow-evidence/indexnow.log
          test "$status" -eq 0
          sha256sum --check indexnow-evidence/source-before.sha256 > indexnow-evidence/source-after.log
      - name: Preserve complete submission evidence
        if: always()
        run: |
          set -euo pipefail
          if test -f indexnow-evidence/source-before.sha256; then sha256sum --check indexnow-evidence/source-before.sha256 > indexnow-evidence/source-final.log; fi
          (cd indexnow-evidence; find . -type f ! -name evidence.sha256 -print0 | sort -z | xargs -0 sha256sum) > indexnow-evidence/evidence.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analytics1445-indexnow-${{ github.run_id }}-${{ github.run_attempt }}
          path: indexnow-evidence/
          if-no-files-found: error
          retention-days: 14
