name: Community Shield exact old career oracle compatibility
on:
  push:
    branches: [codex/sc-community-shield-old-oracles-20261103]
permissions:
  contents: read
jobs:
  oracles:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: '1'
      SIM_NETWORK: offline
      BEFORE: ${{ github.event.before }}
    defaults:
      run:
        shell: bash
