          parent='c37f9b8462f229ca8ab03de8866a544f36b0537b'
          tree='c85a7dc9d4febc0e1673d6809528030013718059'
          test "$GITHUB_REF" = refs/heads/codex/sc-community-shield-old-oracles-20261103
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$BEFORE" = 0000000000000000000000000000000000000000
          test "$(git rev-parse HEAD^)" = "$parent"
          test "$(git rev-parse 'HEAD^^{tree}')" = "$tree"
