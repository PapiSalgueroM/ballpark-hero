            rows.push({id,rawExit:0,rawReportSha256:createHash('sha256').update(bytes).digest('hex'),neutralPairs:report.neutral.length,existingControls:report.controls.length,original:original[0],newFileException:extra[0]});
          }
          fs.writeFileSync(path.join(out,'summary.json'),JSON.stringify({schemaVersion:1,qualificationCompleted:true,actualOldOracleOwners:rows.length,owners:rows,helperControls:'helper-controls.json',currentEngineInverse:'results-layout-current-engine-inverse.json',resultsLayoutBrowser:'UNRUN; original browser assertions and layout BASE held',runtimeCounters:null,runtimeCounterCompleteness:'UNKNOWN'},null,2)+'\n');
          OWNERS
          CALLER
          printf '%s  %s\n' '9686e6745c1c77c966734e6d05f4dc027c9423352e4be8776dc1d801a763470b' "$META/REMOTE-CALLER.sh" | sha256sum --check > "$META/caller-pin.log"
          code=0; bash -n "$META/REMOTE-CALLER.sh" > "$META/caller-syntax.stdout" 2> "$META/caller-syntax.stderr" || code=$?
          printf '%s\n' "$code" > "$META/caller-syntax.exit"; test "$code" -eq 0
          code=0; bash "$META/REMOTE-CALLER.sh" > "$META/caller.stdout" 2> "$META/caller.stderr" || code=$?
          printf '%s\n' "$code" > "$META/caller.exit"
          tail -n 24 "$META/caller.stdout"; tail -n 24 "$META/caller.stderr"
          test "$code" -eq 0
      - name: Always retain exact source, dependencies and original evidence
        if: always()
        run: |
          set -euo pipefail
          status=0
          if test -f "$META/source.sha256"; then sha256sum --check "$META/source.sha256" > "$META/source-held.log" 2>&1 || status=1; fi
          if test -f "$META/dependency.sha256"; then sha256sum --check "$META/dependency.sha256" > "$META/dependency-held.log" 2>&1 || status=1; fi
          git ls-files -z > "$META/source-members.after"
          if test -f "$META/source-members.before"; then cmp "$META/source-members.before" "$META/source-members.after" > "$META/membership-held.log" 2>&1 || status=1; fi
          git diff --exit-code HEAD > "$META/source-diff.log" 2>&1 || status=1
          git ls-files --others --exclude-standard > "$META/untracked.txt"
          test ! -s "$META/untracked.txt" || status=1
          if test -d "$SC_SHIELD_ORACLE_OUT"; then cp -a "$SC_SHIELD_ORACLE_OUT" "$META/evidence" || status=1; fi
          printf '%s\n' "$status" > "$META/always-holds.exit"
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sc-shield-old-oracles-${{ github.run_id }}
          path: ${{ runner.temp }}/sc-shield-old-oracles/
          retention-days: 14
