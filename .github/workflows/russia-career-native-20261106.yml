          const expected=JSON.parse(e.NATIVE_ADDITIONS),delta=git('diff','--name-status','--no-renames','HEAD^','HEAD').split('\n').filter(Boolean).map(row=>row.split('\t'));
          assert(delta.every(row=>row.length===2&&row[0]==='A'));assert.deepEqual(delta.map(row=>row[1]).sort(),expected.slice().sort());
          assert.equal(git('hash-object','scripts/qa/russiaCareerNativeBrowser.mjs'),e.BROWSER_BLOB);assert.equal(git('hash-object','scripts/qa/nativeScrollReady.mjs'),e.READY_BLOB);
          const vector=object=>Object.fromEntries(git('ls-tree','-r','--full-tree',object).split('\n').filter(Boolean).map(line=>{const m=/^([0-7]{6}) (blob|commit) ([a-f0-9]{40})\t(.+)$/.exec(line);assert(m);return[m[4],{mode:m[1],type:m[2],sha:m[3]}];})),inverse=vector('HEAD'),product=vector(e.PRODUCT_CORE);for(const file of expected){assert.equal(product[file],undefined);assert.equal(inverse[file].mode,'100644');assert.equal(inverse[file].type,'blob');delete inverse[file];}assert.deepEqual(inverse,product,'RUSSIA_NATIVE_THREE_ADDITION_WHOLE_TREE_INVERSE');
          assert.equal(git('status','--porcelain=v1','--untracked-files=all'),'');
          fs.writeFileSync(e.QA_OUT+'/qa-delta.json',JSON.stringify({product:{commit:e.PRODUCT_CORE,tree:e.PRODUCT_TREE},qa:{commit:git('rev-parse','HEAD'),tree:git('rev-parse','HEAD^{tree}')},delta,wholeLeafVectorInverseExact:true,AppBuilds:0},null,2)+'\n',{flag:'wx'});
          fs.copyFileSync(expected[0],e.QA_OUT+'/workflow.yml');
          fs.writeFileSync(e.QA_OUT+'/workflow-source.json',JSON.stringify({path:expected[0],gitBlob:git('hash-object',expected[0]),helper:e.BROWSER_BLOB,scrollReady:e.READY_BLOB})+'\n',{flag:'wx'});
