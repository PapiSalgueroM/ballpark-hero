          set -euo pipefail
          common="$QA_OUT/input/scoped-common-auth.mjs"
          test ! -e "$common"
          cat > "$common" <<'SCOPED_AUTH'
          function admitScopedQualification(root,qualification,product){
           const fail='RUSSIA_SCOPED_MODEL_OUTCOME',receiptFail='RUSSIA_SCOPED_BASELINE_RECEIPT',decisionFail='RUSSIA_SCOPED_BASELINE_DECISION';
