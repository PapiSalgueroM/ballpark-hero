            {path:'scripts/lib/careerLeagueWorld1175.mjs',mode:'100644',before:'c75128e88071d329b2fe8d973af897fe2207dd91',after:'ebcbe1083dd105732418d417cd86dacbb674daf7'},
            {path:'scripts/lib/careerWorldTruth1329.mjs',mode:'100644',before:'8dc0dce77a13188eb939f78b0eb1850ba81a39f2',after:'e4601cf0e83b356cc61c43f9d6d9ecd51908f66c'}]};
           const specifications=[
            {name:redNames[0],sections:['4'],findings:4,decisions:['FULL_RUSSIA_SOURCE_INVERSE_EQUAL'],evidence:'paired-finish-admission.json',closing:'simCareerLeagueFinish: 4 failure(s) in section(s) 4'},
            {name:redNames[1],sections:['a'],findings:582,decisions:['FULL_ORDERED_BASELINE_LOOKUP_AND_FAILURES_EQUAL'],evidence:'paired-seasons-admission.json',closing:'simCareerLeagueSeasons: 582 failures (sections a)'},
