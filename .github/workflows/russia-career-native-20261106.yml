          printf 'QA_OUT=%s\nQA_REF=%s\nQA_DIST=%s\n' "$QA_OUT" "$QA_REF" "$QA_DIST" >> "$GITHUB_ENV"
          node --input-type=module <<'BIND'
          import fs from 'node:fs';import assert from 'node:assert/strict';import{execFileSync}from'node:child_process';
          const e=process.env,git=(...args)=>execFileSync('git',args,{encoding:'utf8'}).trim();
          for(const name of['PRODUCT_CORE','PRODUCT_TREE','BROWSER_BLOB','READY_BLOB','BRIDGE_BLOB'])assert.match(e[name],/^[a-f0-9]{40}$/,name);
