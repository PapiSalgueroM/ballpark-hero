name: Fantasy Draft roster readability QA

on:
  push:
    branches: [codex/fantasy-roster-qa-20261103]

permissions:
  contents: read

concurrency:
  group: fantasy-roster-qa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: '1'
      SIM_NETWORK: offline
      ENGINES: chromium
      PRERENDER_ONLY: /fantasy-draft
      SEO_SPLIT_BASE_REF: HEAD
      SWEEP_OFFLINE: '1'
      PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Hold the qualified parent and the two UI sources
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/fantasy-roster-qa"
          mkdir -p "$OUT/logs" "$OUT/transport" "$OUT/original" "$OUT/generated" "$OUT/units"
          echo "QA_OUT=$OUT" >> "$GITHUB_ENV"
          git fetch --no-tags --depth=1 origin f25cff64ecbba808af4fede1d3a8c876917ac6a1
          test "$(git rev-parse f25cff64ecbba808af4fede1d3a8c876917ac6a1^{tree})" = 9744f9859b9c8e501971f5285784d2117bd7abbe
          git rev-parse HEAD HEAD^{tree} > "$OUT/source.txt"
          git diff --name-status f25cff64ecbba808af4fede1d3a8c876917ac6a1 HEAD > "$OUT/candidate-paths.txt"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          const out = process.env.RUNNER_TEMP + '/fantasy-roster-qa';
          const base = 'f25cff64ecbba808af4fede1d3a8c876917ac6a1';
          const allowedCandidate = [
            '.github/workflows/fantasy-roster-qa-20261103.yml',
            'scripts/qa/fantasyDraftRosterBrowser20261103.mjs',
            'src/components/fantasy-draft/DraftRoster.tsx', 'src/pages/FantasyDraft.tsx',
          ].sort();
          const candidate = execFileSync('git', ['diff', '--name-only', base, 'HEAD'])
            .toString().trim().split('\n').filter(Boolean).sort();
          assert.deepEqual(candidate, allowedCandidate, 'Candidate changed more than two approved UI files and QA paths');
          const uiHashes = {
            'src/components/fantasy-draft/DraftRoster.tsx': 'e57dfd63d26d57cbdf6d1739337803dca6aea1363024c9b056abfb48efaa8fb0',
            'src/pages/FantasyDraft.tsx': '9cf0567d96c414f0afafa2ab8ac11172500e38ca112977725ebd77e9bb40f971',
            'scripts/qa/fantasyDraftRosterBrowser20261103.mjs': '72b269c1225c426e22e7ffe4389ea2bf12bc1716676bb60e6a362b4628e06aeb',
          };
          for (const [p, expected] of Object.entries(uiHashes)) {
            assert.equal(crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex'), expected, p);
          }
          fs.writeFileSync(out + '/source-association.json', JSON.stringify({
            parent: base, parentTree: '9744f9859b9c8e501971f5285784d2117bd7abbe', uiHashes,
            originalRosterBlob: 'e0d2adf2eceb302181a84cba7fe6b69a07748c58',
            originalPageBlob: '438a0d25e613fcf60629c885601cfc3b13cca6fa',
            productScope: 'Reviewed exact literal inverses: nine Roster class strings and one Page count markup span only. All game logic, data, tests, permanent simulation and budgets held from parent.',
            inheritedGameplay: { run: '41567721076', artifact: '13199779565', actualHealthyCases: 24,
              wholeOldControls: ['SC 12 pass and 1 owned failure', 'Fantasy 3 owned failures'] },
            priorAutomaticCI: 'Parent PR455 automatic historical-neutrality failures remain separate and unchanged. No full-suite green claim.',
          }, null, 2) + '\n');
          const generated = [
            'scripts/data/guideHeadingsFrozen.json', 'src/data/searchKeywords.json',
            'public/fantasy-draft/index.html', 'public/sitemap.xml', 'scripts/data/lastmod.json',
            'src/data/seoMetaParts/seoMetaPart18.ts',
          ];
          const tracked = execFileSync('git', ['ls-files', '-z']).toString().split('\0').filter(Boolean).sort();
          const hashes = Object.fromEntries(tracked.filter(p => !generated.includes(p))
            .map(p => [p, crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex')]));
          fs.writeFileSync(out + '/source-before.json', JSON.stringify(hashes, null, 2) + '\n');
          fs.writeFileSync(out + '/generated-paths.json', JSON.stringify(generated, null, 2) + '\n');
          for (const p of generated) {
            const dst = path.join(out, 'original', p);
            fs.mkdirSync(path.dirname(dst), { recursive: true });
            fs.copyFileSync(p, dst);
          }
          NODE
      - name: Install held application and isolated QA dependencies
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund 2>&1 | tee "$QA_OUT/logs/npm-ci.log"
          npm install --prefix "$RUNNER_TEMP/flagship-tools" --package-lock=false --no-audit --no-fund playwright@1.64.0 2>&1 | tee "$QA_OUT/logs/playwright-install.log"
          test ! -e node_modules/playwright
          test ! -e node_modules/playwright-core
          ln -s "$RUNNER_TEMP/flagship-tools/node_modules/playwright" node_modules/playwright
          ln -s "$RUNNER_TEMP/flagship-tools/node_modules/playwright-core" node_modules/playwright-core
          "$RUNNER_TEMP/flagship-tools/node_modules/.bin/playwright" install --with-deps chromium 2>&1 | tee "$QA_OUT/logs/chromium-install.log"
          python3 -m pip install --target "$RUNNER_TEMP/flagship-python" fonttools pillow 2>&1 | tee "$QA_OUT/logs/python-install.log"
          echo "PYTHONPATH=$RUNNER_TEMP/flagship-python" >> "$GITHUB_ENV"
          git diff --exit-code -- package.json package-lock.json
      - name: Type, eleven focused cases, normal generators, build, readers, budgets and actual App
        timeout-minutes: 32
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require $GITHUB_WORKSPACE/scripts/lib/offlineTransport.cjs"
          classify_receipt() {
            local name="$1" receipt="$2"
            local allowed='^\[SIM_OFFLINE_BLOCK\] external browser route continue https://fonts\.(googleapis|gstatic)\.com$'
            if [[ "$name" == sweep-weight ]]; then
              allowed="$allowed|^\[SIM_OFFLINE_BLOCK\] external browser route continue https://flagcdn\.com$"
            elif [[ "$name" != build ]]; then
              if [[ -s "$receipt" ]]; then cat "$receipt"; return 1; fi
              return 0
            fi
            local status=0
            grep -Ev "$allowed" "$receipt" || status=$?
            if [[ "$status" == 1 ]]; then return 0; fi
            return 1
          }
          run_gate() {
            local name="$1"
            shift
            local receipt="$QA_OUT/transport/$name.log"
            : > "$receipt"
            SIM_OFFLINE_RECEIPT="$receipt" "$@" 2>&1 | tee "$QA_OUT/logs/$name.log"
            if ! classify_receipt "$name" "$receipt"; then
              echo "Unexpected blocked transport in $name" >&2
              return 1
            fi
            # Every refusal is retained and counted, never credited as zero transport.
            if [[ -s "$receipt" ]]; then
              wc -l "$receipt" | tee "$QA_OUT/logs/$name-blocked-attempts.txt"
            fi
          }
          run_gate types node node_modules/typescript/bin/tsc --noEmit -p tsconfig.app.json
          run_gate units-core node node_modules/vitest/vitest.mjs run src/test/draftPoolFilters.test.tsx src/test/fantasyDraftFormation.test.tsx \
            --maxWorkers=1 --minWorkers=1 --reporter=default --reporter=json --outputFile="$QA_OUT/units/core.json"
          run_gate units-score node node_modules/vitest/vitest.mjs run src/test/scoreShown.test.tsx -t fantasy-draft \
            --maxWorkers=1 --minWorkers=1 --reporter=default --reporter=json --outputFile="$QA_OUT/units/score.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const admissions = [];
          for (const [name, expected, fileCount] of [['core', 10, 2], ['score', 1, 1]]) {
            const r = JSON.parse(fs.readFileSync(process.env.QA_OUT + '/units/' + name + '.json', 'utf8'));
            assert.equal(r.success, true); assert.equal(r.numFailedTests, 0); assert.equal(r.numPassedTests, expected);
            assert.equal(r.testResults.length, fileCount);
            const rows = r.testResults.flatMap(suite => {
              assert.equal(suite.status, 'passed');
              if (Object.hasOwn(suite, 'message')) assert.equal(suite.message, '');
              if (Object.hasOwn(suite, 'failureMessage')) assert.ok(!suite.failureMessage);
              return suite.assertionResults;
            });
            for (const row of rows) assert.deepEqual(row.failureMessages, []);
            const passed = rows.filter(row => row.status === 'passed'), unselected = rows.filter(row => row.status !== 'passed');
            assert.equal(passed.length, expected);
            if (name === 'core') {
              assert.equal(unselected.length, 0);
              const byFile = Object.fromEntries(r.testResults.map(suite => [suite.name.split('/').at(-1), suite.assertionResults.length]));
              assert.deepEqual(byFile, { 'draftPoolFilters.test.tsx': 7, 'fantasyDraftFormation.test.tsx': 3 });
            } else {
              assert.equal(passed[0].fullName, 'fantasy-draft fantasy-draft: the verdict card and the share carry the season score the draft records, and the share tells the result as it was');
              assert.equal(unselected.length, 15);
              assert.ok(unselected.every(row => ['pending', 'skipped'].includes(row.status)));
            }
            const counters = {};
            for (const key of ['numRuntimeErrorTestSuites', 'numPendingTests', 'numTodoTests', 'numFailedTestSuites']) {
              counters[key] = Object.hasOwn(r, key) ? r[key] : null;
              if (counters[key] !== null) assert.equal(counters[key], key === 'numPendingTests' ? unselected.length : 0, key);
            }
            admissions.push({ name, passed: expected, cases: passed.map(row => row.fullName), unselected: unselected.map(row => ({ title: row.fullName, status: row.status })), counters, absentCounterMeaning: 'UNKNOWN' });
          }
          assert.equal(new Set(admissions.flatMap(row => row.cases)).size, 11);
          fs.writeFileSync(process.env.QA_OUT + '/units/admission.json', JSON.stringify({ actualHealthyCases: 11, admissions, unselectedMeaning: 'Not executed or credited' }, null, 2) + '\n');
          NODE
          run_gate simFantasyDraftPool node scripts/simFantasyDraftPool.mjs
          run_gate guide-fantasy node scripts/simGuideHeadings.mjs --refresh /fantasy-draft
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const before = JSON.parse(fs.readFileSync(process.env.QA_OUT + '/original/scripts/data/guideHeadingsFrozen.json', 'utf8'));
          const after = JSON.parse(fs.readFileSync('scripts/data/guideHeadingsFrozen.json', 'utf8'));
          for (const route of ['/fantasy-draft']) {
            assert.ok(before.routes[route]);
            assert.ok(after.routes[route]);
            delete before.routes[route];
            delete after.routes[route];
          }
          assert.deepEqual(after, before, 'Guide refresh changed an unrelated route or fixture metadata');
          NODE
          run_gate keywords-first node scripts/genSearchKeywords.mjs
          cp src/data/searchKeywords.json "$QA_OUT/searchKeywords-first.json"
          run_gate keywords-second node scripts/genSearchKeywords.mjs
          cmp "$QA_OUT/searchKeywords-first.json" src/data/searchKeywords.json
          run_gate build npm run build:seo
          tar -czf "$QA_OUT/completed-dist.tar.gz" dist
          sha256sum "$QA_OUT/completed-dist.tar.gz" > "$QA_OUT/completed-dist.tar.gz.sha256"
          tar -tzf "$QA_OUT/completed-dist.tar.gz" > "$QA_OUT/completed-dist-members.txt"
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > "$QA_OUT/dist-before.sha256"
          export BASE=http://127.0.0.1:4173
          export SWEEP_BASE="$BASE"
          export SWEEP_OFFLINE=1
          export SIM_OFFLINE_RECEIPT="$QA_OUT/transport/server.log"
          : > "$SIM_OFFLINE_RECEIPT"
          node scripts/lib/hostLikeServer.mjs dist 4173 > "$QA_OUT/logs/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 40); do
            if curl --fail --silent "$BASE/" > /dev/null; then
              ready=1
              break
            fi
            kill -0 "$server_pid"
            sleep 1
          done
          test "$ready" = 1
          readers=(
            simAdsense simBrand simHeadTags simHiddenPages simHubs
            simIndexNow simIndexing simInternalLinks simNoRivalNames simPrerender
            simPrerenderBoot simRetiredRoutes simSchema simSitemap simSnapshotAssets
            simSiteSearch simGuideHeadings simHarnessAnchors
          )
          for reader in "${readers[@]}"; do
            run_gate "$reader" node "scripts/$reader.mjs"
          done
          run_gate simSeoTitles node scripts/simSeoTitles.mjs
          run_gate simSeoMetaSplit env SEO_SPLIT_ONLY=/fantasy-draft node scripts/simSeoMetaSplit.mjs
          run_gate sweep-weight node scripts/sweepWeight.mjs
          run_gate browser node scripts/qa/fantasyDraftRosterBrowser20261103.mjs
          sha256sum --check "$QA_OUT/dist-before.sha256" > "$QA_OUT/logs/dist-held.log"
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > "$QA_OUT/dist-after.sha256"
          cmp "$QA_OUT/dist-before.sha256" "$QA_OUT/dist-after.sha256"
          test ! -s "$QA_OUT/transport/server.log"
      - name: Retain generated bodies, actual diff and source holds
        if: always()
        run: |
          set -euo pipefail
          test -n "$QA_OUT"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          const out = process.env.QA_OUT;
          const before = JSON.parse(fs.readFileSync(out + '/source-before.json', 'utf8'));
          const generated = JSON.parse(fs.readFileSync(out + '/generated-paths.json', 'utf8'));
          const tracked = execFileSync('git', ['ls-files', '-z']).toString().split('\0').filter(Boolean).sort();
          const after = Object.fromEntries(tracked.filter(p => !generated.includes(p))
            .map(p => [p, crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex')]));
          fs.writeFileSync(out + '/source-after.json', JSON.stringify(after, null, 2) + '\n');
          for (const p of generated) {
            if (!fs.existsSync(p)) continue;
            const dst = path.join(out, 'generated', p);
            fs.mkdirSync(path.dirname(dst), { recursive: true });
            fs.copyFileSync(p, dst);
          }
          const changed = execFileSync('git', ['diff', '--name-only']).toString().trim().split('\n').filter(Boolean);
          fs.writeFileSync(out + '/actual-generated-paths.json', JSON.stringify(changed, null, 2) + '\n');
          fs.writeFileSync(out + '/generated.patch', execFileSync('git', ['diff', '--binary', '--', ...generated], { maxBuffer: 32 * 1024 * 1024 }));
          fs.writeFileSync(out + '/working-tree.txt', execFileSync('git', ['status', '--short'], { maxBuffer: 8 * 1024 * 1024 }));
          fs.writeFileSync(out + '/transport-inventory.json', JSON.stringify(fs.readdirSync(out + '/transport').sort().map(name => {
            const text = fs.readFileSync(path.join(out, 'transport', name), 'utf8');
            const lines = text.split('\n').filter(Boolean);
            return { name, blockedAttempts: lines.length,
              fontBlockedAttempts: lines.filter(line => /^\[SIM_OFFLINE_BLOCK\] external browser route continue https:\/\/fonts\.(googleapis|gstatic)\.com$/.test(line)).length,
              flagBlockedAttempts: lines.filter(line => line === '[SIM_OFFLINE_BLOCK] external browser route continue https://flagcdn.com').length,
              rawLogRetained: true };
          }), null, 2) + '\n');
          assert.deepEqual(after, before, 'Tracked source changed outside six generated paths');
          assert.ok(changed.every(p => generated.includes(p)), 'Unexpected tracked generated path');
          NODE
      - name: Bound the retained artifact
        id: artifact
        if: always()
        run: |
          set -euo pipefail
          test -d "$QA_OUT"
          test "$(du -sb "$QA_OUT" | cut -f1)" -lt 150000000
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.artifact.outputs.ready == 'true' }}
        with:
          name: fantasy-roster-qa-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fantasy-roster-qa
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
