name: Historical career prefix contrast
on:
  push:
    branches: [codex/sc-historical-prefixes-v8-evidence-20261103]
permissions:
  contents: read
jobs:
  contrast:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CI: '1'
      SIM_NETWORK: offline
      GIT_NO_LAZY_FETCH: '1'
      BEFORE: ${{ github.event.before }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - name: Bind exact clean source and four temporary QA additions
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/sc-historical-prefixes"
          test ! -e "$OUT"; mkdir "$OUT"
          printf 'OUT=%s\n' "$OUT" >> "$GITHUB_ENV"
          test "$GITHUB_REF" = refs/heads/codex/sc-historical-prefixes-v8-evidence-20261103
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$BEFORE" = 0000000000000000000000000000000000000000
          test "$(git rev-parse HEAD^)" = 7510fc3ed387187094f3e0f2337416c458e0e1a2
          test "$(git rev-parse 'HEAD^^{tree}')" = 7ca634f9ed3bf6531632389542b0ef5275022150
          git rev-parse --is-shallow-repository > "$OUT/checkout-history-mode.txt"
          git rev-parse HEAD 'HEAD^{tree}' > "$OUT/head-tree.txt"
          git diff --name-status HEAD^ HEAD > "$OUT/changed-paths.txt"
          cat > "$OUT/expected-paths.txt" <<'PATHS'
          A	.github/workflows/sc-historical-prefixes.yml
          A	scripts/data/soccerHistoricalPrefixFarewell.json
          A	scripts/data/soccerHistoricalPrefixInternationalReturn.json
          A	scripts/qa/probeSoccerHistoricalPrefixes.mjs
          PATHS
          cmp "$OUT/expected-paths.txt" "$OUT/changed-paths.txt"
          test "$(git ls-tree -r --name-only HEAD^ | wc -l)" -eq 5664
          test "$(git ls-files | wc -l)" -eq 5668
          cat > "$OUT/input-pins.txt" <<'PINS'
          src/lib/soccerCareerEngine.ts a65c8353d6e4660c1d6cec6471e17095eed35805
          src/lib/soccerCareerExtraCups.ts f96d2442942db57eb89d3d73d7dc18bba02ec165
          scripts/qa/probeSoccerHistoricalPrefixes.mjs 8098a660e8fbce348abe3690d3eb0a5e115be683
          scripts/data/soccerHistoricalPrefixFarewell.json a6b84354d77ce59e781faddcf0e56ba984419afd
          scripts/data/soccerHistoricalPrefixInternationalReturn.json c4d4744b0c95e0e9be559048face8c00b3c279cb
          scripts/data/careerLeagueWorldSaves1100.json 81425f731297f0ff72fc4e163dfe1a4cb86814ab
          package.json 2ff64986fb76ebc51b706f2fd24765768874008a
          package-lock.json 97d6f12a052f25f400462938c241789a083f0bfe
          tsconfig.app.json 51f581dd91641b4c1f1219f646788e73cf6bf00c
          scripts/lib/offlineTransport.cjs 0fda542a2649fe5da937c6976fd0f5b6073e74b6
          scripts/simHarnessAnchors.mjs 1cb32d353c317aacd32fd51f25f7ba000ac24e8d
          PINS
          while read -r file blob; do test "$(git rev-parse "HEAD:$file")" = "$blob"; done < "$OUT/input-pins.txt"
          cat > "$OUT/history-refs.txt" <<'REFS'
          7510fc3ed387187094f3e0f2337416c458e0e1a2
          cc9a55a2f35b6215d5e6e664cc401d10d7f76291
          4268ee47045badab8e4ceb863508c851f23beafa
          552ee88761731b9a341ae644f69ac3386e53c149
          9d73ce5f261d93b73bf0993469c4fb330afa202b
          934c29d949fceb8ed29e30f11cfd26d5e48bec57
          4778507d5612c3c871bc9ac99347fa8029375def
          642292de3e7487f723e41ed81fafe52f7bd17e17
          48cb9d4bbe8d8f4922113326d9db5d120dcb0b09
          REFS
          git ls-files -z > "$OUT/source-members.before"
          git ls-files -z | xargs -0 sha256sum > "$OUT/source.sha256"
          git ls-files --others --exclude-standard > "$OUT/untracked.before"
          test ! -s "$OUT/untracked.before"
          cat > "$OUT/capture.sh" <<'CAPTURE'
          capture() {
            local tag="$1"; shift
            test ! -e "$OUT/$tag.exit"
            printf '%s\0' "$@" > "$OUT/$tag.argv"
            : > "$OUT/$tag.transport"
            set +e
            SIM_OFFLINE_RECEIPT="$OUT/$tag.transport" "$@" > "$OUT/$tag.stdout" 2> "$OUT/$tag.stderr"
            local code=$?
            set -e
            printf '%s\n' "$code" > "$OUT/$tag.exit"
            tail -n 12 "$OUT/$tag.stdout"; tail -n 12 "$OUT/$tag.stderr"
            test ! -s "$OUT/$tag.transport" || return 1
            return "$code"
          }
          CAPTURE
      - name: Fetch only nine pinned history snapshots online and prove all blobs before offline collection
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf 'ONLINE_HISTORY_SNAPSHOTS\n' > "$OUT/history-fetch.mode"
          while read -r ref; do
            printf '%s\n' "$ref" | grep -Eq '^[a-f0-9]{40}$'
            if git cat-file -e "$ref^{commit}" 2> "$OUT/history-$ref.precheck"; then
              printf 'ALREADY_PRESENT\n' > "$OUT/history-$ref.mode"
            else
              printf 'ONLINE_EXPLICIT_DEPTH1\n' > "$OUT/history-$ref.mode"
              code=0
              SIM_NETWORK=online NODE_OPTIONS='' git -c protocol.version=2 fetch --no-tags --depth=1 origin "$ref" > "$OUT/history-$ref.stdout" 2> "$OUT/history-$ref.stderr" || code=$?
              printf '%s\n' "$code" > "$OUT/history-$ref.exit"
              test "$code" -eq 0
            fi
            test "$(git rev-parse "$ref^{commit}")" = "$ref"
          done < "$OUT/history-refs.txt"
          config_code=0
          git config --local --get-regexp '^(extensions\.partialclone|remote\..*\.(promisor|partialclonefilter))$' > "$OUT/promisor-settings.txt" || config_code=$?
          if test "$config_code" -ne 0; then test "$config_code" -eq 1; fi
          test ! -s "$OUT/promisor-settings.txt"
          test "$GIT_NO_LAZY_FETCH" = 1
          NODE_OPTIONS='' node --input-type=module > "$OUT/history-census.stdout" 2> "$OUT/history-census.stderr" <<'HISTORY'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const out=process.env.OUT,git=(args,input)=>execFileSync('git',args,{encoding:'utf8',input,maxBuffer:80*1024*1024,env:{...process.env,GIT_NO_LAZY_FETCH:'1'}});
          const expected=['7510fc3ed387187094f3e0f2337416c458e0e1a2','cc9a55a2f35b6215d5e6e664cc401d10d7f76291','4268ee47045badab8e4ceb863508c851f23beafa','552ee88761731b9a341ae644f69ac3386e53c149','9d73ce5f261d93b73bf0993469c4fb330afa202b','934c29d949fceb8ed29e30f11cfd26d5e48bec57','4778507d5612c3c871bc9ac99347fa8029375def','642292de3e7487f723e41ed81fafe52f7bd17e17','48cb9d4bbe8d8f4922113326d9db5d120dcb0b09'];
          const refs=fs.readFileSync(out+'/history-refs.txt','utf8').trim().split('\n');assert.deepEqual(refs,expected);
          const snapshots=[],blobs=new Set();
          for(const ref of refs){assert.equal(git(['rev-parse',ref+'^{commit}']).trim(),ref);const tree=git(['rev-parse',ref+'^{tree}']).trim();assert(/^[a-f0-9]{40}$/.test(tree));
            const entries=git(['ls-tree','-r','-z','--full-tree',ref]).split('\0').filter(Boolean).map(line=>{const match=line.match(/^([0-7]{6}) (blob|commit) ([a-f0-9]{40})\t(.+)$/);assert(match);if(match[2]==='blob')blobs.add(match[3]);return {mode:match[1],type:match[2],sha:match[3],path:match[4]};});
            assert(entries.length>0);snapshots.push({ref,tree,entries});
          }
          const names=[...blobs].sort(),raw=git(['cat-file','--batch-check=%(objectname) %(objecttype) %(objectsize)'],names.join('\n')+'\n').trimEnd().split('\n');assert.equal(raw.length,names.length);
          const objects=raw.map((line,index)=>{const match=line.match(/^([a-f0-9]{40}) blob ([0-9]+)$/);assert(match,'Every referenced snapshot blob exists locally without a lazy fetch');assert.equal(match[1],names[index]);return {sha:match[1],bytes:Number(match[2])};});
          for(const [short,full]of [['642292de',expected[7]],['48cb9d4b',expected[8]],['934c29d9',expected[5]]])assert.equal(git(['rev-parse',short+'^{commit}']).trim(),full);
          assert.equal(git(['rev-parse','HEAD']).trim(),process.env.GITHUB_SHA);
          fs.writeFileSync(out+'/history-object-census.json',JSON.stringify({mode:'Explicit online history setup then local immutable-object census',refs:snapshots,availableBlobs:objects,noPromisorConfig:true,noLazyFetch:true,noAncestryWalkRequired:true,timingClaim:false},null,2)+'\n');
          console.log('HISTORY_SNAPSHOTS: nine exact commits and all referenced blobs available locally.');
          HISTORY
          printf '0\n' > "$OUT/history-census.exit"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Locked online install separate from offline source proof
        id: install
        run: |
          set -euo pipefail
          code=0
          NODE_OPTIONS='' npm ci > "$OUT/install.stdout" 2> "$OUT/install.stderr" || code=$?
          printf '%s\n' "$code" > "$OUT/install.exit"
          test "$code" -eq 0
          find node_modules -path node_modules/.vite -prune -o -type f -print0 | sort -z > "$OUT/dependency-members.before"
          xargs -0 sha256sum < "$OUT/dependency-members.before" > "$OUT/dependency.sha256"
          test "$(tr -cd '\0' < "$OUT/dependency-members.before" | wc -c)" -eq 24466
          test "$(wc -c < "$OUT/dependency.sha256")" -eq 2921411
          printf '%s  %s\n' 0bb6d0967ebc301dbc5bc370d7c866fe844e22b80849e3e1761709ad51685c63 "$OUT/dependency.sha256" | sha256sum --check > "$OUT/dependency-manifest-pin.before"
          printf 'SC_HISTORICAL_PREFIX_DEPENDENCIES=%s\n' "$OUT/dependency.sha256" >> "$GITHUB_ENV"
      - name: Proper app types and producer syntax
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          source "$OUT/capture.sh"
          unset SC_EXTRA_CUPS_ENGINE US_BOARD_CONTROL_ALIAS US_BOARD_CONTROL_FILE NO_DOUBLE_SWAP
          capture types node_modules/.bin/tsc --noEmit -p tsconfig.app.json
          capture syntax node --check scripts/qa/probeSoccerHistoricalPrefixes.mjs
          cat > "$OUT/verify.mjs" <<'VERIFY'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          import { deserialize, serialize } from 'node:v8';
          import { isDeepStrictEqual } from 'node:util';
          import { gunzipSync } from 'node:zlib';
          const root=process.cwd(),out=process.env.OUT,dir=process.env.SC_HISTORICAL_PREFIX_OUT;
          const sha=x=>createHash('sha256').update(x).digest('hex');
          const pin=x=>({bytes:x.length,sha256:sha(x),gitBlob:createHash('sha1').update(Buffer.from('blob '+x.length+'\0')).update(x).digest('hex')});
          const read=(base,file)=>JSON.parse(fs.readFileSync(path.join(base,file),'utf8'));
          const samePin=(raw,want)=>{for(const key of ['bytes','sha256','gitBlob'])if(want[key]!==undefined)assert.equal(pin(raw)[key],want[key]);};
          const gitRead=(ref,file)=>execFileSync('git',['show',ref+':'+file],{maxBuffer:40*1024*1024});
          const source=fs.readFileSync('scripts/qa/probeSoccerHistoricalPrefixes.mjs','utf8');
          assert.equal(sha(Buffer.from(source)),'d5346b8713be2cdfa981d3d5b00f28012cc7038490ba89f0cf5b33b2066a3dc9');
          const match=source.match(/^const CONFIG = (.+);$/m);assert(match);
          const config=JSON.parse(match[1]);
          assert.equal(config.currentRef,'7510fc3ed387187094f3e0f2337416c458e0e1a2');
          assert.equal(config.preShieldRef,'cc9a55a2f35b6215d5e6e664cc401d10d7f76291');
          assert.equal(config.actualRef,'4268ee47045badab8e4ceb863508c851f23beafa');
          assert.equal(config.clock,1791658800000);assert.equal(config.agentClock,1791676800000);
          const expected=[
           {id:'farewell',pairs:49,prior:48,line:193,marker:'Entire original inactive career and random vector: neutral-nan-101-absent.json',advances:98,reads:0,requests:0,groups:0},
           {id:'international-return',pairs:73,prior:72,line:64,marker:'Entire original inactive state and exact draw vector',advances:146,reads:73,requests:0,groups:0},
           {id:'press-market',pairs:13,prior:12,line:22,marker:'No active Press retains entire original season and RNG',advances:26,reads:0,requests:0,groups:6},
           {id:'transfer-brief',pairs:13,prior:12,line:12,marker:'Absent brief keeps the full original season and every RNG draw',advances:26,reads:0,requests:72,groups:0}
          ];
          assert.deepEqual(config.owners.map(x=>x.id),expected.map(x=>x.id));
          const dependencyRaw=fs.readFileSync(process.env.SC_HISTORICAL_PREFIX_DEPENDENCIES);assert.equal(dependencyRaw.length,2921411);assert.equal(sha(dependencyRaw),'0bb6d0967ebc301dbc5bc370d7c866fe844e22b80849e3e1761709ad51685c63');const dependencies=new Map(dependencyRaw.toString('utf8').trimEnd().split('\n').map(line=>{const match=line.match(/^([a-f0-9]{64})  (node_modules\/.+)$/);assert(match);return [match[2],match[1]];}));assert.equal(dependencies.size,24466);
          const summary=read(dir,'summary.json');
          assert.equal(summary.schemaVersion,1);assert.equal(summary.collectionCompleted,true);assert.equal(summary.qualification,false);
          assert.equal(summary.isolated16ScopeSelected,false);assert.equal(summary.expectedOwnerProcesses,8);assert.equal(summary.expectedAdvanceCalls,592);
          assert.equal(summary.clock,config.clock);assert.equal(summary.currentGermanOrPr464Qualification,false);assert.equal(summary.adoption,false);
          assert.deepEqual(summary.primary,null);assert.deepEqual(summary.failures,[]);assert.deepEqual(summary.secondary,[]);
          assert.equal(summary.runtimeCounters,null);assert.equal(summary.runtimeCounterCompleteness,'UNKNOWN');assert.equal(summary.sourceHolds.allHeld,true);
          assert.equal(summary.children.length,8);assert.equal(summary.comparisons.length,4);
          assert.deepEqual(summary.children.map(x=>x.owner+'/'+x.pair),expected.flatMap(x=>[x.id+'/reproduce',x.id+'/pre-shield']));
          assert.deepEqual(read(dir,'source-before.json').files,execFileSync('git',['ls-files','-z']).toString().split('\0').filter(Boolean).sort());
          for(const row of read(dir,'source-before.json').rows)samePin(fs.readFileSync(row.path),row);
          function tape(draws){assert(Array.isArray(draws));let state=101;for(const draw of draws){state+=0x6D2B79F5;let value=state;value=Math.imul(value^value>>>15,value|1);value^=value+Math.imul(value^value>>>7,value|61);assert.equal(draw,((value^value>>>14)>>>0)/4294967296);}}
          function noUnexpectedRuntime(raw){assert.equal(/Unhandled (?:Errors?|Rejection|Exception)|\bunhandledRejection\b|\buncaughtException\b|ERR_MODULE_NOT_FOUND|Failed to load url|Cannot find (?:module|package)|SyntaxError:|ReferenceError:|TypeError:/i.test(raw),false);}
          function metadata(value,spec){assert.equal(value.owner,spec.id);assert.equal(value.clock,config.clock);assert.equal(value.sourceDerivedActualAdvanceCalls,spec.advances);assert.equal(value.sourceDerivedActualReadCalls,spec.reads);assert.equal(value.sourceDerivedActualRequestCalls,spec.requests);assert.equal(value.prefixPreparationGroups,spec.groups);}
          function apply(raw,map){
           samePin(raw,map.before);let text=raw.toString('utf8');assert.deepEqual(Buffer.from(text),raw);
           for(const stage of map.stages){assert.equal(sha(Buffer.from(text)),stage.beforeStageSha256);assert.equal(text.indexOf(stage.before),stage.offset);assert.equal(text.lastIndexOf(stage.before),stage.offset);text=text.slice(0,stage.offset)+stage.after+text.slice(stage.offset+stage.before.length);assert.equal(sha(Buffer.from(text)),stage.afterStageSha256);}
           samePin(Buffer.from(text),map.after);const final=text;
           for(const stage of [...map.stages].reverse()){assert.equal(text.slice(stage.offset,stage.offset+stage.after.length),stage.after);text=text.slice(0,stage.offset)+stage.before+text.slice(stage.offset+stage.after.length);}
           assert.deepEqual(Buffer.from(text),raw);return final;
          }
