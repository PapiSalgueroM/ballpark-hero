            assert.equal(template.replace(binding.token,binding.filename),physicalOwner.toString('utf8'));assert.equal(kitTemplate,physicalKit.toString('utf8'));samePin(Buffer.from(template),binding.ownerTemplate);samePin(physicalOwner,binding.ownerPhysical);assert.equal(binding.wholeInverse,true);
            assert.deepEqual(copies.owner,declared.ownerMap);assert.deepEqual(copies.kit,declared.kitMap);assert.equal(copies.originalsWritten,false);
