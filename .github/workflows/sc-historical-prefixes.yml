          source "$OUT/capture.sh"
          capture prefixes node scripts/qa/probeSoccerHistoricalPrefixes.mjs
      - name: Independently admit raw owner processes targets source graphs and scope
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          source "$OUT/capture.sh"
          printf '%s  %s\n' 26eaa7121f185c7381b7fd27a79a5178762c8454752de7845b609a14f66455bd "$OUT/verify.mjs" | sha256sum --check > "$OUT/raw-verifier-pin.log"
          capture verify node "$OUT/verify.mjs"
      - name: Existing source anchor fence
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          source "$OUT/capture.sh"
          unset ANCHOR_CONTROL
          capture anchor-fence node scripts/simHarnessAnchors.mjs
      - name: Actual stripped-normalizer negative and exact owner classification
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          source "$OUT/capture.sh"
          capture anchor-strip env ANCHOR_CONTROL=strip node scripts/simHarnessAnchors.mjs
          cat > "$OUT/verify-anchors.mjs" <<'ANCHORS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const out=process.env.OUT;
          const records=[];
          for(const name of ['anchor-fence','anchor-strip']){
            assert.equal(Number(fs.readFileSync(out+'/'+name+'.exit','utf8')),0);
            assert.equal(fs.statSync(out+'/'+name+'.transport').size,0);
            const stdout=fs.readFileSync(out+'/'+name+'.stdout','utf8'),stderr=fs.readFileSync(out+'/'+name+'.stderr','utf8');
            const raw=stdout+'\n'+stderr;
            assert.equal(/Unhandled (?:Errors?|Rejection|Exception)|unhandledRejection|uncaughtException|ERR_MODULE_NOT_FOUND|SyntaxError:|ReferenceError:|TypeError:/i.test(raw),false);
            const failures=raw.split(/\r?\n/).map(line=>line.trim()).filter(line=>line.startsWith('FAIL '));
            if(name==='anchor-fence'){
              assert.deepEqual(failures,[]);
              assert.equal(stdout.split(/\r?\n/).filter(line=>line==='simHarnessAnchors: green. Every harness parses and none carries an unmatchable anchor.').length,1);
            }else{
              assert.equal(failures.length,1);
              assert(failures[0].startsWith('FAIL simFightCareer.mjs reads '));
              assert(stdout.includes('[control strip applied to a copy of simFightCareer.mjs]'));
              assert.equal(stdout.split(/\r?\n/).filter(line=>line==='control "strip": the planted fault in simFightCareer.mjs was named and nothing else was, the check works').length,1);
            }
            records.push({name,failures,runtimeCounters:null,runtimeCounterCompleteness:'UNKNOWN'});
          }
          fs.writeFileSync(out+'/anchor-summary.json',JSON.stringify({healthy:true,actualStripNegative:true,records},null,2)+'\n');
