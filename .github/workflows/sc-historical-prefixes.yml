        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          export SC_HISTORICAL_PREFIX_OUT="$PWD/tmp/sc-historical-prefixes-$GITHUB_RUN_ID"
