          base64 --decode "$out/screen.payload.gz.b64" | gzip -dc > "$out/TransferScreen.candidate.tsx"
          printf 'c888c5980a2327eb8c3131980eb45cf681f97880928d61b6fc4a6e1bf21643ec  %s\n2251f12fcd9434c57d0436582da29b9be56d8912896665310377b22099ed0a1e  %s\n4d484c39eed2fa8568091b728808142db4eee54e355f306de10de7eec0cf39f3  %s\n' "$out/cm-original-discovery-qualification.cjs" "$out/clubManagerEras.candidate.ts" "$out/TransferScreen.candidate.tsx" > "$out/generated.sha256"
