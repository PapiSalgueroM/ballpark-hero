name: Report feedback portal functional and styled browser proof
on:
  push:
    branches: [codex/report-feedback-portals-browser-20261024]
    paths-ignore: ['docs/**']
permissions:
  contents: read
concurrency:
  group: report-feedback-portals-browser-${{ github.sha }}
  cancel-in-progress: false
env:
  BASE_SOURCE: 271b36174e7c08edac94371bc56b6f99ec2fa4b7
  EXPECTED_PARENT: 8a49388ae04e1ca0ed0742ef436fe1504501b8b7
  CI: '1'
  SIM_NETWORK: offline
  TZ: UTC
jobs:
  report_functional_green:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Fresh outside-checkout raw evidence
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/report-form-lazy-green";test ! -e "$base";mkdir -m 700 "$base"
          out="$base/evidence";mkdir -m 700 "$out"
          export REPORT_GREEN_OUT="$out";echo "REPORT_GREEN_OUT=$out" >> "$GITHUB_ENV"
          printf '%s\n' "$GITHUB_SHA" > "$out/head.txt"
          printf '%s\n' "$GITHUB_RUN_ID" > "$out/run-id.txt"
          printf '%s\n' "$GITHUB_RUN_ATTEMPT" > "$out/run-attempt.txt"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - name: Exact one workflow repair with all current parent production and QA held
        id: source
        timeout-minutes: 3
        run: |
          set -euo pipefail
          out="$REPORT_GREEN_OUT"
          test "$GITHUB_REPOSITORY" = PapiSalgueroM/ballpark-hero
          test "$GITHUB_REPOSITORY_ID" = 1195729679
          test "$GITHUB_REF" = refs/heads/codex/report-feedback-portals-browser-20261024
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git show -s --format=%P HEAD)" = "$EXPECTED_PARENT"
          test "$(git rev-parse "$EXPECTED_PARENT^{tree}")" = 2204db9682e6445de7e5b5f9af7c071c95d47587
          test "$(git rev-parse "$BASE_SOURCE^{tree}")" = 7782ca8adf1240686d61d23158f2c00eae818633
          git diff --name-status "$EXPECTED_PARENT" HEAD > "$out/direct-paths.txt"
          printf 'M\t.github/workflows/report-feedback-portals-browser.yml\n' | cmp - "$out/direct-paths.txt"
          git diff --exit-code "$EXPECTED_PARENT" HEAD -- . ':!.github/workflows/report-feedback-portals-browser.yml' > "$out/all-parent-source-held.log"
          git diff --name-status "$BASE_SOURCE" HEAD > "$out/cumulative-paths.txt"
          printf 'A\t.github/workflows/report-feedback-portals-browser.yml\nA\tscripts/qa/playReportQuestionActivationPortal.mjs\nA\tscripts/qa/playReportSiteIssueActivationPortal.mjs\n' | cmp - "$out/cumulative-paths.txt"
          git diff --exit-code "$BASE_SOURCE" HEAD -- . ':!.github/workflows/report-feedback-portals-browser.yml' ':!scripts/qa/playReportQuestionActivationPortal.mjs' ':!scripts/qa/playReportSiteIssueActivationPortal.mjs' > "$out/all-old-source-held.log"
          git rev-parse HEAD^{tree} > "$out/tree.txt"
          git ls-files -z | sort -z > "$out/source-members.before"
          test "$(tr -cd '\000' < "$out/source-members.before" | wc -c)" -eq 5352
          xargs -0 sha256sum < "$out/source-members.before" > "$out/source-before.sha256"
          git status --porcelain --untracked-files=all > "$out/status-before.txt";test ! -s "$out/status-before.txt"
          for name in NODE_OPTIONS NO_DOUBLE_SWAP US_BOARD_CONTROL_ALIAS US_BOARD_CONTROL_FILE TYCOON_AWAY_CONTROL COMPLETION_HOOK OWNED_TIMEOUTS_HOOK CONQUEST_NBA_HOOK CONQUEST_NBA_BOARD POLL_FIXTURES DAILY_RECORD_CONTROL TYCOON_ROOMS_PAGE TYCOON_LOADS_STADIUM_HOOK TYCOON_LOADS_ACADEMY_HOOK TYCOON_LOADS_STADIUM_LIB TYCOON_LOADS_ACADEMY_LIB TYCOON_PITCH_COMPONENT TYCOON_PACKS_REWARDS TYCOON_PACKS_PANEL SIM_REPORT_CONTROL REPORT_RELAY_CONTROL REPORT_DRAFT_MODE REPORT_DRAFT_OUT ONLY BROWSER;do
            if printenv "$name" > /dev/null;then printf '%s\n' "Inherited application override refused: $name" >&2;exit 1;fi
          done
          base64 --decode > "$out/inspector.cjs" <<'INSPECTOR_BYTES'
