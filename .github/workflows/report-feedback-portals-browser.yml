      - name: Twelve actual legacy fixed Report contexts with only local delivery interception
        id: report_legacy
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.report_browser_source.outcome == 'success' }}
        timeout-minutes: 22
        run: |
          set -euo pipefail
          out="$CHROME_BROWSER_OUT";failed=0
          : > "$out/report-legacy-server.transport";: > "$out/report-legacy.transport";: > "$out/report-legacy-classifier.transport"
          sha256sum -c "$out/report-browser-inspector.sha256" > "$out/report-inspector-before-legacy.log"
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$out/report-legacy-server.transport" node scripts/lib/hostLikeServer.mjs dist 4173 > "$out/report-legacy-server.log" 2>&1 &
          server=$!
          stop_report_server(){ server_status=0;kill "$server" 2>/dev/null || true;wait "$server" || server_status=$?;printf '%s\n' "$server_status" > "$out/report-legacy-server.exit"; }
          trap stop_report_server EXIT
          ready=0;for attempt in 1 2 3 4 5 6 7 8;do if curl --fail --silent http://127.0.0.1:4173/ > /dev/null;then ready=1;break;fi;sleep 1;done;test "$ready" -eq 1
          test ! -e "$out/report-legacy";status=0
          CI=true NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$out/report-legacy.transport" REPORT_DRAFT_MODE=fixed REPORT_DRAFT_OUT="$out/report-legacy" timeout --signal=TERM --kill-after=15s 20m node scripts/qa/playReportDraftLifecycle.mjs > "$out/report-legacy.log" 2>&1 || status=$?
          printf '%s\n' "$status" > "$out/report-legacy.exit";test "$status" -eq 0 || failed=1
          status=0
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$out/report-legacy-classifier.transport" timeout --signal=TERM --kill-after=15s 90s node "$out/report-browser-inspector.cjs" legacy > "$out/report-legacy-classifier.stdout.log" 2> "$out/report-legacy-classifier.stderr.log" || status=$?
          printf '%s\n' "$status" > "$out/report-legacy-classifier.exit";test "$status" -eq 0 || failed=1
          stop_report_server;trap - EXIT
          for name in report-legacy-server report-legacy report-legacy-classifier;do test -f "$out/$name.transport" && test ! -s "$out/$name.transport" || failed=1;done
          sha256sum -c "$out/report-browser-inspector.sha256" > "$out/report-inspector-after-legacy.log" || failed=1
          exit "$failed"
      - name: Actual Footer no-send activation in eight contexts with forty original PNGs and fourteen record controls plus six initial viewport controls
        id: report_activation
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.report_browser_source.outcome == 'success' }}
        timeout-minutes: 14
        run: |
          set -euo pipefail
          out="$CHROME_BROWSER_OUT";failed=0
          : > "$out/report-activation-server.transport";: > "$out/report-activation.transport";: > "$out/report-activation-classifier.transport"
          sha256sum -c "$out/report-browser-inspector.sha256" > "$out/report-inspector-before-activation.log"
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$out/report-activation-server.transport" node scripts/lib/hostLikeServer.mjs dist 4173 > "$out/report-activation-server.log" 2>&1 &
          server=$!
          stop_report_server(){ server_status=0;kill "$server" 2>/dev/null || true;wait "$server" || server_status=$?;printf '%s\n' "$server_status" > "$out/report-activation-server.exit"; }
          trap stop_report_server EXIT
          ready=0;for attempt in 1 2 3 4 5 6 7 8;do if curl --fail --silent http://127.0.0.1:4173/ > /dev/null;then ready=1;break;fi;sleep 1;done;test "$ready" -eq 1
          test ! -e "$out/report-activation";status=0
          CI=true NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs --require=$PWD/scripts/qa/sharedChromePreload.cjs" REPORT_FORM_OUT="$out/report-activation" CHROME_RECIPE_OUT="$out/report-activation" REPORT_FORM_SITE_DIST="$PWD/dist" REPORT_FORM_BINDING_FILE="$out/report-activation.binding.json" SIM_OFFLINE_RECEIPT="$out/report-activation.transport" timeout --signal=TERM --kill-after=15s 12m node scripts/qa/playReportSiteIssueActivationPortal.mjs > "$out/report-activation.log" 2>&1 || status=$?
          printf '%s\n' "$status" > "$out/report-activation.exit";test "$status" -eq 0 || failed=1
          status=0
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$out/report-activation-classifier.transport" timeout --signal=TERM --kill-after=15s 90s node "$out/report-browser-inspector.cjs" activation > "$out/report-activation-classifier.stdout.log" 2> "$out/report-activation-classifier.stderr.log" || status=$?
          printf '%s\n' "$status" > "$out/report-activation-classifier.exit";test "$status" -eq 0 || failed=1
          stop_report_server;trap - EXIT
          for name in report-activation-server report-activation report-activation-classifier;do test -f "$out/$name.transport" && test ! -s "$out/$name.transport" || failed=1;done
          sha256sum -c "$out/report-browser-inspector.sha256" > "$out/report-inspector-after-activation.log" || failed=1
          exit "$failed"

      - name: Actual Question no-send activation plus two phone coexistence journeys and strict actual-record controls
        id: question_activation
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.report_browser_source.outcome == 'success' }}
        timeout-minutes: 16
        run: |
          set -euo pipefail
          out="$CHROME_BROWSER_OUT";failed=0
          : > "$out/question-activation-server.transport";: > "$out/question-activation.transport";: > "$out/question-activation-classifier.transport"
          sha256sum -c "$out/report-browser-inspector.sha256" > "$out/report-inspector-before-question-activation.log"
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$out/question-activation-server.transport" node scripts/lib/hostLikeServer.mjs dist 4173 > "$out/question-activation-server.log" 2>&1 &
          server=$!
          stop_report_server(){ server_status=0;kill "$server" 2>/dev/null || true;wait "$server" || server_status=$?;printf '%s\n' "$server_status" > "$out/question-activation-server.exit"; }
          trap stop_report_server EXIT
          ready=0;for attempt in 1 2 3 4 5 6 7 8;do if curl --fail --silent http://127.0.0.1:4173/ > /dev/null;then ready=1;break;fi;sleep 1;done;test "$ready" -eq 1
          test ! -e "$out/question-activation";status=0
          CI=true NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs --require=$PWD/scripts/qa/sharedChromePreload.cjs" QUESTION_FORM_OUT="$out/question-activation" CHROME_RECIPE_OUT="$out/question-activation" QUESTION_FORM_SITE_DIST="$PWD/dist" QUESTION_FORM_BINDING_FILE="$out/question-activation.binding.json" SIM_OFFLINE_RECEIPT="$out/question-activation.transport" timeout --signal=TERM --kill-after=15s 14m node scripts/qa/playReportQuestionActivationPortal.mjs > "$out/question-activation.log" 2>&1 || status=$?
          printf '%s\n' "$status" > "$out/question-activation.exit";test "$status" -eq 0 || failed=1
          status=0
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$out/question-activation-classifier.transport" timeout --signal=TERM --kill-after=15s 90s node "$out/report-browser-inspector.cjs" question > "$out/question-activation-classifier.stdout.log" 2> "$out/question-activation-classifier.stderr.log" || status=$?
          printf '%s\n' "$status" > "$out/question-activation-classifier.exit";test "$status" -eq 0 || failed=1
          stop_report_server;trap - EXIT
          for name in question-activation-server question-activation question-activation-classifier;do test -f "$out/$name.transport" && test ! -L "$out/$name.transport" && test ! -s "$out/$name.transport" || failed=1;done
          sha256sum -c "$out/report-browser-inspector.sha256" > "$out/report-inspector-after-question-activation.log" || failed=1
          exit "$failed"

      - name: Always retain fresh complete physical end inventories and all raw evidence
        id: holds
        if: always()
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/site-menu-shared-browser";mkdir -p "$out";failed=0
          git ls-files -z | sort -z > "$out/source-members.after" || failed=1
          git ls-files -z | sort -z | xargs -0 sha256sum > "$out/source-after.sha256" || failed=1
          for manifest in source-before dependencies browser-tools font-cache;do
            if test -f "$out/$manifest.sha256";then sha256sum --check "$out/$manifest.sha256" > "$out/final-$manifest-hold.log" 2>&1 || failed=1;else failed=1;fi
          done
          if test -f "$out/source-members.before";then cmp "$out/source-members.before" "$out/source-members.after" || failed=1;else failed=1;fi
          if test -f "$out/source-before.sha256";then cmp "$out/source-before.sha256" "$out/source-after.sha256" || failed=1;else failed=1;fi
          if test -d node_modules;then
            find node_modules -path node_modules/.vite -prune -o -type f -print0 | sort -z > "$out/dependency-members.after" || failed=1
            find node_modules -path node_modules/.vite -prune -o -type f -print0 | sort -z | xargs -0 sha256sum > "$out/dependencies-end.sha256" || failed=1
          else failed=1;fi
          if test -d "$RUNNER_TEMP/site-menu-shared-browser-tools/node_modules";then
            find "$RUNNER_TEMP/site-menu-shared-browser-tools/node_modules" -type f -print0 | sort -z > "$out/browser-members.after" || failed=1
            find "$RUNNER_TEMP/site-menu-shared-browser-tools/node_modules" -type f -print0 | sort -z | xargs -0 sha256sum > "$out/browser-tools-end.sha256" || failed=1
          else failed=1;fi
          if test -d "$out/font-cache";then
            find "$out/font-cache" -type f -print0 | sort -z > "$out/font-members.after" || failed=1
            find "$out/font-cache" -type f -print0 | sort -z | xargs -0 sha256sum > "$out/font-cache-end.sha256" || failed=1
          else failed=1;fi
          for name in dependency browser font;do
            if test -f "$out/$name-members.before" && test -f "$out/$name-members.after";then cmp "$out/$name-members.before" "$out/$name-members.after" || failed=1;else failed=1;fi
          done
          for name in dependencies browser-tools font-cache;do
            if test -f "$out/$name.sha256" && test -f "$out/$name-end.sha256";then cmp "$out/$name.sha256" "$out/$name-end.sha256" || failed=1;else failed=1;fi
          done
          if test -d dist;then
            find dist ! -type d ! -type f -print > "$out/dist-nonregular.after";test ! -s "$out/dist-nonregular.after" || failed=1
            find dist -type f -print0 | sort -z > "$out/dist-members.after" || failed=1
            find dist -type f -print0 | sort -z | xargs -0 sha256sum > "$out/dist-end.sha256" || failed=1
            if test -f "$out/dist.sha256";then sha256sum --check "$out/dist.sha256" > "$out/final-dist-hold.log" 2>&1 || failed=1;cmp "$out/dist.sha256" "$out/dist-end.sha256" || failed=1;else failed=1;fi
            if test -f "$out/dist-members.before";then cmp "$out/dist-members.before" "$out/dist-members.after" || failed=1;else failed=1;fi
          else failed=1;fi
          if test -f "$out/weights-preload-binding.json";then NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$out/holds.transport" node -e 'const f=require("node:fs"),a=require("node:assert/strict"),h=require("node:crypto").createHash("sha256").update(f.readFileSync(process.env.CHROME_BROWSER_OUT+"/weights-cached-fonts.cjs")).digest("hex");a.equal(h,JSON.parse(f.readFileSync(process.env.CHROME_BROWSER_OUT+"/weights-preload-binding.json")).copySha256)' > "$out/final-weights-preload-hold.log" 2>&1 || failed=1;else failed=1;fi
          if test -f "$out/soccer-grid-weight-observation.json.source.sha256";then sha256sum --check "$out/soccer-grid-weight-observation.json.source.sha256" > "$out/final-weight-observation-source-hold.log" 2>&1 || failed=1;else failed=1;fi
          for link in playwright playwright-core;do readlink -f "node_modules/$link" || failed=1;done > "$out/browser-links.after"
          if test -f "$out/browser-links.before";then cmp "$out/browser-links.before" "$out/browser-links.after" || failed=1;else failed=1;fi
          git rev-parse HEAD > "$out/head-after.txt" || failed=1
          if test -f "$out/head.txt";then cmp "$out/head.txt" "$out/head-after.txt" || failed=1;else failed=1;fi
          git diff --exit-code HEAD > "$out/final-source-diff.log" || failed=1
          git status --porcelain --untracked-files=all > "$out/final-status.txt";test ! -s "$out/final-status.txt" || failed=1
          if test -f "$out/geometry.transport" && test -f "$out/geometry-guard-binding.json" && test -f "$out/geometry-offline-guard.cjs";then
            NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$out/holds.transport" node <<'NODE' > "$out/final-geometry-observation-hold.log" 2>&1 || failed=1
          const fs=require('node:fs'),assert=require('node:assert/strict'),{createHash}=require('node:crypto'),out=process.env.CHROME_BROWSER_OUT,hash=b=>createHash('sha256').update(b).digest('hex');
          const line='[SIM_OFFLINE_BLOCK] external browser WebSocket wss://flawuiqbvjobmkfkauhw.supabase.co';assert.equal(fs.readFileSync(out+'/geometry.transport','utf8'),(line+'\n').repeat(4));assert.equal(fs.readFileSync(out+'/browser-classifier.exit','utf8').trim(),'0');
          const binding=JSON.parse(fs.readFileSync(out+'/geometry-guard-binding.json','utf8'));assert.equal(binding.sourceSha256,hash(fs.readFileSync('scripts/lib/offlineTransport.cjs')));assert.equal(binding.sourceSha256,'e60ff1534307e449ccef598e3b7470dcba58681b82cea4005cec7319f14f9221');assert.equal(binding.copySha256,'9a5ed63e2ed4a4cdd62cc9d1bff8fe12f8f7589b1c02872c45ae92b8f9e8f915');assert.equal(hash(fs.readFileSync(out+'/geometry-offline-guard.cjs')),binding.copySha256);assert.equal(binding.wholeInverseExact,true);assert.equal(binding.rejectionLogicHeld,true);
          const geometry=JSON.parse(fs.readFileSync(out+'/geometry/geometry-report.json','utf8')),records=fs.readFileSync(out+'/geometry/geometry-sockets.jsonl','utf8').split('\n').filter(Boolean).map(line=>JSON.parse(line));assert.deepEqual(records,geometry.owningGuardObservation.records);assert.equal(records.length,4);assert.equal(geometry.complete,true);assert.equal(geometry.owningGuardObservation.failure,null);
          NODE
          else failed=1;fi
          if test -f "$out/report-browser-inspector.sha256";then sha256sum -c "$out/report-browser-inspector.sha256" > "$out/report-inspector-before-final.log" 2>&1 || failed=1;else failed=1;fi
          : > "$out/report-final.transport";report_final_status=0
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$out/report-final.transport" timeout --signal=TERM --kill-after=15s 90s node "$out/report-browser-inspector.cjs" final > "$out/report-final.stdout.log" 2> "$out/report-final.stderr.log" || report_final_status=$?
          printf '%s\n' "$report_final_status" > "$out/report-final.exit";test "$report_final_status" -eq 0 || failed=1
          if test -f "$out/report-browser-inspector.sha256";then sha256sum -c "$out/report-browser-inspector.sha256" > "$out/report-inspector-after-final.log" 2>&1 || failed=1;else failed=1;fi
          for name in report-source report-legacy report-legacy-classifier report-activation report-activation-classifier question-activation question-activation-classifier;do test -f "$out/$name.exit" && test "$(cat "$out/$name.exit")" = 0 || failed=1;done
          required=(build server recipes host browser-classifier geometry-guard-copy readers-server homefold caps-server caps holds finder-server finder finder-classifier weight-observation-server weight-observation report-source report-legacy-server report-legacy report-legacy-classifier report-activation-server report-activation report-activation-classifier question-activation-server question-activation question-activation-classifier report-final)
          for method in simAdsense simBrand simHeadTags simHiddenPages simHubs simIndexNow simIndexing simInternalLinks simNoRivalNames simPrerender simPrerenderBoot simRetiredRoutes simSchema simSitemap simSnapshotAssets simSiteSearch simGuideHeadings simLegalPages;do required+=("$method");done
          for name in "${required[@]}";do test -f "$out/$name.transport" && test ! -s "$out/$name.transport" || failed=1;done
          for recipe in live-fit draft-fold conquest-hit career-depth route-menu-preserve;do test -f "$out/$recipe/node.transport" && test ! -s "$out/$recipe/node.transport" || failed=1;done
          while IFS= read -r -d '' file;do if test "$file" != "$out/geometry.transport";then test ! -s "$file" || failed=1;fi;done < <(find "$out" -type f -name '*.transport' -print0)
          printf 'phase=report-feedback-portals-and-held-shared-browser\nsource=%s\nfunctionalDependency=%s\nbuild=%s\nbrowser=%s\nfinder=%s\nreaders=%s\ncaps=%s\nweightObservation=%s\nlegacyReport=%s\nsitePortal=%s\nquestionPortalAndCoexistence=%s\nfinalHoldsExit=%s\n' "$GITHUB_SHA" '${{ needs.report_functional_green.result }}' '${{ steps.build.outcome }}' '${{ steps.browser.outcome }}' '${{ steps.finder_browser.outcome }}' '${{ steps.readers.outcome }}' '${{ steps.caps.outcome }}' '${{ steps.weight_observation.outcome }}' '${{ steps.report_legacy.outcome }}' '${{ steps.report_activation.outcome }}' '${{ steps.question_activation.outcome }}' "$failed" > "$out/stages.txt"
          printf '%s\n' "$failed" > "$out/final-holds.exit"
          (cd "$out";find . -type f ! -path ./evidence.sha256 -print0 | sort -z | xargs -0 sha256sum) > "$out/evidence.sha256"
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-feedback-portals-shared-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/site-menu-shared-browser/
          if-no-files-found: error
          retention-days: 14

