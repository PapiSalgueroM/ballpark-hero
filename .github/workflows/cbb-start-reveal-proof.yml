name: CBB start reveal diagnostic only
on:
  push:
    branches: [codex/unemailed-cbb-start-reveal-20261030]
permissions:
  contents: read
concurrency:
  group: cbb-start-reveal-${{ github.ref }}
  cancel-in-progress: false
jobs:
  proof:
    if: github.ref == 'refs/heads/codex/unemailed-cbb-start-reveal-20261030'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: 'true'
      TZ: UTC
      GIT_OPTIONAL_LOCKS: '0'
      CBB_PROOF_OUT: ${{ runner.temp }}/cbb-start-reveal-proof
      CBB_CONTROLLER_SHA256: c07773377499c6060aa570b2a1261b6fd94cd837ff3dc66a8eaee7b4fdd64b28
      EXPECTED_PRODUCT: a2da3c0bec33018484c050aa6bffe982280f289b
      EXPECTED_PRODUCT_TREE: e74e058ddf5793c684c739465b218f9b0f77c6f6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Immutable base, product, proof and source archives
        run: node scripts/qa/runCbbStartRevealProof.mjs prepare
      - name: Actual locked dependencies
        run: node scripts/qa/runCbbStartRevealProof.mjs deps
      - name: Real application types
        run: node scripts/qa/runCbbStartRevealProof.mjs types
      - name: Three new real-engine transaction diagnostics
        run: node scripts/qa/runCbbStartRevealProof.mjs flow
      - name: Six existing CBB depth and legacy cases
        run: node scripts/qa/runCbbStartRevealProof.mjs depth
      - name: Ordinary actual app build
        run: node scripts/qa/runCbbStartRevealProof.mjs build
      - name: Isolated Chromium tooling and actual prepared site fonts
        run: node scripts/qa/runCbbStartRevealProof.mjs browser-tools
      - name: Actual visibility, ownership mutant and same-copy normal replay
        run: node scripts/qa/runCbbStartRevealProof.mjs browser
      - name: Always retain source, dist, fonts and exact raw evidence
        if: ${{ always() }}
        run: node scripts/qa/runCbbStartRevealProof.mjs retain
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: cbb-start-reveal-${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ env.CBB_PROOF_OUT }}
          if-no-files-found: error
          retention-days: 14
