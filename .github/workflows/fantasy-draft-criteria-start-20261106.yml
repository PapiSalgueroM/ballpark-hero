name: Fantasy Draft original pending criteria proof
on:
  push:
    branches: [codex/fantasy-draft-criteria-start-qa-20261106]
permissions:
  contents: read
jobs:
  original:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      SIM_NETWORK: offline
      SIM_OFFLINE_RECEIPT: fantasy-draft-criteria-original/offline.log
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - name: Original source pins and locked install
        run: |
          set -euo pipefail
          test ! -e fantasy-draft-criteria-original
          mkdir fantasy-draft-criteria-original
          touch fantasy-draft-criteria-original/offline.log
          git rev-parse HEAD > fantasy-draft-criteria-original/head.txt
          git rev-parse 'HEAD^{tree}' > fantasy-draft-criteria-original/tree.txt
          git ls-files -s > fantasy-draft-criteria-original/source-before.txt
          sha256sum package.json package-lock.json > fantasy-draft-criteria-original/locks-before.txt
          git fetch --no-tags --depth=1 origin 98588971156dee718e392f4ea66371c656ef1b3d
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';import {execFileSync} from 'node:child_process';import {createHash} from 'node:crypto';
          const out='fantasy-draft-criteria-original',authority='98588971156dee718e392f4ea66371c656ef1b3d',baseTree='de6b344af828b8e8afd0fd5a1cc492f5e95bb855';
          const test='src/test/fantasyDraftCriteriaStart.test.tsx',plan='docs/plans/2026-11-06-fantasy-draft-criteria-start.md',workflow='.github/workflows/fantasy-draft-criteria-start-20261106.yml';
          const spinner='src/components/lineup/TeamSpinner.tsx',titleHelper='scripts/qa/playBuildXiTitleSpace.mjs',titleWorkflow='.github/workflows/qa-build-xi-title-space.yml';
          const at=(ref,file)=>execFileSync('git',['rev-parse',ref+':'+file],{encoding:'utf8'}).trim();
          const pins={
            'src/pages/FantasyDraft.tsx':'2343cadb8ff109230f8ed6d13fe3c70e21c57014',
            'src/lib/fantasyCriteria.ts':'f6f7d27ee0af80e4386e650a9d7128cd89702f90',
            'src/components/fantasy-draft/PlayerPool.tsx':'08a84d008390d68293482de3e818fada9120c5b3',
            'src/components/fantasy-draft/DraftRoster.tsx':'61d938308edcded2adffc810c01b7d9c12fd3a35',
            'src/test/fantasyDraftFormation.test.tsx':'4db9e392fdc40f01e2c668342e45eafcf37b79f6',
            'src/test/draftPoolFilters.test.tsx':'b6daf9f4023fe32cc87e55f50132dff5f8aa1295',
            'src/test/draftRosterMotion.test.tsx':'c0d6c95f3fbbbf189c064b46bb3cf0c452cf0dfd',
            'src/test/draftWinnerFeedback.test.tsx':'652c509b9d4ff791305bc2a6044c03aa41736b91',
            'package.json':'2ff64986fb76ebc51b706f2fd24765768874008a',
            'package-lock.json':'97d6f12a052f25f400462938c241789a083f0bfe',
            [test]:'4e9d54803677696454ef0cbbf155182192e03769',[plan]:'58c27ca1630d874c5201f2ed3f21b0f0fceeee34',
            [spinner]:'7777b6a3e115866c468fbd480820b6356066d91d',
          };
          for(const [file,sha]of Object.entries(pins))assert.equal(at('HEAD',file),sha,file);
          assert.equal(at(authority,spinner),'aecb4220f2ff7bb063478a3ba88aa1ca45ddbaff');
          assert.equal(at(authority,titleHelper),'e4e053a154b40e6929cee3e8bb9ee1fa5ec7ea90');
          assert.equal(at(authority,titleWorkflow),'6faf64588a7d6caa070a82c2de29c931d8671065');
          const tree=ref=>execFileSync('git',['ls-tree','-r','-z',ref],{encoding:'utf8',maxBuffer:16*1024*1024}).split('\0').filter(Boolean),file=row=>row.split('\t')[1],owned=[test,plan,workflow];
          const reconstructed=tree(authority).filter(row=>![titleHelper,titleWorkflow].includes(file(row))).map(row=>file(row)===spinner?row.replace('aecb4220f2ff7bb063478a3ba88aa1ca45ddbaff',pins[spinner]):row);
          const held=tree('HEAD').filter(row=>!owned.includes(file(row)));
          assert.deepEqual(held,reconstructed,'Exact de6 source except owned test/plan/workflow');
          fs.writeFileSync(out+'/source-join.json',JSON.stringify({status:'passed',authority,baseTree,heldRows:held.length,pins,owned,method:'Invert only three Title leaves in memory; no fetch of unattached de6 and no source/ref mutation.'},null,2));
          const files=execFileSync('git',['ls-files','-z'],{encoding:'utf8'}).split('\0').filter(Boolean),rows=files.map(file=>{const b=fs.readFileSync(file);return{file,bytes:b.length,sha256:createHash('sha256').update(b).digest('hex')};});
          fs.writeFileSync(out+'/tracked-before.json',JSON.stringify(rows));
          NODE
          npm ci 2>&1 | tee fantasy-draft-criteria-original/install.log
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const lock=JSON.parse(fs.readFileSync('package-lock.json'));
          const rows=Object.keys(lock.packages).filter(p=>p.startsWith('node_modules/')&&fs.existsSync(p+'/package.json')).map(p=>[p,JSON.parse(fs.readFileSync(p+'/package.json')).version]);
          assert.equal(rows.length,521);for(const [p,v]of rows)assert.equal(v,lock.packages[p].version,p);
          fs.writeFileSync('fantasy-draft-criteria-original/installed-before.json',JSON.stringify(rows));
          NODE
      - name: Proper App types
        run: |
          set -euo pipefail
          node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee fantasy-draft-criteria-original/types.log
      - name: Original actual-page four-case census
        run: |
          set -euo pipefail
          test ! -e fantasy-draft-criteria-original/raw.json
          set +e
          FD_RULES_START_RAW="$PWD/fantasy-draft-criteria-original/raw.json" NODE_OPTIONS="--max-old-space-size=6144 --require=$PWD/scripts/lib/offlineTransport.cjs" node node_modules/vitest/vitest.mjs run src/test/fantasyDraftCriteriaStart.test.tsx --maxWorkers=1 --minWorkers=1 --reporter=default --reporter=json --outputFile=fantasy-draft-criteria-original/owned.json 2>&1 | tee fantasy-draft-criteria-original/owned.log
          statuses=("${PIPESTATUS[@]}")
          set -e
          printf '%s\n' "${statuses[0]}" > fantasy-draft-criteria-original/owned-exit.txt
          test "${statuses[1]}" = 0
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';import {createHash} from 'node:crypto';
          const out='fantasy-draft-criteria-original',r=JSON.parse(fs.readFileSync(out+'/owned.json')),raw=JSON.parse(fs.readFileSync(out+'/raw.json')),log=fs.readFileSync(out+'/owned.log','utf8');
          assert.equal(fs.readFileSync(out+'/owned-exit.txt','utf8').trim(),'1');
          assert.equal(r.numTotalTests,4);assert.equal(r.numFailedTests,2);assert.equal(r.numPassedTests,2);assert.equal(r.numPendingTests,0);
          for(const key of ['numRuntimeErrorTestSuites','numUnhandledErrors'])if(Object.hasOwn(r,key))assert.equal(r[key],0,key);
          const expected={
            'FD_RULES_PENDING_SUCCESS refuses premature admission and resumes after the deferred callback':'failed',
            'FD_RULES_PENDING_REJECTION refuses premature admission and resumes after the deferred callback':'failed',
            'FD_RULES_SETTLED_NULL preserves permissive picks and the original AI turn sequence':'passed',
            'FD_RULES_SETTLED_LEGACY preserves permissive picks and the original AI turn sequence':'passed',
          };
          const rows=r.testResults.flatMap(s=>s.assertionResults),failed=rows.filter(v=>v.status==='failed'),passed=rows.filter(v=>v.status==='passed');
          assert.equal(rows.length,4);assert.deepEqual(Object.fromEntries(rows.map(v=>[v.title,v.status])),expected);
          for(const row of failed){const marker=row.title.split(' ')[0];assert(Array.isArray(row.failureMessages)&&row.failureMessages.length>0);assert(row.failureMessages.every(m=>m.includes('AssertionError')&&m.includes(marker)),'Actual owned business AssertionError: '+marker);}
          assert(!/Unhandled Errors|Unhandled Rejection|Uncaught Exception|Failed to resolve import|No test files found|SyntaxError/.test(log));
          assert.equal(raw.version,1);assert.deepEqual(Object.keys(raw.cases).sort(),['legacy','null','rejection','success']);
          const pendingLabels=['pending-after-start-and-possible-pick','deferred-criteria-settled','final-before-cleanup'],settledLabels=['criterion-settled-before-start','after-native-human-and-two-ai-picks','final-before-cleanup'];
          for(const [key,value]of Object.entries(raw.cases)){assert.deepEqual(value.frames.map(f=>f.label),['success','rejection'].includes(key)?pendingLabels:settledLabels);assert(value.frames.every(f=>f.inputPool.length===27&&typeof f.html==='string'));}
          for(const key of ['success','rejection'])for(const f of raw.cases[key].frames){assert.equal(f.state.startPresent,false);assert.equal(f.state.poolPresent,true);assert.deepEqual(f.state.human,['Fixture Veteran FWD']);assert.deepEqual(f.state.ai,[]);assert.deepEqual(f.state.draws,[0]);assert.equal(f.state.marketRequests,1);assert.equal(f.state.settleCalls,0);assert.equal(f.state.completions,0);}
          assert(raw.cases.success.frames[1].html.includes('Under 25s: Every player must be 25 or younger'));
          const files=['owned.json','owned.log','raw.json'].map(file=>{const b=fs.readFileSync(out+'/'+file);return{file,bytes:b.length,sha256:createHash('sha256').update(b).digest('hex')};});
          const summary={status:'original-two-business-reds-admitted',actual:{tests:r.numTotalTests,failed:failed.map(v=>v.title),passed:passed.map(v=>v.title),rawCases:Object.keys(raw.cases),rawFrames:Object.values(raw.cases).reduce((n,v)=>n+v.frames.length,0)},runtimeFields:Object.fromEntries(['numRuntimeErrorTestSuites','numUnhandledErrors'].map(key=>[key,{present:Object.hasOwn(r,key),value:r[key]??null}])),files,limits:'Original proof only. No fixed, native, build, provider, full-FD01 or release credit.'};
          fs.writeFileSync(out+'/original-admission.json',JSON.stringify(summary,null,2));console.log(JSON.stringify(summary));
          NODE
      - name: Existing nineteen formation pool roster and winner cases
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          NODE_OPTIONS="--max-old-space-size=6144 --require=$PWD/scripts/lib/offlineTransport.cjs" node node_modules/vitest/vitest.mjs run src/test/fantasyDraftFormation.test.tsx src/test/draftPoolFilters.test.tsx src/test/draftRosterMotion.test.tsx src/test/draftWinnerFeedback.test.tsx --maxWorkers=1 --minWorkers=1 --reporter=default --reporter=json --outputFile=fantasy-draft-criteria-original/existing.json 2>&1 | tee fantasy-draft-criteria-original/existing.log
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import path from 'node:path';import assert from 'node:assert/strict';
          const out='fantasy-draft-criteria-original',r=JSON.parse(fs.readFileSync(out+'/existing.json')),log=fs.readFileSync(out+'/existing.log','utf8');
          assert.equal(r.numTotalTests,19);assert.equal(r.numPassedTests,19);assert.equal(r.numFailedTests,0);assert.equal(r.numPendingTests,0);
          const actual=Object.fromEntries(r.testResults.map(s=>[path.basename(s.name),s.assertionResults.length]));
          assert.deepEqual(actual,{'fantasyDraftFormation.test.tsx':3,'draftPoolFilters.test.tsx':7,'draftRosterMotion.test.tsx':4,'draftWinnerFeedback.test.tsx':5});
          assert(r.testResults.every(s=>s.assertionResults.every(v=>v.status==='passed')));
          for(const key of ['numRuntimeErrorTestSuites','numUnhandledErrors'])if(Object.hasOwn(r,key))assert.equal(r[key],0,key);
          assert(!/Unhandled Errors|Unhandled Rejection|Uncaught Exception|Failed to resolve import|No test files found|SyntaxError/.test(log));
          fs.writeFileSync(out+'/existing-admission.json',JSON.stringify({status:'existing-nineteen-passed',actual},null,2));console.log('PASS actual19 existing formation/pool/roster/winner cases');
          NODE
      - name: Whole tracked source locks versions and offline held
        if: always()
        run: |
          set -euo pipefail
          git ls-files -s > fantasy-draft-criteria-original/source-after.txt
          cmp fantasy-draft-criteria-original/source-before.txt fantasy-draft-criteria-original/source-after.txt
          git diff --exit-code HEAD -- .
          sha256sum package.json package-lock.json > fantasy-draft-criteria-original/locks-after.txt
          cmp fantasy-draft-criteria-original/locks-before.txt fantasy-draft-criteria-original/locks-after.txt
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';import {execFileSync} from 'node:child_process';import {createHash} from 'node:crypto';
          const out='fantasy-draft-criteria-original',files=execFileSync('git',['ls-files','-z'],{encoding:'utf8'}).split('\0').filter(Boolean);
          const rows=files.map(file=>{const b=fs.readFileSync(file);return{file,bytes:b.length,sha256:createHash('sha256').update(b).digest('hex')};});
          fs.writeFileSync(out+'/tracked-after.json',JSON.stringify(rows));assert.deepEqual(rows,JSON.parse(fs.readFileSync(out+'/tracked-before.json')));
          const lock=JSON.parse(fs.readFileSync('package-lock.json')),before=JSON.parse(fs.readFileSync(out+'/installed-before.json'));
          const after=Object.keys(lock.packages).filter(p=>p.startsWith('node_modules/')&&fs.existsSync(p+'/package.json')).map(p=>[p,JSON.parse(fs.readFileSync(p+'/package.json')).version]);
          assert.equal(after.length,521);assert.deepEqual(after,before);fs.writeFileSync(out+'/installed-after.json',JSON.stringify(after));
          assert(fs.existsSync(out+'/offline.log'));assert.equal(fs.statSync(out+'/offline.log').size,0);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fantasy-draft-criteria-original-${{ github.run_id }}
          path: fantasy-draft-criteria-original
          retention-days: 14
          if-no-files-found: error
