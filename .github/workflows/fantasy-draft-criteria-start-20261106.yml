name: Fantasy Draft causal pending criteria gate
on:
  push:
    branches: [codex/fantasy-draft-criteria-start-qa-20261106]
permissions:
  contents: read
  actions: read
jobs:
  causal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      SIM_NETWORK: offline
      SIM_OFFLINE_RECEIPT: fantasy-draft-criteria-causal/offline.log
      FD_GATE_OUT: fantasy-draft-criteria-causal
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - name: Pin source lineage and locked install
        run: |
          set -euo pipefail
          test ! -e "$FD_GATE_OUT"
          mkdir "$FD_GATE_OUT"
          touch "$SIM_OFFLINE_RECEIPT"
          git rev-parse HEAD > "$FD_GATE_OUT/head.txt"
          git rev-parse 'HEAD^{tree}' > "$FD_GATE_OUT/tree.txt"
          git ls-files -s > "$FD_GATE_OUT/source-before.txt"
          sha256sum package.json package-lock.json > "$FD_GATE_OUT/locks-before.txt"
          git diff --exit-code HEAD -- .
          git fetch --no-tags --depth=1 origin 4b513e64391a352fe1394a935ef4f13a995a5959
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';import {execFileSync} from 'node:child_process';import {createHash} from 'node:crypto';
          const out=process.env.FD_GATE_OUT,original='4b513e64391a352fe1394a935ef4f13a995a5959',page='src/pages/FantasyDraft.tsx',controller='scripts/qa/fantasyDraftCriteriaStartCheck.mjs',workflow='.github/workflows/fantasy-draft-criteria-start-20261106.yml';
          const at=(ref,file)=>execFileSync('git',['rev-parse',ref+':'+file],{encoding:'utf8'}).trim();
          assert.equal(at('HEAD',page),'d1b38c9aaae0ead2c68d746866e0ccb3b47adccd');assert.equal(at(original,page),'2343cadb8ff109230f8ed6d13fe3c70e21c57014');
          assert.equal(at('HEAD',controller),'ef82dcf6d1fd53d3539cb4ca6b455cafd539c4d2');assert.equal(at('HEAD','src/test/fantasyDraftCriteriaStart.test.tsx'),'4e9d54803677696454ef0cbbf155182192e03769');
          const tree=ref=>execFileSync('git',['ls-tree','-r','-z',ref],{encoding:'utf8',maxBuffer:16*1024*1024}).split('\0').filter(Boolean),file=row=>row.split('\t')[1];
          const excluded=[controller,workflow],base=tree(original).filter(r=>!excluded.includes(file(r))),current=tree('HEAD').filter(r=>!excluded.includes(file(r))).map(r=>file(r)===page?r.replace('d1b38c9aaae0ead2c68d746866e0ccb3b47adccd','2343cadb8ff109230f8ed6d13fe3c70e21c57014'):r);
          assert.deepEqual(current,base,'Only the fixed gate and two QA leaves differ from admitted original');
          fs.writeFileSync(out+'/source-join.json',JSON.stringify({status:'passed',original,heldRows:base.length,onlyProductChange:page,excludedQALeaves:excluded},null,2));
          const files=execFileSync('git',['ls-files','-z'],{encoding:'utf8'}).split('\0').filter(Boolean),rows=files.map(file=>{const b=fs.readFileSync(file);return{file,bytes:b.length,sha256:createHash('sha256').update(b).digest('hex')};});fs.writeFileSync(out+'/tracked-before.json',JSON.stringify(rows));
          NODE
          npm ci 2>&1 | tee "$FD_GATE_OUT/install.log"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const lock=JSON.parse(fs.readFileSync('package-lock.json')),rows=Object.keys(lock.packages).filter(p=>p.startsWith('node_modules/')&&fs.existsSync(p+'/package.json')).map(p=>[p,JSON.parse(fs.readFileSync(p+'/package.json')).version]);
          assert.equal(rows.length,521);for(const[p,v]of rows)assert.equal(v,lock.packages[p].version,p);
          fs.writeFileSync(process.env.FD_GATE_OUT+'/installed-before.json',JSON.stringify(rows));
          NODE
      - name: Retain exact admitted original artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api repos/PapiSalgueroM/ballpark-hero/actions/runs/42169883619 > "$FD_GATE_OUT/original-run.json"
          gh api repos/PapiSalgueroM/ballpark-hero/actions/artifacts/13480164759 > "$FD_GATE_OUT/original-artifact.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const out=process.env.FD_GATE_OUT,r=JSON.parse(fs.readFileSync(out+'/original-run.json')),a=JSON.parse(fs.readFileSync(out+'/original-artifact.json'));
          assert.equal(r.id,42169883619);assert.equal(r.head_sha,'4b513e64391a352fe1394a935ef4f13a995a5959');assert.equal(r.conclusion,'success');
          assert.equal(a.id,13480164759);assert.equal(a.size_in_bytes,1016886);assert.equal(a.digest,'sha256:eb67952ff70680742c294ef9543cb43a142e22f4d0badab04ab612af986a1c86');assert.equal(a.expired,false);assert.equal(a.workflow_run.id,r.id);assert.equal(a.workflow_run.head_sha,r.head_sha);
          NODE
          gh api repos/PapiSalgueroM/ballpark-hero/actions/artifacts/13480164759/zip > "$FD_GATE_OUT/original.zip"
          printf '%s  %s\n' eb67952ff70680742c294ef9543cb43a142e22f4d0badab04ab612af986a1c86 "$FD_GATE_OUT/original.zip" | sha256sum -c -
          test ! -e "$RUNNER_TEMP/fd-criteria-original"
          mkdir "$RUNNER_TEMP/fd-criteria-original"
          unzip -q "$FD_GATE_OUT/original.zip" -d "$RUNNER_TEMP/fd-criteria-original"
          printf '%s  %s\n' cb4a95ed5b94ba2437fd81e1f5a2d0b64410110967a926c03c48db999862802e "$RUNNER_TEMP/fd-criteria-original/raw.json" | sha256sum -c -
      - name: Proper App types
        run: |
          set -euo pipefail
          node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee "$FD_GATE_OUT/types.log"
      - name: Fixed23 physical gate removal4 and restored4
        run: |
          set -euo pipefail
          FD_RULES_GATE_OUT="$PWD/$FD_GATE_OUT/causal" FD_RULES_ORIGINAL_RAW="$RUNNER_TEMP/fd-criteria-original/raw.json" NODE_OPTIONS="--max-old-space-size=6144 --require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/qa/fantasyDraftCriteriaStartCheck.mjs 2>&1 | tee "$FD_GATE_OUT/causal.log"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const r=JSON.parse(fs.readFileSync(process.env.FD_GATE_OUT+'/causal/report.json'));assert.equal(r.status,'passed');assert(r.restored);
          assert.deepEqual(r.arms.map(a=>[a.name,a.tests,a.passed,a.failed.length,a.rawFrames]),[['fixed',23,23,0,14],['remove-gate',4,2,2,12],['restored',4,4,0,14]]);
          assert.equal(r.installed,521);assert(r.mutation.changed&&r.mutation.inverseExact);console.log('PASS actual31 cases, exact2 physical business reds, original semantic parity and complete restoration');
          NODE
      - name: Exact source locks installed versions and offline holds
        if: always()
        run: |
          set -euo pipefail
          git ls-files -s > "$FD_GATE_OUT/source-after.txt"
          cmp "$FD_GATE_OUT/source-before.txt" "$FD_GATE_OUT/source-after.txt"
          git diff --exit-code HEAD -- .
          sha256sum package.json package-lock.json > "$FD_GATE_OUT/locks-after.txt"
          cmp "$FD_GATE_OUT/locks-before.txt" "$FD_GATE_OUT/locks-after.txt"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';import {execFileSync} from 'node:child_process';import {createHash} from 'node:crypto';
          const out=process.env.FD_GATE_OUT,files=execFileSync('git',['ls-files','-z'],{encoding:'utf8'}).split('\0').filter(Boolean),rows=files.map(file=>{const b=fs.readFileSync(file);return{file,bytes:b.length,sha256:createHash('sha256').update(b).digest('hex')};});fs.writeFileSync(out+'/tracked-after.json',JSON.stringify(rows));assert.deepEqual(rows,JSON.parse(fs.readFileSync(out+'/tracked-before.json')));
          const lock=JSON.parse(fs.readFileSync('package-lock.json')),versions=Object.keys(lock.packages).filter(p=>p.startsWith('node_modules/')&&fs.existsSync(p+'/package.json')).map(p=>[p,JSON.parse(fs.readFileSync(p+'/package.json')).version]);assert.equal(versions.length,521);assert.deepEqual(versions,JSON.parse(fs.readFileSync(out+'/installed-before.json')));fs.writeFileSync(out+'/installed-after.json',JSON.stringify(versions));
          assert(fs.existsSync(process.env.SIM_OFFLINE_RECEIPT));assert.equal(fs.statSync(process.env.SIM_OFFLINE_RECEIPT).size,0);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fantasy-draft-criteria-causal-${{ github.run_id }}
          path: fantasy-draft-criteria-causal
          retention-days: 14
          if-no-files-found: error
