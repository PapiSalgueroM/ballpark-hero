name: NBA historical class types and existing legacy regressions
on:
  push:
    branches: [codex/nba-2004-types-legacy-20261105]
permissions:
  contents: read
jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Bind reviewed product and single QA addition
        shell: bash
        run: |
          set -euo pipefail
          QA_OUT="$RUNNER_TEMP/nba-2004-types-legacy"
          echo "QA_OUT=$QA_OUT" >> "$GITHUB_ENV"
          mkdir -p "$QA_OUT"/{logs,transport}
          test "$(git rev-parse HEAD^)" = 4e45ee3605589aeb5a268b2e6a902fb4ff71af92
          test "$(git rev-parse HEAD^^{tree})" = 5ffdee94dc4dac52922a3dc6d893abc317e578c0
          test "$(git diff --name-status HEAD^ HEAD)" = $'A\t.github/workflows/nba-2004-types-legacy-20261105.yml'
          git rev-parse HEAD HEAD^ 'HEAD^{tree}' > "$QA_OUT/source-identity.txt"
          git ls-files -z | xargs -0 sha256sum > "$QA_OUT/source-before.sha256"
          git ls-files -s > "$QA_OUT/index-before.txt"
          git status --porcelain=v1 --untracked-files=all > "$QA_OUT/status-before.txt"
          cp package-lock.json "$QA_OUT/lock-before.json"
          test ! -s "$QA_OUT/status-before.txt"
      - name: Install held lock
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund > "$QA_OUT/logs/npm-ci.log" 2>&1
      - name: Proper application types before any legacy outcome
        shell: bash
        run: |
          set +e
          set -uo pipefail
          export SIM_NETWORK=offline GIT_NO_LAZY_FETCH=1
          export NODE_OPTIONS="--require=$GITHUB_WORKSPACE/scripts/lib/offlineTransport.cjs"
          export SIM_OFFLINE_RECEIPT="$QA_OUT/transport/types.log"
          : > "$SIM_OFFLINE_RECEIPT"
          node_modules/.bin/tsc --noEmit -p tsconfig.app.json > "$QA_OUT/logs/types.log" 2>&1
          native_exit=$?
          printf '%s\n' "$native_exit" > "$QA_OUT/logs/types.exit"
          test "$native_exit" = 0 || exit "$native_exit"
          test ! -s "$SIM_OFFLINE_RECEIPT"
      - name: Existing source and immutable four-sport board regressions
        shell: bash
        run: |
          set +e
          set -uo pipefail
          export SIM_NETWORK=offline GIT_NO_LAZY_FETCH=1
          export NODE_OPTIONS="--require=$GITHUB_WORKSPACE/scripts/lib/offlineTransport.cjs"
          for name in simCareerHub simCareerParity simUsBoardParity simNbaCareer; do
            export SIM_OFFLINE_RECEIPT="$QA_OUT/transport/$name.log"
            : > "$SIM_OFFLINE_RECEIPT"
            node --unhandled-rejections=strict "scripts/$name.mjs" > "$QA_OUT/logs/$name.log" 2>&1
            native_exit=$?
            printf '%s\n' "$native_exit" > "$QA_OUT/logs/$name.exit"
            test "$native_exit" = 0 || exit "$native_exit"
            test ! -s "$SIM_OFFLINE_RECEIPT" || exit 1
            test -s "$QA_OUT/logs/$name.log" || exit 1
          done
          grep -F 'simUsBoardParity: green.' "$QA_OUT/logs/simUsBoardParity.log"
      - name: Always retain complete source index lock and status holds
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git ls-files -z | xargs -0 sha256sum > "$QA_OUT/source-after.sha256"
          git ls-files -s > "$QA_OUT/index-after.txt"
          git status --porcelain=v1 --untracked-files=all > "$QA_OUT/status-after.txt"
          cp package-lock.json "$QA_OUT/lock-after.json"
          cmp "$QA_OUT/source-before.sha256" "$QA_OUT/source-after.sha256"
          cmp "$QA_OUT/index-before.txt" "$QA_OUT/index-after.txt"
          cmp "$QA_OUT/lock-before.json" "$QA_OUT/lock-after.json"
          test ! -s "$QA_OUT/status-after.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nba-2004-types-legacy
          path: ${{ env.QA_OUT }}/
          if-no-files-found: error
          retention-days: 14
