name: Retired Manager Continue verification

on:
  push:
    branches: [codex/retired-manager-continue]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CI: '1'
      SIM_NETWORK: offline
      ENGINES: chromium
      TZ: UTC
      PRERENDER_ONLY: /whats-new
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Allocate and bind actual source
        run: |
          set -euo pipefail
          echo "RETIRED_MANAGER_CONTINUE_OUT=$RUNNER_TEMP/retired-manager-continue" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/retired-manager-continue"
          git rev-parse HEAD > "$RUNNER_TEMP/retired-manager-continue/head.txt"
          git archive --format=zip HEAD > "$RUNNER_TEMP/retired-manager-continue/source.zip"
          git merge-base --is-ancestor d8aaa4cb654e1b59f783625e63b73ce85adf2681 HEAD
          git diff --exit-code d8aaa4cb654e1b59f783625e63b73ce85adf2681 HEAD -- src scripts public package.json package-lock.json bun.lock bun.lockb index.html ':!src/data/continueSaves.ts' ':!src/data/homeFront.ts' ':!src/test/retiredManagerContinue.test.tsx' ':!scripts/simHomeFront.mjs' ':!scripts/qa/proveRetiredManagerContinueBaseline.mjs' ':!scripts/qa/proveRetiredManagerContinue.mjs' ':!src/data/searchKeywords.json' ':!scripts/data/guideHeadingsFrozen.json' ':!public/whats-new/index.html' ':!public/sitemap.xml' ':!scripts/data/lastmod.json'
          git status --porcelain --untracked-files=no > "$RUNNER_TEMP/retired-manager-continue/source-before.txt"
          test ! -s "$RUNNER_TEMP/retired-manager-continue/source-before.txt"
      - name: Locked application and isolated browser dependencies
        run: |
          set -euo pipefail
          npm ci > "$RETIRED_MANAGER_CONTINUE_OUT/install.log" 2>&1
          node scripts/qa/soccerAgentReviewDependencies.mjs before > "$RETIRED_MANAGER_CONTINUE_OUT/dependencies-before.log" 2>&1
          browser_tools="$RUNNER_TEMP/retired-manager-continue-tools"
          npm install --prefix "$browser_tools" --no-save --package-lock=false playwright@1.64.0 > "$RETIRED_MANAGER_CONTINUE_OUT/browser-install.log" 2>&1
          test ! -e node_modules/playwright
          test ! -e node_modules/playwright-core
          ln -s "$browser_tools/node_modules/playwright" node_modules/playwright
          ln -s "$browser_tools/node_modules/playwright-core" node_modules/playwright-core
          node scripts/qa/soccerAgentReviewDependencies.mjs after > "$RETIRED_MANAGER_CONTINUE_OUT/dependencies-after.log" 2>&1
          cp soccer-agent-review-artifacts/dependencies-*.json "$RETIRED_MANAGER_CONTINUE_OUT/"
          node --input-type=module <<'NODE'
          import fs from 'node:fs'; import assert from 'node:assert/strict';
          const before=JSON.parse(fs.readFileSync(process.env.RETIRED_MANAGER_CONTINUE_OUT+'/dependencies-before.json'));
          const after=JSON.parse(fs.readFileSync(process.env.RETIRED_MANAGER_CONTINUE_OUT+'/dependencies-after.json'));
          assert.equal(before.packages.length,521); assert.equal(after.packages.length,521);
          assert.deepEqual(after.packages,before.packages); assert.equal(after.addedBrowserPackage,'1.64.0');
          fs.writeFileSync(process.env.RETIRED_MANAGER_CONTINUE_OUT+'/node-versions.json',JSON.stringify(process.versions,null,2)+'\n');
          console.log('All 521 locked application versions held across isolated Playwright 1.64.0 installation.');
          NODE
          node "$browser_tools/node_modules/playwright/cli.js" install --with-deps chromium > "$RETIRED_MANAGER_CONTINUE_OUT/chromium-install.log" 2>&1
          python -m pip install fonttools pillow > "$RETIRED_MANAGER_CONTINUE_OUT/fonts-install.log" 2>&1
          python -m pip freeze > "$RETIRED_MANAGER_CONTINUE_OUT/python-packages.txt"
          node -p "require('playwright/package.json').version" > "$RETIRED_MANAGER_CONTINUE_OUT/playwright-version.txt"
          find node_modules -type f -print0 | sort -z | xargs -0 sha256sum > "$RETIRED_MANAGER_CONTINUE_OUT/installed-files.sha256"
          find "$browser_tools/node_modules" -type f -print0 | sort -z | xargs -0 sha256sum > "$RETIRED_MANAGER_CONTINUE_OUT/browser-tool-files.sha256"
      - name: Actual app types and proof syntax
        run: |
          set -euo pipefail
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node_modules/.bin/tsc --noEmit -p tsconfig.app.json > "$RETIRED_MANAGER_CONTINUE_OUT/types.log" 2>&1
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node --check scripts/qa/proveRetiredManagerContinue.mjs > "$RETIRED_MANAGER_CONTINUE_OUT/syntax.log" 2>&1
      - name: Fixed original restored cases and existing home controls
        run: |
          set -euo pipefail
          : > "$RETIRED_MANAGER_CONTINUE_OUT/method.transport"
          SIM_OFFLINE_RECEIPT="$RETIRED_MANAGER_CONTINUE_OUT/method.transport" NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/qa/proveRetiredManagerContinue.mjs 2>&1 | tee "$RETIRED_MANAGER_CONTINUE_OUT/proof.log"
      - name: Existing manager and Save Keeper cases in a separate process
        run: |
          set -euo pipefail
          : > "$RETIRED_MANAGER_CONTINUE_OUT/units.transport"
          SIM_OFFLINE_RECEIPT="$RETIRED_MANAGER_CONTINUE_OUT/units.transport" NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node node_modules/vitest/vitest.mjs run src/lib/clubManagerSlots.test.ts src/test/clubManagerNoSack.test.tsx src/test/clubManagerRetire.test.tsx src/test/saveKeeper.test.ts --maxWorkers=1 --minWorkers=1 --reporter=verbose --reporter=json --outputFile.json="$RETIRED_MANAGER_CONTINUE_OUT/units.json" > "$RETIRED_MANAGER_CONTINUE_OUT/units.log" 2>&1
          node --input-type=module <<'NODE'
          import fs from 'node:fs'; import assert from 'node:assert/strict';
          const out=process.env.RETIRED_MANAGER_CONTINUE_OUT,report=JSON.parse(fs.readFileSync(out+'/units.json'));
          const wanted=['src/lib/clubManagerSlots.test.ts','src/test/clubManagerNoSack.test.tsx','src/test/clubManagerRetire.test.tsx','src/test/saveKeeper.test.ts'];
          assert.equal(report.testResults.length,wanted.length);
          const files=wanted.map(name=>{
            const matches=report.testResults.filter(file=>file.name.replaceAll('\\','/').endsWith('/'+name));
            assert.equal(matches.length,1,name); return {name,rows:matches[0].assertionResults};
          });
          const rows=files.flatMap(file=>file.rows),manager=files.slice(0,3).flatMap(file=>file.rows);
          assert.equal(manager.length,47); assert(files[3].rows.length>0);
          assert.equal(rows.length,report.numTotalTests); assert.equal(report.numPassedTests,rows.length);
          assert.equal(report.numFailedTests,0); assert.equal(report.numPendingTests,0); assert.equal(report.numTodoTests,0);
          assert.equal(report.success,true); assert(rows.every(row=>row.status==='passed'&&row.failureMessages.length===0));
          const summary={actualTotal:rows.length,managerCases:manager.length,saveKeeperCases:files[3].rows.length,files:files.map(file=>({file:file.name,actualCases:file.rows.length}))};
          fs.writeFileSync(out+'/units-summary.json',JSON.stringify(summary,null,2)+'\n');
          console.log(`All ${rows.length} existing cases completed and passed, including ${manager.length} manager cases and ${files[3].rows.length} Save Keeper cases.`);
          NODE
      - name: Production build with only inherited changelog snapshot refreshed
        id: build
        run: |
          set -euo pipefail
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" npm run build:seo > "$RETIRED_MANAGER_CONTINUE_OUT/build.log" 2>&1
          tail -n 6 "$RETIRED_MANAGER_CONTINUE_OUT/build.log"
      - name: All fifteen built-site readers
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          failed=0
          printf 'method\texit\n' > "$RETIRED_MANAGER_CONTINUE_OUT/readers.tsv"
          for method in simAdsense simBrand simHeadTags simHiddenPages simHubs simIndexNow simIndexing simInternalLinks simNoRivalNames simPrerender simPrerenderBoot simRetiredRoutes simSchema simSitemap simSnapshotAssets; do
            status=0
            SIM_OFFLINE_RECEIPT="$RETIRED_MANAGER_CONTINUE_OUT/$method.transport" NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node "scripts/$method.mjs" > "$RETIRED_MANAGER_CONTINUE_OUT/$method.log" 2>&1 || status=$?
            printf '%s\t%s\n' "$method" "$status" >> "$RETIRED_MANAGER_CONTINUE_OUT/readers.tsv"
            tail -n 2 "$RETIRED_MANAGER_CONTINUE_OUT/$method.log"
            test "$status" -eq 0 || failed=1
            test ! -s "$RETIRED_MANAGER_CONTINUE_OUT/$method.transport" || failed=1
          done
          exit "$failed"
      - name: Retain actual generated source and emitted bytes
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          git diff --exit-code HEAD -- . ':!src/data/searchKeywords.json' ':!scripts/data/guideHeadingsFrozen.json' ':!public/whats-new/index.html' ':!public/sitemap.xml' ':!scripts/data/lastmod.json'
          git diff --binary HEAD -- src/data/searchKeywords.json scripts/data/guideHeadingsFrozen.json public/whats-new/index.html public/sitemap.xml scripts/data/lastmod.json > "$RETIRED_MANAGER_CONTINUE_OUT/generated.patch"
          git status --porcelain --untracked-files=no > "$RETIRED_MANAGER_CONTINUE_OUT/source-after-build.txt"
          git ls-files -z | sort -z | xargs -0 sha256sum > "$RETIRED_MANAGER_CONTINUE_OUT/validated-source-files.sha256"
          python - <<'PY'
          import os,subprocess,zipfile
          root=os.environ['RETIRED_MANAGER_CONTINUE_OUT']
          files=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          with zipfile.ZipFile(root+'/validated-source.zip','w',zipfile.ZIP_DEFLATED) as output:
              for file in files:
                  if file: output.write(file,file)
          if os.path.isdir('dist'):
              with zipfile.ZipFile(root+'/dist.zip','w',zipfile.ZIP_DEFLATED) as output:
                  for folder,dirs,names in os.walk('dist'):
                      for name in names: output.write(os.path.join(folder,name),os.path.join(folder,name))
          PY
          if test -d dist; then find dist -type f -print0 | sort -z | xargs -0 sha256sum > "$RETIRED_MANAGER_CONTINUE_OUT/dist-files.sha256"; fi
      - name: Full unchanged download sweep, inherited I reds remain failures
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          node scripts/lib/hostLikeServer.mjs dist 4173 > "$RETIRED_MANAGER_CONTINUE_OUT/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in 1 2 3 4 5; do if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then ready=1; break; fi; sleep 1; done
          test "$ready" -eq 1
          status=0
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" ONLY= SWEEP_OFFLINE=1 BASE=http://127.0.0.1:4173 SWEEP_BASE=http://127.0.0.1:4173 node scripts/sweepWeight.mjs > "$RETIRED_MANAGER_CONTINUE_OUT/weights.log" 2>&1 || status=$?
          cat "$RETIRED_MANAGER_CONTINUE_OUT/weights.log"
          printf '%s\n' "$status" > "$RETIRED_MANAGER_CONTINUE_OUT/weights-exit.txt"
          exit "$status"
      - name: Final source dist installed and browser package holds
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          failed=0
          for pair in validated-source-files:source dist-files:dist installed-files:installed browser-tool-files:browser-tool; do
            manifest="${pair%%:*}"; label="${pair#*:}"
            if test -f "$RETIRED_MANAGER_CONTINUE_OUT/$manifest.sha256"; then
              sha256sum --check "$RETIRED_MANAGER_CONTINUE_OUT/$manifest.sha256" > "$RETIRED_MANAGER_CONTINUE_OUT/$label-holds.log" 2>&1 || failed=1
            else printf 'Missing %s manifest\n' "$manifest" > "$RETIRED_MANAGER_CONTINUE_OUT/$label-holds.log"; failed=1; fi
          done
          for receipt in method units; do test ! -s "$RETIRED_MANAGER_CONTINUE_OUT/$receipt.transport" || failed=1; done
          while IFS= read -r -d '' receipt; do test ! -s "$receipt" || failed=1; done < <(find "$RETIRED_MANAGER_CONTINUE_OUT" -type f -name '*.transport' -print0)
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retired-manager-continue-${{ github.sha }}
          path: ${{ env.RETIRED_MANAGER_CONTINUE_OUT }}
          if-no-files-found: error
          retention-days: 14
