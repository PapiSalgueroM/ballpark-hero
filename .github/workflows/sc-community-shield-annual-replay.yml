name: Soccer Career annual replay compatibility template
on:
  push:
    branches: [codex/sc-community-shield-annual-replay-20261103]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: '1'
      SIM_NETWORK: offline
      BEFORE: ${{ github.event.before }}
      ANNUAL_REPLAY_ENGINE_GIT: 'a65c8353d6e4660c1d6cec6471e17095eed35805'
      ANNUAL_REPLAY_HELPER_GIT: 'f96d2442942db57eb89d3d73d7dc18bba02ec165'
      ANNUAL_REPLAY_BINDING_GIT: '2a797be25739ebd030e5caf197273accf82d0258'
      ANNUAL_REPLAY_WRAPPER_GIT: '975b427f5b01f4e26b0dc6f43643ba4ae1a13a9f'
      ANNUAL_REPLAY_EXPECTED_PATH_COUNT: '11'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Bind the qualified parent and exact frozen repair paths
