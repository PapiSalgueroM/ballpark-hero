          capture wrapper-syntax node --check scripts/simSoccerShieldReplay.mjs
          capture agreement-syntax node --check scripts/simSeasonCentreAgreement.mjs
          capture derbies-syntax node --check scripts/simCareerDerbies.mjs
      - name: One ordinary current 14-file corpus with exact acquired identities
        run: |
