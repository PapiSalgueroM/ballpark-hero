          BODYPINS
          sha256sum --check "$OUT/selected-body-pins.sha256" > "$OUT/selected-body-pins.log"
          git ls-files -z > "$OUT/source-members.before"
          git ls-files -z | xargs -0 sha256sum > "$OUT/source.sha256"
          git ls-files --others --exclude-standard -z > "$OUT/untracked.before"; test ! -s "$OUT/untracked.before"
          WORK="$GITHUB_WORKSPACE/tmp/sc-annual-replay-$GITHUB_RUN_ID"
          test ! -e "$WORK"; mkdir -p "$WORK"
          printf 'ANNUAL_REPLAY_WORK=%s\n' "$WORK" >> "$GITHUB_ENV"
          cat > "$OUT/capture.sh" <<'CAPTURE'
          capture() {
            local tag="$1"; shift
            test ! -e "$OUT/$tag.exit"
            printf '%s\0' "$@" > "$OUT/$tag.argv"; : > "$OUT/$tag.transport"
            set +e
            SIM_OFFLINE_RECEIPT="$OUT/$tag.transport" "$@" > "$OUT/$tag.stdout" 2> "$OUT/$tag.stderr"
            local code=$?
            set -e
            printf '%s\n' "$code" > "$OUT/$tag.exit"
            tail -n 12 "$OUT/$tag.stdout"; tail -n 12 "$OUT/$tag.stderr"
            test ! -s "$OUT/$tag.transport" || return 1
            return "$code"
