          capture regression-press node scripts/simSoccerShieldPress.mjs
          capture regression-focus node scripts/simSoccerSeasonCentreFocus.mjs
          capture regression-story node scripts/simCareerStory.mjs
          capture permanent-verifier node --input-type=module <<'PERMANENT'
          import assert from 'node:assert/strict'; import fs from 'node:fs'; import path from 'node:path';
          const root = process.env.ANNUAL_REPLAY_WORK, out = process.env.OUT;
          const expected = [
            { tag: 'regression-match', children: 9, physicalControls: 6, totals: { passed: 18, ownedFailures: 6, declaredUnselectedSkips: 30, executed: 24 }, completeKey: 'complete', childrenKey: 'completedChildren', removed: 'removedSourceCopy' },
            { tag: 'regression-severe', children: 4, physicalControls: 1, totals: { passed: 3, ownedFailures: 1, declaredUnselectedSkips: 0, executed: 4 }, completeKey: 'complete', childrenKey: 'completedChildren', removed: 'removedSourceCopy' },
            { tag: 'regression-press', children: 9, physicalControls: 6, totals: { passed: 47, ownedFailures: 13, declaredUnselectedSkips: 40, executed: 60 }, completeKey: 'completed', childrenKey: 'children', removed: 'removedSourceCopy' },
            { tag: 'regression-focus', children: 7, totals: { passed: 8, ownedFailures: 3, declaredUnselectedSkips: 3, executed: 11 }, completeKey: 'complete', childrenKey: 'completedChildren', removed: 'removedSourceCopies' },
          ];
          const rows = [];
          for (const spec of expected) {
            assert.equal(Number(fs.readFileSync(path.join(out, spec.tag + '.exit'), 'utf8')), 0); assert.equal(fs.statSync(path.join(out, spec.tag + '.transport')).size, 0);
            const dir = path.join(root, spec.tag), summary = JSON.parse(fs.readFileSync(path.join(dir, 'summary.json'), 'utf8')), receipt = JSON.parse(fs.readFileSync(path.join(dir, 'receipt.json'), 'utf8'));
            assert.equal(summary.children, spec.children); assert.equal(summary.results.length, spec.children); assert.deepEqual(summary.totals, spec.totals);
            if (spec.physicalControls !== undefined) assert.equal(summary.physicalControls, spec.physicalControls);
            assert.equal(receipt[spec.completeKey], true); assert.equal(receipt[spec.childrenKey], spec.children); assert.equal(receipt[spec.removed], true);
            assert.equal(receipt.primary, null); assert.deepEqual(receipt.secondary, []);
            assert.deepEqual(JSON.parse(fs.readFileSync(path.join(dir, 'source-before.json'), 'utf8')), JSON.parse(fs.readFileSync(path.join(dir, 'source-after.json'), 'utf8')));
            rows.push({ name: spec.tag, children: spec.children, totals: spec.totals });
          }
          const story = fs.readFileSync(path.join(out, 'regression-story.stdout'), 'utf8');
          assert.equal(Number(fs.readFileSync(path.join(out, 'regression-story.exit'), 'utf8')), 0); assert.equal(fs.statSync(path.join(out, 'regression-story.transport')).size, 0);
          assert.equal(story.split(/\r?\n/).filter(line => /^simCareerStory: GREEN, 96 careers /.test(line)).length, 1);
          assert.equal(/^check .+: FAIL/m.test(story), false); assert.equal(story.includes('simCareerStory control '), false);
          for (const tag of [...expected.map(row => row.tag), 'regression-story']) {
            const raw = fs.readFileSync(path.join(out, tag + '.stdout'), 'utf8') + '\n' + fs.readFileSync(path.join(out, tag + '.stderr'), 'utf8');
            assert.equal(/Unhandled (?:Error|Rejection|Exception)|unhandledRejection|uncaughtException|ERR_MODULE_NOT_FOUND|ERR_LOAD_URL|Failed to load url|Cannot find module|SyntaxError:|ReferenceError:|TypeError:/i.test(raw), false);
          }
          fs.writeFileSync(path.join(out, 'permanent-regression-summary.json'), JSON.stringify({ simulations: rows, story: { reportedCareers: 96, optionalControlModes: 'UNRUN, existing code held' }, runtimeCounters: null, runtimeCounterCompleteness: 'UNKNOWN' }, null, 2) + '\n');
          PERMANENT
      - name: Actual agreement current, old-binding refusal and complete restore
        run: |
          set -euo pipefail
          source "$OUT/capture.sh"
          export NODE_OPTIONS="--require=$GITHUB_WORKSPACE/scripts/lib/offlineTransport.cjs"
          unset AGREEMENT_CONTROL CAREERS SEEDSET SC_EXTRA_CUPS_ENGINE US_BOARD_CONTROL_ALIAS US_BOARD_CONTROL_FILE NO_DOUBLE_SWAP
          capture agreement-leagueapps-source-proof node --input-type=module <<'SOURCEPROOF'
          import assert from 'node:assert/strict'; import fs from 'node:fs'; import { createHash } from 'node:crypto';
          const file = 'src/lib/season/soccer.ts', raw = fs.readFileSync(file), text = raw.toString('utf8');
          const from = 'const want = Math.min(row.leagueApps ?? annual.apps, room, annual.apps);';
          const to = 'const want = Math.min((row.leagueApps ?? annual.apps) + 1, room, annual.apps);';
          assert.deepEqual(Buffer.from(text), raw); assert.equal(text.split(from).length - 1, 1);
          assert.equal(text.replace(/\/\*[\s\S]*?\*\//g, '').replace(/\/\/[^\n]*/g, '').split(from).length - 1, 1);
          const changed = Buffer.from(text.replace(from, to)); assert.notDeepEqual(changed, raw);
          assert.deepEqual(Buffer.from(changed.toString('utf8').replace(to, from)), raw);
          const harness = fs.readFileSync('scripts/simSeasonCentreAgreement.mjs', 'utf8');
          const declaration = "leagueapps: [{ file: 'src/lib/season/soccer.ts', from: '" + from + "', to: '" + to + "' }]";
          assert.equal(harness.split(declaration).length - 1, 1);
          const sha = body => createHash('sha256').update(body).digest('hex');
          fs.writeFileSync(process.env.OUT + '/leagueapps-changed-source.ts.txt', changed);
          fs.writeFileSync(process.env.OUT + '/leagueapps-source-proof.json', JSON.stringify({ source: file, from, to, changed: true, beforeSha256: sha(raw), afterSha256: sha(changed), inverseSha256: sha(raw), uniqueExecutableSource: true, exactPinnedControlDeclaration: true }, null, 2) + '\n');
          SOURCEPROOF
          capture agreement-current node scripts/simSeasonCentreAgreement.mjs
          code=0; capture agreement-annualkey env AGREEMENT_CONTROL=annualkey node scripts/simSeasonCentreAgreement.mjs || code=$?
          test "$code" -eq 1; test ! -s "$OUT/agreement-annualkey.transport"
          code=0; capture agreement-leagueapps env AGREEMENT_CONTROL=leagueapps node scripts/simSeasonCentreAgreement.mjs || code=$?
          test "$code" -eq 1; test ! -s "$OUT/agreement-leagueapps.transport"
          capture agreement-restored node scripts/simSeasonCentreAgreement.mjs
          capture agreement-verifier node --input-type=module <<'AGREEMENT'
          import assert from 'node:assert/strict'; import fs from 'node:fs';
          const dir = process.env.OUT, rows = [];
          for (const name of ['agreement-current', 'agreement-annualkey', 'agreement-leagueapps', 'agreement-restored']) {
            const control = name === 'agreement-annualkey' ? 'annualkey' : name === 'agreement-leagueapps' ? 'leagueapps' : null, fault = control !== null, code = Number(fs.readFileSync(dir + '/' + name + '.exit', 'utf8'));
            assert.equal(code, fault ? 1 : 0); assert.equal(fs.statSync(dir + '/' + name + '.transport').size, 0);
            const raw = fs.readFileSync(dir + '/' + name + '.stdout', 'utf8') + '\n' + fs.readFileSync(dir + '/' + name + '.stderr', 'utf8');
            assert.equal(/Unhandled (?:Error|Rejection|Exception)|unhandledRejection|uncaughtException|ERR_MODULE_NOT_FOUND|ERR_LOAD_URL|Cannot find module|Failed to load url|SyntaxError:|ReferenceError:|TypeError:/i.test(raw), false);
            const failures = raw.split(/\r?\n/).filter(line => line.startsWith('FAIL '));
            if (control === 'annualkey') {
              assert(raw.includes('CONTROL annualkey: src/lib/season/soccer.ts patched in the bundle only'));
              assert(failures.some(line => line.startsWith('FAIL item 16 annual replay key:')));
              assert(failures.some(line => line === 'FAIL independent checker: 16 annual replay key'));
              assert(failures.every(line => line.startsWith('FAIL item 16 annual replay key:') || line === 'FAIL independent checker: 16 annual replay key'));
              assert(/simSeasonCentreAgreement: \d+ checks, [1-9]\d* failed \(control annualkey\)/.test(raw));
            } else if (control === 'leagueapps') {
              assert(raw.includes('CONTROL leagueapps: src/lib/season/soccer.ts patched in the bundle only'));
              assert(failures.some(line => line.startsWith('FAIL item 1 apps:')));
              assert(failures.some(line => line === 'FAIL independent checker: 1 apps'));
              assert(failures.every(line => line.startsWith('FAIL item 1 apps:') || line === 'FAIL independent checker: 1 apps'));
              assert(/simSeasonCentreAgreement: \d+ checks, [1-9]\d* failed \(control leagueapps\)/.test(raw));
            } else { assert.deepEqual(failures, []); assert(/simSeasonCentreAgreement: \d+ checks, 0 failed/.test(raw)); }
            rows.push({ name, rawExit: code, failures, runtimeCounters: null, runtimeCounterCompleteness: 'UNKNOWN' });
          }
          fs.writeFileSync(dir + '/agreement-summary.json', JSON.stringify(rows, null, 2) + '\n');
          AGREEMENT
      - name: Actual Derbies current, exact old-source reconstruction refusal and restore
        run: |
          set -euo pipefail
          source "$OUT/capture.sh"
          export NODE_OPTIONS="--require=$GITHUB_WORKSPACE/scripts/lib/offlineTransport.cjs"
          for key in $(compgen -e SIM_DERBY_); do unset "$key"; done
          capture derbies-current node scripts/simCareerDerbies.mjs
          copy="$GITHUB_WORKSPACE/scripts/__control_shield_derbies_${GITHUB_RUN_ID}_$.mjs"
          test ! -e "$copy"
          cleanup_derby() {
            local primary=$? cleanup=0
            trap - EXIT
            if test -f "$copy"; then
              printf '%s  %s\n' bee1e8c06dfb0e18446dc8f7c55f47600f4465be5a969c8f8fdc2762d699ad53 "$copy" | sha256sum --check > "$OUT/derbies-old-copy-after.log" 2>&1 || cleanup=1
              rm -- "$copy" || cleanup=1
            fi
            printf '%s\n' "$cleanup" > "$OUT/derbies-copy-cleanup.exit"
            if test "$primary" -ne 0; then exit "$primary"; fi
            exit "$cleanup"
          }
          trap cleanup_derby EXIT
          test "$(git rev-parse HEAD^:scripts/simCareerDerbies.mjs)" = ac7f8c6e73f6cea44d0b2a67888682b1c6445b93
          git cat-file blob HEAD^:scripts/simCareerDerbies.mjs > "$copy"
          printf '%s  %s\n' bee1e8c06dfb0e18446dc8f7c55f47600f4465be5a969c8f8fdc2762d699ad53 "$copy" | sha256sum --check > "$OUT/derbies-old-copy-before.log"
          cp "$copy" "$OUT/Derbies.before-annual-replay.mjs.txt"
          code=0; capture derbies-old node "$copy" || code=$?
          test "$code" -eq 1; test ! -s "$OUT/derbies-old.transport"
          capture derbies-restored node scripts/simCareerDerbies.mjs
          capture derbies-verifier node --input-type=module <<'DERBIES'
          import assert from 'node:assert/strict'; import fs from 'node:fs';
          const dir = process.env.OUT, rows = [];
          for (const name of ['derbies-current', 'derbies-old', 'derbies-restored']) {
            const fault = name === 'derbies-old', code = Number(fs.readFileSync(dir + '/' + name + '.exit', 'utf8'));
            assert.equal(code, fault ? 1 : 0); assert.equal(fs.statSync(dir + '/' + name + '.transport').size, 0);
            const raw = fs.readFileSync(dir + '/' + name + '.stdout', 'utf8') + '\n' + fs.readFileSync(dir + '/' + name + '.stderr', 'utf8');
            assert.equal(/Unhandled (?:Error|Rejection|Exception)|unhandledRejection|uncaughtException|ERR_MODULE_NOT_FOUND|ERR_LOAD_URL|Cannot find module|Failed to load url|SyntaxError:|ReferenceError:|TypeError:/i.test(raw), false);
            const lines = raw.split(/\r?\n/).map(line => line.trim()), failures = lines.filter(line => line.startsWith('FAIL: '));
            if (fault) {
              assert.equal(failures.length, 1);
              assert.match(failures[0], /^FAIL: [1-9]\d* seasons store derbies the module would not draw from their own inputs and the engine's elite list$/);
              assert.equal(lines.filter(line => line === 'simCareerDerbies: 1 failures, sections 4 red').length, 1);
            } else {
              assert.deepEqual(failures, []);
              assert.equal(lines.filter(line => line === 'simCareerDerbies: all 8 sections green').length, 1);
            }
            rows.push({ name, rawExit: code, runtimeCounters: null, runtimeCounterCompleteness: 'UNKNOWN' });
          }
          fs.writeFileSync(dir + '/derbies-summary.json', JSON.stringify(rows, null, 2) + '\n');
          DERBIES
      - name: Existing executable harness anchor admission
        run: |
          set -euo pipefail
          source "$OUT/capture.sh"
          export NODE_OPTIONS="--require=$GITHUB_WORKSPACE/scripts/lib/offlineTransport.cjs"
          unset ANCHOR_CONTROL
          capture anchors-current node scripts/simHarnessAnchors.mjs
          capture anchors-strip env ANCHOR_CONTROL=strip node scripts/simHarnessAnchors.mjs
          capture anchors-verifier node --input-type=module <<'ANCHORS'
          import assert from 'node:assert/strict'; import fs from 'node:fs';
          const dir = process.env.OUT;
          for (const name of ['anchors-current', 'anchors-strip']) {
            assert.equal(Number(fs.readFileSync(dir + '/' + name + '.exit', 'utf8')), 0);
            assert.equal(fs.statSync(dir + '/' + name + '.transport').size, 0);
            const raw = fs.readFileSync(dir + '/' + name + '.stdout', 'utf8') + '\n' + fs.readFileSync(dir + '/' + name + '.stderr', 'utf8');
            assert.equal(/Unhandled (?:Error|Rejection|Exception)|unhandledRejection|uncaughtException|ERR_MODULE_NOT_FOUND|SyntaxError:|ReferenceError:|TypeError:/i.test(raw), false);
            const failures = raw.split(/\r?\n/).map(line => line.trim()).filter(line => line.startsWith('FAIL '));
            if (name === 'anchors-current') {
              assert.deepEqual(failures, []); assert(raw.includes('simHarnessAnchors: green. Every harness parses and none carries an unmatchable anchor.'));
            } else {
              assert.equal(failures.length, 1); assert(failures[0].startsWith('FAIL simFightCareer.mjs reads '));
              assert(raw.includes('[control strip applied to a copy of simFightCareer.mjs]'));
              assert(raw.includes('control "strip": the planted fault in simFightCareer.mjs was named and nothing else was, the check works'));
            }
          }
          console.log('ANNUAL_REPLAY_ANCHORS: actual healthy source fence and sole real strip control');
          ANCHORS
      - name: Always retain exact current source and dependency custody
        if: always()
        run: |
          set -euo pipefail
          if test -z "${OUT:-}" || test ! -d "$OUT"; then exit 1; fi
          status=0
          if test -f "$OUT/source.sha256"; then sha256sum --check "$OUT/source.sha256" > "$OUT/source-held.log" 2>&1 || status=1; else status=1; fi
          git ls-files -z > "$OUT/source-members.after"
          cmp "$OUT/source-members.before" "$OUT/source-members.after" > "$OUT/source-members.log" 2>&1 || status=1
          git diff --exit-code > "$OUT/source-diff.log" 2>&1 || status=1
          git ls-files --others --exclude-standard -z > "$OUT/untracked.after"; test ! -s "$OUT/untracked.after" || status=1
          if test -f "$OUT/dependency.sha256"; then
            sha256sum --check "$OUT/dependency.sha256" > "$OUT/dependency-held.log" 2>&1 || status=1
            find node_modules -path node_modules/.vite -prune -o -type f -print0 | sort -z > "$OUT/dependency-members.after"
            cmp "$OUT/dependency-members.before" "$OUT/dependency-members.after" > "$OUT/dependency-members.log" 2>&1 || status=1
          else status=1; fi
          if test -n "${ANNUAL_REPLAY_WORK:-}" && test -d "$ANNUAL_REPLAY_WORK"; then cp -a "$ANNUAL_REPLAY_WORK" "$OUT/controlled-work"; fi
          find "$OUT" -maxdepth 1 -name '*.transport' -type f -printf '%f %s\n' | sort > "$OUT/outer-transports.txt"
          if find "$OUT" -maxdepth 1 -name '*.transport' -type f ! -size 0 | grep -q .; then status=1; fi
          # Full successful execution has 27 guarded outer commands. Partial runs retain only actual receipts.
          if test -f "$OUT/anchors-verifier.exit"; then test "$(wc -l < "$OUT/outer-transports.txt")" -eq 27 || status=1; fi
          printf '%s\n' "$status" > "$OUT/always-holds.exit"
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sc-annual-replay-${{ github.run_id }}
          path: ${{ runner.temp }}/sc-annual-replay-${{ github.run_id }}/
          retention-days: 14
