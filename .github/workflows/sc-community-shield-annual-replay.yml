          A	scripts/simSoccerShieldReplay.mjs
          M	src/lib/season/soccer.ts
          M	src/lib/soccerCareerEngine.ts
          M	src/lib/soccerCareerExtraCups.ts
          A	src/test/soccerCommunityShieldAnnualRating.test.ts
          A	src/test/soccerCommunityShieldLegacyReplay.test.tsx
          A	src/test/soccerCommunityShieldReplay.test.ts
          M	src/test/soccerSeasonCentreFocus.test.tsx
          PATHS
          cmp "$OUT/changed-paths.txt" "$OUT/expected-paths.txt"
          test "$(wc -l < "$OUT/changed-paths.txt")" -eq "$ANNUAL_REPLAY_EXPECTED_PATH_COUNT"
          cat > "$OUT/input-pins.txt" <<'PINS'
