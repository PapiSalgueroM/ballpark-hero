          src/test/soccerSeasonCentreFocus.test.tsx 9cab74d0f4d0160c2e53648d4145aaa30127a099
          BEFOREPINS
          while read -r file blob; do test "$(git rev-parse "HEAD^:$file")" = "$blob"; done < "$OUT/before-pins.txt"
          cat > "$OUT/selected-body-pins.sha256" <<'BODYPINS'
          bc3c8b79f2e910a2ff730f216e1aaa7fb532139d663b45e956d43c9a92539934  src/lib/soccerCareerExtraCups.ts
          2ca1ff73bc5f93b623205554d70e5fa01ed6cdbfb1b379e7475ed4969921f4ee  src/lib/season/soccer.ts
          f009782c9f7a384881692239c47af266a834eaa1104ce86662ab53ec67756788  src/lib/soccerCareerEngine.ts
          a22fafb72397e86ed17f4f04405537575267ffd06c9ba84eb94b808d6b2b03fc  src/test/soccerSeasonCentreFocus.test.tsx
          7196c5b81d3960e41d88f9e6d8e77756ab683676bd0a218d86de4fae93ab4031  scripts/simSeasonCentreAgreement.mjs
