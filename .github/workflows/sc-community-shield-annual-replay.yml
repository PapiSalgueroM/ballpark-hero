          PINS
          while read -r file blob; do test "$(git rev-parse "HEAD:$file")" = "$blob"; done < "$OUT/input-pins.txt"
          test "$(git rev-parse HEAD:src/lib/soccerCareerEngine.ts)" = "$ANNUAL_REPLAY_ENGINE_GIT"
          test "$(git rev-parse HEAD:src/lib/soccerCareerExtraCups.ts)" = "$ANNUAL_REPLAY_HELPER_GIT"
          test "$(git rev-parse HEAD:src/lib/season/soccer.ts)" = "$ANNUAL_REPLAY_BINDING_GIT"
          test "$(git rev-parse HEAD:scripts/simSoccerShieldReplay.mjs)" = "$ANNUAL_REPLAY_WRAPPER_GIT"
          cat > "$OUT/before-pins.txt" <<'BEFOREPINS'
          scripts/simCareerDerbies.mjs ac7f8c6e73f6cea44d0b2a67888682b1c6445b93
          scripts/simSeasonCentreAgreement.mjs 906bbacecc4a002b9879092b3c5705e3ce57d1d5
          src/lib/season/soccer.ts 819e2d97d0435c4ef29a4c1ed441511a6906e986
