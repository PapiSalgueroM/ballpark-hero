          source "$OUT/capture.sh"
          export NODE_OPTIONS="--require=$GITHUB_WORKSPACE/scripts/lib/offlineTransport.cjs"
          unset SC_EXTRA_CUPS_ENGINE US_BOARD_CONTROL_ALIAS US_BOARD_CONTROL_FILE NO_DOUBLE_SWAP
          capture ordinary node node_modules/vitest/vitest.mjs run \
            src/test/careerRecordedStats.test.tsx src/test/careerStory.test.tsx \
            src/test/soccerCommunityShieldAcceptance.test.ts src/test/soccerCommunityShieldMatch.test.ts \
            src/test/soccerCommunityShieldRules.test.ts src/test/soccerCommunityShieldScreens.test.tsx \
            src/test/soccerCommunityShieldSevere.test.ts src/test/soccerCommunityShieldUiAcceptance.test.tsx \
            src/test/soccerSeasonCentreFocus.test.tsx src/test/soccerShieldPress.test.ts \
            src/test/soccerPressRoomReadAsAbsent.test.tsx \
            src/test/soccerCommunityShieldReplay.test.ts src/test/soccerCommunityShieldAnnualRating.test.ts \
            src/test/soccerCommunityShieldLegacyReplay.test.tsx \
            --maxWorkers=1 --minWorkers=1 --reporter=verbose --reporter=json --outputFile="$OUT/ordinary.json"
          capture ordinary-verifier node --input-type=module <<'VERIFY'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          const out = process.env.OUT, report = JSON.parse(fs.readFileSync(out + '/ordinary.json', 'utf8'));
          const suffix = file => file.replaceAll('\\', '/').split('/src/').slice(-1).map(value => 'src/' + value)[0];
          const suites = report.testResults.map(suite => ({ file: suffix(suite.name), rows: suite.assertionResults }));
          const rows = suites.flatMap(suite => suite.rows.map(row => ({ file: suite.file, fullName: row.fullName, status: row.status, failureMessages: row.failureMessages })));
          assert.equal(report.success, true); assert.equal(suites.length, 14); assert.equal(rows.length, 85);
          assert.equal(report.numTotalTests, 85); assert.equal(report.numPassedTests, 85); assert.equal(report.numFailedTests, 0); assert.equal(report.numPendingTests, 0); assert.equal(report.numTodoTests, 0);
          for (const row of rows) { assert.equal(row.status, 'passed'); assert.deepEqual(row.failureMessages, []); }
          const identitySha256 = createHash('sha256').update(rows.map(row => row.file + '\0' + row.fullName + '\0' + row.status).sort().join('\n')).digest('hex');
          assert.equal(identitySha256, '764707d47f9dd7eaa652bf5f6e7c17f29d10771720e53a536d2e1a02d5ac32cc');
          const byFile = (a, b) => a.file < b.file ? -1 : a.file > b.file ? 1 : 0;
          assert.deepEqual(suites.map(suite => ({ file: suite.file, cases: suite.rows.length })).sort(byFile), [{"file":"src/test/careerRecordedStats.test.tsx","cases":8},{"file":"src/test/careerStory.test.tsx","cases":13},{"file":"src/test/soccerCommunityShieldAcceptance.test.ts","cases":2},{"file":"src/test/soccerCommunityShieldMatch.test.ts","cases":6},{"file":"src/test/soccerCommunityShieldRules.test.ts","cases":8},{"file":"src/test/soccerCommunityShieldScreens.test.tsx","cases":6},{"file":"src/test/soccerCommunityShieldSevere.test.ts","cases":1},{"file":"src/test/soccerCommunityShieldUiAcceptance.test.tsx","cases":3},{"file":"src/test/soccerPressRoomReadAsAbsent.test.tsx","cases":19},{"file":"src/test/soccerSeasonCentreFocus.test.tsx","cases":2},{"file":"src/test/soccerShieldPress.test.ts","cases":9},{"file":"src/test/soccerCommunityShieldReplay.test.ts","cases":5},{"file":"src/test/soccerCommunityShieldAnnualRating.test.ts","cases":2},{"file":"src/test/soccerCommunityShieldLegacyReplay.test.tsx","cases":1}].sort(byFile));
          const newExpected = [{"file":"src/test/soccerCommunityShieldReplay.test.ts","fullName":"Soccer Career Shield annual league replay SC_SHIELD_REPLAY_ANNUAL: keeps the exact annual key and complete league reconstruction","status":"passed"},{"file":"src/test/soccerCommunityShieldReplay.test.ts","fullName":"Soccer Career Shield annual league replay SC_SHIELD_REPLAY_GRADE: uses the recorded annual grade when the opener changes the rounded mean","status":"passed"},{"file":"src/test/soccerCommunityShieldReplay.test.ts","fullName":"Soccer Career Shield annual league replay SC_SHIELD_REPLAY_LEGACY: keeps a valid selected legacy cup readable without inventing league proof","status":"passed"},{"file":"src/test/soccerCommunityShieldReplay.test.ts","fullName":"Soccer Career Shield annual league replay SC_SHIELD_REPLAY_UNSELECTED: preserves no-opener and unselected season keys and whole plans","status":"passed"},{"file":"src/test/soccerCommunityShieldReplay.test.ts","fullName":"Soccer Career Shield annual league replay SC_SHIELD_REPLAY_PROOF: refuses malformed proof and keeps a selected zero-annual-app opener separate","status":"passed"},{"file":"src/test/soccerCommunityShieldAnnualRating.test.ts","fullName":"Soccer Career Community Shield annual rating capture SC_SHIELD_ANNUAL_RATING_NORMAL: records the exact annual grade before the normal opening merge","status":"passed"},{"file":"src/test/soccerCommunityShieldAnnualRating.test.ts","fullName":"Soccer Career Community Shield annual rating capture SC_SHIELD_ANNUAL_RATING_SEVERE: records the exact annual grade before the severe opening merge","status":"passed"},{"file":"src/test/soccerCommunityShieldLegacyReplay.test.tsx","fullName":"Community Shield legacy league replay boundary SC_SHIELD_LEGACY_VISIBLE: keeps the old saved cup inspectable while refusing unproved league games","status":"passed"}], newFiles = new Set(newExpected.map(row => row.file));
          assert.deepEqual(rows.filter(row => newFiles.has(row.file)).map(row => row.file + '\0' + row.fullName + '\0' + row.status).sort(), newExpected.map(row => row.file + '\0' + row.fullName + '\0' + row.status).sort());
          const runtimeCounters = Object.fromEntries(['numUnhandledErrors', 'numRuntimeErrorTestSuites', 'numRuntimeErrorTests'].map(key => [key, report[key] ?? null]));
          for (const value of Object.values(runtimeCounters)) if (value !== null) assert.equal(value, 0);
          for (const key of ['errors', 'unhandledErrors']) if (report[key] !== undefined) assert.deepEqual(report[key], []);
          const raw = fs.readFileSync(out + '/ordinary.stdout', 'utf8') + '\n' + fs.readFileSync(out + '/ordinary.stderr', 'utf8');
          const detectedRuntimeError = /(?:Unhandled (?:Errors?|Rejection|Exception)|unhandledRejection|uncaughtException|Vitest caught \d+ unhandled|ERR_MODULE_NOT_FOUND|ERR_LOAD_URL|Failed to load url|Cannot find (?:module|package)|SyntaxError:|ReferenceError:|TypeError:)/i.test(raw);
          assert.equal(detectedRuntimeError, false);
          fs.writeFileSync(out + '/ordinary-summary.json', JSON.stringify({ scope: 'Focused ordinary annual replay corpus only', files: suites.length, executed: rows.length, passed: report.numPassedTests, failed: report.numFailedTests, skipped: report.numPendingTests, identitySha256, runtimeCounters, runtimeCounterCompleteness: Object.values(runtimeCounters).some(value => value === null) ? 'UNKNOWN' : 'REPORTED', detectedRuntimeError }, null, 2) + '\n');
          console.log('ANNUAL_REPLAY_ORDINARY: 85 exact passed identities across 14 files, no new skips');
          VERIFY
      - name: Physical engine and binding source controls with raw inverse custody
        run: |
          set -euo pipefail
          source "$OUT/capture.sh"
          export NODE_OPTIONS="--require=$GITHUB_WORKSPACE/scripts/lib/offlineTransport.cjs"
          export SC_SHIELD_REPLAY_OUT="$ANNUAL_REPLAY_WORK/wrapper"
          test ! -e "$SC_SHIELD_REPLAY_OUT"
          capture annual-replay-controls node scripts/simSoccerShieldReplay.mjs
          capture replay-verifier node --input-type=module <<'REPLAY'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import { createHash } from 'node:crypto';
          const out = process.env.SC_SHIELD_REPLAY_OUT, read = name => JSON.parse(fs.readFileSync(path.join(out, name), 'utf8'));
          const summary = read('summary.json'), receipt = read('receipt.json');
          assert.equal(summary.schemaVersion, 1); assert.equal(summary.children, 6); assert.equal(summary.physicalControls, 3);
          assert.deepEqual(summary.totals, { passed: 24, ownedFailures: 3, declaredUnselectedSkips: 21, executed: 27 });
          assert.equal(receipt.complete, true); assert.equal(receipt.completedChildren, 6); assert.equal(receipt.removedSourceCopies, true);
          assert.equal(receipt.primary, null); assert.deepEqual(receipt.secondary, []);
          const names = ['current', 'healthy-copies', 'old-replay-binding', 'omit-normal-grade', 'omit-severe-grade', 'restored-copies'];
          const markers = { 'old-replay-binding': 'SC_SHIELD_REPLAY_ANNUAL_KEY', 'omit-normal-grade': 'SC_SHIELD_ANNUAL_RATING_NORMAL_MISSING', 'omit-severe-grade': 'SC_SHIELD_ANNUAL_RATING_SEVERE_MISSING' };
          assert.deepEqual(summary.results.map(row => row.name), names);
          for (const result of summary.results) {
            const name = result.name, fault = markers[name], reportBody = fs.readFileSync(path.join(out, name + '.vitest.json')), report = JSON.parse(reportBody);
            assert.equal(createHash('sha256').update(reportBody).digest('hex'), result.rawReportSha256);
            const process = read(name + '.process.json'); assert.equal(process.signal, null); assert.equal(process.error, null);
            assert.equal(process.status, fault ? 1 : 0); assert.equal(Number(fs.readFileSync(path.join(out, name + '.exit'), 'utf8')), fault ? 1 : 0);
            assert.equal(fs.statSync(path.join(out, name + '.transport')).size, 0);
            const rows = report.testResults.flatMap(suite => suite.assertionResults);
            assert.equal(rows.length, 8); assert.equal(report.testResults.length, 3);
            assert.equal(report.numPassedTests, fault ? 0 : 8); assert.equal(report.numFailedTests, fault ? 1 : 0); assert.equal(report.numPendingTests, fault ? 7 : 0);
            assert.equal(result.detectedRuntimeError, false);
            if (fault) {
              const failed = rows.filter(row => row.status === 'failed'); assert.equal(failed.length, 1);
              const first = failed[0].failureMessages[0].replace(/\x1b\[[0-9;]*m/g, '').split(/\r?\n/).find(line => line.trim()).trim();
              assert(first.startsWith('AssertionError: ' + fault + ':'));
              const edit = read(name + '.edit.json'); assert.notEqual(edit.changed.sha256, edit.original.sha256);
              assert.deepEqual(edit.inverse, edit.original); assert.equal(edit.physicalRestoreSha256, edit.original.sha256);
            } else for (const row of rows) { assert.equal(row.status, 'passed'); assert.deepEqual(row.failureMessages, []); }
          }
          assert.deepEqual(read('source-before.json'), read('source-after.json'));
          console.log('ANNUAL_REPLAY_CONTROL: 6 raw children, 24 healthy, 3 primary-owned, 21 unselected, 27 executed; source and copies held');
          REPLAY
      - name: Existing clean Shield permanent simulations once each
