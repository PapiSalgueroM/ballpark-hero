          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$BEFORE" = 0000000000000000000000000000000000000000
          test "$(git rev-parse HEAD^)" = d035818af734d06d517603dfaeb8946d1509d597
          test "$(git rev-parse 'HEAD^^{tree}')" = d9d318f7c4170b28c158af144653bed232841bd4
          for pin in "$ANNUAL_REPLAY_ENGINE_GIT" "$ANNUAL_REPLAY_HELPER_GIT" "$ANNUAL_REPLAY_BINDING_GIT" "$ANNUAL_REPLAY_WRAPPER_GIT"; do [[ "$pin" =~ ^[a-f0-9]{40}$ ]]; done
