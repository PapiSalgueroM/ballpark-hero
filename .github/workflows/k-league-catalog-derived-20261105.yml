          const routes=['/career-ladder','/dart-draft','/soccer-career','/search','/who-am-i','/soccer','/club-manager','/cbb-dynasty'],paths=[...names.map(n=>'src/data/seoMetaParts/'+n),'src/data/searchKeywords.json',...routes.map(r=>'public'+r+'/index.html'),'public/sitemap.xml','scripts/data/lastmod.json'];assert.equal(paths.length,44);assert.equal(new Set(paths).size,44);
          const originals=paths.map(p=>{const b=fs.readFileSync(p),dest=out+'/original/'+p;fs.mkdirSync(path.dirname(dest),{recursive:true});fs.writeFileSync(dest,b,{flag:'wx'});assert(fs.readFileSync(dest).equals(b));return{path:p,bytes:b.length,sha256:sha(b),gitBlob:blob(b)};});fs.writeFileSync(out+'/original-output-pins.json',JSON.stringify(originals,null,2)+'\n',{flag:'wx'});
          fs.writeFileSync(out+'/source-identity.json',JSON.stringify({QA:{commit:git('rev-parse','HEAD'),tree:git('rev-parse','HEAD^{tree}'),workflowGit:blob(fs.readFileSync(workflow))},product:{commit:process.env.PRODUCT_CORE,tree:process.env.PRODUCT_TREE},parent:{commit:parent,tree:parentTree},canonicalRoles:roles,sourcePins:pins,exactTwoLiteralWholeInverses:true,scope:'Only source composition. No derived outputs, build/native/public qualification at preflight.'},null,2)+'\n',{flag:'wx'});fs.copyFileSync(workflow,out+'/workflow.yml');
          PINS
          git rev-parse HEAD HEAD^{tree} > "$OUT/source.txt"
          git diff --name-status --no-renames HEAD^ HEAD > "$OUT/qa-delta.txt"
          git ls-files -z | sort -z | xargs -0 sha256sum > "$OUT/source-before.sha256"
          git ls-files -s > "$OUT/index-before.txt"
          git ls-files -z > "$OUT/tracked-before.bin"
          for lock in package.json package-lock.json bun.lock bun.lockb; do if test -f "$lock"; then sha256sum "$lock"; fi; done > "$OUT/locks-before.sha256"
          git status --porcelain=v1 --untracked-files=all > "$OUT/status-before.txt"
          test ! -s "$OUT/status-before.txt"
      - name: Install held app and required build tools
        run: |
          set -euo pipefail
          test "$(bun --version)" = 1.4.4
          bun --version > "$QA_OUT/logs/bun-version.log"
          node --version > "$QA_OUT/logs/node-version.log"
          bun install --frozen-lockfile > "$QA_OUT/logs/bun-install.log" 2>&1
          node -p "JSON.stringify({router:require('react-router-dom/package.json').version,vite:require('vite/package.json').version,rollup:JSON.parse(require('fs').readFileSync('node_modules/rollup/package.json','utf8')).version})" > "$QA_OUT/logs/build-versions.json"
          git diff --exit-code HEAD -- package.json package-lock.json bun.lock bun.lockb
          npm install --prefix "$RUNNER_TEMP/cm-team-picker-original-tools" --package-lock=false --no-audit --no-fund playwright@1.64.0 > "$QA_OUT/logs/playwright-install.log" 2>&1
