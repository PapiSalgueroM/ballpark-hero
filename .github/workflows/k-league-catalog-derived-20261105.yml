name: Derive the corrected K League catalogue copy without final-build credit
on:
  push:
    branches: [codex/k-league-catalog-derived-20261105]
permissions:
  contents: read
concurrency:
  group: k-league-catalog-derived-${{ github.ref }}
  cancel-in-progress: false
env:
  CI: '1'
  SIM_NETWORK: offline
  TZ: UTC
  PRODUCT_CORE: 5f9f41d8ef0a4d025b3da1f55e5720b6e82c1710
  PRODUCT_TREE: d99664b6535b5addf08172fcb9ebc03e89301a9c
  GENERATED_POOL_BLOB: 522399403d4a5816680d0d5d2e19e3fda650d71d
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ENGINES: chromium
      SEO_SPLIT_BASE_REF: HEAD
      SWEEP_OFFLINE: '1'
      PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Bind the two canonical catalogue corrections and capture all derived targets
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/k-league-catalog-derived"
          test ! -e "$OUT"
          mkdir -p "$OUT/logs" "$OUT/transport" "$OUT/original" "$OUT/generated" "$OUT/commands" "$OUT/controls"
          printf 'QA_OUT=%s\n' "$OUT" >> "$GITHUB_ENV"
          export QA_OUT="$OUT"
          node --input-type=module <<'PINS'
