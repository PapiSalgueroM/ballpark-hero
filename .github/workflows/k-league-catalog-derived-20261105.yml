          const roles=[{"path":"src/data/gameRegistry.ts","beforeGitBlob":"f560b40a74d1468ac72dfde4ee6fec6635a9a255","operations":[{"offset":3912,"before":"Manage any of 454 real clubs across 27 leagues, today or in a real past season: negotiations, board objectives, trophies and the sack race","after":"Manage a club across current and historical leagues: negotiations, board objectives, trophies and the sack race","count":1}],"afterGitBlob":"d35291bfe6b3681f0c14dc8879a894fe70925c64"},{"path":"src/data/seoMeta.ts","beforeGitBlob":"cf7a5142e59b97048d27b5ece9a6588a92073728","operations":[{"offset":3537,"before":"Manage any of 454 real clubs across 27 leagues, today or in a real past season. Transfers, tactics, the board and the sack race. Free soccer management sim.","after":"Manage a club across current and historical leagues. Transfers, tactics, the board and the sack race. Free soccer management sim.","count":1}],"afterGitBlob":"10e64dfc8dee9e75603bf38849580d609d8e10e1"}],pins=[["scripts/genSeoMetaParts.mjs","4ea8d8661a3d99ae44f55aec38b443a80ca43318"],["scripts/genSearchKeywords.mjs","d0a237a766215631a81d7cd6789f1fa632d3f9b7"],["scripts/simSiteSearch.mjs","6be8e1603e84e1a8799099e1558c415bc87a42a7"],["scripts/prerender.mjs","3d4fb1e595413c48c7bd65b927730d25cc3a2e18"],["scripts/lib/prerenderClock.mjs","da0aa64a36581e239563bccc6844713930e1fe0d"],["scripts/genSitemap.mjs","08344dfc84be3ca24533c8d56e0f229b02b93c0a"],["scripts/data/guideHeadingsFrozen.json","fa969a7bd126f05b60922dd9ea797b18571122fd"],["scripts/simGuideHeadings.mjs","fa23f7e6ace62d8e71e3585ab6afbe4dbef0f674"],["src/data/gameContent/clubManagement.ts","0e1fa56534a005204a6e53df875d7ed5e7f8692f"],["src/data/gameContent/soccer2.ts","7576d973cf9a4a0aa7a9413eeb99130ad81f4f88"],["scripts/lib/offlineTransport.cjs","0fda542a2649fe5da937c6976fd0f5b6073e74b6"],["package.json","2ff64986fb76ebc51b706f2fd24765768874008a"],["package-lock.json","97d6f12a052f25f400462938c241789a083f0bfe"],["tsconfig.app.json","51f581dd91641b4c1f1219f646788e73cf6bf00c"]];assert.deepEqual(git('diff','--name-status','--no-renames',parent,process.env.PRODUCT_CORE).split('\n'),roles.map(r=>'M\t'+r.path).sort());
          for(const row of roles){const old=bytes('show',parent+':'+row.path),actual=fs.readFileSync(row.path),o=row.operations[0],s=old.toString('utf8');assert.equal(blob(old),row.beforeGitBlob);assert.equal(blob(actual),row.afterGitBlob);assert.equal(s.split(o.before).length-1,1);assert.equal(s.indexOf(o.before),o.offset);assert(actual.equals(Buffer.from(s.slice(0,o.offset)+o.after+s.slice(o.offset+o.before.length))));const back=actual.toString('utf8');assert(Buffer.from(back.slice(0,o.offset)+o.before+back.slice(o.offset+o.after.length)).equals(old));const dest=out+'/canonical-before/'+row.path;fs.mkdirSync(path.dirname(dest),{recursive:true});fs.writeFileSync(dest,old,{flag:'wx'});}
