name: Soccer Connect4 helper comment closure
on:
  push:
    branches: [codex/soccer-connect4-request-ownership-qa-20261106]
permissions:
  contents: read
  actions: read
jobs:
  closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      SIM_NETWORK: offline
      SIM_OFFLINE_RECEIPT: c4-header-closure/offline.log
      C4_REFERENCE_ARTIFACT: '13486287954'
      C4_REFERENCE_ZIP: 'cc187c517485e48f5a2ccb758fb14a8ee6724bfb3293fff7698fe67337f32c17'
      C4_REFERENCE_TAR: '88e7cfd4239dbebd41a2461e1630878c78c5b6693f79bc3405a32ae7aca7e5e9'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Locked dependencies and clean source receipts
        run: |
          set -euo pipefail
          [[ "$C4_REFERENCE_ARTIFACT" =~ ^[0-9]+$ ]]
          [[ "$C4_REFERENCE_ZIP" =~ ^[a-f0-9]{64}$ ]]
          [[ "$C4_REFERENCE_TAR" =~ ^[a-f0-9]{64}$ ]]
          test ! -e c4-header-closure
          mkdir c4-header-closure
          touch c4-header-closure/offline.log
          git rev-parse HEAD > c4-header-closure/head.txt
          git rev-parse 'HEAD^{tree}' > c4-header-closure/tree.txt
          git ls-files -s > c4-header-closure/source-before.txt
          sha256sum package.json package-lock.json > c4-header-closure/locks-before.txt
          git fetch --no-tags --depth=1 origin 8382511deed6d212733910091ffea94d3838ff06
          git diff --exit-code HEAD -- .
          npm ci
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const lock=JSON.parse(fs.readFileSync('package-lock.json'));
          const rows=Object.keys(lock.packages).filter(p=>p.startsWith('node_modules/')&&fs.existsSync(p+'/package.json')).map(p=>[p,JSON.parse(fs.readFileSync(p+'/package.json')).version]);
          assert.equal(rows.length,521);for(const[p,v]of rows)assert.equal(v,lock.packages[p].version,p);fs.writeFileSync('c4-header-closure/installed-before.json',JSON.stringify(rows));
          NODE
      - name: Proper app types
        run: node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee c4-header-closure/types.log
      - name: Pinned reference qualification artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/PapiSalgueroM/ballpark-hero/actions/runs/42182482124" > c4-header-closure/reference-run.json
          gh api "repos/PapiSalgueroM/ballpark-hero/actions/artifacts/$C4_REFERENCE_ARTIFACT" > c4-header-closure/reference-artifact.json
          gh api "repos/PapiSalgueroM/ballpark-hero/actions/artifacts/$C4_REFERENCE_ARTIFACT/zip" > "$RUNNER_TEMP/c4-reference.zip"
          echo "$C4_REFERENCE_ZIP  $RUNNER_TEMP/c4-reference.zip" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/c4-reference" "$RUNNER_TEMP/c4-reference-dist"
          unzip -q "$RUNNER_TEMP/c4-reference.zip" -d "$RUNNER_TEMP/c4-reference"
          echo "$C4_REFERENCE_TAR  $RUNNER_TEMP/c4-reference/dist.tgz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/c4-reference/dist.tgz" -C "$RUNNER_TEMP/c4-reference-dist"
          cp "$RUNNER_TEMP/c4-reference/source-before.txt" c4-header-closure/reference-source.txt
      - name: Clean production build
        run: NODE_OPTIONS="--max-old-space-size=6144" npm run build 2>&1 | tee c4-header-closure/build.log
      - name: Every product test script and built byte joined to completed qualification
        id: join
        env:
          C4_REFERENCE_DIR: ${{ runner.temp }}/c4-reference
          C4_REFERENCE_DIST: ${{ runner.temp }}/c4-reference-dist/dist
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import path from 'node:path';import assert from 'node:assert/strict';import {createHash} from 'node:crypto';import {execFileSync} from 'node:child_process';
          const sha=bytes=>createHash('sha256').update(bytes).digest('hex');
          const readIndex=file=>new Map(fs.readFileSync(file,'utf8').trim().split('\n').map(line=>{const m=/^[0-9]+ ([0-9a-f]{40}) 0\t(.+)$/.exec(line);assert(m,'Actual source row');return [m[2],m[1]];}));
          const old=readIndex('c4-header-closure/reference-source.txt'),current=readIndex('c4-header-closure/source-before.txt');
          const excluded=new Set(['scripts/qa/playFootballConnect4Ownership.mjs']);
          assert.equal(old.get('scripts/qa/playFootballConnect4Ownership.mjs'),'80a6bd9ac8b9dc1381a12802bfdfc6ded0628e89');
          const helper='scripts/qa/playFootballConnect4Ownership.mjs',oldHead='8382511deed6d212733910091ffea94d3838ff06';assert.equal(current.get(helper),'321ed6de1abe594254b472ef0040424f1b06c09d');assert.equal(execFileSync('git',['rev-parse',oldHead+':'+helper],{encoding:'utf8'}).trim(),'80a6bd9ac8b9dc1381a12802bfdfc6ded0628e89');const before=execFileSync('git',['show',oldHead+':'+helper]),after=fs.readFileSync(helper);const blob=b=>createHash('sha1').update(Buffer.concat([Buffer.from('blob '+b.length+'\0'),b])).digest('hex');assert.equal(blob(before),'80a6bd9ac8b9dc1381a12802bfdfc6ded0628e89');assert.equal(blob(after),'321ed6de1abe594254b472ef0040424f1b06c09d');assert(before.indexOf(10)>=0&&after.indexOf(10)>=0);assert.deepEqual(after.subarray(after.indexOf(10)+1),before.subarray(before.indexOf(10)+1),'Every byte after first newline held');assert.equal(after.subarray(0,after.indexOf(10)).toString(),'// Soccer board request ownership proof for remote CI. Fulfilled search and validation records are fictional.');fs.writeFileSync('c4-header-closure/helper-comment-inverse.json',JSON.stringify({status:'passed',file:helper,beforeBlob:blob(before),afterBlob:blob(after),oldHead,onlyFirstCommentChanged:true,executionBytesAfterFirstNewlineHeld:true},null,2));
          const configs=['index.html','package.json','package-lock.json','vite.config.ts','tailwind.config.ts','postcss.config.js','tsconfig.json','tsconfig.app.json','tsconfig.node.json','bun.lockb','bun.lock'];
          for(const file of configs){assert.equal(current.has(file),old.has(file),'Same root configuration presence: '+file);if(current.has(file))assert.equal(current.get(file),old.get(file),'Exact qualified root configuration: '+file);}
          assert.equal(current.get('src/hooks/useFootballConnect4.ts'),'971dbdfa5a0e3c5adf749f9f301cc0fd994a178f');
          assert.equal(current.get('src/pages/FootballConnect4.tsx'),'634f94cea7810cfd678c3a4a6f470c3039773882');
          assert.equal(current.get('docs/plans/2026-11-06-soccer-connect4-request-ownership.md'),'9f4969d1f8c308d9257d2b5231dab2339c2739db');
          assert.equal(current.get('src/test/footballConnect4RequestOwnership.test.tsx'),'1156a83c6966f4c55bef0ed4c7f7a3288f4e87eb');
          const scoped=map=>[...map].filter(([p])=>/^(?:src|public|scripts)\//.test(p)&&!excluded.has(p)).sort(([a],[b])=>a.localeCompare(b));
          const sourceRows=scoped(current);assert.equal(sourceRows.length,4654);assert.deepEqual(sourceRows,scoped(old),'Every other source/public/script blob held, including exact committed generated files');
          const inventory=dir=>fs.readdirSync(dir,{withFileTypes:true}).sort((a,b)=>a.name.localeCompare(b.name)).flatMap(e=>e.isDirectory()?inventory(path.join(dir,e.name)).map(r=>({...r,path:e.name+'/'+r.path})):[{path:e.name,bytes:fs.statSync(path.join(dir,e.name)).size,sha256:sha(fs.readFileSync(path.join(dir,e.name)))}]);
          const actual=inventory('dist'),reference=inventory(process.env.C4_REFERENCE_DIST);
          assert.equal(actual.length,850);assert.deepEqual(actual,reference,'Every byte of every built file matches the pinned reference build');
          const meta=JSON.parse(fs.readFileSync('c4-header-closure/reference-artifact.json')),referenceHead=fs.readFileSync(path.join(process.env.C4_REFERENCE_DIR,'head.txt'),'utf8').trim();
          assert.equal(meta.id,Number(process.env.C4_REFERENCE_ARTIFACT));assert.equal(meta.expired,false);assert.match(referenceHead,/^[a-f0-9]{40}$/);assert.equal(meta.workflow_run.head_sha,referenceHead);
          assert.equal(meta.id,13486287954);assert.equal(meta.size_in_bytes,12732354);assert.equal(meta.digest,'sha256:cc187c517485e48f5a2ccb758fb14a8ee6724bfb3293fff7698fe67337f32c17');assert.equal(meta.workflow_run.id,42182482124);assert.equal(referenceHead,'8382511deed6d212733910091ffea94d3838ff06');const run=JSON.parse(fs.readFileSync('c4-header-closure/reference-run.json'));assert.equal(run.id,42182482124);assert.equal(run.head_sha,referenceHead);assert.equal(run.status,'completed');assert.equal(run.conclusion,'failure','Primary remains historically red');
          const result={status:'passed',referenceRun:meta.workflow_run.id,referenceApp:referenceHead,referenceArtifact:meta.id,referenceZipSHA256:process.env.C4_REFERENCE_ZIP,referenceTarSHA256:process.env.C4_REFERENCE_TAR,sourceRows:sourceRows.length,rootConfigurations:configs.filter(file=>current.has(file)).map(file=>({file,blob:current.get(file)})),helperHeaderOnlyException:{file:helper,before:blob(before),after:blob(after)},generatedPatches:[],distFiles:actual.length,distManifestSHA256:sha(JSON.stringify(actual)),dist:actual,limits:'Fresh types/build/source/850-body closure only, plus a separate fresh NoRival fence. The primary run remains historically red. Only its independently validated successful unit,19-reader,16-cap,legacy and native stages are carried; none is rerun here. Every helper execution byte after its first comment is held. The owned plan is pinned, other docs are outside this join.'};
          fs.writeFileSync('c4-header-closure/reference-build-join.json',JSON.stringify(result,null,2));console.log('PASS all '+sourceRows.length+' source rows and every '+actual.length+' built file held');
          NODE
      - name: Admit only successful stages from the historically red primary
        env:
          C4_REFERENCE_DIR: ${{ runner.temp }}/c4-reference
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import path from 'node:path';import assert from 'node:assert/strict';import {createHash} from 'node:crypto';
          const out='c4-header-closure',ref=process.env.C4_REFERENCE_DIR,read=file=>JSON.parse(fs.readFileSync(path.join(ref,file))),hash=b=>createHash('sha256').update(b).digest('hex'),proof=file=>{const b=fs.readFileSync(path.join(ref,file));return{file,bytes:b.length,sha256:hash(b)};};
          assert.equal(fs.statSync(path.join(ref,'types.log')).size,0);assert.equal(fs.statSync(path.join(ref,'offline.log')).size,0);for(const[a,b]of[['source-before.txt','source-after.txt'],['tracked-before.json','tracked-after.json'],['dist-before.json','dist-after.json'],['locks-before.txt','locks-after.txt'],['installed-before.json','installed-final.json']])assert.deepEqual(fs.readFileSync(path.join(ref,a)),fs.readFileSync(path.join(ref,b)),a+' primary physical hold');
          const owned=read('owned.json'),existing=read('existing.json');for(const[r,n]of[[owned,12],[existing,22]]){assert.equal(r.numTotalTests,n);assert.equal(r.numPassedTests,n);assert.equal(r.numFailedTests,0);assert.equal(r.numPendingTests,0);assert(r.testResults.every(s=>s.assertionResults.every(a=>a.status==='passed')));}const rawBytes=fs.readFileSync(path.join(ref,'raw.json')),raw=JSON.parse(rawBytes);assert.equal(rawBytes.length,365602);assert.equal(hash(rawBytes),'9109bcf79649a72de8e16364ca45b5ca05129fe33ab097e0ba88910b360df823');assert.equal(Object.keys(raw.cases).length,12);assert.equal(Object.values(raw.cases).reduce((n,c)=>n+c.frames.length,0),44);assert.equal(read('fixed-admission.json').status,'fixed-twelve-passed-six-whole-cases-held');
          const wanted='simAdsense,simBrand,simHeadTags,simHiddenPages,simHubs,simIndexNow,simIndexing,simInternalLinks,simPrerender,simPrerenderBoot,simRetiredRoutes,simSchema,simSitemap,simSnapshotAssets,simSiteSearch,simGuideHeadings,simSeoMetaSplit,simHomeCopy,simHarnessAnchors'.split(',').map(n=>n+'.mjs').sort(),readers=fs.readFileSync(path.join(ref,'readers.log'),'utf8'),passed=[...readers.matchAll(/^\s+PASS\s+(sim[A-Za-z0-9]+\.mjs)/gm)].map(m=>m[1]).sort(),failed=[...readers.matchAll(/^\s+FAIL\s+(sim[A-Za-z0-9]+\.mjs)/gm)].map(m=>m[1]);assert.deepEqual(passed,wanted);assert.deepEqual(failed,['simNoRivalNames.mjs']);assert(readers.includes('RIVAL NAMES FOUND: 1')&&readers.includes('scripts/qa/playFootballConnect4Ownership.mjs:1')&&readers.includes('1 harness not green.'));
          const caps=fs.readFileSync(path.join(ref,'weight.log'),'utf8'),capRows=[...caps.matchAll(/^\s+(\/\S*)\s+\d+K gz over\s+\d+ files \(budget (\d+)K, [\d.]+K to the tenth\)/gm)].map(m=>[m[1],Number(m[2])]);assert.deepEqual(capRows,[['/',245],['/club-manager',648],['/soccer-career',840],['/stadium-tycoon',305],['/wonderkid-factory',278],['/minefield',295],['/footle',354],['/nfl-my-career',499],['/front-office',390],['/soccer-grid',320],['/leaderboard',266],['/manager-hot-seat',672],['/deadline-day',680],['/transfer-path',381],['/nba-front-office',397],['/nhl-front-office',379]]);assert(caps.includes('sweepWeight: green.'));const related=read('related-admission.json');assert.equal(related.status,'passed');assert.equal(related.actualChecks,37);assert.equal(related.actualScenarios,5);assert.equal(related.source,'01fddf104d0579a35dc285c63704d3400563c590');assert.equal([...fs.readFileSync(path.join(ref,'related.log'),'utf8').matchAll(/^\s+PASS\s+/gm)].length,37);
          const native=read('browser/report.json'),admission=read('admission.json');assert.equal(fs.readFileSync(path.join(ref,'browser.exit'),'utf8').trim(),'0');assert.equal(native.status,'passed');assert.equal(native.checks,1030);assert.equal(admission.status,'passed');assert.equal(admission.helper,'80a6bd9ac8b9dc1381a12802bfdfc6ded0628e89');assert.deepEqual(native.journeys.map(j=>[j.width,j.height,j.status,j.frames.length,j.actions.length,j.layouts.length]),[[320,568,'passed',57,21,12],[390,844,'passed',57,21,12],[1280,900,'passed',57,21,12]]);assert.equal(native.screenshots.length,9);assert.equal(native.externalForwarded,0);for(const k of['source','dist','installed','offline']){assert(native[k+'Held']);assert.deepEqual(native[k+'Before'],native[k+'After']);}assert.deepEqual(native.distBefore,read('dist-before.json'));assert.deepEqual(native.sourceBefore,read('tracked-before.json'));
          let refs=0;const verify=r=>{const file=path.resolve(ref,'browser',r.file);assert(file.startsWith(path.resolve(ref,'browser')+path.sep));const b=fs.readFileSync(file);assert.equal(b.length,r.bytes);assert.equal(hash(b),r.sha256);refs++;};verify(native.fixture);for(const j of native.journeys){for(const r of[...j.frames,...j.actions])verify(r);for(const r of j.screenshots){verify(r);verify(r.frame);}}for(const r of native.screenshots){verify(r);verify(r.frame);}
          const files=['owned.json','existing.json','raw.json','readers.log','weight.log','related.log','related-admission.json','admission.json','browser/report.json','source-before.txt','dist-before.json','types.log','offline.log'].map(proof);fs.writeFileSync(out+'/primary-passed-stages.json',JSON.stringify({status:'passed-stages-carried',primaryRun:42182482124,primaryOverall:'historically red, one owned helper comment rejected by NoRival',unitCases:34,rawFrames:44,readers:passed,originalReaderFailure:failed,immutableCapRows:capRows,relatedChecks:37,nativeHelper:'80a6bd9ac8b9dc1381a12802bfdfc6ded0628e89',nativeChecks:1030,nativeFrames:171,nativeActions:63,nativeLayouts:36,nativePngs:9,rawReferencesVerified:refs,files,limits:'No units,19 readers,16 caps,legacy fence or native journeys rerun in this closure. Source and every built byte are separately joined. Inherited small mode/grid controls are not44px-qualified.'},null,2));console.log('PASS retained34unit/19reader/16cap/37legacy/3native successful stages; primary remains historically red');
          NODE
      - name: Fresh unchanged NoRival guard on corrected helper
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:scripts/simNoRivalNames.mjs)" = 0cc180c43c692ed65fb067e7f187826806845798
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/simNoRivalNames.mjs 2>&1 | tee c4-header-closure/norival.log
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';const log=fs.readFileSync('c4-header-closure/norival.log','utf8');assert(log.includes('No rival product names found. 0 findings.'));assert(!log.includes('RIVAL NAMES FOUND:'));fs.writeFileSync('c4-header-closure/norival-admission.json',JSON.stringify({status:'passed',source:'0cc180c43c692ed65fb067e7f187826806845798',freshRerun:true,scope:'Unchanged guard, helper first-comment correction only. All other successful primary stages carried separately.'},null,2));
          NODE
      - name: Final source locks installed versions and offline holds
        if: always()
        run: |
          git ls-files -s > c4-header-closure/source-after.txt
          cmp c4-header-closure/source-before.txt c4-header-closure/source-after.txt
          git diff --exit-code HEAD -- .
          sha256sum package.json package-lock.json > c4-header-closure/locks-after.txt
          cmp c4-header-closure/locks-before.txt c4-header-closure/locks-after.txt
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const before=JSON.parse(fs.readFileSync('c4-header-closure/installed-before.json'));
          const after=before.map(([p])=>[p,JSON.parse(fs.readFileSync(p+'/package.json')).version]);assert.equal(after.length,521);assert.deepEqual(after,before);
          fs.writeFileSync('c4-header-closure/installed-final.json',JSON.stringify(after));
          assert(fs.existsSync('c4-header-closure/offline.log'));assert.equal(fs.statSync('c4-header-closure/offline.log').size,0);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soccer-connect4-helper-header-closure-${{ github.run_id }}
          path: c4-header-closure
          retention-days: 14
          if-no-files-found: error
