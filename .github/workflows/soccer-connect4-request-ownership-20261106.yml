          if(fs.existsSync('soccer-connect4-qualified/dist-before.json')){const rows=walk('dist').map(hash);fs.writeFileSync('soccer-connect4-qualified/dist-after.json',JSON.stringify(rows));assert.deepEqual(rows,JSON.parse(fs.readFileSync('soccer-connect4-qualified/dist-before.json')));}
