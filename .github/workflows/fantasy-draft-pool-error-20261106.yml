            }
            function escape() {
              const name = 'startup-owned-help-escape';
              const observed = take('observedClose', name);
              same([observed.value.name, observed.value.usedForActuation, observed.value.geometry.tag], [name, false, 'BUTTON']);
              assert(observed.value.geometry.text === 'Close' || observed.value.geometry.label === 'Close');
              same(observed.value.qualifiedForClick, geometry(observed.value.geometry, width, height));
              const item = action(name, 'startup', 'keyboard');
              same([item.key, item.observedClose], ['Escape', observed.ref]);
              const before = nextFrame(item.before, name + '-before').value;
              const after = nextFrame(item.after, name + '-after').value;
              same([before.dialog.open, before.dialog.title, before.dialog.ownsFocus, before.focus.insideDialog], [true, 'How to play', true, true]);
              assert(before.dialog.labelledBy);
