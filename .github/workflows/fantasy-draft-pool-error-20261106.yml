              assert(item.events.every(event => event.type === 'scroll' || (['keydown', 'keyup'].includes(event.type) && event.key === 'Escape' && event.trusted)), 'Escape slice owns only trusted Escape and scroll');
              const keys = item.events.filter(event => event.type === 'keydown');
