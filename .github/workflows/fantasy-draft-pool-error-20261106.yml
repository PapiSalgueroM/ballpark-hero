              return captured;
            }
            function checkpoint(name) {
              assert(Object.hasOwn(context.checkpoints, name));
              checkpointNames.push(name);
              return nextFrame(context.checkpoints[name], name);
            }
            function layout(ref, fileName, name, kind, usedForActuation) {
              const measured = take('layouts', fileName);
              same(measured.ref, ref, 'Exact next measured layout');
              const value = measured.value;
              same([value.name, value.kind, value.usedForActuation, value.qualified], [name, kind, usedForActuation, true]);
              assert(geometry(value, width, height), 'Actual whole viewport, chrome, ancestor clipping, hit and enabled ' + name);
              return value;
            }
            function prepare(name, kind) {
              const preparation = take('preparations', name).value;
              same([preparation.name, preparation.kind], [name, kind]);
              assert(typeof preparation.scope === 'string' && preparation.scope.length);
              assert(Array.isArray(preparation.wheels) && preparation.wheels.length <= 17, 'Bounded observed native wheel remedies');
              preparation.wheels.forEach((reference, attempt) => {
                const item = take('wheels', name);
                same(item.ref, reference, 'Each measured native wheel belongs to this preparation');
                const wheel = item.value;
                same(wheel.name, name);
                same(wheel.deltaX, 0);
                assert(Number.isInteger(wheel.deltaY) && wheel.deltaY !== 0);
                const before = nextFrame(wheel.before, name + '-wheel-' + attempt + '-before').value;
                const after = nextFrame(wheel.after, name + '-wheel-' + attempt + '-after').value;
                const g = wheel.geometryBefore;
                assert(!geometry(g, width, height), 'Native wheel remedies unqualified initial geometry');
                geometry(wheel.geometryAfter, width, height);
                assert(g.at <= before.at && wheel.geometryAfter.at >= after.at);
                const vertical = g.ancestors.filter(ancestor => ancestor.cy);
                const top = Math.max(g.chrome.top, ...vertical.map(ancestor => ancestor.y));
                const bottom = Math.min(height - g.chrome.bottom, ...vertical.map(ancestor => ancestor.bottom));
                assert(g.rect.width > 0 && g.rect.height > 0 && g.rect.height <= bottom - top);
                assert(g.rect.x >= 0 && g.rect.right <= width &&
                  g.ancestors.every(ancestor => !ancestor.cx || (g.rect.x >= ancestor.x && g.rect.right <= ancestor.right)));
                const delta = g.rect.y < top ? Math.floor(g.rect.y - top - 8)
                  : g.rect.bottom > bottom ? Math.ceil(g.rect.bottom - bottom + 8) : 0;
                same(wheel.deltaY, delta, 'Exact actual vertical remedy');
                const viewportBottom = height - g.chrome.bottom;
                const container = g.ancestors.find(ancestor =>
                  ancestor.scrollableY && Math.min(ancestor.bottom, viewportBottom) > Math.max(ancestor.y, g.chrome.top));
                const visibleTop = container ? Math.max(container.y, g.chrome.top, 0) : g.chrome.top;
                const visibleBottom = container ? Math.min(container.bottom, viewportBottom) : viewportBottom;
                same(wheel.point, {
                  x: container ? Math.max(2, Math.min(width - 2, (Math.max(0, container.x) + Math.min(width, container.right)) / 2)) : width / 2,
                  y: (visibleTop + visibleBottom) / 2,
                });
                assert(wheel.point.x >= 0 && wheel.point.x <= width && wheel.point.y >= 0 && wheel.point.y <= height);
                eventsBetween(wheel.events, before, after, 'Native wheel ' + name);
                assert(wheel.events.every(event => ['wheel', 'scroll'].includes(event.type)), 'Wheel slice owns only wheel and scroll');
                const event = wheel.events.filter(row => row.type === 'wheel');
                same(event.length, 1);
                same([event[0].trusted, event[0].deltaMode, event[0].deltaX, event[0].deltaY], [true, 0, 0, wheel.deltaY]);
                assert(Math.abs(wheel.geometryAfter.rect.y - g.rect.y) > 0.5 ||
                  JSON.stringify(wheel.geometryAfter.ancestors.map(ancestor => ancestor.scrollTop)) !== JSON.stringify(g.ancestors.map(ancestor => ancestor.scrollTop)) ||
                  after.scroll.y !== before.scroll.y, 'Actual scroll or clipping geometry moved');
                if (baseline) stable(before, after, 'Native wheel preserves active game');
              });
              return {
                ref: preparation.layout,
                value: layout(preparation.layout, name, name, kind, kind !== 'display'),
              };
            }
            function action(name, kind, method) {
              const value = take('actions', name).value;
              same([value.name, value.kind, value.method], [name, kind, method]);
              return value;
            }
            function mouse(name, kind, target) {
              const prepared = prepare(name, kind).value;
              const item = action(name, kind, 'mouse');
              const measured = layout(item.layout, name + '-click', name, kind, true);
              same([prepared.tag, prepared.text, prepared.label], [measured.tag, measured.text, measured.label]);
              same([measured.tag, item.targetText, item.targetLabel], ['BUTTON', measured.text, measured.label]);
              if (Object.hasOwn(target, 'text')) same(measured.text, target.text);
              if (Object.hasOwn(target, 'label')) same(measured.label, target.label);
              const before = nextFrame(item.before, name + '-before');
              const after = nextFrame(item.after, name + '-after');
              assert(measured.at <= before.value.at);
              eventsBetween(item.events, before.value, after.value, 'Native mouse ' + name);
              assert(item.events.every(event => ['pointerdown', 'pointerup', 'click', 'scroll'].includes(event.type)), 'Mouse slice owns only mouse and scroll');
              const indices = [];
              for (const type of ['pointerdown', 'pointerup', 'click']) {
                const events = item.events.filter(event => event.type === type);
                same(events.length, 1, 'One actual native ' + type);
                const event = events[0];
                same([event.trusted, event.targetTag, event.targetText, event.targetLabel], [true, measured.tag, measured.text, measured.label]);
                if (type !== 'click' || event.pointerType !== null) same(event.pointerType, 'mouse');
                indices.push(item.events.indexOf(event));
              }
