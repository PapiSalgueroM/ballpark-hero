                if (read.outcome === 'fulfilled') {
                  same([read.status, read.releasedAt, read.finishedAt, read.responseBody],
                    [final.status, final.releasedAt, final.finishedAt, final.responseBody]);
                } else {
                  same(read.outcome, 'waiting-for-release');
                  same([read.status, read.releasedAt, read.finishedAt, read.responseBody], [null, null, null, null]);
