          set -euo pipefail
          out=fantasy-draft-pool-error-qualified
          git ls-files -s > "$out/source-after.txt"
          cmp "$out/source-before.txt" "$out/source-after.txt"
          git diff --exit-code HEAD -- .
          sha256sum package.json package-lock.json > "$out/locks-after.txt"
          cmp "$out/locks-before.txt" "$out/locks-after.txt"
          if [[ -f "$out/dist.sha256" ]]; then sha256sum --check "$out/dist.sha256"; fi
          if [[ -f "$out/native-admission-script.mjs" ]]; then
            test "$(git hash-object "$out/native-admission-script.mjs")" = "$FANTASY_NATIVE_OUTER_BLOB"
            test -z "$(git ls-files -- "$out/native-admission-script.mjs")"
          fi
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          import {createHash} from 'node:crypto';
          const out='fantasy-draft-pool-error-qualified',read=file=>JSON.parse(fs.readFileSync(out+'/'+file)),sha=bytes=>createHash('sha256').update(bytes).digest('hex');
          const write=(file,value)=>fs.writeFileSync(out+'/'+file,JSON.stringify(value));
          const files=execFileSync('git',['ls-files','-z'],{encoding:'utf8'}).split('\0').filter(Boolean);
          const detail=file=>{const bytes=fs.readFileSync(file);return{file,bytes:bytes.length,sha256:sha(bytes)};};
          const rows=files.map(detail);
          assert.equal(rows.length,5785);assert.deepEqual(rows,read('tracked-before.json'));write('tracked-after.json',rows);
          const lock=JSON.parse(fs.readFileSync('package-lock.json')),before=read('installed-before.json');
          const after=Object.keys(lock.packages).filter(file=>file.startsWith('node_modules/')&&fs.existsSync(file+'/package.json')).map(file=>[file,JSON.parse(fs.readFileSync(file+'/package.json')).version]);
          assert.equal(after.length,521);for(const [file,version] of after)assert.equal(version,lock.packages[file].version,file);
          assert.deepEqual(after,before);write('installed-after.json',after);
          const offlineBytes=fs.statSync(out+'/offline.log').size;assert.equal(offlineBytes,0);
          const walk=(base,dir)=>fs.readdirSync(path.join(base,dir),{withFileTypes:true}).sort((a,b)=>a.name.localeCompare(b.name)).flatMap(entry=>{
            const file=path.join(dir,entry.name);assert(!entry.isSymbolicLink(),file);
            if(entry.isDirectory())return walk(base,file);assert(entry.isFile(),file);return[file];
          });
          let distHeld=false,retainedPacketsHeld=false;
          if(fs.existsSync(out+'/dist-before.json')){
            const dist=walk('.','dist').map(detail);assert.equal(dist.length,850);assert.deepEqual(dist,read('dist-before.json'));write('dist-after.json',dist);distHeld=true;
          }
          if(fs.existsSync(out+'/reference-top-before.json')){
            const detailRef=file=>({...detail(path.join(out,file)),file});
            const refs=read('reference-top-before.json').map(row=>detailRef(row.file));
            assert.deepEqual(refs,read('reference-top-before.json'));write('reference-top-after.json',refs);
            for(const [prefix,dir] of [['original','original-packet'],['fixed','fixed-reference'],['controls','controls-reference']]){
              const expected=read(prefix+'-bodies-before.json');
              assert.deepEqual(walk(out,dir).sort(),expected.map(row=>dir+'/'+row.file).sort());
              const bodies=expected.map(row=>({...detailRef(dir+'/'+row.file),file:row.file}));
              assert.deepEqual(bodies,expected);
              write(prefix+'-bodies-after.json',bodies);
