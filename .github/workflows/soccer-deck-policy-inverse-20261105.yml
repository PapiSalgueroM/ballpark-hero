name: Soccer deck policy inverse proof
on:
  push:
    branches: [codex/soccer-deck-policy-inverse-qa-20261105]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      SIM_NETWORK: offline
      SIM_OFFLINE_RECEIPT: deck-policy-artifacts/offline.log
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - name: Immutable source and locked dependencies
        run: |
          mkdir -p deck-policy-artifacts
          git rev-parse HEAD > deck-policy-artifacts/head.txt
          git rev-parse 'HEAD^{tree}' > deck-policy-artifacts/tree.txt
          git ls-files -s > deck-policy-artifacts/source-before.txt
          sha256sum package.json package-lock.json > deck-policy-artifacts/locks-before.txt
          npm ci
      - name: Current inverse original business failures
        run: |
          set +e
          DECK_POLICY_ARM=original DECK_POLICY_OUT=deck-policy-artifacts/original NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/qa/careerDeckFairPolicyCompatibility.mjs 2>&1 | tee deck-policy-artifacts/original.log
          deck_test_status=${PIPESTATUS[0]}
          set -e
          test "$deck_test_status" = 1
          node --input-type=module <<'NODE'
          import fs from 'node:fs'; import assert from 'node:assert/strict';
          const r=JSON.parse(fs.readFileSync('deck-policy-artifacts/original/report.json'));
          assert.equal(r.cases.length,4); assert.equal(r.cases.filter(x=>x.status==='passed').length,2);
          const failures=r.cases.filter(x=>x.status==='failed'); assert.equal(failures.length,2);
          assert(failures[0].error.message.includes('DECK_POLICY_CURRENT_INVERSE'));
          assert(failures[1].error.message.includes('DECK_POLICY_REJECT_MIXED_DUPLICATE'));
          assert.equal(r.sourceHeld,true); console.log('PASS original: two exact inverse business failures, two preserved cases');
          NODE
      - name: Source lock and offline holds
        if: always()
        run: |
          git ls-files -s > deck-policy-artifacts/source-after.txt
          cmp deck-policy-artifacts/source-before.txt deck-policy-artifacts/source-after.txt
          git diff --exit-code HEAD -- src scripts package.json package-lock.json
          sha256sum package.json package-lock.json > deck-policy-artifacts/locks-after.txt
          cmp deck-policy-artifacts/locks-before.txt deck-policy-artifacts/locks-after.txt
          if test -f deck-policy-artifacts/offline.log; then test ! -s deck-policy-artifacts/offline.log; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soccer-deck-policy-inverse-${{ github.run_id }}
          path: deck-policy-artifacts
          retention-days: 7
          if-no-files-found: error
