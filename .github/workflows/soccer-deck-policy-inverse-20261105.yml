name: Soccer deck policy inverse qualified
on:
  push:
    branches: [codex/soccer-deck-policy-inverse-qa-20261105]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      SIM_NETWORK: offline
      SIM_OFFLINE_RECEIPT: deck-policy-artifacts/offline.log
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 12
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - name: Immutable source and locked dependencies
        run: |
          mkdir -p deck-policy-artifacts
          git rev-parse HEAD > deck-policy-artifacts/head.txt
          git rev-parse 'HEAD^{tree}' > deck-policy-artifacts/tree.txt
          git ls-files -s > deck-policy-artifacts/source-before.txt
          sha256sum package.json package-lock.json > deck-policy-artifacts/locks-before.txt
          git fetch --no-tags --depth=1 origin c176be815dc4af57dfd7185a485e28357aa0d41e
          npm ci
      - name: Fixed inverse legacy bytes actual policy and strict anchors
        run: |
          DECK_POLICY_ARM=fixed DECK_POLICY_OUT=deck-policy-artifacts/fixed NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/qa/careerDeckFairPolicyCompatibility.mjs 2>&1 | tee deck-policy-artifacts/fixed.log
      - name: Effective omitted inverse draw control
        run: |
          set +e
          DECK_POLICY_ARM=omit-inverse DECK_POLICY_CONTROL=omit-inverse DECK_POLICY_OUT=deck-policy-artifacts/omit-inverse NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/qa/careerDeckFairPolicyCompatibility.mjs 2>&1 | tee deck-policy-artifacts/omit-inverse.log
          deck_control_status=${PIPESTATUS[0]}
          set -e
          test "$deck_control_status" = 1
          node --input-type=module <<'NODE'
          import fs from 'node:fs'; import assert from 'node:assert/strict';
          const r=JSON.parse(fs.readFileSync('deck-policy-artifacts/omit-inverse/report.json'));
          assert.equal(r.cases.length,4); assert.equal(r.cases.filter(x=>x.status==='passed').length,3);
          const failures=r.cases.filter(x=>x.status==='failed'); assert.equal(failures.length,1);
          assert(failures[0].error.message.includes('DECK_POLICY_INVERSE_DRAWS'));
          assert.equal(r.currentInverse.controlChangedSource,true); assert.equal(r.frames.length,3);
          assert.equal(r.sourceHeld,true); console.log('PASS effective omitted inverse: exact draw failure, three held cases');
          NODE
      - name: Exact restored source and existing source fences
        run: |
          DECK_POLICY_ARM=restored DECK_POLICY_OUT=deck-policy-artifacts/restored NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/qa/careerDeckFairPolicyCompatibility.mjs 2>&1 | tee deck-policy-artifacts/restored.log
          ONLY=simHarnessAnchors,simNoRivalNames node scripts/runAllSims.mjs --browser 2>&1 | tee deck-policy-artifacts/fences.log
      - name: Source lock and offline holds
        if: always()
        run: |
          git ls-files -s > deck-policy-artifacts/source-after.txt
          cmp deck-policy-artifacts/source-before.txt deck-policy-artifacts/source-after.txt
          git diff --exit-code HEAD -- src scripts package.json package-lock.json
          sha256sum package.json package-lock.json > deck-policy-artifacts/locks-after.txt
          cmp deck-policy-artifacts/locks-before.txt deck-policy-artifacts/locks-after.txt
          if test -f deck-policy-artifacts/offline.log; then test ! -s deck-policy-artifacts/offline.log; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soccer-deck-policy-inverse-${{ github.run_id }}
          path: deck-policy-artifacts
          retention-days: 7
          if-no-files-found: error
