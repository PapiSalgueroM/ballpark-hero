          done
          test "$ready" = 1
          : > "$QA_OUT/transport/sweep-weight.log"
          set +e
          SIM_OFFLINE_RECEIPT="$QA_OUT/transport/sweep-weight.log" node scripts/sweepWeight.mjs > "$QA_OUT/logs/sweep-weight.log" 2>&1
