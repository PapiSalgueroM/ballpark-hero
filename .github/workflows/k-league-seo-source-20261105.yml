          node --input-type=module <<'CAPS'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const out=process.env.QA_OUT,source=fs.readFileSync('scripts/sweepWeight.mjs','utf8').replace(/\/\*[\s\S]*?\*\//g,''),body=source.match(/const BUDGETS = \[([\s\S]*?)\n\];/)[1];
          const expected=[...body.matchAll(/\['([^']+)',\s*(\d+)\]/g)].map(m=>({route:m[1],budget:Number(m[2])}));assert.equal(expected.length,16);
          const log=fs.readFileSync(out+'/logs/sweep-weight.log','utf8');
          const read=s=>[...s.matchAll(/^\s{3}(\S+)\s+(\d+)K gz over\s+(\d+) files \(budget (\d+)K, ([\d.]+)K to the tenth\)$/gm)].map(m=>({route:m[1],roundedKiB:Number(m[2]),files:Number(m[3]),budget:Number(m[4]),tenthKiB:Number(m[5])}));
          const validate=s=>{const rows=read(s);assert.equal(rows.length,16,'K_SEED_ALL_16_ROWS');assert.deepEqual(rows.map(({route,budget})=>({route,budget})),expected);return rows;};const rows=validate(log);
          const first=log.match(/^\s{3}\S+\s+\d+K gz over\s+\d+ files \(budget \d+K, [\d.]+K to the tenth\)$/m);assert(first);const fault=log.replace(first[0],'');assert.notEqual(fault,log);assert.equal(read(fault).length,15);let copiedError;try{validate(fault);}catch(e){copiedError=e;}assert(copiedError instanceof assert.AssertionError);assert(copiedError.message.includes('K_SEED_ALL_16_ROWS'));const at=log.indexOf(first[0]),restored=fault.slice(0,at)+first[0]+fault.slice(at);assert.equal(restored,log);fs.writeFileSync(out+'/seed-caps-copied-omission.log',fault,{flag:'wx'});fs.writeFileSync(out+'/seed-caps-copied-restored.log',log,{flag:'wx'});assert.equal(fs.readFileSync(out+'/seed-caps-copied-restored.log','utf8'),log);validate(log);
          const allowed=/^\[SIM_OFFLINE_BLOCK\] external browser route continue https:\/\/(?:fonts\.(?:googleapis|gstatic)\.com|flagcdn\.com)$/;
          const transport=['build','sweep-weight'].map(name=>{const lines=fs.readFileSync(out+'/transport/'+name+'.log','utf8').trim().split('\n').filter(Boolean);assert(lines.every(s=>allowed.test(s)),name+' unexpected blocked transport');return{name,blockedAttempts:lines.length};});
