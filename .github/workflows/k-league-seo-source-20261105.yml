          assert(fs.readFileSync(out+'/pool-adoption/original.ts').equals(oldBytes));assert(fs.readFileSync(out+'/pool-adoption/generated.ts').equals(newBytes));
          const corePins=[{"path":"src/data/kLeague2026.ts","gitBlob":"7786c30acb29289ae929dbc605b1a14289dec388"},{"path":"src/lib/soccerCareerEngine.ts","gitBlob":"663eab42df957f156b35e931d81f9f643ea1a7f4"},{"path":"src/lib/soccerCareerLeague.ts","gitBlob":"cf7772161d902d2bb82d7f5cb6b3bdc5d04a9659"},{"path":"src/lib/soccerCareerOwner.ts","gitBlob":"925fe2c4d5cbdd37d723bd90e57523d46027e64d"},{"path":"scripts/lib/careerClubPool.mjs","gitBlob":"3abec590896605188a4fc0cc7d122fc3be8438c3"},{"path":"scripts/simCareerClubPool.mjs","gitBlob":"4f2493986069d7486e05560fbfd021455f27f1f7"},{"path":"scripts/data/soccerCareerFacts.json","gitBlob":"3020b7ebbc6a17013b3c7ab6a30558b675e35257"},{"path":"scripts/simNoRivalNames.mjs","gitBlob":"e7f7cfe09d0d53afb46a9dfe100cd34de42a2146"},{"path":"src/lib/clubManager.ts","gitBlob":"f2484429d627c4e05257886fb8e78d4e3561c64b"},{"path":"src/hooks/useClubManager.ts","gitBlob":"a8bae5b90a609a4e5ee5b267a58a52f4189bf699"},{"path":"src/lib/clubManagerCalendar.ts","gitBlob":"ada619859360b05ef0067393ad7175f21f80870c"},{"path":"src/pages/ClubManager.tsx","gitBlob":"3c820cbc7141d6f682f4a1ad2fc1fee7dfe9e3c2"},{"path":"src/components/club-manager/ClubManagerTeamPicker.tsx","gitBlob":"c6ef33e8ce54e1d964dda157dd5a6b12e899ef89"},{"path":"src/components/club-manager/ClubManagerClubList.tsx","gitBlob":"6c81ba72fc661673812c021f7f78a6877ffd4022"},{"path":"src/components/club-manager/ClubManagerHelp.tsx","gitBlob":"62174d0614c4b2e27dbaa461869d056bde937644"},{"path":"src/components/club-manager/WorldTablesCard.tsx","gitBlob":"2e333af9aa698d7d2074e32f52ea673d2abf538d"},{"path":"src/components/club-manager/LeagueTableCard.tsx","gitBlob":"fb3141db713c6ae6b39155ce415c5e61dd8a5971"},{"path":"src/components/club-manager/ClubDetailScreen.tsx","gitBlob":"aa54f2f72fc339f644ada87efe871b108a95382a"},{"path":"src/data/gameContent/soccer2.ts","gitBlob":"7576d973cf9a4a0aa7a9413eeb99130ad81f4f88"},{"path":"src/data/gameContent/clubManagement.ts","gitBlob":"0e1fa56534a005204a6e5