          mkdir -p "$OUT/logs" "$OUT/transport" "$OUT/pool-adoption" "$OUT/original" "$OUT/generated" "$OUT/commands"
          printf 'QA_OUT=%s\n' "$OUT" >> "$GITHUB_ENV"
