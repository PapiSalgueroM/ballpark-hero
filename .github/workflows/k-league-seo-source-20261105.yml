            if(name==='sitemap')assert.equal(lines.length,0);
            return {name,blockedAttempts:lines.length};
          }
          function readable(b){return b.toString('utf8').replace(/<!--[\s\S]*?-->/g,'').replace(/<script\b[^>]*>[\s\S]*?<\/script>/gi,'').replace(/<style\b[^>]*>[\s\S]*?<\/style>/gi,'').replace(/<[^>]*>/g,' ').replace(/\s+/g,' ');}
          function snapshot(p,b){
            const t=readable(b);
            assert(t.includes('K League 1'),'K_SEO_COVERAGE_TEXT');
            if(p.includes('club-manager')){
              assert(t.includes('All 12 opening squads are generated'),'K_SEO_GENERATED_SQUAD_TEXT');
              assert(t.includes('11 are ordinary jobs'),'K_SEO_ORDINARY_JOBS_TEXT');
            }else assert(t.includes('Eight clubs are added from the 2026 starting year'),'K_SEO_GAME_AVAILABILITY_TEXT');
            const s=b.toString('utf8');assert(s.includes('id="dukb-snapshot"'));assert(!/\/assets\//.test(s));
            const can=[...s.matchAll(/<link\b[^>]*rel="canonical"[^>]*>/g)];
            assert.equal(can.length,1);assert(can[0][0].includes('https://douknowball.com'+(p.includes('club-manager')?'/club-manager':'/soccer-career')));
            assert(!/<meta\b[^>]*name="robots"[^>]*noindex/i.test(s));
          }
          function ledger(before,after){
            assert.deepEqual(Object.keys(after).sort(),Object.keys(before).sort(),'K_SEO_LEDGER_KEYS');
            const changed=Object.keys(before).filter(k=>JSON.stringify(before[k])!==JSON.stringify(after[k]));
