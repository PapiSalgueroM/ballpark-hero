          fetch-depth: 6
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Bind the admitted generated product and sole source-generation QA workflow
        run: |
          set -euo pipefail
