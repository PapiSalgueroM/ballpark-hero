          assert.equal(corePins.length,20);
          const rows=corePins.map(({path,gitBlob})=>{const b=fs.readFileSync(path);assert.equal(blob(b),gitBlob,path);assert.equal(git('rev-parse',preGen+':'+path),gitBlob,path+' pre-generation pin');return{path,gitBlob,bytes:b.length,sha256:sha(b)};});
          rows.push({path:target,gitBlob:blob(newBytes),bytes:newBytes.length,sha256:sha(newBytes)});assert.equal(rows.length,21);
          const dependencyRows=dependencies.map(({path,gitBlob})=>{const b=fs.readFileSync(path);assert.equal(blob(b),gitBlob,path);return{path,gitBlob,bytes:b.length,sha256:sha(b)};});
          fs.writeFileSync(out+'/input-pins.json',JSON.stringify({sourcePins:rows,dependencies:dependencyRows},null,2)+'\n');
          fs.copyFileSync(workflow,out+'/workflow.yml');fs.writeFileSync(out+'/workflow-source.json',JSON.stringify({head:git('rev-parse','HEAD'),tree:git('rev-parse','HEAD^{tree}'),gitBlob:git('hash-object',workflow)})+'\n');
          fs.writeFileSync(out+'/generated-product-bridge.json',JSON.stringify({status:'EXACT_SINGLE_GENERATED_POOL_ADOPTION_NO_OTHER_PRODUCT_CHANGE',preGeneration:{commit:preGen,tree:preGenTree,coreSourcePins:20,originalCompositionIndependentSHA256:'0cdefb9ebc50a520b298ab7e29260202bc210f9428d850ef0350479466874319',originalCompositionCore:'7e99c3d834986c5271f2d1b154ade889f675fb7d',sourceSuccessors:['scripts/simCareerClubPool.mjs','scripts/data/soccerCareerFacts.json'],analyticalHarnessSourceIndependentSHA256:'d4524f17d9dc5327a7e4f73474db41093f53f5e971bdbbd6b10406676f6761fa',factsSchemaSourceIndependentSHA256:'9cd1a42bce83805a173b7f68141e6deb49e700fac546950b214dbbbb920b009f'},product:{commit:process.env.PRODUCT_CORE,tree:process.env.PRODUCT_TREE},changedPaths:[target],originalPool:{gitBlob:oldPool,bytes:oldBytes.length,sha256:sha(oldBytes)},adoptedPool:{gitBlob:blob(newBytes),bytes:newBytes.length,sha256:sha(newBytes)},QAAdditions:[workflow],sourcePins:21,freshBuildRequired:true,oldBuildReused:false,scope:'Final product bindings must come from the separately admitted actual generator output. This source stage authenticates the adopted complete pool and twenty preceding source bodies. Its seed build is unqualified and diagnostics preserve native cap failures. A later final normal build is required. No runtime, native or public qualification.'},null,2)+'\n');
          PINS
          node --input-type=module <<'ORIGINAL_OUTPUTS'
          import fs from 'node:fs';import path from 'node:path';import crypto from 'node:crypto';import assert from 'node:assert/strict';
          const out=process.env.QA_OUT,paths=['public/soccer-career/index.html','public/club-manager/index.html','public/sitemap.xml','scripts/data/lastmod.json'];
          const rows=paths.map(p=>{const b=fs.readFileSync(p),dest=out+'/original/'+p;fs.mkdirSync(path.dirname(dest),{recursive:true});fs.writeFileSync(dest,b,{flag:'wx'});assert(fs.readFileSync(dest).equals(b));return {path:p,bytes:b.length,sha256:crypto.createHash('sha256').update(b).digest('hex')};});
          fs.writeFileSync(out+'/original-output-pins.json',JSON.stringify(rows,null,2)+'\n',{flag:'wx'});
