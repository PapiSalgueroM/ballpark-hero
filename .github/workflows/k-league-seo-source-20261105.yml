name: K League scoped guide source generation and seed diagnostics
on:
  push:
    branches: [codex/k-league-seo-source-20261105]
permissions:
  contents: read
concurrency:
  group: k-league-seo-source-${{ github.ref }}
  cancel-in-progress: false
env:
  CI: '1'
  SIM_NETWORK: offline
  TZ: UTC
  PRODUCT_CORE: 7fa61db3491eec0830db90bcb47bf35b25c97b71
  PRODUCT_TREE: c249186fc75a12eed2c3748cbc57ec7329140417
  GENERATED_POOL_BLOB: 522399403d4a5816680d0d5d2e19e3fda650d71d
jobs:
  build:
    runs-on: ubuntu-latest
