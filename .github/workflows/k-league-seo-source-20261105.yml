          }
          function sitemap(b){const m=new Map();for(const match of b.toString('utf8').matchAll(/<url>[\s\S]*?<\/url>/g)){const loc=match[0].match(/<loc>([^<]+)<\/loc>/)?.[1];assert(loc&&!m.has(loc));m.set(loc,match[0]);}assert(m.size>100);return m;}
