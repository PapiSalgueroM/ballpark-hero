          const git=(...a)=>execFileSync('git',a,{encoding:'utf8'}).trim(),gitBytes=(...a)=>execFileSync('git',a),blob=b=>crypto.createHash('sha1').update(Buffer.from('blob '+b.length+'\0')).update(b).digest('hex'),sha=b=>crypto.createHash('sha256').update(b).digest('hex');
