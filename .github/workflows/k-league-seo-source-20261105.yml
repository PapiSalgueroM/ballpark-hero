            const sitemapText=fs.readFileSync(targets[2],'utf8'),row=map.get(otherURL),faultRow=row.replace(/<lastmod>[^<]+<\/lastmod>/,'<lastmod>1900-01-01</lastmod>');assert.notEqual(faultRow,row);const sitemapFault=Buffer.from(sitemapText.replace(row,faultRow));assert.notEqual(sha(sitemapFault),sha(Buffer.from(sitemapText)));const sitemapRestore=Buffer.from(sitemapFault.toString('utf8').replace(faultRow,row));assert(sitemapRestore.equals(Buffer.from(sitemapText)));fs.writeFileSync(out+'/controls/sitemap.fault.xml',sitemapFault,{flag:'wx'});fs.writeFileSync(out+'/controls/sitemap.restored.xml',sitemapRestore,{flag:'wx'});controls.push({...rejected('unrelated-sitemap-row',()=>sitemapHeld(old.get(targets[2]),sitemapFault)),changed:true,wholeInverse:true,faultSHA256:sha(sitemapFault),restoredSHA256:sha(sitemapRestore)});
            result={status:'SCOPED_SEO_SOURCE_GENERATED_SEED_BUILD_UNQUALIFIED',product:process.env.PRODUCT_CORE,productTree:process.env.PRODUCT_TREE,generatedPoolBlob:process.env.GENERATED_POOL_BLOB,normalQualifiedBuilds:0,seedBuilds:1,routes,sourceOutputs:rows,changedPaths:changed,ledgerChangedKeys:routes,sitemapMayBeByteIdentical:true,controls,commands,transport:[receipt1,receipt2],scope:'Exactly two current guides captured with the existing three clock samples. Seed output and caps are diagnostic only. A new final normal build with all20 readers,3smokes,16unchanged caps is still required. No runtime journey, native, public, merge or publication claim.'};
