      - name: Restore four derived targets and hold complete source and index
        if: always()
        run: |
          set -euo pipefail
          node --input-type=module <<'RESTORE'
          import fs from 'node:fs';import assert from 'node:assert/strict';import crypto from 'node:crypto';
          const out=process.env.QA_OUT,rows=JSON.parse(fs.readFileSync(out+'/original-output-pins.json'));
          assert.equal(rows.length,4);
          for(const row of rows){const b=fs.readFileSync(out+'/original/'+row.path);assert.equal(b.length,row.bytes);assert.equal(crypto.createHash('sha256').update(b).digest('hex'),row.sha256);fs.writeFileSync(row.path,b);assert(fs.readFileSync(row.path).equals(b));}
          fs.writeFileSync(out+'/final-output-restoration.json',JSON.stringify({paths:rows.map(x=>x.path),wholeBytesRestored:true})+'\n');
          RESTORE
          git ls-files -z | sort -z | xargs -0 sha256sum > "$QA_OUT/source-after.sha256"
          git ls-files -s > "$QA_OUT/index-after.txt"
          git ls-files -z > "$QA_OUT/tracked-after.bin"
          for lock in package.json package-lock.json bun.lock bun.lockb; do if test -f "$lock"; then sha256sum "$lock"; fi; done > "$QA_OUT/locks-after.sha256"
          git status --porcelain=v1 --untracked-files=all > "$QA_OUT/status-after.txt"
          git diff --exit-code HEAD > "$QA_OUT/source-diff.txt"
          cmp "$QA_OUT/source-before.sha256" "$QA_OUT/source-after.sha256"
          cmp "$QA_OUT/index-before.txt" "$QA_OUT/index-after.txt"
          cmp "$QA_OUT/tracked-before.bin" "$QA_OUT/tracked-after.bin"
          cmp "$QA_OUT/locks-before.sha256" "$QA_OUT/locks-after.sha256"
          test ! -s "$QA_OUT/status-before.txt"
          test ! -s "$QA_OUT/status-after.txt"
          if test -f "$QA_OUT/SCOPED-SEO-SOURCE-GENERATED.json"; then
            find dist -type f -print0 | sort -z | xargs -0 sha256sum > "$QA_OUT/seed-dist-after.sha256"
            node --input-type=module <<'DIST_HOLD'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const out=process.env.QA_OUT,read=p=>new Map(fs.readFileSync(p,'utf8').trimEnd().split('\n').map(l=>[l.slice(66),l.slice(0,64)])),a=read(out+'/seed-dist-before.sha256'),b=read(out+'/seed-dist-after.sha256'),allowed=['dist/club-manager/index.html','dist/soccer-career/index.html'];
          assert.deepEqual([...a.keys()],[...b.keys()]);
          const changed=[...a.keys()].filter(k=>a.get(k)!==b.get(k));assert.deepEqual(changed.sort(),allowed.sort());
          for(const p of allowed){const source='public/'+p.slice(5);assert(fs.readFileSync(p).equals(fs.readFileSync(out+'/generated/'+source)));}
          fs.writeFileSync(out+'/seed-dist-hold.json',JSON.stringify({unchangedCompiledAssets:true,intentionallyChangedDocuments:changed,finalQualifiedBuildRequired:true})+'\n');
          DIST_HOLD
          fi
      - name: Pack complete source-generation evidence or fatal diagnostic
        id: pack
        if: always()
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/k-league-seo-source-$GITHUB_RUN_ID.tar.gz"
          test ! -e "$archive"
          set +e
          tar -czf "$archive" -C "$QA_OUT" . > "$RUNNER_TEMP/k-league-seo-pack.log" 2>&1
          pack_exit=$?
          set -e
          archive_bytes=0
          if test -f "$archive"; then archive_bytes="$(stat -c %s "$archive")"; fi
          if test "$pack_exit" = 0 && test "$archive_bytes" -le 50000000; then
            sha256sum "$archive" > "$archive.sha256"
            printf 'archive=%s\n' "$archive" >> "$GITHUB_OUTPUT"
          else
            fatal_dir="$RUNNER_TEMP/k-league-seo-fatal-$GITHUB_RUN_ID"
            test ! -e "$fatal_dir"
            mkdir -p "$fatal_dir"
            for entry in "$QA_OUT"/*; do
              if test "$(basename "$entry")" = unqualified-seed-dist.tar.gz; then continue; fi
              cp -a "$entry" "$fatal_dir/"
            done
            cp "$RUNNER_TEMP/k-league-seo-pack.log" "$fatal_dir/full-pack.log"
            printf '{"status":"FATAL_FULL_PACK_FAILED_OR_OVER_LIMIT","nativeTarExit":%s,"fullArchiveBytes":%s,"limitBytes":50000000,"seedTarBodyOmitted":true,"seedManifestAndHashRetainedWhenCreated":true,"qualificationCredit":false}\n' "$pack_exit" "$archive_bytes" > "$fatal_dir/FATAL-PACK.json"
            diagnostic="$RUNNER_TEMP/k-league-seo-fatal-$GITHUB_RUN_ID.tar.gz"
            tar -czf "$diagnostic" -C "$fatal_dir" .
            test "$(stat -c %s "$diagnostic")" -le 50000000
            sha256sum "$diagnostic" > "$diagnostic.sha256"
            printf 'archive=%s\n' "$diagnostic" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          test -s "$QA_OUT/SCOPED-SEO-SOURCE-GENERATED.json"
          test -s "$QA_OUT/SEED-CAPS-DIAGNOSTIC.json"
          test -s "$QA_OUT/final-output-restoration.json"
          test -s "$QA_OUT/seed-dist-hold.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k-league-seo-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.pack.outputs.archive }}
            ${{ steps.pack.outputs.archive }}.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
