            fs.writeFileSync(receipt,'',{flag:'wx'});
            const a=fs.openSync(stdout,'wx'),b=fs.openSync(stderr,'wx');
            let r;try{r=spawnSync(process.execPath,args,{env:{...process.env,...env,SIM_OFFLINE_RECEIPT:receipt},stdio:['ignore',a,b],timeout:900000});}finally{fs.closeSync(a);fs.closeSync(b);}
            const row={name,args,status:r.status,signal:r.signal,error:r.error?String(r.error):null,stdout,stderr,receipt};
            commands.push(row);fs.writeFileSync(out+'/commands/'+name+'.json',JSON.stringify(row,null,2)+'\n',{flag:'wx'});
            assert.equal(r.status,0,name+' native status');assert.equal(r.signal,null);assert.equal(r.error,undefined);
            const lines=fs.readFileSync(receipt,'utf8').trim().split('\n').filter(Boolean);
            const allowed=/^\[SIM_OFFLINE_BLOCK\] external browser route continue https:\/\/(?:fonts\.(?:googleapis|gstatic)\.com|flagcdn\.com)$/;
