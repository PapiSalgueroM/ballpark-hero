          fs.writeFileSync(out+'/source-binding.json',JSON.stringify({phase:'menu-host-functional-candidate',source:process.env.GITHUB_SHA,parent:process.env.EXPECTED_PARENT,baseSource:process.env.BASE_SOURCE,tree:cp.execFileSync('git',['rev-parse','HEAD^{tree}'],{encoding:'utf8'}).trim(),run:process.env.GITHUB_RUN_ID,attempt:process.env.GITHUB_RUN_ATTEMPT,workflow:{file:workflow,gitBlobSha1:gitBlob,sha256:hash(fs.readFileSync(workflow))},selectedSourceGitPins:gitPins,baseApplicationGitPins:baseGitPins,products:productPins,tests:actualTests,applicationQualified:false,productMerged:false,browserExecuted:false,oldBaselineWorkflowByteHeld:true},null,2)+'\n',{flag:'wx'});
