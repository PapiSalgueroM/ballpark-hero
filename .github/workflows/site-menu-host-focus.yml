            assert.equal(r.testResults.length,groups.length);
            for(const suite of r.testResults){
              const group=groups.find(x=>path.resolve(x.file)===path.resolve(suite.name));assert(group,'Unowned suite '+suite.name);assert(!seenFiles.has(group.file));seenFiles.add(group.file);
              const expectedFailures=group.expectations.filter(x=>x.status==='failed').length;
              assert.equal(suite.status,expectedFailures?'failed':'passed');assert.equal(suite.assertionResults.length,group.expectations.length);const seen=new Set();
              if('message'in suite){assert.equal(typeof suite.message,'string');assert.doesNotMatch(suite.message,forbidden);}
              for(const row of suite.assertionResults){
                const expected=group.expectations.find(x=>x.title===row.title);assert(expected,'Unowned case '+row.title);assert(!seen.has(row.title));seen.add(row.title);
                const ancestors=group.ancestor?[group.ancestor]:[];
                assert.deepEqual(row.ancestorTitles,ancestors);assert.equal(row.fullName,[...ancestors,row.title].join(' '));assert.equal(row.status,expected.status);assert(Array.isArray(row.failureMessages));
                if(expected.status==='failed'){
