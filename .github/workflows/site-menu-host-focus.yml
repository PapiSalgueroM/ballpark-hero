ull},{"title":"returns real Sheet close focus to the visible host after the fallback is hidden","status":"passed","marker":null},{"title":"keeps focus with the opening trigger while it remains visible","status":"passed","marker":null},{"title":"retains the original trigger fallback when no visible host exists","status":"passed","marker":null}]},{"file":"src/test/SiteMenu.host-focus-loading.test.tsx","ancestor":null,"expectations":[{"title":"returns pending import Escape focus to the arrived host and never opens a late Sheet","status":"passed","marker":null}]},{"file":"src/test/SiteMenu.host-takeover.test.tsx","ancestor":null,"expectations":[{"title":"opens only one real Sheet when the arrived host takes over a pending fallback","status":"passed","marker":null}]}]};
          const forbidden=/Unhandled\s+(?:Errors?|Rejections?)|Uncaught\s+Exceptions?|Failed to resolve import|Cannot find (?:module|package)|No test files found|ReferenceError|TypeError|SyntaxError|TimeoutError|Test timed out|Hook timed out/i;
