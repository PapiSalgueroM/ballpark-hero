          for(const [file,pin] of Object.entries(baseGitPins))assert.equal(cp.execFileSync('git',['rev-parse',process.env.BASE_SOURCE+':'+file],{encoding:'utf8'}).trim(),pin,file);
          for(const [file,pin] of Object.entries(gitPins))assert.equal(cp.execFileSync('git',['hash-object',file],{encoding:'utf8'}).trim(),pin,file);
          for(const pin of productPins){const body=fs.readFileSync(pin.target);assert.equal(body.length,pin.bytes);assert.equal(hash(body),pin.sha256);assert.equal(cp.execFileSync('git',['hash-object',pin.target],{encoding:'utf8'}).trim(),pin.gitBlob);}
          const actualTests=[];
