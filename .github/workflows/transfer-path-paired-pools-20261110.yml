      TRANSFER_PATH_PAIRED_POOLS_HELPER: '0133be40b673749cd769427ff8586360f10a734d'
      TRANSFER_PATH_PAIRED_POOLS_OUTER: '52ee13660cadbba6bc9536aa7e13ad99f64f8f00'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 4
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact qualified fixed parent and clean product scope
        run: |
          set -euo pipefail
          if grep -En '__[A-Z][A-Z0-9_]*__' .github/workflows/transfer-path-paired-pools-20261110.yml; then echo 'Unresolved full qualification binding'; exit 1; fi
          for value in "$TRANSFER_PATH_PAIRED_POOLS_FIXED_HEAD" "$TRANSFER_PATH_PAIRED_POOLS_FIXED_TREE" "$TRANSFER_PATH_PAIRED_POOLS_FIXED_WORKFLOW" "$TRANSFER_PATH_PAIRED_POOLS_TEST" "$TRANSFER_PATH_PAIRED_POOLS_PLAN" "$TRANSFER_PATH_PAIRED_POOLS_PAGE_BLOB" "$TRANSFER_PATH_PAIRED_POOLS_HOOK_BLOB" "$TRANSFER_PATH_PAIRED_POOLS_HELPER" "$TRANSFER_PATH_PAIRED_POOLS_OUTER"; do [[ "$value" =~ ^[a-f0-9]{40}$ ]]; done
          out=transfer-path-paired-pools-full
          test ! -e "$out"
          mkdir "$out"
          touch "$out/offline.log"
          git rev-parse HEAD > "$out/head.txt"
          git rev-parse 'HEAD^{tree}' > "$out/tree.txt"
          git ls-files -s > "$out/source-before.txt"
          sha256sum package.json package-lock.json > "$out/locks-before.txt"
          git diff --exit-code HEAD -- .
          node --input-type=module <<'NODE'
