          assert.equal(distFiles,850);
          const normalized=read('dist-before.json').map(row=>{assert(row.file.startsWith('dist/'));return {path:row.file.slice(5),bytes:row.bytes,sha256:row.sha256};});
          fs.writeFileSync(out+'/admission.json',JSON.stringify({
            status:'passed',qualification:'fresh-transfer-path-paired-pools-full-scope',head:source.head,tree:source.tree,page:env.TRANSFER_PATH_PAIRED_POOLS_PAGE_BLOB,hook:env.TRANSFER_PATH_PAIRED_POOLS_HOOK_BLOB,test:env.TRANSFER_PATH_PAIRED_POOLS_TEST,plan:env.TRANSFER_PATH_PAIRED_POOLS_PLAN,
            helper:env.TRANSFER_PATH_PAIRED_POOLS_HELPER,nativeOuter:env.TRANSFER_PATH_PAIRED_POOLS_OUTER,preflight:custody.preflight,original:custody.original,fixed:custody.fixed,controls:custody.controls,controlsRerun:false,
            unit,unitCommands:1,raw,trackedBodies:source.trackedRows,sourceRows:source.sourceRows,cleanSourceRows:source.cleanSourceRows,rootConfigurations:source.rootConfigurations.length,
            distFiles,distTar:{file:'dist.tgz',bytes:tar.length,sha256:sha(tar)},distTupleSHA256:sha(JSON.stringify(normalized)),
            readers:readerRows.length,readerRows,immutableCaps:capRows.length,capRows,nativeReceipt:native,nativeChecks,referenceChecks:custody.referenceChecks,
            limits:'Fresh fixed units, normal production build, all readers and caps, native Transfer Path and full source holds. Active preflight, original, fixed and controls are retained admitted evidence. No controls rerun or release claim.',
          },null,2)+'\n',{flag:'wx'});
