          const workflow='.github/workflows/transfer-path-paired-pools-20261110.yml',helper='scripts/qa/playTransferPathPairedPools.mjs';
          const page='src/pages/TransferPath.tsx',hook='src/hooks/useTransferPath.ts',test='src/hooks/useTransferPathPairedPools.test.ts',plan='docs/plans/2026-11-10-transfer-path-paired-pools.md';
