      - name: Final physical source index locks versions build and reference holds
        if: always()
        run: |
          set -euo pipefail
          out=transfer-path-paired-pools-full
          git ls-files -s > "$out/source-after.txt"
          cmp "$out/source-before.txt" "$out/source-after.txt"
          git diff --exit-code HEAD -- .
          sha256sum package.json package-lock.json > "$out/locks-after.txt"
          cmp "$out/locks-before.txt" "$out/locks-after.txt"
          if [[ -f "$out/dist.sha256" ]]; then sha256sum --check "$out/dist.sha256"; fi
          if [[ -f "$out/native-admission-script.mjs" ]]; then
            test "$(git hash-object "$out/native-admission-script.mjs")" = "$TRANSFER_PATH_PAIRED_POOLS_OUTER"
            test -z "$(git ls-files -- "$out/native-admission-script.mjs")"
          fi
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          import {createHash} from 'node:crypto';
          const out='transfer-path-paired-pools-full',read=file=>JSON.parse(fs.readFileSync(out+'/'+file));
          const write=(file,body)=>fs.writeFileSync(out+'/'+file,JSON.stringify(body));
          const sha=bytes=>createHash('sha256').update(bytes).digest('hex');
          const tuple=(file,bytes)=>({file,bytes:bytes.length,sha256:sha(bytes)});
          const tracked=execFileSync('git',['ls-files','-z'],{encoding:'utf8',maxBuffer:16*1024*1024}).split('\0').filter(Boolean);
          const source=tracked.map(file=>tuple(file,fs.readFileSync(file)));
          assert.equal(source.length,5797);assert.deepEqual(source,read('tracked-before.json'));write('tracked-after.json',source);
          const lock=JSON.parse(fs.readFileSync('package-lock.json'));
          const versions=Object.keys(lock.packages).filter(file=>file.startsWith('node_modules/')&&fs.existsSync(file+'/package.json')).map(file=>[file,JSON.parse(fs.readFileSync(file+'/package.json')).version]);
          assert.equal(versions.length,521);for(const [file,version] of versions)assert.equal(version,lock.packages[file].version,file);
          assert.deepEqual(versions,read('installed-before.json'));write('installed-after.json',versions);
          const offlineBytes=fs.statSync(out+'/offline.log').size;assert.equal(offlineBytes,0);
          const walk=(dir,prefix='')=>fs.readdirSync(dir,{withFileTypes:true}).sort((a,b)=>a.name.localeCompare(b.name)).flatMap(entry=>{
            const file=prefix+entry.name;
            if(entry.isDirectory())return walk(path.join(dir,entry.name),file+'/');
            assert(entry.isFile()&&!entry.isSymbolicLink(),file+' actual regular retained body');return[file];
          });
          let distHeld=false,retainedPacketsHeld=false;
          if(fs.existsSync(out+'/dist-before.json')){
            const dist=walk('dist','dist/').map(file=>tuple(file,fs.readFileSync(file)));
            assert.equal(dist.length,850);assert.deepEqual(dist,read('dist-before.json'));write('dist-after.json',dist);distHeld=true;
          }
          if(fs.existsSync(out+'/packet-custody.json')){
            for(const role of ['preflight','original','fixed','controls']){
              const dir=out+'/'+role+'-reference',before=read(role+'-reference-before.json');
              const after=walk(dir).sort().map(file=>tuple(file,fs.readFileSync(path.join(dir,file))));
              assert.deepEqual(after,before);write(role+'-reference-after.json',after);
            }
            retainedPacketsHeld=true;
          }
          if(fs.existsSync(out+'/admission.json'))assert(distHeld&&retainedPacketsHeld);
          write('final-holds.json',{status:'passed',trackedBodies:source.length,scopedSourceRows:4667,cleanSourceRows:4666,rootConfigurations:11,installedLockedVersions:versions.length,
            indexUnchanged:true,sourceBytesUnchanged:true,locksUnchanged:true,distHeld,retainedPacketsHeld,offlineBytes,
            limits:'Final physical and custody holds. Full admission and completed workflow success are separate.'});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
