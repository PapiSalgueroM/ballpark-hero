            assert.equal(at(head,file),want,file);
            if(file!==helper) assert.equal(at(fixed,file),want,file+' held fixed');
          }
          const index=git('ls-files','--stage','-z').split('\0').filter(Boolean).map(row=>row.replace(' 0\t','\t').replace(/^(100(?:644|755)) /,'$1 blob '));
          assert.deepEqual([...index].sort(),[...current].sort(),'All actual index tuples equal the committed tree');
          const byFile=new Map(current.map(row=>[fileOf(row),row]));
          for(const file of [page,hook,test,plan,workflow,helper])assert(byFile.get(file).startsWith('100644 blob '),file+' exact source mode');
          const physical=git('ls-files','-z').split('\0').filter(Boolean).map(file=>{
