              actions: packet.actions.length, providerEvents: packet.providers.length, saveWrites: packet.writes.length,
              dailyStatus: packet.frames[5].status, dailyScore: packet.frames[5].score,
              unlimitedStatus: packet.frames[8].status, unlimitedScore: packet.frames[8].score,
              rawOffset, rawBytes: literal.length, rawSHA256: sha(literal),
