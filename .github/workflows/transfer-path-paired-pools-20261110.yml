            ['passed','/transfer-path',env.TRANSFER_PATH_PAIRED_POOLS_PAGE_BLOB,env.TRANSFER_PATH_PAIRED_POOLS_HOOK_BLOB,env.TRANSFER_PATH_PAIRED_POOLS_HELPER]);
          assert.deepEqual(native.source,{head:source.head,tree:source.tree,trackedBodies:5797,sourceRows:4667,
            rootConfigurations:11,distBodies:850,installedVersions:521});
          assert.deepEqual(native.boundaries,{isolatedChromium:true,clock:'Date only',externalForwarding:false,autocomplete:false,liveProvider:false,fullGeometry:false});
          const c=native.census,e=native.evidence;
          assert.deepEqual([c.journeys,c.contexts,c.viewportPNGs,c.frames,c.trustedClicks,c.providerResponses,c.completionAttempts],
