          for(const field of ['navigations','localResponses','corsPreflights','blockedReads'])assert(Number.isInteger(c[field])&&c[field]>=0);
          assert(c.navigations>=6&&c.localResponses>=12);
          assert.deepEqual(e.report,nativeBody('report.json'));
          assert.deepEqual(e.raw,nativeBody('raw.json'));
          assert.deepEqual(e.bodyManifest,nativeBody('body-manifest.json'));
          assert.deepEqual([e.screenshots.length,e.fixtureBodies.length],[12,6]);
          for(const row of [...e.screenshots,...e.fixtureBodies]){
            assert(/^(?:png\/(?:320|390|1280)-(?:puzzles-only|careers-only)-(?:daily|unlimited)\.png|fixtures\/(?:puzzles-only|careers-only)-(?:puzzles|players|seasons)\.json)$/.test(row.file));
            assert.deepEqual(row,nativeBody(row.file));
          }
          assert.equal(new Set([...e.screenshots,...e.fixtureBodies].map(row=>row.file)).size,18);
          assert.deepEqual(read('browser/body-manifest.json'),[e.raw,e.report,...e.screenshots,...e.fixtureBodies].sort((a,b)=>a.file.localeCompare(b.file)));
          const nativeRaw=read('browser/raw.json'),nativeReport=read('browser/report.json');
          assert.deepEqual([nativeRaw.status,nativeReport.status,nativeRaw.source,nativeRaw.census,nativeReport.census,nativeReport.raw],
            ['passed','passed',native.source,c,c,e.raw]);
          for(const row of native.inputs.full){
            const body=bytes(row.file);
            assert.deepEqual(row,{file:row.file,bytes:body.length,sha256:sha(body)});
          }
          assert.equal(native.inputs.full.find(row=>row.file==='public-cases.raw.json').sha256,raw.raw.sha256);
          assert.equal(unit.actualCases,14);
          assert.deepEqual([custody.status,custody.controlsRerun],['passed',false]);
          return {status:'passed',journeys:c.journeys,contexts:c.contexts,viewportPNGs:c.viewportPNGs,
            trustedClicks:c.trustedClicks,providerResponses:c.providerResponses,abortedCompletions:c.completionAttempts,bodyManifest:e.bodyManifest};
          })();
          assert.equal(nativeChecks?.status,'passed','Reviewed actual native validator must complete');
          assert.deepEqual([native.status,native.route,native.page,native.hook,native.helper],['passed','/transfer-path',env.TRANSFER_PATH_PAIRED_POOLS_PAGE_BLOB,env.TRANSFER_PATH_PAIRED_POOLS_HOOK_BLOB,env.TRANSFER_PATH_PAIRED_POOLS_HELPER]);
          const expected='simAdsense,simBrand,simHeadTags,simHiddenPages,simHubs,simIndexNow,simIndexing,simInternalLinks,simNoRivalNames,simPrerender,simPrerenderBoot,simRetiredRoutes,simSchema,simSitemap,simSnapshotAssets,simSiteSearch,simGuideHeadings,simSeoMetaSplit,simHomeCopy,simHarnessAnchors'.split(',').map(name=>name+'.mjs').sort();
          const readers=bytes('readers.log').toString('utf8'),readerRows=[...readers.matchAll(/^\s+PASS\s+(sim[A-Za-z0-9]+\.mjs)/gm)].map(row=>row[1]).sort();
          assert.deepEqual(readerRows,expected);assert(!/^\s+FAIL\s+/m.test(readers));
          const weight=bytes('weight.log').toString('utf8');
          const capRows=[...weight.matchAll(/^\s+(\/\S*)\s+\d+K gz over\s+\d+ files \(budget (\d+)K, [\d.]+K to the tenth\)/gm)].map(row=>[row[1],Number(row[2])]);
          assert.deepEqual(capRows,[['/',245],['/club-manager',648],['/soccer-career',840],['/stadium-tycoon',305],['/wonderkid-factory',278],['/minefield',295],['/footle',354],['/nfl-my-career',499],['/front-office',390],['/soccer-grid',320],['/leaderboard',266],['/manager-hot-seat',672],['/deadline-day',680],['/transfer-path',381],['/nba-front-office',397],['/nhl-front-office',379]]);
