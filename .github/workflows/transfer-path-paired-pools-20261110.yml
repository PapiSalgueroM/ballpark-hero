          export TRANSFER_PATH_PAIRED_POOLS_CONTROLS_REFERENCE="$PWD/$out/controls-reference"
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          node scripts/qa/playTransferPathPairedPools.mjs 2>&1 | tee "$out/browser.log"
          node "$out/native-admission-script.mjs" "$out/browser" > "$out/native-admission.json" 2> "$out/native-admission.log" || { cat "$out/native-admission.log"; exit 1; }
