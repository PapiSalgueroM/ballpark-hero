name: Home search failure recovery

on:
  workflow_dispatch:
  push:
    branches:
      - codex/home-search-recovery-1088
  pull_request:
    paths:
      - .github/workflows/home-search-recovery.yml
      - src/components/home/HomeSearchUnavailable.tsx
      - src/pages/Index.tsx
      - src/test/homeSearchRecovery.test.tsx
      - scripts/simHomeSearchRecovery.mjs
      - scripts/playHomeSearchRecovery1088.mjs

permissions:
  contents: read
concurrency:
  group: home-search-recovery-1088-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    defaults:
      run:
        shell: bash
    env:
      SIM_NETWORK: offline
      ENGINES: chromium
      TZ: UTC
      VITEST_MAX_FORKS: 1
      VITEST_MIN_FORKS: 1
      SEO_SPLIT_BASE_REF: HEAD
      SIM_OFFLINE_RECEIPT: home-search-recovery-artifacts/transport.log
      HOME_SEARCH_RECOVERY_ARTIFACTS: home-search-recovery-artifacts/outcomes
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare remote verification
        run: |
          mkdir -p home-search-recovery-artifacts
          git rev-parse HEAD > home-search-recovery-artifacts/source-head.txt
          git rev-parse 'HEAD^{tree}' > home-search-recovery-artifacts/source-tree.txt
          sha256sum package.json package-lock.json > home-search-recovery-artifacts/dependencies-before.txt
          npm ci
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const lock = JSON.parse(fs.readFileSync('package-lock.json'));
          const rows = Object.entries(lock.packages).filter(([p]) => p.startsWith('node_modules/') && fs.existsSync(p + '/package.json')).map(([p, e]) => {
            const version = JSON.parse(fs.readFileSync(p + '/package.json')).version;
            assert.equal(version, e.version); return { path: p, version };
          });
          assert(rows.length > 0);
          fs.writeFileSync('home-search-recovery-artifacts/installed-before.json', JSON.stringify(rows, null, 2));
          NODE
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          python -m pip install fonttools pillow
      - name: Retain the actual browser verification runtime
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          const packages = ['react', 'react-dom', 'vitest', 'esbuild', 'playwright', 'playwright-core'];
          const corePackage = JSON.parse(fs.readFileSync('node_modules/playwright-core/package.json'));
          const coreExport = corePackage.exports['./lib/coreBundle'];
          assert(typeof coreExport === 'string', 'The installed browser package declares its core source export');
          const coreSource = 'node_modules/playwright-core/' + coreExport.replace(/^\.\//, '');
          const files = [...packages.map(name => 'node_modules/' + name + '/package.json'), coreSource];
          const hashes = {};
          for (const file of files) {
            assert(fs.existsSync(file), 'The diagnostic runtime source exists: ' + file);
            const bytes = fs.readFileSync(file);
            hashes[file] = createHash('sha256').update(bytes).digest('hex');
            const destination = 'home-search-recovery-artifacts/runtime/' + file;
            fs.mkdirSync(destination.slice(0, destination.lastIndexOf('/')), { recursive: true });
            fs.writeFileSync(destination, bytes);
          }
          const versions = Object.fromEntries(packages.map(name => [name, JSON.parse(fs.readFileSync('node_modules/' + name + '/package.json')).version]));
          fs.writeFileSync('home-search-recovery-artifacts/runtime.json', JSON.stringify({ node: process.version, versions, hashes }, null, 2));
          NODE
          timeout --version > home-search-recovery-artifacts/timeout-version.txt
      - name: Actual app types and build
        id: build
        run: |
          node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee home-search-recovery-artifacts/types.log
          npm run build 2>&1 | tee home-search-recovery-artifacts/build.log
      - name: Cache actual template fonts
        id: assets
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/playHomeSearchRecovery1088.mjs --prefetch-assets-only 2>&1 | tee home-search-recovery-artifacts/fonts.log
      - name: Actual outcomes and effective copied faults
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.assets.outcome == 'success' }}
        run: NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/simHomeSearchRecovery.mjs 2>&1 | tee home-search-recovery-artifacts/outcomes.log
      - name: Retain completed mounted and runtime evidence before native
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: home-search-mounted-${{ github.run_id }}-${{ github.run_attempt }}
          path: home-search-recovery-artifacts/
          retention-days: 3
          if-no-files-found: error
      - name: Prove the native deadline fails and cleans only owned processes
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.assets.outcome == 'success' }}
        run: |
          set +e
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" xvfb-run -a timeout --verbose --signal=TERM --kill-after=15s 30s node scripts/playHomeSearchRecovery1088.mjs --deadline-control 2>&1 | tee home-search-recovery-artifacts/deadline-control.log
          result=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$result" > home-search-recovery-artifacts/deadline-control-exit.txt
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const dir = 'home-search-recovery-artifacts';
          const report = JSON.parse(fs.readFileSync(dir + '/native-deadline-control/report.json'));
          const result = Number(fs.readFileSync(dir + '/deadline-control-exit.txt', 'utf8').trim());
          const proof = { result, complete: report.complete, error: report.error, termination: report.termination, checks: [] };
          try {
            assert.equal(result, 124);
            assert.equal(report.error?.name, 'NativeDeadlineError'); assert.equal(report.complete, false);
            assert.deepEqual(report.cases, []); assert.deepEqual(report.controls, []);
            assert(report.termination.activeOperations.some(op => op.name === 'deadline control deliberate unresolved promise'));
            for (const field of ['source', 'build', 'cache']) assert.deepEqual(report[field + 'After'], report[field + 'Before']);
            assert.equal(report.sourceHoldError, undefined);
            const pids = [...new Set([report.deadlineControl.serverPid, ...report.deadlineControl.browserProcesses.map(p => Number(p.id))])];
            assert(pids.length >= 2 && pids.every(pid => Number.isSafeInteger(pid) && pid > 1 && pid !== process.pid));
            for (let attempt = 0; attempt < 21; attempt++) {
              const states = pids.map(pid => ({ pid, exists: fs.existsSync('/proc/' + pid) }));
              proof.checks.push({ attempt, states });
              if (states.every(row => !row.exists)) break;
              if (attempt < 20) await new Promise(resolve => setTimeout(resolve, 250));
            }
            assert(proof.checks.at(-1).states.every(row => !row.exists), 'All recorded owned server/browser PIDs are gone');
            assert(!/Home search native: PASS/.test(fs.readFileSync(dir + '/deadline-control.log', 'utf8')));
            proof.proved = true;
          } catch (error) { proof.proved = false; proof.failure = { name: error.name, message: error.message }; throw error; }
          finally { fs.writeFileSync(dir + '/deadline-control-proof.json', JSON.stringify(proof, null, 2)); }
          NODE
      - name: Native built Home failed search recovery and healthy fold
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.assets.outcome == 'success' }}
        run: |
          set +e
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" xvfb-run -a timeout --verbose --signal=TERM --kill-after=15s 8m node scripts/playHomeSearchRecovery1088.mjs 2>&1 | tee home-search-recovery-artifacts/native.log
          result=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$result" > home-search-recovery-artifacts/native-exit.txt
          exit "$result"
      - name: Retain new verification evidence promptly
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: home-search-new-${{ github.run_id }}-${{ github.run_attempt }}
          path: home-search-recovery-artifacts/
          retention-days: 3
          if-no-files-found: error
      - name: Original relevant gameplay and score checks
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          failed=0
          for harness in simHomeFront simHomeCopy simSiteSearch simGamePicks simScoringCoverage simScoreShown; do
            NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" ONLY="$harness" node scripts/runAllSims.mjs --browser 2>&1 | tee "home-search-recovery-artifacts/$harness.log" || failed=1
          done
          exit "$failed"
      - name: All built readers and source anchors
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          failed=0
          for harness in simAdsense simBrand simHeadTags simHiddenPages simHubs simIndexNow simIndexing simInternalLinks simNoRivalNames simPrerender simPrerenderBoot simRetiredRoutes simSchema simSitemap simSnapshotAssets simSiteSearch simGuideHeadings simSeoMetaSplit simHomeCopy simHarnessAnchors; do
            ONLY="$harness" node scripts/runAllSims.mjs --browser 2>&1 | tee "home-search-recovery-artifacts/$harness.log" || failed=1
          done
          exit "$failed"
      - name: Preserve engines data fixtures dependencies and source
        if: ${{ !cancelled() }}
        run: |
          git diff --exit-code 5b70b05f6df7b15f64b8c5ddf1f4b7d0c7cd4c7f HEAD -- src/lib src/data src/hooks src/integrations src/types scripts/fixtures package.json package-lock.json
          git diff --exit-code HEAD -- src scripts .github/workflows/home-search-recovery.yml
          sha256sum package.json package-lock.json > home-search-recovery-artifacts/dependencies-after.txt
          cmp home-search-recovery-artifacts/dependencies-before.txt home-search-recovery-artifacts/dependencies-after.txt
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const before = JSON.parse(fs.readFileSync('home-search-recovery-artifacts/installed-before.json'));
          const after = before.map(row => ({ path: row.path, version: JSON.parse(fs.readFileSync(row.path + '/package.json')).version }));
          assert.deepEqual(after, before);
          fs.writeFileSync('home-search-recovery-artifacts/installed-after.json', JSON.stringify(after, null, 2));
          NODE
          if test -f home-search-recovery-artifacts/transport.log; then test ! -s home-search-recovery-artifacts/transport.log; fi
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-search-recovery-1088-${{ github.run_id }}-${{ github.run_attempt }}
          path: home-search-recovery-artifacts/
          retention-days: 3
          if-no-files-found: error
