        run: |
          set -uo pipefail
          source "$OUT/capture.sh"
          failed=0
          host_pid=''
          stop_host() {
            if [ -z "$host_pid" ]; then return; fi
            local requested=0 code=0
            if kill -0 "$host_pid" 2>/dev/null; then
              kill -TERM "$host_pid" || failed=1
              requested=1
            else failed=1; fi
            wait "$host_pid" || code=$?
            printf '%s\n' "$code" > "$OUT/host.exit"
