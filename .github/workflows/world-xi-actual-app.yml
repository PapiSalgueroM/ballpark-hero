          SIM_NETWORK=offline SIM_OFFLINE_RECEIPT="$OUT/host.transport" NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/lib/hostLikeServer.mjs dist 4173 > "$OUT/host.stdout" 2> "$OUT/host.stderr" &
          host_pid="$!"
          printf '%s\n' "$host_pid" > "$OUT/host.pid"
          capture readiness OFFLINE node --input-type=module <<'READY'
          import assert from 'node:assert/strict';import fs from 'node:fs';import path from 'node:path';
          let last=null;
          for(let attempt=0;attempt<100;attempt++){
            try{const response=await fetch('http://127.0.0.1:4173/world-xi');assert.equal(response.status,200);const body=Buffer.from(await response.arrayBuffer());assert(body.equals(fs.readFileSync('dist/world-xi/index.html')));last=null;break;}
            catch(error){last=error;await new Promise(resolve=>setTimeout(resolve,100));}
          }
          if(last)throw last;
          const out=process.env.OUT;assert.equal(fs.readFileSync(out+'/host.stderr').length,0);
          assert.equal(fs.readFileSync(out+'/host.stdout','utf8').trim(),'host-like server: '+path.resolve('dist')+' on http://127.0.0.1:4173');
          console.log('WORLD_XI_HOST PASS exact owned server and held route document');
          READY
          readiness_code="$?"
          if [ "$readiness_code" -ne 0 ]; then failed=1; stop_host; trap - EXIT; exit "$failed"; fi
          if [ -n "${SWEEP_WEIGHT_CONTROL-}" ]; then failed=1; stop_host; trap - EXIT; exit "$failed"; fi
          capture caps OFFLINE env NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs --require=$OUT/cached-fonts.cjs" WORLD_XI_ROUTE_OUT="$OUT/generic" BASE=http://127.0.0.1:4173 SWEEP_BASE=http://127.0.0.1:4173 SWEEP_OFFLINE=1 node scripts/sweepWeight.mjs || failed=1
          for reader in simAdsense simBrand simHeadTags simHiddenPages simHubs simIndexNow simIndexing simInternalLinks simNoRivalNames simPrerender simPrerenderBoot simRetiredRoutes simSchema simSitemap simSnapshotAssets; do
            capture "$reader" OFFLINE env NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs --require=$OUT/cached-fonts.cjs" WORLD_XI_ROUTE_OUT="$OUT/generic" BASE=http://127.0.0.1:4173 SWEEP_BASE=http://127.0.0.1:4173 node "scripts/$reader.mjs" || failed=1
          done
          test ! -s "$OUT/generic/font-cache-misses.jsonl" || failed=1
          printf '%s\n' "$failed" > "$OUT/readers.exit"
          stop_host
          trap - EXIT
          printf '%s\n' "$failed" > "$OUT/caps-readers-cleanup.exit"
          exit "$failed"
      - name: Always retain full source dependency tool browser cache and dist custody
        if: always()
        run: |
          set -uo pipefail
          failed=0
          OUT="$RUNNER_TEMP/world-xi-actual-app"; export OUT
          mkdir -p "$OUT"
          if [ -f "$OUT/helper.sha256" ]; then sha256sum -c "$OUT/helper.sha256" > "$OUT/helpers-held.log" 2>&1 || failed=1; else printf 'UNAVAILABLE\n' > "$OUT/helpers-held.log"; failed=1; fi
          if [ -f "$OUT/source.sha256" ]; then sha256sum -c "$OUT/source.sha256" > "$OUT/source-held.log" 2>&1 || failed=1; else printf 'UNAVAILABLE\n' > "$OUT/source-held.log"; failed=1; fi
          if [ -f "$OUT/source.members.before" ]; then
            git ls-files -z > "$OUT/source.members.after" || failed=1
            cmp "$OUT/source.members.before" "$OUT/source.members.after" > "$OUT/source-members-held.log" 2>&1 || failed=1
          else printf 'UNAVAILABLE\n' > "$OUT/source-members-held.log"; failed=1; fi
          if [ -f "$OUT/custody.sh" ]; then
            source "$OUT/custody.sh"
            framework_cache_snapshot after || failed=1
            if [ -d node_modules ]; then members node_modules dependencies after || failed=1; else failed=1; fi
            if [ -f "$OUT/tools-root.txt" ]; then
              tools="$(cat "$OUT/tools-root.txt")"
              if [ -d "$tools/node_modules" ]; then members "$tools/node_modules" reader-packages after || failed=1; else failed=1; fi
              if [ -d "$tools/python" ]; then
                members "$tools/python" python after || failed=1
                "$tools/python/bin/python" -m pip freeze > "$OUT/python-packages.after" || failed=1
                cmp "$OUT/python-packages.before" "$OUT/python-packages.after" > "$OUT/python-packages-held.log" 2>&1 || failed=1
              else failed=1; fi
            else failed=1; fi
            if [ -f "$OUT/chromium-root.txt" ]; then
              chromium="$(cat "$OUT/chromium-root.txt")"
              if [ -d "$chromium" ]; then members "$chromium" chromium after || failed=1; else failed=1; fi
            else failed=1; fi
            if [ -d dist ]; then members dist dist after || failed=1; else failed=1; fi
            if [ -d "$OUT/input-archive" ]; then members "$OUT/input-archive" archive-inputs after || failed=1; else failed=1; fi
            if [ -d "$OUT/generic/font-cache" ]; then members "$OUT/generic/font-cache" generic-fonts after || failed=1; else failed=1; fi
          else failed=1; fi
          for label in dependencies reader-packages python chromium dist archive-inputs generic-fonts; do
            if [ -f "$OUT/$label.sha256" ]; then sha256sum -c "$OUT/$label.sha256" > "$OUT/$label-held.log" 2>&1 || failed=1; else printf 'UNAVAILABLE\n' > "$OUT/$label-held.log"; failed=1; fi
            for kind in members links; do
              if [ -f "$OUT/$label.$kind.before" ] && [ -f "$OUT/$label.$kind.after" ]; then
                cmp "$OUT/$label.$kind.before" "$OUT/$label.$kind.after" > "$OUT/$label-$kind-held.log" 2>&1 || failed=1
              else printf 'UNAVAILABLE\n' > "$OUT/$label-$kind-held.log"; failed=1; fi
            done
          done
          if [ -f "$OUT/tool-roots.sha256" ]; then sha256sum -c "$OUT/tool-roots.sha256" > "$OUT/tool-roots-held.log" 2>&1 || failed=1; else printf 'UNAVAILABLE\n' > "$OUT/tool-roots-held.log"; failed=1; fi
          if [ -f "$OUT/tools-root.txt" ]; then
            tools="$(cat "$OUT/tools-root.txt")"
            for name in playwright playwright-core; do
              if [ -L "node_modules/$name" ] && [ "$(readlink "node_modules/$name")" = "$tools/node_modules/$name" ]; then unlink "node_modules/$name"; else failed=1; fi
            done
          fi
          git diff --exit-code HEAD > "$OUT/final-source.diff" || failed=1
          git ls-files --others --exclude-standard > "$OUT/untracked.txt" || failed=1
          test ! -s "$OUT/untracked.txt" || failed=1
          find "$OUT" -type f \( -name '*.transport' -o -name transport.log \) -print0 > "$OUT/transport.members" || failed=1
          while IFS= read -r -d '' receipt; do test ! -s "$receipt" || failed=1; done < "$OUT/transport.members"
          printf '%s\n' "$failed" > "$OUT/final-holds.exit"
          exit "$failed"
      - name: Always retain original raw and partial evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-xi-actual-app-${{ github.run_id }}
          path: ${{ runner.temp }}/world-xi-actual-app
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
