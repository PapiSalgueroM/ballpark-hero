          let primary=null;try{admit(JSON.parse(fs.readFileSync(directory+'/changed.json')));}catch(error){primary={name:error.name,message:error.message,stack:error.stack};assert(error instanceof assert.AssertionError);assert.equal(error.message.split('\n')[0],'WORLD_XI_CAP_ROWS');}assert(primary);
          fs.writeFileSync(directory+'/primary.json',JSON.stringify(primary,null,2));fs.writeFileSync(directory+'/restored.json',before);assert(fs.readFileSync(directory+'/restored.json').equals(before));admit(JSON.parse(fs.readFileSync(directory+'/restored.json')));
          fs.writeFileSync(out+'/weight-budget-admission.json',JSON.stringify({status:'PASS',source:{file,bytes:body.length,sha256:hash('sha256',body),git:'5a92a68cc0225d5e633c19e041087e7c6c4254e8'},rows,worldXiHasNoBudget:true,control:{kind:'detached-row-copy',changed:true,beforeSHA256:hash('sha256',before),changedSHA256:hash('sha256',mutant),restoredSHA256:hash('sha256',before),ownedFirstAssertion:'WORLD_XI_CAP_ROWS',fullInverse:true,healthyRestore:true,primary},scope:'Executable AST and exact current parent budget table. No budget, source, threshold, timing or profile change.'},null,2));
