name: Soccer Grid rarity preservation closure
on:
  push:
    branches: [codex/soccer-grid-settlement-qa-20261105]
permissions:
  contents: read
jobs:
  rarity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        shell: bash
    env:
      SIM_NETWORK: offline
      SIM_OFFLINE_RECEIPT: grid-rarity-closure/offline.log
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - name: Locked source and dependencies
        run: |
          mkdir -p grid-rarity-closure
          touch grid-rarity-closure/offline.log
          git ls-files -s > grid-rarity-closure/source-before.txt
          sha256sum package.json package-lock.json > grid-rarity-closure/locks-before.txt
          npm ci
      - name: Existing rarity formula order and effective controls
        run: |
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          node scripts/simGridRarity.mjs 2>&1 | tee grid-rarity-closure/fixed.log
          SIM_RARITY_CONTROL=order node scripts/simGridRarity.mjs 2>&1 | tee grid-rarity-closure/order.log
          SIM_RARITY_CONTROL=local node scripts/simGridRarity.mjs 2>&1 | tee grid-rarity-closure/local.log
      - name: Source lock and offline holds
        if: always()
        run: |
          git diff --exit-code HEAD -- src scripts public package.json package-lock.json
          git ls-files -s > grid-rarity-closure/source-after.txt
          cmp grid-rarity-closure/source-before.txt grid-rarity-closure/source-after.txt
          sha256sum package.json package-lock.json > grid-rarity-closure/locks-after.txt
          cmp grid-rarity-closure/locks-before.txt grid-rarity-closure/locks-after.txt
          test ! -s grid-rarity-closure/offline.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soccer-grid-rarity-closure-${{ github.run_id }}
          path: grid-rarity-closure
          retention-days: 14
          if-no-files-found: error
