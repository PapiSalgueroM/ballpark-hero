name: Soccer Grid original clock policy proof
on:
  push:
    branches: [codex/soccer-grid-settlement-qa-20261105]
permissions:
  contents: read
jobs:
  original:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        shell: bash
    env:
      SIM_NETWORK: offline
      SIM_OFFLINE_RECEIPT: grid-settlement-original/offline.log
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - name: Original source and locked dependencies
        run: |
          mkdir -p grid-settlement-original
          git rev-parse HEAD > grid-settlement-original/head.txt
          git ls-files -s > grid-settlement-original/source-before.txt
          sha256sum package.json package-lock.json > grid-settlement-original/locks-before.txt
          npm ci
      - name: Proper app types including new test leaves
        run: node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee grid-settlement-original/types.log
      - name: Exact original missing clock policy
        if: ${{ !cancelled() }}
        run: |
          set +e
          SC_GRID_POLICY_RAW="$PWD/grid-settlement-original/policy-raw.json" NODE_OPTIONS="--max-old-space-size=6144 --require=$PWD/scripts/lib/offlineTransport.cjs" node node_modules/vitest/vitest.mjs run src/test/soccerGridTimerPolicy.test.tsx --maxWorkers=1 --minWorkers=1 --reporter=default --reporter=json --outputFile=grid-settlement-original/units.json > grid-settlement-original/units.log 2>&1
          status=$?
          set -e
          cat grid-settlement-original/units.log
          test "$status" -eq 1
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const report=JSON.parse(fs.readFileSync('grid-settlement-original/units.json'));
          const rows=report.testResults.flatMap(s=>s.assertionResults),failed=rows.filter(x=>x.status==='failed');
          assert.equal(report.numTotalTests,2);assert.equal(rows.length,2);assert.equal(failed.length,2);assert.equal(rows.filter(x=>x.status==='passed').length,0);
          assert.deepEqual(failed.map(x=>x.title.split(' ')[0]).sort(),['SG_TIMER_POLICY_HELP','SG_TIMER_POLICY_PREPLAY']);
          for(const row of failed)assert(row.failureMessages.length>0&&row.failureMessages.every(msg=>/^(?:AssertionError: SG_TIMER_POLICY_|Error: expect\(element\)\.)/m.test(msg.replace(/\u001b\[[0-?]*[ -/]*[@-~]/g,''))),'Owned missing clock policy assertion: '+row.title);
          assert(!/Unhandled Errors|Unhandled Rejection|Uncaught Exception|Failed to resolve import/.test(fs.readFileSync('grid-settlement-original/units.log','utf8')));
          assert(fs.statSync('grid-settlement-original/policy-raw.json').size>1000);
          console.log('PASS original clock policy: exact2missing-copy business failures');
          NODE
      - name: Source lock and offline holds
        if: always()
        run: |
          git diff --exit-code HEAD -- src scripts package.json package-lock.json
          git ls-files -s > grid-settlement-original/source-after.txt
          cmp grid-settlement-original/source-before.txt grid-settlement-original/source-after.txt
          sha256sum package.json package-lock.json > grid-settlement-original/locks-after.txt
          cmp grid-settlement-original/locks-before.txt grid-settlement-original/locks-after.txt
          if test -f grid-settlement-original/offline.log; then test ! -s grid-settlement-original/offline.log; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soccer-grid-policy-original-${{ github.run_id }}
          path: grid-settlement-original
          retention-days: 14
          if-no-files-found: error
