name: Soccer Grid clean build and native capture closure
on:
  push:
    branches: [codex/soccer-grid-settlement-qa-20261105]
permissions:
  contents: read
  actions: read
jobs:
  closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      SIM_NETWORK: offline
      SIM_OFFLINE_RECEIPT: grid-clean-closure/offline.log
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Locked dependencies and clean source receipts
        run: |
          mkdir -p grid-clean-closure
          touch grid-clean-closure/offline.log
          git rev-parse HEAD > grid-clean-closure/head.txt
          git rev-parse 'HEAD^{tree}' > grid-clean-closure/tree.txt
          git ls-files -s > grid-clean-closure/source-before.txt
          sha256sum package.json package-lock.json > grid-clean-closure/locks-before.txt
          npm ci
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const lock=JSON.parse(fs.readFileSync('package-lock.json'));
          const rows=Object.keys(lock.packages).filter(p=>p.startsWith('node_modules/')&&fs.existsSync(p+'/package.json')).map(p=>[p,JSON.parse(fs.readFileSync(p+'/package.json')).version]);
          assert.equal(rows.length,521);fs.writeFileSync('grid-clean-closure/installed-before.json',JSON.stringify(rows));
          NODE
      - name: Proper app types
        run: node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee grid-clean-closure/types.log
      - name: Pinned completed qualification artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/PapiSalgueroM/ballpark-hero/actions/artifacts/13465094870/zip > "$RUNNER_TEMP/grid-reference.zip"
          echo "0a045fb4b18b8f280fbfd3a06121b4b54deac6cc7f5162a6b7b36a0005260e7c  $RUNNER_TEMP/grid-reference.zip" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/grid-reference" "$RUNNER_TEMP/grid-reference-dist"
          unzip -q "$RUNNER_TEMP/grid-reference.zip" -d "$RUNNER_TEMP/grid-reference"
          echo "640a6f32e28e4aa7857a26e7362dac3c48dc2d648580d83d2925e454011bc6f0  $RUNNER_TEMP/grid-reference/dist.tgz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/grid-reference/dist.tgz" -C "$RUNNER_TEMP/grid-reference-dist"
          cp "$RUNNER_TEMP/grid-reference/source-before.txt" grid-clean-closure/reference-source.txt
      - name: Clean production build
        run: NODE_OPTIONS="--max-old-space-size=6144" npm run build 2>&1 | tee grid-clean-closure/build.log
      - name: Every product test script and built byte joined to completed qualification
        env:
          GRID_REFERENCE_DIR: ${{ runner.temp }}/grid-reference
          GRID_REFERENCE_DIST: ${{ runner.temp }}/grid-reference-dist/dist
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import path from 'node:path';import assert from 'node:assert/strict';import {createHash} from 'node:crypto';
          const sha=bytes=>createHash('sha256').update(bytes).digest('hex');
          const gitblob=bytes=>createHash('sha1').update(Buffer.concat([Buffer.from('blob '+bytes.length+'\0'),bytes])).digest('hex');
          const readIndex=file=>new Map(fs.readFileSync(file,'utf8').trim().split('\n').map(line=>{const m=/^[0-9]+ ([0-9a-f]{40}) 0\t(.+)$/.exec(line);assert(m,'Actual source row');return [m[2],m[1]];}));
          const old=readIndex('grid-clean-closure/reference-source.txt'),current=readIndex('grid-clean-closure/source-before.txt');
          const derived=JSON.parse(fs.readFileSync(path.join(process.env.GRID_REFERENCE_DIR,'derived.json'))).derived;
          assert.equal(derived.length,5,'Exact derived file census');
          for(const item of derived){const bytes=fs.readFileSync(path.join(process.env.GRID_REFERENCE_DIR,'derived',item.file));assert.equal(sha(bytes),item.sha256);assert.equal(bytes.length,item.bytes);old.set(item.file,gitblob(bytes));assert.equal(current.get(item.file),gitblob(bytes),'Exact generated blob: '+item.file);}
          const excluded=new Set(['scripts/qa/checkSoccerGridSubmission.mjs','scripts/qa/playSoccerGridSubmission.mjs']);
          assert.equal(old.get('scripts/qa/checkSoccerGridSubmission.mjs'),'f6e8a5dcfff458ea02f7836f99f30ff7033f06a8');
          assert.equal(old.get('scripts/qa/playSoccerGridSubmission.mjs'),'64f882fa01c17e07afc9edfa3fd516fa02d3756a');
          assert(!current.has('scripts/qa/checkSoccerGridSubmission.mjs'),'Control runner is remote qualification only');
          assert.equal(current.get('scripts/qa/playSoccerGridSubmission.mjs'),'5b5775705f3173618609605b2bf33c3ec6971cbc','Only exact native capture preparation repair admitted');
          const scoped=map=>[...map].filter(([p])=>/^(?:src|public|scripts)\//.test(p)&&!excluded.has(p)).sort(([a],[b])=>a.localeCompare(b));
          const sourceRows=scoped(current);assert.deepEqual(sourceRows,scoped(old),'Every other source/public/script blob held, with exact generated files admitted');
          const inventory=dir=>fs.readdirSync(dir,{withFileTypes:true}).sort((a,b)=>a.name.localeCompare(b.name)).flatMap(e=>e.isDirectory()?inventory(path.join(dir,e.name)).map(r=>({...r,path:e.name+'/'+r.path})):[{path:e.name,bytes:fs.statSync(path.join(dir,e.name)).size,sha256:sha(fs.readFileSync(path.join(dir,e.name)))}]);
          const actual=inventory('dist'),reference=inventory(process.env.GRID_REFERENCE_DIST);
          assert.equal(actual.length,849);assert.deepEqual(actual,reference,'Every byte of every built file matches completed readers/caps/browser');
          const result={status:'passed',referenceRun:42136658673,referenceApp:'bf9d8a39cd422f25a4a478551bd01589e7516a9b',referenceArtifact:13465094870,referenceZipSHA256:'0a045fb4b18b8f280fbfd3a06121b4b54deac6cc7f5162a6b7b36a0005260e7c',referenceTarSHA256:'640a6f32e28e4aa7857a26e7362dac3c48dc2d648580d83d2925e454011bc6f0',sourceRows:sourceRows.length,remoteOnlyHelpers:[...excluded],derived,distFiles:actual.length,distManifestSHA256:sha(JSON.stringify(actual)),dist:actual};
          fs.writeFileSync('grid-clean-closure/reference-build-join.json',JSON.stringify(result,null,2));console.log('PASS all '+sourceRows.length+' source rows and every '+actual.length+' built file held');
          NODE
      - name: Isolated browser and snapshot dependencies
        id: browser_setup
        timeout-minutes: 12
        if: ${{ !cancelled() }}
        run: |
          npm install --prefix "$RUNNER_TEMP/grid-browser" --no-save --package-lock=false playwright@1.64.1
          test ! -e node_modules/playwright
          ln -s "$RUNNER_TEMP/grid-browser/node_modules/playwright" node_modules/playwright
          node "$RUNNER_TEMP/grid-browser/node_modules/playwright/cli.js" install --with-deps chromium
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const before=JSON.parse(fs.readFileSync('grid-clean-closure/installed-before.json'));
          const after=before.map(([p])=>[p,JSON.parse(fs.readFileSync(p+'/package.json')).version]);assert.deepEqual(after,before);
          fs.writeFileSync('grid-clean-closure/installed-after.json',JSON.stringify(after));console.log('Preserved all '+after.length+' locked installed versions.');
          NODE
      - name: Native six journeys with prepared phase captures
        if: ${{ !cancelled() && steps.browser_setup.outcome == 'success' }}
        run: SOCCER_GRID_BROWSER_OUT=grid-clean-closure/browser NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/qa/playSoccerGridSubmission.mjs 2>&1 | tee grid-clean-closure/browser.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soccer-grid-clean-phase-images-${{ github.run_id }}
          path: grid-clean-closure/browser/*.png
          retention-days: 14
          if-no-files-found: error
      - name: Final source locks installed versions and offline holds
        if: always()
        run: |
          git ls-files -s > grid-clean-closure/source-after.txt
          cmp grid-clean-closure/source-before.txt grid-clean-closure/source-after.txt
          git diff --exit-code HEAD -- src scripts public package.json package-lock.json
          sha256sum package.json package-lock.json > grid-clean-closure/locks-after.txt
          cmp grid-clean-closure/locks-before.txt grid-clean-closure/locks-after.txt
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const before=JSON.parse(fs.readFileSync('grid-clean-closure/installed-before.json'));
          const after=before.map(([p])=>[p,JSON.parse(fs.readFileSync(p+'/package.json')).version]);assert.equal(after.length,521);assert.deepEqual(after,before);
          fs.writeFileSync('grid-clean-closure/installed-final.json',JSON.stringify(after));
          assert(fs.existsSync('grid-clean-closure/offline.log'));assert.equal(fs.statSync('grid-clean-closure/offline.log').size,0);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soccer-grid-clean-closure-${{ github.run_id }}
          path: grid-clean-closure
          retention-days: 14
          if-no-files-found: error
