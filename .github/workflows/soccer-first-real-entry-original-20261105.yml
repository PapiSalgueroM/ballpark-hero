name: Soccer first real entry original first
on:
  push:
    branches: [codex/soccer-first-real-entry-original-20261105]
permissions:
  contents: read
concurrency:
  group: soccer-first-real-entry-original-20261105
  cancel-in-progress: false
jobs:
  original:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MEASURED_PARENT: 484595fd4f7b07d24066e2de7bae5486483ae284
      MEASURED_TREE: 7759bc8fa046ea9024b9c603cbbc94482c01db01
      TEST_BLOB: f8b11107568291fc8ba64d610b906c643ebeab43
      CASES_BLOB: 4ffe6850dc73f43205ee7dcdd0c905711bb09aff
      READER_BLOB: 385433cb6918e2d3e89d259cf946ca8b99fbc9b0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Bind only five source-only original-first additions
        shell: bash
        run: |
          set -euo pipefail
          QA_OUT="$RUNNER_TEMP/soccer-first-real-entry-original"
          export QA_OUT
          echo "QA_OUT=$QA_OUT" >> "$GITHUB_ENV"
          mkdir -p "$QA_OUT"/{logs,transport,evidence}
          test "$(git rev-parse HEAD^)" = "$MEASURED_PARENT"
          test "$(git rev-parse "$MEASURED_PARENT^{tree}")" = "$MEASURED_TREE"
          test "$(git hash-object src/test/soccerHistoricalRealEntry.test.tsx)" = "$TEST_BLOB"
          test "$(git hash-object scripts/qa/soccerHistoricalRealEntryCases.json)" = "$CASES_BLOB"
          test "$(git hash-object scripts/qa/soccerHistoricalRealEntryOriginal.mjs)" = "$READER_BLOB"
          git diff --name-status HEAD^ HEAD > "$QA_OUT/qa-delta.txt"
          node --input-type=module -e 'import fs from "node:fs"; import assert from "node:assert/strict"; const s=JSON.parse(fs.readFileSync("scripts/qa/soccerHistoricalRealEntryCases.json")); const rows=fs.readFileSync(process.env.QA_OUT+"/qa-delta.txt","utf8").trim().split("\n").map(x=>x.split("\t")); assert(rows.every(x=>x[0]==="A")); assert.deepEqual(rows.map(x=>x[1]).sort(),s.qaPaths.slice().sort());'
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          node --check scripts/qa/soccerHistoricalRealEntryOriginal.mjs
          git ls-files -z > "$QA_OUT/tracked-before.bin"
          git ls-files -z | xargs -0 sha256sum > "$QA_OUT/source-before.sha256"
          git ls-files -s > "$QA_OUT/index-before.txt"
          git status --porcelain=v1 --untracked-files=all > "$QA_OUT/status-before.txt"
          cp package-lock.json "$QA_OUT/package-lock-before.json"
          cp scripts/qa/soccerHistoricalRealEntryCases.json "$QA_OUT/cases.json"
          cp docs/plans/2026-11-05-soccer-first-real-entry-original-first.md "$QA_OUT/source-plan.md"
          git rev-parse HEAD HEAD^ 'HEAD^{tree}' > "$QA_OUT/source-identity.txt"
          node --version > "$QA_OUT/logs/node-version.log"
          npm --version > "$QA_OUT/logs/npm-version.log"
      - name: Install exact held lock
        shell: bash
        run: |
          set +e
          set -uo pipefail
          npm ci --no-audit --no-fund > "$QA_OUT/logs/npm-ci.log" 2>&1
          native_exit=$?
          printf '%s\n' "$native_exit" > "$QA_OUT/logs/npm-ci.exit"
          test "$native_exit" = 0
      - name: Proper app types before five original cases
        shell: bash
        run: |
          set +e
          set -uo pipefail
          export GIT_NO_LAZY_FETCH=1 SIM_NETWORK=offline
          export NODE_OPTIONS="--require=$GITHUB_WORKSPACE/scripts/lib/offlineTransport.cjs"
          export SIM_OFFLINE_RECEIPT="$QA_OUT/transport/types.log"
          : > "$SIM_OFFLINE_RECEIPT"
          node_modules/.bin/tsc --noEmit -p tsconfig.app.json > "$QA_OUT/logs/types.log" 2>&1
          native_exit=$?
          printf '%s\n' "$native_exit" > "$QA_OUT/logs/types.exit"
          test "$native_exit" = 0 || exit "$native_exit"
          test ! -s "$SIM_OFFLINE_RECEIPT" || exit 1
          node --input-type=module -e 'import fs from "node:fs"; fs.writeFileSync(process.env.QA_OUT+"/types-passed.json",JSON.stringify({command:"node_modules/.bin/tsc --noEmit -p tsconfig.app.json",exit:0})+"\n",{flag:"wx"});'
      - name: Actual five-case original and strict owned-failure reader
        shell: bash
        run: |
          set +e
          set -uo pipefail
          export GIT_NO_LAZY_FETCH=1 SIM_NETWORK=offline
          export NODE_OPTIONS="--require=$GITHUB_WORKSPACE/scripts/lib/offlineTransport.cjs"
          export SIM_OFFLINE_RECEIPT="$QA_OUT/transport/vitest.log"
          export SC_HISTORICAL_ENTRY_EVIDENCE="$QA_OUT/evidence"
          : > "$SIM_OFFLINE_RECEIPT"
          node_modules/.bin/vitest run src/test/soccerHistoricalRealEntry.test.tsx --reporter=json --outputFile="$QA_OUT/vitest.json" --maxWorkers=1 --minWorkers=1 > "$QA_OUT/vitest.stdout.log" 2> "$QA_OUT/vitest.stderr.log"
          native_exit=$?
          printf '%s\n' "$native_exit" > "$QA_OUT/logs/vitest.exit"
          test ! -s "$SIM_OFFLINE_RECEIPT" || exit 1
          export SIM_OFFLINE_RECEIPT="$QA_OUT/transport/reader.log"
          : > "$SIM_OFFLINE_RECEIPT"
          node --unhandled-rejections=strict scripts/qa/soccerHistoricalRealEntryOriginal.mjs --out "$QA_OUT" --spec scripts/qa/soccerHistoricalRealEntryCases.json --exit-code "$native_exit" > "$QA_OUT/logs/reader.log" 2>&1
          reader_exit=$?
          printf '%s\n' "$reader_exit" > "$QA_OUT/logs/reader.exit"
          test "$reader_exit" = 0 || exit "$reader_exit"
          test ! -s "$SIM_OFFLINE_RECEIPT" || exit 1
      - name: Always hold all original source locks and status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          export GIT_NO_LAZY_FETCH=1
          git ls-files -z > "$QA_OUT/tracked-after.bin"
          git ls-files -z | xargs -0 sha256sum > "$QA_OUT/source-after.sha256"
          git ls-files -s > "$QA_OUT/index-after.txt"
          git status --porcelain=v1 --untracked-files=all > "$QA_OUT/status-after.txt"
          cp package-lock.json "$QA_OUT/package-lock-after.json"
          cmp "$QA_OUT/tracked-before.bin" "$QA_OUT/tracked-after.bin"
          cmp "$QA_OUT/source-before.sha256" "$QA_OUT/source-after.sha256"
          cmp "$QA_OUT/index-before.txt" "$QA_OUT/index-after.txt"
          cmp "$QA_OUT/package-lock-before.json" "$QA_OUT/package-lock-after.json"
          test ! -s "$QA_OUT/status-before.txt"
          test ! -s "$QA_OUT/status-after.txt"
          printf '0\n' > "$QA_OUT/logs/full-source-holds.exit"
      - name: Retain all actual five-case proof within unchanged archive cap
        id: evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "$RUNNER_TEMP/soccer-first-real-entry-original.tar.gz" -C "$QA_OUT" .
          test "$(stat -c %s "$RUNNER_TEMP/soccer-first-real-entry-original.tar.gz")" -le 50000000
          sha256sum "$RUNNER_TEMP/soccer-first-real-entry-original.tar.gz" > "$RUNNER_TEMP/soccer-first-real-entry-original.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        if: always() && steps.evidence.outcome == 'success'
        with:
          name: soccer-first-real-entry-original
          path: |
            ${{ runner.temp }}/soccer-first-real-entry-original.tar.gz
            ${{ runner.temp }}/soccer-first-real-entry-original.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
