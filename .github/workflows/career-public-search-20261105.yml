name: Career Quiz random call diagnostics
on:
  push:
    branches: [codex/career-public-search-qa-20261105]
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        shell: bash
    env:
      SIM_NETWORK: offline
      SIM_OFFLINE_RECEIPT: fair-search-rng-diagnostic/offline.log
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - name: Locked source and diagnostic setup
        run: |
          mkdir -p fair-search-rng-diagnostic
          git rev-parse HEAD > fair-search-rng-diagnostic/head.txt
          git ls-files -s > fair-search-rng-diagnostic/source-before.txt
          sha256sum package.json package-lock.json > fair-search-rng-diagnostic/locks-before.txt
          git fetch --no-tags --depth=1 origin 271e8af48b87ac36500c56138b81595b00d50775
          npm ci
      - name: Actual original fixed restored caller stacks
        run: NODE_OPTIONS="--max-old-space-size=6144 --require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/qa/traceCareerSearchRng.mjs 2>&1 | tee fair-search-rng-diagnostic/diagnostic.log
      - name: Source lock and offline holds
        if: always()
        run: |
          git diff --exit-code HEAD -- src scripts package.json package-lock.json
          git ls-files -s > fair-search-rng-diagnostic/source-after.txt
          cmp fair-search-rng-diagnostic/source-before.txt fair-search-rng-diagnostic/source-after.txt
          sha256sum package.json package-lock.json > fair-search-rng-diagnostic/locks-after.txt
          cmp fair-search-rng-diagnostic/locks-before.txt fair-search-rng-diagnostic/locks-after.txt
          if test -f fair-search-rng-diagnostic/offline.log; then test ! -s fair-search-rng-diagnostic/offline.log; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: career-public-search-rng-diagnostic-${{ github.run_id }}
          path: fair-search-rng-diagnostic
          retention-days: 14
          if-no-files-found: error
