name: Front Office final typed source and selected proof
on:
  push:
    branches: [codex/front-office-market-final-qa-20261104]
permissions:
  contents: read
env:
  CI: '1'
  SIM_NETWORK: offline
jobs:
  outcomes:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Hold exact candidate source
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/front-office-final-proof"
          mkdir -p "$OUT"
          echo "QA_OUT=$OUT" >> "$GITHUB_ENV"
          git rev-parse HEAD HEAD^{tree} > "$OUT/source.txt"
          git ls-files -z | sort -z | xargs -0 sha256sum > "$OUT/source-before.sha256"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git fetch --no-filter --depth=1 origin cf3679e78076fb6f84a49106481de15d36c22348 1d2e5d9609bb866f21ff1ffa5bf9f44525178b31 > "$OUT/historical-fetch.log" 2>&1
          test "$(git rev-parse cf3679e7)" = cf3679e78076fb6f84a49106481de15d36c22348
          test "$(git rev-parse 1d2e5d96)" = 1d2e5d9609bb866f21ff1ffa5bf9f44525178b31
          npm ci --no-audit --no-fund > "$OUT/install.log" 2>&1
      - name: Proper app-config types on the actual final driver source
        shell: bash
        run: |
          set -euo pipefail
          node_modules/.bin/tsc --noEmit -p tsconfig.app.json > "$QA_OUT/types.log" 2>&1
      - name: Compare fixed original restored and independent physical controls
        shell: bash
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$GITHUB_WORKSPACE/scripts/lib/offlineTransport.cjs"
          : > "$QA_OUT/caller-transport.log"
          SIM_OFFLINE_RECEIPT="$QA_OUT/caller-transport.log" node scripts/qa/frontOfficeMarketOutcomes.mjs "$QA_OUT/outcomes" fixed > "$QA_OUT/runner.log" 2>&1
          cat "$QA_OUT/runner.log"
          test ! -s "$QA_OUT/caller-transport.log"
      - name: Qualify existing draft confirmations with unchanged outcomes
        shell: bash
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$GITHUB_WORKSPACE/scripts/lib/offlineTransport.cjs"
          : > "$QA_OUT/regression-transport.log"
          SIM_OFFLINE_RECEIPT="$QA_OUT/regression-transport.log" node scripts/qa/frontOfficeMarketDriverMaintenance.mjs "$QA_OUT/driver-maintenance" scripts/qa/frontOfficeMarketDriverPins.json scripts/qa/frontOfficeMarketDriverHunks.json scripts/qa/frontOfficeMarketPrior173.json > "$QA_OUT/regressions.log" 2>&1
          cat "$QA_OUT/regressions.log"
          test ! -s "$QA_OUT/regression-transport.log"
      - name: Affected existing harnesses
        shell: bash
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$GITHUB_WORKSPACE/scripts/lib/offlineTransport.cjs"
          mkdir -p "$QA_OUT/sims"
          : > "$QA_OUT/sims-transport.log"
          : > "$QA_OUT/sims-status.tsv"
          for harness in simFoHub simFoLazyDesk simFoRatingOrder simFrontOfficeRoster simFrontOfficeCuts simFrontOfficeSaveRecovery simFrontOfficeSchedule simNflFullRosters simNflGmDesk simNflPracticePromotion simNflTagDepth simGmDesk simGmDeskHost; do
            set +e
            SIM_OFFLINE_RECEIPT="$QA_OUT/sims-transport.log" node "scripts/$harness.mjs" > "$QA_OUT/sims/$harness.log" 2>&1
            status=$?
            set -e
            printf '%s\t%s\n' "$harness" "$status" >> "$QA_OUT/sims-status.tsv"
            cat "$QA_OUT/sims/$harness.log"
          done
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const wanted=["simFoHub","simFoLazyDesk","simFoRatingOrder","simFrontOfficeRoster","simFrontOfficeCuts","simFrontOfficeSaveRecovery","simFrontOfficeSchedule","simNflFullRosters","simNflGmDesk","simNflPracticePromotion","simNflTagDepth","simGmDesk","simGmDeskHost"];
          const rows=fs.readFileSync(process.env.QA_OUT+'/sims-status.tsv','utf8').trim().split('\n').map(line=>{const[name,exit]=line.split('\t');return{name,exit:Number(exit)};});
          assert.deepEqual(rows.map(row=>row.name),wanted);
          fs.writeFileSync(process.env.QA_OUT+'/sims-admission.json',JSON.stringify({status:rows.every(row=>row.exit===0)?'selected-thirteen-passed':'failed',rows,scope:'Thirteen selected existing harnesses, actual final typed driver bytes and exact declared historical snapshots. No all-suite or unrelated historical failure waiver.'},null,2)+'\n');
          assert(rows.every(row=>row.exit===0),'All thirteen selected harnesses actually pass');
          NODE
          test ! -s "$QA_OUT/sims-transport.log"
      - name: Always require full exact source preservation
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code HEAD > "$QA_OUT/source-diff.txt"
          git ls-files -z | sort -z | xargs -0 sha256sum > "$QA_OUT/source-after.sha256"
          cmp "$QA_OUT/source-before.sha256" "$QA_OUT/source-after.sha256"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: front-office-market-final-proof
          path: ${{ runner.temp }}/front-office-final-proof
          if-no-files-found: error
          retention-days: 14
