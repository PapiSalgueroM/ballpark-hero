name: Soccer retirement action bar verification
on:
  push:
    branches: [codex/career-retirement-actions]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      SIM_NETWORK: offline
      ENGINES: chromium
      VITEST_MAX_FORKS: 1
      VITEST_MIN_FORKS: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retain source and capture commands
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = codex/career-retirement-actions
          mkdir career-retirement-artifacts
          git cat-file -e 4aa47b12179f3e6bd734ffd84dd3a4b6641e36b5^{commit}
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse '4aa47b12179f3e6bd734ffd84dd3a4b6641e36b5^{tree}')" = 23f749bd3302eeff45881690346ff05321b6ec7b
          git -c core.autocrlf=false archive --format=zip HEAD > career-retirement-artifacts/source.zip
          git -c core.autocrlf=false archive --format=zip 4aa47b12179f3e6bd734ffd84dd3a4b6641e36b5 > career-retirement-artifacts/base.zip
          git ls-tree -r HEAD > career-retirement-artifacts/source-inventory.txt
          git ls-tree -r 4aa47b12179f3e6bd734ffd84dd3a4b6641e36b5 > career-retirement-artifacts/base-inventory.txt
          sha256sum career-retirement-artifacts/source.zip career-retirement-artifacts/base.zip > career-retirement-artifacts/source-archives.sha256
          node --input-type=module <<'SCOPE'
          import fs from 'node:fs';import assert from 'node:assert/strict';import {execFileSync} from 'node:child_process';
          const base='4aa47b12179f3e6bd734ffd84dd3a4b6641e36b5',allowed=['src/pages/SoccerCareer.tsx','scripts/qa/soccerRetirementActionsBrowser.mjs','.github/workflows/soccer-retirement-actions.yml','docs/CAREER-RETIREMENT-ACTIONS.md'];
          const changed=execFileSync('git',['diff','--name-only','-z',base,'HEAD']).toString().split('\0').filter(Boolean);
          fs.writeFileSync('career-retirement-artifacts/source-scope.json',JSON.stringify({base,allowed,changed},null,2));assert.deepEqual([...changed].sort(),[...allowed].sort());
          SCOPE
          git rev-parse HEAD HEAD^{tree} > career-retirement-artifacts/head-tree.txt
          cp package.json career-retirement-artifacts/package.before.json
          cp package-lock.json career-retirement-artifacts/package-lock.before.json
          sha256sum src/pages/SoccerCareer.tsx scripts/qa/soccerRetirementActionsBrowser.mjs .github/workflows/soccer-retirement-actions.yml docs/CAREER-RETIREMENT-ACTIONS.md scripts/qa/soccerAgentReviewDependencies.mjs > career-retirement-artifacts/source-hold.sha256
          cat > career-retirement-artifacts/capture.sh <<'CAPTURE'
          capture() {
            local label="$1"; shift
            printf '%s\0' "$@" > "career-retirement-artifacts/$label.argv"
            set +e
            "$@" > "career-retirement-artifacts/$label.stdout" 2> "career-retirement-artifacts/$label.stderr"
            local code=$?
            set -e
            echo "$code" > "career-retirement-artifacts/$label.exit"
            cat "career-retirement-artifacts/$label.stdout"
            cat "career-retirement-artifacts/$label.stderr" >&2
            return "$code"
          }
          CAPTURE
      - name: Install remote verification dependencies
        id: dependencies
        run: |
          set -euo pipefail
          source career-retirement-artifacts/capture.sh
          capture npm-ci npm ci
          capture locked-before node scripts/qa/soccerAgentReviewDependencies.mjs before
          cp soccer-agent-review-artifacts/dependencies-before.json career-retirement-artifacts/dependencies-before.json
          browser_tools="$RUNNER_TEMP/retirement-action-browser-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$browser_tools"
          printf '{"private":true,"dependencies":{"playwright":"1.64.0"}}\n' > "$browser_tools/package.json"
          capture playwright-package npm install --prefix "$browser_tools" --ignore-scripts --no-audit --no-fund
          test ! -e node_modules/playwright
          test ! -e node_modules/playwright-core
          ln -s "$browser_tools/node_modules/playwright" node_modules/playwright
          ln -s "$browser_tools/node_modules/playwright-core" node_modules/playwright-core
          cp "$browser_tools/package.json" career-retirement-artifacts/browser-package.json
          cp "$browser_tools/package-lock.json" career-retirement-artifacts/browser-package-lock.json
          capture chromium node "$browser_tools/node_modules/playwright/cli.js" install --with-deps chromium
          capture locked-after-setup node scripts/qa/soccerAgentReviewDependencies.mjs after
          cp soccer-agent-review-artifacts/dependencies-after.json career-retirement-artifacts/dependencies-after-setup.json
          node --input-type=module <<'PLAYWRIGHT'
          import fs from 'node:fs';import assert from 'node:assert/strict';for(const name of ['playwright','playwright-core'])assert.equal(JSON.parse(fs.readFileSync('node_modules/'+name+'/package.json')).version,'1.64.0');
          PLAYWRIGHT
          capture fonts python -m pip install fonttools pillow
          cmp package.json career-retirement-artifacts/package.before.json
          cmp package-lock.json career-retirement-artifacts/package-lock.before.json
      - name: Actual application type gate
        id: types
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          set -euo pipefail
          source career-retirement-artifacts/capture.sh
          capture types node_modules/.bin/tsc --noEmit -p tsconfig.app.json
      # This is a layout change. The focused built-page proof checks actual controls and labels.
      - name: Full production SEO build
        id: build
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.types.outcome == 'success' }}
        run: |
          set -euo pipefail
          source career-retirement-artifacts/capture.sh
          capture build npm run build:seo
      - name: Actual retired action row and safe Cancel browser reads
        id: browser
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          source career-retirement-artifacts/capture.sh
          server_pid=''
          close_server() { if test -n "$server_pid"; then kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true; fi; }
          trap close_server EXIT
          node scripts/lib/hostLikeServer.mjs dist 4173 > career-retirement-artifacts/browser-server.stdout 2> career-retirement-artifacts/browser-server.stderr &
          server_pid=$!
          capture browser-server-ready node --input-type=module -e 'for(let i=0;i<100;i++){try{const r=await fetch("http://127.0.0.1:4173/");if(r.ok)process.exit(0);}catch{}await new Promise(r=>setTimeout(r,100));}process.exit(1);'
          capture browser env BASE=http://127.0.0.1:4173 SOCCER_RETIREMENT_BROWSER_OUT=career-retirement-artifacts/browser node scripts/qa/soccerRetirementActionsBrowser.mjs
      - name: Independently check every browser journey and whole retained reference
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: |
          node --input-type=module <<'BROWSER'
