          assert(bytes(legacy.beforeDOM).equals(bytes(legacy.undoDOM))); assert.equal(bytes(legacy.beforeDOM).toString('utf8'), actual.bar.html); assert.equal(mutation.html, fault.bar.html); assert.equal(reversal.html, undo.bar.html);
          assert.deepEqual(json(legacy.faultCapture.observation), fault);
          const copied = report.controls[1], pure = json(copied.actual), bad = json(copied.fault), restored = json(copied.undo);
          assert.deepEqual(pure, json(report.cases[0].purity)); assert.deepEqual(purity(pure), []); assert.deepEqual(copied.findings, ['raw-save', 'read-rng']); assert.deepEqual(purity(bad), copied.findings);
          assert.equal(bad.afterRaw, `${pure.afterRaw} `); assert.deepEqual(bad.afterDraws.slice(0, -1), pure.afterDraws); assert.deepEqual(bad.afterDraws.at(-1), { value: 0.25, caller: 'labelled copied observation only' });
          assert.deepEqual(bad, { ...pure, afterRaw: `${pure.afterRaw} `, afterDraws: [...pure.afterDraws, { value: 0.25, caller: 'labelled copied observation only' }] });
          assert.deepEqual(bad.beforeRaw, pure.beforeRaw); assert.deepEqual(bad.beforeDraws, pure.beforeDraws); assert.deepEqual(restored, pure); assert.deepEqual(purity(restored), []); assert.equal(copied.actual.sha256, copied.undo.sha256);
          const pngs = [...report.cases.map(row => row.capture.png), ...report.journeys.map(row => row.confirmation.png), legacy.faultCapture.png];
          const expectedPNGs = [...expected.map(id => `${id}.png`), ...widths.map(width => `${width}-confirmation.png`), '320-old-style-fault.png'].sort();
          assert.deepEqual(pngs.map(row => row.path).sort(), expectedPNGs); assert.deepEqual(fs.readdirSync(out).filter(file => file.endsWith('.png')).sort(), expectedPNGs);
          for (const png of pngs) { const body = bytes(png), width = Number(png.path.split('-')[0]); assert.equal(body.subarray(0, 8).toString('hex'), '89504e470d0a1a0a'); assert.equal(body.toString('ascii', 12, 16), 'IHDR'); assert.equal(body.readUInt32BE(16), width); assert.equal(body.readUInt32BE(20), width === 1440 ? 1000 : 900); }
          const stdout = fs.readFileSync(path.join(ART, 'browser.stdout'), 'utf8'); assert.equal(fs.readFileSync(path.join(ART, 'browser.exit'), 'utf8').trim(), '0');
          assert(stdout.split('\n').filter(line => line.trim()).length >= 4); assert(stdout.trimEnd().endsWith('PASS Soccer retirement actions browser'));
          const streams = ['browser.argv', 'browser.stdout', 'browser.stderr', 'browser.exit'].map(file => { const body = fs.readFileSync(path.join(ART, file)); return { file, bytes: body.length, sha256: sha(body) }; });
          fs.writeFileSync(path.join(ART, 'browser-consumer-stream-bindings.json'), JSON.stringify(streams, null, 2));
          fs.writeFileSync(path.join(ART, 'browser-complete-references.json'), JSON.stringify(references));
          console.log('PASS retirement consumer: all8 complete geometry states and4 actual Cancel flows.');
          console.log('PASS retirement consumer: canonical styles, full raw saves and all measured draw values/callers.');
          console.log('PASS retirement consumer: both effective controls/full undo and13 exact original PNGs.');
          console.log('PASS retirement consumer: all retained refs/source/served bodies and observed locked dependency input subset.');
          BROWSER
      - name: Every unchanged rebuilt reader with full child output
        id: readers
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          source career-retirement-artifacts/capture.sh
          node scripts/lib/hostLikeServer.mjs dist 4173 > career-retirement-artifacts/reader-server.stdout 2> career-retirement-artifacts/reader-server.stderr &
          reader_server=$!
          trap 'kill "$reader_server" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" -eq 1
          failed=0
          printf 'harness\texit\tlines\tverdict\n' > career-retirement-artifacts/readers.tsv
          for harness in simAdsense simBrand simHeadTags simHiddenPages simHubs simIndexNow simIndexing simInternalLinks simNoRivalNames simPrerender simPrerenderBoot simRetiredRoutes simSchema simSitemap simSnapshotAssets; do
            capture "$harness" env SIM_NETWORK=offline ENGINES=chromium NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$PWD/career-retirement-artifacts/$harness.transport.log" BASE=http://127.0.0.1:4173 SWEEP_BASE=http://127.0.0.1:4173 node "scripts/$harness.mjs" || failed=1
            status="$(cat "career-retirement-artifacts/$harness.exit")"
            lines="$(cat "career-retirement-artifacts/$harness.stdout" "career-retirement-artifacts/$harness.stderr" | awk 'NF && $0 !~ /^\[SIM_OFFLINE_BLOCK\]/ {n++} END {print n+0}')"
            verdict=PASS
            if test "$status" -ne 0; then verdict=FAIL; failed=1; fi
            if test "$status" -eq 0 && test "$lines" -lt 4; then verdict=EMPTY; failed=1; fi
            if grep -E '(^|[[:space:]])(FAIL|SKIP|EMPTY)([[:space:]]|$)|^\[SIM_OFFLINE_BLOCK\]' "career-retirement-artifacts/$harness.stdout" "career-retirement-artifacts/$harness.stderr" > /dev/null; then verdict=FAIL; failed=1; fi
            if test -s "career-retirement-artifacts/$harness.transport.log"; then verdict=FAIL; failed=1; fi
            printf '%s\t%s\t%s\t%s\n' "$harness" "$status" "$lines" "$verdict" >> career-retirement-artifacts/readers.tsv
            printf '%s: %s (exit %s, %s complete output lines)\n' "$harness" "$verdict" "$status" "$lines"
          done
          test "$(tail -n +2 career-retirement-artifacts/readers.tsv | wc -l)" -eq 15
          exit "$failed"
      - name: Whole source and package holds
        if: always()
        run: |
          set -euo pipefail
          source career-retirement-artifacts/capture.sh
          git diff --binary HEAD > career-retirement-artifacts/generated.patch
          cp package.json career-retirement-artifacts/package.after.json
          cp package-lock.json career-retirement-artifacts/package-lock.after.json
          failed=0
          capture source-hold sha256sum -c career-retirement-artifacts/source-hold.sha256 || failed=1
          capture source-whole-hold git diff --exit-code HEAD -- . ':!public/**' ':!scripts/data/lastmod.json' || failed=1
          capture source-extra git ls-files --others --exclude-standard -- src scripts .github/workflows docs || failed=1
          test ! -s career-retirement-artifacts/source-extra.stdout || failed=1
          capture locked-final node scripts/qa/soccerAgentReviewDependencies.mjs after || failed=1
          if test -f soccer-agent-review-artifacts/dependencies-after.json; then cp soccer-agent-review-artifacts/dependencies-after.json career-retirement-artifacts/dependencies-final.json; fi
          capture package-hold cmp package.json career-retirement-artifacts/package.before.json || failed=1
          capture lock-hold cmp package-lock.json career-retirement-artifacts/package-lock.before.json || failed=1
          exit "$failed"
      - name: Preserve complete generated bodies and self-inclusive cap
        if: always()
        run: |
          set -euo pipefail
          mkdir -p career-retirement-artifacts
          paths=()
          for item in public dist scripts/data/lastmod.json; do
            if test -e "$item"; then paths+=("$item"); fi
          done
          tar -czf career-retirement-artifacts/generated.tar.gz "${paths[@]}"
          node --input-type=module <<'FOOTER'
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          const out='career-retirement-artifacts';
          const files=dir=>fs.readdirSync(dir,{withFileTypes:true}).flatMap(row=>row.isDirectory()?files(path.join(dir,row.name)):[path.join(dir,row.name)]);
          const count=()=>files(out).reduce((sum,file)=>sum+fs.statSync(file).size,0);
          const target=path.join(out,'size.json');
          fs.writeFileSync(target,JSON.stringify({bytes:0,cap:500000000}));
          let bytes=count();
          for(let i=0;i<3;i++){fs.writeFileSync(target,JSON.stringify({bytes,cap:500000000}));bytes=count();}
          if(bytes>=500000000){
            fs.writeFileSync(path.join(out,'cap-failure.json'),JSON.stringify({bytes,cap:500000000,retainedAllEvidence:true}));
            for(let i=0;i<3;i++){bytes=count();fs.writeFileSync(target,JSON.stringify({bytes,cap:500000000}));}
            bytes=count();
          }
          assert.equal(JSON.parse(fs.readFileSync(target)).bytes,count(),'Exact whole self-inclusive footer byte join');
          assert(bytes<500000000,'Whole self-inclusive evidence remains below500M; retain all failures without pruning');
          FOOTER
      - name: Upload complete evidence even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soccer-retirement-actions-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: error
          path: career-retirement-artifacts/
