              keys(row.declaredDefine, ['name', 'expression']); keys(row.declaredDefine.expression, ['path', 'bytes', 'sha256']); assert.equal(row.scope, 'Declared expression and actual descriptor, not generated virtual-file bytes.');
              assert.equal(row.declaredDefine.name, 'import.meta.env'); assert.equal(bytes(row.declaredDefine.expression).toString('utf8'), '{"DEV":false,"PROD":true,"MODE":"production"}'); continue; }
            keys(row, ['file', 'path', 'bytes', 'sha256']); assert(!row.file.startsWith('<')); const full = path.resolve(ROOT, row.file); assert(full.startsWith(`${ROOT}${path.sep}`)); assert(fs.readFileSync(full).equals(bytes(row))); assert.equal(row.bytes, metafile.inputs[row.file].bytes);
            if (row.file.startsWith('node_modules/')) { const observed = installedBefore.packages.filter(record => row.file.startsWith(`${record.directory}/`)).sort((a, b) => b.directory.length - a.directory.length)[0]; assert(observed, 'Physical dependency input joins observed locked installed subset');
              const manifestBytes = fs.readFileSync(path.join(ROOT, observed.directory, 'package.json')), manifest = JSON.parse(manifestBytes);
              assert.equal(manifest.name, observed.name); assert.equal(manifest.version, observed.version); assert.equal(locked.packages[observed.directory].version, observed.version);
              const manifestPath = path.join(ART, 'browser-dependency-manifests', `${sha(manifestBytes)}.json`); fs.mkdirSync(path.dirname(manifestPath), { recursive: true });
              if (fs.existsSync(manifestPath)) assert(fs.readFileSync(manifestPath).equals(manifestBytes)); else fs.writeFileSync(manifestPath, manifestBytes);
