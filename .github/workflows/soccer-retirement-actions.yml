          const ART = path.resolve('career-retirement-artifacts'), out = path.join(ART, 'browser'), ROOT = process.cwd();
          const sha = bytes => createHash('sha256').update(bytes).digest('hex'), report = JSON.parse(fs.readFileSync(path.join(out, 'report.json'), 'utf8'));
          const widths = [320, 390, 430, 1440], positions = ['top', 'footer'], expected = widths.flatMap(width => positions.map(position => `${width}-${position}`));
          const references = [];
          const bytes = reference => { assert.equal(typeof reference.path, 'string'); assert(Number.isSafeInteger(reference.bytes) && reference.bytes >= 0); assert.match(reference.sha256, /^[a-f0-9]{64}$/);
            const full = path.resolve(out, reference.path); assert(full.startsWith(`${out}${path.sep}`)); const body = fs.readFileSync(full); assert.equal(body.length, reference.bytes); assert.equal(sha(body), reference.sha256); return body; };
          const walk = value => { if (!value || typeof value !== 'object') return; if (typeof value.path === 'string' && Number.isInteger(value.bytes) && typeof value.sha256 === 'string') { bytes(value); references.push(value); }
