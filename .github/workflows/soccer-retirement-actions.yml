          assert.deepEqual(report.styles.props, props);
          const model = json(report.model), input = json(report.input), fixture = json(report.fixture), fixtureRows = fixture.saves.filter(row => row.id === 'ere'); assert.equal(fixtureRows.length, 1);
          assert.equal(model.valid, true); assert.deepEqual(model.draws, []); assert.equal(model.before, JSON.stringify(input)); assert.deepEqual(model.styles, report.styles.fullClasses);
          const rebuiltInput = JSON.parse(JSON.stringify(fixtureRows[0].state)), edits = json(report.boundaryEdits); assert.deepEqual(edits.map(row => row.key), ['retired', 'phase']);
          for (const edit of edits) { assert.equal(edit.existed, Object.hasOwn(rebuiltInput, edit.key)); assert.deepEqual(edit.before, edit.existed ? rebuiltInput[edit.key] : null); rebuiltInput[edit.key] = edit.after; }
          assert.equal(rebuiltInput.retired, true); assert.equal(rebuiltInput.phase, 'retired'); assert.deepEqual(rebuiltInput, input);
