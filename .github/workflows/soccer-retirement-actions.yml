          assert.deepEqual(report.sourceAfter, report.sourceBefore);
          const sourceNames = ['src/pages/SoccerCareer.tsx', 'src/components/ui/button.tsx', 'src/lib/utils.ts', 'src/lib/soccerCareerEngine.ts', 'src/lib/soccerCareerSave.ts',
