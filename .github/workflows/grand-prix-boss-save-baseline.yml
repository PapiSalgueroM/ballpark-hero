name: Grand Prix Boss save hook absence baseline
on:
  push:
    branches: [codex/grand-prix-boss-save-baseline-20261102]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: '1'
      SIM_NETWORK: offline
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Bind engine tests and unchanged persistence helpers
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/codex/grand-prix-boss-save-baseline-20261102
          test ! -e src/hooks/useGrandPrixBoss.ts
          out="$PWD/grand-prix-save-baseline-artifacts"
          mkdir "$out"
          git rev-parse HEAD HEAD^{tree} > "$out/head-tree.txt"
          git ls-files -z > "$out/source-members.before"
          git ls-files -z | xargs -0 sha256sum > "$out/source.sha256"
          printf 'ec793e9cacb47bf770d599b1677f76ac753d2cafde9c1f85e6bb0cf7dc7bc69b  src/lib/grandPrixBoss.ts\nc31a6b2851fdb0e05094b6ef02802312a4de8225627de8acc1f3515e22c37177  src/test/grandPrixBossSave.test.tsx\n' | sha256sum -c -
          git diff --exit-code cc9a55a2f35b6215d5e6e664cc401d10d7f76291 -- src/lib/saveFence.ts src/hooks/useSaveFenceWatch.ts src/lib/completions.ts src/lib/keyedRng.ts src/App.tsx src/data/gameRegistry.ts src/integrations/supabase/client.ts package.json package-lock.json vitest.config.ts src/test/setup.ts
          cat > "$out/capture.sh" <<'CAPTURE'
          capture() {
            local tag="$1"; shift
            local out="$PWD/grand-prix-save-baseline-artifacts"
            test ! -e "$out/$tag.exit"
            printf '%s\0' "$@" > "$out/$tag.argv"
            : > "$out/$tag.transport"
            set +e
            SIM_OFFLINE_RECEIPT="$out/$tag.transport" "$@" > "$out/$tag.stdout" 2> "$out/$tag.stderr"
            local status=$?
            set -e
            printf '%s\n' "$status" > "$out/$tag.exit"
            cat "$out/$tag.stdout"; cat "$out/$tag.stderr" >&2
            test ! -s "$out/$tag.transport" || return 1
            return "$status"
          }
          CAPTURE
          source "$out/capture.sh"
          capture install env NODE_OPTIONS='' npm ci
          find node_modules -path node_modules/.vite -prune -o -type f -print0 | sort -z | xargs -0 sha256sum > "$out/dependency-files.sha256"
      - name: Actual types and owned missing-hook assertion
        run: |
          set -euo pipefail
          out="$PWD/grand-prix-save-baseline-artifacts"
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          unset GP_BOSS_HOOK_FILE GP_BOSS_ENGINE_FILE NO_DOUBLE_SWAP
          source "$out/capture.sh"
          capture types node_modules/.bin/tsc --noEmit -p tsconfig.app.json
          code=0
          capture baseline node node_modules/vitest/vitest.mjs run src/test/grandPrixBossSave.test.tsx --maxWorkers=1 --minWorkers=1 --no-file-parallelism --reporter=verbose --reporter=json --outputFile="$out/baseline.vitest.json" || code=$?
          test "$code" -eq 1
          node --input-type=module <<'CHECK'
          import fs from 'node:fs'; import assert from 'node:assert/strict';
          const out=process.cwd()+'/grand-prix-save-baseline-artifacts';
          const r=JSON.parse(fs.readFileSync(out+'/baseline.vitest.json','utf8'));
          const raw=fs.readFileSync(out+'/baseline.stdout','utf8')+'\n'+fs.readFileSync(out+'/baseline.stderr','utf8');
          assert.equal(Number(fs.readFileSync(out+'/baseline.exit','utf8')),1,'Actual raw runner exit is one');
          assert.equal(r.success,false);assert.equal(r.numTotalTests,16);assert.equal(r.numPassedTests,0);
          assert.equal(r.numFailedTests,1);assert.equal(r.numPendingTests,15);assert.equal(r.numTodoTests,0);
          assert.equal(r.testResults.length,1,'One actual persistence test file');
          assert(r.testResults[0].name.endsWith('/src/test/grandPrixBossSave.test.tsx'));
          const rows=r.testResults[0].assertionResults;
          const ids=['GP_SAVE_AVAILABLE:','GP_SAVE_EMPTY:','GP_SAVE_LOAD:','GP_SAVE_START:','GP_SAVE_OCCUPIED_START:','GP_SAVE_QUOTA_START:','GP_SAVE_QUOTA_ACTION:','GP_SAVE_NOOP:','GP_SAVE_DUPLICATE:','GP_SAVE_MOVED:','GP_SAVE_BAD_RAW:','GP_SAVE_UNREADABLE:','GP_SAVE_CONFIRMATION:','GP_SAVE_COMPLETE:','GP_SAVE_FINAL_QUOTA:','GP_SAVE_FINAL_CONFIRMATION:'];
          assert.equal(rows.length,ids.length);const seen=new Set();
          for(const row of rows){const matches=ids.filter(id=>row.title.startsWith(id));assert.equal(matches.length,1);const id=matches[0];assert(!seen.has(id));seen.add(id);
            const missing=id==='GP_SAVE_AVAILABLE:';assert.equal(row.status,missing?'failed':'skipped');
            if(missing){assert.equal(row.failureMessages.length,1);assert.match(row.failureMessages[0],/AssertionError:/);assert.match(row.failureMessages[0],/GP_SAVE_MODULE_MISSING/);}
            else assert.equal(row.failureMessages.length,0);
          }
          const runtimeCounters={numUnhandledErrors:r.numUnhandledErrors??null,numRuntimeErrorTestSuites:r.numRuntimeErrorTestSuites??null};
          for(const [name,count]of Object.entries(runtimeCounters)){if(count===null)continue;assert.equal(typeof count,'number');assert.equal(count,0,name);}
          const detectedRuntimeError=Object.values(runtimeCounters).some(v=>typeof v==='number'&&v>0)||/(?:Unhandled (?:Errors?|Rejection|Exception)|unhandledRejection|uncaughtException|Vitest caught \d+ unhandled)/i.test(raw);
          assert.equal(detectedRuntimeError,false,'No infrastructure error receives absence credit');
          const summary={scope:'Missing persistence hook only; fifteen behavior cases deliberately unrun',rawExit:1,physicalFiles:1,passed:0,ownedAssertionFailures:1,declaredSkips:15,runtimeCounters,runtimeCounterCompleteness:Object.values(runtimeCounters).some(v=>v===null)?'UNKNOWN':'REPORTED',detectedRuntimeError,rawErrors:r.errors??null,rawUnhandledErrors:r.unhandledErrors??null,cases:rows.map(row=>({title:row.title,status:row.status}))};
          fs.writeFileSync(out+'/summary.json',JSON.stringify(summary,null,2)+'\n');
          console.log('GP_SAVE_BASELINE: one actual missing-hook AssertionError; fifteen declared behavior skips. No passing persistence behavior is claimed.');
          CHECK
      - name: Preserve source dependencies and membership
        if: always()
        run: |
          set -euo pipefail
          out="$PWD/grand-prix-save-baseline-artifacts"
          sha256sum -c "$out/source.sha256" > "$out/source-hold.log"
          if test -f "$out/dependency-files.sha256"; then sha256sum -c "$out/dependency-files.sha256" > "$out/dependency-hold.log"; fi
          git ls-files -z > "$out/source-members.after"; cmp "$out/source-members.before" "$out/source-members.after"
          git diff --exit-code HEAD > "$out/working-source-hold.log"
          git ls-files --others --exclude-standard > "$out/untracked.txt"; test ! -s "$out/untracked.txt"
          test ! -e src/hooks/useGrandPrixBoss.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grand-prix-save-baseline-${{ github.run_id }}
          path: grand-prix-save-baseline-artifacts/
          retention-days: 14
