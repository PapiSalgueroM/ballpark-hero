name: Soccer Connect 4 focused request ownership
on:
  push:
    branches: [codex/football-connect4-request-focused-20261030]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      SIM_NETWORK: offline
      GIT_OPTIONAL_LOCKS: '0'
      EXPECTED_MAIN: 28e7392f38f04a3af6da33e71ec5625ca1e2cd9f
      EXPECTED_SOURCE_COUNT: '5455'
      EXPECTED_PARENT: 75323964cfe472136595b77de0cf4cb27d8bf917
      EXPECTED_TREE: 30482ff935eab193cb4d7b8a65e7cad2524f462a
      TEST_SHA256: 93458e4e466516850528d21cd25e730d09c3d1ea602e9bd97a9b9482849677d8
      CONTROLLER_SHA256: 85df6f41ac32d1e0db420bbf6f90a973087db15644bf9b7ca5e9e0b26bc64e1a
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Bind fixed app and exact regression source
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/c4-focused"
          test ! -e "$out"
          mkdir -p "$out/runtime-tmp"
          echo "C4_OUT=$out" >> "$GITHUB_ENV"
          echo "TMPDIR=$out/runtime-tmp" >> "$GITHUB_ENV"
          test "$GITHUB_REF_NAME" = codex/football-connect4-request-focused-20261030
          test "$(git rev-list --parents -n1 HEAD)" = "$GITHUB_SHA $EXPECTED_PARENT"
          test "$(git rev-list --parents -n1 "$EXPECTED_PARENT")" = "$EXPECTED_PARENT $EXPECTED_MAIN"
          test "$(git rev-parse "$EXPECTED_PARENT^{tree}")" = "$EXPECTED_TREE"
          test "$(git ls-files | wc -l)" -eq 5455
          git diff --name-status "$EXPECTED_MAIN" "$EXPECTED_PARENT" > "$out/product.paths"
          printf 'M\tsrc/hooks/useFootballConnect4.ts\nM\tsrc/pages/FootballConnect4.tsx\nA\tsrc/test/footballConnect4RequestOwnership.test.tsx\n' > "$out/expected-product.paths"
          cmp "$out/product.paths" "$out/expected-product.paths"
          git diff --name-status "$EXPECTED_PARENT" HEAD > "$out/proof.paths"
          printf 'A\t.github/workflows/football-connect4-request-focused.yml\nA\tscripts/qa/footballConnect4Focused.cjs\n' > "$out/expected-proof.paths"
          cmp "$out/proof.paths" "$out/expected-proof.paths"
          test "$(sha256sum src/test/footballConnect4RequestOwnership.test.tsx | cut -d' ' -f1)" = "$TEST_SHA256"
          test "$(sha256sum scripts/qa/footballConnect4Focused.cjs | cut -d' ' -f1)" = "$CONTROLLER_SHA256"
          test "$(git hash-object src/hooks/useFootballConnect4.ts)" = 5b09be1a883b8289e018647b1189a9a0315268e7
          test "$(git hash-object src/pages/FootballConnect4.tsx)" = 5f69622e41c87e4f15f6ba3ae3dbe45e6f7f9471
          test "$(git hash-object scripts/sweepWeight.mjs)" = 084cce2062686259437cd2a334093a561c819c36
          git ls-files -z | sort -z > "$out/source-members.initial"
          xargs -0 sha256sum < "$out/source-members.initial" > "$out/source.initial.sha256"
          git ls-files --others --exclude-standard -z | sort -z > "$out/untracked.initial"
          test ! -s "$out/untracked.initial"
          git for-each-ref --format='%(refname) %(objectname)' > "$out/refs.before"
          git rev-parse HEAD > "$out/head.txt"
          git rev-parse 'HEAD^{tree}' > "$out/tree.txt"
          git archive --format=tar HEAD > "$out/source.tar"
          cp scripts/qa/footballConnect4Focused.cjs "$out/focused-controller.cjs"
          cmp scripts/qa/footballConnect4Focused.cjs "$out/focused-controller.cjs"
          sha256sum "$out/focused-controller.cjs" > "$out/controller-copy.sha256"
          raw=0
          node --check scripts/qa/footballConnect4Focused.cjs > "$out/syntax.stdout" 2> "$out/syntax.stderr" || raw=$?
          printf '%s\n' "$raw" > "$out/syntax.exit"
          test "$raw" -eq 0
          test ! -s "$out/syntax.stdout"
          test ! -s "$out/syntax.stderr"
      - name: Locked dependencies and actual application types
        run: |
          set -euo pipefail
          out="$C4_OUT"
          raw=0
          env -u NODE_OPTIONS npm ci > "$out/npm-ci.stdout" 2> "$out/npm-ci.stderr" || raw=$?
          printf '%s\n' "$raw" > "$out/npm-ci.exit"
          test "$raw" -eq 0
          raw=0
          : > "$out/types.transport"
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$out/types.transport" timeout --signal=TERM --kill-after=15s 3m node node_modules/typescript/bin/tsc --noEmit -p tsconfig.app.json > "$out/types.stdout" 2> "$out/types.stderr" || raw=$?
          printf '%s\n' "$raw" > "$out/types.exit"
          test "$raw" -eq 0
          test ! -s "$out/types.stdout"
          test ! -s "$out/types.stderr"
          test ! -s "$out/types.transport"
      - name: Fixed outcomes and two same canonical-file inverses
        run: |
          set -euo pipefail
          out="$C4_OUT"
          raw=0
          : > "$out/red.transport"
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$out/red.transport" timeout --signal=TERM --kill-after=15s 15m node "$out/focused-controller.cjs" > "$out/red.stdout" 2> "$out/red.stderr" || raw=$?
          printf '%s\n' "$raw" > "$out/red.exit"
          test "$raw" -eq 0
          test ! -s "$out/red.stderr"
          test ! -s "$out/red.transport"
          grep -Fqx 'C4_REQUEST_FOCUSED: fixed27 green; exact original canonical hook18 owned RED and9 preservation passes; same hook restored27 green; original Page order1 owned RED and26 passes; same Page restored27 green;4 changed copied classifier refusals/restores, no skips/todo/callback errors.' "$out/red.stdout"
          for phase in healthy restored-hook restored-page;do test "$(cat "$out/focused/$phase/raw.exit")" -eq 0;done
          for phase in original-hook original-page;do test "$(cat "$out/focused/$phase/raw.exit")" -eq 1;done
          sha256sum -c "$out/controller-copy.sha256" > "$out/controller-copy-held.log"
          find node_modules -type f -print0 | sort -z > "$out/dependencies.members.post"
          xargs -0 sha256sum < "$out/dependencies.members.post" > "$out/dependencies.post.sha256"
          find node_modules -type l -printf '%p -> %l\n' | sort > "$out/dependency-links.post"
      - name: Always preserve source and qualification evidence
        if: ${{ always() }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/c4-focused"
          mkdir -p "$out"
          failed=0
          git ls-files -z | sort -z > "$out/source-members.final"
          cmp "$out/source-members.initial" "$out/source-members.final" || failed=1
          sha256sum -c "$out/source.initial.sha256" > "$out/source-held.log" 2>&1 || failed=1
          git ls-files --others --exclude-standard -z | sort -z > "$out/untracked.final"
          cmp "$out/untracked.initial" "$out/untracked.final" || failed=1
          git diff --exit-code HEAD > "$out/working-source.diff" || failed=1
          git for-each-ref --format='%(refname) %(objectname)' > "$out/refs.after"
          cmp "$out/refs.before" "$out/refs.after" || failed=1
          sha256sum -c "$out/controller-copy.sha256" > "$out/controller-copy-final-held.log" 2>&1 || failed=1
          if test -f "$out/dependencies.post.sha256"; then
            find node_modules -type f -print0 | sort -z > "$out/dependencies.members.final"
            cmp "$out/dependencies.members.post" "$out/dependencies.members.final" || failed=1
            sha256sum -c "$out/dependencies.post.sha256" > "$out/dependencies-final-held.log" 2>&1 || failed=1
            find node_modules -type l -printf '%p -> %l\n' | sort > "$out/dependency-links.final"
            cmp "$out/dependency-links.post" "$out/dependency-links.final" || failed=1
          else
            printf 'POST_QUALIFICATION_DEPENDENCY_SNAPSHOT_NOT_CREATED\n' > "$out/dependencies-not-created.txt"
            failed=1
          fi
          printf '%s\n' "$failed" > "$out/final-holds.exit"
          printf '{"scope":"FIXED27_AND_TWO_PHYSICAL_CANONICAL_INVERSES_ONLY","applicationFix":true,"focused":"READ_ACTUAL_135_OBSERVATIONS_AND_ADMISSION","runtimeCallbackErrors":"READ_ACTUAL_CALLBACKS","fullSuite":"UNRUN","build":"UNRUN","browser":"UNRUN","caps":"UNRUN","builtReaders":"UNRUN","globalSims":"UNRUN","featureReady":false,"dependencyInventoryScope":"POST_QUALIFICATION_ONLY"}\n' > "$out/SCOPE.json"
          find "$out" -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/c4-focused-evidence.sha256"
          cp "$RUNNER_TEMP/c4-focused-evidence.sha256" "$out/evidence.sha256"
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: football-connect4-focused-${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/c4-focused
          if-no-files-found: error
          retention-days: 14
