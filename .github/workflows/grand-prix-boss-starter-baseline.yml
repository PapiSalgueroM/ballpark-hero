name: Grand Prix Boss measured starter baseline
on:
  push:
    branches: [codex/grand-prix-boss-starter-baseline-20261102]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: '1'
      SIM_NETWORK: offline
      GP_BOSS_BALANCE_OUT: ${{ github.workspace }}/grand-prix-starter-baseline-artifacts/cohort
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Bind unchanged first engine captured old save and test only
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/codex/grand-prix-boss-starter-baseline-20261102
          out="$PWD/grand-prix-starter-baseline-artifacts"
          mkdir "$out"
          git rev-parse HEAD HEAD^{tree} > "$out/head-tree.txt"
          git ls-files -z > "$out/source-members.before"
          git ls-files -z | xargs -0 sha256sum > "$out/source.sha256"
          git diff --name-only 29bda1687957b226b5e91fb86807c3eec84f9d61 HEAD > "$out/changed-paths.txt"
          printf '%s\n' '.github/workflows/grand-prix-boss-starter-baseline.yml' 'src/test/fixtures/grandPrixBossV5Starter.json' 'src/test/grandPrixBossStarterBalance.test.ts' > "$out/expected-paths.txt"
          cmp "$out/expected-paths.txt" "$out/changed-paths.txt"
          printf '%s\n' 'ec793e9cacb47bf770d599b1677f76ac753d2cafde9c1f85e6bb0cf7dc7bc69b  src/lib/grandPrixBoss.ts' '8822d2af417739a0164babc5b15d13cd2a5e5c5dd4e263a9e465602798765887  src/test/grandPrixBoss.test.ts' 'aa7217b821c7852a1ac71bbc7c9d8e9e30b9754910e2965d3fae464396434bed  src/test/grandPrixBossStarterBalance.test.ts' 'cf3b484781dbff04df9033d0e1dfe239e6d9562f5cf026db2e4b1e233162a028  src/test/fixtures/grandPrixBossV5Starter.json' | sha256sum -c -
          cat > "$out/capture.sh" <<'CAPTURE'
          capture() {
            local tag="$1"; shift
            local out="$PWD/grand-prix-starter-baseline-artifacts"
            test ! -e "$out/$tag.exit"
            printf '%s\0' "$@" > "$out/$tag.argv"
            : > "$out/$tag.transport"
            set +e
            SIM_OFFLINE_RECEIPT="$out/$tag.transport" "$@" > "$out/$tag.stdout" 2> "$out/$tag.stderr"
            local status=$?
            set -e
            printf '%s\n' "$status" > "$out/$tag.exit"
            tail -n 18 "$out/$tag.stdout"; tail -n 18 "$out/$tag.stderr"
            test ! -s "$out/$tag.transport" || return 1
            return "$status"
          }
          CAPTURE
          source "$out/capture.sh"
          capture install env NODE_OPTIONS='' npm ci
          find node_modules -path node_modules/.vite -prune -o -type f -print0 | sort -z | xargs -0 sha256sum > "$out/dependency-files.sha256"
      - name: Actual types original thirteen and six owned starter assertions
        run: |
          set -euo pipefail
          out="$PWD/grand-prix-starter-baseline-artifacts"
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          unset GP_BOSS_PAGE_FILE GP_BOSS_HOOK_FILE GP_BOSS_ENGINE_FILE US_BOARD_CONTROL_ALIAS US_BOARD_CONTROL_FILE NO_DOUBLE_SWAP
          source "$out/capture.sh"
          capture types node_modules/.bin/tsc --noEmit -p tsconfig.app.json
          capture original node node_modules/vitest/vitest.mjs run src/test/grandPrixBoss.test.ts --maxWorkers=1 --minWorkers=1 --no-file-parallelism --reporter=verbose --reporter=json --outputFile="$out/original.vitest.json"
          code=0
          capture baseline node node_modules/vitest/vitest.mjs run src/test/grandPrixBossStarterBalance.test.ts --maxWorkers=1 --minWorkers=1 --no-file-parallelism --reporter=verbose --reporter=json --outputFile="$out/baseline.vitest.json" || code=$?
          test "$code" -eq 1
          test ! -s "$out/baseline.transport"
          node --input-type=module <<'CHECK'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          const out = process.cwd() + '/grand-prix-starter-baseline-artifacts';
          const originalIds = ['GP_ENGINE_AVAILABLE:', 'GP_WORLD:', 'GP_SEED:', 'GP_UPGRADE:', 'GP_RESERVE:', 'GP_GRID:', 'GP_SETUPS:', 'GP_CLASSIFICATION:', 'GP_SETTLEMENT:', 'GP_DUPLICATE:', 'GP_RESUME:', 'GP_INVALID_SAVE:', 'GP_SCORE:'];
          const expected = new Map([
            ['GP_STARTER_OWNERSHIP:', 'GP_STARTER_TEAM4_MISSING'],
            ['GP_STARTER_NATURAL_FREQUENCY:', 'GP_STARTER_NATURAL_SCORING_FREQUENCY_TOO_LOW'],
            ['GP_STARTER_NATURAL_STRATEGY:', 'GP_STARTER_NATURAL_STRATEGY_POINTS_TOO_WEAK'],
            ['GP_STARTER_SEASON_POINTS:', 'GP_STARTER_SEASON_POINTS_TOO_LOW'],
            ['GP_STARTER_SEASON_STRATEGY:', 'GP_STARTER_SEASON_STRATEGY_POINTS_TOO_WEAK'],
            ['GP_STARTER_SEASON_INVESTMENT:', 'GP_STARTER_SEASON_INVESTMENT_POINTS_TOO_WEAK'],
            ['GP_STARTER_OLD_SAVE:', null],
          ]);
          const reports = [];
          function inspect(tag, file, count, passed, failed) {
            const r = JSON.parse(fs.readFileSync(out + '/' + tag + '.vitest.json', 'utf8'));
            const raw = fs.readFileSync(out + '/' + tag + '.stdout', 'utf8') + '\n' + fs.readFileSync(out + '/' + tag + '.stderr', 'utf8');
            assert.equal(Number(fs.readFileSync(out + '/' + tag + '.exit', 'utf8')), failed ? 1 : 0);
            assert.equal(r.success, failed === 0); assert.equal(r.numTotalTests, count);
            assert.equal(r.numPassedTests, passed); assert.equal(r.numFailedTests, failed);
            assert.equal(r.numPendingTests, 0); assert.equal(r.numTodoTests, 0);
            assert.equal(r.testResults.length, 1); assert(r.testResults[0].name.endsWith('/' + file));
            const rows = r.testResults[0].assertionResults; assert.equal(rows.length, count);
            const runtimeCounters = { numUnhandledErrors: r.numUnhandledErrors ?? null, numRuntimeErrorTestSuites: r.numRuntimeErrorTestSuites ?? null };
            for (const [name, value] of Object.entries(runtimeCounters)) { if (value === null) continue; assert.equal(typeof value, 'number'); assert.equal(value, 0, name); }
            for (const errors of [r.errors, r.unhandledErrors]) if (Array.isArray(errors)) assert.equal(errors.length, 0);
            const detectedRuntimeError = /(?:Unhandled (?:Errors?|Rejection|Exception)|unhandledRejection|uncaughtException|Vitest caught \d+ unhandled)/i.test(raw);
            assert.equal(detectedRuntimeError, false);
            reports.push({ tag, passed, ownedFailures: failed, declaredSkips: 0, runtimeCounters,
              runtimeCounterCompleteness: Object.values(runtimeCounters).some(value => value === null) ? 'UNKNOWN' : 'REPORTED', detectedRuntimeError,
              rawErrors: r.errors ?? null, rawUnhandledErrors: r.unhandledErrors ?? null,
              cases: rows.map(row => ({ title: row.title, status: row.status })) });
            return rows;
          }
          const original = inspect('original', 'src/test/grandPrixBoss.test.ts', 13, 13, 0);
          const originalSeen = new Set();
          for (const row of original) { assert.equal(row.status, 'passed'); assert.equal(row.failureMessages.length, 0); const id = row.title.slice(0, row.title.indexOf(':') + 1); assert(!originalSeen.has(id)); originalSeen.add(id); }
          assert.deepEqual([...originalSeen].sort(), originalIds.sort());
          const baseline = inspect('baseline', 'src/test/grandPrixBossStarterBalance.test.ts', 7, 1, 6);
          const seen = new Set();
          for (const row of baseline) {
            const ids = [...expected.keys()].filter(id => row.title.startsWith(id)); assert.equal(ids.length, 1);
            const id = ids[0]; assert(!seen.has(id)); seen.add(id); const marker = expected.get(id);
            assert.equal(row.status, marker ? 'failed' : 'passed'); assert.equal(row.failureMessages.length, marker ? 1 : 0);
            if (marker) { assert.match(row.failureMessages[0], /AssertionError:/); assert(row.failureMessages[0].includes(marker)); }
          }
          const dirs = fs.readdirSync(process.env.GP_BOSS_BALANCE_OUT).filter(name => name.startsWith('dukb-grand-prix-starter-'));
          assert.equal(dirs.length, 1);
          const cohort = JSON.parse(fs.readFileSync(path.join(process.env.GP_BOSS_BALANCE_OUT, dirs[0], 'summary.json'), 'utf8'));
          assert.equal(cohort.sourceSha256, 'ec793e9cacb47bf770d599b1677f76ac753d2cafde9c1f85e6bb0cf7dc7bc69b');
          assert.equal(cohort.fixtureSha256, 'cf3b484781dbff04df9033d0e1dfe239e6d9562f5cf026db2e4b1e233162a028');
          assert.equal(cohort.counts.naturalPairs, 256); assert.equal(cohort.counts.seasons, 96);
          assert.equal(cohort.counts.seasonRaces, 1152); assert.equal(cohort.counts.totalRaces, 1664); assert(cohort.counts.admittedStates > 0);
          assert.equal(cohort.naturalScoringFraction, .046875);
          assert.equal(cohort.naturalStrategyGain.mean, .01171875);
          assert.equal(cohort.seasonAwarePoints.mean, .0625);
          assert.equal(cohort.seasonStrategyGain.mean, .0625);
          assert.equal(cohort.seasonInvestmentGain.mean, 1.90625);
          fs.writeFileSync(out + '/summary.json', JSON.stringify({
            scope: 'Starter opportunity RED only. No starter product adopted; legacy captured save preserves its held world.',
            reports, totalExecuted: 20, preservationPasses: 14, ownedAssertionFailures: 6, declaredSkips: 0,
            baselineCohortMatchesAdmittedCalibration: true, cohort,
          }, null, 2) + '\n');
          console.log('GP_STARTER_BASELINE: original thirteen and captured legacy save passed, six exact owned opportunity assertions, actual baseline cohort matches admitted calibration.');
          CHECK
      - name: Preserve complete source dependencies and membership
        if: always()
        run: |
          set -euo pipefail
          out="$PWD/grand-prix-starter-baseline-artifacts"
          sha256sum -c "$out/source.sha256" > "$out/source-hold.log"
          if test -f "$out/dependency-files.sha256"; then sha256sum -c "$out/dependency-files.sha256" > "$out/dependency-hold.log"; fi
          git ls-files -z > "$out/source-members.after"
          cmp "$out/source-members.before" "$out/source-members.after"
          git diff --exit-code HEAD > "$out/working-source-hold.log"
          git ls-files --others --exclude-standard > "$out/untracked.txt"
          test ! -s "$out/untracked.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grand-prix-starter-baseline-${{ github.run_id }}
          path: grand-prix-starter-baseline-artifacts/
          retention-days: 14
