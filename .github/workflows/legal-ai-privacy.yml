name: Legal AI and privacy verification

on:
  workflow_dispatch:
  push:
    branches: [codex/legal-ai-privacy]

permissions:
  contents: read
concurrency:
  group: legal-ai-privacy-${{ github.sha }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    defaults:
      run:
        shell: bash
    env:
      SIM_NETWORK: offline
      ENGINES: chromium
      TZ: UTC
      PRERENDER_ONLY: /about,/terms,/privacy,/contact
      SEO_SPLIT_BASE_REF: 3c56c21f835d46743fe5cab337b9fb46e38e3242
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record source and install locked app dependencies
        run: |
          set -euo pipefail
          mkdir legal-privacy-artifacts
          git rev-parse HEAD > legal-privacy-artifacts/head.txt
          git rev-parse 'HEAD^{tree}' > legal-privacy-artifacts/tree.txt
          git archive --format=zip HEAD > legal-privacy-artifacts/source.zip
          sha256sum package.json package-lock.json > legal-privacy-artifacts/dependencies-before.sha256
          npm ci > legal-privacy-artifacts/install.log 2>&1
      - name: Purpose consent regression checks
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          export SIM_OFFLINE_RECEIPT="$PWD/legal-privacy-artifacts/unit.transport"
          node_modules/.bin/vitest run src/test/consentPurposeGates.test.ts --maxWorkers=1 --minWorkers=1 2>&1 | tee legal-privacy-artifacts/consent-unit.log
          node_modules/.bin/vitest run src/test/cookieConsentStorage.test.tsx src/test/helpConsentFocus.test.tsx src/test/helpDialogFocus.test.tsx src/test/safeStorage.test.ts src/test/safeStorageQuota.test.ts src/test/freshBuildBlockedStorage.test.ts --maxWorkers=1 --minWorkers=1 2>&1 | tee legal-privacy-artifacts/inherited-unit.log
      - name: Isolated browser and font tooling
        run: |
          set -euo pipefail
          browser_tools="$RUNNER_TEMP/legal-privacy-browser"
          npm install --prefix "$browser_tools" --no-save --package-lock=false playwright@1.64.0 > legal-privacy-artifacts/browser-install.log 2>&1
          test ! -e node_modules/playwright
          test ! -e node_modules/playwright-core
          ln -s "$browser_tools/node_modules/playwright" node_modules/playwright
          ln -s "$browser_tools/node_modules/playwright-core" node_modules/playwright-core
          node "$browser_tools/node_modules/playwright/cli.js" install --with-deps chromium > legal-privacy-artifacts/chromium-install.log 2>&1
          python -m pip install fonttools pillow > legal-privacy-artifacts/python-install.log 2>&1
          export FREE_KICK_FONT_CACHE="$RUNNER_TEMP/legal-privacy-fonts"
          node scripts/qa/freeKickLab1070.mjs --prefetch-fonts-only > legal-privacy-artifacts/fonts.log 2>&1
          echo "FREE_KICK_FONT_CACHE=$FREE_KICK_FONT_CACHE" >> "$GITHUB_ENV"
      - name: Types and finished production snapshots
        id: build
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          SIM_OFFLINE_RECEIPT="$PWD/legal-privacy-artifacts/types.transport" node_modules/.bin/tsc --noEmit -p tsconfig.app.json > legal-privacy-artifacts/types.log 2>&1
          SIM_OFFLINE_RECEIPT="$PWD/legal-privacy-artifacts/build.transport" npm run build:seo > legal-privacy-artifacts/build.log 2>&1
          SIM_OFFLINE_RECEIPT="$PWD/legal-privacy-artifacts/heads.transport" node scripts/refreshConsentSnapshots.mjs > legal-privacy-artifacts/heads.log 2>&1
          SIM_OFFLINE_RECEIPT="$PWD/legal-privacy-artifacts/rebuild.transport" npm run build > legal-privacy-artifacts/rebuild.log 2>&1
          git diff --binary -- public scripts/data/lastmod.json > legal-privacy-artifacts/generated.patch
          git diff --name-only -- public scripts/data/lastmod.json > legal-privacy-artifacts/generated-files.txt
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > legal-privacy-artifacts/dist.sha256
      - name: All saved-page readers and unchanged full page-weight limits
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          out="$PWD/legal-privacy-artifacts"
          node scripts/lib/hostLikeServer.mjs dist 4173 > "$out/server.log" 2>&1 &
          server=$!; trap 'kill "$server" 2>/dev/null || true' EXIT
          ready=0; for attempt in 1 2 3 4 5; do if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then ready=1; break; fi; sleep 1; done; test "$ready" -eq 1
          failed=0
          for method in simAdsense simBrand simHeadTags simHiddenPages simHubs simIndexNow simIndexing simInternalLinks simNoRivalNames simPrerender simPrerenderBoot simRetiredRoutes simSchema simSitemap simSnapshotAssets simSiteSearch simGuideHeadings; do
            status=0; SIM_OFFLINE_RECEIPT="$out/$method.transport" BASE=http://127.0.0.1:4173 SWEEP_BASE=http://127.0.0.1:4173 node "scripts/$method.mjs" > "$out/$method.log" 2>&1 || status=$?
            printf '%s\t%s\n' "$method" "$status" >> "$out/readers.tsv"
            tail -n 4 "$out/$method.log"; test "$status" -eq 0 || failed=1
          done
          status=0; SIM_OFFLINE_RECEIPT="$out/weights.transport" SWEEP_OFFLINE=1 BASE=http://127.0.0.1:4173 SWEEP_BASE=http://127.0.0.1:4173 node scripts/sweepWeight.mjs > "$out/weights.log" 2>&1 || status=$?
          printf '%s\n' "$status" > "$out/weights.exit"
          cat "$out/weights.log"; test "$status" -eq 0 || failed=1
          exit "$failed"
      - name: Preserve source and dependency boundaries
        if: always()
        run: |
          set -euo pipefail
          sha256sum --check legal-privacy-artifacts/dependencies-before.sha256 > legal-privacy-artifacts/dependencies-hold.log
          git diff --exit-code HEAD -- src supabase package.json package-lock.json .github > legal-privacy-artifacts/source-hold.log
          git diff --exit-code 3c56c21f835d46743fe5cab337b9fb46e38e3242 HEAD -- src/data src/hooks src/integrations src/types scripts/sweepWeight.mjs > legal-privacy-artifacts/gameplay-hold.log
      - name: Retain actual verification evidence and generated output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legal-privacy-${{ github.run_id }}-${{ github.run_attempt }}
          path: legal-privacy-artifacts/
          if-no-files-found: error
          retention-days: 7
