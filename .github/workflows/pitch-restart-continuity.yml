name: Pitch restart committed continuity
on:
  push:
    branches: [codex/pitch-restart-continuity]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CI: '1'
      SIM_NETWORK: offline
      ENGINES: chromium
      PITCH_RESTART_PHASE: fixed
      PITCH_RESTART_OUT: ${{ github.workspace }}/pitch-restart-artifacts
      FREE_KICK_FONT_CACHE: ${{ github.workspace }}/pitch-restart-artifacts/font-cache
      PRERENDER_ONLY: /club-manager,/soccer-career
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Bind parent application and locked dependencies
        run: |
          echo '127.0.0.1 flawuiqbvjobmkfkauhw.supabase.co' | sudo tee -a /etc/hosts
          mkdir -p "$PITCH_RESTART_OUT"
          git rev-parse HEAD > "$PITCH_RESTART_OUT/head.txt"
          git diff --exit-code 082fc2774c8aa9f919c14efa33bfc3fbfc599597 -- src scripts .github/workflows package.json package-lock.json bun.lock index.html ':!src/components/pitch-motion/motion.tsx' ':!src/test/pitchRestartContinuity.test.tsx' ':!scripts/simPitchRestartContinuity.mjs' ':!scripts/playPitchRestartContinuity.mjs' ':!.github/workflows/pitch-restart-continuity.yml' > "$PITCH_RESTART_OUT/parent-holds.log"
          if test "$PITCH_RESTART_PHASE" = baseline; then
            git diff --exit-code 082fc2774c8aa9f919c14efa33bfc3fbfc599597 -- src/components/pitch-motion/motion.tsx
          fi
          find src scripts .github/workflows -type f ! -path scripts/data/lastmod.json -print0 | sort -z | xargs -0 sha256sum > "$PITCH_RESTART_OUT/source-hashes.txt"
          sha256sum package.json package-lock.json bun.lock > "$PITCH_RESTART_OUT/package-hashes.txt"
          npm ci
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          const lock = JSON.parse(fs.readFileSync('package-lock.json'));
          const rows = Object.entries(lock.packages).filter(([file]) => file.startsWith('node_modules/') && fs.existsSync(file + '/package.json')).map(([file, entry]) => {
            const bytes = fs.readFileSync(file + '/package.json'); const version = JSON.parse(bytes).version;
            assert.equal(version, entry.version);
            return { file, version, sha256: createHash('sha256').update(bytes).digest('hex') };
          });
          assert(rows.length > 0);
          fs.writeFileSync(process.env.PITCH_RESTART_OUT + '/installed.json', JSON.stringify(rows, null, 2));
          console.log(`Bound ${rows.length} actual installed locked package versions.`);
          NODE
      - name: Actual application types
        run: NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee "$PITCH_RESTART_OUT/types.log"
      - name: Nine actual committed-frame cases
        run: |
          if test "$PITCH_RESTART_PHASE" = baseline; then
            SC_PITCH_RESTART_EXPECT_RED=1 NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/simPitchRestartContinuity.mjs 2>&1 | tee "$PITCH_RESTART_OUT/baseline.log"
          else
            NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/simPitchRestartContinuity.mjs 2>&1 | tee "$PITCH_RESTART_OUT/fixed.log"
            SC_PITCH_RESTART_CONTROL=oldrender NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/simPitchRestartContinuity.mjs 2>&1 | tee "$PITCH_RESTART_OUT/control-oldrender.log"
          fi
      - name: Original motion scene and committed-feed model
        run: NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/simLiveSimMotion.mjs 2>&1 | tee "$PITCH_RESTART_OUT/prior-motion.log"
      - name: Original own-goal model and named defender contact
        run: NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/simOwnGoalMotion.mjs 2>&1 | tee "$PITCH_RESTART_OUT/prior-own-goal.log"
      - name: Actual existing motion and scene controls
        run: |
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          import { spawnSync } from 'node:child_process';
          const root = process.env.PITCH_RESTART_OUT;
          const controls = [
            ...['pause', 'reduced', 'takenback', 'lineup', 'samecommit', 'draw', 'kickoffside', 'goalkickside'].map(control => ['simLiveSimMotion.mjs', 'LIVE_MOTION_CONTROL', control]),
            ...['plain', 'straight'].map(control => ['simOwnGoalMotion.mjs', 'OWN_GOAL_CONTROL', control]),
          ];
          for (const [script, key, control] of controls) {
            const run = spawnSync(process.execPath, ['scripts/' + script], { encoding: 'utf8', timeout: 900000, maxBuffer: 64 * 1024 * 1024, env: { ...process.env, [key]: control, FORCE_COLOR: '0', NO_COLOR: '1' } });
            const output = (run.stdout ?? '') + (run.stderr ?? ''); const file = path.join(root, 'prior-control-' + control);
            fs.writeFileSync(file + '.log', output);
            fs.writeFileSync(file + '.json', JSON.stringify({ script, control, status: run.status, signal: run.signal, error: run.error?.message ?? null }, null, 2));
            assert(!run.error && !run.signal && run.status === 1, 'Effective old control must finish with its intentional assertion exit');
            assert(!/SyntaxError:|ReferenceError:|TypeError:|ERR_MODULE_NOT_FOUND|cannot run:|DID NOT|ABORTED|Unhandled (?:Errors?|Rejection)|Test timed out|Failed to (?:resolve import|load)/i.test(output));
            assert(output.includes('Negative control changed temporary source: ' + control));
            assert(output.includes('control ' + control + ' turned "'));
            assert(output.includes('as it must.'));
            console.log(`Effective original ${script}/${control}: exit1, named assertion cause, raw process and output retained.`);
          }
          NODE
      - name: Ordinary fleet discovery of the new normal helper
        if: env.PITCH_RESTART_PHASE == 'fixed'
        run: env -u PITCH_RESTART_OUT ONLY=simPitchRestartContinuity NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/runAllSims.mjs 2>&1 | tee "$PITCH_RESTART_OUT/discovery.log"
      - name: Full ordinary unit suite
        if: env.PITCH_RESTART_PHASE == 'fixed'
        run: NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" npm test -- --maxWorkers=2 --reporter=default --reporter=json --outputFile.json="$PITCH_RESTART_OUT/full-unit.json" 2>&1 | tee "$PITCH_RESTART_OUT/full-unit.log"
      - name: Remote build prerequisites
        if: env.PITCH_RESTART_PHASE == 'fixed'
        run: |
          npm install --prefix "$RUNNER_TEMP/pitch-restart-browser" --no-save --package-lock=false playwright
          ln -s "$RUNNER_TEMP/pitch-restart-browser/node_modules/playwright" node_modules/playwright
          ln -s "$RUNNER_TEMP/pitch-restart-browser/node_modules/playwright-core" node_modules/playwright-core
          node "$RUNNER_TEMP/pitch-restart-browser/node_modules/playwright/cli.js" install --with-deps chromium
          python -m pip install fonttools pillow
          node scripts/qa/freeKickLab1070.mjs --prefetch-fonts-only 2>&1 | tee "$PITCH_RESTART_OUT/fonts.log"
      - name: Complete application build with two route snapshots
        if: env.PITCH_RESTART_PHASE == 'fixed'
        run: |
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" npm run build:seo 2>&1 | tee "$PITCH_RESTART_OUT/build.log"
          cp scripts/data/lastmod.json "$PITCH_RESTART_OUT/build-lastmod.json"
          git diff -- scripts/data/lastmod.json > "$PITCH_RESTART_OUT/build-lastmod.diff"
      - name: Actual browser restart coordinates on phone and desktop
        if: env.PITCH_RESTART_PHASE == 'fixed'
        run: NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/playPitchRestartContinuity.mjs 2>&1 | tee "$PITCH_RESTART_OUT/browser.log"
      - name: Original 604 and 830 route download ceilings
        if: env.PITCH_RESTART_PHASE == 'fixed'
        run: |
          node scripts/lib/hostLikeServer.mjs dist 4173 > "$PITCH_RESTART_OUT/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          BASE=http://127.0.0.1:4173 SWEEP_OFFLINE=1 NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/sweepWeight.mjs 2>&1 | tee "$PITCH_RESTART_OUT/weights.log"
      - name: Every rebuilt-site reader and original save caps
        if: env.PITCH_RESTART_PHASE == 'fixed'
        run: ONLY=simClubManagerSaveSize,simClubManagerSlots,simCreation,simFlagshipWeight,simAdsense,simBrand,simHeadTags,simHiddenPages,simHubs,simIndexNow,simIndexing,simInternalLinks,simNoRivalNames,simPrerender,simPrerenderBoot,simRetiredRoutes,simSchema,simSitemap,simSnapshotAssets node scripts/runAllSims.mjs --browser 2>&1 | tee "$PITCH_RESTART_OUT/readers.log"
      - name: Final source and dependency holds
        if: always()
        run: |
          sha256sum --check "$PITCH_RESTART_OUT/source-hashes.txt" > "$PITCH_RESTART_OUT/source-holds.log"
          sha256sum --check "$PITCH_RESTART_OUT/package-hashes.txt" > "$PITCH_RESTART_OUT/package-holds.log"
          git diff --exit-code -- src scripts ':!scripts/data/lastmod.json' .github/workflows package.json package-lock.json bun.lock index.html
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          const rows = JSON.parse(fs.readFileSync(process.env.PITCH_RESTART_OUT + '/installed.json'));
          for (const row of rows) {
            const bytes = fs.readFileSync(row.file + '/package.json');
            assert.equal(JSON.parse(bytes).version, row.version); assert.equal(createHash('sha256').update(bytes).digest('hex'), row.sha256);
          }
          console.log(`Held all ${rows.length} installed locked versions and package bytes.`);
          NODE
      - name: Retain complete evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pitch-restart-${{ github.run_id }}
          path: pitch-restart-artifacts/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
