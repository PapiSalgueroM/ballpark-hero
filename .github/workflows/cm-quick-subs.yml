name: Club Manager quick sim substitutions

on:
  pull_request:
    paths:
      - .github/workflows/cm-quick-subs.yml
      - src/lib/clubManager.ts
      - src/hooks/useClubManager.ts
      - src/pages/ClubManager.tsx
      - src/components/club-manager/**
      - src/data/gameContent/clubManagement.ts
      - src/test/clubManager*.test.tsx
      - scripts/simCmQuickSubs.mjs
      - scripts/playCmQuickSubs.mjs
      - scripts/simLiveMatch.mjs
      - scripts/simMatchScreen.mjs
      - scripts/simHalftime.mjs
      - scripts/simMatchDetail.mjs
      - scripts/simCmStoppageTime.mjs
      - scripts/simCmMatchCentre.mjs
      - scripts/simCmShootoutOrder.mjs
      - scripts/simClubManagerSlots.mjs
      - public/club-manager/index.html
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: cm-quick-subs-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      SIM_NETWORK: offline
      ENGINES: chromium
      VITEST_MAX_FORKS: 1
      VITEST_MIN_FORKS: 1
      SEO_SPLIT_BASE_REF: HEAD
      CM_QUICK_SUBS_ARTIFACTS: cm-quick-subs-artifacts/outcomes
      CM_QUICK_SUBS_NATIVE_ARTIFACTS: cm-quick-subs-artifacts/native
      FREE_KICK_FONT_CACHE: cm-quick-subs-artifacts/font-cache
      CM_SLOTS_ARTIFACTS: cm-quick-subs-artifacts/slots
      CM_SHOOTOUT_ARTIFACTS: cm-quick-subs-artifacts/shootout
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verification dependencies
        run: |
          mkdir -p cm-quick-subs-artifacts
          git rev-parse HEAD > cm-quick-subs-artifacts/source-head.txt
          git rev-parse HEAD^{tree} > cm-quick-subs-artifacts/source-tree.txt
          npm ci
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          python -m pip install fonttools pillow
          node scripts/qa/freeKickLab1070.mjs --prefetch-fonts-only 2>&1 | tee cm-quick-subs-artifacts/fonts.log
      - name: Type check and build
        id: build
        run: |
          node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee cm-quick-subs-artifacts/types.log
          npm run build 2>&1 | tee cm-quick-subs-artifacts/build.log
      - name: Automatic coaching outcomes and effective copied faults
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: CM_QUICK_SUBS_CONTROL=all ONLY=simCmQuickSubs node scripts/runAllSims.mjs 2>&1 | tee cm-quick-subs-artifacts/outcomes.log
      - name: Existing match and manager regression checks
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          failed=0
          for harness in simClubManager simClubManagerCalendar simClubManagerScore simClubManagerSave simClubManagerSlots simClubManagerMeters simClubManagerFacilities simClubManagerStaff simClubManagerFinances simMatchDetail simMatchScreen simLiveMatch simHalftime simCmStoppageTime simCmMatchCentre simCmShootoutOrder simNoDoubleRecord simScoringCoverage simScoreShown simHarnessAnchors; do
            ONLY="$harness" node scripts/runAllSims.mjs 2>&1 | tee "cm-quick-subs-artifacts/$harness.log" || failed=1
          done
          for control in noclock bareposs them ragged flat twoengines; do
            MATCH_SCREEN_CONTROL="$control" ONLY=simMatchScreen node scripts/runAllSims.mjs 2>&1 | tee "cm-quick-subs-artifacts/match-screen-$control.log" || failed=1
          done
          for control in noplay nocut rekick nooppsubs statsroll doubleman; do
            LIVE_MATCH_CONTROL="$control" ONLY=simLiveMatch node scripts/runAllSims.mjs 2>&1 | tee "cm-quick-subs-artifacts/live-match-$control.log" || failed=1
          done
          exit "$failed"
      - name: Historical shootouts retain full content and detect a shifted stream
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set +e
          CM_SHOOTOUT_CONTROL=unsetpath NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/simCmShootoutOrder.mjs 2>&1 | tee cm-quick-subs-artifacts/shootout-unsetpath.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 1
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          const dir = 'cm-quick-subs-artifacts/shootout';
          const normal = JSON.parse(fs.readFileSync(`${dir}/normal-baseline.json`));
          const fault = JSON.parse(fs.readFileSync(`${dir}/unsetpath-baseline.json`));
          const hash = value => createHash('sha256').update(value).digest('hex');
          assert.deepEqual(Object.keys(normal.failedSections), []);
          assert.equal(normal.summary.rows, 150);
          assert.equal(normal.summary.paired, 150);
          assert.equal(normal.oldLoad.paired, true);
          assert.deepEqual(Object.keys(fault.failedSections).sort(), ['4', '5']);
          assert.equal(fault.baselineSourceHash, normal.baselineSourceHash);
          for (const report of [normal, fault]) {
            assert.deepEqual(report.runtimeErrors, []);
            assert.equal(report.sources.length, 2);
            assert.ok(report.sources.every(source => source.held && source.before === source.after));
            assert.equal(report.rows.length, 150);
            assert.ok([...report.rows, report.oldLoad].every(row => row.allowedLive.candidate.inactive && row.allowedLive.baseline.inactive));
          }
          let changed = 0;
          for (let i = 0; i < 150; i++) {
            const a = normal.rows[i], b = fault.rows[i];
            assert.equal(a.canonicalWitness.candidate, a.canonicalWitness.baseline);
            assert.deepEqual(b.baseline, a.baseline);
            assert.equal(b.canonicalWitness.baseline, a.canonicalWitness.baseline);
            if (b.canonicalWitness.candidate !== a.canonicalWitness.candidate) changed++;
          }
          assert.ok(changed >= 12);
          assert.ok(fault.summary.paired < 150);
          assert.equal(fault.oldLoad.paired, false);
          assert.deepEqual(fault.oldLoad.baseline, normal.oldLoad.baseline);
          assert.equal(fault.oldLoad.canonicalWitness.baseline, normal.oldLoad.canonicalWitness.baseline);
          assert.equal(fault.mutation.hits, 1);
          assert.equal(fault.mutation.changed, true);
          assert.notEqual(fault.mutation.beforeHash, fault.mutation.afterHash);
          const copies = Object.fromEntries(fault.executedSources.map(source => {
            assert.ok(source.copy);
            const bytes = fs.readFileSync(`${dir}/${source.copy}`);
            assert.equal(hash(bytes), source.hash);
            return [source.role, bytes.toString('utf8')];
          }));
          const original = fs.readFileSync('src/lib/clubManager.ts', 'utf8').replaceAll('\r\n', '\n');
          const before = '  if (!order) return { won: Math.random() < clamp(0.5 + (mine - oppS) * 0.012 + shootoutTakerEdge(taker), 0.2, 0.8) };\n';
          const after = '  if (!order) { Math.random(); return { won: Math.random() < clamp(0.5 + (mine - oppS) * 0.012 + shootoutTakerEdge(taker), 0.2, 0.8) }; }\n';
          assert.equal(original.split(before).length - 1, 1);
          assert.equal(copies.candidate, original.replace(before, after));
          assert.equal(hash(original), fault.mutation.beforeHash);
          assert.equal(hash(copies.candidate), fault.mutation.afterHash);
          const coach = 'export function coachQuickMatch(career: CareerState): CareerState {\n';
          assert.equal(copies.candidate.split(coach).length - 1, 1);
          assert.equal(copies.historical, copies.candidate.replace(coach, coach + '  return career;\n'));
          assert.equal(hash(copies.baseline428), normal.baselineSourceHash);
          console.log(`CONTROL FIRED: unsetpath changed ${changed} candidate rows, only sections 4 and 5 failed, all actual-main baselines and source bytes held`);
          NODE
      - name: Saved slots keep their corruption checks
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          failed=0
          for control in nopark dupe norollback oldversion leanmore decisioncontent; do
            set +e
            SLOTS_CONTROL="$control" NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/simClubManagerSlots.mjs 2>&1 | tee "cm-quick-subs-artifacts/slot-$control.log"
            status=${PIPESTATUS[0]}
            set -e
            if [ "$status" -ne 1 ] || ! grep -q "CONTROL FIRED: SLOTS_CONTROL=$control" "cm-quick-subs-artifacts/slot-$control.log"; then failed=1; fi
            if [ "$control" = decisioncontent ]; then
              node -e "const fs=require('fs'),r=JSON.parse(fs.readFileSync(process.argv[1])); if(!r.passed || r.sources.some(s=>!s.held)) process.exit(1)" cm-quick-subs-artifacts/slots/decisioncontent-control.json || failed=1
            else
              node -e "const fs=require('fs'),r=JSON.parse(fs.readFileSync(process.argv[1])); if(r.runtimeErrors.length || r.sources.some(s=>!s.held)) process.exit(1)" "cm-quick-subs-artifacts/slots/$control-report.json" || failed=1
            fi
          done
          exit "$failed"
      - name: Every built page and search reader
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          failed=0
          for harness in simAdsense simBrand simHeadTags simHiddenPages simHubs simIndexNow simIndexing simInternalLinks simNoRivalNames simPrerender simPrerenderBoot simRetiredRoutes simSchema simSitemap simSnapshotAssets simSiteSearch simGuideHeadings simSeoTitles simSeoMetaSplit; do
            ONLY="$harness" node scripts/runAllSims.mjs --browser 2>&1 | tee "cm-quick-subs-artifacts/$harness.log" || failed=1
          done
          exit "$failed"
      - name: Guide faults detect the reviewed help changes
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          failed=0
          for control in skiplevel nokeyword lostline careerline unconvert snapdrift; do
            set +e
            GUIDE_HEADINGS_CONTROL="$control" NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/simGuideHeadings.mjs 2>&1 | tee "cm-quick-subs-artifacts/guide-$control.log"
            status=${PIPESTATUS[0]}
            set -e
            if [ "$status" -ne 1 ] || ! grep -q "simGuideHeadings control $control: section .* red and every other section green" "cm-quick-subs-artifacts/guide-$control.log"; then failed=1; fi
          done
          exit "$failed"
      - name: Actual quick sim and report on phones and desktop
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/playCmQuickSubs.mjs 2>&1 | tee cm-quick-subs-artifacts/native.log
      - name: Preserve reviewed source bytes
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: git diff --exit-code HEAD -- src/lib/clubManager.ts src/hooks/useClubManager.ts src/pages/ClubManager.tsx src/components/club-manager src/data/gameContent/clubManagement.ts src/pages/WhatsNew.tsx scripts/simCmQuickSubs.mjs scripts/playCmQuickSubs.mjs scripts/simMatchScreen.mjs scripts/simLiveMatch.mjs scripts/simHalftime.mjs scripts/simMatchDetail.mjs scripts/simCmStoppageTime.mjs scripts/simCmMatchCentre.mjs scripts/simCmShootoutOrder.mjs scripts/simClubManagerSlots.mjs
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cm-quick-subs-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          path: cm-quick-subs-artifacts/
