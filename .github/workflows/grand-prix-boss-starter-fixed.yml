name: Grand Prix Boss measured starter verification
on:
  push:
    branches: [codex/grand-prix-boss-starter-fixed-20261102]
permissions:
  contents: read
jobs:
  starter:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: '1'
      SIM_NETWORK: offline
      GP_BOSS_OUT: ${{ github.workspace }}/grand-prix-starter-artifacts/engine
      GP_BOSS_STARTER_OUT: ${{ github.workspace }}/grand-prix-starter-artifacts/starter
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Bind admitted RED and exactly three corrected paths
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/codex/grand-prix-boss-starter-fixed-20261102
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD^)" = 0f143f714bdfc09093220ccc40e37509fc12bc2d
          out="$PWD/grand-prix-starter-artifacts"
          mkdir "$out"
          git rev-parse HEAD HEAD^{tree} > "$out/head-tree.txt"
          git ls-files -z > "$out/source-members.before"
          git ls-files -z | xargs -0 sha256sum > "$out/source.sha256"
          git diff --name-only 0f143f714bdfc09093220ccc40e37509fc12bc2d HEAD > "$out/changed-paths.txt"
          printf '%s\n' '.github/workflows/grand-prix-boss-starter-fixed.yml' 'scripts/simGrandPrixBossStarterBalance.mjs' 'src/lib/grandPrixBoss.ts' > "$out/expected-paths.txt"
          cmp "$out/expected-paths.txt" "$out/changed-paths.txt"
          printf '%s\n' '4e55517139c2e5c1651c787011c76dc095944cb2d90b952075aef72914070996  src/lib/grandPrixBoss.ts' 'c7571eecfa3ffc8f78dad875780a7b345eedc837522c24c8ff9936ebf16fd485  scripts/simGrandPrixBossStarterBalance.mjs' '5788ca515844eeb92141cc291a39b2761fa5a4ae622271e981ea036dfeea81d5  scripts/simGrandPrixBoss.mjs' '8822d2af417739a0164babc5b15d13cd2a5e5c5dd4e263a9e465602798765887  src/test/grandPrixBoss.test.ts' 'aa7217b821c7852a1ac71bbc7c9d8e9e30b9754910e2965d3fae464396434bed  src/test/grandPrixBossStarterBalance.test.ts' 'cf3b484781dbff04df9033d0e1dfe239e6d9562f5cf026db2e4b1e233162a028  src/test/fixtures/grandPrixBossV5Starter.json' | sha256sum -c -
          git diff --exit-code 0f143f714bdfc09093220ccc40e37509fc12bc2d -- src/test src/lib/keyedRng.ts scripts/simGrandPrixBoss.mjs package.json package-lock.json vitest.config.ts src/test/setup.ts src/App.tsx src/data/gameRegistry.ts src/integrations/supabase/client.ts
          cat > "$out/capture.sh" <<'CAPTURE'
          capture() {
            local tag="$1"; shift
            local out="$PWD/grand-prix-starter-artifacts"
            test ! -e "$out/$tag.exit"
            printf '%s\0' "$@" > "$out/$tag.argv"
            : > "$out/$tag.transport"
            set +e
            SIM_OFFLINE_RECEIPT="$out/$tag.transport" "$@" > "$out/$tag.stdout" 2> "$out/$tag.stderr"
            local status=$?
            set -e
            printf '%s\n' "$status" > "$out/$tag.exit"
            tail -n 18 "$out/$tag.stdout"; tail -n 18 "$out/$tag.stderr"
            test ! -s "$out/$tag.transport" || return 1
            return "$status"
          }
          CAPTURE
          source "$out/capture.sh"
          capture install env NODE_OPTIONS='' npm ci
          find node_modules -path node_modules/.vite -prune -o -type f -print0 | sort -z | xargs -0 sha256sum > "$out/dependency-files.sha256"
      - name: Actual types and original engine controls
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          unset GP_BOSS_PAGE_FILE GP_BOSS_HOOK_FILE GP_BOSS_ENGINE_FILE GP_BOSS_BALANCE_OUT US_BOARD_CONTROL_ALIAS US_BOARD_CONTROL_FILE NO_DOUBLE_SWAP
          source grand-prix-starter-artifacts/capture.sh
          capture types node_modules/.bin/tsc --noEmit -p tsconfig.app.json
          capture starter-syntax node --check scripts/simGrandPrixBossStarterBalance.mjs
          capture engine-controls node scripts/simGrandPrixBoss.mjs
      - name: Actual opportunity cohorts exact prior source and three independent faults
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          unset GP_BOSS_PAGE_FILE GP_BOSS_HOOK_FILE GP_BOSS_ENGINE_FILE GP_BOSS_BALANCE_OUT US_BOARD_CONTROL_ALIAS US_BOARD_CONTROL_FILE NO_DOUBLE_SWAP
          source grand-prix-starter-artifacts/capture.sh
          capture starter-controls node scripts/simGrandPrixBossStarterBalance.mjs
      - name: Preserve complete source dependencies and membership
        if: always()
        run: |
          set -euo pipefail
          out="$PWD/grand-prix-starter-artifacts"
          sha256sum -c "$out/source.sha256" > "$out/source-hold.log"
          if test -f "$out/dependency-files.sha256"; then sha256sum -c "$out/dependency-files.sha256" > "$out/dependency-hold.log"; fi
          git ls-files -z > "$out/source-members.after"
          cmp "$out/source-members.before" "$out/source-members.after"
          git diff --exit-code HEAD > "$out/working-source-hold.log"
          git ls-files --others --exclude-standard > "$out/untracked.txt"
          test ! -s "$out/untracked.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grand-prix-starter-${{ github.run_id }}
          path: grand-prix-starter-artifacts/
          retention-days: 14
