      - name: Always retain full source payload and exact one-entry metadata inverse
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git ls-files -z > "$QA_OUT/tracked-after.bin"
          git ls-files -z | xargs -0 sha256sum > "$QA_OUT/source-after.sha256"
          git ls-files -s > "$QA_OUT/index-after.txt"
          git status --porcelain=v1 --untracked-files=all > "$QA_OUT/status-after.txt"
          cp package-lock.json "$QA_OUT/lock-after.json"
          cmp "$QA_OUT/tracked-before.bin" "$QA_OUT/tracked-after.bin"
          cmp "$QA_OUT/source-before.sha256" "$QA_OUT/source-after.sha256"
          cmp "$QA_OUT/index-before.txt" "$QA_OUT/index-after.txt"
          cmp "$QA_OUT/lock-before.json" "$QA_OUT/lock-after.json"
          test ! -s "$QA_OUT/status-before.txt"
          test ! -s "$QA_OUT/status-after.txt"
          if test -f "$QA_OUT/fixtures/manifest.json"; then
            node --input-type=module <<'NODE'
          import fs from 'node:fs';import path from 'node:path';import crypto from 'node:crypto';import assert from 'node:assert/strict';
          const out=process.env.QA_OUT,dir=path.join(out,'fixtures'),PUB='.github/workflows/soccer-first-real-entry-public-v3-20261105.yml',BROWSER='scripts/qa/soccerHistoricalEntryBrowser.mjs',sha=b=>crypto.createHash('sha256').update(b).digest('hex');
          const bytes=fs.readFileSync(path.join(dir,'manifest.json')),m=JSON.parse(bytes),originalBytes=fs.readFileSync(path.join(out,'original-native','manifest.json'));
          assert.deepEqual(m.sourceBefore,m.sourceAfter);
          for(const[p,d]of Object.entries(m.sourceAfter))assert.equal(sha(fs.readFileSync(p)),d,p);
          const expected=JSON.parse(fs.readFileSync(path.join(out,'fixture-files-before.json')));
          assert.deepEqual(fs.readdirSync(dir).sort(),expected.map(r=>r.file).sort());
          for(const row of expected){const b=fs.readFileSync(path.join(dir,row.file));assert.equal(b.length,row.bytes);assert.equal(sha(b),row.sha256,row.file);}
          const inverse=JSON.parse(bytes);
          assert(Object.hasOwn(inverse.sourceBefore,PUB)&&Object.hasOwn(inverse.sourceAfter,PUB));
          const originalMaps=JSON.parse(originalBytes);
          assert.equal(originalMaps.sourceBefore[BROWSER],'35066ebcaaf44e368c8edaf8d4f424007e12741d0fa1b09d41609f0b1f6397c9');
          inverse.sourceBefore[BROWSER]=originalMaps.sourceBefore[BROWSER];
          inverse.sourceAfter[BROWSER]=originalMaps.sourceAfter[BROWSER];
          delete inverse.sourceBefore[PUB];
          delete inverse.sourceAfter[PUB];
          assert(Buffer.from(JSON.stringify(inverse,null,2)+'\n').equals(originalBytes),'Only the exact native browser value is restored and the single public workflow entry removed, every original manifest byte restored');
          const native=path.join(process.env.QA_REF,'native');
          assert(fs.readFileSync(path.join(native,'native-fixtures','manifest.json')).equals(originalBytes));
          assert(fs.readFileSync(path.join(native,'source-before.sha256')).equals(fs.readFileSync(path.join(out,'original-native','source-before.sha256'))));
          const actual=[];
          function walk(rel=''){for(const e of fs.readdirSync(path.join(process.env.QA_DIST,rel),{withFileTypes:true})){const file=path.posix.join(rel,e.name);if(e.isDirectory())walk(file);else{assert(e.isFile());const b=fs.readFileSync(path.join(process.env.QA_DIST,file));actual.push({file,bytes:b.length,sha256:sha(b)});}}}
          walk();actual.sort((a,b)=>a.file<b.file?-1:a.file>b.file?1:0);assert.deepEqual(actual,m.distBefore);assert.equal(actual.length,848);
          for(const name of fs.readdirSync(path.join(out,'transport')))assert.equal(fs.statSync(path.join(out,'transport',name)).size,0,'Silent actual receipt '+name);
          fs.writeFileSync(path.join(out,'source-dist-fixture-held.json'),JSON.stringify({source:true,dist:848,fixtureBoundaries:3,fixtureFiles:expected.length,allNativePayloadBodiesHeld:true,originalNativeManifestAndLedgerRetained:true,oneBrowserOneWorkflowTwoMapWholeInverseExact:true,readOnlyCodeNoBuild:true})+'\n',{flag:'wx'});
          NODE
          fi
          printf '0\n' > "$QA_OUT/logs/final-source-holds.exit"
      - name: Retain all actual public proof within the unchanged archive bound
