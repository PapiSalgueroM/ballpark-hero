      - name: Verify actual custom-domain bodies around the same three native journeys
        shell: bash
        run: |
          set +e
          set -uo pipefail
          unset NODE_OPTIONS
          export GIT_NO_LAZY_FETCH=1
          run_live() {
            local name="$1"; shift
            local receipt="$QA_OUT/transport/$name.log"
            : > "$receipt"
            SIM_OFFLINE_RECEIPT="$receipt" "$@" > "$QA_OUT/logs/$name.stdout.log" 2> "$QA_OUT/logs/$name.stderr.log"
            local code=$?
            printf '%s\n' "$code" > "$QA_OUT/logs/$name.exit"
            test "$code" = 0 || return "$code"
            test ! -s "$receipt" || return 1
          }
          run_live assets-before node --unhandled-rejections=strict scripts/qa/soccerHistoricalEntryAssets.mjs "$QA_OUT/fixtures/manifest.json" "$QA_DIST" "$QA_OUT/assets" https://douknowball.com before
          before_exit=$?
          test "$before_exit" = 0 || exit "$before_exit"
          run_live browser node --unhandled-rejections=strict scripts/qa/soccerHistoricalEntryBrowser.mjs --public --out "$QA_OUT/browser" --fixtures "$QA_OUT/fixtures" --dist "$QA_DIST" --base-url https://douknowball.com
          browser_exit=$?
          run_live assets-after node --unhandled-rejections=strict scripts/qa/soccerHistoricalEntryAssets.mjs "$QA_OUT/fixtures/manifest.json" "$QA_DIST" "$QA_OUT/assets" https://douknowball.com after
          after_exit=$?
          test "$browser_exit" = 0 || exit "$browser_exit"
          test "$after_exit" = 0 || exit "$after_exit"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const out=process.env.QA_OUT,r=JSON.parse(fs.readFileSync(out+'/browser/report.json'));
          assert.equal(r.status,'passed');assert.equal(r.mode,'public');assert.deepEqual(r.contexts.map(c=>[c.width,c.status,c.photos.length]),[[320,'passed',4],[390,'passed',4],[1280,'passed',4]]);assert.equal(r.screenshots.length,12);assert.equal(new Set(r.screenshots).size,12);
          for(const c of r.contexts){assert(c.assetBodies.some(a=>a.file==='prerender-boot.js'));assert.equal(c.wheelAcknowledgments?.length,1);assert.equal(c.wheelAcknowledgments[0].status,'passed');assert.equal(c.wheelAcknowledgments[0].guardControl.wholeInverseExact,true);assert.equal(c.wheelAcknowledgments[0].guardControl.actualReceiptHeld,true);for(const key of['pageErrors','unexpectedConsole','undeclaredAborts','localHttpErrors','assetErrors'])assert.deepEqual(c[key],[]);assert.equal(c.failClosedControls.wholeInverseExact,true);assert.equal(c.cardGeometryControl.wholeInverseExact,true);assert.equal(c.reviewScrollControl.wholeInverseExact,true);assert(c.actions.some(a=>a.type==='retired-explicit-record-label'&&/player record\s+2008/.test(a.text)));}
          for(const key of['sourceHeld','distHeld','fixtureHeld','nodeReceiptEmpty'])assert.equal(r[key],true);
          const {createHash}=await import('node:crypto'),sha=b=>createHash('sha256').update(b).digest('hex');
          for(const c of r.contexts){
            assert.equal(c.publicWriteControl.changed,true);assert.equal(c.publicWriteControl.wholeInverseExact,true);assert.equal(c.publicWriteControl.actualSampleHeld,true);assert.match(c.publicWriteControl.ownedFailure.message,/^No new write request/);
            assert.equal(c.publicHostInitiatorControl.changed,true);assert(c.publicHostInitiatorControl.removedSourceEntries>0);assert.equal(c.publicHostInitiatorControl.wholeInverseExact,true);assert.equal(c.publicHostInitiatorControl.actualSampleHeld,true);assert.match(c.publicHostInitiatorControl.ownedFailure.message,/^SC_REAL_ENTRY_PUBLIC_HOST_INITIATOR/);
            assert.equal(c.publicPreflightControl.changed,true);assert.equal(c.publicPreflightControl.wholeInverseExact,true);assert.equal(c.publicPreflightControl.actualSampleHeld,true);assert.match(c.publicPreflightControl.ownedFailure.message,/^SC_REAL_ENTRY_PUBLIC_LINKED_READ_PREFLIGHT/);
            assert(c.hostTelemetry.reads.length>0);assert(c.hostTelemetry.completionWaits.length>0);
            for(const wait of c.hostTelemetry.completionWaits){assert.equal(wait.status,'paired');assert.equal(wait.maximumMilliseconds,5000);assert.equal(wait.intervalMilliseconds,25);assert(wait.elapsedMilliseconds<5000);assert(wait.samples.length>0);assert.equal(wait.samples.at(-1).status,'paired');}
            const preflights=c.hostTelemetry.finalWindow.preflights;assert(preflights.length>0);
            for(const row of preflights){assert.equal(row.preflight.method,'OPTIONS');assert.equal(row.preflight.initiator.type,'preflight');assert.equal(row.preflight.postData,null);assert.equal(row.preflight.initiator.requestId,row.read.requestId);assert.equal(row.read.method,'GET');assert.equal(row.read.url,row.preflight.url);assert.equal(row.pw.method,'GET');assert.equal(row.pw.url,row.read.url);assert.equal(row.abort.requestId,row.pw.requestId);assert.equal(row.abort.url,row.pw.url);assert.equal(row.abort.method,row.pw.method);}
            const source=c.hostTelemetry.source;assert.equal(source.status,'actual-declared-and-observed-host-script');assert.equal(source.url,'https://douknowball.com/__l5e/events.270c78a44fc53e7b.js');assert.deepEqual(source.sourceEndpointMatches,[]);
            for(const row of[source.document,source.script]){assert(!row.file.includes('..'));const bytes=fs.readFileSync(out+'/browser/'+row.file);assert.equal(bytes.length,row.bytes);assert.equal(sha(bytes),row.sha256);}
            const writes=c.hostTelemetry.finalWindow.writes;assert(writes.length>0);
            for(const row of writes){assert.equal(row.request.method,'POST');assert.equal(row.request.url,'https://douknowball.com/__l5e/trackevents');assert.equal(row.abort.requestId,row.request.requestId);assert.equal(row.abort.url,row.request.url);assert.equal(row.abort.method,row.request.method);const body=Buffer.from(row.trace.postData??'','utf8');assert.equal(body.length,row.request.body.bytes);assert.equal(sha(body),row.request.body.sha256);}
          }
          const before=JSON.parse(fs.readFileSync(out+'/assets/served-assets-before.json')),after=JSON.parse(fs.readFileSync(out+'/assets/served-assets-after.json'));assert.equal(before.base,'https://douknowball.com');assert.equal(after.base,before.base);assert.equal(after.entry,before.entry);assert.deepEqual(after.rows,before.rows);assert(before.rows.some(row=>row.file==='prerender-boot.js'));
          for(const phase of['before','after']){const html=JSON.parse(fs.readFileSync(out+'/assets/served-'+phase+'/html-control.json')),boot=JSON.parse(fs.readFileSync(out+'/assets/served-'+phase+'/boot-inventory-control.json'));assert.equal(html.changed,true);assert.equal(html.wholeInverseExact,true);assert.match(html.ownedFailure.message,/^SC_SEGUNDA_ASSET_ROUTE_CURRENT_ENTRY/);assert.equal(boot.changed,true);assert.equal(boot.wholeInverseExact,true);assert.match(boot.ownedFailure.message,/^SC_SEGUNDA_ASSET_CRITICAL_STABLE_BOOT/);}
          fs.writeFileSync(out+'/public-native-admission.json',JSON.stringify({status:'public-native-phase-passed',contexts:3,photos:12,actualPublicPhotosRequireHumanReview:true,qualifiedNativeSource:process.env.NATIVE_SOURCE,publishedSource:process.env.PUBLISHED_SOURCE,deployedSource:process.env.DEPLOY_SOURCE,deployment:process.env.DEPLOYMENT_ID,sourceMapOnlyBridge:true,publicHostEventAttribution:true,noBuild:true,noFixtureRegeneration:true,scope:'Actual2005 UI creation plus three separately declared complete saved boundaries. Full source-entry/career-world card, explicit retired player-record header, read-only/reload and observed assets. No natural full career, guaranteed nomination/transfer, provider, broad-suite-green or full SC36 claim. Empty uninstrumented live receipts do not establish provider availability.'},null,2)+'\n',{flag:'wx'});
