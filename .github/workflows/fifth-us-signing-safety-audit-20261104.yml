name: Fifth US signing callback and current terms physical controls
on:
  push:
    branches: [codex/fifth-us-signing-safety-audit-20261104]
permissions:
  contents: read
env:
  CI: '1'
  SIM_NETWORK: offline
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Hold exact candidate source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 9ac4800245baeb0ff822921ab62f3071ff2e8562
          OUT="$RUNNER_TEMP/us-signing-safety"
          mkdir -p "$OUT"
          echo "QA_OUT=$OUT" >> "$GITHUB_ENV"
          git rev-parse HEAD HEAD^{tree} > "$OUT/source.txt"
          git ls-files -z | sort -z | xargs -0 sha256sum > "$OUT/source-before.sha256"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          npm ci --no-audit --no-fund > "$OUT/install.log" 2>&1
      - name: Fixed physical broken and restored panel checks
        shell: bash
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$GITHUB_WORKSPACE/scripts/lib/offlineTransport.cjs"
          : > "$QA_OUT/caller-transport.log"
          SIM_OFFLINE_RECEIPT="$QA_OUT/caller-transport.log" node scripts/qa/usSigningRequestSafetyAudit.mjs > "$QA_OUT/runner.log" 2>&1
          cat "$QA_OUT/runner.log"
          test ! -s "$QA_OUT/caller-transport.log"
      - name: Always require full exact source restoration
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code HEAD > "$QA_OUT/source-diff.txt"
          git ls-files -z | sort -z | xargs -0 sha256sum > "$QA_OUT/source-after.sha256"
          cmp "$QA_OUT/source-before.sha256" "$QA_OUT/source-after.sha256"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fifth-us-signing-safety-audit
          path: ${{ runner.temp }}/us-signing-safety
          if-no-files-found: error
          retention-days: 14
