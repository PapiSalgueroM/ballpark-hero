name: XI recorded position fit
on:
  push:
    branches: [codex/xi-record-position-fit]
    paths:
      - supabase/functions/validate-player/index.ts
      - scripts/simLineupRecordPositions.mjs
      - .github/workflows/xi-record-position-fit.yml
  pull_request:
    paths:
      - supabase/functions/validate-player/index.ts
      - scripts/simLineupRecordPositions.mjs
      - .github/workflows/xi-record-position-fit.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xi-record-position-fit-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      SIM_NETWORK: offline
      ENGINES: chromium
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact source and locked dependency preparation
        run: |
          mkdir -p xi-record-position-fit-artifacts
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse 'aa564f16019b9e821981d5c4e3e0262312c73b62^{tree}')" = e3e5332ddf95b79802c82487a03df3c0aca32e75
          git diff --exit-code aa564f16019b9e821981d5c4e3e0262312c73b62 HEAD -- . ':!docs/**' ':!supabase/functions/validate-player/index.ts' ':!scripts/simLineupRecordPositions.mjs' ':!.github/workflows/xi-record-position-fit.yml'
          git rev-parse HEAD > xi-record-position-fit-artifacts/source-head.txt
          git rev-parse 'HEAD^{tree}' > xi-record-position-fit-artifacts/source-tree.txt
          git archive --format=zip --output=xi-record-position-fit-artifacts/source.zip HEAD
          git ls-tree -r HEAD > xi-record-position-fit-artifacts/source-inventory.txt
          git archive --format=zip --output=xi-record-position-fit-artifacts/base-source.zip aa564f16019b9e821981d5c4e3e0262312c73b62
          git ls-tree -r aa564f16019b9e821981d5c4e3e0262312c73b62 > xi-record-position-fit-artifacts/base-source-inventory.txt
          sha256sum xi-record-position-fit-artifacts/source.zip xi-record-position-fit-artifacts/base-source.zip > xi-record-position-fit-artifacts/source-archive-sha256.txt
          sha256sum package.json package-lock.json > xi-record-position-fit-artifacts/packages-before.txt
          npm ci
          DEPENDENCY_OUT=xi-record-position-fit-artifacts/dependencies-before.json node --input-type=module - <<'JS'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const lock=JSON.parse(fs.readFileSync('package-lock.json','utf8')),installed=[],omitted=[];
          const fits=(rules,value)=>!rules||(!rules.some(x=>x==='!'+value)&&(rules.every(x=>x.startsWith('!'))||rules.includes(value)));
          for(const [directory,expected]of Object.entries(lock.packages)){
           if(!directory.startsWith('node_modules/')||!expected.version)continue;
           const name=expected.name??directory.split('node_modules/').at(-1),file=directory+'/package.json';
           if(!fs.existsSync(file)){assert.equal(expected.optional,true,directory+' required dependency missing');assert((expected.os&&!fits(expected.os,process.platform))||(expected.cpu&&!fits(expected.cpu,process.arch)),directory+' optional omission needs a platform reason');omitted.push({directory,name,version:expected.version,optional:expected.optional,os:expected.os??null,cpu:expected.cpu??null});continue;}
           const actual=JSON.parse(fs.readFileSync(file,'utf8'));assert.equal(actual.version,expected.version,directory);assert.equal(actual.name,name,directory+' locked name');installed.push({directory,name:actual.name,version:actual.version});
          }
          assert.equal(installed.length,521);assert.equal(omitted.length,78);assert.equal(installed.length+omitted.length,599);
          fs.writeFileSync(process.env.DEPENDENCY_OUT,JSON.stringify({platform:process.platform,arch:process.arch,installed,omitted},null,2));
          console.log('PASS full locked dependency census: 521 installed and 78 platform-qualified optional omissions');
          JS
          npm install --no-save playwright@1.64.0
          npx playwright install --with-deps chromium
          python -m pip install fonttools pillow
          sha256sum package.json package-lock.json > xi-record-position-fit-artifacts/packages-after-setup.txt
          cmp xi-record-position-fit-artifacts/packages-before.txt xi-record-position-fit-artifacts/packages-after-setup.txt
      - name: Actual app type gate
        run: NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee xi-record-position-fit-artifacts/types.log
      - name: Production Vite build and unchanged snapshot retention
        id: build
        run: |
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" npm run build 2>&1 | tee xi-record-position-fit-artifacts/build.log
          git diff --binary HEAD -- public scripts/data/lastmod.json > xi-record-position-fit-artifacts/generated-public.patch
          git diff --exit-code HEAD -- public scripts/data/lastmod.json
          find public -type f -print0 | sort -z | xargs -0 sha256sum > xi-record-position-fit-artifacts/generated-public-sha256.txt
          tar -czf xi-record-position-fit-artifacts/generated-public-and-lastmod.tar.gz public scripts/data/lastmod.json
          sha256sum xi-record-position-fit-artifacts/generated-public-and-lastmod.tar.gz > xi-record-position-fit-artifacts/generated-public-archive-sha256.txt
          sha256sum scripts/data/lastmod.json > xi-record-position-fit-artifacts/generated-lastmod-sha256.txt
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > xi-record-position-fit-artifacts/dist-sha256.txt
          tar -czf xi-record-position-fit-artifacts/dist-assets.tar.gz dist/assets
          sha256sum xi-record-position-fit-artifacts/dist-assets.tar.gz > xi-record-position-fit-artifacts/dist-assets-archive-sha256.txt
      - name: Actual compiled record handler frontend matrix and source controls
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          LINEUP_RECORD_POSITIONS_OUT=xi-record-position-fit-artifacts/proof NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/simLineupRecordPositions.mjs 2>&1 | tee xi-record-position-fit-artifacts/record-positions.log
          grep -Fx 'PASS simLineupRecordPositions' xi-record-position-fit-artifacts/record-positions.log
          node --input-type=module - <<'JS'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const report=JSON.parse(fs.readFileSync('xi-record-position-fit-artifacts/proof/report.json','utf8'));assert.equal(report.status,'pass');
          JS
      - name: Three existing offline XI gates and all fifteen rebuilt readers
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          failed=0
          for harness in simLineupValidatorClient simBuildYourXiFit simQuotaHonesty simAdsense simBrand simHeadTags simHiddenPages simHubs simIndexNow simIndexing simInternalLinks simNoRivalNames simPrerender simPrerenderBoot simRetiredRoutes simSchema simSitemap simSnapshotAssets; do
            test -f "scripts/$harness.mjs"
            VERIFY_HARNESS="$harness" ONLY="$harness" NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node --input-type=module - --browser <<'JS' 2>&1 | tee "xi-record-position-fit-artifacts/$harness.log" || failed=1
          import fs from 'node:fs';import path from 'node:path';import cp from 'node:child_process';import {syncBuiltinESMExports} from 'node:module';
          const name=process.env.VERIFY_HARNESS,base='xi-record-position-fit-artifacts/'+name,nativeSpawn=cp.spawn,children=[];
          cp.spawn=function(command,args,options){
           const child=nativeSpawn.call(this,command,args,options);
           if(command===process.execPath&&path.resolve(args?.[0]??'')===path.resolve('scripts/'+name+'.mjs')){
            const row={command:process.execPath,args,cwd:options?.cwd??null,stdoutBytes:0,stderrBytes:0,exitCode:null,signal:null};children.push(row);
            fs.writeFileSync(base+'.stdout.log','');fs.writeFileSync(base+'.stderr.log','');
            child.stdout.on('data',data=>{fs.appendFileSync(base+'.stdout.log',data);row.stdoutBytes+=data.length;});
            child.stderr.on('data',data=>{fs.appendFileSync(base+'.stderr.log',data);row.stderrBytes+=data.length;});
            child.on('close',(code,signal)=>{row.exitCode=code;row.signal=signal;});
           }
           return child;
          };
          syncBuiltinESMExports();
          process.on('exit',code=>fs.writeFileSync(base+'.process.json',JSON.stringify({harness:name,runnerExit:code,children},null,2)));
          await import('./scripts/runAllSims.mjs');
          JS
            VERIFY_HARNESS="$harness" node --input-type=module - <<'JS' || failed=1
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const name=process.env.VERIFY_HARNESS,base='xi-record-position-fit-artifacts/'+name,r=JSON.parse(fs.readFileSync(base+'.process.json','utf8'));
          assert.equal(r.harness,name);assert.equal(r.children.length,1);const c=r.children[0];
          assert.equal(fs.statSync(base+'.stdout.log').size,c.stdoutBytes);assert.equal(fs.statSync(base+'.stderr.log').size,c.stderrBytes);
          const text=fs.readFileSync(base+'.stdout.log','utf8')+'\n'+fs.readFileSync(base+'.stderr.log','utf8'),omissions=text.split('\n').filter(line=>/\bskip(?:ped|ping)?\b|\bnot (?:run|checked)\b|\blive.only\b/i.test(line));
          fs.writeFileSync(base+'.scope.json',JSON.stringify({harness:name,internalOmissionLines:omissions,scope:'Recorded internal omissions receive no database or live-request coverage credit.'},null,2));
          assert.equal(c.exitCode,0);assert.equal(c.signal,null);assert.equal(r.runnerExit,0);
          JS
            grep -Eq "PASS[[:space:]]+$harness\\.mjs([[:space:]]|$)" "xi-record-position-fit-artifacts/$harness.log" || failed=1
            if grep -Eq '(^|[[:space:]])(SKIP|EMPTY)([[:space:]]|$)' "xi-record-position-fit-artifacts/$harness.log"; then failed=1; fi
          done
          exit "$failed"
      - name: Complete sources packages snapshots and dependency holds
        if: ${{ !cancelled() }}
        run: |
          git diff --exit-code HEAD -- . ':!docs/**' > xi-record-position-fit-artifacts/source-held.log
          if [ -f xi-record-position-fit-artifacts/generated-lastmod-sha256.txt ]; then sha256sum --check xi-record-position-fit-artifacts/generated-lastmod-sha256.txt; fi
          if [ -f xi-record-position-fit-artifacts/generated-public-sha256.txt ]; then sha256sum --check xi-record-position-fit-artifacts/generated-public-sha256.txt; fi
          sha256sum package.json package-lock.json > xi-record-position-fit-artifacts/packages-final.txt
          cmp xi-record-position-fit-artifacts/packages-before.txt xi-record-position-fit-artifacts/packages-final.txt
          DEPENDENCY_OUT=xi-record-position-fit-artifacts/dependencies-final.json node --input-type=module - <<'JS'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const lock=JSON.parse(fs.readFileSync('package-lock.json','utf8')),installed=[],omitted=[];
          const fits=(rules,value)=>!rules||(!rules.some(x=>x==='!'+value)&&(rules.every(x=>x.startsWith('!'))||rules.includes(value)));
          for(const [directory,expected]of Object.entries(lock.packages)){
           if(!directory.startsWith('node_modules/')||!expected.version)continue;
           const name=expected.name??directory.split('node_modules/').at(-1),file=directory+'/package.json';
           if(!fs.existsSync(file)){assert.equal(expected.optional,true,directory+' required dependency missing');assert((expected.os&&!fits(expected.os,process.platform))||(expected.cpu&&!fits(expected.cpu,process.arch)),directory+' optional omission needs a platform reason');omitted.push({directory,name,version:expected.version,optional:expected.optional,os:expected.os??null,cpu:expected.cpu??null});continue;}
           const actual=JSON.parse(fs.readFileSync(file,'utf8'));assert.equal(actual.version,expected.version,directory);assert.equal(actual.name,name,directory+' locked name');installed.push({directory,name:actual.name,version:actual.version});
          }
          assert.equal(installed.length,521);assert.equal(omitted.length,78);assert.equal(installed.length+omitted.length,599);
          fs.writeFileSync(process.env.DEPENDENCY_OUT,JSON.stringify({platform:process.platform,arch:process.arch,installed,omitted},null,2));
          console.log('PASS full locked dependency census: 521 installed and 78 platform-qualified optional omissions');
          JS
          cmp xi-record-position-fit-artifacts/dependencies-before.json xi-record-position-fit-artifacts/dependencies-final.json
          node --input-type=module - <<'JS'
          import fs from 'node:fs';import assert from 'node:assert/strict';assert.equal(JSON.parse(fs.readFileSync('node_modules/playwright/package.json','utf8')).version,'1.64.0');console.log('PASS actual pinned Playwright 1.64.0');
          JS
          find xi-record-position-fit-artifacts -type f ! -name artifact-member-sha256.txt -print0 | sort -z | xargs -0 sha256sum > xi-record-position-fit-artifacts/artifact-member-sha256.txt
          du -sb xi-record-position-fit-artifacts > xi-record-position-fit-artifacts/artifact-size.log
          test "$(du -sb xi-record-position-fit-artifacts | cut -f1)" -lt 500000000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xi-record-position-fit-${{ github.run_id }}-${{ github.run_attempt }}
          path: xi-record-position-fit-artifacts/
          retention-days: 5
          if-no-files-found: error
