name: Rarity Round crowd panel ownership original
on:
  push:
    branches: [codex/rarity-round-crowd-ownership-original-retry-qa-20261107]
permissions:
  actions: read
  contents: read
jobs:
  original:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: UTC
      SIM_NETWORK: offline
      SIM_OFFLINE_RECEIPT: rarity-round-crowd-ownership-original/offline.log
      RARITY_ROUND_CROWD_OWNERSHIP_RAW: rarity-round-crowd-ownership-original/public-cases.raw.json
      BASE_HEAD: 'b74ad1c3f44582c04d64ffe34f10541185423475'
      BASE_TREE: '53b589dd3a5acbb963ff9c593ccd12257b2388b4'
      ORIGINAL_PAGE: '4a7bd374dfd888a13e5067340b58483a255dde5b'
      TEST_BLOB: '5d983f1d199893480d47235321e31dd85a913ac4'
      PLAN_BLOB: '285c47d684e01e66182e48b5b869612d65c12af6'
      PREFLIGHT_HEAD: '22941ced53837bf71d66f9e6a15761b3a311a869'
      PREFLIGHT_TREE: '687fbca552423ac16cb78188bbc15eee057a93f3'
      PREFLIGHT_ARTIFACT: '13571043278'
      PREFLIGHT_DIGEST: 'sha256:df44d37065418462659aa5e2cb03fbd015753ddba35d900a72b91d0d38ea5dcb'
      PREFLIGHT_BYTES: '1012836'
      EVIDENCE: rarity-round-crowd-ownership-original
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - name: Authenticate active-entry evidence and exact original source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test ! -e "$EVIDENCE"
          mkdir "$EVIDENCE"
          touch "$SIM_OFFLINE_RECEIPT"
          git rev-parse HEAD > "$EVIDENCE/head.txt"
          git rev-parse 'HEAD^{tree}' > "$EVIDENCE/tree.txt"
          git ls-files -s > "$EVIDENCE/source-before.txt"
          sha256sum package.json package-lock.json > "$EVIDENCE/locks-before.txt"
          git diff --exit-code HEAD -- .
          git fetch --no-tags --depth=1 origin "$BASE_HEAD"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';

          const { BASE_HEAD, BASE_TREE, ORIGINAL_PAGE, TEST_BLOB, PLAN_BLOB, EVIDENCE } = process.env;
          const runId = 42364767384;
          const api = process.env.GITHUB_API_URL + '/repos/' + process.env.GITHUB_REPOSITORY;
          const request = async path => {
            const response = await fetch(api + path, {
              headers: {
                Accept: 'application/vnd.github+json',
                Authorization: 'Bearer ' + process.env.GH_TOKEN,
                'X-GitHub-Api-Version': '2022-11-28',
              },
              redirect: 'error',
            });
            assert.equal(response.status, 200, 'preflight API ' + path);
            return response.json();
          };
          const [run, jobs, artifacts] = await Promise.all([
            request('/actions/runs/' + runId),
            request('/actions/runs/' + runId + '/jobs?per_page=100'),
            request('/actions/runs/' + runId + '/artifacts?per_page=100'),
          ]);
          assert.equal(run.id, runId);
          assert.equal(run.head_sha, process.env.PREFLIGHT_HEAD);
          assert.equal(run.head_commit.tree_id, process.env.PREFLIGHT_TREE);
          assert.equal(run.path, '.github/workflows/rarity-round-crowd-ownership-20261107.yml');
          assert.equal(run.status, 'completed');
          assert.equal(run.conclusion, 'success');
          assert.equal(run.event, 'push');
          assert.equal(run.head_branch, 'codex/rarity-round-crowd-ownership-preflight-qa-20261107');
          assert.equal(run.repository.full_name, process.env.GITHUB_REPOSITORY);
          assert.equal(run.run_attempt, 1);
          assert.equal(jobs.jobs.length, 1);
          assert.equal(jobs.jobs[0].id, 128380392615);
          assert.equal(jobs.jobs[0].status, 'completed');
          assert.equal(jobs.jobs[0].conclusion, 'success');
          assert.equal(jobs.jobs[0].head_sha, run.head_sha);
          assert.equal(jobs.jobs[0].steps.length, 11);
          assert(jobs.jobs[0].steps.every(step => step.conclusion === 'success'));
          assert.equal(artifacts.artifacts.length, 1);
          const [artifact] = artifacts.artifacts;
          assert.equal(artifact.id, Number(process.env.PREFLIGHT_ARTIFACT));
          assert.equal(artifact.workflow_run.head_sha, run.head_sha);
          assert.equal(artifact.workflow_run.id, run.id);
          assert.equal(artifact.name, 'rarity-round-crowd-ownership-active-preflight-' + run.id);
          assert.equal(artifact.expired, false);
          assert.equal(artifact.digest, process.env.PREFLIGHT_DIGEST);
          assert.equal(artifact.size_in_bytes, Number(process.env.PREFLIGHT_BYTES));
          delete process.env.GH_TOKEN;
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8', maxBuffer: 16 * 1024 * 1024 }).trimEnd();
          assert.equal(git('rev-parse', 'HEAD'), process.env.GITHUB_SHA);
          assert.deepEqual(git('rev-list', '--parents', '-n', '1', 'HEAD').split(' '), [process.env.GITHUB_SHA, BASE_HEAD]);
          assert.equal(git('rev-parse', BASE_HEAD + '^{tree}'), BASE_TREE);
          const page = 'src/pages/RarityRound.tsx';
          const test = 'src/test/rarityRoundCrowdOwnership.test.tsx';
          const plan = 'docs/plans/2026-11-07-rarity-round-crowd-ownership.md';
          const workflow = '.github/workflows/rarity-round-crowd-ownership-20261107.yml';
          const newPaths = [test, plan, workflow].sort();
          const pins = { [page]: ORIGINAL_PAGE, [test]: TEST_BLOB, [plan]: PLAN_BLOB };
          const sha = (algo, data) => createHash(algo).update(data).digest('hex');
          for (const [file, want] of Object.entries(pins)) {
            const bytes = fs.readFileSync(file);
            assert.match(want, /^[0-9a-f]{40}$/);
            assert.equal(git('rev-parse', 'HEAD:' + file), want);
            assert.equal(sha('sha1', Buffer.concat([Buffer.from('blob ' + bytes.length + '\0'), bytes])), want);
          }
          assert.equal(git('rev-parse', BASE_HEAD + ':' + page), ORIGINAL_PAGE);
          assert.deepEqual(git('diff', '--name-only', BASE_HEAD, 'HEAD').split('\n').sort(), newPaths);
          const tree = ref => git('ls-tree', '-r', '-z', ref).split('\0').filter(Boolean);
          const parent = tree(BASE_HEAD);
          const current = tree('HEAD');
          assert.equal(parent.length, 5789);
          assert.equal(current.length, 5792);
          assert.deepEqual(current.filter(row => !newPaths.includes(row.split('\t')[1])), parent);
          assert.equal(current.filter(row => /^(src|public|scripts)\//.test(row.split('\t')[1])).length, 4664);
          fs.writeFileSync(EVIDENCE + '/source-receipt.json', JSON.stringify({
            head: process.env.GITHUB_SHA, tree: git('rev-parse', 'HEAD^{tree}'), parent: BASE_HEAD, parentTree: BASE_TREE,
            pins, ownedWorkflow: git('rev-parse', 'HEAD:' + workflow), heldRows: parent.length, trackedRows: current.length,
            activePreflight: { run: run.id, head: run.head_sha, job: jobs.jobs[0].id, artifact: artifact.id, digest: artifact.digest },
          }, null, 2));
          NODE
      - name: Install locked dependencies and freeze physical source
        run: |
          set -euo pipefail
          npm ci 2>&1 | tee "$EVIDENCE/install.log"
          cat > "$EVIDENCE/physical.mjs" <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          const stage = process.argv[2];
          assert(['before', 'after'].includes(stage));
          const out = process.env.EVIDENCE;
          const index = execFileSync('git', ['ls-files', '-z'], { encoding: 'utf8' }).split('\0').filter(Boolean);
          const source = index.map(file => {
            const bytes = fs.readFileSync(file);
            return [file, bytes.length, createHash('sha256').update(bytes).digest('hex')];
          });
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const installed = Object.entries(lock.packages).filter(([file]) =>
            file.startsWith('node_modules/') && fs.existsSync(file + '/package.json')
          ).map(([file, entry]) => {
            const version = JSON.parse(fs.readFileSync(file + '/package.json', 'utf8')).version;
            assert.equal(version, entry.version, file);
            return [file, version];
          });
          assert.equal(source.length, 5792);
          assert.equal(installed.length, 521);
          assert.equal(fs.statSync(process.env.SIM_OFFLINE_RECEIPT).size, 0);
          for (const [name, data] of [['tracked', source], ['installed', installed]]) {
            const body = JSON.stringify(data);
            if (stage === 'after') assert.equal(body, fs.readFileSync(out + '/' + name + '-before.json', 'utf8'));
            fs.writeFileSync(out + '/' + name + '-' + stage + '.json', body);
          }
          NODE
          node "$EVIDENCE/physical.mjs" before
      - name: Proper app types
        run: |
          set -euo pipefail
          node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee "$EVIDENCE/types.log"
      - name: Require exactly the two original crowd ownership failures
        run: |
          set -euo pipefail
          result=0
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node_modules/.bin/vitest run \
            src/test/rarityRoundCrowdOwnership.test.tsx --reporter=default --reporter=json \
            --outputFile="$EVIDENCE/vitest.json" > "$EVIDENCE/vitest.log" 2>&1 || result=$?
          cat "$EVIDENCE/vitest.log"
          printf '%s\n' "$result" > "$EVIDENCE/vitest-exit.txt"
          test "$result" -eq 1
          test -s "$RARITY_ROUND_CROWD_OWNERSHIP_RAW"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          const out = process.env.EVIDENCE;
          const report = JSON.parse(fs.readFileSync(out + '/vitest.json', 'utf8'));
          const expected = new Map([
            ['keeps the next crowd panel empty while its own read is pending', 'RARITY_OLD_CROWD_WHILE_CURRENT_PENDING'],
            ['keeps the current crowd panel when the old category settles last', 'RARITY_OLD_CROWD_AFTER_CURRENT_SETTLED'],
          ]);
          assert.equal(report.numTotalTests, expected.size);
          assert.equal(report.numFailedTests, expected.size);
          assert.equal(report.numPassedTests, 0);
          assert.equal(report.numPendingTests, 0);
          assert.equal(report.numTodoTests, 0);
          assert.equal(report.success, false);
          for (const key of ['errors', 'unhandledErrors']) {
            if (Object.hasOwn(report, key)) assert.deepEqual(report[key], []);
          }
          assert.equal(report.testResults.length, 1);
          const [suite] = report.testResults;
          assert(suite.name.endsWith('/src/test/rarityRoundCrowdOwnership.test.tsx'));
          assert.equal(suite.status, 'failed');
          assert.equal(suite.message, '');
          assert.equal(suite.assertionResults.length, expected.size);
          const log = fs.readFileSync(out + '/vitest.log', 'utf8');
          assert(!/Unhandled Errors?|Unhandled Rejection|Uncaught Exception|Failed Suites|Worker exited|Test timed out/i.test(log));
          const results = suite.assertionResults.map(test => {
            assert.equal(test.status, 'failed');
            const marker = expected.get(test.title);
            assert(marker && test.failureMessages.length === 1 && test.failureMessages[0].startsWith('AssertionError: ' + marker + ':'), test.fullName);
            assert([...expected.values()].filter(value => test.failureMessages[0].includes(value)).length === 1);
            return { title: test.title, marker };
          });
          assert.equal(new Set(results.map(result => result.marker)).size, expected.size);
          const raw = fs.readFileSync(process.env.RARITY_ROUND_CROWD_OWNERSHIP_RAW);
          const evidence = JSON.parse(raw.toString('utf8'));
          assert.equal(evidence.schema, 'rarity-round-crowd-ownership-v1');
          assert.equal(evidence.instant, '2026-11-12T17:00:00.000Z');
          assert.equal(evidence.debounceMs, 200);
          const fixtures = {"a":{"id":"position-forward","position":"Centre-Forward","prompt":"Name a centre-forward","pool":[{"player_name":"Fixture A One","peak_value_usd":60000000},{"player_name":"Fixture A Two","peak_value_usd":50000000},{"player_name":"Fixture A Three","peak_value_usd":40000000},{"player_name":"Fixture A Four","peak_value_usd":30000000},{"player_name":"Fixture A Five","peak_value_usd":20000000},{"player_name":"Fixture A Six","peak_value_usd":10000000}],"answer":"Fixture A Two","rank":2,"points":80,"crowd":["Fixture A Six"," fIXTURE a SIX ","Fixture A Five","Fixture B Six","Fixture Unlisted"]},"b":{"id":"position-right-winger","position":"Right Winger","prompt":"Name a right winger","pool":[{"player_name":"Fixture B One","peak_value_usd":60000000},{"player_name":"Fixture B Two","peak_value_usd":50000000},{"player_name":"Fixture B Three","peak_value_usd":40000000},{"player_name":"Fixture B Four","peak_value_usd":30000000},{"player_name":"Fixture B Five","peak_value_usd":20000000},{"player_name":"Fixture B Six","peak_value_usd":10000000}],"answer":"Fixture B Four","rank":4,"points":40,"crowd":["Fixture B Six"," fixture b SIX ","Fixture B Six","Fixture B Five"," fIXTURE B FIVE ","Fixture A Six","Fixture Unlisted"]}};
          assert.deepEqual(evidence.fixtures, fixtures);
          const positive = {
            a: [{ name: 'Fixture A Six', picks: 2 }, { name: 'Fixture A Five', picks: 1 }],
            b: [{ name: 'Fixture B Six', picks: 3 }, { name: 'Fixture B Five', picks: 2 }],
          };
          const cases = [
            ['oldWhileCurrentPending', 'a', 'b', 'keeps the next crowd panel empty while its own read is pending'],
            ['oldAfterCurrentSettled', 'b', 'a', 'keeps the current crowd panel when the old category settles last'],
          ];
          const common = [
            'mounted-a', 'a-typed', 'a-searched', 'a-selected', 'a-revealed-held',
            'b-playing', 'b-typed', 'b-searched', 'b-selected', 'b-revealed-held',
          ];
          const reveal = (frame, role, subtotal, crowd) => {
            const fixture = fixtures[role];
            assert.equal(frame.phase, 'revealed');
            assert.equal(frame.round, 'Round ' + (role === 'a' ? 1 : 2) + ' of 5');
            assert.equal(frame.prompt, fixture.prompt);
            assert.equal(frame.subtotal, '· Rarity Round score so far: ' + subtotal);
            assert.deepEqual(frame.result, {
              answer: fixture.answer,
              rank: 'Ranked ' + fixture.rank + ' of 6 by fame in this category',
              points: fixture.points,
              pointsLabel: 'points (lower is better)',
            });
            assert.deepEqual(frame.crowd, crowd);
            assert.equal(frame.next, true);
          };
          const deliveryFlags = (frame, a, b) => {
            const rows = frame.requests.filter(row => row.role.endsWith('-crowd'));
            assert.deepEqual(rows, [
              ...(a === undefined ? [] : [{ role: 'a-crowd', delivered: a }]),
              ...(b === undefined ? [] : [{ role: 'b-crowd', delivered: b }]),
            ]);
          };
          assert.deepEqual(Object.keys(evidence.cases).sort(), cases.map(([key]) => key).sort());
          for (const [key, first, second, title] of cases) {
            const scenario = evidence.cases[key];
            assert.equal(scenario.key, key);
            assert.equal(scenario.title, title);
            assert.equal(scenario.marker, expected.get(title));
            assert.equal(scenario.closed, true);
            assert.deepEqual(scenario.unexpected, []);
            assert(scenario.completions.length >= 3);
            for (const [game, complete, points, count] of scenario.completions) {
              assert.equal(game, 'rarity-round');
              assert.equal(complete, false);
              assert([[0, 0], [20, 1], [80, 2]].some(([p, n]) => p === points && n === count));
            }
            assert.deepEqual(scenario.completions.at(-1), ['rarity-round', false, 80, 2]);
            const order = [...common, 'deliver-' + first, 'deliver-' + second, 'before-unmount', 'after-unmount'];
            assert.deepEqual(scenario.frames.map(frame => frame.label), order);
            assert.deepEqual(scenario.actions.map(action => action.label), order.filter(label => label !== 'before-unmount'));
            assert(scenario.frames.every(frame => Number.isFinite(frame.at) && typeof frame.html === 'string'));
            assert(scenario.frames.slice(0, -1).every(frame => frame.html.length > 500));
            assert(scenario.actions.every(action => Number.isFinite(action.before) && action.after >= action.before));
            const frames = Object.fromEntries(scenario.frames.map(frame => [frame.label, frame]));
            assert.equal(frames['after-unmount'].phase, 'unmounted');
            assert.equal(frames['after-unmount'].timers, 0);
            assert.equal(frames['after-unmount'].html, '');
            assert.deepEqual(frames['before-unmount'].storage, frames['mounted-a'].storage);
            reveal(frames['a-revealed-held'], 'a', 80, null);
            deliveryFlags(frames['a-revealed-held'], false);
            reveal(frames['b-revealed-held'], 'b', 120, null);
            deliveryFlags(frames['b-revealed-held'], false, false);
            reveal(frames['deliver-' + first], 'b', 120, positive[first]);
            deliveryFlags(frames['deliver-' + first], first === 'a', first === 'b');
            reveal(frames['deliver-' + second], 'b', 120, positive[second]);
            deliveryFlags(frames['deliver-' + second], true, true);
            reveal(frames['before-unmount'], 'b', 120, positive[second]);
            assert.equal(scenario.requests.length, 10);
            const roles = ['pool', 'search-direct', 'search-prominence', 'insert', 'crowd'];
            const requests = Object.fromEntries(scenario.requests.map(request => [request.role, request]));
            assert.deepEqual(Object.keys(requests).sort(), ['a', 'b'].flatMap(role => roles.map(suffix => role + '-' + suffix)).sort());
            for (const role of ['a', 'b']) {
              const f = fixtures[role];
              const request = suffix => requests[role + '-' + suffix];
              const query = (entry, table, method, status) => {
                assert.equal(entry.method, method);
                assert.equal(entry.status, status);
                assert(Number.isFinite(entry.receivedAt) && entry.deliveredAt >= entry.receivedAt);
                const url = new URL(entry.url);
                assert.equal(url.origin, 'https://flawuiqbvjobmkfkauhw.supabase.co');
                assert.equal(url.pathname, '/rest/v1/' + table);
                assert.deepEqual(entry.query, [...url.searchParams]);
                if (method === 'GET') assert.equal(entry.body, null);
                return url.searchParams;
              };
              const pool = request('pool');
              const poolQuery = query(pool, 'player_position_peaks', 'GET', 200);
              assert.equal(poolQuery.get('select'), 'player_name,peak_value_usd');
              assert.equal(poolQuery.get('position'), 'eq.' + f.position);
              assert.equal(poolQuery.get('order'), 'peak_value_usd.desc,player_name.asc');
              assert.equal(poolQuery.get('offset'), '0');
              assert.equal(poolQuery.get('limit'), '1000');
              assert.deepEqual(pool.rows, f.pool);
              for (const suffix of ['search-direct', 'search-prominence']) {
                const entry = request(suffix);
                const params = query(entry, 'player_market_values', 'GET', 200);
                assert.equal(params.get('select'), 'player_name,market_value_usd,year,club,nationality,position,age,person_key');
                assert.equal(params.get('order'), 'market_value_usd.desc,year.desc,player_name.asc');
                assert.equal(params.get('position'), 'eq.' + f.position);
                assert.equal(params.get('limit'), suffix === 'search-direct' ? '200' : '1000');
                assert.equal(params.get('name_folded'), suffix === 'search-direct' ? 'ilike.%' + f.answer.toLowerCase() + '%' : null);
                assert.equal(entry.rows.length, 1);
                assert.deepEqual(entry.rows[0], {
                  player_name: f.answer, market_value_usd: f.pool[f.rank - 1].peak_value_usd,
                  year: 2026, club: 'Fixture Club ' + role.toUpperCase(), nationality: 'Fixture Nation',
                  position: f.position, age: 24, person_key: 'rarity-fixture-' + role,
                });
              }
              const insert = request('insert');
              assert.equal(query(insert, 'rarity_round_guesses', 'POST', 201).size, 0);
              assert.equal(insert.body, JSON.stringify({ category_key: f.id, answer: f.answer }));
              assert.equal(insert.rows, null);
              const crowd = request('crowd');
              const crowdQuery = query(crowd, 'rarity_round_guesses', 'GET', 200);
              assert.equal(crowdQuery.get('select'), 'answer');
              assert.equal(crowdQuery.get('category_key'), 'eq.' + f.id);
              assert.equal(crowdQuery.get('order'), 'created_at.desc');
              assert.equal(crowdQuery.get('limit'), '400');
              assert.deepEqual(crowd.rows, f.crowd.map(answer => ({ answer })));
              assert(crowd.receivedAt >= insert.deliveredAt);
            }
          }
          fs.writeFileSync(out + '/original-result.json', JSON.stringify({
            status: 'expected-original-business-failures', tests: results, rawBytes: raw.length,
            rawSHA256: createHash('sha256').update(raw).digest('hex'),
          }, null, 2));
          NODE
      - name: Verify unchanged physical source and locked offline run
        if: always()
        run: |
          set -euo pipefail
          git ls-files -s > "$EVIDENCE/source-after.txt"
          sha256sum package.json package-lock.json > "$EVIDENCE/locks-after.txt"
          cmp "$EVIDENCE/source-before.txt" "$EVIDENCE/source-after.txt"
          cmp "$EVIDENCE/locks-before.txt" "$EVIDENCE/locks-after.txt"
          git diff --exit-code HEAD -- .
          node "$EVIDENCE/physical.mjs" after
          test ! -s "$SIM_OFFLINE_RECEIPT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rarity-round-crowd-ownership-original-${{ github.run_id }}
          path: rarity-round-crowd-ownership-original
          retention-days: 14
          if-no-files-found: error
