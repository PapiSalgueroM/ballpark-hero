name: Rarity Round crowd panel ownership controls
on:
  push:
    branches: [codex/rarity-round-crowd-ownership-controls-qa-20261107]
permissions:
  actions: read
  contents: read
jobs:
  controls:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: UTC
      SIM_NETWORK: offline
      SIM_OFFLINE_RECEIPT: rarity-round-crowd-ownership-controls/offline.log
      RARITY_STAGE: controls
      BASE_HEAD: 'b74ad1c3f44582c04d64ffe34f10541185423475'
      BASE_TREE: '53b589dd3a5acbb963ff9c593ccd12257b2388b4'
      ORIGINAL_PAGE: '4a7bd374dfd888a13e5067340b58483a255dde5b'
      FIXED_PAGE: '7c38b10a808cdf083bf5d1ed2f9d15b0a3cae93a'
      TEST_BLOB: '5d983f1d199893480d47235321e31dd85a913ac4'
      PLAN_BLOB: '285c47d684e01e66182e48b5b869612d65c12af6'
      EVIDENCE: rarity-round-crowd-ownership-controls
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - name: Capture source and authenticate admitted Rarity artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test ! -e "$EVIDENCE"
          mkdir "$EVIDENCE"
          touch "$SIM_OFFLINE_RECEIPT"
          git rev-parse HEAD > "$EVIDENCE/head.txt"
          git rev-parse 'HEAD^{tree}' > "$EVIDENCE/tree.txt"
          git ls-files -s > "$EVIDENCE/source-before.txt"
          sha256sum package.json package-lock.json > "$EVIDENCE/locks-before.txt"
          git diff --exit-code HEAD -- .
          git fetch --no-tags --depth=1 origin "$BASE_HEAD"
          cat > "$EVIDENCE/qualify.mjs" <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import { createHash } from 'node:crypto';
          import { execFileSync, spawnSync } from 'node:child_process';
          
          const stage = process.env.RARITY_STAGE;
          const out = process.env.EVIDENCE;
          const page = 'src/pages/RarityRound.tsx';
          const test = 'src/test/rarityRoundCrowdOwnership.test.tsx';
          const plan = 'docs/plans/2026-11-07-rarity-round-crowd-ownership.md';
          const workflow = '.github/workflows/rarity-round-crowd-ownership-20261107.yml';
          const { BASE_HEAD: parent, BASE_TREE: parentTree, ORIGINAL_PAGE: originalPage, FIXED_PAGE: fixedPage, TEST_BLOB: testBlob, PLAN_BLOB: planBlob } = process.env;
          const refs = {"original":{"run":42366132461,"job":128384489936,"steps":12,"artifact":13571383152,"name":"rarity-round-crowd-ownership-original-42366132461","head":"18328be0c2fd1fc4047fa52c9b9104c68929ddee","tree":"5ef388371d25f1f871162f04d6503f727549b2f6","workflow":"1752d3b50e5758ec5f13161edea66684d5f63184","zipBytes":1000690,"zipSHA256":"37dcbda51c1ac8d50da907fc31ff5f38c5362e75dca36c70bc36edd8e1512ccb","bodies":20,"files":{"head.txt":"e2b32221557f89a43b78d9af380c60a647402604331ef12a5b981b8edd7510aa","tree.txt":"c5b93ab7ee1bc8e1ade231c1740b06c2199f27bc01d5ccad38be6ba3a04e171d","source-receipt.json":"9900e40d5e3dfe052b7382efc618db903b659817f319f17abb9dcae4133cfbfb","original-result.json":"5ebf350846b8b1aa285fe71a2616aa7eaf2458663b64a18f9088d4a0633fd5aa","public-cases.raw.json":"a81bd4c4690a8b2bd8f0892af2d314d26ded00780722a4000871b8b49d19e5fe","vitest.json":"529d175017665a849c3c13187a8966c5156ce754d300b67c50a3d6adc5817dd7","vitest-exit.txt":"4355a46b19d348dc2f57c046f8ef63d4538ebb936000f3c9ee954a27460dd865","source-before.txt":"0371bd82ee5d51e21c98567a643c15a4c6e975195ffdb5359b5ef4b66dceac13","source-after.txt":"0371bd82ee5d51e21c98567a643c15a4c6e975195ffdb5359b5ef4b66dceac13","locks-before.txt":"d316e23dae0f11f4fabcf8edd97204c9b780c6da8a0f6307c86940cbdd28e3d7","locks-after.txt":"d316e23dae0f11f4fabcf8edd97204c9b780c6da8a0f6307c86940cbdd28e3d7","offline.log":"e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855","types.log":"e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"},"independentAuditSHA256":"4dd81a07e2bf81cacab868ea2ba6f143833c6a5bd18129826817f56fdf7e4056"},"fixed":{"run":42367425437,"job":128388327828,"steps":12,"artifact":13572023105,"name":"rarity-round-crowd-ownership-fixed-42367425437","head":"52652b5eaca96d03ef6b8c4dc39e55a314a00a00","tree":"9dd996d8621a87e55f073d2df684bb80e17f5cd3","workflow":"9b8c5e7cb6dde27fa568f915fe723932125d6e0b","zipBytes":2003317,"zipSHA256":"b7e0dec79c5033c0ec07e671dce25f8b56f6fec9bfcdf8bca5164856355507ca","bodies":24,"files":{"head.txt":"e9167de6d93f973cecffbc7603d45dc850f0bd5267a1b10fdfc8b5fc0451fd76","tree.txt":"528aa11527c2a21d41b22dc4039275bde2d1c7c70172288b6c9f2fb871ea1e8c","source-receipt.json":"cb5e9e7b43d35de2df35e0bb2503429b61b877fb2f99f5373ac4db5d31467cc5","admission.json":"3816c2b2ab76ef16b348026c5b7af1475370a9988644eb019c4b81ceb485ba76","fixed/public-cases.raw.json":"abc9f818b64a8305ae116f1f39650f12f4531aa65c4ac44ab8fa59d97c18df96","fixed/vitest.json":"d57e511b1869ee17fabe4a245b801a8633c4a71a3037b6c528ad3adf626b0b89","fixed/vitest-exit.txt":"9a271f2a916b0b6ee6cecb2426f0b3206ef074578be55d9bc94f6f3fe3ab86aa","fixed/result.json":"56ae47ca7318e011b7043d6353958e74836ed407d60689bb6f89a0e1c14c9102","source-before.txt":"9343d63dfb3fef54d7f9b3f00be55bcd36cd97c8280ebcfabd5574fb217d76d6","source-after.txt":"9343d63dfb3fef54d7f9b3f00be55bcd36cd97c8280ebcfabd5574fb217d76d6","locks-before.txt":"d316e23dae0f11f4fabcf8edd97204c9b780c6da8a0f6307c86940cbdd28e3d7","locks-after.txt":"d316e23dae0f11f4fabcf8edd97204c9b780c6da8a0f6307c86940cbdd28e3d7","offline.log":"e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855","types.log":"e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"},"independentAuditSHA256":"80ec81c73540c95e19407103b5e415072bd1baca210790365e2ae182d7a86469"}};
          const options = { maxBuffer: 64 * 1024 * 1024 };
          const cmd = (program, args) => execFileSync(program, args, options);
          const git = (...args) => cmd('git', args).toString('utf8');
          const hash = (algorithm, bytes) => createHash(algorithm).update(bytes).digest('hex');
          const sha = bytes => hash('sha256', bytes);
          const blob = bytes => hash('sha1', Buffer.concat([Buffer.from('blob ' + bytes.length + '\0'), bytes]));
          const read = file => fs.readFileSync(path.join(out, file));
          const json = file => JSON.parse(read(file));
          const write = (file, body) => fs.writeFileSync(path.join(out, file), body);
          const save = (file, value) => write(file, JSON.stringify(value, null, 2) + '\n');
          const sorted = rows => [...rows].sort();
          const tree = ref => new Map(git('ls-tree', '-r', '-z', ref).split('\0').filter(Boolean).map(row => {
            const match = /^(100(?:644|755)) blob ([a-f0-9]{40})\t(.+)$/.exec(row);
            assert(match, row);
            return [match[3], [match[1], match[2]]];
          }));
          const source = () => ({
            head: git('rev-parse', 'HEAD').trim(), tree: git('rev-parse', 'HEAD^{tree}').trim(), parent, parentTree,
            page: fixedPage, test: testBlob, plan: planBlob, workflow: git('rev-parse', 'HEAD:' + workflow).trim(),
            trackedRows: 5792, heldParentRows: 5788, sourceRows: 4664,
          });
          const zip = role => path.join(out, 'reference-' + role + '.zip');
          const refFile = (role, name) => cmd('unzip', ['-p', zip(role), name]);
          
          function authenticate(role, pin) {
            const prefix = 'repos/PapiSalgueroM/ballpark-hero/actions/';
            const api = endpoint => JSON.parse(cmd('gh', ['api', prefix + endpoint]));
            const run = api('runs/' + pin.run);
            const jobs = api('runs/' + pin.run + '/jobs?per_page=100').jobs;
            const artifact = api('artifacts/' + pin.artifact);
            assert.deepEqual([run.id, run.status, run.conclusion, run.event, run.run_attempt, run.path, run.head_sha, run.head_commit.tree_id, run.repository.full_name],
              [pin.run, 'completed', 'success', 'push', 1, workflow, pin.head, pin.tree, 'PapiSalgueroM/ballpark-hero']);
            assert.equal(jobs.length, 1);
            assert.deepEqual([jobs[0].id, jobs[0].conclusion, jobs[0].head_sha, jobs[0].steps.length], [pin.job, 'success', pin.head, pin.steps]);
            assert(jobs[0].steps.every(step => step.conclusion === 'success'));
            assert.deepEqual([artifact.id, artifact.name, artifact.expired, artifact.size_in_bytes, artifact.digest, artifact.workflow_run.id, artifact.workflow_run.head_sha],
              [pin.artifact, pin.name, false, pin.zipBytes, 'sha256:' + pin.zipSHA256, pin.run, pin.head]);
            const bytes = cmd('gh', ['api', prefix + 'artifacts/' + pin.artifact + '/zip']);
            assert.deepEqual([bytes.length, sha(bytes)], [pin.zipBytes, pin.zipSHA256]);
            fs.writeFileSync(zip(role), bytes);
            const names = cmd('unzip', ['-Z1', zip(role)]).toString().trimEnd().split('\n');
            assert.equal(new Set(names).size, names.length);
            for (const name of names) {
              assert(!name.startsWith('/') && !name.includes('\\') && name.replace(/\/$/, '').split('/').every(part => part && part !== '.' && part !== '..'), name);
            }
            assert.equal(names.filter(name => !name.endsWith('/')).length, pin.bodies);
            assert.equal(refFile(role, 'head.txt').toString().trim(), pin.head);
            assert.equal(refFile(role, 'tree.txt').toString().trim(), pin.tree);
            for (const [name, digest] of Object.entries(pin.files)) assert.equal(sha(refFile(role, name)), digest, name);
            save('reference-' + role + '-metadata.json', { ...pin, authenticated: true });
          }
          
          function prepare() {
            assert(['fixed', 'controls'].includes(stage));
            assert.equal(process.env.GITHUB_SHA, source().head);
            assert.deepEqual(git('rev-list', '--parents', '-n', '1', 'HEAD').trim().split(' '), [source().head, parent]);
            assert.equal(git('rev-parse', parent + '^{tree}').trim(), parentTree);
            const old = tree(parent);
            const current = tree('HEAD');
            const owned = sorted([workflow, page, test, plan]);
            assert.equal(old.size, 5789);
            assert.equal(current.size, 5792);
            assert.equal([...current.keys()].filter(file => /^(src|public|scripts)\//.test(file)).length, 4664);
            const changed = sorted(new Set([...old.keys(), ...current.keys()])).filter(file =>
              JSON.stringify(old.get(file)) !== JSON.stringify(current.get(file)));
            assert.deepEqual(changed, owned);
            assert.deepEqual(old.get(page), ['100644', originalPage]);
            for (const [file, pin] of [[page, fixedPage], [test, testBlob], [plan, planBlob], [workflow, source().workflow]]) {
              assert.deepEqual(current.get(file), ['100644', pin], file);
              assert.equal(blob(fs.readFileSync(file)), pin, file);
            }
            assert.equal(git('status', '--porcelain', '--untracked-files=no'), '');
            assert.deepEqual(Object.keys(refs).sort(), stage === 'fixed' ? ['original'] : ['fixed', 'original']);
            for (const [role, pin] of Object.entries(refs)) authenticate(role, pin);
            save('source-receipt.json', { ...source(), pins: { [page]: fixedPage, [test]: testBlob, [plan]: planBlob }, owned, references: refs });
          }
          
          const markers = new Map([
            ['keeps the next crowd panel empty while its own read is pending', 'RARITY_OLD_CROWD_WHILE_CURRENT_PENDING'],
            ['keeps the current crowd panel when the old category settles last', 'RARITY_OLD_CROWD_AFTER_CURRENT_SETTLED'],
          ]);
          const crowdA = [{ name: 'Fixture A Six', picks: 2 }, { name: 'Fixture A Five', picks: 1 }];
          const crowdB = [{ name: 'Fixture B Six', picks: 3 }, { name: 'Fixture B Five', picks: 2 }];
          const panelStart = '<div class="mx-auto max-w-sm rounded-xl border border-border bg-surface-1 px-4 py-3 text-left"><p class="text-[10px] font-semibold uppercase tracking-wider text-muted-foreground mb-1.5">👥 What everyone else picked</p>';
          function panel(rows) {
            const body = rows.map(({ name, picks }, index) =>
              '<div class="flex items-baseline justify-between gap-2 text-sm"><span class="truncate text-foreground">' +
              (index + 1) + '. ' + name + '</span><span class="shrink-0 text-xs font-bold text-muted-foreground">' +
              picks + (picks === 1 ? ' pick' : ' picks') + '</span></div>').join('');
            return panelStart + body + '</div>';
          }
          function compareRaw(raw, original) {
            assert.equal(raw.schema, 'rarity-round-crowd-ownership-v1');
            const expected = structuredClone(original);
            const fixtureCases = [
              ['oldWhileCurrentPending', ['deliver-a'], null],
              ['oldAfterCurrentSettled', ['deliver-a', 'before-unmount'], crowdB],
            ];
            for (const [key, labels, replacement] of fixtureCases) {
              const baseline = expected.cases[key];
              const actual = raw.cases[key];
              assert(baseline.closed && actual.closed);
              assert.deepEqual([actual.frames.length, actual.actions.length, actual.requests.length], [14, 13, 10]);
              for (const label of labels) {
                const frame = baseline.frames.find(row => row.label === label);
                assert.deepEqual(frame.crowd, crowdA);
                assert.equal(frame.html.split(panel(crowdA)).length, 2, key + ':' + label);
                frame.html = frame.html.replace(panel(crowdA), replacement === null ? '' : panel(replacement));
                frame.crowd = replacement;
              }
              const completionStages = rows => rows.filter((args, index) =>
                index === 0 || JSON.stringify(args) !== JSON.stringify(rows[index - 1]));
              assert.deepEqual(completionStages(actual.completions), [
                ['rarity-round', false, 0, 0], ['rarity-round', false, 20, 1], ['rarity-round', false, 80, 2],
              ]);
              assert.deepEqual(completionStages(actual.completions), completionStages(baseline.completions));
              baseline.completions = actual.completions;
            }
            assert.deepEqual(raw, expected, 'Only the three stale panel frames and redundant completion observations differ');
          }
          function runRole(role, wantOriginal) {
            fs.mkdirSync(path.join(out, role));
            const rawName = role + '/public-cases.raw.json';
            const reportName = role + '/vitest.json';
            const logName = role + '/vitest.log';
            const proc = spawnSync('node_modules/.bin/vitest', ['run', test, '--reporter=default', '--reporter=json', '--outputFile=' + path.join(out, reportName)], {
              ...options, env: { ...process.env, NODE_OPTIONS: '--require=' + process.cwd() + '/scripts/lib/offlineTransport.cjs',
                RARITY_ROUND_CROWD_OWNERSHIP_RAW: path.join(out, rawName) },
            });
            const log = Buffer.concat([proc.stdout ?? Buffer.alloc(0), proc.stderr ?? Buffer.alloc(0)]);
            write(logName, log);
            process.stdout.write(log);
            write(role + '/vitest-exit.txt', String(proc.status) + '\n');
            assert.ifError(proc.error);
            assert.equal(proc.signal, null);
            assert.equal(proc.status, wantOriginal ? 1 : 0, role);
            assert(!/Unhandled Errors?|Unhandled Rejection|Uncaught Exception|Failed Suites|Worker exited|Test timed out/i.test(log.toString()));
            const report = json(reportName);
            assert.deepEqual([report.numTotalTests, report.numPassedTests, report.numFailedTests, report.numPendingTests, report.numTodoTests, report.success],
              [2, wantOriginal ? 0 : 2, wantOriginal ? 2 : 0, 0, 0, !wantOriginal]);
            for (const key of ['errors', 'unhandledErrors']) if (Object.hasOwn(report, key)) assert.deepEqual(report[key], []);
            assert.equal(report.testResults.length, 1);
            const [suite] = report.testResults;
            assert(suite.name.endsWith('/' + test));
            assert.deepEqual([suite.status, suite.message, suite.assertionResults.length], [wantOriginal ? 'failed' : 'passed', '', 2]);
            assert.deepEqual(sorted(suite.assertionResults.map(row => row.title)), sorted(markers.keys()));
            for (const row of suite.assertionResults) {
              assert.equal(row.status, wantOriginal ? 'failed' : 'passed', row.title);
              assert.equal(row.failureMessages.length, wantOriginal ? 1 : 0);
              if (wantOriginal) assert(row.failureMessages[0].startsWith('AssertionError: ' + markers.get(row.title) + ':'));
            }
            const raw = read(rawName);
            const old = refFile('original', 'public-cases.raw.json');
            if (wantOriginal) assert(raw.equals(old), 'Complete original RAW must match qualified original');
            else compareRaw(JSON.parse(raw), JSON.parse(old));
            if (stage === 'controls' && !wantOriginal) {
              assert(raw.equals(refFile('fixed', 'fixed/public-cases.raw.json')), 'Complete fixed RAW must match qualified fixed');
            }
            const result = { role, code: proc.status, passed: report.numPassedTests, failed: report.numFailedTests,
              rawBytes: raw.length, rawSHA256: sha(raw), reportSHA256: sha(read(reportName)), wholeOriginal: wantOriginal,
              fixedOriginalDifferenceRestricted: !wantOriginal, wholeFixedReference: stage === 'controls' && !wantOriginal };
            save(role + '/result.json', result);
            return result;
          }
          function qualify() {
            const fixed = fs.readFileSync(page);
            const old = cmd('git', ['show', parent + ':' + page]);
            const index = git('ls-files', '-s');
            const locks = ['package.json', 'package-lock.json'].map(file => sha(fs.readFileSync(file)));
            assert.deepEqual([blob(fixed), blob(old)],[fixedPage, originalPage]);
            const runs = { fixed: runRole('fixed', false) };
            if (stage === 'controls') {
              try {
                fs.writeFileSync(page, old);
                assert.equal(blob(fs.readFileSync(page)), originalPage);
                assert.equal(git('diff', '--name-only', 'HEAD', '--', '.').trim(), page);
                assert.equal(git('ls-files', '-s'), index);
                runs.original = runRole('original', true);
              } finally {
                fs.writeFileSync(page, fixed);
                assert(fs.readFileSync(page).equals(fixed));
              }
              assert.equal(git('diff', '--name-only', 'HEAD', '--', '.'), '');
              runs.restored = runRole('restored', false);
              assert(read('restored/public-cases.raw.json').equals(read('fixed/public-cases.raw.json')));
              save('physical-page-control.json', { onlyPhysicalPath: page, originalPage, fixedPage, restoredPage: blob(fs.readFileSync(page)),
                changedPageVerified: true, indexUnchanged: git('ls-files', '-s') === index, restoredExactFixed: true });
            }
            assert(fs.readFileSync(page).equals(fixed));
            assert.equal(git('ls-files', '-s'), index);
            assert.deepEqual(['package.json','package-lock.json'].map(file => sha(fs.readFileSync(file))), locks);
            assert.equal(fs.statSync(process.env.SIM_OFFLINE_RECEIPT).size, 0);
            save('admission.json', { stage, status: 'passed', runs, references: refs, source: source(), physicalRestored: true, offlineBytes: 0 });
          }
          const mode = process.argv[2];
          if (mode === 'prepare') prepare();
          else if (mode === 'qualify') qualify();
          else throw new Error('Unknown Rarity qualification mode');
          NODE
          node "$EVIDENCE/qualify.mjs" prepare
      - name: Install locked dependencies and freeze physical source
        run: |
          set -euo pipefail
          npm ci 2>&1 | tee "$EVIDENCE/install.log"
          cat > "$EVIDENCE/physical.mjs" <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          const stage = process.argv[2];
          assert(['before', 'after'].includes(stage));
          const out = process.env.EVIDENCE;
          const index = execFileSync('git', ['ls-files', '-z'], { encoding: 'utf8' }).split('\0').filter(Boolean);
          const source = index.map(file => {
            const bytes = fs.readFileSync(file);
            return [file, bytes.length, createHash('sha256').update(bytes).digest('hex')];
          });
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const installed = Object.entries(lock.packages).filter(([file]) =>
            file.startsWith('node_modules/') && fs.existsSync(file + '/package.json')
          ).map(([file, entry]) => {
            const version = JSON.parse(fs.readFileSync(file + '/package.json', 'utf8')).version;
            assert.equal(version, entry.version, file);
            return [file, version];
          });
          assert.equal(source.length, 5792);
          assert.equal(installed.length, 521);
          assert.equal(fs.statSync(process.env.SIM_OFFLINE_RECEIPT).size, 0);
          for (const [name, data] of [['tracked', source], ['installed', installed]]) {
            const body = JSON.stringify(data);
            if (stage === 'after') assert.equal(body, fs.readFileSync(out + '/' + name + '-before.json', 'utf8'));
            fs.writeFileSync(out + '/' + name + '-' + stage + '.json', body);
          }
          NODE
          node "$EVIDENCE/physical.mjs" before
      - name: Proper app types
        run: |
          set -euo pipefail
          node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee "$EVIDENCE/types.log"
      - name: Run frozen public Rarity tests for the exact controls roles
        run: |
          set -euo pipefail
          node "$EVIDENCE/qualify.mjs" qualify
      - name: Verify unchanged physical source and locked offline run
        if: always()
        run: |
          set -euo pipefail
          git ls-files -s > "$EVIDENCE/source-after.txt"
          sha256sum package.json package-lock.json > "$EVIDENCE/locks-after.txt"
          cmp "$EVIDENCE/source-before.txt" "$EVIDENCE/source-after.txt"
          cmp "$EVIDENCE/locks-before.txt" "$EVIDENCE/locks-after.txt"
          git diff --exit-code HEAD -- .
          node "$EVIDENCE/physical.mjs" after
          test ! -s "$SIM_OFFLINE_RECEIPT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rarity-round-crowd-ownership-controls-${{ github.run_id }}
          path: rarity-round-crowd-ownership-controls
          retention-days: 14
          if-no-files-found: error
