      - name: Admit actual fresh units build native and retained controls scope
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          const out='rarity-round-crowd-ownership-full',env=process.env;
          const bytes=file=>fs.readFileSync(out+'/'+file),read=file=>JSON.parse(bytes(file));
          const sha=value=>createHash('sha256').update(value).digest('hex');
          const source=read('source-join.json'),custody=read('packet-custody.json'),unit=read('unit-admission.json'),raw=read('fixed-raw-join.json'),native=read('native-admission.json');
          assert.deepEqual([source.status,source.head,source.trackedRows,source.sourceRows,source.cleanSourceRows,source.rootConfigurations.length,source.heldFixedRows],
            ['passed',env.GITHUB_SHA,5793,4665,4664,11,5791]);
          assert.deepEqual([source.parent,source.fixedHead,source.fixedTree,source.helperBlob],[custody.fixed.head,custody.fixed.head,custody.fixed.tree,env.RARITY_ROUND_HELPER]);
          assert.deepEqual([custody.status,custody.controlsRerun,custody.referenceChecks.status,unit.status,unit.commands,unit.actualCases,unit.actualPasses,unit.actualFailures,unit.wholeQualifiedFixedRAWBytesHeld],
            ['passed',false,'passed','passed',1,unit.actualCases,unit.actualCases,0,true]);
          assert.deepEqual([raw.status,raw.fixedHead,raw.fixedTree,raw.raw,raw.freshUnitRAWByteEqual],['passed',custody.fixed.head,custody.fixed.tree,unit.raw,true]);
          const nativeChecks=(()=>{
          const c=native.census;
          const expected={journeys:3,contexts:3,viewportPNGs:9,oldWhileCurrentPending:2,oldAfterCurrentSettled:1,
            roundsRevealed:6,roundAdvances:3,crowdReads:6,localPickInserts:6,completionAttempts:0,frames:102,actions:30,
            mouseActions:18,keyboardActions:6,typingActions:6,poolReads:6,searchReads:12};
          for(const [key,value] of Object.entries(expected))assert.equal(c[key],value,key);
          assert.deepEqual(native.currentSource,{head:source.head,tree:source.tree,workflow:source.workflowBlob,trackedBodies:5793,
            scopedSourceRows:4665,heldFixedRows:5791,rootConfigurations:11,distBodies:850,installedVersions:521});
          assert.deepEqual(native.holds,{source:true,dist:true,locks:true,installed521:true,offline:true,index:true,fullUnitLiteral:true});
          const rows=native.measured;
          assert.deepEqual(rows.map(row=>[row.width,row.height,row.caseKey,row.schedule]),[
            [320,568,'oldWhileCurrentPending',['a','b']],
            [390,844,'oldAfterCurrentSettled',['b','a']],
            [1280,900,'oldWhileCurrentPending',['a','b']],
          ]);
          const b=[{name:'Fixture B Six',picks:3},{name:'Fixture B Five',picks:2}];
          for(const row of rows){
            const t=row.settled;
            assert.deepEqual([row.frames,row.actions,row.mouseActions,row.keyboardActions,row.typingActions,row.viewportPNGs,
              row.roundsRevealed,row.roundAdvances,row.crowdReads,row.localPickInserts,row.completionAttempts,row.poolReads,row.searchReads],
              [34,10,6,2,2,3,2,1,2,2,0,2,4]);
            assert.deepEqual([t.firstCrowd,t.secondCrowd,t.bPoints,t.bSubtotal],
              [row.caseKey==='oldAfterCurrentSettled'?b:null,b,40,'· Rarity Round score so far: 120']);
            const timeline=[t.aHeldAt,t.bHeldAt,t.firstDeliveryAt,t.firstBodyAt,t.firstFrameAt,t.secondDeliveryAt,t.secondBodyAt,t.secondFrameAt];
            assert(timeline.every((value,index)=>Number.isFinite(value)&&(!index||value>=timeline[index-1])));
          }
          for(const key of ['wheels','navigations','firstPartyResponses','corsPreflights']){
            assert(rows.every(row=>Number.isInteger(row[key])&&row[key]>=0),key);
            assert.equal(c[key],rows.reduce((sum,row)=>sum+row[key],0),key);
          }
          const e=native.evidence;
          for(const [key,file] of Object.entries({report:'report.json',raw:'raw.json',bodyManifest:'body-manifest.json',
            binding:'qualified-input.json',fixture:'fixture.json'})){
            const body=bytes('browser/'+file);
            assert.deepEqual(e[key],{file,bytes:body.length,sha256:sha(body)});
          }
          const manifest=read('browser/body-manifest.json'),binding=read('browser/qualified-input.json');
          assert.deepEqual([manifest.version,manifest.files.length,manifest.filesCount,e.filesCount,manifest.bodyBytes,e.bodyBytes],
            [1,127,127,127,manifest.files.reduce((sum,row)=>sum+row.bytes,0),manifest.files.reduce((sum,row)=>sum+row.bytes,0)]);
          assert.deepEqual([binding.source,binding.page,binding.helper,binding.fullUnit],[native.currentSource,native.page,native.helper,unit.raw]);
          for(const role of ['original','fixed','controls']){
            for(const key of ['run','artifact','head','tree','zipBytes','zipSHA256'])assert.equal(binding[role][key],custody[role][key],role+' '+key);
          }
          return {status:'passed',actualCensus:c,actualViewportRows:rows,localPickInserts:6,completionAttempts:0,wholeFreshUnitHeld:true};
          })();
          assert.equal(nativeChecks?.status,'passed','Reviewed actual native validator must complete');
          assert.deepEqual([native.status,native.route,native.page,native.helper],['passed','/rarity-round',env.RARITY_ROUND_CROWD_OWNERSHIP_PAGE_BLOB,env.RARITY_ROUND_HELPER]);
          const expected='simAdsense,simBrand,simHeadTags,simHiddenPages,simHubs,simIndexNow,simIndexing,simInternalLinks,simNoRivalNames,simPrerender,simPrerenderBoot,simRetiredRoutes,simSchema,simSitemap,simSnapshotAssets,simSiteSearch,simGuideHeadings,simSeoMetaSplit,simHomeCopy,simHarnessAnchors'.split(',').map(name=>name+'.mjs').sort();
          const readers=bytes('readers.log').toString('utf8'),readerRows=[...readers.matchAll(/^\s+PASS\s+(sim[A-Za-z0-9]+\.mjs)/gm)].map(row=>row[1]).sort();
          assert.deepEqual(readerRows,expected);assert(!/^\s+FAIL\s+/m.test(readers));
          const weight=bytes('weight.log').toString('utf8');
          const capRows=[...weight.matchAll(/^\s+(\/\S*)\s+\d+K gz over\s+\d+ files \(budget (\d+)K, [\d.]+K to the tenth\)/gm)].map(row=>[row[1],Number(row[2])]);
          assert.deepEqual(capRows,[['/',245],['/club-manager',648],['/soccer-career',840],['/stadium-tycoon',305],['/wonderkid-factory',278],['/minefield',295],['/footle',354],['/nfl-my-career',499],['/front-office',390],['/soccer-grid',320],['/leaderboard',266],['/manager-hot-seat',672],['/deadline-day',680],['/transfer-path',381],['/nba-front-office',397],['/nhl-front-office',379]]);
          assert(weight.includes('sweepWeight: green.'));
          const tar=bytes('dist.tgz'),distFiles=read('dist-before.json').length;
          assert.equal(distFiles,850);
          const normalized=read('dist-before.json').map(row=>{assert(row.file.startsWith('dist/'));return {path:row.file.slice(5),bytes:row.bytes,sha256:row.sha256};});
          fs.writeFileSync(out+'/admission.json',JSON.stringify({
            status:'passed',qualification:'fresh-rarity-round-crowd-ownership-full-scope',head:source.head,tree:source.tree,page:env.RARITY_ROUND_CROWD_OWNERSHIP_PAGE_BLOB,test:env.RARITY_ROUND_TEST,plan:env.RARITY_ROUND_PLAN,
            helper:env.RARITY_ROUND_HELPER,nativeOuter:env.RARITY_ROUND_OUTER,preflight:custody.preflight,original:custody.original,fixed:custody.fixed,controls:custody.controls,controlsRerun:false,
            unit,unitCommands:1,raw,trackedBodies:source.trackedRows,sourceRows:source.sourceRows,cleanSourceRows:source.cleanSourceRows,rootConfigurations:source.rootConfigurations.length,
            distFiles,distTar:{file:'dist.tgz',bytes:tar.length,sha256:sha(tar)},distTupleSHA256:sha(JSON.stringify(normalized)),
            readers:readerRows.length,readerRows,immutableCaps:capRows.length,capRows,nativeReceipt:native,nativeChecks,referenceChecks:custody.referenceChecks,
            limits:'Fresh fixed units, normal production build, all readers and caps, native Rarity Round and full source holds. Active preflight, original, fixed and controls are retained admitted evidence. No controls rerun or release claim.',
          },null,2)+'\n',{flag:'wx'});
          NODE
      - name: Final physical source index locks versions build and reference holds
        if: always()
        run: |
          set -euo pipefail
          out=rarity-round-crowd-ownership-full
          git ls-files -s > "$out/source-after.txt"
          cmp "$out/source-before.txt" "$out/source-after.txt"
          git diff --exit-code HEAD -- .
          sha256sum package.json package-lock.json > "$out/locks-after.txt"
          cmp "$out/locks-before.txt" "$out/locks-after.txt"
          if [[ -f "$out/dist.sha256" ]]; then sha256sum --check "$out/dist.sha256"; fi
          if [[ -f "$out/native-admission-script.mjs" ]]; then
            test "$(git hash-object "$out/native-admission-script.mjs")" = "$RARITY_ROUND_OUTER"
            test -z "$(git ls-files -- "$out/native-admission-script.mjs")"
          fi
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          import {createHash} from 'node:crypto';
          const out='rarity-round-crowd-ownership-full',read=file=>JSON.parse(fs.readFileSync(out+'/'+file));
          const write=(file,body)=>fs.writeFileSync(out+'/'+file,JSON.stringify(body));
          const sha=bytes=>createHash('sha256').update(bytes).digest('hex');
          const tuple=(file,bytes)=>({file,bytes:bytes.length,sha256:sha(bytes)});
          const tracked=execFileSync('git',['ls-files','-z'],{encoding:'utf8',maxBuffer:16*1024*1024}).split('\0').filter(Boolean);
          const source=tracked.map(file=>tuple(file,fs.readFileSync(file)));
          assert.equal(source.length,5793);assert.deepEqual(source,read('tracked-before.json'));write('tracked-after.json',source);
          const lock=JSON.parse(fs.readFileSync('package-lock.json'));
          const versions=Object.keys(lock.packages).filter(file=>file.startsWith('node_modules/')&&fs.existsSync(file+'/package.json')).map(file=>[file,JSON.parse(fs.readFileSync(file+'/package.json')).version]);
          assert.equal(versions.length,521);for(const [file,version] of versions)assert.equal(version,lock.packages[file].version,file);
          assert.deepEqual(versions,read('installed-before.json'));write('installed-after.json',versions);
          const offlineBytes=fs.statSync(out+'/offline.log').size;assert.equal(offlineBytes,0);
          const walk=(dir,prefix='')=>fs.readdirSync(dir,{withFileTypes:true}).sort((a,b)=>a.name.localeCompare(b.name)).flatMap(entry=>{
            const file=prefix+entry.name;
            if(entry.isDirectory())return walk(path.join(dir,entry.name),file+'/');
            assert(entry.isFile()&&!entry.isSymbolicLink(),file+' actual regular retained body');return[file];
          });
          let distHeld=false,retainedPacketsHeld=false;
          if(fs.existsSync(out+'/dist-before.json')){
            const dist=walk('dist','dist/').map(file=>tuple(file,fs.readFileSync(file)));
            assert.equal(dist.length,850);assert.deepEqual(dist,read('dist-before.json'));write('dist-after.json',dist);distHeld=true;
          }
          if(fs.existsSync(out+'/packet-custody.json')){
            for(const role of ['preflight','original','fixed','controls']){
              const dir=out+'/'+role+'-reference',before=read(role+'-reference-before.json');
              const after=walk(dir).sort().map(file=>tuple(file,fs.readFileSync(path.join(dir,file))));
              assert.deepEqual(after,before);write(role+'-reference-after.json',after);
            }
            retainedPacketsHeld=true;
          }
          if(fs.existsSync(out+'/admission.json'))assert(distHeld&&retainedPacketsHeld);
          write('final-holds.json',{status:'passed',trackedBodies:source.length,scopedSourceRows:4665,cleanSourceRows:4664,rootConfigurations:11,installedLockedVersions:versions.length,
            indexUnchanged:true,sourceBytesUnchanged:true,locksUnchanged:true,distHeld,retainedPacketsHeld,offlineBytes,
            limits:'Final physical and custody holds. Full admission and completed workflow success are separate.'});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rarity-round-crowd-ownership-full-${{ github.run_id }}
