name: Search navigation fixed qualification

on:
  push:
    branches: [codex/search-navigation]
    paths-ignore: ['docs/**']

permissions:
  contents: read
concurrency:
  group: search-navigation-${{ github.sha }}
  cancel-in-progress: false

env:
  BASE_SOURCE: 0ca8c1fc065f1ca282c9454683dca31911852638
  FIXED_SEARCH_BLOB: 2bcfb9dfc8a540c69bd4d5a59815f48aa0c2565b
  SEARCH_TEST_SHA256: c5fcbc9bc0b721e3e83ff0dcfcacc0162aeb3f3ee0381806de73477f156c6224
  SEARCH_PRIMARY_CASE: 'Search URL navigation ownership clears a pending draft when the real Search games link opens the same URL'
  SEARCH_PRIMARY_PATTERN: '^Search URL navigation ownership clears a pending draft when the real Search games link opens the same URL$'
  SEARCH_PRIMARY_MARKER: SEARCH_SAME_URL_LINK_CLEARS_DRAFT
  CI: '1'
  SIM_NETWORK: offline
  ENGINES: chromium
  TZ: UTC

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 32
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact fixed Search and protected foundation
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/search-navigation"; test ! -e "$out"; mkdir "$out"
          export SEARCH_QUAL_OUT="$out"
          echo "SEARCH_QUAL_OUT=$out" >> "$GITHUB_ENV"
          echo "FREE_KICK_FONT_CACHE=$out/font-cache" >> "$GITHUB_ENV"
          test "$GITHUB_REPOSITORY" = PapiSalgueroM/ballpark-hero
          test "$GITHUB_REPOSITORY_ID" = 1195729679
          test "$GITHUB_REF" = refs/heads/codex/search-navigation
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "${NO_DOUBLE_SWAP:-}"
          git fetch --no-tags --depth=1 origin "$BASE_SOURCE" > "$out/base-fetch.log" 2>&1
          git cat-file -e "$BASE_SOURCE^{commit}"
          git merge-base --is-ancestor "$BASE_SOURCE" "$GITHUB_SHA" > "$out/base-ancestry.log" 2>&1
          git diff --exit-code "$BASE_SOURCE" HEAD -- . ':!docs/**' ':!src/pages/Search.tsx' ':!src/test/Search.navigation.test.tsx' ':!scripts/qa/playSearchNavigation.mjs' ':!.github/workflows/search-navigation.yml' > "$out/protected-source.log"
          for file in package.json package-lock.json vitest.config.ts scripts/lib/offlineTransport.cjs scripts/lib/playwrightLoader.mjs scripts/lib/hostLikeServer.mjs scripts/qa/freeKickLab1070.mjs scripts/sweepWeight.mjs scripts/playHomeFold.mjs scripts/qa/siteMenuNavigationSupport.mjs; do
            git show "$BASE_SOURCE:$file" | cmp "$file" -
          done
          node <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict'),cp=require('node:child_process'),{createHash}=require('node:crypto'),sha=b=>createHash('sha256').update(b).digest('hex');
          assert.match(process.env.FIXED_SEARCH_BLOB||'',/^[a-f0-9]{40}$/,'Actual fixed Search Git blob is mandatory');
          assert.match(process.env.SEARCH_TEST_SHA256||'',/^[a-f0-9]{64}$/,'Final source-reviewed Search test SHA is mandatory');
          const oldBlob='0c79c181d9637c2cadd374d61c00a782163b2f50',currentBlob=cp.execFileSync('git',['hash-object','src/pages/Search.tsx'],{encoding:'utf8'}).trim();
          assert.notEqual(process.env.FIXED_SEARCH_BLOB,oldBlob);assert.equal(currentBlob,process.env.FIXED_SEARCH_BLOB);
          assert.equal(cp.execFileSync('git',['rev-parse',process.env.BASE_SOURCE+':src/pages/Search.tsx'],{encoding:'utf8'}).trim(),oldBlob);
          assert.equal(sha(fs.readFileSync('src/test/Search.navigation.test.tsx')),process.env.SEARCH_TEST_SHA256);
          assert.equal(sha(fs.readFileSync('scripts/qa/playSearchNavigation.mjs')),'17e3ed95a362ac39ce66aa81a658b1ae2126a3cd7e78da1944c18dac314bb24e');
          fs.writeFileSync(process.env.SEARCH_QUAL_OUT+'/source-binding.json',JSON.stringify({source:process.env.GITHUB_SHA,base:process.env.BASE_SOURCE,currentSearchGitBlob:currentBlob,oldSearchGitBlob:oldBlob,testSha256:process.env.SEARCH_TEST_SHA256,applicationQualified:false},null,2)+'\n',{flag:'wx'});
          NODE
          git rev-parse HEAD > "$out/head.txt"
          git ls-files -z | sort -z > "$out/source-members.before"
          git ls-files -z | sort -z | xargs -0 sha256sum > "$out/source-before.sha256"
          git diff --exit-code HEAD > "$out/source-clean-before.log"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Locked installation and isolated browser tools
        timeout-minutes: 10
        run: |
          set -euo pipefail
          out="$SEARCH_QUAL_OUT"
          printf '%s %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" 'setup npm-ci' | tee -a "$out/setup-progress.log"
          npm ci > "$out/install.log" 2>&1
          browser_tools="$RUNNER_TEMP/search-navigation-browser"; test ! -e "$browser_tools"
          printf '%s %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" 'setup playwright-install' | tee -a "$out/setup-progress.log"
          npm install --prefix "$browser_tools" --no-save --package-lock=false playwright@1.64.0 > "$out/browser-install.log" 2>&1
          test ! -e node_modules/playwright; test ! -e node_modules/playwright-core
          ln -s "$browser_tools/node_modules/playwright" node_modules/playwright
          ln -s "$browser_tools/node_modules/playwright-core" node_modules/playwright-core
          printf '%s %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" 'setup chromium-install' | tee -a "$out/setup-progress.log"
          node "$browser_tools/node_modules/playwright/cli.js" install --with-deps chromium > "$out/chromium-install.log" 2>&1
          printf '%s %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" 'setup python-font-tools' | tee -a "$out/setup-progress.log"
          python -m pip install fonttools pillow > "$out/python-install.log" 2>&1
          printf '%s %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" 'setup font-prefetch' | tee -a "$out/setup-progress.log"
          FREE_KICK_FONT_CACHE="$out/font-cache" node scripts/qa/freeKickLab1070.mjs --prefetch-fonts-only > "$out/font-prefetch.log" 2>&1
          manifest_sha=$(sha256sum "$out/font-cache/manifest.json" | cut -d ' ' -f 1)
          echo "FONT_CACHE_MANIFEST_SHA256=$manifest_sha" >> "$GITHUB_ENV"
          printf '%s %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" 'setup inventories' | tee -a "$out/setup-progress.log"
          find node_modules -path node_modules/.vite -prune -o -type f -print0 | sort -z | xargs -0 sha256sum > "$out/dependencies.sha256"
          find "$browser_tools/node_modules" -type f -print0 | sort -z | xargs -0 sha256sum > "$out/browser-tools.sha256"
          find "$out/font-cache" -type f -print0 | sort -z | xargs -0 sha256sum > "$out/font-cache.sha256"
          find node_modules -path node_modules/.vite -prune -o -type f -print0 | sort -z > "$out/dependency-members.before"
          find "$browser_tools/node_modules" -type f -print0 | sort -z > "$out/browser-members.before"
          find "$out/font-cache" -type f -print0 | sort -z > "$out/font-members.before"
          printf '%s %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" 'setup complete' | tee -a "$out/setup-progress.log"
      - name: Actual app types and all seventeen Search and menu cases
        id: tests
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          out="$SEARCH_QUAL_OUT"
          : > "$out/types.transport"; : > "$out/normal-tests.transport"
          SIM_OFFLINE_RECEIPT="$out/types.transport" node_modules/.bin/tsc --noEmit -p tsconfig.app.json > "$out/types.log" 2>&1
          unset NO_DOUBLE_SWAP
          status=0
          SIM_OFFLINE_RECEIPT="$out/normal-tests.transport" timeout --signal=TERM --kill-after=15s 6m node_modules/.bin/vitest run src/test/Search.navigation.test.tsx src/test/SiteMenu.test.tsx src/test/SiteMenu.lazy-loading.test.tsx src/test/SiteMenu.load-failure.test.tsx --maxWorkers=1 --no-file-parallelism --reporter=json --outputFile="$out/normal-tests.json" > "$out/normal-tests.log" 2>&1 || status=$?
          printf '%s\n' "$status" > "$out/normal-tests.exit"
          test "$status" -eq 0
          node <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict'),out=process.env.SEARCH_QUAL_OUT,r=JSON.parse(fs.readFileSync(out+'/normal-tests.json','utf8'));
          assert.equal(r.success,true);assert.equal(r.testResults.length,4);assert.equal(r.numTotalTests,17);assert.equal(r.numPassedTests,17);assert.equal(r.numFailedTests,0);assert.equal(r.numPendingTests,0);assert.equal(r.numTodoTests,0);
          for(const [name,count]of [['Search.navigation.test.tsx',9],['SiteMenu.test.tsx',6],['SiteMenu.lazy-loading.test.tsx',1],['SiteMenu.load-failure.test.tsx',1]]){const suites=r.testResults.filter(x=>x.name.replaceAll('\\','/').endsWith('/'+name));assert.equal(suites.length,1);assert.equal(suites[0].status,'passed');assert.equal(suites[0].assertionResults.length,count);assert(suites[0].assertionResults.every(x=>x.status==='passed'&&x.failureMessages.length===0));}
          for(const k of ['numRuntimeErrorTestSuites','numUnhandledErrors'])if(k in r)assert.equal(r[k],0);if('unhandledErrors'in r)assert.deepEqual(r.unhandledErrors,[]);
          assert.doesNotMatch(fs.readFileSync(out+'/normal-tests.log','utf8'),/Unhandled\s+(?:Errors?|Rejections?)|Uncaught\s+Exceptions?/i);
          NODE
          test ! -s "$out/types.transport"; test ! -s "$out/normal-tests.transport"
      - name: Exact current copy old Search failure and healthy restoration
        id: controls
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          test -z "${NO_DOUBLE_SWAP:-}"
          node <<'NODE'
          const fs=require('node:fs'),path=require('node:path'),assert=require('node:assert/strict'),{createHash}=require('node:crypto'),{spawnSync,execFileSync}=require('node:child_process');
          const out=process.env.SEARCH_QUAL_OUT,hash=b=>createHash('sha256').update(b).digest('hex'),target='src/pages/Search.tsx',file='src/test/Search.navigation.test.tsx',original=fs.readFileSync(target),old=execFileSync('git',['show',process.env.BASE_SOURCE+':'+target]),root=path.join(process.cwd(),'.sim-control/search-navigation');
          assert(!process.env.NO_DOUBLE_SWAP);assert(!fs.existsSync(root));assert(!original.equals(old),'The whole old Search source must actually differ');
          const blob=p=>execFileSync('git',['hash-object',p],{encoding:'utf8'}).trim();assert.equal(blob(target),process.env.FIXED_SEARCH_BLOB);
          const copies={};for(const [id,bytes]of [['healthy',original],['old',old]]){const dir=path.join(root,id);fs.mkdirSync(dir,{recursive:true});const copy=path.join(dir,'Search.tsx');fs.writeFileSync(copy,bytes,{flag:'wx'});assert(fs.readFileSync(copy).equals(bytes));copies[id]={file:copy,sha256:hash(bytes),bytes:bytes.length,gitBlob:blob(copy)};}
          assert.equal(copies.healthy.gitBlob,process.env.FIXED_SEARCH_BLOB);assert.equal(copies.old.gitBlob,'0c79c181d9637c2cadd374d61c00a782163b2f50');
          fs.writeFileSync(path.join(root,'copy-bindings.json'),JSON.stringify({source:process.env.GITHUB_SHA,base:process.env.BASE_SOURCE,alias:'@/pages/Search',importAdapter:null,copies,wholeCopiesExact:true,applicationSourceUntouched:true},null,2)+'\n',{flag:'wx'});
          function run(label,copy,primary){const base=path.join(out,label),env={...process.env,SIM_OFFLINE_RECEIPT:base+'.transport'};fs.writeFileSync(env.SIM_OFFLINE_RECEIPT,'',{flag:'wx'});if(copy)env.NO_DOUBLE_SWAP=JSON.stringify({'@/pages/Search':copy});else delete env.NO_DOUBLE_SWAP;
            const args=['node_modules/vitest/vitest.mjs','run',file,'--maxWorkers=1','--no-file-parallelism','--reporter=json','--outputFile='+base+'.json'];if(primary)args.push('--testNamePattern',process.env.SEARCH_PRIMARY_PATTERN);
            const result=spawnSync(process.execPath,args,{env,encoding:'utf8',timeout:240000,maxBuffer:16*1024*1024}),log=(result.stdout||'')+(result.stderr||'');fs.writeFileSync(base+'.log',log,{flag:'wx'});fs.writeFileSync(base+'.exit.json',JSON.stringify({status:result.status,signal:result.signal,error:result.error?String(result.error):null},null,2)+'\n',{flag:'wx'});
            assert.equal(result.error,undefined,label);assert.equal(result.signal,null,label);assert.equal(fs.statSync(env.SIM_OFFLINE_RECEIPT).size,0,label+' transport');
            const r=JSON.parse(fs.readFileSync(base+'.json','utf8'));assert.equal(r.testResults.length,1,label);assert.equal(r.numTotalTests,9,label);assert.equal(r.numTodoTests,0,label);const suite=r.testResults[0],rows=suite.assertionResults;assert(suite.name.replaceAll('\\','/').endsWith('/src/test/Search.navigation.test.tsx'));assert.equal(rows.length,9,label);assert.equal(new Set(rows.map(x=>x.fullName)).size,9,label);
            const observedErrors={};for(const k of ['numRuntimeErrorTestSuites','numUnhandledErrors'])if(k in r){assert.equal(r[k],0,label);observedErrors[k]=r[k];}if('unhandledErrors'in r){assert.deepEqual(r.unhandledErrors,[],label);observedErrors.unhandledErrors=r.unhandledErrors;}
            assert.doesNotMatch(log,/Unhandled\s+(?:Errors?|Rejections?)|Uncaught\s+Exceptions?|Cannot find (?:module|package)|Failed to resolve import|SyntaxError:|ReferenceError:|TypeError:/i,label);return{result,r,suite,rows,observedErrors};}
          function healthy(label,copy){const v=run(label,copy,false);assert.equal(v.result.status,0,label);assert.equal(v.r.success,true,label);assert.equal(v.suite.status,'passed',label);assert.equal(v.r.numPassedTests,9,label);assert.equal(v.r.numFailedTests,0,label);assert.equal(v.r.numPendingTests,0,label);assert(v.rows.every(x=>x.status==='passed'&&x.failureMessages.length===0),label);return v;}
          healthy('healthy-copy',copies.healthy.file);
          const failed=run('old-copy',copies.old.file,true);assert.equal(failed.result.status,1);assert.equal(failed.r.success,false);assert.equal(failed.suite.status,'failed');assert.equal(failed.r.numPassedTests,0);assert.equal(failed.r.numFailedTests,1);assert.equal(failed.r.numPendingTests,8);
          const owned=failed.rows.filter(x=>x.fullName===process.env.SEARCH_PRIMARY_CASE);assert.equal(owned.length,1);assert.equal(owned[0].status,'failed');assert.equal(owned[0].failureMessages.length,1);const message=owned[0].failureMessages[0];assert.match(message,/\bAssertionError\b/);assert(message.includes(process.env.SEARCH_PRIMARY_MARKER),'Only the actual Search owned assertion qualifies');assert.doesNotMatch(message,/Cannot find (?:module|package)|Failed to resolve import|SyntaxError|ReferenceError|TypeError|TestingLibraryElementError|Unable to find|Found multiple|Test timed out|Unhandled/i);assert(failed.rows.filter(x=>x!==owned[0]).every(x=>x.status==='pending'||x.status==='skipped'));
          healthy('restored-source',null);
          assert(!process.env.NO_DOUBLE_SWAP);assert(fs.readFileSync(target).equals(original));assert.equal(blob(target),process.env.FIXED_SEARCH_BLOB);for(const row of Object.values(copies)){assert.equal(hash(fs.readFileSync(row.file)),row.sha256);assert.equal(blob(row.file),row.gitBlob);}
          fs.cpSync(root,path.join(out,'copied-source-evidence'),{recursive:true,errorOnExist:true,force:false});
          fs.writeFileSync(out+'/search-copy-controls.json',JSON.stringify({complete:true,source:process.env.GITHUB_SHA,currentCopy:{exit:0,passed:9},oldCopy:{exit:1,ownedFailed:1,unrun:8,case:owned[0].fullName,marker:process.env.SEARCH_PRIMARY_MARKER,observedErrors:failed.observedErrors},restoredSource:{exit:0,passed:9},copies,applicationSourceHeld:true,aliasEnvironmentHeld:true},null,2)+'\n',{flag:'wx'});
          NODE
      - name: Serial plain production build
        id: build
        run: |
          set -euo pipefail
          out="$SEARCH_QUAL_OUT"
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          : > "$out/build.transport"
          SIM_OFFLINE_RECEIPT="$out/build.transport" npm run build > "$out/build.log" 2>&1
          test ! -s "$out/build.transport"
          find dist ! -type d ! -type f -print > "$out/dist-nonregular.txt"; test ! -s "$out/dist-nonregular.txt"
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > "$out/dist.sha256"
          find dist -type f -print0 | sort -z > "$out/dist-members.before"
          tar -cf "$out/dist.tar" -C dist .
      - name: Real built Search navigation journeys
        id: browser
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          out="$SEARCH_QUAL_OUT"
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          : > "$out/search-server.transport"; : > "$out/search-browser.transport"
          SIM_OFFLINE_RECEIPT="$out/search-server.transport" node scripts/lib/hostLikeServer.mjs dist 4173 > "$out/search-server.log" 2>&1 &
          server=$!;trap 'kill "$server" 2>/dev/null || true' EXIT
          ready=0;for attempt in 1 2 3 4 5;do if curl --fail --silent http://127.0.0.1:4173/ > /dev/null;then ready=1;break;fi;sleep 1;done;test "$ready" -eq 1
          status=0
          BASE=http://127.0.0.1:4173 SOURCE_SHA="$GITHUB_SHA" SEARCH_NAV_OUT="$out/search-navigation-browser" SIM_OFFLINE_RECEIPT="$out/search-browser.transport" timeout --signal=TERM --kill-after=15s 8m node scripts/qa/playSearchNavigation.mjs > "$out/search-browser.log" 2>&1 || status=$?
          printf '%s\n' "$status" > "$out/search-browser.exit"; test "$status" -eq 0
          node <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict'),r=JSON.parse(fs.readFileSync(process.env.SEARCH_QUAL_OUT+'/search-navigation-browser/report.json','utf8'));
          assert.equal(r.source,process.env.GITHUB_SHA);assert.equal(r.complete,true);assert.equal(r.status,'SEARCH_NAVIGATION_BROWSER_COMPLETE');assert.equal(r.plannedContexts,2);assert.equal(r.plannedJourneys,8);assert.equal(r.actual.contexts,2);assert.equal(r.actual.completeContexts,2);assert.equal(r.actual.journeys,8);assert.equal(r.actual.completeJourneys,8);assert.equal(r.actual.screenshots,8);assert.equal(r.controls.length,8);assert.equal(r.holds.unchanged,true);assert.deepEqual(r.errors,[]);
          NODE
          test ! -s "$out/search-server.transport";test ! -s "$out/search-browser.transport"
      - name: Unchanged HomeFold oracle and all eighteen built-site readers
        id: readers
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          out="$SEARCH_QUAL_OUT"
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          : > "$out/readers-server.transport"
          SIM_OFFLINE_RECEIPT="$out/readers-server.transport" node scripts/lib/hostLikeServer.mjs dist 4173 > "$out/readers-server.log" 2>&1 &
          server=$!;trap 'kill "$server" 2>/dev/null || true' EXIT
          ready=0;for attempt in 1 2 3 4 5;do if curl --fail --silent http://127.0.0.1:4173/ > /dev/null;then ready=1;break;fi;sleep 1;done;test "$ready" -eq 1
          : > "$out/homefold.transport"; status=0
          BASE=http://127.0.0.1:4173 SIM_OFFLINE_RECEIPT="$out/homefold.transport" timeout --signal=TERM --kill-after=15s 4m node scripts/playHomeFold.mjs > "$out/homefold.log" 2>&1 || status=$?
          printf '%s\n' "$status" > "$out/homefold.exit";failed=0;test "$status" -eq 0 || failed=1
          for method in simAdsense simBrand simHeadTags simHiddenPages simHubs simIndexNow simIndexing simInternalLinks simNoRivalNames simPrerender simPrerenderBoot simRetiredRoutes simSchema simSitemap simSnapshotAssets simSiteSearch simGuideHeadings simLegalPages;do
            : > "$out/$method.transport";status=0;SIM_OFFLINE_RECEIPT="$out/$method.transport" BASE=http://127.0.0.1:4173 SWEEP_BASE=http://127.0.0.1:4173 timeout --signal=TERM --kill-after=15s 3m node "scripts/$method.mjs" > "$out/$method.log" 2>&1 || status=$?
            printf '%s\t%s\n' "$method" "$status" >> "$out/readers.tsv";test "$status" -eq 0 || failed=1;test ! -s "$out/$method.transport" || failed=1
          done
          test "$(wc -l < "$out/readers.tsv")" -eq 18
          test ! -s "$out/readers-server.transport" || failed=1;test ! -s "$out/homefold.transport" || failed=1
          exit "$failed"
      - name: All fifteen current unchanged fatal page caps
        id: caps
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          out="$SEARCH_QUAL_OUT"
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          node <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict'),{createHash}=require('node:crypto'),sha=b=>createHash('sha256').update(b).digest('hex');
          const original="'use strict';\nconst fs = require('node:fs');\nconst path = require('node:path');\nconst assert = require('node:assert/strict');\nconst { createHash } = require('node:crypto');\nconst hash = value => createHash('sha256').update(value).digest('hex');\nif (path.basename(process.argv[1] || '') === 'prerender.mjs') {\n  const cache = process.env.FREE_KICK_FONT_CACHE;\n  const manifestBytes = fs.readFileSync(path.join(cache, 'manifest.json'));\n  assert.match(process.env.FONT_CACHE_MANIFEST_SHA256 || '', /^[a-f0-9]{64}$/);\n  assert.equal(hash(manifestBytes), process.env.FONT_CACHE_MANIFEST_SHA256, 'Prepared font manifest stays exact');\n  const sheet = [...fs.readFileSync('index.html', 'utf8').matchAll(/<link\\s+href=\"(https:\\/\\/fonts\\.googleapis\\.com\\/[^\\\"]+)\"\\s+rel=\"stylesheet\"/g)].map(m => new URL(m[1]).href);\n  assert.equal(sheet.length, 1, 'Use the actual single template stylesheet');\n  const entries = JSON.parse(manifestBytes);\n  assert(Array.isArray(entries) && entries.length > 1);\n  const fonts = new Map();\n  for (const entry of entries) {\n    assert(!fonts.has(entry.url), 'No duplicate font cache URL');\n    const url = new URL(entry.url);\n    assert(['https://fonts.googleapis.com', 'https://fonts.gstatic.com'].includes(url.origin));\n    assert.equal(url.href, entry.url);\n    assert.equal(entry.file, hash(entry.url));\n    assert.match(entry.sha256, /^[a-f0-9]{64}$/);\n    assert.equal(typeof entry.contentType, 'string');\n    const body = fs.readFileSync(path.join(cache, entry.file));\n    assert.equal(hash(body), entry.sha256, 'Prepared font body stays exact');\n    fonts.set(entry.url, { ...entry, body });\n  }\n  assert(fonts.has(sheet[0]), 'Current template stylesheet is cached');\n  const css = fonts.get(sheet[0]);\n  assert.match(css.contentType, /^text\\/css(?:;|$)/);\n  const declared = [...new Set([...css.body.toString('utf8').matchAll(/url\\(\\s*['\"]?(https:\\/\\/[^)'\"\\s]+)/g)].map(m => m[1]))];\n  as