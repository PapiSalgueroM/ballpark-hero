      - name: Always retain complete source dependency font dist and transport holds
        if: always()
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/search-navigation";mkdir -p "$out";failed=0
          for manifest in source-before dependencies browser-tools font-cache;do
            if test -f "$out/$manifest.sha256";then sha256sum --check "$out/$manifest.sha256" > "$out/final-$manifest-hold.log" 2>&1 || failed=1;else failed=1;fi
          done
          git ls-files -z | sort -z > "$out/source-members.after";cmp "$out/source-members.before" "$out/source-members.after" || failed=1
          git diff --exit-code HEAD > "$out/final-source-diff.log" || failed=1
          git status --porcelain --untracked-files=all > "$out/final-status.txt";test ! -s "$out/final-status.txt" || failed=1
          if test -f "$out/dependency-members.before";then find node_modules -path node_modules/.vite -prune -o -type f -print0 | sort -z > "$out/dependency-members.after";cmp "$out/dependency-members.before" "$out/dependency-members.after" || failed=1;fi
          if test -f "$out/browser-members.before";then find "$RUNNER_TEMP/search-navigation-browser/node_modules" -type f -print0 | sort -z > "$out/browser-members.after";cmp "$out/browser-members.before" "$out/browser-members.after" || failed=1;fi
          if test -f "$out/font-members.before";then find "$out/font-cache" -type f -print0 | sort -z > "$out/font-members.after";cmp "$out/font-members.before" "$out/font-members.after" || failed=1;fi
          if test -f "$out/weights-preload-binding.json";then node -e 'const f=require("node:fs"),a=require("node:assert/strict"),h=require("node:crypto").createHash("sha256").update(f.readFileSync(process.env.SEARCH_QUAL_OUT+"/weights-cached-fonts.cjs")).digest("hex");a.equal(h,JSON.parse(f.readFileSync(process.env.SEARCH_QUAL_OUT+"/weights-preload-binding.json")).copySha256)' > "$out/final-weights-preload-hold.log" 2>&1 || failed=1;fi
          if test -f "$out/dist.sha256";then
            find dist ! -type d ! -type f -print > "$out/dist-nonregular.after";test ! -s "$out/dist-nonregular.after" || failed=1
            sha256sum --check "$out/dist.sha256" > "$out/final-dist-hold.log" 2>&1 || failed=1
            find dist -type f -print0 | sort -z > "$out/dist-members.after";cmp "$out/dist-members.before" "$out/dist-members.after" || failed=1
          fi
          while IFS= read -r -d '' file;do test ! -s "$file" || failed=1;done < <(find "$out" -type f -name '*.transport' -print0)
          if test -d .sim-control/search-navigation && test ! -e "$out/copied-source-evidence";then cp -a .sim-control/search-navigation "$out/copied-source-evidence" || failed=1;fi
          printf 'source=%s\ntests=%s\ncontrols=%s\nbuild=%s\nbrowser=%s\nreaders=%s\ncaps=%s\nfinalHoldsExit=%s\n' "$GITHUB_SHA" '${{ steps.tests.outcome }}' '${{ steps.controls.outcome }}' '${{ steps.build.outcome }}' '${{ steps.browser.outcome }}' '${{ steps.readers.outcome }}' '${{ steps.caps.outcome }}' "$failed" > "$out/stages.txt"
