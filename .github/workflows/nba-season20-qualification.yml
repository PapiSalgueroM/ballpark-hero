name: NBA season twenty saved board contracts
on:
  push:
    branches: [codex/nba-season20-qualification-20261026]
permissions:
  contents: read
concurrency:
  group: nba-season20-${{ github.ref }}
  cancel-in-progress: false
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: true
      SIM_NETWORK: offline
      NBA20_PHASE: saved-board-contracts
      EXPECTED_PARENT: cdf8c797960f9c66e8f4e5fe874ba8fa7c76305c
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Bind detached test source and hold every product path
        id: foundation
        timeout-minutes: 5
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/nba-season20-contracts"
          test ! -e "$out";test ! -L "$out";mkdir "$out"
          export NBA20_OUT="$out";echo "NBA20_OUT=$out" >> "$GITHUB_ENV"
          shadow="$RUNNER_TEMP/nba-season20-source-shadow"
          test ! -e "$shadow";test ! -L "$shadow"
          export NBA20_SHADOW="$shadow";echo "NBA20_SHADOW=$shadow" >> "$GITHUB_ENV"
          for name in SIM_SEED BYXI_CONTROL BYXI_SEED BYXI_PRINT_DIGEST NODE_OPTIONS NODE_PATH VITEST ONLY BROWSER TYCOON_AWAY_CONTROL COMPLETION_HOOK OWNED_TIMEOUTS_HOOK CONQUEST_NBA_HOOK CONQUEST_NBA_BOARD POLL_FIXTURES US_BOARD_CONTROL_ALIAS US_BOARD_CONTROL_FILE DAILY_RECORD_CONTROL TYCOON_ROOMS_PAGE TYCOON_LOADS_STADIUM_HOOK TYCOON_LOADS_ACADEMY_HOOK TYCOON_LOADS_STADIUM_LIB TYCOON_LOADS_ACADEMY_LIB TYCOON_PITCH_COMPONENT TYCOON_PACKS_REWARDS TYCOON_PACKS_PANEL NO_DOUBLE_SWAP;do test ! -v "$name";done
          test "$GITHUB_REPOSITORY" = PapiSalgueroM/ballpark-hero
          test "$GITHUB_REPOSITORY_ID" = 1195729679
          test "$GITHUB_REF" = refs/heads/codex/nba-season20-qualification-20261026
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git show -s --format=%P HEAD)" = "$EXPECTED_PARENT"
          test "$(git rev-parse "$EXPECTED_PARENT^{tree}")" = e074f907f51661a7fa4f0f5dc25c155e74f96e45
          git diff --name-status "$EXPECTED_PARENT" HEAD > "$out/direct-paths.txt"
          printf 'M\t.github/workflows/nba-season20-qualification.yml\nM\tdocs/PROJECT-STATE.md\nM\tsrc/test/usCareerMarketBoard.test.tsx\n' | cmp - "$out/direct-paths.txt"
          git diff --exit-code "$EXPECTED_PARENT" HEAD -- . ':!.github/workflows/nba-season20-qualification.yml' ':!docs/PROJECT-STATE.md' ':!src/test/usCareerMarketBoard.test.tsx' > "$out/all-other-parent-source-held.log"
          test "$(git rev-parse 'b20ec6664df9d4c58d63ea0596791d33b2a3b8fc^{tree}')" = 51e0c6a06a6c4fb7d143b4d408eb5a9437737553
          git diff --name-status b20ec6664df9d4c58d63ea0596791d33b2a3b8fc HEAD > "$out/cumulative-paths.txt"
          printf 'A\t.github/workflows/nba-season20-qualification.yml\nM\tdocs/PROJECT-STATE.md\nM\tsrc/test/usCareerMarketBoard.test.tsx\n' | cmp - "$out/cumulative-paths.txt"
          git diff --exit-code b20ec6664df9d4c58d63ea0596791d33b2a3b8fc HEAD -- . ':!.github/workflows/nba-season20-qualification.yml' ':!docs/PROJECT-STATE.md' ':!src/test/usCareerMarketBoard.test.tsx' > "$out/all-other-base-source-held.log"
          git ls-tree -r --name-only "$EXPECTED_PARENT" > "$out/parent-members.txt"
          test "$(wc -l < "$out/parent-members.txt")" -eq 5379
          git rev-parse HEAD > "$out/head.txt";git rev-parse 'HEAD^{tree}' > "$out/tree.txt"
          git ls-files -z | sort -z > "$out/source-members.before"
          test "$(tr -cd '\000' < "$out/source-members.before" | wc -c)" -eq 5379
          xargs -0 sha256sum < "$out/source-members.before" > "$out/source.sha256"
          git status --porcelain --untracked-files=all > "$out/status-before.txt";test ! -s "$out/status-before.txt"
          git diff --exit-code HEAD > "$out/source-clean-before.log"
          git archive --format=tar HEAD > "$out/source.tar"
          printf 'e60ff1534307e449ccef598e3b7470dcba58681b82cea4005cec7319f14f9221  scripts/lib/offlineTransport.cjs\n' | sha256sum -c - > "$out/guard-before.log"
