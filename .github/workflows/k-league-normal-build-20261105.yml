          run_gate simNbaHistoricalDraft env NBA_HISTORICAL_DRAFT_OUT="$QA_OUT/nba-permanent" node scripts/simNbaHistoricalDraft.mjs
          grep -F 'NBA historical draft: 5 cases passed; copied missing-selection control rejected by 4 business assertions; original source held.' "$QA_OUT/logs/simNbaHistoricalDraft.log"
          test ! -s "$QA_OUT/transport/server.log"
      - name: Record the one fresh K League product completed output
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import crypto from 'node:crypto';import assert from 'node:assert/strict';
          const out=process.env.QA_OUT,tar=fs.readFileSync(out+'/completed-dist.tar.gz'),dist=fs.readFileSync(out+'/dist-before.sha256');
