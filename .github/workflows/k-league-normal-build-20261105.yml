      - name: Unchanged default NBA career harness, any native red remains unwaived
        run: |
          set +e
          set -uo pipefail
          export GIT_NO_LAZY_FETCH=1
          export NODE_OPTIONS="--require=$GITHUB_WORKSPACE/scripts/lib/offlineTransport.cjs"
          export SIM_OFFLINE_RECEIPT="$QA_OUT/transport/simNbaCareer.log"
