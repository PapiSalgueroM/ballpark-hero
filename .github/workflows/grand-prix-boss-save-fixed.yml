name: Grand Prix Boss durable save verification
on:
  push:
    branches: [codex/grand-prix-boss-save-fixed-20261102]
permissions:
  contents: read
jobs:
  persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: '1'
      SIM_NETWORK: offline
      GP_BOSS_SAVE_OUT: ${{ github.workspace }}/grand-prix-save-artifacts/cases
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Bind hook and held engine helpers tests and packages
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/codex/grand-prix-boss-save-fixed-20261102
          out="$PWD/grand-prix-save-artifacts"
          mkdir "$out"
          git rev-parse HEAD HEAD^{tree} > "$out/head-tree.txt"
          git ls-files -z > "$out/source-members.before"
          git ls-files -z | xargs -0 sha256sum > "$out/source.sha256"
          printf 'b2024f84b91cec4d263772b906b8adeb6903c0a2e5eef5ab3bf878b5b9484298  src/hooks/useGrandPrixBoss.ts\necbb186a01b277a69374a38e0db92c266ca1219fb7d671b416da4bcd28657939  scripts/simGrandPrixBossSave.mjs\nc31a6b2851fdb0e05094b6ef02802312a4de8225627de8acc1f3515e22c37177  src/test/grandPrixBossSave.test.tsx\nec793e9cacb47bf770d599b1677f76ac753d2cafde9c1f85e6bb0cf7dc7bc69b  src/lib/grandPrixBoss.ts\n' | sha256sum -c -
          git diff --exit-code cc9a55a2f35b6215d5e6e664cc401d10d7f76291 -- src/lib/saveFence.ts src/hooks/useSaveFenceWatch.ts src/lib/completions.ts src/lib/keyedRng.ts src/App.tsx src/data/gameRegistry.ts src/integrations/supabase/client.ts package.json package-lock.json vitest.config.ts src/test/setup.ts
          cat > "$out/capture.sh" <<'CAPTURE'
          capture() {
            local tag="$1"; shift
            local out="$PWD/grand-prix-save-artifacts"
            test ! -e "$out/$tag.exit"
            printf '%s\0' "$@" > "$out/$tag.argv"
            : > "$out/$tag.transport"
            set +e
            SIM_OFFLINE_RECEIPT="$out/$tag.transport" "$@" > "$out/$tag.stdout" 2> "$out/$tag.stderr"
            local status=$?
            set -e
            printf '%s\n' "$status" > "$out/$tag.exit"
            tail -n 15 "$out/$tag.stdout"; tail -n 15 "$out/$tag.stderr"
            test ! -s "$out/$tag.transport" || return 1
            return "$status"
          }
          CAPTURE
          source "$out/capture.sh"
          capture install env NODE_OPTIONS='' npm ci
          find node_modules -path node_modules/.vite -prune -o -type f -print0 | sort -z | xargs -0 sha256sum > "$out/dependency-files.sha256"
      - name: Actual types healthy hook physical source faults and restoration
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          unset GP_BOSS_HOOK_FILE GP_BOSS_ENGINE_FILE US_BOARD_CONTROL_ALIAS US_BOARD_CONTROL_FILE NO_DOUBLE_SWAP
          source grand-prix-save-artifacts/capture.sh
          capture types node_modules/.bin/tsc --noEmit -p tsconfig.app.json
          capture wrapper-syntax node --check scripts/simGrandPrixBossSave.mjs
          capture hook-controls node scripts/simGrandPrixBossSave.mjs
      - name: Retain all source dependencies and membership
        if: always()
        run: |
          set -euo pipefail
          out="$PWD/grand-prix-save-artifacts"
          sha256sum -c "$out/source.sha256" > "$out/source-hold.log"
          if test -f "$out/dependency-files.sha256"; then sha256sum -c "$out/dependency-files.sha256" > "$out/dependency-hold.log"; fi
          git ls-files -z > "$out/source-members.after"; cmp "$out/source-members.before" "$out/source-members.after"
          git diff --exit-code HEAD > "$out/working-source-hold.log"
          git ls-files --others --exclude-standard > "$out/untracked.txt"; test ! -s "$out/untracked.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grand-prix-save-fixed-${{ github.run_id }}
          path: grand-prix-save-artifacts/
          retention-days: 14
