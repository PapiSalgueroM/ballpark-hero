              assert.equal(report.status, 'pass');
              assert.deepEqual(report.errors, []);
              const url = new URL(report.route);
              assert.equal(url.protocol, 'http:');
              assert(['127.0.0.1', 'localhost', '[::1]'].includes(url.hostname));
              assert.equal(url.href, url.origin + '/perfect-season-nba');

              const widths = [320, 390, 1280];
              const heights = [740, 900, 1000];
              const cases = ['before', 'crossover', 'after'];
              const slots = ['PG', 'SG', 'SF', 'PF', 'C', 'SIXTH'];
              const mountDays = ['2026-11-09', '2026-11-09', '2026-11-10'];
              const entryDays = ['2026-11-09', '2026-11-10', '2026-11-10'];
              const mountInstants = ['2026-11-10T04:59:40.000Z', '2026-11-10T04:59:40.000Z', '2026-11-10T05:00:01.000Z'];
              const entryInstants = ['2026-11-10T04:59:40.000Z', '2026-11-10T05:00:01.000Z', '2026-11-10T05:00:01.000Z'];
              const ordinals = [[51, 76, 74, 106, 103, 64], [70, 93, 135, 149, 121, 76]];
              assert.deepEqual(report.widths, widths);
              assert.deepEqual(report.cases.map(row => row.id), widths.flatMap(width => cases.map(id => width + '-' + id)));

              const fixture = JSON.parse(readRef(report.fixture, 'fictional-archive.json'));
              assert.deepEqual([fixture.priorOrdinals, fixture.nextOrdinals], ordinals);
              const entryAt = (prefix, start, index) => {
                const year = start + index % 8;
                return { team: prefix + String(index).padStart(3, '0'), season: year + '-' + String(year + 1).slice(-2) };
              };
              const entries = Array.from({ length: 300 }, (_, index) => index < 150
                ? entryAt('FXM', 2015, index)
                : entryAt('FXD', 2000, index - 150));
              assert.deepEqual(fixture.entries, entries);
              const playerName = (team, slot) => 'Daily Native Fixture ' + team + ' ' + slot;
              assert.deepEqual(fixture.rawRows, entries.flatMap(({ team, season }, index) =>
                ['PG', 'SG', 'SF', 'PF', 'C', 'PG', 'SG'].map((position, i) => ({
                  id: 2100 - index * 7 - i, team, season, player_name: playerName(team, slots[i] ?? 'Reserve'),
                  position, minutes: 2000 - i * 10, pts: 800, trb: 400, ast: 300,
                }))));
              assert.equal(report.builtDocument.distFile, 'dist/perfect-season-nba/index.html');
              assert(readRef(report.builtDocument, 'built-document.html').equals(fs.readFileSync(path.join(env.NBA_PERFECT_SEASON_DAILY_DATE_REFERENCE_DIST, report.builtDocument.distFile.slice(5)))));

              const nonces = new Set();
              const totals = { documents: 0, index: 0, squad: 0, completion: 0, images: 0 };
              const allActions = new Set(['aborted', 'local-preflight', 'local-index', 'local-squad', 'local-empty-read', 'local-write-acknowledgement']);
              for (const row of report.cases) {
                const widthIndex = widths.indexOf(row.width);
                const caseIndex = cases.indexOf(row.journey);
                assert(widthIndex >= 0 && caseIndex >= 0);
                assert.equal(row.id, row.width + '-' + row.journey);
                assert.equal(row.height, heights[widthIndex]);
                assert.equal(row.touch, widthIndex !== 2);
                assert.equal(row.status, 'pass');
                assert.deepEqual(row.pageErrors, []);
                assert.deepEqual(row.routeErrors, []);
                const expectedDocument = {
                  url: url.href, method: 'GET', resourceType: 'document', navigationRequest: true, mainFrame: true, redirectedFrom: null,
                };
                assert.deepEqual(row.documents, [expectedDocument]);
                assert.deepEqual(row.documentInterceptions, [expectedDocument]);
                assert(row.frameEvents.every(value => typeof value === 'string'));
                assert.deepEqual(row.served, {
                  url: url.href, status: 200, request: expectedDocument, redirectedTo: null, locationHeader: null,
                  contentType: 'text/html; charset=utf-8', ...report.builtDocument,
                });
                totals.documents++;

                const [mountedDay, enteredDay] = [mountDays[caseIndex], entryDays[caseIndex]];
                assert.match(row.mount.nonce, /^[a-f0-9-]{36}$/);
                assert(!nonces.has(row.mount.nonce));
                nonces.add(row.mount.nonce);
                for (const [when, day, instant] of [
                  [row.mount, mountedDay, mountInstants[caseIndex]],
                  [row.entry, enteredDay, entryInstants[caseIndex]],
                  [row.finish, enteredDay, entryInstants[caseIndex]],
                ]) {
                  assert.deepEqual([when.eastern, when.instant], [day, instant]);
                  assert.equal(when.url, url.href);
                  assert.equal(when.nonce, row.mount.nonce);
                }
                assert.equal(row.archiveRequestsBeforeEntry, 0);
                const after = caseIndex === 2;
                const expectedWheel = ordinals[Number(after)].map(i => entries[(after ? 150 : 0) + i]);
                assert.equal(row.theme, "Today's theme: " + (after ? '2000s Basketball' : 'Three-Point Boom'));
                assert(row.intercepts.every(record => allActions.has(record.action)));
                for (const item of row.intercepts) {
                  const intercepted = new URL(item.url);
                  if (item.action === 'aborted') {
                    assert(intercepted.origin !== url.origin || !['GET', 'HEAD'].includes(item.method));
                    continue;
                  }
                  assert(intercepted.hostname.endsWith('.supabase.co'));
                  if (item.action === 'local-preflight') assert.equal(item.method, 'OPTIONS');
                  if (item.action === 'local-empty-read') assert(['GET', 'HEAD'].includes(item.method));
                  if (item.action === 'local-write-acknowledgement') assert(!['GET', 'HEAD', 'OPTIONS'].includes(item.method));
                  if (item.action === 'local-index' || item.action === 'local-squad') {
                    assert.equal(item.method, 'GET');
                    assert.equal(intercepted.pathname, '/rest/v1/bref_nba_player_seasons');
                  }
                }
                const index = row.intercepts.filter(item => item.action === 'local-index').sort((a, b) => a.start - b.start);
                assert.deepEqual(index.map(({ start, limit, rows }) => [start, limit, rows]),
                  Array.from({ length: 15 }, (_, i) => [i * 1000, 1000, [1000, 1000, 100][i] ?? 0]));
                const squads = row.intercepts.filter(item => item.action === 'local-squad');
                assert.deepEqual(squads.map(({ team, season, rows }) => ({ team, season, rows })),
                  expectedWheel.map(({ team, season }) => ({ team, season, rows: 7 })));
                totals.index += index.length;
                totals.squad += squads.length;

                assert.deepEqual(row.wheel, expectedWheel.map(({ team, season }, i) => ({
                  slot: slots[i], team, season, landing: season + ' ' + team,
                  pickedPlayer: playerName(team, slots[i]), lineupPlayer: i === 5 ? null : playerName(team, slots[i]),
                  assignment: i === 5 ? 'automatic' : 'explicit',
                  slotButtonText: i === 5 ? null : slots[i],
                  nextAction: i === 5 ? 'Skip to result' : null,
                })));
                const otherDay = mountedDay === mountDays[0] ? entryDays[2] : mountDays[0];
                assert.deepEqual(Object.keys(row.saves).sort(), ['2026-11-09', '2026-11-10']);
                assert.equal(row.saves[otherDay], null);
                const saved = row.saves[mountedDay];
                assert.deepEqual([saved.v, saved.date, saved.spins, saved.themeId],
                  [1, mountedDay, 6, after ? 'two-thousands-nba' : 'three-point-boom']);
                assert.deepEqual(saved.teamNames, row.wheel.map(item => item.landing));
                assert.equal(saved.sim.games.length, 82);
                assert(saved.sim.games.every(value => typeof value === 'boolean'));
                assert.equal(saved.sim.wins, saved.sim.games.filter(Boolean).length);
                assert.equal(saved.sim.wins + saved.sim.losses, 82);
                assert.equal(saved.sim.perfect, saved.sim.wins === 82);
                assert.equal(saved.overall, saved.sim.overall);
                assert.equal(row.resultText, saved.sim.wins + '-' + saved.sim.losses);
                assert.equal(row.verdictScore, row.resultText);
                assert(row.resultMeta?.startsWith('Daily · ' + mountedDay + ' ·'));
                assert(row.resultShare?.split('\n').includes('Daily · ' + mountedDay));
                const completions = row.intercepts.filter(item => item.completion);
                assert.equal(completions.length, 1);
                const [completion] = completions;
                assert.equal(completion.action, 'local-write-acknowledgement');
                assert.equal(completion.method, 'POST');
                assert.equal(new URL(completion.url).pathname, '/rest/v1/game_completions');
                assert.deepEqual(completion.completion, { game: 'perfect-season-nba', score: saved.sim.wins });
                totals.completion++;

                for (const geometry of [row.firstWheelLayout, row.resultLayout]) {
                  assert.deepEqual([geometry.width, geometry.height], [row.width, row.height]);
                  assert(geometry.scrollWidth > 0 && geometry.scrollWidth <= row.width + 1);
                  const { x, right, width, height } = geometry.rect;
                  assert([x, right, width, height].every(Number.isFinite));
                  assert(x >= -1 && right <= row.width + 1 && width > 0 && height > 0);
                }
                checkImage(row.firstWheelImage, row.id + '-first-wheel.png');
                checkImage(row.resultImage, row.id + '-result.png');
                totals.images += 2;
              }

              for (const width of widths) {
                const [before, crossed, fresh] = report.cases.filter(row => row.width === width);
                assert.deepEqual(crossed.wheel, before.wheel);
                assert.deepEqual(crossed.saves, before.saves);
                assert.notDeepEqual(fresh.saves[entryDays[2]].sim.games, before.saves[mountDays[0]].sim.games);
              }
              for (const id of cases) {
                const [first, ...rest] = report.cases.filter(row => row.journey === id);
                for (const row of rest) {
                  assert.deepEqual(row.wheel, first.wheel);
                  assert.deepEqual(row.saves, first.saves);
                }
              }
              assert.deepEqual(totals, { documents: 9, index: 135, squad: 54, completion: 9, images: 18 });
              assert.equal(heldBodies.length, 21);
              assert.deepEqual(fs.readdirSync(out).sort(), heldBodies.map(row => row.file).sort());
              return {
                status: 'passed', schema: 'nba-perfect-season-daily-date-native-admission-v4',
                helperSHA, reportSHA: sha(reportBody), route: url.href, cases: report.cases.map(row => row.id),
                totals, offlineBytes: 0, heldBodies,
              };
            })();
            assert.deepEqual(native,retainedNative,'All actual v4 native evidence rejoins its exact original admission');
            assert.equal(native.route,'http://127.0.0.1:4174/perfect-season-nba');
            assert.deepEqual(native.totals,{documents:9,index:135,squad:54,completion:9,images:18});
            return {
              status:'passed',qualification:'fresh-nba-perfect-season-daily-date-full-scope',
              referenceIndependentAuditSHA256:env.NBA_PERFECT_SEASON_DAILY_DATE_REFERENCE_AUDIT,
              exactEvidenceBodies:evidencePins.length,priorRuns:Object.fromEntries(roles.map(role=>[role,custody[role].run])),
              unitCases:6,nativeCases:9,nativeBodies:21,retainedPNGs:18,readers:20,immutableCaps:16,
              fullTracked:5802,fullSource:4670,cleanTracked:5801,cleanSource:4669,cleanSourceAndConfiguration:4680,distFiles:850,
            };
          })();
          assert.equal(referenceChecks.status,'passed','Reviewed actual full receipt validator must complete');
          assert.equal(referenceChecks.qualification,'fresh-nba-perfect-season-daily-date-full-scope');
          const result = {
            status:'passed', cleanHead, cleanTree, cleanProductBase:env.NBA_PERFECT_SEASON_DAILY_DATE_CLEAN_PRODUCT_BASE, cleanProductBaseTree:env.NBA_PERFECT_SEASON_DAILY_DATE_CLEAN_PRODUCT_BASE_TREE,
            cleanDelta, referenceRun:run.id, referenceJob:job.id, referenceWorkflowHead:referenceHead, referenceApp:referenceHead, referenceTree,
            referenceQualification:referenceChecks.qualification, referenceArtifact:meta.id, referenceZipSHA256:env.NBA_PERFECT_SEASON_DAILY_DATE_REFERENCE_ZIP,
            referenceTarSHA256:env.NBA_PERFECT_SEASON_DAILY_DATE_REFERENCE_TAR, referenceWorkflowBlob:env.NBA_PERFECT_SEASON_DAILY_DATE_REFERENCE_WORKFLOW,
            referenceIndependentAuditSHA256:env.NBA_PERFECT_SEASON_DAILY_DATE_REFERENCE_AUDIT, referenceDistTupleSHA256:fullDistTupleSHA256,
            heldProductRows:5800, sourceRows:4669, sourceAndConfigurationRows:sourceConfigRows.length,
            rootConfigurations:configs.map(file => ({file,...current.get(file)})),
            excludedFullQA:[...fullOnly], finalProductForbiddenPaths:[...fullOnly], generatedPatches:[],
            distFiles:actual.length, distManifestSHA256, dist:actual, referenceChecks,
            limits:'Fresh clean types, product-name fence, normal production build and exact source and built-byte join. Separate unit, native, control, reader and cap evidence is retained from the authenticated full reference. The frozen qualified plan is held. Final product excludes the round QA workflow and native helper. Scope is the PR540 stack.',
          };
          fs.writeFileSync(out + '/reference-build-join.json',JSON.stringify(result,null,2));
          console.log('PASS all 4669 source paths, 11 root configurations and 850 built file bodies');
