      - name: Final source locks installed versions and offline holds
        if: always()
        run: |
          set -euo pipefail
          git ls-files -s > nba-perfect-season-daily-date-clean-join/source-after.txt
          cmp nba-perfect-season-daily-date-clean-join/source-before.txt nba-perfect-season-daily-date-clean-join/source-after.txt
          git diff --exit-code HEAD -- .
          sha256sum package.json package-lock.json > nba-perfect-season-daily-date-clean-join/locks-after.txt
          cmp nba-perfect-season-daily-date-clean-join/locks-before.txt nba-perfect-season-daily-date-clean-join/locks-after.txt
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const before=JSON.parse(fs.readFileSync('nba-perfect-season-daily-date-clean-join/installed-before.json')),lock=JSON.parse(fs.readFileSync('package-lock.json'));
          const after=Object.keys(lock.packages).filter(p=>p.startsWith('node_modules/')&&fs.existsSync(p+'/package.json')).map(p=>[p,JSON.parse(fs.readFileSync(p+'/package.json')).version]);assert.equal(after.length,521);for(const[p,v]of after)assert.equal(v,lock.packages[p].version,p);assert.deepEqual(after,before);
          fs.writeFileSync('nba-perfect-season-daily-date-clean-join/installed-final.json',JSON.stringify(after));
          assert(fs.existsSync('nba-perfect-season-daily-date-clean-join/offline.log'));assert.equal(fs.statSync('nba-perfect-season-daily-date-clean-join/offline.log').size,0);
