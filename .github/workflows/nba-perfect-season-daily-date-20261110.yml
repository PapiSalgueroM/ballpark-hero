name: NBA Perfect Season Daily date fixed
on:
  push:
    branches: [codex/nba-perfect-season-daily-date-fixed-draft-width-qa-20261110]
permissions:
  actions: read
  contents: read
jobs:
  fixed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: UTC
      SIM_NETWORK: offline
      SIM_OFFLINE_RECEIPT: nba-perfect-season-daily-date-fixed/offline.log
      NBA_DAILY_DATE_RAW: nba-perfect-season-daily-date-fixed/public-cases.raw.json
      BASE_HEAD: 'a97c23de034006e383349c8bebfedaf72a906346'
      BASE_TREE: '1b3c406cb5d9efd817c3e6241f557b690f4ccc89'
      TEST_BLOB: '7c398ac1ded8cf96d5d0720ca426a2e1fe6ddc92'
      PLAN_BLOB: '2c302ff50b614cbe3d08ee6321a213788e74e793'
      EVIDENCE: nba-perfect-season-daily-date-fixed
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - name: Authenticate admitted original and exact fixed NBA Perfect Season source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test ! -e "$EVIDENCE"
          mkdir "$EVIDENCE"
          touch "$SIM_OFFLINE_RECEIPT"
          git rev-parse HEAD > "$EVIDENCE/head.txt"
          git rev-parse 'HEAD^{tree}' > "$EVIDENCE/tree.txt"
          git ls-files -s > "$EVIDENCE/source-before.txt"
          sha256sum package.json package-lock.json > "$EVIDENCE/locks-before.txt"
          git diff --exit-code HEAD -- .
          git fetch --no-tags --depth=1 origin "$BASE_HEAD"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';

          const { BASE_HEAD, BASE_TREE, TEST_BLOB, PLAN_BLOB, EVIDENCE } = process.env;
          const repo = 'PapiSalgueroM/ballpark-hero';
          assert.equal(process.env.GITHUB_REPOSITORY, repo);
          const runId = 42792020594;
          const api = process.env.GITHUB_API_URL + '/repos/' + repo;
          const request = async path => {
            const response = await fetch(api + path, {
              headers: {
                Accept: 'application/vnd.github+json',
                Authorization: 'Bearer ' + process.env.GH_TOKEN,
                'X-GitHub-Api-Version': '2022-11-28',
              },
              redirect: 'error',
            });
            assert.equal(response.status, 200, 'preflight API ' + path);
            return response.json();
          };
          const [run, jobs, artifacts] = await Promise.all([
            request('/actions/runs/' + runId),
            request('/actions/runs/' + runId + '/jobs?per_page=100'),
            request('/actions/runs/' + runId + '/artifacts?per_page=100'),
          ]);
          const workflow = '.github/workflows/nba-perfect-season-daily-date-20261110.yml';
          assert.deepEqual([run.id,run.status,run.conclusion,run.event,run.run_attempt,run.path,run.head_sha,run.head_commit.tree_id,run.repository.full_name],
            [runId,'completed','success','push',1,workflow,'fb68443be3e925c1390b9d026477919ae00121ff','560d41291ab753e21ba25753da936c5c27e760a4',repo]);
          assert.equal(run.head_branch,'codex/nba-perfect-season-daily-date-preflight-qa-20261110');
          assert.equal(jobs.jobs.length,1);
          const [job] = jobs.jobs;
          assert.deepEqual([job.id,job.status,job.conclusion,job.head_sha,job.steps.length],[129747563141,'completed','success',run.head_sha,11]);
          assert(job.steps.every(step => step.status === 'completed' && step.conclusion === 'success'));
          assert.equal(artifacts.artifacts.length,1);
          const [artifact] = artifacts.artifacts;
          assert.deepEqual([artifact.id,artifact.name,artifact.expired,artifact.size_in_bytes,artifact.digest,artifact.workflow_run.id,artifact.workflow_run.head_sha],
            [13752550399,'nba-perfect-season-daily-date-active-preflight-'+runId,false,1014572,'sha256:89c1a0798e94ae61d6c20630674f1f36ac77884b6e3845697b5a89c5c49023ee',runId,run.head_sha]);
          const originalPin = {"run":42794877575,"job":129757351999,"artifact":13753555313,"steps":12,"zipBytes":996465,"zipSHA256":"524be2b6deb37de8ecf65bf2e401b6026033fa9d8e3c5afeb6399714809b4899","branch":"codex/nba-perfect-season-daily-date-original-retry-qa-20261110","head":"a97c23de034006e383349c8bebfedaf72a906346","tree":"1b3c406cb5d9efd817c3e6241f557b690f4ccc89","workflow":"f2f1102c4347140263895c01d9124d3a2d832b20","independentAuditSHA256":"006716cfb39d49447e6a5b4f89eabb94ae6c2633211bb164ab12d0daef92e56a"};
          const [priorRun,priorJobs,priorArtifacts] = await Promise.all([
            request('/actions/runs/' + originalPin.run),
            request('/actions/runs/' + originalPin.run + '/jobs?per_page=100'),
            request('/actions/runs/' + originalPin.run + '/artifacts?per_page=100'),
          ]);
          assert.deepEqual([priorRun.id,priorRun.status,priorRun.conclusion,priorRun.event,priorRun.run_attempt,priorRun.path,priorRun.head_sha,priorRun.head_commit.tree_id,priorRun.head_branch,priorRun.repository.full_name],
            [originalPin.run,'completed','success','push',1,workflow,BASE_HEAD,BASE_TREE,originalPin.branch,repo]);
          assert.equal(priorJobs.jobs.length,1);
          const [priorJob] = priorJobs.jobs;
          assert.deepEqual([priorJob.id,priorJob.status,priorJob.conclusion,priorJob.head_sha,priorJob.steps.length],
            [originalPin.job,'completed','success',BASE_HEAD,originalPin.steps]);
          assert(priorJob.steps.every(step => step.status === 'completed' && step.conclusion === 'success'));
          assert.equal(priorArtifacts.artifacts.length,1);
          const [priorArtifact] = priorArtifacts.artifacts;
          assert.deepEqual([priorArtifact.id,priorArtifact.name,priorArtifact.expired,priorArtifact.size_in_bytes,priorArtifact.digest,priorArtifact.workflow_run.id,priorArtifact.workflow_run.head_sha],
            [originalPin.artifact,'nba-perfect-season-daily-date-original-'+originalPin.run,false,originalPin.zipBytes,'sha256:'+originalPin.zipSHA256,originalPin.run,BASE_HEAD]);
          const layoutOriginal = {"run":42801633730,"job":129780349870,"artifact":13756053247,"head":"a2ad2178e5520a938fb906103508f69cdd11f495","tree":"0a205a0d548dad10b46a94ad2c4a0ce8b54da13d","workflow":"7e0e756862a9c66f6bda742154a9ce950ea6d334","branch":"codex/nba-perfect-season-daily-date-original-layout-qa-20261110","steps":18,"zipBytes":8655939,"zipSHA256":"691053f9632be26cd4fa3a7c1739ca65f9ff0a305b6e6d334dba34021fc7fce8","independentAuditSHA256":"8ba609e97d41fbae85c3090f212dfcea84b4873f22a624dbb30aad552dd59860"};
          const [layoutRun,layoutJobs,layoutArtifacts] = await Promise.all([
            request('/actions/runs/' + layoutOriginal.run),
            request('/actions/runs/' + layoutOriginal.run + '/jobs?per_page=100'),
            request('/actions/runs/' + layoutOriginal.run + '/artifacts?per_page=100'),
          ]);
          assert.deepEqual([layoutRun.id,layoutRun.status,layoutRun.conclusion,layoutRun.event,layoutRun.run_attempt,layoutRun.path,layoutRun.head_sha,layoutRun.head_commit.tree_id,layoutRun.head_branch],
            [layoutOriginal.run,'completed','success','push',1,workflow,layoutOriginal.head,layoutOriginal.tree,layoutOriginal.branch]);
          assert.equal(layoutJobs.jobs.length,1);
          const [layoutJob]=layoutJobs.jobs;
          assert.deepEqual([layoutJob.id,layoutJob.run_id,layoutJob.head_sha,layoutJob.status,layoutJob.conclusion,layoutJob.steps.length],
            [layoutOriginal.job,layoutOriginal.run,layoutOriginal.head,'completed','success',layoutOriginal.steps]);
          assert(layoutJob.steps.every(step=>step.status==='completed'&&step.conclusion==='success'));
          assert.equal(layoutArtifacts.artifacts.length,1);
          const [layoutArtifact]=layoutArtifacts.artifacts;
          assert.deepEqual([layoutArtifact.id,layoutArtifact.name,layoutArtifact.expired,layoutArtifact.size_in_bytes,layoutArtifact.digest,layoutArtifact.workflow_run.id,layoutArtifact.workflow_run.head_sha],
            [layoutOriginal.artifact,'nba-perfect-season-daily-date-original-layout-'+layoutOriginal.run,false,layoutOriginal.zipBytes,'sha256:'+layoutOriginal.zipSHA256,layoutOriginal.run,layoutOriginal.head]);
          delete process.env.GH_TOKEN;
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8', maxBuffer: 16 * 1024 * 1024 }).trimEnd();
          const head = git('rev-parse', 'HEAD');
          assert.equal(head, process.env.GITHUB_SHA);
          assert.deepEqual(git('rev-list', '--parents', '-n', '1', 'HEAD').split(' '), [head, BASE_HEAD]);
          assert.equal(git('rev-parse', BASE_HEAD + '^{tree}'), BASE_TREE);
          const test = 'src/test/perfectSeasonNbaDailyDate.test.tsx';
          const plan = 'docs/plans/2026-11-10-nba-perfect-season-daily-date.md';
          const page = 'src/pages/PerfectSeasonNba.tsx';
          const changed = [page, workflow].sort();
          const held = {"src/App.tsx":"8bfedf7aaa1d076e0f0c8e2216c7e46632cd8a33","src/data/gameRegistry.ts":"f560b40a74d1468ac72dfde4ee6fec6635a9a255","public/perfect-season-nba/index.html":"5a2d6aa77968adbbd67ee298f30ae865cf9bc4cf","src/pages/PerfectSeasonNba.tsx":"edf47ea61379dfd23e6df85266d8954d74b7cdef","src/lib/perfectSeason.ts":"2acc9b8498e15b53c9eebc87ea45d3dd77ec2de6","src/lib/perfectSeasonNba.ts":"4509bdb6c6026170189ed144ce514340ba3e4090","src/lib/perfectSeasonThemes.ts":"39113aad5dc330ccbd677b4c541a42da974b05e6","src/test/perfectSeasonNbaRetry.test.tsx":"6cf90f7d3bc132de8c463d880c2ad056ec03f854","scripts/lib/offlineTransport.cjs":"0fda542a2649fe5da937c6976fd0f5b6073e74b6","index.html":"12598fe720eec4fc88d3d33c53ede612d018150c","package.json":"2ff64986fb76ebc51b706f2fd24765768874008a","package-lock.json":"97d6f12a052f25f400462938c241789a083f0bfe","vite.config.ts":"0112b6ac4f2ad80b2fc04f9ec2f7185300913e7d","tailwind.config.ts":"f83c4f4032d359bc9285828eac3b0961a46c6b17","postcss.config.js":"2aa7205d4b402a1bdfbe07110c61df920b370066","tsconfig.json":"6b68d80b7d92d0c4a5d774897f2bedfa95b42669","tsconfig.app.json":"51f581dd91641b4c1f1219f646788e73cf6bf00c","tsconfig.node.json":"3133162c20350e1741b94b8d2ff77b811bec8363","bun.lockb":"5d9d33a3bf4f45fa099e2aa3014149e034981149","bun.lock":"dff081dcd34a1aa928ddc90d910774a6b855dfe3","src/lib/dateUtils.ts":"12c9de0ed37b0797492f3e936bcba70bdc03d585"};
          const pins = { ...held, [page]: '100652f3ed6b50c9fe2fae54e6386d4d6f932769', [test]: TEST_BLOB, [plan]: PLAN_BLOB };
          assert.equal(git('rev-parse', BASE_HEAD + ':' + workflow), 'f2f1102c4347140263895c01d9124d3a2d832b20');
          const sha = (algorithm, data) => createHash(algorithm).update(data).digest('hex');
          for (const [file, want] of Object.entries(pins)) {
            const bytes = fs.readFileSync(file);
            assert.match(want, /^[0-9a-f]{40}$/);
            assert.equal(git('rev-parse', 'HEAD:' + file), want);
            assert.equal(sha('sha1', Buffer.concat([Buffer.from('blob ' + bytes.length + '\0'), bytes])), want, file);
            assert.equal(git('rev-parse', BASE_HEAD + ':' + file), file === page ? held[page] : want, file);
          }
          assert.deepEqual(git('diff', '--name-only', BASE_HEAD, 'HEAD').split('\n').sort(), changed);
          assert.deepEqual(git('diff','--numstat',BASE_HEAD,'HEAD','--',page).split('\t'), ['2','2',page]);
          const tree = ref => git('ls-tree', '-r', '-z', ref).split('\0').filter(Boolean);
          const parent = tree(BASE_HEAD);
          const current = tree('HEAD');
          assert.equal(parent.length, 5801);
          assert.equal(current.length, 5801);
          assert.deepEqual(current.filter(row => !changed.includes(row.split('\t')[1])), parent.filter(row => !changed.includes(row.split('\t')[1])));
          assert.equal(current.filter(row => /^(src|public|scripts)\//.test(row.split('\t')[1])).length, 4669);
          fs.writeFileSync(EVIDENCE + '/source-receipt.json', JSON.stringify({
            head, tree: git('rev-parse', 'HEAD^{tree}'), parent: BASE_HEAD, parentTree: BASE_TREE, pins,
            ownedWorkflow: git('rev-parse', 'HEAD:' + workflow), heldRows: parent.length - changed.length, trackedRows: current.length, sourceRows: 4669,
            original: originalPin,
            layoutOriginal,
            activePreflight: { run: run.id, head: run.head_sha, job: job.id, artifact: artifact.id, digest: artifact.digest, independentAuditSHA256: '1196cf142851fad8eebfb4c7173ceb4166aaaf7f1824590eba68b4af7369ccc9' },
          }, null, 2));
          NODE
      - name: Install locked dependencies and freeze physical source
        run: |
          set -euo pipefail
          npm ci 2>&1 | tee "$EVIDENCE/install.log"
          cat > "$EVIDENCE/physical.mjs" <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          const stage = process.argv[2];
          assert(['before', 'after'].includes(stage));
          const out = process.env.EVIDENCE;
          const index = execFileSync('git', ['ls-files', '-z'], { encoding: 'utf8' }).split('\0').filter(Boolean);
          const source = index.map(file => {
            const bytes = fs.readFileSync(file);
            return [file, bytes.length, createHash('sha256').update(bytes).digest('hex')];
          });
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const installed = Object.entries(lock.packages).filter(([file]) =>
            file.startsWith('node_modules/') && fs.existsSync(file + '/package.json')
          ).map(([file, entry]) => {
            const version = JSON.parse(fs.readFileSync(file + '/package.json', 'utf8')).version;
            assert.equal(version, entry.version, file);
            return [file, version];
          });
          assert.equal(source.length, 5801);
          assert.equal(installed.length, 521);
          assert.equal(fs.statSync(process.env.SIM_OFFLINE_RECEIPT).size, 0);
          for (const [name, data] of [['tracked', source], ['installed', installed]]) {
            const body = JSON.stringify(data);
            if (stage === 'after') assert.equal(body, fs.readFileSync(out + '/' + name + '-before.json', 'utf8'));
            fs.writeFileSync(out + '/' + name + '-' + stage + '.json', body);
          }
          NODE
          node "$EVIDENCE/physical.mjs" before
      - name: Proper app types
        run: |
          set -euo pipefail
          node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee "$EVIDENCE/types.log"
      - name: Require all NBA Daily date and held retry behavior
        run: |
          set -euo pipefail
          result=0
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node_modules/.bin/vitest run \
            src/test/perfectSeasonNbaDailyDate.test.tsx src/test/perfectSeasonNbaRetry.test.tsx \
            --reporter=default --reporter=json --outputFile="$EVIDENCE/vitest.json" > "$EVIDENCE/vitest.log" 2>&1 || result=$?
          cat "$EVIDENCE/vitest.log"
          printf '%s\n' "$result" > "$EVIDENCE/vitest-exit.txt"
          test "$result" -eq 0
          test -s "$NBA_DAILY_DATE_RAW"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          const out = process.env.EVIDENCE;
          const report = JSON.parse(fs.readFileSync(out + '/vitest.json', 'utf8'));
          const counts = {'src/test/perfectSeasonNbaRetry.test.tsx':5,'src/test/perfectSeasonNbaDailyDate.test.tsx':1};
          assert.deepEqual([report.numTotalTests,report.numPassedTests,report.numFailedTests,report.numPendingTests,report.numTodoTests,report.success],
            [6,6,0,0,0,true]);
          assert.equal(report.testResults.length,2);
          for (const key of ['errors','unhandledErrors','testExecutionErrors']) if (Object.hasOwn(report,key)) assert.deepEqual(report[key],[]);
          const log = fs.readFileSync(out + '/vitest.log', 'utf8');
          assert(!/Unhandled Errors?|Unhandled Rejection|Uncaught Exception|Failed Suites|Worker exited|Test timed out/i.test(log));
          for (const [file,count] of Object.entries(counts)) {
            const matching=report.testResults.filter(suite => suite.name.endsWith('/'+file));
            assert.equal(matching.length,1,file);
            const [suite]=matching;
            assert.deepEqual([suite.status,suite.message,suite.assertionResults.length],['passed','',count],file);
            assert(suite.assertionResults.every(row => row.status === 'passed' && row.failureMessages.length === 0),file);
            if (count === 1) assert.equal(suite.assertionResults[0].title,"keeps the mounted Eastern day's wheel and season after midnight");
          }
          const raw = fs.readFileSync(process.env.NBA_DAILY_DATE_RAW);
          const rawSHA256 = createHash('sha256').update(raw).digest('hex');
          assert.deepEqual([raw.length,rawSHA256],[10907,'6312bf05efe96265ecb689f2756efda3a65caea3b7ef6bd418a699836b1e6eb8']);
          const original = {"bytes":10899,"sha256":"27786f71819e483f6d95cf9e2de0be77945f94a4a39ef818379452d9899a4486"};
          const { before, crossover, after } = JSON.parse(raw).journeys;
          const same = ['wheel','simulation','resultText','savedAttempts','completions'];
          for (const key of same) assert.deepEqual(crossover[key],before[key],key);
          assert.deepEqual([before.mountET,crossover.mountET,crossover.entryET,after.mountET],['2026-11-09','2026-11-09','2026-11-10','2026-11-10']);
          assert.deepEqual([before.simulation[0].seed,crossover.simulation[0].seed,after.simulation[0].seed],[1326654265,1326654265,1249224418]);
          assert.notEqual(rawSHA256,original.sha256);
          fs.writeFileSync(out + '/fixed-result.json', JSON.stringify({
            status:'fixed-mounted-daily-date',total:6,passes:6,failed:0,rawBytes:raw.length,rawSHA256,original,
            sameMountedDayFields:same,journeys:3,spins:18,games:246,
          },null,2));
          NODE
      - name: Verify unchanged physical source and locked offline run
        if: always()
        run: |
          set -euo pipefail
          git ls-files -s > "$EVIDENCE/source-after.txt"
          sha256sum package.json package-lock.json > "$EVIDENCE/locks-after.txt"
          cmp "$EVIDENCE/source-before.txt" "$EVIDENCE/source-after.txt"
          cmp "$EVIDENCE/locks-before.txt" "$EVIDENCE/locks-after.txt"
          git diff --exit-code HEAD -- .
          node "$EVIDENCE/physical.mjs" after
          test ! -s "$SIM_OFFLINE_RECEIPT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nba-perfect-season-daily-date-fixed-${{ github.run_id }}
          path: nba-perfect-season-daily-date-fixed
          retention-days: 14
          if-no-files-found: error
