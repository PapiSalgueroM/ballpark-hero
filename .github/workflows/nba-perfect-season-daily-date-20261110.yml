          const workflow='.github/workflows/nba-perfect-season-daily-date-20261110.yml',helper='scripts/qa/playNbaPerfectSeasonDailyDate.mjs';
          const git=(...args)=>execFileSync('git',args,{encoding:'utf8',maxBuffer:16*1024*1024}).trimEnd();
