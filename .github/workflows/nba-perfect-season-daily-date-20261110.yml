name: NBA Perfect Season Daily date original
on:
  push:
    branches: [codex/nba-perfect-season-daily-date-original-qa-20261110]
permissions:
  actions: read
  contents: read
jobs:
  original:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: UTC
      SIM_NETWORK: offline
      SIM_OFFLINE_RECEIPT: nba-perfect-season-daily-date-original/offline.log
      NBA_DAILY_DATE_RAW: nba-perfect-season-daily-date-original/public-cases.raw.json
      BASE_HEAD: '7868fa0995bce7544c28b4776ef6505f585fb969'
      BASE_TREE: '85f0484c30da21813e77e564d88510d3a796b531'
      TEST_BLOB: 'd61c4fdcfc93577027ddd3d11c4cdadd220b8b04'
      PLAN_BLOB: '2c302ff50b614cbe3d08ee6321a213788e74e793'
      EVIDENCE: nba-perfect-season-daily-date-original
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - name: Authenticate active entry and exact original NBA Perfect Season source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test ! -e "$EVIDENCE"
          mkdir "$EVIDENCE"
          touch "$SIM_OFFLINE_RECEIPT"
          git rev-parse HEAD > "$EVIDENCE/head.txt"
          git rev-parse 'HEAD^{tree}' > "$EVIDENCE/tree.txt"
          git ls-files -s > "$EVIDENCE/source-before.txt"
          sha256sum package.json package-lock.json > "$EVIDENCE/locks-before.txt"
          git diff --exit-code HEAD -- .
          git fetch --no-tags --depth=1 origin "$BASE_HEAD"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';

          const { BASE_HEAD, BASE_TREE, TEST_BLOB, PLAN_BLOB, EVIDENCE } = process.env;
          const repo = 'PapiSalgueroM/ballpark-hero';
          assert.equal(process.env.GITHUB_REPOSITORY, repo);
          const runId = 42792020594;
          const api = process.env.GITHUB_API_URL + '/repos/' + repo;
          const request = async path => {
            const response = await fetch(api + path, {
              headers: {
                Accept: 'application/vnd.github+json',
                Authorization: 'Bearer ' + process.env.GH_TOKEN,
                'X-GitHub-Api-Version': '2022-11-28',
              },
              redirect: 'error',
            });
            assert.equal(response.status, 200, 'preflight API ' + path);
            return response.json();
          };
          const [run, jobs, artifacts] = await Promise.all([
            request('/actions/runs/' + runId),
            request('/actions/runs/' + runId + '/jobs?per_page=100'),
            request('/actions/runs/' + runId + '/artifacts?per_page=100'),
          ]);
          const workflow = '.github/workflows/nba-perfect-season-daily-date-20261110.yml';
          assert.deepEqual([run.id,run.status,run.conclusion,run.event,run.run_attempt,run.path,run.head_sha,run.head_commit.tree_id,run.repository.full_name],
            [runId,'completed','success','push',1,workflow,'fb68443be3e925c1390b9d026477919ae00121ff','560d41291ab753e21ba25753da936c5c27e760a4',repo]);
          assert.equal(run.head_branch,'codex/nba-perfect-season-daily-date-preflight-qa-20261110');
          assert.equal(jobs.jobs.length,1);
          const [job] = jobs.jobs;
          assert.deepEqual([job.id,job.status,job.conclusion,job.head_sha,job.steps.length],[129747563141,'completed','success',run.head_sha,11]);
          assert(job.steps.every(step => step.status === 'completed' && step.conclusion === 'success'));
          assert.equal(artifacts.artifacts.length,1);
          const [artifact] = artifacts.artifacts;
          assert.deepEqual([artifact.id,artifact.name,artifact.expired,artifact.size_in_bytes,artifact.digest,artifact.workflow_run.id,artifact.workflow_run.head_sha],
            [13752550399,'nba-perfect-season-daily-date-active-preflight-'+runId,false,1014572,'sha256:89c1a0798e94ae61d6c20630674f1f36ac77884b6e3845697b5a89c5c49023ee',runId,run.head_sha]);
          delete process.env.GH_TOKEN;
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8', maxBuffer: 16 * 1024 * 1024 }).trimEnd();
          const head = git('rev-parse', 'HEAD');
          assert.equal(head, process.env.GITHUB_SHA);
          assert.deepEqual(git('rev-list', '--parents', '-n', '1', 'HEAD').split(' '), [head, BASE_HEAD]);
          assert.equal(git('rev-parse', BASE_HEAD + '^{tree}'), BASE_TREE);
          const test = 'src/test/perfectSeasonNbaDailyDate.test.tsx';
          const plan = 'docs/plans/2026-11-10-nba-perfect-season-daily-date.md';
          const added = [test, plan, workflow].sort();
          const held = {"src/App.tsx":"8bfedf7aaa1d076e0f0c8e2216c7e46632cd8a33","src/data/gameRegistry.ts":"f560b40a74d1468ac72dfde4ee6fec6635a9a255","public/perfect-season-nba/index.html":"5a2d6aa77968adbbd67ee298f30ae865cf9bc4cf","src/pages/PerfectSeasonNba.tsx":"edf47ea61379dfd23e6df85266d8954d74b7cdef","src/lib/perfectSeason.ts":"2acc9b8498e15b53c9eebc87ea45d3dd77ec2de6","src/lib/perfectSeasonNba.ts":"4509bdb6c6026170189ed144ce514340ba3e4090","src/lib/perfectSeasonThemes.ts":"39113aad5dc330ccbd677b4c541a42da974b05e6","src/test/perfectSeasonNbaRetry.test.tsx":"6cf90f7d3bc132de8c463d880c2ad056ec03f854","scripts/lib/offlineTransport.cjs":"0fda542a2649fe5da937c6976fd0f5b6073e74b6","index.html":"12598fe720eec4fc88d3d33c53ede612d018150c","package.json":"2ff64986fb76ebc51b706f2fd24765768874008a","package-lock.json":"97d6f12a052f25f400462938c241789a083f0bfe","vite.config.ts":"0112b6ac4f2ad80b2fc04f9ec2f7185300913e7d","tailwind.config.ts":"f83c4f4032d359bc9285828eac3b0961a46c6b17","postcss.config.js":"2aa7205d4b402a1bdfbe07110c61df920b370066","tsconfig.json":"6b68d80b7d92d0c4a5d774897f2bedfa95b42669","tsconfig.app.json":"51f581dd91641b4c1f1219f646788e73cf6bf00c","tsconfig.node.json":"3133162c20350e1741b94b8d2ff77b811bec8363","bun.lockb":"5d9d33a3bf4f45fa099e2aa3014149e034981149","bun.lock":"dff081dcd34a1aa928ddc90d910774a6b855dfe3","src/lib/dateUtils.ts":"12c9de0ed37b0797492f3e936bcba70bdc03d585"};
          const pins = { ...held, [test]: TEST_BLOB, [plan]: PLAN_BLOB };
          const sha = (algorithm, data) => createHash(algorithm).update(data).digest('hex');
          for (const [file, want] of Object.entries(pins)) {
            const bytes = fs.readFileSync(file);
            assert.match(want, /^[0-9a-f]{40}$/);
            assert.equal(git('rev-parse', 'HEAD:' + file), want);
            assert.equal(sha('sha1', Buffer.concat([Buffer.from('blob ' + bytes.length + '\0'), bytes])), want, file);
            if (Object.hasOwn(held, file)) assert.equal(git('rev-parse', BASE_HEAD + ':' + file), want, file);
          }
          assert.deepEqual(git('diff', '--name-only', BASE_HEAD, 'HEAD').split('\n').sort(), added);
          const tree = ref => git('ls-tree', '-r', '-z', ref).split('\0').filter(Boolean);
          const parent = tree(BASE_HEAD);
          const current = tree('HEAD');
          assert.equal(parent.length, 5798);
          assert.equal(current.length, 5801);
          assert.deepEqual(current.filter(row => !added.includes(row.split('\t')[1])), parent);
          assert.equal(current.filter(row => /^(src|public|scripts)\//.test(row.split('\t')[1])).length, 4669);
          fs.writeFileSync(EVIDENCE + '/source-receipt.json', JSON.stringify({
            head, tree: git('rev-parse', 'HEAD^{tree}'), parent: BASE_HEAD, parentTree: BASE_TREE, pins,
            ownedWorkflow: git('rev-parse', 'HEAD:' + workflow), heldRows: parent.length, trackedRows: current.length, sourceRows: 4669,
            activePreflight: { run: run.id, head: run.head_sha, job: job.id, artifact: artifact.id, digest: artifact.digest, independentAuditSHA256: '1196cf142851fad8eebfb4c7173ceb4166aaaf7f1824590eba68b4af7369ccc9' },
          }, null, 2));
          NODE
      - name: Install locked dependencies and freeze physical source
        run: |
          set -euo pipefail
          npm ci 2>&1 | tee "$EVIDENCE/install.log"
          cat > "$EVIDENCE/physical.mjs" <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          const stage = process.argv[2];
          assert(['before', 'after'].includes(stage));
          const out = process.env.EVIDENCE;
          const index = execFileSync('git', ['ls-files', '-z'], { encoding: 'utf8' }).split('\0').filter(Boolean);
          const source = index.map(file => {
            const bytes = fs.readFileSync(file);
            return [file, bytes.length, createHash('sha256').update(bytes).digest('hex')];
          });
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const installed = Object.entries(lock.packages).filter(([file]) =>
            file.startsWith('node_modules/') && fs.existsSync(file + '/package.json')
          ).map(([file, entry]) => {
            const version = JSON.parse(fs.readFileSync(file + '/package.json', 'utf8')).version;
            assert.equal(version, entry.version, file);
            return [file, version];
          });
          assert.equal(source.length, 5801);
          assert.equal(installed.length, 521);
          assert.equal(fs.statSync(process.env.SIM_OFFLINE_RECEIPT).size, 0);
          for (const [name, data] of [['tracked', source], ['installed', installed]]) {
            const body = JSON.stringify(data);
            if (stage === 'after') assert.equal(body, fs.readFileSync(out + '/' + name + '-before.json', 'utf8'));
            fs.writeFileSync(out + '/' + name + '-' + stage + '.json', body);
          }
          NODE
          node "$EVIDENCE/physical.mjs" before
      - name: Proper app types
        run: |
          set -euo pipefail
          node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee "$EVIDENCE/types.log"
      - name: Require the original Daily date mismatch and held retry behavior
        run: |
          set -euo pipefail
          result=0
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node_modules/.bin/vitest run \
            src/test/perfectSeasonNbaDailyDate.test.tsx src/test/perfectSeasonNbaRetry.test.tsx \
            --reporter=default --reporter=json --outputFile="$EVIDENCE/vitest.json" > "$EVIDENCE/vitest.log" 2>&1 || result=$?
          cat "$EVIDENCE/vitest.log"
          printf '%s\n' "$result" > "$EVIDENCE/vitest-exit.txt"
          test "$result" -eq 1
          test -s "$NBA_DAILY_DATE_RAW"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          const out = process.env.EVIDENCE;
          const report = JSON.parse(fs.readFileSync(out + '/vitest.json', 'utf8'));
          const preserved = {"src/test/perfectSeasonNbaRetry.test.tsx":5};
          const names = [{"title":"keeps the mounted Eastern day's wheel and season after midnight","marker":"NBA_DAILY_PICKER_MOUNT_DATE"}];
          const source = 'src/test/perfectSeasonNbaDailyDate.test.tsx';
          const total = 5 + names.length;
          const failures = names.filter(row => row.marker);
          assert.equal(failures.length,1);
          assert.deepEqual([report.numTotalTests,report.numPassedTests,report.numFailedTests,report.numPendingTests,report.numTodoTests,report.success],
            [total,total-1,1,0,0,false]);
          assert.equal(report.testResults.length,2);
          for (const key of ['errors','unhandledErrors','testExecutionErrors']) if (Object.hasOwn(report,key)) assert.deepEqual(report[key],[]);
          const log = fs.readFileSync(out + '/vitest.log', 'utf8');
          assert(!/Unhandled Errors?|Unhandled Rejection|Uncaught Exception|Failed Suites|Worker exited|Test timed out/i.test(log));
          const observed = [];
          for (const [file,count] of Object.entries({...preserved,[source]:names.length})) {
            const matching=report.testResults.filter(suite => suite.name.endsWith('/'+file));
            assert.equal(matching.length,1,file);
            const [suite]=matching;
            const fresh=file===source;
            assert.deepEqual([suite.status,suite.message,suite.assertionResults.length],[fresh?'failed':'passed','',count],file);
            if(fresh) assert.deepEqual(suite.assertionResults.map(row=>row.title).sort(),names.map(row=>row.title).sort());
            for(const row of suite.assertionResults) {
              const business=fresh ? names.find(name=>name.title===row.title)?.marker : null;
              assert.equal(row.status,business?'failed':'passed',row.fullName);
              assert.equal(row.failureMessages.length,business?1:0,row.fullName);
              if(business) assert(row.failureMessages[0].startsWith('AssertionError: '+business+':'),row.fullName);
            }
            observed.push({file,cases:count,passes:fresh?count-1:count});
          }
          const raw=fs.readFileSync(process.env.NBA_DAILY_DATE_RAW);
          const evidence=JSON.parse(raw.toString('utf8'));
          const checks=(()=>{
          assert.deepEqual(Object.keys(evidence),['schema','title','fixture','journeys']);
          assert.deepEqual([evidence.schema,evidence.title],['nba-perfect-season-daily-date-v1',"keeps the mounted Eastern day's wheel and season after midnight"]);
          const slots=['PG','SG','SF','PF','C','SIXTH'],previous='2026-11-09',current='2026-11-10';
          const groups={MOD:2015,MID:2000};
          const expectedRows=Object.entries(groups).flatMap(([prefix,start])=>Array.from({length:8},(_,i)=>{
            const year=start+i,team=prefix+String(i+1).padStart(2,'0');
            return {season:year+'-'+String((year+1)%100).padStart(2,'0'),team,teamName:'Daily Date Club '+team};
          }));
          assert.deepEqual(evidence.fixture,{source:'Synthetic NBA archive fixtures',slots,index:expectedRows,rating:80});
          const forecast={
            before:[previous,previous,'MOD',[3,5,4,6,6,4],1326654265],
            crossover:[previous,current,'MOD',[4,6,8,8,7,5],1249224418],
            after:[current,current,'MID',[4,6,8,8,7,5],1249224418],
          };
          assert.deepEqual(Object.keys(evidence.journeys),Object.keys(forecast));
          const instants={ [previous]:Date.parse('2026-11-10T04:59:40Z'),[current]:Date.parse('2026-11-10T05:00:01Z') };
          const measured={};
          for(const [role,[mount,entry,prefix,ordinals,seed]] of Object.entries(forecast)){
            const j=evidence.journeys[role];
            assert.deepEqual([Date.parse(j.mountInstant),Date.parse(j.entryInstant),j.mountET,j.entryET,j.finishET,j.archiveRequestsBeforeEntry],
              [instants[mount],instants[entry],mount,entry,entry,0]);
            assert.deepEqual(j.indexRequests,[{oldWheel:false}]);
            assert.equal(j.theme,prefix==='MOD'?"Today's theme: Three-Point Boom":"Today's theme: 2000s Basketball");
            assert.equal(j.wheel.length,6);
            for(const [i,slot] of slots.entries()){
              const x=j.wheel[i],team=prefix+String(ordinals[i]).padStart(2,'0'),row=expectedRows.find(e=>e.team===team);
              const picked='Daily Date Fixture '+team+' '+slot;
              assert.deepEqual(x,{slot,archiveRow:row,landed:row.season+' '+row.teamName,pickedPlayer:picked,lineupPlayer:i<5?picked:null});
            }
            assert.equal(j.simulation.length,1);
            const sim=j.simulation[0],result=sim.result;
            assert.deepEqual([sim.sport,sim.games,sim.seed],['nba',82,seed]);
            assert(Number.isFinite(sim.overall));
            assert.equal(result.games.length,82);assert(result.games.every(x=>typeof x==='boolean'));
            assert.deepEqual([result.wins,result.losses,result.perfect],[result.games.filter(Boolean).length,result.games.filter(x=>!x).length,result.wins===82]);
            assert.equal(j.resultText,result.wins+'-'+result.losses);
            assert.deepEqual(Object.keys(j.savedAttempts),[previous,current]);
            assert.equal(j.savedAttempts[mount===previous?current:previous],null);
            const save=j.savedAttempts[mount];
            assert.deepEqual([save.v,save.date,save.spins,save.teamNames,save.sim],[1,mount,6,j.wheel.map(x=>x.landed),result]);
            assert.equal(j.completions.length,1);assert.deepEqual(j.completions[0].slice(0,2),['/perfect-season-nba',result.wins]);
            measured[role]={mountET:mount,entryET:entry,savedET:save.date,theme:j.theme,teams:j.wheel.map(x=>x.archiveRow.team),seed,wins:result.wins,losses:result.losses};
          }
          assert.notEqual(measured.before.seed,measured.crossover.seed);
          assert.equal(measured.crossover.seed,measured.after.seed);
          return {status:'passed',journeys:3,spins:18,games:246,measured};
          })();
          assert.equal(checks.status,'passed');
          fs.writeFileSync(out + '/original-result.json', JSON.stringify({
            status:'expected-original-daily-date-mismatch',markers:failures.map(row=>row.marker),total,passes:total-1,failed:1,observed,checks,
            rawBytes:raw.length,rawSHA256:createHash('sha256').update(raw).digest('hex'),
          },null,2));
          NODE
      - name: Verify unchanged physical source and locked offline run
        if: always()
        run: |
          set -euo pipefail
          git ls-files -s > "$EVIDENCE/source-after.txt"
          sha256sum package.json package-lock.json > "$EVIDENCE/locks-after.txt"
          cmp "$EVIDENCE/source-before.txt" "$EVIDENCE/source-after.txt"
          cmp "$EVIDENCE/locks-before.txt" "$EVIDENCE/locks-after.txt"
          git diff --exit-code HEAD -- .
          node "$EVIDENCE/physical.mjs" after
          test ! -s "$SIM_OFFLINE_RECEIPT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nba-perfect-season-daily-date-original-${{ github.run_id }}
          path: nba-perfect-season-daily-date-original
          retention-days: 14
          if-no-files-found: error
