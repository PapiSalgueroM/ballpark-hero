          assert.equal(git('rev-parse',fixedHead+'^{tree}'),fixedTree);
          assert.equal(git('rev-parse',fixedHead+':'+workflow),env.NBA_DAILY_DATE_FIXED_WORKFLOW);
          assert.equal(git('rev-parse','HEAD:'+helper),env.NBA_DAILY_DATE_HELPER_BLOB);
          assert.equal(git('rev-parse','HEAD:src/pages/PerfectSeasonNba.tsx'),env.NBA_DAILY_DATE_PRODUCT_BLOB);
          assert.equal(git('rev-parse','HEAD:src/test/perfectSeasonNbaDailyDate.test.tsx'),'7c398ac1ded8cf96d5d0720ca426a2e1fe6ddc92');
          assert.equal(git('rev-parse','HEAD:docs/plans/2026-11-10-nba-perfect-season-daily-date.md'),'2c302ff50b614cbe3d08ee6321a213788e74e793');
          const before=tree(fixedHead),after=tree('HEAD');
          assert.deepEqual([before.length,after.length,held(before).length],[5801,5802,5800]);
          assert.deepEqual(held(after),held(before));
          assert.equal(after.filter(row=>/^(src|public|scripts)\//.test(row.split('\t')[1])).length,4670);
          assert.deepEqual(git('diff','--name-status',fixedHead,'HEAD').split('\n').sort(),['A\t'+helper,'M\t'+workflow].sort());
          fs.writeFileSync(out+'/source-join.json',JSON.stringify({status:'passed',head,tree:git('rev-parse','HEAD^{tree}'),fixedHead,fixedTree,workflow:git('rev-parse','HEAD:'+workflow),helperBlob:env.NBA_DAILY_DATE_HELPER_BLOB,pins:{'src/pages/PerfectSeasonNba.tsx':env.NBA_DAILY_DATE_PRODUCT_BLOB},heldRows:5800,trackedRows:5802,scopedSourceRows:4670,rootConfigurations:11},null,2));
