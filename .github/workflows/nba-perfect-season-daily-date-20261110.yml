          assert.match(src.tree, /^[a-f0-9]{40}$/);
          assert.equal(src.helperBlob, process.env.NBA_DAILY_DATE_HELPER_BLOB);
          assert.equal(src.pins['src/pages/PerfectSeasonNba.tsx'], process.env.NBA_DAILY_DATE_PRODUCT_BLOB);
          assert.equal(native.schema, 'nba-perfect-season-daily-date-native-admission-v4');
          assert.equal(native.helperSHA, '4a833809d5a54e4b090f2087b94ec73062502c24932ad0e9066f8c660dd85c1c');
          assert.equal(native.route, 'http://127.0.0.1:4174/perfect-season-nba');
          assert.equal(native.cases.length, 9);
          assert.equal(native.heldBodies.length, 21);
          assert.equal(native.offlineBytes, 0);
          assert.deepEqual(native.totals, { documents: 9, index: 135, squad: 54, completion: 9, images: 18 });
          assert.equal(fs.statSync(process.env.SIM_OFFLINE_RECEIPT).size, 0);

          const readers = read('readers.log').toString();
          const weight = read('weight.log').toString();
          assert(readers.includes('All 20 harnesses green.'));
          assert(weight.includes('sweepWeight: green.'));
          const capRows = weight.split('\n').filter(line => /^\s+\/\S*\s+\d+K gz over/.test(line));
          assert.equal(capRows.length, 16);

          function distPaths(directory) {
            return fs.readdirSync(directory, { withFileTypes: true }).flatMap(entry => {
              const file = directory + '/' + entry.name;
              if (entry.isDirectory()) return distPaths(file);
              assert(entry.isFile(), 'Regular production build file required');
              return [file];
            });
          }
          const toTuple = file => {
            const bytes = fs.readFileSync(file);
            return { file, bytes: bytes.length, sha256: sha(bytes) };
          };
          const byPath = (a, b) => a.file.localeCompare(b.file);
          const before = json('dist-before.json').sort(byPath);
          const after = distPaths('dist').map(toTuple).sort(byPath);
          assert.equal(before.length, 850);
          assert.equal(after.length, 850);
          assert.equal(new Set(before.map(row => row.file)).size, 850);
          assert.deepEqual(after, before);
          const report = json('browser/report.json');
          const served = after.find(row => row.file === 'dist/perfect-season-nba/index.html');
          assert(served);
          assert.deepEqual(report.builtDocument, { distFile: served.file, file: 'built-document.html', bytes: served.bytes, sha256: served.sha256 });
          const distLedger = Buffer.from(JSON.stringify(after));
          fs.writeFileSync(out + '/dist-after.json', distLedger);

          const tar = read('dist.tgz');
          const distTar = { bytes: tar.length, sha256: sha(tar) };
          assert(tar.length > 0);
          assert.equal(read('dist.sha256').toString().trim(), distTar.sha256 + '  ' + out + '/dist.tgz');
          const admission = {
            status: 'passed', head: src.head, tree: src.tree, readers: 20, immutableCaps: 16, capRows,
            distFiles: 850, distTar, distTupleSHA256: sha(distLedger), unit, native, controlsRerun: false,
          };
          fs.writeFileSync(out + '/admission.json', JSON.stringify(admission, null, 2) + '\n');
          console.log('PASS exact NBA Daily native browser, held production files and complete admission');
          NODE
      - name: Verify unchanged physical source and locked offline run
        if: always()
        run: |
          set -euo pipefail
          git ls-files -s > "$EVIDENCE/source-after.txt"
          sha256sum package.json package-lock.json > "$EVIDENCE/locks-after.txt"
          cmp "$EVIDENCE/source-before.txt" "$EVIDENCE/source-after.txt"
          cmp "$EVIDENCE/locks-before.txt" "$EVIDENCE/locks-after.txt"
          git diff --exit-code HEAD -- .
          node "$EVIDENCE/physical.mjs" after
          test ! -s "$SIM_OFFLINE_RECEIPT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nba-perfect-season-daily-date-full-${{ github.run_id }}
          path: nba-perfect-season-daily-date-full
          if-no-files-found: error
          retention-days: 30
