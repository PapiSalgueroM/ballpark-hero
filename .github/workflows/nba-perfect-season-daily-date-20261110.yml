name: NBA Perfect Season Daily date physical controls
on:
  push:
    branches: [codex/nba-perfect-season-daily-date-controls-qa-20261110]
permissions:
  actions: read
  contents: read
jobs:
  controls:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: UTC
      SIM_NETWORK: offline
      SIM_OFFLINE_RECEIPT: nba-perfect-season-daily-date-controls/offline.log
      NBA_DAILY_DATE_RAW: nba-perfect-season-daily-date-controls/public-cases.raw.json
      BASE_HEAD: 'c589d7f3449aebe219466bbe0e834280899879f8'
      BASE_TREE: '0b019f330b034e679cbfd99846af4cebf25a338e'
      TEST_BLOB: '7c398ac1ded8cf96d5d0720ca426a2e1fe6ddc92'
      PLAN_BLOB: '2c302ff50b614cbe3d08ee6321a213788e74e793'
      EVIDENCE: nba-perfect-season-daily-date-controls
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - name: Authenticate exact fixed and original role inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test ! -e "$EVIDENCE"
          mkdir "$EVIDENCE"
          touch "$SIM_OFFLINE_RECEIPT"
          git rev-parse HEAD > "$EVIDENCE/head.txt"
          git rev-parse 'HEAD^{tree}' > "$EVIDENCE/tree.txt"
          git ls-files -s > "$EVIDENCE/source-before.txt"
          sha256sum package.json package-lock.json > "$EVIDENCE/locks-before.txt"
          git diff --exit-code HEAD -- .
          git fetch --no-tags --depth=1 origin 'a97c23de034006e383349c8bebfedaf72a906346'
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          import {createHash} from 'node:crypto';
          const out=process.env.EVIDENCE;
          const repo='PapiSalgueroM/ballpark-hero',workflow='.github/workflows/nba-perfect-season-daily-date-20261110.yml';
          const inputs={"original":{"run":42794877575,"job":129757351999,"artifact":13753555313,"steps":12,"zipBytes":996465,"zipSHA256":"524be2b6deb37de8ecf65bf2e401b6026033fa9d8e3c5afeb6399714809b4899","head":"a97c23de034006e383349c8bebfedaf72a906346","tree":"1b3c406cb5d9efd817c3e6241f557b690f4ccc89","workflow":"f2f1102c4347140263895c01d9124d3a2d832b20","branch":"codex/nba-perfect-season-daily-date-original-retry-qa-20261110","auditSHA256":"006716cfb39d49447e6a5b4f89eabb94ae6c2633211bb164ab12d0daef92e56a","page":{"blob":"edf47ea61379dfd23e6df85266d8954d74b7cdef","bytes":39583,"sha256":"f110a4a6c76ff6c27f22015998db6d2208bebee33576a56f098589d64795dd42"},"raw":{"bytes":10899,"sha256":"27786f71819e483f6d95cf9e2de0be77945f94a4a39ef818379452d9899a4486"}},"fixed":{"run":42796141857,"job":129761693305,"artifact":13754955697,"steps":12,"zipBytes":995032,"zipSHA256":"8e5ba9b083ed18a7ae74b6ed83edb4d1a684ee4c071ca8233fc55a55f91f8f1d","head":"c589d7f3449aebe219466bbe0e834280899879f8","tree":"0b019f330b034e679cbfd99846af4cebf25a338e","workflow":"72f35e8e7df9c84bfd545a2665d8577ebbc2fb9e","branch":"codex/nba-perfect-season-daily-date-fixed-qa-20261110","auditSHA256":"f7842572cf169e39716fcd2b3f5dea9605ccb107d4951508784bb7c1031b7d0a","page":{"blob":"b1db58270ffbcc99f59ef752380a702373caa649","bytes":39593,"sha256":"b96f5225b1e197bc29e042b6826d8c9bd5ee601ca647b92b6df582b9469cb07f"},"raw":{"bytes":10907,"sha256":"6312bf05efe96265ecb689f2756efda3a65caea3b7ef6bd418a699836b1e6eb8"}}};
          const git=(...args)=>execFileSync('git',args,{encoding:'utf8',maxBuffer:16*1024*1024}).trimEnd();
          const file='src/pages/PerfectSeasonNba.tsx';
          for (const [role,pin] of Object.entries(inputs)) {
            const api='repos/'+repo+'/actions/';
            const fetch=(suffix)=>JSON.parse(execFileSync('gh',['api',api+suffix]));
            const run=fetch('runs/'+pin.run),jobs=fetch('runs/'+pin.run+'/jobs?per_page=100').jobs,artifact=fetch('artifacts/'+pin.artifact);
            assert.deepEqual([run.id,run.head_sha,run.head_commit.tree_id,run.head_branch,run.status,run.conclusion,run.event,run.run_attempt,run.path,run.repository.full_name],
              [pin.run,pin.head,pin.tree,pin.branch,'completed','success','push',1,workflow,repo]);
            assert.equal(jobs.length,1);
            const [job]=jobs;
            assert.deepEqual([job.id,job.run_id,job.name,job.head_sha,job.status,job.conclusion,job.steps.length],
              [pin.job,pin.run,role,pin.head,'completed','success',pin.steps]);
            assert(job.steps.every(step=>step.status==='completed'&&step.conclusion==='success'));
            assert.deepEqual([artifact.id,artifact.name,artifact.expired,artifact.size_in_bytes,artifact.digest,artifact.workflow_run.id,artifact.workflow_run.head_sha],
              [pin.artifact,'nba-perfect-season-daily-date-'+role+'-'+pin.run,false,pin.zipBytes,'sha256:'+pin.zipSHA256,pin.run,pin.head]);
            assert.match(pin.auditSHA256,/^[0-9a-f]{64}$/);
            assert.equal(git('rev-parse',pin.head+'^{tree}'),pin.tree);
            assert.equal(git('rev-parse',pin.head+':'+workflow),pin.workflow);
            assert.equal(git('rev-parse',pin.head+':'+file),pin.page.blob);
          }
          delete process.env.GH_TOKEN;
          const head=git('rev-parse','HEAD');
          assert.equal(head,process.env.GITHUB_SHA);
          assert.deepEqual(git('rev-list','--parents','-n','1','HEAD').split(' '),[head,inputs.fixed.head]);
          assert.equal(git('rev-parse','HEAD:'+file),inputs.fixed.page.blob);
          const physical=fs.readFileSync(file);
          assert.deepEqual([physical.length,createHash('sha256').update(physical).digest('hex')],[inputs.fixed.page.bytes,inputs.fixed.page.sha256]);
          const tree=ref=>git('ls-tree','-r','-z',ref).split('\0').filter(Boolean);
          const parent=tree(inputs.fixed.head),current=tree('HEAD'),without=rows=>rows.filter(row=>row.split('\t')[1]!==workflow);
          assert.deepEqual([parent.length,current.length,without(parent).length],[5801,5801,5800]);
          assert.deepEqual(without(current),without(parent));
          assert.equal(current.filter(row=>/^(src|public|scripts)\//.test(row.split('\t')[1])).length,4669);
          assert.deepEqual(git('diff','--name-only',inputs.fixed.head,'HEAD').split('\n'),[workflow]);
          fs.writeFileSync(out+'/source-receipt.json',JSON.stringify({status:'passed',head,tree:git('rev-parse','HEAD^{tree}'),
            ownedWorkflow:git('rev-parse','HEAD:'+workflow),trackedRows:5801,heldRows:5800,sourceRows:4669,rootConfigurations:11,inputs},null,2));
          NODE
      - name: Install locked dependencies and freeze physical source
        run: |
          set -euo pipefail
          npm ci 2>&1 | tee "$EVIDENCE/install.log"
          cat > "$EVIDENCE/physical.mjs" <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          const stage = process.argv[2];
          assert(['before', 'after'].includes(stage));
          const out = process.env.EVIDENCE;
          const index = execFileSync('git', ['ls-files', '-z'], { encoding: 'utf8' }).split('\0').filter(Boolean);
          const source = index.map(file => {
            const bytes = fs.readFileSync(file);
            return [file, bytes.length, createHash('sha256').update(bytes).digest('hex')];
          });
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const installed = Object.entries(lock.packages).filter(([file]) =>
            file.startsWith('node_modules/') && fs.existsSync(file + '/package.json')
          ).map(([file, entry]) => {
            const version = JSON.parse(fs.readFileSync(file + '/package.json', 'utf8')).version;
            assert.equal(version, entry.version, file);
            return [file, version];
          });
          assert.equal(source.length, 5801);
          assert.equal(installed.length, 521);
          assert.equal(fs.statSync(process.env.SIM_OFFLINE_RECEIPT).size, 0);
          for (const [name, data] of [['tracked', source], ['installed', installed]]) {
            const body = JSON.stringify(data);
            if (stage === 'after') assert.equal(body, fs.readFileSync(out + '/' + name + '-before.json', 'utf8'));
            fs.writeFileSync(out + '/' + name + '-' + stage + '.json', body);
          }
          NODE
          node "$EVIDENCE/physical.mjs" before
      - name: Proper app types
        run: |
          set -euo pipefail
          node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee "$EVIDENCE/types.log"
      - name: Fixed original and restored physical Page controls
        run: |
          set -euo pipefail
          cat > "$EVIDENCE/control-driver.mjs" <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import { createHash } from 'node:crypto';
          import { execFileSync, spawnSync } from 'node:child_process';
          
          const { EVIDENCE, SIM_OFFLINE_RECEIPT } = process.env;
          const pins = {"original":{"run":42794877575,"job":129757351999,"artifact":13753555313,"steps":12,"zipBytes":996465,"zipSHA256":"524be2b6deb37de8ecf65bf2e401b6026033fa9d8e3c5afeb6399714809b4899","head":"a97c23de034006e383349c8bebfedaf72a906346","tree":"1b3c406cb5d9efd817c3e6241f557b690f4ccc89","workflow":"f2f1102c4347140263895c01d9124d3a2d832b20","branch":"codex/nba-perfect-season-daily-date-original-retry-qa-20261110","auditSHA256":"006716cfb39d49447e6a5b4f89eabb94ae6c2633211bb164ab12d0daef92e56a","page":{"blob":"edf47ea61379dfd23e6df85266d8954d74b7cdef","bytes":39583,"sha256":"f110a4a6c76ff6c27f22015998db6d2208bebee33576a56f098589d64795dd42"},"raw":{"bytes":10899,"sha256":"27786f71819e483f6d95cf9e2de0be77945f94a4a39ef818379452d9899a4486"}},"fixed":{"run":42796141857,"job":129761693305,"artifact":13754955697,"steps":12,"zipBytes":995032,"zipSHA256":"8e5ba9b083ed18a7ae74b6ed83edb4d1a684ee4c071ca8233fc55a55f91f8f1d","head":"c589d7f3449aebe219466bbe0e834280899879f8","tree":"0b019f330b034e679cbfd99846af4cebf25a338e","workflow":"72f35e8e7df9c84bfd545a2665d8577ebbc2fb9e","branch":"codex/nba-perfect-season-daily-date-fixed-qa-20261110","auditSHA256":"f7842572cf169e39716fcd2b3f5dea9605ccb107d4951508784bb7c1031b7d0a","page":{"blob":"b1db58270ffbcc99f59ef752380a702373caa649","bytes":39593,"sha256":"b96f5225b1e197bc29e042b6826d8c9bd5ee601ca647b92b6df582b9469cb07f"},"raw":{"bytes":10907,"sha256":"6312bf05efe96265ecb689f2756efda3a65caea3b7ef6bd418a699836b1e6eb8"}}};
          const page = 'src/pages/PerfectSeasonNba.tsx';
          const regression = 'src/test/perfectSeasonNbaDailyDate.test.tsx';
          const retry = 'src/test/perfectSeasonNbaRetry.test.tsx';
          const roleOrder = ['fixed','original','restored'];
          const title = "keeps the mounted Eastern day's wheel and season after midnight";
          const marker = 'NBA_DAILY_PICKER_MOUNT_DATE';
          const sha = bytes => createHash('sha256').update(bytes).digest('hex');
          const git = (...args) => execFileSync('git',args,{maxBuffer:32*1024*1024});
          const expectedIndex = fs.readFileSync(path.join(EVIDENCE,'source-before.txt'));
          const fixed = fs.readFileSync(page), original = git('show',pins.original.head+':'+page);
          assert.deepEqual([fixed.length,sha(fixed)],[pins.fixed.page.bytes,pins.fixed.page.sha256]);
          assert.deepEqual([original.length,sha(original)],[pins.original.page.bytes,pins.original.page.sha256]);
          assert(!fixed.equals(original),'The physical control must change the Page bytes');
          assert.deepEqual(git('ls-files','-s'),expectedIndex);
          const held = JSON.parse(fs.readFileSync(path.join(EVIDENCE,'tracked-before.json'))).filter(([file])=>file!==page);
          assert.equal(held.length,5800);
          const verifyHeld = () => {
            assert.deepEqual(git('ls-files','-s'),expectedIndex);
            assert.equal(fs.statSync(SIM_OFFLINE_RECEIPT).size,0);
            for (const [file,length,digest] of held) {
              const body=fs.readFileSync(file);
              assert.deepEqual([body.length,sha(body)],[length,digest],file);
            }
          };
          const runs = {};
          try {
            for (const role of roleOrder) {
              const red = role === 'original', expected = red ? pins.original : pins.fixed;
              const source = red ? original : fixed;
              const dir = path.join(EVIDENCE,role);
              fs.mkdirSync(dir);
              if (role!=='fixed') {
                assert(!fs.readFileSync(page).equals(source),'The original and restored swaps must change the Page bytes');
                fs.writeFileSync(page,source);
              }
              assert(fs.readFileSync(page).equals(source));
              assert.deepEqual(git('diff','--name-only','HEAD').toString('utf8').trimEnd().split('\n').filter(Boolean),red?[page]:[]);
              fs.writeFileSync(path.join(dir,'page.tsx'),source);
              const rawPath=path.join(dir,'public-cases.raw.json'), reportPath=path.join(dir,'vitest.json');
              const cmd=spawnSync(process.execPath,['node_modules/vitest/vitest.mjs','run',regression,retry,'--reporter=default','--reporter=json','--outputFile='+reportPath],{
                env:{...process.env,NBA_DAILY_DATE_RAW:rawPath,NODE_OPTIONS:'--require='+process.cwd()+'/scripts/lib/offlineTransport.cjs'},
                maxBuffer:16*1024*1024,
              });
              const stdout=cmd.stdout||Buffer.alloc(0),stderr=cmd.stderr||Buffer.alloc(0);
              fs.writeFileSync(path.join(dir,'vitest.log'),Buffer.concat([stdout,stderr]));
              fs.writeFileSync(path.join(dir,'vitest-exit.txt'),String(cmd.status)+'\n');
              process.stdout.write(stdout);
              process.stderr.write(stderr);
              assert.equal(cmd.error,undefined,role);
              assert.equal(cmd.signal,null,role);
              assert.equal(cmd.status,red?1:0,role);
              assert(!/Unhandled Errors?|Unhandled Rejection|Uncaught Exception|Failed Suites|Worker exited|Test timed out/i.test(Buffer.concat([stdout,stderr]).toString('utf8')));
              const report=JSON.parse(fs.readFileSync(reportPath));
              assert.deepEqual([report.numTotalTests,report.numPassedTests,report.numFailedTests,report.numPendingTests,report.numTodoTests,report.success],
                [6,red?5:6,red?1:0,0,0,!red],role);
              assert.equal(report.testResults.length,2);
              for (const key of ['errors','unhandledErrors','testExecutionErrors']) if (Object.hasOwn(report,key)) assert.deepEqual(report[key],[]);
              for (const [file,count] of [[regression,1],[retry,5]]) {
                const found=report.testResults.filter(suite=>suite.name.endsWith('/'+file));
                assert.equal(found.length,1,file);
                const [suite]=found,business=red&&file===regression;
                assert.deepEqual([suite.status,suite.message,suite.assertionResults.length],[business?'failed':'passed','',count]);
                if (file===regression) assert.equal(suite.assertionResults[0].title,title);
                for (const row of suite.assertionResults) {
                  assert.deepEqual([row.status,row.failureMessages.length],[business?'failed':'passed',business?1:0]);
                  if (business) assert(row.failureMessages[0].startsWith('AssertionError: '+marker+':'));
                }
              }
              const raw=fs.readFileSync(rawPath);
              assert.deepEqual([raw.length,sha(raw)],[expected.raw.bytes,expected.raw.sha256],role+' exact admitted raw bytes');
              assert(fs.readFileSync(page).equals(source),role+' Page bytes held through the test');
              verifyHeld();
              runs[role]={page:expected.page,reference:expected.run,cases:6,passes:red?5:6,namedBusinessFailures:red?[marker]:[],raw:expected.raw};
            }
            assert(fs.readFileSync(path.join(EVIDENCE,'fixed','public-cases.raw.json')).equals(fs.readFileSync(path.join(EVIDENCE,'restored','public-cases.raw.json'))));
          } finally {
            if (!fs.readFileSync(page).equals(fixed)) fs.writeFileSync(page,fixed);
          }
          assert(fs.readFileSync(page).equals(fixed));
          verifyHeld();
          assert.equal(git('diff','--name-only','HEAD').length,0);
          fs.writeFileSync(path.join(EVIDENCE,'admission.json'),JSON.stringify({
            status:'passed',roleOrder,cases:18,passes:17,namedBusinessFailures:1,onlyPhysicalProductPath:page,restoredExactFixed:true,
            bothFixedRestoredRawBodiesLiteral:true,runs,
          },null,2)+'\n',{flag:'wx'});
          NODE
          node "$EVIDENCE/control-driver.mjs" 2>&1 | tee "$EVIDENCE/control-driver.log"
      - name: Verify unchanged physical source and locked offline run
        if: always()
        run: |
          set -euo pipefail
          git ls-files -s > "$EVIDENCE/source-after.txt"
          sha256sum package.json package-lock.json > "$EVIDENCE/locks-after.txt"
          cmp "$EVIDENCE/source-before.txt" "$EVIDENCE/source-after.txt"
          cmp "$EVIDENCE/locks-before.txt" "$EVIDENCE/locks-after.txt"
          git diff --exit-code HEAD -- .
          node "$EVIDENCE/physical.mjs" after
          test ! -s "$SIM_OFFLINE_RECEIPT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nba-perfect-season-daily-date-controls-${{ github.run_id }}
          path: nba-perfect-season-daily-date-controls
          retention-days: 14
          if-no-files-found: error
