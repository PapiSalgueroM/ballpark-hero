name: NBA Perfect Season original mobile layout diagnostic
on:
  push:
    branches: [codex/nba-perfect-season-daily-date-original-layout-qa-20261110]
permissions:
  actions: read
  contents: read
jobs:
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: UTC
      SIM_NETWORK: offline
      EVIDENCE: nba-perfect-season-daily-date-original-layout
      SIM_OFFLINE_RECEIPT: nba-perfect-season-daily-date-original-layout/offline.log
      NBA_DAILY_DATE_ORIGINAL_HEAD: 'a97c23de034006e383349c8bebfedaf72a906346'
      NBA_DAILY_DATE_ORIGINAL_TREE: '1b3c406cb5d9efd817c3e6241f557b690f4ccc89'
      NBA_DAILY_DATE_ORIGINAL_WORKFLOW: 'f2f1102c4347140263895c01d9124d3a2d832b20'
      NBA_DAILY_DATE_PRODUCT_BLOB: 'edf47ea61379dfd23e6df85266d8954d74b7cdef'
      NBA_DAILY_DATE_HELPER_BLOB: '95c5218604e4dfb272e4a3dc33aa8fb262cbc623'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact qualified original parent and sole native QA scope
        run: |
          set -euo pipefail
          test ! -e "$EVIDENCE"
          mkdir "$EVIDENCE"
          touch "$SIM_OFFLINE_RECEIPT"
          git rev-parse HEAD > "$EVIDENCE/head.txt"
          git rev-parse 'HEAD^{tree}' > "$EVIDENCE/tree.txt"
          git ls-files -s > "$EVIDENCE/source-before.txt"
          sha256sum package.json package-lock.json > "$EVIDENCE/locks-before.txt"
          git diff --exit-code HEAD -- .
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';import fs from 'node:fs';import {execFileSync} from 'node:child_process';
          const env=process.env,out=env.EVIDENCE,head=env.GITHUB_SHA,originalHead=env.NBA_DAILY_DATE_ORIGINAL_HEAD,originalTree=env.NBA_DAILY_DATE_ORIGINAL_TREE;
          const workflow='.github/workflows/nba-perfect-season-daily-date-20261110.yml',helper='scripts/qa/playNbaPerfectSeasonDailyDateLayout.mjs';
          const git=(...args)=>execFileSync('git',args,{encoding:'utf8',maxBuffer:16*1024*1024}).trimEnd();
          const tree=ref=>git('ls-tree','-r','-z',ref).split('\0').filter(Boolean),held=rows=>rows.filter(row=>![workflow,helper].includes(row.split('\t')[1]));
          assert.deepEqual(git('rev-list','--parents','-n','1','HEAD').split(' '),[head,originalHead]);
          assert.equal(git('rev-parse',originalHead+'^{tree}'),originalTree);
          assert.equal(git('rev-parse',originalHead+':'+workflow),env.NBA_DAILY_DATE_ORIGINAL_WORKFLOW);
          assert.equal(git('rev-parse','HEAD:'+helper),env.NBA_DAILY_DATE_HELPER_BLOB);
          assert.equal(git('rev-parse','HEAD:src/pages/PerfectSeasonNba.tsx'),env.NBA_DAILY_DATE_PRODUCT_BLOB);
          assert.equal(git('rev-parse','HEAD:src/test/perfectSeasonNbaDailyDate.test.tsx'),'7c398ac1ded8cf96d5d0720ca426a2e1fe6ddc92');
          assert.equal(git('rev-parse','HEAD:docs/plans/2026-11-10-nba-perfect-season-daily-date.md'),'2c302ff50b614cbe3d08ee6321a213788e74e793');
          const before=tree(originalHead),after=tree('HEAD');
          assert.deepEqual([before.length,after.length,held(before).length],[5801,5802,5800]);
          assert.deepEqual(held(after),held(before));
          assert.equal(after.filter(row=>/^(src|public|scripts)\//.test(row.split('\t')[1])).length,4670);
          assert.deepEqual(git('diff','--name-status',originalHead,'HEAD').split('\n').sort(),['A\t'+helper,'M\t'+workflow].sort());
          fs.writeFileSync(out+'/source-join.json',JSON.stringify({status:'passed',head,tree:git('rev-parse','HEAD^{tree}'),originalHead,originalTree,workflow:git('rev-parse','HEAD:'+workflow),helperBlob:env.NBA_DAILY_DATE_HELPER_BLOB,pins:{'src/pages/PerfectSeasonNba.tsx':env.NBA_DAILY_DATE_PRODUCT_BLOB},heldRows:5800,trackedRows:5802,scopedSourceRows:4670,rootConfigurations:11},null,2));
          NODE
      - name: Install locked dependencies and freeze physical source
        run: |
          set -euo pipefail
          npm ci 2>&1 | tee "$EVIDENCE/install.log"
          cat > "$EVIDENCE/physical.mjs" <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          const stage = process.argv[2];
          assert(['before', 'after'].includes(stage));
          const out = process.env.EVIDENCE;
          const index = execFileSync('git', ['ls-files', '-z'], { encoding: 'utf8' }).split('\0').filter(Boolean);
          const source = index.map(file => {
            const bytes = fs.readFileSync(file);
            return [file, bytes.length, createHash('sha256').update(bytes).digest('hex')];
          });
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const installed = Object.entries(lock.packages).filter(([file]) =>
            file.startsWith('node_modules/') && fs.existsSync(file + '/package.json')
          ).map(([file, entry]) => {
            const version = JSON.parse(fs.readFileSync(file + '/package.json', 'utf8')).version;
            assert.equal(version, entry.version, file);
            return [file, version];
          });
          assert.equal(source.length, 5802);
          assert.equal(installed.length, 521);
          assert.equal(fs.statSync(process.env.SIM_OFFLINE_RECEIPT).size, 0);
          for (const [name, data] of [['tracked', source], ['installed', installed]]) {
            const body = JSON.stringify(data);
            if (stage === 'after') assert.equal(body, fs.readFileSync(out + '/' + name + '-before.json', 'utf8'));
            fs.writeFileSync(out + '/' + name + '-' + stage + '.json', body);
          }
          NODE
          node "$EVIDENCE/physical.mjs" before
      - name: Proper app types
        run: |
          set -euo pipefail
          node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee "$EVIDENCE/types.log"
      - name: Actual direct route React lazy Pro Basketball object and inert snapshot
        run: |
          set -euo pipefail
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';import ts from 'typescript';import {JSDOM} from 'jsdom';import {createHash} from 'node:crypto';
          const out=process.env.EVIDENCE,route='/perfect-season-nba',component='PerfectSeasonNba',label='82-0 NBA Perfect Season',appText=fs.readFileSync('src/App.tsx','utf8'),catalogText=fs.readFileSync('src/data/gameRegistry.ts','utf8'),app=ts.createSourceFile('src/App.tsx',appText,ts.ScriptTarget.Latest,true,ts.ScriptKind.TSX),catalog=ts.createSourceFile('src/data/gameRegistry.ts',catalogText,ts.ScriptTarget.Latest,true,ts.ScriptKind.TS);assert.deepEqual(app.parseDiagnostics,[]);assert.deepEqual(catalog.parseDiagnostics,[]);
          const all=(root,predicate)=>{const found=[];const visit=node=>{if(predicate(node))found.push(node);ts.forEachChild(node,visit);};visit(root);return found;},attrs=(node,name)=>node.attributes.properties.filter(p=>ts.isJsxAttribute(p)&&p.name.text===name);
          const routes=all(app,node=>(ts.isJsxSelfClosingElement(node)||ts.isJsxOpeningElement(node))&&node.tagName.getText(app)==='Route').filter(node=>attrs(node,'path').some(p=>p.initializer&&ts.isStringLiteralLike(p.initializer)&&p.initializer.text===route));assert.equal(routes.length,1,'One actual direct public JSX Route');assert(ts.isJsxSelfClosingElement(routes[0]),'Direct self-closing route');assert.equal(attrs(routes[0],'path').length,1);const elements=attrs(routes[0],'element');assert.equal(elements.length,1);const element=elements[0].initializer;assert(element&&ts.isJsxExpression(element)&&element.expression&&ts.isJsxSelfClosingElement(element.expression));assert.equal(element.expression.tagName.getText(app),component,'Direct 82-0 NBA Perfect Season mount, no Navigate');
          const declarations=all(app,node=>ts.isVariableDeclaration(node)&&ts.isIdentifier(node.name)&&node.name.text===component);assert.equal(declarations.length,1);const init=declarations[0].initializer;assert(init&&ts.isCallExpression(init)&&ts.isIdentifier(init.expression)&&init.expression.text==='lazy');assert.equal(init.arguments.length,1);const factory=init.arguments[0];assert(ts.isArrowFunction(factory)&&factory.parameters.length===0);const load=factory.body;assert(ts.isCallExpression(load)&&load.expression.kind===ts.SyntaxKind.ImportKeyword&&load.arguments.length===1&&ts.isStringLiteralLike(load.arguments[0]));assert.equal(load.arguments[0].text,'./pages/PerfectSeasonNba');const reactLazy=all(app,node=>ts.isImportDeclaration(node)&&ts.isStringLiteralLike(node.moduleSpecifier)&&node.moduleSpecifier.text==='react'&&node.importClause?.namedBindings&&ts.isNamedImports(node.importClause.namedBindings)).flatMap(node=>node.importClause.namedBindings.elements).filter(node=>node.name.text==='lazy'&&(node.propertyName?.text??node.name.text)==='lazy');assert.equal(reactLazy.length,1,'lazy is the actual named React import');
          const prop=(node,name)=>{const found=node.properties.filter(p=>ts.isPropertyAssignment(p)&&(ts.isIdentifier(p.name)||ts.isStringLiteralLike(p.name))&&p.name.text===name);assert(found.length<=1,'No duplicate catalog property: '+name);return found[0]?.initializer;},defs=all(catalog,node=>ts.isVariableDeclaration(node)&&ts.isIdentifier(node.name)&&node.name.text==='CATEGORIES');assert.equal(defs.length,1);const categories=defs[0].initializer;assert(categories&&ts.isArrayLiteralExpression(categories));const category=categories.elements.filter(node=>ts.isObjectLiteralExpression(node)&&prop(node,'title')&&ts.isStringLiteralLike(prop(node,'title'))&&prop(node,'title').text==='Pro Basketball');assert.equal(category.length,1);const games=prop(category[0],'games');assert(games&&ts.isArrayLiteralExpression(games));const entries=games.elements.filter(node=>ts.isObjectLiteralExpression(node)&&prop(node,'path')&&ts.isStringLiteralLike(prop(node,'path'))&&prop(node,'path').text===route);assert.equal(entries.length,1,'One actual uncommented Pro Basketball catalog object');const catalogLabel=prop(entries[0],'label');assert(catalogLabel&&ts.isStringLiteralLike(catalogLabel));assert.equal(catalogLabel.text,label,'Exact actual Pro Basketball label');
          const file='public/perfect-season-nba/index.html',bytes=fs.readFileSync(file);assert.equal(bytes.length,22450);const dom=new JSDOM(bytes.toString('utf8')),doc=dom.window.document,canonicals=[...doc.querySelectorAll('link[rel]')].filter(node=>node.getAttribute('rel').toLowerCase().split(/\s+/).includes('canonical'));assert.equal(canonicals.length,1);assert.equal(canonicals[0].getAttribute('href'),'https://douknowball.com'+route);const snapshots=[...doc.querySelectorAll('#dukb-snapshot')];assert.equal(snapshots.length,1);const snapshot=snapshots[0],snapshotText=snapshot.textContent.trim();assert(snapshotText.length>500,'Actual readable saved game content');const headings=[...snapshot.querySelectorAll('h1')].map(node=>node.textContent.trim().replace(/\s+/g,' ').toUpperCase());assert(headings.includes('82-0 NBA PERFECT SEASON'),'Actual saved game heading');const metas=[...doc.querySelectorAll('meta')],retired=metas.filter(node=>['dukb-retired-from','dukb-retired-to'].includes((node.getAttribute('name')||'').toLowerCase())),refresh=metas.filter(node=>(node.getAttribute('http-equiv')||'').trim().toLowerCase()==='refresh'),robots=metas.filter(node=>['robots','googlebot','bingbot'].includes((node.getAttribute('name')||'').toLowerCase()));assert.equal(retired.length,0,'No actual retired-route markers');assert.equal(refresh.length,0,'No actual redirect meta');assert(robots.every(node=>!/(?:^|[\s,])(?:noindex|none)(?:[\s,]|$)/i.test(node.getAttribute('content')||'')),'Active snapshot remains indexable');
          fs.copyFileSync(file,out+'/active-snapshot.html');fs.writeFileSync(out+'/active-route-preflight.json',JSON.stringify({status:'passed',route,component,label,routeNode:routes[0].getText(app),reactLazyImport:reactLazy[0].parent.parent.parent.getText(app),lazyDeclaration:declarations[0].getText(app),catalogObject:entries[0].getText(catalog),snapshot:{file,bytes:bytes.length,sha256:createHash('sha256').update(bytes).digest('hex'),canonical:canonicals[0].getAttribute('href'),snapshotTextLength:snapshotText.length,headings,retiredMarkers:retired.length,metaRefresh:refresh.length,robots:robots.map(node=>({name:node.getAttribute('name'),content:node.getAttribute('content')}))},parsers:{typescript:ts.version,html:'Inert JSDOM, scripts/resources not enabled'},limits:'Actual AST nodes and inert DOM elements, never comments or a dormant Page file. Active source/public entry preflight only. No simulated score reproduction, game test, App fix, build, browser journey, real-data truth or release claim. Native route reachability remains unqualified.'},null,2));dom.window.close();console.log('PASS actual direct 82-0 NBA Perfect Season route, React lazy Page import, labeled Pro Basketball catalog object and indexable nonredirect snapshot');
          NODE
      - name: Authenticate admitted original game and first full diagnostic context
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const pins={"original":{"run":42794877575,"job":129757351999,"artifact":13753555313,"head":"a97c23de034006e383349c8bebfedaf72a906346","tree":"1b3c406cb5d9efd817c3e6241f557b690f4ccc89","sha":"524be2b6deb37de8ecf65bf2e401b6026033fa9d8e3c5afeb6399714809b4899","independentAuditSHA256":"006716cfb39d49447e6a5b4f89eabb94ae6c2633211bb164ab12d0daef92e56a"},"firstFull":{"run":42798378759,"job":129769276486,"artifact":13755069937,"head":"506664e9b04c6d7ffc11c5899b3f557d35a0c19b","tree":"75baceeeee43ed8c09f6986648cb5faf78c3431e","sha":"65d6f160f6498d8587c2e7ed3b4b6873391e8be9ba598daf3a6ba5811196fdf5","rawSHA256":"9dbd2692b62781051be6dcfa644accea93c228f634784d39f00aaed6c67f7398"}};
          const api='repos/PapiSalgueroM/ballpark-hero/actions/';
          const get=x=>JSON.parse(execFileSync('gh',['api',api+x]));
          for(const [role,p] of Object.entries(pins)){
            const run=get('runs/'+p.run), jobs=get('runs/'+p.run+'/jobs?per_page=100').jobs, archive=get('artifacts/'+p.artifact);
            const expected=role==='original'?'success':'failure';
            assert.deepEqual([run.id,run.head_sha,run.head_commit.tree_id,run.status,run.conclusion,run.event,run.run_attempt],
              [p.run,p.head,p.tree,'completed',expected,'push',1]);
            assert.equal(jobs.length,1);
            assert.deepEqual([jobs[0].id,jobs[0].conclusion],[p.job,expected]);
            assert.deepEqual([archive.id,archive.expired,archive.digest,archive.workflow_run.id,archive.workflow_run.head_sha],[p.artifact,false,'sha256:'+p.sha,p.run,p.head]);
          }
          fs.writeFileSync(process.env.EVIDENCE+'/reference-context.json',JSON.stringify(pins,null,2)+'\n',{flag:'wx'});
          NODE
      - name: Normal production build and retained bytes
        id: build
        run: |
          set -euo pipefail
          NODE_OPTIONS="--max-old-space-size=6144" npm run build 2>&1 | tee nba-perfect-season-daily-date-original-layout/build.log
          tar -czf nba-perfect-season-daily-date-original-layout/dist.tgz dist
          sha256sum nba-perfect-season-daily-date-original-layout/dist.tgz > nba-perfect-season-daily-date-original-layout/dist.sha256
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import {createHash} from 'node:crypto';import assert from 'node:assert/strict';
          const walk=dir=>fs.readdirSync(dir,{withFileTypes:true}).sort((a,b)=>a.name.localeCompare(b.name)).flatMap(e=>e.isDirectory()?walk(dir+'/'+e.name):e.isFile()?[dir+'/'+e.name]:[]);
          const rows=walk('dist').map(file=>{const b=fs.readFileSync(file);return {file,bytes:b.length,sha256:createHash('sha256').update(b).digest('hex')};});
          assert.equal(rows.length,850);fs.writeFileSync('nba-perfect-season-daily-date-original-layout/dist-before.json',JSON.stringify(rows));
          NODE
      - name: Isolated pinned Playwright and Chromium
        id: browser_setup
        timeout-minutes: 12
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          python -m pip install fonttools pillow
          npm install --prefix "$RUNNER_TEMP/nba-perfect-season-daily-date-browser" --no-save --package-lock=false playwright@1.64.1 2>&1 | tee nba-perfect-season-daily-date-original-layout/browser-install.log
          test ! -e node_modules/playwright
          ln -s "$RUNNER_TEMP/nba-perfect-season-daily-date-browser/node_modules/playwright" node_modules/playwright
          node "$RUNNER_TEMP/nba-perfect-season-daily-date-browser/node_modules/playwright/cli.js" install --with-deps chromium 2>&1 | tee nba-perfect-season-daily-date-original-layout/chromium-install.log
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const before=JSON.parse(fs.readFileSync('nba-perfect-season-daily-date-original-layout/installed-before.json'));
          const after=before.map(([p])=>[p,JSON.parse(fs.readFileSync(p+'/package.json')).version]);assert.deepEqual(after,before);
          const pw=JSON.parse(fs.readFileSync('node_modules/playwright/package.json'));assert.equal(pw.version,'1.64.1');
          fs.writeFileSync('nba-perfect-season-daily-date-original-layout/installed-after.json',JSON.stringify(after));fs.writeFileSync('nba-perfect-season-daily-date-original-layout/browser-package.json',JSON.stringify({version:pw.version,target:fs.realpathSync('node_modules/playwright')}));
          NODE
      - name: Measure the unchanged NBA draft layout in six native journeys
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.browser_setup.outcome == 'success' }}
        run: |
          set -euo pipefail
          node scripts/lib/hostLikeServer.mjs dist 4174 > "$EVIDENCE/browser-host.log" 2>&1 &
          layout_pid=$!
          trap 'kill "$layout_pid" 2>/dev/null || true' EXIT
          sleep 2
          touch "$EVIDENCE/browser.transport.log"
          status=0
          BASE=http://127.0.0.1:4174 NBA_DAILY_NATIVE_OUT="$EVIDENCE/browser" \
            SIM_OFFLINE_RECEIPT="$EVIDENCE/browser.transport.log" NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" \
            node scripts/qa/playNbaPerfectSeasonDailyDateLayout.mjs > "$EVIDENCE/browser.log" 2>&1 || status=$?
          cat "$EVIDENCE/browser.log"
          printf '%s\n' "$status" > "$EVIDENCE/browser-exit.txt"
          test "$status" -eq 0
          test ! -s "$EVIDENCE/browser.transport.log"
          sha256sum --check "$EVIDENCE/dist.sha256"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          const out=process.env.EVIDENCE;
          const walk=dir=>fs.readdirSync(dir,{withFileTypes:true}).sort((a,b)=>a.name.localeCompare(b.name)).flatMap(e=>e.isDirectory()?walk(dir+'/'+e.name):e.isFile()?[dir+'/'+e.name]:[]);
          const rows=walk('dist').map(file=>{const body=fs.readFileSync(file);return {file,bytes:body.length,sha256:createHash('sha256').update(body).digest('hex')};});
          assert.equal(rows.length,850);
          const before=fs.readFileSync(out+'/dist-before.json','utf8');
          assert.equal(JSON.stringify(rows),before);
          fs.writeFileSync(out+'/dist-after.json',before,{flag:'wx'});
          NODE
      - name: Verify unchanged physical source and locked offline run
        if: always()
        run: |
          set -euo pipefail
          git ls-files -s > "$EVIDENCE/source-after.txt"
          sha256sum package.json package-lock.json > "$EVIDENCE/locks-after.txt"
          cmp "$EVIDENCE/source-before.txt" "$EVIDENCE/source-after.txt"
          cmp "$EVIDENCE/locks-before.txt" "$EVIDENCE/locks-after.txt"
          git diff --exit-code HEAD -- .
          node "$EVIDENCE/physical.mjs" after
          test ! -s "$SIM_OFFLINE_RECEIPT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nba-perfect-season-daily-date-original-layout-${{ github.run_id }}
          path: nba-perfect-season-daily-date-original-layout
          if-no-files-found: error
          retention-days: 30
