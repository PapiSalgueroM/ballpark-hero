name: NBA Perfect Season Daily date clean source and build join
on:
  push:
    branches: [codex/nba-perfect-season-daily-date-clean-join-qa-20261110]
permissions:
  contents: read
  actions: read
jobs:
  closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      TZ: UTC
      SIM_NETWORK: offline
      SIM_OFFLINE_RECEIPT: nba-perfect-season-daily-date-clean-join/offline.log
      NBA_PERFECT_SEASON_DAILY_DATE_REFERENCE_ARTIFACT: '13757929631'
      NBA_PERFECT_SEASON_DAILY_DATE_REFERENCE_RUN: '42805429127'
      NBA_PERFECT_SEASON_DAILY_DATE_REFERENCE_BRANCH: 'codex/nba-perfect-season-daily-date-full-draft-width-retry-qa-20261110'
      NBA_PERFECT_SEASON_DAILY_DATE_REFERENCE_JOB: '129793214377'
      NBA_PERFECT_SEASON_DAILY_DATE_REFERENCE_STEPS: '22'
      NBA_PERFECT_SEASON_DAILY_DATE_REFERENCE_ZIP: '3921015421e9869e62658aea5e7630fbfdf25a1b6074915131a366ec33df5dfe'
      NBA_PERFECT_SEASON_DAILY_DATE_REFERENCE_TAR: '1e96e5f3fec6ecb162821abcb2ae8fb1a530f7b036354209fe29eea61cb7ced2'
      NBA_PERFECT_SEASON_DAILY_DATE_REFERENCE_HEAD: '1c2811600bdcb5ac6add7bdf381b1de7790a59ba'
      NBA_PERFECT_SEASON_DAILY_DATE_REFERENCE_TREE: 'bec0860eeafe1e9f68f04b2937c1c301d3879c50'
      NBA_PERFECT_SEASON_DAILY_DATE_REFERENCE_ZIP_BYTES: '17004086'
      NBA_PERFECT_SEASON_DAILY_DATE_NATIVE_HELPER: '089eadebb2c0f761fcef8c6dfafb98f1bf8cf6be'
      NBA_PERFECT_SEASON_DAILY_DATE_REFERENCE_AUDIT: 'd856449736815145f4e80e0e721f5bcd6478d32e38d9cb229bf7f577b8805a9c'
      NBA_PERFECT_SEASON_DAILY_DATE_FIXED_PAGE_BLOB: '100652f3ed6b50c9fe2fae54e6386d4d6f932769'
      NBA_PERFECT_SEASON_DAILY_DATE_QUALIFIED_PLAN_BLOB: '2c302ff50b614cbe3d08ee6321a213788e74e793'
      NBA_PERFECT_SEASON_DAILY_DATE_QUALIFIED_TEST_BLOB: '7c398ac1ded8cf96d5d0720ca426a2e1fe6ddc92'
      NBA_PERFECT_SEASON_DAILY_DATE_REFERENCE_DIST_MANIFEST: '248665016ab3ce7ceeffab34f2a322f0f72bb15613603d10aa19aa07a3c10154'
      NBA_PERFECT_SEASON_DAILY_DATE_REFERENCE_WORKFLOW: '02faf2c37f610f7cfebcdccd2375c8b7f3306ca2'
      NBA_PERFECT_SEASON_DAILY_DATE_CLEAN_PRODUCT_BASE: '7868fa0995bce7544c28b4776ef6505f585fb969'
      NBA_PERFECT_SEASON_DAILY_DATE_CLEAN_PRODUCT_BASE_TREE: '85f0484c30da21813e77e564d88510d3a796b531'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Locked dependencies and clean source receipts
        run: |
          set -euo pipefail
          if grep -Eq '__[A-Z][A-Z0-9_]*__' .github/workflows/nba-perfect-season-daily-date-20261110.yml; then echo 'Unresolved clean qualification template binding'; exit 1; fi
          [[ "$NBA_PERFECT_SEASON_DAILY_DATE_REFERENCE_ARTIFACT" =~ ^[1-9][0-9]*$ ]]
          [[ "$NBA_PERFECT_SEASON_DAILY_DATE_REFERENCE_RUN" =~ ^[1-9][0-9]*$ ]]
          [[ "$NBA_PERFECT_SEASON_DAILY_DATE_REFERENCE_BRANCH" =~ ^codex/nba-perfect-season-daily-date-[a-z0-9-]+$ ]]
          [[ "$NBA_PERFECT_SEASON_DAILY_DATE_REFERENCE_JOB" =~ ^[1-9][0-9]*$ ]]
          [[ "$NBA_PERFECT_SEASON_DAILY_DATE_REFERENCE_STEPS" =~ ^[1-9][0-9]*$ ]]
          [[ "$NBA_PERFECT_SEASON_DAILY_DATE_REFERENCE_AUDIT" =~ ^[a-f0-9]{64}$ ]]
          [[ "$NBA_PERFECT_SEASON_DAILY_DATE_REFERENCE_ZIP" =~ ^[a-f0-9]{64}$ ]]
          [[ "$NBA_PERFECT_SEASON_DAILY_DATE_REFERENCE_TAR" =~ ^[a-f0-9]{64}$ ]]
          [[ "$NBA_PERFECT_SEASON_DAILY_DATE_REFERENCE_ZIP_BYTES" =~ ^[1-9][0-9]*$ ]]
          [[ "$NBA_PERFECT_SEASON_DAILY_DATE_REFERENCE_DIST_MANIFEST" =~ ^[a-f0-9]{64}$ ]]
          for value in "$NBA_PERFECT_SEASON_DAILY_DATE_REFERENCE_HEAD" "$NBA_PERFECT_SEASON_DAILY_DATE_REFERENCE_TREE" "$NBA_PERFECT_SEASON_DAILY_DATE_NATIVE_HELPER" "$NBA_PERFECT_SEASON_DAILY_DATE_REFERENCE_WORKFLOW" "$NBA_PERFECT_SEASON_DAILY_DATE_FIXED_PAGE_BLOB" "$NBA_PERFECT_SEASON_DAILY_DATE_QUALIFIED_PLAN_BLOB" "$NBA_PERFECT_SEASON_DAILY_DATE_QUALIFIED_TEST_BLOB"; do [[ "$value" =~ ^[a-f0-9]{40}$ ]]; done
          test ! -e nba-perfect-season-daily-date-clean-join
          mkdir nba-perfect-season-daily-date-clean-join
          touch nba-perfect-season-daily-date-clean-join/offline.log
          git rev-parse HEAD > nba-perfect-season-daily-date-clean-join/head.txt
          git rev-parse 'HEAD^{tree}' > nba-perfect-season-daily-date-clean-join/tree.txt
          git ls-files -s > nba-perfect-season-daily-date-clean-join/source-before.txt
          sha256sum package.json package-lock.json > nba-perfect-season-daily-date-clean-join/locks-before.txt
          npm ci 2>&1 | tee nba-perfect-season-daily-date-clean-join/install.log
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const lock=JSON.parse(fs.readFileSync('package-lock.json'));
          const rows=Object.keys(lock.packages).filter(p=>p.startsWith('node_modules/')&&fs.existsSync(p+'/package.json')).map(p=>[p,JSON.parse(fs.readFileSync(p+'/package.json')).version]);
          assert.equal(rows.length,521);for(const[p,v]of rows)assert.equal(v,lock.packages[p].version,p);fs.writeFileSync('nba-perfect-season-daily-date-clean-join/installed-before.json',JSON.stringify(rows));
          NODE
      - name: Proper app types
        run: |
          set -euo pipefail
          node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee nba-perfect-season-daily-date-clean-join/types.log
      - name: Authenticate the completed full reference before extraction
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/PapiSalgueroM/ballpark-hero/actions/runs/$NBA_PERFECT_SEASON_DAILY_DATE_REFERENCE_RUN" > nba-perfect-season-daily-date-clean-join/reference-run.json
          gh api "repos/PapiSalgueroM/ballpark-hero/actions/runs/$NBA_PERFECT_SEASON_DAILY_DATE_REFERENCE_RUN/jobs?per_page=100" > nba-perfect-season-daily-date-clean-join/reference-jobs.json
          gh api "repos/PapiSalgueroM/ballpark-hero/actions/artifacts/$NBA_PERFECT_SEASON_DAILY_DATE_REFERENCE_ARTIFACT" > nba-perfect-season-daily-date-clean-join/reference-artifact.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const env = process.env;
          const read = file => JSON.parse(fs.readFileSync('nba-perfect-season-daily-date-clean-join/' + file));
          const run = read('reference-run.json'), jobs = read('reference-jobs.json').jobs, artifact = read('reference-artifact.json');
          assert.deepEqual(
            [run.id, run.status, run.conclusion, run.event, run.run_attempt, run.path, run.repository.full_name, run.head_sha, run.head_commit.tree_id, run.head_branch],
            [Number(env.NBA_PERFECT_SEASON_DAILY_DATE_REFERENCE_RUN), 'completed', 'success', 'push', 1, '.github/workflows/nba-perfect-season-daily-date-20261110.yml', 'PapiSalgueroM/ballpark-hero', env.NBA_PERFECT_SEASON_DAILY_DATE_REFERENCE_HEAD, env.NBA_PERFECT_SEASON_DAILY_DATE_REFERENCE_TREE, env.NBA_PERFECT_SEASON_DAILY_DATE_REFERENCE_BRANCH],
          );
          assert.equal(jobs.length, 1);
          const [job] = jobs;
          assert.deepEqual([job.id, job.run_id, job.status, job.conclusion, job.head_sha, job.steps.length],
            [Number(env.NBA_PERFECT_SEASON_DAILY_DATE_REFERENCE_JOB), run.id, 'completed', 'success', run.head_sha, Number(env.NBA_PERFECT_SEASON_DAILY_DATE_REFERENCE_STEPS)]);
          assert(job.steps.every(step => step.status === 'completed' && step.conclusion === 'success'));
          assert.deepEqual(
            [artifact.id, artifact.name, artifact.expired, artifact.size_in_bytes, artifact.digest, artifact.workflow_run.id, artifact.workflow_run.head_sha, artifact.workflow_run.head_branch],
            [Number(env.NBA_PERFECT_SEASON_DAILY_DATE_REFERENCE_ARTIFACT), 'nba-perfect-season-daily-date-full-' + run.id, false, Number(env.NBA_PERFECT_SEASON_DAILY_DATE_REFERENCE_ZIP_BYTES), 'sha256:' + env.NBA_PERFECT_SEASON_DAILY_DATE_REFERENCE_ZIP, run.id, run.head_sha, run.head_branch],
          );
          NODE
          gh api "repos/PapiSalgueroM/ballpark-hero/actions/artifacts/$NBA_PERFECT_SEASON_DAILY_DATE_REFERENCE_ARTIFACT/zip" > "$RUNNER_TEMP/nba-perfect-season-daily-date-full-reference.zip"
          test "$(wc -c < "$RUNNER_TEMP/nba-perfect-season-daily-date-full-reference.zip")" -eq "$NBA_PERFECT_SEASON_DAILY_DATE_REFERENCE_ZIP_BYTES"
          echo "$NBA_PERFECT_SEASON_DAILY_DATE_REFERENCE_ZIP  $RUNNER_TEMP/nba-perfect-season-daily-date-full-reference.zip" | sha256sum --check
          unzip -Z1 "$RUNNER_TEMP/nba-perfect-season-daily-date-full-reference.zip" > nba-perfect-season-daily-date-clean-join/reference-zip-entries.txt
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const names = fs.readFileSync('nba-perfect-season-daily-date-clean-join/reference-zip-entries.txt', 'utf8').trimEnd().split('\n');
          assert.equal(new Set(names).size, names.length, 'Unique admitted ZIP paths');
          for (const name of names) {
            assert(name.length && !name.includes('\\') && !name.startsWith('/'), 'Relative ZIP path');
            assert(name.replace(/\/$/, '').split('/').every(part => part && part !== '.' && part !== '..'), 'Safe ZIP path');
          }
          for (const file of ['head.txt', 'tree.txt', 'admission.json', 'unit-admission.json', 'native-admission.json', 'source-join.json', 'source-before.txt', 'source-after.txt', 'tracked-before.json', 'tracked-after.json', 'locks-before.txt', 'locks-after.txt', 'installed-before.json', 'installed-after.json', 'offline.log', 'types.log', 'dist-before.json', 'dist-after.json', 'dist.tgz']) {
            assert(names.includes(file), file + ' required authenticated body');
          }
          NODE
          mkdir "$RUNNER_TEMP/nba-perfect-season-daily-date-full-reference" "$RUNNER_TEMP/nba-perfect-season-daily-date-full-reference-dist"
          unzip -q "$RUNNER_TEMP/nba-perfect-season-daily-date-full-reference.zip" -d "$RUNNER_TEMP/nba-perfect-season-daily-date-full-reference"
          test -z "$(find "$RUNNER_TEMP/nba-perfect-season-daily-date-full-reference" -type l -print -quit)"
          echo "$NBA_PERFECT_SEASON_DAILY_DATE_REFERENCE_TAR  $RUNNER_TEMP/nba-perfect-season-daily-date-full-reference/dist.tgz" | sha256sum --check
          tar -tzf "$RUNNER_TEMP/nba-perfect-season-daily-date-full-reference/dist.tgz" > nba-perfect-season-daily-date-clean-join/reference-tar-entries.txt
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const names = fs.readFileSync('nba-perfect-season-daily-date-clean-join/reference-tar-entries.txt', 'utf8').trimEnd().split('\n');
          assert.equal(new Set(names).size, names.length, 'Unique admitted dist tar paths');
          for (const name of names) {
            assert(name.startsWith('dist/') && !name.includes('\\'), 'Tar stays under dist');
            assert(name.replace(/\/$/, '').split('/').every(part => part && part !== '.' && part !== '..'), 'Safe tar path');
          }
          NODE
          tar -xzf "$RUNNER_TEMP/nba-perfect-season-daily-date-full-reference/dist.tgz" -C "$RUNNER_TEMP/nba-perfect-season-daily-date-full-reference-dist"
          cp "$RUNNER_TEMP/nba-perfect-season-daily-date-full-reference/source-before.txt" nba-perfect-season-daily-date-clean-join/reference-source.txt
      - name: Fresh unchanged product-name fence on clean source
        run: |
          set -euo pipefail
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/simNoRivalNames.mjs 2>&1 | tee nba-perfect-season-daily-date-clean-join/no-rival.log
      - name: Clean production build
        run: |
          set -euo pipefail
          NODE_OPTIONS="--max-old-space-size=6144" npm run build 2>&1 | tee nba-perfect-season-daily-date-clean-join/build.log
      - name: Join exact clean product source and all 850 built files
        id: join
        env:
          NBA_PERFECT_SEASON_DAILY_DATE_REFERENCE_DIR: ${{ runner.temp }}/nba-perfect-season-daily-date-full-reference
          NBA_PERFECT_SEASON_DAILY_DATE_REFERENCE_DIST: ${{ runner.temp }}/nba-perfect-season-daily-date-full-reference-dist/dist
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          const env = process.env;
          const out = 'nba-perfect-season-daily-date-clean-join';
          const ref = env.NBA_PERFECT_SEASON_DAILY_DATE_REFERENCE_DIR;
          const read = file => JSON.parse(fs.readFileSync(path.join(ref, file)));
          const bytes = file => fs.readFileSync(path.join(ref, file));
          const readOutput = file => JSON.parse(fs.readFileSync(path.join(out, file)));
          const sha = bytes => createHash('sha256').update(bytes).digest('hex');
          const blob = bytes => createHash('sha1').update('blob ' + bytes.length + '\0').update(bytes).digest('hex');
          const git = (...args) => execFileSync('git', args, {encoding:'utf8', maxBuffer:16 * 1024 * 1024});
          const workflow = '.github/workflows/nba-perfect-season-daily-date-20261110.yml';
          const helper = 'scripts/qa/playNbaPerfectSeasonDailyDate.mjs';
          const page = 'src/pages/PerfectSeasonNba.tsx';
          const test = 'src/test/perfectSeasonNbaDailyDate.test.tsx';
          const plan = 'docs/plans/2026-11-10-nba-perfect-season-daily-date.md';
          const configs = ['index.html','package.json','package-lock.json','vite.config.ts','tailwind.config.ts','postcss.config.js','tsconfig.json','tsconfig.app.json','tsconfig.node.json','bun.lockb','bun.lock'];
          const sourceScope = file => /^(?:src|public|scripts)\//.test(file);
          const fullOnly = new Set([workflow, helper]);
          const pins = {
            [page]: env.NBA_PERFECT_SEASON_DAILY_DATE_FIXED_PAGE_BLOB,
            [test]: env.NBA_PERFECT_SEASON_DAILY_DATE_QUALIFIED_TEST_BLOB,
            [plan]: env.NBA_PERFECT_SEASON_DAILY_DATE_QUALIFIED_PLAN_BLOB,
            'src/App.tsx':'8bfedf7aaa1d076e0f0c8e2216c7e46632cd8a33',
            'src/data/gameRegistry.ts':'f560b40a74d1468ac72dfde4ee6fec6635a9a255',
            'public/perfect-season-nba/index.html':'5a2d6aa77968adbbd67ee298f30ae865cf9bc4cf',
            'src/lib/perfectSeason.ts':'2acc9b8498e15b53c9eebc87ea45d3dd77ec2de6',
            'src/lib/perfectSeasonNba.ts':'4509bdb6c6026170189ed144ce514340ba3e4090',
            'src/lib/perfectSeasonThemes.ts':'39113aad5dc330ccbd677b4c541a42da974b05e6',
            'src/test/perfectSeasonNbaRetry.test.tsx':'6cf90f7d3bc132de8c463d880c2ad056ec03f854',
            'scripts/lib/offlineTransport.cjs':'0fda542a2649fe5da937c6976fd0f5b6073e74b6',
            'src/lib/dateUtils.ts':'12c9de0ed37b0797492f3e936bcba70bdc03d585',
          };
          const indexRows = (body, separator = '\n') => {
            const rows = body.split(separator).filter(Boolean).map(line => {
              const matched = /^(100(?:644|755)) ([0-9a-f]{40}) 0\t(.+)$/.exec(line);
              assert(matched, 'Actual regular path/mode/blob index tuple');
              return [matched[3], {mode:matched[1], blob:matched[2]}];
            });
            assert.equal(new Set(rows.map(([file]) => file)).size, rows.length, 'Unique index paths');
            return new Map(rows);
          };
          const treeRows = commit => {
            const rows = git('ls-tree', '-r', '-z', commit).split('\0').filter(Boolean).map(line => {
              const matched = /^(100(?:644|755)) blob ([0-9a-f]{40})\t(.+)$/.exec(line);
              assert(matched, 'Actual regular path/mode/blob tree tuple');
              return [matched[3], {mode:matched[1], blob:matched[2]}];
            });
            assert.equal(new Set(rows.map(([file]) => file)).size, rows.length, 'Unique tree paths');
            return new Map(rows);
          };
          const ordered = rows => [...rows].sort(([left],[right]) => left.localeCompare(right));
          const cleanHead = git('rev-parse', 'HEAD').trim(), cleanTree = git('rev-parse', 'HEAD^{tree}').trim();
          assert.deepEqual(git('rev-list', '--parents', '-n', '1', 'HEAD').trim().split(' '), [cleanHead, env.NBA_PERFECT_SEASON_DAILY_DATE_CLEAN_PRODUCT_BASE], 'Clean QA is the direct PR540 child');
          assert.equal(git('rev-parse', env.NBA_PERFECT_SEASON_DAILY_DATE_CLEAN_PRODUCT_BASE + '^{tree}').trim(), env.NBA_PERFECT_SEASON_DAILY_DATE_CLEAN_PRODUCT_BASE_TREE);
          assert.equal(cleanHead, env.GITHUB_SHA);
          assert.equal(fs.readFileSync(out + '/head.txt','utf8').trim(), cleanHead);
          assert.equal(fs.readFileSync(out + '/tree.txt','utf8').trim(), cleanTree);
          const base = treeRows(env.NBA_PERFECT_SEASON_DAILY_DATE_CLEAN_PRODUCT_BASE);
          const current = indexRows(fs.readFileSync(out + '/source-before.txt', 'utf8'));
          const old = indexRows(fs.readFileSync(out + '/reference-source.txt', 'utf8'));
          assert.deepEqual(ordered(indexRows(git('ls-files','--stage','-z'),'\0')), ordered(current));
          assert.deepEqual(ordered(treeRows(cleanHead)), ordered(current), 'Clean index joins exact committed tree tuples');
          assert.deepEqual([base.size,current.size,old.size],[5798,5801,5802]);
          const allowedClean = [page, test, plan, workflow];
          const cleanDelta = [...new Set([...base.keys(), ...current.keys()])].filter(file => {
            const before = base.get(file), after = current.get(file);
            return before?.mode !== after?.mode || before?.blob !== after?.blob;
          }).sort();
          assert.deepEqual(cleanDelta, [...allowedClean].sort(), 'Exactly one Page change and three owned new leaves');
          assert.equal(base.get(page)?.blob, 'edf47ea61379dfd23e6df85266d8954d74b7cdef');
          assert.equal(current.get(page)?.mode, base.get(page)?.mode);
          for (const file of [test, plan, workflow]) assert(!base.has(file) && current.get(file)?.mode === '100644', file + ' exact owned new leaf');
          assert(!current.has(helper), 'Tracked full browser helper is excluded from clean QA');
          assert.equal(old.get(helper)?.blob, env.NBA_PERFECT_SEASON_DAILY_DATE_NATIVE_HELPER);
          assert.equal(old.get(workflow)?.blob, env.NBA_PERFECT_SEASON_DAILY_DATE_REFERENCE_WORKFLOW);
          assert(current.get(workflow)?.blob && current.get(workflow).blob !== old.get(workflow).blob, 'Clean QA uses its own workflow body');
          for (const [file,want] of Object.entries(pins)) {
            assert.equal(current.get(file)?.blob, want, file + ' exact clean pin');
            assert.equal(old.get(file)?.blob, want, file + ' exact full pin');
          }
          const product = (rows, omit) => ordered([...rows].filter(([file]) => !omit.has(file)));
          const cleanProduct = product(current,new Set([workflow]));
          const fullProduct = product(old,fullOnly);
          assert.equal(cleanProduct.length,5800);
          assert.deepEqual(cleanProduct,fullProduct,'All 5800 product path/mode/blob tuples are identical');
          assert.deepEqual([base,current,old].map(rows => [...rows.keys()].filter(sourceScope).length), [4668,4669,4670]);
          const scoped = (rows, omit) => ordered([...rows].filter(([file]) => (sourceScope(file) || configs.includes(file)) && !omit.has(file)));
          const sourceConfigRows = scoped(current,new Set());
          assert.equal(sourceConfigRows.length, 4680);
          assert.deepEqual(sourceConfigRows,scoped(old,fullOnly),'Every 4669 code and 11 root configuration path/mode/blob tuple');
          for (const file of configs) assert(current.has(file) && old.has(file),file + ' required root configuration');
          for (const [file,tuple] of current) {
            const stat = fs.lstatSync(file);
            assert(stat.isFile(),file + ' physical regular source body');
            assert.equal((stat.mode & 0o111) !== 0, tuple.mode === '100755',file + ' physical source executable mode');
            assert.equal(blob(fs.readFileSync(file)),tuple.blob,file + ' physical source bytes join tree');
          }

          const inventory = (directory,prefix = '') => fs.readdirSync(directory,{withFileTypes:true}).sort((a,b) => a.name.localeCompare(b.name)).flatMap(entry => {
            const file = path.join(directory,entry.name);
            const relative = prefix + entry.name;
            if (entry.isDirectory()) return inventory(file,relative + '/');
            assert(entry.isFile(),relative + ' regular dist file');
            const body = fs.readFileSync(file);
            return [{path:relative,bytes:body.length,sha256:sha(body)}];
          });
          const actual = inventory('dist'), reference = inventory(env.NBA_PERFECT_SEASON_DAILY_DATE_REFERENCE_DIST);
          assert.deepEqual([actual.length,reference.length],[850,850]);
          assert.deepEqual(actual,reference,'Every clean built path and byte equals the qualified full build');
          const distManifestSHA256 = sha(JSON.stringify(reference));
          const sortFull = rows => rows.slice().sort((left,right) => left.file.localeCompare(right.file));
          const retainedBefore = sortFull(read('dist-before.json'));
          const retainedAfter = sortFull(read('dist-after.json'));
          assert.deepEqual(retainedBefore,retainedAfter,'Exact full before/after build tuples');
          const fullDistTupleSHA256 = sha(JSON.stringify(retainedAfter));
          assert.equal(fullDistTupleSHA256,env.NBA_PERFECT_SEASON_DAILY_DATE_REFERENCE_DIST_MANIFEST);
          const retainedManifest = retainedBefore.map(row => {
            assert.deepEqual(Object.keys(row).sort(),['bytes','file','sha256']);
            assert(row.file.startsWith('dist/'));
            return {path:row.file.slice(5),bytes:row.bytes,sha256:row.sha256};
          }).sort((left,right) => left.path.localeCompare(right.path));
