          test ! -s "$QA_OUT/transport/control-build.log"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import path from 'node:path';import crypto from 'node:crypto';import assert from 'node:assert/strict';
          const out=process.env.QA_OUT,root=process.env.CONTROL,dist=process.env.CONTROL_DIST,sha=b=>crypto.createHash('sha256').update(b).digest('hex');
          const before=JSON.parse(fs.readFileSync(out+'/control-source-before.json','utf8')),after=Object.fromEntries(Object.keys(before).map(p=>[p,sha(fs.readFileSync(path.join(root,p)))]));
          fs.writeFileSync(out+'/control-source-after-build.json',JSON.stringify(after,null,2)+'\n');assert.deepEqual(after,before,'Control build must preserve all copied source');
          const rows=[];function walk(rel=''){for(const e of fs.readdirSync(path.join(dist,rel),{withFileTypes:true})){const file=path.posix.join(rel,e.name);if(e.isDirectory())walk(file);else{assert(e.isFile());const b=fs.readFileSync(path.join(dist,file));rows.push({file,bytes:b.length,sha256:sha(b)});}}}walk();rows.sort((a,b)=>a.file<b.file?-1:a.file>b.file?1:0);assert(rows.length>100);
          fs.writeFileSync(out+'/control-dist-before.json',JSON.stringify(rows,null,2)+'\n');
