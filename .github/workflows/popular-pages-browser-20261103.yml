          assert.equal(meta.id,Number(process.env.SOURCE_ARTIFACT_ID));assert.equal(meta.expired,false);
          assert.equal(meta.size_in_bytes,Number(process.env.SOURCE_ZIP_BYTES));assert.equal(meta.workflow_run.id,Number(process.env.SOURCE_RUN_ID));assert.equal(meta.workflow_run.head_sha,process.env.BUILT_SOURCE_SHA);
          assert.equal(job.id,Number(process.env.SOURCE_JOB_ID));assert.equal(job.run_id,Number(process.env.SOURCE_RUN_ID));assert.equal(job.head_sha,process.env.BUILT_SOURCE_SHA);
