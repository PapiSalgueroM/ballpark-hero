          const traffic={popular:reports.popular?.contexts??[],frontOffice:reports.fo?.profiles??[],oldAppControl:reports.control?.contexts??[],oldHubControl:reports.oldHub?.contexts??[],inputFragmentControl:reports.inputFragment?.contexts??[],nodeReceipts:fs.existsSync(out+'/transport')?fs.readdirSync(out+'/transport').sort().map(file=>({file,bytes:fs.statSync(out+'/transport/'+file).size,blockedAttempts:fs.readFileSync(out+'/transport/'+file,'utf8').split('\n').filter(Boolean).length})):[],meaning:'Every browser request/response/refusal/console/pageerror remains in these raw rows and original reports. Empty Node receipts do not mean zero browser traffic. No provider, actual-font or all-protocol availability claim. Root must classify all actual FO console and request events.'};
          fs.writeFileSync(out+'/transport-summary.json',JSON.stringify(traffic,null,2)+'\n');
          const photos=[];for(const family of ['popular','fo','control-browser','old-hub-browser','input-fragment-browser'])if(fs.existsSync(out+'/'+family))for(const file of fs.readdirSync(out+'/'+family).filter(p=>p.endsWith('.png')).sort()){const b=fs.readFileSync(out+'/'+family+'/'+file);photos.push({family,file,bytes:b.length,sha256:sha(b),diagnostic:file.includes('failure'),oldAppControl:family==='control-browser'});}
          fs.writeFileSync(out+'/photo-inventory.json',JSON.stringify(photos,null,2)+'\n');
          const compare=(a,b)=>a<b?-1:a>b?1:0;
          function rows(dir){const found=[];function walk(rel=''){for(const e of fs.readdirSync(path.join(dir,rel),{withFileTypes:true})){const file=path.posix.join(rel,e.name);if(e.isDirectory())walk(file);else{assert(e.isFile(),'Only ordinary payload files');const b=fs.readFileSync(path.join(dir,file));found.push({file,bytes:b.length,sha256:sha(b)});}}}walk();return found.sort((a,b)=>compare(a.file,b.file));}
          const tracked=execFileSync('git',['ls-files','-z']).toString().split('\0').filter(Boolean).sort(),after=Object.fromEntries(tracked.map(p=>[p,sha(fs.readFileSync(p))]));
          fs.writeFileSync(out+'/source-after.json',JSON.stringify(after,null,2)+'\n');
          fs.writeFileSync(out+'/source-diff.txt',execFileSync('git',['diff','HEAD']));
          fs.writeFileSync(out+'/status-after.txt',execFileSync('git',['status','--porcelain=v1','--untracked-files=all']));
          const sourceHeld=check('All original and temporary source',()=>{const before=read(out+'/source-before.json');assert(before);assert.equal(tracked.length,5679);assert.deepEqual(after,before);assert.equal(fs.statSync(out+'/source-diff.txt').size,0);assert.equal(fs.statSync(out+'/status-after.txt').size,0);});
          const completedTarHeld=check('Original completed tar',()=>{assert.equal(sha(fs.readFileSync(out+'/completed-dist.tar.gz')),process.env.DIST_TAR_SHA256);assert.equal(fs.statSync(out+'/completed-dist.tar.gz').size,Number(process.env.DIST_TAR_BYTES));});
          const distHeld=check('Every normal completed payload',()=>{const before=read(out+'/carrier/dist-manifest.json');assert(before);const actual=rows('dist');fs.writeFileSync(out+'/dist-after.json',JSON.stringify(actual,null,2)+'\n');assert.deepEqual(actual,before);});
          const fixtureHolds={};for(const family of ['popular','fo','control','old-hub','input-fragment']){
            fixtureHolds[family]=check(family+' fixture bytes',()=>{const dir=out+'/fixtures-'+family;assert(fs.existsSync(dir));const actual=rows(dir);fs.writeFileSync(out+'/fixtures-'+family+'-after.json',JSON.stringify(actual,null,2)+'\n');
              const manifest=read(dir+'/manifest.json');assert(manifest);const bundle=fs.readFileSync(path.join(dir,manifest.bundle));assert.equal(sha(bundle),manifest.bundleSHA);
              const checksum=family==='control'?out+'/control-fixtures-before.sha256':['old-hub','input-fragment'].includes(family)?out+'/'+family+'-fixtures-before.sha256':out+'/fixtures-before.sha256';assert(fs.existsSync(checksum));const entries=fs.readFileSync(checksum,'utf8').trim().split('\n').map(line=>{const m=/^([a-f0-9]{64})  (.+)$/.exec(line);assert(m);return {file:m[2],digest:m[1]};}).filter(r=>r.file.startsWith(dir+'/'));
              assert.equal(entries.length,actual.length);for(const row of entries)assert.equal(sha(fs.readFileSync(row.file)),row.digest,row.file);
            });
          }
          const controlSourceHeld=check('Physical old-App source',()=>{const before=read(out+'/control-source-before.json');assert(before);const current=Object.fromEntries(Object.keys(before).map(p=>[p,sha(fs.readFileSync(path.join(process.env.CONTROL,p)))]));fs.writeFileSync(out+'/control-source-after.json',JSON.stringify(current,null,2)+'\n');assert.deepEqual(current,before);assert.deepEqual(read(out+'/control-source-after-build.json'),before);});
          const controlPayloadHeld=check('Control completed payload and retained tar',()=>{const before=read(out+'/control-dist-before.json');assert(before);const actual=rows(process.env.CONTROL_DIST);fs.writeFileSync(out+'/control-dist-after.json',JSON.stringify(actual,null,2)+'\n');assert.deepEqual(actual,before);
            const tar=fs.readFileSync(out+'/control-completed-dist.tar.gz'),record=fs.readFileSync(out+'/control-completed-dist.tar.gz.sha256','utf8').trim().split(/\s+/)[0];assert.equal(sha(tar),record);
            fs.writeFileSync(out+'/control-completed-dist-association.json',JSON.stringify({source:process.env.GITHUB_SHA,originalApp:'79da1b8cf2de7870ea216703d0a1a56fceb69673',fileCount:actual.length,distDigest:sha(JSON.stringify(actual)),tarBytes:tar.length,tarSHA256:sha(tar),normalDistAltered:false},null,2)+'\n');
          });
          check('All nine unchanged Hub static modes',()=>{
            const admission=read(out+'/hub-static-admission.json'),retention=read(out+'/hub-static-retention.json');assert(admission&&retention);assert.equal(admission.status,'passed');assert.equal(admission.modes,9);assert.equal(admission.effectiveControls,8);assert.equal(retention.present,true);
            assert.equal(Number(fs.readFileSync(out+'/hub-static.exit','utf8')),0);assert.deepEqual(rows(out+'/hub-static'),retention.retained);assert.deepEqual(retention.retained,retention.original);assert.deepEqual(rows(path.resolve('sport-hubs-artifacts/behavior')),retention.original);
          });
          const hubControlHolds={};
          for(const mode of ['old-hub','input-fragment']){
            const sourceHeld=check(mode+' physical source',()=>{
              const association=read(out+'/'+mode+'-source-association.json'),before=read(out+'/'+mode+'-source-before.json');assert(association&&before);assert.equal(association.mode,mode);
              const root=path.join(process.env.RUNNER_TEMP,'popular-hub-controls',mode,'source');assert.equal(association.root,root);
              const actual=Object.fromEntries(Object.keys(before).map(p=>[p,sha(fs.readFileSync(path.join(root,p)))]));fs.writeFileSync(out+'/'+mode+'-source-after.json',JSON.stringify(actual,null,2)+'\n');assert.deepEqual(actual,before);assert.deepEqual(read(out+'/'+mode+'-source-after-build.json'),before);
              assert.equal(sha(fs.readFileSync(out+'/'+mode+'-sources/HubExperience.tsx')),before['src/components/hub/HubExperience.tsx']);assert.equal(sha(fs.readFileSync(out+'/'+mode+'-sources/popularPagesFixtures.mjs')),before['scripts/qa/popularPagesFixtures.mjs']);
              const normal=read(out+'/source-before.json');assert.deepEqual(Object.keys(before).filter(p=>before[p]!==normal[p]).sort(),['src/components/hub/HubExperience.tsx','scripts/qa/popularPagesFixtures.mjs'].sort());
            });
            const payloadHeld=check(mode+' payload and tar',()=>{
              const dist=path.join(process.env.RUNNER_TEMP,'popular-hub-controls',mode,'dist'),before=read(out+'/'+mode+'-dist-before.json');assert(before);const actual=rows(dist);fs.writeFileSync(out+'/'+mode+'-dist-after.json',JSON.stringify(actual,null,2)+'\n');assert.deepEqual(actual,before);
              const tar=fs.readFileSync(out+'/'+mode+'-completed-dist.tar.gz'),record=fs.readFileSync(out+'/'+mode+'-completed-dist.tar.gz.sha256','utf8').trim().split(/\s+/)[0];assert.equal(sha(tar),record);
              fs.writeFileSync(out+'/'+mode+'-completed-dist-association.json',JSON.stringify({mode,source:process.env.GITHUB_SHA,fileCount:actual.length,distDigest:sha(JSON.stringify(actual)),tarBytes:tar.length,tarSHA256:sha(tar),normalDistAltered:false},null,2)+'\n');
            });
            check(mode+' independent fixture bridge',()=>{const bridge=read(out+'/'+mode+'-fixture-bridge.json');assert(bridge);assert.equal(bridge.normalSeedBytesHeld,true);assert.equal(bridge.hubCatalogAndExpectedVectorsHeld,true);});
            hubControlHolds[mode]={sourceHeld,payloadHeld};
          }
          for(const[file,prefix]of[['normal-admission.json','Normal36'],['control-admission.json','Physical old-App'],['old-hub-admission.json','Physical whole old-Hub'],['input-fragment-admission.json','Physical InputEvent fragment']])check(prefix+' actual admission',()=>{assert(read(out+'/'+file));});
          for(const file of fs.existsSync(out+'/transport')?fs.readdirSync(out+'/transport'):[])check('Node receipt '+file,()=>assert.equal(fs.statSync(out+'/transport/'+file).size,0));
          fs.writeFileSync(out+'/closure.json',JSON.stringify({sourceHeld,completedTarHeld,distHeld,fixtureHolds,controlSourceHeld,controlPayloadHeld,hubControlHolds,errors,sourceEntries:tracked.length,normalRebuild:false,controlBuildSeparate:true,separateControlBuilds:3,temporaryControlWorkspaceArchived:false},null,2)+'\n');
          assert.deepEqual(errors,[],'Every source, fixture, compiled-payload and actual-result closure must hold');
          NODE
      - name: Bound retained native App evidence
        id: artifact
        if: always()
        run: |
          set -euo pipefail
          test -d "$QA_OUT"
          test "$(du -sb "$QA_OUT" | cut -f1)" -lt 150000000
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.artifact.outputs.ready == 'true' }}
        with:
          name: popular-pages-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/popular-pages-browser
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
