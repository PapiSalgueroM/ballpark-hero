          import fs from 'node:fs';import assert from 'node:assert/strict';import crypto from 'node:crypto';
          const out=process.env.QA_OUT,popular=JSON.parse(fs.readFileSync(out+'/popular/report.json','utf8')),fo=JSON.parse(fs.readFileSync(out+'/fo/report.json','utf8'));
          assert.equal(popular.status,'pass');assert.equal(popular.scope,'all');assert.equal(popular.expectedContexts,32);assert.equal(popular.sourceHeld,true);assert.equal(popular.distHeld,true);
          const widths=[320,390,430,1440],ids=[],popularPhotos=[];
          for(const width of widths){
            for(const route of ['soccer','pro-basketball','pro-football']){ids.push('hub-'+route+'-'+width);popularPhotos.push('hub-'+route+'-'+width+'-returned.png');}
            ids.push('home-'+width);popularPhotos.push('home-'+width+'-fold.png','home-'+width+'-home-return.png');
            for(const game of ['nba','nfl']){ids.push(game+'-'+width);popularPhotos.push(game+'-'+width+'-reloaded.png');}
            for(const room of ['stadium','league']){ids.push('stadium-'+room+'-'+width);popularPhotos.push('stadium-'+room+'-'+width+'-refused.png');}
          }
          assert.deepEqual(popular.contexts.map(r=>r.id).sort(),ids.sort());assert.equal(popular.contexts.length,32);
          for(const row of popular.contexts){assert.equal(row.status,'pass');for(const field of ['pageErrors','unexpectedConsoleErrors','undeclaredOrigins','undeclaredWebSockets'])assert.deepEqual(row[field],[],row.id+' '+field);}
          assert.deepEqual([...popular.screenshots].sort(),popularPhotos.sort());assert.equal(popularPhotos.length,36);
          assert.equal(fo.status,'passed');for(const field of ['sourceHeld','sourceStatusHeld','distHeld','fixturesHeld'])assert.equal(fo[field],true,field);
          assert.deepEqual(fo.inputOverrides,{storage:false,rng:false,clock:false});assert.deepEqual(fo.profiles.map(r=>r.width),widths);assert.equal(fo.normalPhotos,8);
          for(const row of fo.profiles){
            assert.equal(row.status,'passed');assert.deepEqual(row.pageErrors,[]);assert.deepEqual(row.cleanupErrors,[]);
            assert.equal(row.refused.oldBytesHeld,true);assert.equal(row.refused.targetGoneFromLiveRoster,true);assert.ok(row.refused.quotaEvents.length>0);
            assert.equal(row.failedRetry.oldBytesHeld,true);assert.equal(row.failedRetry.warningHeld,true);assert.ok(row.failedRetry.quotaEvents.length>0);
            assert.equal(row.accepted.exactExpectedLeague,true);assert.equal(row.accepted.otherStorageHeld,true);assert.equal(row.accepted.noticeGone,true);assert.equal(row.accepted.globalsHeld,true);
            assert.equal(row.reloaded.exactSavedBytesHeld,true);assert.equal(row.reloaded.targetStillAbsent,true);assert.equal(row.reloaded.otherStorageHeld,true);assert.equal(row.reloaded.nativeGlobalsHeld,true);
            assert.equal(row.clipControl.effective,true);assert.equal(row.clipControl.exactInlineStyleRestored,true);assert.equal(row.clipControl.allStorageHeld,true);
          }
          const foPhotos=widths.flatMap(w=>[w+'-warning.png',w+'-reloaded.png']).sort();assert.deepEqual(fo.screenshots.map(r=>r.file).sort(),foPhotos);assert.ok(fo.screenshots.every(r=>r.kind==='normal'));
          const photos=[];for(const[family,names]of[['popular',popularPhotos],['fo',foPhotos]])for(const file of names){const b=fs.readFileSync(out+'/'+family+'/'+file);assert(b.length>1000);assert.equal(b.subarray(0,8).toString('hex'),'89504e470d0a1a0a');photos.push({family,file,bytes:b.length,sha256:crypto.createHash('sha256').update(b).digest('hex')});}
          assert.equal(photos.length,44);
          fs.writeFileSync(out+'/normal-admission.json',JSON.stringify({status:'passed',contexts:36,popularContexts:32,frontOfficeContexts:4,normalPhotographs:44,frontOfficeEffectiveClipControls:4,photos,limits:'Source-bound fictional real-engine saves and native guest actions on one completed build. Every original image and raw console/transport event still requires Root review. No natural progression, original stat-loss reproduction, actual-font, all-protocol/provider availability, full-suite or public release credit.'},null,2)+'\n');
          NODE
      - name: Build and run the isolated whole-original App scroll control
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
