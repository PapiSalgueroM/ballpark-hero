name: Popular pages actual App on the qualified completed build
on:
  push:
    branches: [codex/popular-pages-browser-20261103]
permissions:
  contents: read
  actions: read
concurrency:
  group: popular-pages-browser-${{ github.ref }}
  cancel-in-progress: false
jobs:
  actual-app:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: '1'
      SIM_NETWORK: offline
      ENGINES: chromium
