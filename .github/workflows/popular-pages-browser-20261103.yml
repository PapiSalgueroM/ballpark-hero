          test "$(stat -c%s "$ZIP")" = "$SOURCE_ZIP_BYTES"
          echo "$SOURCE_ZIP_SHA256  $ZIP" | sha256sum --check
          unzip -q "$ZIP" -d "$PRIOR"
          test "$(stat -c%s "$PRIOR/completed-dist.tar.gz")" = "$DIST_TAR_BYTES"
          echo "$DIST_TAR_SHA256  $PRIOR/completed-dist.tar.gz" | sha256sum --check
          echo "$DIST_MANIFEST_SHA256  $PRIOR/dist-manifest.json" | sha256sum --check
          git fetch --no-tags --depth=2 origin "$BUILT_SOURCE_SHA"
          git fetch --no-tags --depth=1 origin c176be815dc4af57dfd7185a485e28357aa0d41e
          test "$(git rev-parse "$BUILT_SOURCE_SHA^{tree}")" = "$BUILT_TREE_SHA"
          git cat-file blob 79da1b8cf2de7870ea216703d0a1a56fceb69673 > "$OUT/control-original-App.tsx"
          test "$(git hash-object "$OUT/control-original-App.tsx")" = 79da1b8cf2de7870ea216703d0a1a56fceb69673
          git fetch --no-tags --depth=1 origin 5160b26a423e7502c296770e821a995320aa1a32
          git cat-file blob c72effc5697ec0d2812569479a9d465247855720 > "$OUT/control-original-HubExperience.tsx"
