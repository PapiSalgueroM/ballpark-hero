          for item in QA_OUT QA_PRIOR CONTROL CONTROL_DIST; do
            case "$item" in QA_OUT) value="$OUT";; QA_PRIOR) value="$PRIOR";; CONTROL) value="$CONTROL";; CONTROL_DIST) value="$CONTROL_DIST";; esac
            echo "$item=$value" >> "$GITHUB_ENV"
