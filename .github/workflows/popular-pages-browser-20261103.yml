name: Popular pages App and three separate physical controls on the qualified completed build
on:
  push:
    branches: [codex/popular-pages-browser-20261103]
permissions:
  contents: read
  actions: read
concurrency:
  group: popular-pages-browser-${{ github.ref }}
  cancel-in-progress: false
jobs:
  actual-app:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    env:
      CI: '1'
      SIM_NETWORK: offline
      ENGINES: chromium
      PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
      BUILT_SOURCE_SHA: '9759760b59d3a86c11bf18e092e39e7dd00b276b'
      BUILT_TREE_SHA: '1a8dd1c1a69033b722cfe53d367082e1d146d7de'
      FINAL_CORE_SHA: '8d21ecf157933a20b8e2c3a5eed3afda30cde444'
      FINAL_CORE_TREE: 'c8c3bad9b2f4e2bdfcba6f4cb04f8d56181e370a'
      SOURCE_WORKFLOW_PATH: '.github/workflows/popular-pages-build-20261103.yml'
      SOURCE_ARTIFACT_ID: '13279378398'
      SOURCE_RUN_ID: '41738299764'
      SOURCE_JOB_ID: '126273090473'
      SOURCE_ZIP_BYTES: '7746935'
      SOURCE_ZIP_SHA256: 'e61c7f44d8cd6d4c848b13a44b007cc4999176402215734a30ec0fbb4f83da05'
      DIST_TAR_BYTES: '6959357'
      DIST_TAR_SHA256: 'dee01039ff45af691d899eb69bfcfbe9097048c0818aa5b36aa9353795b24cac'
      DIST_MANIFEST_SHA256: 'd7a092d63d8df65aa71e7dcebeb115f0e245b69bd3e0349c9f862d33ba9cd9ca'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Bind the actual qualified carrier and exact completed payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/popular-pages-browser"
