          assert.deepEqual(report.screenshots,['hub-soccer-320-failure.png']);
          fs.writeFileSync(out+'/control-admission.json',JSON.stringify({status:'owned-control-rejected',nativeExit:1,marker:'POPULAR_APP_HUB_FIRST_REPLACE_SCROLL',context:row.id,firstReplace:row.firstReplace,otherFaults:0,normalPassCredit:false,scope:'Whole old App on separate fresh compiled output. Same catalog and document height assertions passed before the owned scroll assertion. The normal completed build is untouched.'},null,2)+'\n');
