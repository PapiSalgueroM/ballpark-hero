          for(const[p,expected]of Object.entries(binding.pins))assert.equal(blob(fs.readFileSync(path.join(root,p))),p==='src/App.tsx'?'79da1b8cf2de7870ea216703d0a1a56fceb69673':expected,p+' whole 58-pin bridge');
          fs.symlinkSync(path.resolve('node_modules'),path.join(root,'node_modules'),'dir');
          fs.writeFileSync(out+'/control-source-before.json',JSON.stringify(map,null,2)+'\n');
          fs.writeFileSync(out+'/control-source-association.json',JSON.stringify({normalSource:process.env.GITHUB_SHA,normalBuild:process.env.BUILT_SOURCE_SHA,normalApp:binding.pins['src/App.tsx'],physicalOriginalApp:'79da1b8cf2de7870ea216703d0a1a56fceb69673',allTrackedCopied:tracked.length,changedPaths:['src/App.tsx'],heldFeaturePins:57,build:'Separate Vite output only, not the normal completed dist. No minified patch or altered product callback.'},null,2)+'\n');
