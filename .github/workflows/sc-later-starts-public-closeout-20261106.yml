          npm install --prefix "$tools" --package-lock=false --no-audit --no-fund jsdom@20.0.3 playwright@1.64.0 > "$QA_OUT/logs/http-tools-install.log" 2>&1
          native_exit=$?
          printf '%s\n' "$native_exit" > "$QA_OUT/logs/http-tools-install.exit" || exit 1
