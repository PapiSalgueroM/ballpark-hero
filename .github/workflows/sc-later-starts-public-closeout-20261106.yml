      - name: Retain exact delivered HTML declarations and compiled bodies
        shell: bash
        run: |
          set +e
          set -uo pipefail
          node --input-type=module <<'HTTP'
          import fs from 'node:fs';import path from 'node:path';import{createHash}from'node:crypto';import assert from 'node:assert/strict';
          const e=process.env,out=e.QA_OUT,origin='https://douknowball.com',pins=JSON.parse(fs.readFileSync(out+'/delivery-bindings.json')),sha=b=>createHash('sha256').update(b).digest('hex');
          const report={schema:'SC_LATER_PUBLIC_HTTP_DELIVERY_V1',status:'failed',origin,product:{commit:e.PRODUCT_CORE,tree:e.PRODUCT_TREE},main:e.MAIN_CORE,deployment:e.DEPLOYMENT,bindings:pins,readiness:[],responses:[],controls:[],scope:'Raw root and Soccer Career HTML declarations plus the exact native-observed and route-owner compiled asset census. No browser gameplay, host-script execution, full HTML equality or new model qualification.'};
          const save=(name,bytes)=>fs.writeFileSync(out+'/'+name,bytes,{flag:'wx'}),json=(name,value)=>save(name,JSON.stringify(value,null,2)+'\n');
          async function capture(route,label){
           const row={path:route,label,started:new Date().toISOString()};report.responses.push(row);
           try{const response=await fetch(origin+route,{method:'GET',cache:'no-store',redirect:'error',signal:AbortSignal.timeout(15000)}),body=Buffer.from(await response.arrayBuffer());Object.assign(row,{status:response.status,url:response.url,headers:Object.fromEntries(response.headers),file:label+'.body',bytes:body.length,sha256:sha(body)});save(row.file,body);assert.equal(row.url,origin+route,'PUBLIC_EXACT_RESPONSE_URL');return{row,body};}
           catch(error){row.error=String(error.stack??error);throw error;}finally{row.finished=new Date().toISOString();json(label+'.json',row);}
          }
          function deployment(row){assert.equal(row.status,200,'PUBLIC_HTTP_STATUS');assert((row.headers['x-deployment-id']??'').split('.').includes(e.DEPLOYMENT),'PUBLIC_EXPECTED_DEPLOYMENT');}
          function shape(body){
           const html=body.toString('utf8').replace(/<!--[\s\S]*?-->/g,''),attrs=s=>Object.fromEntries([...s.matchAll(/([^\s=/>]+)(?:\s*=\s*(?:"([^"]*)"|'([^']*)'|([^\s"'=<>]+)))?/g)].map(m=>[m[1].toLowerCase(),m[2]??m[3]??m[4]??'']));
           const scripts=[...html.matchAll(/<script\b([^>]*)>[\s\S]*?<\/script\s*>/gi)].map(m=>({tag:m[0],a:attrs(m[1])})),staticHTML=html.replace(/<script\b[^>]*>[\s\S]*?<\/script\s*>/gi,'').replace(/<style\b[^>]*>[\s\S]*?<\/style\s*>/gi,''),links=[...staticHTML.matchAll(/<link\b([^>]*)>/gi)].map(m=>attrs(m[1]));
           const modules=scripts.filter(s=>s.a.type==='module'&&(s.a.src??'').startsWith('/assets/')),styles=links.filter(a=>(a.rel??'').split(/\s+/).includes('stylesheet')&&(a.href??'').startsWith('/assets/')),boots=scripts.filter(s=>s.a.src==='/prerender-boot.js');
           return{modules:modules.map(s=>s.a.src),styles:styles.map(a=>a.href),boots:boots.map(s=>({src:s.a.src,defer:Object.hasOwn(s.a,'defer')})),moduleTag:modules.length===1?modules[0].tag:null};
          }
          const routes=[['ROOT','/','index.html'],['SC','/soccer-career','soccer-career/index.html']];
          const references=Object.fromEntries(routes.map(([kind,,file])=>{const value=shape(fs.readFileSync(path.join(e.QA_DIST,file)));assert.deepEqual(value.modules,['/'+pins.entry],'PUBLIC_REFERENCE_ENTRY');assert(value.styles.length>0&&value.styles.every(value=>value==='/'+pins.stylesheet),'PUBLIC_REFERENCE_CSS');if(kind!=='ROOT')assert.deepEqual(value.boots,[{src:'/prerender-boot.js',defer:true}],'PUBLIC_REFERENCE_BOOT');return[kind,value];}));
          function declarations(body,kind){const value=shape(body),reference=references[kind];for(const key of['modules','styles','boots'])assert.deepEqual(value[key],reference[key],'PUBLIC_'+kind+'_DECLARATIONS');return value;}
          function bodyMatches(body,pin){assert.equal(body.length,pin.bytes,'PUBLIC_COMPILED_BODY');assert.equal(sha(body),pin.sha256,'PUBLIC_COMPILED_BODY');}
          function rejected(label,marker,fn){let error;try{fn();}catch(found){error=found;}assert(error instanceof assert.AssertionError,'PUBLIC_CONTROL_REJECTED '+label);assert(error.message.startsWith(marker),'PUBLIC_CONTROL_OWNED '+label);report.controls.push({label,owned:{name:error.name,message:error.message},changed:true,wholeInverseExact:true});}
          try{
           let root;
           for(let i=1;i<=8;i++){const attempt={attempt:i};report.readiness.push(attempt);try{const value=await capture('/','root-attempt-'+i);deployment(value.row);attempt.declarations=declarations(value.body,'ROOT');attempt.ready=true;root=value;break;}catch(error){attempt.error=String(error.message??error);}if(i<8)await new Promise(resolve=>setTimeout(resolve,3000));}
           assert(root,'PUBLIC_ROOT_READINESS_EXHAUSTED');
           for(const[kind,route]of routes.slice(1)){const value=await capture(route,kind.toLowerCase());deployment(value.row);value.row.declarations=declarations(value.body,kind);json(kind.toLowerCase()+'-declarations.json',value.row.declarations);}
