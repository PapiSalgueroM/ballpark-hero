      QUALIFICATION_REQUIRED_FILES: '["workflow.yml","source-role.json","qualification.json","HISTORICAL-RAW-ADMISSION.json","historical-candidate-raw/later-ui-2010.json","historical-candidate-raw/later-ui-2015.json","source-before.sha256","source-after.sha256","index-before.txt","index-after.txt","locks-before.sha256","locks-after.sha256","status-before.txt","status-after.txt","baseline-source-before.sha256","baseline-source-after.sha256","baseline-index-before.txt","baseline-index-after.txt","baseline-locks-before.sha256","baseline-locks-after.sha256","baseline-status-before.txt","baseline-status-after.txt","dist-before.sha256","dist-after.sha256","completed-dist.tar.gz","completed-dist.tar.gz.sha256","completed-dist-members.txt","build-passed.json","types.exit","types-passed.json","logs/types.log","transport/types.log","logs/historical-baseline.exit","logs/historical-baseline.log","transport/historical-baseline.log","logs/historical-candidate.exit","logs/historical-candidate.log","transport/historical-candidate.log","logs/historical-shared-raw-admission.exit","logs/historical-shared-raw-admission.log","transport/historical-shared-raw-admission.log","manifest.sha256","MODEL-OUTCOMES.json"]'
      NATIVE_REQUIRED_FILES: '["workflow.yml","input/native-manifest.json","browser/report.json","native-admission.json","source-dist-input-held.json","source-before.sha256","source-after.sha256","index-before.txt","index-after.txt","status-before.txt","status-after.txt","all-locks-before.json","all-locks-after.json","logs/native-admission.exit","logs/browser.exit","logs/final-source-holds.exit","screenshots.json"]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.2'
      - name: Bind one QA workflow on the actual published merge
        shell: bash
        run: |
          set -euo pipefail
          QA_OUT="$RUNNER_TEMP/sc-later-starts-public-closeout"
          QA_REF="$RUNNER_TEMP/sc-later-starts-public-closeout-inputs"
          QA_DIST="$RUNNER_TEMP/sc-later-starts-public-closeout-dist"
          export QA_OUT QA_REF QA_DIST
          test ! -e "$QA_OUT"
          test ! -e "$QA_REF"
          test ! -e "$QA_DIST"
          mkdir -p "$QA_OUT"/{input,logs} "$QA_REF" "$QA_DIST"
          printf 'QA_OUT=%s\nQA_REF=%s\nQA_DIST=%s\n' "$QA_OUT" "$QA_REF" "$QA_DIST" >> "$GITHUB_ENV"
          node --input-type=module <<'BIND'
          import fs from 'node:fs';import assert from 'node:assert/strict';import{execFileSync}from'node:child_process';
          const e=process.env,git=(...args)=>execFileSync('git',args,{encoding:'utf8'}).trim();
          for(const key of['MAIN_CORE','PRODUCT_CORE','PRODUCT_TREE'])assert.match(e[key],/^[a-f0-9]{40}$/,key);
          assert.match(e.DEPLOYMENT,/^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$/);
          for(const key of['QUALIFICATION_INPUT','NATIVE_INPUT','PRODUCT_FILES','DELIVERY_BINDINGS'])assert(!e[key].includes('MUST_BIND'),'PUBLIC_ALL_ACTUAL_FIELDS_BOUND '+key);
          assert.equal(git('rev-parse','HEAD^'),e.MAIN_CORE);assert.equal(git('rev-parse','HEAD^^{tree}'),e.PRODUCT_TREE);
          assert.equal(git('diff','--name-status','--no-renames','HEAD^','HEAD'),'A\t'+e.PUBLIC_WORKFLOW);
          const vector=object=>Object.fromEntries(git('ls-tree','-r','--full-tree',object).split('\n').filter(Boolean).map(line=>{const m=/^([0-7]{6}) (blob|commit) ([a-f0-9]{40})\t(.+)$/.exec(line);assert(m);return[m[4],{mode:m[1],type:m[2],sha:m[3]}];})),current=vector('HEAD'),parent=vector('HEAD^');
          assert.equal(parent[e.PUBLIC_WORKFLOW],undefined);assert.equal(current[e.PUBLIC_WORKFLOW].mode,'100644');assert.equal(current[e.PUBLIC_WORKFLOW].type,'blob');delete current[e.PUBLIC_WORKFLOW];assert.deepEqual(current,parent,'PUBLIC_SOLE_WORKFLOW_WHOLE_TREE_INVERSE');
          assert.equal(git('status','--porcelain=v1','--untracked-files=all'),'');
          fs.copyFileSync(e.PUBLIC_WORKFLOW,e.QA_OUT+'/workflow.yml');
          fs.writeFileSync(e.QA_OUT+'/qa-delta.json',JSON.stringify({main:e.MAIN_CORE,product:e.PRODUCT_CORE,tree:e.PRODUCT_TREE,qa:{commit:git('rev-parse','HEAD'),tree:git('rev-parse','HEAD^{tree}')},soleAddition:e.PUBLIC_WORKFLOW,workflowBlob:git('hash-object',e.PUBLIC_WORKFLOW),wholeSourceInverse:true,AppBuilds:0,gameplay:false,deployActions:0},null,2)+'\n',{flag:'wx'});
          BIND
          git ls-files -z > "$QA_OUT/tracked-before.bin"
          git ls-files -z | xargs -0 sha256sum > "$QA_OUT/source-before.sha256"
          git ls-files -s > "$QA_OUT/index-before.txt"
          git status --porcelain=v1 --untracked-files=all > "$QA_OUT/status-before.txt"
          test ! -s "$QA_OUT/status-before.txt"
          cp package-lock.json "$QA_OUT/lock-before.json"
          node --input-type=module -e 'import fs from "node:fs";import crypto from "node:crypto";const sha=b=>crypto.createHash("sha256").update(b).digest("hex");fs.writeFileSync(process.env.QA_OUT+"/all-locks-before.json",JSON.stringify(Object.fromEntries(["package.json","package-lock.json","bun.lock","bun.lockb","yarn.lock","pnpm-lock.yaml"].map(p=>[p,fs.existsSync(p)?sha(fs.readFileSync(p)):null])))+"\n");'
      - name: Materialize the pinned native admission source block
        shell: bash
        run: |
          set -euo pipefail
          block="$QA_OUT/input/native-input-auth.mjs"
          test ! -e "$block"
          cat > "$block" <<'NATIVE_AUTH'
          const ns=json(observed.root,'source-dist-input-held.json'),nm=json(observed.root,'input/native-manifest.json'),nr=json(observed.root,'browser/report.json'),na=json(observed.root,'native-admission.json');
          assert.equal(ns.status,'SOURCE_INDEX_LOCKS_INPUT_AND_DIST_HELD');
          assert.equal(nm.schema,'SC_LATER_NATIVE_SOURCE_DIST_V1');assert.equal(nm.status,'QUALIFIED_BUILD_AND_REACT_UI_FIXTURES_BOUND');assert.deepEqual(nm.product,product);assert.equal(nm.distDigest,q.distDigest);
          assert.deepEqual(nm.admissions,{qualification:q.independentAdmissionSHA256,rawAdmission:q.rawAdmissionSHA256});
          assert.equal(nr.schema,'SC_LATER_NATIVE_BROWSER_V1');assert.equal(nr.status,'passed');assert.deepEqual(nr.product,product);
          assert.deepEqual(nr.authority,{manifestSHA256:sha(read(observed.root,'input/native-manifest.json')),admissions:nm.admissions,distDigest:q.distDigest});
          assert.equal(na.status,'FOUR_SC_CONTEXTS_AND_NINE_ORDINARY_PHOTOS_RETAINED');assert.deepEqual(na.product,product);assert.deepEqual(na.authority,nr.authority);assert.equal(na.allContextsPassed,true);
          assert.deepEqual(na.genuineUIStarts,[2010,2015]);assert.deepEqual(na.admittedFixtureReadouts,[2010,2015]);assert.equal(na.fixtureEndYear,2020);assert.equal(na.fixtureReloads,2);assert.equal(na.ordinaryPhotos,9);assert.equal(na.browserAnnualProgression,false);
          assert.deepEqual(na.cells.map(row=>[row.startYear,row.id]),[[2010,'soccer:mbappe'],[2010,'soccer:haaland'],[2010,'soccer:bellingham'],[2015,'soccer:haaland'],[2015,'soccer:bellingham']]);
          assert.deepEqual(nr.contexts.map(row=>[row.flow,row.width,row.height]),['create-2010','create-2015','fixture-2010','fixture-2015'].map(flow=>[flow,390,844]));
          for(const c of nr.contexts){assert.equal(c.status,'passed');assert.equal(c.finalNativeCensus.closed,true);assert.equal(c.finalNativeCensus.nonReadonly,0);}
          for(const key of['sourceHeld','distHeld','fixturesHeld']){assert.equal(nr[key],true);assert.equal(na[key],true);}
          const shots=json(observed.root,'screenshots.json');assert.equal(shots.length,9);assert.deepEqual(shots.map(row=>row.file),nr.screenshots);assert.equal(new Set(nr.screenshots).size,9);
          for(const pin of shots){assert(/^[a-z0-9-]+\.png$/.test(pin.file));const body=read(observed.root,'browser/'+pin.file);assert.equal(body.length,pin.bytes);assert.equal(sha(body),pin.sha256);}
          assert.deepEqual(nm.fixtures.map(pin=>pin.startYear),[2010,2015]);
          for(const pin of nm.fixtures){
           const file='historical-candidate-raw/later-ui-'+pin.startYear+'.json',body=read(qualified.root,file),nativeBody=read(observed.root,'browser/input/later-ui-'+pin.startYear+'.json'),save=Buffer.from(JSON.parse(body).value.repeated.loadedBytes);
           assert(body.equals(nativeBody));assert.equal(body.length,pin.bytes);assert.equal(sha(body),pin.sha256);assert.equal(pin.rawAdmissionSHA256,q.rawAdmissionSHA256);assert.equal(save.length,pin.rawBytes);assert.equal(sha(save),pin.rawSHA256);
          }
          NATIVE_AUTH
          printf '%s  %s\n' '362372ea6e94020158b912a3f5cec24ea20c5e3ac119beee35f7dd71c243835f' "$block" | sha256sum -c -
      - name: Authenticate focused qualification and independently admitted native originals
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$QA_OUT/input/auth-complete.mjs"
          test ! -e "$auth"
          cat > "$auth" <<'AUTH_PREFIX'
          import fs from 'node:fs';import path from 'node:path';import crypto from 'node:crypto';import assert from 'node:assert/strict';import{spawnSync}from'node:child_process';
          const e=process.env,out=e.QA_OUT,ref=e.QA_REF,sha=b=>crypto.createHash('sha256').update(b).digest('hex'),blob=b=>crypto.createHash('sha1').update(Buffer.from('blob '+b.length+'\0')).update(b).digest('hex');
          const native=(label,command,args,binary=false)=>{const r=spawnSync(command,args,{encoding:binary?null:'utf8',maxBuffer:128*1024*1024});fs.writeFileSync(path.join(out,'input',label+'.native.json'),JSON.stringify({command:[command,...args],status:r.status,signal:r.signal,error:r.error?String(r.error):null})+'\n');fs.writeFileSync(path.join(out,'input',label+'.stderr.log'),r.stderr??'');if(!binary)fs.writeFileSync(path.join(out,'input',label+'.stdout.log'),r.stdout??'');assert.equal(r.status,0,label);assert.equal(r.signal,null);assert.equal(r.error,undefined);return r.stdout;};
          const api=(label,url)=>JSON.parse(native(label,'gh',['api','repos/PapiSalgueroM/ballpark-hero/'+url]));
          const safe=value=>{assert(typeof value==='string'&&value.length>0&&!value.startsWith('/')&&!/^[a-zA-Z]:/.test(value)&&!value.includes('\\')&&!value.includes('\0'),'SC_LATER_PUBLIC_SAFE_PATH');assert(!value.split('/').includes('..'),'SC_LATER_PUBLIC_SAFE_PATH');};
          const norm=value=>value.replace(/^\.\//,'').replace(/\/$/,'');
          const inventory=dir=>{const rows=[];function walk(rel=''){for(const entry of fs.readdirSync(path.join(dir,rel),{withFileTypes:true})){const file=path.posix.join(rel,entry.name);if(entry.isDirectory())walk(file);else{assert(entry.isFile());const bytes=fs.readFileSync(path.join(dir,file));rows.push({file,bytes:bytes.length,sha256:sha(bytes)});}}}walk();return rows.sort((a,b)=>a.file<b.file?-1:a.file>b.file?1:0);};
