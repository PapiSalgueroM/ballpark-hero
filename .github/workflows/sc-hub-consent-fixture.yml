            if(row.arm==='healthy')assert.deepEqual(failures,[]);else{assert(failures.length>0);assert(failures.every(x=>x.structure&&x.failure.name==='AssertionError'));assert(failures.some(x=>x.name.includes('timeline header')));assert(failures.some(x=>x.name.includes('two intended')));}
            assert.equal(row.transitions.length,row.scene==='newspaper'?1:0);
            if(row.scene==='newspaper'){transitions++;const t=row.transitions[0];assert.equal(t.driverScrollAfterActivation,false);assert.deepEqual(t.expected,f.summary);assert.deepEqual(JSON.parse(t.after.storage.soccerCareerSave),f.summary);assert.equal(t.after.storage.soccerCareerSave,JSON.stringify(f.summary));assert.deepEqual(t.before.rng,t.after.rng);assert.deepEqual(t.before.session,t.after.session);assert.deepEqual(omitted(t.before.storage,'soccerCareerSave'),omitted(t.after.storage,'soccerCareerSave'));assert.deepEqual(t.after.writes.slice(t.before.writes.length),[{scope:'local',method:'setItem',args:['soccerCareerSave',JSON.stringify(f.summary)]}]);assert.equal(t.after.now-t.before.now,256);const clicks=t.after.inputs.slice(t.before.inputs.length).filter(x=>x.type==='click');assert.equal(clicks.length,1);assert.equal(clicks[0].trusted,true);assert.match(clicks[0].text,/Continue to Season Summary/);assert(row.summaryReveal.top>=0&&row.summaryReveal.bottom<=row.profile.height);}
            parsed.push({arm:row.arm,profile:row.profile,scene:row.scene,checks:row.checks.length,ownedStructureRefusals:failures.map(x=>x.name),complete:true});
          }
          assert.equal(transitions,4);assert.equal(r.comparisons.length,4);
          const fields=row=>row.observations.map(x=>({label:x.label,storage:x.state.storage,session:x.state.session,rng:x.state.rng,writes:x.state.writes,now:x.state.now,text:x.data.text}));
          const comparisonNames=[];
          for(const old of r.cases.filter(x=>x.arm==='old-nesting')){const current=r.cases.find(x=>x.arm==='healthy'&&x.profile.name===old.profile.name&&x.scene===old.scene);assert(current);assert.deepEqual(fields(old),fields(current));const comparison=r.comparisons.find(x=>x.profile===old.profile.name&&x.scene===old.scene);assert(comparison);assert.equal(comparison.effective,true);assert.equal(comparison.baselineEqual,true);assert(comparison.failures.length>0);assert.deepEqual(comparison.failures,old.checks.filter(x=>!x.passed).map(x=>x.name));comparisonNames.push(comparison.profile+'|'+comparison.scene);}
          assert.equal(new Set(comparisonNames).size,4);
          const current=fs.readFileSync(root+'/native/SoccerCareer.current.tsx','utf8').replace(/\r\n/g,'\n'),old=fs.readFileSync(root+'/native/SoccerCareer.old.tsx','utf8');
          const top='            <span className="text-xs font-bold uppercase tracking-wider text-muted-foreground">Career Timeline</span>\n          </div>\n';
          const bottom='            <RivalrySummaryCard summary={career.rivalrySummary} career={career} />\n          )}\n';
          assert.equal(current.split(top).length,2);assert.equal(current.split(bottom+'          </div>\n').length,2);
          assert.equal(current.replace(top,top+'          </div>\n').replace(bottom+'          </div>\n',bottom),old);
          assert.equal(old.replace(top+'          </div>\n',top).replace(bottom,bottom+'          </div>\n'),current);
          assert.equal(r.control.originalSha256,sha(fs.readFileSync('src/pages/SoccerCareer.tsx')));assert.equal(r.control.copySha256,sha(Buffer.from(old)));assert.notEqual(r.control.copySha256,r.control.originalSha256);assert.equal(r.control.roundTripExact,true);assert.equal(r.control.forwardChanges,2);assert.equal(r.control.normalizedRoundTripSha256,sha(Buffer.from(current)));
          assert.equal(r.control.transforms.length,1);assert.equal(r.control.transforms[0].copied,true);assert.equal(r.control.transforms[0].sha256,r.control.copySha256);
          const images=fs.readdirSync(root+'/native').filter(x=>x.endsWith('.png')).map(file=>{const b=fs.readFileSync(root+'/native/'+file);assert(b.length>0);return {file,bytes:b.length,sha256:sha(b)};});assert.equal(images.length,24);
          fs.writeFileSync(out+'/summary.json',JSON.stringify({completed:true,sourceCommit:r.sourceHead,cases:parsed,healthyJourneys:4,copiedOldNestingJourneys:4,comparisons:4,continuedSummaries:4,images,rngEvidence:'Existing seeded-browser RNG seed/draw counters and fixture action LCG end-state witnesses. No individual full draw-value tape is emitted by this unchanged harness.',clock:'Existing paused Oct7 clock and reduced-motion profiles, not native clocks/random or physical-device coverage',runtimeCounters:null,runtimeCounterCompleteness:'UNKNOWN',scope:'Focused canonical-consent fixture compatibility for unchanged Hub layout/Continue proof. No full App/Reveal/full-unit/readers/caps or release claim.'},null,2));
          VERIFY
      - name: Always retain source dependencies tools fixtures cache and healthy dist custody
        if: always()
        run: |
          set -u
          failed=0
          if [ -z "${OUT:-}" ]; then OUT="$RUNNER_TEMP/sc-hub-consent-fixture"; mkdir -p "$OUT"; fi
          for pair in 'source:source' 'dependency-files:dependencies' 'browser-files:browser' 'python-files:python' 'fixtures:fixtures' 'cache:cache' 'dist:dist'; do
            manifest="${pair%%:*}"; label="${pair#*:}"
            if [ -f "$OUT/$manifest.sha256" ]; then sha256sum -c "$OUT/$manifest.sha256" > "$OUT/$label-held.log" 2>&1 || failed=1
            else printf 'UNAVAILABLE\n' > "$OUT/$label-held.log"; failed=1; fi
          done
          if [ -d node_modules ]; then
            find node_modules -type f -print0 | LC_ALL=C sort -z > "$OUT/dependency-members.after"
          else failed=1; fi
          if [ -f "$OUT/tools-root.txt" ]; then
            tools="$(cat "$OUT/tools-root.txt")"
            if [ -d "$tools/node_modules" ]; then
              find "$tools/node_modules" -type f -print0 | LC_ALL=C sort -z > "$OUT/browser-members.after"
            else failed=1; fi
            if [ -d "$tools/python" ]; then
              find "$tools/python" -name __pycache__ -prune -o -type f -print0 | LC_ALL=C sort -z > "$OUT/python-members.after"
            else failed=1; fi
          else failed=1; fi
          if [ -d dist ]; then
            find dist -type f -print0 | LC_ALL=C sort -z > "$OUT/dist-members.after"
          else failed=1; fi
          if [ -d soccer-hub-grid-artifacts/asset-cache ]; then
            find soccer-hub-grid-artifacts/asset-cache -type f -print0 | LC_ALL=C sort -z > "$OUT/cache-members.after"
          else failed=1; fi
          for member in dependency browser python dist cache; do
            if [ -f "$OUT/$member-members.before" ] && [ -f "$OUT/$member-members.after" ]; then
              cmp "$OUT/$member-members.before" "$OUT/$member-members.after" > "$OUT/$member-members-held.log" 2>&1 || failed=1
            else printf 'UNAVAILABLE\n' > "$OUT/$member-members-held.log"; failed=1; fi
          done
          if [ -f "$OUT/source-members.before" ]; then
            git ls-files -z > "$OUT/source-members.after"
            cmp "$OUT/source-members.before" "$OUT/source-members.after" || failed=1
          else failed=1; fi
          git diff --exit-code HEAD > "$OUT/final-source.diff" || failed=1
          git ls-files --others --exclude-standard > "$OUT/untracked.txt"
          test ! -s "$OUT/untracked.txt" || failed=1
          if [ -f "$OUT/tools-root.txt" ]; then
            tools="$(cat "$OUT/tools-root.txt")"
            "$tools/python/bin/python" -m pip freeze > "$OUT/python-packages.after"
            cmp "$OUT/python-packages.before" "$OUT/python-packages.after" || failed=1
            for name in playwright playwright-core; do
              if [ -L "node_modules/$name" ] && [ "$(readlink "node_modules/$name")" = "$tools/node_modules/$name" ]; then unlink "node_modules/$name"; else failed=1; fi
            done
          fi
          for receipt in "$OUT"/*.transport; do
            test -e "$receipt" || continue
            test ! -s "$receipt" || failed=1
          done
          printf '%s\n' "$failed" > "$OUT/final-holds.exit"
          exit "$failed"
      - name: Original focused evidence including partial first failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sc-hub-consent-fixture-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/sc-hub-consent-fixture
            soccer-hub-grid-artifacts
          if-no-files-found: error
          retention-days: 14
