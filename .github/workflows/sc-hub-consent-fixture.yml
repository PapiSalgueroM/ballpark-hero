          LC_ALL=C sort -u "$OUT/history/source-tree-objects.raw" > "$OUT/history/source-tree-objects.txt"
          git cat-file --batch-check='%(objectname) %(objecttype) %(objectsize)' < "$OUT/history/source-tree-objects.txt" > "$OUT/history/source-tree-availability.txt" 2> "$OUT/history/source-tree-availability.stderr"
          awk 'NF != 3 || length($1) != 40 || $2 !~ /^(blob|tree)$/ || $3 !~ /^[0-9]+$/ { exit 1 }' "$OUT/history/source-tree-availability.txt"
          test "$(wc -l < "$OUT/history/source-tree-objects.txt")" -eq "$(wc -l < "$OUT/history/source-tree-availability.txt")"
          SIM_NETWORK=online node --input-type=module <<'HISTORY'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const root=process.env.OUT+'/history',read=name=>fs.readFileSync(root+'/'+name,'utf8'),actual=read('current.after').trim().split('\n'),historical=read('historical.actual').trim().split('\n');
          assert.equal(process.env.GIT_NO_LAZY_FETCH,'1');assert.equal(actual[0],process.env.GITHUB_SHA);assert.equal(actual[2],process.env.PARENT_COMMIT);assert.equal(actual[3],process.env.PARENT_TREE);
          const objects=read('source-tree-availability.txt').trim().split('\n').map(line=>{const [id,type,size]=line.split(' ');return {id,type,bytes:Number(size)};});
          assert(objects.length>0);assert(objects.some(row=>row.id===historical[2]&&row.type==='blob'));assert(objects.some(row=>row.id===historical[1]&&row.type==='tree'));assert(objects.some(row=>row.id===actual[1]&&row.type==='tree'));assert(objects.some(row=>row.id===actual[3]&&row.type==='tree'));
          fs.writeFileSync(root+'/summary.json',JSON.stringify({mode:'ONLINE',head:actual[0],headTree:actual[1],directParent:actual[2],parentTree:actual[3],historicalCommit:historical[0],historicalTree:historical[1],historicalPage:historical[2],fetchAttempts:Number(read('fetch-attempts')),fetchStatus:read('fetch.status').trim(),shallowRepository:read('shallow-repository').trim(),requiredSourceTrees:[actual[1],actual[3],historical[1]],locallyAvailableObjects:objects.length,missingObjects:0,partialClone:false,promisor:false,lazyFetchDisabled:true,beforeAfterIdentityEqual:read('current.before')===read('current.after'),transportReceiptAvailable:false,scope:'Explicit online bounded Git history setup. Availability covers every object in the three exact source trees, not all branch history or a socket census.'},null,2));
          HISTORY
          test "$(git rev-parse HEAD^)" = "$PARENT_COMMIT"
          test "$(git rev-parse "$PARENT_COMMIT^{tree}")" = "$PARENT_TREE"
          test "$(git ls-tree -r "$PARENT_COMMIT" | wc -l)" -eq 5669
          test "$(git ls-tree -r HEAD | wc -l)" -eq 5670
          git rev-parse HEAD 'HEAD^{tree}' > "$OUT/head-tree.txt"
          git diff --name-status "$PARENT_COMMIT" HEAD | LC_ALL=C sort > "$OUT/changed-paths.txt"
          cat > "$OUT/expected-paths.txt" <<'PATHS'
          A	.github/workflows/sc-hub-consent-fixture.yml
          M	scripts/playSoccerHubGrid1089.mjs
          PATHS
          LC_ALL=C sort -o "$OUT/expected-paths.txt" "$OUT/expected-paths.txt"
          diff -u "$OUT/expected-paths.txt" "$OUT/changed-paths.txt"
          test -z "$(git status --porcelain)"
          test "$(git rev-parse "$PARENT_COMMIT:scripts/playSoccerHubGrid1089.mjs")" = b4120e22451f2e65f8ecebcd37a07c1cde992f28
          test "$(git rev-parse HEAD:scripts/playSoccerHubGrid1089.mjs)" = a94775540e47afe7c15842f4ffa6b79be6afb782
          test "$(git rev-parse HEAD:src/lib/consentPreferences.ts)" = 4f5dc114bf7f9775524d0adbc1be7e52f4f56001
          test "$(git rev-parse HEAD:src/components/CookieConsent.tsx)" = 7ffba7ff4099c051d949cd20fe31bc75332f215b
          test "$(git rev-parse HEAD:.github/workflows/soccer-hub-grid.yml)" = 8e94982dffc4ab69fde6c5241c342cfce8b5d0bf
          git show "$PARENT_COMMIT:scripts/playSoccerHubGrid1089.mjs" > "$OUT/before-hub.mjs"
          git ls-files -z > "$OUT/source-members.before"
          git ls-files -z | xargs -0 sha256sum > "$OUT/source.sha256"
          cat > "$OUT/capture.sh" <<'CAPTURE'
          capture() {
            local name="$1" mode="$2"; shift 2
            printf '%s\0' "$@" > "$OUT/$name.argv"
            printf '%s\n' "$mode" > "$OUT/$name.mode"
            local code=0
            if [ "$mode" = OFFLINE ]; then
              SIM_NETWORK=offline SIM_OFFLINE_RECEIPT="$OUT/$name.transport" NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" "$@" > "$OUT/$name.stdout" 2> "$OUT/$name.stderr" || code=$?
              test -e "$OUT/$name.transport" || : > "$OUT/$name.transport"
            elif [ "$mode" = ONLINE ]; then
              SIM_NETWORK=online NODE_OPTIONS='' "$@" > "$OUT/$name.stdout" 2> "$OUT/$name.stderr" || code=$?
            else
              printf 'Unknown capture mode\n' >&2; return 1
            fi
            printf '%s\n' "$code" > "$OUT/$name.exit"
            return "$code"
          }
          CAPTURE
          node --input-type=module <<'SOURCE'
          import fs from 'node:fs';import assert from 'node:assert/strict';import {createHash} from 'node:crypto';
          const sha=b=>createHash('sha256').update(b).digest('hex'),out=process.env.OUT;
          const before=fs.readFileSync(out+'/before-hub.mjs','utf8'),after=fs.readFileSync('scripts/playSoccerHubGrid1089.mjs','utf8');
          const old="'cookie-consent': 'essential'",next="'cookie-consent-v2': JSON.stringify({ version: 2, advertising: false, analytics: false, updatedAt: NOW })";
          assert.equal(before.split(old).length,2);assert.equal(after.split(next).length,2);
          assert.equal(before.replace(old,next),after);assert.equal(after.replace(next,old),before);
          assert.equal(Buffer.byteLength(after),30163);assert.equal(sha(Buffer.from(after)),'4cb679ff675b1fac205c117e1ae71a13c344f4c80935e11cc04aa22457864467');
          fs.writeFileSync(out+'/fixture-delta.json',JSON.stringify({beforeSha256:sha(Buffer.from(before)),afterSha256:sha(Buffer.from(after)),before:old,after:next,forwardChanged:true,wholeInverse:true,policyChanged:false},null,2));
          SOURCE
      - name: Locked app and isolated verification tools online
        run: |
          set -euo pipefail
          source "$OUT/capture.sh"
          capture install ONLINE npm ci
          tools="$RUNNER_TEMP/sc-hub-consent-tools"; test ! -e "$tools"; mkdir "$tools"
          printf '{"private":true,"dependencies":{"playwright":"1.64.1"}}\n' > "$tools/package.json"
          capture browser-install ONLINE npm install --prefix "$tools" --ignore-scripts --no-audit --no-fund
          test ! -e node_modules/playwright; test ! -e node_modules/playwright-core
          ln -s "$tools/node_modules/playwright" node_modules/playwright
          ln -s "$tools/node_modules/playwright-core" node_modules/playwright-core
          cp "$tools/package.json" "$OUT/browser-package.json"
          cp "$tools/package-lock.json" "$OUT/browser-package-lock.json"
          capture chromium-install ONLINE node "$tools/node_modules/playwright/cli.js" install --with-deps chromium
          python -m venv "$tools/python"
          capture python-install ONLINE "$tools/python/bin/python" -m pip install fonttools==4.60.1 Pillow==11.3.0
          "$tools/python/bin/python" -m pip freeze > "$OUT/python-packages.before"
          printf '%s\n' "$tools/python/bin" >> "$GITHUB_PATH"
          printf '%s\n' "$tools" > "$OUT/tools-root.txt"
          find node_modules -type f -print0 | LC_ALL=C sort -z | tee "$OUT/dependency-members.before" | xargs -0 sha256sum > "$OUT/dependency-files.sha256"
          find "$tools/node_modules" -type f -print0 | LC_ALL=C sort -z | tee "$OUT/browser-members.before" | xargs -0 sha256sum > "$OUT/browser-files.sha256"
          find "$tools/python" -name __pycache__ -prune -o -type f -print0 | LC_ALL=C sort -z | tee "$OUT/python-members.before" | xargs -0 sha256sum > "$OUT/python-files.sha256"
          node --input-type=module <<'TOOLS'
          import fs from 'node:fs';import assert from 'node:assert/strict';import {createRequire} from 'node:module';import path from 'node:path';
          const req=createRequire(import.meta.url),out=process.env.OUT;
          assert.equal(process.version,'v24.22.1');
          const lock=JSON.parse(fs.readFileSync('package-lock.json','utf8')),rows=[],omitted=[];
          const fits=(rules,value)=>!rules||(!rules.some(x=>x==='!'+value)&&(rules.every(x=>x.startsWith('!'))||rules.includes(value)));
          for(const [dir,x] of Object.entries(lock.packages)){if(!dir.startsWith('node_modules/')||!x.version)continue;
            const file=dir+'/package.json';if(!fs.existsSync(file)){assert.equal(x.optional,true);assert((x.os&&!fits(x.os,process.platform))||(x.cpu&&!fits(x.cpu,process.arch)));omitted.push({dir,version:x.version,os:x.os??null,cpu:x.cpu??null});continue;}
            assert.equal(JSON.parse(fs.readFileSync(file,'utf8')).version,x.version,dir);rows.push({dir,version:x.version});}
          for(const name of ['playwright','playwright-core']){const file=req.resolve(name+'/package.json');assert.equal(JSON.parse(fs.readFileSync(file,'utf8')).version,'1.64.1');fs.copyFileSync(file,out+'/'+name+'-package.json');}
          fs.copyFileSync(path.join(path.dirname(req.resolve('playwright-core/package.json')),'browsers.json'),out+'/browsers.json');
          fs.writeFileSync(out+'/tool-and-dependency-versions.json',JSON.stringify({node:process.versions,installed:rows,optionalAbsent:omitted,onlineInstall:true},null,2));
          TOOLS
      - name: Actual proper types syntax and normal Vite build offline
        id: build
        run: |
          set -euo pipefail
          source "$OUT/capture.sh"
          capture types OFFLINE node_modules/.bin/tsc --noEmit -p tsconfig.app.json
          capture syntax OFFLINE node --check scripts/playSoccerHubGrid1089.mjs
          capture build OFFLINE npm run build
          find dist -type f -print0 | LC_ALL=C sort -z | tee "$OUT/dist-members.before" | xargs -0 sha256sum > "$OUT/dist.sha256"
      - name: Actual unchanged fixture and declared font flag preparation online
        id: assets
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          test ! -e soccer-hub-grid-artifacts
          source "$OUT/capture.sh"
          capture prepare-assets ONLINE node scripts/playSoccerHubGrid1089.mjs --prepare-assets-only
          node --input-type=module <<'ASSETS'
          import fs from 'node:fs';import assert from 'node:assert/strict';import {createHash} from 'node:crypto';
          const root='soccer-hub-grid-artifacts',out=process.env.OUT,sha=b=>createHash('sha256').update(b).digest('hex');
          const manifest=JSON.parse(fs.readFileSync(root+'/asset-cache/manifest.json','utf8'));assert(manifest.length>0);
          const seen=new Set();for(const row of manifest){assert(!seen.has(row.url));seen.add(row.url);const u=new URL(row.url);
            assert.equal(u.protocol,'https:');assert.equal(u.username,'');assert.equal(u.password,'');
