            for(const req of row.requests){assert(['GET','HEAD'].includes(req.method));assert(!req.blocked);if(req.cached){const asset=cache.find(x=>x.url===req.url);assert(asset);assert.equal(req.sha256,asset.sha256);assert.equal(req.bytes,asset.bytes);}else if(req.localRead){assert.equal(req.localRead,'empty live score feed');assert.equal(req.method,'GET');}else{assert(req.status>=200&&req.status<300);assert.equal(new URL(req.url).hostname,'127.0.0.1');assert(/^[a-f0-9]{64}$/.test(req.sha256));assert(Number.isInteger(req.bytes)&&req.bytes>=0);}}
