            else if(u.hostname==='fonts.gstatic.com')assert(u.pathname.startsWith('/s/'));
            else {assert.equal(u.hostname,'flagcdn.com');assert(/^\/w(?:20|40|80)\/[a-z0-9-]+\.png$/.test(u.pathname));assert.equal(u.search,'');}
            assert(/^[0-9a-f]{64}$/.test(row.file));const b=fs.readFileSync(root+'/asset-cache/'+row.file);assert.equal(b.length,row.bytes);assert.equal(sha(b),row.sha256);assert.equal(row.file,row.sha256);
          }
          const p=JSON.parse(fs.readFileSync(root+'/preparation.json','utf8'));assert.deepEqual(p.sourceAfter,p.sourceBefore);
          fs.writeFileSync(out+'/asset-network-boundary.json',JSON.stringify({mode:'ONLINE',sourceCommand:'node scripts/playSoccerHubGrid1089.mjs --prepare-assets-only',requests:'Existing source uses GET with redirect:error and20second timeout, no retries, only declared font/flag hosts',payloads:manifest.length,urls:[...seen],genericTransportReceiptAvailable:false,limitation:'Actual cache manifest/body custody, not a socket census or empty offline-guard credit'},null,2));
          ASSETS
          find soccer-hub-grid-artifacts/asset-cache -type f -print0 | LC_ALL=C sort -z | tee "$OUT/cache-members.before" | xargs -0 sha256sum > "$OUT/cache.sha256"
          printf '%s\0' soccer-hub-grid-artifacts/fixtures.json soccer-hub-grid-artifacts/fixture-origins.json soccer-hub-grid-artifacts/independent-engine.mjs soccer-hub-grid-artifacts/independent-engine-metafile.json soccer-hub-grid-artifacts/preparation.json | xargs -0 sha256sum > "$OUT/fixtures.sha256"
      - name: Actual eight native journeys and four effective old nesting comparisons offline
        id: native
        if: ${{ !cancelled() && steps.assets.outcome == 'success' }}
        run: |
          set -euo pipefail
          source "$OUT/capture.sh"
          capture native OFFLINE timeout --signal=TERM --kill-after=15s 12m node scripts/playSoccerHubGrid1089.mjs
      - name: Independently verify every retained raw journey and copied control
        if: ${{ !cancelled() && steps.native.outcome == 'success' }}
        run: |
          set -euo pipefail
          source "$OUT/capture.sh"
          capture verify OFFLINE node --input-type=module <<'VERIFY'
          import fs from 'node:fs';import assert from 'node:assert/strict';import {createHash} from 'node:crypto';
          const root='soccer-hub-grid-artifacts',out=process.env.OUT,sha=b=>createHash('sha256').update(b).digest('hex'),load=n=>JSON.parse(fs.readFileSync(root+'/'+n,'utf8'));
          const r=load('native/report.json'),f=load('fixtures.json'),origins=load('fixture-origins.json'),prep=load('preparation.json'),cache=load('asset-cache/manifest.json');
          assert.equal(r.complete,true);assert.equal(r.error,undefined);assert.equal(r.cleanupError,undefined);assert.equal(r.holdError,undefined);
          assert.equal(r.sourceHead,process.env.GITHUB_SHA);assert.deepEqual(r.sourceAfter,r.sourceBefore);assert.deepEqual(r.buildAfter,r.buildBefore);assert.deepEqual(r.cacheAfter,r.cacheBefore);assert.deepEqual(prep.sourceBefore,prep.sourceAfter);assert.deepEqual(prep.sourceAfter,r.sourceBefore);
          assert.equal(sha(fs.readFileSync(root+'/independent-engine.mjs')),f.engineSha256);assert.equal(f.engineSha256,prep.engineSha256);
          assert.equal(sha(fs.readFileSync(root+'/asset-cache/manifest.json')),prep.assetManifestSha256);
          assert.deepEqual(origins.writes,[]);assert(Number.isInteger(f.selectedAttempt)&&f.selectedAttempt>=0&&f.selectedAttempt<24);assert.equal(origins.attempts.length,f.selectedAttempt+1);
          const chosen=origins.attempts.at(-1);assert.equal(chosen.attempt,f.selectedAttempt);
          for(const attempt of origins.attempts){let state=attempt.before.seed>>>0;assert(Number.isInteger(attempt.after.draws)&&attempt.after.draws>=0);
            for(let i=0;i<attempt.after.draws;i++)state=(Math.imul(state,1664525)+1013904223)>>>0;assert.equal(state,attempt.after.seed);}
          assert.deepEqual(chosen.playing,f.playing);assert.deepEqual(chosen.newspaper,f.newspaper);assert.equal(f.playing.phase,'playing');assert.equal(f.newspaper.phase,'newspaper');assert.equal(f.summary.phase,'season_summary');
          assert.deepEqual(f.dismissalRngBefore,f.dismissalRngAfter);
          const canonical=JSON.stringify({version:2,advertising:false,analytics:false,updatedAt:1791374400000});
          const baseline={'cookie-consent-v2':canonical,'dukb-theme':'dark','dukb-soccer-currency':'EUR','rules-gate-seen:/soccer-career':'1','nbaCareerSave':'1089 opaque NBA bytes','nflCareerSave':'1089 opaque NFL bytes','stadiumTycoonV1':'1089 opaque Tycoon bytes'};
          const expected=[];for(const arm of ['healthy','old-nesting'])for(const profile of ['390-touch','1280-keyboard'])for(const scene of ['playing','newspaper'])expected.push(arm+'|'+profile+'|'+scene);
          const names=r.cases.map(x=>x.arm+'|'+x.profile.name+'|'+x.scene);assert.equal(new Set(names).size,8);assert.deepEqual([...names].sort(),expected.sort());
          const parsed=[];let transitions=0;
          const omitted=(object,key)=>Object.fromEntries(Object.entries(object).filter(([name])=>name!==key));
          for(const row of r.cases){
            assert.equal(row.complete,true);assert.deepEqual(row.errors,[]);assert.deepEqual(row.sockets,[]);
            assert.equal(row.profile.width,row.profile.name==='390-touch'?390:1280);assert.equal(row.profile.height,row.profile.name==='390-touch'?844:900);assert.equal(row.profile.touch,row.profile.name==='390-touch');
            assert.equal(row.fonts.length,8);assert(row.fonts.every(font=>font.faces.length>0&&font.faces.every(face=>face.family.replace(/^["']|["']$/g,'')===font.family&&face.weight===String(font.weight)&&face.status==='loaded')));
