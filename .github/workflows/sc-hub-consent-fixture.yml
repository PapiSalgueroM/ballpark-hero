name: Focused Soccer Hub consent fixture

on:
  push:
    branches: [codex/sc-hub-consent-fixture-shallow-20261103]

permissions:
  contents: read
concurrency:
  group: sc-hub-consent-fixture-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CI: '1'
      TZ: UTC
      SIM_NETWORK: offline
      ENGINES: chromium
      GIT_NO_LAZY_FETCH: '1'
      BEFORE_SHA: ${{ github.event.before }}
      PARENT_COMMIT: 1a4f0f121c255dbba98356d74c9eef0b4b301c1c
      PARENT_TREE: 9928043b828f7f6d2adb5b087c8c3cbbc855bb9b
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          fetch-tags: false
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bind the one fixture edit and complete source membership
        run: |
          set -euo pipefail
          export OUT="$RUNNER_TEMP/sc-hub-consent-fixture"
          test ! -e "$OUT"; mkdir -p "$OUT"
          printf 'OUT=%s\n' "$OUT" >> "$GITHUB_ENV"
          test "$GITHUB_REF" = refs/heads/codex/sc-hub-consent-fixture-shallow-20261103
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$BEFORE_SHA" = 0000000000000000000000000000000000000000
          test "$PARENT_COMMIT" != UNBOUND_PARENT_COMMIT
          test "$PARENT_TREE" != UNBOUND_PARENT_TREE
          mkdir "$OUT/history"
          printf 'ONLINE\n' > "$OUT/history/mode"
          git rev-parse HEAD 'HEAD^{tree}' HEAD^ "$PARENT_COMMIT^{tree}" > "$OUT/history/current.before"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$PARENT_COMMIT"
          test "$(git rev-parse "$PARENT_COMMIT^{tree}")" = "$PARENT_TREE"
          no_partial_history() {
            local label="$1" code=0
            git config --get-regexp '^(extensions\.partialclone|remote\..*\.(promisor|partialclonefilter))$' > "$OUT/history/$label.partial-config" 2> "$OUT/history/$label.partial-config.stderr" || code=$?
            printf '%s\n' "$code" > "$OUT/history/$label.partial-config.exit"
            test "$code" -eq 1
            test ! -s "$OUT/history/$label.partial-config"
            find "$(git rev-parse --git-path objects)" -type f -name '*.promisor' -print > "$OUT/history/$label.promisor-files"
            test ! -s "$OUT/history/$label.promisor-files"
          }
          no_partial_history before
          historical=6f57ce7818f152b4efdc75027d267c49927a2d8b
          historical_tree=a4ac8d4fa3d4dc301ba976ebec716a1507dff440
          historical_page=edc5665319c35e80366acf93314f28ce88a3ece7
          printf '%s\0' git fetch --no-tags --no-recurse-submodules --depth=1 origin "$historical" > "$OUT/history/fetch.argv"
          if git cat-file -e "$historical^{commit}" > "$OUT/history/presence.stdout" 2> "$OUT/history/presence.stderr"; then
            printf '0\n' > "$OUT/history/presence.exit"
            printf '0\n' > "$OUT/history/fetch-attempts"
            printf 'NOT_REQUIRED\n' > "$OUT/history/fetch.status"
          else
            code=$?; printf '%s\n' "$code" > "$OUT/history/presence.exit"
            printf '1\n' > "$OUT/history/fetch-attempts"
            printf 'ATTEMPTED_ONCE\n' > "$OUT/history/fetch.status"
            code=0
            SIM_NETWORK=online git fetch --no-tags --no-recurse-submodules --depth=1 origin "$historical" > "$OUT/history/fetch.stdout" 2> "$OUT/history/fetch.stderr" || code=$?
            printf '%s\n' "$code" > "$OUT/history/fetch.exit"
            test "$code" -eq 0
          fi
          no_partial_history after
          git rev-parse "$historical^{commit}" "$historical^{tree}" "$historical:src/pages/SoccerCareer.tsx" > "$OUT/history/historical.actual"
          printf '%s\n' "$historical" "$historical_tree" "$historical_page" > "$OUT/history/historical.expected"
          diff -u "$OUT/history/historical.expected" "$OUT/history/historical.actual"
          git cat-file blob "$historical_page" > "$OUT/history/SoccerCareer.historical.tsx"
          test "$(git hash-object "$OUT/history/SoccerCareer.historical.tsx")" = "$historical_page"
          sha256sum "$OUT/history/SoccerCareer.historical.tsx" > "$OUT/history/historical-page.sha256"
          git rev-parse --is-shallow-repository > "$OUT/history/shallow-repository"
          git rev-parse HEAD 'HEAD^{tree}' HEAD^ "$PARENT_COMMIT^{tree}" > "$OUT/history/current.after"
          cmp "$OUT/history/current.before" "$OUT/history/current.after"
