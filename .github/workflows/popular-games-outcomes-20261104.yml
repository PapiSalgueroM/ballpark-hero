name: Top games physical outcome controls
on:
  push:
    branches: [codex/popular-games-outcomes-final-20261104]
permissions:
  contents: read
env:
  CI: '1'
  SIM_NETWORK: offline
jobs:
  outcomes:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Hold exact source and materialize original controls before offline execution
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/popular-games-outcomes"
          mkdir -p "$OUT/logs" "$OUT/transport"
          echo "QA_OUT=$OUT" >> "$GITHUB_ENV"
          test "$(git rev-parse HEAD^)" = d200a670082baeb3d123965ef2495a5699a453ed
          test "$(git rev-parse HEAD^^{tree})" = ddae09da53f0d62acc96fe6bf4f3d8fc3f493881
          test "$(git diff --name-status HEAD^ HEAD)" = $'A\t.github/workflows/popular-games-outcomes-20261104.yml'
          git rev-parse HEAD HEAD^{tree} > "$OUT/source.txt"
          git ls-files -z | sort -z | xargs -0 sha256sum > "$OUT/source-before.sha256"
          git status --porcelain=v1 --untracked-files=all > "$OUT/status-before.txt"
          test ! -s "$OUT/status-before.txt"
          cp .github/workflows/popular-games-outcomes-20261104.yml "$OUT/workflow.yml"
          for blob in 7027493bc968cf77bdcde7c6e21646441dc40bd4 e374e452b8a5eee52a56149da2fa1dc66ed65587 4877b3ad01aac1a347268486a7b92ce4bae1d859 6a1fb1c55c7367c729a401c43c2e4092c9c2d829 4e02c4812afd4bdf1c2a42dff857a1c276ad7f6d d1b78bdd5d5c98c5fae237f590d48d19954eb536 2fd20d58798ef438fa0566841121db855822f755 03ff53013808bc5e7e2088531a55f20c097592e7 b049f3e8cb5b4a98a119a6c347b97d4dedd1d08a; do
            git cat-file blob "$blob" > /dev/null
          done
          npm ci --no-audit --no-fund > "$OUT/logs/install.log" 2>&1
          git diff --exit-code HEAD -- package.json package-lock.json bun.lockb
      - name: Actual fixed, whole-original, restored and physical fault outcomes
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$GITHUB_WORKSPACE/scripts/lib/offlineTransport.cjs"
          : > "$QA_OUT/transport/caller.log"
          export SIM_OFFLINE_RECEIPT="$QA_OUT/transport/caller.log"
          node scripts/qa/topGamesDecisionQualification.mjs "$QA_OUT/decisions" > "$QA_OUT/logs/decisions.log" 2>&1
          node scripts/qa/topGamesOtherQualification.mjs "$QA_OUT/other" > "$QA_OUT/logs/other.log" 2>&1
          test ! -s "$QA_OUT/transport/caller.log"
      - name: Always require full source restoration and empty status
        if: always()
        run: |
          set -euo pipefail
          git diff --exit-code HEAD > "$QA_OUT/source-diff.txt"
          git ls-files -z | sort -z | xargs -0 sha256sum > "$QA_OUT/source-after.sha256"
          cmp "$QA_OUT/source-before.sha256" "$QA_OUT/source-after.sha256"
          git status --porcelain=v1 --untracked-files=all > "$QA_OUT/status-after.txt"
          cmp "$QA_OUT/status-before.txt" "$QA_OUT/status-after.txt"
          sha256sum --check "$QA_OUT/source-before.sha256" > "$QA_OUT/source-held.log"
      - name: Bound evidence
        id: artifact
        if: always()
        run: |
          set -euo pipefail
          test "$(du -sb "$QA_OUT" | cut -f1)" -lt 50000000
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.artifact.outputs.ready == 'true' }}
        with:
          name: popular-games-outcomes
          path: ${{ runner.temp }}/popular-games-outcomes
          if-no-files-found: error
          retention-days: 7
