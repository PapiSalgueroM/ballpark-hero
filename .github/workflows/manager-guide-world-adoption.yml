name: Manager guide world adoption verification
on:
  push:
    branches: [codex/manager-guide-world-adoption]
    paths:
      - .github/workflows/manager-guide-world-adoption.yml
      - src/data/gameContent/clubManagement.ts
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CI: '1'
      SIM_NETWORK: offline
      ENGINES: chromium
      TZ: UTC
      PRERENDER_ONLY: /club-manager,/whats-new
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bind the reviewed guide and retain complete committed source
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          out="$RUNNER_TEMP/manager-guide-world-adoption"; test ! -e "$out"; mkdir "$out"
          echo "MANAGER_GUIDE_OUT=$out" >> "$GITHUB_ENV"
          echo "FREE_KICK_FONT_CACHE=$out/font-cache" >> "$GITHUB_ENV"
          git rev-parse HEAD > "$out/head.txt"; git rev-parse 'HEAD^{tree}' > "$out/tree.txt"
          git -c core.autocrlf=false archive --format=zip HEAD > "$out/source.zip"
          git ls-files -z | sort -z | xargs -0 sha256sum > "$out/request-source-files.sha256"
          git ls-files -z -- ':!src/data/searchKeywords.json' ':!scripts/data/guideHeadingsFrozen.json' ':!public/club-manager/index.html' ':!public/whats-new/index.html' ':!public/sitemap.xml' ':!scripts/data/lastmod.json' | sort -z | xargs -0 sha256sum > "$out/source-files.sha256"
          sha256sum "$out/source.zip" "$out/request-source-files.sha256" "$out/source-files.sha256" > "$out/initial-source-packet.sha256"
          git merge-base --is-ancestor 8293c758f4284d21baaa2320383cfd5cb5bd4944 HEAD
          git diff --exit-code 8293c758f4284d21baaa2320383cfd5cb5bd4944 HEAD -- . ':!docs' ':!src/data/gameContent/clubManagement.ts' ':!.github/workflows/manager-guide-world-adoption.yml' > "$out/base-source-hold.log"
          MANAGER_GUIDE_OUT="$out" SIM_OFFLINE_RECEIPT="$out/sourceguard.transport" node --input-type=module > "$out/guide-source.log" 2>&1 <<'NODE'
          import fs from 'node:fs'; import assert from 'node:assert/strict'; import {createHash} from 'node:crypto'; import {execFileSync} from 'node:child_process';
          const out=process.env.MANAGER_GUIDE_OUT,ref='8158e4d0af9f9ef264b719a898692adcb2273300',file='src/data/gameContent/clubManagement.ts',sha=x=>createHash('sha256').update(x).digest('hex');
          const before=execFileSync('git',['show',ref+':'+file],{encoding:'utf8'}),actual=fs.readFileSync(file,'utf8');
          assert.equal(sha(actual),'c1b3eac551e1c844d74da58c8cb74475b44c8a96206b5c569477457d1850ae2f');
          const lines=actual.split('\n'),matches=lines.flatMap((line,index)=>{const inverse=lines.filter((_,i)=>i!==index).join('\n');return inverse===before?[{line,index}]:[];}); assert.equal(matches.length,1,'One inserted item must be the whole difference from the qualified314 guide');
          const item=JSON.parse(matches[0].line.trim().replace(/,$/,'')); assert.equal(typeof item,'string'); assert.equal(lines.filter(line=>line.trim()===matches[0].line.trim()).length,1);
          fs.writeFileSync(out+'/guide.original314.ts',before); fs.writeFileSync(out+'/guide.candidate.ts',actual); fs.writeFileSync(out+'/guide-fixture.reference314.json',execFileSync('git',['show',ref+':scripts/data/guideHeadingsFrozen.json']));
          fs.copyFileSync('scripts/data/guideHeadingsFrozen.json',out+'/guide-fixture.before.json'); fs.writeFileSync(out+'/guide-source-bindings.json',JSON.stringify({base:'8293c758f4284d21baaa2320383cfd5cb5bd4944',reference:ref,file,originalSha256:sha(before),candidateSha256:sha(actual),item,inverseWholeExact:true},null,2)+'\n');
          console.log('PASS exact reviewed guide and whole qualified314 inverse; other source held8293.');
          NODE
          printf '%s\0' "$(command -v node)" "$(readlink -f "$(command -v npm)")" | sort -z | xargs -0 sha256sum > "$out/runtime-tools-files.sha256"
          npm --version > "$out/npm-version.txt"
      - name: Locked application and isolated browser tools and fonts
        run: |
          set -euo pipefail
          out="$MANAGER_GUIDE_OUT"
          npm ci > "$out/install.log" 2>&1
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/qa/soccerAgentReviewDependencies.mjs before > "$out/dependencies-before.log" 2>&1
          browser_tools="$RUNNER_TEMP/manager-guide-browser"
          npm install --prefix "$browser_tools" --no-save --package-lock=false playwright@1.64.0 > "$out/browser-install.log" 2>&1
          test ! -e node_modules/playwright; test ! -e node_modules/playwright-core
          ln -s "$browser_tools/node_modules/playwright" node_modules/playwright; ln -s "$browser_tools/node_modules/playwright-core" node_modules/playwright-core
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/qa/soccerAgentReviewDependencies.mjs after > "$out/dependencies-after.log" 2>&1
          cp soccer-agent-review-artifacts/dependencies-*.json "$out/"
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node --input-type=module <<'NODE'
          import fs from 'node:fs'; import assert from 'node:assert/strict';
          const out=process.env.MANAGER_GUIDE_OUT,before=JSON.parse(fs.readFileSync(out+'/dependencies-before.json')),after=JSON.parse(fs.readFileSync(out+'/dependencies-after.json'));
          assert.equal(before.packages.length,521); assert.equal(after.packages.length,521); assert.deepEqual(after.packages,before.packages); assert.deepEqual(after.packageFiles,before.packageFiles); assert.equal(after.addedBrowserPackage,'1.64.0'); fs.writeFileSync(out+'/node-versions.json',JSON.stringify(process.versions,null,2)+'\n');
          NODE
          node "$browser_tools/node_modules/playwright/cli.js" install --with-deps chromium > "$out/chromium-install.log" 2>&1
          python -m pip install fonttools pillow > "$out/fonts-install.log" 2>&1; python -m pip freeze > "$out/python-packages.txt"
          FREE_KICK_FONT_CACHE="$out/font-cache" node scripts/qa/freeKickLab1070.mjs --prefetch-fonts-only > "$out/font-prefetch.log" 2>&1
          find "$out/font-cache" -type f -print0 | sort -z | xargs -0 sha256sum > "$out/font-files.sha256"
          find node_modules -path node_modules/.vite -prune -o -type f -print0 | sort -z | xargs -0 sha256sum > "$out/installed-files.sha256"
          find "$browser_tools/node_modules" -type f -print0 | sort -z | xargs -0 sha256sum > "$out/browser-tool-files.sha256"
      - name: Actual guide fixture keyword generation and application types
        id: generators
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          out="$MANAGER_GUIDE_OUT"
          preload_check='const assert=require("node:assert/strict"); assert.ok((process.env.NODE_OPTIONS||"").includes("offlineTransport.cjs"),"Children retain offline preload"); assert.ok(require.cache[require.resolve("./scripts/lib/offlineTransport.cjs")],"Actual offline preload is in require.cache");'
          status=0; NODE_OPTIONS='' node -e "$preload_check" > "$out/preload-control.log" 2>&1 || status=$?
          printf '%s\n' "$status" > "$out/preload-control.exit"; test "$status" -eq 1; grep -F 'AssertionError' "$out/preload-control.log"; grep -F 'Children retain offline preload' "$out/preload-control.log"
          node -e "$preload_check" > "$out/preload-normal.log" 2>&1
          SIM_OFFLINE_RECEIPT="$out/refresh.transport" node scripts/simGuideHeadings.mjs --refresh /club-manager > "$out/refresh.log" 2>&1
          cp scripts/data/guideHeadingsFrozen.json "$out/guide-fixture.after.json"
          SIM_OFFLINE_RECEIPT="$out/fixture.transport" node --input-type=module > "$out/fixture.log" 2>&1 <<'NODE'
          import fs from 'node:fs'; import assert from 'node:assert/strict';
          const out=process.env.MANAGER_GUIDE_OUT,read=file=>JSON.parse(fs.readFileSync(out+'/'+file)),before=read('guide-fixture.before.json'),reference=read('guide-fixture.reference314.json'),after=read('guide-fixture.after.json'),binding=read('guide-source-bindings.json');
          assert.deepEqual(Object.keys(after.routes),Object.keys(before.routes)); for(const route of Object.keys(before.routes)) if(route!=='/club-manager') assert.deepEqual(after.routes[route],before.routes[route],route);
          const cm=after.routes['/club-manager'],old=reference.routes['/club-manager']; assert.deepEqual(Object.keys(cm),Object.keys(old)); assert(!old.howToPlay.includes(binding.item)); assert.equal(cm.howToPlay.filter(item=>item===binding.item).length,1);
          assert.deepEqual(cm.howToPlay.filter(item=>item!==binding.item),old.howToPlay); for(const part of ['rules','example','tips']) assert.deepEqual(cm[part],old[part]);
          fs.writeFileSync(out+'/guide-fixture-check.json',JSON.stringify({status:'passed',reference:binding.reference,item:binding.item,addedHowToPlayItems:1,allOther314ManagerPartsHeld:true,otherRoutesHeldTo8293:Object.keys(before.routes).length-1},null,2)+'\n'); console.log('PASS actual refreshed Manager fixture is qualified314 plus one item; other route records held8293.');
          NODE
          SIM_OFFLINE_RECEIPT="$out/keywords-1.transport" node scripts/genSearchKeywords.mjs > "$out/keywords-1.log" 2>&1
          cp src/data/searchKeywords.json "$out/searchKeywords.first.json"
          SIM_OFFLINE_RECEIPT="$out/keywords-2.transport" node scripts/genSearchKeywords.mjs > "$out/keywords-2.log" 2>&1
          cp src/data/searchKeywords.json "$out/searchKeywords.second.json"; cmp "$out/searchKeywords.first.json" "$out/searchKeywords.second.json" > "$out/keyword-determinism.log"
          sha256sum "$out/searchKeywords.first.json" "$out/searchKeywords.second.json" > "$out/keyword-output.sha256"
          SIM_OFFLINE_RECEIPT="$out/types.transport" node_modules/.bin/tsc --noEmit -p tsconfig.app.json > "$out/types.log" 2>&1
          cat "$out/refresh.log" "$out/fixture.log" "$out/keywords-1.log" "$out/keywords-2.log"
      - name: One serial production build and two saved pages
        id: build
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          SIM_OFFLINE_RECEIPT="$MANAGER_GUIDE_OUT/build.transport" npm run build:seo > "$MANAGER_GUIDE_OUT/build.log" 2>&1
          tail -n 6 "$MANAGER_GUIDE_OUT/build.log"
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > "$MANAGER_GUIDE_OUT/dist-files.sha256"
      - name: All fifteen rebuilt-site readers and existing guide and search checks
        id: readers
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          out="$MANAGER_GUIDE_OUT"
          node scripts/lib/hostLikeServer.mjs dist 4173 > "$out/server-readers.log" 2>&1 &
          server=$!; trap 'kill "$server" 2>/dev/null || true' EXIT
          ready=0; for attempt in 1 2 3 4 5; do if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then ready=1; break; fi; sleep 1; done; test "$ready" -eq 1
          failed=0
          for method in simAdsense simBrand simHeadTags simHiddenPages simHubs simIndexNow simIndexing simInternalLinks simNoRivalNames simPrerender simPrerenderBoot simRetiredRoutes simSchema simSitemap simSnapshotAssets simGuideHeadings simSiteSearch; do
            status=0; SIM_OFFLINE_RECEIPT="$out/$method.transport" BASE=http://127.0.0.1:4173 SWEEP_BASE=http://127.0.0.1:4173 node "scripts/$method.mjs" > "$out/$method.log" 2>&1 || status=$?
            printf '%s\t%s\n' "$method" "$status" >> "$out/readers.tsv"; tail -n 3 "$out/$method.log"
            test "$status" -eq 0 || failed=1; test ! -s "$out/$method.transport" || failed=1
          done
          test "$(wc -l < "$out/readers.tsv")" -eq 17; exit "$failed"
      - name: Unchanged full fourteen page weights with every failure fatal
        id: weights
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          out="$MANAGER_GUIDE_OUT"
          node scripts/lib/hostLikeServer.mjs dist 4173 > "$out/server-weights.log" 2>&1 &
          server=$!; trap 'kill "$server" 2>/dev/null || true' EXIT
          ready=0; for attempt in 1 2 3 4 5; do if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then ready=1; break; fi; sleep 1; done; test "$ready" -eq 1
          status=0; SIM_OFFLINE_RECEIPT="$out/weights.transport" SWEEP_OFFLINE=1 BASE=http://127.0.0.1:4173 SWEEP_BASE=http://127.0.0.1:4173 node scripts/sweepWeight.mjs > "$out/weights.log" 2>&1 || status=$?
          cat "$out/weights.log"; printf '%s\n' "$status" > "$out/weights-exit.txt"; exit "$status"
      - name: Complete actual source and dist with only six generated paths permitted
        if: always()
        run: |
          set -euo pipefail
          out="${MANAGER_GUIDE_OUT:-$RUNNER_TEMP/manager-guide-world-adoption}"; mkdir -p "$out"; result=0
          generated=(src/data/searchKeywords.json scripts/data/guideHeadingsFrozen.json public/club-manager/index.html public/whats-new/index.html public/sitemap.xml scripts/data/lastmod.json)
          excluded=(); for file in "${generated[@]}"; do excluded+=(":!$file"); done
          git diff --exit-code HEAD -- . "${excluded[@]}" > "$out/non-generated-diff.log" 2>&1 || result=1
          git diff --binary HEAD -- "${generated[@]}" > "$out/generated.patch"; git diff --name-only HEAD | sort > "$out/generated-paths.txt"
          printf '%s\n' "${generated[@]}" | sort > "$out/allowed-generated-paths.txt"
          comm -23 "$out/generated-paths.txt" "$out/allowed-generated-paths.txt" > "$out/unexpected-generated-paths.txt"; test ! -s "$out/unexpected-generated-paths.txt" || result=1
          git ls-files -z | sort -z | xargs -0 sha256sum > "$out/validated-source-files.sha256"
          MANAGER_GUIDE_ARCHIVE_OUT="$out" python - <<'PY'
          import os,subprocess,zipfile
          out=os.environ['MANAGER_GUIDE_ARCHIVE_OUT']; files=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          with zipfile.ZipFile(out+'/validated-source.zip','w',zipfile.ZIP_DEFLATED) as archive:
              for file in sorted(filter(None,files)): archive.write(file,file)
          if os.path.isdir('dist'):
              with zipfile.ZipFile(out+'/dist.zip','w',zipfile.ZIP_DEFLATED) as archive:
                  for folder,dirs,names in os.walk('dist'):
                      for name in sorted(names): archive.write(os.path.join(folder,name),os.path.join(folder,name))
          PY
          if test -d dist; then find dist -type f -print0 | sort -z | xargs -0 sha256sum > "$out/dist-after-files.sha256"; fi
          if test -f "$out/dist-files.sha256"; then cmp "$out/dist-files.sha256" "$out/dist-after-files.sha256" > "$out/dist-inventory-hold.log" 2>&1 || result=1; fi
          printf 'generators=%s\nbuild=%s\nreaders=%s\nweights=%s\n' '${{ steps.generators.outcome }}' '${{ steps.build.outcome }}' '${{ steps.readers.outcome }}' '${{ steps.weights.outcome }}' > "$out/stage-outcomes.txt"
          exit "$result"
      - name: Source installed tool font and transport holds
        if: always()
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          out="${MANAGER_GUIDE_OUT:-$RUNNER_TEMP/manager-guide-world-adoption}"; result=0
          for kind in source installed browser-tool runtime-tools font validated-source dist; do file="$out/$kind-files.sha256"; if test -f "$file"; then sha256sum --check "$file" > "$out/$kind-holds.log" 2>&1 || result=1; fi; done
          if test -f "$out/initial-source-packet.sha256"; then sha256sum --check "$out/initial-source-packet.sha256" > "$out/initial-source-packet-holds.log" 2>&1 || result=1; fi
          if test -f "$out/installed-files.sha256"; then find node_modules -path node_modules/.vite -prune -o -type f -print0 | sort -z | xargs -0 sha256sum > "$out/installed-after-files.sha256"; cmp "$out/installed-files.sha256" "$out/installed-after-files.sha256" || result=1; fi
          build_classified=0
          if node --input-type=module > "$out/build-transport-classification.log" 2>&1 <<'NODE'
          import fs from 'node:fs'; import assert from 'node:assert/strict'; import {createHash} from 'node:crypto'; import {createRequire} from 'node:module';
          import {SAMPLE_DAYS} from './scripts/lib/prerenderClock.mjs';
          const out=process.env.MANAGER_GUIDE_OUT || process.env.RUNNER_TEMP+'/manager-guide-world-adoption',sha=bytes=>createHash('sha256').update(bytes).digest('hex'),report={status:'running',observations:[],sources:{},method:'Classify retained denials only; no network permission or routing change'};
          try {
            assert((process.env.NODE_OPTIONS||'').includes('offlineTransport.cjs')); const require=createRequire(import.meta.url); assert(require.cache[require.resolve('./scripts/lib/offlineTransport.cjs')]); assert.equal(process.env.PRERENDER_ONLY,'/club-manager,/whats-new'); assert.deepEqual(SAMPLE_DAYS,[0,5,11]);
            for(const file of ['scripts/lib/offlineTransport.cjs','scripts/lib/prerenderClock.mjs','scripts/prerender.mjs']) report.sources[file]=sha(fs.readFileSync(file));
            const line='[SIM_OFFLINE_BLOCK] external browser route continue https://fonts.googleapis.com\n',expected=Buffer.from(line.repeat(6)); assert.equal(sha(expected),'c4e7112f2cc3b3de62f2c38ea0b7eee8ec8e6840a80f328d35df500e9196c6b5');
            const classify=bytes=>{assert(bytes.equals(expected),'Build must record exactly the six known denied font requests');return bytes.toString('utf8').split('\n').slice(0,-1);},actual=fs.readFileSync(out+'/build.transport'); report.observations.push({case:'actual-six-font-denials',accepted:true,sha256:sha(actual),bytes:actual.length,rows:classify(actual)});
            const controls=[['missing-line',Buffer.from(line.repeat(5))],['extra-line',Buffer.from(line.repeat(7))],['database-line',Buffer.from(line.repeat(5)+'[SIM_OFFLINE_BLOCK] database browser route continue https://fixture.invalid\n')]];
            for(const [name,changed] of controls){assert(!changed.equals(actual));assert.throws(()=>classify(changed),assert.AssertionError);report.observations.push({case:name,accepted:false,sha256:sha(changed),bytes:changed.length});} assert.equal(report.observations.length,4); report.status='passed'; console.log('PASS actual six denied font requests and three effective receipt-only rejection controls');
          } catch(error){report.status='failed';report.error=error.stack;throw error;} finally{fs.writeFileSync(out+'/build-transport-classification.json',JSON.stringify(report,null,2)+'\n');}
          NODE
          then build_classified=1; else result=1; fi
          if test "$build_classified" -ne 1; then test ! -s "$out/build.transport" || result=1; fi
          for method in sourceguard refresh fixture keywords-1 keywords-2 types simAdsense simBrand simHeadTags simHiddenPages simHubs simIndexNow simIndexing simInternalLinks simNoRivalNames simPrerender simPrerenderBoot simRetiredRoutes simSchema simSitemap simSnapshotAssets simGuideHeadings simSiteSearch; do test ! -s "$out/$method.transport" || result=1; done
          # Weight asset denials remain retained offline-method evidence, not ordinary zero-block credit.
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manager-guide-world-adoption-${{ github.sha }}
          path: ${{ env.MANAGER_GUIDE_OUT }}
          if-no-files-found: error
          retention-days: 14
