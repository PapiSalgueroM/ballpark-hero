name: Soccer rival veteran wage verification
on:
  push:
    branches: [codex/career-rival-veteran-pay]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      SIM_NETWORK: offline
      ENGINES: chromium
      VITEST_MAX_FORKS: 1
      VITEST_MIN_FORKS: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retain source and capture commands
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = codex/career-rival-veteran-pay
          mkdir career-rival-wages-artifacts
          git cat-file -e 4a5f759aeab6d0e7b8d29e55d3cd624c8ad20c54^{commit}
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse '4a5f759aeab6d0e7b8d29e55d3cd624c8ad20c54^{tree}')" = 8f8078136ba98fc07c944553aeaa53c307a68554
          git -c core.autocrlf=false archive --format=zip HEAD > career-rival-wages-artifacts/source.zip
          git -c core.autocrlf=false archive --format=zip 4a5f759aeab6d0e7b8d29e55d3cd624c8ad20c54 > career-rival-wages-artifacts/base.zip
          git ls-tree -r HEAD > career-rival-wages-artifacts/source-inventory.txt
          git ls-tree -r 4a5f759aeab6d0e7b8d29e55d3cd624c8ad20c54 > career-rival-wages-artifacts/base-inventory.txt
          sha256sum career-rival-wages-artifacts/source.zip career-rival-wages-artifacts/base.zip > career-rival-wages-artifacts/source-archives.sha256
          node --input-type=module <<'SCOPE'
          import fs from 'node:fs';import assert from 'node:assert/strict';import {execFileSync} from 'node:child_process';
          const base='4a5f759aeab6d0e7b8d29e55d3cd624c8ad20c54',allowed=['src/lib/soccerCareerEngine.ts','src/test/soccerCareerContracts.test.ts','scripts/qa/soccerRivalWagesProof.mjs','.github/workflows/career-rival-veteran-pay.yml','docs/CAREER-RIVAL-VETERAN-PAY.md'];
          const changed=execFileSync('git',['diff','--name-only','-z',base,'HEAD']).toString().split('\0').filter(Boolean);
          fs.writeFileSync('career-rival-wages-artifacts/source-scope.json',JSON.stringify({base,allowed,changed},null,2));assert.deepEqual([...changed].sort(),[...allowed].sort());
          SCOPE
          node --input-type=module <<'PINS'
          import fs from 'node:fs';import assert from 'node:assert/strict';import {createHash} from 'node:crypto';
          const pins=[['src/lib/soccerCareerEngine.ts',544380,'e37b73f25a17e4c63718430365de87cd1d5a001960ba8257ac674834e691dd90'],['src/test/soccerCareerContracts.test.ts',14350,'7746509861c887dfa0f0cf56d62a37fa6386f0a0ea9702ee8d23ba92469e78d4'],['scripts/qa/soccerRivalWagesProof.mjs',18671,'94529a3bbea10104125a3efbea87e9b8291f57c0023ceafbc410f0aa2e654db0']];
          fs.writeFileSync('career-rival-wages-artifacts/expected-source-pins.json',JSON.stringify(pins,null,2));for(const [file,bytes,sha256] of pins){const body=fs.readFileSync(file);assert.equal(body.length,bytes);assert.equal(createHash('sha256').update(body).digest('hex'),sha256);}
          PINS
          git rev-parse HEAD HEAD^{tree} > career-rival-wages-artifacts/head-tree.txt
          cp package.json career-rival-wages-artifacts/package.before.json
          cp package-lock.json career-rival-wages-artifacts/package-lock.before.json
          sha256sum src/lib/soccerCareerEngine.ts src/test/soccerCareerContracts.test.ts scripts/qa/soccerRivalWagesProof.mjs .github/workflows/career-rival-veteran-pay.yml docs/CAREER-RIVAL-VETERAN-PAY.md scripts/qa/soccerAgentReviewDependencies.mjs scripts/simSoccerContractMoves.mjs scripts/simSoccerVeteranOffers.mjs scripts/simCareerDilemmaTruth.mjs scripts/lib/offlineTransport.cjs > career-rival-wages-artifacts/source-hold.sha256
          cat > career-rival-wages-artifacts/capture.sh <<'CAPTURE'
          capture() {
            local label="$1"; shift
            printf '%s\0' "$@" > "career-rival-wages-artifacts/$label.argv"
            set +e
            "$@" > "career-rival-wages-artifacts/$label.stdout" 2> "career-rival-wages-artifacts/$label.stderr"
            local code=$?
            set -e
            echo "$code" > "career-rival-wages-artifacts/$label.exit"
            cat "career-rival-wages-artifacts/$label.stdout"
            cat "career-rival-wages-artifacts/$label.stderr" >&2
            return "$code"
          }
          CAPTURE
      - name: Install remote verification dependencies
        id: dependencies
        run: |
          set -euo pipefail
          source career-rival-wages-artifacts/capture.sh
          capture npm-ci npm ci
          capture locked-before node scripts/qa/soccerAgentReviewDependencies.mjs before
          cp soccer-agent-review-artifacts/dependencies-before.json career-rival-wages-artifacts/dependencies-before.json
          browser_tools="$RUNNER_TEMP/rival-wage-seo-browser-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$browser_tools"
          printf '{"private":true,"dependencies":{"playwright":"1.64.0"}}\n' > "$browser_tools/package.json"
          capture playwright-package npm install --prefix "$browser_tools" --ignore-scripts --no-audit --no-fund
          test ! -e node_modules/playwright
          test ! -e node_modules/playwright-core
          ln -s "$browser_tools/node_modules/playwright" node_modules/playwright
          ln -s "$browser_tools/node_modules/playwright-core" node_modules/playwright-core
          cp "$browser_tools/package.json" career-rival-wages-artifacts/browser-package.json
          cp "$browser_tools/package-lock.json" career-rival-wages-artifacts/browser-package-lock.json
          capture chromium node "$browser_tools/node_modules/playwright/cli.js" install --with-deps chromium
          capture locked-after-setup node scripts/qa/soccerAgentReviewDependencies.mjs after
          cp soccer-agent-review-artifacts/dependencies-after.json career-rival-wages-artifacts/dependencies-after-setup.json
          node --input-type=module <<'PLAYWRIGHT'
          import fs from 'node:fs';import assert from 'node:assert/strict';for(const name of ['playwright','playwright-core'])assert.equal(JSON.parse(fs.readFileSync('node_modules/'+name+'/package.json')).version,'1.64.0');
          PLAYWRIGHT
          capture fonts python -m pip install fonttools pillow
          cmp package.json career-rival-wages-artifacts/package.before.json
          cmp package-lock.json career-rival-wages-artifacts/package-lock.before.json
      - name: Actual application type gate
        id: types
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          set -euo pipefail
          source career-rival-wages-artifacts/capture.sh
          capture types node_modules/.bin/tsc --noEmit -p tsconfig.app.json
      - name: Focused actual rival wage units with whole original and undo
        id: proof
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.types.outcome == 'success' }}
        run: |
          set -euo pipefail
          source career-rival-wages-artifacts/capture.sh
          capture proof env SOCCER_RIVAL_WAGES_PROOF_OUT=career-rival-wages-artifacts/proof node scripts/qa/soccerRivalWagesProof.mjs
      - name: Independently reopen every unit result and full original undo
