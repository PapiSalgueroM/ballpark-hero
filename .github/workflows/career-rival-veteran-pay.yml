              keys(comparison,['id','status','current','original','undo','currentWage','originalWage','changed','rawSetupCallerEqual','rawActionCallerEqual','callerScope']); assert.equal(comparison.status,'pass'); assert.deepEqual(comparison.current,report.arms[0].actualRows); assert.deepEqual(comparison.original,report.arms[1].actualRows); assert.deepEqual(comparison.undo,report.arms[2].actualRows);
              assert.equal(now.inputBefore,old.inputBefore); assert.equal(now.inputBefore,undo.inputBefore); assert.equal(now.choiceBefore,old.choiceBefore); assert.equal(now.choiceBefore,undo.choiceBefore); assert.equal(now.result,undo.result); assert.deepEqual(now.fixtureDraws.map(row=>row.value),old.fixtureDraws.map(row=>row.value)); assert.deepEqual(now.fixtureDraws.map(row=>row.value),undo.fixtureDraws.map(row=>row.value));
              const expected=JSON.parse(old.result), currentResult=JSON.parse(now.result); expected.weeklyWage=spec.currentWage; let changes=0, signing=0;
              expected.events=expected.events.map(line=>{if(!line.startsWith('✍️ Signed with Twente '))return line;signing++;assert.equal(line.split(`(4yr, ${spec.originalLabel})`).length-1,1);const changed=line.replace(`(4yr, ${spec.originalLabel})`,`(4yr, ${spec.currentLabel})`);if(changed!==line)changes++;return changed;});
              assert.equal(signing,1); assert.equal(changes,spec.currentWage===spec.originalWage?0:1); assert.deepEqual(expected,currentResult); assert.equal(comparison.currentWage,spec.currentWage); assert.equal(comparison.originalWage,spec.originalWage); assert.equal(comparison.changed,spec.currentWage!==spec.originalWage); assert.equal(comparison.changed,now.result!==old.result);
              assert.equal(comparison.rawSetupCallerEqual,JSON.stringify(now.fixtureDraws)===JSON.stringify(old.fixtureDraws)); assert.equal(comparison.rawActionCallerEqual,JSON.stringify(now.draws)===JSON.stringify(old.draws)); assert.equal(comparison.callerScope,'Full raw callers retained; only ordered draw values/count and actual route names are asserted across Source arms. Raw caller strings are never normalized.'); summary.comparisons++;
            }
            const stdout=fs.readFileSync(path.join(ART,'proof.stdout'),'utf8'), stderr=fs.readFileSync(path.join(ART,'proof.stderr'),'utf8'); assert.equal(fs.readFileSync(path.join(ART,'proof.exit'),'utf8').trim(),'0'); assert(stdout.split('\n').filter(line=>line.trim()).length>=4); assert(stdout.trimEnd().endsWith('soccerRivalWagesProof PASS arms3 tests69 originalWageFailures10 traceRows39')); assert(!/(^|\s)(FAIL|EMPTY|SKIP)(\s|$)|^\[SIM_OFFLINE_BLOCK\]/m.test(stdout+'\n'+stderr));
            assert.deepEqual(fs.readFileSync(path.join(ART,'proof.argv'),'utf8').split('\0').filter(Boolean),['env','SOCCER_RIVAL_WAGES_PROOF_OUT=career-rival-wages-artifacts/proof','node','scripts/qa/soccerRivalWagesProof.mjs']);
            summary.processFiles=['proof.argv','proof.stdout','proof.stderr','proof.exit'].map(file=>{const bytes=fs.readFileSync(path.join(ART,file));return{file,bytes:bytes.length,sha256:hash(bytes)};});
            assert.equal(summary.runtimeControls,3); summary.runtimeControlScope='Copied normalized diagnostic text only; complete actual raw streams held.';
            assert.equal(summary.arms,3); assert.equal(summary.assertions,69); assert.equal(summary.observations,39); assert.equal(summary.comparisons,13); assert.equal(summary.transitions,2); summary.status='pass';
          } catch(error) { errors.push({name:error?.name||typeof error,message:String(error?.message||error),stack:String(error?.stack||error)}); summary.status='fail'; process.exitCode=1; }
          finally { fs.mkdirSync(ART,{recursive:true}); fs.writeFileSync(path.join(ART,'proof-consumer-references.json'),JSON.stringify(refs,null,2)); fs.writeFileSync(path.join(ART,'proof-consumer-errors.json'),JSON.stringify(errors,null,2)); fs.writeFileSync(path.join(ART,'proof-consumer-summary.json'),JSON.stringify({...summary,errors},null,2)); }
          if(summary.status==='pass') { console.log('PASS rival consumer: 3 arms, 69 assertions.'); console.log('PASS rival consumer: 10 wage faults, 39 traces.'); console.log('PASS rival consumer: 13 wage-only results, full raw callers.'); console.log('PASS rival consumer: full Source transitions, undo, references.'); }
          else console.error('FAIL rival consumer: complete errors and partial references retained.');
