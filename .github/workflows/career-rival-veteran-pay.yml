            assert.deepEqual(report.expectedTitles, titles); assert.deepEqual(report.cases, specs.map(({unitSpec,...row}) => row));
            assert.deepEqual(report.arms.map(row => row.id), armIds); assert.equal(report.transitions.length, 2); assert.deepEqual(report.transitions.map(row => row.id), ['original','whole-undo']);
            assert.deepEqual(report.sourceBefore.map(row => row.file), held); assert.deepEqual(report.sourceAfter.map(row => row.file), held);
