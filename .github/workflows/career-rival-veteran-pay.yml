      - name: Full production SEO build
        id: build
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.types.outcome == 'success' && steps.proof.outcome == 'success' && steps.proof_consumer.outcome == 'success' }}
        run: |
          set -euo pipefail
          source career-rival-wages-artifacts/capture.sh
          capture build npm run build:seo
      - name: Three unchanged related methods with complete child output
        id: related
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          source career-rival-wages-artifacts/capture.sh
          failed=0
          printf 'harness\texit\tlines\tverdict\n' > career-rival-wages-artifacts/related.tsv
          for harness in simSoccerContractMoves simSoccerVeteranOffers simCareerDilemmaTruth; do
            capture "$harness" env SIM_NETWORK=offline NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$PWD/career-rival-wages-artifacts/$harness.transport.log" node "scripts/$harness.mjs" || failed=1
            status="$(cat "career-rival-wages-artifacts/$harness.exit")"
            lines="$(cat "career-rival-wages-artifacts/$harness.stdout" "career-rival-wages-artifacts/$harness.stderr" | awk 'NF && $0 !~ /^\[SIM_OFFLINE_BLOCK\]/ {n++} END {print n+0}')"
            verdict=PASS
            if test "$status" -ne 0; then verdict=FAIL; failed=1; fi
            if test "$status" -eq 0 && test "$lines" -lt 4; then verdict=EMPTY; failed=1; fi
            if grep -E '(^|[[:space:]])(FAIL|SKIP|EMPTY)([[:space:]]|$)|^\[SIM_OFFLINE_BLOCK\]' "career-rival-wages-artifacts/$harness.stdout" "career-rival-wages-artifacts/$harness.stderr" > /dev/null; then verdict=FAIL; failed=1; fi
            if test -s "career-rival-wages-artifacts/$harness.transport.log"; then verdict=FAIL; failed=1; fi
            printf '%s\t%s\t%s\t%s\n' "$harness" "$status" "$lines" "$verdict" >> career-rival-wages-artifacts/related.tsv
            printf '%s: %s (exit %s, %s complete output lines)\n' "$harness" "$verdict" "$status" "$lines"
          done
          test "$(tail -n +2 career-rival-wages-artifacts/related.tsv | wc -l)" -eq 3
          exit "$failed"
      - name: Every unchanged rebuilt reader with full child output
        id: readers
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          source career-rival-wages-artifacts/capture.sh
          node scripts/lib/hostLikeServer.mjs dist 4173 > career-rival-wages-artifacts/reader-server.stdout 2> career-rival-wages-artifacts/reader-server.stderr &
          reader_server=$!
          trap 'kill "$reader_server" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" -eq 1
          failed=0
          printf 'harness\texit\tlines\tverdict\n' > career-rival-wages-artifacts/readers.tsv
          for harness in simAdsense simBrand simHeadTags simHiddenPages simHubs simIndexNow simIndexing simInternalLinks simNoRivalNames simPrerender simPrerenderBoot simRetiredRoutes simSchema simSitemap simSnapshotAssets; do
            capture "$harness" env SIM_NETWORK=offline ENGINES=chromium NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$PWD/career-rival-wages-artifacts/$harness.transport.log" BASE=http://127.0.0.1:4173 SWEEP_BASE=http://127.0.0.1:4173 node "scripts/$harness.mjs" || failed=1
            status="$(cat "career-rival-wages-artifacts/$harness.exit")"
            lines="$(cat "career-rival-wages-artifacts/$harness.stdout" "career-rival-wages-artifacts/$harness.stderr" | awk 'NF && $0 !~ /^\[SIM_OFFLINE_BLOCK\]/ {n++} END {print n+0}')"
            verdict=PASS
            if test "$status" -ne 0; then verdict=FAIL; failed=1; fi
            if test "$status" -eq 0 && test "$lines" -lt 4; then verdict=EMPTY; failed=1; fi
            if grep -E '(^|[[:space:]])(FAIL|SKIP|EMPTY)([[:space:]]|$)|^\[SIM_OFFLINE_BLOCK\]' "career-rival-wages-artifacts/$harness.stdout" "career-rival-wages-artifacts/$harness.stderr" > /dev/null; then verdict=FAIL; failed=1; fi
            if test -s "career-rival-wages-artifacts/$harness.transport.log"; then verdict=FAIL; failed=1; fi
            printf '%s\t%s\t%s\t%s\n' "$harness" "$status" "$lines" "$verdict" >> career-rival-wages-artifacts/readers.tsv
            printf '%s: %s (exit %s, %s complete output lines)\n' "$harness" "$verdict" "$status" "$lines"
          done
          test "$(tail -n +2 career-rival-wages-artifacts/readers.tsv | wc -l)" -eq 15
          exit "$failed"
      - name: Whole source and package holds
        if: always()
        run: |
          set -euo pipefail
          source career-rival-wages-artifacts/capture.sh
          git diff --binary HEAD > career-rival-wages-artifacts/generated.patch
          cp package.json career-rival-wages-artifacts/package.after.json
          cp package-lock.json career-rival-wages-artifacts/package-lock.after.json
          failed=0
          capture source-hold sha256sum -c career-rival-wages-artifacts/source-hold.sha256 || failed=1
          capture source-whole-hold git diff --exit-code HEAD -- . ':!public/**' ':!scripts/data/lastmod.json' || failed=1
          capture source-extra git ls-files --others --exclude-standard -- src scripts .github/workflows docs || failed=1
          test ! -s career-rival-wages-artifacts/source-extra.stdout || failed=1
          capture locked-final node scripts/qa/soccerAgentReviewDependencies.mjs after || failed=1
          if test -f soccer-agent-review-artifacts/dependencies-after.json; then cp soccer-agent-review-artifacts/dependencies-after.json career-rival-wages-artifacts/dependencies-final.json; fi
          capture package-hold cmp package.json career-rival-wages-artifacts/package.before.json || failed=1
          capture lock-hold cmp package-lock.json career-rival-wages-artifacts/package-lock.before.json || failed=1
          exit "$failed"
      - name: Preserve complete generated bodies and self-inclusive cap
        if: always()
        run: |
          set -euo pipefail
          mkdir -p career-rival-wages-artifacts
          paths=()
          for item in public dist scripts/data/lastmod.json; do
            if test -e "$item"; then paths+=("$item"); fi
          done
          tar -czf career-rival-wages-artifacts/generated.tar.gz "${paths[@]}"
          node --input-type=module <<'FOOTER'
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          const out='career-rival-wages-artifacts';
          const files=dir=>fs.readdirSync(dir,{withFileTypes:true}).flatMap(row=>row.isDirectory()?files(path.join(dir,row.name)):[path.join(dir,row.name)]);
          const count=()=>files(out).reduce((sum,file)=>sum+fs.statSync(file).size,0);
          const target=path.join(out,'size.json');
          fs.writeFileSync(target,JSON.stringify({bytes:0,cap:500000000}));
          let bytes=count();
          for(let i=0;i<3;i++){fs.writeFileSync(target,JSON.stringify({bytes,cap:500000000}));bytes=count();}
          if(bytes>=500000000){
            fs.writeFileSync(path.join(out,'cap-failure.json'),JSON.stringify({bytes,cap:500000000,retainedAllEvidence:true}));
            for(let i=0;i<3;i++){bytes=count();fs.writeFileSync(target,JSON.stringify({bytes,cap:500000000}));}
            bytes=count();
          }
          assert.equal(JSON.parse(fs.readFileSync(target)).bytes,count(),'Exact whole self-inclusive footer byte join');
          assert(bytes<500000000,'Whole self-inclusive evidence remains below500M; retain all failures without pruning');
          FOOTER
      - name: Upload complete evidence even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soccer-rival-veteran-pay-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: error
          path: career-rival-wages-artifacts/
