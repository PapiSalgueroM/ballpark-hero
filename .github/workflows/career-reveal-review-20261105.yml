name: Career Quiz reveal original proof
on:
  push:
    branches: [codex/career-reveal-review-qa-20261105]
permissions:
  contents: read
jobs:
  original:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        shell: bash
    env:
      SIM_NETWORK: offline
      SIM_OFFLINE_RECEIPT: reveal-review-original/offline.log
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - name: Locked install and original product receipt
        run: |
          mkdir -p reveal-review-original
          git rev-parse HEAD > reveal-review-original/head.txt
          git ls-files -s > reveal-review-original/source-before.txt
          sha256sum package.json package-lock.json > reveal-review-original/locks-before.txt
          npm ci
      - name: Original mounted page yields exactly owned business reds
        run: |
          set +e
          NODE_OPTIONS="--max-old-space-size=6144 --require=$PWD/scripts/lib/offlineTransport.cjs" node node_modules/vitest/vitest.mjs run src/test/careerRevealReview.test.tsx --maxWorkers=1 --minWorkers=1 --reporter=default --reporter=json --outputFile=reveal-review-original/units.json > reveal-review-original/units.log 2>&1
          status=$?
          set -e
          cat reveal-review-original/units.log
          test "$status" -eq 1
          node --input-type=module <<'NODE'
          import fs from 'node:fs'; import assert from 'node:assert/strict';
          const r=JSON.parse(fs.readFileSync('reveal-review-original/units.json'));
          const rows=r.testResults.flatMap(s=>s.assertionResults);
          assert.equal(r.numTotalTests,9); assert.equal(r.numFailedTests,9);
          const raw=fs.readFileSync('reveal-review-original/units.log','utf8');
          assert(!/Unhandled Errors|Unhandled Rejection|Uncaught Exception|Failed to resolve import/.test(raw));
          assert.equal(rows.length,9); assert.equal(rows.filter(x=>x.status==='failed').length,9);
          for(const row of rows) {
            assert(row.title.startsWith('REVIEW_'));
            assert(row.failureMessages.length>0);
            assert(row.failureMessages.every(msg=>msg.includes('postgame review exists')),'Only missing review business assertion: '+row.title);
          }
          console.log('PASS original: nine exact missing-review business failures, zero runtime errors');
          NODE
      - name: Original source lock and offline hold
        if: always()
        run: |
          git diff --exit-code HEAD -- src scripts package.json package-lock.json
          git ls-files -s > reveal-review-original/source-after.txt
          cmp reveal-review-original/source-before.txt reveal-review-original/source-after.txt
          sha256sum package.json package-lock.json > reveal-review-original/locks-after.txt
          cmp reveal-review-original/locks-before.txt reveal-review-original/locks-after.txt
          if test -f reveal-review-original/offline.log; then test ! -s reveal-review-original/offline.log; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: career-reveal-original-${{ github.run_id }}
          path: reveal-review-original
          retention-days: 14
          if-no-files-found: error
