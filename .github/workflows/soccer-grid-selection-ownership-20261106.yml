      GRID_CONTROLS_RUNNER_BLOB: 'ccaf33942eb91b911b09db56b93053d5f8ef931f'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - name: Exact qualified fixed parent and workflow-only delta
        run: |
          set -euo pipefail
          workflow=.github/workflows/soccer-grid-selection-ownership-20261106.yml
          if grep -Eq '__[A-Z][A-Z0-9_]*__' "$workflow"; then echo 'Unresolved controls binding'; exit 1; fi
          [[ "$GRID_CONTROLS_RUNNER_BLOB" =~ ^[a-f0-9]{40}$ ]]
          out=soccer-grid-selection-ownership-controls
          test ! -e "$out"
          mkdir "$out"
          touch "$out/offline.log"
          git rev-parse HEAD > "$out/head.txt"
          git rev-parse 'HEAD^{tree}' > "$out/tree.txt"
          git ls-files -s > "$out/source-before.txt"
          sha256sum package.json package-lock.json bun.lock bun.lockb > "$out/locks-before.txt"
          git diff --exit-code HEAD -- .
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const out='soccer-grid-selection-ownership-controls', workflow='.github/workflows/soccer-grid-selection-ownership-20261106.yml';
          const ref=JSON.parse(process.env.GRID_FIXED_REFERENCE);
          for (const key of ['run','job','artifact','zipBytes','rawBytes']) assert(Number.isSafeInteger(ref[key]) && ref[key]>0,key);
          for (const key of ['head','tree','workflow']) assert.match(ref[key],/^[a-f0-9]{40}$/);
          for (const key of ['zipSHA256','rawSHA256']) assert.match(ref[key],/^[a-f0-9]{64}$/);
          assert(Array.isArray(ref.bodyPins) && ref.bodyPins.length>47);
          assert.equal(new Set(ref.bodyPins.map(row=>row.file)).size,ref.bodyPins.length);
          for (const row of ref.bodyPins) {
            assert.deepEqual(Object.keys(row).sort(),['bytes','file','sha256']);
            assert(Number.isSafeInteger(row.bytes) && row.bytes>=0);
            assert.match(row.sha256,/^[a-f0-9]{64}$/);
          }
          const git=(...args)=>execFileSync('git',args,{encoding:'utf8',maxBuffer:16*1024*1024});
          const head=git('rev-parse','HEAD').trim(), tree=git('rev-parse','HEAD^{tree}').trim();
          assert.equal(head,process.env.GITHUB_SHA);
          assert.deepEqual(git('rev-list','--parents','-n','1','HEAD').trim().split(' '),[head,ref.head]);
          assert.equal(git('rev-parse',ref.head+'^{tree}').trim(),ref.tree);
          assert.equal(git('rev-parse',ref.head+':'+workflow).trim(),ref.workflow);
          assert.equal(git('diff','--name-status',ref.head,'HEAD').trim(),'M\t'+workflow);
          const rows=revision=>git('ls-tree','-r','-z',revision).split('\0').filter(Boolean);
          const file=row=>row.split('\t')[1], scope=rows=>rows.filter(row=>/^(src|public|scripts)\//.test(file(row)));
          const current=rows(head), parent=rows(ref.head), held=rows=>rows.filter(row=>file(row)!==workflow);
          assert.deepEqual([current.length,parent.length,held(current).length,scope(current).length],[5786,5786,5785,4661]);
          assert.deepEqual(held(current),held(parent));
          fs.writeFileSync(out+'/source-join.json',JSON.stringify({status:'passed',head,tree,fixedHead:ref.head,fixedTree:ref.tree,
            workflowBlob:git('rev-parse','HEAD:'+workflow).trim(),untrackedRunnerBlob:process.env.GRID_CONTROLS_RUNNER_BLOB,
            trackedRows:current.length,heldFixedRows:held(current).length,scopedSourceRows:scope(current).length,onlyChanged:workflow},null,2));
          NODE
      - name: Fresh locked install
        run: |
          set -euo pipefail
          npm ci 2>&1 | tee soccer-grid-selection-ownership-controls/install.log
      - name: Authenticate and retain the completed fixed archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          const ref=JSON.parse(process.env.GRID_FIXED_REFERENCE), out='soccer-grid-selection-ownership-controls/fixed-reference';
          const repo='repos/PapiSalgueroM/ballpark-hero/actions', command=(name,args)=>execFileSync(name,args,{maxBuffer:128*1024*1024});
          const fetch=endpoint=>command('gh',['api',repo+'/'+endpoint]);
          fs.mkdirSync(out);
          const sources={'run.json':'runs/'+ref.run,'jobs.json':'runs/'+ref.run+'/jobs?per_page=100','artifact.json':'artifacts/'+ref.artifact};
          for (const [file,endpoint] of Object.entries(sources)) fs.writeFileSync(out+'/'+file,fetch(endpoint),{flag:'wx'});
          const read=file=>JSON.parse(fs.readFileSync(out+'/'+file)), run=read('run.json'), jobs=read('jobs.json'), metadata=read('artifact.json');
          const artifact=Object.hasOwn(metadata,'artifacts')?(assert.equal(metadata.artifacts.length,1),metadata.artifacts[0]):metadata;
          assert.deepEqual([run.id,run.status,run.conclusion,run.head_sha,run.head_commit.tree_id,run.event,run.path,run.repository.full_name],
            [ref.run,'completed','success',ref.head,ref.tree,'push','.github/workflows/soccer-grid-selection-ownership-20261106.yml','PapiSalgueroM/ballpark-hero']);
          assert.equal(jobs.jobs.length,1);
          const job=jobs.jobs[0];
          assert.deepEqual([job.id,job.run_id,job.head_sha,job.status,job.conclusion],[ref.job,ref.run,ref.head,'completed','success']);
          assert(job.steps.length>0 && job.steps.every(step=>step.status==='completed'&&step.conclusion==='success'));
          assert.deepEqual([artifact.id,artifact.name,artifact.expired,artifact.size_in_bytes,artifact.digest,artifact.workflow_run.id,artifact.workflow_run.head_sha],
            [ref.artifact,'soccer-grid-selection-ownership-fixed-'+ref.run,false,ref.zipBytes,'sha256:'+ref.zipSHA256,ref.run,ref.head]);
          const zip=fetch('artifacts/'+ref.artifact+'/zip');
          assert.deepEqual([zip.length,createHash('sha256').update(zip).digest('hex')],[ref.zipBytes,ref.zipSHA256]);
          fs.writeFileSync(out+'/artifact.zip',zip,{flag:'wx'});
          const entries=command('unzip',['-Z1',out+'/artifact.zip']).toString('utf8').trimEnd().split('\n');
          assert.equal(new Set(entries).size,entries.length);
          assert(entries.every(file=>/^[A-Za-z0-9._/-]+$/.test(file)&&file.split('/').every(part=>part&&part!=='.'&&part!=='..')));
          assert.deepEqual([...entries].sort(),ref.bodyPins.map(row=>row.file).sort());
          fs.mkdirSync(out+'/packet');
          command('unzip',['-q',out+'/artifact.zip','-d',out+'/packet']);
          NODE
      - name: Three fresh physical Hook control arms
        run: |
          set -euo pipefail
          out=soccer-grid-selection-ownership-controls
          test ! -e "$out/control-runner.mjs"
          cat > "$out/control-runner.mjs" <<'GRID_CONTROL_RUNNER'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import { createHash } from 'node:crypto';
          import { execFileSync, spawnSync } from 'node:child_process';

          const env = process.env;
          const reference = JSON.parse(env.GRID_FIXED_REFERENCE);
          const out = path.resolve('soccer-grid-selection-ownership-controls');
          const retained = out + '/fixed-reference';
          const fixed = retained + '/packet';
          const hook = 'src/hooks/useSoccerGrid.ts';
          const workflow = '.github/workflows/soccer-grid-selection-ownership-20261106.yml';
          const test = 'src/test/soccerGridSelectionOwnership.test.tsx';
          const priorTest = 'src/test/soccerGridSubmissionOwnership.test.tsx';
          const plan = 'docs/plans/2026-11-07-soccer-grid-selection-ownership.md';
          const read = file => fs.readFileSync(file);
          const json = file => JSON.parse(read(file));
          const write = (file, value) => fs.writeFileSync(file, JSON.stringify(value, null, 2) + '\n', {flag: 'wx'});
          const put = (file, body) => fs.writeFileSync(file, body, {flag: 'wx'});
          const hash = (algorithm, bytes) => createHash(algorithm).update(bytes).digest('hex');
          const sha = bytes => hash('sha256', bytes);
          const blob = bytes => hash('sha1', Buffer.concat([Buffer.from('blob ' + bytes.length + '\0'), bytes]));
          const git = (...args) => execFileSync('git', args, {encoding: 'utf8', maxBuffer: 16 * 1024 * 1024});
          const pins = {
            [hook]: '9b724907eae0a2fbf9e20d38f60d226281051693',
            [test]: 'bda5963ef068981f9d5c81c4767192e9e47f05b5',
            [priorTest]: '7cb7f94a73ce7340243e7bdae6d6759e2c1a6f11',
            [plan]: 'af9c485b73a30903cd72af884b521ecab6d8eeb2',
          };
