            {"key":"ninth","title":"SG_OWNERSHIP_PRESERVE_NINTH commits a genuinely distinct ninth cell and records 900 once","labels":["ready","eight-committed-before-storage-event","storage-adopted-eight-before-release","distinct-ninth-won","other-tab-follows-win"],"statesPerFrame":2},
