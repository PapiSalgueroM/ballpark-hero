          assert.deepEqual(product(index), product(read(fixed + '/source-before.txt')), 'All 5785 fixed source tuples held');
          const before = indexRows.map(row => {
            const stat = fs.lstatSync(row.file);
            assert(stat.isFile());
            assert.equal(Boolean(stat.mode & 0o111), row.mode === '100755', row.file + ' mode');
