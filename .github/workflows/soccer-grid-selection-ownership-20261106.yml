          assert.deepEqual([fixedProof.source.workflowBlob, fixedProof.newFrames, fixedProof.priorFrames, fixedProof.wholeAOnlyLiteralHeld, fixedProof.wholePriorRawLiteralHeld], [reference.workflow,32,56,true,true]);
          assert.deepEqual([fixedProof.original.run, fixedProof.original.artifact, fixedProof.original.head, fixedProof.original.tree], [original.run,original.artifact,original.head,original.tree]);
