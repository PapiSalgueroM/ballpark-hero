      - name: Literal fresh Grid unit RAW joins to completed fixed and original
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          const out='soccer-grid-selection-ownership-full';
          const read=file=>fs.readFileSync(out+'/'+file),json=file=>JSON.parse(read(file));
          const sha=bytes=>createHash('sha256').update(bytes).digest('hex');
          const custody=json('packet-custody.json'),unit=json('fixed-admission.json');
          assert.equal(custody.status,'passed');
          assert.equal(unit.status,'passed-fixed-soccer-grid-selection-ownership-qualification');
          const fresh=read('raw.json'),prior=read('prior-submission-raw.json'),preserve=read('preserve-aOnly.literal.json');
          assert(fresh.equals(read('fixed-reference/packet/raw.json')),'Whole fresh fixed RAW equals completed fixed reference');
          assert(prior.equals(read('fixed-reference/packet/prior-submission-raw.json')),'Whole fresh prior RAW equals completed fixed reference');
          assert(preserve.equals(read('fixed-reference/packet/preserve-aOnly.literal.json')),'Whole A-only case equals completed fixed reference');
          const [literal]=unit.newProof.wholePreservationCases;
          assert(fresh.subarray(literal.offset,literal.offset+literal.bytes).equals(preserve));
          assert.deepEqual([fresh.length,sha(fresh),preserve.length,sha(preserve)],[custody.fixed.rawBytes,custody.fixed.rawSHA256,literal.bytes,literal.sha256]);
          const tuple=(file,bytes)=>({file,bytes:bytes.length,sha256:sha(bytes)});
          fs.writeFileSync(out+'/fixed-raw-join.json',JSON.stringify({
            status:'passed',fixedHead:custody.fixed.head,fixedTree:custody.fixed.tree,raw:tuple('raw.json',fresh),prior:tuple('prior-submission-raw.json',prior),
            wholeAOnly:literal,freshUnitRAWByteEqual:true,freshPriorRAWByteEqual:true,freshAOnlyByteEqual:true,
          },null,2)+'\n',{flag:'wx'});
          NODE
      - name: Normal production build and retained bytes
        id: build
        run: |
          set -euo pipefail
          NODE_OPTIONS="--max-old-space-size=6144" npm run build 2>&1 | tee soccer-grid-selection-ownership-full/build.log
          tar -czf soccer-grid-selection-ownership-full/dist.tgz dist
          sha256sum soccer-grid-selection-ownership-full/dist.tgz > soccer-grid-selection-ownership-full/dist.sha256
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import {createHash} from 'node:crypto';import assert from 'node:assert/strict';
          const walk=dir=>fs.readdirSync(dir,{withFileTypes:true}).sort((a,b)=>a.name.localeCompare(b.name)).flatMap(e=>e.isDirectory()?walk(dir+'/'+e.name):e.isFile()?[dir+'/'+e.name]:[]);
          const rows=walk('dist').map(file=>{const b=fs.readFileSync(file);return {file,bytes:b.length,sha256:createHash('sha256').update(b).digest('hex')};});
          assert.equal(rows.length,850);fs.writeFileSync('soccer-grid-selection-ownership-full/dist-before.json',JSON.stringify(rows));
          NODE
      - name: Isolated pinned Playwright and Chromium
