name: Soccer Grid selection ownership clean source and build join
on:
  push:
    branches: [codex/soccer-grid-selection-ownership-clean-join-qa-20261107]
permissions:
  contents: read
  actions: read
jobs:
  closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      SIM_NETWORK: offline
      SIM_OFFLINE_RECEIPT: soccer-grid-selection-ownership-clean-join/offline.log
      GRID_REFERENCE_ARTIFACT: '13567030071'
      GRID_REFERENCE_RUN: '42352684859'
      GRID_REFERENCE_ZIP: '1dab365a83f0583804f58159c3b2b825ad3bffe40f14d50288cce468a3e994c1'
      GRID_REFERENCE_TAR: '4ea203d6386082e262ef6ae719970e0d0e595ea963e6327524439aa1f3c3781d'
      GRID_REFERENCE_HEAD: 'ebf0b1dab27ff8d9ad0f784a368027b740829649'
      GRID_REFERENCE_TREE: '9c0ff5ec707a988463eee46712bd2153256be947'
      GRID_REFERENCE_ZIP_BYTES: '64353728'
      GRID_NATIVE_HELPER: '6653a8d8bb60cd29243a9634ac2ba09d7cd2d0a0'
      GRID_NATIVE_OUTER: 'bc0e1b1e42fda2601612c0b0c8ab5b5f6e645989'
      GRID_FIXED_HOOK_BLOB: '9b724907eae0a2fbf9e20d38f60d226281051693'
      GRID_QUALIFIED_PLAN_BLOB: 'af9c485b73a30903cd72af884b521ecab6d8eeb2'
      GRID_QUALIFIED_TEST_BLOB: 'bda5963ef068981f9d5c81c4767192e9e47f05b5'
      GRID_REFERENCE_DIST_MANIFEST: '10b1a290480cbe1ba69ccbafedafd48c5c82951d7fdd68cbd58fe78cb20f8a70'
      GRID_REFERENCE_WORKFLOW: '2712779a898328ab7862908d7914a36ef401246e'
      GRID_CLEAN_PRODUCT_BASE: '7d9e1cbe3cc7ee838b2e4e5d381c4dd34faa9f0b'
      GRID_CLEAN_PRODUCT_BASE_TREE: '23d931fe27906490f1e79eb057e7a1d6a11804b9'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Locked dependencies and clean source receipts
        run: |
          set -euo pipefail
          if grep -Eq '__[A-Z][A-Z0-9_]*__' .github/workflows/soccer-grid-selection-ownership-20261106.yml; then echo 'Unresolved clean qualification template binding'; exit 1; fi
          [[ "$GRID_REFERENCE_ARTIFACT" =~ ^[1-9][0-9]*$ ]]
          [[ "$GRID_REFERENCE_RUN" =~ ^[1-9][0-9]*$ ]]
          [[ "$GRID_REFERENCE_ZIP" =~ ^[a-f0-9]{64}$ ]]
          [[ "$GRID_REFERENCE_TAR" =~ ^[a-f0-9]{64}$ ]]
          [[ "$GRID_REFERENCE_ZIP_BYTES" =~ ^[1-9][0-9]*$ ]]
          [[ "$GRID_REFERENCE_DIST_MANIFEST" =~ ^[a-f0-9]{64}$ ]]
          for value in "$GRID_REFERENCE_HEAD" "$GRID_REFERENCE_TREE" "$GRID_NATIVE_HELPER" "$GRID_NATIVE_OUTER" "$GRID_REFERENCE_WORKFLOW" "$GRID_FIXED_HOOK_BLOB" "$GRID_QUALIFIED_PLAN_BLOB" "$GRID_QUALIFIED_TEST_BLOB"; do [[ "$value" =~ ^[a-f0-9]{40}$ ]]; done
          test ! -e soccer-grid-selection-ownership-clean-join
          mkdir soccer-grid-selection-ownership-clean-join
          touch soccer-grid-selection-ownership-clean-join/offline.log
          git rev-parse HEAD > soccer-grid-selection-ownership-clean-join/head.txt
          git rev-parse 'HEAD^{tree}' > soccer-grid-selection-ownership-clean-join/tree.txt
          git ls-files -s > soccer-grid-selection-ownership-clean-join/source-before.txt
          sha256sum package.json package-lock.json > soccer-grid-selection-ownership-clean-join/locks-before.txt
          npm ci
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const lock=JSON.parse(fs.readFileSync('package-lock.json'));
          const rows=Object.keys(lock.packages).filter(p=>p.startsWith('node_modules/')&&fs.existsSync(p+'/package.json')).map(p=>[p,JSON.parse(fs.readFileSync(p+'/package.json')).version]);
          assert.equal(rows.length,521);for(const[p,v]of rows)assert.equal(v,lock.packages[p].version,p);fs.writeFileSync('soccer-grid-selection-ownership-clean-join/installed-before.json',JSON.stringify(rows));
          NODE
      - name: Proper app types
        run: |
          set -euo pipefail
          node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee soccer-grid-selection-ownership-clean-join/types.log
      - name: Authenticate the completed full reference before extraction
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/PapiSalgueroM/ballpark-hero/actions/runs/$GRID_REFERENCE_RUN" > soccer-grid-selection-ownership-clean-join/reference-run.json
          gh api "repos/PapiSalgueroM/ballpark-hero/actions/artifacts/$GRID_REFERENCE_ARTIFACT" > soccer-grid-selection-ownership-clean-join/reference-artifact.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const env = process.env;
          const read = file => JSON.parse(fs.readFileSync('soccer-grid-selection-ownership-clean-join/' + file));
          const run = read('reference-run.json'), artifact = read('reference-artifact.json');
          assert.deepEqual(
            [run.id, run.status, run.conclusion, run.event, run.path, run.repository.full_name, run.head_sha, run.head_commit.tree_id],
            [Number(env.GRID_REFERENCE_RUN), 'completed', 'success', 'push', '.github/workflows/soccer-grid-selection-ownership-20261106.yml', 'PapiSalgueroM/ballpark-hero', env.GRID_REFERENCE_HEAD, env.GRID_REFERENCE_TREE],
          );
          assert.deepEqual(
            [artifact.id, artifact.name, artifact.expired, artifact.size_in_bytes, artifact.digest, artifact.workflow_run.id, artifact.workflow_run.head_sha],
            [Number(env.GRID_REFERENCE_ARTIFACT), 'soccer-grid-selection-ownership-full-' + run.id, false, Number(env.GRID_REFERENCE_ZIP_BYTES), 'sha256:' + env.GRID_REFERENCE_ZIP, run.id, run.head_sha],
          );
          NODE
          gh api "repos/PapiSalgueroM/ballpark-hero/actions/artifacts/$GRID_REFERENCE_ARTIFACT/zip" > "$RUNNER_TEMP/soccer-grid-selection-ownership-full-reference.zip"
          test "$(wc -c < "$RUNNER_TEMP/soccer-grid-selection-ownership-full-reference.zip")" -eq "$GRID_REFERENCE_ZIP_BYTES"
          echo "$GRID_REFERENCE_ZIP  $RUNNER_TEMP/soccer-grid-selection-ownership-full-reference.zip" | sha256sum --check
          unzip -Z1 "$RUNNER_TEMP/soccer-grid-selection-ownership-full-reference.zip" > soccer-grid-selection-ownership-clean-join/reference-zip-entries.txt
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const names = fs.readFileSync('soccer-grid-selection-ownership-clean-join/reference-zip-entries.txt', 'utf8').trimEnd().split('\n');
          assert.equal(new Set(names).size, names.length, 'Unique admitted ZIP paths');
          for (const name of names) {
            assert(name.length && !name.includes('\\') && !name.startsWith('/'), 'Relative ZIP path');
            assert(name.replace(/\/$/, '').split('/').every(part => part && part !== '.' && part !== '..'), 'Safe ZIP path');
          }
          for (const file of ['head.txt', 'tree.txt', 'admission.json', 'fixed-admission.json', 'native-admission.json', 'final-holds.json', 'source-before.txt', 'source-after.txt', 'dist-before.json', 'dist-after.json', 'dist.tgz']) {
            assert(names.includes(file), file + ' required authenticated body');
          }
          NODE
          mkdir "$RUNNER_TEMP/soccer-grid-selection-ownership-full-reference" "$RUNNER_TEMP/soccer-grid-selection-ownership-full-reference-dist"
          unzip -q "$RUNNER_TEMP/soccer-grid-selection-ownership-full-reference.zip" -d "$RUNNER_TEMP/soccer-grid-selection-ownership-full-reference"
          test -z "$(find "$RUNNER_TEMP/soccer-grid-selection-ownership-full-reference" -type l -print -quit)"
          echo "$GRID_REFERENCE_TAR  $RUNNER_TEMP/soccer-grid-selection-ownership-full-reference/dist.tgz" | sha256sum --check
          tar -tzf "$RUNNER_TEMP/soccer-grid-selection-ownership-full-reference/dist.tgz" > soccer-grid-selection-ownership-clean-join/reference-tar-entries.txt
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const names = fs.readFileSync('soccer-grid-selection-ownership-clean-join/reference-tar-entries.txt', 'utf8').trimEnd().split('\n');
          assert.equal(new Set(names).size, names.length, 'Unique admitted dist tar paths');
          for (const name of names) {
            assert(name.startsWith('dist/') && !name.includes('\\'), 'Tar stays under dist');
            assert(name.replace(/\/$/, '').split('/').every(part => part && part !== '.' && part !== '..'), 'Safe tar path');
          }
          NODE
          tar -xzf "$RUNNER_TEMP/soccer-grid-selection-ownership-full-reference/dist.tgz" -C "$RUNNER_TEMP/soccer-grid-selection-ownership-full-reference-dist"
          cp "$RUNNER_TEMP/soccer-grid-selection-ownership-full-reference/source-before.txt" soccer-grid-selection-ownership-clean-join/reference-source.txt
      - name: Fresh unchanged product-name fence on clean source
        run: |
          set -euo pipefail
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/simNoRivalNames.mjs 2>&1 | tee soccer-grid-selection-ownership-clean-join/no-rival.log
      - name: Clean production build
        run: |
          set -euo pipefail
          NODE_OPTIONS="--max-old-space-size=6144" npm run build 2>&1 | tee soccer-grid-selection-ownership-clean-join/build.log
      - name: Join exact clean product source and all 850 built files
        id: join
        env:
          GRID_REFERENCE_DIR: ${{ runner.temp }}/soccer-grid-selection-ownership-full-reference
          GRID_REFERENCE_DIST: ${{ runner.temp }}/soccer-grid-selection-ownership-full-reference-dist/dist
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          const env = process.env;
          const out = 'soccer-grid-selection-ownership-clean-join';
          const ref = env.GRID_REFERENCE_DIR;
          const read = file => JSON.parse(fs.readFileSync(path.join(ref, file)));
          const bytes = file => fs.readFileSync(path.join(ref, file));
          const readOutput = file => JSON.parse(fs.readFileSync(path.join(out, file)));
          const sha = bytes => createHash('sha256').update(bytes).digest('hex');
          const blob = bytes => createHash('sha1').update('blob ' + bytes.length + '\0').update(bytes).digest('hex');
          const git = (...args) => execFileSync('git', args, {encoding:'utf8', maxBuffer:16 * 1024 * 1024});
          const workflow = '.github/workflows/soccer-grid-selection-ownership-20261106.yml';
          const helper = 'scripts/qa/playSoccerGridSelectionOwnership.mjs';
          const hook = 'src/hooks/useSoccerGrid.ts';
          const test = 'src/test/soccerGridSelectionOwnership.test.tsx';
          const plan = 'docs/plans/2026-11-07-soccer-grid-selection-ownership.md';
          const configs = ['index.html','package.json','package-lock.json','vite.config.ts','tailwind.config.ts','postcss.config.js','tsconfig.json','tsconfig.app.json','tsconfig.node.json','bun.lockb','bun.lock'];
          const sourceScope = file => /^(?:src|public|scripts)\//.test(file);
          const fullOnly = new Set([workflow, helper]);
          const denied = ['scripts/qa/checkSoccerGridSelectionOwnership.mjs','scripts/qa/admitSoccerGridSelectionOwnership.mjs'];
          const pins = {
            [hook]: env.GRID_FIXED_HOOK_BLOB,
            [test]: env.GRID_QUALIFIED_TEST_BLOB,
            [plan]: env.GRID_QUALIFIED_PLAN_BLOB,
            'src/pages/SoccerGrid.tsx': 'fd793d83fef33fa075fcac53e97453cdbf83fff7',
            'src/components/soccer-grid/SoccerGridSearch.tsx': '14450f17982a89cc5de886d89fa1a78462ff509f',
            'src/components/soccer-grid/SoccerGridBoard.tsx': '15007fda66e6a52bf13727d934dcc796bb30f3bb',
            'src/test/soccerGridSubmissionOwnership.test.tsx': '7cb7f94a73ce7340243e7bdae6d6759e2c1a6f11',
            'src/App.tsx': '8bfedf7aaa1d076e0f0c8e2216c7e46632cd8a33',
            'src/data/gameRegistry.ts': 'f560b40a74d1468ac72dfde4ee6fec6635a9a255',
            'public/soccer-grid/index.html': '65fcae9819d92e53462c9f7826bd7d2fa2012fe4',
          };
          const indexRows = (body, separator = '\n') => {
            const rows = body.split(separator).filter(Boolean).map(line => {
              const matched = /^(100(?:644|755)) ([0-9a-f]{40}) 0\t(.+)$/.exec(line);
              assert(matched, 'Actual regular path/mode/blob index tuple');
              return [matched[3], {mode:matched[1], blob:matched[2]}];
            });
            assert.equal(new Set(rows.map(([file]) => file)).size, rows.length, 'Unique index paths');
            return new Map(rows);
          };
          const treeRows = commit => {
            const rows = git('ls-tree', '-r', '-z', commit).split('\0').filter(Boolean).map(line => {
              const matched = /^(100(?:644|755)) blob ([0-9a-f]{40})\t(.+)$/.exec(line);
              assert(matched, 'Actual regular path/mode/blob tree tuple');
              return [matched[3], {mode:matched[1], blob:matched[2]}];
            });
            assert.equal(new Set(rows.map(([file]) => file)).size, rows.length, 'Unique tree paths');
            return new Map(rows);
          };
          const ordered = rows => [...rows].sort(([left],[right]) => left.localeCompare(right));
          const cleanHead = git('rev-parse', 'HEAD').trim(), cleanTree = git('rev-parse', 'HEAD^{tree}').trim();
          assert.deepEqual(git('rev-list', '--parents', '-n', '1', 'HEAD').trim().split(' '), [cleanHead, env.GRID_CLEAN_PRODUCT_BASE], 'Clean QA is the direct PR530 child');
          assert.equal(git('rev-parse', env.GRID_CLEAN_PRODUCT_BASE + '^{tree}').trim(), env.GRID_CLEAN_PRODUCT_BASE_TREE);
          assert.equal(fs.readFileSync(out + '/head.txt','utf8').trim(), cleanHead);
          assert.equal(fs.readFileSync(out + '/tree.txt','utf8').trim(), cleanTree);
          const base = treeRows(env.GRID_CLEAN_PRODUCT_BASE);
          const current = indexRows(fs.readFileSync(out + '/source-before.txt', 'utf8'));
          const old = indexRows(fs.readFileSync(out + '/reference-source.txt', 'utf8'));
          assert.deepEqual(ordered(indexRows(git('ls-files','--stage','-z'),'\0')), ordered(current));
          assert.deepEqual(ordered(treeRows(cleanHead)), ordered(current), 'Clean index joins exact committed tree tuples');
          assert.deepEqual([base.size,current.size,old.size],[5783,5786,5787]);
          const allowedClean = [hook, test, plan, workflow];
          const cleanDelta = [...new Set([...base.keys(), ...current.keys()])].filter(file => {
            const before = base.get(file), after = current.get(file);
            return before?.mode !== after?.mode || before?.blob !== after?.blob;
          }).sort();
          assert.deepEqual(cleanDelta, [...allowedClean].sort(), 'Exactly one product Hook change and three owned new leaves');
          assert.equal(base.get(hook)?.blob, '1c84994a36c8ac51e4020823d899c2342be60271');
          assert.equal(current.get(hook)?.mode, base.get(hook)?.mode);
          for (const file of [test, plan, workflow]) assert(!base.has(file) && current.get(file)?.mode === '100644', file + ' exact owned new leaf');
          assert(!current.has(helper), 'Tracked full browser helper is excluded from clean QA');
          assert.equal(old.get(helper)?.blob, env.GRID_NATIVE_HELPER);
          assert.equal(old.get(workflow)?.blob, env.GRID_REFERENCE_WORKFLOW);
          assert(current.get(workflow)?.blob && current.get(workflow).blob !== old.get(workflow).blob, 'Clean QA uses its own workflow body');
          for (const file of denied) assert(!old.has(file) && !current.has(file), file + ' untracked QA source');
          for (const [file,want] of Object.entries(pins)) {
            assert.equal(current.get(file)?.blob, want, file + ' exact clean pin');
            assert.equal(old.get(file)?.blob, want, file + ' exact full pin');
          }
          const product = (rows, omit) => ordered([...rows].filter(([file]) => !omit.has(file)));
          assert.deepEqual(product(current,new Set([workflow])), product(old,fullOnly), 'All 5785 product path/mode/blob tuples are identical');
          assert.deepEqual([base,current,old].map(rows => [...rows.keys()].filter(sourceScope).length), [4660,4661,4662]);
          const scoped = (rows, omit) => ordered([...rows].filter(([file]) => (sourceScope(file) || configs.includes(file)) && !omit.has(file)));
          const sourceConfigRows = scoped(current,new Set());
          assert.equal(sourceConfigRows.length, 4672);
          assert.deepEqual(sourceConfigRows,scoped(old,fullOnly),'Every 4661 code and 11 root configuration path/mode/blob tuple');
          for (const file of configs) assert(current.has(file) && old.has(file),file + ' required root configuration');
          for (const [file,tuple] of current) {
            const stat = fs.lstatSync(file);
            assert(stat.isFile(),file + ' physical regular source body');
            assert.equal((stat.mode & 0o111) !== 0, tuple.mode === '100755',file + ' physical source executable mode');
            assert.equal(blob(fs.readFileSync(file)),tuple.blob,file + ' physical source bytes join tree');
          }

          const inventory = (directory,prefix = '') => fs.readdirSync(directory,{withFileTypes:true}).sort((a,b) => a.name.localeCompare(b.name)).flatMap(entry => {
            const file = path.join(directory,entry.name);
            const relative = prefix + entry.name;
            if (entry.isDirectory()) return inventory(file,relative + '/');
            assert(entry.isFile(),relative + ' regular dist file');
            const body = fs.readFileSync(file);
            return [{path:relative,bytes:body.length,sha256:sha(body)}];
          });
          const actual = inventory('dist'), reference = inventory(env.GRID_REFERENCE_DIST);
          assert.deepEqual([actual.length,reference.length],[850,850]);
          assert.deepEqual(actual,reference,'Every clean built path and byte equals the qualified full build');
          const distManifestSHA256 = sha(JSON.stringify(reference));
          assert.equal(distManifestSHA256,env.GRID_REFERENCE_DIST_MANIFEST);
          const retainedManifest = read('dist-before.json').map(row => {
            assert.deepEqual(Object.keys(row).sort(),['bytes','file','sha256']);
            assert(row.file.startsWith('dist/'));
            return {path:row.file.slice(5),bytes:row.bytes,sha256:row.sha256};
          });
          assert.deepEqual(retainedManifest,reference,'Exact full retained build inventory and tar join');
          assert(bytes('dist-before.json').equals(bytes('dist-after.json')));
          assert(bytes('source-before.txt').equals(bytes('source-after.txt')));
          assert(bytes('source-before.txt').equals(fs.readFileSync(out + '/reference-source.txt')));
          const referenceHead = bytes('head.txt').toString('utf8').trim(), referenceTree = bytes('tree.txt').toString('utf8').trim();
          const run = readOutput('reference-run.json'), meta = readOutput('reference-artifact.json');
          assert.deepEqual([referenceHead,referenceTree],[env.GRID_REFERENCE_HEAD,env.GRID_REFERENCE_TREE]);
          const full = read('admission.json'), native = read('native-admission.json'), unit = read('fixed-admission.json'), holds = read('final-holds.json');
          assert.deepEqual([full.status,full.qualification,full.head,full.tree,full.hook,full.helper,full.nativeOuter], [
            'passed','fresh-soccer-grid-selection-ownership-full-scope',referenceHead,referenceTree,env.GRID_FIXED_HOOK_BLOB,env.GRID_NATIVE_HELPER,env.GRID_NATIVE_OUTER,
          ]);
          assert.deepEqual([full.trackedBodies,full.sourceRows,full.cleanSourceRows,full.rootConfigurations,full.distFiles,full.immutableCaps,full.readers],[5787,4662,4661,11,850,16,20]);
          assert.deepEqual(full.unit,{actualCases:18,actualPasses:18,actualFailures:0,newFrames:32,priorFrames:56,totalFrames:88,actions:28,requests:22,transportLegs:70,wholeAOnlyLiteralHeld:true,wholePriorRawLiteralHeld:true,wholeFixedRawLiteralHeld:true});
          assert.deepEqual(full.nativeReceipt,native);
          assert.deepEqual([full.nativeJourneys,full.nativeContexts,full.nativePngs],[3,3,6]);
          assert.deepEqual(full.distTar,{file:'dist.tgz',bytes:bytes('dist.tgz').length,sha256:env.GRID_REFERENCE_TAR});
          assert.equal(sha(bytes('dist.tgz')),env.GRID_REFERENCE_TAR);
          assert.equal(blob(bytes('native-admission-script.mjs')),env.GRID_NATIVE_OUTER);
