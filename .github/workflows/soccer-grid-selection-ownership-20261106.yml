      - name: One actual fixed Vitest invocation with the same Page regression and held prior suite
        run: |
          set -euo pipefail
          out=soccer-grid-selection-ownership-fixed
          set +e
          SOCCER_GRID_SELECTION_RAW="$PWD/$out/raw.json" SC_GRID_OWNERSHIP_RAW="$PWD/$out/prior-submission-raw.json" NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node_modules/.bin/vitest run src/test/soccerGridSelectionOwnership.test.tsx src/test/soccerGridSubmissionOwnership.test.tsx --reporter=json --testTimeout=60000 --no-file-parallelism --outputFile="$out/owned.json" > "$out/owned.log" 2>&1
          status=$?
          set -e
          printf '%s\n' "$status" > "$out/test-exit.txt"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {JSDOM} from 'jsdom';
          const out='soccer-grid-selection-ownership-fixed',read=file=>fs.readFileSync(out+'/'+file),json=file=>JSON.parse(read(file));
          const sha=bytes=>createHash('sha256').update(bytes).digest('hex');
          const reportExists=fs.existsSync(out+'/owned.json'),report=reportExists?json('owned.json'):null,exit=read('test-exit.txt').toString('utf8').trim();
          fs.writeFileSync(out+'/report-errors.json',JSON.stringify({
            reportExists,exit,
            runtimeCounters:report?Object.fromEntries(['numRuntimeErrorTestSuites','numUnhandledErrors'].map(key=>[key,Object.hasOwn(report,key)?{present:true,value:report[key]}:{present:false}])):null,
            unhandledErrors:report?.unhandledErrors??null,testExecutionErrors:report?.testExecutionErrors??null,
            suites:report?.testResults?.map(suite=>({name:suite.name,status:suite.status,message:suite.message??null,
              assertions:suite.assertionResults.map(row=>({title:row.title,fullName:row.fullName,status:row.status,failureMessages:row.failureMessages,failureDetails:row.failureDetails??null}))}))??null,
          },null,2));
          assert(reportExists,'Actual JSON-only Vitest report exists');
          assert.equal(exit,'0','Fixed actual test exit must be zero');
          const contract={"version":1,"cases":[{"key":"aOnly","title":"clears the only selected cell after an ordinary valid guess","status":"passed","marker":null,"verdict":"valid","switchToB":false,"labels":["before-mount","ready","a-selected","a-query","a-pending","a-settled","after-teardown"],"actions":["mount","select-a","type-a","submit-a","release-a","unmount"]},{"key":"valid","title":"keeps a newer empty cell selected after the submitted cell is filled","status":"passed","marker":null,"verdict":"valid","switchToB":true,"labels":["before-mount","ready","a-selected","a-query","a-pending","b-selected-pending","a-settled","after-teardown"],"actions":["mount","select-a","type-a","submit-a","select-empty-b","release-a","unmount"]},{"key":"unverified","title":"keeps a newer empty cell selected after a free unverified answer","status":"passed","marker":null,"verdict":"unverified","switchToB":true,"labels":["before-mount","ready","a-selected","a-query","a-pending","b-selected-pending","a-settled","after-teardown"],"actions":["mount","select-a","type-a","submit-a","select-empty-b","release-a","unmount"]},{"key":"invalid","title":"keeps a newer empty cell selected through a wrong guess and flash cleanup","status":"passed","marker":null,"verdict":"invalid","switchToB":true,"labels":["before-mount","ready","a-selected","a-query","a-pending","b-selected-pending","a-settled","a-flash-cleared","after-teardown"],"actions":["mount","select-a","type-a","submit-a","select-empty-b","release-a","advance-flash-timer","unmount"]}]};
          const priorContract=[
            {"key":"validator","title":"SG_OWNERSHIP_VALIDATOR ignores a pending success for a cell another tab filled","labels":["ready","pending-boundary","eight-committed-before-storage-event","storage-adopted-eight-before-release","pending-response-settled"],"statesPerFrame":2},
            {"key":"rarity","title":"SG_OWNERSHIP_RARITY ignores a success whose rarity read waited while another tab filled its cell","labels":["ready","pending-boundary","eight-committed-before-storage-event","storage-adopted-eight-before-release","pending-response-settled"],"statesPerFrame":2},
            {"key":"insert","title":"SG_OWNERSHIP_INSERT does not append a duplicate after an already initiated write resolves","labels":["ready","pending-boundary","eight-committed-before-storage-event","storage-adopted-eight-before-release","pending-response-settled"],"statesPerFrame":2},
            {"key":"wrong","title":"SG_OWNERSHIP_WRONG does not burn a guess or flash a filled cell after a late invalid verdict","labels":["ready","pending-boundary","eight-committed-before-storage-event","storage-adopted-eight-before-release","pending-response-settled"],"statesPerFrame":2},
            {"key":"batch","title":"SG_OWNERSHIP_BATCH reads adopted progress before React renders the storage event","labels":["ready","pending-validator","eight-committed-before-batch","storage-event-before-render-and-release","batch-settled"],"statesPerFrame":2},
            {"key":"rules","title":"SG_OWNERSHIP_RULES refuses an old callback after settings change in the same batch","labels":["ready","old-rule-pending","rule-change-before-render-and-release","new-rule-settled"],"statesPerFrame":1},
            {"key":"valid","title":"SG_OWNERSHIP_PRESERVE_VALID keeps an ordinary untimed success and its complete save","labels":["ready","valid-settled"],"statesPerFrame":1},
            {"key":"invalid","title":"SG_OWNERSHIP_PRESERVE_WRONG keeps ordinary wrong-guess cost and flash cleanup","labels":["ready","wrong-flash","flash-cleared"],"statesPerFrame":1},
            {"key":"retry","title":"SG_OWNERSHIP_PRESERVE_RETRY keeps an unverified answer free","labels":["ready","pending","free-settled"],"statesPerFrame":1},
