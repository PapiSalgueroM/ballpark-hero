          node "$RUNNER_TEMP/soccer-grid-selection-ownership-browser/node_modules/playwright/cli.js" install --with-deps chromium 2>&1 | tee soccer-grid-selection-ownership-full/chromium-install.log
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const before=JSON.parse(fs.readFileSync('soccer-grid-selection-ownership-full/installed-before.json'));
