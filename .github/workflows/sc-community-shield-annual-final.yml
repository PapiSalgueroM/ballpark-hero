name: Soccer Career Shield annual proof completed build and actual App
on:
  push:
    branches: [codex/sc-community-shield-annual-app-20261103]
permissions:
  contents: read
jobs:
  build-and-app:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CI: '1'
      SIM_NETWORK: offline
      BEFORE: ${{ github.event.before }}
      SC_APP_DRIVER_GIT: '9abd7a9258b6bd014d4417064b9cc334febc2276'
      SC_APP_DRIVER_SHA256: '56636ed4b47d6a917fa5ac169c3f963e2ee906fdf1f7829cfabc6ad585b6fa20'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Bind the qualified product parent and exact QA inputs
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/sc-shield-annual-final"
          export OUT
          printf 'OUT=%s\n' "$OUT" >> "$GITHUB_ENV"
          mkdir "$OUT"
          test "$GITHUB_REF" = refs/heads/codex/sc-community-shield-annual-app-20261103
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$BEFORE" = 0000000000000000000000000000000000000000
          test "$(git rev-parse HEAD^)" = c37f9b8462f229ca8ab03de8866a544f36b0537b
          test "$(git rev-parse 'HEAD^^{tree}')" = c85a7dc9d4febc0e1673d6809528030013718059
          test "$(git ls-tree -r HEAD^ | wc -l)" -eq 5673
          test "$(git ls-tree -r HEAD | wc -l)" -eq 5680
          [[ "$SC_APP_DRIVER_GIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SC_APP_DRIVER_SHA256" =~ ^[0-9a-f]{64}$ ]]
          git rev-parse HEAD HEAD^{tree} > "$OUT/head-tree.txt"
          git diff --name-status HEAD^ HEAD > "$OUT/changed-paths.txt"
          cat > "$OUT/expected-paths.txt" <<'PATHS'
          A	.github/workflows/sc-community-shield-annual-final.yml
          A	scripts/qa/fixtures/siteFonts.captured.json
          A	scripts/qa/fixtures/soccerCommunityShield.captured.json
          A	scripts/qa/fixtures/soccerCommunityShield.opening-inputs.json
          A	scripts/qa/guardSoccerCommunityShieldBuild.mjs
          A	scripts/qa/playSoccerCommunityShieldApp.mjs
          A	scripts/qa/prepareSoccerCommunityShieldApp.mjs
          PATHS
          cmp "$OUT/changed-paths.txt" "$OUT/expected-paths.txt"
          git diff --exit-code HEAD^ -- src public scripts/data index.html package.json package-lock.json bun.lock vitest.config.ts scripts/sweepWeight.mjs > "$OUT/unchanged-product.log"
          cat > "$OUT/input-pins.txt" <<'PINS'
          src/lib/soccerCareerEngine.ts a65c8353d6e4660c1d6cec6471e17095eed35805
          src/lib/soccerCareerExtraCups.ts f96d2442942db57eb89d3d73d7dc18bba02ec165
          src/lib/season/soccer.ts 2a797be25739ebd030e5caf197273accf82d0258
          src/pages/SoccerCareer.tsx 76b6780a0ea2dfce80fa9846731dd26bde763e61
          src/components/soccer-career/SeasonResumeChip.tsx 587387a73e218ed66199e1e74cd4aa36ed21320e
          src/components/season-centre/SeasonCentre.tsx 42fe7d090f403ac165886a0a49dff596bb346b8a
          src/components/soccer-career/SoccerSeasonCentre.tsx b3839c18814e6350fdcb4e3a2de6f789eea99df8
          src/components/soccer-career/TrophyCabinet.tsx 2c084986319e798140af26e8652d0a739be047a4
          scripts/qa/guardSoccerCommunityShieldBuild.mjs 05f62797c964af1e37f4f1438876d62f0ecf5222
          scripts/qa/prepareSoccerCommunityShieldApp.mjs 801b86cc63282bc6854bfaa2955797079e601c0b
          scripts/qa/fixtures/soccerCommunityShield.opening-inputs.json f130fda2f6f3b95b6d3829df3aace28357338935
          scripts/qa/fixtures/soccerCommunityShield.captured.json 4be14c8caaf3c6bcef9e3bd8c6ddde5f1491ae95
          scripts/qa/fixtures/siteFonts.captured.json 6111bd87a083d02447dc6e2c32d7d0e5c0584955
          scripts/prerender.mjs 3d4fb1e595413c48c7bd65b927730d25cc3a2e18
          scripts/genSitemap.mjs 08344dfc84be3ca24533c8d56e0f229b02b93c0a
          scripts/sweepWeight.mjs 5a92a68cc0225d5e633c19e041087e7c6c4254e8
          scripts/lib/offlineTransport.cjs 0fda542a2649fe5da937c6976fd0f5b6073e74b6
          package.json 2ff64986fb76ebc51b706f2fd24765768874008a
          package-lock.json 97d6f12a052f25f400462938c241789a083f0bfe
          PINS
          while read -r file blob; do test "$(git rev-parse "HEAD:$file")" = "$blob"; done < "$OUT/input-pins.txt"
          test "$(git rev-parse HEAD:scripts/qa/playSoccerCommunityShieldApp.mjs)" = "$SC_APP_DRIVER_GIT"
          printf '%s  %s\n' "$SC_APP_DRIVER_SHA256" scripts/qa/playSoccerCommunityShieldApp.mjs | sha256sum --check > "$OUT/driver-pin.log"
          git ls-files -z > "$OUT/source-members.before"
          git ls-files -z | xargs -0 sha256sum > "$OUT/source.sha256"
          WORK="$GITHUB_WORKSPACE/tmp/sc-shield-annual-final-$GITHUB_RUN_ID"
          test ! -e "$WORK"; mkdir -p "$WORK"
          printf 'SC_SHIELD_BUILD_QA=%s\nSC_SHIELD_BUILD_SOURCE_LIST=%s\nSC_SHIELD_APP_PREP=%s\nSC_SHIELD_APP_OUT=%s\nFREE_KICK_FONT_CACHE=%s\nPRERENDER_ONLY=/soccer-career\n' "$WORK/derived" "$OUT/source-members.before" "$WORK/app-prep" "$WORK/app" "$WORK/fonts" >> "$GITHUB_ENV"
          cat > "$OUT/capture.sh" <<'CAPTURE'
          capture() {
            local tag="$1"; shift
            test ! -e "$OUT/$tag.exit"
            printf '%s\0' "$@" > "$OUT/$tag.argv"; : > "$OUT/$tag.transport"
            set +e
            SIM_OFFLINE_RECEIPT="$OUT/$tag.transport" "$@" > "$OUT/$tag.stdout" 2> "$OUT/$tag.stderr"
            local code=$?
            set -e
            printf '%s\n' "$code" > "$OUT/$tag.exit"
            tail -n 12 "$OUT/$tag.stdout"; tail -n 12 "$OUT/$tag.stderr"
            test ! -s "$OUT/$tag.transport" || return 1
            return "$code"
          }
          CAPTURE
      - name: Locked app and isolated tools before the offline boundary
        id: install
        run: |
          set -euo pipefail
          code=0; NODE_OPTIONS='' npm ci > "$OUT/install.stdout" 2> "$OUT/install.stderr" || code=$?
          printf '%s\n' "$code" > "$OUT/install.exit"; test "$code" -eq 0
          find node_modules -path node_modules/.vite -prune -o -type f -print0 | sort -z | xargs -0 sha256sum > "$OUT/dependency-files.sha256"
          tools="$RUNNER_TEMP/sc-shield-tools"; test ! -e "$tools"; mkdir "$tools"
          printf '{"private":true,"dependencies":{"playwright":"1.64.0"}}\n' > "$tools/package.json"
          code=0; NODE_OPTIONS='' npm install --prefix "$tools" --ignore-scripts --no-audit --no-fund > "$OUT/browser-install.stdout" 2> "$OUT/browser-install.stderr" || code=$?
          printf '%s\n' "$code" > "$OUT/browser-install.exit"; test "$code" -eq 0
          test ! -e node_modules/playwright; test ! -e node_modules/playwright-core
          ln -s "$tools/node_modules/playwright" node_modules/playwright
          ln -s "$tools/node_modules/playwright-core" node_modules/playwright-core
          cp "$tools/package.json" "$OUT/browser-package.json"; cp "$tools/package-lock.json" "$OUT/browser-package-lock.json"
          code=0; NODE_OPTIONS='' node "$tools/node_modules/playwright/cli.js" install --with-deps chromium > "$OUT/chromium-install.stdout" 2> "$OUT/chromium-install.stderr" || code=$?
          printf '%s\n' "$code" > "$OUT/chromium-install.exit"; test "$code" -eq 0
          python -m venv "$tools/python"
          code=0; "$tools/python/bin/python" -m pip install fonttools==4.60.1 Pillow==11.3.0 > "$OUT/python-install.stdout" 2> "$OUT/python-install.stderr" || code=$?
          printf '%s\n' "$code" > "$OUT/python-install.exit"; test "$code" -eq 0
          "$tools/python/bin/python" -m pip freeze > "$OUT/python-packages.before"
          echo "$tools/python/bin" >> "$GITHUB_PATH"
          printf '%s\n' "$tools" > "$OUT/tools-root.txt"
          find "$tools/node_modules" -type f -print0 | sort -z | xargs -0 sha256sum > "$OUT/browser-files.sha256"
          find "$tools/python" -name __pycache__ -prune -o -type f -print0 | sort -z | xargs -0 sha256sum > "$OUT/python-files.sha256"
      - name: Materialize only the nine already-held font bodies
        id: fonts
        run: |
          set -euo pipefail
          NODE_OPTIONS='' node --input-type=module <<'FONTS'
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { gunzipSync } from 'node:zlib';
          const sha = body => createHash('sha256').update(body).digest('hex');
          const bytes = fs.readFileSync('scripts/qa/fixtures/siteFonts.captured.json');
          assert.equal(bytes.length, 1600766); assert.equal(sha(bytes), 'a6c24e3ec7711d400f53a1baf10a3a6a3925d1f269e48ee0cd14bdca5b749938');
          const entries = JSON.parse(bytes).entries, folder = process.env.FREE_KICK_FONT_CACHE;
          assert.equal(entries.length, 9); fs.mkdirSync(folder, { recursive: true });
          const manifest = [];
          for (const row of entries) {
            assert.equal(row.encoding, 'gzip+hex'); assert(['https://fonts.googleapis.com', 'https://fonts.gstatic.com'].includes(new URL(row.url).origin));
            const body = gunzipSync(Buffer.from(row.body, 'hex')); assert.equal(body.length, row.bytes); assert.equal(sha(body), row.sha256);
            const file = path.basename(row.originalFile); assert.equal(file, row.originalFile); assert(/^[a-f0-9]+$/.test(file));
            fs.writeFileSync(path.join(folder, file), body, { flag: 'wx' }); manifest.push({ url: row.url, file, contentType: row.contentType, sha256: row.sha256, bytes: row.bytes });
          }
          assert.equal(new Set(manifest.map(row => row.url)).size, 9);
          fs.writeFileSync(path.join(folder, 'manifest.json'), JSON.stringify(manifest, null, 2) + '\n');
          fs.writeFileSync(process.env.OUT + '/font-custody.json', JSON.stringify({ fixtureSha256: sha(bytes), sourceArtifact: 13140509319, archiveReacquisitions: 0, fontDownloads: 0, manifest }, null, 2) + '\n');
          FONTS
          cat > "$OUT/cached-fonts.cjs" <<'ADAPTER'
          'use strict';
          const fs = require('node:fs'), path = require('node:path'), assert = require('node:assert/strict'), { createHash } = require('node:crypto');
          const out = process.env.OUT, sha = body => createHash('sha256').update(body).digest('hex');
          const manifest = JSON.parse(fs.readFileSync(path.join(process.env.FREE_KICK_FONT_CACHE, 'manifest.json'), 'utf8'));
          const cache = new Map(manifest.map(row => { const body = fs.readFileSync(path.join(process.env.FREE_KICK_FONT_CACHE, row.file)); assert.equal(sha(body), row.sha256); return [row.url, { body, contentType: row.contentType }]; }));
          const pw = require(path.join(process.env.GITHUB_WORKSPACE, 'node_modules/playwright')), launch = pw.chromium.launch.bind(pw.chromium);
          pw.chromium.launch = async (...args) => {
            const browser = await launch(...args), newContext = browser.newContext.bind(browser);
            browser.newContext = async (...options) => {
              const context = await newContext(...options);
              await context.route(/^https:\/\/fonts\.(googleapis|gstatic)\.com\//, async route => {
                const request = route.request(), row = cache.get(request.url());
                if (!row || request.method() !== 'GET') { fs.appendFileSync(out + '/font-cache-misses.jsonl', JSON.stringify({ url: request.url(), method: request.method() }) + '\n'); return route.abort(); }
                fs.appendFileSync(out + '/font-cache-use.jsonl', JSON.stringify({ url: request.url(), sha256: sha(row.body) }) + '\n');
                return route.fulfill({ status: 200, body: row.body, contentType: row.contentType });
              });
              for (const [kind, pattern] of [['flag', /^https:\/\/flagcdn\.com\//], ['database', /^https:\/\/[^/]+\.supabase\.co\//]]) await context.route(pattern, route => {
                const request = route.request(); fs.appendFileSync(out + '/blocked-external.jsonl', JSON.stringify({ kind, url: request.url(), method: request.method(), bodySha256: request.postData() ? sha(request.postData()) : null }) + '\n'); return route.abort();
              });
              return context;
            };
            return browser;
          };
          ADAPTER
          find "$FREE_KICK_FONT_CACHE" -type f -print0 | sort -z | xargs -0 sha256sum > "$OUT/font-files.sha256"
          sha256sum "$OUT/cached-fonts.cjs" > "$OUT/cache-adapter.sha256"
      - name: Actual types and raw source baseline before generators
        id: prepare
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs --require=$OUT/cached-fonts.cjs"
          unset SC_EXTRA_CUPS_ENGINE US_BOARD_CONTROL_ALIAS US_BOARD_CONTROL_FILE NO_DOUBLE_SWAP PRERENDER_CONTROL SWEEP_WEIGHT_CONTROL
          source "$OUT/capture.sh"
          for file in guardSoccerCommunityShieldBuild prepareSoccerCommunityShieldApp playSoccerCommunityShieldApp; do capture "syntax-$file" node --check "scripts/qa/$file.mjs"; done
          capture types node_modules/.bin/tsc --noEmit -p tsconfig.app.json
          capture prepare-derived node scripts/qa/guardSoccerCommunityShieldBuild.mjs prepare
          node --input-type=module <<'BASELINE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          const allowed = ['public/soccer-career/index.html', 'public/sitemap.xml', 'scripts/data/lastmod.json'];
          const files = fs.readFileSync(process.env.SC_SHIELD_BUILD_SOURCE_LIST).toString().split('\0').filter(Boolean);
          fs.writeFileSync(process.env.OUT + '/immutable-source.sha256', files.filter(file => !allowed.includes(file)).map(file => createHash('sha256').update(fs.readFileSync(file)).digest('hex') + '  ' + file).join('\n') + '\n');
          assert.equal(process.env.PRERENDER_ONLY, '/soccer-career');
          BASELINE
      - name: Normal unchanged writers
        id: writers
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs --require=$OUT/cached-fonts.cjs"
          source "$OUT/capture.sh"
          capture home node scripts/genHomeCopy.mjs
          capture search node scripts/genSearchKeywords.mjs
          capture seo-parts-check node scripts/genSeoMetaParts.mjs --check
      - name: Exact ordinary seven-command SEO build with the supported route filter
        id: build
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs --require=$OUT/cached-fonts.cjs"
          unset PRERENDER_CONTROL
          source "$OUT/capture.sh"
          test "$PRERENDER_ONLY" = /soccer-career
          printf '%s\n' "$PRERENDER_ONLY" > "$OUT/actual-prerender-only.txt"
          capture routes-only node scripts/genSitemap.mjs --routes-only
          capture build-first npm run build
          capture prerender node scripts/prerender.mjs
          capture retired-stubs node scripts/genRetiredStubs.mjs
          capture hidden-stubs node scripts/genHiddenStubs.mjs
          capture sitemap node scripts/genSitemap.mjs
          capture build-final npm run build
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > "$OUT/dist.sha256"
      - name: Actual bounded generated outputs and three changed observation controls
        id: derived
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs --require=$OUT/cached-fonts.cjs"
          source "$OUT/capture.sh"
          capture check-derived node scripts/qa/guardSoccerCommunityShieldBuild.mjs check
          node --input-type=module <<'DERIVED'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const folder = process.env.SC_SHIELD_BUILD_QA;
          const summary = JSON.parse(fs.readFileSync(folder + '/summary.json', 'utf8')), receipt = JSON.parse(fs.readFileSync(folder + '/receipt.json', 'utf8'));
          assert.equal(summary.status, 'passed'); assert.equal(summary.healthyPasses, 1); assert.equal(summary.ownedObservationControls, 3); assert.equal(summary.restoredPasses, 3); assert.equal(summary.controls.length, 3);
          assert.equal(receipt.completed, true); assert.equal(receipt.primary, null); assert.deepEqual(receipt.secondary, []);
          DERIVED
      - name: All seventeen readers of the completed output
        id: readers
        if: ${{ always() && steps.build.outcome == 'success' && steps.derived.outcome == 'success' }}
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs --require=$OUT/cached-fonts.cjs"
          source "$OUT/capture.sh"
          node scripts/lib/hostLikeServer.mjs dist 4173 > "$OUT/readers-server.log" 2>&1 &
          server=$!; trap 'kill "$server" 2>/dev/null || true' EXIT
          ready=0; for attempt in 1 2 3 4 5; do if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then ready=1; break; fi; sleep 1; done; test "$ready" -eq 1
          failed=0
          for reader in simAdsense simBrand simHeadTags simHiddenPages simHubs simIndexNow simIndexing simInternalLinks simNoRivalNames simPrerender simPrerenderBoot simRetiredRoutes simSchema simSitemap simSnapshotAssets simGuideHeadings simSiteSearch; do
            status=0; capture "$reader" env BASE=http://127.0.0.1:4173 SWEEP_BASE=http://127.0.0.1:4173 node "scripts/$reader.mjs" || status=$?
            printf '%s\t%s\n' "$reader" "$status" >> "$OUT/readers.tsv"; test "$status" -eq 0 || failed=1
          done
          test "$(wc -l < "$OUT/readers.tsv")" -eq 17
          test ! -s "$OUT/font-cache-misses.jsonl" || failed=1
          test -s "$OUT/font-cache-use.jsonl" || failed=1
          exit "$failed"
      - name: All sixteen unchanged page weight ceilings
        id: caps
        if: ${{ always() && steps.build.outcome == 'success' && steps.derived.outcome == 'success' }}
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs --require=$OUT/cached-fonts.cjs"
          unset SWEEP_WEIGHT_CONTROL
          source "$OUT/capture.sh"
          capture caps-source node --input-type=module <<'CAPS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          const body = fs.readFileSync('scripts/sweepWeight.mjs', 'utf8'), before = execFileSync('git', ['show', 'HEAD^:scripts/sweepWeight.mjs'], { encoding: 'utf8' });
          assert.equal(body, before);
          const code = body.replace(/\/\*[\s\S]*?\*\//g, '').replace(/(^|\n)\s*\/\/[^\n]*/g, '$1');
          const start = code.indexOf('const BUDGETS = ['); assert(start >= 0); const end = code.indexOf('];', start); assert(end > start);
          const rows = [...code.slice(start, end + 2).matchAll(/\[\s*(['"])(\/[^'"]*)\1\s*,\s*(\d+)\s*\]/g)].map(row => ({ route: row[2], cap: Number(row[3]) }));
          assert.equal(rows.length, 16); assert.equal(new Set(rows.map(row => row.route)).size, 16); assert.equal(rows.find(row => row.route === '/soccer-career')?.cap, 840);
          fs.writeFileSync(process.env.OUT + '/caps16.json', JSON.stringify({ sourceSha256: createHash('sha256').update(body).digest('hex'), unchangedParent: true, budgetCount: 16, budgets: rows }, null, 2) + '\n');
          CAPS
          node scripts/lib/hostLikeServer.mjs dist 4173 > "$OUT/caps-server.log" 2>&1 &
          server=$!; trap 'kill "$server" 2>/dev/null || true' EXIT
          ready=0; for attempt in 1 2 3 4 5; do if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then ready=1; break; fi; sleep 1; done; test "$ready" -eq 1
          capture all-page-caps env BASE=http://127.0.0.1:4173 SWEEP_BASE=http://127.0.0.1:4173 SWEEP_OFFLINE=1 node scripts/sweepWeight.mjs
      - name: Replay four retained public actions and consume the same completed dist in the real App
        id: app
        if: ${{ always() && steps.build.outcome == 'success' && steps.derived.outcome == 'success' && steps.readers.outcome == 'success' && steps.caps.outcome == 'success' }}
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs --require=$OUT/cached-fonts.cjs"
          source "$OUT/capture.sh"
          sha256sum --check "$OUT/dist.sha256" > "$OUT/dist-before-app.log"
          capture app-prepare node scripts/qa/prepareSoccerCommunityShieldApp.mjs
          capture app-prepare-classify node --input-type=module <<'PREP'
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { gunzipSync } from 'node:zlib';
          import { pathToFileURL } from 'node:url';
          const folder = process.env.SC_SHIELD_APP_PREP, sha = body => createHash('sha256').update(body).digest('hex');
          const read = name => JSON.parse(fs.readFileSync(path.join(folder, name), 'utf8'));
          const manifest = read('manifest.json'), receipt = read('receipt.json'), summary = read('capture-summary.json');
          assert.equal(receipt.completed, true); assert.equal(receipt.primary, null); assert.deepEqual(receipt.secondary, []);
          assert.equal(manifest.schema, 1); assert.equal(manifest.prepared.length, 3);
          assert.equal(manifest.capture.completedCalls, 4); assert.equal(manifest.capture.sourceTapesHeld, true);
          assert.equal(summary.completedCalls, 4); assert.equal(summary.sourceTapesHeld, true); assert.equal(summary.cases.length, 4);
          assert.deepEqual(summary.cases, manifest.capture.cases);
          const carrier = JSON.parse(fs.readFileSync('scripts/qa/fixtures/soccerCommunityShield.opening-inputs.json', 'utf8'));
          const packed = Buffer.from(carrier.body, 'hex'), payload = gunzipSync(packed);
          assert.equal(packed.length, carrier.compressed.bytes); assert.equal(sha(packed), carrier.compressed.sha256);
          assert.equal(payload.length, carrier.payload.bytes); assert.equal(sha(payload), carrier.payload.sha256);
          assert.deepEqual(payload, fs.readFileSync(path.join(folder, 'opening-inputs.json')));
          const inputs = JSON.parse(payload), old = JSON.parse(fs.readFileSync('scripts/qa/fixtures/soccerCommunityShield.captured.json', 'utf8'));
          const names = ['loss-absent', 'loss-present', 'win-absent', 'win-present'];
          assert.deepEqual(fs.readdirSync(folder).filter(name => /^capture-(win|loss)-(present|absent)\.json$/.test(name)).sort(), names.map(name => 'capture-' + name + '.json'));
          const compiled = read('compiled-inputs.json'), executable = fs.readFileSync(path.join(folder, 'actual-readers.mjs'));
          assert.equal(executable.length, compiled.executable.bytes); assert.equal(sha(executable), compiled.executable.sha256);
          const descriptor = Object.getOwnPropertyDescriptor(globalThis, 'localStorage'); let api;
          try {
            Object.defineProperty(globalThis, 'localStorage', { configurable: true, writable: true, value: { getItem: () => null, setItem() {}, removeItem() {} } });
            api = await import(pathToFileURL(path.join(folder, 'actual-readers.mjs')).href);
          } finally { if (descriptor) Object.defineProperty(globalThis, 'localStorage', descriptor); else delete globalThis.localStorage; }
          const five = row => Object.fromEntries(['apps', 'goals', 'assists', 'cleanSheets', 'rating'].map(key => [key, row[key]])), verified = [];
          for (const [index, input] of inputs.entries()) {
            const id = input.id, meta = carrier.entries[index], present = read('capture-' + id + '-present.json'), absent = read('capture-' + id + '-absent.json');
            assert.equal(meta.id, id); assert.equal(meta.seed, index); assert.equal(meta.clock, 1793448000000);
            assert.deepEqual(present.before, input.before);
            const absentBefore = structuredClone(input.before); delete absentBefore.extraCupQualification;
            assert.deepEqual(absent.before, absentBefore);
            for (const [arm, record] of [['present', present], ['absent', absent]]) {
              assert.equal(record.label, id + '-' + arm); assert.equal(record.seed, meta.seed); assert.equal(record.clock, meta.clock); assert.equal(record.error, null);
              assert.deepEqual(record.inputAfter, record.before);
              assert.equal(record.draws.length, meta.drawCount); assert.equal(sha(Buffer.from(JSON.stringify(record.draws))), meta.drawsSha256);
              assert.equal(record.finalLcgState, meta.finalLcgState);
              assert.equal(api.save.isSoccerCareerSave(record.after), true);
              assert.equal(summary.cases.filter(row => row.label === record.label && row.draws === meta.drawCount && row.drawsSha256 === meta.drawsSha256 && row.finalLcgState === meta.finalLcgState).length, 1);
            }
            assert.deepEqual(present.draws, absent.draws);
            assert.deepEqual(absent.after, input.expectedAbsent);
            const oldMeta = old.states.find(row => row.id === id), oldBody = fs.readFileSync(path.join(folder, 'original-' + id + '.json'));
            assert.equal(oldBody.length, oldMeta.rawObjectFragmentBytes); assert.equal(sha(oldBody), oldMeta.rawObjectFragmentSha256);
            const normalized = structuredClone(present.after);
            assert(Object.hasOwn(normalized.seasons.at(-1).extraCups[0], 'annualRating'));
            assert(Object.hasOwn(normalized.pendingSummary.extraCups[0], 'annualRating'));
            delete normalized.seasons.at(-1).extraCups[0].annualRating; delete normalized.pendingSummary.extraCups[0].annualRating;
            assert.deepEqual(normalized, JSON.parse(oldBody));
            const row = present.after.seasons.at(-1), annual = absent.after.seasons.at(-1), match = api.extra.readCommunityShield(row);
            assert(match && match.player.apps === 1); assert.equal(match.annualRating, annual.rating);
            assert.deepEqual(api.extra.communityShieldAnnualStats(row), five(annual));
            assert.deepEqual(api.extra.communityShieldSeasonStats(annual, match), five(row));
            const key = api.binding.soccerSeasonKey(present.after.playerName, row);
            assert(key); assert.equal(key, api.binding.soccerSeasonKey(absent.after.playerName, annual));
            const plan = api.season.deriveSeason(api.binding.SOCCER, row, api.binding.buildSoccerSeasonCtx(present.after, api.engine.FALLBACK_CLUBS, row));
            assert(plan); assert.deepEqual(plan, api.season.deriveSeason(api.binding.SOCCER, annual, api.binding.buildSoccerSeasonCtx(absent.after, api.engine.FALLBACK_CLUBS, annual)));
            const agreement = read('capture-' + id + '-agreement.json');
            assert.deepEqual(agreement, { annual: five(annual), final: five(row), match, key, plan, completeOldAbsentHeld: true, completeOldSelectedHeldExceptMirroredAnnualRating: true });
            assert.deepEqual(read('fresh-original-' + id + '.json'), present.after);
            verified.push({ id, seed: meta.seed, draws: meta.drawCount, drawsSha256: meta.drawsSha256, annual: five(annual), final: five(row), annualRating: match.annualRating, key, completePlanSha256: sha(Buffer.from(JSON.stringify(plan))), completeOldOutputsHeld: true });
          }
          const raw = fs.readFileSync(process.env.OUT + '/app-prepare.stdout', 'utf8') + '\n' + fs.readFileSync(process.env.OUT + '/app-prepare.stderr', 'utf8');
          assert.equal(/Unhandled (?:Errors?|Rejection|Exception)|unhandledRejection|uncaughtException|ERR_MODULE_NOT_FOUND|ERR_LOAD_URL|SyntaxError:|ReferenceError:|TypeError:/i.test(raw), false);
          fs.writeFileSync(process.env.OUT + '/app-prepare-summary.json', JSON.stringify({ schema: 1, actualPublicAdvances: 4, fixedRetainedInputs: 2, verified, rawCaptureFiles: names, runtimeCounters: null, runtimeCounterCompleteness: 'UNKNOWN', scope: 'Exact retained input/tape replays only, no cohort or browser claim' }, null, 2) + '\n');
          console.log('SC_APP_PREP: 4 raw public advances, exact old outputs and tapes, 2 genuine annual-grade/key/complete-plan agreements');
          PREP
          find "$SC_SHIELD_APP_PREP" -type f -print0 | sort -z | xargs -0 sha256sum > "$OUT/app-prepared.sha256"
          capture app node scripts/qa/playSoccerCommunityShieldApp.mjs
          sha256sum --check "$OUT/dist.sha256" > "$OUT/dist-after-app.log"
          capture app-classify node --input-type=module <<'APP'
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          const folder = process.env.SC_SHIELD_APP_OUT, sha = body => createHash('sha256').update(body).digest('hex');
          const summaryBytes = fs.readFileSync(path.join(folder, 'summary.json')), receiptBytes = fs.readFileSync(path.join(folder, 'receipt.json'));
          const summary = JSON.parse(summaryBytes), receipt = JSON.parse(receiptBytes);
          assert.equal(summary.schema, 1); assert.equal(summary.completed, true);
          for (const [field, value] of Object.entries({ contextsAttempted: 3, contextsCompleted: 3, healthyContexts: 3, controls: 15, restored: 15, originalPngs: 12, nativeReloads: 3, nativeActions: 49 })) assert.equal(summary[field], value, field);
          assert.equal(receipt.completed, true); assert.equal(receipt.primary, null); assert.deepEqual(receipt.cleanupErrors, []);
          assert.equal(receipt.contextsCompleted, 3); assert.equal(receipt.healthyContexts, 3); assert.equal(receipt.attempted.length, 3); assert.equal(new Set(receipt.attempted).size, 3);
          const pngs = [];
          function walk(dir) { for (const entry of fs.readdirSync(dir, { withFileTypes: true })) { const file = path.join(dir, entry.name); if (entry.isDirectory()) walk(file); else if (entry.name.endsWith('.png')) { const bytes = fs.readFileSync(file); assert.equal(bytes.subarray(0, 8).toString('hex'), '89504e470d0a1a0a'); pngs.push({ file: path.relative(folder, file), bytes: bytes.length, sha256: sha(bytes) }); } } }
          walk(folder); assert.equal(pngs.length, 12);
          const raw = fs.readFileSync(process.env.OUT + '/app.stdout', 'utf8') + '\n' + fs.readFileSync(process.env.OUT + '/app.stderr', 'utf8');
          const detectedRuntimeError = /(?:Unhandled (?:Errors?|Rejection|Exception)|unhandledRejection|uncaughtException|ERR_MODULE_NOT_FOUND|SyntaxError:|ReferenceError:|TypeError:)/i.test(raw);
          assert.equal(detectedRuntimeError, false);
          fs.writeFileSync(process.env.OUT + '/app-summary.json', JSON.stringify({ schema: 1, summary, receipt, pngs, rawSummarySha256: sha(summaryBytes), rawReceiptSha256: sha(receiptBytes), runtimeCounters: receipt.runtimeCounters ?? null, runtimeCounterCompleteness: receipt.runtimeCounterCompleteness ?? 'UNKNOWN', detectedRuntimeError, scope: 'Three actual App contexts on the same completed dist, fresh retained-input/tape public captures and a declared zero-app bench/grade lab. No whole-career, naturally observed bench or penalty claim.' }, null, 2) + '\n');
          APP
      - name: Always retain original derived preparation and browser records
        if: always()
        run: |
          set -euo pipefail
          for entry in "${SC_SHIELD_BUILD_QA:-}:derived" "${SC_SHIELD_APP_PREP:-}:app-prepared" "${SC_SHIELD_APP_OUT:-}:actual-app"; do
            source=${entry%:*}; name=${entry##*:}
            if test -n "$source" && test -d "$source"; then cp -a -- "$source" "$OUT/$name"; fi
          done
      - name: Always hold source membership tools fonts dist and final generated bytes
        if: always()
        run: |
          set -euo pipefail
          git diff --binary HEAD > "$OUT/generated.diff"
          git diff --name-only HEAD > "$OUT/generated-paths.txt"
          git ls-files --others --exclude-standard > "$OUT/untracked.txt"
          if test -f "$OUT/immutable-source.sha256"; then sha256sum --check "$OUT/immutable-source.sha256" > "$OUT/immutable-source-held.log"; else sha256sum --check "$OUT/source.sha256" > "$OUT/source-held.log"; fi
          git ls-files -z > "$OUT/source-members.after"; cmp "$OUT/source-members.before" "$OUT/source-members.after"
          for list in dependency-files browser-files python-files font-files cache-adapter dist app-prepared; do
            if test -f "$OUT/$list.sha256"; then sha256sum --check "$OUT/$list.sha256" > "$OUT/$list-held.log"; fi
          done
          if test -f "$OUT/tools-root.txt"; then tools="$(cat "$OUT/tools-root.txt")"; "$tools/python/bin/python" -m pip freeze > "$OUT/python-packages.after"; cmp "$OUT/python-packages.before" "$OUT/python-packages.after"; fi
          node --input-type=module <<'HOLDS'
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          const out = process.env.OUT, allowed = ['public/soccer-career/index.html', 'public/sitemap.xml', 'scripts/data/lastmod.json'], sha = body => createHash('sha256').update(body).digest('hex');
          const changed = fs.readFileSync(out + '/generated-paths.txt', 'utf8').trim().split('\n').filter(Boolean), untracked = fs.readFileSync(out + '/untracked.txt', 'utf8').trim().split('\n').filter(Boolean);
          for (const file of changed) assert(allowed.includes(file), 'Only the three existing generated paths may change: ' + file);
          assert.deepEqual(untracked, []);
          const afterFile = process.env.SC_SHIELD_BUILD_QA ? process.env.SC_SHIELD_BUILD_QA + '/after-manifest.json' : null;
          const after = afterFile && fs.existsSync(afterFile) ? JSON.parse(fs.readFileSync(afterFile, 'utf8')) : null;
          const final = [];
          for (const file of allowed) {
            if (!fs.existsSync(file)) continue;
            const body = fs.readFileSync(file), saved = path.join(out, 'final-generated-current', file); fs.mkdirSync(path.dirname(saved), { recursive: true }); fs.writeFileSync(saved, body, { flag: 'wx' });
            if (after) { const expected = after.find(row => row.path === file); assert(expected); assert.equal(body.length, expected.bytes); assert.equal(sha(body), expected.sha256); assert.deepEqual(body, fs.readFileSync(path.join(process.env.SC_SHIELD_BUILD_QA, 'after', file))); }
            final.push({ path: file, bytes: body.length, sha256: sha(body), guardAfterBound: !!after });
          }
          fs.writeFileSync(out + '/final-generated-custody.json', JSON.stringify({ afterManifestAvailable: !!after, final }, null, 2) + '\n');
          HOLDS
          test ! -s "$OUT/font-cache-misses.jsonl"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sc-shield-annual-final-${{ github.run_id }}
          path: ${{ runner.temp }}/sc-shield-annual-final/
          retention-days: 14