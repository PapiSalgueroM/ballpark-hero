name: Front Office full-market outcomes and focused regressions
on:
  push:
    branches: [codex/front-office-full-market-outcomes-20261104]
permissions:
  contents: read
  actions: write
env:
  CI: '1'
  SIM_NETWORK: offline
jobs:
  outcomes:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Stop superseded full-history checkout
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          status=$(gh api repos/PapiSalgueroM/ballpark-hero/actions/runs/41900101151 --jq .status)
          if [[ "$status" != completed ]]; then gh api --method POST repos/PapiSalgueroM/ballpark-hero/actions/runs/41900101151/cancel; fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Hold exact candidate source
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/front-office-outcomes"
          mkdir -p "$OUT"
          echo "QA_OUT=$OUT" >> "$GITHUB_ENV"
          git rev-parse HEAD HEAD^{tree} > "$OUT/source.txt"
          git ls-files -z | sort -z | xargs -0 sha256sum > "$OUT/source-before.sha256"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          npm ci --no-audit --no-fund > "$OUT/install.log" 2>&1
      - name: Compare fixed original restored and independent physical controls
        shell: bash
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$GITHUB_WORKSPACE/scripts/lib/offlineTransport.cjs"
          : > "$QA_OUT/caller-transport.log"
          SIM_OFFLINE_RECEIPT="$QA_OUT/caller-transport.log" node scripts/qa/frontOfficeMarketOutcomes.mjs "$QA_OUT/outcomes" fixed > "$QA_OUT/runner.log" 2>&1
          cat "$QA_OUT/runner.log"
          test ! -s "$QA_OUT/caller-transport.log"
      - name: Focused unchanged Front Office regressions
        shell: bash
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$GITHUB_WORKSPACE/scripts/lib/offlineTransport.cjs"
          : > "$QA_OUT/regression-transport.log"
          SIM_OFFLINE_RECEIPT="$QA_OUT/regression-transport.log" node node_modules/vitest/vitest.mjs run src/components/front-office/FrontOfficeFullRoster.test.tsx src/components/front-office/FrontOfficeCuts.test.tsx src/components/front-office/FrontOfficePromotion.test.tsx src/components/front-office/FrontOfficeTagDepth.test.tsx src/components/front-office/FrontOfficeRatingEvidence.test.tsx src/components/front-office/FrontOfficeLazyDesk.test.tsx src/components/front-office/FrontOfficeOnePress.test.tsx src/components/front-office/FrontOfficeTile.test.tsx src/components/front-office-shared/FrontOfficeGmCareer.test.tsx src/test/frontOfficeDraftAccess.test.tsx src/test/frontOfficeDraftReview.test.tsx src/test/frontOfficeDraftFocus.test.tsx src/test/frontOfficeSaveRecovery.test.tsx src/test/frontOfficeWriteRetry.test.tsx --maxWorkers=1 --no-file-parallelism --reporter=default --reporter=json --outputFile="$QA_OUT/regressions.json" > "$QA_OUT/regressions.log" 2>&1
          cat "$QA_OUT/regressions.log"
          test ! -s "$QA_OUT/regression-transport.log"
      - name: Affected existing harnesses
        shell: bash
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$GITHUB_WORKSPACE/scripts/lib/offlineTransport.cjs"
          mkdir -p "$QA_OUT/sims"
          : > "$QA_OUT/sims-transport.log"
          for harness in simFoHub simFoLazyDesk simFoRatingOrder simFrontOfficeRoster simFrontOfficeCuts simFrontOfficeSaveRecovery simFrontOfficeSchedule simNflFullRosters simNflGmDesk simNflPracticePromotion simNflTagDepth simGmDesk simGmDeskHost; do
            SIM_OFFLINE_RECEIPT="$QA_OUT/sims-transport.log" node "scripts/$harness.mjs" > "$QA_OUT/sims/$harness.log" 2>&1
            cat "$QA_OUT/sims/$harness.log"
          done
          test ! -s "$QA_OUT/sims-transport.log"
      - name: Always require full exact source preservation
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code HEAD > "$QA_OUT/source-diff.txt"
          git ls-files -z | sort -z | xargs -0 sha256sum > "$QA_OUT/source-after.sha256"
          cmp "$QA_OUT/source-before.sha256" "$QA_OUT/source-after.sha256"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: front-office-market-outcomes
          path: ${{ runner.temp }}/front-office-outcomes
          if-no-files-found: error
          retention-days: 14
