          test "$(git rev-parse "$PUBLISHED_SOURCE^{tree}")" = "$PUBLISHED_TREE"
          test "$(git rev-parse "$DEPLOY_SOURCE^{tree}")" = "$DEPLOY_TREE"
          test "$(git rev-parse "$STAGE1_SOURCE^{tree}")" = "$STAGE1_TREE"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import path from 'node:path';import assert from 'node:assert/strict';import {createHash} from 'node:crypto';import {spawnSync} from 'node:child_process';
          const rows=[{"path":"docs/data/soccer-historical-arrivals.md","before":"e2b6a87c7a44ab3f1473ebcb3ed65aba47b7d194","after":"adfae0db5b77775ab6c8a0398bfe6233a6683849"},{"path":"src/test/soccerHistoricalRealEntry.test.tsx","before":"a9c74d118bad8ddaf69e0af75e8185b5a7ca6d1c","after":"bec3f78f30501551fcd69bb3c88b8c8bf68c11d9"},{"path":"scripts/simSoccerHistoricalArrivals.mjs","before":"1d3af363c832ff7eacd498ca0f99eec6ca047a35","after":"02c559fcde4e731fedb02aaefaf83945815928a5"},{"path":"scripts/data/soccerHistoricalV1UiFixture.json","before":null,"after":"cdc13da018efec049567c8148755cc21a9b791d3"},{"path":"scripts/simNbaHistoricalDraft.mjs","before":"ff3b7ff375943cdc3c71a6a88b734bfc0cd98a84","after":"c1510bf64aef2ed0f75db10af2a00a8ae9d4163d"}],out=path.join(process.env.QA_OUT,'stage1-source'),sha=b=>createHash('sha256').update(b).digest('hex'),blob=b=>createHash('sha1').update('blob '+b.length+'\0').update(b).digest('hex');
          const online={...process.env};delete online.GIT_NO_LAZY_FETCH;fs.mkdirSync(out);const receipts=[];
          for(const row of rows){
            const before=row.before===null?null:fs.readFileSync(row.path);if(before)assert.equal(blob(before),row.before);else assert.equal(fs.existsSync(row.path),false);
            const args=['show',process.env.STAGE1_SOURCE+':'+row.path],read=spawnSync('git',args,{env:online,encoding:null,maxBuffer:4*1024*1024});
            const name=row.path.replaceAll('/','__');fs.writeFileSync(path.join(out,name+'.git.stderr'),read.stderr??Buffer.alloc(0));assert.equal(read.status,0);assert.equal(read.signal,null);assert.equal(read.error,undefined);
            const after=read.stdout;assert.equal(blob(after),row.after);
            if(before)fs.writeFileSync(path.join(out,name+'.before'),before,{flag:'wx'});fs.writeFileSync(path.join(out,name+'.after'),after,{flag:'wx'});
            const repeat=spawnSync('git',['cat-file','blob',row.after],{env:{...process.env,GIT_NO_LAZY_FETCH:'1'},encoding:null,maxBuffer:4*1024*1024});assert.equal(repeat.status,0);assert.equal(repeat.signal,null);assert.equal(repeat.error,undefined);assert(repeat.stdout.equals(after),'Exact no-lazy read after online materialization');
            if(row.path==='docs/data/soccer-historical-arrivals.md'){assert.equal(before.length,2798);assert.equal(after.length,5648);assert(after.subarray(0,before.length).equals(before));assert.equal(sha(after),'3d13303a6ae0b1a3c4181fb6e1d6219f3e7dcc0eff6c71dbab54b9373618c8f6');}
            receipts.push({...row,command:['git',...args],onlineExit:read.status,noLazyExit:repeat.status,beforeBytes:before?.length??null,beforeSHA256:before?sha(before):null,afterBytes:after.length,afterSHA256:sha(after)});
          }
          fs.writeFileSync(path.join(process.env.QA_OUT,'stage1-hydration.json'),JSON.stringify({status:'EXACT_FIVE_NEW_BODIES_HYDRATED_ONLINE_AND_READ_NO_LAZY',source:process.env.STAGE1_SOURCE,tree:process.env.STAGE1_TREE,rows:receipts},null,2)+'\n',{flag:'wx'});
          NODE
          printf 'GIT_NO_LAZY_FETCH=1\n' >> "$GITHUB_ENV"

      - name: Reuse exactly the completed V2 build and actual successful native artifact
