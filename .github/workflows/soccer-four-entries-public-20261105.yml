          grep -F '1 of 1 answered cleanly, 0 did not.' "$QA_OUT/logs/audit-live.log"
      - name: Submit only Soccer Career to IndexNow after all public checks pass
        shell: bash
        run: |
          set +e
          set -uo pipefail
          unset NODE_OPTIONS
          URLS=/soccer-career node scripts/indexnowSubmit.mjs > "$QA_OUT/logs/indexnow.log" 2>&1
          native_exit=$?
          printf '%s\n' "$native_exit" > "$QA_OUT/logs/indexnow.exit" || exit 1
          test "$native_exit" = 0 || exit "$native_exit"
          grep -E '1 URLs? to submit for douknowball.com' "$QA_OUT/logs/indexnow.log" || exit 1
          grep -E 'accepted \(HTTP (200|202)\)' "$QA_OUT/logs/indexnow.log"

      - name: Always retain full source payload and exact one-entry metadata inverse
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git ls-files -z > "$QA_OUT/tracked-after.bin"
          git ls-files -z | xargs -0 sha256sum > "$QA_OUT/source-after.sha256"
          git ls-files -s > "$QA_OUT/index-after.txt"
          git status --porcelain=v1 --untracked-files=all > "$QA_OUT/status-after.txt"
          cp package-lock.json "$QA_OUT/lock-after.json"
          cmp "$QA_OUT/tracked-before.bin" "$QA_OUT/tracked-after.bin"
          cmp "$QA_OUT/source-before.sha256" "$QA_OUT/source-after.sha256"
          cmp "$QA_OUT/index-before.txt" "$QA_OUT/index-after.txt"
          cmp "$QA_OUT/lock-before.json" "$QA_OUT/lock-after.json"
          test ! -s "$QA_OUT/status-before.txt"
          test ! -s "$QA_OUT/status-after.txt"
          if test -f "$QA_OUT/fixtures/manifest.json"; then
            node --input-type=module <<'NODE'
          import fs from 'node:fs';import path from 'node:path';import crypto from 'node:crypto';import assert from 'node:assert/strict';
          const out=process.env.QA_OUT,dir=path.join(out,'fixtures'),PUB='.github/workflows/soccer-four-entries-public-20261105.yml',sha=b=>crypto.createHash('sha256').update(b).digest('hex');
          const bytes=fs.readFileSync(path.join(dir,'manifest.json')),m=JSON.parse(bytes),originalBytes=fs.readFileSync(path.join(out,'original-native','manifest.json'));
          assert.deepEqual(m.sourceBefore,m.sourceAfter);
          for(const[p,d]of Object.entries(m.sourceAfter))assert.equal(sha(fs.readFileSync(p)),d,p);
          const expected=JSON.parse(fs.readFileSync(path.join(out,'fixture-files-before.json')));
          assert.equal(expected.length,9);assert.deepEqual(fs.readdirSync(dir).sort(),expected.map(r=>r.file).sort());
          for(const row of expected){const b=fs.readFileSync(path.join(dir,row.file));assert.equal(b.length,row.bytes);assert.equal(sha(b),row.sha256,row.file);}
          const inverse=JSON.parse(bytes);assert(Object.hasOwn(inverse.sourceBefore,PUB)&&Object.hasOwn(inverse.sourceAfter,PUB));
          delete inverse.sourceBefore[PUB];delete inverse.sourceAfter[PUB];
          assert(Buffer.from(JSON.stringify(inverse,null,2)+'\n').equals(originalBytes),'Delete only the one workflow entry from each source map and restore every original manifest byte');
          const native=path.join(process.env.QA_REF,'native');
          assert(fs.readFileSync(path.join(native,'native-fixtures','manifest.json')).equals(originalBytes));
          assert(fs.readFileSync(path.join(native,'source-before.sha256')).equals(fs.readFileSync(path.join(out,'original-native','source-before.sha256'))));
          const actual=[];function walk(rel=''){for(const e of fs.readdirSync(path.join(process.env.QA_DIST,rel),{withFileTypes:true})){const file=path.posix.join(rel,e.name);if(e.isDirectory())walk(file);else{assert(e.isFile());const b=fs.readFileSync(path.join(process.env.QA_DIST,file));actual.push({file,bytes:b.length,sha256:sha(b)});}}}
          walk();actual.sort((a,b)=>a.file<b.file?-1:a.file>b.file?1:0);assert.deepEqual(actual,m.distBefore);assert.equal(actual.length,849);
          const locks=Object.fromEntries(['package.json','package-lock.json','bun.lock','bun.lockb','yarn.lock','pnpm-lock.yaml'].map(p=>[p,fs.existsSync(p)?sha(fs.readFileSync(p)):null]));
          fs.writeFileSync(path.join(out,'all-locks-after.json'),JSON.stringify(locks)+'\n');assert.deepEqual(locks,JSON.parse(fs.readFileSync(path.join(out,'all-locks-before.json'))));
          const stage=JSON.parse(fs.readFileSync(path.join(out,'stage1-hydration.json')));
          assert.equal(stage.rows.length,5);for(const row of stage.rows){const name=row.path.replaceAll('/','__');const after=fs.readFileSync(path.join(out,'stage1-source',name+'.after'));assert.equal(after.length,row.afterBytes);assert.equal(sha(after),row.afterSHA256);if(row.before!==null){const before=fs.readFileSync(path.join(out,'stage1-source',name+'.before'));assert.equal(before.length,row.beforeBytes);assert.equal(sha(before),row.beforeSHA256);}}
          const ref=process.env.QA_REF,refs=[];function walkReference(rel=''){for(const e of fs.readdirSync(path.join(ref,rel),{withFileTypes:true})){const file=path.posix.join(rel,e.name);if(e.isDirectory())walkReference(file);else{assert(e.isFile());const b=fs.readFileSync(path.join(ref,file));refs.push({file,bytes:b.length,sha256:sha(b)});}}}walkReference();refs.sort((a,b)=>a.file<b.file?-1:a.file>b.file?1:0);
          const refBytes=Buffer.from(JSON.stringify(refs)+'\n');fs.writeFileSync(path.join(out,'input-reference-after.json'),refBytes);assert(refBytes.equals(fs.readFileSync(path.join(out,'input-reference-before.json'))));
          const receipts=fs.readdirSync(path.join(out,'transport')).sort();assert.deepEqual(receipts,['assets-after.log','assets-before.log','browser.log','types.log']);
          for(const name of receipts)assert.equal(fs.statSync(path.join(out,'transport',name)).size,0,'Silent actual receipt '+name);
          fs.writeFileSync(path.join(out,'source-dist-fixture-held.json'),JSON.stringify({source:true,dist:849,fixtureBoundaries:2,fixtureFiles:expected.length,allNativePayloadBodiesHeld:true,originalNativeManifestAndLedgerRetained:true,oneAddedWorkflowTwoSourceMapWholeInverseExact:true,allLockPresenceBodiesHeld:true,originalInputFilesHeld:true,readOnlyCodeNoBuild:true,modelContinuation:false})+'\n',{flag:'wx'});
          NODE
          fi
          printf '0\n' > "$QA_OUT/logs/final-source-holds.exit" || exit 1
      - name: Retain all actual public proof within the unchanged archive bound
        id: evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "$RUNNER_TEMP/soccer-four-entries-public.tar.gz" -C "$QA_OUT" .
          test "$(stat -c %s "$RUNNER_TEMP/soccer-four-entries-public.tar.gz")" -le 50000000
          sha256sum "$RUNNER_TEMP/soccer-four-entries-public.tar.gz" > "$RUNNER_TEMP/soccer-four-entries-public.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        if: always() && steps.evidence.outcome == 'success'
        with:
          name: soccer-four-entries-public
          path: |
            ${{ runner.temp }}/soccer-four-entries-public.tar.gz
            ${{ runner.temp }}/soccer-four-entries-public.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
