          git status --porcelain=v1 --untracked-files=all > "$QA_OUT/status-before.txt"
          cp package-lock.json "$QA_OUT/lock-before.json"
          node --input-type=module -e 'import fs from "node:fs";import crypto from "node:crypto";const sha=b=>crypto.createHash("sha256").update(b).digest("hex");fs.writeFileSync(process.env.QA_OUT+"/all-locks-before.json",JSON.stringify(Object.fromEntries(["package.json","package-lock.json","bun.lock","bun.lockb","yarn.lock","pnpm-lock.yaml"].map(p=>[p,fs.existsSync(p)?sha(fs.readFileSync(p)):null])))+"\n");'
          git rev-parse HEAD HEAD^ 'HEAD^{tree}' > "$QA_OUT/source-identity.txt"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          for(const key of ['PRODUCT','PRODUCT_TREE','STAGE1_SOURCE','STAGE1_TREE','NATIVE_SOURCE','NATIVE_TREE','PUBLISHED_SOURCE','PUBLISHED_TREE','DEPLOY_SOURCE','DEPLOY_TREE'])assert.match(process.env[key]??'',/^[a-f0-9]{40}$/,key+' actual binding');
          for(const key of ['NATIVE_RUN','NATIVE_JOB','NATIVE_ARTIFACT','NATIVE_BYTES','NATIVE_TGZ_BYTES','NATIVE_MANIFEST_BYTES'])assert.match(process.env[key]??'',/^[1-9][0-9]+$/,key+' actual binding');
          for(const key of ['NATIVE_SHA256','NATIVE_TGZ_SHA256','NATIVE_MANIFEST_SHA256','NATIVE_ADMISSION_SHA256'])assert.match(process.env[key]??'',/^[a-f0-9]{64}$/);
          assert.match(process.env.DEPLOYMENT_ID??'',/^[a-f0-9]{8}-(?:[a-f0-9]{4}-){3}[a-f0-9]{12}$/i);
          assert.equal(process.env.PUBLISHED_SOURCE,process.env.DEPLOY_SOURCE);assert.equal(process.env.PUBLISHED_TREE,process.env.DEPLOY_TREE);assert.equal(process.env.PUBLISHED_TREE,process.env.STAGE1_TREE,'Published/deployed full tree is the exact Stage1 composition');
          NODE
          test "$(git rev-parse HEAD^)" = "$NATIVE_SOURCE"
          test "$(git rev-parse "$NATIVE_SOURCE^{tree}")" = "$NATIVE_TREE"
          test "$(git hash-object scripts/qa/soccerHistoricalFourBrowser.mjs)" = "$BROWSER_BLOB"
          test "$(git hash-object scripts/qa/soccerHistoricalFourFixtures.mjs)" = "$FIXTURE_BLOB"
          test "$(git hash-object scripts/qa/soccerHistoricalFourNative.json)" = "$SPEC_BLOB"
          test "$(git hash-object scripts/qa/soccerHistoricalFourAssets.mjs)" = "$ASSETS_BLOB"
          test "$(git hash-object scripts/qa/nativeScrollReady.mjs)" = "$READY_BLOB"
          git diff --name-status HEAD^ HEAD > "$QA_OUT/qa-delta.txt"
          node --input-type=module -e 'import fs from "node:fs";import assert from "node:assert/strict";assert.equal(fs.readFileSync(process.env.QA_OUT+"/qa-delta.txt","utf8"),"A\t.github/workflows/soccer-four-entries-public-20261105.yml\n");'
          test ! -s "$QA_OUT/status-before.txt"
      - name: Read exact product merge deployment and completed build source identities
        shell: bash
        run: |
          set -euo pipefail
          for ref in "$PRODUCT" "$STAGE1_SOURCE" "$PUBLISHED_SOURCE" "$DEPLOY_SOURCE" 6a173004a760ac26af0fa63d3745c8a9e6a40544; do
            git fetch --depth=1 --filter=blob:none origin "$ref" >> "$QA_OUT/logs/source-ref-fetch.log" 2>&1
          done
