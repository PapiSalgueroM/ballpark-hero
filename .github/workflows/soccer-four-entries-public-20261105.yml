      - name: Install held App and browser runtime without rebuilding
        shell: bash
        run: |
          set -euo pipefail
          test "$(bun --version)" = 1.4.4
          bun --version > "$QA_OUT/logs/bun-version.log"
          node --version > "$QA_OUT/logs/node-version.log"
          bun install --frozen-lockfile > "$QA_OUT/logs/bun-install.log" 2>&1
          git diff --exit-code HEAD -- package.json package-lock.json bun.lock bun.lockb
          npm install --prefix "$RUNNER_TEMP/real-entry-public-tools" --package-lock=false --no-audit --no-fund playwright@1.64.0 > "$QA_OUT/logs/playwright-install.log" 2>&1
          test ! -e node_modules/playwright
          test ! -e node_modules/playwright-core
          ln -s "$RUNNER_TEMP/real-entry-public-tools/node_modules/playwright" node_modules/playwright
          ln -s "$RUNNER_TEMP/real-entry-public-tools/node_modules/playwright-core" node_modules/playwright-core
          "$RUNNER_TEMP/real-entry-public-tools/node_modules/.bin/playwright" install --with-deps chromium > "$QA_OUT/logs/chromium-install.log" 2>&1
      - name: Proper App types with a silent receipt
        shell: bash
        run: |
