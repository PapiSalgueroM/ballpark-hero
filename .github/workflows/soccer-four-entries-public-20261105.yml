      - name: Bind one added public workflow and all qualified helper bytes
        shell: bash
        run: |
          set -euo pipefail
          QA_OUT="$RUNNER_TEMP/soccer-four-entries-public"
          QA_REF="$RUNNER_TEMP/soccer-four-entries-public-inputs"
          QA_DIST="$RUNNER_TEMP/soccer-four-entries-public-dist"
