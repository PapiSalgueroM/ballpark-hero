          requireEntry(200,true,reference);const tag=expected[0].tag;assert.equal(reference.split(tag).length,2);
          const staleTag=tag.replace(expected[0].src,'/assets/index-real-entry-readiness-stale-control.js'),fault=reference.replace(tag,staleTag);assert.notEqual(staleTag,tag);assert.notEqual(fault,reference);let owned=null;try{requireEntry(200,true,fault);}catch(error){owned=error;}assert(owned instanceof assert.AssertionError);assert.match(owned.message,/^SC_REAL_ENTRY_PUBLIC_EXPECTED_ENTRY_READY/);assert.equal(fault.replace(staleTag,tag),reference);
          fs.writeFileSync(out+'/reference-index.html',reference);fs.writeFileSync(out+'/copied-stale-control.html',fault);fs.writeFileSync(out+'/control.json',JSON.stringify({changed:true,referenceSHA256:sha(reference),faultSHA256:sha(fault),ownedFailure:{name:owned.name,message:owned.message},wholeInverseExact:true,scope:'Copied completed HTML through the same validator; actual HTTP bodies are never mocked.'},null,2)+'\n');
          const started=Date.now(),deadline=started+360000,attempts=[];let ready=false;
