jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Bind actual publication sources and one completed build artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/nba-fo-market-public"
          REF="$RUNNER_TEMP/nba-fo-market-public-reference"
          mkdir -p "$OUT/logs" "$OUT/transport" "$REF"
          echo "QA_OUT=$OUT" >> "$GITHUB_ENV"
          echo "QA_REF=$REF" >> "$GITHUB_ENV"
          export QA_OUT="$OUT" QA_REF="$REF"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          for(const key of ['PUBLIC_QA_PARENT','PUBLIC_QA_PARENT_TREE','PUBLISHED_MAIN_SOURCE','PUBLISHED_MAIN_TREE','PROJECT_DEPLOY_SOURCE','PROJECT_DEPLOY_TREE','BUILD_SOURCE','BUILD_TREE'])assert.match(process.env[key]||'',/^[a-f0-9]{40}$/,key+' must be measured before activation');
          for(const key of ['BUILD_ARTIFACT_SHA256','BUILD_TAR_SHA256','BUILD_SOURCE_INVENTORY_SHA256','BUILD_DIST_INVENTORY_SHA256','BUILD_DIST_DIGEST','BUILD_FIXTURE_INVENTORY_SHA256','BUILD_FIXTURE_MANIFEST_SHA256','BUILD_ENGINE_BUNDLE_SHA256'])assert.match(process.env[key]||'',/^[a-f0-9]{64}$/,key+' must be measured before activation');
          for(const key of ['BUILD_RUN','BUILD_JOB','BUILD_ARTIFACT_ID','BUILD_ARTIFACT_BYTES','BUILD_TAR_BYTES','BUILD_SOURCE_FILE_COUNT','BUILD_DIST_FILE_COUNT'])assert.match(process.env[key]||'',/^[1-9][0-9]*$/,key+' must be measured before activation');
          assert.match(process.env.BUILD_ARTIFACT_NAME||'',/^nba-fo-market-build-[0-9]+-[0-9]+$/);
          assert.match(process.env.EXPECTED_ENTRY||'',/^\/assets\/index-[^/?#]+\.js$/);
          assert(process.env.PROJECT_DEPLOYMENT_ID&&!process.env.PROJECT_DEPLOYMENT_ID.includes('MUST_BIND'),'Actual project deployment must be independently verified before activation');
          NODE
          test "$(git rev-parse HEAD^)" = "$PUBLIC_QA_PARENT"
          test "$(git rev-parse HEAD^^{tree})" = "$PUBLIC_QA_PARENT_TREE"
          test "$(git diff --name-status HEAD^ HEAD)" = $'A\t.github/workflows/nba-fo-market-public-20261104.yml'
          mapfile -t source_refs < <(printf '%s\n' "$QUALIFIED_APPLICATION_CORE" "$JOINED_QA_CORE" "$BUILD_SOURCE" "$RECOVERY_SOURCE" "$PUBLISHED_MAIN_SOURCE" "$PROJECT_DEPLOY_SOURCE" | sort -u)
          for ref in "${source_refs[@]}"; do
            git fetch --no-tags --depth=1 --filter=blob:none origin "$ref" >> "$OUT/logs/source-ref-fetch.log" 2>&1
          done
          test "$(git rev-parse "$QUALIFIED_APPLICATION_CORE^{tree}")" = "$QUALIFIED_APPLICATION_TREE"
          test "$(git rev-parse "$JOINED_QA_CORE^{tree}")" = "$JOINED_QA_TREE"
          test "$(git rev-parse "$BUILD_SOURCE^{tree}")" = "$BUILD_TREE"
          test "$(git rev-parse "$BUILD_SOURCE:.github/workflows/nba-fo-market-build-20261104.yml")" = "$COMPILED_WORKFLOW_BLOB"
          test "$(git rev-parse "$PUBLISHED_MAIN_SOURCE^{tree}")" = "$PUBLISHED_MAIN_TREE"
          test "$(git rev-parse "$PROJECT_DEPLOY_SOURCE^{tree}")" = "$PROJECT_DEPLOY_TREE"
          protected=(src public index.html package.json package-lock.json bun.lock bun.lockb vite.config.ts tailwind.config.ts postcss.config.js components.json tsconfig.json tsconfig.app.json tsconfig.node.json)
          for ref in "$QUALIFIED_APPLICATION_CORE" "$JOINED_QA_CORE" "$BUILD_SOURCE" "$PUBLISHED_MAIN_SOURCE" "$PROJECT_DEPLOY_SOURCE"; do
            git diff --exit-code "$ref" HEAD -- "${protected[@]}" >> "$OUT/application-source-bridges.txt"
          done
          git diff --exit-code "$RECOVERY_SOURCE" HEAD -- scripts > "$OUT/compiled-script-source-bridge.txt"
          git diff --exit-code "$BUILD_SOURCE" "$PUBLISHED_MAIN_SOURCE" -- scripts ':(exclude)scripts/qa/**' > "$OUT/main-build-script-bridge.txt"
          git diff --exit-code "$BUILD_SOURCE" "$PROJECT_DEPLOY_SOURCE" -- scripts ':(exclude)scripts/qa/**' > "$OUT/deployment-build-script-bridge.txt"
          git rev-parse HEAD HEAD^{tree} > "$OUT/source.txt"
          git ls-files -z | sort -z | xargs -0 sha256sum > "$OUT/source-before.sha256"
          git status --porcelain=v1 --untracked-files=all > "$OUT/status-before.txt"
          test ! -s "$OUT/status-before.txt"
          cp .github/workflows/nba-fo-market-public-20261104.yml "$OUT/workflow.yml"
          while read -r file pin; do test "$(git hash-object "$file")" = "$pin"; done <<'PINS'
          scripts/qa/nbaFoMarketFixtures.mjs 473594059a1941e20e1816b3f8605cc49cc171c0
          scripts/qa/nbaFoMarketBrowser.mjs 5e25d8b38eb5f42e01a82d22f249fe25fc5ad275
          scripts/qa/nbaFoMarketScrollControl.mjs 35abad4a8d54d2d691bf808e46f7d64a79418291
          scripts/qa/nbaFoMarketAssets.mjs 25abcbb80279d502f4360c3893b9445b07e29fc6
          scripts/qa/nativeScrollReady.mjs 671f460aa088d42b44c435a03594cf26695d6e09
          PINS
          curl --fail --location --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/PapiSalgueroM/ballpark-hero/actions/artifacts/$BUILD_ARTIFACT_ID" --output "$OUT/reference-meta.json"
          curl --fail --location --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/PapiSalgueroM/ballpark-hero/actions/jobs/$BUILD_JOB" --output "$OUT/reference-job.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const e=process.env,out=e.QA_OUT,m=JSON.parse(fs.readFileSync(out+'/reference-meta.json')),j=JSON.parse(fs.readFileSync(out+'/reference-job.json'));
          assert.equal(m.id,Number(e.BUILD_ARTIFACT_ID));assert.equal(m.name,e.BUILD_ARTIFACT_NAME);assert.equal(m.expired,false);assert.equal(m.size_in_bytes,Number(e.BUILD_ARTIFACT_BYTES));assert.equal(m.digest,'sha256:'+e.BUILD_ARTIFACT_SHA256);assert.equal(m.workflow_run.id,Number(e.BUILD_RUN));assert.equal(m.workflow_run.head_sha,e.BUILD_SOURCE);
          assert.equal(j.id,Number(e.BUILD_JOB));assert.equal(j.run_id,Number(e.BUILD_RUN));assert.equal(j.head_sha,e.BUILD_SOURCE);assert.equal(j.status,'completed');assert.equal(j.conclusion,'failure');assert.deepEqual(j.steps.filter(s=>s.conclusion==='failure').map(s=>s.name),['Source-held NBA3 native journeys on this completed build']);
          for(const name of ['Proper joined application types','Existing save and home guards, normal build, twenty readers and all unchanged page caps','Retain full source holds and transport evidence'])assert(j.steps.some(row=>row.name===name&&row.status==='completed'&&row.conclusion==='success'),'Actual successful compiled step '+name);
          NODE
          curl --fail --location --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/PapiSalgueroM/ballpark-hero/actions/artifacts/$BUILD_ARTIFACT_ID/zip" --output "$REF/reference-original.zip"
          test "$(stat -c%s "$REF/reference-original.zip")" = "$BUILD_ARTIFACT_BYTES"
          echo "$BUILD_ARTIFACT_SHA256  $REF/reference-original.zip" | sha256sum --check
          unzip -q "$REF/reference-original.zip" -d "$REF"
          test "$(stat -c%s "$REF/completed-dist.tar.gz")" = "$BUILD_TAR_BYTES"
          echo "$BUILD_TAR_SHA256  $REF/completed-dist.tar.gz" | sha256sum --check
          echo "$BUILD_SOURCE_INVENTORY_SHA256  $REF/source-before.sha256" | sha256sum --check
          echo "$BUILD_DIST_INVENTORY_SHA256  $REF/dist-before.sha256" | sha256sum --check
          echo "$BUILD_FIXTURE_INVENTORY_SHA256  $REF/fixture-before.sha256" | sha256sum --check
          echo "$BUILD_FIXTURE_MANIFEST_SHA256  $REF/nba-fixtures/manifest.json" | sha256sum --check
          cmp "$REF/source-before.sha256" "$REF/source-after.sha256"
          cmp "$REF/dist-before.sha256" "$REF/dist-after.sha256"
          test ! -s "$REF/source-diff.txt"
          test ! -s "$REF/status-before.txt"
          test ! -s "$REF/status-after.txt"
          test "$(wc -l < "$REF/source-before.sha256")" = "$BUILD_SOURCE_FILE_COUNT"
          test "$(wc -l < "$REF/dist-before.sha256")" = "$BUILD_DIST_FILE_COUNT"
          tar -tzf "$REF/completed-dist.tar.gz" > "$OUT/reference-dist-members.txt"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          for(const member of fs.readFileSync(process.env.QA_OUT+'/reference-dist-members.txt','utf8').trimEnd().split('\n'))assert(member==='dist/'||member.startsWith('dist/')&&!member.split('/').includes('..')&&!member.startsWith('/'),'Completed tar contains only relative dist members');
          NODE
          tar -xzf "$REF/completed-dist.tar.gz" -C "$REF"
          (cd "$REF" && sha256sum --check dist-before.sha256) > "$OUT/reference-dist-held.log"
          cp "$REF/dist-before.sha256" "$OUT/reference-dist-before.sha256"
      - name: Admit successful native recovery on the same honestly failed build input
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REC="$RUNNER_TEMP/nba-fo-market-public-recovery-reference"
          mkdir -p "$REC"
          echo "QA_RECOVERY_REF=$REC" >> "$GITHUB_ENV"
          export QA_RECOVERY_REF="$REC"
          test "$(git rev-parse "$RECOVERY_SOURCE^{tree}")" = "$RECOVERY_TREE"
          test "$(git rev-parse "$RECOVERY_SOURCE:.github/workflows/nba-fo-market-native-recovery-20261104.yml")" = "$RECOVERY_WORKFLOW_BLOB"
          for pair in "artifacts/$RECOVERY_ARTIFACT_ID artifact" "jobs/$RECOVERY_JOB job" "runs/$RECOVERY_RUN run" "runs/$BUILD_RUN original-run"; do
            read -r endpoint file <<< "$pair"
            curl --fail --location --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/PapiSalgueroM/ballpark-hero/actions/$endpoint" --output "$QA_OUT/recovery-$file.json"
          done
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';const e=process.env,out=e.QA_OUT,m=JSON.parse(fs.readFileSync(out+'/recovery-artifact.json')),j=JSON.parse(fs.readFileSync(out+'/recovery-job.json')),r=JSON.parse(fs.readFileSync(out+'/recovery-run.json')),old=JSON.parse(fs.readFileSync(out+'/recovery-original-run.json'));
          assert.equal(m.id,Number(e.RECOVERY_ARTIFACT_ID));assert.equal(m.name,'nba-fo-market-native-recovery');assert.equal(m.expired,false);assert.equal(m.size_in_bytes,Number(e.RECOVERY_ARTIFACT_BYTES));assert.equal(m.digest,'sha256:'+e.RECOVERY_ARTIFACT_SHA256);assert.equal(m.workflow_run.id,Number(e.RECOVERY_RUN));assert.equal(m.workflow_run.head_sha,e.RECOVERY_SOURCE);
          assert.equal(r.id,Number(e.RECOVERY_RUN));assert.equal(r.head_sha,e.RECOVERY_SOURCE);assert.equal(r.status,'completed');assert.equal(r.conclusion,'success');assert.equal(j.id,Number(e.RECOVERY_JOB));assert.equal(j.run_id,Number(e.RECOVERY_RUN));assert.equal(j.head_sha,e.RECOVERY_SOURCE);assert.equal(j.status,'completed');assert.equal(j.conclusion,'success');
          for(const name of ['Preserve the original first stop and bridge only declared QA source metadata','Serve the same completed artifact and run physical control before three normal contexts','Always retain source dist fixture lock and inverse holds'])assert(j.steps.some(s=>s.name===name&&s.status==='completed'&&s.conclusion==='success'));
          assert.equal(old.id,Number(e.BUILD_RUN));assert.equal(old.head_sha,e.BUILD_SOURCE);assert.equal(old.status,'completed');assert.equal(old.conclusion,'failure','Original completed-build run remains failed at native desktop first stop');
          NODE
          curl --fail --location --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/PapiSalgueroM/ballpark-hero/actions/artifacts/$RECOVERY_ARTIFACT_ID/zip" --output "$REC/reference-original.zip"
          test "$(stat -c%s "$REC/reference-original.zip")" = "$RECOVERY_ARTIFACT_BYTES"
          echo "$RECOVERY_ARTIFACT_SHA256  $REC/reference-original.zip" | sha256sum --check
          unzip -q "$REC/reference-original.zip" -d "$REC"
          echo "$RECOVERY_SOURCE_INVENTORY_SHA256  $REC/source-before.sha256" | sha256sum --check
          echo "$RECOVERY_FIXTURE_MANIFEST_SHA256  $REC/nba-recovery-fixtures/manifest.json" | sha256sum --check
          echo "$BUILD_FIXTURE_MANIFEST_SHA256  $REC/original-build-evidence/fixture-manifest-original.json" | sha256sum --check
          echo "$BUILD_SOURCE_INVENTORY_SHA256  $REC/original-build-evidence/source-before.sha256" | sha256sum --check
          cmp "$REC/source-before.sha256" "$REC/source-after.sha256"
          cmp "$REC/reference-dist-before.sha256" "$REC/reference-dist-after.sha256"
          cmp "$REC/fixture-recovery-files-before.json" "$REC/fixture-recovery-files-after.json"
          test ! -s "$REC/source-diff.txt"
          test ! -s "$REC/status-before.txt"
          test ! -s "$REC/status-after.txt"
          test "$(wc -l < "$REC/source-before.sha256")" = 5730
      - name: Reuse qualified recovery payloads and retain both manifest inverse chains
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import path from 'node:path';import crypto from 'node:crypto';import assert from 'node:assert/strict';import{execFileSync}from'node:child_process';
          const e=process.env,out=e.QA_OUT,ref=e.QA_REF,rec=e.QA_RECOVERY_REF,oldDir=ref+'/nba-fixtures',qualifiedDir=rec+'/nba-recovery-fixtures',newDir=out+'/nba-public-fixtures',sha=b=>crypto.createHash('sha256').update(b).digest('hex'),blob=b=>crypto.createHash('sha1').update('blob '+b.length+'\0').update(b).digest('hex'),canonical=o=>Buffer.from(JSON.stringify(o,null,2)+'\n');
          const sumMap=text=>Object.fromEntries(text.trimEnd().split('\n').map(line=>{const m=/^([a-f0-9]{64})  (.+)$/.exec(line);assert(m);return[m[2],m[1]];}));
          assert.deepEqual(fs.readFileSync(ref+'/source.txt','utf8').trimEnd().split('\n'),[e.BUILD_SOURCE,e.BUILD_TREE]);assert.deepEqual(fs.readFileSync(rec+'/source.txt','utf8').trimEnd().split('\n'),[e.RECOVERY_SOURCE,e.RECOVERY_TREE]);assert.equal(blob(fs.readFileSync(ref+'/workflow.yml')),e.COMPILED_WORKFLOW_BLOB);assert.equal(blob(fs.readFileSync(rec+'/workflow.yml')),e.RECOVERY_WORKFLOW_BLOB);assert.equal(fs.readFileSync(ref+'/logs/bun-version.log','utf8').trim(),'1.4.4');
          for(const key of ['sourceCapture','sourceDiff','statusCapture','holdExit'])assert.equal(JSON.parse(fs.readFileSync(ref+'/hold-exits.json'))[key],0);for(const key of ['sourceDiff','sourceCapture','statusCapture','fixtureHold','holdExit'])assert.equal(JSON.parse(fs.readFileSync(rec+'/hold-exits.json'))[key],0);
          const originalFailure=JSON.parse(fs.readFileSync(rec+'/original-build-evidence/native-first-stop.json'));assert.equal(originalFailure.status,'failed');assert.deepEqual(originalFailure.contexts.map(c=>[c.width,c.status]),[[320,'passed'],[390,'passed'],[1280,'failed']]);assert.match(originalFailure.contexts[2].error,/^AssertionError \[ERR_ASSERTION\]: Keyboard brings the actual tail row into its internal viewport\n/);assert.equal(originalFailure.sourceHeld,true);assert.equal(originalFailure.distHeld,true);
          const n=JSON.parse(fs.readFileSync(rec+'/native-admission.json'));assert.equal(n.status,'native-phase-passed');assert.equal(n.finalSourceDistFixtureHoldsRequired,true);assert.equal(n.originalRun,Number(e.BUILD_RUN));assert.equal(n.originalRunConclusion,'failure');assert.equal(n.completedBuildSource,e.BUILD_SOURCE);assert.equal(n.contexts,3);assert.equal(n.photos,3);assert.equal(n.controlsAdmittedBeforeNormal,true);assert.equal(n.controllerWrapperExit,0);assert.equal(n.controllerChildExit,1);assert.equal(n.actualControlPixels,10);assert.equal(n.fixtureManifestSHA256,e.RECOVERY_FIXTURE_MANIFEST_SHA256);assert.equal(n.originalFixtureManifestSHA256,e.BUILD_FIXTURE_MANIFEST_SHA256);assert.equal(n.engineBundleSHA256,e.BUILD_ENGINE_BUNDLE_SHA256);assert.equal(n.completedTarSHA256,e.BUILD_TAR_SHA256);
          const r=JSON.parse(fs.readFileSync(rec+'/nba-native/report.json'));assert.equal(r.status,'passed');assert.deepEqual(r.contexts.map(c=>[c.width,c.status]),[[320,'passed'],[390,'passed'],[1280,'passed']]);assert.equal(r.screenshots.length,3);assert.equal(new Set(r.screenshots).size,3);assert.equal(r.sourceHeld,true);assert.equal(r.distHeld,true);
          for(const c of r.contexts){for(const key of ['pageErrors','unexpectedConsole','undeclaredAborts','localHttpErrors','assetErrors'])assert.deepEqual(c[key],[]);assert.deepEqual(c.requestFailures.filter(row=>!c.aborts.some(a=>a.url===row.url)),[]);assert(c.assetBodies.some(row=>row.file==='prerender-boot.js'));assert.equal(c.failClosedControls.wholeInverseExact,true);assert.equal(c.failClosedControls.actualReportHeld,true);assert.match(c.failClosedControls.declaration.ownedFailure.message,/^NBA_FO_NATIVE_UNDECLARED_REQUEST_FAILURE/);assert.match(c.failClosedControls.boot.ownedFailure.message,/^NBA_FO_NATIVE_OBSERVED_BOOT_BODY/);}
