name: Club Manager real first-season fixtures

on:
  pull_request:
    paths:
      - .github/workflows/cm-real-fixtures.yml
      - src/data/clubManagerPremierFixtures2026.ts
      - src/lib/clubManagerFixtures.ts
      - src/lib/clubManager.ts
      - src/components/club-manager/CalendarCard.tsx
      - src/components/club-manager/CalendarScreen.tsx
      - src/components/club-manager/ClubManagerHelp.tsx
      - src/test/clubManagerFixtures*.test.ts
      - scripts/data/clubManagerPremierFixtures2026.receipt.json
      - scripts/simCmRealFixtures.mjs
      - scripts/playCmRealFixtures.mjs
      - scripts/simFixtureBalance.mjs
      - scripts/simCmLeagueRules.mjs
      - scripts/simLiveMatch.mjs
      - scripts/simClubManagerSlots.mjs
      - scripts/simWorldEditor.mjs
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character commit to verify
        required: true
        type: string

permissions:
  contents: read
concurrency:
  group: cm-real-fixtures-${{ github.event.pull_request.head.sha || inputs.source_sha || github.sha }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      SIM_NETWORK: offline
      ENGINES: chromium
      TZ: UTC
      SEO_SPLIT_BASE_REF: HEAD
      CM_REAL_FIXTURE_ARTIFACTS: cm-real-fixture-artifacts/outcomes
      CM_REAL_FIXTURE_NATIVE_ARTIFACTS: cm-real-fixture-artifacts/native
      CM_QUICK_SUBS_ARTIFACTS: cm-real-fixture-artifacts/quick-subs
      CM_SLOTS_ARTIFACTS: cm-real-fixture-artifacts/slots
      CM_SHOOTOUT_ARTIFACTS: cm-real-fixture-artifacts/shootout
      CM_WORLD_EDITOR_ARTIFACTS: cm-real-fixture-artifacts/world-editor
      FREE_KICK_FONT_CACHE: cm-real-fixture-artifacts/font-cache
      CHECKED_HEAD: ${{ github.event.pull_request.head.sha || inputs.source_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.source_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare exact-head remote verification
        run: |
          mkdir -p cm-real-fixture-artifacts
          [[ "$CHECKED_HEAD" =~ ^[a-fA-F0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CHECKED_HEAD"
          git rev-parse HEAD > cm-real-fixture-artifacts/source-head.txt
          git rev-parse HEAD^{tree} > cm-real-fixture-artifacts/source-tree.txt
          npm ci
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          python -m pip install fonttools pillow
          node scripts/qa/freeKickLab1070.mjs --prefetch-fonts-only 2>&1 | tee cm-real-fixture-artifacts/fonts.log
      - name: App types and build
        id: build
        run: |
          node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee cm-real-fixture-artifacts/types.log
          npm run build 2>&1 | tee cm-real-fixture-artifacts/build.log
      - name: Full real season outcomes and effective copied faults
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: CM_REAL_FIXTURE_CONTROL=all NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/simCmRealFixtures.mjs 2>&1 | tee cm-real-fixture-artifacts/real-outcomes.log
      - name: Actual phone and desktop fixture journeys
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/playCmRealFixtures.mjs 2>&1 | tee cm-real-fixture-artifacts/native.log
      - name: Save early fixture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cm-real-fixtures-early-${{ github.run_id }}-${{ github.run_attempt }}
          path: cm-real-fixture-artifacts/
          retention-days: 7
      - name: All existing Manager outcomes and related fixture checks
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          failed=0
          for script in scripts/simCm*.mjs scripts/simClubManager*.mjs; do
            harness="$(basename "$script" .mjs)"
            if [ "$harness" = simCmRealFixtures ]; then continue; fi
            if [ "$harness" = simCmQuickSubs ]; then
              CM_QUICK_SUBS_CONTROL=all NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/simCmQuickSubs.mjs 2>&1 | tee cm-real-fixture-artifacts/simCmQuickSubs.log || failed=1
              continue
            fi
            ONLY="$harness" node scripts/runAllSims.mjs --browser 2>&1 | tee "cm-real-fixture-artifacts/$harness.log" || failed=1
          done
          for harness in simCalendar simCalendarCurrentDate simWorld simWorldEditor simCup simMidSeasonStart simUclSeasonOne simUclPlaces simUclField simUclLegs simUclLegMigration simUclFormatHistory simMatchDetail simMatchScreen simLiveMatch simHalftime simNoDoubleRecord simScoringCoverage simScoreShown simHarnessAnchors; do
            ONLY="$harness" node scripts/runAllSims.mjs --browser 2>&1 | tee "cm-real-fixture-artifacts/$harness.log" || failed=1
          done
          exit "$failed"
      - name: Live, saved-slot and edited-season observer controls
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          failed=0
          for control in noplay nocut rekick nooppsubs statsroll doubleman; do
            LIVE_MATCH_CONTROL="$control" NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/simLiveMatch.mjs 2>&1 | tee "cm-real-fixture-artifacts/live-match-$control.log" || failed=1
            grep -Fq "simLiveMatch control $control: PASS" "cm-real-fixture-artifacts/live-match-$control.log" || failed=1
          done
          for control in nopark dupe norollback oldversion leanmore decisioncontent; do
            set +e
            SLOTS_CONTROL="$control" NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/simClubManagerSlots.mjs 2>&1 | tee "cm-real-fixture-artifacts/slot-$control.log"
            status=${PIPESTATUS[0]}
            set -e
            if [ "$status" -ne 1 ] || ! grep -q "CONTROL FIRED: SLOTS_CONTROL=$control" "cm-real-fixture-artifacts/slot-$control.log"; then failed=1; fi
            if [ "$control" = decisioncontent ]; then
              node -e "const fs=require('fs'),r=JSON.parse(fs.readFileSync(process.argv[1])); if(!r.passed || r.sources.some(s=>!s.held)) process.exit(1)" cm-real-fixture-artifacts/slots/decisioncontent-control.json || failed=1
            else
              node -e "const fs=require('fs'),r=JSON.parse(fs.readFileSync(process.argv[1])); if(r.runtimeErrors.length || r.sources.some(s=>!s.held)) process.exit(1)" "cm-real-fixture-artifacts/slots/$control-report.json" || failed=1
            fi
          done
          SIM_WORLD_EDITOR_CONTROL=observer NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/simWorldEditor.mjs 2>&1 | tee cm-real-fixture-artifacts/world-editor-observer.log || failed=1
          grep -Fq 'CONTROL FIRED (observer)' cm-real-fixture-artifacts/world-editor-observer.log || failed=1
          exit "$failed"
      - name: Generated fixtures, legacy saves and all existing fixture faults
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          failed=0
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/simFixtureBalance.mjs 2>&1 | tee cm-real-fixture-artifacts/fixture-balance.log || failed=1
          for control in oldparity noflag flipold nobinding fallbackflag fallbackcount enginebypass calendarbypass; do
            FIXTURE_CONTROL="$control" NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/simFixtureBalance.mjs 2>&1 | tee "cm-real-fixture-artifacts/fixture-$control.log" || failed=1
            grep -Fq "CONTROL FIRED ($control)" "cm-real-fixture-artifacts/fixture-$control.log" || failed=1
          done
          exit "$failed"
      - name: Every built page and search reader
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          failed=0
          for harness in simAdsense simBrand simHeadTags simHiddenPages simHubs simIndexNow simIndexing simInternalLinks simNoRivalNames simPrerender simPrerenderBoot simRetiredRoutes simSchema simSitemap simSnapshotAssets simSiteSearch simGuideHeadings simSeoTitles simSeoMetaSplit; do
            ONLY="$harness" node scripts/runAllSims.mjs --browser 2>&1 | tee "cm-real-fixture-artifacts/$harness.log" || failed=1
          done
          exit "$failed"
      - name: Reviewed source stays unchanged
        if: ${{ !cancelled() }}
        run: git diff --exit-code HEAD -- src scripts .github/workflows
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cm-real-fixtures-${{ github.run_id }}-${{ github.run_attempt }}
          path: cm-real-fixture-artifacts/
          retention-days: 7
