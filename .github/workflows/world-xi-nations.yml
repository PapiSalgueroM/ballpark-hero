name: World XI Green and scoped generation
on:
  push:
    branches: [codex/world-xi-nations-20261025]
permissions:
  contents: read
concurrency:
  group: world-xi-nations-${{ github.ref }}
  cancel-in-progress: false
jobs:
  generation:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CI: true
      SIM_NETWORK: offline
      ENGINES: chromium
      WORLD_XI_PHASE: green-generation
      EXPECTED_PARENT: 049f75a3d044e5b9b0233fd0891036a1246a3c3a
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Bind the exact six-path input and complete original source
        id: foundation
        timeout-minutes: 5
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/world-xi-green-generation"
          test ! -e "$out";test ! -L "$out";mkdir "$out"
          export WORLD_XI_OUT="$out";echo "WORLD_XI_OUT=$out" >> "$GITHUB_ENV"
          mkdir "$out/generator-temp"
          for name in TMPDIR TEMP TMP;do echo "$name=$out/generator-temp" >> "$GITHUB_ENV";done
          for name in NODE_OPTIONS NODE_PATH VITEST ONLY BROWSER PRERENDER_ONLY PRERENDER_CONTROL PRERENDER_PORT CHROME_PATH TYCOON_AWAY_CONTROL COMPLETION_HOOK OWNED_TIMEOUTS_HOOK CONQUEST_NBA_HOOK CONQUEST_NBA_BOARD POLL_FIXTURES US_BOARD_CONTROL_ALIAS US_BOARD_CONTROL_FILE DAILY_RECORD_CONTROL TYCOON_ROOMS_PAGE TYCOON_LOADS_STADIUM_HOOK TYCOON_LOADS_ACADEMY_HOOK TYCOON_LOADS_STADIUM_LIB TYCOON_LOADS_ACADEMY_LIB TYCOON_PITCH_COMPONENT TYCOON_PACKS_REWARDS TYCOON_PACKS_PANEL NO_DOUBLE_SWAP;do test ! -v "$name";done
          test "$WORLD_XI_PHASE" = green-generation
          test "$GITHUB_REPOSITORY" = PapiSalgueroM/ballpark-hero
          test "$GITHUB_REPOSITORY_ID" = 1195729679
          test "$GITHUB_REF" = refs/heads/codex/world-xi-nations-20261025
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git show -s --format=%P HEAD)" = "$EXPECTED_PARENT"
          test "$(git rev-parse "$EXPECTED_PARENT^{tree}")" = 4f3b9b5e0a915c9485c8e7583f39a28917441e01
          git diff --name-status "$EXPECTED_PARENT" HEAD > "$out/direct-paths.txt"
          printf 'M\t.github/workflows/world-xi-nations.yml\nA\tdocs/superpowers/plans/2026-10-25-world-xi-nations.md\nM\tsrc/data/gameContent/soccer1.ts\nA\tsrc/lib/worldXiNationPools.ts\nM\tsrc/pages/WorldXi.tsx\nA\tsrc/test/worldXiNationPools.test.ts\n' | cmp - "$out/direct-paths.txt"
          git diff --exit-code "$EXPECTED_PARENT" HEAD -- . ':!.github/workflows/world-xi-nations.yml' ':!docs/superpowers/plans/2026-10-25-world-xi-nations.md' ':!src/data/gameContent/soccer1.ts' ':!src/lib/worldXiNationPools.ts' ':!src/pages/WorldXi.tsx' ':!src/test/worldXiNationPools.test.ts' > "$out/other-parent-source-held.log"
          test "$(git ls-tree -r --name-only "$EXPECTED_PARENT" | wc -l)" -eq 5380
          for file in docs/superpowers/plans/2026-10-25-world-xi-nations.md src/lib/worldXiNationPools.ts src/test/worldXiNationPools.test.ts;do
            if git cat-file -e "$EXPECTED_PARENT:$file" 2>> "$out/parent-absence.stderr";then printf 'Unexpected parent member: %s\n' "$file";exit 1;fi
          done
          git rev-parse HEAD > "$out/head.txt";git rev-parse 'HEAD^{tree}' > "$out/tree.txt"
          git ls-files -z | sort -z > "$out/source-members.before"
          test "$(tr -cd '\000' < "$out/source-members.before" | wc -c)" -eq 5383
          git ls-files -z | sort -z | xargs -0 sha256sum > "$out/source.sha256"
          git ls-files -z -- . ':!public/world-xi/index.html' ':!public/sitemap.xml' ':!scripts/data/lastmod.json' | sort -z | xargs -0 sha256sum > "$out/source-held.sha256"
          git diff --exit-code HEAD > "$out/source-clean-before.log"
          git status --porcelain --untracked-files=all > "$out/status-before.txt";test ! -s "$out/status-before.txt"
          git archive --format=tar HEAD > "$out/source.tar"
          printf 'e60ff1534307e449ccef598e3b7470dcba58681b82cea4005cec7319f14f9221  scripts/lib/offlineTransport.cjs\n' | sha256sum -c - > "$out/offline-guard-before.log"
          cat > "$out/world-xi-green-generation.cjs" <<'HELPER'
          'use strict';
          const fs=require('node:fs'),path=require('node:path'),cp=require('node:child_process'),assert=require('node:assert/strict'),{createHash}=require('node:crypto');
          const {stripVTControlCharacters}=require('node:util');
          const ROOT=fs.realpathSync(process.cwd()),OUT=fs.realpathSync(process.env.WORLD_XI_OUT),SELF=fs.realpathSync(__filename);
          const PARENT='049f75a3d044e5b9b0233fd0891036a1246a3c3a',PARENT_TREE='4f3b9b5e0a915c9485c8e7583f39a28917441e01';
          const WF='.github/workflows/world-xi-nations.yml',TEST='src/test/worldXiNations.test.tsx';
          const PINS={
           'src/lib/worldXi.ts':'d30a6de90d868e789a76d21cf8b87696786f89d2',
           'src/pages/WorldXi.tsx':'f1d4155192611287d3c1f8dcdf96c6890c9d04d1',
           'src/data/wc2026Results.ts':'66895c18e8cc9f2f03be03fb50c1ed1f537399a9',
           'src/test/worldXiRespins.test.tsx':'c24155ca3220823587d5ab5fe7d3e76d098547d8',
           'src/test/worldXiSummary.test.tsx':'5c5af750d3f81258d0d69fcdeef12322b903edda',
           'src/test/setup.ts':'df00cdf5c54e8c8efc71e46d7585ae76acb4fc8d',
           'vitest.config.ts':'ed2a9dc677f77dfe95c061064eeff5782b856864',
           'package-lock.json':'97d6f12a052f25f400462938c241789a083f0bfe',
           'src/lib/worldXiNationPools.ts':'bf149cdce2d8b762a49860a5b23a825307fa92e6',
           'src/data/gameContent/soccer1.ts':'d5f515a80ac37ffbe35537b42a97d9b287d3ed61',
           'src/test/worldXiNationPools.test.ts':'ffb0dfb1e9b227aca253ffe014dd618ff7e6f325',
           'docs/superpowers/plans/2026-10-25-world-xi-nations.md':'5a9e42f22910383eba9dcd8834a30bcf835c2994',
           'scripts/prerender.mjs':'3d4fb1e595413c48c7bd65b927730d25cc3a2e18',
           'scripts/genSitemap.mjs':'08344dfc84be3ca24533c8d56e0f229b02b93c0a',
           'vite.config.ts':'0112b6ac4f2ad80b2fc04f9ec2f7185300913e7d',
           'package.json':'2ff64986fb76ebc51b706f2fd24765768874008a',
           'scripts/lib/atomicWrite.mjs':'0086680dfc663bb133d0a8c555180c7f6bc4a0a7',
           'scripts/lib/prerenderClock.mjs':'da0aa64a36581e239563bccc6844713930e1fe0d',
           'scripts/lib/offlineTransport.cjs':'0fda542a2649fe5da937c6976fd0f5b6073e74b6',
           'scripts/lib/playwrightLoader.mjs':'4f7739e217e0a47ee82e6bfc8be1c04bed17454a',
           'scripts/genSeoMetaParts.mjs':'4ea8d8661a3d99ae44f55aec38b443a80ca43318',
           [TEST]:'51e2c0ec6cd2cd647a4d85edbf89c4637e9edb12'
          };
          const OLD=[
           {file:'src/test/worldXiRespins.test.tsx',ancestor:'World XI respin budget (Round 743)',titles:[
            'a pick of 10 on the setup screen starts the game with 10 respins',
            'a pick of None starts the game with no respins',
            'three stays the default when nothing is picked']},
           {file:'src/test/worldXiSummary.test.tsx',ancestor:'World XI ratings and club chemistry display',titles:[
            'shows the exact card overall for every player after simulation',
            'shows the actual shared-club pairs behind the chemistry count',
            'shows zero shared clubs and clears the old detail on replay',
            'keeps the real season inputs and match average distinct from card overall']}
          ];
          const NEW={file:TEST,ancestor:'World XI nation pools on the real page',cases:[
           {title:'expands the default deck and completes a real draw with a goalkeeper-only nation',marker:'WORLD_XI_EXPANDED_DEFAULT',actual:12,expected:13},
           {title:'keeps the 2026 nation pool through respin, result, share and replay',marker:'WORLD_XI_2026_MODE',actual:0,expected:1}
          ]};
          const PURE={"file":"src/test/worldXiNationPools.test.ts","ancestor":"World XI nation pools","titles":["keeps Classic identity and the original draw RNG tape without drawing during selection","adds a one-keeper nation in Expanded and excludes empty buckets","derives the 2026 field from existing groups and returns the 48 canonical available keys","merges only the five known aliases and keeps North Korea and Congo separate","clones new-mode buckets without changing source rows and preserves namesakes and value ranking","draws and respins distinct fitting nations across all nine actual formations in both new modes","retains exact secondary-position coverage without turning wing-backs or keepers into front-line wings","refuses empty, under-eleven and uncovered pools without inventing a respin alternative"]};
          const sha=b=>createHash('sha256').update(b).digest('hex');
          const blob=b=>createHash('sha1').update(Buffer.from('blob '+b.length+'\0')).update(b).digest('hex');
          const output=name=>{assert.equal(path.basename(name),name);return path.join(OUT,name);};
          const write=(name,body)=>fs.writeFileSync(output(name),body,{flag:'wx'});
          const save=(name,value)=>write(name,JSON.stringify(value,null,2)+'\n');
          const json=name=>JSON.parse(fs.readFileSync(output(name),'utf8'));
          const git=args=>cp.execFileSync('git',args,{encoding:'utf8',maxBuffer:16*1024*1024}).trim();
          assert.notEqual(OUT,ROOT);assert(!OUT.startsWith(ROOT+path.sep));
          function regular(file){const s=fs.lstatSync(file);assert(s.isFile()&&!s.isSymbolicLink(),'WORLD_XI_REGULAR_FILE');return fs.readFileSync(file);}
          function native(id,status){
           const r=json(id+'.closed.json');assert.equal(r.id,id);
           assert(Number.isInteger(r.pid)&&r.pid>0,'WORLD_XI_NATIVE_PID');
           assert.equal(r.status,status,'WORLD_XI_NATIVE_STATUS');assert.equal(r.signal,null);assert.equal(r.error,null);
           assert.equal(r.closed,true);assert.equal(r.deadlineExpired,false);assert.deepEqual(r.signalAttempts,[]);
           assert.equal(r.receiptBytes,0);assert.equal(regular(output(id+'.transport')).length,0);
           for(const stream of ['stdout','stderr']){const b=regular(output(id+'.'+stream));assert.equal(b.length,r[stream+'Bytes']);assert.equal(sha(b),r[stream+'Sha256']);}
           return r;
          }
          function rows(report,spec,status){
           assert.equal(report.numPendingTests,0,'WORLD_XI_NO_PENDING');assert.equal(report.numTodoTests,0,'WORLD_XI_NO_TODO');
           assert(Array.isArray(report.testResults));assert.equal(report.testResults.length,spec.length,'WORLD_XI_FILE_CENSUS');
           const actual=[];
           for(const s of spec){
            const file=report.testResults.filter(f=>path.resolve(f.name)===path.resolve(s.file));
            assert.equal(file.length,1,'WORLD_XI_FILE_IDENTITY');assert.equal(file[0].message??'','','WORLD_XI_NO_FILE_ERROR');
            assert.equal(file[0].status,status==='passed'?'passed':'failed');
            assert(Array.isArray(file[0].assertionResults));assert.equal(file[0].assertionResults.length,s.titles.length,'WORLD_XI_CASE_CENSUS');
            for(const title of s.titles){
             const matches=file[0].assertionResults.filter(a=>a.title===title);
             assert.equal(matches.length,1,'WORLD_XI_CASE_IDENTITY');
             const a=matches[0];assert.deepEqual(a.ancestorTitles,[s.ancestor]);assert.equal(a.fullName,s.ancestor+' '+title);
             assert.equal(a.status,status,status==='passed'?'WORLD_XI_OLD_PASS':'WORLD_XI_RED_STATUS');
             assert(Array.isArray(a.failureMessages));if(status==='passed')assert.deepEqual(a.failureMessages,[]);
             actual.push(a);
            }
           }
           assert.equal(new Set(actual.map(a=>a.fullName)).size,actual.length);return actual;
          }
          async function run(id,args,status,deadlineMs,extra={},command=process.execPath){
           const receipt=output(id+'.transport');write(id+'.transport','');
           const so=fs.openSync(output(id+'.stdout'),'wx'),se=fs.openSync(output(id+'.stderr'),'wx');
           const r={id,command,args,startedAt:new Date().toISOString(),pid:null,status:null,signal:null,error:null,closed:false,deadlineMs,deadlineExpired:false,signalAttempts:[]};
           const child=cp.spawn(command,args,{cwd:ROOT,detached:true,stdio:['ignore',so,se],env:{...process.env,...extra,NODE_OPTIONS:'--require='+path.join(ROOT,'scripts/lib/offlineTransport.cjs')+(id==='prerender'?' --require='+path.join(OUT,'prerender-fonts.cjs'):''),SIM_OFFLINE_RECEIPT:receipt,SIM_NETWORK:'offline'}});
           r.pid=child.pid??null;save(id+'.start.json',r);
           let term=null,kill=null;
           const signalGroup=signal=>{const a={signal,at:new Date().toISOString(),error:null};try{process.kill(-child.pid,signal);}catch(e){a.error={name:e.name,message:e.message,code:e.code??null};}r.signalAttempts.push(a);};
           if(child.pid)term=setTimeout(()=>{r.deadlineExpired=true;signalGroup('SIGTERM');kill=setTimeout(()=>{if(!r.closed)signalGroup('SIGKILL');},15000);},deadlineMs);
           child.on('error',e=>r.error={name:e.name,message:e.message,code:e.code??null});
           await new Promise(resolve=>child.on('close',(code,signal)=>{r.status=code;r.signal=signal;r.closed=true;r.closedAt=new Date().toISOString();resolve();}));
           if(term)clearTimeout(term);if(kill)clearTimeout(kill);fs.closeSync(so);fs.closeSync(se);
           r.receiptBytes=regular(receipt).length;
           for(const stream of ['stdout','stderr']){const b=regular(output(id+'.'+stream));r[stream+'Bytes']=b.length;r[stream+'Sha256']=sha(b);}
           save(id+'.closed.json',r);return {record:r,expectedStatus:status};
          }
          
          const OUTPUTS=['public/world-xi/index.html','public/sitemap.xml','scripts/data/lastmod.json'];
          const PHASE='green-generation';
          const PLAN='docs/superpowers/plans/2026-10-25-world-xi-nations.md';
          function inventory(dir,relative=''){
           const result=[];
           for(const name of fs.readdirSync(path.join(dir,relative)).sort()){
            const rel=relative?relative+'/'+name:name,file=path.join(dir,rel),s=fs.lstatSync(file);
            assert(!s.isSymbolicLink(),'WORLD_XI_INVENTORY_LINK');
            if(s.isDirectory())result.push(...inventory(dir,rel));
            else{assert(s.isFile(),'WORLD_XI_INVENTORY_REGULAR');const b=regular(file);result.push({file:rel,bytes:b.length,sha256:sha(b)});}
           }return result;
          }
          function copyRegularTree(from,to){const expected=inventory(from);assert(!fs.existsSync(to),'WORLD_XI_FRESH_COPY');fs.mkdirSync(to,{recursive:true});for(const row of expected){const dest=path.join(to,row.file);fs.mkdirSync(path.dirname(dest),{recursive:true});fs.writeFileSync(dest,regular(path.join(from,row.file)),{flag:'wx'});}assert.deepEqual(inventory(to),expected,'WORLD_XI_FULL_TREE_COPY');return expected;}
          function sourceSnapshot(){return Object.fromEntries(git(['ls-files','-z']).split('\0').filter(Boolean).map(file=>{const b=regular(file);return[file,{bytes:b.length,sha256:sha(b),gitBlob:blob(b)}];}));}
          function sourceHold(id,allowed=[]){
           const original=json('all-source-before.json'),current=sourceSnapshot();
           assert.deepEqual(Object.keys(current).sort(),Object.keys(original).sort(),'WORLD_XI_SOURCE_MEMBERS');
           const changed=Object.keys(original).filter(file=>JSON.stringify(original[file])!==JSON.stringify(current[file]));
           assert(changed.every(file=>allowed.includes(file)),'WORLD_XI_SOURCE_WRITE_SET');
           const status=cp.execFileSync('git',['status','--porcelain','--untracked-files=all'],{encoding:'utf8',maxBuffer:16*1024*1024}).trimEnd();const statusLines=status?status.split('\n'):[];assert(statusLines.every(line=>line.startsWith(' M ')&&allowed.includes(line.slice(3))),'WORLD_XI_EXACT_GENERATED_STATUS');
           save(id+'-source-state.json',{source:process.env.GITHUB_SHA,allowed,changed,current,allOtherBodiesHeld:true});
           return changed;
          }
          function greenBinding(){
           assert.equal(process.env.WORLD_XI_PHASE,PHASE);
           assert.equal(process.env.GITHUB_REPOSITORY,'PapiSalgueroM/ballpark-hero');
           assert.equal(process.env.GITHUB_REPOSITORY_ID,'1195729679');
           assert.equal(process.env.GITHUB_REF,'refs/heads/codex/world-xi-nations-20261025');
           assert.equal(git(['rev-parse','HEAD']),process.env.GITHUB_SHA);
           assert.equal(git(['show','-s','--format=%P','HEAD']),PARENT);
           assert.equal(git(['rev-parse',PARENT+'^{tree}']),PARENT_TREE);
           const criticalSources={};
           for(const[file,expected]of Object.entries(PINS)){
            const body=regular(file);assert.equal(blob(body),expected,'WORLD_XI_CRITICAL_SOURCE');
            assert.equal(git(['rev-parse','HEAD:'+file]),expected);
            criticalSources[file]={bytes:body.length,sha256:sha(body),gitBlob:expected};
           }
           const wf=regular(WF);assert.equal(blob(wf),git(['rev-parse','HEAD:'+WF]));
           criticalSources[WF]={bytes:wf.length,sha256:sha(wf),gitBlob:blob(wf)};
           assert.equal(sha(regular('scripts/lib/offlineTransport.cjs')),'e60ff1534307e449ccef598e3b7470dcba58681b82cea4005cec7319f14f9221');
           const all=sourceSnapshot();assert.equal(Object.keys(all).length,5383);
           save('all-source-before.json',all);
           const oldOutputs={};
           for(const file of OUTPUTS){const b=regular(file);oldOutputs[file]={bytes:b.length,sha256:sha(b)};const dest=path.join(OUT,'generated-before',file);fs.mkdirSync(path.dirname(dest),{recursive:true});fs.writeFileSync(dest,b,{flag:'wx'});}
           save('generated-before.json',oldOutputs);
           return {phase:PHASE,source:process.env.GITHUB_SHA,parent:PARENT,parentTree:PARENT_TREE,tree:git(['rev-parse','HEAD^{tree}']),run:process.env.GITHUB_RUN_ID,attempt:process.env.GITHUB_RUN_ATTEMPT,pid:process.pid,sourceBlobs:5383,parentBlobs:5380,directPaths:6,criticalSources,helper:{bytes:regular(SELF).length,sha256:sha(regular(SELF))},outputs:OUTPUTS,fullSuite:false,finalVerification:false,livePublished:false};
          }
          function reportHealthy(file,spec,total){
           const report=json(file);assert.equal(report.success,true,'WORLD_XI_GREEN_SUCCESS');assert.equal(report.numTotalTests,total);assert.equal(report.numPassedTests,total);assert.equal(report.numFailedTests,0);
           return rows(report,spec,'passed');
          }
          function pageFault(file,targetTitle,marker){
           const r=json(file);assert.equal(r.success,false);assert.equal(r.numTotalTests,2);assert.equal(r.numPassedTests,1);assert.equal(r.numFailedTests,1);assert.equal(r.numPendingTests,0);assert.equal(r.numTodoTests,0);
           assert.equal(r.testResults.length,1);const f=r.testResults[0];assert.equal(path.resolve(f.name),path.resolve(TEST));assert.equal(f.message??'','');assert.equal(f.status,'failed');assert.equal(f.assertionResults.length,2);
           for(const c of NEW.cases){const found=f.assertionResults.filter(a=>a.title===c.title);assert.equal(found.length,1);const a=found[0];assert.deepEqual(a.ancestorTitles,[NEW.ancestor]);assert.equal(a.fullName,NEW.ancestor+' '+c.title);
            if(c.title!==targetTitle){assert.equal(a.status,'passed');assert.deepEqual(a.failureMessages,[]);continue;}
            assert.equal(a.status,'failed');assert.equal(a.failureMessages.length,1);const error=stripVTControlCharacters(a.failureMessages[0]);
            assert(/^\s*AssertionError(?::|\s|\[)/.test(error),'WORLD_XI_SOURCE_FAULT_ASSERTION_KIND');
            assert(error.includes(marker+':'),'WORLD_XI_SOURCE_FAULT_OWNED_MARKER');assert(error.includes('worldXiNations.test.tsx:'),'WORLD_XI_SOURCE_FAULT_STACK');
            assert(!/TypeError|ReferenceError|SyntaxError|TestingLibraryElementError|TimeoutError|Test timed out|Failed to load|Cannot find module|Cannot find package/i.test(error),'WORLD_XI_SOURCE_FAULT_NOT_INFRASTRUCTURE');
           }
           return {targetTitle,marker,passed:1,ownedAssertionFailures:1};
          }
          const testArgs=(files,report)=>['node_modules/vitest/vitest.mjs','run',...files,'--no-cache','--maxWorkers=1','--no-file-parallelism','--reporter=verbose','--reporter=json','--outputFile='+output(report)];
          async function sourceFault(id,beforeText,afterText,targetTitle,marker){
           const target='src/lib/worldXiNationPools.ts',seed=regular(target),text=seed.toString();
           assert.equal(blob(seed),PINS[target]);assert.notEqual(beforeText,afterText);
           assert.equal(text.split(beforeText).length-1,1,'WORLD_XI_SOURCE_FAULT_UNIQUE');
           const offset=text.indexOf(beforeText),changed=Buffer.from(text.replace(beforeText,afterText));assert(!seed.equals(changed),'WORLD_XI_SOURCE_FAULT_CHANGED');
           const folder=path.join(OUT,'source-controls',id);fs.mkdirSync(folder,{recursive:true});
           for(const[name,b]of[['original.ts',seed],['changed.ts',changed]])fs.writeFileSync(path.join(folder,name),b,{flag:'wx'});
           save(id+'-source-map.json',{target,offsetUnits:'zero-based UTF16',beforePosition:offset,beforeUtf8Position:Buffer.byteLength(text.slice(0,offset)),before:beforeText,after:afterText,originalBytes:seed.length,originalSha256:sha(seed),changedBytes:changed.length,changedSha256:sha(changed),ownedMarker:marker,scope:'actual selected helper source changed, frozen actual page tests executed'});
           let result;
           try{
            fs.writeFileSync(target,changed);assert(regular(target).equals(changed));
            await run(id+'-fault',testArgs([TEST],id+'-fault.json'),1,240000);native(id+'-fault',1);
            result=pageFault(id+'-fault.json',targetTitle,marker);
           }finally{
            fs.writeFileSync(target,seed);assert(regular(target).equals(seed),'WORLD_XI_SOURCE_FAULT_RESTORED');
            fs.writeFileSync(path.join(folder,'restored.ts'),regular(target),{flag:'wx'});
            save(id+'-restored-source.json',{target,restored:regular(target).equals(seed),sha256:sha(regular(target)),gitBlob:blob(regular(target))});
           }
           await run(id+'-restored',testArgs([TEST],id+'-restored.json'),0,240000);native(id+'-restored',0);
           reportHealthy(id+'-restored.json',[{file:TEST,ancestor:NEW.ancestor,titles:NEW.cases.map(c=>c.title)}],2);
           sourceHold(id+'-restored',[]);
           return {...result,id,originalSha256:sha(seed),changedSha256:sha(changed),restored:true};
          }
          function assertLogs(ids){
           for(const id of ids){const logs=regular(output(id+'.stdout')).toString()+'\n'+regular(output(id+'.stderr')).toString();
            assert(!/Unhandled (?:Errors?|Rejection|Exception)|Error during collection|Failed to load url|Cannot find module|Cannot find package|Test timed out|worker exited unexpectedly/i.test(logs),'WORLD_XI_NO_RUNTIME_CREDIT');
           }
          }
