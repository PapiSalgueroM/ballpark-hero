          ]};
          const PURE={"file":"src/test/worldXiNationPools.test.ts","ancestor":"World XI nation pools","titles":["keeps Classic identity and the original draw RNG tape without drawing during selection","adds a one-keeper nation in Expanded and excludes empty buckets","derives the 2026 field from existing groups and returns the 48 canonical available keys","merges only the five known aliases and keeps North Korea and Congo separate","clones new-mode buckets without changing source rows and preserves namesakes and value ranking","draws and respins distinct fitting nations across all nine actual formations in both new modes","retains exact secondary-position coverage without turning wing-backs or keepers into front-line wings","refuses empty, under-eleven and uncovered pools without inventing a respin alternative"]};
          const sha=b=>createHash('sha256').update(b).digest('hex');
          const blob=b=>createHash('sha1').update(Buffer.from('blob '+b.length+'\0')).update(b).digest('hex');
          const output=name=>{assert.equal(path.basename(name),name);return path.join(OUT,name);};
          const write=(name,body)=>fs.writeFileSync(output(name),body,{flag:'wx'});
          const save=(name,value)=>write(name,JSON.stringify(value,null,2)+'\n');
          const json=name=>JSON.parse(fs.readFileSync(output(name),'utf8'));
          const git=args=>cp.execFileSync('git',args,{encoding:'utf8',maxBuffer:16*1024*1024}).trim();
          assert.notEqual(OUT,ROOT);assert(!OUT.startsWith(ROOT+path.sep));
          function regular(file){const s=fs.lstatSync(file);assert(s.isFile()&&!s.isSymbolicLink(),'WORLD_XI_REGULAR_FILE');return fs.readFileSync(file);}
