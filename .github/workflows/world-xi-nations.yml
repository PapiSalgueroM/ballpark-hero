           const r={id,command,args,startedAt:new Date().toISOString(),pid:null,status:null,signal:null,error:null,closed:false,deadlineMs,deadlineExpired:false,signalAttempts:[]};
           const child=cp.spawn(command,args,{cwd:ROOT,detached:true,stdio:['ignore',so,se],env:{...process.env,...extra,NODE_OPTIONS:'--require='+path.join(ROOT,'scripts/lib/offlineTransport.cjs')+(id==='caps'?' --require='+path.join(OUT,'caps-fonts.cjs'):''),SIM_OFFLINE_RECEIPT:receipt,SIM_NETWORK:'offline'}});
