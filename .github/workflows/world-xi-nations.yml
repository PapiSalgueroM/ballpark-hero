name: World XI final scoped feature verification
on:
  push:
    branches: [codex/world-xi-nations-20261025]
permissions:
  contents: read
concurrency:
  group: world-xi-nations-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 120
