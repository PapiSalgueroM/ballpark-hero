name: World XI scoped guide and search derivation
on:
  push:
    branches: [codex/world-xi-nations-20261025]
permissions:
  contents: read
concurrency:
  group: world-xi-nations-${{ github.ref }}
  cancel-in-progress: false
jobs:
  generation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: true
      SIM_NETWORK: offline
      WORLD_XI_PHASE: derived-generation
      EXPECTED_PARENT: 3557f83375d58acebd35f8317a172e69968a0946
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Bind the exact two-path input and all 5384 original source bodies
        id: foundation
        timeout-minutes: 5
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/world-xi-derived-generation"
          test ! -e "$out";test ! -L "$out";mkdir "$out"
          export WORLD_XI_OUT="$out";echo "WORLD_XI_OUT=$out" >> "$GITHUB_ENV"
          mkdir "$out/generator-temp"
          for name in TMPDIR TEMP TMP;do echo "$name=$out/generator-temp" >> "$GITHUB_ENV";done
          for name in NODE_OPTIONS NODE_PATH VITEST ONLY BROWSER PRERENDER_ONLY PRERENDER_CONTROL PRERENDER_PORT CHROME_PATH TYCOON_AWAY_CONTROL COMPLETION_HOOK OWNED_TIMEOUTS_HOOK CONQUEST_NBA_HOOK CONQUEST_NBA_BOARD POLL_FIXTURES US_BOARD_CONTROL_ALIAS US_BOARD_CONTROL_FILE DAILY_RECORD_CONTROL TYCOON_ROOMS_PAGE TYCOON_LOADS_STADIUM_HOOK TYCOON_LOADS_ACADEMY_HOOK TYCOON_LOADS_STADIUM_LIB TYCOON_LOADS_ACADEMY_LIB TYCOON_PITCH_COMPONENT TYCOON_PACKS_REWARDS TYCOON_PACKS_PANEL NO_DOUBLE_SWAP GUIDE_HEADINGS_CONTROL;do test ! -v "$name";done
          test "$WORLD_XI_PHASE" = derived-generation
          test "$GITHUB_REPOSITORY" = PapiSalgueroM/ballpark-hero
          test "$GITHUB_REPOSITORY_ID" = 1195729679
          test "$GITHUB_REF" = refs/heads/codex/world-xi-nations-20261025
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git show -s --format=%P HEAD)" = "$EXPECTED_PARENT"
          test "$(git rev-parse "$EXPECTED_PARENT^{tree}")" = 31278b8be62b8a14fe6ba7ba988210d5266af8f6
          git diff --name-status "$EXPECTED_PARENT" HEAD > "$out/direct-paths.txt"
          printf 'M\t.github/workflows/world-xi-nations.yml\nM\tscripts/qa/playWorldXiNationPools.mjs\n' | cmp - "$out/direct-paths.txt"
          git diff --exit-code "$EXPECTED_PARENT" HEAD -- . ':!.github/workflows/world-xi-nations.yml' ':!scripts/qa/playWorldXiNationPools.mjs' > "$out/other-parent-source-held.log"
          test "$(git ls-tree -r --name-only "$EXPECTED_PARENT" | wc -l)" -eq 5384
          git rev-parse HEAD > "$out/head.txt";git rev-parse 'HEAD^{tree}' > "$out/tree.txt"
          git ls-files -z | sort -z > "$out/source-members.before"
          test "$(tr -cd '\000' < "$out/source-members.before" | wc -c)" -eq 5384
          git ls-files -z | sort -z | xargs -0 sha256sum > "$out/source.sha256"
          git ls-files -z -- . ':!scripts/data/guideHeadingsFrozen.json' ':!src/data/searchKeywords.json' | sort -z | xargs -0 sha256sum > "$out/source-held.sha256"
          git diff --exit-code HEAD > "$out/source-clean-before.log"
          git status --porcelain --untracked-files=all > "$out/status-before.txt";test ! -s "$out/status-before.txt"
          git archive --format=tar HEAD > "$out/source.tar"
          printf 'e60ff1534307e449ccef598e3b7470dcba58681b82cea4005cec7319f14f9221  scripts/lib/offlineTransport.cjs\n' | sha256sum -c - > "$out/offline-guard-before.log"
          cat > "$out/world-xi-derived-generation.cjs" <<'HELPER'
          'use strict';
          const fs=require('node:fs'),path=require('node:path'),cp=require('node:child_process'),assert=require('node:assert/strict'),{createHash}=require('node:crypto');
          const ROOT=fs.realpathSync(process.cwd()),OUT=fs.realpathSync(process.env.WORLD_XI_OUT),SELF=fs.realpathSync(__filename);
          const PARENT='3557f83375d58acebd35f8317a172e69968a0946',TREE='31278b8be62b8a14fe6ba7ba988210d5266af8f6';
          const WF='.github/workflows/world-xi-nations.yml',DRIVER='scripts/qa/playWorldXiNationPools.mjs';
          const OUTPUTS=['scripts/data/guideHeadingsFrozen.json','src/data/searchKeywords.json'];
          const PINS={
            "scripts/simGuideHeadings.mjs": {
              "bytes": 30691,
              "sha256": "aceb7d2b481054cea5f1e0f4606ff749e33f33b21c882f0aaa7e113563da58c0",
              "gitBlob": "fa23f7e6ace62d8e71e3585ab6afbe4dbef0f674"
            },
            "scripts/genSearchKeywords.mjs": {
              "bytes": 10278,
              "sha256": "f76ff265e08218b2a80589710b434e382c7c63e45abcf3d94087e5c3fd04091c",
              "gitBlob": "d0a237a766215631a81d7cd6789f1fa632d3f9b7"
            },
            "scripts/lib/atomicWrite.mjs": {
              "bytes": 6039,
              "sha256": "c2f21d05e485543d8e96a157ef47ecddfd1645578bf88e71842a103dea82015c",
              "gitBlob": "0086680dfc663bb133d0a8c555180c7f6bc4a0a7"
            },
            "scripts/lib/offlineTransport.cjs": {
              "bytes": 10660,
              "sha256": "e60ff1534307e449ccef598e3b7470dcba58681b82cea4005cec7319f14f9221",
              "gitBlob": "0fda542a2649fe5da937c6976fd0f5b6073e74b6"
            },
            "src/data/gameContent/soccer1.ts": {
              "bytes": 75555,
              "sha256": "afaddfe354780899de903f962c8e6c7521f9e46b5c1dc83bad22316c1c4fa820",
              "gitBlob": "d5f515a80ac37ffbe35537b42a97d9b287d3ed61"
            },
            "src/data/gameContent/index.ts": {
              "bytes": 1317,
              "sha256": "8bc738a47f9ebc342cf9a920dc1174b3bdad387294a3e3d2da46a06196e1f972",
              "gitBlob": "623e72189c48f6e63c3f94fa3e39ac9272885a1d"
            },
            "src/data/gameContent/loader.ts": {
              "bytes": 8078,
              "sha256": "343ee0e6e021fc3f42d8af04ace9e45d79c0042873d73a4d8d0d067e0f4d19fc",
              "gitBlob": "e8c08240123d8bdce2d1948650cd3b363b04f291"
            },
            "src/data/gameContent/guideShape.ts": {
              "bytes": 1754,
              "sha256": "8727de51d35019670a7492a4da90b37920956e4b705d1ae431cc7d15437156fa",
              "gitBlob": "dd02ed74993aa32685a6c892450f7bcbeea8775e"
            },
            "src/data/gameContent/types.ts": {
              "bytes": 3858,
              "sha256": "167dbaa0baf8a53d3a5fcb8b5a083598da743e2000edb0eb8954d066259ece8f",
              "gitBlob": "caaf8efbe84614857e21ee0801417b65b17aec96"
            },
            "src/data/gameRegistry.ts": {
              "bytes": 33311,
              "sha256": "7f8724177e7672a737035f9cbdf53a11121609a4a497e6d5ecef172e41c8a3b4",
              "gitBlob": "2b408bc5b1b2127171519c9a1a5fb1f6b64262fb"
            },
            "src/components/seo/GameSeoContent.tsx": {
              "bytes": 19815,
              "sha256": "7a6939881bd1918d444ec1b2b72ed996bb596c598b313414add7bd2212a2c148",
              "gitBlob": "fee19761e67b5db603647eb500fbf8c57e15c542"
            },
            "scripts/data/guideHeadingsFrozen.json": {
              "bytes": 382659,
              "sha256": "b25435156532a88b3004c65abd3495b88204cc5f0e1d8b39933cd683eb169bd3",
              "gitBlob": "6e5362fa108d6ec4a5edfdb15dbd41ba63bffb10"
            },
            "src/data/searchKeywords.json": {
              "bytes": 10972,
              "sha256": "8e8a948dc11d613b90ee437fe10d6d635fedea941f6b2f5574395be4f91e0dea",
              "gitBlob": "35b36a36845bd4cc2e3ef2cae78def9ed3d6cb53"
            },
            "package.json": {
              "bytes": 3495,
              "sha256": "acfe14626dea53cf5f9c5e0286b766a22237656b52aac4c888b080873ac90e31",
              "gitBlob": "2ff64986fb76ebc51b706f2fd24765768874008a"
            },
            "package-lock.json": {
              "bytes": 309049,
              "sha256": "c7e3867eabf0bfa03a8aa6a5e601b0050b937ed210d48c6bbd241019e3c9ea76",
              "gitBlob": "97d6f12a052f25f400462938c241789a083f0bfe"
            },
            "scripts/qa/playWorldXiNationPools.mjs": {
              "bytes": 18327,
              "sha256": "5aabe968c9055d93baa3965345d3c4b48b3ece10f823d500407f6e7cedd9fbd0",
              "gitBlob": "6ce3e4bc5fd35fad7cf4d573aa6bc1a0b7d0906c"
            }
          };
          const ABOUT='Guide text generated before section conversion or explicitly refreshed after a verified gameplay or factual correction. scripts/simGuideHeadings.mjs section 1 requires each sentence exactly once in its original part. Use --freeze /route before conversion, or --refresh /route after a verified change to an existing converted guide. Never edit sentence entries by hand.';
          const sha=b=>createHash('sha256').update(b).digest('hex');
          const blob=b=>createHash('sha1').update(Buffer.from('blob '+b.length+'\0')).update(b).digest('hex');
          const file=name=>{assert.equal(path.basename(name),name);return path.join(OUT,name);};
          const write=(name,body)=>fs.writeFileSync(file(name),body,{flag:'wx'});
          const save=(name,value)=>write(name,JSON.stringify(value,null,2)+'\n');
          const json=name=>JSON.parse(fs.readFileSync(file(name),'utf8'));
          const git=args=>cp.execFileSync('git',args,{encoding:'utf8',maxBuffer:32*1024*1024}).trim();
          function regular(p){const s=fs.lstatSync(p);assert(s.isFile()&&!s.isSymbolicLink(),'WORLD_XI_DERIVED_REGULAR');return fs.readFileSync(p);}
          function meta(b){return{bytes:b.length,sha256:sha(b),gitBlob:blob(b)};}
          assert.notEqual(OUT,ROOT);assert(!OUT.startsWith(ROOT+path.sep));
          function sourceSnapshot(){return Object.fromEntries(git(['ls-files','-z']).split('\0').filter(Boolean).map(p=>[p,meta(regular(p))]));}
          function copyOutputs(label){
           const result={};
           for(const p of OUTPUTS){const b=regular(p),dest=path.join(OUT,label,p);fs.mkdirSync(path.dirname(dest),{recursive:true});fs.writeFileSync(dest,b,{flag:'wx'});assert.deepEqual(regular(dest),b);result[p]=meta(b);}
           save(label+'.json',result);return result;
          }
          function sourceHold(label){
           const before=json('all-source-before.json'),after=sourceSnapshot();
           assert.deepEqual(Object.keys(after),Object.keys(before),'WORLD_XI_DERIVED_SOURCE_MEMBERS');
           const changed=Object.keys(before).filter(p=>JSON.stringify(before[p])!==JSON.stringify(after[p]));
           assert(changed.every(p=>OUTPUTS.includes(p)),'WORLD_XI_DERIVED_ONLY_TWO_WRITES');
           const raw=cp.execFileSync('git',['status','--porcelain','--untracked-files=all'],{encoding:'utf8',maxBuffer:32*1024*1024});
           const lines=raw.trimEnd()?raw.trimEnd().split('\n'):[];
           assert(lines.every(line=>line.startsWith(' M ')&&OUTPUTS.includes(line.slice(3))),'WORLD_XI_DERIVED_DIRTY_STATUS');
           save(label+'-source-state.json',{source:process.env.GITHUB_SHA,changed,allowed:OUTPUTS,allOther5382BodiesHeld:true,current:after});
           return changed;
          }
          function source(){
           assert.equal(process.env.WORLD_XI_PHASE,'derived-generation');
           assert.equal(process.env.GITHUB_REPOSITORY,'PapiSalgueroM/ballpark-hero');
           assert.equal(process.env.GITHUB_REPOSITORY_ID,'1195729679');
           assert.equal(process.env.GITHUB_REF,'refs/heads/codex/world-xi-nations-20261025');
           assert.equal(git(['rev-parse','HEAD']),process.env.GITHUB_SHA);
           assert.equal(git(['show','-s','--format=%P','HEAD']),PARENT);
           assert.equal(git(['rev-parse',PARENT+'^{tree}']),TREE);
           const criticalSources={};
           for(const[p,want]of Object.entries(PINS)){const b=regular(p);assert.deepEqual(meta(b),want,'WORLD_XI_DERIVED_SOURCE_PIN');assert.equal(git(['rev-parse','HEAD:'+p]),want.gitBlob);criticalSources[p]=meta(b);}
           criticalSources[WF]=meta(regular(WF));assert.equal(criticalSources[WF].gitBlob,git(['rev-parse','HEAD:'+WF]));
           const all=sourceSnapshot();assert.equal(Object.keys(all).length,5384);save('all-source-before.json',all);
           const old=copyOutputs('generated-before');
           save('source-binding.json',{source:process.env.GITHUB_SHA,tree:git(['rev-parse','HEAD^{tree}']),parent:PARENT,parentTree:TREE,sourceBlobs:5384,parentBlobs:5384,directPaths:[WF,DRIVER],criticalSources,helper:meta(regular(SELF)),outputs:old,run:process.env.GITHUB_RUN_ID,attempt:process.env.GITHUB_RUN_ATTEMPT,phase:'derived-generation',browserRun:false,buildRun:false});
          }
          async function run(id,args){
           write(id+'.transport','');const receipt=file(id+'.transport');
           const so=fs.openSync(file(id+'.stdout'),'wx'),se=fs.openSync(file(id+'.stderr'),'wx');
           const r={id,command:process.execPath,args,cwd:ROOT,pid:null,status:null,signal:null,error:null,closed:false,startedAt:new Date().toISOString(),deadlineMs:300000,deadlineExpired:false,signalAttempts:[]};
           const c=cp.spawn(process.execPath,args,{cwd:ROOT,detached:true,stdio:['ignore',so,se],env:{...process.env,NODE_OPTIONS:'--require='+path.join(ROOT,'scripts/lib/offlineTransport.cjs'),SIM_NETWORK:'offline',SIM_OFFLINE_RECEIPT:receipt}});
           r.pid=c.pid??null;save(id+'.start.json',r);let term,kill;
           const signal=s=>{const a={signal:s,at:new Date().toISOString(),error:null};try{process.kill(-c.pid,s);}catch(e){a.error={name:e.name,code:e.code??null,message:e.message};}r.signalAttempts.push(a);};
           if(c.pid)term=setTimeout(()=>{r.deadlineExpired=true;signal('SIGTERM');kill=setTimeout(()=>{if(!r.closed)signal('SIGKILL');},15000);},300000);
           c.on('error',e=>r.error={name:e.name,message:e.message,code:e.code??null});
           await new Promise(resolve=>c.on('close',(code,s)=>{r.status=code;r.signal=s;r.closed=true;r.closedAt=new Date().toISOString();resolve();}));
           if(term)clearTimeout(term);if(kill)clearTimeout(kill);fs.closeSync(so);fs.closeSync(se);
           for(const s of ['stdout','stderr']){const b=regular(file(id+'.'+s));r[s+'Bytes']=b.length;r[s+'Sha256']=sha(b);}
           r.receiptBytes=regular(receipt).length;save(id+'.closed.json',r);return r;
          }
          function native(id,args){
           const r=json(id+'.closed.json');assert.equal(r.id,id);assert.equal(r.command,process.execPath);assert.deepEqual(r.args,args);
           assert(Number.isInteger(r.pid)&&r.pid>0,'WORLD_XI_DERIVED_PID');
           assert.equal(r.closed,true);assert.equal(r.status,0,'WORLD_XI_DERIVED_NATIVE');assert.equal(r.signal,null);assert.equal(r.error,null);assert.equal(r.deadlineExpired,false);assert.deepEqual(r.signalAttempts,[]);
           assert.equal(r.receiptBytes,0);assert.equal(regular(file(id+'.transport')).length,0);
           for(const s of ['stdout','stderr']){const b=regular(file(id+'.'+s));assert.equal(b.length,r[s+'Bytes']);assert.equal(sha(b),r[s+'Sha256']);}return r;
          }
          async function generate(){
           try{
            const r=await run('guide-refresh',['scripts/simGuideHeadings.mjs','--refresh','/world-xi']);copyOutputs('after-guide-refresh');sourceHold('after-guide-refresh');
            assert.equal(r.status,0,'WORLD_XI_GUIDE_REFRESH_NATIVE');assert.equal(r.error,null);assert.equal(r.signal,null);assert.equal(r.deadlineExpired,false);
            const s=await run('search-keywords',['scripts/genSearchKeywords.mjs']);copyOutputs('after-search-keywords');sourceHold('after-search-keywords');
            assert.equal(s.status,0,'WORLD_XI_SEARCH_GENERATOR_NATIVE');assert.equal(s.error,null);assert.equal(s.signal,null);assert.equal(s.deadlineExpired,false);
           }finally{copyOutputs('generation-partial');}
          }
          function readPair(dir){return OUTPUTS.map(p=>JSON.parse(regular(path.join(OUT,dir,p))));}
          function guideJudge(before,after){
           assert.deepEqual(Object.keys(after),Object.keys(before),'WORLD_XI_FROZEN_ROOT_KEYS');
           for(const k of Object.keys(before).filter(k=>k!=='routes'&&k!=='about'))assert.deepEqual(after[k],before[k],'WORLD_XI_FROZEN_ROOT_HELD');
           assert.equal(after.about,ABOUT,'WORLD_XI_FROZEN_NORMAL_ABOUT');
           assert.deepEqual(Object.keys(after.routes),Object.keys(before.routes),'WORLD_XI_FROZEN_ROUTE_KEYS');
           for(const route of Object.keys(before.routes).filter(r=>r!=='/world-xi'))assert.deepEqual(after.routes[route],before.routes[route],'WORLD_XI_FROZEN_OTHER_ROUTES');
           const was=before.routes['/world-xi'],now=after.routes['/world-xi'];
           assert.deepEqual(Object.keys(now),Object.keys(was),'WORLD_XI_FROZEN_PART_KEYS');
           assert.deepEqual(now.example,was.example,'WORLD_XI_FROZEN_WORLD_XI_EXAMPLE');
           for(const p of ['howToPlay','rules','tips']){assert(Array.isArray(now[p])&&now[p].length>0);assert.notDeepEqual(now[p],was[p],'WORLD_XI_FROZEN_REVIEWED_PART_CHANGE');}
           return{routes:Object.keys(after.routes).length,otherRoutesHeld:Object.keys(after.routes).length-1,changedParts:['howToPlay','rules','tips'],exampleHeld:true,aboutFromOriginalRefresh:true};
          }
          function contentHash(){const dir=path.join(ROOT,'src/data/gameContent');return createHash('sha256').update(fs.readdirSync(dir).sort().map(p=>regular(path.join(dir,p)).toString('utf8').replace(/\r\n/g,'\n')).join('\n')).digest('hex').slice(0,16);}
          function searchJudge(before,after){
           assert.deepEqual(Object.keys(after),['v','source','k'],'WORLD_XI_SEARCH_SCHEMA');assert.equal(after.v,1);
           assert.equal(after.source,contentHash(),'WORLD_XI_SEARCH_SOURCE');assert.notEqual(after.source,before.source,'WORLD_XI_SEARCH_SOURCE_CHANGED');
           assert(after.k&&typeof after.k==='object'&&!Array.isArray(after.k));
           const keys=Object.keys(after.k);assert.deepEqual(keys,[...keys].sort(),'WORLD_XI_SEARCH_SORTED_KEYS');assert.equal(typeof after.k['/world-xi'],'string');assert(after.k['/world-xi'].length>0);
           for(const [key,value]of Object.entries(after.k)){assert(key.startsWith('/'));assert.equal(typeof value,'string');assert(value.length>0);}
           return{source:after.source,keys:keys.length,addedKeys:keys.filter(k=>!(k in before.k)),removedKeys:Object.keys(before.k).filter(k=>!(k in after.k)),changedKeys:keys.filter(k=>after.k[k]!==before.k[k]),globalTfDfDerived:true,unrelatedKeywordIdentityRequired:false};
          }
          function judgePair(before,after){return{guide:guideJudge(before[0],after[0]),search:searchJudge(before[1],after[1])};}
          function physicalControls(before,after){
           const controls=[
            {id:'other-frozen-route',marker:'WORLD_XI_FROZEN_OTHER_ROUTES',change:pair=>{const r=Object.keys(pair[0].routes).find(r=>r!=='/world-xi'&&pair[0].routes[r].howToPlay?.length);assert(r);pair[0].routes[r].howToPlay[0]+=' [copied-record control]';}},
            {id:'world-xi-example',marker:'WORLD_XI_FROZEN_WORLD_XI_EXAMPLE',change:pair=>{assert(pair[0].routes['/world-xi'].example.length);pair[0].routes['/world-xi'].example[0]+=' [copied-record control]';}},
            {id:'search-source',marker:'WORLD_XI_SEARCH_SOURCE',change:pair=>{assert.notEqual(pair[1].source,before[1].source);pair[1].source=before[1].source;}}
           ];
           const rows=[];
           for(const c of controls){
            const base=path.join(OUT,'output-controls',c.id);fs.mkdirSync(base,{recursive:true});
            const evidence={id:c.id,marker:c.marker,kind:'copied-actual-generated-output-judge-only',roles:{}};
            for(const role of ['healthy','fault','restored']){
             const pair=structuredClone(after);if(role==='fault')c.change(pair);
             const dir=path.join(base,role);fs.mkdirSync(dir);
             const pins=[];
             for(let i=0;i<OUTPUTS.length;i++){const dest=path.join(dir,String(i)+'.json'),b=Buffer.from(JSON.stringify(pair[i])+'\n');fs.writeFileSync(dest,b,{flag:'wx'});pins.push(meta(regular(dest)));}
             const actual=[0,1].map(i=>JSON.parse(regular(path.join(dir,String(i)+'.json'))));let error=null;
             try{judgePair(before,actual);}catch(e){error={name:e.name,code:e.code??null,message:e.message,stack:e.stack};}
             evidence.roles[role]={pins,error};
             if(role==='fault'){assert(error&&error.name==='AssertionError'&&error.code==='ERR_ASSERTION'&&error.message.includes(c.marker),'WORLD_XI_OUTPUT_CONTROL_OWNED');}
             else assert.equal(error,null,'WORLD_XI_OUTPUT_CONTROL_HEALTHY');
            }
            const h=evidence.roles.healthy.pins,f=evidence.roles.fault.pins,r=evidence.roles.restored.pins;
            const changed=h.map((p,i)=>p.sha256!==f[i].sha256).filter(Boolean).length;assert.equal(changed,1,'WORLD_XI_OUTPUT_CONTROL_CHANGED');assert.deepEqual(r,h,'WORLD_XI_OUTPUT_CONTROL_RESTORED');
            evidence.changedPhysicalMembers=changed;evidence.fullRestore=true;save(c.id+'-control.json',evidence);rows.push(evidence);
           }return rows;
          }
          function final(){
           const commands=[native('guide-refresh',['scripts/simGuideHeadings.mjs','--refresh','/world-xi']),native('search-keywords',['scripts/genSearchKeywords.mjs'])];
           const before=readPair('generated-before'),after=readPair('generated-final'),judgment=judgePair(before,after);
           const refresh=regular(file('guide-refresh.stdout')).toString('utf8');assert(/^simGuideHeadings: refreshed \/world-xi from its actual guide \(howToPlay \d+, rules \d+, example \d+, tips \d+\)\s*$/.test(refresh),'WORLD_XI_REFRESH_FOOTER');
           const search=regular(file('search-keywords.stdout')).toString('utf8');assert(search.includes('guide source hash '+after[1].source),'WORLD_XI_SEARCH_FOOTER');
