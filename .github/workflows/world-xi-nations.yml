           assert.equal(process.env.GITHUB_REF,'refs/heads/codex/world-xi-nations-20261025');assert.equal(git(['rev-parse','HEAD']),process.env.GITHUB_SHA);assert.equal(git(['show','-s','--format=%P','HEAD']),PARENT);assert.equal(git(['rev-parse',PARENT+'^{tree}']),PARENT_TREE);
