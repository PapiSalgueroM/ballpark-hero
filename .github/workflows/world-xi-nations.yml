          set -euo pipefail
          out="$RUNNER_TEMP/world-xi-final"
          test ! -e "$out";test ! -L "$out";mkdir "$out"
          export WORLD_XI_OUT="$out";echo "WORLD_XI_OUT=$out" >> "$GITHUB_ENV"
          mkdir "$out/generator-temp"
          for name in TMPDIR TEMP TMP;do echo "$name=$out/generator-temp" >> "$GITHUB_ENV";done
          for name in NODE_OPTIONS NODE_PATH VITEST ONLY BROWSER PRERENDER_ONLY PRERENDER_CONTROL PRERENDER_PORT CHROME_PATH WORLD_XI_REPORT_CONTROL WORLD_XI_SEASON_CONTROL WXIPOS_CONTROL WXIDM_CONTROL WXIDM_PROJECT SWEEP_WEIGHT_CONTROL SWEEP_OFFLINE SWEEP_BASE BASE TYCOON_AWAY_CONTROL COMPLETION_HOOK OWNED_TIMEOUTS_HOOK CONQUEST_NBA_HOOK CONQUEST_NBA_BOARD POLL_FIXTURES US_BOARD_CONTROL_ALIAS US_BOARD_CONTROL_FILE DAILY_RECORD_CONTROL TYCOON_ROOMS_PAGE TYCOON_LOADS_STADIUM_HOOK TYCOON_LOADS_ACADEMY_HOOK TYCOON_LOADS_STADIUM_LIB TYCOON_LOADS_ACADEMY_LIB TYCOON_PITCH_COMPONENT TYCOON_PACKS_REWARDS TYCOON_PACKS_PANEL NO_DOUBLE_SWAP;do test ! -v "$name";done
          test "$WORLD_XI_PHASE" = final-verification
          test "$GITHUB_REPOSITORY" = PapiSalgueroM/ballpark-hero
          test "$GITHUB_REPOSITORY_ID" = 1195729679
          test "$GITHUB_REF" = refs/heads/codex/world-xi-nations-20261025
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git show -s --format=%P HEAD)" = "$EXPECTED_PARENT"
          test "$(git rev-parse "$EXPECTED_PARENT^{tree}")" = a431c8b9fb20abcc6bf444a1474d2c8a36005fe6
          git diff --name-status "$EXPECTED_PARENT" HEAD > "$out/direct-paths.txt"
          printf 'M\t.github/workflows/world-xi-nations.yml\nM\tdocs/PROJECT-STATE.md\nM\tdocs/superpowers/plans/2026-10-25-world-xi-nations.md\nM\tscripts/data/guideHeadingsFrozen.json\nM\tsrc/data/searchKeywords.json\n' | cmp - "$out/direct-paths.txt"
          git diff --exit-code "$EXPECTED_PARENT" HEAD -- . ':!.github/workflows/world-xi-nations.yml' ':!docs/PROJECT-STATE.md' ':!docs/superpowers/plans/2026-10-25-world-xi-nations.md' ':!scripts/data/guideHeadingsFrozen.json' ':!src/data/searchKeywords.json' > "$out/other-parent-source-held.log"
          test "$(git ls-tree -r --name-only "$EXPECTED_PARENT" | wc -l)" -eq 5384
          test "$(git rev-parse "$EXPECTED_PARENT:scripts/qa/playWorldXiNationPools.mjs")" = 6ce3e4bc5fd35fad7cf4d573aa6bc1a0b7d0906c
          git rev-parse HEAD > "$out/head.txt";git rev-parse 'HEAD^{tree}' > "$out/tree.txt"
          git ls-files -z | sort -z > "$out/source-members.before"
          test "$(tr -cd '\000' < "$out/source-members.before" | wc -c)" -eq 5384
          git ls-files -z | sort -z | xargs -0 sha256sum > "$out/source.sha256"
          git diff --exit-code HEAD > "$out/source-clean-before.log"
          git status --porcelain --untracked-files=all > "$out/status-before.txt";test ! -s "$out/status-before.txt"
          git archive --format=tar HEAD > "$out/source.tar"
