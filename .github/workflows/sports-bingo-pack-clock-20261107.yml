          assert.deepEqual([raw.status,raw.fixedHead,raw.fixedTree,raw.raw,raw.freshUnitRAWByteEqual],['passed',custody.fixed.head,custody.fixed.tree,unit.raw,true]);
          const nativeChecks=(()=>{
          const c=native.census;
          assert.deepEqual([c.journeys,c.contexts,c.viewportPNGs,c.manualBoundaries,c.ordinaryAutoTransitions,c.poolReads,c.completionAttempts],[3,3,6,3,3,3,0]);
          assert.deepEqual(native.measured.map(row=>[row.width,row.height]),[[320,568],[390,844],[1280,900]]);
          for(const key of ['frames','actions','wheels','navigations','clockAdvances','firstPartyResponses','corsPreflights']){
