name: Report Bingo control scope verification
on:
  push:
    branches: [codex/report-bingo-controls-20261101]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: '1'
      SIM_NETWORK: offline
      PLAYER_BINGO_RODRI_OUT: ${{ github.workspace }}/evidence/rodri
      PLAYER_BINGO_HONOURS_OUT: ${{ github.workspace }}/evidence/honours
      PLAYER_BINGO_PALMER_OUT: ${{ github.workspace }}/evidence/palmer
      PLAYER_BINGO_WC_OUT: ${{ github.workspace }}/evidence/world-cup
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Lock sources and dependencies
        run: |
          mkdir evidence
          git rev-parse HEAD | tee evidence/head.txt
          sha256sum package.json package-lock.json src/lib/playerBingo.ts src/lib/clubManager.ts src/components/soccer-career/DrillPlayers.tsx scripts/simPlayerBingoRodriHonour.mjs scripts/simPlayerBingoHonours.mjs scripts/simPlayerBingoPalmerRed.mjs > evidence/holds.txt
          npm ci
      - name: App types
        run: node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee evidence/types.log
      - name: All criterion outcomes with their effective source faults and restorations
        run: |
          failed=0
          for harness in simPlayerBingoRodriHonour simPlayerBingoHonours simPlayerBingoPalmerRed simPlayerBingoWorldCupAlias; do
            NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node "scripts/$harness.mjs" 2>&1 | tee "evidence/$harness.log" || failed=1
          done
          exit "$failed"
      - name: Source holds
        if: always()
        run: sha256sum --check evidence/holds.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bingo-control-scope-${{ github.run_id }}
          path: evidence/
          retention-days: 14
