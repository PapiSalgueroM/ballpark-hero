name: Soccer Career queued popularity choices

on:
  push:
    branches: [codex/career-pending-popularity-gates]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CI: '1'
      SIM_NETWORK: offline
      ENGINES: chromium
      CAREER_SEASON_LOCAL_ONLY: '1'
      SC_PENDING_POPULARITY_PHASE: baseline
      SC_PENDING_POPULARITY_OUT: ${{ github.workspace }}/pending-popularity-artifacts
      FREE_KICK_FONT_CACHE: ${{ github.workspace }}/pending-popularity-artifacts/font-cache
      PRERENDER_ONLY: /soccer-career
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Bind source and locked dependencies
        run: |
          echo '127.0.0.1 flawuiqbvjobmkfkauhw.supabase.co' | sudo tee -a /etc/hosts
          mkdir -p "$SC_PENDING_POPULARITY_OUT"
          git rev-parse HEAD > "$SC_PENDING_POPULARITY_OUT/source-head.txt"
          git status --porcelain --untracked-files=no > "$SC_PENDING_POPULARITY_OUT/source-before.txt"
          test ! -s "$SC_PENDING_POPULARITY_OUT/source-before.txt"
          git diff --exit-code d4f2c6f688d656205722ba52bbdb33f03490966a -- src scripts package.json package-lock.json bun.lock ':!src/lib/soccerCareerLife.ts' ':!src/test/careerPendingPopularityGates.test.ts' ':!scripts/simCareerPendingPopularityGates.mjs'
          if test "$SC_PENDING_POPULARITY_PHASE" = baseline; then
            git diff --exit-code d4f2c6f688d656205722ba52bbdb33f03490966a -- src/lib/soccerCareerLife.ts
          fi
          find src scripts .github/workflows -type f ! -path scripts/data/lastmod.json -print0 | sort -z | xargs -0 sha256sum > "$SC_PENDING_POPULARITY_OUT/source-hashes.txt"
          sha256sum package.json package-lock.json bun.lock > "$SC_PENDING_POPULARITY_OUT/package-hashes.txt"
          npm ci
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const lock = JSON.parse(fs.readFileSync('package-lock.json'));
          const installed = Object.entries(lock.packages).filter(([p]) => p.startsWith('node_modules/') && fs.existsSync(p + '/package.json')).map(([p, entry]) => {
            const version = JSON.parse(fs.readFileSync(p + '/package.json')).version;
            assert.equal(version, entry.version, p); return { path: p, version };
          });
          assert.equal(installed.length, 521);
          fs.writeFileSync(process.env.SC_PENDING_POPULARITY_OUT + '/installed.json', JSON.stringify(installed, null, 2));
          console.log(`Bound ${installed.length} installed locked versions.`);
          NODE
      - name: Actual application type gate
        run: node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee "$SC_PENDING_POPULARITY_OUT/types.log"
      - name: Exact queued-choice baseline or fixed outcomes
        run: NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/simCareerPendingPopularityGates.mjs 2>&1 | tee "$SC_PENDING_POPULARITY_OUT/$SC_PENDING_POPULARITY_PHASE.log"
      - name: Original source control and full restoration
        if: env.SC_PENDING_POPULARITY_PHASE == 'fixed'
        run: |
          SC_PENDING_POPULARITY_CONTROL=original NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/simCareerPendingPopularityGates.mjs 2>&1 | tee "$SC_PENDING_POPULARITY_OUT/original.log"
          SC_PENDING_POPULARITY_RESTORED=1 NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/simCareerPendingPopularityGates.mjs 2>&1 | tee "$SC_PENDING_POPULARITY_OUT/restored.log"
      - name: Existing saved-choice and followup outcomes
        run: |
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node node_modules/vitest/vitest.mjs run src/test/soccerCareerPendingLife.test.ts src/test/soccerCareerLifeReviews.test.ts src/test/soccerLifeChainPackedSave.test.ts --maxWorkers=1 --reporter=verbose --reporter=json --outputFile.json="$SC_PENDING_POPULARITY_OUT/prior-units.json" 2>&1 | tee "$SC_PENDING_POPULARITY_OUT/prior-units.log"
      - name: Build tools
        if: env.SC_PENDING_POPULARITY_PHASE == 'fixed'
        run: |
          npm install --prefix "$RUNNER_TEMP/popularity-build" --no-save --package-lock=false playwright@1.64.0
          ln -s "$RUNNER_TEMP/popularity-build/node_modules/playwright" node_modules/playwright
          ln -s "$RUNNER_TEMP/popularity-build/node_modules/playwright-core" node_modules/playwright-core
          node "$RUNNER_TEMP/popularity-build/node_modules/playwright/cli.js" install --with-deps chromium
          python -m pip install fonttools pillow
          node scripts/qa/freeKickLab1070.mjs --prefetch-fonts-only 2>&1 | tee "$SC_PENDING_POPULARITY_OUT/fonts.log"
      - name: Complete build and all rebuilt-site readers
        if: env.SC_PENDING_POPULARITY_PHASE == 'fixed'
        run: |
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" npm run build:seo 2>&1 | tee "$SC_PENDING_POPULARITY_OUT/build.log"
          cp scripts/data/lastmod.json "$SC_PENDING_POPULARITY_OUT/build-lastmod.json"
          git diff -- scripts/data/lastmod.json > "$SC_PENDING_POPULARITY_OUT/build-lastmod.diff"
          ONLY=simAdsense,simBrand,simHeadTags,simHiddenPages,simHubs,simIndexNow,simIndexing,simInternalLinks,simNoRivalNames,simPrerender,simPrerenderBoot,simRetiredRoutes,simSchema,simSitemap,simSnapshotAssets node scripts/runAllSims.mjs --browser 2>&1 | tee "$SC_PENDING_POPULARITY_OUT/readers.log"
      - name: Final source and dependency holds
        if: always()
        run: |
          sha256sum --check "$SC_PENDING_POPULARITY_OUT/source-hashes.txt" > "$SC_PENDING_POPULARITY_OUT/source-holds.log"
          sha256sum --check "$SC_PENDING_POPULARITY_OUT/package-hashes.txt"
          git diff --exit-code -- src scripts ':!scripts/data/lastmod.json' package.json package-lock.json bun.lock .github/workflows
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const installed = JSON.parse(fs.readFileSync(process.env.SC_PENDING_POPULARITY_OUT + '/installed.json'));
          for (const row of installed) assert.equal(JSON.parse(fs.readFileSync(row.path + '/package.json')).version, row.version, row.path);
          console.log(`Held ${installed.length} installed locked versions.`);
          NODE
      - name: Retain complete evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pending-popularity-${{ github.run_id }}
          path: pending-popularity-artifacts/
          retention-days: 14
          if-no-files-found: error
