      - name: Every saved-output reader search guide and unchanged full page caps
        run: |
          set -euo pipefail
          out="$WORLD_XI_OUT"; source "$out/capture.sh"
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs --require=$out/cached-fonts.cjs"
          node scripts/lib/hostLikeServer.mjs dist 4173 > "$out/server.log" 2>&1 &
          server=$!; trap 'kill "$server" 2>/dev/null || true' EXIT
          ready=0; for attempt in 1 2 3 4 5; do if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then ready=1; break; fi; sleep 1; done; test "$ready" -eq 1
          failed=0
          for reader in simAdsense simBrand simHeadTags simHiddenPages simHubs simIndexNow simIndexing simInternalLinks simNoRivalNames simPrerender simPrerenderBoot simRetiredRoutes simSchema simSitemap simSnapshotAssets simSiteSearch simGuideHeadings; do
            status=0; capture "$reader" env BASE=http://127.0.0.1:4173 SWEEP_BASE=http://127.0.0.1:4173 node "scripts/$reader.mjs" || status=$?
            printf '%s\t%s\n' "$reader" "$status" >> "$out/readers.tsv"; test "$status" -eq 0 || failed=1
          done
          test "$(wc -l < "$out/readers.tsv")" -eq 17
          capture caps-count node --input-type=module <<'CAPS'
          import fs from 'node:fs';import assert from 'node:assert/strict';import{createHash}from'node:crypto';
          const body=fs.readFileSync('scripts/sweepWeight.mjs','utf8'),code=body.replace(/\/\*[\s\S]*?\*\//g,'').replace(/(^|\n)\s*\/\/[^\n]*/g,'$1');
          const start=code.indexOf('const BUDGETS = [');assert(start>=0);const end=code.indexOf('];',start);assert(end>start);
          const budgets=[...code.slice(start,end+2).matchAll(/\[\s*(['"])(\/[^'"]*)\1\s*,\s*(\d+)\s*\]/g)].map(match=>({route:match[2],cap:Number(match[3])}));
          assert.equal(budgets.length,16);assert.equal(new Set(budgets.map(row=>row.route)).size,16);
          fs.writeFileSync(process.env.WORLD_XI_OUT+'/caps16.json',JSON.stringify({sourceSha256:createHash('sha256').update(body).digest('hex'),budgetCount:16,budgets},null,2));
          console.log('WORLD_CAPS: all16 unchanged executable budget rows required.');
          CAPS
          status=0; capture all-page-caps env BASE=http://127.0.0.1:4173 SWEEP_BASE=http://127.0.0.1:4173 SWEEP_OFFLINE=1 node scripts/sweepWeight.mjs || status=$?
          test "$status" -eq 0 || failed=1
          test ! -s "$out/font-cache-misses.jsonl" || failed=1
          test -s "$out/font-cache-use.jsonl" || failed=1
          exit "$failed"
      - name: Always retain generated differences and enforce all immutable sources
        if: always()
        run: |
          set -euo pipefail
          out="$WORLD_XI_OUT"
          git diff --binary HEAD > "$out/final-generated.patch"
          git diff --name-status HEAD > "$out/final-changed-paths.txt"
          for file in public/world-xi/index.html public/sitemap.xml scripts/data/lastmod.json src/data/searchKeywords.json scripts/data/guideHeadingsFrozen.json; do
            if test -f "$file"; then mkdir -p "$out/final-generated/$(dirname "$file")"; cp "$file" "$out/final-generated/$file"; sha256sum "$file" >> "$out/final-generated.sha256"; fi
          done
          sha256sum -c "$out/immutable-source.sha256" > "$out/source-hold.log"
          git ls-files -z > "$out/source-members.after"; cmp "$out/source-members.before" "$out/source-members.after"
          git ls-files --others --exclude-standard > "$out/untracked.txt"; test ! -s "$out/untracked.txt"
