name: SC4 unchanged practice first-stop attribution
on:
  push:
    branches: [codex/sc4-practice-baseline-20261105]
permissions:
  contents: read
concurrency:
  group: sc4-practice-attribution-${{ github.ref }}
  cancel-in-progress: false
env:
  CI: '1'
  TZ: UTC
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 4
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Pin unchanged actors and hydrate exact original App bodies
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/sc4-practice-attribution"
          test ! -e "$OUT"
          mkdir -p "$OUT/logs" "$OUT/arms" "$OUT/font-cache"
          printf 'QA_OUT=%s\n' "$OUT" >> "$GITHUB_ENV"
          printf 'CAREER_PRACTICE_FONT_CACHE=%s/font-cache\n' "$OUT" >> "$GITHUB_ENV"
          export QA_OUT="$OUT"
          node --input-type=module <<'PREFLIGHT'
          import assert from 'node:assert/strict';import fs from 'node:fs';import crypto from 'node:crypto';import {spawnSync} from 'node:child_process';
          const out=process.env.QA_OUT, app=[{"path":"src/lib/soccerHistoricalArrivals.ts","before":"fce537f31d51a8de78a170c57808b8d233fa54b1","after":"c57d5048ffbce45c33051873e799a7e79dcdc561"},{"path":"src/lib/soccerPhone.ts","before":"cee38fc40914dad6989c66c66b29fae88203d1c8","after":"e01df0bf20e7813830eebe298c8c792b3992c078"},{"path":"src/components/soccer-career/PhonePanel.tsx","before":"736bdf5a1b07ca83a30b1487f81cce52dd8208bb","after":"3f9a00c0ecb06fc15a820e8d6588097f7692baac"},{"path":"src/pages/SoccerCareer.tsx","before":"f0d77f964522f4fb86ac0cb9543b7cd06f08a9ab","after":"c9cd18a50659023f0c8fab6f47a6bf86b650860f"}], wf='.github/workflows/sc4-practice-baseline-20261105.yml';
          const sha=b=>crypto.createHash('sha256').update(b).digest('hex');
          const blob=b=>crypto.createHash('sha1').update(Buffer.from('blob '+b.length+'\0')).update(b).digest('hex');
          const git=(...args)=>{const r=spawnSync('git',args,{encoding:'utf8'});assert.equal(r.status,0,r.stderr);return r.stdout.trimEnd();};
          assert.equal(git('rev-parse','HEAD^'),'a9e56ff706ea71a51d3ec60438023ed9ad4d3b01');
          assert.equal(git('rev-parse','HEAD^^{tree}'),'316d2084d15d5e24aff38e5a692b639432b3eb98');
          assert.equal(git('diff','--name-status','HEAD^','HEAD'),'A\t'+wf);
          assert.equal(git('rev-parse','HEAD^^'),'1acb33005073be70ba5aae0285ece5537f390f9a');
          assert.deepEqual(git('diff','--name-only','HEAD^^','HEAD^').split('\n').sort(),app.map(r=>r.path).sort());
          assert.equal(git('status','--porcelain=v1','--untracked-files=all'),'');
          const pins={
           'scripts/qa/careerPractice1076.mjs':'f3e191736122e782326550ee6507f313ed63e01f',
           'scripts/lib/playwrightLoader.mjs':'4f7739e217e0a47ee82e6bfc8be1c04bed17454a',
           'scripts/lib/offlineTransport.cjs':'0fda542a2649fe5da937c6976fd0f5b6073e74b6',
           'src/components/soccer-career/TrainingPanel.tsx':'c98cb31af7d9d4298b78ffe908b26d3bbec89906',
           'src/lib/soccerCareerEngine.ts':'40edcc5051d9b4a369698ea3572eb9e8e3314f26',
           'package.json':'2ff64986fb76ebc51b706f2fd24765768874008a',
           'package-lock.json':'97d6f12a052f25f400462938c241789a083f0bfe',
           'tsconfig.app.json':'51f581dd91641b4c1f1219f646788e73cf6bf00c',
          };
          for(const [p,h] of Object.entries(pins))assert.equal(blob(fs.readFileSync(p)),h,p);
          fs.mkdirSync(out+'/source-bodies',{recursive:true});
          const rows=app.map((r,i)=>{
           const b=spawnSync('git',['show','1acb33005073be70ba5aae0285ece5537f390f9a:'+r.path],{maxBuffer:2*1024*1024});assert.equal(b.status,0,String(b.stderr));assert.equal(blob(b.stdout),r.before);
           const current=fs.readFileSync(r.path);assert.equal(blob(current),r.after);
           fs.writeFileSync(out+'/source-bodies/original-'+i,b.stdout);fs.writeFileSync(out+'/source-bodies/current-'+i,current);
           return {...r,originalBytes:b.stdout.length,originalSHA256:sha(b.stdout),currentBytes:current.length,currentSHA256:sha(current)};
          });
          fs.writeFileSync(out+'/app-bridge.json',JSON.stringify(rows,null,2)+'\n');
          fs.writeFileSync(out+'/source-role.json',JSON.stringify({head:git('rev-parse','HEAD'),tree:git('rev-parse','HEAD^{tree}'),product:'a9e56ff706ea71a51d3ec60438023ed9ad4d3b01',original:'1acb33005073be70ba5aae0285ece5537f390f9a',onlyQAPath:wf,pins,onlineFourBodyHydration:rows},null,2)+'\n');
          PREFLIGHT
      - name: Install held app dependencies and one shared browser tool
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund > "$QA_OUT/logs/npm-ci.stdout" 2> "$QA_OUT/logs/npm-ci.stderr"
          git diff --exit-code HEAD -- package.json package-lock.json bun.lock bun.lockb
          npm install --prefix "$RUNNER_TEMP/sc4-practice-tools" --package-lock=false --no-audit --no-fund playwright@1.64.0 > "$QA_OUT/logs/playwright-install.log" 2>&1
          test ! -e node_modules/playwright
          test ! -e node_modules/playwright-core
          ln -s "$RUNNER_TEMP/sc4-practice-tools/node_modules/playwright" node_modules/playwright
          ln -s "$RUNNER_TEMP/sc4-practice-tools/node_modules/playwright-core" node_modules/playwright-core
          "$RUNNER_TEMP/sc4-practice-tools/node_modules/.bin/playwright" install --with-deps chromium > "$QA_OUT/logs/chromium-install.log" 2>&1
          node -p 'JSON.stringify({node:process.version,playwright:require("playwright/package.json").version,vite:require("vite/package.json").version})' > "$QA_OUT/installed-versions.json"
          node scripts/qa/careerPractice1076.mjs --prefetch-fonts-only > "$QA_OUT/logs/declared-font-prefetch.stdout" 2> "$QA_OUT/logs/declared-font-prefetch.stderr"
      - name: Replay the complete unchanged actor on original then candidate
        run: |
          set -euo pipefail
          export GIT_NO_LAZY_FETCH=1
          cat > "$RUNNER_TEMP/sc4-practice-attribution.mjs" <<'CONTROLLER'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import { spawnSync } from 'node:child_process';
          const root=process.cwd(), out=process.env.QA_OUT, cache=process.env.CAREER_PRACTICE_FONT_CACHE;
          const app=JSON.parse(fs.readFileSync(out+'/app-bridge.json','utf8'));
          const sha=b=>crypto.createHash('sha256').update(b).digest('hex');
          const blob=b=>crypto.createHash('sha1').update(Buffer.from('blob '+b.length+'\0')).update(b).digest('hex');
          const write=(p,v)=>fs.writeFileSync(p,JSON.stringify(v,null,2)+'\n');
          const git=(...args)=>{const r=spawnSync('git',args,{encoding:'utf8',env:{...process.env,GIT_NO_LAZY_FETCH:'1'}});assert.equal(r.status,0,'local Git '+args.join(' ')+': '+r.stderr);return r.stdout;};
          const paths=git('ls-files','-z').split('\0').filter(Boolean);
          const index=git('ls-files','-s'), status=git('status','--porcelain=v1','--untracked-files=all');
          assert.equal(status,'','SC4_PRACTICE_SETUP clean current source');
          const original=Object.fromEntries(app.map((row,i)=>[row.path,fs.readFileSync(out+'/source-bodies/original-'+i)]));
          const current=Object.fromEntries(app.map(row=>[row.path,fs.readFileSync(row.path)]));
          const inventory=()=>Object.fromEntries(paths.map(p=>[p,{bytes:fs.statSync(p).size,sha256:sha(fs.readFileSync(p))}]));
          const before=inventory(), locks=['package.json','package-lock.json','bun.lock','bun.lockb'].filter(p=>fs.existsSync(p));
          write(out+'/source-before.json',before); fs.writeFileSync(out+'/index-before.txt',index); fs.writeFileSync(out+'/status-before.txt',status);
          write(out+'/locks-before.json',Object.fromEntries(locks.map(p=>[p,before[p]])));
          const fontNames=fs.readdirSync(cache).sort(), fonts=Object.fromEntries(fontNames.map(p=>[p,sha(fs.readFileSync(cache+'/'+p))]));
          write(out+'/font-cache-before.json',fonts);
          const owned=path.join(root,'career-practice-lifecycle-artifacts');
          assert(!fs.existsSync(owned),'SC4_PRACTICE_SETUP helper output does not preexist');
          function sourceHeld(expected) {
            const actual=inventory();
            for(const p of paths) assert.deepEqual(actual[p],expected[p],'SC4_PRACTICE_SOURCE '+p);
            assert.equal(git('ls-files','-s'),index,'SC4_PRACTICE_INDEX');
            assert.equal(git('ls-files','-z'),paths.join('\0')+'\0','SC4_PRACTICE_PATHS');
            return actual;
          }
          function inspect(report, stderr, exit) {
            assert.equal(exit,1,'SC4_PRACTICE_EXPECTED_RED native exit');
            assert.equal(report.cases.length,1,'SC4_PRACTICE_EXPECTED_RED first actual case');
            const r=report.cases[0];
            assert.equal(r.id,'soccer-320-touch-dark');
            assert.deepEqual(r.profile,{width:320,height:780,touch:true,reduced:true,theme:'dark'});
            assert.equal(r.sport,'soccer');
            assert.match(r.failure,/^AssertionError \[ERR_ASSERTION\]: Banked session cannot be played and banked twice/m,'SC4_PRACTICE_BANKED_ASSERTION');
            assert.match(r.failure,/\b1 !== 0\b/,'SC4_PRACTICE_BANKED_COUNT');
            assert.match(r.failure,/careerPractice1076\.mjs:309:14/,'SC4_PRACTICE_BANKED_ACTOR');
            assert.match(stderr,/Banked session cannot be played and banked twice/);
            assert.deepEqual(r.errors,[],'SC4_PRACTICE_NO_PAGE_ERROR');
            assert.deepEqual(r.assetErrors,[],'SC4_PRACTICE_NO_ASSET_ERROR');
            assert.deepEqual(r.bank.callbacks,[{drill:'pace',score:80}],'SC4_PRACTICE_ONE_CALLBACK');
            assert.deepEqual(r.proof.callbacks,r.bank.callbacks,'SC4_PRACTICE_ONE_CALLBACK');
            for(const c of [r.proof.initial,r.proof.current]) {
              assert.equal(c.seasons[0].year,2026,'SC4_PRACTICE_UNMARKED_2026');
              assert(!Object.hasOwn(c,'historicalArrivals'),'SC4_PRACTICE_UNMARKED_2026');
            }
            assert.equal(r.proof.initial.playerName,'Native Practice');
            assert.equal(r.storageWrites.length,0);
            assert.deepEqual(r.writes,[]);
            assert(r.events.some(e=>e.type==='pointerdown'&&e.trusted),'SC4_PRACTICE_TRUSTED_ACTOR');
            assert.equal(report.forwardedWrites,0);
            assert.notEqual(report.passed,true);
            assert.equal(report.sourceAfter,undefined,'Expected early stop is not whole helper success');
            return {case:r.id,profile:r.profile,bankCallbacks:r.bank.callbacks,initialYear:r.proof.initial.seasons[0].year,unmarked:true,failure:r.failure,panelText:r.text,storedWrites:r.writes,wholeSuiteGreen:false};
          }
          const closing={status:'running',meaning:'Unchanged legacy practice actor attribution only. Expected native 1 remains a red practice assertion.',arms:[],error:null};
          write(out+'/diagnostic.json',closing);
          let failed;
          try {
            for(const role of ['original','candidate']) {
              const dir=out+'/arms/'+role; fs.mkdirSync(dir,{recursive:true});
              const bodies=role==='original'?original:current;
              for(const row of app) {fs.writeFileSync(row.path,bodies[row.path]);assert.equal(blob(fs.readFileSync(row.path)),row[role==='original'?'before':'after']);}
              const expected=structuredClone(before);
              for(const row of app) expected[row.path]={bytes:bodies[row.path].length,sha256:sha(bodies[row.path])};
              sourceHeld(expected);
              write(dir+'/source-before.json',inventory());
              const run=(name,cmd,args,timeout)=>{
                const receipt=dir+'/'+name+'-transport.log';fs.writeFileSync(receipt,'');
                const stdout=fs.openSync(dir+'/'+name+'.stdout','w'),stderr=fs.openSync(dir+'/'+name+'.stderr','w');
                let r;
                try {r=spawnSync(cmd,args,{cwd:root,env:{...process.env,SIM_NETWORK:'offline',SIM_OFFLINE_RECEIPT:receipt,GIT_NO_LAZY_FETCH:'1',NODE_OPTIONS:'--require='+root+'/scripts/lib/offlineTransport.cjs'},stdio:['ignore',stdout,stderr],timeout});}
                finally {fs.closeSync(stdout);fs.closeSync(stderr);}
                write(dir+'/'+name+'-native.json',{command:[cmd,...args],exit:r.status,signal:r.signal,error:r.error?String(r.error):null});
                assert(!r.error&&!r.signal,'SC4_PRACTICE_NATIVE completed '+name);
                assert.equal(fs.statSync(receipt).size,0,'SC4_PRACTICE_SILENT '+name);
                return r.status;
              };
              assert.equal(run('types','node_modules/.bin/tsc',['--noEmit','-p','tsconfig.app.json'],180000),0,'SC4_PRACTICE_TYPES');
              assert(!fs.existsSync(owned));
              const nativeExit=run('native','xvfb-run',['-a','node','scripts/qa/careerPractice1076.mjs'],600000);
              assert(fs.statSync(owned).isDirectory()&&!fs.lstatSync(owned).isSymbolicLink());
              fs.cpSync(owned,dir+'/complete-helper-output',{recursive:true,errorOnExist:true,force:false});
              const walk=(base,leaf='')=>fs.readdirSync(path.join(base,leaf),{withFileTypes:true}).sort((a,b)=>a.name.localeCompare(b.name)).flatMap(e=>{
                const p=leaf?leaf+'/'+e.name:e.name;assert(!e.isSymbolicLink());
                return e.isDirectory()?walk(base,p):[{path:p,bytes:fs.statSync(path.join(base,p)).size,sha256:sha(fs.readFileSync(path.join(base,p)))}];
              });
              const ownedRows=walk(owned),retainedRows=walk(dir+'/complete-helper-output');
              assert.deepEqual(retainedRows,ownedRows,'Complete helper output copy exact');
              write(dir+'/helper-output-inventory.json',retainedRows);
              const report=JSON.parse(fs.readFileSync(dir+'/complete-helper-output/native/report.json','utf8'));
              assert.equal(owned,path.join(root,'career-practice-lifecycle-artifacts'));
              fs.rmSync(owned,{recursive:true});
              sourceHeld(expected);
              assert.deepEqual(report.sourceBefore,Object.fromEntries(Object.keys(report.sourceBefore).map(p=>[p,expected[p].sha256])));
              const result=inspect(report,fs.readFileSync(dir+'/native.stderr','utf8'),nativeExit);
              write(dir+'/closing.json',result);
              const copy=structuredClone(report),whole=JSON.stringify(copy),removed=copy.cases[0].bank.callbacks.pop();
              assert(removed&&JSON.stringify(copy)!==whole);
              let caught;
              try{inspect(copy,fs.readFileSync(dir+'/native.stderr','utf8'),nativeExit);}catch(e){caught=e;}
              assert(caught instanceof assert.AssertionError&&String(caught).includes('SC4_PRACTICE_ONE_CALLBACK'));
              copy.cases[0].bank.callbacks.push(removed);assert.equal(JSON.stringify(copy),whole);inspect(copy,fs.readFileSync(dir+'/native.stderr','utf8'),nativeExit);
              write(dir+'/actual-copy-control.json',{removedActualCallback:removed,changed:true,rejectedMarker:'SC4_PRACTICE_ONE_CALLBACK',wholeInverseExact:true});
              closing.arms.push({role,nativeExit,result,completeOutput:retainedRows});write(out+'/diagnostic.json',closing);
            }
            assert.deepEqual(closing.arms[0].result.bankCallbacks,closing.arms[1].result.bankCallbacks);
            assert.equal(closing.arms[0].result.failure,closing.arms[1].result.failure,'Same literal assertion and unchanged actor stack');
            closing.status='same-unchanged-assertion-reproduced';
            closing.interpretation='Both original and candidate unmarked 2026 actors reached the same stale button-disappearance assertion with one bank callback. This attributes this measured first stop only; the practice suite remains red. Full natural-RNG saved states are retained without asserting cross-arm equality.';
          } catch(e) {failed=e;closing.status='unclassified-or-different-result';closing.error=String(e.stack||e);}
          finally {
            for(const row of app) fs.writeFileSync(row.path,current[row.path]);
            try {
              if(fs.existsSync(owned)) {
                assert.equal(owned,path.join(root,'career-practice-lifecycle-artifacts'));
                assert(!fs.lstatSync(owned).isSymbolicLink());
                fs.cpSync(owned,out+'/failed-helper-output',{recursive:true,errorOnExist:true,force:false});
                fs.rmSync(owned,{recursive:true});
              }
              sourceHeld(before);assert.equal(git('status','--porcelain=v1','--untracked-files=all'),status);
              assert.deepEqual(fs.readdirSync(cache).sort(),fontNames);
              assert.deepEqual(Object.fromEntries(fontNames.map(p=>[p,sha(fs.readFileSync(cache+'/'+p))])),fonts);
              write(out+'/source-after.json',inventory());fs.writeFileSync(out+'/index-after.txt',git('ls-files','-s'));fs.writeFileSync(out+'/status-after.txt',git('status','--porcelain=v1','--untracked-files=all'));
              write(out+'/locks-after.json',Object.fromEntries(locks.map(p=>[p,before[p]])));
              write(out+'/source-hold.json',{allTrackedBytes:true,index:true,paths:true,locks:true,statusClean:true,exactFourAppForwardInverse:true,fontCacheHeld:true});
            } catch(e) {failed=failed||e;closing.holdError=String(e.stack||e);}
            write(out+'/diagnostic.json',closing);
          }
          if(failed)throw failed;
          console.log('DIAGNOSTIC ONLY: original and candidate reproduce the same unchanged 320 soccer Banked assertion; no green practice-suite claim.');
          
          CONTROLLER
          set +e
          node "$RUNNER_TEMP/sc4-practice-attribution.mjs" > "$QA_OUT/logs/controller.stdout" 2> "$QA_OUT/logs/controller.stderr"
          native_exit=$?
          printf '%s\n' "$native_exit" > "$QA_OUT/controller.exit" || exit 1
          exit "$native_exit"
      - name: Retain bounded complete evidence and honest fatal diagnostics
        if: always()
        id: pack
        run: |
          set -euo pipefail
          test -d "$QA_OUT"
          archive="$RUNNER_TEMP/sc4-practice-complete.tar.gz"
          diagnostic="$RUNNER_TEMP/sc4-practice-diagnostic.tar.gz"
          set +e
          tar -czf "$archive" -C "$QA_OUT" . > "$RUNNER_TEMP/sc4-practice-pack.log" 2>&1
          packed=$?
          set -e
          cp "$RUNNER_TEMP/sc4-practice-pack.log" "$QA_OUT/pack.log"
          printf '%s\n' "$packed" > "$QA_OUT/pack.exit"
          if test "$packed" -eq 0 && test "$(stat -c%s "$archive")" -le 50000000; then
            sha256sum "$archive" > "$archive.sha256"
            printf 'archive=%s\n' "$archive" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' 'NO_FULL_PROOF: complete retention failed or exceeded the unchanged 50 MB bound.' > "$QA_OUT/NO_FULL_PROOF.txt"
            tar --exclude='*.png' --exclude='./font-cache/*' --exclude='./source-bodies/*' -czf "$diagnostic" -C "$QA_OUT" .
            test "$(stat -c%s "$diagnostic")" -le 50000000
            sha256sum "$diagnostic" > "$diagnostic.sha256"
            printf 'archive=%s\n' "$diagnostic" >> "$GITHUB_OUTPUT"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always() && steps.pack.outputs.archive != ''
        with:
          name: sc4-practice-first-stop-attribution
          path: |
            ${{ steps.pack.outputs.archive }}
            ${{ steps.pack.outputs.archive }}.sha256
          if-no-files-found: error
          retention-days: 30
