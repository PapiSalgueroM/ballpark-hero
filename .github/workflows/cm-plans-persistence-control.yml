name: Match plan persistence control
on:
  push:
    branches: [codex/cm-plans-persistence-control-20261027]
    paths: [.github/workflows/cm-plans-persistence-control.yml]
permissions:
  contents: read
concurrency:
  group: cm-plans-persistence-control-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      CI: '1'
      SIM_NETWORK: offline
      MANAGER_MATCH_PLANS_ARTIFACTS: ${{ github.workspace }}/persistence-control-artifacts/mounted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Retain exact sources and install locked dependencies
        run: |
          set -euo pipefail
          mkdir -p persistence-control-artifacts
          git rev-parse HEAD > persistence-control-artifacts/source-head.txt
          git rev-parse HEAD^{tree} > persistence-control-artifacts/source-tree.txt
          git ls-files -z | sort -z | xargs -0 sha256sum > persistence-control-artifacts/source-before.sha256
          git archive --format=tar HEAD > persistence-control-artifacts/source.tar
          npm ci
      - name: Actual application types
        run: |
          set -euo pipefail
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee persistence-control-artifacts/types.log
      - name: Actual normal cases and all effective copied faults
        run: |
          set -euo pipefail
          MANAGER_MATCH_PLANS_CONTROL=all NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/simManagerMatchPlans.mjs 2>&1 | tee persistence-control-artifacts/outcomes.log
      - name: Source holds
        if: always()
        run: |
          set -euo pipefail
          sha256sum -c persistence-control-artifacts/source-before.sha256 > persistence-control-artifacts/source-held.log
          git diff --exit-code HEAD
      - name: Preserve exact observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cm-plans-persistence-control-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          path: persistence-control-artifacts/
