name: Stadium late-plan calibration
on:
  push:
    branches: [codex/stadium-late-plan-calibration-v2-20261029]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: 'true'
      ENGINES: chromium
      SIM_NETWORK: offline
      TZ: UTC
      EXPECTED_PARENT: 0207ae74e56897082ef2cf43d586c704388cb237
      EXPECTED_MAIN: bd0c07bf72dc0214842202fe2f931b14c65d82dc
      EXPECTED_TREE: feb6a07782358af6dbd067356a700e411d1743f3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Bind current app source and board-only main compatibility
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/stadium-late-plan-calibration"; fonts="$RUNNER_TEMP/stadium-late-plan-fonts"
          test ! -e "$out"; test ! -e "$fonts"; mkdir -p "$out"
          echo "PLACEMENT_OUT=$out" >> "$GITHUB_ENV"; echo "FREE_KICK_FONT_CACHE=$fonts" >> "$GITHUB_ENV"
          echo "STADIUM_PLAN_PHASE=calibration" >> "$GITHUB_ENV"; echo "STADIUM_PLAN_MEASUREMENT_OUT=$out/measurement" >> "$GITHUB_ENV"
          echo "STADIUM_PLAN_ZERO_ENGINE_SHA256=1b00a96307914df097dc1375973e72328aad01b0b5ff8e5074177151960c17c9" >> "$GITHUB_ENV"; echo "STADIUM_PLAN_ORIGINAL_ENGINE=$out/original-stadium-engine.ts" >> "$GITHUB_ENV"
          git show "$EXPECTED_MAIN:src/lib/stadiumTycoon.ts" > "$out/original-stadium-engine.ts"
          git diff --name-status "$EXPECTED_MAIN" "$EXPECTED_PARENT" > "$out/product-paths.txt"
          printf 'M\tsrc/data/gameContent/stadiumManagement.ts\nM\tsrc/hooks/useStadiumTycoon.ts\nM\tsrc/lib/stadiumTycoon.ts\nM\tsrc/pages/StadiumTycoon.tsx\nA\tsrc/test/tycoonMatchPlan.test.tsx\nA\tsrc/test/tycoonMatchPlanPage.test.tsx\n' > "$out/expected-product-paths.txt"
          cmp "$out/product-paths.txt" "$out/expected-product-paths.txt"
          test "$GITHUB_REF_NAME" = codex/stadium-late-plan-calibration-v2-20261029
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-list --parents -n1 HEAD)" = "$GITHUB_SHA $EXPECTED_PARENT"
          test "$(git rev-parse "$EXPECTED_PARENT^{tree}")" = "$EXPECTED_TREE"
          test "$(git ls-files | wc -l)" -eq 5456
          git diff --name-status "$EXPECTED_PARENT" HEAD > "$out/proof-diff.txt"
          printf 'A\t.github/workflows/stadium-late-plan-calibration.yml\nA\tscripts/qa/calibrateStadiumLatePlan.mjs\n' > "$out/expected-proof-diff.txt"
          cmp "$out/proof-diff.txt" "$out/expected-proof-diff.txt"
          test "$(git rev-parse HEAD:src/lib/stadiumTycoon.ts)" = 1d3b864e7f22b9c2c712923416b13a5403aeb36f
          printf '%s\n' "$EXPECTED_MAIN" > "$out/main-at-plan.txt"
