            local id="$1" want="$2"; shift 2
            local dir="$PLACEMENT_OUT/gates/$id"; test ! -e "$dir"; mkdir -p "$dir"
            printf '%q ' "$@" > "$dir/command.txt"; printf '\n' >> "$dir/command.txt"
            : > "$dir/transport.jsonl"
            local raw=0
            SIM_OFFLINE_RECEIPT="$dir/transport.jsonl" NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" FORCE_COLOR=0 env -u NO_COLOR timeout --signal=TERM --kill-after=15s "${GATE_TIMEOUT:-10m}" "$@" > "$dir/stdout.log" 2> "$dir/stderr.log" || raw=$?
            printf '%s\n' "$raw" > "$dir/raw.exit"; printf 'gate=%s raw=%s expected=%s\n' "$id" "$raw" "$want"
