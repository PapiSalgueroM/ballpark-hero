          printf '{"scope":"UNSELECTED_ZERO_ENGINE_CALIBRATION_ONLY","plannedMain":"%s","observedMain":"%s","productRegularFiles":5454,"proofRegularFiles":5456,"qaAdditions":2,"fullSEO":"UNRUN","fullNewEngineTests":"UNRUN_UNSELECTED_ZERO","fullDefaultVitest":"UNRUN","fullRunAllSims":"UNRUN","parameterSelected":false,"productFeatureReady":false}\n' "$EXPECTED_MAIN" "$actual_main" > "$out/SCOPE.json"
      - name: Locked application dependencies
        run: npm ci > "$PLACEMENT_OUT/npm-ci.stdout.log" 2> "$PLACEMENT_OUT/npm-ci.stderr.log"
      - name: Isolated browser tooling and actual prepared fonts
        run: |
          set -euo pipefail
          out="$PLACEMENT_OUT"; tools="$RUNNER_TEMP/menu-placement-browser-tools"; test ! -e "$tools"
