name: Question report lazy load functional proof
on:
  push:
    branches: [codex/report-question-lazy-load-20261024]
    paths-ignore: ['docs/**']
permissions:
  contents: read
concurrency:
  group: report-question-lazy-functional-${{ github.sha }}
  cancel-in-progress: false
env:
  BASE_SOURCE: 3add42d1b1ef05b69d248a8f833e28bf04e8ab4d
  EXPECTED_PARENT: 970c2cd37ba11c3e6a48ea7cccf83c7ac5eec12d
  CI: '1'
  SIM_NETWORK: offline
  TZ: UTC
jobs:
  report_functional_green:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Fresh outside-checkout raw evidence
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/report-form-lazy-green";test ! -e "$base";mkdir -m 700 "$base"
          out="$base/evidence";mkdir -m 700 "$out"
          export REPORT_GREEN_OUT="$out";echo "REPORT_GREEN_OUT=$out" >> "$GITHUB_ENV"
          printf '%s\n' "$GITHUB_SHA" > "$out/head.txt"
          printf '%s\n' "$GITHUB_RUN_ID" > "$out/run-id.txt"
          printf '%s\n' "$GITHUB_RUN_ATTEMPT" > "$out/run-attempt.txt"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - name: Exact four-path viewport panel child with fixed legacy source bindings
        id: source
        timeout-minutes: 3
        run: |
          set -euo pipefail
          out="$REPORT_GREEN_OUT"
          test "$GITHUB_REPOSITORY" = PapiSalgueroM/ballpark-hero
          test "$GITHUB_REPOSITORY_ID" = 1195729679
          test "$GITHUB_REF" = refs/heads/codex/report-question-lazy-load-20261024
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git show -s --format=%P HEAD)" = "$EXPECTED_PARENT"
          test "$(git rev-parse "$EXPECTED_PARENT^{tree}")" = 42818363beca466291f74eeee2d0802c20f921f0
          test "$(git rev-parse "$BASE_SOURCE^{tree}")" = a68fe40c9847f0e668da1f356c8b4b9721cefbbf
          git diff --name-status "$EXPECTED_PARENT" HEAD > "$out/direct-paths.txt"
          printf 'M\t.github/workflows/report-question-lazy-load.yml\nM\tscripts/qa/playReportDraftLifecycle.mjs\nM\tsrc/components/game/ReportQuestion.tsx\nM\tsrc/components/game/ReportSiteIssue.tsx\n' | cmp - "$out/direct-paths.txt"
          git diff --exit-code "$EXPECTED_PARENT" HEAD -- . ':!.github/workflows/report-question-lazy-load.yml' ':!scripts/qa/playReportDraftLifecycle.mjs' ':!src/components/game/ReportQuestion.tsx' ':!src/components/game/ReportSiteIssue.tsx' > "$out/all-parent-source-held.log"
          git diff --name-status "$BASE_SOURCE" HEAD > "$out/cumulative-paths.txt"
          printf 'M\t.github/workflows/report-question-lazy-load.yml\nM\tscripts/qa/playReportDraftLifecycle.mjs\nM\tscripts/simReportContext.mjs\nM\tscripts/simReportDraftLifecycle.mjs\nM\tscripts/simReportRelay.mjs\nM\tsrc/components/game/ReportQuestion.tsx\nM\tsrc/components/game/ReportQuestionForm.tsx\nM\tsrc/components/game/ReportSiteIssue.tsx\nA\tsrc/test/ReportQuestion.cancel-pending.test.tsx\nA\tsrc/test/ReportQuestion.cancel-queued.test.tsx\nA\tsrc/test/ReportQuestion.integration.test.tsx\nA\tsrc/test/ReportQuestion.latest-props.test.tsx\nA\tsrc/test/ReportQuestion.load-error.test.tsx\nM\tsrc/test/reportDetails.test.tsx\nM\tsrc/test/reportDraftLifecycle.test.tsx\n' | cmp - "$out/cumulative-paths.txt"
          git diff --exit-code "$BASE_SOURCE" HEAD -- . ':!.github/workflows/report-question-lazy-load.yml' ':!scripts/qa/playReportDraftLifecycle.mjs' ':!scripts/simReportContext.mjs' ':!scripts/simReportDraftLifecycle.mjs' ':!scripts/simReportRelay.mjs' ':!src/components/game/ReportQuestion.tsx' ':!src/components/game/ReportQuestionForm.tsx' ':!src/components/game/ReportSiteIssue.tsx' ':!src/test/ReportQuestion.cancel-pending.test.tsx' ':!src/test/ReportQuestion.cancel-queued.test.tsx' ':!src/test/ReportQuestion.integration.test.tsx' ':!src/test/ReportQuestion.latest-props.test.tsx' ':!src/test/ReportQuestion.load-error.test.tsx' ':!src/test/reportDetails.test.tsx' ':!src/test/reportDraftLifecycle.test.tsx' > "$out/all-old-source-held.log"
          git rev-parse HEAD^{tree} > "$out/tree.txt"
          git ls-files -z | sort -z > "$out/source-members.before"
          test "$(tr -cd '\000' < "$out/source-members.before" | wc -c)" -eq 5349
          xargs -0 sha256sum < "$out/source-members.before" > "$out/source-before.sha256"
          git status --porcelain --untracked-files=all > "$out/status-before.txt";test ! -s "$out/status-before.txt"
