          fs.writeFileSync(out+'/route-focus-admission.json',JSON.stringify({status:'MENU_FINDER_ROUTE_FOCUS_FUNCTIONAL_ALL_26_PASSED',source:process.env.GITHUB_SHA,parent:process.env.EXPECTED_PARENT,baseSource:process.env.BASE_SOURCE,run:process.env.GITHUB_RUN_ID,attempt:process.env.GITHUB_RUN_ATTEMPT,heldMenuAndFinderPasses:24,held24AdmissionSha256:createHash('sha256').update(heldBytes).digest('hex'),routeFocusCases:2,routeFocusPasses:2,totalPassedCases:26,cases,observedRuntimeCounters:Object.fromEntries(runtimeKeys.filter(k=>k in r).map(k=>[k,r[k]])),absentRuntimeCountersUnknown:runtimeKeys.filter(k=>!(k in r)),unhandledErrors:'unhandledErrors'in r?r.unhandledErrors:'UNKNOWN_ABSENT',classificationErrors:'classificationErrors'in r?r.classificationErrors:'UNKNOWN_ABSENT',applicationQualified:false,browserExecuted:false,livePublished:false},null,2)+'\n',{flag:'wx'});
