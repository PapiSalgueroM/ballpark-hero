        run: |
          set -uo pipefail
          out="$REPORT_GREEN_OUT";failed=0
          if test -f "$out/source-before.sha256";then
            sha256sum -c "$out/source-before.sha256" > "$out/final-source-hold.log" 2>&1 || failed=1
            git ls-files -z | sort -z > "$out/source-members.after" || failed=1
            cmp "$out/source-members.before" "$out/source-members.after" > "$out/final-source-members.log" 2>&1 || failed=1
            xargs -0 sha256sum < "$out/source-members.after" > "$out/source-after.sha256" || failed=1
            cmp "$out/source-before.sha256" "$out/source-after.sha256" > "$out/final-source-sha.log" 2>&1 || failed=1
          else failed=1;fi
          if test -f "$out/dependencies.sha256";then
            sha256sum -c "$out/dependencies.sha256" > "$out/final-dependencies-hold.log" 2>&1 || failed=1
            find node_modules -path node_modules/.vite -prune -o -type f -print0 | sort -z > "$out/dependency-members.after" || failed=1
            cmp "$out/dependency-members.before" "$out/dependency-members.after" > "$out/final-dependency-members.log" 2>&1 || failed=1
            xargs -0 sha256sum < "$out/dependency-members.after" > "$out/dependencies-end.sha256" || failed=1
            cmp "$out/dependencies.sha256" "$out/dependencies-end.sha256" > "$out/final-dependency-sha.log" 2>&1 || failed=1
          else failed=1;fi
          if test -f "$out/inspector.sha256";then sha256sum -c "$out/inspector.sha256" > "$out/inspector-source-final.log" 2>&1 || failed=1;else failed=1;fi
          git rev-parse HEAD > "$out/head-after.txt" || failed=1
          cmp "$out/head.txt" "$out/head-after.txt" > "$out/final-head.log" 2>&1 || failed=1
          git diff --exit-code HEAD > "$out/final-source-diff.log" 2>&1 || failed=1
          git status --porcelain --untracked-files=all > "$out/final-status.txt" || failed=1
          test ! -s "$out/final-status.txt" || failed=1
          final_status=1
          if test -f "$out/inspector.cjs";then
            set -o noclobber;: > "$out/final.transport";set +o noclobber
            final_status=0
            NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$out/final.transport" node "$out/inspector.cjs" final > "$out/final-binding.stdout.log" 2> "$out/final-binding.stderr.log" || final_status=$?
          fi
          printf '%s\n' "$final_status" > "$out/final-binding.exit";test "$final_status" -eq 0 || failed=1
          if test -f "$out/inspector.sha256";then sha256sum -c "$out/inspector.sha256" > "$out/inspector-after-final-process.log" 2>&1 || failed=1;else failed=1;fi
          for name in source types old old-classifier primary primary-classifier source-controls question question-classifier question-source-controls sim-context sim-relay sim-draft sims-classifier sim-record-controls final;do test -f "$out/$name.transport" && test ! -s "$out/$name.transport" || failed=1;done
          for name in source install install.tee types types.tee old old.tee old-classifier primary.tee primary-classifier source-controls question question.tee question-classifier question-source-controls sim-context sim-context.tee sim-relay sim-relay.tee sim-draft sim-draft.tee sims-classifier sim-record-controls;do test -f "$out/$name.exit" && test "$(cat "$out/$name.exit")" = 0 || failed=1;done
          test -f "$out/primary.exit" && test "$(cat "$out/primary.exit")" = 0 || failed=1
          for id in omit-initial-opening cancel-does-not-clear-queued-form accept-cancelled-success-token ignore-one-initial-opening-guard hide-refused-explicit-refresh;do
            for arm in healthy fault restored;do
              file="$out/source-controls/$id/$arm/actual.transport"
              test -f "$file" && test ! -s "$file" || failed=1
            done
          done
          for name in question question-classifier question-source-controls;do
            file="$out/$name.transport"
            test -f "$file" && test ! -L "$file" && test ! -s "$file" || failed=1
          done
          for id in omit-initial-opening cancel-does-not-clear-queued-form accept-cancelled-success-token ignore-one-initial-opening-guard hide-refused-explicit-refresh;do
            for arm in healthy fault restored;do
              file="$out/question-source-controls/$id/$arm/actual.transport"
              test -f "$file" && test ! -L "$file" && test ! -s "$file" || failed=1
            done
          done
          for name in normal bare original completion-owner timer-owner restored;do
            file="$out/sim-draft/unit/$name.transport"
            test -f "$file" && test ! -L "$file" && test ! -s "$file" || failed=1
          done
          for name in old new classifier finder finder-classifier route route-classifier;do
            file="$out/menu26/$name.transport";test -f "$file" && test ! -s "$file" || failed=1
          done
          for name in old new classifier finder finder-classifier route route-tee route-classifier;do
            file="$out/menu26/$name.exit";test -f "$file" && test "$(cat "$file")" = 0 || failed=1
          done
          test -f "$out/menu26/route-focus-admission.json" || failed=1
          while IFS= read -r -d '' file;do test ! -s "$file" || failed=1;done < <(find "$out" -type f -name '*.transport' -print0)
          printf '%s\n' "$failed" > "$out/final-holds.exit";test "$failed" -eq 0
      - name: Always preserve scoped stages, manifest and original logs
        if: ${{ always() }}
        env:
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          TYPES_OUTCOME: ${{ steps.types.outcome }}
          OLD_OUTCOME: ${{ steps.old.outcome }}
          PRIMARY_OUTCOME: ${{ steps.primary.outcome }}
          PRIMARY_CLASSIFIER_OUTCOME: ${{ steps.primary_classifier.outcome }}
          CONTROLS_OUTCOME: ${{ steps.source_controls.outcome }}
          SIMS_OUTCOME: ${{ steps.report_sims.outcome }}
          SIMS_CLASSIFIER_OUTCOME: ${{ steps.sims_classifier.outcome }}
          QUESTION_OUTCOME: ${{ steps.question.outcome }}
          QUESTION_CLASSIFIER_OUTCOME: ${{ steps.question_classifier.outcome }}
          QUESTION_CONTROLS_OUTCOME: ${{ steps.question_controls.outcome }}
          HOLDS_OUTCOME: ${{ steps.holds.outcome }}
        run: |
          set -euo pipefail
          out="$REPORT_GREEN_OUT"
          printf '%s\n' 'phase=lazy-report-functional-green' "source=$GITHUB_SHA" "sourceGate=$SOURCE_OUTCOME" "types=$TYPES_OUTCOME" "original33=$OLD_OUTCOME" "primaryProcess=$PRIMARY_OUTCOME" "wrapperClassifier=$PRIMARY_CLASSIFIER_OUTCOME" "sourceControls=$CONTROLS_OUTCOME" "questionProcess=$QUESTION_OUTCOME" "questionClassifier=$QUESTION_CLASSIFIER_OUTCOME" "questionSourceControls=$QUESTION_CONTROLS_OUTCOME" "reportSims=$SIMS_OUTCOME" "reportSimsClassifier=$SIMS_CLASSIFIER_OUTCOME" "finalHolds=$HOLDS_OUTCOME" 'expectedNormalCases=48' 'siteCases=7' 'questionCases=8' 'plannedSiteSourceControlProcesses=15' 'plannedQuestionSourceControlProcesses=15' 'plannedSelectedSourceControlProcesses=30' 'applicationFixed=false' 'browserExecuted=false' 'buildExecuted=false' 'fullSuiteExecuted=false' 'existingCapsUnwaived=true' 'published=false' > "$out/stages.txt"
          printf 'phase=separate-current-menu-finder26\nsource=%s\noldMenu10=%s\nhost6=%s\nfinder8=%s\nroute2=%s\nrouteClassifier=%s\nsimRecordControls=%s\nexpectedSeparateMenuCases=26\nnormalReportCases=48\naggregateApplicationQualified=false\n' "$GITHUB_SHA" '${{ steps.menu_old.outcome }}' '${{ steps.menu_new.outcome }}' '${{ steps.menu_finder.outcome }}' '${{ steps.menu_route.outcome }}' '${{ steps.menu_route_classifier.outcome }}' '${{ steps.sim_record_controls.outcome }}' > "$out/menu26-stages.txt"
          find "$out" ! -type d ! -type f -print > "$out/evidence-nonregular.txt";test ! -s "$out/evidence-nonregular.txt"
          (cd "$out" && find . -type f ! -name evidence.sha256 -print0 | sort -z | xargs -0 sha256sum > evidence.sha256)
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: report-question-lazy-green-${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ env.REPORT_GREEN_OUT }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
