          const rows=['normal','unfilter','restored'].map(arm=>{
            const st=fs.lstatSync(path.join(out,arm+'.transport'));
            return {arm,pid:Number(read(arm+'.pid').trim()),exit:Number(read(arm+'.exit').trim()),phase:read(arm+'.phase').trim(),stdout:read(arm+'.stdout.log'),stderr:read(arm+'.stderr.log'),receipt:{regular:st.isFile(),symlink:st.isSymbolicLink(),bytes:st.size}};
          });
          function judge(values){
            assert.deepEqual(values.map(row=>row.arm),['normal','unfilter','restored'],'ACADEMY_PROOF_THREE_ACTUAL_ARMS');
            assert.equal(new Set(values.map(row=>row.pid)).size,3,'ACADEMY_PROOF_DISTINCT_NATIVE_PIDS');
            for(const row of values){
              assert(Number.isInteger(row.pid)&&row.pid>0&&row.phase==='CLOSED','ACADEMY_PROOF_NATIVE_CLOSED');
              assert.equal(row.exit,0,'ACADEMY_PROOF_NATIVE_EXIT');
              assert(row.receipt.regular&&!row.receipt.symlink&&row.receipt.bytes===0,'ACADEMY_PROOF_TRANSPORT');
              const text=row.stdout+'\n'+row.stderr;
              assert(text.includes('src/test/academyFilters.test.tsx'),'ACADEMY_PROOF_ACTUAL_TEST_FILE');
              assert(!/Unhandled (?:Errors?|Rejections?)|Uncaught Exception|SyntaxError|ReferenceError|Cannot find (?:module|package)|Failed to (?:load|resolve) (?:url|import)/i.test(text),'ACADEMY_PROOF_NO_OBSERVED_SETUP_RUNTIME_ERROR');
              if(row.arm==='unfilter'){
                assert.equal((text.match(/^\s*Test Files\s+1 failed \(1\)\s*$/gm)||[]).length,1,'ACADEMY_PROOF_TEST_CENSUS');
                assert.equal((text.match(/^\s*Tests\s+6 failed \| 2 passed \(8\)\s*$/gm)||[]).length,1,'ACADEMY_PROOF_TEST_CENSUS');
                const names=[...text.matchAll(/^\s*FAIL\s+src\/test\/academyFilters\.test\.tsx > academy position and age filters > (.+)\s*$/gm)].map(match=>match[1].trim()).sort();
                assert.deepEqual(names,[...failedTitles].sort(),'ACADEMY_PROOF_FAILED_CENSUS');
                const blocks=[...text.matchAll(/^[ \t]*FAIL[ \t]+src\/test\/academyFilters\.test\.tsx > academy position and age filters > ([^\n]+)\n([^\n]*)/gm)];
                assert.equal(blocks.length,6,'ACADEMY_PROOF_ACTUAL_FILTER_OUTCOME_FAILURE');
                const ordinary=new Set([failedTitles[0],failedTitles[1],failedTitles[5]]);
                for(const block of blocks){
                  const title=block[1].trim(),heading=block[2];assert(failedTitles.includes(title),'ACADEMY_PROOF_FAILED_CENSUS');
                  if(ordinary.has(title))assert.equal(heading,'Error: expect(element).toHaveTextContent()','ACADEMY_PROOF_ACTUAL_FILTER_OUTCOME_FAILURE');
                  else assert(heading.startsWith('TestingLibraryElementError: Found multiple elements with the role "button" and name ')&&heading.includes('/^Sign him: /'),'ACADEMY_PROOF_ACTUAL_FILTER_OUTCOME_FAILURE');
                }
                const actualPassed=[...text.matchAll(/^[ \t]*✓ academy position and age filters > (.+?) \d+ms[ \t]*$/gm)].map(match=>match[1]).sort();
                assert.deepEqual(actualPassed,[...unaffectedTitles].sort(),'ACADEMY_PROOF_ACTUAL_PRESERVED_TITLES');
                assert(row.stdout.trimEnd().endsWith(fault),'ACADEMY_PROOF_WRAPPER_FOOTER');
              }else{
                assert.equal((text.match(/^\s*Test Files\s+1 passed \(1\)\s*$/gm)||[]).length,1,'ACADEMY_PROOF_TEST_CENSUS');
                assert.equal((text.match(/^\s*Tests\s+8 passed \(8\)\s*$/gm)||[]).length,1,'ACADEMY_PROOF_TEST_CENSUS');
                assert(!/^\s*FAIL\s+/m.test(text),'ACADEMY_PROOF_TEST_CENSUS');
                assert(row.stdout.trimEnd().endsWith(good),'ACADEMY_PROOF_WRAPPER_FOOTER');
              }
            }
          }
          judge(rows);
          const original=Buffer.from(JSON.stringify(rows)+'\n');
          fs.writeFileSync(path.join(out,'record-control-foundation.json'),original,{flag:'wx'});
          const controls=[];
          function control(id,mutate,marker){
            const changed=JSON.parse(original);mutate(changed);const body=Buffer.from(JSON.stringify(changed)+'\n'),work=path.join(out,'record-control-'+id+'.work.json');
            assert(!body.equals(original),'ACADEMY_RECORD_CONTROL_CHANGED');fs.writeFileSync(work,body,{flag:'wx'});
            let error;try{judge(JSON.parse(fs.readFileSync(work,'utf8')));}catch(actual){error=actual;}
            assert(error instanceof assert.AssertionError&&error.code==='ERR_ASSERTION'&&error.message.includes(marker),'ACADEMY_RECORD_CONTROL_OWNED');
            fs.writeFileSync(path.join(out,'record-control-'+id+'.changed.json'),body,{flag:'wx'});
            fs.writeFileSync(work,original);assert(fs.readFileSync(work).equals(original),'ACADEMY_RECORD_CONTROL_RESTORED');judge(JSON.parse(fs.readFileSync(work,'utf8')));
            controls.push({id,marker,sourceSha256:sha(original),changedSha256:sha(body),restoredSha256:sha(fs.readFileSync(work)),error:{name:error.name,code:error.code,message:error.message,stack:error.stack},scope:'COPIED_ACTUAL_OUTPUT_RECORD_JUDGE_ONLY'});
          }
          control('wrong-normal-pass-total',v=>{const re=/Tests\s+8 passed \(8\)/g;assert.equal((v[0].stdout.match(re)||[]).length,1);v[0].stdout=v[0].stdout.replace(re,'Tests 7 passed (8)');},'ACADEMY_PROOF_TEST_CENSUS');
          control('wrong-actual-failed-title',v=>{
            const re=/FAIL\s+src\/test\/academyFilters\.test\.tsx > academy position and age filters > combines both filters while keeping the original reported-ceiling order and source list/g;
            assert.equal((v[1].stdout.match(re)||[]).length,1);
            v[1].stdout=v[1].stdout.replace(re,match=>match.replace(failedTitles[0],'changed copied record title'));
          },'ACADEMY_PROOF_FAILED_CENSUS');
          control('nonzero-native-wrapper',v=>{v[2].exit=1;},'ACADEMY_PROOF_NATIVE_EXIT');
          control('nonempty-native-receipt',v=>{v[0].receipt.bytes=1;},'ACADEMY_PROOF_TRANSPORT');
          control('wrong-owned-error-heading',v=>{const re=/^Error: expect\(element\)\.toHaveTextContent\(\)$/gm;assert.equal((v[1].stdout.match(re)||[]).length,3);v[1].stdout=v[1].stdout.replace(/^Error: expect\(element\)\.toHaveTextContent\(\)$/m,'Error: changed copied record heading');},'ACADEMY_PROOF_ACTUAL_FILTER_OUTCOME_FAILURE');
          write('record-controls.json',{status:'FIVE_ACTUAL_RECORD_CONTROLS_AND_RESTORES_EFFECTIVE',controls,applicationSourceFaultCredit:0,normalTestPassCredit:0});
          write('targeted-admission.json',{status:'TARGETED_ACADEMY_WRAPPER_NORMAL_CONTROL_RESTORED_COMPLETE',source:process.env.GITHUB_SHA,normal:{passed:8},unfilter:{failed:6,passed:2,failedTitles,unaffectedTitles,unaffectedIdentityBasis:'Both exact passed titles are printed in the actual unfilter output and required alongside all six exact failed-title/error-heading families.'},restored:{passed:8},wrapperRows:rows.map(r=>({arm:r.arm,pid:r.pid,nativeExit:r.exit,phase:r.phase,stdoutBytes:Buffer.byteLength(r.stdout),stdoutSha256:sha(r.stdout),stderrBytes:Buffer.byteLength(r.stderr),stderrSha256:sha(r.stderr),receipt:r.receipt})),recordJudgeControls:5,wrapperChildTimeoutMs:120000,childNativeStatusTelemetry:'NOT_SEPARATELY_RETAINED_BY_UNCHANGED_WRAPPER; original wrapper checks child status and actual summaries',optionalVitestRuntimeCounters:'UNKNOWN_NOT_RETAINED_BY_UNCHANGED_DEFAULT_REPORTER',backendQualified:false,fullSuiteQualified:false,browserExecuted:false,buildExecuted:false,published:false});
          console.log('Academy targeted proof: actual normal8, unfilter6failed2passed, restored8, five copied-record controls.');
          NODE
          code=$?
          printf '%s\n' "$code" > "$ACADEMY_OUT/classifier.exit"
          cat "$ACADEMY_OUT/classifier.stdout.log"
          cat "$ACADEMY_OUT/classifier.stderr.log" >&2
          exit "$code"
      - name: Always require complete physical end holds
        if: always()
        id: final
        run: |
          set +e
          set -uo pipefail
          fail=0
          if test -s "$ACADEMY_OUT/source-before.sha256"; then
            git ls-files -z | sort -z > "$ACADEMY_OUT/source-members.after"
            xargs -0 sha256sum < "$ACADEMY_OUT/source-members.after" > "$ACADEMY_OUT/source-after.sha256"
            cmp "$ACADEMY_OUT/source-members.before" "$ACADEMY_OUT/source-members.after" > "$ACADEMY_OUT/source-members-hold.log" 2>&1 || fail=1
            cmp "$ACADEMY_OUT/source-before.sha256" "$ACADEMY_OUT/source-after.sha256" > "$ACADEMY_OUT/source-sha-hold.log" 2>&1 || fail=1
            sha256sum -c "$ACADEMY_OUT/source-before.sha256" > "$ACADEMY_OUT/source-body-hold.log" 2>&1 || fail=1
          else fail=1; fi
          if test -s "$ACADEMY_OUT/dependencies-before.sha256"; then
            find node_modules -type f -print0 | sort -z > "$ACADEMY_OUT/dependency-members.after"
            xargs -0 sha256sum < "$ACADEMY_OUT/dependency-members.after" > "$ACADEMY_OUT/dependencies-after.sha256"
            cmp "$ACADEMY_OUT/dependency-members.before" "$ACADEMY_OUT/dependency-members.after" > "$ACADEMY_OUT/dependency-members-hold.log" 2>&1 || fail=1
            cmp "$ACADEMY_OUT/dependencies-before.sha256" "$ACADEMY_OUT/dependencies-after.sha256" > "$ACADEMY_OUT/dependency-sha-hold.log" 2>&1 || fail=1
            sha256sum -c "$ACADEMY_OUT/dependencies-before.sha256" > "$ACADEMY_OUT/dependency-body-hold.log" 2>&1 || fail=1
          else fail=1; fi
          sha256sum -c "$ACADEMY_OUT/critical.expected.sha256" > "$ACADEMY_OUT/critical-expected-hold.log" 2>&1 || fail=1
          git rev-parse HEAD > "$ACADEMY_OUT/head.after"
          cmp "$ACADEMY_OUT/head.before" "$ACADEMY_OUT/head.after" > "$ACADEMY_OUT/head-hold.log" 2>&1 || fail=1
          git diff --exit-code > "$ACADEMY_OUT/worktree-diff.log" 2>&1 || fail=1
          git diff --cached --exit-code > "$ACADEMY_OUT/index-diff.log" 2>&1 || fail=1
          git status --porcelain=v1 --untracked-files=all > "$ACADEMY_OUT/status.after"
          test ! -s "$ACADEMY_OUT/status.after" || fail=1
          cmp "$WORKFLOW_PATH" "$ACADEMY_OUT/workflow.source.yml" > "$ACADEMY_OUT/workflow-copy-hold.log" 2>&1 || fail=1
          sha256sum -c "$ACADEMY_OUT/cache-helper.sha256" > "$ACADEMY_OUT/cache-helper-after.log" 2>&1 || fail=1
          NODE_OPTIONS="--require=$GITHUB_WORKSPACE/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$ACADEMY_OUT/cache.transport" \
            node "$ACADEMY_OUT/academy-cache-helper.cjs" final > "$ACADEMY_OUT/cache-final.stdout.log" 2> "$ACADEMY_OUT/cache-final.stderr.log"
          cache_final=$?
          printf '%s\n' "$cache_final" > "$ACADEMY_OUT/cache-final.exit"
          test "$cache_final" -eq 0 || fail=1
          (set -o noclobber; : > "$ACADEMY_OUT/final.transport") || fail=1
          NODE_OPTIONS="--require=$GITHUB_WORKSPACE/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$ACADEMY_OUT/final.transport" \
            node --input-type=module > "$ACADEMY_OUT/final.stdout.log" 2> "$ACADEMY_OUT/final.stderr.log" <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          const out=process.env.ACADEMY_OUT,sha=b=>createHash('sha256').update(b).digest('hex');
          const expected=JSON.parse(fs.readFileSync(path.join(out,'critical.expected.json'),'utf8')),binding=JSON.parse(fs.readFileSync(path.join(out,'source-binding.json'),'utf8'));
          assert.equal(execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),process.env.GITHUB_SHA);
          const pins=expected.map(row=>{
            const body=fs.readFileSync(row.file),actual={bytes:body.length,sha256:sha(body),gitBlob:execFileSync('git',['rev-parse','HEAD:'+row.file],{encoding:'utf8'}).trim()};
            assert.deepEqual(actual,row.candidate);return {file:row.file,...actual,parentGitBlob:row.parent.gitBlob};
          });
          assert.deepEqual(pins,binding.pins);
          for(const name of ['source','install','types','cache-setup','cache-before-normal','cache-normal','normal','cache-before-unfilter','cache-unfilter','unfilter','cache-before-restored','cache-restored','restored','classifier','cache-final'])assert.equal(fs.readFileSync(path.join(out,name+'.exit'),'utf8').trim(),'0','ACADEMY_FINAL_REQUIRED_NATIVE_EXIT: '+name);
          for(const name of ['source','types','normal','unfilter','restored','classifier','final','cache']){
            const st=fs.lstatSync(path.join(out,name+'.transport'));
            assert(st.isFile()&&!st.isSymbolicLink()&&st.size===0,'ACADEMY_FINAL_PRESENT_EMPTY_RECEIPT: '+name);
          }
          const a=JSON.parse(fs.readFileSync(path.join(out,'targeted-admission.json'),'utf8'));
          assert.equal(a.status,'TARGETED_ACADEMY_WRAPPER_NORMAL_CONTROL_RESTORED_COMPLETE');assert.equal(a.source,process.env.GITHUB_SHA);
          assert.equal(a.recordJudgeControls,5);assert.equal(a.fullSuiteQualified,false);assert.equal(a.backendQualified,false);
          const cache=JSON.parse(fs.readFileSync(path.join(out,'cache-final-binding.json'),'utf8')),cacheControls=JSON.parse(fs.readFileSync(path.join(out,'cache-record-controls.json'),'utf8'));
          assert.equal(cache.status,'ACTUAL_THREE_ARM_CACHE_BODIES_AND_LINK_HELD');assert.equal(cache.arms.length,3);assert.equal(cache.recordJudgeControls,5);assert.equal(cacheControls.controls.length,5);
          fs.writeFileSync(path.join(out,'final-binding.json'),JSON.stringify({source:process.env.GITHUB_SHA,pins,currentSources:5343,dependencies:24466,presentEmptyReceipts:8,cacheActualArms:3,cacheRecordControls:5,outputRecordControls:5,targetedOnly:true,fullSuiteQualified:false,browserExecuted:false,backendQualified:false},null,2)+'\n',{flag:'wx'});
          NODE
          code=$?
          printf '%s\n' "$code" > "$ACADEMY_OUT/final-binding.exit"
          test "$code" -eq 0 || fail=1
          test ! -s "$ACADEMY_OUT/final.transport" || fail=1
          printf '%s\n' "$fail" > "$ACADEMY_OUT/final-holds.exit"
          exit "$fail"
      - name: Always preserve stages and complete evidence
        if: always()
        run: |
          set -euo pipefail
          printf '%s\n' 'source=${{ steps.source.outcome }}' 'install=${{ steps.install.outcome }}' 'types=${{ steps.types.outcome }}' 'cacheSetup=${{ steps.cache_setup.outcome }}' 'normal=${{ steps.normal.outcome }}' 'unfilter=${{ steps.unfilter.outcome }}' 'restored=${{ steps.restored.outcome }}' 'classifier=${{ steps.classify.outcome }}' 'final=${{ steps.final.outcome }}' > "$ACADEMY_OUT/stages.txt"
          find "$ACADEMY_OUT" -mindepth 1 ! -type d ! -type f -print > "$ACADEMY_OUT/evidence-nonregular.txt"
          test ! -s "$ACADEMY_OUT/evidence-nonregular.txt"
          (cd "$ACADEMY_OUT"; find . -type f ! -name evidence.sha256 -print0 | sort -z | xargs -0 sha256sum > evidence.sha256)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: academy-filter-proof-repair-${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ env.ACADEMY_OUT }}
          if-no-files-found: error
          retention-days: 30
