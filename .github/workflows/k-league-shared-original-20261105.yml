name: K League shared original-first fresh build and six assertions
on:
  push:
    branches: [codex/k-league-shared-original-20261105]
permissions:
  contents: read
concurrency:
  group: k-league-shared-original-${{ github.ref }}
  cancel-in-progress: false
env:
  CI: '1'
  SIM_NETWORK: offline
  TZ: UTC
  PRODUCT_CORE: 671730c30f67685f070593af7b2464a9cc1f5352
  PRODUCT_TREE: 7080fc953cab1ebbb3f616b7741f022c8b7a8ea0
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ENGINES: chromium
      SEO_SPLIT_BASE_REF: HEAD
      SWEEP_OFFLINE: '1'
      PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 6
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Bind unpublished pre-K UI prerequisite and exactly four temporary QA additions
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/k-league-shared-original"
          test ! -e "$OUT"
          mkdir -p "$OUT/logs" "$OUT/transport"
          printf 'QA_OUT=%s\n' "$OUT" >> "$GITHUB_ENV"
          export QA_OUT="$OUT"
          test "$(git rev-parse HEAD^)" = "$PRODUCT_CORE"
          test "$(git rev-parse HEAD^^{tree})" = "$PRODUCT_TREE"
          git rev-parse HEAD HEAD^{tree} > "$OUT/source.txt"
          git diff --name-status --no-renames HEAD^ HEAD > "$OUT/qa-delta.txt"
          git ls-files -z | sort -z | xargs -0 sha256sum > "$OUT/source-before.sha256"
          git ls-files -s > "$OUT/index-before.txt"
          git ls-files -z > "$OUT/tracked-before.bin"
          for lock in package.json package-lock.json bun.lock bun.lockb; do if test -f "$lock"; then sha256sum "$lock"; fi; done > "$OUT/locks-before.sha256"
          git status --porcelain=v1 --untracked-files=all > "$OUT/status-before.txt"
          test ! -s "$OUT/status-before.txt"
          node --input-type=module <<'PINS'
          import assert from 'node:assert/strict';import fs from 'node:fs';import crypto from 'node:crypto';import{execFileSync}from'node:child_process';
          const out=process.env.QA_OUT,paths=['.github/workflows/k-league-shared-original-20261105.yml','scripts/qa/kLeagueSharedOriginalCases.json','scripts/qa/kLeagueSharedOriginalEvidence.mjs','src/test/kLeagueSharedOriginal.test.tsx'];
          assert.deepEqual(fs.readFileSync(out+'/qa-delta.txt','utf8').trimEnd().split('\n'),paths.map(p=>'A\t'+p).sort());
          const helpers={
            'src/test/kLeagueSharedOriginal.test.tsx':'ae61a64538f92d35c2267e2a46ada8fc9c2ee289',
            'scripts/qa/kLeagueSharedOriginalEvidence.mjs':'34cfd1a65b7e3c36539c3e1daef0efa824bf8db7',
            'scripts/qa/kLeagueSharedOriginalCases.json':'900c77c17edab09c00d8e64f6f64d894f09c5dd5'
          },blob=b=>crypto.createHash('sha1').update(Buffer.from('blob '+b.length+'\0')).update(b).digest('hex');
          for(const[p,want]of Object.entries(helpers)){assert.match(want,/^[a-f0-9]{40}$/,p);assert.equal(blob(fs.readFileSync(p)),want,p);}
          const spec=JSON.parse(fs.readFileSync('scripts/qa/kLeagueSharedOriginalCases.json','utf8'));assert.equal(spec.original.commit,process.env.PRODUCT_CORE);assert.equal(spec.original.tree,process.env.PRODUCT_TREE);assert.equal(spec.original.role,'PRE_K_UNPUBLISHED_UI_PREREQUISITE_NOT_LIVE');
          assert.equal(spec.prerequisite.candidateIndependentAdmissionSHA256,'7d19fe8286d30116932e39f7da30b3d1b91c8ce38f4c86d5c92cd11699b2037a');
          const base='3b14650d360b010b25b525de33a5f32f33de2798',git=(...a)=>execFileSync('git',a,{encoding:'utf8'}).trim();assert.equal(git('rev-parse','HEAD^^'),base);assert.equal(git('rev-parse','HEAD^^^{tree}'),'d9278a7b5f58395509f6ab937f918c1c2ef31127');
          assert.deepEqual(git('diff','--name-status','--no-renames',base,process.env.PRODUCT_CORE).split('\n'),['A\tsrc/components/club-manager/ClubManagerTeamPicker.tsx','M\tsrc/pages/ClubManager.tsx']);
          const sourcePins=[...spec.sourcePins,{path:'scripts/lib/offlineTransport.cjs',gitBlob:'0fda542a2649fe5da937c6976fd0f5b6073e74b6'},{path:'scripts/lib/hostLikeServer.mjs',gitBlob:'21059d5e8114669df61106c125d5272d357b6236'},{path:'scripts/lib/playwrightLoader.mjs',gitBlob:'4f7739e217e0a47ee82e6bfc8be1c04bed17454a'},{path:'scripts/simNbaHistoricalDraft.mjs',gitBlob:'c1510bf64aef2ed0f75db10af2a00a8ae9d4163d'},{path:'package.json',gitBlob:'2ff64986fb76ebc51b706f2fd24765768874008a'},{path:'package-lock.json',gitBlob:'97d6f12a052f25f400462938c241789a083f0bfe'},{path:'tsconfig.app.json',gitBlob:'51f581dd91641b4c1f1219f646788e73cf6bf00c'}];
          const rows=sourcePins.map(({path,gitBlob})=>{const b=fs.readFileSync(path);assert.equal(blob(b),gitBlob,path);return{path,gitBlob,bytes:b.length,sha256:crypto.createHash('sha256').update(b).digest('hex')};});for(const row of spec.helperPins)assert.equal(helpers[row.path],row.gitBlob,row.path);
          fs.writeFileSync(out+'/input-pins.json',JSON.stringify({sourcePins:rows,helpers,original:spec.original,prerequisite:spec.prerequisite},null,2)+'\n');
          fs.copyFileSync('.github/workflows/k-league-shared-original-20261105.yml',out+'/workflow.yml');fs.writeFileSync(out+'/workflow-source.json',JSON.stringify({head:git('rev-parse','HEAD'),tree:git('rev-parse','HEAD^{tree}'),gitBlob:git('hash-object','.github/workflows/k-league-shared-original-20261105.yml')})+'\n');
          fs.writeFileSync(out+'/pre-k-source-bridge.json',JSON.stringify({status:'UNPUBLISHED_PRE_K_UI_PREREQUISITE_ONLY',liveParent:base,liveTree:'d9278a7b5f58395509f6ab937f918c1c2ef31127',product:process.env.PRODUCT_CORE,tree:process.env.PRODUCT_TREE,AppDelta:['src/pages/ClubManager.tsx','src/components/club-manager/ClubManagerTeamPicker.tsx'],modelAndCatalogueHeld:true,freshBuildRequired:'New src/test is consumed by Tailwind; no old completed build reuse.',KDataImportsByQa:false,standaloneMergeDeployPublish:false},null,2)+'\n');
          PINS
          test ! -e .tmp-fx/career-records-tests.json
          test ! -L .tmp-fx/career-records-tests.json
          if [[ -e .tmp-fx || -L .tmp-fx ]]; then test -d .tmp-fx; test ! -L .tmp-fx; fi
          : > "$OUT/records-leaf-owned-before.txt"
      - name: Install held app and required build tools
        run: |
          set -euo pipefail
          test "$(bun --version)" = 1.4.4
          bun --version > "$QA_OUT/logs/bun-version.log"
          node --version > "$QA_OUT/logs/node-version.log"
          bun install --frozen-lockfile > "$QA_OUT/logs/bun-install.log" 2>&1
          node -p "JSON.stringify({router:require('react-router-dom/package.json').version,vite:require('vite/package.json').version,rollup:JSON.parse(require('fs').readFileSync('node_modules/rollup/package.json','utf8')).version})" > "$QA_OUT/logs/build-versions.json"
          git diff --exit-code HEAD -- package.json package-lock.json bun.lock bun.lockb
          npm install --prefix "$RUNNER_TEMP/cm-team-picker-original-tools" --package-lock=false --no-audit --no-fund playwright@1.64.0 > "$QA_OUT/logs/playwright-install.log" 2>&1
          test ! -e node_modules/playwright
          test ! -e node_modules/playwright-core
          ln -s "$RUNNER_TEMP/cm-team-picker-original-tools/node_modules/playwright" node_modules/playwright
          ln -s "$RUNNER_TEMP/cm-team-picker-original-tools/node_modules/playwright-core" node_modules/playwright-core
          "$RUNNER_TEMP/cm-team-picker-original-tools/node_modules/.bin/playwright" install --with-deps chromium > "$QA_OUT/logs/chromium-install.log" 2>&1
          python3 -m pip install --target "$RUNNER_TEMP/cm-team-picker-original-python" fonttools pillow > "$QA_OUT/logs/python-install.log" 2>&1
          echo "PYTHONPATH=$RUNNER_TEMP/cm-team-picker-original-python" >> "$GITHUB_ENV"
      - name: Proper application types
        run: |
          set -euo pipefail
          export GIT_NO_LAZY_FETCH=1
          export NODE_OPTIONS="--require=$GITHUB_WORKSPACE/scripts/lib/offlineTransport.cjs"
          : > "$QA_OUT/transport/types.log"
          set +e
          SIM_OFFLINE_RECEIPT="$QA_OUT/transport/types.log" node_modules/.bin/tsc --noEmit -p tsconfig.app.json > "$QA_OUT/logs/types.log" 2>&1
          native_exit=$?
          printf '%s\n' "$native_exit" > "$QA_OUT/types.exit" || exit 1
          test "$native_exit" = 0 || exit "$native_exit"
          test ! -s "$QA_OUT/transport/types.log" || exit 1
          set -e
          printf '%s\n' '{"command":"node_modules/.bin/tsc --noEmit -p tsconfig.app.json","exit":0}' > "$QA_OUT/types-passed.json"
          test ! -s "$QA_OUT/transport/types.log"
      - name: Normal build, all twenty output readers and unchanged caps
        timeout-minutes: 25
        run: |
          set -euo pipefail
          export GIT_NO_LAZY_FETCH=1
          export NODE_OPTIONS="--require=$GITHUB_WORKSPACE/scripts/lib/offlineTransport.cjs"
          classify_receipt() {
            local name="$1" receipt="$2"
            local allowed='^\[SIM_OFFLINE_BLOCK\] external browser route continue https://fonts\.(googleapis|gstatic)\.com$'
            if [[ "$name" == sweep-weight ]]; then
              allowed="$allowed|^\[SIM_OFFLINE_BLOCK\] external browser route continue https://flagcdn\.com$"
            elif [[ "$name" != build ]]; then
              if [[ -s "$receipt" ]]; then cat "$receipt"; return 1; fi
              return 0
            fi
            local status=0
            grep -Ev "$allowed" "$receipt" || status=$?
            if [[ "$status" == 1 ]]; then return 0; fi
            return 1
          }
          run_gate() {
            local name="$1"
            shift
            local receipt="$QA_OUT/transport/$name.log"
            : > "$receipt"
            SIM_OFFLINE_RECEIPT="$receipt" "$@" 2>&1 | tee "$QA_OUT/logs/$name.log"
            if ! classify_receipt "$name" "$receipt"; then
              echo "Unexpected blocked transport in $name" >&2
              return 1
            fi
            # Every refusal is retained and counted, never credited as zero transport.
            if [[ -s "$receipt" ]]; then
              wc -l "$receipt" | tee "$QA_OUT/logs/$name-blocked-attempts.txt"
            fi
          }
          run_gate simSaveKeeper node scripts/simSaveKeeper.mjs
          run_gate simHomeFront node scripts/simHomeFront.mjs
          grep -F '7) Continue playing:' "$QA_OUT/logs/simHomeFront.log"
          run_gate simSoccerCareerRecords node scripts/simSoccerCareerRecords.mjs

          grep -F 'simSoccerCareerRecords: 12 outcome checks green, three effective controls caught' "$QA_OUT/logs/simSoccerCareerRecords.log"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import path from 'node:path';import crypto from 'node:crypto';import assert from 'node:assert/strict';
          const out=process.env.QA_OUT,leaf=path.resolve('.tmp-fx/career-records-tests.json');
          assert(fs.existsSync(out+'/records-leaf-owned-before.txt'));
          const dir=fs.lstatSync(path.dirname(leaf)),stat=fs.lstatSync(leaf);
          assert(dir.isDirectory()&&!dir.isSymbolicLink());assert(stat.isFile()&&!stat.isSymbolicLink());
          assert.equal(fs.realpathSync(path.dirname(leaf)),path.join(fs.realpathSync('.'),'.tmp-fx'));
          const bytes=fs.readFileSync(leaf),report=JSON.parse(bytes),rows=report.testResults.flatMap(x=>x.assertionResults);
          assert.equal(report.numTotalTests,12);assert.equal(report.numPassedTests,11);assert.equal(report.numFailedTests,1);
          assert.equal(rows.length,12);assert.equal(rows.filter(x=>x.status==='passed').length,11);assert.equal(rows.filter(x=>x.status==='failed').length,1);
          const retained=out+'/records-last-control-tests.json',sha=crypto.createHash('sha256').update(bytes).digest('hex');
          fs.writeFileSync(retained,bytes,{flag:'wx'});assert.deepEqual(fs.readFileSync(retained),bytes);
          fs.unlinkSync(leaf);
          fs.writeFileSync(out+'/records-output-retention.json',JSON.stringify({sourceLeaf:'.tmp-fx/career-records-tests.json',retained:'records-last-control-tests.json',bytes:bytes.length,sha256:sha,nativeSimExit:0,ordinaryNonSymlinkLeaf:true,copyReadBackExact:true,removedOnlyExactLeaf:true,meaning:'Last negative-control report, intentionally 1 failed and 11 passed. Healthy 12 outcomes and three effective controls are in the complete native log.'},null,2)+'\n');
          NODE
          git status --porcelain=v1 --untracked-files=all > "$QA_OUT/status-after-records.txt"
          test ! -s "$QA_OUT/status-after-records.txt"
          run_gate build npm run build
          printf '%s\n' '{"command":"npm run build","exit":0}' > "$QA_OUT/build-passed.json"
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > "$QA_OUT/dist-before.sha256"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import path from 'node:path';import zlib from 'node:zlib';import crypto from 'node:crypto';import assert from 'node:assert/strict';
          const assets=fs.readdirSync('dist/assets').filter(file=>/\.(js|css)$/.test(file)).sort().map(file=>{
            const bytes=fs.readFileSync(path.join('dist/assets',file));return{file,bytes:bytes.length,gzipBytes:zlib.gzipSync(bytes).length,sha256:crypto.createHash('sha256').update(bytes).digest('hex')};
          });
          const soccer=assets.filter(row=>/^SoccerCareer-.*\.js$/.test(row.file));
          assert.equal(soccer.length,1);
          fs.writeFileSync(process.env.QA_OUT+'/soccer-chunk-sizes.json',JSON.stringify({status:'MEASURED_BUILT_CHUNKS_NO_NEW_CAP',soccer,allBuiltAssets:assets,limits:'Individual built chunk raw/gzip sizes only. Actual route critical-body proof comes from the unchanged sweepWeight window and all16 original caps, including Soccer840KiB. No headroom or full-download total is inferred from this chunk list.'},null,2)+'\n',{flag:'wx'});
          console.log('SC4_BUILT_CHUNK_SIZES '+JSON.stringify(soccer));
          NODE
          tar -czf "$QA_OUT/completed-dist.tar.gz" dist
          sha256sum "$QA_OUT/completed-dist.tar.gz" > "$QA_OUT/completed-dist.tar.gz.sha256"
          tar -tzf "$QA_OUT/completed-dist.tar.gz" > "$QA_OUT/completed-dist-members.txt"
          export BASE=http://127.0.0.1:4173
          export SWEEP_BASE="$BASE"
          export SWEEP_OFFLINE=1
          export SIM_OFFLINE_RECEIPT="$QA_OUT/transport/server.log"
          : > "$SIM_OFFLINE_RECEIPT"
          node scripts/lib/hostLikeServer.mjs dist 4173 > "$QA_OUT/logs/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 40); do
            if curl --fail --silent "$BASE/" > /dev/null; then ready=1; break; fi
            kill -0 "$server_pid"
            sleep 1
          done
          test "$ready" = 1
          run_gate sweep-weight node scripts/sweepWeight.mjs
          readers=(
            simAdsense simBrand simHeadTags simHiddenPages simHubs
            simIndexNow simIndexing simInternalLinks simNoRivalNames simPrerender
            simPrerenderBoot simRetiredRoutes simSchema simSitemap simSnapshotAssets
            simSiteSearch simGuideHeadings simHarnessAnchors
          )
          for reader in "${readers[@]}"; do
            run_gate "$reader" node "scripts/$reader.mjs"
          done
          run_gate simSeoTitles node scripts/simSeoTitles.mjs
          run_gate simSeoMetaSplit env SEO_SPLIT_ONLY=/soccer-career,/club-manager,/nba-my-career node scripts/simSeoMetaSplit.mjs
          run_gate simNbaHistoricalDraft env NBA_HISTORICAL_DRAFT_OUT="$QA_OUT/nba-permanent" node scripts/simNbaHistoricalDraft.mjs
          grep -F 'NBA historical draft: 5 cases passed; copied missing-selection control rejected by 4 business assertions; original source held.' "$QA_OUT/logs/simNbaHistoricalDraft.log"
          test ! -s "$QA_OUT/transport/server.log"
      - name: Record the one fresh unpublished pre-K completed output
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import crypto from 'node:crypto';import assert from 'node:assert/strict';
          const out=process.env.QA_OUT,tar=fs.readFileSync(out+'/completed-dist.tar.gz'),dist=fs.readFileSync(out+'/dist-before.sha256');
          const distFiles=dist.toString('utf8').trim().split('\n').length;assert(distFiles>0);
          const readers=['simAdsense','simBrand','simHeadTags','simHiddenPages','simHubs','simIndexNow','simIndexing','simInternalLinks','simNoRivalNames','simPrerender','simPrerenderBoot','simRetiredRoutes','simSchema','simSitemap','simSnapshotAssets','simSiteSearch','simGuideHeadings','simHarnessAnchors','simSeoTitles','simSeoMetaSplit'];
          for(const name of ['simSaveKeeper','simHomeFront','simSoccerCareerRecords','build','sweep-weight','simNbaHistoricalDraft',...readers])assert(fs.statSync(out+'/logs/'+name+'.log').size>0);
          fs.writeFileSync(out+'/build-proof.json',JSON.stringify({status:'fresh-unpublished-pre-k-original-compiled-gates-passed',product:process.env.PRODUCT_CORE,productTree:process.env.PRODUCT_TREE,normalBuilds:1,readers,readersCount:20,allCapsUnchanged:true,oldBuildReused:false,scope:'Unpublished pre-K original measurement. All16 existing caps and the original window are unchanged. No K-data-positive, live-source, standalone-publish or broader-suite-green claim.',tar:{bytes:tar.length,sha256:crypto.createHash('sha256').update(tar).digest('hex')},distInventorySHA256:crypto.createHash('sha256').update(dist).digest('hex'),distFiles},null,2)+'\n');
          NODE
      - name: Unchanged default NBA career harness, any native red remains unwaived
        run: |
          set +e
          set -uo pipefail
          export GIT_NO_LAZY_FETCH=1
          export NODE_OPTIONS="--require=$GITHUB_WORKSPACE/scripts/lib/offlineTransport.cjs"
          export SIM_OFFLINE_RECEIPT="$QA_OUT/transport/simNbaCareer.log"
          : > "$SIM_OFFLINE_RECEIPT"
          node --unhandled-rejections=strict scripts/simNbaCareer.mjs > "$QA_OUT/logs/simNbaCareer.log" 2>&1
          native_exit=$?
          printf '%s\n' "$native_exit" > "$QA_OUT/simNbaCareer.exit" || exit 1
          test ! -s "$SIM_OFFLINE_RECEIPT" || exit 1
          if test "$native_exit" = 0; then
            grep -F 'PASS: no crashes, every position produces stats, shop fully reachable, deck C reachable, era gates hold, words match effects, life cards tagged, rivalry beats honest' "$QA_OUT/logs/simNbaCareer.log" || exit 1
          fi
          exit "$native_exit"
      - name: Retain six original assertions and classify four held plus two business absences
        timeout-minutes: 25
        run: |
          set -euo pipefail
          export GIT_NO_LAZY_FETCH=1
          export NODE_OPTIONS="--require=$GITHUB_WORKSPACE/scripts/lib/offlineTransport.cjs"
          export K_LEAGUE_ORIGINAL_OUT="$QA_OUT/raw"
          test ! -e "$K_LEAGUE_ORIGINAL_OUT"
          : > "$QA_OUT/transport/vitest.log"
          : > "$QA_OUT/transport/reader.log"
          set +e
          SIM_OFFLINE_RECEIPT="$QA_OUT/transport/vitest.log" node node_modules/vitest/vitest.mjs run src/test/kLeagueSharedOriginal.test.tsx --reporter=json --outputFile="$QA_OUT/vitest.json" --maxWorkers=1 --no-file-parallelism > "$QA_OUT/logs/vitest.stdout.log" 2> "$QA_OUT/logs/vitest.stderr.log"
          native_exit=$?
          printf '%s\n' "$native_exit" > "$QA_OUT/vitest.exit" || exit 1
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > "$QA_OUT/dist-after.sha256"
          cmp "$QA_OUT/dist-before.sha256" "$QA_OUT/dist-after.sha256" || exit 1
          SIM_OFFLINE_RECEIPT="$QA_OUT/transport/reader.log" node scripts/qa/kLeagueSharedOriginalEvidence.mjs --out "$QA_OUT" --spec scripts/qa/kLeagueSharedOriginalCases.json --exit-code "$native_exit" > "$QA_OUT/logs/reader.stdout.log" 2> "$QA_OUT/logs/reader.stderr.log"
          reader_exit=$?
          printf '%s\n' "$reader_exit" > "$QA_OUT/reader.exit" || exit 1
          test ! -s "$QA_OUT/transport/vitest.log" || exit 1
          test ! -s "$QA_OUT/transport/reader.log" || exit 1
          test "$reader_exit" = 0 || exit "$reader_exit"
          test "$native_exit" = 1 || exit 1
          grep -F 'K League original: 4 held, 2 owned business absences, 6 complete RAW, effective census/tape controls' "$QA_OUT/logs/reader.stdout.log" || exit 1
      - name: Hold complete source and completed output
        if: always()
        run: |
          set -euo pipefail
          git ls-files -z | sort -z | xargs -0 sha256sum > "$QA_OUT/source-after.sha256"
          cmp "$QA_OUT/source-before.sha256" "$QA_OUT/source-after.sha256"
          git ls-files -s > "$QA_OUT/index-after.txt"
          git ls-files -z > "$QA_OUT/tracked-after.bin"
          for lock in package.json package-lock.json bun.lock bun.lockb; do if test -f "$lock"; then sha256sum "$lock"; fi; done > "$QA_OUT/locks-after.sha256"
          cmp "$QA_OUT/index-before.txt" "$QA_OUT/index-after.txt"
          cmp "$QA_OUT/tracked-before.bin" "$QA_OUT/tracked-after.bin"
          cmp "$QA_OUT/locks-before.sha256" "$QA_OUT/locks-after.sha256"
          git diff --exit-code HEAD > "$QA_OUT/source-diff.txt"
          git status --porcelain=v1 --untracked-files=all > "$QA_OUT/status-after.txt"
          test ! -s "$QA_OUT/status-after.txt"
          if [[ -f "$QA_OUT/dist-before.sha256" ]]; then
            find dist -type f -print0 | sort -z | xargs -0 sha256sum > "$QA_OUT/dist-after.sha256"
            cmp "$QA_OUT/dist-before.sha256" "$QA_OUT/dist-after.sha256"
            sha256sum --check "$QA_OUT/dist-before.sha256" > "$QA_OUT/dist-held.log"
          fi
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const out=process.env.QA_OUT,rows=fs.readdirSync(out+'/transport').sort().map(file=>{
            const lines=fs.readFileSync(out+'/transport/'+file,'utf8').split('\n').filter(Boolean);
            const permitted=line=>(file==='build.log'&&/^\[SIM_OFFLINE_BLOCK\] external browser route continue https:\/\/fonts\.(googleapis|gstatic)\.com$/.test(line))||(file==='sweep-weight.log'&&(/^\[SIM_OFFLINE_BLOCK\] external browser route continue https:\/\/fonts\.(googleapis|gstatic)\.com$/.test(line)||line==='[SIM_OFFLINE_BLOCK] external browser route continue https://flagcdn.com'));
            assert(lines.every(permitted),'Unexpected transport receipt '+file);
            return{file,blockedAttempts:lines.length,fontBlockedAttempts:lines.filter(line=>line.includes('fonts.googleapis.com')||line.includes('fonts.gstatic.com')).length,flagBlockedAttempts:lines.filter(line=>line.endsWith('https://flagcdn.com')).length};
          });
          fs.writeFileSync(out+'/transport-summary.json',JSON.stringify({receipts:rows,meaning:'Declared blocked font/flag attempts are retained; no provider/font availability claim.'},null,2)+'\n');
          fs.writeFileSync(out+'/source-output-hold.json',JSON.stringify({sourceHeld:true,indexHeld:true,trackedPathsHeld:true,locksHeld:true,status:'clean',completedDistHeld:fs.existsSync(out+'/dist-before.sha256')},null,2)+'\n');
          NODE
      - name: Pack bounded complete output or fatal diagnostic
        id: pack
        if: always()
        run: |
          set +e
          set -uo pipefail
          archive="$RUNNER_TEMP/k-league-shared-original-evidence.tar.gz"
          tar -czf "$archive" -C "$QA_OUT" . > "$RUNNER_TEMP/k-league-shared-original-pack.log" 2>&1
          pack_exit=$?
          printf '%s\n' "$pack_exit" > "$QA_OUT/pack-native.exit" || exit 1
          if [[ "$pack_exit" == 0 && -f "$archive" && "$(stat -c %s "$archive")" -le 50000000 ]]; then
            sha256sum "$archive" > "$archive.sha256" || exit 1
            printf 'archive=%s\n' "$archive" >> "$GITHUB_OUTPUT" || exit 1
            exit 0
          fi
          printf '%s\n' 'DIAGNOSTIC_ONLY_NO_COMPLETE_OUTPUT_PROOF: full pack failed or exceeded50000000bytes' > "$QA_OUT/DIAGNOSTIC-ONLY.txt" || exit 1
          cp "$RUNNER_TEMP/k-league-shared-original-pack.log" "$QA_OUT/pack.log" || exit 1
          diagnostic="$RUNNER_TEMP/k-league-shared-original-diagnostic.tar.gz"
          diagnostic_dir="$RUNNER_TEMP/k-league-shared-original-diagnostic"
          mkdir -p "$diagnostic_dir/logs" "$diagnostic_dir/transport" "$diagnostic_dir/raw" || exit 1
          find "$QA_OUT" -maxdepth 1 -type f ! -name '*.tar.gz' ! -name '*.tgz' -exec cp '{}' "$diagnostic_dir/" \; || exit 1
          cp -R "$QA_OUT/logs/." "$diagnostic_dir/logs/" || exit 1
          cp -R "$QA_OUT/transport/." "$diagnostic_dir/transport/" || exit 1
          if test -f "$QA_OUT/raw/closing.json"; then cp "$QA_OUT/raw/closing.json" "$diagnostic_dir/raw/closing.json" || exit 1; fi
          tar -czf "$diagnostic" -C "$diagnostic_dir" . || exit 1
          test "$(stat -c %s "$diagnostic")" -le 50000000 || exit 1
          sha256sum "$diagnostic" > "$diagnostic.sha256" || exit 1
          printf 'archive=%s\n' "$diagnostic" >> "$GITHUB_OUTPUT" || exit 1
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k-league-shared-original-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.pack.outputs.archive }}
            ${{ steps.pack.outputs.archive }}.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
