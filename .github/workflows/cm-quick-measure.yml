name: Diagnose Club Manager preserved shootouts
on:
  push:
    branches: [codex/cm-quick-sim-subs-1072]
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      SIM_NETWORK: offline
      CM_SLOTS_ARM: candidate
      CM_SHOOTOUT_ARTIFACTS: cm-quick-measure-artifacts/shootout
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Prepare identical diagnostic harnesses
        run: |
          mkdir -p cm-quick-measure-artifacts
          git rev-parse HEAD > cm-quick-measure-artifacts/source-head.txt
          sha256sum src/lib/clubManager.ts src/lib/clubManagerSlots.ts > cm-quick-measure-artifacts/source-before.txt
          sha256sum scripts/simClubManagerSlots.mjs > cm-quick-measure-artifacts/diagnostic-harness.txt
          npm ci
      - name: Check saved career parity on the measured budget
        run: |
          CM_SLOTS_ARTIFACTS=cm-quick-measure-artifacts/slots NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/simClubManagerSlots.mjs 2>&1 | tee cm-quick-measure-artifacts/slots.log
      - name: Measure one duplicated save
        run: |
          set +e
          SLOTS_CONTROL=dupe CM_SLOTS_ARTIFACTS=cm-quick-measure-artifacts/dupe NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/simClubManagerSlots.mjs 2>&1 | tee cm-quick-measure-artifacts/dupe.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 1
          grep -q 'CONTROL FIRED: SLOTS_CONTROL=dupe turned section 2 red through its budget check' cm-quick-measure-artifacts/dupe.log
      - name: Check changed decision text is detected
        if: ${{ !cancelled() }}
        run: |
          set +e
          SLOTS_CONTROL=decisioncontent CM_SLOTS_ARTIFACTS=cm-quick-measure-artifacts/slots-content NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/simClubManagerSlots.mjs 2>&1 | tee cm-quick-measure-artifacts/decisioncontent.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 1
          grep -q 'CONTROL FIRED: SLOTS_CONTROL=decisioncontent changed only decision parity' cm-quick-measure-artifacts/decisioncontent.log
      - name: Capture actual pre-change shootout difference
        if: ${{ !cancelled() }}
        run: NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/simCmShootoutOrder.mjs 2>&1 | tee cm-quick-measure-artifacts/shootout.log
      - name: Preserve original engine and slot bytes
        if: always()
        run: |
          sha256sum src/lib/clubManager.ts src/lib/clubManagerSlots.ts > cm-quick-measure-artifacts/source-after.txt
          diff cm-quick-measure-artifacts/source-before.txt cm-quick-measure-artifacts/source-after.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cm-quick-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: cm-quick-measure-artifacts/
          retention-days: 7
