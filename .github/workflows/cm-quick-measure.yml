name: Measure Club Manager save regression
on:
  push:
    branches: [codex/cm-quick-sim-subs-1072]
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        arm: [candidate, main]
    defaults:
      run:
        shell: bash
    env:
      SIM_NETWORK: offline
      CM_SLOTS_ARM: ${{ matrix.arm }}
      CM_SHOOTOUT_ARTIFACTS: cm-quick-measure-artifacts/shootout
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ matrix.arm == 'main' && '428881617a04543606050395d05be1a9fa4d7b3e' || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Prepare identical diagnostic harnesses
        run: |
          mkdir -p cm-quick-measure-artifacts
          git rev-parse HEAD > cm-quick-measure-artifacts/source-head.txt
          sha256sum src/lib/clubManager.ts src/lib/clubManagerSlots.ts > cm-quick-measure-artifacts/source-before.txt
          git show "$GITHUB_SHA:scripts/simClubManagerSlots.mjs" > scripts/simClubManagerSlots.mjs
          sha256sum scripts/simClubManagerSlots.mjs > cm-quick-measure-artifacts/diagnostic-harness.txt
          npm ci
      - name: Measure six career streams without changing the budget
        run: |
          failed=0
          for seed in 0 1 2 3 4 5; do
            set +e
            SIM_SEED="$seed" CM_SLOTS_ARTIFACTS="cm-quick-measure-artifacts/slots/$seed" NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/simClubManagerSlots.mjs 2>&1 | tee "cm-quick-measure-artifacts/slots-$seed.log"
            status=${PIPESTATUS[0]}
            set -e
            echo "$status" > "cm-quick-measure-artifacts/slots/$seed/exit.txt"
            if [ "$status" -gt 1 ]; then failed=1; fi
            node -e "const fs=require('fs'),r=JSON.parse(fs.readFileSync(process.argv[1])); if(r.runtimeErrors.length || r.sources.some(s=>!s.held) || !['[]','[2]'].includes(JSON.stringify(r.red)) || (r.red.length && !r.tags['2'].includes('budget'))) process.exit(1)" "cm-quick-measure-artifacts/slots/$seed/normal-report.json" || failed=1
          done
          exit "$failed"
      - name: Measure one duplicated save
        run: |
          set +e
          SLOTS_CONTROL=dupe CM_SLOTS_ARTIFACTS=cm-quick-measure-artifacts/dupe NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/simClubManagerSlots.mjs 2>&1 | tee cm-quick-measure-artifacts/dupe.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 1
          grep -q 'CONTROL FIRED: SLOTS_CONTROL=dupe turned section 2 red through its budget check' cm-quick-measure-artifacts/dupe.log
      - name: Check actual pre-change shootout replay
        if: ${{ !cancelled() && matrix.arm == 'candidate' }}
        run: NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/simCmShootoutOrder.mjs 2>&1 | tee cm-quick-measure-artifacts/shootout.log
      - name: Preserve original engine and slot bytes
        if: always()
        run: |
          sha256sum src/lib/clubManager.ts src/lib/clubManagerSlots.ts > cm-quick-measure-artifacts/source-after.txt
          diff cm-quick-measure-artifacts/source-before.txt cm-quick-measure-artifacts/source-after.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cm-quick-measure-${{ matrix.arm }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: cm-quick-measure-artifacts/
          retention-days: 7
