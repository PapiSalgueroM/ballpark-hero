name: Soccer preferred league qualification
on:
  push:
    branches:
      - codex/soccer-transfer-league-20261105
permissions:
  contents: read
jobs:
  scoped:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    env:
      SIM_NETWORK: offline
      SIM_OFFLINE_RECEIPT: league-artifacts/offline.log
      ENGINES: chromium
      TZ: UTC
      SEO_SPLIT_BASE_REF: 1acb33005073be70ba5aae0285ece5537f390f9a
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Locked dependencies and source receipt
        run: |
          mkdir -p league-artifacts
          git rev-parse HEAD > league-artifacts/head.txt
          git rev-parse 'HEAD^{tree}' > league-artifacts/tree.txt
          git ls-files -s > league-artifacts/source-before.txt
          sha256sum package.json package-lock.json > league-artifacts/locks-before.txt
          npm ci
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
          python -m pip install fonttools pillow
      - name: Proper app types
        run: node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee league-artifacts/types.log
      - name: Fixed original faults and full restoration
        run: |
          NODE_OPTIONS="--max-old-space-size=6144 --require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/qa/soccerTransferLeagueCheck.mjs 2>&1 | tee league-artifacts/outcomes.log
      - name: Existing transfer and signing rules
        run: |
          NODE_OPTIONS="--max-old-space-size=6144 --require=$PWD/scripts/lib/offlineTransport.cjs" node node_modules/vitest/vitest.mjs run src/test/soccerCareerTransferBrief.test.ts src/test/soccerTransferBriefUi.test.tsx src/test/soccerTransferBriefPage.test.tsx src/test/soccerTransferBriefPromise.test.tsx src/test/soccerTransferAppearanceFloor.test.tsx src/test/soccerCareerContracts.test.ts src/test/soccerOfferReviewAgeRule.test.tsx --maxWorkers=1 --minWorkers=1 --reporter=default --reporter=json --outputFile=league-artifacts/related.json 2>&1 | tee league-artifacts/related.log
      - name: Normal production build
        id: build
        run: |
          NODE_OPTIONS="--max-old-space-size=6144" npm run build 2>&1 | tee league-artifacts/build.log
          tar -czf league-artifacts/dist.tgz dist
          sha256sum league-artifacts/dist.tgz > league-artifacts/dist.sha256
      - name: All built output readers
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          export ONLY="simAdsense,simBrand,simHeadTags,simHiddenPages,simHubs,simIndexNow,simIndexing,simInternalLinks,simNoRivalNames,simPrerender,simPrerenderBoot,simRetiredRoutes,simSchema,simSitemap,simSnapshotAssets,simSiteSearch,simGuideHeadings,simSeoMetaSplit,simHomeCopy,simHarnessAnchors"
          node scripts/runAllSims.mjs --browser 2>&1 | tee league-artifacts/readers.log
      - name: Existing route download limits
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          node scripts/lib/hostLikeServer.mjs dist 4173 > league-artifacts/weight-host.log 2>&1 &
          sc_host_pid=$!
          trap 'kill "$sc_host_pid" 2>/dev/null || true' EXIT
          sleep 2
          SWEEP_OFFLINE=1 BASE=http://127.0.0.1:4173 node scripts/sweepWeight.mjs 2>&1 | tee league-artifacts/weight.log
      - name: Actual route phone and desktop journeys
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          SOCCER_LEAGUE_BROWSER_OUT=league-artifacts/browser NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/qa/playSoccerTransferLeague.mjs 2>&1 | tee league-artifacts/browser.log
      - name: Source and lock holds
        if: always()
        run: |
          git ls-files -s > league-artifacts/source-after.txt
          cmp league-artifacts/source-before.txt league-artifacts/source-after.txt
          git diff --exit-code HEAD -- src scripts package.json package-lock.json
          sha256sum package.json package-lock.json > league-artifacts/locks-after.txt
          cmp league-artifacts/locks-before.txt league-artifacts/locks-after.txt
          if test -f league-artifacts/offline.log; then test ! -s league-artifacts/offline.log; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soccer-league-scope-${{ github.run_id }}
          path: league-artifacts
          retention-days: 7
          if-no-files-found: error
