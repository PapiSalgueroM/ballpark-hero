name: MMA promotion verification

on:
  push:
    branches: [codex/fight-promotion-1062]
  pull_request:
    paths:
      - .github/workflows/mma-promotion.yml
      - src/components/fight-promoter/**
      - src/pages/FightPromoter.tsx
      - src/components/game/GameHelp.tsx
      - src/hooks/useMmaPromotion.ts
      - src/lib/mmaPromotion.ts
      - src/test/mmaPromotion.test.tsx
      - scripts/simMmaPromotion.mjs
      - scripts/simInventedNames.mjs
      - scripts/qa/mmaPromotion1062.mjs
      - public/fight-promoter/index.html
      - public/whats-new/index.html

permissions:
  contents: read
concurrency:
  group: mma-promotion-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      SIM_NETWORK: offline
      ENGINES: chromium
      VITEST_MAX_FORKS: 1
      VITEST_MIN_FORKS: 1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verification dependencies
        run: |
          mkdir -p mma-promotion-artifacts
          npm ci
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          python -m pip install fonttools pillow
      - name: Prepare scoped guide and search source
        if: ${{ github.event_name == 'push' }}
        run: |
          node scripts/genSearchKeywords.mjs 2>&1 | tee mma-promotion-artifacts/search-generation.log
          node scripts/simGuideHeadings.mjs --refresh /fight-promoter 2>&1 | tee mma-promotion-artifacts/guide-refresh.log
      - name: Type check and build
        id: build
        run: |
          node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee mma-promotion-artifacts/types.log
          npm run build 2>&1 | tee mma-promotion-artifacts/build.log
      - name: Prepare scoped generated pages
        if: ${{ github.event_name == 'push' && !cancelled() && steps.build.outcome == 'success' }}
        run: |
          PRERENDER_ONLY=/fight-promoter,/whats-new node scripts/prerender.mjs 2>&1 | tee mma-promotion-artifacts/prerender.log
          node scripts/genSitemap.mjs 2>&1 | tee mma-promotion-artifacts/sitemap.log
          npm run build 2>&1 | tee mma-promotion-artifacts/generated-build.log
          mkdir -p mma-promotion-artifacts/generated/public/fight-promoter mma-promotion-artifacts/generated/public/whats-new mma-promotion-artifacts/generated/scripts/data mma-promotion-artifacts/generated/src/data/seoMetaParts
          cp public/fight-promoter/index.html mma-promotion-artifacts/generated/public/fight-promoter/index.html
          cp public/whats-new/index.html mma-promotion-artifacts/generated/public/whats-new/index.html
          cp public/sitemap.xml mma-promotion-artifacts/generated/public/sitemap.xml
          cp scripts/data/lastmod.json mma-promotion-artifacts/generated/scripts/data/lastmod.json
          cp scripts/data/guideHeadingsFrozen.json mma-promotion-artifacts/generated/scripts/data/guideHeadingsFrozen.json
          cp src/data/searchKeywords.json mma-promotion-artifacts/generated/src/data/searchKeywords.json
          cp src/data/seoMetaParts/seoMetaPart29.ts mma-promotion-artifacts/generated/src/data/seoMetaParts/seoMetaPart29.ts
          git rev-parse HEAD > mma-promotion-artifacts/generated/source-head.txt
          (cd mma-promotion-artifacts/generated && sha256sum public/fight-promoter/index.html public/whats-new/index.html public/sitemap.xml scripts/data/lastmod.json scripts/data/guideHeadingsFrozen.json src/data/searchKeywords.json src/data/seoMetaParts/seoMetaPart29.ts > SHA256SUMS)
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          const allowed = new Set(['public/fight-promoter/index.html', 'public/whats-new/index.html', 'public/sitemap.xml', 'scripts/data/lastmod.json', 'scripts/data/guideHeadingsFrozen.json', 'src/data/searchKeywords.json', 'src/data/seoMetaParts/seoMetaPart29.ts']);
          const changed = execFileSync('git', ['diff', '--name-only', '--', 'public', 'scripts/data', 'src/data/searchKeywords.json', 'src/data/seoMetaParts'], { encoding: 'utf8' }).trim().split('\n').filter(Boolean);
          assert(changed.every(file => allowed.has(file)), 'Preparation writes only the seven scoped generated files');
          console.log('Scoped generated artifacts:', changed.join(', '));
          NODE
      - name: MMA mounted outcomes distributions and effective controls
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: MMA_PROMOTION_CONTROL=all ONLY=simMmaPromotion node scripts/runAllSims.mjs 2>&1 | tee mma-promotion-artifacts/mma.log
      - name: Existing fight saves careers and scoring
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          failed=0
          for harness in simFightPromoter simFightGym simFightCareer simNbaCareer simNflCareer simMlbCareer simNhlCareer simNoDoubleRecord simScoringCoverage simScoreShown simHarnessAnchors simGuideHeadings simSeoTitles simHomeFront simInventedNames; do
            ONLY="$harness" node scripts/runAllSims.mjs 2>&1 | tee "mma-promotion-artifacts/$harness.log" || failed=1
          done
          exit "$failed"
      - name: All built pages and search readers
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          failed=0
          for harness in simAdsense simBrand simHeadTags simHiddenPages simHubs simIndexNow simIndexing simInternalLinks simNoRivalNames simPrerender simPrerenderBoot simRetiredRoutes simSchema simSitemap simSnapshotAssets simSiteSearch; do
            ONLY="$harness" node scripts/runAllSims.mjs --browser 2>&1 | tee "mma-promotion-artifacts/$harness.log" || failed=1
          done
          exit "$failed"
      - name: Native MMA and saved boxing journeys
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/qa/mmaPromotion1062.mjs 2>&1 | tee mma-promotion-artifacts/native.log
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mma-promotion-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 1
          path: mma-promotion-artifacts/
