name: Club Manager Loan plan qualification
on:
  push:
    branches: [codex/cm-loan-plan-20261027]
    paths: [.github/workflows/cm-loan-plan.yml]
permissions:
  contents: read
concurrency:
  group: cm-loan-plan-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CI: '1'
      SIM_NETWORK: offline
      ENGINES: chromium
      PRERENDER_ONLY: /club-manager,/whats-new
      CM_LOAN_PLAN_ARTIFACTS: ${{ github.workspace }}/cm-loan-plan-artifacts
      FREE_KICK_FONT_CACHE: ${{ github.workspace }}/cm-loan-plan-artifacts/font-cache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Preserve source and install locked dependencies
        run: |
          set -euo pipefail
          mkdir -p "$CM_LOAN_PLAN_ARTIFACTS"
          git rev-parse HEAD > "$CM_LOAN_PLAN_ARTIFACTS/source-head.txt"
          git rev-parse HEAD^{tree} > "$CM_LOAN_PLAN_ARTIFACTS/source-tree.txt"
          git archive --format=tar HEAD > "$CM_LOAN_PLAN_ARTIFACTS/source.tar"
          git archive --format=tar 12c1b2cd001f9309a31a887e5c432ca63c373852 > "$CM_LOAN_PLAN_ARTIFACTS/original-I.tar"
          npm ci
      - name: Exact old app RED, fixed cases, physical controls and paired outcomes
        run: |
          set -euo pipefail
          node scripts/qa/cmLoanPlanQualification.mjs methods 2>&1 | tee "$CM_LOAN_PLAN_ARTIFACTS/controller.log"
      - name: Isolated browser and logo tools
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/loan-plan-browser" --no-save --package-lock=false playwright@1.64.0
          ln -s "$RUNNER_TEMP/loan-plan-browser/node_modules/playwright" node_modules/playwright
          ln -s "$RUNNER_TEMP/loan-plan-browser/node_modules/playwright-core" node_modules/playwright-core
          node "$RUNNER_TEMP/loan-plan-browser/node_modules/playwright/cli.js" install --with-deps chromium
          python -m pip install fonttools pillow
          node scripts/qa/freeKickLab1070.mjs --prefetch-fonts-only > "$CM_LOAN_PLAN_ARTIFACTS/fonts.log" 2>&1
      - name: Production build with Manager and updates snapshots
        run: |
          set -euo pipefail
          mkdir -p "$CM_LOAN_PLAN_ARTIFACTS/generated/before"
          cp public/club-manager/index.html "$CM_LOAN_PLAN_ARTIFACTS/generated/before/club-manager.html"
          cp public/whats-new/index.html "$CM_LOAN_PLAN_ARTIFACTS/generated/before/whats-new.html"
          cp scripts/data/lastmod.json "$CM_LOAN_PLAN_ARTIFACTS/generated/before/lastmod.json"
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" npm run build:seo 2>&1 | tee "$CM_LOAN_PLAN_ARTIFACTS/build.log"
          git diff --binary HEAD -- public scripts/data/lastmod.json > "$CM_LOAN_PLAN_ARTIFACTS/generated.patch"
          mkdir -p "$CM_LOAN_PLAN_ARTIFACTS/generated"
          cp public/club-manager/index.html "$CM_LOAN_PLAN_ARTIFACTS/generated/club-manager.html"
          cp public/whats-new/index.html "$CM_LOAN_PLAN_ARTIFACTS/generated/whats-new.html"
          cp public/sitemap.xml "$CM_LOAN_PLAN_ARTIFACTS/generated/sitemap.xml"
          cp scripts/data/lastmod.json "$CM_LOAN_PLAN_ARTIFACTS/generated/lastmod.json"
      - name: All fifteen actual rebuilt readers
        run: |
          set -euo pipefail
          failed=0
          for harness in simAdsense simBrand simHeadTags simHiddenPages simHubs simIndexNow simIndexing simInternalLinks simNoRivalNames simPrerender simPrerenderBoot simRetiredRoutes simSchema simSitemap simSnapshotAssets; do
            ONLY="$harness" NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/runAllSims.mjs --browser 2>&1 | tee "$CM_LOAN_PLAN_ARTIFACTS/$harness.log" || failed=1
            if ! grep -F 'All 1 harnesses green.' "$CM_LOAN_PLAN_ARTIFACTS/$harness.log"; then failed=1; fi
            if grep -E '(^|[[:space:]])(SKIP|EMPTY)([[:space:]]|$)' "$CM_LOAN_PLAN_ARTIFACTS/$harness.log"; then failed=1; fi
          done
          exit "$failed"
      - name: All fifteen unchanged route download limits
        run: |
          set -euo pipefail
          node scripts/lib/hostLikeServer.mjs dist 4173 > "$CM_LOAN_PLAN_ARTIFACTS/host.log" 2>&1 &
          host_pid=$!
          trap 'kill "$host_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/ > /dev/null
          BASE=http://127.0.0.1:4173 SWEEP_OFFLINE=1 NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/sweepWeight.mjs 2>&1 | tee "$CM_LOAN_PLAN_ARTIFACTS/weights.log"
      - name: Actual LoanPlanCard component on phones and desktop
        run: |
          set -euo pipefail
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/qa/playCmLoanPlanCard.mjs 2>&1 | tee "$CM_LOAN_PLAN_ARTIFACTS/card-browser.log"
      - name: Exact source restoration and holds
        if: always()
        run: |
          set -euo pipefail
          node scripts/qa/cmLoanPlanQualification.mjs final 2>&1 | tee "$CM_LOAN_PLAN_ARTIFACTS/final-holds.log"
      - name: Preserve actual original outputs and source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cm-loan-plan-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          path: cm-loan-plan-artifacts/
