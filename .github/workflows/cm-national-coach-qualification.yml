name: Club Manager national coach shadow qualification
on:
  push:
    branches: [codex/cm-national-coach-shadow-20261026]
permissions:
  contents: read
concurrency:
  group: cm-raw-original-${{ github.ref }}
  cancel-in-progress: false
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: true
      SIM_NETWORK: offline
      CM_RAW_PHASE: national-coach-shadow
      EXPECTED_PARENT: b20ec6664df9d4c58d63ea0596791d33b2a3b8fc
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Bind detached test source and hold every product path
        id: foundation
        timeout-minutes: 5
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/cm-national-coach-qualification"
          test ! -e "$out";test ! -L "$out";mkdir "$out"
          export CM_RAW_OUT="$out";echo "CM_RAW_OUT=$out" >> "$GITHUB_ENV"
          shadow="$RUNNER_TEMP/cm-national-coach-source-shadow"
          test ! -e "$shadow";test ! -L "$shadow"
          export CM_RAW_SHADOW="$shadow";echo "CM_RAW_SHADOW=$shadow" >> "$GITHUB_ENV"
          for name in SIM_SEED BYXI_CONTROL BYXI_SEED BYXI_PRINT_DIGEST NODE_OPTIONS NODE_PATH VITEST ONLY BROWSER TYCOON_AWAY_CONTROL COMPLETION_HOOK OWNED_TIMEOUTS_HOOK CONQUEST_NBA_HOOK CONQUEST_NBA_BOARD POLL_FIXTURES US_BOARD_CONTROL_ALIAS US_BOARD_CONTROL_FILE DAILY_RECORD_CONTROL TYCOON_ROOMS_PAGE TYCOON_LOADS_STADIUM_HOOK TYCOON_LOADS_ACADEMY_HOOK TYCOON_LOADS_STADIUM_LIB TYCOON_LOADS_ACADEMY_LIB TYCOON_PITCH_COMPONENT TYCOON_PACKS_REWARDS TYCOON_PACKS_PANEL NO_DOUBLE_SWAP CM_ACTIVE_WORLD_OUT CM_ACTIVE_WORLD_ROLE;do test ! -v "$name";done
          test "$GITHUB_REPOSITORY" = PapiSalgueroM/ballpark-hero
          test "$GITHUB_REPOSITORY_ID" = 1195729679
          test "$GITHUB_REF" = refs/heads/codex/cm-national-coach-shadow-20261026
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git show -s --format=%P HEAD)" = "$EXPECTED_PARENT"
          test "$(git rev-parse "$EXPECTED_PARENT^{tree}")" = 51e0c6a06a6c4fb7d143b4d408eb5a9437737553
          git diff --name-status "$EXPECTED_PARENT" HEAD > "$out/direct-paths.txt"
          printf 'A\t.github/workflows/cm-national-coach-qualification.yml\nM\tdocs/PROJECT-STATE.md\nA\tsrc/test/clubManagerNationalCoach.test.tsx\n' | cmp - "$out/direct-paths.txt"
          git diff --exit-code "$EXPECTED_PARENT" HEAD -- . ':!.github/workflows/cm-national-coach-qualification.yml' ':!docs/PROJECT-STATE.md' ':!src/test/clubManagerNationalCoach.test.tsx' > "$out/all-other-parent-source-held.log"
          for file in .github/workflows/cm-national-coach-qualification.yml src/test/clubManagerNationalCoach.test.tsx;do test -z "$(git ls-tree -r --name-only "$EXPECTED_PARENT" -- "$file")";done
          git ls-tree -r --name-only "$EXPECTED_PARENT" > "$out/parent-members.txt"
          test "$(wc -l < "$out/parent-members.txt")" -eq 5378
          git rev-parse HEAD > "$out/head.txt";git rev-parse 'HEAD^{tree}' > "$out/tree.txt"
          git ls-files -z | sort -z > "$out/source-members.before"
          test "$(tr -cd '\000' < "$out/source-members.before" | wc -c)" -eq 5380
          xargs -0 sha256sum < "$out/source-members.before" > "$out/source.sha256"
          git status --porcelain --untracked-files=all > "$out/status-before.txt";test ! -s "$out/status-before.txt"
          git diff --exit-code HEAD > "$out/source-clean-before.log"
          git archive --format=tar HEAD > "$out/source.tar"
          printf 'e60ff1534307e449ccef598e3b7470dcba58681b82cea4005cec7319f14f9221  scripts/lib/offlineTransport.cjs\n' | sha256sum -c - > "$out/guard-before.log"
          cat > "$out/helper.payload.gz.b64" <<'CM_RAW_HELPER_GZIP_BASE64'
          
          CM_RAW_HELPER_GZIP_BASE64
          base64 --decode "$out/helper.payload.gz.b64" | gzip -dc > "$out/cm-national-coach-qualification.cjs"
          cat > "$out/candidate.payload.gz.b64" <<'CM_NATIONAL_SOURCE_DATA_GZIP_BASE64'
          
          CM_NATIONAL_SOURCE_DATA_GZIP_BASE64
          base64 --decode "$out/candidate.payload.gz.b64" | gzip -dc > "$out/national-source-data.json"
          cat > "$out/collector.payload.gz.b64" <<'CM_NATIONAL_COLLECTOR_GZIP_BASE64'
          
          CM_NATIONAL_COLLECTOR_GZIP_BASE64
          base64 --decode "$out/collector.payload.gz.b64" | gzip -dc > "$out/recordNationalDefaultOutcomes.mjs"
          printf 'f6fc621c50989320c3c28e5541af2f73f36b964130df70dea2fd0d7765bff551  %s\n9195745d3ee833125693af8be689cfd572225050ba4f3d18cd819264ab03f12f  %s\n2b0fa248d97d7678dcc3211d47865b61d875f4e2cba576f57c1f49636a981ce0  %s\n' "$out/cm-national-coach-qualification.cjs" "$out/national-source-data.json" "$out/recordNationalDefaultOutcomes.mjs" > "$out/generated.sha256"
          printf '2e9afaac5229c2b05891bafe8f1a9320723f7187c3f3cc935abb372000dbb8e1  %s\nc9d892d32fbcf2da2070062a2191e3df35e41d194111d8f0f2239e0787b20ba7  %s\n1722d9a6752e74ed396d9ba19bcd47101236ac2fd0ce23e63185945c33218ed9  %s\n' "$out/helper.payload.gz.b64" "$out/candidate.payload.gz.b64" "$out/collector.payload.gz.b64" > "$out/payload.sha256"
          sha256sum -c "$out/generated.sha256" > "$out/generated-before.log"
          sha256sum -c "$out/payload.sha256" > "$out/payload-before.log"
          : > "$out/foundation.transport";status=0
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$out/foundation.transport" node "$out/cm-national-coach-qualification.cjs" source > "$out/foundation.stdout" 2> "$out/foundation.stderr" &
          pid=$!;printf '%s\n' "$pid" > "$out/foundation.pid";wait "$pid" || status=$?
          printf '%s\n' "$status" > "$out/foundation.exit";test "$status" -eq 0;test ! -s "$out/foundation.transport"
      - name: Install exact locked packages
        id: install
        timeout-minutes: 20
        run: |
          set -euo pipefail
          out="$CM_RAW_OUT";status=0
          npm ci > "$out/npm-ci.stdout" 2> "$out/npm-ci.stderr" &
          pid=$!;printf '%s\n' "$pid" > "$out/npm-ci.pid";wait "$pid" || status=$?
          printf '%s\n' "$status" > "$out/npm-ci.exit";test "$status" -eq 0
          find node_modules -type f -print0 | sort -z > "$out/dependency-members.before"
          test "$(tr -cd '\000' < "$out/dependency-members.before" | wc -c)" -eq 24466
          xargs -0 sha256sum < "$out/dependency-members.before" > "$out/dependencies.sha256"
          find node_modules -type l -printf '%p\t%l\0' | sort -z > "$out/dependency-links.before"
          find node_modules ! -type d ! -type f ! -type l -print > "$out/dependency-nonregular.before"
          test ! -s "$out/dependency-nonregular.before"
      - name: Baseline owned RED types twelve cases legacy outcomes and four physical source triplets
        id: checks
        timeout-minutes: 50
        run: |
          set -euo pipefail
          out="$CM_RAW_OUT"
          sha256sum -c "$out/generated.sha256" > "$out/generated-pre-consumer.log"
          sha256sum -c "$out/payload.sha256" > "$out/payload-pre-consumer.log"
          : > "$out/orchestrator.transport";status=0
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$out/orchestrator.transport" node "$out/cm-national-coach-qualification.cjs" checks > "$out/orchestrator.stdout" 2> "$out/orchestrator.stderr" &
          pid=$!;printf '%s\n' "$pid" > "$out/orchestrator.pid";wait "$pid" || status=$?
          printf '%s\n' "$status" > "$out/orchestrator.exit";test "$status" -eq 0;test ! -s "$out/orchestrator.transport"
      - name: Hold canonical sources dependencies generated helper and shadow restoration
        id: holds
        if: ${{ always() && steps.foundation.outcome != 'skipped' }}
        timeout-minutes: 5
        run: |
          set -euo pipefail
          set +e
          out="$CM_RAW_OUT";failed=0
          for name in source dependencies generated payload;do
            if test -f "$out/$name.sha256" && test ! -L "$out/$name.sha256";then sha256sum -c "$out/$name.sha256" > "$out/$name-hold.log" 2>&1 || failed=1;else printf 'Missing required manifest\n' > "$out/$name-hold.log";failed=1;fi
          done
          git ls-files -z | sort -z > "$out/source-members.after"
          cmp "$out/source-members.before" "$out/source-members.after" > "$out/source-members-hold.log" 2>&1 || failed=1
          xargs -0 sha256sum < "$out/source-members.after" > "$out/source-after.sha256"
          tar --null -T "$out/source-members.after" -cf "$out/source-after.tar" || failed=1
          git diff --exit-code HEAD > "$out/source-dirty-after.log" 2>&1 || failed=1
          git status --porcelain --untracked-files=all > "$out/status-after.txt"
          test -f "$out/status-after.txt" && test ! -s "$out/status-after.txt" && test ! -s "$out/source-dirty-after.log" || failed=1
          find node_modules -type f -print0 | sort -z > "$out/dependency-members.after"
          cmp "$out/dependency-members.before" "$out/dependency-members.after" > "$out/dependency-members-hold.log" 2>&1 || failed=1
          xargs -0 sha256sum < "$out/dependency-members.after" > "$out/dependencies-after.sha256"
          find node_modules -type l -printf '%p\t%l\0' | sort -z > "$out/dependency-links.after"
          cmp "$out/dependency-links.before" "$out/dependency-links.after" > "$out/dependency-links-hold.log" 2>&1 || failed=1
          find node_modules ! -type d ! -type f ! -type l -print > "$out/dependency-nonregular.after";test ! -s "$out/dependency-nonregular.after" || failed=1
          shadow="$CM_RAW_SHADOW"
          if test -d "$shadow" && test ! -L "$shadow";then
            find "$shadow" -type f -print0 | sort -z > "$out/shadow-members.final"
            xargs -0 -r sha256sum < "$out/shadow-members.final" > "$out/shadow-final.sha256"
            find "$shadow" -type l -printf '%p\t%l\0' | sort -z > "$out/shadow-links.final"
            find "$shadow" ! -type d ! -type f ! -type l -print > "$out/shadow-nonregular.final";test ! -s "$out/shadow-nonregular.final" || failed=1
            for file in src/lib/clubManager.ts src/pages/ClubManager.tsx src/lib/soccerInternational.ts src/hooks/useClubManager.ts src/components/club-manager/ClubManagerCareerPanel.tsx src/lib/clubManagerNationalCampaign.ts src/components/club-manager/ClubManagerNationalPanel.tsx scripts/simNationJob.mjs src/test/clubManagerNationalCoach.test.tsx;do
              if test -f "$shadow/$file" && test ! -L "$shadow/$file";then mkdir -p "$out/shadow-final/$(dirname "$file")";cp -- "$shadow/$file" "$out/shadow-final/$file";else failed=1;fi
            done
          else printf 'Required shadow missing\n' > "$out/shadow-nonregular.final";failed=1;fi
          : > "$out/final.transport";status=0
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$out/final.transport" node "$out/cm-national-coach-qualification.cjs" final > "$out/final.stdout" 2> "$out/final.stderr" &
          pid=$!;printf '%s\n' "$pid" > "$out/final.pid";wait "$pid" || status=$?
          printf '%s\n' "$status" > "$out/final.exit";test "$status" -eq 0 || failed=1
          for name in foundation orchestrator final;do
            test -f "$out/$name.transport" && test ! -L "$out/$name.transport" && test ! -s "$out/$name.transport" || failed=1
            test -f "$out/$name.exit" && test ! -L "$out/$name.exit" && test "$(cat "$out/$name.exit")" = 0 || failed=1
          done
          test "$(cat "$out/npm-ci.exit")" = 0 || failed=1
          sha256sum -c "$out/generated.sha256" > "$out/generated-final-hold.log" 2>&1 || failed=1
          sha256sum -c "$out/payload.sha256" > "$out/payload-final-hold.log" 2>&1 || failed=1
          printf '%s\n' "$failed" > "$out/final-holds.exit";exit "$failed"
      - name: Seal originals and partial failures
        if: ${{ always() && steps.foundation.outcome != 'skipped' }}
        run: |
          set -euo pipefail
          out="$CM_RAW_OUT";test -d "$out";cd "$out"
          find . ! -type d ! -type f -print > nonregular.txt
          test ! -s nonregular.txt
          find . -type f ! -name evidence.sha256 -print0 | sort -z | xargs -0 sha256sum > evidence.sha256
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.foundation.outcome != 'skipped' }}
        with:
          name: cm-national-coach-qualification-${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ env.CM_RAW_OUT }}
          if-no-files-found: error
          retention-days: 30
