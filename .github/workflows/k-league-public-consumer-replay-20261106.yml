name: Resume Public V3 consumer from its complete immutable failed original
on:
  push:
    branches: [codex/k-league-public-consumer-replay-20261106]
permissions:
  contents: read
  actions: read
concurrency:
  group: k-league-public-consumer-replay-20261106
  cancel-in-progress: false
env:
  CI: '1'
  TZ: UTC
  PRODUCT: 25193b6efbde2e4855c171a91077efd6647d0285
  PRODUCT_TREE: 4debc9eb6ef46e9ace0c43e9a351e61efc6337c3
  CATALOGUE_BASELINE_LEDGER_BLOB: 5e7505312820030bba74aa43dd6e1f1d9dfa5e18
  PUBLISHED_SOURCE: 15652350f43fa82fa6872357bb1561f948fa150b
  DEPLOY_SOURCE: 15652350f43fa82fa6872357bb1561f948fa150b
  DEPLOYMENT_ID: 979de67b-e1bd-46d0-9115-e28f9939171a
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: af9ceda86b36f5d380e01fe97c8bd33872703c72
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.2'
      - name: Bind the exact original checkout and sole new replay workflow
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/k-league-public-v3-consumer-replay"
          test ! -e "$root"
          mkdir -p "$root/proof/logs"
          export QA_ROOT="$root" QA_PROOF="$root/proof" QA_ORIGINAL="$root/original" QA_WORK="$root/work" QA_DIST="$root/native-reference-docs"
          printf 'QA_ROOT=%s\nQA_PROOF=%s\nQA_ORIGINAL=%s\nQA_WORK=%s\nQA_DIST=%s\n' "$QA_ROOT" "$QA_PROOF" "$QA_ORIGINAL" "$QA_WORK" "$QA_DIST" >> "$GITHUB_ENV"
          test "$(node --version)" = v24.22.2
          test "$(git rev-parse HEAD)" = af9ceda86b36f5d380e01fe97c8bd33872703c72
          test "$(git rev-parse HEAD^{tree})" = 34ba4b6fa423c3ce3570300ddb5337437f955e76
          git fetch --no-tags --depth=2 origin "$GITHUB_SHA" > "$QA_PROOF/logs/replay-source-fetch.log" 2>&1
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse FETCH_HEAD^)" = af9ceda86b36f5d380e01fe97c8bd33872703c72
          git diff --name-status --no-renames HEAD FETCH_HEAD > "$QA_PROOF/replay-qa-delta.txt"
          test "$(cat "$QA_PROOF/replay-qa-delta.txt")" = "$(printf 'A\t.github/workflows/k-league-public-consumer-replay-20261106.yml')"
          git show FETCH_HEAD:.github/workflows/k-league-public-consumer-replay-20261106.yml > "$QA_PROOF/replay-workflow.yml"
          git rev-parse HEAD HEAD^{tree} FETCH_HEAD FETCH_HEAD^{tree} > "$QA_PROOF/source-identity.txt"
          git ls-files -z | xargs -0 sha256sum > "$QA_PROOF/source-before.sha256"
          git ls-files -s > "$QA_PROOF/index-before.txt"
          git ls-files -z > "$QA_PROOF/tracked-before.bin"
          for lock in package.json package-lock.json bun.lock bun.lockb; do if test -f "$lock"; then sha256sum "$lock"; fi; done > "$QA_PROOF/locks-before.sha256"
          git status --porcelain=v1 --untracked-files=all > "$QA_PROOF/status-before.txt"
          test ! -s "$QA_PROOF/status-before.txt"
