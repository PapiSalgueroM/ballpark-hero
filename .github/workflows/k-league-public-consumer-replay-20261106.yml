          const rows=inventory(original);assert.equal(rows.length,A.regularFiles);assert.equal(rows.reduce((n,r)=>n+r.bytes,0),A.regularBytes);fs.writeFileSync(out+'/original-files-before.json',json(rows));fs.writeFileSync(out+'/original-envelope.json',json(A));fs.writeFileSync(out+'/allowed-consumer-additions.json',json(allowed));
          assert.equal(blob(fs.readFileSync(original+'/workflow.yml')),A.workflowBlob);assert.equal(blob(fs.readFileSync(A.workflow)),A.workflowBlob);assert.equal(sha(fs.readFileSync(original+'/browser/report.json')),'b0ff4faef2a9e2a88dc9fd9baacc64ef4b86846547863584dbc519dbabf9fcc0');
          for(const name of ['types','browser','assets-before','assets-after','final-source-holds'])assert.equal(fs.readFileSync(original+'/logs/'+name+'.exit','utf8'),'0\n');
          assert.equal(fs.readFileSync(original+'/logs/public-admission.exit','utf8'),'1\n');const stderr=fs.readFileSync(original+'/logs/public-admission.stderr.log');assert.equal(stderr.length,947);assert.equal(sha(stderr),'322f86170278df5fe066e953f4c4e0169d9b60383ed49e4a3bb2e90dc139db18');assert(stderr.toString().includes('/host-telemetry/host-telemetry/k-cm-320-copied-host-body-control.js'));fs.copyFileSync(original+'/logs/public-admission.exit',out+'/original-public-admission.exit');fs.writeFileSync(out+'/original-public-admission.stderr.log',stderr);
          for(const file of allowed)assert(!fs.existsSync(original+'/'+file),'All7 consumer outputs absent originally '+file);
          fs.cpSync(original,work,{recursive:true,force:false,errorOnExist:true});assert.deepEqual(inventory(work),rows);
          const m=JSON.parse(fs.readFileSync(original+'/public-manifest.json'));assert.deepEqual(m.product,{commit:e.PRODUCT,tree:e.PRODUCT_TREE});assert.equal(m.distDigest,'d3f13fbe07c8e984a34573e1a9b2d3764c7f3fd8356d7a09b6684aaf43503570');assert.equal(m.completedTar.sha256,'bdda3188c8460b1588f83bf45c2c01a3d429b2e2a17d803eef6e8457401aadc1');assert.equal(m.distBefore.length,852);
