          const call=(label,command,args,binary=false)=>{const r=spawnSync(command,args,{encoding:binary?null:'utf8',maxBuffer:64*1024*1024});fs.writeFileSync(out+'/logs/'+label+'.native.json',json({command:[command,...args],status:r.status,signal:r.signal,error:r.error?String(r.error):null}));fs.writeFileSync(out+'/logs/'+label+'.stderr.log',r.stderr??'');if(!binary)fs.writeFileSync(out+'/logs/'+label+'.stdout.log',r.stdout??'');assert.equal(r.status,0,label);assert.equal(r.signal,null);assert.equal(r.error,undefined);return r.stdout;};
          const api=(label,url)=>JSON.parse(call(label,'gh',['api','repos/PapiSalgueroM/ballpark-hero/'+url]));
