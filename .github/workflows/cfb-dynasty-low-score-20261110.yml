name: College Football Dynasty ordinary scoring physical controls
on:
  push:
    branches: [codex/cfb-dynasty-low-score-controls-qa-20261110]
permissions:
  actions: read
  contents: read
jobs:
  controls:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: UTC
      SIM_NETWORK: offline
      SIM_OFFLINE_RECEIPT: cfb-dynasty-low-score-controls/offline.log
      EVIDENCE: cfb-dynasty-low-score-controls
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - name: Authenticate admitted references and exact physical scoring sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test ! -e "$EVIDENCE"
          mkdir "$EVIDENCE"
          touch "$SIM_OFFLINE_RECEIPT"
          git rev-parse HEAD > "$EVIDENCE/head.txt"
          git rev-parse 'HEAD^{tree}' > "$EVIDENCE/tree.txt"
          git ls-files -s > "$EVIDENCE/source-before.txt"
          sha256sum package.json package-lock.json > "$EVIDENCE/locks-before.txt"
          git fetch --no-tags --depth=1 origin 078a6613532523fa8553ad4e52718fd7bc2e6576
          cat > "$EVIDENCE/qualify.mjs" <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          import { execFileSync, spawnSync } from 'node:child_process';

          const { EVIDENCE: out, GITHUB_SHA: head, SIM_OFFLINE_RECEIPT: offline } = process.env;
          const repo = 'PapiSalgueroM/ballpark-hero';
          const workflow = '.github/workflows/cfb-dynasty-low-score-20261110.yml';
          const engine = 'src/lib/cfbDynasty.ts';
          const refs = {
            original: {"run":42779683354,"job":129706427324,"artifact":13745716915,"steps":12,"bodies":20,"head":"078a6613532523fa8553ad4e52718fd7bc2e6576","tree":"3ae058504729d29e506730d750d31d897f83228c","workflow":"aeba36724cfe71159d34dcc02dba94911f4fd6ab","branch":"codex/cfb-dynasty-low-score-original-qa-20261110","zipBytes":1000260,"zipSHA256":"85f9e21f73d2dc6c51beb5336d1fb93e5d2851c847771b5c040cd28dc262edad","auditSHA256":"d8a6b24bdad8511a7424e8d9392e3e0f17c1d273a2d78c40821dbd9486029c80","raw":{"bytes":220953,"sha256":"78876204ed6667d048d4027da511a234c0a8a173120c2989383ab09fcaad12a7"}},
            fixed: {
              head: '93b021bc1e3c256847a0553ade9995420b57de02', tree: '62a47af05f8f6da523f7c2a9e42b78981dcb7a78',
              workflow: '0dbd300a3d900b3f42258e868653d07901acaeeb', branch: 'codex/cfb-dynasty-low-score-fixed-qa-20261110',
              run: Number('42783901125'), job: Number('129720258016'), artifact: Number('13746984029'),
              steps: Number('13'), bodies: Number('22'),
              zipBytes: Number('1003481'), zipSHA256: '90e0dca085cf20eaad6d5e9ec6b7a5c5ba5809b426823d91f187ef5e792f9f55', auditSHA256: 'b0a90cbc6f9a760ec4db08262a3a482a3935f3f94de47e3f760d5521e986a590',
              raw: { bytes: Number('220953'), sha256: '8fd0e4fd7cafa3ecb81833a906ab2732b4757d0e7b26bd1aedeee7dab821bc89' },
              boundary: { bytes: Number('43716'), sha256: '3fc4693923540dfaa4f66fa008eec237f13391ae3d4010f9c54d2e7d1b738949' },
            },
          };
          const enginePins = {
            original: { bytes: 41501, blob: '3f038157f234d25fcae06860d1d8efeaa632fb9f', sha256: 'd297966d242be2007ad6025ecd057064e120b878d1b8ff8156ff53019b777d32' },
            fixed: { bytes: 41767, blob: '65a4def674bfbcc5d16f6ad6b82138ebf0a793d1', sha256: '2197316397a80ca21d6631f37303c632b7cd4eafffff68c3f94d93a5e98f7ca9' },
          };
          const suites = {"src/components/cfb-dynasty/CfbDynastyBoard.test.tsx":["draws the recap again after a reload and does not replay the season","opens an older recap save on the recruiting trail instead of the final week","refuses to run the final week twice for one season"],"src/components/cfb-dynasty/CfbDynastyDepth.test.tsx":["plays a save from before coordinators existed without adding anything to it","gives a new dynasty its coordinators and a schedule with a strength","refuses a coordinator the pot cannot cover and changes nothing","lets a coordinator go, puts his pay back in the pot, and hires into the empty chair"],"src/lib/cfbDynastyLowScore.test.ts":["keeps neutral and legal low scores on the scheduled slate","keeps the depth-disabled legacy round","does not manufacture one point in ordinary coordinator-adjusted scoring"],"src/lib/cfbDynastyScoreBoundary.test.ts":["uses the strict shutout cutoff for the away loser","uses the strict shutout cutoff for the home loser","keeps staff caps and monotonic scores through the low-score floor"]};
          const command = [
            'run', 'src/lib/cfbDynastyLowScore.test.ts', 'src/lib/cfbDynastyScoreBoundary.test.ts',
            'src/components/cfb-dynasty/CfbDynastyBoard.test.tsx', 'src/components/cfb-dynasty/CfbDynastyDepth.test.tsx',
            '--reporter=default', '--reporter=json',
          ];
          const reds = new Map([
            [suites['src/lib/cfbDynastyLowScore.test.ts'][2], 'CFB_DYNASTY_ORDINARY_ONE_POINT'],
            [suites['src/lib/cfbDynastyScoreBoundary.test.ts'][0], 'CFB_DYNASTY_AWAY_LOSER_SCORE_CUTOFF'],
            [suites['src/lib/cfbDynastyScoreBoundary.test.ts'][1], 'CFB_DYNASTY_HOME_LOSER_SCORE_CUTOFF'],
            [suites['src/lib/cfbDynastyScoreBoundary.test.ts'][2], 'CFB_DYNASTY_LOW_SCORE_STAFF_CAP_FLOOR'],
          ]);

          const maxBuffer = 64 * 1024 * 1024;
          const cmd = (file, ...args) => execFileSync(file, args, { maxBuffer });
          const git = (...args) => cmd('git', ...args).toString('utf8');
          const save = (file, value) => fs.writeFileSync(out + '/' + file, JSON.stringify(value, null, 2) + '\n');
          const body = file => fs.readFileSync(out + '/' + file);
          const hash = (algorithm, bytes) => createHash(algorithm).update(bytes).digest('hex');
          const sha = bytes => hash('sha256', bytes);
          const blob = bytes => hash('sha1', Buffer.concat([Buffer.from('blob ' + bytes.length + '\0'), bytes]));
          const exact = (bytes, pin) => assert.deepEqual([bytes.length, sha(bytes)], [pin.bytes, pin.sha256]);
          const zip = role => out + '/reference-' + role + '.zip';
          const refBody = (role, file) => cmd('unzip', '-p', zip(role), file);
          const parse = bytes => JSON.parse(bytes);

          function authenticate(role, pin) {
            assert([pin.run, pin.job, pin.artifact, pin.steps, pin.bodies, pin.zipBytes, pin.raw.bytes].every(value => Number.isSafeInteger(value) && value > 0));
            for (const digest of [pin.zipSHA256, pin.auditSHA256, pin.raw.sha256]) assert.match(digest, /^[0-9a-f]{64}$/);
            if (pin.boundary) {
              assert(Number.isSafeInteger(pin.boundary.bytes) && pin.boundary.bytes > 0);
              assert.match(pin.boundary.sha256, /^[0-9a-f]{64}$/);
            }
            const api = endpoint => parse(cmd('gh', 'api', 'repos/' + repo + '/actions/' + endpoint));
            const run = api('runs/' + pin.run);
            const jobs = api('runs/' + pin.run + '/jobs?per_page=100').jobs;
            const artifacts = api('runs/' + pin.run + '/artifacts?per_page=100').artifacts;
            assert.deepEqual([run.id, run.status, run.conclusion, run.event, run.run_attempt, run.path, run.head_sha, run.head_commit.tree_id, run.repository.full_name, run.head_branch],
              [pin.run, 'completed', 'success', 'push', 1, workflow, pin.head, pin.tree, repo, pin.branch]);
            assert.equal(jobs.length, 1);
            const [job] = jobs;
            assert.deepEqual([job.id, job.run_id, job.status, job.conclusion, job.head_sha, job.steps.length], [pin.job, pin.run, 'completed', 'success', pin.head, pin.steps]);
            assert(job.steps.every(step => step.status === 'completed' && step.conclusion === 'success'));
            assert.equal(artifacts.length, 1);
            const [artifact] = artifacts;
            assert.deepEqual([artifact.id, artifact.name, artifact.expired, artifact.size_in_bytes, artifact.digest, artifact.workflow_run.id, artifact.workflow_run.head_sha],
              [pin.artifact, 'cfb-dynasty-low-score-' + role + '-' + pin.run, false, pin.zipBytes, 'sha256:' + pin.zipSHA256, pin.run, pin.head]);
            const archive = cmd('gh', 'api', 'repos/' + repo + '/actions/artifacts/' + pin.artifact + '/zip');
            exact(archive, { bytes: pin.zipBytes, sha256: pin.zipSHA256 });
            fs.writeFileSync(zip(role), archive);
            const names = cmd('unzip', '-Z', '-1', zip(role)).toString('utf8').trimEnd().split('\n');
            assert.equal(names.length, pin.bodies);
            assert.equal(new Set(names).size, pin.bodies);
            assert(names.every(name => /^[a-zA-Z0-9_.-]+$/.test(name) && name !== '.' && name !== '..'));
            assert.deepEqual([refBody(role, 'head.txt').toString().trim(), refBody(role, 'tree.txt').toString().trim()], [pin.head, pin.tree]);
            const source = parse(refBody(role, 'source-receipt.json'));
            assert.deepEqual([source.head, source.tree, source.ownedWorkflow], [pin.head, pin.tree, pin.workflow]);
            exact(refBody(role, 'public-cases.raw.json'), pin.raw);
            if (pin.boundary) {
              exact(refBody(role, 'score-boundary.raw.json'), pin.boundary);
              const fixed = parse(refBody(role, 'fixed-result.json'));
              assert.deepEqual([fixed.status, fixed.cases, fixed.passed, fixed.failed], ['passed', 13, 13, 0]);
              assert.deepEqual([fixed.originalFixedRaw.bytes, fixed.originalFixedRaw.sha256], [pin.raw.bytes, pin.raw.sha256]);
              assert.deepEqual([fixed.boundary.bytes, fixed.boundary.sha256, fixed.boundary.rounds, fixed.boundary.games, fixed.boundary.draws], [pin.boundary.bytes, pin.boundary.sha256, 28, 616, 1848]);
            }
            save('reference-' + role + '.json', { run, jobs, artifact, names, independentAuditSHA256: pin.auditSHA256 });
          }

          const diff = () => git('diff', '--no-ext-diff', '--name-only', '-z', 'HEAD', '--').split('\0').filter(Boolean);
          const index = () => cmd('git', 'ls-files', '-s');
          const files = () => git('ls-files', '-z').split('\0').filter(Boolean);
          function snapshots() {
            const rows = files().map(file => {
              const bytes = fs.readFileSync(file);
              return [file, bytes.length, sha(bytes)];
            });
            const lock = parse(fs.readFileSync('package-lock.json'));
            const installed = Object.entries(lock.packages).filter(([file]) =>
              file.startsWith('node_modules/') && fs.existsSync(file + '/package.json')
            ).map(([file, entry]) => {
              const version = parse(fs.readFileSync(file + '/package.json')).version;
              assert.equal(version, entry.version, file);
              return [file, version];
            });
            assert.equal(rows.length, 5799);
            assert.equal(installed.length, 521);
            assert.equal(fs.statSync(offline).size, 0);
            return { rows, installed };
          }

          function prepare() {
            assert.equal(process.env.GITHUB_REPOSITORY, repo);
            assert.deepEqual(git('rev-list', '--parents', '-n', '1', 'HEAD').trim().split(' '), [head, refs.fixed.head]);
            assert.equal(git('rev-parse', refs.fixed.head + '^{tree}').trim(), refs.fixed.tree);
            assert.equal(git('rev-parse', refs.original.head + '^{tree}').trim(), refs.original.tree);
            assert.equal(git('rev-parse', refs.fixed.head + ':' + workflow).trim(), refs.fixed.workflow);
            assert.deepEqual(git('diff', '--name-only', '-z', refs.fixed.head, head).split('\0').filter(Boolean), [workflow]);
            const tree = ref => git('ls-tree', '-r', '-z', ref).split('\0').filter(Boolean);
            const current = tree(head);
            const fixed = tree(refs.fixed.head);
            const other = rows => rows.filter(row => row.split('\t')[1] !== workflow);
            assert.equal(current.length, 5799);
            assert.equal(fixed.length, 5799);
            assert.equal(current.filter(row => /^(src|public|scripts)\//.test(row.split('\t')[1])).length, 4668);
            assert.equal(other(current).length, 5798);
            assert.deepEqual(other(current), other(fixed));
            assert.deepEqual(diff(), []);
            for (const [role, pin] of Object.entries(refs)) authenticate(role, pin);
            for (const [role, pin] of Object.entries(enginePins)) {
              assert.equal(git('rev-parse', refs[role].head + ':' + engine).trim(), pin.blob);
              const bytes = cmd('git', 'cat-file', 'blob', pin.blob);
              exact(bytes, pin);
              assert.equal(blob(bytes), pin.blob);
              fs.writeFileSync(out + '/engine-' + role + '.ts', bytes);
            }
            assert(fs.readFileSync(engine).equals(body('engine-fixed.ts')));
            const edits = [{"old":"function scoreFor(win: boolean, rng: () => number): number {\n  return win ? 24 + Math.floor(rng() * 32) : 3 + Math.floor(rng() * 25);\n}","next":"const CFB_SHUTOUT_RATE = 0.0175;\n\nfunction scoreFor(win: boolean, roll: number): number {\n  return win ? 24 + Math.floor(roll * 32) : 3 + Math.floor(roll * 25);\n}\n\nfunction scoreWithStaff(win: boolean, edge: number, rng: () => number): number {\n  const roll = rng();\n  // Keep the same shutout draws across staff ratings so the score cap still holds.\n  if (!win && roll < CFB_SHUTOUT_RATE) return 0;\n  return Math.max(2, Math.round(scoreFor(win, roll) + CFB_POINTS_PER_EDGE * edge));\n}"},{"old":"    let hs = scoreFor(homeWins, rng);\n    const as = scoreFor(!homeWins, rng);","next":"    let hs = scoreFor(homeWins, rng());\n    const as = scoreFor(!homeWins, rng());"},{"old":"  const hs = Math.max(0, Math.round(scoreFor(homeWins, rng) + CFB_POINTS_PER_EDGE * (h.off - a.def)));\n  const as = Math.max(0, Math.round(scoreFor(!homeWins, rng) + CFB_POINTS_PER_EDGE * (a.off - h.def)));","next":"  const hs = scoreWithStaff(homeWins, h.off - a.def, rng);\n  const as = scoreWithStaff(!homeWins, a.off - h.def, rng);"}];
            const apply = (input, from, to) => edits.reduce((source, edit) => {
              assert.equal(source.split(edit[from]).length, 2);
              return source.replace(edit[from], () => edit[to]);
            }, input.toString('utf8'));
            const originalEngine = body('engine-original.ts');
            const fixedEngine = body('engine-fixed.ts');
            assert(!originalEngine.equals(fixedEngine));
            assert(fixedEngine.equals(Buffer.from(apply(originalEngine, 'old', 'next'))));
            assert(originalEngine.equals(Buffer.from(apply(fixedEngine, 'next', 'old'))));
            save('source-receipt.json', {
              head, tree: git('rev-parse', 'HEAD^{tree}').trim(),
              workflow: git('rev-parse', 'HEAD:' + workflow).trim(), parent: refs.fixed.head, parentTree: refs.fixed.tree,
              trackedRows: 5799, heldRows: 5798, sourceRows: 4668, rootConfigurations: 11, enginePins, references: refs,
            });
          }

          function runRole(role, expectedEngine, indexBefore, before, locks) {
            fs.mkdirSync(out + '/' + role);
            const at = name => out + '/' + role + '/' + name;
            const isOriginal = role === 'original';
            const verifyPhysical = () => {
              const expectedDiff = isOriginal ? [engine] : [];
              assert.deepEqual(diff(), expectedDiff);
              assert(index().equals(indexBefore));
              assert(fs.readFileSync(engine).equals(expectedEngine));
              const state = snapshots();
              const wanted = before.rows.map(row => isOriginal && row[0] === engine
                ? [engine, enginePins.original.bytes, enginePins.original.sha256] : row);
              assert.deepEqual(state.rows, wanted);
              assert.deepEqual(state.installed, before.installed);
              assert(cmd('sha256sum', 'package.json', 'package-lock.json').equals(locks));
              return {
                engine: { blob: blob(expectedEngine), bytes: expectedEngine.length, sha256: sha(expectedEngine) },
                trackedRows: state.rows.length, trackedSHA256: sha(JSON.stringify(state.rows)), diff: expectedDiff,
                indexSHA256: sha(indexBefore), locksSHA256: sha(locks),
                installedVersions: state.installed.length, installedSHA256: sha(JSON.stringify(state.installed)), offlineBytes: 0,
              };
            };
            const physicalBefore = verifyPhysical();
            fs.writeFileSync(at('engine.ts'), expectedEngine);
            const result = spawnSync('node_modules/.bin/vitest', [...command, '--outputFile=' + at('vitest.json')], {
              maxBuffer,
              env: { ...process.env, NODE_OPTIONS: '--require=' + process.cwd() + '/scripts/lib/offlineTransport.cjs',
                CFB_DYNASTY_LOW_SCORE_RAW: at('public-cases.raw.json'), CFB_DYNASTY_SCORE_BOUNDARY_RAW: at('score-boundary.raw.json') },
            });
            const log = Buffer.concat([result.stdout ?? Buffer.alloc(0), result.stderr ?? Buffer.alloc(0)]);
            fs.writeFileSync(at('vitest.log'), log);
            process.stdout.write(log);
            fs.writeFileSync(at('vitest-exit.txt'), String(result.status) + '\n');
            const physicalAfter = verifyPhysical();
            assert.deepEqual(physicalAfter, physicalBefore);
            assert.ifError(result.error);
            assert.equal(result.signal, null);
            assert.equal(result.status, isOriginal ? 1 : 0);
            assert(!/SIM_OFFLINE_BLOCK|Unhandled Errors?|Unhandled Rejection|Uncaught Exception|Failed Suites|Worker exited|Test timed out/i.test(log.toString()));
            const report = parse(fs.readFileSync(at('vitest.json')));
            assert.deepEqual([report.success, report.numTotalTests, report.numPassedTests, report.numFailedTests, report.numPendingTests, report.numTodoTests],
              [!isOriginal, 13, isOriginal ? 9 : 13, isOriginal ? 4 : 0, 0, 0]);
            for (const key of ['errors', 'unhandledErrors', 'testExecutionErrors']) if (Object.hasOwn(report, key)) assert.deepEqual(report[key], []);
            for (const key of ['numRuntimeErrorTestSuites', 'numUnhandledErrors']) if (Object.hasOwn(report, key)) assert.equal(report[key], 0);
            assert.equal(report.testResults.length, 4);
            const seenReds = [];
            for (const [file, titles] of Object.entries(suites)) {
              const matches = report.testResults.filter(suite => suite.name.endsWith('/' + file));
              assert.equal(matches.length, 1, file);
              const [suite] = matches;
              const failed = isOriginal && titles.some(title => reds.has(title));
              assert.deepEqual([suite.status, suite.message], [failed ? 'failed' : 'passed', '']);
              assert.deepEqual(suite.assertionResults.map(row => row.title).sort(), [...titles].sort());
              for (const row of suite.assertionResults) {
                const marker = isOriginal && reds.get(row.title);
                if (marker) {
                  assert.equal(row.status, 'failed', row.title);
                  assert.equal(row.failureMessages.length, 1, row.title);
                  assert(row.failureMessages[0].startsWith('AssertionError: ' + marker + ':'), row.failureMessages[0]);
                  seenReds.push(marker);
                } else assert.deepEqual([row.status, row.failureMessages], ['passed', []], row.title);
              }
            }
            assert.deepEqual(seenReds.sort(), isOriginal ? [...reds.values()].sort() : []);
            const raw = fs.readFileSync(at('public-cases.raw.json'));
            const boundary = fs.readFileSync(at('score-boundary.raw.json'));
            const referenceRole = isOriginal ? 'original' : 'fixed';
            assert(raw.equals(refBody(referenceRole, 'public-cases.raw.json')));
            const fixedBoundary = refBody('fixed', 'score-boundary.raw.json');
            if (isOriginal) verifyOriginalBoundary(boundary, fixedBoundary);
            else assert(boundary.equals(fixedBoundary));
            const tuple = data => ({ bytes: data.length, sha256: sha(data) });
            const checks = {
              cases: 13, passes: isOriginal ? 9 : 13, namedAssertionErrors: seenReds, referenceRole,
              originalRegression: tuple(raw), boundary: tuple(boundary),
              originalRegressionLiteral: true, boundaryLiteralToFixed: !isOriginal,
              originalBoundaryExactExpectedDelta: isOriginal,
              physical: { before: physicalBefore, after: physicalAfter },
            };
            save(role + '/result.json', checks);
            return checks;
          }

          function verifyOriginalBoundary(actual, fixed) {
            const expected = parse(fixed);
            const cutoff = [1, 3, 1, 3, 1];
            const staff = [0, 1, 2, 2, 3, 4, 4, 3, 2];
            const scores = { awayCutoff: cutoff, homeCutoff: cutoff, staffFloor: [...staff, ...staff] };
            for (const [key, values] of Object.entries(scores)) {
              assert.equal(expected.cases[key].length, values.length);
              for (const [i, row] of expected.cases[key].entries()) {
                const homeLoser = row.side === 'home';
                const score = values[i];
                row.target[homeLoser ? 'hs' : 'as'] = score;
                row.games[0][homeLoser ? 2 : 3] = score;
                row.mySlate[0][homeLoser ? 'us' : 'them'] = score;
              }
            }
            assert(actual.equals(Buffer.from(JSON.stringify(expected) + '\n')));
          }

          function qualify() {
            const indexBefore = body('source-before.txt');
            const locks = body('locks-before.txt');
            assert(index().equals(indexBefore));
            const before = snapshots();
            assert.deepEqual(before, { rows: parse(body('tracked-before.json')), installed: parse(body('installed-before.json')) });
            const fixedRows = parse(refBody('fixed', 'tracked-before.json'));
            const held = rows => rows.filter(row => row[0] !== workflow);
            assert.equal(held(before.rows).length, 5798);
            assert.deepEqual(held(before.rows), held(fixedRows));
            assert.deepEqual(before.installed, parse(refBody('fixed', 'installed-before.json')));
            assert(locks.equals(refBody('fixed', 'locks-before.txt')));
            const fixed = body('engine-fixed.ts');
            const original = body('engine-original.ts');
            const runs = {};
            try {
              runs.fixed = runRole('fixed', fixed, indexBefore, before, locks);
              fs.writeFileSync(engine, original);
              runs.original = runRole('original', original, indexBefore, before, locks);
            } finally {
              fs.writeFileSync(engine, fixed);
              assert(fs.readFileSync(engine).equals(fixed));
            }
            runs.restored = runRole('restored', fixed, indexBefore, before, locks);
            for (const file of ['public-cases.raw.json', 'score-boundary.raw.json']) assert(body('fixed/' + file).equals(body('restored/' + file)));
            const after = snapshots();
            assert.deepEqual(after, before);
            save('admission.json', {
              status: 'passed', roleOrder: Object.keys(runs), cases: 39, passes: 35, namedBusinessFailures: 4,
              runs, references: refs, source: parse(body('source-receipt.json')),
              onlyPhysicalProductPath: engine, restoredExactFixed: true, bothFixedRestoredRawBodiesLiteral: true,
              installedVersions: 521, indexHeld: true, locksHeld: true, offlineBytes: 0,
            });
          }

          function freeze() {
            const before = snapshots();
            assert.deepEqual(diff(), []);
            assert(index().equals(body('source-before.txt')));
            assert(fs.readFileSync(engine).equals(body('engine-fixed.ts')));
            save('tracked-before.json', before.rows);
            save('installed-before.json', before.installed);
          }

          function finalHolds() {
            const after = snapshots();
            assert.deepEqual(diff(), []);
            assert(index().equals(body('source-before.txt')));
            assert(fs.readFileSync(engine).equals(body('engine-fixed.ts')));
            assert.deepEqual(after, { rows: parse(body('tracked-before.json')), installed: parse(body('installed-before.json')) });
            assert(cmd('sha256sum', 'package.json', 'package-lock.json').equals(body('locks-before.txt')));
            save('tracked-after.json', after.rows);
            save('installed-after.json', after.installed);
            save('final-holds.json', { status: 'passed', trackedRows: after.rows.length, installedVersions: after.installed.length, index: true, locks: true, engineRestored: true, offlineBytes: 0 });
          }

          const mode = process.argv[2];
          if (mode === 'prepare') prepare();
          else if (mode === 'freeze') freeze();
          else if (mode === 'qualify') qualify();
          else if (mode === 'final') finalHolds();
          else throw new Error('Unknown CFB scoring controls mode');
          NODE
          node "$EVIDENCE/qualify.mjs" prepare
      - name: Install locked dependencies and freeze physical source
        run: |
          set -euo pipefail
          npm ci 2>&1 | tee "$EVIDENCE/install.log"
          node "$EVIDENCE/qualify.mjs" freeze
      - name: Proper app types before controls
        run: |
          set -euo pipefail
          node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee "$EVIDENCE/types-before.log"
      - name: Run fixed, physical original and restored fixed scoring controls
        run: node "$EVIDENCE/qualify.mjs" qualify
      - name: Proper app types after restoration
        run: |
          set -euo pipefail
          node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee "$EVIDENCE/types-after.log"
      - name: Verify exact physical restoration, locked versions and offline holds
        if: always()
        run: |
          set -euo pipefail
          git ls-files -s > "$EVIDENCE/source-after.txt"
          sha256sum package.json package-lock.json > "$EVIDENCE/locks-after.txt"
          cmp "$EVIDENCE/source-before.txt" "$EVIDENCE/source-after.txt"
          cmp "$EVIDENCE/locks-before.txt" "$EVIDENCE/locks-after.txt"
          node "$EVIDENCE/qualify.mjs" final
          test ! -s "$SIM_OFFLINE_RECEIPT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cfb-dynasty-low-score-controls-${{ github.run_id }}
          path: cfb-dynasty-low-score-controls
          retention-days: 14
          if-no-files-found: error
