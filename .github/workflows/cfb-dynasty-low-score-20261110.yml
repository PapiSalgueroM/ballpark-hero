    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact qualified fixed parent and sole native QA scope
        run: |
          set -euo pipefail
          test ! -e "$EVIDENCE"
          mkdir "$EVIDENCE"
          touch "$SIM_OFFLINE_RECEIPT"
          git rev-parse HEAD > "$EVIDENCE/head.txt"
          git rev-parse 'HEAD^{tree}' > "$EVIDENCE/tree.txt"
          git ls-files -s > "$EVIDENCE/source-before.txt"
          sha256sum package.json package-lock.json > "$EVIDENCE/locks-before.txt"
          git diff --exit-code HEAD -- .
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';import fs from 'node:fs';import {execFileSync} from 'node:child_process';
          const env=process.env,out=env.EVIDENCE,head=env.GITHUB_SHA,fixedHead=env.CFB_DYNASTY_LOW_SCORE_FIXED_HEAD,fixedTree=env.CFB_DYNASTY_LOW_SCORE_FIXED_TREE;
          const workflow='.github/workflows/cfb-dynasty-low-score-20261110.yml',helper='scripts/qa/playCfbDynastyLowScore.mjs';
          const git=(...args)=>execFileSync('git',args,{encoding:'utf8',maxBuffer:16*1024*1024}).trimEnd();
          const tree=ref=>git('ls-tree','-r','-z',ref).split('\0').filter(Boolean),held=rows=>rows.filter(row=>![workflow,helper].includes(row.split('\t')[1]));
          assert.deepEqual(git('rev-list','--parents','-n','1','HEAD').split(' '),[head,fixedHead]);
          assert.equal(git('rev-parse',fixedHead+'^{tree}'),fixedTree);
          assert.equal(git('rev-parse',fixedHead+':'+workflow),env.CFB_DYNASTY_LOW_SCORE_FIXED_WORKFLOW);
          assert.equal(git('rev-parse','HEAD:'+helper),env.CFB_DYNASTY_LOW_SCORE_HELPER_BLOB);
          assert.equal(git('rev-parse','HEAD:src/lib/cfbDynasty.ts'),env.CFB_DYNASTY_LOW_SCORE_PRODUCT_BLOB);
          const before=tree(fixedHead),after=tree('HEAD');
          assert.deepEqual([before.length,after.length,held(before).length],[5799,5800,5798]);
          assert.deepEqual(held(after),held(before));
          assert.equal(after.filter(row=>/^(src|public|scripts)\//.test(row.split('\t')[1])).length,4669);
          assert.deepEqual(git('diff','--name-status',fixedHead,'HEAD').split('\n').sort(),['A\t'+helper,'M\t'+workflow].sort());
          fs.writeFileSync(out+'/source-join.json',JSON.stringify({status:'passed',head,tree:git('rev-parse','HEAD^{tree}'),fixedHead,fixedTree,workflow:git('rev-parse','HEAD:'+workflow),helperBlob:env.CFB_DYNASTY_LOW_SCORE_HELPER_BLOB,pins:{'src/lib/cfbDynasty.ts':env.CFB_DYNASTY_LOW_SCORE_PRODUCT_BLOB},heldRows:5798,trackedRows:5800,scopedSourceRows:4669,rootConfigurations:11},null,2));
          NODE
      - name: Install locked dependencies and freeze physical source
        run: |
          set -euo pipefail
          npm ci 2>&1 | tee "$EVIDENCE/install.log"
          cat > "$EVIDENCE/physical.mjs" <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          const stage = process.argv[2];
          assert(['before', 'after'].includes(stage));
          const out = process.env.EVIDENCE;
          const index = execFileSync('git', ['ls-files', '-z'], { encoding: 'utf8' }).split('\0').filter(Boolean);
          const source = index.map(file => {
            const bytes = fs.readFileSync(file);
            return [file, bytes.length, createHash('sha256').update(bytes).digest('hex')];
          });
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const installed = Object.entries(lock.packages).filter(([file]) =>
            file.startsWith('node_modules/') && fs.existsSync(file + '/package.json')
          ).map(([file, entry]) => {
            const version = JSON.parse(fs.readFileSync(file + '/package.json', 'utf8')).version;
            assert.equal(version, entry.version, file);
            return [file, version];
          });
          assert.equal(source.length, 5800);
          assert.equal(installed.length, 521);
          assert.equal(fs.statSync(process.env.SIM_OFFLINE_RECEIPT).size, 0);
          for (const [name, data] of [['tracked', source], ['installed', installed]]) {
            const body = JSON.stringify(data);
            if (stage === 'after') assert.equal(body, fs.readFileSync(out + '/' + name + '-before.json', 'utf8'));
            fs.writeFileSync(out + '/' + name + '-' + stage + '.json', body);
          }
          NODE
          node "$EVIDENCE/physical.mjs" before
      - name: Proper app types
        run: |
          set -euo pipefail
          node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee "$EVIDENCE/types.log"
