          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$SEO_SPLIT_BASE_REF"
          export ONLY="simAdsense,simBrand,simHeadTags,simHiddenPages,simHubs,simIndexNow,simIndexing,simInternalLinks,simNoRivalNames,simPrerender,simPrerenderBoot,simRetiredRoutes,simSchema,simSitemap,simSnapshotAssets,simSiteSearch,simGuideHeadings,simSeoMetaSplit,simHomeCopy,simHarnessAnchors"
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/runAllSims.mjs --browser 2>&1 | tee cfb-dynasty-low-score-full/readers.log
      - name: All original route download limits
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.browser_setup.outcome == 'success' }}
        run: |
          set -euo pipefail
          node scripts/lib/hostLikeServer.mjs dist 4173 > cfb-dynasty-low-score-full/weight-host.log 2>&1 &
          cfb_dynasty_low_score_host_pid=$!
          trap 'kill "$cfb_dynasty_low_score_host_pid" 2>/dev/null || true' EXIT
          sleep 2
          SWEEP_OFFLINE=1 BASE=http://127.0.0.1:4173 NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/sweepWeight.mjs 2>&1 | tee cfb-dynasty-low-score-full/weight.log
      - name: Actual native CFB Dynasty scores, saved schedule and reload
        id: native
        timeout-minutes: 15
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.browser_setup.outcome == 'success' }}
        run: |
          set -euo pipefail
          export CFB_DYNASTY_LOW_SCORE_BROWSER_OUT="$PWD/$EVIDENCE/browser"
          export CFB_DYNASTY_LOW_SCORE_FULL_UNIT="$PWD/$EVIDENCE"
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/qa/playCfbDynastyLowScore.mjs 2>&1 | tee "$EVIDENCE/browser.log"
      - name: Admit exact native scores and held production build bytes
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';import fs from 'node:fs';import {createHash} from 'node:crypto';
          const out=process.env.EVIDENCE,read=file=>fs.readFileSync(out+'/'+file),json=file=>JSON.parse(read(file)),sha=body=>createHash('sha256').update(body).digest('hex');
          const src=json('source-join.json'),unit=json('unit-admission.json'),refs=json('packet-custody.json'),raw=json('browser/raw.json'),summary=json('browser/report.json'),manifest=json('browser/body-manifest.json');
          assert.deepEqual([src.status,unit.status,refs.status,raw.status,summary.status],Array(5).fill('passed'));
          assert.deepEqual([raw.route,raw.head,raw.tree,raw.product,raw.helper],['/cfb-dynasty',src.head,src.tree,src.pins['src/lib/cfbDynasty.ts'],src.helperBlob]);
          assert.deepEqual([summary.route,summary.head,summary.tree,summary.product,summary.helper,summary.census],[raw.route,raw.head,raw.tree,raw.product,raw.helper,raw.census]);
          const walk=(dir,prefix='')=>fs.readdirSync(dir,{withFileTypes:true}).flatMap(e=>e.isDirectory()?walk(dir+'/'+e.name,prefix+e.name+'/'):e.isFile()?[prefix+e.name]:assert.fail('Regular evidence body required'));
          assert.equal(manifest.length,15);
          assert.deepEqual(manifest.map(row=>row.file).sort(),walk(out+'/browser').filter(file=>file!=='body-manifest.json').sort());
          const bodyRef=(file,body)=>({file,bytes:body.length,sha256:sha(body)});
          for(const row of manifest){assert(/^[A-Za-z0-9._/-]+$/.test(row.file)&&row.file.split('/').every(part=>part&&part!=='.'&&part!=='..'));assert.deepEqual(row,bodyRef(row.file,read('browser/'+row.file)));}
          assert.deepEqual(summary.raw,bodyRef('raw.json',read('browser/raw.json')));
          assert.deepEqual(raw.seedSave,bodyRef('saves/seed.json',read('browser/saves/seed.json')));
          assert.deepEqual(raw.sourceRefs.map(row=>row.file),['source-join.json','unit-admission.json','dist-before.json','installed-before.json']);
          for(const row of raw.sourceRefs)assert.deepEqual(row,bodyRef(row.file,read(row.file)));
          const built=json('dist-before.json'),builtMap=new Map(built.map(row=>[row.file,row]));
          assert.equal(built.length,850);assert.equal(builtMap.size,built.length);
          const after=walk('dist').map(file=>bodyRef('dist/'+file,fs.readFileSync('dist/'+file))).sort((a,b)=>a.file.localeCompare(b.file));
          assert.deepEqual(after,built.slice().sort((a,b)=>a.file.localeCompare(b.file)));
          fs.writeFileSync(out+'/dist-after.json',JSON.stringify(after));
          const screens=[];let clicks=0,local=0,navigations=0,blocked=0;
          assert.deepEqual(raw.journeys.map(j=>[j.width,j.height]),[[320,568],[390,844],[1280,900]]);
          for(const {width,height,contexts} of raw.journeys){
            assert.deepEqual(contexts.map(ctx=>ctx.scenario.key),['ordinary','below-cutoff']);
            for(const ctx of contexts){
              const expected=ctx.scenario.key==='ordinary'?2:0,cutoff=0.0175,loserDraw=expected?0.03:cutoff-2**-58;
              assert.deepEqual([ctx.id,ctx.status,ctx.errors,ctx.scenario.expectedScore,ctx.scenario.loserDraw],[width+'-'+ctx.scenario.key,'passed',[],expected,loserDraw]);
              assert.deepEqual(ctx.frames.map(f=>f.label),['ready','played','scheduled','reloaded']);
              const [ready,played,scheduled,reloaded]=ctx.frames,routeURL=raw.base+raw.route;
              assert(ctx.frames.every(f=>f.url===routeURL&&f.issues.length===0));
              assert.deepEqual([ready.save,ready.rng],[read('browser/saves/seed.json').toString(),null]);
              assert.deepEqual(played.rng,{draws:[0,0.01,loserDraw,...Array.from({length:21},()=>[0,0.625,0.32]).flat()],restored:true,restoredBy:'window-bubble'});
              assert.deepEqual([played.feed,played.around[0],played.around.length],[['✅ Week 1: beat Virginia Tech 24-'+expected+'.'],'Notre Dame beat Virginia Tech 24-'+expected,22]);
              assert.deepEqual([scheduled.schedule,reloaded.schedule,reloaded.rng,reloaded.feed,reloaded.around],['W 24-'+expected,'W 24-'+expected,null,[],[]]);
              assert.equal(played.save,scheduled.save);assert.equal(played.save,reloaded.save);
              const save=JSON.parse(played.save);
              assert.deepEqual([save.phase,save.st.round,save.st.mySlate],[ 'season',2,[{round:1,opp:'VT',home:true,us:24,them:expected,won:true,conference:false,rivalry:false}]]);
              assert.equal(read('browser/'+ctx.saved.file).toString(),played.save);
              assert.deepEqual(ctx.saved,bodyRef('saves/'+ctx.id+'.json',read('browser/'+ctx.saved.file)));
              assert.deepEqual(ctx.actions.map(a=>a.name),[...(ctx.consent==='rejected'?['Reject all']:[]),'Play','Play Week 1','Schedule','Schedule']);
              assert(ctx.actions.every(a=>a.click.trusted===true&&a.click.name===a.name&&a.click.x>=0&&a.click.x<width&&a.click.y>=0&&a.click.y<height));
              const png=read('browser/'+ctx.screenshot.file);
              assert.deepEqual(ctx.screenshot,bodyRef('png/'+ctx.id+'.png',png));
              assert.deepEqual([png.subarray(0,8).toString('hex'),png.toString('ascii',12,16),png.readUInt32BE(16),png.readUInt32BE(20)],['89504e470d0a1a0a','IHDR',width,height]);
              assert.deepEqual(ctx.local.filter(r=>r.type==='document').map(r=>[r.url,r.file]),Array.from({length:2},()=>[routeURL,'dist/cfb-dynasty/index.html']));
              assert(ctx.local.some(r=>/^dist\/assets\/CfbDynasty-.*\.js$/.test(r.file)));
              for(const req of ctx.local){const row=builtMap.get(req.file);assert(row&&req.bytes===row.bytes&&req.sha256===row.sha256);}
              assert(ctx.navigations.length>=2&&ctx.navigations.every(url=>url===routeURL));
              assert(ctx.blocked.every(req=>req.outcome==='external-read-aborted'));
              screens.push(ctx.screenshot);clicks+=ctx.actions.length;local+=ctx.local.length;navigations+=ctx.navigations.length;blocked+=ctx.blocked.length;
            }
          }
          assert.deepEqual(raw.census,{journeys:3,contexts:6,frames:24,trustedClicks:clicks,roundDraws:396,documents:12,viewportPNGs:6,navigations,localResponses:local,blockedReads:blocked});
          assert.deepEqual(summary.contexts.map(c=>[c.id,c.score]),raw.journeys.flatMap(j=>j.contexts.map(c=>[c.id,c.scenario.expectedScore])));
          const readers=read('readers.log').toString(),weight=read('weight.log').toString();
          assert(readers.includes('All 20 harnesses green.'));
          assert(weight.includes('sweepWeight: green.'));
          const capRows=weight.split('\n').filter(line=>/^\s+\/\S*\s+\d+K gz over/.test(line));assert.equal(capRows.length,16);
          const tar=read('dist.tgz'),distTupleSHA256=sha(Buffer.from(JSON.stringify(after)));
          const native={status:'passed',route:raw.route,head:raw.head,tree:raw.tree,product:raw.product,helper:raw.helper,census:raw.census,screenshots:screens,bodyManifest:bodyRef('browser/body-manifest.json',read('browser/body-manifest.json'))};
          fs.writeFileSync(out+'/native-admission.json',JSON.stringify(native,null,2)+'\n');
          fs.writeFileSync(out+'/admission.json',JSON.stringify({status:'passed',head:src.head,tree:src.tree,readers:20,immutableCaps:16,capRows,distFiles:850,distTar:{bytes:tar.length,sha256:sha(tar)},distTupleSHA256,unit,native,controlsRerun:false},null,2)+'\n');
          NODE
      - name: Verify unchanged physical source and locked offline run
        if: always()
        run: |
          set -euo pipefail
          git ls-files -s > "$EVIDENCE/source-after.txt"
          sha256sum package.json package-lock.json > "$EVIDENCE/locks-after.txt"
          cmp "$EVIDENCE/source-before.txt" "$EVIDENCE/source-after.txt"
          cmp "$EVIDENCE/locks-before.txt" "$EVIDENCE/locks-after.txt"
          git diff --exit-code HEAD -- .
          node "$EVIDENCE/physical.mjs" after
          test ! -s "$SIM_OFFLINE_RECEIPT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cfb-dynasty-low-score-full-${{ github.run_id }}
          path: cfb-dynasty-low-score-full
          if-no-files-found: error
          retention-days: 30
