name: College Football Dynasty low-score clean source and build join
on:
  push:
    branches: [codex/cfb-dynasty-low-score-clean-join-qa-20261110]
permissions:
  contents: read
  actions: read
jobs:
  closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      TZ: UTC
      SIM_NETWORK: offline
      SIM_OFFLINE_RECEIPT: cfb-dynasty-low-score-clean-join/offline.log
      CFB_DYNASTY_LOW_SCORE_REFERENCE_ARTIFACT: '13749299828'
      CFB_DYNASTY_LOW_SCORE_REFERENCE_RUN: '42786929158'
      CFB_DYNASTY_LOW_SCORE_REFERENCE_JOB: '129730400567'
      CFB_DYNASTY_LOW_SCORE_REFERENCE_STEPS: '23'
      CFB_DYNASTY_LOW_SCORE_REFERENCE_ZIP: '21723e5408922416e0331c94f1ea369e749c53127dccea117478cd94e711a4dc'
      CFB_DYNASTY_LOW_SCORE_REFERENCE_TAR: '9845984912dc7c6fed7970ee66cae9e878374dc5dfe1b73a6e5dd796c653673b'
      CFB_DYNASTY_LOW_SCORE_REFERENCE_HEAD: '84d83d3efb3626d4e06d7730275645082b0bdfd1'
      CFB_DYNASTY_LOW_SCORE_REFERENCE_TREE: '3b999c473845f30d17e3d7cc0892f5f61b54884b'
      CFB_DYNASTY_LOW_SCORE_REFERENCE_ZIP_BYTES: '27120084'
      CFB_DYNASTY_LOW_SCORE_NATIVE_HELPER: '533ca6aba5c190e25c8ba444e8c2d18feb1d7850'
      CFB_DYNASTY_LOW_SCORE_REFERENCE_AUDIT: '58e6333a35c7289c0082094c3842157b26af201b3bdb27a1b7e84a0b0898a798'
      CFB_DYNASTY_LOW_SCORE_FIXED_ENGINE_BLOB: '65a4def674bfbcc5d16f6ad6b82138ebf0a793d1'
      CFB_DYNASTY_LOW_SCORE_QUALIFIED_PLAN_BLOB: '99ffc97340a08e918cee35c9f618268066f89b2f'
      CFB_DYNASTY_LOW_SCORE_QUALIFIED_TEST_BLOB: '4d71647df7137920ee6aa4b9982de70f0c1813b1'
      CFB_DYNASTY_LOW_SCORE_BOUNDARY_TEST_BLOB: '32b9be98b190c5c8d6d41d0c548498b58607bfa5'
      CFB_DYNASTY_LOW_SCORE_REFERENCE_DIST_MANIFEST: 'a57d709eb91dcfccf9b295390aa3ed0d1a162299c27b9ca5488064d840c84b0d'
      CFB_DYNASTY_LOW_SCORE_REFERENCE_WORKFLOW: '29e22416234f7a9a6001a334d8c352ff8375425a'
      CFB_DYNASTY_LOW_SCORE_CLEAN_PRODUCT_BASE: '6b773fc6cc8ace8ddc2c6c8ed2eb0a61602a0aca'
      CFB_DYNASTY_LOW_SCORE_CLEAN_PRODUCT_BASE_TREE: '600b98fa2b199254b4843d017bd3b3047ab2a572'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Locked dependencies and clean source receipts
        run: |
          set -euo pipefail
          if grep -Eq '__[A-Z][A-Z0-9_]*__' .github/workflows/cfb-dynasty-low-score-20261110.yml; then echo 'Unresolved clean qualification template binding'; exit 1; fi
          [[ "$CFB_DYNASTY_LOW_SCORE_REFERENCE_ARTIFACT" =~ ^[1-9][0-9]*$ ]]
          [[ "$CFB_DYNASTY_LOW_SCORE_REFERENCE_RUN" =~ ^[1-9][0-9]*$ ]]
          [[ "$CFB_DYNASTY_LOW_SCORE_REFERENCE_JOB" =~ ^[1-9][0-9]*$ ]]
          [[ "$CFB_DYNASTY_LOW_SCORE_REFERENCE_STEPS" =~ ^[1-9][0-9]*$ ]]
          [[ "$CFB_DYNASTY_LOW_SCORE_REFERENCE_AUDIT" =~ ^[a-f0-9]{64}$ ]]
          [[ "$CFB_DYNASTY_LOW_SCORE_REFERENCE_ZIP" =~ ^[a-f0-9]{64}$ ]]
          [[ "$CFB_DYNASTY_LOW_SCORE_REFERENCE_TAR" =~ ^[a-f0-9]{64}$ ]]
          [[ "$CFB_DYNASTY_LOW_SCORE_REFERENCE_ZIP_BYTES" =~ ^[1-9][0-9]*$ ]]
          [[ "$CFB_DYNASTY_LOW_SCORE_REFERENCE_DIST_MANIFEST" =~ ^[a-f0-9]{64}$ ]]
          for value in "$CFB_DYNASTY_LOW_SCORE_REFERENCE_HEAD" "$CFB_DYNASTY_LOW_SCORE_REFERENCE_TREE" "$CFB_DYNASTY_LOW_SCORE_NATIVE_HELPER" "$CFB_DYNASTY_LOW_SCORE_REFERENCE_WORKFLOW" "$CFB_DYNASTY_LOW_SCORE_FIXED_ENGINE_BLOB" "$CFB_DYNASTY_LOW_SCORE_BOUNDARY_TEST_BLOB" "$CFB_DYNASTY_LOW_SCORE_QUALIFIED_PLAN_BLOB" "$CFB_DYNASTY_LOW_SCORE_QUALIFIED_TEST_BLOB"; do [[ "$value" =~ ^[a-f0-9]{40}$ ]]; done
          test ! -e cfb-dynasty-low-score-clean-join
          mkdir cfb-dynasty-low-score-clean-join
          touch cfb-dynasty-low-score-clean-join/offline.log
          git rev-parse HEAD > cfb-dynasty-low-score-clean-join/head.txt
          git rev-parse 'HEAD^{tree}' > cfb-dynasty-low-score-clean-join/tree.txt
          git ls-files -s > cfb-dynasty-low-score-clean-join/source-before.txt
          sha256sum package.json package-lock.json > cfb-dynasty-low-score-clean-join/locks-before.txt
          npm ci 2>&1 | tee cfb-dynasty-low-score-clean-join/install.log
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const lock=JSON.parse(fs.readFileSync('package-lock.json'));
          const rows=Object.keys(lock.packages).filter(p=>p.startsWith('node_modules/')&&fs.existsSync(p+'/package.json')).map(p=>[p,JSON.parse(fs.readFileSync(p+'/package.json')).version]);
          assert.equal(rows.length,521);for(const[p,v]of rows)assert.equal(v,lock.packages[p].version,p);fs.writeFileSync('cfb-dynasty-low-score-clean-join/installed-before.json',JSON.stringify(rows));
          NODE
      - name: Proper app types
        run: |
          set -euo pipefail
          node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee cfb-dynasty-low-score-clean-join/types.log
      - name: Authenticate the completed full reference before extraction
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/PapiSalgueroM/ballpark-hero/actions/runs/$CFB_DYNASTY_LOW_SCORE_REFERENCE_RUN" > cfb-dynasty-low-score-clean-join/reference-run.json
          gh api "repos/PapiSalgueroM/ballpark-hero/actions/runs/$CFB_DYNASTY_LOW_SCORE_REFERENCE_RUN/jobs?per_page=100" > cfb-dynasty-low-score-clean-join/reference-jobs.json
          gh api "repos/PapiSalgueroM/ballpark-hero/actions/artifacts/$CFB_DYNASTY_LOW_SCORE_REFERENCE_ARTIFACT" > cfb-dynasty-low-score-clean-join/reference-artifact.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const env = process.env;
          const read = file => JSON.parse(fs.readFileSync('cfb-dynasty-low-score-clean-join/' + file));
          const run = read('reference-run.json'), jobs = read('reference-jobs.json').jobs, artifact = read('reference-artifact.json');
          assert.deepEqual(
            [run.id, run.status, run.conclusion, run.event, run.run_attempt, run.path, run.repository.full_name, run.head_sha, run.head_commit.tree_id],
            [Number(env.CFB_DYNASTY_LOW_SCORE_REFERENCE_RUN), 'completed', 'success', 'push', 1, '.github/workflows/cfb-dynasty-low-score-20261110.yml', 'PapiSalgueroM/ballpark-hero', env.CFB_DYNASTY_LOW_SCORE_REFERENCE_HEAD, env.CFB_DYNASTY_LOW_SCORE_REFERENCE_TREE],
          );
          assert.equal(jobs.length, 1);
          const [job] = jobs;
          assert.deepEqual([job.id, job.run_id, job.status, job.conclusion, job.head_sha, job.steps.length],
            [Number(env.CFB_DYNASTY_LOW_SCORE_REFERENCE_JOB), run.id, 'completed', 'success', run.head_sha, Number(env.CFB_DYNASTY_LOW_SCORE_REFERENCE_STEPS)]);
          assert(job.steps.every(step => step.status === 'completed' && step.conclusion === 'success'));
          assert.deepEqual(
            [artifact.id, artifact.name, artifact.expired, artifact.size_in_bytes, artifact.digest, artifact.workflow_run.id, artifact.workflow_run.head_sha],
            [Number(env.CFB_DYNASTY_LOW_SCORE_REFERENCE_ARTIFACT), 'cfb-dynasty-low-score-full-' + run.id, false, Number(env.CFB_DYNASTY_LOW_SCORE_REFERENCE_ZIP_BYTES), 'sha256:' + env.CFB_DYNASTY_LOW_SCORE_REFERENCE_ZIP, run.id, run.head_sha],
          );
          NODE
          gh api "repos/PapiSalgueroM/ballpark-hero/actions/artifacts/$CFB_DYNASTY_LOW_SCORE_REFERENCE_ARTIFACT/zip" > "$RUNNER_TEMP/cfb-dynasty-low-score-full-reference.zip"
          test "$(wc -c < "$RUNNER_TEMP/cfb-dynasty-low-score-full-reference.zip")" -eq "$CFB_DYNASTY_LOW_SCORE_REFERENCE_ZIP_BYTES"
          echo "$CFB_DYNASTY_LOW_SCORE_REFERENCE_ZIP  $RUNNER_TEMP/cfb-dynasty-low-score-full-reference.zip" | sha256sum --check
          unzip -Z1 "$RUNNER_TEMP/cfb-dynasty-low-score-full-reference.zip" > cfb-dynasty-low-score-clean-join/reference-zip-entries.txt
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const names = fs.readFileSync('cfb-dynasty-low-score-clean-join/reference-zip-entries.txt', 'utf8').trimEnd().split('\n');
          assert.equal(new Set(names).size, names.length, 'Unique admitted ZIP paths');
          for (const name of names) {
            assert(name.length && !name.includes('\\') && !name.startsWith('/'), 'Relative ZIP path');
            assert(name.replace(/\/$/, '').split('/').every(part => part && part !== '.' && part !== '..'), 'Safe ZIP path');
          }
          for (const file of ['head.txt', 'tree.txt', 'admission.json', 'unit-admission.json', 'native-admission.json', 'source-join.json', 'source-before.txt', 'source-after.txt', 'tracked-before.json', 'tracked-after.json', 'locks-before.txt', 'locks-after.txt', 'installed-before.json', 'installed-after.json', 'offline.log', 'types.log', 'dist-before.json', 'dist-after.json', 'dist.tgz']) {
            assert(names.includes(file), file + ' required authenticated body');
          }
          NODE
          mkdir "$RUNNER_TEMP/cfb-dynasty-low-score-full-reference" "$RUNNER_TEMP/cfb-dynasty-low-score-full-reference-dist"
          unzip -q "$RUNNER_TEMP/cfb-dynasty-low-score-full-reference.zip" -d "$RUNNER_TEMP/cfb-dynasty-low-score-full-reference"
          test -z "$(find "$RUNNER_TEMP/cfb-dynasty-low-score-full-reference" -type l -print -quit)"
          echo "$CFB_DYNASTY_LOW_SCORE_REFERENCE_TAR  $RUNNER_TEMP/cfb-dynasty-low-score-full-reference/dist.tgz" | sha256sum --check
          tar -tzf "$RUNNER_TEMP/cfb-dynasty-low-score-full-reference/dist.tgz" > cfb-dynasty-low-score-clean-join/reference-tar-entries.txt
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const names = fs.readFileSync('cfb-dynasty-low-score-clean-join/reference-tar-entries.txt', 'utf8').trimEnd().split('\n');
          assert.equal(new Set(names).size, names.length, 'Unique admitted dist tar paths');
          for (const name of names) {
            assert(name.startsWith('dist/') && !name.includes('\\'), 'Tar stays under dist');
            assert(name.replace(/\/$/, '').split('/').every(part => part && part !== '.' && part !== '..'), 'Safe tar path');
          }
          NODE
          tar -xzf "$RUNNER_TEMP/cfb-dynasty-low-score-full-reference/dist.tgz" -C "$RUNNER_TEMP/cfb-dynasty-low-score-full-reference-dist"
          cp "$RUNNER_TEMP/cfb-dynasty-low-score-full-reference/source-before.txt" cfb-dynasty-low-score-clean-join/reference-source.txt
      - name: Fresh unchanged product-name fence on clean source
        run: |
          set -euo pipefail
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/simNoRivalNames.mjs 2>&1 | tee cfb-dynasty-low-score-clean-join/no-rival.log
      - name: Clean production build
        run: |
          set -euo pipefail
          NODE_OPTIONS="--max-old-space-size=6144" npm run build 2>&1 | tee cfb-dynasty-low-score-clean-join/build.log
      - name: Join exact clean product source and all 850 built files
        id: join
        env:
          CFB_DYNASTY_LOW_SCORE_REFERENCE_DIR: ${{ runner.temp }}/cfb-dynasty-low-score-full-reference
          CFB_DYNASTY_LOW_SCORE_REFERENCE_DIST: ${{ runner.temp }}/cfb-dynasty-low-score-full-reference-dist/dist
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          const env = process.env;
          const out = 'cfb-dynasty-low-score-clean-join';
          const ref = env.CFB_DYNASTY_LOW_SCORE_REFERENCE_DIR;
          const read = file => JSON.parse(fs.readFileSync(path.join(ref, file)));
          const bytes = file => fs.readFileSync(path.join(ref, file));
          const readOutput = file => JSON.parse(fs.readFileSync(path.join(out, file)));
          const sha = bytes => createHash('sha256').update(bytes).digest('hex');
          const blob = bytes => createHash('sha1').update('blob ' + bytes.length + '\0').update(bytes).digest('hex');
          const git = (...args) => execFileSync('git', args, {encoding:'utf8', maxBuffer:16 * 1024 * 1024});
          const workflow = '.github/workflows/cfb-dynasty-low-score-20261110.yml';
          const helper = 'scripts/qa/playCfbDynastyLowScore.mjs';
          const engine = 'src/lib/cfbDynasty.ts';
          const test = 'src/lib/cfbDynastyLowScore.test.ts';
          const boundary = 'src/lib/cfbDynastyScoreBoundary.test.ts';
          const plan = 'docs/plans/2026-11-10-cfb-dynasty-low-score.md';
          const configs = ['index.html','package.json','package-lock.json','vite.config.ts','tailwind.config.ts','postcss.config.js','tsconfig.json','tsconfig.app.json','tsconfig.node.json','bun.lockb','bun.lock'];
          const sourceScope = file => /^(?:src|public|scripts)\//.test(file);
          const fullOnly = new Set([workflow, helper]);
          const pins = {
            [engine]: env.CFB_DYNASTY_LOW_SCORE_FIXED_ENGINE_BLOB,
            [test]: env.CFB_DYNASTY_LOW_SCORE_QUALIFIED_TEST_BLOB,
            [boundary]: env.CFB_DYNASTY_LOW_SCORE_BOUNDARY_TEST_BLOB,
            [plan]: env.CFB_DYNASTY_LOW_SCORE_QUALIFIED_PLAN_BLOB,
            'src/App.tsx':'8bfedf7aaa1d076e0f0c8e2216c7e46632cd8a33',
            'src/data/gameRegistry.ts':'f560b40a74d1468ac72dfde4ee6fec6635a9a255',
            'public/cfb-dynasty/index.html':'b3849f578a8231129dafd356edc257adf9a9e1ca',
            'src/pages/CfbDynasty.tsx':'c0335415465e24e9b067611580aaf985f86681cd',
            'src/components/cfb-dynasty/CfbDynastyBoard.tsx':'85786118b430b07ab9a56d69bf7dfa326d4acde5',
            'src/components/college-dynasty/CollegeDynastyBoard.tsx':'91ee2a06e96f8352384a8587e37aba9a8db48f94',
            'src/lib/collegeProgram.ts':'12688e52d0745701a59d61c37879a23146be9d78',
            'src/components/cfb-dynasty/CfbDynastyBoard.test.tsx':'31b1aa2a905356afd9ff9b02a3fd8212a6a01466',
            'src/components/cfb-dynasty/CfbDynastyDepth.test.tsx':'dae59dfb41a7e71c3673413582dd73487a6f12f6',
            'scripts/simCfbDynasty.mjs':'a0a8e77f0a7e2ed31c337782da69a927da5d6b0c',
            'scripts/simCfbStaff.mjs':'bbfdf5cf3b862c99f06c1f57b0ac591e34231a17',
            'scripts/lib/offlineTransport.cjs':'0fda542a2649fe5da937c6976fd0f5b6073e74b6',
          };
          const indexRows = (body, separator = '\n') => {
            const rows = body.split(separator).filter(Boolean).map(line => {
              const matched = /^(100(?:644|755)) ([0-9a-f]{40}) 0\t(.+)$/.exec(line);
              assert(matched, 'Actual regular path/mode/blob index tuple');
              return [matched[3], {mode:matched[1], blob:matched[2]}];
            });
            assert.equal(new Set(rows.map(([file]) => file)).size, rows.length, 'Unique index paths');
            return new Map(rows);
          };
          const treeRows = commit => {
            const rows = git('ls-tree', '-r', '-z', commit).split('\0').filter(Boolean).map(line => {
              const matched = /^(100(?:644|755)) blob ([0-9a-f]{40})\t(.+)$/.exec(line);
              assert(matched, 'Actual regular path/mode/blob tree tuple');
              return [matched[3], {mode:matched[1], blob:matched[2]}];
            });
            assert.equal(new Set(rows.map(([file]) => file)).size, rows.length, 'Unique tree paths');
            return new Map(rows);
          };
          const ordered = rows => [...rows].sort(([left],[right]) => left.localeCompare(right));
          const cleanHead = git('rev-parse', 'HEAD').trim(), cleanTree = git('rev-parse', 'HEAD^{tree}').trim();
          assert.deepEqual(git('rev-list', '--parents', '-n', '1', 'HEAD').trim().split(' '), [cleanHead, env.CFB_DYNASTY_LOW_SCORE_CLEAN_PRODUCT_BASE], 'Clean QA is the direct PR539 child');
          assert.equal(git('rev-parse', env.CFB_DYNASTY_LOW_SCORE_CLEAN_PRODUCT_BASE + '^{tree}').trim(), env.CFB_DYNASTY_LOW_SCORE_CLEAN_PRODUCT_BASE_TREE);
          assert.equal(cleanHead, env.GITHUB_SHA);
          assert.equal(fs.readFileSync(out + '/head.txt','utf8').trim(), cleanHead);
          assert.equal(fs.readFileSync(out + '/tree.txt','utf8').trim(), cleanTree);
          const base = treeRows(env.CFB_DYNASTY_LOW_SCORE_CLEAN_PRODUCT_BASE);
          const current = indexRows(fs.readFileSync(out + '/source-before.txt', 'utf8'));
          const old = indexRows(fs.readFileSync(out + '/reference-source.txt', 'utf8'));
          assert.deepEqual(ordered(indexRows(git('ls-files','--stage','-z'),'\0')), ordered(current));
          assert.deepEqual(ordered(treeRows(cleanHead)), ordered(current), 'Clean index joins exact committed tree tuples');
          assert.deepEqual([base.size,current.size,old.size],[5795,5799,5800]);
          const allowedClean = [engine, test, boundary, plan, workflow];
          const cleanDelta = [...new Set([...base.keys(), ...current.keys()])].filter(file => {
            const before = base.get(file), after = current.get(file);
            return before?.mode !== after?.mode || before?.blob !== after?.blob;
          }).sort();
          assert.deepEqual(cleanDelta, [...allowedClean].sort(), 'Exactly one engine change and four owned new leaves');
          assert.equal(base.get(engine)?.blob, '3f038157f234d25fcae06860d1d8efeaa632fb9f');
          assert.equal(current.get(engine)?.mode, base.get(engine)?.mode);
          for (const file of [test, boundary, plan, workflow]) assert(!base.has(file) && current.get(file)?.mode === '100644', file + ' exact owned new leaf');
          assert(!current.has(helper), 'Tracked full browser helper is excluded from clean QA');
          assert.equal(old.get(helper)?.blob, env.CFB_DYNASTY_LOW_SCORE_NATIVE_HELPER);
          assert.equal(old.get(workflow)?.blob, env.CFB_DYNASTY_LOW_SCORE_REFERENCE_WORKFLOW);
          assert(current.get(workflow)?.blob && current.get(workflow).blob !== old.get(workflow).blob, 'Clean QA uses its own workflow body');
          for (const [file,want] of Object.entries(pins)) {
            assert.equal(current.get(file)?.blob, want, file + ' exact clean pin');
            assert.equal(old.get(file)?.blob, want, file + ' exact full pin');
          }
          const product = (rows, omit) => ordered([...rows].filter(([file]) => !omit.has(file)));
          const cleanProduct = product(current,new Set([workflow]));
          const fullProduct = product(old,fullOnly);
          assert.equal(cleanProduct.length,5798);
          assert.deepEqual(cleanProduct,fullProduct,'All 5798 product path/mode/blob tuples are identical');
          assert.deepEqual([base,current,old].map(rows => [...rows.keys()].filter(sourceScope).length), [4666,4668,4669]);
          const scoped = (rows, omit) => ordered([...rows].filter(([file]) => (sourceScope(file) || configs.includes(file)) && !omit.has(file)));
          const sourceConfigRows = scoped(current,new Set());
          assert.equal(sourceConfigRows.length, 4679);
          assert.deepEqual(sourceConfigRows,scoped(old,fullOnly),'Every 4668 code and 11 root configuration path/mode/blob tuple');
          for (const file of configs) assert(current.has(file) && old.has(file),file + ' required root configuration');
          for (const [file,tuple] of current) {
            const stat = fs.lstatSync(file);
            assert(stat.isFile(),file + ' physical regular source body');
            assert.equal((stat.mode & 0o111) !== 0, tuple.mode === '100755',file + ' physical source executable mode');
            assert.equal(blob(fs.readFileSync(file)),tuple.blob,file + ' physical source bytes join tree');
          }

          const inventory = (directory,prefix = '') => fs.readdirSync(directory,{withFileTypes:true}).sort((a,b) => a.name.localeCompare(b.name)).flatMap(entry => {
            const file = path.join(directory,entry.name);
            const relative = prefix + entry.name;
            if (entry.isDirectory()) return inventory(file,relative + '/');
            assert(entry.isFile(),relative + ' regular dist file');
            const body = fs.readFileSync(file);
            return [{path:relative,bytes:body.length,sha256:sha(body)}];
          });
          const actual = inventory('dist'), reference = inventory(env.CFB_DYNASTY_LOW_SCORE_REFERENCE_DIST);
          assert.deepEqual([actual.length,reference.length],[850,850]);
          assert.deepEqual(actual,reference,'Every clean built path and byte equals the qualified full build');
          const distManifestSHA256 = sha(JSON.stringify(reference));
          const sortFull = rows => rows.slice().sort((left,right) => left.file.localeCompare(right.file));
          const retainedBefore = sortFull(read('dist-before.json'));
          const retainedAfter = sortFull(read('dist-after.json'));
          assert.deepEqual(retainedBefore,retainedAfter,'Exact full before/after build tuples');
          const fullDistTupleSHA256 = sha(JSON.stringify(retainedAfter));
          assert.equal(fullDistTupleSHA256,env.CFB_DYNASTY_LOW_SCORE_REFERENCE_DIST_MANIFEST);
          const retainedManifest = retainedBefore.map(row => {
            assert.deepEqual(Object.keys(row).sort(),['bytes','file','sha256']);
            assert(row.file.startsWith('dist/'));
            return {path:row.file.slice(5),bytes:row.bytes,sha256:row.sha256};
          }).sort((left,right) => left.path.localeCompare(right.path));
          assert.deepEqual(retainedManifest,reference.slice().sort((left,right) => left.path.localeCompare(right.path)),'Exact full retained build inventory and tar join');
          for (const [before, after] of [['source-before.txt','source-after.txt'],['tracked-before.json','tracked-after.json'],['locks-before.txt','locks-after.txt'],['installed-before.json','installed-after.json']]) {
