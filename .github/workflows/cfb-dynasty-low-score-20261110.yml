name: College Football Dynasty low score production qualification
on:
  push:
    branches: [codex/cfb-dynasty-low-score-full-qa-20261110]
permissions:
  actions: read
  contents: read
jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: UTC
      SIM_NETWORK: offline
      SEO_SPLIT_BASE_REF: '3b14650d360b010b25b525de33a5f32f33de2798'
      EVIDENCE: cfb-dynasty-low-score-full
      SIM_OFFLINE_RECEIPT: cfb-dynasty-low-score-full/offline.log
      CFB_DYNASTY_LOW_SCORE_RAW: cfb-dynasty-low-score-full/public-cases.raw.json
      CFB_DYNASTY_SCORE_BOUNDARY_RAW: cfb-dynasty-low-score-full/score-boundary.raw.json
      CFB_DYNASTY_LOW_SCORE_FIXED_HEAD: '93b021bc1e3c256847a0553ade9995420b57de02'
      CFB_DYNASTY_LOW_SCORE_FIXED_TREE: '62a47af05f8f6da523f7c2a9e42b78981dcb7a78'
