          if(fs.existsSync(out+'/input-reference-before.json')){const actual=Buffer.from(json(inventory(e.QA_REF)));fs.writeFileSync(out+'/input-reference-after.json',actual);assert(actual.equals(fs.readFileSync(out+'/input-reference-before.json')));}
          if(fs.existsSync(out+'/dist-before.json')){const actual=Buffer.from(json(inventory(e.QA_DIST)));fs.writeFileSync(out+'/dist-after.json',actual);assert(actual.equals(fs.readFileSync(out+'/dist-before.json')));}
