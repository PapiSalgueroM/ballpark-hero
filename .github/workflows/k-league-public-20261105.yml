      - name: Bind exactly three public additions on the actual admitted native QA parent
        shell: bash
        run: |
          set -euo pipefail
          QA_OUT="$RUNNER_TEMP/k-league-public"
          QA_REF="$RUNNER_TEMP/k-league-public-inputs"
          QA_DIST="$RUNNER_TEMP/k-league-public-dist"
          export QA_OUT QA_REF QA_DIST
          test ! -e "$QA_OUT"
          test ! -e "$QA_REF"
          test ! -e "$QA_DIST"
          mkdir -p "$QA_OUT"/{logs,input,transport,original-native} "$QA_REF" "$QA_DIST"
          printf 'QA_OUT=%s\nQA_REF=%s\nQA_DIST=%s\n' "$QA_OUT" "$QA_REF" "$QA_DIST" >> "$GITHUB_ENV"
          node --input-type=module <<'BIND'
          import fs from 'node:fs';import assert from 'node:assert/strict';import {execFileSync} from 'node:child_process';
          const e=process.env,git=(...a)=>execFileSync('git',a,{encoding:'utf8'}).trim();
          for(const k of ['PRODUCT','PRODUCT_TREE','CATALOGUE_BASELINE_CORE','CATALOGUE_BASELINE_TREE','CATALOGUE_BASELINE_LEDGER_BLOB','NATIVE_QA','NATIVE_QA_TREE','NATIVE_BROWSER_BLOB','READY_BLOB','PUBLIC_BROWSER_BLOB','PUBLIC_ASSETS_BLOB','PUBLISHED_SOURCE','PUBLISHED_TREE','DEPLOY_SOURCE','DEPLOY_TREE'])assert.match(e[k]??'',/^[a-f0-9]{40}$/,k);
          assert.match(e.FINAL_SOURCE_INDEPENDENT_SHA??'',/^[a-f0-9]{64}$/);assert.match(e.DEPLOYMENT_ID??'',/^[a-f0-9]{8}(?:-[a-f0-9]{4}){3}-[a-f0-9]{12}$/);
          for(const k of ['NATIVE_INPUT','BUILD_INPUT']){const a=JSON.parse(e[k]);assert(a&&typeof a==='object',k+' actual admitted input');}
          assert.equal(e.PUBLISHED_SOURCE,e.DEPLOY_SOURCE);assert.equal(e.PUBLISHED_TREE,e.DEPLOY_TREE);assert.equal(e.PUBLISHED_TREE,e.PRODUCT_TREE,'Exact published product tree, no implicit source exception');
          assert.equal(git('rev-parse','HEAD^'),e.NATIVE_QA);assert.equal(git('rev-parse','HEAD^^{tree}'),e.NATIVE_QA_TREE);
          const additions=['.github/workflows/k-league-public-20261105.yml','scripts/qa/kLeaguePublicBrowser.mjs','scripts/qa/kLeaguePublicAssets.mjs'];
          const delta=git('diff','--name-status','--no-renames','HEAD^','HEAD').split('\n').map(s=>s.split('\t'));assert(delta.every(row=>row.length===2&&row[0]==='A'));assert.deepEqual(delta.map(row=>row[1]).sort(),additions.slice().sort());
          for(const [p,k]of [['scripts/qa/kLeagueNativeBrowser.mjs','NATIVE_BROWSER_BLOB'],['scripts/qa/nativeScrollReady.mjs','READY_BLOB'],['scripts/qa/kLeaguePublicBrowser.mjs','PUBLIC_BROWSER_BLOB'],['scripts/qa/kLeaguePublicAssets.mjs','PUBLIC_ASSETS_BLOB']])assert.equal(git('hash-object',p),e[k],p);
          assert.equal(git('status','--porcelain=v1','--untracked-files=all'),'');
          fs.copyFileSync(additions[0],e.QA_OUT+'/workflow.yml');
          fs.writeFileSync(e.QA_OUT+'/qa-delta.json',JSON.stringify({parent:e.NATIVE_QA,parentTree:e.NATIVE_QA_TREE,delta,wholeInverse:'Remove exactly the three public additions. Every inherited native file stays byte-held.'},null,2)+'\n');
          fs.writeFileSync(e.QA_OUT+'/workflow-source.json',JSON.stringify({head:git('rev-parse','HEAD'),tree:git('rev-parse','HEAD^{tree}'),path:additions[0],gitBlob:git('hash-object',additions[0])})+'\n');
          BIND
          node --check scripts/qa/kLeaguePublicBrowser.mjs
          node --check scripts/qa/kLeaguePublicAssets.mjs
          git ls-files -z > "$QA_OUT/tracked-before.bin"
          git ls-files -z | xargs -0 sha256sum > "$QA_OUT/source-before.sha256"
          git ls-files -s > "$QA_OUT/index-before.txt"
          git status --porcelain=v1 --untracked-files=all > "$QA_OUT/status-before.txt"
          test ! -s "$QA_OUT/status-before.txt"
          cp package-lock.json "$QA_OUT/lock-before.json"
          node --input-type=module -e 'import fs from "node:fs";import crypto from "node:crypto";const sha=b=>crypto.createHash("sha256").update(b).digest("hex");fs.writeFileSync(process.env.QA_OUT+"/all-locks-before.json",JSON.stringify(Object.fromEntries(["package.json","package-lock.json","bun.lock","bun.lockb","yarn.lock","pnpm-lock.yaml"].map(p=>[p,fs.existsSync(p)?sha(fs.readFileSync(p)):null])))+"\n");'
          git rev-parse HEAD HEAD^ 'HEAD^{tree}' > "$QA_OUT/source-identity.txt"
      - name: Read exact native build product and published role trees before offline work
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'ROLES'
          import fs from 'node:fs';import assert from 'node:assert/strict';import {execFileSync,spawnSync} from 'node:child_process';import {createHash} from 'node:crypto';
          const e=process.env,N=JSON.parse(e.NATIVE_INPUT),B=JSON.parse(e.BUILD_INPUT),out=e.QA_OUT;
          const refs=[...new Set([e.PRODUCT,e.NATIVE_QA,B.qa,e.PUBLISHED_SOURCE,e.DEPLOY_SOURCE,e.CATALOGUE_BASELINE_CORE])];
          for(const ref of refs){assert.match(ref,/^[a-f0-9]{40}$/);const r=spawnSync('git',['fetch','--depth=1','--filter=blob:none','origin',ref],{encoding:'utf8'});fs.appendFileSync(out+'/logs/source-ref-fetch.log',(r.stdout??'')+(r.stderr??''));assert.equal(r.status,0);assert.equal(r.signal,null);assert.equal(r.error,undefined);}
          const git=(...a)=>execFileSync('git',a,{encoding:'utf8',maxBuffer:16*1024*1024}).trim(),tree=ref=>Object.fromEntries(git('ls-tree','-r','--full-tree',ref).split('\n').filter(Boolean).map(line=>{const m=/^([0-9]+) blob ([a-f0-9]{40})\t(.*)$/.exec(line);assert(m);return[m[3],{mode:m[1],blob:m[2]}];}));
          const roles={product:{commit:e.PRODUCT,tree:e.PRODUCT_TREE},native:{commit:e.NATIVE_QA,tree:e.NATIVE_QA_TREE},build:{commit:B.qa,tree:B.qaTree},published:{commit:e.PUBLISHED_SOURCE,tree:e.PUBLISHED_TREE},deployed:{commit:e.DEPLOY_SOURCE,tree:e.DEPLOY_TREE},public:{commit:git('rev-parse','HEAD'),tree:git('rev-parse','HEAD^{tree}')}},maps={};
          for(const[role,row]of Object.entries(roles)){assert.equal(git('rev-parse',row.commit+'^{tree}'),row.tree);maps[role]=tree(row.commit);}
          const parents=ref=>git('cat-file','-p',ref).split('\n').filter(s=>s.startsWith('parent ')).map(s=>s.slice(7));assert.equal(N.qa,e.NATIVE_QA);assert.equal(N.qaTree,e.NATIVE_QA_TREE);assert.deepEqual(parents(N.qa),[e.PRODUCT]);assert.deepEqual(parents(B.qa),[e.PRODUCT]);
          const nativePaths=['.github/workflows/k-league-native-20261105.yml','scripts/qa/kLeagueNativeBrowser.mjs','scripts/qa/nativeScrollReady.mjs'],publicPaths=['.github/workflows/k-league-public-20261105.yml','scripts/qa/kLeaguePublicBrowser.mjs','scripts/qa/kLeaguePublicAssets.mjs'];
          const remove=(actual,base,paths,label)=>{const expected=[...new Set([...Object.keys(actual),...Object.keys(base)])].filter(p=>JSON.stringify(actual[p])!==JSON.stringify(base[p])).sort();assert.deepEqual(expected,paths.slice().sort(),label);const inverse=structuredClone(actual);for(const p of paths){assert(!base[p],label+' added only');assert.equal(actual[p]?.mode,'100644');delete inverse[p];}assert.deepEqual(inverse,base,label+' complete leaf-vector inverse');};
          remove(maps.native,maps.product,nativePaths,'K_PUBLIC_NATIVE_THREE_ADDS');remove(maps.build,maps.product,[B.workflowPath],'K_PUBLIC_BUILD_SOLE_WORKFLOW');remove(maps.public,maps.native,publicPaths,'K_PUBLIC_THREE_ADDS');
          assert.deepEqual(maps.published,maps.product);assert.deepEqual(maps.deployed,maps.product);assert.equal(maps.native[N.workflowPath].blob,N.workflowBlob);assert.equal(maps.build[B.workflowPath].blob,B.workflowBlob);
          assert.equal(maps.native['scripts/qa/kLeagueNativeBrowser.mjs'].blob,e.NATIVE_BROWSER_BLOB);assert.equal(maps.native['scripts/qa/nativeScrollReady.mjs'].blob,e.READY_BLOB);
          const copied=structuredClone(maps.public),omitted=publicPaths[0],held=copied[omitted];delete copied[omitted];let owned;try{remove(copied,maps.native,publicPaths,'K_PUBLIC_THREE_ADDS');}catch(error){owned=error;}assert(owned instanceof assert.AssertionError);assert.match(owned.message,/K_PUBLIC_THREE_ADDS/);copied[omitted]=held;assert.deepEqual(copied,maps.public);
          assert.equal(git('rev-parse',e.CATALOGUE_BASELINE_CORE+'^{tree}'),e.CATALOGUE_BASELINE_TREE);
          const beforeLedgerBytes=execFileSync('git',['show',e.CATALOGUE_BASELINE_CORE+':scripts/data/lastmod.json'],{maxBuffer:2*1024*1024}),currentLedgerBytes=fs.readFileSync('scripts/data/lastmod.json'),blob=b=>createHash('sha1').update('blob '+b.length+'\0').update(b).digest('hex'),sha=b=>createHash('sha256').update(b).digest('hex');
          assert.equal(blob(beforeLedgerBytes),e.CATALOGUE_BASELINE_LEDGER_BLOB);fs.writeFileSync(out+'/catalogue-ledger-before.json',beforeLedgerBytes,{flag:'wx'});fs.writeFileSync(out+'/catalogue-ledger-current.json',currentLedgerBytes,{flag:'wx'});
          const oldLedger=JSON.parse(beforeLedgerBytes),newLedger=JSON.parse(currentLedgerBytes),bodyRoutes=['/career-ladder','/dart-draft','/soccer-career','/search','/who-am-i','/soccer','/club-manager','/cbb-dynasty'],expectedIndexable=bodyRoutes.filter(route=>route!=='/search'),baseline=tree(e.CATALOGUE_BASELINE_CORE);
          assert.deepEqual(Object.keys(newLedger),Object.keys(oldLedger));assert.equal(oldLedger.__version,3);assert.equal(newLedger.__version,oldLedger.__version);assert(!Object.hasOwn(oldLedger,'/search'));assert(!Object.hasOwn(newLedger,'/search'));
          const ledgerChanged=Object.keys(oldLedger).filter(p=>p!=='__version'&&JSON.stringify(oldLedger[p])!==JSON.stringify(newLedger[p]));assert(ledgerChanged.every(route=>expectedIndexable.includes(route)),'K_PUBLIC_ONLY_ACTUAL_SELECTED_LEDGER_CHANGES');
          for(const route of ledgerChanged){assert.notEqual(oldLedger[route].hash,newLedger[route].hash,'Actual fingerprint change, not merely a date');assert(/^\d{4}-\d{2}-\d{2}$/.test(newLedger[route].date));assert(newLedger[route].date>=oldLedger[route].date);assert(newLedger[route].date<=new Date().toISOString().slice(0,10));}
          const snapshotRows=bodyRoutes.map(route=>{const p='public'+route+'/index.html',before=baseline[p],after=maps.product[p],b=fs.readFileSync(p);assert(before&&after);assert.equal(before.mode,'100644');assert.equal(after.mode,'100644');assert.notEqual(before.blob,after.blob,'K_PUBLIC_ACTUAL_SNAPSHOT_BODY_CHANGED '+route);assert.equal(blob(b),after.blob);return{route,path:p,beforeGitBlob:before.blob,afterGitBlob:after.blob,bytes:b.length,sha256:sha(b),bodyChanged:true,indexable:route!=='/search'};});
          assert.equal(snapshotRows.length,8);const paths=snapshotRows.filter(row=>row.indexable).map(row=>row.route);assert.deepEqual(paths.slice().sort(),expectedIndexable.slice().sort());assert.equal(paths.length,7);
          const xml=fs.readFileSync('public/sitemap.xml','utf8'),submitted=[...xml.matchAll(/<loc>([^<]+)<\/loc>/g)].map(v=>v[1]);assert(!submitted.includes('https://douknowball.com/search'));for(const route of paths)assert.equal(submitted.filter(v=>v==='https://douknowball.com'+route).length,1);
          fs.writeFileSync(out+'/indexnow-changed-indexable-snapshots.json',JSON.stringify({status:'EXACT_ACTUAL_SEVEN_BODY_CHANGED_INDEXABLE_SNAPSHOTS',baseline:{commit:e.CATALOGUE_BASELINE_CORE,tree:e.CATALOGUE_BASELINE_TREE,ledgerBlob:blob(beforeLedgerBytes),bytes:beforeLedgerBytes.length,sha256:sha(beforeLedgerBytes)},product:{commit:e.PRODUCT,tree:e.PRODUCT_TREE},currentLedger:{bytes:currentLedgerBytes.length,sha256:sha(currentLedgerBytes)},paths,snapshotRows,ledgerChangedKeys:ledgerChanged,ledgerChangedRows:ledgerChanged.map(route=>({route,before:oldLedger[route],after:newLedger[route]})),searchAbsent:true,otherLedgerRowsAndVersionHeld:true,scope:'Eight actual before/after Git body identities, minus intentionalnoindex Search. Ledger hash/date changes are measured separately and may be fewer than seven; no indexing promise.'},null,2)+'\n',{flag:'wx'});
          fs.writeFileSync(out+'/source-role-blob-maps.json',JSON.stringify({roles,maps,nativePaths,publicPaths,buildWorkflow:B.workflowPath,allAppModelDataRootStyleLocksLiteral:true,noBuildInputExemption:true,sourceIndependentAdmission:e.FINAL_SOURCE_INDEPENDENT_SHA,copiedOmissionControl:{changed:true,name:owned.name,message:owned.message,wholeInverseExact:true,actualHeld:true}},null,2)+'\n');
          ROLES
      - name: Authenticate the successful native original and the final successful normal build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
