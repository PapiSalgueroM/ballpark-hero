            const originalBytes=fs.readFileSync(out+'/input/native/input/native-manifest.json'),original=JSON.parse(originalBytes),actualBytes=fs.readFileSync(out+'/public-manifest.json'),m=JSON.parse(actualBytes),bridge=JSON.parse(fs.readFileSync(out+'/manifest-bridge.json'));
            assert.equal(actualBytes.length,bridge.derivedManifestBytes);assert.equal(sha(actualBytes),bridge.derivedManifestSHA256);assert.equal(originalBytes.length,bridge.originalManifestBytes);assert.equal(sha(originalBytes),bridge.originalManifestSHA256);
            assert.deepEqual(m.sourceBefore,m.sourceAfter);for(const[p,d]of Object.entries(m.sourceAfter))assert.equal(sha(fs.readFileSync(p)),d,p);
            const inverse=JSON.parse(actualBytes);for(const p of bridge.addedMapPaths){assert(Object.hasOwn(inverse.sourceBefore,p)&&Object.hasOwn(inverse.sourceAfter,p));delete inverse.sourceBefore[p];delete inverse.sourceAfter[p];}delete inverse.public;inverse.schema=original.schema;inverse.status=original.status;assert(Buffer.from(json(inverse)).equals(originalBytes),'K_PUBLIC_FINAL_WHOLE_NATIVE_MANIFEST_BYTE_INVERSE');
            assert(fs.readFileSync(e.QA_REF+'/native/evidence/input/native-manifest.json').equals(originalBytes));assert(fs.readFileSync(e.QA_REF+'/native/evidence/source-before.sha256').equals(fs.readFileSync(out+'/input/native/source-before.sha256')));
            assert.deepEqual(inventory(e.QA_DIST),m.distBefore);assert.equal(sha(JSON.stringify(m.distBefore)),m.distDigest);
          }
          const admission=out+'/public-native-admission.json',runtimePassed=fs.existsSync(admission);if(runtimePassed){const expected=['assets-after.log','assets-before.log','browser.log','types.log'];assert.deepEqual(fs.readdirSync(out+'/transport').sort(),expected);for(const file of expected)assert.equal(fs.readFileSync(out+'/transport/'+file).length,0);for(const name of ['types','assets-before','browser','assets-after'])assert.equal(fs.readFileSync(out+'/logs/'+name+'.exit','utf8').trim(),'0');}
