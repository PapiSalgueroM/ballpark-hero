      - name: Audit nine indexable documents and require the actual Search noindex policy
        shell: bash
        run: |
          set +e
          set -uo pipefail
          unset NODE_OPTIONS
          test -f "$QA_OUT/public-native-admission.json" || exit 1
          test -f "$QA_OUT/public-http-policy-admission.json" || exit 1
          node scripts/auditLive.mjs / /club-manager /soccer-career /deadline-day /career-ladder /dart-draft /who-am-i /soccer /cbb-dynasty > "$QA_OUT/logs/audit-live.stdout.log" 2> "$QA_OUT/logs/audit-live.stderr.log"
