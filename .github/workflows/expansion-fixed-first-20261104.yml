name: Expansion fixed outcomes
on:
  push:
    branches: [codex/expansion-fixed-first-20261104]
permissions:
  contents: read
env:
  CI: '1'
  SIM_NETWORK: offline
jobs:
  fixed:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Hold exact source and dependencies
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/expansion-fixed-first"
          mkdir -p "$OUT/logs" "$OUT/raw"/{sc,us,fo,payroll,hub} "$OUT/transport"
          echo "QA_OUT=$OUT" >> "$GITHUB_ENV"
          test "$(git rev-parse HEAD^)" = 0d070f4e557011176b64d4272da16e39fa0f36cd
          test "$(git rev-parse HEAD^^{tree})" = 2ad8fd55946adb9f684364af763d9e0fd0794252
          git rev-parse HEAD HEAD^{tree} > "$OUT/source.txt"
          git ls-files -z | sort -z | xargs -0 sha256sum > "$OUT/source-before.sha256"
          git status --porcelain=v1 --untracked-files=all > "$OUT/status-before.txt"
          test ! -s "$OUT/status-before.txt"
          cp .github/workflows/expansion-fixed-first-20261104.yml "$OUT/workflow.yml"
          npm ci --no-audit --no-fund > "$OUT/logs/install.log" 2>&1
          git diff --exit-code HEAD -- package.json package-lock.json bun.lockb
      - name: Proper types and real new plus adjacent outcomes
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$GITHUB_WORKSPACE/scripts/lib/offlineTransport.cjs"
          : > "$QA_OUT/transport/types.log"
          SIM_OFFLINE_RECEIPT="$QA_OUT/transport/types.log" node_modules/.bin/tsc --noEmit -p tsconfig.app.json > "$QA_OUT/logs/types.log" 2>&1
          export SC_OFFER_NEGOTIATION_RAW="$QA_OUT/raw/sc" US_FREE_PRACTICE_RAW="$QA_OUT/raw/us" FO_DRAFT_PROSPECT_RAW="$QA_OUT/raw/fo" TYCOON_PAYROLL_RAW="$QA_OUT/raw/payroll" HUB_GAME_PICKS_RAW="$QA_OUT/raw/hub"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';import {spawnSync} from 'node:child_process';
          const out=process.env.QA_OUT,receipt=out+'/transport/units.log';fs.writeFileSync(receipt,'');
          const p=spawnSync(process.execPath,['node_modules/vitest/vitest.mjs','run',...["src/test/usCareerFreePractice.test.tsx","src/test/frontOfficeDraftAccess.test.tsx","src/test/tycoonPayrollBatch.test.tsx","src/test/hubGamePicks.test.tsx","src/test/soccerOfferNegotiationTarget.test.tsx","src/test/usCareerPractice.test.tsx","src/test/gamePicks.test.tsx","src/test/tycoonUpgradeBatch.test.tsx","src/test/tycoonSaveNotice.test.tsx","src/test/tycoonTicketPolicy.test.tsx","src/test/soccerCareerContracts.test.ts","src/test/soccerCareerProgrammeUi.test.tsx"],'--maxWorkers=1','--no-file-parallelism','--reporter=default','--reporter=json','--outputFile='+out+'/units.json'],{env:{...process.env,SIM_OFFLINE_RECEIPT:receipt},encoding:'utf8',timeout:900000,maxBuffer:32*1024*1024});
          const log=(p.stdout||'')+'\n'+(p.stderr||'');fs.writeFileSync(out+'/logs/units.log',log);fs.writeFileSync(out+'/units.exit.json',JSON.stringify({status:p.status,signal:p.signal,error:p.error?String(p.error):null})+'\n');
          assert(!p.error&&p.signal===null,'Native completion');assert.equal(p.status,0);
          assert(!/Unhandled\s+(?:Error|Rejection)|Vitest caught [1-9]|uncaughtException|unhandledRejection/i.test(log));
          const j=JSON.parse(fs.readFileSync(out+'/units.json')),rows=j.testResults.flatMap(s=>s.assertionResults);
          assert(j.success);assert.equal(j.numFailedTests,0);assert.equal(j.numPendingTests,0);assert.equal(j.numTodoTests,0);assert.equal(rows.length,j.numPassedTests);
          assert(rows.length>27);assert(rows.every(r=>r.status==='passed'));assert.equal(j.testResults.length,12);
          for(const name of ["US free practice after banking NBA repeats a banked drill without another reward or save","US free practice after banking NFL repeats a banked drill without another reward or save","US free practice after banking NBA reopens all four free drills with private randomness and unchanged career bytes","US free practice after banking NFL reopens all four free drills with private randomness and unchanged career bytes","US free practice after banking MLB keeps the existing post-bank lock without writes or random draws","US free practice after banking NHL keeps the existing post-bank lock without writes or random draws","NFL draft prospect access reaches all forty prospects through eighteen-row pages without changing the draft","NFL draft prospect access drafts a filtered prospect beyond the first page and preserves exact rival picks and draws","NFL draft prospect access resets a later page when the position changes and keeps empty groups safe","NFL draft prospect access holds the scouting directors grades and order without exposing true ratings","Stadium payroll batches holds one hire, unrelated fields, input and global draws","Stadium payroll batches buys five steward levels at their existing escalating prices","Stadium payroll batches buys only three affordable steward levels from341","Stadium payroll batches holds the existing staff cap and exact unaffordable no-ops","Stadium payroll batches quotes, hires and persists the affordable payroll batch from1000","Stadium payroll batches quotes, hires and persists the affordable payroll batch from341","Sport hub picks and Home pins from /soccer and restores the exact Home destination","Sport hub picks and Home pins from /pro-basketball and restores the exact Home destination","Sport hub picks and Home pins from /pro-football and restores the exact Home destination","Sport hub picks and Home unpins only the selected hub game and keeps the existing Home pick","Sport hub picks and Home uses the existing honest this-visit warning when a hub pin cannot be saved","Soccer selected offer negotiation selects offer B in the real plans screen, counters it, signs and reloads its exact wage","Soccer selected offer negotiation shortens the selected pending offer and retains the real agent wage and fee transforms","Soccer selected offer negotiation counters an expiry offer before applying the existing quoted loyalty contract and codec","Soccer selected offer negotiation records a rejected B attempt once while preserving both offers and leaving A available","Soccer selected offer negotiation refuses stale, outside, loan and invalid explicit targets without touching the current first offer","Soccer selected offer negotiation preserves omitted-target first-offer behavior through signing and the existing save codec"])assert.equal(rows.filter(r=>r.fullName===name&&r.status==='passed').length,1,name);
          const census={sc:6,us:6,fo:4,payroll:6,hub:5};for(const[folder,count]of Object.entries(census)){const paths=fs.readdirSync(out+'/raw/'+folder);assert.equal(paths.length,count,folder);for(const path of paths)JSON.parse(fs.readFileSync(out+'/raw/'+folder+'/'+path));}
          fs.writeFileSync(out+'/fixed-admission.json',JSON.stringify({status:'fixed-outcomes',total:rows.length,newCases:27,files:j.testResults.length,nativeExit:0,runtimeErrors:j.numRuntimeErrors??'UNKNOWN',raw:census,scope:'Proper types, actual outcome tests and adjacent tests only. Build/browser/public pending.'},null,2)+'\n');
          NODE
      - name: Always require full source and offline holds
        if: always()
        run: |
          set -euo pipefail
          git diff --exit-code HEAD > "$QA_OUT/source-diff.txt"
          git ls-files -z | sort -z | xargs -0 sha256sum > "$QA_OUT/source-after.sha256"
          cmp "$QA_OUT/source-before.sha256" "$QA_OUT/source-after.sha256"
          git status --porcelain=v1 --untracked-files=all > "$QA_OUT/status-after.txt"
          cmp "$QA_OUT/status-before.txt" "$QA_OUT/status-after.txt"
          for receipt in "$QA_OUT"/transport/*.log; do test ! -s "$receipt"; done
      - name: Bound evidence
        if: always()
        id: artifact
        run: |
          set -euo pipefail
          test "$(du -sb "$QA_OUT" | cut -f1)" -lt 50000000
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.artifact.outputs.ready == 'true' }}
        with:
          name: expansion-fixed-first
          path: ${{ runner.temp }}/expansion-fixed-first
          if-no-files-found: error
          retention-days: 7
