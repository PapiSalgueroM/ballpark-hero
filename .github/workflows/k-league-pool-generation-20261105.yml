      - name: Restore the original generated target and hold all source, index, paths, locks and receipts
        if: always()
        run: |
          set -euo pipefail
          node --input-type=module <<'RESTORE'
          import fs from 'node:fs';import path from 'node:path';import assert from 'node:assert/strict';import crypto from 'node:crypto';
          const out=process.env.QA_OUT,target=path.resolve('src/data/soccerCareerClubPool.ts'),root=fs.realpathSync('.');
          assert(target.startsWith(root+path.sep));assert(fs.lstatSync(target).isFile()&&!fs.lstatSync(target).isSymbolicLink());
          const old=fs.readFileSync(out+'/original/soccerCareerClubPool.ts'),blob=crypto.createHash('sha1').update(Buffer.from('blob '+old.length+'\0')).update(old).digest('hex');
          assert.equal(blob,'9340217fac2ae3a86877ac878fcd677d22c973bd');
          fs.writeFileSync(target,old);assert(fs.readFileSync(target).equals(old));
          fs.writeFileSync(out+'/final-restoration.json',JSON.stringify({target:'src/data/soccerCareerClubPool.ts',bytes:old.length,gitBlob:blob,wholeBytesRestored:true})+'\n');
          RESTORE
          git ls-files -z | sort -z | xargs -0 sha256sum > "$QA_OUT/source-after.sha256"
          git ls-files -s > "$QA_OUT/index-after.txt"
          git ls-files -z > "$QA_OUT/tracked-after.bin"
          for lock in package.json package-lock.json bun.lock bun.lockb; do if test -f "$lock"; then sha256sum "$lock"; fi; done > "$QA_OUT/locks-after.sha256"
          cmp "$QA_OUT/source-before.sha256" "$QA_OUT/source-after.sha256"
          cmp "$QA_OUT/index-before.txt" "$QA_OUT/index-after.txt"
          cmp "$QA_OUT/tracked-before.bin" "$QA_OUT/tracked-after.bin"
          cmp "$QA_OUT/locks-before.sha256" "$QA_OUT/locks-after.sha256"
          git diff --exit-code HEAD > "$QA_OUT/source-diff.txt"
          git status --porcelain=v1 --untracked-files=all > "$QA_OUT/status-after.txt"
          test ! -s "$QA_OUT/status-after.txt"
          node --input-type=module <<'HELD'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const out=process.env.QA_OUT,receipts=fs.readdirSync(out+'/transport').sort().map(file=>{const b=fs.readFileSync(out+'/transport/'+file);assert.equal(b.length,0,file);return{file,bytes:b.length};});
          if(fs.existsSync(out+'/GENERATED-POOL-ADMITTED.json'))assert.equal(receipts.length,12,'All expected actual command receipts');
          fs.writeFileSync(out+'/source-output-hold.json',JSON.stringify({sourceHeld:true,indexHeld:true,trackedPathsHeld:true,locksHeld:true,status:'clean',originalGeneratedTargetRestored:true,receipts},null,2)+'\n');
          HELD
      - name: Pack bounded complete output or fatal diagnostic
        id: pack
        if: always()
        run: |
          set +e
          set -uo pipefail
          archive="$RUNNER_TEMP/k-league-pool-generation-evidence.tar.gz"
          tar -czf "$archive" -C "$QA_OUT" . > "$RUNNER_TEMP/k-league-pool-generation-pack.log" 2>&1
          pack_exit=$?
          printf '%s\n' "$pack_exit" > "$QA_OUT/pack-native.exit" || exit 1
          if [[ "$pack_exit" == 0 && -f "$archive" && "$(stat -c %s "$archive")" -le 50000000 ]]; then
            sha256sum "$archive" > "$archive.sha256" || exit 1
            printf 'archive=%s\n' "$archive" >> "$GITHUB_OUTPUT" || exit 1
            exit 0
          fi
          printf '%s\n' 'DIAGNOSTIC_ONLY_NO_COMPLETE_OUTPUT_PROOF: full pack failed or exceeded50000000bytes' > "$QA_OUT/DIAGNOSTIC-ONLY.txt" || exit 1
          cp "$RUNNER_TEMP/k-league-pool-generation-pack.log" "$QA_OUT/pack.log" || exit 1
          diagnostic="$RUNNER_TEMP/k-league-pool-generation-diagnostic.tar.gz"
          diagnostic_dir="$RUNNER_TEMP/k-league-pool-generation-diagnostic"
          mkdir -p "$diagnostic_dir/logs" "$diagnostic_dir/transport" || exit 1
          find "$QA_OUT" -maxdepth 1 -type f ! -name '*.tar.gz' ! -name '*.tgz' -exec cp '{}' "$diagnostic_dir/" \; || exit 1
          cp -R "$QA_OUT/logs/." "$diagnostic_dir/logs/" || exit 1
          cp -R "$QA_OUT/transport/." "$diagnostic_dir/transport/" || exit 1
          for folder in original generated reader-controls official-controls commands; do if test -d "$QA_OUT/$folder"; then cp -R "$QA_OUT/$folder" "$diagnostic_dir/" || exit 1; fi; done
          tar -czf "$diagnostic" -C "$diagnostic_dir" . || exit 1
          test "$(stat -c %s "$diagnostic")" -le 50000000 || exit 1
          sha256sum "$diagnostic" > "$diagnostic.sha256" || exit 1
          printf 'archive=%s\n' "$diagnostic" >> "$GITHUB_OUTPUT" || exit 1
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k-league-pool-generation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.pack.outputs.archive }}
            ${{ steps.pack.outputs.archive }}.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
