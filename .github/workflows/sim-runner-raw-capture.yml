      - name: Actual two-file plan must not create its requested capture directory
        id: plan
        timeout-minutes: 2
        run: |
          set -euo pipefail
          out="$RUNNER_CAPTURE_OUT";status=0
          ONLY=simCareerLeagueFinish,simCareerWallShotFriendly SIM_RUNNER_ARTIFACTS="$out/plan-must-stay-absent" NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$out/plan.transport" timeout --signal=TERM --kill-after=15s 1m node scripts/runAllSims.mjs --plan-json > "$out/plan.json" 2> "$out/plan.stderr.log" || status=$?
          printf '%s\n' "$status" > "$out/plan.exit"
          classify=0;NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$out/plan.transport" node "$out/qa.cjs" plan > "$out/plan-classifier.stdout.log" 2> "$out/plan-classifier.stderr.log" || classify=$?
          printf '%s\n' "$classify" > "$out/plan-classifier.exit";test "$status" -eq 0;test "$classify" -eq 0;test ! -s "$out/plan.transport"
      - name: Same two actual writers with the raw-capture option absent
        id: default
        timeout-minutes: 6
        run: |
          set -euo pipefail
          out="$RUNNER_CAPTURE_OUT";dir="$out/default"
          unset BROWSER SIM_RUNNER_ARTIFACTS SIM_RUNNER_PROGRESS
          streams="$RUNNER_TEMP/sim-runner-raw-capture/streams-default";mkdir -m 700 "$streams"
          mkfifo "$streams/stdout" "$streams/stderr"
          tee "$dir/runner.stdout.log" < "$streams/stdout" & stdout_pid=$!
          tee "$dir/runner.stderr.log" < "$streams/stderr" >&2 & stderr_pid=$!
          status=0
          ONLY=simCareerLeagueFinish,simCareerWallShotFriendly SIM_NETWORK=offline SIM_FULL_OUTPUT=1 SIM_LEAGUE_FINISH_ARTIFACTS="$dir/writers/league" SIM_WALL_SHOT_REPORT="$dir/writers/wall.json" NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$out/default.transport" timeout --signal=TERM --kill-after=15s 5m node scripts/runAllSims.mjs > "$streams/stdout" 2> "$streams/stderr" || status=$?
          printf '%s\n' "$status" > "$dir/runner.exit"
          stdout_status=0;wait "$stdout_pid" || stdout_status=$?
          stderr_status=0;wait "$stderr_pid" || stderr_status=$?
          printf '%s\n' "$stdout_status" > "$dir/tee-stdout.exit";printf '%s\n' "$stderr_status" > "$dir/tee-stderr.exit"
          test "$stdout_status" -eq 0;test "$stderr_status" -eq 0;test "$status" -eq 0
          test ! -s "$out/default.transport"
      - name: Same two actual writers with opt-in complete raw capture
        id: captured
        timeout-minutes: 6
        run: |
          set -euo pipefail
          out="$RUNNER_CAPTURE_OUT";dir="$out/captured"
          unset BROWSER SIM_RUNNER_ARTIFACTS SIM_RUNNER_PROGRESS
          streams="$RUNNER_TEMP/sim-runner-raw-capture/streams-captured";mkdir -m 700 "$streams"
          mkfifo "$streams/stdout" "$streams/stderr"
          tee "$dir/runner.stdout.log" < "$streams/stdout" & stdout_pid=$!
          tee "$dir/runner.stderr.log" < "$streams/stderr" >&2 & stderr_pid=$!
          status=0
          ONLY=simCareerLeagueFinish,simCareerWallShotFriendly SIM_NETWORK=offline SIM_FULL_OUTPUT=1 SIM_RUNNER_PROGRESS=1 SIM_RUNNER_ARTIFACTS="$dir/capture" SIM_LEAGUE_FINISH_ARTIFACTS="$dir/writers/league" SIM_WALL_SHOT_REPORT="$dir/writers/wall.json" NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$out/captured.transport" timeout --signal=TERM --kill-after=15s 5m node scripts/runAllSims.mjs > "$streams/stdout" 2> "$streams/stderr" || status=$?
          printf '%s\n' "$status" > "$dir/runner.exit"
          stdout_status=0;wait "$stdout_pid" || stdout_status=$?
          stderr_status=0;wait "$stderr_pid" || stderr_status=$?
          printf '%s\n' "$stdout_status" > "$dir/tee-stdout.exit";printf '%s\n' "$stderr_status" > "$dir/tee-stderr.exit"
          test "$stdout_status" -eq 0;test "$stderr_status" -eq 0;test "$status" -eq 0
          test ! -s "$out/captured.transport"
      - name: Admit original native outcomes and independently bound raw evidence
        id: admit
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          set -euo pipefail
          out="$RUNNER_CAPTURE_OUT";status=0
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$out/admit.transport" node "$out/qa.cjs" admit > "$out/admit.stdout.log" 2> "$out/admit.stderr.log" || status=$?
          printf '%s\n' "$status" > "$out/admit.exit";test "$status" -eq 0;test ! -s "$out/admit.transport"
      - name: Three physical copied-evidence controls and exact restored classifiers
        id: controls
        if: ${{ !cancelled() && steps.admit.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          set -euo pipefail
          out="$RUNNER_CAPTURE_OUT";status=0
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$out/controls.transport" node "$out/qa.cjs" controls > "$out/controls.stdout.log" 2> "$out/controls.stderr.log" || status=$?
          printf '%s\n' "$status" > "$out/controls.exit";test "$status" -eq 0;test ! -s "$out/controls.transport"
      - name: Always preserve safe partial writer inventories and default locations
        id: final_inspect
        if: ${{ always() }}
        timeout-minutes: 2
        run: |
          set -euo pipefail
          out="$RUNNER_CAPTURE_OUT";status=1
          if test -f "$out/qa.cjs";then
            status=0;NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$out/final-inspect.transport" node "$out/qa.cjs" after > "$out/final-inspect.stdout.log" 2> "$out/final-inspect.stderr.log" || status=$?
          else printf '%s\n' 'Preparation missing; partial outcome UNKNOWN.' > "$out/final-inspect.stderr.log";fi
          printf '%s\n' "$status" > "$out/final-inspect.exit";test "$status" -eq 0;test -f "$out/final-inspect.transport" && test ! -s "$out/final-inspect.transport"
      - name: Always require full source, dependency, generated-source and receipt holds
        id: holds
        if: ${{ always() }}
        timeout-minutes: 3
        run: |
          set -uo pipefail
          out="$RUNNER_CAPTURE_OUT";failed=0
          if test -f "$out/source-before.sha256";then
            sha256sum -c "$out/source-before.sha256" > "$out/final-source-hold.log" 2>&1 || failed=1
            git ls-files -z | sort -z > "$out/source-members.after" || failed=1
            cmp "$out/source-members.before" "$out/source-members.after" > "$out/final-source-members.log" 2>&1 || failed=1
            xargs -0 sha256sum < "$out/source-members.after" > "$out/source-after.sha256" || failed=1
            cmp "$out/source-before.sha256" "$out/source-after.sha256" > "$out/final-source-sha.log" 2>&1 || failed=1
          else failed=1;fi
          if test -f "$out/dependencies.sha256";then
            sha256sum -c "$out/dependencies.sha256" > "$out/final-dependencies-hold.log" 2>&1 || failed=1
            find node_modules -path node_modules/.vite -prune -o -type f -print0 | sort -z > "$out/dependency-members.after" || failed=1
            cmp "$out/dependency-members.before" "$out/dependency-members.after" > "$out/final-dependency-members.log" 2>&1 || failed=1
            xargs -0 sha256sum < "$out/dependency-members.after" > "$out/dependencies-end.sha256" || failed=1
            cmp "$out/dependencies.sha256" "$out/dependencies-end.sha256" > "$out/final-dependency-sha.log" 2>&1 || failed=1
          else failed=1;fi
          if test -f "$out/qa-source.sha256";then sha256sum -c "$out/qa-source.sha256" > "$out/qa-source-final.log" 2>&1 || failed=1;else failed=1;fi
          git rev-parse HEAD > "$out/head-after.txt" || failed=1
          test "$(cat "$out/head-after.txt")" = "$GITHUB_SHA" || failed=1
          git diff --exit-code HEAD > "$out/final-source-diff.log" 2>&1 || failed=1
          git status --porcelain --untracked-files=all > "$out/final-status.txt" || failed=1
          test ! -s "$out/final-status.txt" || failed=1
          binding_status=0
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$out/holds.transport" node <<'NODE' > "$out/final-binding.stdout.log" 2> "$out/final-binding.stderr.log" || binding_status=$?
          const fs=require('node:fs'),a=require('node:assert/strict'),cp=require('node:child_process'),{createHash}=require('node:crypto'),out=process.env.RUNNER_CAPTURE_OUT,hash=b=>createHash('sha256').update(b).digest('hex');
          const git=(...args)=>cp.execFileSync('git',args,{encoding:'utf8'}).trim(),binding=JSON.parse(fs.readFileSync(out+'/source-binding.json','utf8'));
          a.equal(git('rev-parse','HEAD'),process.env.GITHUB_SHA);a.equal(git('show','-s','--format=%P','HEAD'),process.env.BASE_SOURCE);
          a.equal(binding.source,process.env.GITHUB_SHA);a.equal(binding.parent,process.env.BASE_SOURCE);a.equal(binding.base,process.env.BASE_SOURCE);a.equal(binding.tree,git('rev-parse','HEAD^{tree}'));a.equal(binding.run,process.env.GITHUB_RUN_ID);a.equal(binding.attempt,process.env.GITHUB_RUN_ATTEMPT);a.equal(binding.sourceCount,5329);
          a(Array.isArray(binding.pins));a.equal(binding.pins.length,34);a.equal(new Set(binding.pins.map(p=>p.file)).size,34);
          for(const pin of binding.pins){const st=fs.lstatSync(pin.file);a(st.isFile()&&!st.isSymbolicLink(),pin.file);const b=fs.readFileSync(pin.file);a.equal(b.length,pin.bytes,pin.file);a.equal(hash(b),pin.sha256,pin.file);a.equal(git('rev-parse','HEAD:'+pin.file),pin.gitBlob,pin.file);}
          const workflow='.github/workflows/sim-runner-raw-capture.yml',body=fs.readFileSync(workflow);a.equal(binding.workflow.file,workflow);a.equal(body.length,binding.workflow.bytes);a.equal(hash(body),binding.workflow.sha256);a.equal(git('rev-parse','HEAD:'+workflow),binding.workflow.gitBlob);a.equal(git('hash-object',workflow),binding.workflow.gitBlob);
          const qaStat=fs.lstatSync(out+'/qa.cjs');a(qaStat.isFile()&&!qaStat.isSymbolicLink());const qa=fs.readFileSync(out+'/qa.cjs');a.equal(qa.length,19274);a.equal(hash(qa),'107f49cf9fa8423e5678e436c3e5c559d9dd1b5b946a46b2f8fc9327e6db8836');
          const result={source:binding.source,tree:binding.tree,run:binding.run,attempt:binding.attempt,criticalPins:binding.pins.length,workflow:binding.workflow,generatedQa:{bytes:qa.length,sha256:hash(qa)},scope:'FINAL_SOURCE_BINDING_ONLY',fullSuiteQualified:false,applicationQualified:false};fs.writeFileSync(out+'/final-binding.json',JSON.stringify(result,null,2)+'\n',{flag:'wx'});console.log(JSON.stringify(result));
          NODE
          printf '%s\n' "$binding_status" > "$out/final-binding.exit";test "$binding_status" -eq 0 || failed=1
          test -f "$out/holds.transport" && test ! -s "$out/holds.transport" || failed=1
          for name in source prepare plan default captured admit controls final-inspect holds;do test -f "$out/$name.transport" && test ! -s "$out/$name.transport" || failed=1;done
          for name in missing-real-stream truncated-real-stream pending-close-is-unknown;do
            for arm in changed restored;do test -f "$out/control-$name-$arm.transport" && test ! -s "$out/control-$name-$arm.transport" || failed=1;done
          done
          for name in prepare plan plan-classifier admit controls final-inspect;do test -f "$out/$name.exit" && test "$(cat "$out/$name.exit")" = 0 || failed=1;done
          for mode in default captured;do for name in runner tee-stdout tee-stderr;do test -f "$out/$mode/$name.exit" && test "$(cat "$out/$mode/$name.exit")" = 0 || failed=1;done;done
          printf '%s\n' "$failed" > "$out/final-holds.exit";test "$failed" -eq 0
      - name: Always record scoped stages and retain complete actual evidence
        if: ${{ always() }}
        env:
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          DEPENDENCY_OUTCOME: ${{ steps.dependencies.outcome }}
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
          DEFAULT_OUTCOME: ${{ steps.default.outcome }}
          CAPTURED_OUTCOME: ${{ steps.captured.outcome }}
          ADMIT_OUTCOME: ${{ steps.admit.outcome }}
          CONTROLS_OUTCOME: ${{ steps.controls.outcome }}
          HOLDS_OUTCOME: ${{ steps.holds.outcome }}
        run: |
          set -euo pipefail
          out="$RUNNER_CAPTURE_OUT"
          printf '%s\n' 'phase=runner-raw-capture-two-existing-writers' "source=$GITHUB_SHA" "sourceGate=$SOURCE_OUTCOME" "dependencies=$DEPENDENCY_OUTCOME" "plan=$PLAN_OUTCOME" "defaultPair=$DEFAULT_OUTCOME" "capturedPair=$CAPTURED_OUTCOME" "admission=$ADMIT_OUTCOME" "physicalControls=$CONTROLS_OUTCOME" "finalHolds=$HOLDS_OUTCOME" 'plannedWriterFaultProcesses=0' 'plannedClassifierProcesses=6' 'liveParentTerminationPersistence=UNQUALIFIED' 'wholeSuiteReplayed=false' 'oldTimeoutCause=UNKNOWN' 'applicationQualified=false' 'published=false' > "$out/stages.txt"
          find "$out" ! -type d ! -type f -print > "$out/evidence-nonregular.txt";test ! -s "$out/evidence-nonregular.txt"
          (cd "$out" && find . -type f ! -name evidence.sha256 -print0 | sort -z | xargs -0 sha256sum > evidence.sha256)
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: sim-runner-raw-capture-${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ env.RUNNER_CAPTURE_OUT }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
