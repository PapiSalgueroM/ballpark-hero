name: Sim runner raw capture, two existing writer harnesses
on:
  push:
    branches: [codex/sim-runner-raw-capture-20261024]
    paths-ignore: ['docs/**']
permissions:
  contents: read
concurrency:
  group: sim-runner-raw-capture-${{ github.sha }}
  cancel-in-progress: false
env:
  BASE_SOURCE: c68efda97a1f53643965e09fd8f3beaa92952dee
  CI: '1'
  SIM_NETWORK: offline
  TZ: UTC
jobs:
  pair_capture:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - name: Fresh outside-checkout evidence
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/sim-runner-raw-capture";test ! -e "$base";mkdir -m 700 "$base"
          out="$base/evidence";mkdir -m 700 "$out"
          export RUNNER_CAPTURE_OUT="$out";echo "RUNNER_CAPTURE_OUT=$out" >> "$GITHUB_ENV"
          printf '%s\n' "$GITHUB_SHA" > "$out/head.txt"
          printf '%s\n' "$GITHUB_RUN_ID" > "$out/run-id.txt"
          printf '%s\n' "$GITHUB_RUN_ATTEMPT" > "$out/run-attempt.txt"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - name: Exact two-path c68 child, full history and complete source binding
        id: source
        timeout-minutes: 2
        run: |
          set -euo pipefail
          out="$RUNNER_CAPTURE_OUT"
          test "$GITHUB_REPOSITORY" = PapiSalgueroM/ballpark-hero
          test "$GITHUB_REPOSITORY_ID" = 1195729679
          test "$GITHUB_REF" = refs/heads/codex/sim-runner-raw-capture-20261024
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git show -s --format=%P HEAD)" = "$BASE_SOURCE"
          test "$(git rev-parse "$BASE_SOURCE^{tree}")" = 2ed6ec6b809dd78967867a1330223b0630584b08
          git diff --name-status "$BASE_SOURCE" HEAD > "$out/direct-and-cumulative-paths.txt"
          printf 'A\t.github/workflows/sim-runner-raw-capture.yml\nM\tscripts/runAllSims.mjs\n' | cmp - "$out/direct-and-cumulative-paths.txt"
          git diff --exit-code "$BASE_SOURCE" HEAD -- . ':!.github/workflows/sim-runner-raw-capture.yml' ':!scripts/runAllSims.mjs' > "$out/all-old-source-held.log"
          git rev-parse HEAD^{tree} > "$out/tree.txt"
          git ls-files -z | sort -z > "$out/source-members.before"
          test "$(tr -cd '\000' < "$out/source-members.before" | wc -c)" -eq 5329
          xargs -0 sha256sum < "$out/source-members.before" > "$out/source-before.sha256"
          git status --porcelain --untracked-files=all > "$out/status-before.txt";test ! -s "$out/status-before.txt"
