name: Report World XI roster depth baseline
on:
  push:
    branches: [codex/report-world-xi-roster-baseline-20261101]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: '1'
      SIM_NETWORK: offline
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Locked dependencies and source
        run: |
          mkdir evidence
          git rev-parse HEAD | tee evidence/head.txt
          test "$(git hash-object src/lib/worldXi.ts)" = d30a6de90d868e789a76d21cf8b87696786f89d2
          sha256sum package.json package-lock.json src/lib/worldXi.ts src/test/worldXiRosterDepth.test.ts > evidence/holds.txt
          npm ci
      - name: App types
        run: node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee evidence/types.log
      - name: Original roster loading outcomes
        run: node_modules/.bin/vitest run src/test/worldXiRosterDepth.test.ts --reporter=verbose --reporter=json --outputFile=evidence/roster.json 2>&1 | tee evidence/roster.log
      - name: Source holds
        if: always()
        run: sha256sum --check evidence/holds.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: roster-baseline-${{ github.run_id }}
          path: evidence/
          retention-days: 14
