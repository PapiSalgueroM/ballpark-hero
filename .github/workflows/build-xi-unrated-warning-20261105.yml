name: Build Your XI clean build and browser closure
on:
  push:
    branches: [codex/build-xi-unrated-warning-qa-20261105]
permissions:
  contents: read
  actions: read
jobs:
  closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      SIM_NETWORK: offline
      SIM_OFFLINE_RECEIPT: xi-warning-closure/offline.log
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Locked dependencies and clean source receipts
        run: |
          mkdir -p xi-warning-closure
          touch xi-warning-closure/offline.log
          git rev-parse HEAD > xi-warning-closure/head.txt
          git rev-parse 'HEAD^{tree}' > xi-warning-closure/tree.txt
          git ls-files -s > xi-warning-closure/source-before.txt
          sha256sum package.json package-lock.json > xi-warning-closure/locks-before.txt
          npm ci
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const lock=JSON.parse(fs.readFileSync('package-lock.json'));
          const rows=Object.keys(lock.packages).filter(p=>p.startsWith('node_modules/')&&fs.existsSync(p+'/package.json')).map(p=>[p,JSON.parse(fs.readFileSync(p+'/package.json')).version]);
          assert.equal(rows.length,521);fs.writeFileSync('xi-warning-closure/installed-before.json',JSON.stringify(rows));
          NODE
      - name: Proper app types
        run: node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee xi-warning-closure/types.log
      - name: Pinned completed qualification artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/PapiSalgueroM/ballpark-hero/actions/artifacts/13473877476/zip > "$RUNNER_TEMP/xi-reference.zip"
          echo "8ed690c48e13f654f43420b34ef32d300f1ce81799d7c8ddb14dad7cc27bdc44  $RUNNER_TEMP/xi-reference.zip" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/xi-reference" "$RUNNER_TEMP/xi-reference-dist"
          unzip -q "$RUNNER_TEMP/xi-reference.zip" -d "$RUNNER_TEMP/xi-reference"
          echo "29a49044547d20a4eb763faf010daba3bd4c64210a7ade012d6e2f6dbce8a96d  $RUNNER_TEMP/xi-reference/dist.tgz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/xi-reference/dist.tgz" -C "$RUNNER_TEMP/xi-reference-dist"
          cp "$RUNNER_TEMP/xi-reference/source-before.txt" xi-warning-closure/reference-source.txt
      - name: Clean production build
        run: NODE_OPTIONS="--max-old-space-size=6144" npm run build 2>&1 | tee xi-warning-closure/build.log
      - name: Every product test script and built byte joined to completed qualification
        id: join
        env:
          XI_REFERENCE_DIR: ${{ runner.temp }}/xi-reference
          XI_REFERENCE_DIST: ${{ runner.temp }}/xi-reference-dist/dist
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import path from 'node:path';import assert from 'node:assert/strict';import {createHash} from 'node:crypto';
          const sha=bytes=>createHash('sha256').update(bytes).digest('hex');
          const gitblob=bytes=>createHash('sha1').update(Buffer.concat([Buffer.from('blob '+bytes.length+'\0'),bytes])).digest('hex');
          const readIndex=file=>new Map(fs.readFileSync(file,'utf8').trim().split('\n').map(line=>{const m=/^[0-9]+ ([0-9a-f]{40}) 0\t(.+)$/.exec(line);assert(m,'Actual source row');return [m[2],m[1]];}));
          const old=readIndex('xi-warning-closure/reference-source.txt'),current=readIndex('xi-warning-closure/source-before.txt');
          const excluded=new Set(['scripts/qa/playBuildXiUnratedWarning.mjs','scripts/qa/checkXiSpinnerLayout.mjs']);
          assert.equal(old.get('scripts/qa/playBuildXiUnratedWarning.mjs'),'d7ae347704349a5f89cd9f187a8880b3e56d9d7c');
          assert.equal(current.get('scripts/qa/playBuildXiUnratedWarning.mjs'),'d7ae347704349a5f89cd9f187a8880b3e56d9d7c','Exact admitted native helper');
          assert.equal(current.get('scripts/qa/checkXiSpinnerLayout.mjs'),'f35d4396089b69464a7f2890cc1ebc8ba317b6dd');
          assert(!old.has('scripts/qa/checkXiSpinnerLayout.mjs'),'New remote-only component lab absent from completed reference');
          assert(!current.has('scripts/qa/buildXiUnratedWarningCheck.mjs'),'Physical unit-control helper absent from clean App build');
          const scoped=map=>[...map].filter(([p])=>/^(?:src|public|scripts)\//.test(p)&&!excluded.has(p)).sort(([a],[b])=>a.localeCompare(b));
          const sourceRows=scoped(current);assert.deepEqual(sourceRows,scoped(old),'Every other source/public/script blob held, including exact committed generated files');
          const inventory=dir=>fs.readdirSync(dir,{withFileTypes:true}).sort((a,b)=>a.name.localeCompare(b.name)).flatMap(e=>e.isDirectory()?inventory(path.join(dir,e.name)).map(r=>({...r,path:e.name+'/'+r.path})):[{path:e.name,bytes:fs.statSync(path.join(dir,e.name)).size,sha256:sha(fs.readFileSync(path.join(dir,e.name)))}]);
          const actual=inventory('dist'),reference=inventory(process.env.XI_REFERENCE_DIST);
          assert.equal(actual.length,850);assert.deepEqual(actual,reference,'Every byte of every built file matches completed readers/caps');
          const result={status:'passed',referenceRun:42153039832,referenceApp:'490ebe47189a48d7a4efab22628b840f020a88af',referenceArtifact:13473877476,referenceZipSHA256:'8ed690c48e13f654f43420b34ef32d300f1ce81799d7c8ddb14dad7cc27bdc44',referenceTarSHA256:'29a49044547d20a4eb763faf010daba3bd4c64210a7ade012d6e2f6dbce8a96d',sourceRows:sourceRows.length,remoteOnlyHelpers:[...excluded],distFiles:actual.length,distManifestSHA256:sha(JSON.stringify(actual)),dist:actual};
          fs.writeFileSync('xi-warning-closure/reference-build-join.json',JSON.stringify(result,null,2));console.log('PASS all '+sourceRows.length+' source rows and every '+actual.length+' built file held');
          NODE
      - name: Isolated browser and snapshot dependencies
        id: browser_setup
        timeout-minutes: 12
        if: ${{ !cancelled() && steps.join.outcome == 'success' }}
        run: |
          npm install --prefix "$RUNNER_TEMP/xi-browser" --no-save --package-lock=false playwright@1.64.1
          test ! -e node_modules/playwright
          ln -s "$RUNNER_TEMP/xi-browser/node_modules/playwright" node_modules/playwright
          node "$RUNNER_TEMP/xi-browser/node_modules/playwright/cli.js" install --with-deps chromium
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const before=JSON.parse(fs.readFileSync('xi-warning-closure/installed-before.json'));
          const after=before.map(([p])=>[p,JSON.parse(fs.readFileSync(p+'/package.json')).version]);assert.deepEqual(after,before);
          fs.writeFileSync('xi-warning-closure/installed-after.json',JSON.stringify(after));console.log('Preserved all '+after.length+' locked installed versions.');
          NODE
      - name: Native warning choices and unrated finish at three widths
        if: ${{ !cancelled() && steps.join.outcome == 'success' && steps.browser_setup.outcome == 'success' }}
        run: XI_UNRATED_BROWSER_OUT=xi-warning-closure/browser NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/qa/playBuildXiUnratedWarning.mjs 2>&1 | tee xi-warning-closure/browser.log
      - name: Every club label and physical original component inverse
        if: ${{ !cancelled() && steps.join.outcome == 'success' && steps.browser_setup.outcome == 'success' }}
        run: |
          test "$(git hash-object src/components/lineup/TeamSpinner.tsx)" = 2c230efb93f28330d1d26b91cb9f3b78d3700b1d
          XI_SPINNER_LAYOUT_ARM=fixed XI_SPINNER_LAYOUT_OUT=xi-warning-closure/spinner-fixed node scripts/qa/checkXiSpinnerLayout.mjs
          cp src/components/lineup/TeamSpinner.tsx "$RUNNER_TEMP/xi-spinner-fixed.tsx"
          trap 'cp "$RUNNER_TEMP/xi-spinner-fixed.tsx" src/components/lineup/TeamSpinner.tsx' EXIT
          git fetch --no-tags --depth=1 origin 3cf296e80ad254bec3cfba2f12660addef5bbe18
          git show 3cf296e80ad254bec3cfba2f12660addef5bbe18:src/components/lineup/TeamSpinner.tsx > src/components/lineup/TeamSpinner.tsx
          test "$(git hash-object src/components/lineup/TeamSpinner.tsx)" = 7c49f86a41927dee736614cb859d461f620ca6bc
          XI_SPINNER_LAYOUT_ARM=original XI_SPINNER_LAYOUT_OUT=xi-warning-closure/spinner-original node scripts/qa/checkXiSpinnerLayout.mjs
          cp "$RUNNER_TEMP/xi-spinner-fixed.tsx" src/components/lineup/TeamSpinner.tsx
          test "$(git hash-object src/components/lineup/TeamSpinner.tsx)" = 2c230efb93f28330d1d26b91cb9f3b78d3700b1d
          git diff --exit-code HEAD -- src/components/lineup/TeamSpinner.tsx
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const f=JSON.parse(fs.readFileSync('xi-warning-closure/spinner-fixed/report.json')),o=JSON.parse(fs.readFileSync('xi-warning-closure/spinner-original/report.json'));
          for(const r of [f,o]){assert.equal(r.status,'passed');assert(r.sourceHeld&&r.distHeld);assert.equal(r.journeys.length,3);assert(r.journeys.every(j=>j.status==='passed'));}
          assert.notEqual(f.component.blob,o.component.blob,'Physical control changes actual component');
          assert(f.journeys.every(j=>j.changed===0));assert(o.journeys.every(j=>j.changed===29),'Every original pair must expose lost hint space');
          console.log('PASS fixed87exactheight holds; physical original87measured phase deltas; fixedsource restored');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-xi-warning-closure-images-${{ github.run_id }}
          path: xi-warning-closure/browser/*.png
          retention-days: 14
          if-no-files-found: error
      - name: Final source locks installed versions and offline holds
        if: always()
        run: |
          git ls-files -s > xi-warning-closure/source-after.txt
          cmp xi-warning-closure/source-before.txt xi-warning-closure/source-after.txt
          git diff --exit-code HEAD -- src scripts public package.json package-lock.json
          sha256sum package.json package-lock.json > xi-warning-closure/locks-after.txt
          cmp xi-warning-closure/locks-before.txt xi-warning-closure/locks-after.txt
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const before=JSON.parse(fs.readFileSync('xi-warning-closure/installed-before.json'));
          const after=before.map(([p])=>[p,JSON.parse(fs.readFileSync(p+'/package.json')).version]);assert.equal(after.length,521);assert.deepEqual(after,before);
          fs.writeFileSync('xi-warning-closure/installed-final.json',JSON.stringify(after));
          assert(fs.existsSync('xi-warning-closure/offline.log'));assert.equal(fs.statSync('xi-warning-closure/offline.log').size,0);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-xi-warning-clean-closure-${{ github.run_id }}
          path: xi-warning-closure
          retention-days: 14
          if-no-files-found: error
