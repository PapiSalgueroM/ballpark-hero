name: XI native scroll diagnosis
on:
  push:
    branches: [codex/build-xi-unrated-warning-qa-20261105]
permissions:
  contents: read
jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        variant: [original, warning]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      SIM_NETWORK: offline
      SIM_OFFLINE_RECEIPT: xi-scroll/offline.log
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Explicit physical baseline and receipts
        run: |
          mkdir -p xi-scroll
          touch xi-scroll/offline.log
          git rev-parse HEAD > xi-scroll/head.txt
          if [ "${{ matrix.variant }}" = original ]; then
            git fetch --no-tags --depth=1 origin 3cf296e80ad254bec3cfba2f12660addef5bbe18
            git show 3cf296e80ad254bec3cfba2f12660addef5bbe18:src/pages/LineupBuilder.tsx > src/pages/LineupBuilder.tsx
            test "$(git hash-object src/pages/LineupBuilder.tsx)" = acb60c5c9f8a4d45a2b33b71b0beda0062570592
          else
            test "$(git hash-object src/pages/LineupBuilder.tsx)" = dcd727d53ed3f31b38e0c3db1849af3ba09f03b6
          fi
          sha256sum src/pages/LineupBuilder.tsx src/components/lineup/TeamSpinner.tsx src/hooks/useLineupBuilder.ts package.json package-lock.json > xi-scroll/before.txt
          npm ci
      - name: Build actual selected App variant
        run: npm run build 2>&1 | tee xi-scroll/build.log
      - name: Isolated browser
        run: |
          npm install --prefix "$RUNNER_TEMP/xi-browser" --no-save --package-lock=false playwright@1.64.1
          test ! -e node_modules/playwright
          ln -s "$RUNNER_TEMP/xi-browser/node_modules/playwright" node_modules/playwright
          node "$RUNNER_TEMP/xi-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Diagnostic native actions and readonly geometry
        run: XI_UNRATED_BROWSER_OUT=xi-scroll/browser NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/qa/playBuildXiUnratedWarning.mjs 2>&1 | tee xi-scroll/browser.log
      - name: Variant source and offline held
        if: always()
        run: |
          sha256sum src/pages/LineupBuilder.tsx src/components/lineup/TeamSpinner.tsx src/hooks/useLineupBuilder.ts package.json package-lock.json > xi-scroll/after.txt
          cmp xi-scroll/before.txt xi-scroll/after.txt
          test -f xi-scroll/offline.log
          test ! -s xi-scroll/offline.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xi-scroll-diagnostic-${{ matrix.variant }}-${{ github.run_id }}
          path: xi-scroll
          retention-days: 14
          if-no-files-found: error
