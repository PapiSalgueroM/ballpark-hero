name: Build Your XI warning physical controls
on:
  push:
    branches: [codex/build-xi-unrated-warning-qa-20261105]
permissions:
  contents: read
jobs:
  controls:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      SIM_NETWORK: offline
      SIM_OFFLINE_RECEIPT: xi-warning-controls/offline.log
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - name: Exact source and original reference files
        run: |
          mkdir -p xi-warning-controls
          touch xi-warning-controls/offline.log
          git rev-parse HEAD > xi-warning-controls/head.txt
          git ls-files -s > xi-warning-controls/source-before.txt
          sha256sum package.json package-lock.json > xi-warning-controls/locks-before.txt
          git fetch --no-tags --depth=1 origin 3cf296e80ad254bec3cfba2f12660addef5bbe18
          git show 3cf296e80ad254bec3cfba2f12660addef5bbe18:src/pages/LineupBuilder.tsx > xi-warning-controls/original-page.tsx
          git show 3cf296e80ad254bec3cfba2f12660addef5bbe18:src/components/lineup/LineupHowToPlay.tsx > xi-warning-controls/original-help.tsx
          npm ci
      - name: Fixed original eight faults and restored warning
        run: XI_RECORD_WARNING_CONTROL_OUT="$PWD/xi-warning-controls/arms" XI_RECORD_WARNING_ORIGINAL_PAGE="$PWD/xi-warning-controls/original-page.tsx" XI_RECORD_WARNING_ORIGINAL_HELP="$PWD/xi-warning-controls/original-help.tsx" NODE_OPTIONS="--max-old-space-size=6144 --require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/qa/buildXiUnratedWarningCheck.mjs 2>&1 | tee xi-warning-controls/controls.log
      - name: Source locks and offline holds
        if: always()
        run: |
          git diff --exit-code HEAD -- src scripts public package.json package-lock.json
          git ls-files -s > xi-warning-controls/source-after.txt
          cmp xi-warning-controls/source-before.txt xi-warning-controls/source-after.txt
          sha256sum package.json package-lock.json > xi-warning-controls/locks-after.txt
          cmp xi-warning-controls/locks-before.txt xi-warning-controls/locks-after.txt
          test ! -s xi-warning-controls/offline.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-xi-warning-controls-${{ github.run_id }}
          path: xi-warning-controls
          retention-days: 14
          if-no-files-found: error
