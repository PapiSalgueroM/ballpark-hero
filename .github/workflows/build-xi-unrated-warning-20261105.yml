name: Build Your XI unrated warning qualification
on:
  push:
    branches: [codex/build-xi-unrated-warning-qa-20261105]
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      SIM_NETWORK: offline
      SIM_OFFLINE_RECEIPT: xi-unrated-artifacts/offline.log
      ENGINES: chromium
      TZ: UTC
      SEO_SPLIT_BASE_REF: 3b14650d360b010b25b525de33a5f32f33de2798
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 12
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Locked dependencies and exact source receipt
        run: |
          mkdir -p xi-unrated-artifacts
          touch xi-unrated-artifacts/offline.log
          git rev-parse HEAD > xi-unrated-artifacts/head.txt
          git rev-parse 'HEAD^{tree}' > xi-unrated-artifacts/tree.txt
          git ls-files -s > xi-unrated-artifacts/source-before.txt
          sha256sum package.json package-lock.json > xi-unrated-artifacts/locks-before.txt
          git fetch --no-tags --depth=1 origin 3cf296e80ad254bec3cfba2f12660addef5bbe18
          git fetch --no-tags --depth=1 origin 3b14650d360b010b25b525de33a5f32f33de2798
          test "$(git rev-parse 3b14650d360b010b25b525de33a5f32f33de2798:src/data/seoMeta.ts)" = cf7a5142e59b97048d27b5ece9a6588a92073728
          npm ci
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const lock=JSON.parse(fs.readFileSync('package-lock.json'));
          const rows=Object.keys(lock.packages).filter(p=>p.startsWith('node_modules/')&&fs.existsSync(p+'/package.json')).map(p=>[p,JSON.parse(fs.readFileSync(p+'/package.json')).version]);
          assert.equal(rows.length,521);fs.writeFileSync('xi-unrated-artifacts/installed-before.json',JSON.stringify(rows));
          NODE
      - name: Proper app types
        run: node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee xi-unrated-artifacts/types.log
      - name: Exact already-qualified feature source
        run: |
          test "$(git rev-parse HEAD:src/pages/LineupBuilder.tsx)" = dcd727d53ed3f31b38e0c3db1849af3ba09f03b6
          test "$(git rev-parse HEAD:src/hooks/useLineupBuilder.ts)" = d6ecb6bd9ca7e15d328957294c60126b1d02f1d8
          test "$(git rev-parse HEAD:src/components/lineup/LineupHowToPlay.tsx)" = 822253fa89294287a26348935e6616b0c350870b
          test "$(git rev-parse HEAD:src/data/gameContent/soccer2.ts)" = b85cf0ba452a35c967937d1e200b1402fef528e7
          test "$(git rev-parse HEAD:src/test/buildXiUnratedWarning.test.tsx)" = 7ce7e0a2d713dd8b5bf6169995520f284fad6417
          test "$(git rev-parse HEAD:src/test/buildXiClubYear.test.tsx)" = 370c09cc786e5a568e79aafa05aaa93a72ca4bb6
      - name: Preserve source proof before browser setup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-xi-unrated-warning-source-${{ github.run_id }}
          path: xi-unrated-artifacts
          retention-days: 14
          if-no-files-found: error
      - name: Isolated browser and snapshot dependencies
        id: browser_setup
        timeout-minutes: 12
        if: ${{ !cancelled() }}
        run: |
          npm install --prefix "$RUNNER_TEMP/xi-browser" --no-save --package-lock=false playwright@1.64.1
          test ! -e node_modules/playwright
          ln -s "$RUNNER_TEMP/xi-browser/node_modules/playwright" node_modules/playwright
          node "$RUNNER_TEMP/xi-browser/node_modules/playwright/cli.js" install --with-deps chromium
          python -m pip install fonttools pillow
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const before=JSON.parse(fs.readFileSync('xi-unrated-artifacts/installed-before.json'));
          const after=before.map(([p])=>[p,JSON.parse(fs.readFileSync(p+'/package.json')).version]);assert.deepEqual(after,before);
          fs.writeFileSync('xi-unrated-artifacts/installed-after.json',JSON.stringify(after));console.log('Preserved all '+after.length+' locked installed versions.');
          NODE
      - name: Unchanged guide and search generators
        if: ${{ !cancelled() && steps.browser_setup.outcome == 'success' }}
        run: |
          node scripts/simGuideHeadings.mjs --refresh /build-your-xi 2>&1 | tee xi-unrated-artifacts/guide-refresh.log
          node scripts/genSearchKeywords.mjs 2>&1 | tee xi-unrated-artifacts/search-generation.log
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';import {execFileSync} from 'node:child_process';
          const original=file=>JSON.parse(execFileSync('git',['show','HEAD:'+file],{encoding:'utf8'})),current=file=>JSON.parse(fs.readFileSync(file));
          const oldGuide=original('scripts/data/guideHeadingsFrozen.json'),newGuide=current('scripts/data/guideHeadingsFrozen.json');
          assert.deepEqual({...oldGuide,routes:{...oldGuide.routes,'/build-your-xi':newGuide.routes['/build-your-xi']}},newGuide,'Only the owned frozen guide may change');
          const additions=["Club year draft warns before you use a record with no usable value or age. Keep searching, or choose Use this unrated record to continue.","Example: a matching record with a value but no age needs your confirmation. Keep searching leaves the slot open. Use this unrated record keeps the original record, and the completed XI stays unrated."];
          const ownOld=oldGuide.routes['/build-your-xi'],ownNew=newGuide.routes['/build-your-xi'];
          assert.equal(ownNew.howToPlay.length,ownOld.howToPlay.length+2);
          for(const line of additions){assert.equal(ownNew.howToPlay.filter(x=>x===line).length,1);assert(!ownOld.howToPlay.includes(line));}
          assert.deepEqual(ownNew.howToPlay.filter(x=>!additions.includes(x)),ownOld.howToPlay,'Every prior owned instruction held');
          for(const part of ['rules','example','tips'])assert.deepEqual(ownNew[part],ownOld[part],'Other owned guide part held: '+part);
          const oldIndex=original('src/data/searchKeywords.json'),newIndex=current('src/data/searchKeywords.json');
          assert.deepEqual(Object.keys(newIndex.k).sort(),Object.keys(oldIndex.k).sort(),'All search routes held');
          assert.deepEqual({...oldIndex,source:newIndex.source,k:{...oldIndex.k,'/build-your-xi':newIndex.k['/build-your-xi']}},newIndex,'Only owned search row and generated source stamp may change');
          fs.writeFileSync('xi-unrated-artifacts/guide-index-derivation.json',JSON.stringify({guideRoute:'/build-your-xi',oldGuide:oldGuide.routes['/build-your-xi'],newGuide:newGuide.routes['/build-your-xi'],oldIndexSource:oldIndex.source,newIndexSource:newIndex.source,oldKeywords:oldIndex.k['/build-your-xi'],newKeywords:newIndex.k['/build-your-xi'],otherGuideRoutesHeld:Object.keys(oldGuide.routes).length-1,otherSearchRowsHeld:Object.keys(oldIndex.k).length-1},null,2));
          console.log('PASS only owned frozen2sentences and search row/source stamp');
          NODE
      - name: Scoped saved page and production build
        if: ${{ !cancelled() && steps.browser_setup.outcome == 'success' }}
        id: build
        run: |
          PRERENDER_ONLY=/build-your-xi NODE_OPTIONS="--max-old-space-size=6144" npm run build:seo 2>&1 | tee xi-unrated-artifacts/build.log
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import path from 'node:path';import assert from 'node:assert/strict';import {execFileSync} from 'node:child_process';import {createHash} from 'node:crypto';
          const changed=execFileSync('git',['diff','--name-only','HEAD'],{encoding:'utf8'}).trim().split('\n').filter(Boolean).sort();
          const allowed=['public/sitemap.xml','public/build-your-xi/index.html','scripts/data/lastmod.json','scripts/data/guideHeadingsFrozen.json','src/data/searchKeywords.json'];
          assert(changed.includes('public/build-your-xi/index.html'),'Owned policy appears in refreshed snapshot');
          assert(changed.every(p=>allowed.includes(p)),'Only owned snapshot, guide, search and derived sitemap/ledger may change: '+changed);
          const before=JSON.parse(execFileSync('git',['show','HEAD:scripts/data/lastmod.json'],{encoding:'utf8'})),after=JSON.parse(fs.readFileSync('scripts/data/lastmod.json'));
          assert.deepEqual(Object.keys(after).sort(),Object.keys(before).sort(),'All ledger routes held');
          const keys=Object.keys(before);const ledgers=before.pages?{a:before.pages,b:after.pages}:before.routes?{a:before.routes,b:after.routes}:{a:before,b:after};
          for(const [route,value] of Object.entries(ledgers.a))if(route!=='/build-your-xi')assert.deepEqual(ledgers.b[route],value,'Unrelated ledger held: '+route);
          const text=fs.readFileSync('public/build-your-xi/index.html','utf8');assert(text.includes("Club year draft warns before you use a record with no usable value or age. Keep searching, or choose Use this unrated record to continue."));assert(text.includes("Example: a matching record with a value but no age needs your confirmation. Keep searching leaves the slot open. Use this unrated record keeps the original record, and the completed XI stays unrated."));
          const derived=allowed.map(file=>{const bytes=fs.readFileSync(file),target=path.join('xi-unrated-artifacts/derived',file);fs.mkdirSync(path.dirname(target),{recursive:true});fs.writeFileSync(target,bytes);return {file,bytes:bytes.length,sha256:createHash('sha256').update(bytes).digest('hex')};});
          fs.writeFileSync('xi-unrated-artifacts/derived.json',JSON.stringify({changed,derived,ledgerKeys:keys.length},null,2));console.log('PASS scoped derived files: '+changed.join(', '));
          NODE
          tar -czf xi-unrated-artifacts/dist.tgz dist
          sha256sum xi-unrated-artifacts/dist.tgz > xi-unrated-artifacts/dist.sha256
      - name: All required built readers and existing source fences
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          export ONLY="simAdsense,simBrand,simHeadTags,simHiddenPages,simHubs,simIndexNow,simIndexing,simInternalLinks,simNoRivalNames,simPrerender,simPrerenderBoot,simRetiredRoutes,simSchema,simSitemap,simSnapshotAssets,simSiteSearch,simGuideHeadings,simSeoMetaSplit,simHomeCopy,simHarnessAnchors"
          node scripts/runAllSims.mjs --browser 2>&1 | tee xi-unrated-artifacts/readers.log
      - name: All original route download limits
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          node scripts/lib/hostLikeServer.mjs dist 4173 > xi-unrated-artifacts/weight-host.log 2>&1 &
          xi_host_pid=$!
          trap 'kill "$xi_host_pid" 2>/dev/null || true' EXIT
          sleep 2
          SWEEP_OFFLINE=1 BASE=http://127.0.0.1:4173 node scripts/sweepWeight.mjs 2>&1 | tee xi-unrated-artifacts/weight.log
      - name: Actual native warning choices and completed unrated draft at three widths
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: XI_UNRATED_BROWSER_OUT=xi-unrated-artifacts/browser NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/qa/playBuildXiUnratedWarning.mjs 2>&1 | tee xi-unrated-artifacts/browser.log
      - name: Final source dependency and offline holds
        if: always()
        run: |
          git ls-files -s > xi-unrated-artifacts/source-after.txt
          cmp xi-unrated-artifacts/source-before.txt xi-unrated-artifacts/source-after.txt
          git diff --exit-code HEAD -- src scripts/qa scripts/lib package.json package-lock.json ':!src/data/searchKeywords.json'
          git diff --name-only HEAD > xi-unrated-artifacts/changed.txt
          sha256sum package.json package-lock.json > xi-unrated-artifacts/locks-after.txt
          cmp xi-unrated-artifacts/locks-before.txt xi-unrated-artifacts/locks-after.txt
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const before=JSON.parse(fs.readFileSync('xi-unrated-artifacts/installed-before.json'));
          const after=before.map(([p])=>[p,JSON.parse(fs.readFileSync(p+'/package.json')).version]);assert.equal(after.length,521);assert.deepEqual(after,before);
          fs.writeFileSync('xi-unrated-artifacts/installed-final.json',JSON.stringify(after));
          const allowed=['public/sitemap.xml','public/build-your-xi/index.html','scripts/data/lastmod.json','scripts/data/guideHeadingsFrozen.json','src/data/searchKeywords.json'];
          const changed=fs.readFileSync('xi-unrated-artifacts/changed.txt','utf8').trim().split('\n').filter(Boolean);assert(changed.every(p=>allowed.includes(p)),'No unrelated source changes');
          assert(fs.existsSync('xi-unrated-artifacts/offline.log'),'Precreated preload receipt held');assert.equal(fs.statSync('xi-unrated-artifacts/offline.log').size,0,'No Node transport attempted');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-xi-unrated-warning-phase-images-${{ github.run_id }}
          path: xi-unrated-artifacts/browser/*.png
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-xi-unrated-warning-final-${{ github.run_id }}
          path: xi-unrated-artifacts
          retention-days: 14
          if-no-files-found: error
