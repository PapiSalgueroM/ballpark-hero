name: Build Your XI unrated record fixed source proof
on:
  push:
    branches: [codex/build-xi-unrated-warning-qa-20261105]
permissions:
  contents: read
jobs:
  fixed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      SIM_NETWORK: offline
      SIM_OFFLINE_RECEIPT: xi-warning-fixed/offline.log
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - name: Fixed source and locked dependencies
        run: |
          mkdir -p xi-warning-fixed
          touch xi-warning-fixed/offline.log
          git rev-parse HEAD > xi-warning-fixed/head.txt
          git ls-files -s > xi-warning-fixed/source-before.txt
          sha256sum package.json package-lock.json > xi-warning-fixed/locks-before.txt
          test "$(git rev-parse HEAD:src/hooks/useLineupBuilder.ts)" = d6ecb6bd9ca7e15d328957294c60126b1d02f1d8
          npm ci
      - name: Proper app types
        run: node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee xi-warning-fixed/types.log
      - name: Fourteen actual-page warning cases
        run: |
          XI_RECORD_WARNING_RAW="$PWD/xi-warning-fixed/raw.json" NODE_OPTIONS="--max-old-space-size=6144 --require=$PWD/scripts/lib/offlineTransport.cjs" node node_modules/vitest/vitest.mjs run src/test/buildXiUnratedWarning.test.tsx --maxWorkers=1 --minWorkers=1 --reporter=default --reporter=json --outputFile=xi-warning-fixed/units.json 2>&1 | tee xi-warning-fixed/units.log
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';const r=JSON.parse(fs.readFileSync('xi-warning-fixed/units.json')),raw=JSON.parse(fs.readFileSync('xi-warning-fixed/raw.json'));
          assert.equal(r.numTotalTests,14);assert.equal(r.numPassedTests,14);assert.equal(r.numFailedTests,0);assert.equal(r.numPendingTests,0);
          assert.equal(raw.caseTitles.length,14);assert.equal(Object.keys(raw.cases).length,14);
          assert(!/Unhandled Errors|Unhandled Rejection|Uncaught Exception|Failed to resolve import/.test(fs.readFileSync('xi-warning-fixed/units.log','utf8')));
          NODE
      - name: Existing real-hook club year history and validator outcomes
        if: ${{ !cancelled() }}
        run: |
          NODE_OPTIONS="--max-old-space-size=6144 --require=$PWD/scripts/lib/offlineTransport.cjs" node node_modules/vitest/vitest.mjs run src/test/buildXiClubYear.test.tsx src/test/buildXiClubYearSetup.test.tsx src/test/lineupBuilderHistoryRead.test.tsx src/test/lineupValidatorClient.test.tsx --maxWorkers=1 --minWorkers=1 --reporter=default --reporter=json --outputFile=xi-warning-fixed/existing.json 2>&1 | tee xi-warning-fixed/existing.log
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';const r=JSON.parse(fs.readFileSync('xi-warning-fixed/existing.json'));
          assert.equal(r.numTotalTests,72);assert.equal(r.numPassedTests,72);assert.equal(r.numFailedTests,0);assert.equal(r.numPendingTests,0);
          NODE
      - name: Existing offline position fit validator and report guards
        if: ${{ !cancelled() }}
        run: |
          export NODE_OPTIONS="--max-old-space-size=6144 --require=$PWD/scripts/lib/offlineTransport.cjs"
          node scripts/simLineupValidatorClient.mjs 2>&1 | tee xi-warning-fixed/validator.log
          node scripts/simLineupRecordPositions.mjs 2>&1 | tee xi-warning-fixed/positions.log
          node scripts/simBuildYourXiFit.mjs 2>&1 | tee xi-warning-fixed/fit.log
          node scripts/simWorldXiReport.mjs 2>&1 | tee xi-warning-fixed/report.log
          node scripts/simWorldXiSeasonReport.mjs 2>&1 | tee xi-warning-fixed/season-report.log
      - name: Source locks and offline holds
        if: always()
        run: |
          git diff --exit-code HEAD -- src scripts public package.json package-lock.json
          git ls-files -s > xi-warning-fixed/source-after.txt
          cmp xi-warning-fixed/source-before.txt xi-warning-fixed/source-after.txt
          sha256sum package.json package-lock.json > xi-warning-fixed/locks-after.txt
          cmp xi-warning-fixed/locks-before.txt xi-warning-fixed/locks-after.txt
          test ! -s xi-warning-fixed/offline.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-xi-warning-fixed-source-${{ github.run_id }}
          path: xi-warning-fixed
          retention-days: 14
          if-no-files-found: error
