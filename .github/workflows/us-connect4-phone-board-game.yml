name: US Connect 4 phone board build and browser qualification
on:
  push:
    branches: [codex/us-connect4-phone-board-qualify-20261030]
permissions:
  contents: read
jobs:
  game:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CI: 'true'
      SIM_NETWORK: offline
      GIT_OPTIONAL_LOCKS: '0'
