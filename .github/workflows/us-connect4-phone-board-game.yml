          git rev-parse HEAD > "$out/head.txt"
          git rev-parse 'HEAD^{tree}' > "$out/tree.txt"
          git archive --format=tar HEAD > "$out/source.tar"
          cp scripts/qa/playUsConnect4PhoneBoard.mjs "$out/native-collector.mjs"
          cmp scripts/qa/playUsConnect4PhoneBoard.mjs "$out/native-collector.mjs"
          sha256sum "$out/native-collector.mjs" > "$out/controller-copy.sha256"
          raw=0
          node --check scripts/qa/playUsConnect4PhoneBoard.mjs > "$out/syntax.stdout" 2> "$out/syntax.stderr" || raw=$?
          printf '%s\n' "$raw" > "$out/syntax.exit"
          test "$raw" -eq 0
          test ! -s "$out/syntax.stdout"
          test ! -s "$out/syntax.stderr"
          cat > "$out/helpers/run.sh" <<'RUN'
          run() {
            local id="$1" budget="$2"; shift 2
