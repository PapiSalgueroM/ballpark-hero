name: Community Shield five remaining old career oracles
on:
  push:
    branches: [codex/sc-community-shield-remaining-oracles-20261103]
permissions:
  contents: read
jobs:
  owners:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CI: '1'
      SIM_NETWORK: offline
      BEFORE: ${{ github.event.before }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - name: Bind the exact eight-adapter parent and one temporary workflow
        run: |
          set -euo pipefail
          META="$RUNNER_TEMP/sc-shield-remaining-binding"
          test ! -e "$META"; mkdir "$META"
          printf 'META=%s\n' "$META" >> "$GITHUB_ENV"
          printf 'SC_REMAINING_OWNER_OUT=%s\n' "$GITHUB_WORKSPACE/tmp/sc-shield-remaining-$GITHUB_RUN_ID" >> "$GITHUB_ENV"
          test "$GITHUB_REF" = refs/heads/codex/sc-community-shield-remaining-oracles-20261103
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$BEFORE" = 0000000000000000000000000000000000000000
          test "$(git rev-parse HEAD^)" = 3dcb4b897b58a4731b2b2ab10b622213b0f071e7
          test "$(git rev-parse 'HEAD^^{tree}')" = 499807432461712c8cd73572fe013a62d9a726a7
          test "$(git rev-parse --is-shallow-repository)" = false
          git rev-parse HEAD 'HEAD^{tree}' > "$META/head-tree.txt"
          git diff --name-status HEAD^ HEAD > "$META/changed-paths.txt"
          printf 'A\t.github/workflows/sc-community-shield-remaining-oracles.yml\n' > "$META/expected-paths.txt"
          cmp "$META/expected-paths.txt" "$META/changed-paths.txt"
          cat > "$META/pins.txt" <<'PINS'
          scripts/qa/soccerAgentReviewKit.mjs d6ca063fb64f3b556ed9c484af22574d5974fb63
          scripts/qa/soccerFarewellKit.mjs 38d67fdcba49f18fdd051deb68e86ed4262771ec
          scripts/qa/careerPressMarketKit.mjs b5fdf343cc3861b1772040bfa8a62ebe6e7012cc
          scripts/qa/soccerInternationalReturnKit.mjs 2fa355466785445db71d446b39aa93c5be897585
          scripts/qa/careerTransferBriefKit.mjs fbe2f99e831402540f4c22f1039d8c7fe26558d5
          scripts/simCareerProgramme.mjs 1769172d638807cec9e3ac3f4e563c5041e2cd1a
          scripts/playSoccerResultsLayout.mjs dee69d3181672afdf1ba173b231b48e3d91bf5cd
          scripts/lib/communityShieldOracleCompat.mjs 1ed3b4103bc3805ccd08f72eeb181558fa892d23
          src/lib/soccerCareerEngine.ts a65c8353d6e4660c1d6cec6471e17095eed35805
          src/lib/soccerCareerExtraCups.ts f96d2442942db57eb89d3d73d7dc18bba02ec165
          package.json 2ff64986fb76ebc51b706f2fd24765768874008a
          package-lock.json 97d6f12a052f25f400462938c241789a083f0bfe
          scripts/lib/offlineTransport.cjs 0fda542a2649fe5da937c6976fd0f5b6073e74b6
          PINS
          while read -r file blob; do test "$(git rev-parse "HEAD:$file")" = "$blob"; done < "$META/pins.txt"
          test "$(git ls-files | wc -l)" -eq 5676
          git ls-files -z > "$META/source-members.before"
          git ls-files -z | xargs -0 sha256sum > "$META/source.sha256"
          git ls-files --others --exclude-standard -z > "$META/untracked.before"; test ! -s "$META/untracked.before"
      - name: Locked online install before guarded original owner calls
        run: |
          set -euo pipefail
          code=0; NODE_OPTIONS='' npm ci > "$META/install.stdout" 2> "$META/install.stderr" || code=$?
          printf '%s\n' "$code" > "$META/install.exit"; test "$code" -eq 0
          find node_modules -path node_modules/.vite -prune -o -type f -print0 | sort -z > "$META/dependency-members.before"
          xargs -0 sha256sum < "$META/dependency-members.before" > "$META/dependency.sha256"
      - name: Run all five original owners and retain every result
        run: |
          set -euo pipefail
          cat > "$META/REMOTE-CALLER.sh" <<'CALLER'
