            sha256sum --check "$OUT/dependency.sha256" > "$OUT/dependency-held.log" 2>&1 || secondary=1
            git ls-files -z > "$OUT/source-members.after"
            cmp "$OUT/source-members.before" "$OUT/source-members.after" > "$OUT/source-members.log" 2>&1 || secondary=1
            git diff --exit-code > "$OUT/source-diff.log" 2>&1 || secondary=1
            git ls-files --others --exclude-standard -z > "$OUT/untracked.after"; test ! -s "$OUT/untracked.after" || secondary=1
            find node_modules -path node_modules/.vite -prune -o -type f -print0 | sort -z > "$OUT/dependency-members.after"
            cmp "$OUT/dependency-members.before" "$OUT/dependency-members.after" > "$OUT/dependency-members.log" 2>&1 || secondary=1
            if find "$OUT" -maxdepth 1 -name '*.transport' -type f ! -size 0 | grep -q .; then secondary=1; fi
