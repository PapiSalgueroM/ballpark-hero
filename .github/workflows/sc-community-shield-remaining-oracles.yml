            exit "$secondary"
          }
          trap finish EXIT
          capture() {
            local tag="$1"; shift
            test ! -e "$OUT/$tag.exit"
            printf '%s\0' "$@" > "$OUT/$tag.argv"; : > "$OUT/$tag.transport"
            set +e
            SIM_OFFLINE_RECEIPT="$OUT/$tag.transport" "$@" > "$OUT/$tag.stdout" 2> "$OUT/$tag.stderr"
            local code=$?
            set -e
            printf '%s\n' "$code" > "$OUT/$tag.exit"
            tail -n 8 "$OUT/$tag.stdout"; tail -n 8 "$OUT/$tag.stderr"
            test ! -s "$OUT/$tag.transport" || return 1
            return "$code"
          }
          export NODE_OPTIONS="--require=$ROOT/scripts/lib/offlineTransport.cjs"
          unset SC_EXTRA_CUPS_ENGINE US_BOARD_CONTROL_ALIAS US_BOARD_CONTROL_FILE NO_DOUBLE_SWAP
          unset SOCCER_AGENT_REVIEW_IMPORT_ONLY SOCCER_FAREWELL_IMPORT_ONLY SOCCER_INTERNATIONAL_RETURN_IMPORT_ONLY PROGRAMME_REWARD_CONTROL PROGRAMME_ATTRIBUTION_CONTROL
          capture types node node_modules/typescript/bin/tsc --noEmit -p tsconfig.app.json
          for file in scripts/lib/communityShieldOracleCompat.mjs scripts/qa/soccerAgentReviewKit.mjs scripts/qa/soccerFarewellKit.mjs scripts/qa/careerPressMarketKit.mjs scripts/qa/soccerInternationalReturnKit.mjs scripts/qa/careerTransferBriefKit.mjs scripts/simCareerProgramme.mjs scripts/playSoccerResultsLayout.mjs; do capture "syntax-$(basename "$file" .mjs)" node --check "$file"; done
