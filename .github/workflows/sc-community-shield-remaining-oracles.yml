          d145c6aabbdd8555915ed6ff12ba92cdb3da3de9b4c8c2ced9a6d90cc8a72df8  scripts/simCareerProgramme.mjs
          34aae64f848a20ad0c803e943b0f0161f13fbd66dd7e13dc25f2a41c4ed9b0bb  scripts/playSoccerResultsLayout.mjs
          6c992bc254d3716b2b7bdea17b194c0340b4957a4f44ca4bc7ea7ee7412e806b  scripts/lib/communityShieldOracleCompat.mjs
          f009782c9f7a384881692239c47af266a834eaa1104ce86662ab53ec67756788  src/lib/soccerCareerEngine.ts
          bc3c8b79f2e910a2ff730f216e1aaa7fb532139d663b45e956d43c9a92539934  src/lib/soccerCareerExtraCups.ts
