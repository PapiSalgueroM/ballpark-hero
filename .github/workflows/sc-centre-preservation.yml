name: Soccer centre existing phone and trophy preservation
on:
  push:
    branches: [codex/soccer-centre-preservation-20261030]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sc-centre-preservation-${{ github.sha }}
  cancel-in-progress: false
jobs:
  preservation:
    if: github.ref == 'refs/heads/codex/soccer-centre-preservation-20261030'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: 'true'
      TZ: UTC
      GIT_OPTIONAL_LOCKS: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: External output and frozen source helper
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/sc-centre-preservation-${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}"
          mkdir "$out"
          echo "SC_PRESERVATION_OUT=$out" >> "$GITHUB_ENV"
          printf '%s  %s\n' d249eeff8f922b5bddf6fedc1933be4c5bae3040753e6974c841c6becbea1c4b scripts/qa/proveSoccerCentrePreservation.mjs | sha256sum --check
          raw=0
          node --check scripts/qa/proveSoccerCentrePreservation.mjs > "$out/syntax.stdout.log" 2> "$out/syntax.stderr.log" || raw=$?
          printf '%s\n' "$raw" > "$out/syntax.exit"
          exit "$raw"
      - name: Exact locked application dependencies
        shell: bash
        run: |
          set -euo pipefail
          raw=0
          npm ci > "$SC_PRESERVATION_OUT/npm-ci.stdout.log" 2> "$SC_PRESERVATION_OUT/npm-ci.stderr.log" || raw=$?
          printf '%s\n' "$raw" > "$SC_PRESERVATION_OUT/npm-ci.exit"
          exit "$raw"
      - name: Actual two ordinary component preservation harnesses
        shell: bash
        run: |
          set -euo pipefail
          raw=0
          node scripts/qa/proveSoccerCentrePreservation.mjs > "$SC_PRESERVATION_OUT/controller.stdout.log" 2> "$SC_PRESERVATION_OUT/controller.stderr.log" || raw=$?
          printf '%s\n' "$raw" > "$SC_PRESERVATION_OUT/controller.exit"
          exit "$raw"
      - name: Retain original source fonts reports and raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sc-centre-preservation-${{ github.run_id }}-a${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/sc-centre-preservation-${{ github.run_id }}-a${{ github.run_attempt }}/
            !${{ runner.temp }}/sc-centre-preservation-${{ github.run_id }}-a${{ github.run_attempt }}/matched-source/**
          if-no-files-found: error
          retention-days: 14
