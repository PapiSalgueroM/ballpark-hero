,"scripts/qa/soccerCareerRecordsBrowser.mjs":{"bytes":33258,"git":"197db545584217b23df506aac28608eb66bb7a74","sha256":"fedf0bf5a07db6fe89605befd76964de3376b2cea33d7076ec7d0ee105b3e521"}};
          const workflow='.github/workflows/flagship-release-app-20261103.yml',sha=p=>crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          assert.equal(process.env.GITHUB_REPOSITORY,'PapiSalgueroM/ballpark-hero');
          assert.equal(execFileSync('git',['rev-parse','HEAD^']).toString().trim(),process.env.BUILT_SOURCE_SHA);
          const added=[workflow,...Object.keys(qa)].sort();
          assert.deepEqual(fs.readFileSync(out+'/candidate-paths.txt','utf8').trim().split('\n').sort(),added.map(p=>'A\t'+p));
          for(const [p,blob] of Object.entries({...pins,...Object.fromEntries(Object.entries(qa).map(([p,row])=>[p,row.git]))})){
            assert.equal(execFileSync('git',['rev-parse','HEAD:'+p]).toString().trim(),blob,p+' tracked');
            assert.equal(execFileSync('git',['hash-object',p]).toString().trim(),blob,p+' actual');
          }
          for(const [p,row]of Object.entries(qa)){assert.equal(sha(p),row.sha256,p+' SHA');assert.equal(fs.statSync(p).size,row.bytes,p+' bytes');}
          assert.deepEqual(fs.readFileSync(prior+'/source.txt','utf8').trim().split(/\s+/),[process.env.BUILT_SOURCE_SHA,process.env.BUILT_TREE_SHA]);
          const originalAssociation=JSON.parse(fs.readFileSync(prior+'/association.json','utf8'));
          assert.equal(originalAssociation.source,process.env.BUILT_SOURCE_SHA);
          assert.equal(originalAssociation.releaseCore,'00c85815cac64d72014594e6b38515d4d6ce2e45');
          assert.deepEqual(originalAssociation.pins,pins);
          const readSums=file=>{
            const rows=fs.readFileSync(file,'utf8').trim().split('\n').map(line=>{const m=/^([a-f0-9]{64})  (.+)$/.exec(line);assert.ok(m,'Original checksum row');return[m[2],m[1]];});
            assert.equal(new Set(rows.map(row=>row[0])).size,rows.length);return Object.fromEntries(rows);
          };
