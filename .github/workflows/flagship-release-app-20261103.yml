          }
          assert.equal(photos.length,32);assert.equal(photos.filter(p=>p.control).length,1);
          fs.writeFileSync(out+'/actual-admission.json',JSON.stringify({status:'passed',source:process.env.GITHUB_SHA,builtSource:process.env.BUILT_SOURCE_SHA,contexts:8,pageJourneys:14,cm:{profiles:4,moves:44,cancellations:4,quota:1,future:1,live:1},sc:sc.actualCensus,photos,limits:'Repeated widths earn no additional unique engine credit. No rebuild, balance/control rerun, natural progression, actual-font or all-protocol availability claim. Every console/request event still needs manual classification.'},null,2)+'\n');
          NODE
      - name: Retain actual traffic and unchanged source, fixtures and completed dist
        if: always()
        run: |
          set -euo pipefail
          test -n "$QA_OUT"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import path from 'node:path';import crypto from 'node:crypto';import assert from 'node:assert/strict';import {execFileSync} from 'node:child_process';
          const out=process.env.QA_OUT,sha=p=>crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          const read=file=>fs.existsSync(file)?JSON.parse(fs.readFileSync(file,'utf8')):null;
          const cm=read(out+'/cm/browser/report.json'),sc=read(out+'/sc/browser/report.json');
          const traffic={
            cm:cm?.contexts.map(row=>({width:row.width,status:row.status,error:row.error??null,blockedRequests:row.blockedRequests,requestFailures:row.requestFailures,consoleMessages:row.consoleMessages,pageErrors:row.pageErrors,pointerAttempts:row.pointerAttempts??[],failureScreenshot:row.failureScreenshot??null}))??[],
            sc:sc?.profiles.map(row=>({width:row.width,status:row.status,error:row.error??null,blockedRequests:row.blockedRequests,scenarios:row.scenarios.map(scene=>({name:scene.name,status:scene.status,error:scene.error??null,requestFailures:scene.requestFailures,consoleMessages:scene.consoleMessages,pageErrors:scene.pageErrors}))}))??[],
            nodeReceipts:fs.existsSync(out+'/transport')?fs.readdirSync(out+'/transport').sort().map(file=>({file,bytes:fs.statSync(out+'/transport/'+file).size,blockedAttempts:fs.readFileSync(out+'/transport/'+file,'utf8').split('\n').filter(Boolean).length})):[],
            meaning:'External HTTP requests are aborted and retained by each actual driver. Node-empty receipts do not mean zero browser traffic. Root must classify every console, pageerror and requestfailure from these raw outcomes. No provider availability or all-protocol claim.'
          };
          fs.writeFileSync(out+'/transport-summary.json',JSON.stringify(traffic,null,2)+'\n');
          const photos=[];
          for(const game of ['cm','sc'])if(fs.existsSync(out+'/'+game+'/browser'))for(const file of fs.readdirSync(out+'/'+game+'/browser').filter(p=>p.endsWith('.png')).sort())photos.push({game,file,bytes:fs.statSync(out+'/'+game+'/browser/'+file).size,sha256:sha(out+'/'+game+'/browser/'+file),failure:file.endsWith('-failed.png')});
          fs.writeFileSync(out+'/photo-inventory.json',JSON.stringify(photos,null,2)+'\n');
          const tracked=execFileSync('git',['ls-files','-z']).toString().split('\0').filter(Boolean).sort(),after=Object.fromEntries(tracked.map(p=>[p,sha(p)]));
          fs.writeFileSync(out+'/source-after.json',JSON.stringify(after,null,2)+'\n');
          fs.writeFileSync(out+'/working-tree.txt',execFileSync('git',['status','--short']));
          const before=read(out+'/source-before.json');
          fs.writeFileSync(out+'/source-closure.json',JSON.stringify({
            beforePresent:before!==null,sourceHeld:before!==null&&JSON.stringify(after)===JSON.stringify(before),
            completedTarHeld:fs.existsSync(out+'/completed-dist.tar.gz')&&sha(out+'/completed-dist.tar.gz')===process.env.DIST_TAR_SHA256
          },null,2)+'\n');
          NODE
          dist_status=0
          if [[ -f "$QA_OUT/dist-before.sha256" ]]; then
            find dist -type f -print0 | sort -z | xargs -0 sha256sum > "$QA_OUT/dist-after.sha256"
            cmp "$QA_OUT/dist-before.sha256" "$QA_OUT/dist-after.sha256" || dist_status=$?
            sha256sum --check "$QA_OUT/dist-before.sha256" > "$QA_OUT/dist-held.log" || dist_status=$?
          else
            echo 'No completed dist inventory. No closure credit.' > "$QA_OUT/dist-hold-unknown.txt"
            dist_status=1
          fi
          fixture_status=0
          if [[ -f "$QA_OUT/fixtures-before.sha256" ]]; then
            find "$QA_OUT/fixtures-cm" "$QA_OUT/fixtures-sc" -type f -print0 | sort -z | xargs -0 sha256sum > "$QA_OUT/fixtures-after.sha256"
            cmp "$QA_OUT/fixtures-before.sha256" "$QA_OUT/fixtures-after.sha256" || fixture_status=$?
            sha256sum --check "$QA_OUT/fixtures-before.sha256" > "$QA_OUT/fixtures-held.log" || fixture_status=$?
          else
            echo 'No complete fixture inventory. No closure credit.' > "$QA_OUT/fixture-hold-unknown.txt"
            fixture_status=1
          fi
          git diff --exit-code HEAD > "$QA_OUT/source-diff.txt"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const value=JSON.parse(fs.readFileSync(process.env.QA_OUT+'/source-closure.json','utf8'));
          assert.equal(value.beforePresent,true);assert.equal(value.sourceHeld,true,'All original and temporary QA source bodies must hold');assert.equal(value.completedTarHeld,true);
          NODE
          test "$dist_status" -eq 0
          test "$fixture_status" -eq 0
      - name: Bound retained joined App evidence
        id: artifact
        if: always()
        run: |
          set -euo pipefail
          test -d "$QA_OUT"
          test "$(du -sb "$QA_OUT" | cut -f1)" -lt 150000000
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.artifact.outputs.ready == 'true' }}
        with:
          name: flagship-release-app-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/flagship-release-app
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
