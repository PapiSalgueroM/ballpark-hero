          assert.deepEqual(readSums(prior+'/dist-after.sha256'),readSums(prior+'/dist-before.sha256'),'Original completed dist must hold');
          fs.copyFileSync(prior+'/completed-dist.tar.gz',out+'/completed-dist.tar.gz');
          fs.writeFileSync(out+'/association.json',JSON.stringify({source:process.env.GITHUB_SHA,builtSource:process.env.BUILT_SOURCE_SHA,builtTree:process.env.BUILT_TREE_SHA,releaseCore:'00c85815cac64d72014594e6b38515d4d6ce2e45',originalArtifact:Number(process.env.SOURCE_ARTIFACT_ID),originalRun:Number(process.env.SOURCE_RUN_ID),originalJob:Number(process.env.SOURCE_JOB_ID),originalZipBytes:Number(process.env.SOURCE_ZIP_BYTES),originalZipSha256:process.env.SOURCE_ZIP_SHA256,distTarBytes:Number(process.env.DIST_TAR_BYTES),distTarSha256:process.env.DIST_TAR_SHA256,pins,qa,sourceEntriesHeld:Object.keys(original).length,sourceEntries:tracked.length,unchangedDrivers:true,rebuild:false,generatorsRepeated:false,typesRepeated:false,readersRepeated:false,capsRepeated:false,engineControlCredit:false,scope:'Two unchanged qualified actual App journeys on the exact completed joined build. Carrier job overall/all-sims outcome is retained separately and not inferred from this App result.'},null,2)+'\n');
          NODE
