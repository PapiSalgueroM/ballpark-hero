          assert.deepEqual(readSums(prior+'/source-after.sha256'),original,'Original carrier source must hold');
          assert.equal(Object.keys(original).length,5670);
          const tracked=execFileSync('git',['ls-files','-z']).toString().split('\0').filter(Boolean).sort();
          assert.deepEqual(tracked,[...Object.keys(original),...added].sort(),'Only five temporary QA additions');
          for(const[p,digest]of Object.entries(original))assert.equal(sha(p),digest,p+' original source');
          fs.writeFileSync(out+'/source-before.json',JSON.stringify(Object.fromEntries(tracked.map(p=>[p,sha(p)])),null,2)+'\n');
          for(const file of ['source-before.sha256','source-after.sha256','source-held.log','source-diff.txt','dist-before.sha256','dist-after.sha256','dist-held.log','association.json','completed-dist.tar.gz.sha256']){
