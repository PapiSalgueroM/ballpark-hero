name: Soccer Grid blur ownership
on:
  push:
    branches: [codex/soccer-grid-blur-ownership]
    paths:
      - .github/workflows/soccer-grid-blur-ownership.yml
      - src/components/soccer-grid/SoccerGridSearch.tsx
      - src/test/soccerGridBlurOwnership.test.tsx
      - scripts/simSoccerGridBlurOwnership.mjs
      - scripts/qa/playSoccerGridBlurOwnership.mjs
      - scripts/qa/replayGridDiscovery1430.mjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    env:
      CI: '1'
      SIM_NETWORK: offline
      ENGINES: chromium
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact request and source boundary
        id: admission
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          out="$RUNNER_TEMP/soccer-grid-blur-ownership"; test ! -e "$out"; mkdir -p "$out"
          echo "SOCCER_GRID_BLUR_OUT=$out" >> "$GITHUB_ENV"
          echo "FREE_KICK_FONT_CACHE=$out/font-cache" >> "$GITHUB_ENV"
          git rev-parse HEAD > "$out/head.txt"; git rev-parse 'HEAD^{tree}' > "$out/tree.txt"
          git archive --format=zip HEAD > "$out/source.zip"
          git ls-files -z | sort -z > "$out/tracked-files.before"
          git ls-files -z | sort -z | xargs -0 sha256sum > "$out/source-files.sha256"
          base=2077ffbe9214fcf5e8ba8df727e0c44a2430121f
          git merge-base --is-ancestor "$base" HEAD
          git diff --exit-code "$base" HEAD -- . ':!docs/ROUND1430-GRID-BLUR.md' ':!docs/PROJECT-STATE.md' ':!docs/WORKBOARD.md' ':!src/components/soccer-grid/SoccerGridSearch.tsx' ':!src/test/soccerGridBlurOwnership.test.tsx' ':!scripts/simSoccerGridBlurOwnership.mjs' ':!scripts/qa/playSoccerGridBlurOwnership.mjs' ':!.github/workflows/soccer-grid-blur-ownership.yml' ':!scripts/qa/replayGridDiscovery1430.mjs' > "$out/source-boundary.log"
          mode=baseline
          for file in src/components/soccer-grid/SoccerGridSearch.tsx; do
            git show "$base:$file" > "$out/original-$(basename "$file")"
            cmp -s "$file" "$out/original-$(basename "$file")" || mode=fixed
          done
          echo "mode=$mode" >> "$GITHUB_OUTPUT"; echo "SOCCER_GRID_BLUR_MODE=$mode" >> "$GITHUB_ENV"
          git diff --exit-code HEAD; test -z "$(git status --porcelain --untracked-files=all)"
          SIM_OFFLINE_RECEIPT="$out/preload.transport" node -e 'require("node:assert/strict").ok(require.cache[require.resolve("./scripts/lib/offlineTransport.cjs")])'
      - name: Locked dependencies isolated browser and verified fonts
        run: |
          set -euo pipefail
          out="$SOCCER_GRID_BLUR_OUT"
          NODE_OPTIONS='' npm ci > "$out/install.log" 2>&1
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          SIM_OFFLINE_RECEIPT="$out/dependencies-before.transport" node --input-type=module > "$out/dependencies-before.log" 2>&1 <<'NODE'
          import fs from 'node:fs'; import assert from 'node:assert/strict'; import { createHash } from 'node:crypto';
          const sha = v => createHash('sha256').update(v).digest('hex'), packages = [];
          for (const [directory, metadata] of Object.entries(JSON.parse(fs.readFileSync('package-lock.json')).packages)) {
            if (!directory.startsWith('node_modules/') || !fs.existsSync(directory + '/package.json') || typeof metadata.version !== 'string') continue;
            const actual = JSON.parse(fs.readFileSync(directory + '/package.json')); assert.equal(actual.version, metadata.version);
            packages.push({ directory, name: actual.name, version: actual.version, manifest: sha(fs.readFileSync(directory + '/package.json')) });
          }
          assert(packages.length > 0); fs.writeFileSync(process.env.SOCCER_GRID_BLUR_OUT + '/dependencies-before.json', JSON.stringify({ packages, packageFiles: ['package.json', 'package-lock.json'].map(file => ({ file, sha256: sha(fs.readFileSync(file)) })) }, null, 2) + '\n', { flag: 'wx' });
          NODE
          browser_tools="$RUNNER_TEMP/soccer-grid-blur-ownership-browser"; test ! -e "$browser_tools"
          NODE_OPTIONS='' npm install --prefix "$browser_tools" --no-save --package-lock=false playwright@1.64.0 > "$out/browser-install.log" 2>&1
          test ! -e node_modules/playwright; test ! -e node_modules/playwright-core
          ln -s "$browser_tools/node_modules/playwright" node_modules/playwright; ln -s "$browser_tools/node_modules/playwright-core" node_modules/playwright-core
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/soccer-grid-blur-ownership-executables"; test ! -e "$PLAYWRIGHT_BROWSERS_PATH"
          echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
          NODE_OPTIONS='' node "$browser_tools/node_modules/playwright/cli.js" install --with-deps chromium webkit > "$out/chromium-install.log" 2>&1
          python -m pip install fonttools pillow > "$out/font-tools-install.log" 2>&1
          NODE_OPTIONS='' FREE_KICK_FONT_CACHE="$out/font-cache" node scripts/qa/freeKickLab1070.mjs --prefetch-fonts-only > "$out/font-prefetch.log" 2>&1
          SIM_OFFLINE_RECEIPT="$out/dependencies-after.transport" node --input-type=module > "$out/dependencies-after.log" 2>&1 <<'NODE'
          import fs from 'node:fs'; import assert from 'node:assert/strict'; import { createHash } from 'node:crypto';
          const sha = v => createHash('sha256').update(v).digest('hex'), before = JSON.parse(fs.readFileSync(process.env.SOCCER_GRID_BLUR_OUT + '/dependencies-before.json'));
          for (const row of before.packages) { const actual = JSON.parse(fs.readFileSync(row.directory + '/package.json')); assert.equal(actual.name, row.name); assert.equal(actual.version, row.version); assert.equal(sha(fs.readFileSync(row.directory + '/package.json')), row.manifest); }
          for (const row of before.packageFiles) assert.equal(sha(fs.readFileSync(row.file)), row.sha256);
          assert.equal(JSON.parse(fs.readFileSync('node_modules/playwright/package.json')).version, '1.64.0');
          fs.writeFileSync(process.env.SOCCER_GRID_BLUR_OUT + '/dependencies-after.json', JSON.stringify(before, null, 2) + '\n', { flag: 'wx' }); console.log('Held ' + before.packages.length + ' locked installed packages and both source manifests.');
          NODE
          find node_modules -path node_modules/.vite -prune -o -type f -print0 | sort -z | xargs -0 sha256sum > "$out/dependency-files.sha256"
          find "$browser_tools/node_modules" -type f -print0 | sort -z | xargs -0 sha256sum > "$out/browser-tool-files.sha256"
          find "$out/font-cache" -type f -print0 | sort -z | xargs -0 sha256sum > "$out/font-files.sha256"
          find node_modules -path node_modules/.vite -prune -o -type f -print0 | sort -z > "$out/dependency-files.before"
          find "$browser_tools/node_modules" -type f -print0 | sort -z > "$out/browser-tool-files.before"
          find "$out/font-cache" -type f -print0 | sort -z > "$out/font-files.before"
          find "$PLAYWRIGHT_BROWSERS_PATH" -type f -print0 | sort -z | xargs -0 sha256sum > "$out/browser-executable-files.sha256"
          find "$PLAYWRIGHT_BROWSERS_PATH" -type f -print0 | sort -z > "$out/browser-executable-files.before"
          git diff --exit-code HEAD
      - name: Actual types focused proof and unchanged related tests
        id: tests
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          out="$SOCCER_GRID_BLUR_OUT"
          SIM_OFFLINE_RECEIPT="$out/types.transport" node_modules/.bin/tsc --noEmit -p tsconfig.app.json > "$out/types.log" 2>&1
          SIM_OFFLINE_RECEIPT="$out/proof.transport" node scripts/simSoccerGridBlurOwnership.mjs > "$out/proof.log" 2>&1
          cat "$out/proof.log"
          SIM_OFFLINE_RECEIPT="$out/historical-parent.transport" node scripts/qa/replayGridDiscovery1430.mjs > "$out/historical-parent.log" 2>&1
          unset NO_DOUBLE_SWAP
          mkdir "$out/existing"
          status=0
          SIM_OFFLINE_RECEIPT="$out/existing/transport.transport" node node_modules/vitest/vitest.mjs run src/test/playerSearchIdentity.test.ts src/test/playerSearchLocal.test.ts --maxWorkers=1 --no-file-parallelism --reporter=verbose --reporter=json --outputFile="$out/existing/vitest.json" > "$out/existing/stdout.log" 2> "$out/existing/stderr.log" || status=$?
          printf '%s\n' "$status" > "$out/existing/exit-code.txt"
          cat "$out/existing/stdout.log"; cat "$out/existing/stderr.log"
          test "$status" -eq 0; test ! -s "$out/existing/transport.transport"
          SIM_OFFLINE_RECEIPT="$out/existing-admission.transport" node --input-type=module > "$out/existing-admission.log" 2>&1 <<'NODE'
          import fs from 'node:fs'; import assert from 'node:assert/strict';
          const value = JSON.parse(fs.readFileSync(process.env.SOCCER_GRID_BLUR_OUT + '/existing/vitest.json', 'utf8'));
          assert.equal(value.success, true); assert.equal(value.testResults.length, 2); assert.equal(value.numTotalTests, 37); assert.equal(value.numPassedTests, 37); assert.equal(value.numFailedTests, 0); assert.equal(value.numPendingTests, 0); assert.equal(value.numTodoTests, 0);
          for (const [file, count] of [['playerSearchIdentity.test.ts', 29], ['playerSearchLocal.test.ts', 8]]) { const rows = value.testResults.filter(row => row.name.replaceAll('\\', '/').endsWith('/' + file)); assert.equal(rows.length, 1); assert.equal(rows[0].status, 'passed'); assert.equal(rows[0].assertionResults.length, count); for (const row of rows[0].assertionResults) { assert.equal(row.status, 'passed'); assert.deepEqual(row.failureMessages, []); } }
          if (value.numRuntimeErrorTestSuites !== undefined) assert.equal(value.numRuntimeErrorTestSuites, 0); if (value.numUnhandledErrors !== undefined) assert.equal(value.numUnhandledErrors, 0); if (value.unhandledErrors !== undefined) assert.deepEqual(value.unhandledErrors, []);
          for (const file of ['stdout.log', 'stderr.log']) assert(!/Unhandled\s+(?:Errors?|Rejections?)|Uncaught\s+Exceptions?/i.test(fs.readFileSync(process.env.SOCCER_GRID_BLUR_OUT + '/existing/' + file, 'utf8')), 'No out-of-case unhandled error credit');
          console.log('Unchanged related tests: 37 passed,0failed,0pending.');
          NODE
          sha256sum --check "$out/source-files.sha256" > "$out/after-tests-source-hold.log"
      - name: Actual ordinary default Grid blur proof invocation
        if: steps.admission.outputs.mode == 'fixed'
        timeout-minutes: 15
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          SIM_OFFLINE_RECEIPT="$SOCCER_GRID_BLUR_OUT/default-invocation.transport" node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          import { createHash } from 'node:crypto';
          import { createRequire } from 'node:module';
          import { execFileSync, spawnSync } from 'node:child_process';

          const PINS = {"simSha256":"561355b8a952b81812a820b56aab97c518f430ec3536d12e35c45d21348b80dd","testSha256":"0a729c297dfd40fca179de9d7876ff53387602702f95ba49c5398c94602a8ba3","searchSha256":"fc4aa832904388a6363bb47e7a0f07cfb121f96d4a0cd2a8177665dd02f0d34e"};
          const ROOT = process.cwd(), mainOut = process.env.SOCCER_GRID_BLUR_OUT;
          const hash = body => createHash('sha256').update(body).digest('hex');
          const require = createRequire(path.join(ROOT, 'package.json'));
          assert(require.cache[require.resolve('./scripts/lib/offlineTransport.cjs')], 'Ordinary offline preload must already be active');
          assert.equal(process.env.SIM_NETWORK, 'offline');
          for (const [key, value] of Object.entries(PINS)) assert(/^[0-9a-f]{64}$/.test(value), 'UNBOUND future default source pin ' + key);
          assert(mainOut && path.isAbsolute(mainOut) && path.relative(ROOT, mainOut).split(path.sep).includes('..'));
          const out = path.join(mainOut, 'default-invocation'), copied = path.join(mainOut, 'default-evidence');
          assert(!fs.existsSync(out) && !fs.existsSync(copied), 'Fresh default capture paths'); fs.mkdirSync(out);
          const outerTransport = path.join(mainOut, 'default-invocation.transport'); assert.equal(process.env.SIM_OFFLINE_RECEIPT, outerTransport);
          fs.writeFileSync(outerTransport, '', { flag: 'wx' });
          const git = args => execFileSync('git', args, { cwd: ROOT, maxBuffer: 64 * 1024 * 1024 });
          const tracked = git(['ls-files', '-z']), status = git(['status', '--porcelain=v1', '--untracked-files=all']); assert.equal(status.length, 0);
          const head = git(['rev-parse', 'HEAD']).toString('utf8').trim();
          const source = tracked.toString('utf8').split('\0').filter(Boolean).map(file => ({ file, sha256: hash(fs.readFileSync(path.join(ROOT, file))) }));
          for (const [file, key] of [['scripts/simSoccerGridBlurOwnership.mjs', 'simSha256'], ['src/test/soccerGridBlurOwnership.test.tsx', 'testSha256'], ['src/components/soccer-grid/SoccerGridSearch.tsx', 'searchSha256']]) assert.equal(hash(fs.readFileSync(path.join(ROOT, file))), PINS[key]);
          fs.writeFileSync(path.join(out, 'tracked-files.before'), tracked); fs.writeFileSync(path.join(out, 'status.before'), status);
          fs.writeFileSync(path.join(out, 'source-files.json'), JSON.stringify(source, null, 2) + '\n');
          const tree = root => {
            const rows = [];
            const walk = relative => {
              const directory = path.join(root, relative); assert(!fs.lstatSync(directory).isSymbolicLink());
              for (const name of fs.readdirSync(directory).sort()) {
                const next = path.join(relative, name), file = path.join(root, next), stat = fs.lstatSync(file); assert(!stat.isSymbolicLink(), 'No symlinks in actual external packet');
                if (stat.isDirectory()) walk(next); else { assert(stat.isFile()); rows.push({ file: next.split(path.sep).join('/'), bytes: stat.size, sha256: hash(fs.readFileSync(file)) }); }
              }
            };
            walk(''); return rows.sort((a, b) => a.file < b.file ? -1 : a.file > b.file ? 1 : 0);
          };
          const tempRoot = fs.realpathSync(os.tmpdir()), prefix = 'soccer-grid-blur-evidence-';
          const inventory = () => fs.readdirSync(tempRoot).filter(name => name.startsWith(prefix)).sort().map(name => {
            const file = path.join(tempRoot, name), stat = fs.lstatSync(file); assert(stat.isDirectory() && !stat.isSymbolicLink());
            return { name, realpath: fs.realpathSync(file), files: tree(file) };
          });
          const before = inventory(); fs.writeFileSync(path.join(out, 'tmp-prefix.before.json'), JSON.stringify(before, null, 2) + '\n');
          const receipt = { version: 1, status: 'failed', head, pins: PINS, checkoutRoot: ROOT, tempRoot, prefix, childCommand: [process.execPath, 'scripts/simSoccerGridBlurOwnership.mjs'],
            deletedEnvironmentKeys: ['SOCCER_GRID_BLUR_MODE', 'SOCCER_GRID_BLUR_OUT'], outerTransportFile: 'default-invocation.transport', ordinaryOfflinePreload: true, sourceHeld: false, copied: false, productQualified: false };
          const save = () => fs.writeFileSync(path.join(out, 'receipt.json'), JSON.stringify(receipt, null, 2) + '\n'); save();
          const env = { ...process.env }; delete env.SOCCER_GRID_BLUR_MODE; delete env.SOCCER_GRID_BLUR_OUT;
          const child = spawnSync(process.execPath, ['scripts/simSoccerGridBlurOwnership.mjs'], { cwd: ROOT, env, encoding: 'utf8', maxBuffer: 64 * 1024 * 1024, timeout: 720000 });
          fs.writeFileSync(path.join(out, 'stdout.log'), child.stdout || ''); fs.writeFileSync(path.join(out, 'stderr.log'), child.stderr || '');
          fs.writeFileSync(path.join(out, 'exit-code.json'), JSON.stringify({ status: child.status, signal: child.signal, error: child.error ? String(child.error) : null }) + '\n');
          try {
            const after = inventory(); fs.writeFileSync(path.join(out, 'tmp-prefix.after.json'), JSON.stringify(after, null, 2) + '\n');
            const fresh = after.filter(row => !before.some(previous => previous.name === row.name)); receipt.freshCandidates = fresh.map(row => ({ name: row.name, realpath: row.realpath })); save();
            assert.equal(fresh.length, 1, 'Exactly one fresh actual default output packet');
            const actual = fresh[0].realpath; assert.equal(path.dirname(actual), tempRoot); assert(path.basename(actual).startsWith(prefix));
            assert(path.relative(ROOT, actual).split(path.sep).includes('..'), 'Actual default packet is outside checkout');
            receipt.actualEvidenceRoot = actual; receipt.outputExternal = true; receipt.outputFresh = true; save();
            fs.cpSync(actual, copied, { recursive: true, errorOnExist: true, force: false });
            const copiedTree = tree(copied); assert.deepEqual(copiedTree, fresh[0].files, 'Complete actual/default copy bytes and membership held');
            fs.writeFileSync(path.join(out, 'copied-files.json'), JSON.stringify(copiedTree, null, 2) + '\n'); receipt.copied = true; save();
            for (const previous of before) assert.deepEqual(after.find(row => row.name === previous.name), previous, 'Prior temp prefix packet held');
            assert.ifError(child.error); assert.equal(child.signal, null); assert.equal(child.status, 0);
            assert(!/Unhandled\s+(?:Errors?|Rejections?)|Uncaught\s+Exceptions?/i.test((child.stdout || '') + (child.stderr || '')), 'No unhandled default child output');
            const lines = (child.stdout || '').split(/\r?\n/).filter(line => line.startsWith('{"kind":"SOCCER_GRID_BLUR_RESULT",'));
            assert.equal(lines.length, 1, 'One actual structured default result'); const metadata = JSON.parse(lines[0]); receipt.metadata = metadata; save();
            assert.equal(metadata.kind, 'SOCCER_GRID_BLUR_RESULT'); assert.equal(metadata.mode, 'fixed');
            assert.equal(metadata.modeEnvAbsent, true); assert.equal(metadata.outEnvAbsent, true); assert.equal(metadata.evidenceRoot, actual);
            assert.equal(metadata.sourceHeld, true); assert.equal(metadata.temporaryModulesRemoved, true); assert.equal(metadata.productQualified, false);
            assert.equal(metadata.summarySha256, hash(fs.readFileSync(path.join(actual, 'unit/summary.json'))));
            assert.equal(metadata.summarySha256, hash(fs.readFileSync(path.join(copied, 'unit/summary.json'))));
            receipt.status = 'passed';
          } catch (error) { receipt.error = String(error?.stack ?? error); throw error; }
          finally {
            try {
              const trackedAfter = git(['ls-files', '-z']), statusAfter = git(['status', '--porcelain=v1', '--untracked-files=all']);
              fs.writeFileSync(path.join(out, 'tracked-files.after'), trackedAfter); fs.writeFileSync(path.join(out, 'status.after'), statusAfter);
              assert(tracked.equals(trackedAfter)); assert(status.equals(statusAfter));
              const sourceAfter = source.map(entry => ({ file: entry.file, sha256: hash(fs.readFileSync(path.join(ROOT, entry.file))) }));
              fs.writeFileSync(path.join(out, 'source-files.after.json'), JSON.stringify(sourceAfter, null, 2) + '\n');
              assert.deepEqual(sourceAfter, source, 'Every actual tracked source byte held');
              receipt.sourceHeld = true;
              assert.equal(fs.readFileSync(outerTransport, 'utf8'), '', 'Actual outer default child transport receipt stays empty');
            } catch (error) { receipt.status = 'failed'; receipt.sourceError = String(error?.stack ?? error); throw error; }
            finally { save(); }
          }
          assert.equal(receipt.status, 'passed'); assert.equal(receipt.sourceHeld, true); assert.equal(receipt.copied, true);
          console.log(JSON.stringify({ kind: 'SOCCER_GRID_BLUR_DEFAULT_CAPTURE', status: receipt.status, actualEvidenceRoot: receipt.actualEvidenceRoot,
            copiedEvidence: copied, summarySha256: receipt.metadata.summarySha256, sourceHeld: true, productQualified: false }));
          NODE
      - name: Serial plain production build
        id: build
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          out="$SOCCER_GRID_BLUR_OUT"
          SIM_OFFLINE_RECEIPT="$out/build.transport" npm run build > "$out/build.log" 2>&1
          tail -n 6 "$out/build.log"
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > "$out/dist-files.sha256"
          find dist -type f -print0 | sort -z > "$out/dist-members.before"
          (cd dist && zip -qr "$out/dist.zip" .)
      - name: Actual built route keyboard timer journeys
        id: browser
        timeout-minutes: 12
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          out="$SOCCER_GRID_BLUR_OUT"
          SIM_OFFLINE_RECEIPT="$out/server-browser.transport" node scripts/lib/hostLikeServer.mjs dist 4173 > "$out/server-browser.log" 2>&1 &
          server=$!; trap 'kill "$server" 2>/dev/null || true' EXIT
          ready=0; for attempt in 1 2 3 4 5; do if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then ready=1; break; fi; sleep 1; done; test "$ready" -eq 1
          : > "$out/browser.transport"; : > "$out/browser-parent.transport"
          SIM_OFFLINE_RECEIPT="$out/browser-parent.transport" node --input-type=module <<'NODE'
          import fs from 'node:fs'; import path from 'node:path'; import assert from 'node:assert/strict'; import { spawnSync } from 'node:child_process';
          const out = process.env.SOCCER_GRID_BLUR_OUT;
          const child = spawnSync(process.execPath, ['scripts/qa/playSoccerGridBlurOwnership.mjs'], { cwd: process.cwd(), env: { ...process.env, DEBUG: 'pw:browser', SIM_OFFLINE_RECEIPT: path.join(out, 'browser.transport') }, encoding: 'utf8', maxBuffer: 32 * 1024 * 1024, timeout: 600000 });
          fs.writeFileSync(path.join(out, 'browser.log'), child.stdout ?? ''); fs.writeFileSync(path.join(out, 'browser-native-stderr.log'), child.stderr ?? '');
          fs.writeFileSync(path.join(out, 'browser-process.json'), JSON.stringify({ status: child.status, signal: child.signal, error: child.error ? String(child.error) : null }, null, 2) + '\n');
          const stderr = child.stderr ?? '', nativeLines = stderr.split(/\r?\n/).filter(line => /\[pid=\d+\]\[(?:err|out)\]/.test(line));
          const warningOrErrorLines = nativeLines.filter(line => /\b(?:warn(?:ing)?|error|critical|fatal)\b|unknown option|unrecognized option|(?:config|settings).*failed|failed.*(?:config|settings)/i.test(line));
          const launchPids = [...stderr.matchAll(/<launched> pid=(\d+)/g)].map(match => match[1]);
          const validation = { debugScope: 'pw:browser', rawFile: 'browser-native-stderr.log', hasDebugOutput: stderr.includes('pw:browser') && stderr.includes('<launching>'), launchPids, uniquePids: [...new Set(launchPids)], nativeLines, warningOrErrorLines, status: 'incomplete' };
          validation.status = validation.hasDebugOutput && launchPids.length === 6 && validation.uniquePids.length === 6 && warningOrErrorLines.length === 0 ? 'passed' : 'failed';
          fs.writeFileSync(path.join(out, 'browser-native-log-validation.json'), JSON.stringify(validation, null, 2) + '\n');
          process.stdout.write(child.stdout ?? ''); process.stderr.write(stderr);
          assert.ifError(child.error); assert.equal(child.signal, null); assert.equal(child.status, 0); assert.equal(validation.status, 'passed', 'All six actual native processes finish without warnings/errors');
          NODE
      - name: All fifteen built-site readers
        id: readers
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          out="$SOCCER_GRID_BLUR_OUT"
          SIM_OFFLINE_RECEIPT="$out/server-readers.transport" node scripts/lib/hostLikeServer.mjs dist 4173 > "$out/server-readers.log" 2>&1 &
          server=$!; trap 'kill "$server" 2>/dev/null || true' EXIT
          ready=0; for attempt in 1 2 3 4 5; do if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then ready=1; break; fi; sleep 1; done; test "$ready" -eq 1
          failed=0
          for method in simAdsense simBrand simHeadTags simHiddenPages simHubs simIndexNow simIndexing simInternalLinks simNoRivalNames simPrerender simPrerenderBoot simRetiredRoutes simSchema simSitemap simSnapshotAssets; do
            status=0; SIM_OFFLINE_RECEIPT="$out/$method.transport" BASE=http://127.0.0.1:4173 SWEEP_BASE=http://127.0.0.1:4173 node "scripts/$method.mjs" > "$out/$method.log" 2>&1 || status=$?
            printf '%s\t%s\n' "$method" "$status" >> "$out/readers.tsv"; tail -n 3 "$out/$method.log"
            test "$status" -eq 0 || failed=1; test ! -s "$out/$method.transport" || failed=1
          done
          test "$(wc -l < "$out/readers.tsv")" -eq 15; exit "$failed"
      - name: All fourteen unchanged fatal download gates
        id: weights
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          out="$SOCCER_GRID_BLUR_OUT"
          git show 775564305e9da84dab59f2b9fe246d044a3cc8e9:scripts/sweepWeight.mjs > "$out/original-sweepWeight.mjs"; cmp scripts/sweepWeight.mjs "$out/original-sweepWeight.mjs"
          SIM_OFFLINE_RECEIPT="$out/server-weights.transport" node scripts/lib/hostLikeServer.mjs dist 4173 > "$out/server-weights.log" 2>&1 &
          server=$!; trap 'kill "$server" 2>/dev/null || true' EXIT
          ready=0; for attempt in 1 2 3 4 5; do if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then ready=1; break; fi; sleep 1; done; test "$ready" -eq 1
          status=0; SIM_OFFLINE_RECEIPT="$out/weights.transport" SWEEP_OFFLINE=1 BASE=http://127.0.0.1:4173 SWEEP_BASE=http://127.0.0.1:4173 node scripts/sweepWeight.mjs > "$out/weights.log" 2>&1 || status=$?
          cat "$out/weights.log"; exit "$status"
      - name: Final dependency source dist and transport holds
        if: always()
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          out="$SOCCER_GRID_BLUR_OUT"; result=0
          git diff --exit-code HEAD > "$out/final-diff.log" || result=1
          git status --porcelain --untracked-files=all > "$out/final-status.txt"; test ! -s "$out/final-status.txt" || result=1
          git ls-files -z | sort -z > "$out/tracked-files.after"; cmp "$out/tracked-files.before" "$out/tracked-files.after" || result=1
          sha256sum --check "$out/source-files.sha256" > "$out/final-source-hold.log" || result=1
          for name in dependency-files browser-tool-files browser-executable-files font-files; do if test -f "$out/$name.sha256"; then sha256sum --check "$out/$name.sha256" > "$out/final-$name-hold.log" || result=1; fi; done
          if test -f "$out/dependency-files.before"; then find node_modules -path node_modules/.vite -prune -o -type f -print0 | sort -z > "$out/dependency-files.after"; cmp "$out/dependency-files.before" "$out/dependency-files.after" || result=1; fi
          if test -f "$out/browser-tool-files.before"; then find "$RUNNER_TEMP/soccer-grid-blur-ownership-browser/node_modules" -type f -print0 | sort -z > "$out/browser-tool-files.after"; cmp "$out/browser-tool-files.before" "$out/browser-tool-files.after" || result=1; fi
          if test -f "$out/font-files.before"; then find "$out/font-cache" -type f -print0 | sort -z > "$out/font-files.after"; cmp "$out/font-files.before" "$out/font-files.after" || result=1; fi
          if test -f "$out/browser-executable-files.before"; then find "$PLAYWRIGHT_BROWSERS_PATH" -type f -print0 | sort -z > "$out/browser-executable-files.after"; cmp "$out/browser-executable-files.before" "$out/browser-executable-files.after" || result=1; fi
          if test -f "$out/blur-browser/native-utf8-settings.ini"; then printf '[websettings]\ndefault-charset=UTF-8\n' | cmp - "$out/blur-browser/native-utf8-settings.ini" || result=1; sha256sum "$out/blur-browser/native-utf8-settings.ini" > "$out/native-settings.sha256"; else result=1; fi
          if test -f "$out/dist-files.sha256"; then sha256sum --check "$out/dist-files.sha256" > "$out/final-dist-hold.log" || result=1; find dist -type f -print0 | sort -z > "$out/dist-members.after"; cmp "$out/dist-members.before" "$out/dist-members.after" || result=1; fi
          while IFS= read -r -d '' file; do
            case "$file" in "$out/weights.transport") ;; *) test ! -s "$file" || result=1 ;; esac
          done < <(find "$out" -name '*.transport' -type f -print0)
          printf 'mode=%s\ntests=%s\nbuild=%s\nbrowser=%s\nreaders=%s\nweights=%s\n' "$SOCCER_GRID_BLUR_MODE" '${{ steps.tests.outcome }}' '${{ steps.build.outcome }}' '${{ steps.browser.outcome }}' '${{ steps.readers.outcome }}' '${{ steps.weights.outcome }}' > "$out/stages.txt"
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soccer-grid-blur-ownership-${{ steps.admission.outputs.mode }}-${{ github.sha }}
          path: ${{ env.SOCCER_GRID_BLUR_OUT }}
          if-no-files-found: error
          retention-days: 14
