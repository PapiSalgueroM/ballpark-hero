           for(const file of [TEST,'scripts/qa/playSearchComposition.mjs',WF])assert.equal(git(['ls-tree',PARENT,'--',file]).length,0,'Parent absence '+file);
           const prior=git(['show',PARENT+':docs/PROJECT-STATE.md']),doc=fs.readFileSync('docs/PROJECT-STATE.md');
