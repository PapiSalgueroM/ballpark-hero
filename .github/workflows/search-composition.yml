           assert(doc.subarray(0,prior.length).equals(prior));assert.equal(doc.length-prior.length,1381);assert.equal(sha(doc.subarray(prior.length)),'2e4c9f8f873796fbbf8bb1d71acf02010e0e969a0005b8eac603f43d121ccee9');
           raw('search.parent.tsx',priorSearch);raw('search.selected.tsx',fs.readFileSync(TARGET));save('all-source.before.json',snapshot());
           save('source-binding.json',{source:process.env.GITHUB_SHA,parent:PARENT,parentTree:PARENT_TREE,tree:git(['rev-parse','HEAD^{tree}']).toString().trim(),run:process.env.GITHUB_RUN_ID,attempt:process.env.GITHUB_RUN_ATTEMPT,parentBlobs:5378,sourceBlobs:5381,directPaths:5,otherParentBlobsHeld:5376,criticalSources:[...HELD,...PINS,{path:WF,...pin(fs.readFileSync(WF))}],docPrefixHeld:true,fullSuite:false,livePublished:false});
          }
          function readReport(name,root){
           const r=JSON.parse(fs.readFileSync(path.join(OUT,name),'utf8'));assert.equal(r.success,r.numFailedTests===0,'SEARCH_COMPOSITION_REPORT_SUCCESS');assert.equal(r.numRuntimeErrorTestSuites??0,0,'SEARCH_COMPOSITION_NO_COLLECTION_FAILURE');assert(!(r.unhandledErrors?.length),'SEARCH_COMPOSITION_NO_UNHANDLED');
           const rows=[];assert(r.testResults.length>0);
