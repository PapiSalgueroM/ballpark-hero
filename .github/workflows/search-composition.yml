           assert.equal(pending.length,0,'SEARCH_COMPOSITION_ALL_CASES_EXECUTED');for(const row of passed)assert.equal(row.failureMessages.length,0,'SEARCH_COMPOSITION_NONFAILURE_MESSAGES_EMPTY');
