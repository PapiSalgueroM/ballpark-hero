name: Search composition keyboard verification
on:
  push:
    paths-ignore: ['docs/**']
    branches:
      - codex/search-composition-20261027
permissions:
  contents: read
concurrency:
  group: search-composition-${{ github.ref }}
  cancel-in-progress: false
jobs:
  search-composition:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EXPECTED_PARENT: b20ec6664df9d4c58d63ea0596791d33b2a3b8fc
      ENGINES: chromium
      CI: true
    defaults:
      run:
        shell: bash
