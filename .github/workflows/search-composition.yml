          const SUITE='Search composition keyboard ownership',TITLES=["does not consume modern composing ArrowDown","does not consume modern composing ArrowUp","does not consume modern composing Escape","does not consume legacy composing ArrowDown","does not consume legacy composing ArrowUp","does not consume legacy composing Escape","keeps ordinary ArrowDown navigation through actual results","keeps ordinary ArrowUp navigation through actual results","keeps ordinary Escape clearing and the empty-query no-op","leaves ordinary Left and Right in the input to native text editing","leaves native sport select keys and filtering intact"],MARKERS=["SEARCH_COMPOSITION_MODERN_ARROWDOWN_UNCONSUMED","SEARCH_COMPOSITION_MODERN_ARROWUP_UNCONSUMED","SEARCH_COMPOSITION_MODERN_ESCAPE_UNCONSUMED","SEARCH_COMPOSITION_LEGACY_ARROWDOWN_UNCONSUMED","SEARCH_COMPOSITION_LEGACY_ARROWUP_UNCONSUMED","SEARCH_COMPOSITION_LEGACY_ESCAPE_UNCONSUMED"],OLD=[["src/test/Search.navigation.test.tsx","Search URL navigation ownership",["clears a pending draft when the real Search games link opens the same URL","adopts an external PUSH to the previous query instead of the pending draft","adopts an external REPLACE to the previous query instead of the pending draft","keeps a newer draft coalesced with its own debounce replacement","lets an external identical replacement win after an own replacement and newer draft in one act","adopts actual Back and Forward locations while cancelling each pending draft","replaces only the final rapid edit while retaining unrelated parameters and previous history","adopts the same query with changed unrelated URL parameters and cancels the draft","does not navigate from a pending timer after the real leave link unmounts Search"]]];
          const GUARD="    // Leave conversion keys to the input method.\n    if (e.nativeEvent.isComposing || e.nativeEvent.keyCode === 229) return;\n";
          const READERS=["simAdsense","simBrand","simHeadTags","simHiddenPages","simHubs","simIndexNow","simIndexing","simInternalLinks","simNoRivalNames","simPrerender","simPrerenderBoot","simRetiredRoutes","simSchema","simSitemap","simSnapshotAssets","simSiteSearch","simGuideHeadings","simLegalPages"];
          const sha=b=>createHash('sha256').update(b).digest('hex'),blob=b=>createHash('sha1').update(Buffer.from('blob '+b.length+'\0')).update(b).digest('hex');
          const save=(name,value)=>fs.writeFileSync(path.join(OUT,name),JSON.stringify(value,null,2)+'\n',{flag:'wx'});
          const raw=(name,value)=>fs.writeFileSync(path.join(OUT,name),value,{flag:'wx'});
          const git=(args)=>cp.execFileSync('git',args,{cwd:ROOT,maxBuffer:32*1024*1024});
          const pin=b=>({bytes:b.length,sha256:sha(b),gitBlob:blob(b)});
          function samePin(b,p,label){assert.equal(b.length,p.bytes,label+' bytes');assert.equal(sha(b),p.sha256,label+' SHA');assert.equal(blob(b),p.gitBlob,label+' Git');}
          function paths(){return git(['ls-files','-z']).toString().split('\0').filter(Boolean).sort();}
          function snapshot(root=ROOT){return paths().map(file=>{const f=path.join(root,file),s=fs.lstatSync(f);assert(s.isFile()&&!s.isSymbolicLink(),'SEARCH_COMPOSITION_SOURCE_REGULAR '+file);return {file,...pin(fs.readFileSync(f))};});}
          function linkHold(){const f=path.join(SHADOW,'node_modules');assert(fs.lstatSync(f).isSymbolicLink(),'SEARCH_COMPOSITION_SHADOW_LINK');assert.equal(fs.realpathSync(f),fs.realpathSync(path.join(ROOT,'node_modules')),'SEARCH_COMPOSITION_SHADOW_LINK_TARGET');}
          function shadowMembers(){
           linkHold();const expected=paths(),directories=new Set(['']);
           for(const file of expected){let dir=path.posix.dirname(file);while(dir!=='.'){directories.add(dir);dir=path.posix.dirname(dir);}}
           const files=[];
           function walk(dir){
            for(const name of fs.readdirSync(path.join(SHADOW,dir)).sort()){
             const relative=dir?dir+'/'+name:name,absolute=path.join(SHADOW,relative);
             if(relative==='node_modules'){linkHold();continue;}
             const stat=fs.lstatSync(absolute);assert(!stat.isSymbolicLink(),'SEARCH_COMPOSITION_SHADOW_NO_EXTRA_LINK '+relative);
             if(stat.isDirectory()){assert(directories.has(relative),'SEARCH_COMPOSITION_SHADOW_NO_EXTRA_DIRECTORY '+relative);walk(relative);}
             else{assert(stat.isFile(),'SEARCH_COMPOSITION_SHADOW_REGULAR '+relative);files.push(relative);}
            }
           }
