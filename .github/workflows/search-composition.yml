           assert(!/TestingLibraryElementError|Unhandled|timed out|Failed to resolve import|Cannot find (?:module|package)|SyntaxError|TypeError|ReferenceError/.test(m),'SEARCH_COMPOSITION_NO_INFRA_RED');
           assert(/AssertionError/.test(m)&&m.includes(MARKERS[index])&&/expected true to be false\b/.test(m),'SEARCH_COMPOSITION_OWNED_UNCONSUMED_ASSERTION');
          }
          function newReport(name,mode){
           const {r,rows}=readReport(name,SHADOW);assert.equal(r.numTotalTests,11);assert.equal(r.testResults.length,1);
           assert.deepEqual(rows.map(key).sort(),TITLES.map(title=>key({file:TEST,ancestorTitles:[SUITE],title})).sort(),'SEARCH_COMPOSITION_EXACT_NEW_IDENTITIES');
           const failed=rows.filter(x=>x.status==='failed'),passed=rows.filter(x=>x.status==='passed'),pending=rows.filter(x=>x.status==='pending'||x.status==='skipped');
           assert.equal(failed.length+passed.length+pending.length,11);
