          }
          function hold(root,before){if(root===SHADOW)shadowMembers();assert.deepEqual(snapshot(root),before,'SEARCH_COMPOSITION_COMPLETE_SOURCE_HOLD '+root);}
          function foundation(){
           assert.equal(process.env.GITHUB_REPOSITORY,'PapiSalgueroM/ballpark-hero');assert.equal(process.env.GITHUB_REPOSITORY_ID,'1195729679');
           assert.equal(process.env.GITHUB_REF,'refs/heads/codex/search-composition-20261027');
           assert.equal(git(['rev-parse','HEAD']).toString().trim(),process.env.GITHUB_SHA);
           assert.equal(git(['show','-s','--format=%P','HEAD']).toString().trim(),PARENT);assert.equal(git(['rev-parse',PARENT+'^{tree}']).toString().trim(),PARENT_TREE);
           assert.equal(git(['ls-tree','-r','--name-only',PARENT]).toString().trim().split('\n').length,5378);
           const expected=['A\t'+WF,'M\tdocs/PROJECT-STATE.md','A\tscripts/qa/playSearchComposition.mjs','M\t'+TARGET,'A\t'+TEST].sort();
