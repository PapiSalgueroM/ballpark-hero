          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bind exact source and prepare readable verification payloads
        id: foundation
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/search-composition";test ! -e "$out";mkdir "$out"
          echo "SEARCH_COMPOSITION_EVIDENCE=$out" >> "$GITHUB_ENV"
          echo "SEARCH_COMPOSITION_SOURCE_SHADOW=$RUNNER_TEMP/search-composition-source-shadow" >> "$GITHUB_ENV"
          export SEARCH_COMPOSITION_EVIDENCE="$out" SEARCH_COMPOSITION_SOURCE_SHADOW="$RUNNER_TEMP/search-composition-source-shadow"
          echo "FREE_KICK_FONT_CACHE=$out/font-cache" >> "$GITHUB_ENV"
          git rev-parse HEAD > "$out/head.txt";git rev-parse 'HEAD^{tree}' > "$out/tree.txt"
          git diff --name-status "$EXPECTED_PARENT" HEAD > "$out/direct-paths.txt"
          git diff --exit-code "$EXPECTED_PARENT" HEAD -- . ':!.github/workflows/search-composition.yml' ':!docs/PROJECT-STATE.md' ':!src/pages/Search.tsx' ':!src/test/Search.composition.test.tsx' ':!scripts/qa/playSearchComposition.mjs' > "$out/other-source-held.log"
          git ls-files -z | sort -z > "$out/source-members.before"
          test "$(tr -cd '\000' < "$out/source-members.before" | wc -c)" -eq 5381
          git ls-files -z | sort -z | xargs -0 sha256sum > "$out/source.sha256"
          git diff --exit-code HEAD > "$out/source-clean-before.log"
          test -z "$(git status --porcelain --untracked-files=all)"
          git archive --format=tar HEAD > "$out/source.tar"
          cat > "$out/search-composition.cjs" <<'RUNNER'
