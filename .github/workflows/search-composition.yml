           else{assert.equal(mode,'baseline');assert.equal(failed.length,6);assert.equal(passed.length,5);assert.deepEqual(failed.map(x=>x.title).sort(),TITLES.slice(0,6).sort());for(let index=0;index<6;index++)ownedMessage(failed.find(x=>x.title===TITLES[index]),index);}
