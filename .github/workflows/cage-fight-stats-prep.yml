name: Cage fight stats preparation

on:
  push:
    branches: [codex/cage-fight-stats-1066]
permissions:
  contents: read
concurrency:
  group: cage-fight-stats-prep
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SIM_NETWORK: offline
      ENGINES: chromium
      SEO_SPLIT_BASE_REF: HEAD
      CAGE_FIGHT_STATS_ARTIFACTS: fight-stats-artifacts/stats
      CAGE_CLASH_NATIVE_ARTIFACTS: fight-stats-artifacts/native
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install preparation dependencies
        run: |
          mkdir -p fight-stats-artifacts
          npm ci
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          python -m pip install fonttools pillow
      - name: Preserve combat, score and input engines
        run: git diff --exit-code 84469b10d36424a70e7056a1c0d4901468ed6100 HEAD -- src/lib/cageClash.ts src/lib/cagePractice.ts src/lib/cageCircuit.ts src/hooks/useCageClash.ts
      - name: Harness source and mutation anchors
        run: ONLY=simHarnessAnchors node scripts/runAllSims.mjs 2>&1 | tee fight-stats-artifacts/anchors.log
      - name: Type check and refresh pages
        id: build
        run: |
          node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee fight-stats-artifacts/types.log
          node scripts/genSearchKeywords.mjs 2>&1 | tee fight-stats-artifacts/search.log
          PRERENDER_ONLY=/cage-clash,/whats-new npm run build:seo 2>&1 | tee fight-stats-artifacts/build.log
      - name: Recap outcomes and effective controls
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: CAGE_FIGHT_STATS_CONTROL=all ONLY=simCageFightStats node scripts/runAllSims.mjs 2>&1 | tee fight-stats-artifacts/stats.log
      - name: Native recap, combat and circuit journeys
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: xvfb-run -a node scripts/qa/cageClash1063.mjs 2>&1 | tee fight-stats-artifacts/native.log
      - name: Every built reader and guides
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          failed=0
          for harness in simGuideHeadings simSeoTitles simSeoMetaSplit simResultMoment simAdsense simBrand simHeadTags simHiddenPages simHubs simIndexNow simIndexing simInternalLinks simNoRivalNames simPrerender simPrerenderBoot simRetiredRoutes simSchema simSitemap simSnapshotAssets simSiteSearch; do
            ONLY="$harness" node scripts/runAllSims.mjs --browser 2>&1 | tee "fight-stats-artifacts/$harness.log" || failed=1
          done
          exit "$failed"
      - name: Package verified page candidates
        if: success()
        run: |
          git rev-parse HEAD > fight-stats-artifacts/source-head.txt
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          const files = ['public/cage-clash/index.html', 'public/whats-new/index.html', 'public/sitemap.xml', 'scripts/data/lastmod.json', 'src/data/searchKeywords.json'];
          const manifest = files.map(file => {
            const target = path.join('fight-stats-artifacts/generated', file);
            fs.mkdirSync(path.dirname(target), { recursive: true });
            fs.copyFileSync(file, target);
            return { file, sha256: crypto.createHash('sha256').update(fs.readFileSync(target)).digest('hex') };
          });
          fs.writeFileSync('fight-stats-artifacts/generated-manifest.json', JSON.stringify(manifest, null, 2));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cage-fight-stats-prep-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 1
          path: fight-stats-artifacts/
