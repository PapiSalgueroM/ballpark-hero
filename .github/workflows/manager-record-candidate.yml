name: Manager record trim candidate paired proof

on:
  push:
    branches: [codex/manager-record-candidate-proof]

permissions:
  contents: read

jobs:
  paired:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
      SIM_NETWORK: offline
      CAREER_SEASON_LOCAL_ONLY: '1'
      CM_RECORD_CANDIDATE_OUT: ${{ github.workspace }}/manager-record-candidate-artifacts
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Bind unchanged I1343 application and dependencies
        run: |
          echo '127.0.0.1 flawuiqbvjobmkfkauhw.supabase.co' | sudo tee -a /etc/hosts
          mkdir -p "$CM_RECORD_CANDIDATE_OUT"
          git rev-parse HEAD > "$CM_RECORD_CANDIDATE_OUT/head.txt"
          git archive --format=zip HEAD > "$CM_RECORD_CANDIDATE_OUT/source.zip"
          git diff --exit-code 7f71523406172cdf4374bfa718607d5ccfccd4f6 -- . ':!.github/workflows/manager-record-candidate.yml' ':!scripts/qa/proveManagerRecordCandidate.mjs' ':!scripts/fixtures/managerRecordCandidate/safe-trim.patch' ':!src/test/clubManagerRecordBoundary.test.ts' ':!docs/PROJECT-STATE.md' ':!docs/audits/manager-record-candidate.md'
          find src scripts .github/workflows -type f -print0 | sort -z | xargs -0 sha256sum > "$CM_RECORD_CANDIDATE_OUT/source-files.sha256"
          sha256sum package.json package-lock.json bun.lock > "$CM_RECORD_CANDIDATE_OUT/packages.sha256"
          npm ci
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const lock = JSON.parse(fs.readFileSync('package-lock.json'));
          const installed = Object.entries(lock.packages).filter(([p]) => p.startsWith('node_modules/') && fs.existsSync(p + '/package.json')).map(([p, entry]) => {
            const version = JSON.parse(fs.readFileSync(p + '/package.json')).version;
            assert.equal(version, entry.version, p); return { path: p, version };
          });
          assert.equal(installed.length, 521);
          fs.writeFileSync(process.env.CM_RECORD_CANDIDATE_OUT + '/installed.json', JSON.stringify(installed, null, 2));
          NODE
          find node_modules -type f -print0 | sort -z | xargs -0 sha256sum > "$CM_RECORD_CANDIDATE_OUT/installed-files.sha256"
      - name: Actual current application types and proof syntax
        run: |
          node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee "$CM_RECORD_CANDIDATE_OUT/types.log"
          node --check scripts/qa/proveManagerRecordCandidate.mjs
      - name: Exact original faults and transient candidate direct tests
        run: |
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/qa/proveManagerRecordCandidate.mjs 2>&1 | tee "$CM_RECORD_CANDIDATE_OUT/paired.log"
      - name: Existing record and retirement regression tests on candidate
        run: |
          git apply --check scripts/fixtures/managerRecordCandidate/safe-trim.patch
          git apply scripts/fixtures/managerRecordCandidate/safe-trim.patch
          trap 'git restore --source=HEAD --worktree src/lib/clubManager.ts' EXIT
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node node_modules/vitest/vitest.mjs run src/lib/clubManagerRecords.test.ts src/lib/clubManagerRetire.test.ts src/test/clubManagerRetire.test.tsx --maxWorkers=1 --minWorkers=1 --reporter=default --reporter=json --outputFile.json="$CM_RECORD_CANDIDATE_OUT/related.json" 2>&1 | tee "$CM_RECORD_CANDIDATE_OUT/related.log"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const report = JSON.parse(fs.readFileSync(process.env.CM_RECORD_CANDIDATE_OUT + '/related.json'));
          const rows = report.testResults.flatMap(file => file.assertionResults);
          assert.equal(report.testResults.length, 3); assert(rows.length >= 51);
          assert.equal(report.success, true); assert.equal(report.numFailedTests, 0);
          assert.equal(report.numPendingTests, 0); assert.equal(report.numTodoTests, 0);
          assert(rows.every(row => row.status === 'passed'));
          console.log('All ' + rows.length + ' existing record/retirement tests passed on transient candidate.');
          NODE
      - name: Complete restored source and dependency holds
        if: always()
        run: |
          sha256sum --check "$CM_RECORD_CANDIDATE_OUT/source-files.sha256" > "$CM_RECORD_CANDIDATE_OUT/source-holds.log"
          sha256sum --check "$CM_RECORD_CANDIDATE_OUT/packages.sha256"
          sha256sum --check "$CM_RECORD_CANDIDATE_OUT/installed-files.sha256" > "$CM_RECORD_CANDIDATE_OUT/installed-holds.log"
          git diff --exit-code -- src scripts .github/workflows package.json package-lock.json bun.lock
      - name: Retain paired candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manager-record-candidate-${{ github.run_id }}
          path: manager-record-candidate-artifacts/
          retention-days: 14
          if-no-files-found: error
