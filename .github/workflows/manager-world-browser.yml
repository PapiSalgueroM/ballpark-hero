name: Manager world browser

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/manager-world-browser.yml
      - src/components/club-manager/WorldTablesCard.tsx
      - src/components/club-manager/LeagueTableCard.tsx
      - src/lib/clubManager.ts
      - src/lib/clubManagerEras.ts
      - src/lib/clubManagerWorldEdit.ts
      - src/test/managerWorldBrowser.test.tsx
      - scripts/simManagerWorldBrowser.mjs
      - scripts/qa/managerWorldBrowser1077.mjs
permissions:
  contents: read
concurrency:
  group: manager-world-browser-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    defaults:
      run:
        shell: bash
    env:
      SIM_NETWORK: offline
      ENGINES: chromium
      VITEST_MAX_FORKS: 1
      VITEST_MIN_FORKS: 1
      SEO_SPLIT_BASE_REF: HEAD
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare remote verification
        run: |
          mkdir -p manager-world-browser-artifacts
          git rev-parse HEAD > manager-world-browser-artifacts/source-head.txt
          git rev-parse HEAD^{tree} > manager-world-browser-artifacts/source-tree.txt
          npm ci
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          python -m pip install fonttools pillow
      - name: Type check and build
        id: build
        run: |
          node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee manager-world-browser-artifacts/types.log
          npm run build 2>&1 | tee manager-world-browser-artifacts/build.log
      - name: Actual world browsing and effective copied faults
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: MANAGER_WORLD_BROWSER_CONTROL=all ONLY=simManagerWorldBrowser node scripts/runAllSims.mjs 2>&1 | tee manager-world-browser-artifacts/mounted.log
      - name: Existing modern historic and edited world regressions
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          failed=0
          for harness in simWorld simEraWorldTables simClubManagerEraMidSeason simWorldEditor; do
            ONLY="$harness" node scripts/runAllSims.mjs 2>&1 | tee "manager-world-browser-artifacts/$harness.log" || failed=1
          done
          exit "$failed"
      - name: Native league browsing journeys
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          node scripts/qa/managerWorldBrowser1077.mjs --prefetch-fonts-only 2>&1 | tee manager-world-browser-artifacts/fonts.log
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" xvfb-run -a node scripts/qa/managerWorldBrowser1077.mjs 2>&1 | tee manager-world-browser-artifacts/native.log
      - name: All built readers and source anchors
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          failed=0
          for harness in simAdsense simBrand simHeadTags simHiddenPages simHubs simIndexNow simIndexing simInternalLinks simNoRivalNames simPrerender simPrerenderBoot simRetiredRoutes simSchema simSitemap simSnapshotAssets simSiteSearch simGuideHeadings simSeoMetaSplit simHomeCopy simHarnessAnchors; do
            ONLY="$harness" node scripts/runAllSims.mjs --browser 2>&1 | tee "manager-world-browser-artifacts/$harness.log" || failed=1
          done
          exit "$failed"
      - name: Hold the reviewed browser and unchanged simulation rules
        if: ${{ !cancelled() }}
        run: |
          git diff --exit-code HEAD -- src/components/club-manager/WorldTablesCard.tsx src/test/managerWorldBrowser.test.tsx scripts/simManagerWorldBrowser.mjs scripts/qa/managerWorldBrowser1077.mjs
          git diff --exit-code 2fff5e044160b70bd58b64d931793ee4e443cedd HEAD -- src/components/club-manager/LeagueTableCard.tsx src/lib/clubManager.ts src/lib/clubManagerEras.ts src/lib/clubManagerWorldEdit.ts src/data/clubManagerRosters.ts src/data/clubManagerWorldRosters.ts
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manager-world-browser-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 3
          path: manager-world-browser-artifacts/
