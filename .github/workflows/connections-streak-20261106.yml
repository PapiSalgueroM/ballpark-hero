name: Soccer Connections streak ownership clean build join
on:
  push:
    branches: [codex/connections-streak-ownership-clean-join-qa-20261106]
permissions:
  contents: read
  actions: read
jobs:
  closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      SIM_NETWORK: offline
      SIM_OFFLINE_RECEIPT: connections-streak-clean-join/offline.log
      CONNECTIONS_REFERENCE_ARTIFACT: '13550885815'
      CONNECTIONS_REFERENCE_RUN: '42314201077'
      CONNECTIONS_REFERENCE_ZIP: '69d3feee5b4538a53813202e2a057d444920206d60ed6fecbc8f827ff76fae2d'
      CONNECTIONS_REFERENCE_TAR: '4c643758990d307e9166b9e91c9bac3b2349e64674102acfd3adc7fc0f2b73e6'
      CONNECTIONS_REFERENCE_HEAD: '03555bf4ea4c64db2d2ef65bbf78a1662b086e2e'
      CONNECTIONS_REFERENCE_TREE: '597bca5d6ea03b4f6df5482934b4ebe9b6ea7bc1'
      CONNECTIONS_REFERENCE_ZIP_BYTES: '120158866'
      CONNECTIONS_NATIVE_HELPER: '112c64d1f78379f927f0c0c586634f4954e1b5bd'
      CONNECTIONS_NATIVE_OUTER: 'cc9341e23d690aeac917541d303f1dcfb2c5940f'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Locked dependencies and clean source receipts
        run: |
          set -euo pipefail
          [[ "$CONNECTIONS_REFERENCE_ARTIFACT" =~ ^[0-9]+$ ]]
          [[ "$CONNECTIONS_REFERENCE_RUN" =~ ^[0-9]+$ ]]
          [[ "$CONNECTIONS_REFERENCE_ZIP" =~ ^[a-f0-9]{64}$ ]]
          [[ "$CONNECTIONS_REFERENCE_TAR" =~ ^[a-f0-9]{64}$ ]]
          [[ "$CONNECTIONS_REFERENCE_ZIP_BYTES" =~ ^[1-9][0-9]*$ ]]
          for value in "$CONNECTIONS_REFERENCE_HEAD" "$CONNECTIONS_REFERENCE_TREE" "$CONNECTIONS_NATIVE_HELPER" "$CONNECTIONS_NATIVE_OUTER"; do [[ "$value" =~ ^[a-f0-9]{40}$ ]]; done
          test ! -e connections-streak-clean-join
          mkdir connections-streak-clean-join
          touch connections-streak-clean-join/offline.log
          git rev-parse HEAD > connections-streak-clean-join/head.txt
          git rev-parse 'HEAD^{tree}' > connections-streak-clean-join/tree.txt
          git ls-files -s > connections-streak-clean-join/source-before.txt
          sha256sum package.json package-lock.json > connections-streak-clean-join/locks-before.txt
          npm ci
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const lock=JSON.parse(fs.readFileSync('package-lock.json'));
          const rows=Object.keys(lock.packages).filter(p=>p.startsWith('node_modules/')&&fs.existsSync(p+'/package.json')).map(p=>[p,JSON.parse(fs.readFileSync(p+'/package.json')).version]);
          assert.equal(rows.length,521);for(const[p,v]of rows)assert.equal(v,lock.packages[p].version,p);fs.writeFileSync('connections-streak-clean-join/installed-before.json',JSON.stringify(rows));
          NODE
      - name: Proper app types
        run: node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee connections-streak-clean-join/types.log
      - name: Pinned reference qualification artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/PapiSalgueroM/ballpark-hero/actions/runs/$CONNECTIONS_REFERENCE_RUN" > connections-streak-clean-join/reference-run.json
          gh api "repos/PapiSalgueroM/ballpark-hero/actions/artifacts/$CONNECTIONS_REFERENCE_ARTIFACT" > connections-streak-clean-join/reference-artifact.json
          gh api "repos/PapiSalgueroM/ballpark-hero/actions/artifacts/$CONNECTIONS_REFERENCE_ARTIFACT/zip" > "$RUNNER_TEMP/connections-streak-reference.zip"
          echo "$CONNECTIONS_REFERENCE_ZIP  $RUNNER_TEMP/connections-streak-reference.zip" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/connections-streak-reference" "$RUNNER_TEMP/connections-streak-reference-dist"
          unzip -q "$RUNNER_TEMP/connections-streak-reference.zip" -d "$RUNNER_TEMP/connections-streak-reference"
          echo "$CONNECTIONS_REFERENCE_TAR  $RUNNER_TEMP/connections-streak-reference/dist.tgz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/connections-streak-reference/dist.tgz" -C "$RUNNER_TEMP/connections-streak-reference-dist"
          cp "$RUNNER_TEMP/connections-streak-reference/source-before.txt" connections-streak-clean-join/reference-source.txt
      - name: Fresh unchanged product-name fence on clean source
        run: NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/simNoRivalNames.mjs 2>&1 | tee connections-streak-clean-join/no-rival.log
      - name: Clean production build
        run: NODE_OPTIONS="--max-old-space-size=6144" npm run build 2>&1 | tee connections-streak-clean-join/build.log
      - name: Exact clean product source and every built byte joined to successful full qualification
        id: join
        env:
          CONNECTIONS_REFERENCE_DIR: ${{ runner.temp }}/connections-streak-reference
          CONNECTIONS_REFERENCE_DIST: ${{ runner.temp }}/connections-streak-reference-dist/dist
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import path from 'node:path';import assert from 'node:assert/strict';import {createHash} from 'node:crypto';
          const sha=bytes=>createHash('sha256').update(bytes).digest('hex');
          const readIndex=file=>new Map(fs.readFileSync(file,'utf8').trim().split('\n').map(line=>{const m=/^[0-9]+ ([0-9a-f]{40}) 0\t(.+)$/.exec(line);assert(m,'Actual source row');return [m[2],m[1]];}));
          const old=readIndex('connections-streak-clean-join/reference-source.txt'),current=readIndex('connections-streak-clean-join/source-before.txt');
          const excluded=new Set(['scripts/qa/playConnectionsStreakOwnership.mjs']);
          assert.equal(old.get('scripts/qa/playConnectionsStreakOwnership.mjs'),process.env.CONNECTIONS_NATIVE_HELPER);
          for(const file of['scripts/qa/checkConnectionsStreakOwnership.mjs','scripts/qa/playFootballConnect4Cancel.mjs','scripts/qa/checkFootballConnect4CancelOwnership.mjs'])assert(!old.has(file)&&!current.has(file),'Remote-only controller/old helper absent from full and clean source: '+file);
          for(const file of excluded)assert(!current.has(file),'Remote-only evidence helper absent from clean tree: '+file);
          const configs=['index.html','package.json','package-lock.json','vite.config.ts','tailwind.config.ts','postcss.config.js','tsconfig.json','tsconfig.app.json','tsconfig.node.json','bun.lockb','bun.lock'];
          assert.equal(configs.length,11);for(const file of configs){assert(current.has(file)&&old.has(file),'All11 root configurations present: '+file);assert.equal(current.get(file),old.get(file),'Exact qualified root configuration: '+file);}
          const pins={'src/hooks/useConnections.ts':'4b855e80db09fcff02154cf44d3357d0d0ffa1c6','src/pages/Connections.tsx':'b5bd5aaba7d8877be86cc592ca4ae1616b517a5f','src/test/connectionsStreakOwnership.test.tsx':'a196e04d005c53c605ad092615ced0d566c7ba21','src/test/connectionsModeSelection.test.tsx':'e79ad2f59a671d83fba294e4bc61c400dd2b3037','public/connections/index.html':'41f384834b6c6fc3435c751f7d6154065389ac91','docs/plans/2026-11-06-connections-streak-ownership.md':'505c809a4bc9903a6846daebb51709571954325c','src/hooks/useFootballConnect4.ts':'630d21236f9f82ad4e728caad64dc4139bab7b57','src/pages/AlphabetSprint.tsx':'f6a2b471abdf3ec5b21daa928348e11a3232019b','src/hooks/useGradeTransfer.ts':'5e677e844f8af33de27c206673fcf66849ad5930'};
          for(const[file,want]of Object.entries(pins)){assert.equal(current.get(file),want,file+' clean pin');assert.equal(old.get(file),want,file+' qualified full pin');}
          const scoped=map=>[...map].filter(([p])=>/^(?:src|public|scripts)\//.test(p)&&!excluded.has(p)).sort(([a],[b])=>a.localeCompare(b));
          const indexedModes=file=>fs.readFileSync(file,'utf8').trim().split('\n').map(line=>{const m=/^([0-9]+) ([0-9a-f]{40}) 0\t(.+)$/.exec(line);assert(m,'Actual path/mode/blob index row');return[m[3],m[1],m[2]];}).filter(([p])=>(/^(?:src|public|scripts)\//.test(p)||configs.includes(p))&&!excluded.has(p)).sort(([a],[b])=>a.localeCompare(b));assert.deepEqual(indexedModes('connections-streak-clean-join/source-before.txt'),indexedModes('connections-streak-clean-join/reference-source.txt'),'Every qualified source/root path, mode and blob held');
          assert.equal([...old.keys()].filter(file=>/^(?:src|public|scripts)\//.test(file)).length,4659,'Qualified full includes exactly one native helper');const sourceRows=scoped(current);assert.equal(sourceRows.length,4658);assert.deepEqual(sourceRows,scoped(old),'Every other source/public/script blob held, including exact committed generated files');
          const inventory=dir=>fs.readdirSync(dir,{withFileTypes:true}).sort((a,b)=>a.name.localeCompare(b.name)).flatMap(e=>e.isDirectory()?inventory(path.join(dir,e.name)).map(r=>({...r,path:e.name+'/'+r.path})):[{path:e.name,bytes:fs.statSync(path.join(dir,e.name)).size,sha256:sha(fs.readFileSync(path.join(dir,e.name)))}]);
          const actual=inventory('dist'),reference=inventory(process.env.CONNECTIONS_REFERENCE_DIST);
          assert.equal(actual.length,850);assert.deepEqual(actual,reference,'Every byte of every built file matches the pinned reference build');
          const ref=process.env.CONNECTIONS_REFERENCE_DIR,read=file=>JSON.parse(fs.readFileSync(path.join(ref,file))),meta=JSON.parse(fs.readFileSync('connections-streak-clean-join/reference-artifact.json')),referenceHead=fs.readFileSync(path.join(ref,'head.txt'),'utf8').trim();
          assert.equal(meta.id,Number(process.env.CONNECTIONS_REFERENCE_ARTIFACT));assert.equal(meta.expired,false);assert.equal(meta.size_in_bytes,Number(process.env.CONNECTIONS_REFERENCE_ZIP_BYTES));assert.equal(meta.digest,'sha256:'+process.env.CONNECTIONS_REFERENCE_ZIP);assert.match(referenceHead,/^[a-f0-9]{40}$/);assert.equal(meta.workflow_run.head_sha,referenceHead);const run=JSON.parse(fs.readFileSync('connections-streak-clean-join/reference-run.json'));assert.equal(run.id,Number(process.env.CONNECTIONS_REFERENCE_RUN));assert.equal(run.id,meta.workflow_run.id);assert.equal(run.head_sha,referenceHead);assert.equal(referenceHead,process.env.CONNECTIONS_REFERENCE_HEAD);assert.equal(run.head_commit.tree_id,process.env.CONNECTIONS_REFERENCE_TREE);assert.equal(fs.readFileSync(path.join(ref,'tree.txt'),'utf8').trim(),process.env.CONNECTIONS_REFERENCE_TREE);assert.equal(run.status,'completed');assert.equal(run.conclusion,'success');assert.equal(meta.name,'connections-streak-ownership-qualified-'+run.id);
          const full=read('admission.json'),native=read('native-admission.json'),unit=read('fixed-admission.json'),holds=read('final-holds.json');assert.equal(full.status,'passed');assert.equal(full.qualification,'fresh-connections-streak-full-scope');assert.equal(full.head,referenceHead,'Successful full workflow and physical source share one head');assert.equal(full.hook,pins['src/hooks/useConnections.ts']);assert.equal(full.helper,process.env.CONNECTIONS_NATIVE_HELPER);assert.equal(full.nativeOuter,process.env.CONNECTIONS_NATIVE_OUTER);assert.equal(native.status,'passed');assert.equal(native.hook,full.hook);assert.equal(native.helper,full.helper);assert.deepEqual(full.nativeReceipt,native);const outerBytes=fs.readFileSync(path.join(ref,'native-admission-script.mjs'));assert.equal(createHash('sha1').update(Buffer.concat([Buffer.from('blob '+outerBytes.length+'\0'),outerBytes])).digest('hex'),full.nativeOuter);
          assert.deepEqual([full.unitCases,full.unitCommands,full.rawFrames,full.sourceRows,full.cleanSourceRows,full.distFiles,full.nativeJourneys,full.nativeContexts,full.nativeTerminalResults,full.nativePngs],[14,1,158,4659,4658,850,3,6,15,9]);assert.deepEqual(full.wholePreservedCases,['current','restore','unlimitedLost']);assert.equal(full.wholeQualifiedFixedRAWBytesHeld,true);assert.equal(full.readers.length,20);assert.equal(full.immutableCaps.length,16);assert.equal(unit.status,'fixed-six-streak-cases-prior-eight-passed-three-whole-preserves');assert.deepEqual([unit.actualCases,unit.actualPasses,unit.actualFailures,unit.totalFrames,unit.wholeQualifiedFixedRAWBytesHeld],[14,14,0,158,true]);assert.deepEqual(unit.wholePreservedCases.map(value=>value.key),['current','restore','unlimitedLost']);assert.deepEqual([native.census.journeys,native.census.contexts,native.census.terminalResults,native.census.businessClicks,native.census.startupClicks,native.census.startupKeys,native.census.completionAttempts,native.census.viewportPNGs,native.census.distBodies,native.census.installedVersions,native.census.sourceBodies],[3,6,15,246,12,12,6,9,850,521,5781]);
          assert.equal(full.originalRun,42299438424);assert.equal(full.originalArtifact,13542769378);assert.equal(full.retainedFirstRun,42294868639);assert.equal(full.retainedFirstConclusion,'failure');assert.equal(full.retainedSecondRun,42296698793);assert.equal(full.retainedSecondConclusion,'failure');for(const key of['qualifiedFixedRun','qualifiedFixedArtifact','completedControlsRun'])assert(Number.isSafeInteger(full[key])&&full[key]>0,key+' completed provenance');assert.equal(holds.status,'passed');for(const key of['indexUnchanged','sourceBytesUnchanged','locksUnchanged','distHeld','retainedPacketsHeld'])assert.equal(holds[key],true,key+' qualified full final hold');assert.equal(holds.installedLockedVersions,521);assert.equal(holds.offlineBytes,0);assert.deepEqual(fs.readFileSync(path.join(ref,'source-before.txt')),fs.readFileSync(path.join(ref,'source-after.txt')));
          const result={status:'passed',referenceRun:run.id,referenceWorkflowHead:referenceHead,referenceApp:referenceHead,referenceQualification:full.qualification,referenceArtifact:meta.id,referenceZipSHA256:process.env.CONNECTIONS_REFERENCE_ZIP,referenceTarSHA256:process.env.CONNECTIONS_REFERENCE_TAR,sourceRows:sourceRows.length,rootConfigurations:configs.map(file=>({file,blob:current.get(file)})),remoteOnlyHelpers:[...excluded],forbiddenControllers:['scripts/qa/checkConnectionsStreakOwnership.mjs'],generatedPatches:[],distFiles:actual.length,distManifestSHA256:sha(JSON.stringify(actual)),dist:actual,referenceChecks:{unitCases:14,rawFrames:158,wholePreservedCases:full.wholePreservedCases,readers:20,immutableCaps:16,nativeJourneys:3,nativeContexts:6,nativeTerminalResults:15,nativePngs:9},limits:'Fresh clean proper types/name fence/normal production build and exact source/build join only. No unit/native/reader/cap rerun. All4658 product source paths plus11 root configurations and every850 built-file byte bind this clean tree to the completed successful normal full run, whose workflow head is its physical source head. The reviewed owned plan blob is held; final plan/PROJECT-STATE/WORKBOARD docs follow separately. Other docs and QA workflow are outside this code join; final product diff must exclude all QA workflows/helpers/controllers. This join does not independently admit native behavior, terminal async restore, cross-tab ownership, real-player/provider/backend writes or release.'};
          fs.writeFileSync('connections-streak-clean-join/reference-build-join.json',JSON.stringify(result,null,2));console.log('PASS all '+sourceRows.length+' source rows and every '+actual.length+' built file held');
          NODE
      - name: Final source locks installed versions and offline holds
        if: always()
        run: |
          set -euo pipefail
          git ls-files -s > connections-streak-clean-join/source-after.txt
          cmp connections-streak-clean-join/source-before.txt connections-streak-clean-join/source-after.txt
          git diff --exit-code HEAD -- .
          sha256sum package.json package-lock.json > connections-streak-clean-join/locks-after.txt
          cmp connections-streak-clean-join/locks-before.txt connections-streak-clean-join/locks-after.txt
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const before=JSON.parse(fs.readFileSync('connections-streak-clean-join/installed-before.json')),lock=JSON.parse(fs.readFileSync('package-lock.json'));
          const after=Object.keys(lock.packages).filter(p=>p.startsWith('node_modules/')&&fs.existsSync(p+'/package.json')).map(p=>[p,JSON.parse(fs.readFileSync(p+'/package.json')).version]);assert.equal(after.length,521);for(const[p,v]of after)assert.equal(v,lock.packages[p].version,p);assert.deepEqual(after,before);
          fs.writeFileSync('connections-streak-clean-join/installed-final.json',JSON.stringify(after));
          assert(fs.existsSync('connections-streak-clean-join/offline.log'));assert.equal(fs.statSync('connections-streak-clean-join/offline.log').size,0);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: connections-streak-ownership-clean-build-join-${{ github.run_id }}
          path: connections-streak-clean-join
          retention-days: 14
          if-no-files-found: error
