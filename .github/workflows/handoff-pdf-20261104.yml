name: Create development handoff PDF
on:
  push:
    branches: [codex/handoff-pdf-20261104]
    paths: ['handoff-pdf/**', '.github/workflows/handoff-pdf-20261104.yml']
permissions:
  contents: read
jobs:
  document:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install document-only tools
        run: python -m pip install --disable-pip-version-check reportlab pypdf PyMuPDF
      - name: Create PDF and render every page
        run: |
          set -euo pipefail
          cd handoff-pdf
          node container_tools/mark_artifact_operation_started.mjs --operation-kind edit --expected-output-count 1 --output-format pdf
          python create_handoff.py
      - uses: actions/upload-artifact@v4
        with:
          name: dukb-handoff-pdf-${{ github.run_id }}
          path: handoff-pdf/output/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
