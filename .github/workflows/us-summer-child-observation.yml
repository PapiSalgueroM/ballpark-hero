name: Summer nested observer synthetic proof
on:
  push:
    branches: [codex/us-summer-child-observation-20261024]
    paths-ignore: ['docs/**']
permissions:
  contents: read
concurrency:
  group: summer-child-observation-${{ github.sha }}
  cancel-in-progress: false
env:
  EXPECTED_PARENT: c504c87a66fc135ac95c25fc722de184ccc4cac0
  CI: '1'
  SIM_NETWORK: offline
  TZ: UTC
jobs:
  synthetic_observer:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - name: Fresh outside-checkout evidence and separate invalid-sink work
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/us-summer-child-observation-proof";test ! -e "$base";test ! -L "$base";mkdir -m 700 "$base"
          out="$base/evidence";work="$base/invalid-sink-work";mkdir -m 700 "$out" "$work"
          echo "SUMMER_PROOF_OUT=$out" >> "$GITHUB_ENV"
          echo "SUMMER_PROOF_WORK=$work" >> "$GITHUB_ENV"
          printf '%s\n' "$GITHUB_SHA" > "$out/head.txt"
          printf '%s\n' "$GITHUB_RUN_ID" > "$out/run-id.txt"
          printf '%s\n' "$GITHUB_RUN_ATTEMPT" > "$out/run-attempt.txt"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - name: Exact two proof paths and complete unchanged parent source
        id: foundation
        timeout-minutes: 3
        run: |
          set +e
          set -uo pipefail
          out="$SUMMER_PROOF_OUT"
          (
            set -euo pipefail
            test "$GITHUB_REPOSITORY" = PapiSalgueroM/ballpark-hero
            test "$GITHUB_REPOSITORY_ID" = 1195729679
            test "$GITHUB_EVENT_NAME" = push
            test "$GITHUB_REF" = refs/heads/codex/us-summer-child-observation-20261024
            test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
            test "$(git show -s --format=%P HEAD)" = "$EXPECTED_PARENT"
            test "$(git rev-parse "$EXPECTED_PARENT^{tree}")" = 2da0bb01007aaa9ce3848b17d7864d328f6b21ec
            git diff --name-status "$EXPECTED_PARENT" HEAD > "$out/direct-paths.txt"
            printf 'A\t.github/workflows/us-summer-child-observation.yml\nM\tscripts/simUsCareerSummer.mjs\n' | cmp - "$out/direct-paths.txt"
            git diff --exit-code "$EXPECTED_PARENT" HEAD -- . ':!.github/workflows/us-summer-child-observation.yml' ':!scripts/simUsCareerSummer.mjs' > "$out/all-other-parent-source-held.log"
            test "$(git rev-parse "$EXPECTED_PARENT:scripts/simUsCareerSummer.mjs")" = d6f7bb95fe5b149af97c9aeb8e76b9a5a2893ec9
            test "$(git hash-object scripts/simUsCareerSummer.mjs)" = 705f61603e3fe9cdcf86530762b5b9df68c61438
            test -z "$(git ls-tree --name-only "$EXPECTED_PARENT" -- .github/workflows/us-summer-child-observation.yml)"
            for name in NODE_OPTIONS SIM_OFFLINE_RECEIPT SIM_CHILD SIM_SPORTS SIM_SECTIONS SIM_US_SUMMER_CHILD_ARTIFACTS SUMMER_OBSERVER_SOURCE SUMMER_OBSERVER_SOURCE_SHA256 SUMMER_OBSERVER_OUT SUMMER_OBSERVER_WORK_ROOT SUMMER_RECORD_JUDGE SUMMER_CHILD_IDENTITY_FILE SUMMER_ERROR_FIXTURE_ROOT SUMMER_BREAK_MONITOR_WRITE NO_DOUBLE_SWAP US_BOARD_CONTROL_ALIAS US_BOARD_CONTROL_FILE;do
              if printenv "$name" > /dev/null;then printf '%s\n' "Inherited proof override refused: $name" >&2;exit 1;fi
            done
            git rev-parse HEAD^{tree} > "$out/tree.txt"
            git ls-files -z | sort -z > "$out/source-members.before"
            test "$(tr -cd '\000' < "$out/source-members.before" | wc -c)" -eq 5345
            xargs -0 sha256sum < "$out/source-members.before" > "$out/source-before.sha256"
            tar --null --files-from="$out/source-members.before" -czf "$out/current-source.tar.gz"
            git status --porcelain --untracked-files=all > "$out/status-before.txt";test ! -s "$out/status-before.txt"
            printf '{"head":"%s","parent":"%s","parentTree":"%s","workflowGit":"%s","workflowSha256":"%s","sourceFiles":5345}\n' "$GITHUB_SHA" "$EXPECTED_PARENT" 2da0bb01007aaa9ce3848b17d7864d328f6b21ec "$(git hash-object .github/workflows/us-summer-child-observation.yml)" "$(sha256sum .github/workflows/us-summer-child-observation.yml | cut -d' ' -f1)" > "$out/source-binding.json"
            base64 --decode > "$out/summer-observation-inspector.cjs" <<'SUMMER_INSPECTOR_BYTES'
