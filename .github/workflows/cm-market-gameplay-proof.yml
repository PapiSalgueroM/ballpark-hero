name: CM market gameplay proof
on:
  push:
    branches: [codex/soccer-live-cm-gameplay-20261030]
permissions:
  contents: read
jobs:
  gameplay:
    if: github.ref == 'refs/heads/codex/soccer-live-cm-gameplay-20261030'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CI: 'true'
      TZ: UTC
      GIT_OPTIONAL_LOCKS: '0'
      CM_GAMEPLAY_CONTROLLER_SHA256: 0c7607a196f7ee56282d01634ae55a3b20e908faeab6bf7110f0ac430cc27e5f
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Set proof output on the runner
        run: echo "CM_GAMEPLAY_PROOF_OUT=$RUNNER_TEMP/cm-market-gameplay-proof" >> "$GITHUB_ENV"
      - name: Freeze immutable product and proof association
        run: node scripts/qa/runCmMarketGameplayProof.mjs prepare
      - name: Install locked application dependencies
        run: node scripts/qa/runCmMarketGameplayProof.mjs deps
      - name: Check real app types
        run: node scripts/qa/runCmMarketGameplayProof.mjs types
      - name: Build ordinary app and record identical compiler module groups
        run: node scripts/qa/runCmMarketGameplayProof.mjs build
      - name: Prepare isolated Chromium and real offline fonts
        run: node scripts/qa/runCmMarketGameplayProof.mjs browser-tools
      - name: Play five cases and prove two actual rebuilt source controls
        run: node scripts/qa/runCmMarketGameplayProof.mjs browser
      - name: Retain original evidence and final source restoration
        if: always()
        run: node scripts/qa/runCmMarketGameplayProof.mjs retain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cm-market-gameplay-${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ env.CM_GAMEPLAY_PROOF_OUT }}
          if-no-files-found: error
          retention-days: 14
