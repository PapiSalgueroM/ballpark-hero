name: Club Manager custom tactics App diagnostic on the retained build

on:
  push:
    branches: [codex/cm-custom-tactics-browser-followup-20261103]

permissions:
  contents: read
  actions: read

concurrency:
  group: cm-custom-tactics-browser-followup-${{ github.ref }}
  cancel-in-progress: false

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: '1'
      SIM_NETWORK: offline
      ENGINES: chromium
      PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
      SOURCE_ARTIFACT_ID: '13221817598'
      SOURCE_RUN_ID: '41616397773'
      SOURCE_ZIP_BYTES: '9175688'
      SOURCE_ZIP_SHA256: '3701278ce32b8a4723450fdda03e305a93ca6dd1476b2d90edf477bd91ffcebc'
      BUILT_SOURCE_SHA: '424867fc94cf78d72964a6e905d187cfef471ac4'
      BUILT_TREE_SHA: '0a3c6097cad2368b709d27c0e72decebfac2a4ea'
      CANDIDATE_PARENT_SHA: 'e566d9f5cce732c5456e435a177cf6f25c24dc3e'
      CANDIDATE_PARENT_TREE: 'f06df8db058315b7dce4a5de12f4fc1061ade0b6'
      DIST_TAR_BYTES: '6982847'
      DIST_TAR_SHA256: '523f18e14acedc73d9bd63fa698ef9d6255667225376b3d16d29f5a74db997b4'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify original failed proof, retained dist and source association
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/cm-custom-tactics-browser-followup"
          PRIOR="$RUNNER_TEMP/cm-custom-tactics-original-site"
          ZIP="$RUNNER_TEMP/cm-custom-tactics-original-site.zip"
          mkdir -p "$OUT/logs" "$OUT/transport" "$PRIOR"
          echo "QA_OUT=$OUT" >> "$GITHUB_ENV"
          echo "QA_PRIOR=$PRIOR" >> "$GITHUB_ENV"
          export QA_OUT="$OUT"
          export QA_PRIOR="$PRIOR"
          curl --fail --location --silent --show-error --retry 0 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/PapiSalgueroM/ballpark-hero/actions/artifacts/$SOURCE_ARTIFACT_ID" \
            --output "$OUT/original-artifact-metadata.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const meta = JSON.parse(fs.readFileSync(process.env.QA_OUT + '/original-artifact-metadata.json', 'utf8'));
          assert.equal(meta.id, Number(process.env.SOURCE_ARTIFACT_ID));
          assert.equal(meta.expired, false);
          assert.equal(meta.size_in_bytes, Number(process.env.SOURCE_ZIP_BYTES));
          assert.equal(meta.workflow_run.id, Number(process.env.SOURCE_RUN_ID));
          assert.equal(meta.workflow_run.head_sha, process.env.BUILT_SOURCE_SHA);
          NODE
          curl --fail --location --silent --show-error --retry 0 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/PapiSalgueroM/ballpark-hero/actions/artifacts/$SOURCE_ARTIFACT_ID/zip" \
            --output "$ZIP"
          test "$(stat -c%s "$ZIP")" = "$SOURCE_ZIP_BYTES"
          echo "$SOURCE_ZIP_SHA256  $ZIP" | sha256sum --check
          unzip -q "$ZIP" -d "$PRIOR"
          test "$(stat -c%s "$PRIOR/completed-dist.tar.gz")" = "$DIST_TAR_BYTES"
          test "$(cut -d' ' -f1 "$PRIOR/completed-dist.tar.gz.sha256")" = "$DIST_TAR_SHA256"
          echo "$DIST_TAR_SHA256  $PRIOR/completed-dist.tar.gz" | sha256sum --check
          git fetch --no-tags --depth=1 origin "$BUILT_SOURCE_SHA"
          test "$(git rev-parse "$BUILT_SOURCE_SHA^{tree}")" = "$BUILT_TREE_SHA"
          git rev-parse HEAD HEAD^{tree} > "$OUT/current-source.txt"
          git diff --name-status "$BUILT_SOURCE_SHA" HEAD > "$OUT/candidate-paths.txt"
          git fetch --no-tags --depth=1 origin "$CANDIDATE_PARENT_SHA"
          test "$(git rev-parse "$CANDIDATE_PARENT_SHA^{tree}")" = "$CANDIDATE_PARENT_TREE"
          git diff --name-status "$CANDIDATE_PARENT_SHA" HEAD > "$OUT/candidate-parent-paths.txt"
          test ! -e dist
          tar -tzf "$PRIOR/completed-dist.tar.gz" > "$OUT/completed-dist-members.txt"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const entries = fs.readFileSync(process.env.QA_OUT + '/completed-dist-members.txt', 'utf8').trim().split('\n');
          assert.ok(entries.length > 100);
          assert.ok(entries.every(p => (p === 'dist/' || p.startsWith('dist/')) && !p.split('/').includes('..')));
          NODE
          tar --no-same-owner -xzf "$PRIOR/completed-dist.tar.gz" -C "$GITHUB_WORKSPACE"
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > "$OUT/dist-before.sha256"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          const out = process.env.QA_OUT, prior = process.env.QA_PRIOR;
          const driver = 'scripts/qa/cmCustomTacticsBrowser.mjs';
          const workflow = '.github/workflows/cm-custom-tactics-browser-followup-20261103.yml';
          const digest = bytes => crypto.createHash('sha256').update(bytes).digest('hex');
          const sha = p => digest(fs.readFileSync(p));
          const originalSource = [process.env.BUILT_SOURCE_SHA, process.env.BUILT_TREE_SHA];
          assert.deepEqual(fs.readFileSync(prior + '/source.txt', 'utf8').trim().split(/\s+/), originalSource);
          const paths = execFileSync('git', ['diff', '--name-status', process.env.BUILT_SOURCE_SHA, 'HEAD']).toString().trim().split('\n').sort();
          assert.deepEqual(paths, ['A\t' + workflow, 'M\t' + driver].sort(), 'Only the follow-up workflow and driver may differ from the built source');
          const candidatePaths = execFileSync('git', ['diff', '--name-status', process.env.CANDIDATE_PARENT_SHA, 'HEAD']).toString().trim().split('\n').sort();
          assert.deepEqual(candidatePaths, ['M\t' + workflow, 'M\t' + driver].sort(), 'Only the two existing QA files may differ from the diagnostic parent');
          assert.equal(execFileSync('git', ['rev-parse', process.env.CANDIDATE_PARENT_SHA + ':' + driver]).toString().trim(), '9b1debb58921276554aa1daf4f2d050296e0a421');
          assert.equal(execFileSync('git', ['rev-parse', process.env.CANDIDATE_PARENT_SHA + ':' + workflow]).toString().trim(), '412cd9ab6447215eda2e1e2a1973266935fdfff8');
          const original = JSON.parse(fs.readFileSync(prior + '/source-before.json', 'utf8'));
          assert.equal(sha(prior + '/source-before.json'), '4ac1b9a19c0a03a6663647120e2373999f869da1d2e1803813c8337ea7adbaa6');
          assert.deepEqual(JSON.parse(fs.readFileSync(prior + '/source-before-browser.json', 'utf8')), original);
          assert.deepEqual(JSON.parse(fs.readFileSync(prior + '/source-after.json', 'utf8')), original);
          const generated = ['scripts/data/guideHeadingsFrozen.json', 'src/data/searchKeywords.json', 'public/club-manager/index.html', 'public/sitemap.xml', 'scripts/data/lastmod.json'];
          assert.deepEqual(JSON.parse(fs.readFileSync(prior + '/generated-paths.json', 'utf8')), generated);
          assert.deepEqual(JSON.parse(fs.readFileSync(prior + '/actual-generated-paths.json', 'utf8')), ['public/sitemap.xml']);
          assert.equal(original[driver], '17d7acbd3ef40d9c501358ea1d250e72a89e306c23cf76838fc1060b40b7b469');
          assert.ok(!Object.prototype.hasOwnProperty.call(original, workflow));
          const tracked = execFileSync('git', ['ls-files', '-z']).toString().split('\0').filter(Boolean).sort();
          assert.deepEqual(tracked, [...Object.keys(original), ...generated, workflow].sort(), 'Tracked source membership changed');
          for (const [p, value] of Object.entries(original)) {
            assert.equal(sha(p), p === driver ? '5753a9390a5ac0eabc3c86b2b8ed4c510c337798bf7166db54261a9090fbe6e3' : value, p);
          }
          for (const p of generated) assert.deepEqual(fs.readFileSync(p), fs.readFileSync(path.join(prior, 'original', p)), p);
          const association = JSON.parse(fs.readFileSync(prior + '/source-association.json', 'utf8'));
          assert.equal(sha(prior + '/source-association.json'), '388265bdcb0876c3e6b43eb3763568164bb31d2e522015d307b603c9b70fd6d0');
          assert.equal(association.parent, '453e01d6ab1d6d755bf4dedbefdead0d0b8cc679');
          assert.equal(association.parentTree, 'b02488cd7e071745b3013c5e7fa0a8951cc5d00e');
          assert.equal(Object.keys(association.pins).length, 25);
          assert.equal(association.pins[driver], 'ccda3af5c7e5972d0b406f5a2557e088250f2b64');
          const currentPins = { ...association.pins, [driver]: 'dd8f5bef0e3ccbc2845b52020e4dca62d82a9d01' };
          for (const [p, blob] of Object.entries(currentPins)) {
            assert.equal(execFileSync('git', ['rev-parse', 'HEAD:' + p]).toString().trim(), blob, p);
          }
          const priorReport = JSON.parse(fs.readFileSync(prior + '/browser/report.json', 'utf8'));
          assert.equal(priorReport.status, 'failed');
          assert.equal(priorReport.sourceHeld, true); assert.equal(priorReport.distHeld, true);
          assert.equal(priorReport.movedSlots, 42);
          const expectedDist = JSON.parse(fs.readFileSync(prior + '/browser/dist-before.json', 'utf8'));
          assert.deepEqual(JSON.parse(fs.readFileSync(prior + '/browser/dist-after.json', 'utf8')), expectedDist);
          const distRows = [];
          const walk = (relative = '') => {
            for (const item of fs.readdirSync(path.join('dist', relative), { withFileTypes: true })) {
              const file = path.posix.join(relative, item.name);
              if (item.isDirectory()) walk(file);
              else {
                assert.ok(item.isFile());
                const bytes = fs.readFileSync(path.join('dist', file));
                distRows.push({ file, bytes: bytes.length, sha256: digest(bytes) });
              }
            }
          };
          walk(); distRows.sort((a, b) => a.file.localeCompare(b.file));
          assert.deepEqual(distRows, expectedDist, 'Extracted completed dist differs from the actual original browser input');
          assert.equal(digest(JSON.stringify(distRows)), priorReport.distDigestBefore);
          assert.equal(priorReport.distDigestBefore, priorReport.distDigestAfter);
          fs.cpSync(prior + '/fixtures', out + '/fixtures', { recursive: true, errorOnExist: true, force: false });
          const manifest = JSON.parse(fs.readFileSync(out + '/fixtures/manifest.json', 'utf8'));
          assert.equal(sha(out + '/fixtures/manifest.json'), 'cccd8867b6429ece3c5dedc23cfc470d4ca43417ae15e0e065b446be3ba09c8b');
          assert.equal(sha(out + '/fixtures/engine-bundle.mjs'), '91b9a9e08685f9aa216820d6b658e55ff39e9b18d9cb75901296e0c670e2f444');
          assert.equal(sha(out + '/fixtures/normal.json'), '503d32e88e5d85f50e03f3a6b7a9d8195d19628c2345e9d68c9c6311da58a569');
          assert.equal(sha(out + '/fixtures/unsupported.json'), '9ec20207bfc0c9f8a70da1df5fc54f56dbad3600af2fc74ad3b369e5a4174809');
          assert.deepEqual(manifest.sourceBefore, manifest.sourceAfter);
          for (const [p, value] of Object.entries(manifest.sourceBefore)) assert.equal(sha(p), value, p);
          const fixtureHashes = Object.fromEntries(fs.readdirSync(out + '/fixtures').sort().map(p => [p, sha(out + '/fixtures/' + p)]));
          fs.writeFileSync(out + '/fixtures-before.json', JSON.stringify(fixtureHashes, null, 2) + '\n');
          fs.writeFileSync(out + '/source-before.json', JSON.stringify(Object.fromEntries(tracked.map(p => [p, sha(p)])), null, 2) + '\n');
          fs.writeFileSync(out + '/dist-before.json', JSON.stringify(distRows, null, 2) + '\n');
          for (const [from, to] of [
            ['source.txt', 'built-source.txt'], ['source-association.json', 'original-source-association.json'],
            ['source-before.json', 'original-source-before.json'], ['source-after.json', 'original-source-after.json'],
            ['browser/report.json', 'original-failed-browser-report.json'], ['actual-generated-paths.json', 'original-generated-changes.json'],
            ['completed-dist.tar.gz', 'completed-dist.tar.gz'], ['completed-dist.tar.gz.sha256', 'original-dist-record.txt'],
          ]) fs.copyFileSync(path.join(prior, from), path.join(out, to));
          fs.cpSync(prior + '/browser', out + '/original-failed-browser', { recursive: true, errorOnExist: true, force: false });
          fs.writeFileSync(out + '/association.json', JSON.stringify({
            originalRun: process.env.SOURCE_RUN_ID, originalArtifact: process.env.SOURCE_ARTIFACT_ID,
            originalZipBytes: Number(process.env.SOURCE_ZIP_BYTES), originalZipSha256: process.env.SOURCE_ZIP_SHA256,
            completedDistTarBytes: Number(process.env.DIST_TAR_BYTES), completedDistTarSha256: process.env.DIST_TAR_SHA256,
            builtSource: originalSource, originalGuardedEntries: Object.keys(original).length,
            originalGuardedEntriesHeld: Object.keys(original).length - 1, generatedCheckoutEntriesHeld: generated.length,
            originalPins: association.pins, currentPins, onlyChangedFromBuiltSource: [driver], onlyAddedSinceBuiltSource: [workflow],
            candidateParent: [process.env.CANDIDATE_PARENT_SHA, process.env.CANDIDATE_PARENT_TREE], changedFromCandidateParent: [driver, workflow],
            previousDiagnostic: { run: '41622967467', artifact: '13223933117', head: 'e566d9f5cce732c5456e435a177cf6f25c24dc3e', zipSha256: '19cf8b12fefc0d06219e9e8ddfe1ccf7da8e41c5df2146bb1fe31e3eaaf262e9', outcome: 'FAILED, retained separately by Root. Native hit trace proved sticky ticker interception; live portal was running while a zero-height metadata wrapper failed visibility.' },
            buildRepeated: false, typesRepeated: false, generatorsRepeated: false, readersRepeated: false, capsRepeated: false,
            originalRunOutcome: 'FAILED at actual App checks. Earlier proper types, generators, build, 20 readers and 16 unchanged caps passed. The overall failure and raw report are retained.',
            browserDelta: 'Two source-proven QA fixes: native wheel preparation only for an obscured slot hit, and visible portal controls/dots with attached stage metadata. Native gesture, preview threshold, four journeys and twelve normal photos held. Earlier diagnostics and empty-order normalization retained.',
            scope: 'App diagnostic only on the exact retained completed dist and fixtures. No new engine, control, balance, natural-progression or actual-font credit.',
          }, null, 2) + '\n');
          NODE
      - name: Install held application and isolated browser dependencies
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund 2>&1 | tee "$QA_OUT/logs/npm-ci.log"
          npm install --prefix "$RUNNER_TEMP/cm-custom-tactics-tools" --package-lock=false --no-audit --no-fund playwright@1.64.0 2>&1 | tee "$QA_OUT/logs/playwright-install.log"
          test ! -e node_modules/playwright
          test ! -e node_modules/playwright-core
          ln -s "$RUNNER_TEMP/cm-custom-tactics-tools/node_modules/playwright" node_modules/playwright
          ln -s "$RUNNER_TEMP/cm-custom-tactics-tools/node_modules/playwright-core" node_modules/playwright-core
          "$RUNNER_TEMP/cm-custom-tactics-tools/node_modules/.bin/playwright" install --with-deps chromium 2>&1 | tee "$QA_OUT/logs/chromium-install.log"
          git diff --exit-code -- package.json package-lock.json
      - name: Run the four actual App journeys on the original completed dist
        timeout-minutes: 12
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$GITHUB_WORKSPACE/scripts/lib/offlineTransport.cjs"
          export BASE=http://127.0.0.1:4173
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import assert from 'node:assert/strict';
          const before = JSON.parse(fs.readFileSync(process.env.QA_OUT + '/source-before.json', 'utf8'));
          const current = Object.fromEntries(Object.keys(before).map(p => [p, crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex')]));
          fs.writeFileSync(process.env.QA_OUT + '/source-before-browser.json', JSON.stringify(current, null, 2) + '\n');
          assert.deepEqual(current, before, 'Source changed before the actual browser input');
          NODE
          export SIM_OFFLINE_RECEIPT="$QA_OUT/transport/server.log"
          : > "$SIM_OFFLINE_RECEIPT"
          node scripts/lib/hostLikeServer.mjs dist 4173 > "$QA_OUT/logs/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 40); do
            if curl --fail --silent "$BASE/" > /dev/null; then ready=1; break; fi
            kill -0 "$server_pid"
            sleep 1
          done
          test "$ready" = 1
          : > "$QA_OUT/transport/browser.log"
          SIM_OFFLINE_RECEIPT="$QA_OUT/transport/browser.log" node scripts/qa/cmCustomTacticsBrowser.mjs --base-url "$BASE" --out "$QA_OUT/browser" --fixtures "$QA_OUT/fixtures" 2>&1 | tee "$QA_OUT/logs/browser.log"
          test ! -s "$QA_OUT/transport/browser.log"
          test ! -s "$QA_OUT/transport/server.log"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          const out = process.env.QA_OUT, report = JSON.parse(fs.readFileSync(out + '/browser/report.json', 'utf8'));
          assert.equal(report.status, 'passed');
          assert.deepEqual(report.contexts.map(r => r.width), [320, 390, 430, 1440]);
          assert.ok(report.contexts.every(r => r.status === 'passed' && r.moves.length === 11 && r.cancel.rawHeld && r.pageErrors.length === 0));
          assert.equal(report.completeProfiles, 4); assert.equal(report.movedSlots, 44); assert.equal(report.cancellations, 4);
          assert.equal(report.quotaFaults, 1); assert.equal(report.keptDataJourneys, 1); assert.equal(report.liveJourneys, 1);
          assert.equal(report.sourceHeld, true); assert.equal(report.distHeld, true);
          const photos = [
            '320-edited-pitch.png', '320-reapplied-plan.png', '320-save-refused.png',
            '390-edited-pitch.png', '390-reapplied-plan.png', '390-live-custom.png', '390-halftime-custom.png',
            '430-edited-pitch.png', '430-reapplied-plan.png',
            '1440-edited-pitch.png', '1440-reapplied-plan.png', '1440-kept-data.png',
          ].sort();
          assert.deepEqual([...report.screenshots].sort(), photos, 'The twelve normal photo contracts are unchanged');
          for (const photo of photos) {
            const bytes = fs.readFileSync(path.join(out, 'browser', photo));
            assert.ok(bytes.length > 1000); assert.equal(bytes.subarray(0, 8).toString('hex'), '89504e470d0a1a0a');
          }
          NODE
      - name: Retain actual outcomes, transport and unchanged source, fixtures and dist
        if: always()
        run: |
          set -euo pipefail
          test -n "$QA_OUT"
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > "$QA_OUT/dist-after.sha256"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          const out = process.env.QA_OUT;
          const sha = p => crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          const before = JSON.parse(fs.readFileSync(out + '/source-before.json', 'utf8'));
          const tracked = execFileSync('git', ['ls-files', '-z']).toString().split('\0').filter(Boolean).sort();
          const after = Object.fromEntries(tracked.map(p => [p, sha(p)]));
          fs.writeFileSync(out + '/source-after.json', JSON.stringify(after, null, 2) + '\n');
          fs.writeFileSync(out + '/working-tree.txt', execFileSync('git', ['status', '--short']));
          const fixtureBefore = JSON.parse(fs.readFileSync(out + '/fixtures-before.json', 'utf8'));
          const fixtureAfter = Object.fromEntries(fs.readdirSync(out + '/fixtures').sort().map(p => [p, sha(out + '/fixtures/' + p)]));
          fs.writeFileSync(out + '/fixtures-after.json', JSON.stringify(fixtureAfter, null, 2) + '\n');
          const reportFile = out + '/browser/report.json', report = fs.existsSync(reportFile) ? JSON.parse(fs.readFileSync(reportFile, 'utf8')) : null;
          const photos = fs.existsSync(out + '/browser') ? fs.readdirSync(out + '/browser').filter(p => p.endsWith('.png')).sort().map(p => ({
            file: p, bytes: fs.statSync(path.join(out, 'browser', p)).size, sha256: sha(path.join(out, 'browser', p)),
            declaredNormal: report?.screenshots?.includes(p) ?? false, failurePhoto: p.endsWith('-failed.png'),
          })) : [];
          fs.writeFileSync(out + '/photo-inventory.json', JSON.stringify(photos, null, 2) + '\n');
          fs.writeFileSync(out + '/transport-summary.json', JSON.stringify({
            nodeGuardReceipts: ['browser', 'server'].map(name => {
              const p = out + '/transport/' + name + '.log';
              return { name, present: fs.existsSync(p), blockedAttempts: fs.existsSync(p) ? fs.readFileSync(p, 'utf8').split('\n').filter(Boolean).length : null };
            }),
            outcome: report?.status ?? 'No browser report produced',
            browser: report?.contexts.map(r => ({
              width: r.width, status: r.status, error: r.error ?? null,
              actualAbortedHttpRequests: r.blockedRequests, requestFailures: r.requestFailures,
              consoleMessages: r.consoleMessages, pageErrors: r.pageErrors,
              pointerAttempts: r.pointerAttempts ?? [], failureScreenshot: r.failureScreenshot ?? null,
            })) ?? [],
            meaning: 'External HTTP aborts and every console/resource event remain raw evidence for manual classification. Empty Node receipts are not a zero-browser-traffic claim.',
          }, null, 2) + '\n');
          assert.deepEqual(after, before, 'Any tracked source, including generated bodies or dependency inputs, changed');
          assert.deepEqual(fixtureAfter, fixtureBefore, 'Retained original fixture bytes changed');
          assert.equal(sha(out + '/completed-dist.tar.gz'), process.env.DIST_TAR_SHA256);
          NODE
          cmp "$QA_OUT/dist-before.sha256" "$QA_OUT/dist-after.sha256"
      - name: Bound the retained artifact
        id: artifact
        if: always()
        run: |
          set -euo pipefail
          test -d "$QA_OUT"
          test "$(du -sb "$QA_OUT" | cut -f1)" -lt 150000000
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.artifact.outputs.ready == 'true' }}
        with:
          name: cm-custom-tactics-browser-followup-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cm-custom-tactics-browser-followup
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
