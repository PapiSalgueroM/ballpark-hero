        if: always()
        run: |
          set -euo pipefail
          out="$HOME398_OUT";failed=0
          git ls-files -z | sort -z > "$out/source-members.final";git ls-files -z | sort -z | xargs -0 sha256sum > "$out/source.final.sha256"
          cmp "$out/source-members.initial" "$out/source-members.final" || failed=1;cmp "$out/source.initial.sha256" "$out/source.final.sha256" || failed=1
          sha256sum -c "$out/source.initial.sha256" > "$out/source-held.log" 2>&1 || failed=1;git diff --exit-code HEAD > "$out/tracked-final.diff" || failed=1
          if test "${{ steps.build.outcome }}" = success;then
            for pair in "deps:node_modules" "browser:$PLACEMENT_TOOLS" "fonts:$FREE_KICK_FONT_CACHE" "dist:dist";do label="${pair%%:*}";dir="${pair#*:}";find "$dir" -type f -print0 | sort -z > "$out/$label.members.final";cmp "$out/$label.members" "$out/$label.members.final" || failed=1;sha256sum -c "$out/$label.sha256" > "$out/$label-held.log" 2>&1 || failed=1;done
            find node_modules -type l -printf '%p -> %l\n' | sort > "$out/dependency-links.final";cmp "$out/dependency-links.before" "$out/dependency-links.final" || failed=1
            sha256sum -c "$out/build-manifest.sha256" > "$out/build-manifest-held.log" 2>&1 || failed=1
          fi
          if test -f "$out/weights-generated.before.sha256";then sha256sum -c "$out/weights-generated.before.sha256" > "$out/weights-generated-held.log" 2>&1 || failed=1;sha256sum "$out/weights-cached-fonts.cjs" > "$out/weights-generated.final.sha256" || failed=1;cmp "$out/weights-generated.before.sha256" "$out/weights-generated.final.sha256" || failed=1;fi
          if test -f "$out/poll-day-reference.sha256";then sha256sum -c "$out/poll-day-reference.sha256" > "$out/poll-day-generated-held.log" 2>&1 || failed=1;fi
          while IFS= read -r -d '' file;do test ! -s "$file" || failed=1;done < <(find "$out" -type f \( -name '*.transport' -o -name transport.jsonl \) -print0)
          printf '%s\n' "$failed" > "$out/final-holds.exit";find "$out" -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/home-menu-linebox-joined-evidence.sha256";cp "$RUNNER_TEMP/home-menu-linebox-joined-evidence.sha256" "$out/evidence.sha256";exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-menu-linebox-joined-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/home-menu-linebox-joined/
          if-no-files-found: error
          retention-days: 14
