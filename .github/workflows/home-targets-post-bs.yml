            '      });',
          ].join('\n');
          assert.equal(original.split(gate).length,2);assert.equal(original.split(anchor).length,2);assert.equal(original.split(moduleBefore).length,2);const copy=original.replace(gate,next).replace(anchor,insert).replace(moduleBefore,moduleAfter);assert.notEqual(copy,original);assert.equal(copy.split(moduleAfter).length,2);assert.equal(copy.replace(moduleAfter,moduleBefore).replace(insert,anchor).replace(next,gate),original);
          fs.writeFileSync(process.env.PLACEMENT_OUT+'/weights-cached-fonts.cjs',copy,{flag:'wx'});fs.writeFileSync(process.env.PLACEMENT_OUT+'/weights-preload-binding.json',JSON.stringify({sourceSha256:sha(original),copySha256:sha(copy),wholeInverseExact:true,resolverAdapter:{before:moduleBefore,after:moduleAfter,occurrences:1,wholeInverseExact:true},onlyPreparedFontsAndStrictLocalFlagDenials:true},null,2)+'\n',{flag:'wx'});
