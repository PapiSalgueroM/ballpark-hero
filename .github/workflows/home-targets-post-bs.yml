          printf '{"source":"%s","parent":"%s","main":"%s","codeParent":"6f50ce80c9c4f88065ac0b0d7a886e4d26c6c50c","productScope":"three Home size classes atop unchanged current Header linebox Menu sprite source;20 total owned paths","fullVitestSuite":"UNRUN","combinedFullDefaultVitest":"UNRUN","priorOutcomes":"PRESERVED_SEPARATE_RUNS","inheritedRuntimeCredit":false,"releaseIntegration":false,"mainReadiness":false,"mergeOrLiveClaim":false}\n' "$GITHUB_SHA" "$EXPECTED_PARENT" "$EXPECTED_MAIN" > "$out/qualification-scope.json"
