name: Fantasy Draft roster readiness on the retained completed build

on:
  push:
    branches: [codex/fantasy-roster-browser-20261103]

permissions:
  contents: read
  actions: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: '1'
      SIM_NETWORK: offline
      PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
      SOURCE_ARTIFACT_ID: '13204161208'
      SOURCE_RUN_ID: '41576867222'
      SOURCE_JOB_ID: '125722299349'
      SOURCE_ZIP_SHA256: 'e42e2dc0d7ea6636492510d874f033539540352c9679496696db2010e09ddbdb'
      BUILT_SOURCE_SHA: '4b5eadc2c8bfe18470b48f58f551247f2baddaf4'
      BUILT_TREE_SHA: '4ed24306faa36de9a87fcaadae86879a94e7043d'
      DIST_TAR_SHA256: '27285d6990c5702e23df0c4f72efd0fd744ce224080d70da891de2bc6faeecec'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify declared artifact, complete dist and whole source association
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for value in "$SOURCE_ARTIFACT_ID" "$SOURCE_RUN_ID" "$SOURCE_JOB_ID"; do [[ "$value" =~ ^[0-9]+$ ]]; done
          for value in "$SOURCE_ZIP_SHA256" "$DIST_TAR_SHA256"; do [[ "$value" =~ ^[0-9a-f]{64}$ ]]; done
          for value in "$BUILT_SOURCE_SHA" "$BUILT_TREE_SHA"; do [[ "$value" =~ ^[0-9a-f]{40}$ ]]; done
          OUT="$RUNNER_TEMP/fantasy-roster-browser"
          PRIOR="$RUNNER_TEMP/fantasy-roster-built-proof"
          ZIP="$RUNNER_TEMP/fantasy-roster-built-proof.zip"
          mkdir -p "$OUT/logs" "$OUT/transport" "$PRIOR"
          echo "QA_OUT=$OUT" >> "$GITHUB_ENV"
          curl --fail --location --silent --show-error --retry 0 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/PapiSalgueroM/ballpark-hero/actions/artifacts/$SOURCE_ARTIFACT_ID/zip" \
            --output "$ZIP"
          echo "$SOURCE_ZIP_SHA256  $ZIP" | sha256sum --check
          unzip -q "$ZIP" -d "$PRIOR"
          test "$(cut -d' ' -f1 "$PRIOR/completed-dist.tar.gz.sha256")" = "$DIST_TAR_SHA256"
          echo "$DIST_TAR_SHA256  $PRIOR/completed-dist.tar.gz" | sha256sum --check
          test ! -e dist
          tar -xzf "$PRIOR/completed-dist.tar.gz" -C "$GITHUB_WORKSPACE"
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > "$OUT/dist-before.sha256"
          git rev-parse HEAD HEAD^{tree} > "$OUT/current-source.txt"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          const out = process.env.RUNNER_TEMP + '/fantasy-roster-browser';
          const prior = process.env.RUNNER_TEMP + '/fantasy-roster-built-proof';
          const builtSource = [process.env.BUILT_SOURCE_SHA, process.env.BUILT_TREE_SHA];
          assert.deepEqual(fs.readFileSync(prior + '/source.txt', 'utf8').trim().split(/\s+/), builtSource);
          const original = JSON.parse(fs.readFileSync(prior + '/source-before.json', 'utf8'));
          assert.deepEqual(JSON.parse(fs.readFileSync(prior + '/source-after.json', 'utf8')), original);
          const generated = JSON.parse(fs.readFileSync(prior + '/generated-paths.json', 'utf8'));
          assert.deepEqual(JSON.parse(fs.readFileSync(prior + '/actual-generated-paths.json', 'utf8')), [], 'First proof generated no changed tracked bodies');
          const driver = 'scripts/qa/fantasyDraftRosterBrowserReady20261103.mjs';
          const workflow = '.github/workflows/fantasy-roster-browser-20261103.yml';
          assert.ok(!Object.hasOwn(original, driver) && !Object.hasOwn(original, workflow));
          const sha = p => crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          const tracked = execFileSync('git', ['ls-files', '-z']).toString().split('\0').filter(Boolean).sort();
          assert.deepEqual(tracked, [...Object.keys(original), ...generated, driver, workflow].sort(), 'Only the two declared QA paths may be added');
          for (const [p, hash] of Object.entries(original)) assert.equal(sha(p), hash, p);
          assert.equal(sha(driver), 'bd9ee44d03277212a78301dd9071ecfe250449d25adc95c18a84440164b14778');
          for (const p of generated) assert.deepEqual(fs.readFileSync(p), fs.readFileSync(path.join(prior, 'original', p)), p);
          fs.writeFileSync(out + '/source-before.json', JSON.stringify(Object.fromEntries(tracked.map(p => [p, sha(p)])), null, 2) + '\n');
          fs.copyFileSync(prior + '/source.txt', out + '/built-source.txt');
          fs.copyFileSync(prior + '/browser/report.json', out + '/prior-failed-browser-report.json');
          fs.copyFileSync(prior + '/completed-dist.tar.gz.sha256', out + '/original-dist-record.txt');
          fs.writeFileSync(out + '/association.json', JSON.stringify({
            originalRun: process.env.SOURCE_RUN_ID, originalJob: process.env.SOURCE_JOB_ID,
            artifact: process.env.SOURCE_ARTIFACT_ID, zipSha256: process.env.SOURCE_ZIP_SHA256,
            completedDistTarSha256: process.env.DIST_TAR_SHA256, builtSource,
            originalSourceEntriesHeld: Object.keys(original).length,
            onlyAddedQa: [driver, workflow], buildRepeated: false, unitsRepeated: false,
            readersRepeated: false, capsRepeated: false, settleSeasonMocked: false,
            originalRunOutcome: 'FAILED at browser readiness; earlier types, eleven focused cases, permanent simulation, build, twenty readers and sixteen caps passed. Overall failure preserved.',
            browserDelta: 'One real-card readiness wait; all product sources and completed dist unchanged. No game RNG or clock override.',
          }, null, 2) + '\n');
          NODE
      - name: Install locked application and isolated browser dependencies
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund 2>&1 | tee "$QA_OUT/logs/npm-ci.log"
          npm install --prefix "$RUNNER_TEMP/fantasy-tools" --package-lock=false --no-audit --no-fund playwright@1.64.0 2>&1 | tee "$QA_OUT/logs/playwright-install.log"
          test ! -e node_modules/playwright
          test ! -e node_modules/playwright-core
          ln -s "$RUNNER_TEMP/fantasy-tools/node_modules/playwright" node_modules/playwright
          ln -s "$RUNNER_TEMP/fantasy-tools/node_modules/playwright-core" node_modules/playwright-core
          "$RUNNER_TEMP/fantasy-tools/node_modules/.bin/playwright" install --with-deps chromium 2>&1 | tee "$QA_OUT/logs/chromium-install.log"
          git diff --exit-code -- package.json package-lock.json
      - name: Play four real drafts on the exact retained dist
        timeout-minutes: 10
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require $GITHUB_WORKSPACE/scripts/lib/offlineTransport.cjs"
          export BASE=http://127.0.0.1:4173
          export SIM_OFFLINE_RECEIPT="$QA_OUT/transport/server.log"
          : > "$SIM_OFFLINE_RECEIPT"
          node scripts/lib/hostLikeServer.mjs dist 4173 > "$QA_OUT/logs/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 40); do
            if curl --fail --silent "$BASE/" > /dev/null; then ready=1; break; fi
            kill -0 "$server_pid"
            sleep 1
          done
          test "$ready" = 1
          : > "$QA_OUT/transport/browser.log"
          SIM_OFFLINE_RECEIPT="$QA_OUT/transport/browser.log" node scripts/qa/fantasyDraftRosterBrowserReady20261103.mjs 2>&1 | tee "$QA_OUT/logs/browser.log"
          test ! -s "$QA_OUT/transport/browser.log"
          test ! -s "$QA_OUT/transport/server.log"
      - name: Retain browser association and verify unchanged source and dist
        if: always()
        run: |
          set -euo pipefail
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > "$QA_OUT/dist-after.sha256"
          cmp "$QA_OUT/dist-before.sha256" "$QA_OUT/dist-after.sha256"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          const out = process.env.QA_OUT;
          const before = JSON.parse(fs.readFileSync(out + '/source-before.json', 'utf8'));
          const tracked = execFileSync('git', ['ls-files', '-z']).toString().split('\0').filter(Boolean).sort();
          const after = Object.fromEntries(tracked.map(p => [p, crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex')]));
          fs.writeFileSync(out + '/source-after.json', JSON.stringify(after, null, 2) + '\n');
          fs.writeFileSync(out + '/working-tree.txt', execFileSync('git', ['status', '--short']));
          assert.deepEqual(after, before, 'Source or dependency inputs changed');
          const report = JSON.parse(fs.readFileSync(out + '/browser/report.json', 'utf8'));
          fs.writeFileSync(out + '/transport-summary.json', JSON.stringify({
            nodeGuardReceipts: ['browser', 'server'].map(name => ({
              name, blockedAttempts: fs.readFileSync(out + '/transport/' + name + '.log', 'utf8').split('\n').filter(Boolean).length,
            })),
            browser: report.contexts.map(r => ({
              viewport: r.viewport, fixtures: r.fixtures, actualAbortedRequests: r.aborted.length,
              abortedOrigins: [...new Set(r.aborted.map(x => x.origin))].sort(),
              consoleErrors: r.consoleErrors, unexpectedConsoleErrors: r.unexpectedConsoleErrors ?? null,
              pageErrors: r.pageErrors,
            })),
            meaning: 'Only the two declared data endpoints use local fixtures. Other external app requests are aborted and recorded, never described as zero attempts.',
          }, null, 2) + '\n');
          NODE
      - name: Bound the retained artifact
        id: artifact
        if: always()
        run: |
          set -euo pipefail
          test -d "$QA_OUT"
          test "$(du -sb "$QA_OUT" | cut -f1)" -lt 150000000
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.artifact.outputs.ready == 'true' }}
        with:
          name: fantasy-roster-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fantasy-roster-browser
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
