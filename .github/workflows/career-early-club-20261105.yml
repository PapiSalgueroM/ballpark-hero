name: Career Quiz exact archived head metadata
on:
  push:
    branches: [codex/career-early-club-qa-20261105]
permissions:
  contents: read
  actions: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      SIM_NETWORK: offline
      ENGINES: chromium
      TZ: UTC
      SEO_SPLIT_BASE_REF: 3b14650d360b010b25b525de33a5f32f33de2798
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 12
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - name: Fetch and verify the exact immutable metadata baseline
        run: |
          mkdir -p career-meta-artifacts
          git fetch --no-tags --depth=1 origin 3b14650d360b010b25b525de33a5f32f33de2798
          test "$(git rev-parse 3b14650d360b010b25b525de33a5f32f33de2798:src/data/seoMeta.ts)" = cf7a5142e59b97048d27b5ece9a6588a92073728
          git show 3b14650d360b010b25b525de33a5f32f33de2798:src/data/seoMeta.ts > career-meta-artifacts/immutable-baseline.ts
          git rev-parse HEAD > career-meta-artifacts/head.txt
          git ls-files -s > career-meta-artifacts/source-before.txt
          sha256sum package.json package-lock.json > career-meta-artifacts/locks-before.txt
          npm ci
          npm install --prefix "$RUNNER_TEMP/crq-meta-browser" --no-save --package-lock=false playwright@1.64.1
          test ! -e node_modules/playwright
          ln -s "$RUNNER_TEMP/crq-meta-browser/node_modules/playwright" node_modules/playwright
          node "$RUNNER_TEMP/crq-meta-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 42116657118
          name: career-early-club-final-42116657118
          path: reused-career-artifact
      - name: Restore only the exact qualified build and generated inputs
        run: |
          test "$(cat reused-career-artifact/head.txt)" = 7ff91a59ae9b17d8da73e0c080708bd428ca9b52
          echo 'faf8365be5090c1215771c64a256219e17771cafd0d18df65515642c4db021e7  reused-career-artifact/dist.tgz' | sha256sum --check
          tar -xzf reused-career-artifact/dist.tgz
          cp reused-career-artifact/generated/public/career/index.html public/career/index.html
          cp reused-career-artifact/generated/public/sitemap.xml public/sitemap.xml
          cp reused-career-artifact/generated/scripts/data/lastmod.json scripts/data/lastmod.json
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > career-meta-artifacts/dist-before.txt
      - name: Exact archived build against the fetched baseline
        run: ONLY=simSeoMetaSplit node scripts/runAllSims.mjs --browser 2>&1 | tee career-meta-artifacts/metadata.log
      - name: Source build and lock holds
        if: always()
        run: |
          git ls-files -s > career-meta-artifacts/source-after.txt
          cmp career-meta-artifacts/source-before.txt career-meta-artifacts/source-after.txt
          git diff --exit-code HEAD -- src scripts package.json package-lock.json ':!scripts/data/lastmod.json'
          sha256sum package.json package-lock.json > career-meta-artifacts/locks-after.txt
          cmp career-meta-artifacts/locks-before.txt career-meta-artifacts/locks-after.txt
          if test -d dist; then find dist -type f -print0 | sort -z | xargs -0 sha256sum > career-meta-artifacts/dist-after.txt; cmp career-meta-artifacts/dist-before.txt career-meta-artifacts/dist-after.txt; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: career-archived-metadata-${{ github.run_id }}
          path: career-meta-artifacts
          retention-days: 14
          if-no-files-found: error
