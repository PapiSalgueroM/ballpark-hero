name: Career Path early club qualification
on:
  push:
    branches: [codex/career-early-club-qa-20261105]
permissions:
  contents: read
jobs:
  scoped:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      SIM_NETWORK: offline
      SIM_OFFLINE_RECEIPT: early-club-artifacts/offline.log
      ENGINES: chromium
      TZ: UTC
      SEO_SPLIT_BASE_REF: 3b14650d360b010b25b525de33a5f32f33de2798
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 12
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Locked dependencies and source receipt
        run: |
          mkdir -p early-club-artifacts
          git rev-parse HEAD > early-club-artifacts/head.txt
          git rev-parse 'HEAD^{tree}' > early-club-artifacts/tree.txt
          git ls-files -s > early-club-artifacts/source-before.txt
          sha256sum package.json package-lock.json > early-club-artifacts/locks-before.txt
          git fetch --no-tags --depth=1 origin 617b8354b722c703407074e78a86665d4f7633b5
          git show 617b8354b722c703407074e78a86665d4f7633b5:src/hooks/useDailyPuzzle.ts > "$RUNNER_TEMP/crq-pre-daily.ts"
          cp "$RUNNER_TEMP/crq-pre-daily.ts" early-club-artifacts/pre-daily-hook.ts
          npm ci
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const lock=JSON.parse(fs.readFileSync('package-lock.json'));
          const rows=Object.keys(lock.packages).filter(p=>p.startsWith('node_modules/')&&fs.existsSync(p+'/package.json')).map(p=>[p,JSON.parse(fs.readFileSync(p+'/package.json')).version]);
          fs.writeFileSync('early-club-artifacts/installed-before.json',JSON.stringify(rows));
          NODE
      - name: Proper app types
        run: node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee early-club-artifacts/types.log
      - name: Original fixed seven physical faults and restored actual page
        run: NODE_OPTIONS="--max-old-space-size=6144 --require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/qa/checkCareerEarlyClub.mjs 2>&1 | tee early-club-artifacts/arms.log
      - name: Existing Career Path record and stale-save contracts
        if: ${{ !cancelled() }}
        run: |
          NODE_OPTIONS="--max-old-space-size=6144 --require=$PWD/scripts/lib/offlineTransport.cjs" node node_modules/vitest/vitest.mjs run src/test/dailyRecord.test.tsx src/test/dailySaveHardening.test.tsx --testNamePattern="Career Path" --maxWorkers=1 --minWorkers=1 --reporter=default --reporter=json --outputFile=early-club-artifacts/existing-daily.json 2>&1 | tee early-club-artifacts/existing-daily.log
          node --input-type=module <<'NODE'
          import fs from 'node:fs'; import assert from 'node:assert/strict';
          const r=JSON.parse(fs.readFileSync('early-club-artifacts/existing-daily.json'));
          const rows=r.testResults.flatMap(s=>s.assertionResults), passed=rows.filter(x=>x.status==='passed');
          assert.equal(passed.length,3); assert(passed.every(x=>x.title.includes('Career Path')));
          assert.equal(rows.filter(x=>x.status==='failed').length,0);
          console.log('PASS all three existing Career Path record and stale-save cases');
          NODE
      - name: Existing old-versus-current Career Path save and reload parity
        if: ${{ !cancelled() }}
        run: |
          R848_PARITY_ONLY=career R848_PRE_HOOK="$PWD/early-club-artifacts/pre-daily-hook.ts" NODE_OPTIONS="--max-old-space-size=6144 --require=$PWD/scripts/lib/offlineTransport.cjs" node node_modules/vitest/vitest.mjs run src/test/dailySaveParity.test.tsx --maxWorkers=1 --minWorkers=1 --reporter=default --reporter=json --outputFile=early-club-artifacts/existing-parity.json 2>&1 | tee early-club-artifacts/existing-parity.log
          node --input-type=module <<'NODE'
          import fs from 'node:fs'; import assert from 'node:assert/strict';
          const r=JSON.parse(fs.readFileSync('early-club-artifacts/existing-parity.json'));
          const rows=r.testResults.flatMap(s=>s.assertionResults), passed=rows.filter(x=>x.status==='passed');
          assert.equal(passed.length,1); assert.equal(passed[0].title,'career');
          assert.equal(rows.filter(x=>x.status==='failed').length,0);
          NODE
      - name: Retain source proof before browser setup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: career-early-club-source-${{ github.run_id }}
          path: early-club-artifacts
          retention-days: 14
          if-no-files-found: error
      - name: Isolated browser and snapshot dependencies
        id: browser_setup
        timeout-minutes: 12
        if: ${{ !cancelled() }}
        run: |
          npm install --prefix "$RUNNER_TEMP/crq-browser" --no-save --package-lock=false playwright@1.64.1
          test ! -e node_modules/playwright
          ln -s "$RUNNER_TEMP/crq-browser/node_modules/playwright" node_modules/playwright
          node "$RUNNER_TEMP/crq-browser/node_modules/playwright/cli.js" install --with-deps chromium
          node --input-type=module <<'NODE'
          import fs from 'node:fs'; import assert from 'node:assert/strict';
          const before=JSON.parse(fs.readFileSync('early-club-artifacts/installed-before.json'));
          const after=before.map(([p])=>[p,JSON.parse(fs.readFileSync(p+'/package.json')).version]);
          fs.writeFileSync('early-club-artifacts/installed-after.json',JSON.stringify(after)); assert.deepEqual(after,before);
          console.log('Preserved all '+after.length+' locked installed versions.');
          NODE
          python -m pip install fonttools pillow
      - name: Production build and refreshed Career Quiz snapshot
        if: ${{ !cancelled() && steps.browser_setup.outcome == 'success' }}
        id: build
        run: |
          NODE_OPTIONS="--max-old-space-size=6144" PRERENDER_ONLY=/career npm run build:seo 2>&1 | tee early-club-artifacts/build.log
          git diff --name-only HEAD -- public scripts/data/lastmod.json > early-club-artifacts/generated-paths.txt
          node --input-type=module <<'NODE'
          import fs from 'node:fs'; import assert from 'node:assert/strict';
          const changed=fs.readFileSync('early-club-artifacts/generated-paths.txt','utf8').trim().split('\n').filter(Boolean);
          const allowed=new Set(['public/career/index.html','public/sitemap.xml','scripts/data/lastmod.json']);
          assert(changed.includes('public/career/index.html'),'Actual saved Career Quiz page refreshed');
          assert(changed.every(file=>allowed.has(file)),'Only the owned page, derived sitemap and ledger may change: '+changed.join(','));
          const html=fs.readFileSync('public/career/index.html','utf8');
          assert(html.includes('Choosing a club clue or random boxes'),'Updated saved hint instructions');
          assert(!html.includes('Each hint opens exactly 4 random boxes.'),'Old blanket hint claim removed from saved page');
          NODE
          git diff --binary HEAD -- public/career/index.html public/sitemap.xml scripts/data/lastmod.json > early-club-artifacts/generated.patch
          mkdir -p early-club-artifacts/generated/public/career early-club-artifacts/generated/scripts/data
          cp public/career/index.html early-club-artifacts/generated/public/career/index.html
          cp public/sitemap.xml early-club-artifacts/generated/public/sitemap.xml
          cp scripts/data/lastmod.json early-club-artifacts/generated/scripts/data/lastmod.json
          sha256sum scripts/data/lastmod.json > early-club-artifacts/generated-ledger.sha256
          tar -czf early-club-artifacts/dist.tgz dist
          sha256sum early-club-artifacts/dist.tgz > early-club-artifacts/dist.sha256
      - name: All required built-output readers and existing source fences
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          export ONLY="simAdsense,simBrand,simHeadTags,simHiddenPages,simHubs,simIndexNow,simIndexing,simInternalLinks,simNoRivalNames,simPrerender,simPrerenderBoot,simRetiredRoutes,simSchema,simSitemap,simSnapshotAssets,simSiteSearch,simGuideHeadings,simSeoMetaSplit,simHomeCopy,simHarnessAnchors"
          node scripts/runAllSims.mjs --browser 2>&1 | tee early-club-artifacts/readers.log
      - name: Actual guide and search freshness controls with exact restoration
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: NODE_OPTIONS="--max-old-space-size=6144 --require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/qa/checkCareerGuideRefresh.mjs 2>&1 | tee early-club-artifacts/guide-search-controls.log
      - name: All original route download limits
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          node scripts/lib/hostLikeServer.mjs dist 4173 > early-club-artifacts/weight-host.log 2>&1 &
          crq_host_pid=$!
          trap 'kill "$crq_host_pid" 2>/dev/null || true' EXIT
          sleep 2
          SWEEP_OFFLINE=1 BASE=http://127.0.0.1:4173 node scripts/sweepWeight.mjs 2>&1 | tee early-club-artifacts/weight.log
      - name: Actual daily hints rules wins reloads keyboard and touch
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: CAREER_EARLY_BROWSER_OUT=early-club-artifacts/browser NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/qa/playCareerEarlyClub.mjs 2>&1 | tee early-club-artifacts/browser.log
      - name: Source lock installed versions and offline holds
        if: always()
        run: |
          git ls-files -s > early-club-artifacts/source-after.txt
          cmp early-club-artifacts/source-before.txt early-club-artifacts/source-after.txt
          git diff --exit-code HEAD -- src scripts package.json package-lock.json ':!scripts/data/lastmod.json'
          if test -f early-club-artifacts/generated-ledger.sha256; then sha256sum --check early-club-artifacts/generated-ledger.sha256; fi
          sha256sum package.json package-lock.json > early-club-artifacts/locks-after.txt
          cmp early-club-artifacts/locks-before.txt early-club-artifacts/locks-after.txt
          node --input-type=module <<'NODE'
          import fs from 'node:fs'; import assert from 'node:assert/strict';
          const before=JSON.parse(fs.readFileSync('early-club-artifacts/installed-before.json'));
          const after=before.map(([p])=>[p,JSON.parse(fs.readFileSync(p+'/package.json')).version]);
          fs.writeFileSync('early-club-artifacts/installed-final.json',JSON.stringify(after));
          assert.equal(after.length,521); assert.deepEqual(after,before);
          NODE
          if test -f early-club-artifacts/offline.log; then test ! -s early-club-artifacts/offline.log; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: career-early-club-viewport-images-${{ github.run_id }}
          path: early-club-artifacts/browser/*-viewport.png
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: career-early-club-final-${{ github.run_id }}
          path: early-club-artifacts
          retention-days: 7
          if-no-files-found: error
