          import fs from 'node:fs';import path from 'node:path';import crypto from 'node:crypto';import assert from 'node:assert/strict';
          const leaf='.tmp-fx/career-records-tests.json',file=path.resolve(leaf),out=process.env.QA_OUT;
          assert.equal(file,path.join(process.cwd(),'.tmp-fx','career-records-tests.json'));
          assert(fs.lstatSync(file).isFile()&&!fs.lstatSync(file).isSymbolicLink(),'Only the exact ordinary file created by the qualified producer is owned');
          const bytes=fs.readFileSync(file),sha=crypto.createHash('sha256').update(bytes).digest('hex');
          JSON.parse(bytes.toString('utf8'));
          const retained=path.join(out,'raw','prebuild-simSoccerCareerRecords-last-control-report.json');
          assert(!fs.existsSync(retained));fs.writeFileSync(retained,bytes,{flag:'wx'});
          assert(fs.readFileSync(retained).equals(bytes));assert.equal(crypto.createHash('sha256').update(fs.readFileSync(retained)).digest('hex'),sha);
          fs.writeFileSync(out+'/records-prebuild-report-retention.json',JSON.stringify({producer:'simSoccerCareerRecords',leaf,retained:'raw/prebuild-simSoccerCareerRecords-last-control-report.json',bytes:bytes.length,sha256:sha,meaning:'Exact last report left by the qualified harness, which also runs its own fault controls. This retained leaf can contain an expected control failure; it is not labeled as an all-pass report.',cleanup:'Only this absent-before ordinary leaf is removed; its parent and every other path stay untouched.'},null,2)+'\n');
          fs.unlinkSync(file);assert(!fs.existsSync(file));assert(fs.readFileSync(retained).equals(bytes));
          NODE
