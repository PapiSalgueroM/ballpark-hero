          #!/usr/bin/env python3
          """Observe only one runner's Linux descendant tree. Never changes runner outcomes."""
          import argparse
          import json
          import os
          from pathlib import Path
          import signal
          import time
          from datetime import datetime, timezone
          
          parser = argparse.ArgumentParser()
          parser.add_argument("--pid", type=int, required=True)
          parser.add_argument("--workspace", type=Path, required=True)
          parser.add_argument("--out", type=Path, required=True)
          parser.add_argument("--stop-file", type=Path, required=True)
          args = parser.parse_args()
          if args.pid <= 1:
              parser.error("A specific owned runner PID is required")
          workspace = args.workspace.resolve(strict=True)
          scripts = (workspace / "scripts").resolve(strict=True)
          args.out.parent.mkdir(parents=True, exist_ok=True)
          HZ, INTERVAL, MAX_PROCESSES, MAX_BYTES = os.sysconf("SC_CLK_TCK"), 30, 256, 8_000_000
          stopping = False
          def stop_signal(_signum, _frame):
              global stopping
              stopping = True
          
          for signum in (signal.SIGINT, signal.SIGTERM):
              signal.signal(signum, stop_signal)
          
          def stat(pid):
              try:
                  fields = (Path("/proc") / str(pid) / "stat").read_text().rsplit(")", 1)[1].split()
                  return {"pid": pid, "ppid": int(fields[1]), "state": fields[0],
                          "cpu": (int(fields[11]) + int(fields[12])) / HZ, "start": int(fields[19])}
              except (OSError, ValueError, IndexError):
                  return None
          
          def children(pid):
              result = set()
              try:
                  # Read only threads of the currently observed descendant, never all host PIDs.
                  for thread in (Path("/proc") / str(pid) / "task").iterdir():
                      try:
                          result.update(int(p) for p in (thread / "children").read_text().split())
                      except (OSError, ValueError):
                          continue
              except OSError:
                  pass
              return sorted(result)
          
          def script_paths(pid):
              result = set()
              try:
                  with (Path("/proc") / str(pid) / "cmdline").open("rb") as stream:
                      argv = stream.read(65536).split(b"\0")
                  cwd = (Path("/proc") / str(pid) / "cwd").resolve(strict=True)
                  for token in argv[1:]:
                      value = token.decode("utf-8", errors="replace")
                      if not value or value.startswith("-") or "\n" in value or "\r" in value:
                          continue
                      candidate = Path(value)
                      if candidate.suffix not in {".mjs", ".cjs", ".js", ".tsx", ".ts", ".py", ".sh"}:
                          continue
                      candidate = (candidate if candidate.is_absolute() else cwd / candidate).resolve()
                      if candidate.is_relative_to(scripts) and candidate.is_file():
                          result.add(candidate.relative_to(workspace).as_posix())
                  return sorted(result)[:4]
              except OSError:
                  return []
          
          root = stat(args.pid)
          root_start = root["start"] if root else None
          previous = {}
          samples, written = 0, 0
          reason = "runner-ended"
          with args.out.open("xb") as output:
              def emit(row, final=False):
                  global written
                  data = (json.dumps(row, separators=(",", ":"), ensure_ascii=True) + "\n").encode()
                  ceiling = MAX_BYTES if final else MAX_BYTES - 1024
                  if written + len(data) > ceiling:
                      return False
                  output.write(data)
                  output.flush()
                  written += len(data)
                  return True
          
              while True:
                  if stopping or args.stop_file.exists():
                      reason = "requested-stop"
                      break
                  current = stat(args.pid)
                  if not current or current["start"] != root_start or current["state"] == "Z":
                      break
                  uptime = float(Path("/proc/uptime").read_text().split()[0])
                  queue, seen, rows = [args.pid], set(), []
                  while queue and len(seen) < MAX_PROCESSES:
                      pid = queue.pop(0)
                      if pid in seen:
                          continue
                      seen.add(pid)
                      info = stat(pid)
                      if info:
                          identity = (pid, info["start"])
                          prior = previous.get(identity)
                          rows.append({"pid": pid, "ppid": info["ppid"], "state": info["state"],
                                       "cpuSeconds": round(info["cpu"], 3),
                                       "elapsedSeconds": round(max(0, uptime - info["start"] / HZ), 3),
                                       "cpuDeltaSeconds": None if prior is None else round(info["cpu"] - prior, 3),
                                       "scriptPaths": script_paths(pid)})
                          previous[identity] = info["cpu"]
                          queue.extend(children(pid))
                  samples += 1
                  row = {"type": "sample", "utc": datetime.now(timezone.utc).isoformat(),
                         "sample": samples, "rootPID": args.pid, "processes": rows,
                         "treeTruncated": bool(queue), "unvisitedQueuedPIDs": len(set(queue) - seen)}
                  if not emit(row):
                      reason = "log-cap-reached"
                      break
                  deadline = time.monotonic() + INTERVAL
                  while not stopping and not args.stop_file.exists() and time.monotonic() < deadline:
                      time.sleep(min(1, max(0, deadline - time.monotonic())))
              emit({"type": "sampler-end", "utc": datetime.now(timezone.utc).isoformat(),
                    "reason": reason, "samples": samples, "bytesBeforeClosing": written,
                    "limits": {"intervalSeconds": INTERVAL, "processesPerSample": MAX_PROCESSES,
                               "logBytes": MAX_BYTES},
                    "meaning": "Activity only. No harness pass/fail or semantic progress inferred."}, final=True)
          SAMPLER_PY
          printf '%s  %s\n' c41354fd8eb003114534e3171a2f0f391635a18382dd5e276190c80ff79ad8dd "$telemetry_dir/sampleRunnerTree.py" | sha256sum --check
          test ! -e "$telemetry_dir/stop"
          sampler_pid=''
          stop_sampler() {
            if [[ -n "$sampler_pid" ]]; then
              : > "$telemetry_dir/stop"
              local sampler_status=0
              wait "$sampler_pid" || sampler_status=$?
              printf '%s\n' "$sampler_status" > "$telemetry_dir/sampler.exit"
              sampler_pid=''
            fi
          }
          trap stop_sampler EXIT
          (
            set +e
            SIM_FULL_OUTPUT=1 node scripts/runAllSims.mjs 2>&1 | tee "$QA_OUT/logs/all-sims.log"
            codes=("${PIPESTATUS[@]}")
            printf '%s\n' "${codes[0]}" > "$QA_OUT/all-sims.exit"
            printf '%s\n' "${codes[1]}" > "$telemetry_dir/tee.exit"
            exit "${codes[0]}"
          ) &
          runner_group_pid=$!
          python3 "$telemetry_dir/sampleRunnerTree.py" --pid "$runner_group_pid" --workspace "$GITHUB_WORKSPACE" --out "$telemetry_dir/process-tree.jsonl" --stop-file "$telemetry_dir/stop" > "$telemetry_dir/sampler.stdout" 2> "$telemetry_dir/sampler.stderr" &
          sampler_pid=$!
          set +e
          wait "$runner_group_pid"
          runner_status=$?
          set -e
          stop_sampler
          test "$runner_status" -eq "$(cat "$QA_OUT/all-sims.exit")"
          test "$(cat "$telemetry_dir/tee.exit")" -eq 0
          test "$(cat "$QA_OUT/all-sims.exit")" -eq 0
          # END observational-only runner descendant telemetry
      - name: Retain full source holds and transport evidence
        if: always()
        run: |
          set -euo pipefail
          test -n "$QA_OUT"
          dist_hold=0
          if [[ -f "$QA_OUT/dist-before.sha256" ]]; then
            find dist -type f -print0 | sort -z | xargs -0 sha256sum > "$QA_OUT/dist-after.sha256"
            cmp "$QA_OUT/dist-before.sha256" "$QA_OUT/dist-after.sha256" || dist_hold=$?
            sha256sum --check "$QA_OUT/dist-before.sha256" > "$QA_OUT/dist-held.log" || dist_hold=$?
          else
            echo "No completed-build inventory exists. No dist hold credit." > "$QA_OUT/dist-hold-unknown.txt"
          fi
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import path from 'node:path';import crypto from 'node:crypto';import assert from 'node:assert/strict';
          const leaf='.tmp-fx/career-records-tests.json',file=path.resolve(leaf),out=process.env.QA_OUT;
          assert.equal(file,path.join(process.cwd(),'.tmp-fx','career-records-tests.json'));
          const ownerFile=path.join(out,'records-leaf-owner.txt'),owner=fs.existsSync(ownerFile)?fs.readFileSync(ownerFile,'utf8').trim():null;
          const phase=owner==='fleet'?'fleet-last-report':owner==='prebuild'?'prebuild-interrupted-last-report':'no-owned-producer-active';
          let stat;try{stat=fs.lstatSync(file);}catch(error){if(error.code!=='ENOENT')throw error;}
          if(!stat){
            fs.writeFileSync(out+'/records-final-report-retention.json',JSON.stringify({producer:'simSoccerCareerRecords',leaf,phase,status:'missing',meaning:'No final report leaf exists. An interrupted or unstarted fleet is not credited with a report or aggregate outcome.'},null,2)+'\n');
          }else{
            assert(['prebuild','fleet'].includes(owner),'Absent-before producer ownership must be established before any report is removed');
            assert(stat.isFile()&&!stat.isSymbolicLink(),'Only the exact ordinary report leaf is owned');
            const bytes=fs.readFileSync(file),sha=crypto.createHash('sha256').update(bytes).digest('hex');JSON.parse(bytes.toString('utf8'));
            const relative='raw/'+phase+'.json',retained=path.join(out,relative);
            assert(!fs.existsSync(retained));fs.writeFileSync(retained,bytes,{flag:'wx'});
            assert(fs.readFileSync(retained).equals(bytes));assert.equal(crypto.createHash('sha256').update(fs.readFileSync(retained)).digest('hex'),sha);
            fs.writeFileSync(out+'/records-final-report-retention.json',JSON.stringify({producer:'simSoccerCareerRecords',leaf,phase,status:'retained',retained:relative,bytes:bytes.length,sha256:sha,meaning:'Exact last producer report, potentially an expected copied-control failure. This is not an aggregate fleet or all-pass report.'},null,2)+'\n');
            assert(fs.readFileSync(file).equals(bytes));fs.unlinkSync(file);assert(!fs.existsSync(file));assert(fs.readFileSync(retained).equals(bytes));
          }
          NODE
          git diff --exit-code HEAD > "$QA_OUT/source-diff.txt"
          git ls-files -z | sort -z | xargs -0 sha256sum > "$QA_OUT/source-after.sha256"
          if [[ -f "$QA_OUT/source-before.sha256" ]]; then
            cmp "$QA_OUT/source-before.sha256" "$QA_OUT/source-after.sha256"
            sha256sum --check "$QA_OUT/source-before.sha256" > "$QA_OUT/source-held.log"
          else
            echo "No qualified before inventory was produced." > "$QA_OUT/source-hold-unknown.txt"
            exit 1
          fi
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const out=process.env.QA_OUT;
          const rows=fs.existsSync(out+'/transport')?fs.readdirSync(out+'/transport').sort().map(file=>{
            const text=fs.readFileSync(out+'/transport/'+file,'utf8'),lines=text.split('\n').filter(Boolean);
            return {file,blockedAttempts:lines.length,
              fontBlockedAttempts:lines.filter(line=>/^\[SIM_OFFLINE_BLOCK\] external browser route continue https:\/\/fonts\.(googleapis|gstatic)\.com$/.test(line)).length,
              flagBlockedAttempts:lines.filter(line=>line==='[SIM_OFFLINE_BLOCK] external browser route continue https://flagcdn.com').length};
          }):[];
          fs.writeFileSync(out+'/transport-summary.json',JSON.stringify({
            receipts:rows,meaning:'Blocked attempts are retained. Empty Node receipts are not a browser or provider availability claim.'
          },null,2)+'\n');
          NODE
          test "$dist_hold" -eq 0
      - name: Bound retained focused evidence
        id: artifact
        if: always()
        run: |
          set -euo pipefail
          test -d "$QA_OUT"
          test "$(du -sb "$QA_OUT" | cut -f1)" -lt 150000000
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.artifact.outputs.ready == 'true' }}
        with:
          name: popular-pages-sims-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/popular-pages-sims
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
