name: Build Your XI title clean build join
on:
  push:
    branches: [codex/build-xi-title-space-qa-20261105]
permissions:
  contents: read
  actions: read
jobs:
  closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      SIM_NETWORK: offline
      SIM_OFFLINE_RECEIPT: xi-title-clean-join/offline.log
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Locked dependencies and clean source receipts
        run: |
          mkdir -p xi-title-clean-join
          touch xi-title-clean-join/offline.log
          git rev-parse HEAD > xi-title-clean-join/head.txt
          git rev-parse 'HEAD^{tree}' > xi-title-clean-join/tree.txt
          git ls-files -s > xi-title-clean-join/source-before.txt
          sha256sum package.json package-lock.json > xi-title-clean-join/locks-before.txt
          npm ci
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const lock=JSON.parse(fs.readFileSync('package-lock.json'));
          const rows=Object.keys(lock.packages).filter(p=>p.startsWith('node_modules/')&&fs.existsSync(p+'/package.json')).map(p=>[p,JSON.parse(fs.readFileSync(p+'/package.json')).version]);
          assert.equal(rows.length,521);fs.writeFileSync('xi-title-clean-join/installed-before.json',JSON.stringify(rows));
          NODE
      - name: Proper app types
        run: node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee xi-title-clean-join/types.log
      - name: Pinned completed qualification artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/PapiSalgueroM/ballpark-hero/actions/artifacts/13480615222/zip > "$RUNNER_TEMP/xi-reference.zip"
          echo "1e38471c405052105d40ab25aa48ba22ce7e103b481e0325d4412c951f975cff  $RUNNER_TEMP/xi-reference.zip" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/xi-reference" "$RUNNER_TEMP/xi-reference-dist"
          unzip -q "$RUNNER_TEMP/xi-reference.zip" -d "$RUNNER_TEMP/xi-reference"
          echo "0e02e2e796dd4850b667085fb5a746f91c9cedc4bdef259eefb89c70253d7c9b  $RUNNER_TEMP/xi-reference/dist.tgz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/xi-reference/dist.tgz" -C "$RUNNER_TEMP/xi-reference-dist"
          cp "$RUNNER_TEMP/xi-reference/source-before.txt" xi-title-clean-join/reference-source.txt
      - name: Clean production build
        run: NODE_OPTIONS="--max-old-space-size=6144" npm run build 2>&1 | tee xi-title-clean-join/build.log
      - name: Every product test script and built byte joined to completed qualification
        id: join
        env:
          XI_REFERENCE_DIR: ${{ runner.temp }}/xi-reference
          XI_REFERENCE_DIST: ${{ runner.temp }}/xi-reference-dist/dist
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import path from 'node:path';import assert from 'node:assert/strict';import {createHash} from 'node:crypto';
          const sha=bytes=>createHash('sha256').update(bytes).digest('hex');
          const gitblob=bytes=>createHash('sha1').update(Buffer.concat([Buffer.from('blob '+bytes.length+'\0'),bytes])).digest('hex');
          const readIndex=file=>new Map(fs.readFileSync(file,'utf8').trim().split('\n').map(line=>{const m=/^[0-9]+ ([0-9a-f]{40}) 0\t(.+)$/.exec(line);assert(m,'Actual source row');return [m[2],m[1]];}));
          const old=readIndex('xi-title-clean-join/reference-source.txt'),current=readIndex('xi-title-clean-join/source-before.txt');
          const excluded=new Set(['scripts/qa/playBuildXiTitleSpace.mjs']);
          assert.equal(old.get('scripts/qa/playBuildXiTitleSpace.mjs'),'e4e053a154b40e6929cee3e8bb9ee1fa5ec7ea90');
          for(const file of excluded)assert(!current.has(file),'Remote-only evidence helper absent from clean tree: '+file);
          for(const file of ['package.json','package-lock.json'])assert.equal(current.get(file),old.get(file),'Exact qualified dependency source: '+file);
          const scoped=map=>[...map].filter(([p])=>/^(?:src|public|scripts)\//.test(p)&&!excluded.has(p)).sort(([a],[b])=>a.localeCompare(b));
          const sourceRows=scoped(current);assert.deepEqual(sourceRows,scoped(old),'Every other source/public/script blob held, including exact committed generated files');
          const inventory=dir=>fs.readdirSync(dir,{withFileTypes:true}).sort((a,b)=>a.name.localeCompare(b.name)).flatMap(e=>e.isDirectory()?inventory(path.join(dir,e.name)).map(r=>({...r,path:e.name+'/'+r.path})):[{path:e.name,bytes:fs.statSync(path.join(dir,e.name)).size,sha256:sha(fs.readFileSync(path.join(dir,e.name)))}]);
          const actual=inventory('dist'),reference=inventory(process.env.XI_REFERENCE_DIST);
          assert.equal(actual.length,850);assert.deepEqual(actual,reference,'Every byte of every built file matches completed readers/caps');
          const result={status:'passed',referenceRun:42167934091,referenceApp:'98588971156dee718e392f4ea66371c656ef1b3d',referenceArtifact:13480615222,referenceZipSHA256:'1e38471c405052105d40ab25aa48ba22ce7e103b481e0325d4412c951f975cff',referenceTarSHA256:'0e02e2e796dd4850b667085fb5a746f91c9cedc4bdef259eefb89c70253d7c9b',sourceRows:sourceRows.length,remoteOnlyHelpers:[...excluded],distFiles:actual.length,distManifestSHA256:sha(JSON.stringify(actual)),dist:actual};
          fs.writeFileSync('xi-title-clean-join/reference-build-join.json',JSON.stringify(result,null,2));console.log('PASS all '+sourceRows.length+' source rows and every '+actual.length+' built file held');
          NODE
      - name: Final source locks installed versions and offline holds
        if: always()
        run: |
          git ls-files -s > xi-title-clean-join/source-after.txt
          cmp xi-title-clean-join/source-before.txt xi-title-clean-join/source-after.txt
          git diff --exit-code HEAD -- src scripts public package.json package-lock.json
          sha256sum package.json package-lock.json > xi-title-clean-join/locks-after.txt
          cmp xi-title-clean-join/locks-before.txt xi-title-clean-join/locks-after.txt
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const before=JSON.parse(fs.readFileSync('xi-title-clean-join/installed-before.json'));
          const after=before.map(([p])=>[p,JSON.parse(fs.readFileSync(p+'/package.json')).version]);assert.equal(after.length,521);assert.deepEqual(after,before);
          fs.writeFileSync('xi-title-clean-join/installed-final.json',JSON.stringify(after));
          assert(fs.existsSync('xi-title-clean-join/offline.log'));assert.equal(fs.statSync('xi-title-clean-join/offline.log').size,0);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-xi-title-clean-build-join-${{ github.run_id }}
          path: xi-title-clean-join
          retention-days: 14
          if-no-files-found: error
