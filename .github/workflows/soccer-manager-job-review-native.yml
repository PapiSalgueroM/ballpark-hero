name: Soccer manager job review browser
on:
  push:
    branches: [codex/sc-manager-job-review-native-20261028]
    paths:
      - 'src/**'
      - 'scripts/qa/playSoccerManagerJobReview.mjs'
      - '.github/workflows/soccer-manager-job-review-native.yml'
permissions:
  contents: read
concurrency:
  group: manager-job-review-native-${{ github.sha }}
  cancel-in-progress: false
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: '1'
      SIM_NETWORK: offline
      CAREER_SEASON_LOCAL_ONLY: '1'
      ENGINES: chromium
      SC_MANAGER_REVIEW_RELEASE_OUT: ${{ github.workspace }}/manager-review-native-artifacts/build
      SC_MANAGER_REVIEW_NATIVE_OUT: ${{ github.workspace }}/manager-review-native-artifacts/browser
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Exact selected source and original archive
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = codex/sc-manager-job-review-native-20261028
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p "$SC_MANAGER_REVIEW_RELEASE_OUT"
          git rev-parse HEAD HEAD^{tree} > "$SC_MANAGER_REVIEW_RELEASE_OUT/head-tree.txt"
          git archive --format=tar HEAD > "$SC_MANAGER_REVIEW_RELEASE_OUT/source.tar"
          git ls-tree -r HEAD > "$SC_MANAGER_REVIEW_RELEASE_OUT/source-tree.txt"
          git ls-files -z | sort -z | xargs -0 sha256sum > "$SC_MANAGER_REVIEW_RELEASE_OUT/tracked-before.sha256"
          printf '%s  %s\n' 8201090053775f6202b3098d59c92958ff635f0164769b3cfb82ef871bd4cd61 scripts/qa/soccerManagerJobReviewUnits.mjs | sha256sum --check
          printf '%s  %s\n' 7683dcf0c68363481fce260efe3f005ef1337de74dbbf95cf5ca2851e435d0b8 qa/sc-manager-job-review-v1/legacy-unit-identities.json.gz | sha256sum --check
          printf '%s  %s\n' 67feb2ce301abfa467998d1a1068c36bc81c9e1d12b0e6f09ce104a75d0e16b8 scripts/qa/playSoccerManagerJobReview.mjs | sha256sum --check
          echo '127.0.0.1 flawuiqbvjobmkfkauhw.supabase.co' | sudo tee -a /etc/hosts
          npm ci 2>&1 | tee "$SC_MANAGER_REVIEW_RELEASE_OUT/npm-ci.log"
      - name: Real application types
        run: |
          set -euo pipefail
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee "$SC_MANAGER_REVIEW_RELEASE_OUT/types.log"
      - name: Isolated build browser tools and retained fonts
        env:
          FREE_KICK_FONT_CACHE: ${{ github.workspace }}/manager-review-native-artifacts/build/font-cache
        run: |
          set -euo pipefail
          build_root="$RUNNER_TEMP/manager-review-build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git worktree add --detach "$build_root" HEAD
          ln -s "$GITHUB_WORKSPACE/node_modules" "$build_root/node_modules"
          echo "MANAGER_REVIEW_BUILD_ROOT=$build_root" >> "$GITHUB_ENV"
          browser_tools="$RUNNER_TEMP/manager-review-browser-tools-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$browser_tools"
          printf '{"private":true,"dependencies":{"playwright":"1.64.0"}}\n' > "$browser_tools/package.json"
          npm install --prefix "$browser_tools" --ignore-scripts --no-audit --no-fund 2>&1 | tee "$SC_MANAGER_REVIEW_RELEASE_OUT/browser-install.log"
          test ! -e node_modules/playwright
          test ! -e node_modules/playwright-core
          ln -s "$browser_tools/node_modules/playwright" node_modules/playwright
          ln -s "$browser_tools/node_modules/playwright-core" node_modules/playwright-core
          cp "$browser_tools/package.json" "$SC_MANAGER_REVIEW_RELEASE_OUT/browser-package.json"
          cp "$browser_tools/package-lock.json" "$SC_MANAGER_REVIEW_RELEASE_OUT/browser-package-lock.json"
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/manager-review-chromium-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
          node "$browser_tools/node_modules/playwright/cli.js" install --with-deps chromium 2>&1 | tee "$SC_MANAGER_REVIEW_RELEASE_OUT/chromium.log"
          python -m pip install fonttools pillow 2>&1 | tee "$SC_MANAGER_REVIEW_RELEASE_OUT/python-tools.log"
          node scripts/qa/freeKickLab1070.mjs --prefetch-fonts-only 2>&1 | tee "$SC_MANAGER_REVIEW_RELEASE_OUT/font-prefetch.log"
      - name: Actual two-route SEO build in detached tree
        env:
          PRERENDER_ONLY: /soccer-career,/whats-new
        run: |
          set -euo pipefail
          cd "$MANAGER_REVIEW_BUILD_ROOT"
          mkdir -p "$SC_MANAGER_REVIEW_RELEASE_OUT/generation"
          for route in soccer-career whats-new; do cp "public/$route/index.html" "$SC_MANAGER_REVIEW_RELEASE_OUT/generation/$route.before.html"; done
          cp scripts/data/lastmod.json "$SC_MANAGER_REVIEW_RELEASE_OUT/generation/lastmod.before.json"
          retain_generation() {
            git diff -- public scripts/data/lastmod.json > "$SC_MANAGER_REVIEW_RELEASE_OUT/generation/full.diff"
            for route in soccer-career whats-new; do cp "public/$route/index.html" "$SC_MANAGER_REVIEW_RELEASE_OUT/generation/$route.after.html" || true; done
            cp scripts/data/lastmod.json "$SC_MANAGER_REVIEW_RELEASE_OUT/generation/lastmod.after.json" || true
          }
          trap retain_generation EXIT
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" npm run build:seo 2>&1 | tee "$SC_MANAGER_REVIEW_RELEASE_OUT/build.log"
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > "$SC_MANAGER_REVIEW_RELEASE_OUT/dist.sha256"
      - name: All fifteen rebuilt-site readers
        run: |
          set -euo pipefail
          cd "$MANAGER_REVIEW_BUILD_ROOT"
          ONLY=simAdsense,simBrand,simHeadTags,simHiddenPages,simHubs,simIndexNow,simIndexing,simInternalLinks,simNoRivalNames,simPrerender,simPrerenderBoot,simRetiredRoutes,simSchema,simSitemap,simSnapshotAssets NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/runAllSims.mjs --browser 2>&1 | tee "$SC_MANAGER_REVIEW_RELEASE_OUT/readers.log"
          test "$(grep -c '^All 15 harnesses green\.$' "$SC_MANAGER_REVIEW_RELEASE_OUT/readers.log")" = 1
      - name: All fifteen unchanged fatal download caps
        run: |
          set -euo pipefail
          cd "$MANAGER_REVIEW_BUILD_ROOT"
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/lib/hostLikeServer.mjs dist 4173 > "$SC_MANAGER_REVIEW_RELEASE_OUT/weight-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in 1 2 3 4 5; do if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi; sleep 1; done
          curl --fail --silent http://127.0.0.1:4173/ > /dev/null
          BASE=http://127.0.0.1:4173 SWEEP_OFFLINE=1 NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/sweepWeight.mjs 2>&1 | tee "$SC_MANAGER_REVIEW_RELEASE_OUT/weights.log"
      - name: Nine actual route manager job move journeys
        env:
          FREE_KICK_FONT_CACHE: ${{ github.workspace }}/manager-review-native-artifacts/build/font-cache
        run: |
          set -euo pipefail
          cd "$MANAGER_REVIEW_BUILD_ROOT"
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/qa/playSoccerManagerJobReview.mjs 2>&1 | tee "$SC_MANAGER_REVIEW_RELEASE_OUT/native.log"
      - name: Exact built sources and distribution held
        if: always()
        run: |
          set -euo pipefail
          if test -n "${MANAGER_REVIEW_BUILD_ROOT:-}"; then
            git -C "$MANAGER_REVIEW_BUILD_ROOT" diff --exit-code HEAD -- src scripts qa .github/workflows docs package.json package-lock.json bun.lock index.html ':!scripts/data/lastmod.json'
            if test -f "$SC_MANAGER_REVIEW_RELEASE_OUT/dist.sha256"; then (cd "$MANAGER_REVIEW_BUILD_ROOT" && sha256sum --check "$SC_MANAGER_REVIEW_RELEASE_OUT/dist.sha256") > "$SC_MANAGER_REVIEW_RELEASE_OUT/dist-held.log"; fi
          fi
      - name: Every tracked canonical source held
        if: always()
        run: |
          set -euo pipefail
          sha256sum --check "$SC_MANAGER_REVIEW_RELEASE_OUT/tracked-before.sha256" > "$SC_MANAGER_REVIEW_RELEASE_OUT/tracked-held.log"
          git status --porcelain --untracked-files=no > "$SC_MANAGER_REVIEW_RELEASE_OUT/tracked-status.txt"
          test ! -s "$SC_MANAGER_REVIEW_RELEASE_OUT/tracked-status.txt"
          git diff --exit-code HEAD
      - name: Retain original build evidence including failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soccer-manager-review-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: manager-review-native-artifacts/
          if-no-files-found: error
          retention-days: 14
