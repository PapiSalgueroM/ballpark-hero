name: HEAD fixture WebKit observations only
on:
  push:
    branches: [codex/tennis-chain-score-ownership]
    paths: [.github/workflows/head-fixture-diagnostic.yml]
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      CI: '1'
      SIM_NETWORK: offline
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Frozen original source and isolated pinned browser
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/head-fixture-diagnostic"; test ! -e "$out"; mkdir -p "$out"
          echo "HEAD_FIXTURE_OUT=$out" >> "$GITHUB_ENV"
          git rev-parse HEAD > "$out/head.txt"; git rev-parse 'HEAD^{tree}' > "$out/tree.txt"
          git archive --format=zip HEAD > "$out/source.zip"
          git diff --exit-code HEAD; test -z "$(git status --porcelain --untracked-files=all)"
          git diff --exit-code 954daf3a86267539f426ec0b4667d09c16f32492 HEAD -- . ':!.github/workflows/head-fixture-diagnostic.yml' > "$out/source-boundary.log"
          NODE_OPTIONS='' npm ci > "$out/install.log" 2>&1
          browser_tools="$RUNNER_TEMP/head-fixture-diagnostic-browser"; test ! -e "$browser_tools"
          NODE_OPTIONS='' npm install --prefix "$browser_tools" --no-save --package-lock=false playwright@1.64.0 > "$out/browser-install.log" 2>&1
          test ! -e node_modules/playwright; test ! -e node_modules/playwright-core
          ln -s "$browser_tools/node_modules/playwright" node_modules/playwright; ln -s "$browser_tools/node_modules/playwright-core" node_modules/playwright-core
          NODE_OPTIONS='' node "$browser_tools/node_modules/playwright/cli.js" install --with-deps webkit > "$out/webkit-install.log" 2>&1
          echo "HEAD_FIXTURE_BROWSER_TOOLS=$browser_tools" >> "$GITHUB_ENV"
      - name: Thirty synthetic protocol and consumer observations
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          export SIM_OFFLINE_RECEIPT="$HEAD_FIXTURE_OUT/diagnostic.transport"
          timeout --signal=TERM --kill-after=10s 8m node --input-type=module > "$HEAD_FIXTURE_OUT/diagnostic.log" 2>&1 <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import { createHash } from 'node:crypto';
          import { createRequire } from 'node:module';
          import { execFileSync } from 'node:child_process';
          import { webkit } from './scripts/lib/playwrightLoader.mjs';
          const require = createRequire(import.meta.url), out = process.env.HEAD_FIXTURE_OUT;
          assert(require.cache[require.resolve('./scripts/lib/offlineTransport.cjs')]);
          assert(process.env.CI === '1' && process.env.SIM_NETWORK === 'offline');
          assert(out && path.isAbsolute(out) && path.relative(process.cwd(), out).split(path.sep).includes('..'));
          const hash = value => createHash('sha256').update(value).digest('hex');
          const git = args => execFileSync('git', args, { maxBuffer: 64 * 1024 * 1024 });
          const tracked = git(['ls-files', '-z']), status = git(['status', '--porcelain=v1', '--untracked-files=all']);
          const source = Object.fromEntries(tracked.toString().split('\0').filter(Boolean).map(file => [file, hash(fs.readFileSync(file))]));
          const frozen = {
            'src/components/tennis-chain/TennisChainBoard.tsx': '9ea1b5317bdb018adaa4bf95c1c62c62b72f0959faee661d277fe51077440835',
            'src/test/tennisChainScoreOwnership.test.tsx': 'ea570467ba22bc996b97d9fb235d216d6adf810337192cf75eb25e1926e6ad46',
            'scripts/simTennisChainScoreOwnership.mjs': 'adf15e24babbe4191203b84fc0d7db6407085a947d921642180496d94570cd5a',
            'scripts/qa/playTennisChainScoreOwnership.mjs': '4ed2252e15da497f7a3d7908833bbe1be9c0b532063e2a7f83a47d7514f833a3',
            '.github/workflows/tennis-chain-score-ownership.yml': 'a69b0e2d05ea70f201b884328d63365dd0f2a3aea6fd6f285bc639383c717bbd',
          };
          for (const [file, sha256] of Object.entries(frozen)) assert.equal(source[file], sha256, file + ' frozen original');
          const snapshots = () => Object.fromEntries(['node_modules', process.env.HEAD_FIXTURE_BROWSER_TOOLS + '/node_modules'].map(directory => {
            const files = execFileSync('find', [directory, '-type', 'f', '-print0'], { maxBuffer: 64 * 1024 * 1024 }).toString().split('\0').filter(Boolean).sort();
            return [directory, Object.fromEntries(files.map(file => [file, hash(fs.readFileSync(file))]))];
          }));
          const dependencies = snapshots();
          fs.writeFileSync(path.join(out, 'source-before.json'), JSON.stringify({ source, frozen }, null, 2));
          fs.writeFileSync(path.join(out, 'dependencies-before.json'), JSON.stringify(dependencies, null, 2));
          assert.equal(JSON.parse(fs.readFileSync('node_modules/playwright/package.json')).version, '1.64.0');
          const browserMetadata = JSON.parse(fs.readFileSync('node_modules/playwright-core/browsers.json')).browsers.find(row => row.name === 'webkit');
          const base = 'http://127.0.0.1:4173', cross = 'https://fixture.invalid';
          const cors = { 'access-control-allow-origin': '*', 'access-control-allow-methods': 'GET,HEAD,OPTIONS', 'access-control-allow-headers': 'prefer', 'access-control-expose-headers': 'content-range' };
          const metadata = { ...cors, 'content-type': 'application/json', 'content-range': '0-0/6' };
          const fixtures = [
            { name: 'same-origin-get', method: 'GET', url: base + '/fixture', headers: { ...metadata, 'content-length': '2' }, body: '[]' },
            { name: 'cross-origin-get', method: 'GET', url: cross + '/fixture', headers: { ...metadata, 'content-length': '2' }, body: '[]' },
            { name: 'head-zero-length', method: 'HEAD', url: cross + '/fixture', headers: { ...metadata, 'content-length': '0' }, body: '' },
            { name: 'head-get-representation-length', method: 'HEAD', url: cross + '/fixture', headers: { ...metadata, 'content-length': '2' }, body: '' },
            { name: 'head-metadata-omitted', method: 'HEAD', url: cross + '/fixture', headers: { ...cors, 'content-range': '0-0/6' }, body: '' },
          ];
          const consumers = ['headers-only-drop-response', 'retain-exact-response', 'consume-empty-text-diagnostic'];
          const specs = [1, 2].flatMap(repeat => fixtures.flatMap(fixture => consumers.map(consumer => ({ repeat, fixture, consumer, id: repeat + '-' + fixture.name + '-' + consumer }))));
          const report = { version: 1, disposition: 'OBSERVATIONS_ONLY', productQualified: false, originalQualified: false,
            scope: 'Synthetic HTTP fixture/consumer matrix only. Every document/API request locally fulfilled under the unmodified ordinary offline guard. Request failures are retained observations, never transport passes. Text reading is diagnostic only. No product or original proof qualification.',
            sourceBasis: ['https://fetch.spec.whatwg.org/#garbage-collection', 'https://raw.githubusercontent.com/supabase/supabase-js/v2.95.3/packages/core/postgrest-js/src/PostgrestBuilder.ts'],
            head: git(['rev-parse', 'HEAD']).toString().trim(), frozen, playwright: '1.64.0', engine: 'webkit', browserMetadata, expectedContexts: 30,
            census: specs.map(({ id, repeat, fixture, consumer }) => ({ id, repeat, fixture: fixture.name, consumer })), cases: [], collectionComplete: false };
          const save = () => fs.writeFileSync(path.join(out, 'observations.json'), JSON.stringify(report, null, 2));
          const wall = ms => new Promise(resolve => setTimeout(resolve, ms));
          const bounded = async (label, work, ms) => {
            let timer;
            try { return await Promise.race([Promise.resolve().then(work).then(value => ({ completed: true, value }), error => ({ completed: false, error: String(error?.stack ?? error) })),
              new Promise(resolve => { timer = setTimeout(() => resolve({ completed: false, timedOut: true, error: label + ' observation wait expired after ' + ms + 'ms' }), ms); })]); }
            finally { clearTimeout(timer); }
          };
          const prepared = async (label, work) => { const result = await bounded(label, work, 5000); assert(result.completed, result.error || label); return result.value; };
          const browser = await webkit.launch({ headless: true, timeout: 30000 }); report.browserVersion = browser.version();
          assert.equal(report.browserVersion, browserMetadata.browserVersion, 'Exact pinned WebKit metadata version');
          try {
            for (const spec of specs) {
              const row = { id: spec.id, repeat: spec.repeat, consumer: spec.consumer, fixture: { ...spec.fixture, status: 200, bodyBytes: Buffer.byteLength(spec.fixture.body), bodySha256: hash(spec.fixture.body), correspondingGetRepresentation: '[]' },
                requests: [], fulfillments: [], responses: [], terminals: [], pageErrors: [], consoleErrors: [], routeErrors: [], requestFailures: [], terminalWaitTimedOut: false };
              report.cases.push(row); save();
              const context = await prepared('browser.newContext', () => browser.newContext({ serviceWorkers: 'block', storageState: { cookies: [], origins: [] } }));
              const responseWork = [];
              try {
                await prepared('context.route', () => context.route('**/*', async route => {
                  const request = route.request(), url = request.url(), method = request.method();
                  row.requests.push({ url, method, resourceType: request.resourceType() });
                  try {
                    let options;
                    if (url === base + '/' && method === 'GET') options = { status: 200, contentType: 'text/html', body: '<!doctype html><meta charset="utf-8"><link rel="icon" href="data:,"><title>Synthetic HEAD diagnostic</title><p>Observations only</p>' };
                    else if (url === spec.fixture.url && method === 'OPTIONS') options = { status: 204, headers: cors, body: '' };
                    else { assert.equal(url, spec.fixture.url, 'Only synthetic target'); assert.equal(method, spec.fixture.method); options = { status: 200, headers: spec.fixture.headers, body: spec.fixture.body }; }
                    await prepared('route.fulfill', () => route.fulfill(options)); row.fulfillments.push({ url, method, status: options.status, headers: options.headers || null, body: options.body, bodyBytes: Buffer.byteLength(options.body) });
                  } catch (error) { row.routeErrors.push(String(error?.stack ?? error)); const abort = await bounded('route.abort', () => route.abort('failed'), 2000); if (!abort.completed) row.routeErrors.push(abort.error); }
                }));
                await prepared('context.routeWebSocket', () => context.routeWebSocket('**/*', socket => socket.close()));
                const page = await prepared('context.newPage', () => context.newPage());
                page.on('pageerror', error => row.pageErrors.push(error.message));
                page.on('console', message => { if (message.type() === 'error') row.consoleErrors.push(message.text()); });
                page.on('requestfailed', request => { const item = { url: request.url(), method: request.method(), failure: request.failure() }; row.requestFailures.push(item); if (item.url === spec.fixture.url && item.method === spec.fixture.method) row.terminals.push({ event: 'requestfailed', ...item }); });
                page.on('requestfinished', request => { if (request.url() === spec.fixture.url && request.method() === spec.fixture.method) row.terminals.push({ event: 'requestfinished', url: request.url(), method: request.method(), failure: request.failure() }); });
                page.on('response', response => {
                  if (response.url() !== spec.fixture.url || response.request().method() !== spec.fixture.method) return;
                  const receipt = { url: response.url(), method: response.request().method(), status: response.status(), headers: response.headers(), finished: null, finishError: null }; row.responses.push(receipt);
                  responseWork.push(bounded('response.finished', () => response.finished(), 3000).then(result => { receipt.finished = result.completed && result.value === null; receipt.finishError = result.error || (result.value ? String(result.value) : null); receipt.finishWaitTimedOut = !!result.timedOut; }));
                });
                await page.goto(base + '/', { timeout: 5000 });
                const app = await bounded('application observation', () => page.evaluate(async ({ url, method, consumer }) => {
                  const nativeFetch = window.fetch.bind(window); window.__retainedResponses = []; window.__nativeResponses = [];
                  if (consumer === 'retain-exact-response') window.fetch = async (...args) => { const response = await nativeFetch(...args); window.__nativeResponses.push(response); window.__retainedResponses.push(response); return response; };
                  const execute = async () => {
                    const result = { fetchResolved: false };
                    try {
                      const response = await window.fetch(url, { method, headers: { Prefer: 'count=exact' } });
                      Object.assign(result, { fetchResolved: true, status: response.status, ok: response.ok, headers: Object.fromEntries(response.headers), count: Number(response.headers.get('content-range')?.split('/')[1]),
                        bodyNull: response.body === null, bodyUsedBefore: response.bodyUsed, returnedSameNativeResponse: consumer === 'retain-exact-response' ? response === window.__nativeResponses[0] && response === window.__retainedResponses[0] : null });
                      if (consumer === 'consume-empty-text-diagnostic') { result.text = await response.text(); result.bodyUsedAfter = response.bodyUsed; }
                    } catch (error) { result.error = String(error?.stack ?? error); }
                    return result;
                  };
                  return await Promise.race([execute(), new Promise(resolve => setTimeout(() => resolve({ diagnosticAppWaitTimedOut: true }), 3000))]);
                }, { url: spec.fixture.url, method: spec.fixture.method, consumer: spec.consumer }), 5000);
                row.app = app.completed ? app.value : { driverWaitTimedOut: !!app.timedOut, error: app.error };
                for (let attempt = 0; attempt < 200 && row.terminals.length === 0; attempt++) await wall(10);
                row.terminalWaitTimedOut = row.terminals.length === 0;
                row.responseWaitTimedOut = !await Promise.race([Promise.all(responseWork).then(() => true), wall(2000).then(() => false)]);
                const retention = await bounded('retention observation', () => page.evaluate(() => ({ nativeCount: window.__nativeResponses.length, retainedCount: window.__retainedResponses.length,
                  exactIdentity: window.__nativeResponses.every((response, index) => response === window.__retainedResponses[index]), bodiesUsed: window.__retainedResponses.map(response => response.bodyUsed) })), 2000);
                row.retention = retention.completed ? retention.value : { driverWaitTimedOut: !!retention.timedOut, error: retention.error };
                row.terminalsBeforeClose = structuredClone(row.terminals); row.failuresBeforeClose = structuredClone(row.requestFailures);
                row.responsesBeforeClose = structuredClone(row.responses);
              } catch (error) { row.driverError = String(error?.stack ?? error); }
              finally { row.contextClose = await bounded('context.close', () => context.close(), 5000); row.finalResponseWait = await bounded('final response observers', () => Promise.all(responseWork), 4000); row.completeObservation = true; save(); }
            }
          } finally {
            report.browserClose = await bounded('browser.close', () => browser.close(), 10000); save();
            assert(report.browserClose.completed, 'Diagnostic browser close did not complete');
            assert(tracked.equals(git(['ls-files', '-z'])), 'Tracked membership held');
            for (const [file, sha256] of Object.entries(source)) assert.equal(hash(fs.readFileSync(file)), sha256, 'Source held: ' + file);
            assert(status.equals(git(['status', '--porcelain=v1', '--untracked-files=all'])), 'Checkout status held');
            const dependenciesAfter = snapshots(); assert.deepEqual(dependenciesAfter, dependencies, 'Installed dependencies and isolated browser tool bytes/membership held');
            fs.writeFileSync(path.join(out, 'dependencies-after.json'), JSON.stringify(dependenciesAfter, null, 2));
            fs.writeFileSync(path.join(out, 'source-after.json'), JSON.stringify({ source, frozen }, null, 2));
            report.sourceHeld = true; report.dependenciesHeld = true; save();
          }
          assert.deepEqual(report.cases.map(row => row.id), report.census.map(row => row.id));
          assert(report.cases.every(row => row.completeObservation && !row.driverError && row.routeErrors.length === 0 && row.app
            && row.fulfillments.filter(item => item.url === row.fixture.url && item.method === row.fixture.method && item.status === 200).length === 1), 'Every diagnostic context reached its exact synthetic fixture; request failures remain observations');
          report.transportReceipt = fs.existsSync(process.env.SIM_OFFLINE_RECEIPT) ? fs.readFileSync(process.env.SIM_OFFLINE_RECEIPT, 'utf8') : '';
          report.collectionComplete = true; save();
          console.log('OBSERVATIONS_ONLY:30 synthetic contexts collected. No product/original qualification or request-failure allowance.');
          console.log(JSON.stringify(report.cases.map(row => ({ id: row.id, app: row.app, terminalsBeforeClose: row.terminalsBeforeClose, requestFailures: row.requestFailures, routeErrors: row.routeErrors, driverError: row.driverError }))));
          NODE
          cat "$HEAD_FIXTURE_OUT/diagnostic.log"
      - name: Retain observations and raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: head-fixture-webkit-observations-${{ github.sha }}
          path: ${{ env.HEAD_FIXTURE_OUT }}/
          if-no-files-found: error
          retention-days: 14
