name: Sixth master-list build and unchanged budgets
on:
  push:
    branches: [codex/master-list-sixth-build-20261104]
permissions:
  contents: read
  actions: read
concurrency:
  group: master-list-sixth-build-${{ github.ref }}
  cancel-in-progress: false
env:
  CI: '1'
  SIM_NETWORK: offline
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ENGINES: chromium
      SEO_SPLIT_BASE_REF: HEAD
      SWEEP_OFFLINE: '1'
      PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Hold the exact top-games feature source
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/master-list-sixth-build"
          mkdir -p "$OUT/logs" "$OUT/units" "$OUT/raw" "$OUT/transport"
          echo "QA_OUT=$OUT" >> "$GITHUB_ENV"
          git rev-parse HEAD HEAD^{tree} > "$OUT/source.txt"
          test "$(git rev-parse HEAD^)" = c0bbbe0ef4a46dd9acefd6ae6ea46ffcac80d6ac
          test "$(git rev-parse HEAD^^{tree})" = 1c9547c724f737c92e4bce029226b349bf504b69
          test "$(git diff --name-status HEAD^ HEAD)" = $'A\t.github/workflows/master-list-sixth-build-20261104.yml'
          git diff --name-status a4d6eaa2cb0d57b8bcbb301fd35f757b60bf0a41 HEAD > "$OUT/changed-paths.txt"
          git ls-files -z | sort -z | xargs -0 sha256sum > "$OUT/source-before.sha256"
          cp .github/workflows/master-list-sixth-build-20261104.yml "$OUT/workflow.yml"
          git status --porcelain=v1 --untracked-files=all > "$OUT/status-before.txt"
          test ! -s "$OUT/status-before.txt"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Install held application and existing QA tools
        run: |
          set -euo pipefail
          bun --version | tee "$QA_OUT/logs/bun-version.log"
          bun install --frozen-lockfile 2>&1 | tee "$QA_OUT/logs/bun-install.log"
          node -p "JSON.stringify({router:require('react-router-dom/package.json').version,vite:require('vite/package.json').version,rollup:JSON.parse(require('fs').readFileSync('node_modules/rollup/package.json','utf8')).version})" > "$QA_OUT/logs/build-versions.json"
          git diff --exit-code -- package.json package-lock.json
          npm install --prefix "$RUNNER_TEMP/popular-games-tools" --package-lock=false --no-audit --no-fund playwright@1.64.0 2>&1 | tee "$QA_OUT/logs/playwright-install.log"
          test ! -e node_modules/playwright
          test ! -e node_modules/playwright-core
          ln -s "$RUNNER_TEMP/popular-games-tools/node_modules/playwright" node_modules/playwright
          ln -s "$RUNNER_TEMP/popular-games-tools/node_modules/playwright-core" node_modules/playwright-core
          "$RUNNER_TEMP/popular-games-tools/node_modules/.bin/playwright" install --with-deps chromium 2>&1 | tee "$QA_OUT/logs/chromium-install.log"
          python3 -m pip install --target "$RUNNER_TEMP/popular-games-python" fonttools pillow 2>&1 | tee "$QA_OUT/logs/python-install.log"
          echo "PYTHONPATH=$RUNNER_TEMP/popular-games-python" >> "$GITHUB_ENV"
      - name: Proper joined application types
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$GITHUB_WORKSPACE/scripts/lib/offlineTransport.cjs"
          : > "$QA_OUT/transport/types.log"
          SIM_OFFLINE_RECEIPT="$QA_OUT/transport/types.log" node_modules/.bin/tsc --noEmit -p tsconfig.app.json > "$QA_OUT/logs/types.log" 2>&1
          test ! -s "$QA_OUT/transport/types.log"
      - name: Existing save and home guards, normal build, twenty readers and all unchanged page caps
        timeout-minutes: 25
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$GITHUB_WORKSPACE/scripts/lib/offlineTransport.cjs"
          classify_receipt() {
            local name="$1" receipt="$2"
            local allowed='^\[SIM_OFFLINE_BLOCK\] external browser route continue https://fonts\.(googleapis|gstatic)\.com$'
            if [[ "$name" == sweep-weight ]]; then
              allowed="$allowed|^\[SIM_OFFLINE_BLOCK\] external browser route continue https://flagcdn\.com$"
            elif [[ "$name" != build ]]; then
              if [[ -s "$receipt" ]]; then cat "$receipt"; return 1; fi
              return 0
            fi
            local status=0
            grep -Ev "$allowed" "$receipt" || status=$?
            if [[ "$status" == 1 ]]; then return 0; fi
            return 1
          }
          run_gate() {
            local name="$1"
            shift
            local receipt="$QA_OUT/transport/$name.log"
            : > "$receipt"
            SIM_OFFLINE_RECEIPT="$receipt" "$@" 2>&1 | tee "$QA_OUT/logs/$name.log"
            if ! classify_receipt "$name" "$receipt"; then
              echo "Unexpected blocked transport in $name" >&2
              return 1
            fi
            # Every refusal is retained and counted, never credited as zero transport.
            if [[ -s "$receipt" ]]; then
              wc -l "$receipt" | tee "$QA_OUT/logs/$name-blocked-attempts.txt"
            fi
          }
          run_gate simSaveKeeper node scripts/simSaveKeeper.mjs
          run_gate simHomeFront node scripts/simHomeFront.mjs
          grep -F '7) Continue playing:' "$QA_OUT/logs/simHomeFront.log"
          run_gate simSoccerCareerRecords node scripts/simSoccerCareerRecords.mjs
          run_gate build npm run build
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > "$QA_OUT/dist-before.sha256"
          tar -czf "$QA_OUT/completed-dist.tar.gz" dist
          sha256sum "$QA_OUT/completed-dist.tar.gz" > "$QA_OUT/completed-dist.tar.gz.sha256"
          tar -tzf "$QA_OUT/completed-dist.tar.gz" > "$QA_OUT/completed-dist-members.txt"
          export BASE=http://127.0.0.1:4173
          export SWEEP_BASE="$BASE"
          export SWEEP_OFFLINE=1
          export SIM_OFFLINE_RECEIPT="$QA_OUT/transport/server.log"
          : > "$SIM_OFFLINE_RECEIPT"
          node scripts/lib/hostLikeServer.mjs dist 4173 > "$QA_OUT/logs/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 40); do
            if curl --fail --silent "$BASE/" > /dev/null; then ready=1; break; fi
            kill -0 "$server_pid"
            sleep 1
          done
          test "$ready" = 1
          run_gate sweep-weight node scripts/sweepWeight.mjs
          readers=(
            simAdsense simBrand simHeadTags simHiddenPages simHubs
            simIndexNow simIndexing simInternalLinks simNoRivalNames simPrerender
            simPrerenderBoot simRetiredRoutes simSchema simSitemap simSnapshotAssets
            simSiteSearch simGuideHeadings simHarnessAnchors
          )
          for reader in "${readers[@]}"; do
            run_gate "$reader" node "scripts/$reader.mjs"
          done
          run_gate simSeoTitles node scripts/simSeoTitles.mjs
          run_gate simSeoMetaSplit env SEO_SPLIT_ONLY=/soccer-career node scripts/simSeoMetaSplit.mjs
          test ! -s "$QA_OUT/transport/server.log"
      - name: Source-held CM6 and FO3 native journeys on this completed build
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$GITHUB_WORKSPACE/scripts/lib/offlineTransport.cjs"
          for script in cmReplacementFixtures cmReplacementBrowser cmReplacementScrollControl foMarketAccessFixtures foMarketAccessBrowser foMarketAccessScrollControl nativeScrollReady; do node --check "scripts/qa/$script.mjs"; done
          : > "$QA_OUT/transport/cm-fixtures.log"
          SIM_OFFLINE_RECEIPT="$QA_OUT/transport/cm-fixtures.log" node scripts/qa/cmReplacementFixtures.mjs --out "$QA_OUT/cm-fixtures" --dist dist --core c0bbbe0ef4a46dd9acefd6ae6ea46ffcac80d6ac > "$QA_OUT/logs/cm-fixtures.log" 2>&1
          test ! -s "$QA_OUT/transport/cm-fixtures.log"
          : > "$QA_OUT/transport/fo-fixtures.log"
          SIM_OFFLINE_RECEIPT="$QA_OUT/transport/fo-fixtures.log" node scripts/qa/foMarketAccessFixtures.mjs --out "$QA_OUT/fo-fixtures" --dist dist --core c0bbbe0ef4a46dd9acefd6ae6ea46ffcac80d6ac > "$QA_OUT/logs/fo-fixtures.log" 2>&1
          test ! -s "$QA_OUT/transport/fo-fixtures.log"
          : > "$QA_OUT/transport/native-server.log"
          SIM_OFFLINE_RECEIPT="$QA_OUT/transport/native-server.log" node scripts/lib/hostLikeServer.mjs dist 4174 > "$QA_OUT/logs/native-server.log" 2>&1 &
          native_pid=$!
          trap 'kill "$native_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 40); do if curl --fail --silent http://127.0.0.1:4174/ > /dev/null; then ready=1; break; fi; kill -0 "$native_pid"; sleep 1; done
          test "$ready" = 1
          : > "$QA_OUT/transport/cm-scroll-control.log"
          set +e
          SIM_OFFLINE_RECEIPT="$QA_OUT/transport/cm-scroll-control.log" node scripts/qa/cmReplacementScrollControl.mjs --out "$QA_OUT/cm-scroll-control" --fixtures "$QA_OUT/cm-fixtures" --dist dist --base-url http://127.0.0.1:4174 > "$QA_OUT/logs/cm-scroll-control.log" 2>&1
          cm_control_status=$?
          set -e
          echo "$cm_control_status" > "$QA_OUT/cm-scroll-control-native-exit.txt"
          test "$cm_control_status" = 1
          test ! -s "$QA_OUT/transport/cm-scroll-control.log"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const m=JSON.parse(fs.readFileSync(process.env.QA_OUT+'/cm-scroll-control/report.json'));assert.equal(m.status,'owned-fault-qualified');assert.equal(m.observed.qualified,true);assert.equal(m.sourceHeld,true);assert.equal(m.distHeld,true);assert.equal(m.fixtureManifestHeld,true);assert.equal(m.engineBundleHeld,true);
          NODE
          : > "$QA_OUT/transport/fo-scroll-control.log"
          SIM_OFFLINE_RECEIPT="$QA_OUT/transport/fo-scroll-control.log" node scripts/qa/foMarketAccessScrollControl.mjs --out "$QA_OUT/fo-scroll-control" --fixtures "$QA_OUT/fo-fixtures" --dist dist --base-url http://127.0.0.1:4174 > "$QA_OUT/logs/fo-scroll-control.log" 2>&1
          test ! -s "$QA_OUT/transport/fo-scroll-control.log"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const m=JSON.parse(fs.readFileSync(process.env.QA_OUT+'/fo-scroll-control/control-report.json'));assert.equal(m.status,'admitted');assert.equal(m.owned.actualVerticalPixels,10);assert.equal(m.owned.trustedClicks,1);assert.equal(m.owned.completeSignedBytesEqual,true);assert.equal(m.sourceHeld,true);assert.equal(m.distHeld,true);assert.equal(m.normalHeld,true);
          NODE
          : > "$QA_OUT/transport/cm-native.log"
          SIM_OFFLINE_RECEIPT="$QA_OUT/transport/cm-native.log" node scripts/qa/cmReplacementBrowser.mjs --out "$QA_OUT/cm-native" --fixtures "$QA_OUT/cm-fixtures" --dist dist --base-url http://127.0.0.1:4174 > "$QA_OUT/logs/cm-native.log" 2>&1
          test ! -s "$QA_OUT/transport/cm-native.log"
          : > "$QA_OUT/transport/fo-native.log"
          SIM_OFFLINE_RECEIPT="$QA_OUT/transport/fo-native.log" node scripts/qa/foMarketAccessBrowser.mjs --out "$QA_OUT/fo-native" --fixtures "$QA_OUT/fo-fixtures" --dist dist --base-url http://127.0.0.1:4174 > "$QA_OUT/logs/fo-native.log" 2>&1
          test ! -s "$QA_OUT/transport/fo-native.log"
          test ! -s "$QA_OUT/transport/native-server.log"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const out=process.env.QA_OUT,rows=[['cm-native',6],['fo-native',3]].map(([name,count])=>{const r=JSON.parse(fs.readFileSync(out+'/'+name+'/report.json'));assert.equal(r.status,'passed');assert.equal(r.contexts.length,count);assert(r.contexts.every(x=>x.status==='passed'));assert.equal(r.screenshots.length,count);assert.equal(r.sourceHeld,true);assert.equal(r.distHeld,true);return{name,contexts:count,photos:r.screenshots.length};});fs.writeFileSync(out+'/native-admission.json',JSON.stringify({status:'passed',rows,contexts:9,photos:9,controlsAdmittedBeforeNormal:true,scope:'Six CM and three FO controlled fixture journeys on one completed normal Bun build. No natural-career or full-fleet claim.'},null,2)+'\n');
          NODE
      - name: Retain full source holds and transport evidence
        if: always()
        run: |
          set -euo pipefail
          test -n "$QA_OUT"
          dist_hold=0
          if [[ -f "$QA_OUT/dist-before.sha256" ]]; then
            find dist -type f -print0 | sort -z | xargs -0 sha256sum > "$QA_OUT/dist-after.sha256"
            cmp "$QA_OUT/dist-before.sha256" "$QA_OUT/dist-after.sha256" || dist_hold=$?
            sha256sum --check "$QA_OUT/dist-before.sha256" > "$QA_OUT/dist-held.log" || dist_hold=$?
          else
            echo "No completed-build inventory exists. No dist hold credit." > "$QA_OUT/dist-hold-unknown.txt"
          fi
          git diff --exit-code HEAD > "$QA_OUT/source-diff.txt"
          git status --porcelain=v1 --untracked-files=all > "$QA_OUT/status-after.txt"
          cmp "$QA_OUT/status-before.txt" "$QA_OUT/status-after.txt"
          git ls-files -z | sort -z | xargs -0 sha256sum > "$QA_OUT/source-after.sha256"
          if [[ -f "$QA_OUT/source-before.sha256" ]]; then
            cmp "$QA_OUT/source-before.sha256" "$QA_OUT/source-after.sha256"
            sha256sum --check "$QA_OUT/source-before.sha256" > "$QA_OUT/source-held.log"
          else
            echo "No qualified before inventory was produced." > "$QA_OUT/source-hold-unknown.txt"
            exit 1
          fi
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const out=process.env.QA_OUT;
          const rows=fs.existsSync(out+'/transport')?fs.readdirSync(out+'/transport').sort().map(file=>{
            const text=fs.readFileSync(out+'/transport/'+file,'utf8'),lines=text.split('\n').filter(Boolean);
            return {file,blockedAttempts:lines.length,
              fontBlockedAttempts:lines.filter(line=>/^\[SIM_OFFLINE_BLOCK\] external browser route continue https:\/\/fonts\.(googleapis|gstatic)\.com$/.test(line)).length,
              flagBlockedAttempts:lines.filter(line=>line==='[SIM_OFFLINE_BLOCK] external browser route continue https://flagcdn.com').length};
          }):[];
          fs.writeFileSync(out+'/transport-summary.json',JSON.stringify({
            receipts:rows,meaning:'Blocked attempts are retained. Empty Node receipts are not a browser or provider availability claim.'
          },null,2)+'\n');
          NODE
          test "$dist_hold" -eq 0
      - name: Bound retained focused evidence
        id: artifact
        if: always()
        run: |
          set -euo pipefail
          test -d "$QA_OUT"
          test "$(du -sb "$QA_OUT" | cut -f1)" -lt 150000000
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.artifact.outputs.ready == 'true' }}
        with:
          name: master-list-sixth-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/master-list-sixth-build
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
