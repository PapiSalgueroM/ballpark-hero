            sha256sum -c "$out/source-before.sha256" > "$out/final-source-hold.log" 2>&1 || failed=1
            git ls-files -z | sort -z > "$out/source-members.after"
            cmp "$out/source-members.before" "$out/source-members.after" > "$out/final-source-members.log" 2>&1 || failed=1
            xargs -0 sha256sum < "$out/source-members.after" > "$out/source-after.sha256" || failed=1
            cmp "$out/source-before.sha256" "$out/source-after.sha256" > "$out/final-source-sha.log" 2>&1 || failed=1
          else failed=1; fi
          if test -f "$out/dependencies.sha256"; then
            sha256sum -c "$out/dependencies.sha256" > "$out/final-dependencies-hold.log" 2>&1 || failed=1
            find node_modules -path node_modules/.vite -prune -o -type f -print0 | sort -z > "$out/dependency-members.after"
            cmp "$out/dependency-members.before" "$out/dependency-members.after" > "$out/final-dependency-members.log" 2>&1 || failed=1
            xargs -0 sha256sum < "$out/dependency-members.after" > "$out/dependencies-end.sha256" || failed=1
            cmp "$out/dependencies.sha256" "$out/dependencies-end.sha256" > "$out/final-dependency-sha.log" 2>&1 || failed=1
          else failed=1; fi
          git rev-parse HEAD > "$out/head-after.txt" || failed=1
          test "$(cat "$out/head-after.txt")" = "$GITHUB_SHA" || failed=1
          git diff --exit-code > "$out/final-source-diff.log" 2>&1 || failed=1
          git status --porcelain --untracked-files=all > "$out/final-status.txt" || failed=1
          test ! -s "$out/final-status.txt" || failed=1
          for name in source capture-before league capture-after holds; do
            test -f "$out/$name.transport" && test ! -s "$out/$name.transport" || failed=1
          done
          if test -f "$out/diagnostic-capture.json"; then
            NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$out/holds.transport" node <<'NODE' > "$out/final-capture-binding.log" 2>&1 || failed=1
          const fs=require('node:fs'),a=require('node:assert/strict'),{createHash}=require('node:crypto'),out=process.env.LEAGUE_CAPTURE_OUT,hash=b=>createHash('sha256').update(b).digest('hex'),c=JSON.parse(fs.readFileSync(out+'/diagnostic-capture.json'));
          a.equal(c.source,process.env.GITHUB_SHA);a.equal(c.parent,process.env.EXPECTED_PARENT);a(/^\d+$/.test(c.actualExit),'ACTUAL_CHILD_EXIT_RETAINED');
          a.equal(c.defaultsHeld,true);a.equal(c.reportInventory.errors.length,0);
          for(const name of ['tee-stdout.exit','tee-stderr.exit'])a.equal(fs.readFileSync(out+'/'+name,'utf8').trim(),'0','RAW_AND_CONSOLE_CAPTURE_COMPLETE');
          for(const [name,row] of [['league.stdout.log',c.stdout],['league.stderr.log',c.stderr]]){const b=fs.readFileSync(out+'/'+name);a.equal(b.length,row.bytes);a.equal(hash(b),row.sha256);}
          for(const row of c.reportInventory.rows.filter(row=>row.type==='file')){const b=fs.readFileSync(out+'/'+row.evidencePath);a.equal(b.length,row.bytes);a.equal(hash(b),row.sha256);}
          NODE
          else failed=1; fi
          printf '%s\n' "$failed" > "$out/final-holds.exit"
          test "$failed" -eq 0
      - name: Always record scoped stages and manifest
        if: ${{ always() }}
        env:
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          DEPENDENCY_OUTCOME: ${{ steps.dependencies.outcome }}
          PREPARE_OUTCOME: ${{ steps.prepare.outcome }}
          LEAGUE_STEP_OUTCOME: ${{ steps.league.outcome }}
          CAPTURE_OUTCOME: ${{ steps.capture.outcome }}
          HOLDS_OUTCOME: ${{ steps.holds.outcome }}
        run: |
          set -euo pipefail
          out="$LEAGUE_CAPTURE_OUT"
          printf '%s\n' "phase=league-failure-capture-diagnostic-only" "source=$GITHUB_SHA" "sourceGate=$SOURCE_OUTCOME" "dependencies=$DEPENDENCY_OUTCOME" "prepare=$PREPARE_OUTCOME" "leagueCaptureStep=$LEAGUE_STEP_OUTCOME" "partialCapture=$CAPTURE_OUTCOME" "endHolds=$HOLDS_OUTCOME" "wholeSuiteReplayed=false" "harnessHealthyCredit=false" "applicationQualified=false" > "$out/stages.txt"
          (cd "$out" && find . -type f ! -name evidence.sha256 -print0 | sort -z | xargs -0 sha256sum > evidence.sha256)
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: menu-league-failure-capture-${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ env.LEAGUE_CAPTURE_OUT }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
