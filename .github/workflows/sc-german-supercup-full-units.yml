          const knownDiagnostics={"count":7,"identitySha256":"cc27a7444f82da970ec8229225021533bd6ca19fc42c89f295e51211f51de7b2","pressRejectedImportHeaders":6,"resetPasswordTeardownHeaders":1,"records":[{"file":"src/test/soccerPressRoomFailure.test.tsx","context":"stderr | src/test/soccerPressRoomFailure.test.tsx > Soccer Career optional press-room import isolation > a rejected press-room import keeps the career and its pending save mounted","header":"Error: Uncaught [Error: [vitest] There was an error when mocking a module. If you are using \"vi.mock\" factory, make sure there are no top level variables inside, since this call is hoisted to top of the file. Read more: https://vitest.dev/api/vi.html#vi-mock]"},{"file":"src/test/soccerPressRoomFailure.test.tsx","context":"stderr | src/test/soccerPressRoomFailure.test.tsx > Soccer Career optional press-room import isolation > a rejected press-room import keeps the career and its pending save mounted","header":"Error: Uncaught [Error: [vitest] There was an error when mocking a module. If you are using \"vi.mock\" factory, make sure there are no top level variables inside, since this call is hoisted to top of the file. Read more: https://vitest.dev/api/vi.html#vi-mock]"},{"file":"src/test/soccerPressRoomFailure.test.tsx","context":"stderr | src/test/soccerPressRoomFailure.test.tsx > Soccer Career optional press-room import isolation > closing and reopening the failed press room preserves the career save and focus","header":"Error: Uncaught [Error: [vitest] There was an error when mocking a module. If you are using \"vi.mock\" factory, make sure there are no top level variables inside, since this call is hoisted to top of the file. Read more: https://vitest.dev/api/vi.html#vi-mock]"},{"file":"src/test/soccerPressRoomFailure.test.tsx","context":"stderr | src/test/soccerPressRoomFailure.test.tsx > Soccer Career optional press-room import isolation > closing and reopening the failed press room preserves the career save and 