          const stderr=fs.readFileSync(out+'/all-units.stderr','utf8'),diagnosticRecords=[];
          let context='';
          for(const line of stderr.split(/\r?\n/)){
            const clean=line.replace(/\x1b\[[0-9;]*m/g,'');
            if(clean.startsWith('stderr | src/test/'))context=clean;
