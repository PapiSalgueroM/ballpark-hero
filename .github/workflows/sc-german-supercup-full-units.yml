      - name: Always hold all source dependencies and membership
        if: always()
        run: |
          set -euo pipefail
          if test -f "$OUT/source.sha256"; then sha256sum --check "$OUT/source.sha256" > "$OUT/source-held.log"; fi
          if test -f "$OUT/dependency-files.sha256"; then
            sha256sum --check "$OUT/dependency-files.sha256" > "$OUT/dependency-held.log"
            find node_modules -path node_modules/.vite -prune -o -type f -print0 | sort -z > "$OUT/dependency-members.after"
            cmp "$OUT/dependency-members.before" "$OUT/dependency-members.after"
          fi
          git ls-files -z > "$OUT/source-members.after"
          cmp "$OUT/source-members.before" "$OUT/source-members.after"
          test "$(tr '\0' '\n' < "$OUT/source-members.after" | wc -l)" -eq 5672
          git diff --exit-code HEAD > "$OUT/source-diff.log"
          git ls-files --others --exclude-standard > "$OUT/untracked.txt"
          test ! -s "$OUT/untracked.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sc-german-supercup-full-units-${{ github.run_id }}
          path: ${{ runner.temp }}/sc-german-supercup-full-units/
          retention-days: 14
