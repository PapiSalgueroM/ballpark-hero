              same(edit, { from: block(props.original), to: block(props.current) }); assert.equal(before.toString('utf8').split(edit.from).length - 1, 1); assert.equal(text.split(edit.to).length - 1, 1); assert.equal(before.toString('utf8').replace(edit.from, edit.to), text); assert.equal(text.replace(edit.to, edit.from), before.toString('utf8'));
            });
            check('fixture-core-and-compiled-provenance', () => {
              const fixture = json(report.fixture), selected = fixture.saves.filter(row => row.id === 'ere'); assert.equal(selected.length, 1); assert.equal(selected[0].state.phase, 'playing'); assert.equal(selected[0].state.primeType, 'late'); const input = json(report.input), edits = json(report.boundaryEdits), expected = JSON.parse(JSON.stringify(selected[0].state));
              same(edits, ['retired', 'phase'].map(key => ({ key, existed: Object.hasOwn(expected, key), before: Object.hasOwn(expected, key) ? expected[key] : null, after: key === 'retired' ? true : 'retired' }))); expected.retired = true; expected.phase = 'retired'; same(input, expected);
              const model = json(report.model); assert.equal(model.valid, true); assert.equal(model.before, JSON.stringify(input)); assert.equal(model.inputAfter, model.output); same(model.draws, []); assert.equal(JSON.parse(model.output).phase, 'retired'); assert.equal(JSON.parse(model.output).retired, true);
              const oracle = report.oracleSource, meta = json(oracle.metafile), entry = bytes(oracle.entry), code = bytes(oracle.code); same(Object.keys(meta.outputs), ['stdin.js']); assert.equal(meta.outputs['stdin.js'].entryPoint, 'new-career-oracle.ts'); assert.equal(meta.outputs['stdin.js'].bytes, code.length); assert.equal(oracle.code.bytes, code.length);
              assert.equal(entry.toString('utf8'), "export {repairCareer} from './src/lib/soccerCareerEngine';export {isSoccerCareerSave} from './src/lib/soccerCareerSave';export {buttonVariants} from './src/components/ui/button';export {cn} from './src/lib/utils';"); same(oracle.inputs.map(row => row.file).sort(), Object.keys(meta.inputs).sort()); assert.equal(new Set(oracle.inputs.map(row => row.file)).size, oracle.inputs.length);
              for (const row of oracle.inputs) { const descriptor = meta.inputs[row.file]; assert(descriptor); if (row.file === '<define:import.meta.env>') { keys(row, ['file', 'synthetic', 'kind', 'metafileInput', 'declaredDefine', 'scope']); assert.equal(row.synthetic, true); assert.equal(row.kind, 'esbuild-define'); same(descriptor, { bytes: 0, imports: [] }); same(row.metafileInput, descriptor); keys(row.declaredDefine, ['name', 'expression']); keys(row.declaredDefine.expression, ['path', 'bytes', 'sha256']); assert.equal(row.declaredDefine.name, 'import.meta.env'); assert.equal(bytes(row.declaredDefine.expression).toString('utf8'), '{"DEV":false,"PROD":true,"MODE":"production"}'); assert.equal(row.scope, 'Declared expression and actual descriptor, not generated virtual-file bytes.'); }
                else if (row.file === 'new-career-oracle.ts') { keys(row, ['file', 'synthetic', 'path', 'bytes', 'sha256']); assert.equal(row.synthetic, true); assert(bytes(row).equals(entry)); assert.equal(descriptor.bytes, entry.length); }
                else { keys(row, ['file', 'path', 'bytes', 'sha256']); assert(!row.file.startsWith('<')); const full = path.resolve(ROOT, row.file); assert(full.startsWith(`${ROOT}${path.sep}`)); const body = bytes(row); assert(body.equals(fs.readFileSync(full))); assert.equal(descriptor.bytes, body.length); if (!row.file.startsWith('node_modules/')) { const base = execFileSync('git', ['cat-file', 'blob', `${HEAD}:${row.file}`], { cwd: ROOT, maxBuffer: 2000000 }); assert.equal(body.toString('utf8').replaceAll('\r\n', '\n'), base.toString('utf8')); } }
              }
              for (const required of ['src/lib/soccerCareerEngine.ts', 'src/lib/soccerCareerSave.ts', 'src/components/ui/button.tsx', 'src/lib/utils.ts']) assert(oracle.inputs.some(row => row.file === required));
            });
            const model = json(report.model), expectedModel = model.output;
