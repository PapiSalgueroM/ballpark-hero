name: Soccer New Career confirmation phone layout
on:
  push:
    branches: [codex/career-confirmation-phone-layout]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      SIM_NETWORK: offline
      ENGINES: chromium
      VITEST_MAX_FORKS: 1
      VITEST_MIN_FORKS: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retain source and capture commands
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = codex/career-confirmation-phone-layout
          mkdir career-confirmation-artifacts
          git cat-file -e 4a5f759aeab6d0e7b8d29e55d3cd624c8ad20c54^{commit}
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse '4a5f759aeab6d0e7b8d29e55d3cd624c8ad20c54^{tree}')" = 8f8078136ba98fc07c944553aeaa53c307a68554
          git -c core.autocrlf=false archive --format=zip HEAD > career-confirmation-artifacts/source.zip
          git -c core.autocrlf=false archive --format=zip 4a5f759aeab6d0e7b8d29e55d3cd624c8ad20c54 > career-confirmation-artifacts/base.zip
          git ls-tree -r HEAD > career-confirmation-artifacts/source-inventory.txt
          git ls-tree -r 4a5f759aeab6d0e7b8d29e55d3cd624c8ad20c54 > career-confirmation-artifacts/base-inventory.txt
          sha256sum career-confirmation-artifacts/source.zip career-confirmation-artifacts/base.zip > career-confirmation-artifacts/source-archives.sha256
          node --input-type=module <<'SCOPE'
          import fs from 'node:fs';import assert from 'node:assert/strict';import {execFileSync} from 'node:child_process';
          const base='4a5f759aeab6d0e7b8d29e55d3cd624c8ad20c54',allowed=['src/pages/SoccerCareer.tsx','scripts/qa/soccerNewCareerDialogBrowser.mjs','.github/workflows/career-confirmation-phone-layout.yml','docs/CAREER-CONFIRMATION-PHONE-LAYOUT.md'];
          const changed=execFileSync('git',['diff','--name-only','-z',base,'HEAD']).toString().split('\0').filter(Boolean);
          fs.writeFileSync('career-confirmation-artifacts/source-scope.json',JSON.stringify({base,allowed,changed},null,2));assert.deepEqual([...changed].sort(),[...allowed].sort());
          SCOPE
          git rev-parse HEAD HEAD^{tree} > career-confirmation-artifacts/head-tree.txt
          cp package.json career-confirmation-artifacts/package.before.json
          cp package-lock.json career-confirmation-artifacts/package-lock.before.json
          sha256sum src/pages/SoccerCareer.tsx scripts/qa/soccerNewCareerDialogBrowser.mjs .github/workflows/career-confirmation-phone-layout.yml docs/CAREER-CONFIRMATION-PHONE-LAYOUT.md scripts/qa/soccerAgentReviewDependencies.mjs > career-confirmation-artifacts/source-hold.sha256
          cat > career-confirmation-artifacts/capture.sh <<'CAPTURE'
          capture() {
            local label="$1"; shift
            printf '%s\0' "$@" > "career-confirmation-artifacts/$label.argv"
            set +e
            "$@" > "career-confirmation-artifacts/$label.stdout" 2> "career-confirmation-artifacts/$label.stderr"
            local code=$?
            set -e
            echo "$code" > "career-confirmation-artifacts/$label.exit"
            cat "career-confirmation-artifacts/$label.stdout"
            cat "career-confirmation-artifacts/$label.stderr" >&2
            return "$code"
          }
          CAPTURE
      - name: Install remote verification dependencies
        id: dependencies
        run: |
          set -euo pipefail
          source career-confirmation-artifacts/capture.sh
          capture npm-ci npm ci
          capture locked-before node scripts/qa/soccerAgentReviewDependencies.mjs before
          cp soccer-agent-review-artifacts/dependencies-before.json career-confirmation-artifacts/dependencies-before.json
          browser_tools="$RUNNER_TEMP/new-career-dialog-browser-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$browser_tools"
          printf '{"private":true,"dependencies":{"playwright":"1.64.0"}}\n' > "$browser_tools/package.json"
          capture playwright-package npm install --prefix "$browser_tools" --ignore-scripts --no-audit --no-fund
          test ! -e node_modules/playwright
          test ! -e node_modules/playwright-core
          ln -s "$browser_tools/node_modules/playwright" node_modules/playwright
          ln -s "$browser_tools/node_modules/playwright-core" node_modules/playwright-core
          cp "$browser_tools/package.json" career-confirmation-artifacts/browser-package.json
          cp "$browser_tools/package-lock.json" career-confirmation-artifacts/browser-package-lock.json
          capture chromium node "$browser_tools/node_modules/playwright/cli.js" install --with-deps chromium
          capture locked-after-setup node scripts/qa/soccerAgentReviewDependencies.mjs after
          cp soccer-agent-review-artifacts/dependencies-after.json career-confirmation-artifacts/dependencies-after-setup.json
          node --input-type=module <<'PLAYWRIGHT'
          import fs from 'node:fs';import assert from 'node:assert/strict';for(const name of ['playwright','playwright-core'])assert.equal(JSON.parse(fs.readFileSync('node_modules/'+name+'/package.json')).version,'1.64.0');
          PLAYWRIGHT
          capture fonts python -m pip install fonttools pillow
          cmp package.json career-confirmation-artifacts/package.before.json
          cmp package-lock.json career-confirmation-artifacts/package-lock.before.json
      - name: Actual application type gate
        id: types
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          set -euo pipefail
          source career-confirmation-artifacts/capture.sh
          capture types node_modules/.bin/tsc --noEmit -p tsconfig.app.json
      # This is a layout change. The focused built-page proof checks actual controls and labels.
      - name: Full production SEO build
        id: build
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.types.outcome == 'success' }}
        run: |
          set -euo pipefail
          source career-confirmation-artifacts/capture.sh
          capture build npm run build:seo
      - name: Actual New Career dialog fit and safe Cancel reads
        id: browser
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          source career-confirmation-artifacts/capture.sh
          server_pid=''
          close_server() { if test -n "$server_pid"; then kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true; fi; }
          trap close_server EXIT
          node scripts/lib/hostLikeServer.mjs dist 4173 > career-confirmation-artifacts/browser-server.stdout 2> career-confirmation-artifacts/browser-server.stderr &
          server_pid=$!
          capture browser-server-ready node --input-type=module -e 'for(let i=0;i<100;i++){try{const r=await fetch("http://127.0.0.1:4173/");if(r.ok)process.exit(0);}catch{}await new Promise(r=>setTimeout(r,100));}process.exit(1);'
          capture browser env BASE=http://127.0.0.1:4173 SOCCER_NEW_CAREER_BROWSER_OUT=career-confirmation-artifacts/browser node scripts/qa/soccerNewCareerDialogBrowser.mjs
      - name: Bind exact source, browser streams and observed locked oracle inputs
        if: ${{ !cancelled() && (steps.browser.outcome == 'success' || steps.browser.outcome == 'failure') }}
        env:
          SOCCER_NEW_CAREER_BROWSER_OUT: career-confirmation-artifacts/browser
        run: |
          set -euo pipefail
          source career-confirmation-artifacts/capture.sh
          cat > career-confirmation-artifacts/browser-provenance.mjs <<'PROVENANCE'
          // Retained source/process and observed locked-input joins, not browser semantics.
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          const ART = 'career-confirmation-artifacts', OUT = path.resolve(process.env.SOCCER_NEW_CAREER_BROWSER_OUT), ROOT = process.cwd();
          const sha = bytes => createHash('sha256').update(bytes).digest('hex'), result = { status: 'running', streams: [], dependencySubset: [], errors: [] };
          try {
            assert.equal(OUT, path.resolve(ART, 'browser'));
            assert.equal(sha(fs.readFileSync('scripts/qa/soccerNewCareerDialogBrowser.mjs')), '47c4e41928983ffeb9f889e4a3da08b7c9b812800cb7ab0629c728cc19f5e5d8');
            assert.equal(sha(Buffer.from(fs.readFileSync('src/pages/SoccerCareer.tsx', 'utf8').replaceAll('\r\n', '\n'))), '6f61f9010b3d3b39d9f366efae84dc7d939be71fcf34cc47fc9a5471fa70f05c');
            for (const suffix of ['argv', 'stdout', 'stderr', 'exit']) { const file = `browser.${suffix}`, body = fs.readFileSync(path.join(ART, file)); result.streams.push({ file, bytes: body.length, sha256: sha(body) }); }
            assert.equal(fs.readFileSync(path.join(ART, 'browser.exit'), 'utf8').trim(), '0');
            const argv = fs.readFileSync(path.join(ART, 'browser.argv'), 'utf8').split('\0'); assert.equal(argv.pop(), '');
            assert.deepEqual(argv, ['env', 'BASE=http://127.0.0.1:4173', 'SOCCER_NEW_CAREER_BROWSER_OUT=career-confirmation-artifacts/browser', 'node', 'scripts/qa/soccerNewCareerDialogBrowser.mjs']);
            const stdout = fs.readFileSync(path.join(ART, 'browser.stdout'), 'utf8'), stderr = fs.readFileSync(path.join(ART, 'browser.stderr'), 'utf8');
            assert(stdout.split('\n').filter(line => line.trim()).length >= 4); assert(stdout.trimEnd().endsWith('PASS Soccer New Career dialog browser'));
            assert(!/(^|\s)(FAIL|EMPTY|SKIP)(\s|$)|^\[SIM_OFFLINE_BLOCK\]/m.test(stdout + '\n' + stderr));
            const before = fs.readFileSync(path.join(ART, 'package.before.json')), lockBefore = fs.readFileSync(path.join(ART, 'package-lock.before.json'));
            assert(before.equals(fs.readFileSync('package.json'))); assert(lockBefore.equals(fs.readFileSync('package-lock.json')));
            const locked = JSON.parse(lockBefore), installed = JSON.parse(fs.readFileSync(path.join(ART, 'dependencies-before.json'))), after = JSON.parse(fs.readFileSync(path.join(ART, 'dependencies-after-setup.json')));
            assert.deepEqual(after.packageFiles, installed.packageFiles); assert.deepEqual(after.packages, installed.packages);
            for (const record of installed.packageFiles) assert.equal(record.sha256, sha(fs.readFileSync(record.file)));
            const report = JSON.parse(fs.readFileSync(path.join(OUT, 'report.json')));
            const bytes = ref => { const file = path.resolve(OUT, ref.path); assert(file.startsWith(`${OUT}${path.sep}`)); const body = fs.readFileSync(file); assert.equal(body.length, ref.bytes); assert.equal(sha(body), ref.sha256); return body; };
            for (const input of report.oracleSource.inputs.filter(row => row.file.startsWith('node_modules/'))) {
              const observed = installed.packages.filter(row => input.file.startsWith(`${row.directory}/`)).sort((a, b) => b.directory.length - a.directory.length)[0]; assert(observed, 'Physical oracle input joins observed locked installed subset');
              const full = path.resolve(ROOT, input.file); assert(full.startsWith(`${ROOT}${path.sep}`)); assert(bytes(input).equals(fs.readFileSync(full)));
              const manifestBytes = fs.readFileSync(path.join(ROOT, observed.directory, 'package.json')), manifest = JSON.parse(manifestBytes);
              assert.equal(manifest.name, observed.name); assert.equal(manifest.version, observed.version); assert.equal(locked.packages[observed.directory].version, observed.version);
              const target = path.join(ART, 'browser-dependency-manifests', `${sha(manifestBytes)}.json`); fs.mkdirSync(path.dirname(target), { recursive: true });
              if (fs.existsSync(target)) assert(fs.readFileSync(target).equals(manifestBytes)); else fs.writeFileSync(target, manifestBytes);
              result.dependencySubset.push({ input, installed: observed, manifest: { file: `${observed.directory}/package.json`, path: path.relative(ART, target), bytes: manifestBytes.length, sha256: sha(manifestBytes) }, qualification: 'Observed installed dependency subset, not canonical Git source or exhaustive installed-file census.' });
            }
            assert(result.dependencySubset.length > 0); result.status = 'pass';
          } catch (error) { result.status = 'fail'; result.errors.push(String(error.stack || error)); }
          finally { fs.writeFileSync(path.join(ART, 'browser-provenance.json'), JSON.stringify(result, null, 2)); }
          console.log(`${result.status === 'pass' ? 'PASS' : 'FAIL'} New Career browser source/process/locked input provenance`); if (result.status !== 'pass') process.exitCode = 1;
          PROVENANCE
          capture browser-provenance node career-confirmation-artifacts/browser-provenance.mjs
      - name: Independently check all modal observations and whole retained references
        if: ${{ !cancelled() && (steps.browser.outcome == 'success' || steps.browser.outcome == 'failure') }}
        env:
          SOCCER_NEW_CAREER_BROWSER_OUT: career-confirmation-artifacts/browser
        run: |
          set -euo pipefail
          source career-confirmation-artifacts/capture.sh
          cat > career-confirmation-artifacts/browser-consumer.mjs <<'BROWSER'
          // Independent retained-data consumer. Does not import or invoke the browser helper.
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';

          const ROOT = process.cwd(), OUT = path.resolve(ROOT, process.env.SOCCER_NEW_CAREER_BROWSER_OUT || 'new-career-dialog-artifacts/browser');
          const sha = body => createHash('sha256').update(body).digest('hex'), result = { status: 'running', references: [], checks: [], errors: [] };
          const check = (id, fn) => { const row = { id, status: 'running' }; result.checks.push(row); try { fn(); row.status = 'pass'; } catch (error) { row.status = 'fail'; row.error = String(error.stack || error); throw error; } };
          const bytes = ref => { assert(ref && typeof ref.path === 'string' && Number.isSafeInteger(ref.bytes) && ref.bytes >= 0 && /^[a-f0-9]{64}$/.test(ref.sha256));
            const full = path.resolve(OUT, ref.path); assert(full.startsWith(`${OUT}${path.sep}`)); const body = fs.readFileSync(full); const row = { path: ref.path, expectedBytes: ref.bytes, expectedSHA: ref.sha256, bytes: body.length, sha256: sha(body), status: 'running' }; result.references.push(row);
            assert.equal(body.length, ref.bytes); assert.equal(row.sha256, ref.sha256); row.status = 'pass'; return body; };
          const json = ref => JSON.parse(bytes(ref)), keys = (value, expected) => assert.deepEqual(Object.keys(value).sort(), [...expected].sort());
          const same = (left, right) => assert.deepEqual(left, right);
          const walk = value => { if (!value || typeof value !== 'object') return; if (typeof value.path === 'string' && Number.isSafeInteger(value.bytes) && typeof value.sha256 === 'string') bytes(value); for (const child of Object.values(value)) walk(child); };
          const contained = (box, outer) => box.x >= outer.x - 1 && box.y >= outer.y - 1 && box.right <= outer.right + 1 && box.bottom <= outer.bottom + 1;
          const fit = value => {
            const viewport = { x: 0, y: 0, right: value.viewport.width, bottom: value.viewport.height }, labels = [value.heading, value.warning, ...value.buttons]; let bad = !contained(value.dialog.rect, viewport) || !contained(value.group.rect, value.dialog.rect);
            for (const label of labels) { bad ||= !contained(label.rect, value.dialog.rect) || !contained(label.rect, viewport) || label.scrollWidth > label.clientWidth + 1 || label.scrollHeight > label.clientHeight + 1;
              for (const node of label.textNodes) if (node.text.trim()) for (const rect of node.rects) bad ||= !contained(rect, label.rect) || !contained(rect, value.dialog.rect) || !contained(rect, viewport); }
            for (const button of value.buttons) bad ||= !contained(button.rect, value.group.rect) || button.points.some(point => !point.painted);
            for (let i = 0; i < labels.length; i++) for (let j = i + 1; j < labels.length; j++) { const a = labels[i].rect, b = labels[j].rect; bad ||= Math.min(a.right, b.right) > Math.max(a.x, b.x) + 1 && Math.min(a.bottom, b.bottom) > Math.max(a.y, b.y) + 1; }
            for (const item of [value.dialog, value.group, ...labels]) bad ||= Object.values(item.rect).some(number => !Number.isFinite(number)) || item.rect.width <= 0 || item.rect.height <= 0 || item.style.display === 'none' || item.style.visibility !== 'visible' || Number(item.style.opacity) !== 1;
            bad ||= value.ancestors.some(layer => layer.display === 'none' || layer.visibility !== 'visible' || Number(layer.opacity) !== 1); return bad ? ['modal-action-fit'] : [];
          };
          const pure = value => [value.beforeRaw !== value.afterRaw && 'raw-save', JSON.stringify(value.beforeDraws) !== JSON.stringify(value.afterDraws) && 'read-rng'].filter(Boolean);
          const widths = [320, 390, 430, 1440], PAGE = 'src/pages/SoccerCareer.tsx', FIXTURE = 'scripts/data/careerLeagueWorldSaves1100.json', HEAD = '4a5f759aeab6d0e7b8d29e55d3cd624c8ad20c54';
          const props = { original: 'flex gap-3', current: 'flex flex-col gap-3 sm:flex-row', cancel: 'flex-1 h-10 font-bold', discard: 'flex-1 h-10 font-bold bg-red-600 hover:bg-red-500 text-black' };
          let report;
