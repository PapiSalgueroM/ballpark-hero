            check('population-and-source', () => {
              assert.equal(report.status, 'pass'); same(report.declarations, { widths, cases: 4, controls: ['original-dialog-320', 'read-purity'], pngs: 5 }); same(report.props, props); same(report.cases.map(row => row.width), widths); same(report.cases.map(row => row.id), widths.map(String)); same(report.errors, []); assert.equal(report.forwardedExternalRequests, 0);
              const files = [PAGE, 'src/lib/soccerCareerEngine.ts', 'src/lib/soccerCareerSave.ts', 'src/components/ui/button.tsx', 'src/lib/utils.ts', FIXTURE, 'scripts/lib/offlineTransport.cjs', 'scripts/lib/playwrightLoader.mjs', 'scripts/lib/hostLikeServer.mjs', 'package.json', 'package-lock.json', 'scripts/qa/soccerNewCareerDialogBrowser.mjs'];
              same(report.sourceBefore, report.sourceAfter); same(report.sourceBefore.map(row => row.file), files); assert.equal(report.page.commit, HEAD);
              for (const row of report.sourceBefore) { keys(row, ['file', 'path', 'bytes', 'sha256']); const retained = bytes(row), actual = fs.readFileSync(path.join(ROOT, row.file)); assert(retained.equals(actual));
                if (row.file !== PAGE && row.file !== files.at(-1)) { const original = execFileSync('git', ['cat-file', 'blob', `${HEAD}:${row.file}`], { cwd: ROOT, maxBuffer: 2000000 }); assert.equal(retained.toString('utf8').replaceAll('\r\n', '\n'), original.toString('utf8')); } }
