name: Grand Prix decision information verification

on:
  push:
    branches: [codex/grand-prix-decision-fixed-v2-20261103]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      CI: '1'
      SIM_NETWORK: offline
      GP_DECISION_PHASE: fixed
      GP_DECISION_OUT: ${{ github.workspace }}/gp-decision-artifacts
      GP_DECISION_MUTATIONS: ${{ github.workspace }}/scripts/qa/grandPrixDecisionSourceMap.json
      GP_TOOLS: ${{ github.workspace }}/tmp/gp-decision-tools
      FREE_KICK_FONT_CACHE: ${{ github.workspace }}/gp-decision-artifacts/font-cache
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Exact source fence and capture
        id: source
        run: |
          mkdir -p "$GP_DECISION_OUT"
          echo '127.0.0.1 flawuiqbvjobmkfkauhw.supabase.co' | sudo tee -a /etc/hosts
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          const git=(...a)=>execFileSync('git',a,{encoding:'utf8'}).trimEnd(),parent='d832d7c9573163d029b3542d440c9b484c6cbeff';
          assert.equal(git('rev-parse','HEAD^'),parent);
          assert.equal(git('rev-parse','HEAD^^{tree}'),'30fbf7a40eb9815e394686557bb60d419a63c9fd');
          assert.equal(git('status','--porcelain','--untracked-files=no'),'');
          const expected=["A\t.github/workflows/grand-prix-decision-info.yml","A\tscripts/qa/fixtures/siteFonts.captured.json","A\tscripts/qa/grandPrixDecisionBaselineIdentities.json","A\tscripts/qa/grandPrixDecisionSourceMap.json","A\tscripts/qa/playGrandPrixDecisionApp.mjs","A\tscripts/qa/prepareGrandPrixDecisionApp.mjs","A\tscripts/qa/verifyGrandPrixDecisionUnits.mjs","A\tsrc/test/grandPrixBossDecisionInfo.test.tsx","A\tsrc/test/grandPrixBossRaceTiming.test.tsx","M\tscripts/simGrandPrixBossManagement.mjs","M\tsrc/pages/GrandPrixBoss.tsx"];
          const actual=git('diff','--name-status',parent,'HEAD').split('\n').filter(Boolean).sort();assert.deepEqual(actual,expected.sort());
          fs.writeFileSync(process.env.GP_DECISION_OUT+'/source-fence.json',JSON.stringify({head:git('rev-parse','HEAD'),tree:git('rev-parse','HEAD^{tree}'),parent,changes:actual,phase:'fixed'},null,2));
          NODE
          git ls-files -z | sort -z | xargs -0 sha256sum > "$GP_DECISION_OUT/source-before.sha256"
          cat > "$GP_DECISION_OUT/capture.sh" <<'SH'
          capture() {
            local label="$1"
            shift
            set +e
            "$@" > "$GP_DECISION_OUT/$label.stdout.log" 2> "$GP_DECISION_OUT/$label.stderr.log"
            local code=$?
            set -e
            printf '%s\n' "$code" > "$GP_DECISION_OUT/$label.exit.txt"
            cat "$GP_DECISION_OUT/$label.stdout.log"
            cat "$GP_DECISION_OUT/$label.stderr.log" >&2
            return "$code"
          }
          SH
          mkdir -p "$GP_DECISION_OUT/selected-source"
          cp src/pages/GrandPrixBoss.tsx src/lib/grandPrixBoss.ts src/hooks/useGrandPrixBoss.ts src/test/grandPrixBossDecisionInfo.test.tsx src/test/grandPrixBossRaceTiming.test.tsx scripts/qa/verifyGrandPrixDecisionUnits.mjs scripts/qa/prepareGrandPrixDecisionApp.mjs scripts/qa/playGrandPrixDecisionApp.mjs scripts/qa/grandPrixDecisionSourceMap.json scripts/qa/grandPrixDecisionBaselineIdentities.json scripts/simGrandPrixBossManagement.mjs .github/workflows/grand-prix-decision-info.yml "$GP_DECISION_OUT/selected-source/"
          mkdir -p "$GP_DECISION_OUT/input"
          cp scripts/qa/fixtures/siteFonts.captured.json "$GP_DECISION_OUT/input/"
      - name: Locked application install
        id: install
        run: |
          source "$GP_DECISION_OUT/capture.sh"
          capture install npm ci
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const lock=JSON.parse(fs.readFileSync('package-lock.json')),installed=[];
          for(const [p,entry] of Object.entries(lock.packages)){
            if(!p.startsWith('node_modules/')||!fs.existsSync(p+'/package.json'))continue;
            const version=JSON.parse(fs.readFileSync(p+'/package.json')).version;
            assert.equal(version,entry.version,p);installed.push({path:p,version});
          }
          assert(installed.length>0);
          fs.writeFileSync(process.env.GP_DECISION_OUT+'/installed.json',JSON.stringify({node:process.versions,installed,scope:'Locked installed VERSION receipts, not complete dependency binary/member custody.'},null,2));
          NODE
      - name: Isolated pinned browser and image verification tools
        id: tools
        run: |
          source "$GP_DECISION_OUT/capture.sh"
          test ! -e "$GP_TOOLS"
          mkdir -p "$GP_TOOLS"
          printf '{"private":true,"dependencies":{"playwright":"1.64.1"}}\n' > "$GP_TOOLS/package.json"
          capture browser-install env NODE_OPTIONS='' npm install --prefix "$GP_TOOLS" --ignore-scripts --no-audit --no-fund
          test ! -e node_modules/playwright
          test ! -e node_modules/playwright-core
          ln -s "$GP_TOOLS/node_modules/playwright" node_modules/playwright
          ln -s "$GP_TOOLS/node_modules/playwright-core" node_modules/playwright-core
          cp "$GP_TOOLS/package.json" "$GP_TOOLS/package-lock.json" "$GP_DECISION_OUT/input/"
          capture chromium-install env NODE_OPTIONS='' node "$GP_TOOLS/node_modules/playwright/cli.js" install --with-deps chromium
          capture python-venv env NODE_OPTIONS='' python3 -m venv "$GP_TOOLS/python"
          capture python-install env NODE_OPTIONS='' "$GP_TOOLS/python/bin/python" -m pip install fonttools==4.60.1 Pillow==11.3.0
          "$GP_TOOLS/python/bin/python" -m pip freeze > "$GP_DECISION_OUT/python-versions.txt"
          echo "$GP_TOOLS/python/bin" >> "$GITHUB_PATH"
      - name: Materialize only nine already-held font bodies and cache adapter
        run: |
          set -euo pipefail
          out="$GP_DECISION_OUT"
          env NODE_OPTIONS='' node --input-type=module <<'FONTS'
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { gunzipSync } from 'node:zlib';
          const sha=b=>createHash('sha256').update(b).digest('hex'),raw=fs.readFileSync('scripts/qa/fixtures/siteFonts.captured.json');
          assert.equal(raw.length,1600766);assert.equal(sha(raw),'a6c24e3ec7711d400f53a1baf10a3a6a3925d1f269e48ee0cd14bdca5b749938');
          const rows=JSON.parse(raw).entries,dir=process.env.FREE_KICK_FONT_CACHE;assert.equal(rows.length,9);fs.mkdirSync(dir,{recursive:true});
          const manifest=[];
          for(const row of rows){
            assert.equal(row.encoding,'gzip+hex');assert(['https://fonts.googleapis.com','https://fonts.gstatic.com'].includes(new URL(row.url).origin));
            const body=gunzipSync(Buffer.from(row.body,'hex'));assert.equal(body.length,row.bytes);assert.equal(sha(body),row.sha256);
            const file=path.basename(row.originalFile);assert.equal(file,row.originalFile);assert(/^[a-f0-9]+$/.test(file));
            fs.writeFileSync(path.join(dir,file),body,{flag:'wx'});manifest.push({url:row.url,file,contentType:row.contentType,sha256:row.sha256,bytes:row.bytes});
          }
          assert.equal(new Set(manifest.map(row=>row.url)).size,9);
          fs.writeFileSync(path.join(dir,'manifest.json'),JSON.stringify(manifest,null,2)+'\n');
          fs.writeFileSync(process.env.GP_DECISION_OUT+'/font-custody.json',JSON.stringify({heldFixtureSha256:sha(raw),heldFixtureBytes:raw.length,sourceRun:41443229767,sourceArtifact:13140509319,archiveReacquisitions:0,fontDownloads:0,manifest},null,2)+'\n');
          FONTS
          cat > "$out/cached-fonts.cjs" <<'ADAPTER'
          'use strict';
          const fs=require('node:fs'),path=require('node:path'),assert=require('node:assert/strict'),{createHash}=require('node:crypto');
          const out=process.env.GP_DECISION_OUT,sha=b=>createHash('sha256').update(b).digest('hex');
          const manifest=JSON.parse(fs.readFileSync(path.join(process.env.FREE_KICK_FONT_CACHE,'manifest.json'),'utf8'));
          const cache=new Map(manifest.map(row=>{const body=fs.readFileSync(path.join(process.env.FREE_KICK_FONT_CACHE,row.file));assert.equal(sha(body),row.sha256);return[row.url,{body,contentType:row.contentType,sha256:row.sha256}];}));
          const pw=require(path.join(process.env.GITHUB_WORKSPACE,'node_modules/playwright')),launch=pw.chromium.launch.bind(pw.chromium);
          pw.chromium.launch=async(...args)=>{
            const browser=await launch(...args),newContext=browser.newContext.bind(browser);
            browser.newContext=async(...options)=>{
              const context=await newContext(...options);
              await context.route(/^https:\/\/fonts\.(googleapis|gstatic)\.com\//,async route=>{
                const req=route.request(),url=req.url(),row=cache.get(url);
                if(!row||req.method()!=='GET'){fs.appendFileSync(path.join(out,'font-cache-misses.jsonl'),JSON.stringify({url,method:req.method()})+'\n');return route.abort();}
                fs.appendFileSync(path.join(out,'font-cache-use.jsonl'),JSON.stringify({url,sha256:row.sha256})+'\n');
                return route.fulfill({status:200,body:row.body,contentType:row.contentType});
              });
              for(const [kind,pattern]of[['flag',/^https:\/\/flagcdn\.com\//],['database',/^https:\/\/[^/]+\.supabase\.co\//]])await context.route(pattern,route=>{
                const req=route.request();fs.appendFileSync(path.join(out,'blocked-external.jsonl'),JSON.stringify({kind,url:req.url(),method:req.method(),bodySha256:req.postData()?sha(req.postData()):null})+'\n');return route.abort();
              });
              return context;
            };
            return browser;
          };
          ADAPTER
          find "$FREE_KICK_FONT_CACHE" -type f -print0 | sort -z | xargs -0 sha256sum > "$out/font-files.sha256"
          sha256sum "$out/cached-fonts.cjs" > "$out/cache-adapter.sha256"
      - name: Proper application types and controller syntax
        run: |
          source "$GP_DECISION_OUT/capture.sh"
          capture types env NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node_modules/.bin/tsc --noEmit -p tsconfig.app.json
          for script in scripts/qa/verifyGrandPrixDecisionUnits.mjs scripts/qa/prepareGrandPrixDecisionApp.mjs scripts/qa/playGrandPrixDecisionApp.mjs scripts/simGrandPrixBossManagement.mjs; do
            capture "syntax-$(basename "$script")" env NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node --check "$script"
          done
      - name: All thirteen original Grand Prix ordinary unit files
        run: |
          source "$GP_DECISION_OUT/capture.sh"
          capture original-units env NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node node_modules/vitest/vitest.mjs run src/test/grandPrixBoss.test.ts src/test/grandPrixBossFocusSave.test.tsx src/test/grandPrixBossHistoryTies.test.ts src/test/grandPrixBossLifecycle.test.ts src/test/grandPrixBossLifecyclePage.test.tsx src/test/grandPrixBossManagementPage.test.tsx src/test/grandPrixBossMarket.test.ts src/test/grandPrixBossMarketSave.test.tsx src/test/grandPrixBossPage.test.tsx src/test/grandPrixBossRollover.test.ts src/test/grandPrixBossRolloverSave.test.tsx src/test/grandPrixBossSave.test.tsx src/test/grandPrixBossStarterBalance.test.ts --reporter=default --reporter=json --outputFile.json="$GP_DECISION_OUT/original-units.json" --maxWorkers=1 --no-file-parallelism
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          const out=process.env.GP_DECISION_OUT,bytes=fs.readFileSync(out+'/original-units.json'),expected=["src/test/grandPrixBoss.test.ts","src/test/grandPrixBossFocusSave.test.tsx","src/test/grandPrixBossHistoryTies.test.ts","src/test/grandPrixBossLifecycle.test.ts","src/test/grandPrixBossLifecyclePage.test.tsx","src/test/grandPrixBossManagementPage.test.tsx","src/test/grandPrixBossMarket.test.ts","src/test/grandPrixBossMarketSave.test.tsx","src/test/grandPrixBossPage.test.tsx","src/test/grandPrixBossRollover.test.ts","src/test/grandPrixBossRolloverSave.test.tsx","src/test/grandPrixBossSave.test.tsx","src/test/grandPrixBossStarterBalance.test.ts"];
          const validate=r=>{
            assert.equal(r.numTotalTests,104,'GP_ORIGINAL_COUNT');assert.equal(r.numPassedTests,104);assert.equal(r.numFailedTests,0);
            assert.equal(r.numPendingTests,0);assert.equal(r.numTodoTests,0);assert.equal(r.success,true);
            assert.equal(r.testResults.length,13);
            assert.deepEqual(r.testResults.map(f=>path.relative(process.cwd(),path.resolve(f.name)).split(path.sep).join('/')).sort(),expected,'GP_ORIGINAL_FILES');
            const rows=r.testResults.flatMap(f=>{assert.equal(f.message||'','');return f.assertionResults;});
            assert.equal(rows.length,104);for(const row of rows){assert.equal(row.status,'passed','GP_ORIGINAL_STATUS');assert.equal(row.failureMessages.length,0);}
            const identity=r.testResults.flatMap(f=>f.assertionResults.map(a=>({file:path.relative(process.cwd(),path.resolve(f.name)).split(path.sep).join('/'),title:a.title,fullName:a.fullName,status:a.status}))).sort((a,b)=>(a.file+'\0'+a.fullName).localeCompare(b.file+'\0'+b.fullName));
            const frozen=JSON.parse(fs.readFileSync('scripts/qa/grandPrixDecisionBaselineIdentities.json')).sort((a,b)=>(a.file+'\0'+a.fullName).localeCompare(b.file+'\0'+b.fullName));
            assert.deepEqual(identity,frozen,'GP_ORIGINAL_IDENTITIES');
            for(const key of ['numUnhandledErrors','numRuntimeErrorTestSuites','numRuntimeErrorTests'])if(r[key]!==undefined&&r[key]!==null){assert.equal(typeof r[key],'number');assert.equal(r[key],0);}
          };
          const actual=JSON.parse(bytes);validate(actual);const controls=[];
          for(const [id,marker,edit] of [
            ['count','GP_ORIGINAL_COUNT',r=>{r.numTotalTests=105;}],
            ['identity','GP_ORIGINAL_FILES',r=>{r.testResults[0].name=path.resolve('src/test/fixture-missing.test.ts');}],
            ['status','GP_ORIGINAL_STATUS',r=>{r.testResults[0].assertionResults[0].status='pending';}],
            ['full-name','GP_ORIGINAL_IDENTITIES',r=>{r.testResults[0].assertionResults[0].fullName+=' copied';}],
          ]){
            const copy=JSON.parse(bytes);edit(copy);const changed=Buffer.from(JSON.stringify(copy)),file=out+'/reader-'+id+'.json';
            assert.notEqual(createHash('sha256').update(changed).digest('hex'),createHash('sha256').update(bytes).digest('hex'));
            fs.writeFileSync(file,changed);assert.throws(()=>validate(JSON.parse(fs.readFileSync(file))),e=>e?.name==='AssertionError'&&String(e.message).startsWith(marker));
            fs.writeFileSync(out+'/reader-'+id+'.changed.json',fs.readFileSync(file));fs.writeFileSync(file,bytes);
            assert(fs.readFileSync(file).equals(bytes));validate(JSON.parse(fs.readFileSync(file)));
            controls.push({id,marker,changedSHA256:createHash('sha256').update(changed).digest('hex'),restoredSHA256:createHash('sha256').update(bytes).digest('hex')});
          }
          const text=fs.readFileSync(out+'/original-units.stdout.log','utf8')+'\n'+fs.readFileSync(out+'/original-units.stderr.log','utf8');
          assert.doesNotMatch(text,/\bUnhandled (?:Errors?|Rejections?)\b|\bunhandledRejection\b|\buncaughtException\b|\bUnhandledPromiseRejection(?:Warning|Error)?\b|\bSIM_OFFLINE_BLOCK\b/i);
          const runtime=Object.fromEntries(['numUnhandledErrors','numRuntimeErrorTestSuites','numRuntimeErrorTests'].map(k=>[k,actual[k]===undefined||actual[k]===null?{status:'UNKNOWN',value:null}:{status:'REPORTED_ZERO',value:actual[k]}]));
          fs.writeFileSync(out+'/original-units-admission.json',JSON.stringify({files:13,executed:104,passed:104,pending:0,todo:0,controls,runtime,identities:actual.testResults.flatMap(f=>f.assertionResults.map(r=>({file:f.name,title:r.title,fullName:r.fullName,status:r.status})))},null,2));
          NODE
      - name: Actual new decisions and two physical omission restorations
        run: |
          source "$GP_DECISION_OUT/capture.sh"
          capture decision-units env NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" GP_DECISION_CONTROL='' node scripts/qa/verifyGrandPrixDecisionUnits.mjs
          capture profile-omission env NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" GP_DECISION_CONTROL=profile node scripts/qa/verifyGrandPrixDecisionUnits.mjs
          capture timing-omission env NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" GP_DECISION_CONTROL=timing node scripts/qa/verifyGrandPrixDecisionUnits.mjs
      - name: All twelve original Grand Prix harnesses with raw retention
        run: |
          source "$GP_DECISION_OUT/capture.sh"
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          mkdir -p "$GP_DECISION_OUT/original-harnesses"
          export GP_BOSS_OUT="$GP_DECISION_OUT/original-harnesses"
          export GP_BOSS_SAVE_OUT="$GP_DECISION_OUT/original-harnesses"
          export GP_BOSS_FOCUS_SAVE_OUT="$GP_DECISION_OUT/original-harnesses"
          export GP_BOSS_LIFECYCLE_OUT="$GP_DECISION_OUT/original-harnesses"
          export GP_BOSS_LIFECYCLE_OUTCOMES_OUT="$GP_DECISION_OUT/original-harnesses"
          export GP_BOSS_LIFECYCLE_PAGE_OUT="$GP_DECISION_OUT/original-harnesses"
          export GP_BOSS_MANAGEMENT_OUT="$GP_DECISION_OUT/original-harnesses"
          export GP_BOSS_MARKET_OUT="$GP_DECISION_OUT/original-harnesses"
          export GP_BOSS_MARKET_SAVE_OUT="$GP_DECISION_OUT/original-harnesses"
          export GP_BOSS_ROLLOVER_OUT="$GP_DECISION_OUT/original-harnesses"
          export GP_BOSS_ROLLOVER_SAVE_OUT="$GP_DECISION_OUT/original-harnesses"
          export GP_BOSS_STARTER_OUT="$GP_DECISION_OUT/original-harnesses"
          failed=0
          for script in scripts/simGrandPrixBoss.mjs scripts/simGrandPrixBossFocusSave.mjs scripts/simGrandPrixBossLifecycle.mjs scripts/simGrandPrixBossLifecycleOutcomes.mjs scripts/simGrandPrixBossLifecyclePage.mjs scripts/simGrandPrixBossManagement.mjs scripts/simGrandPrixBossMarket.mjs scripts/simGrandPrixBossMarketSave.mjs scripts/simGrandPrixBossRollover.mjs scripts/simGrandPrixBossRolloverSave.mjs scripts/simGrandPrixBossSave.mjs scripts/simGrandPrixBossStarterBalance.mjs; do
            status=0
            capture "$(basename "$script" .mjs)" node "$script" || status=$?
            printf '%s\t%s\n' "$script" "$status" >> "$GP_DECISION_OUT/original-harnesses.tsv"
            test "$status" -eq 0 || failed=1
          done
          test "$(wc -l < "$GP_DECISION_OUT/original-harnesses.tsv")" -eq 12
          exit "$failed"
      - name: Normal production build
        id: build
        if: always() && steps.source.outcome == 'success' && steps.install.outcome == 'success' && steps.tools.outcome == 'success'
        run: |
          source "$GP_DECISION_OUT/capture.sh"
          capture build env NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" npm run build
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > "$GP_DECISION_OUT/dist.sha256"
      - name: All fifteen required completed-output readers
        id: readers
        if: always() && steps.build.outcome == 'success'
        run: |
          set -euo pipefail
          out="$GP_DECISION_OUT"; source "$out/capture.sh"
          export SIM_NETWORK=offline
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs --require=$out/cached-fonts.cjs"
          node scripts/lib/hostLikeServer.mjs dist 4173 > "$out/readers-server.log" 2>&1 &
          server=$!; trap 'kill "$server" 2>/dev/null || true' EXIT
          ready=0; for attempt in 1 2 3 4 5; do if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then ready=1; break; fi; sleep 1; done; test "$ready" -eq 1
          failed=0
          for reader in simAdsense simBrand simHeadTags simHiddenPages simHubs simIndexNow simIndexing simInternalLinks simNoRivalNames simPrerender simPrerenderBoot simRetiredRoutes simSchema simSitemap simSnapshotAssets; do
            status=0; capture "$reader" env BASE=http://127.0.0.1:4173 SWEEP_BASE=http://127.0.0.1:4173 node "scripts/$reader.mjs" || status=$?
            printf '%s\t%s\n' "$reader" "$status" >> "$out/readers.tsv"; test "$status" -eq 0 || failed=1
          done
          test "$(wc -l < "$out/readers.tsv")" -eq 15
          test ! -s "$out/font-cache-misses.jsonl" || failed=1
          test -s "$out/font-cache-use.jsonl" || failed=1
          exit "$failed"
      - name: All sixteen unchanged page weight ceilings
        id: caps
        if: always() && steps.build.outcome == 'success'
        run: |
          set -euo pipefail
          out="$GP_DECISION_OUT"; source "$out/capture.sh"
          export SIM_NETWORK=offline
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs --require=$out/cached-fonts.cjs"
          capture caps-source node --input-type=module <<'CAPS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          const body=fs.readFileSync('scripts/sweepWeight.mjs','utf8'),before=execFileSync('git',['show','d832d7c9573163d029b3542d440c9b484c6cbeff:scripts/sweepWeight.mjs'],{encoding:'utf8'});
          const read=text=>{
            const code=text.replace(/\/\*[\s\S]*?\*\//g,'').replace(/(^|\n)\s*\/\/[^\n]*/g,'$1');
            const start=code.indexOf('const BUDGETS = [');assert(start>=0);const end=code.indexOf('];',start);assert(end>start);
            return [...code.slice(start,end+2).matchAll(/\[\s*(['"])(\/[^'"]*)\1\s*,\s*(\d+)\s*\]/g)].map(row=>({route:row[2],cap:Number(row[3])}));
          };
          const budgets=read(body);assert.equal(budgets.length,16);assert.equal(new Set(budgets.map(row=>row.route)).size,16);assert.deepEqual(budgets,read(before));assert(!budgets.some(row=>row.route==='/grand-prix-boss'));
          fs.writeFileSync(process.env.GP_DECISION_OUT+'/caps16.json',JSON.stringify({sourceSha256:createHash('sha256').update(body).digest('hex'),unchangedParent:'d832d7c9573163d029b3542d440c9b484c6cbeff',budgetCount:16,budgets,newRouteCeiling:null},null,2)+'\n');
          CAPS
          node scripts/lib/hostLikeServer.mjs dist 4173 > "$out/caps-server.log" 2>&1 &
          server=$!; trap 'kill "$server" 2>/dev/null || true' EXIT
          ready=0; for attempt in 1 2 3 4 5; do if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then ready=1; break; fi; sleep 1; done; test "$ready" -eq 1
          capture all-page-caps env BASE=http://127.0.0.1:4173 SWEEP_BASE=http://127.0.0.1:4173 SWEEP_OFFLINE=1 node scripts/sweepWeight.mjs
      - name: Three actual App viewports and real reloads
        if: always() && steps.build.outcome == 'success'
        run: |
          source "$GP_DECISION_OUT/capture.sh"
          export GP_DECISION_APP_PREP="$PWD/tmp/gp-decision-app-prep"
          export GP_DECISION_APP_OUT="$GP_DECISION_OUT/app"
          export GP_DECISION_APP_FONTS="$GP_DECISION_OUT/input/siteFonts.captured.json"
          capture app-prep env NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/qa/prepareGrandPrixDecisionApp.mjs
          cp -R "$GP_DECISION_APP_PREP" "$GP_DECISION_OUT/app-prepared"
          capture actual-app env NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/qa/playGrandPrixDecisionApp.mjs
      - name: Final tracked-source and installed-version holds
        if: always()
        run: |
          sha256sum --check "$GP_DECISION_OUT/source-before.sha256" > "$GP_DECISION_OUT/source-hold.log"
          git diff --exit-code > "$GP_DECISION_OUT/tracked.diff"
          if test -f "$GP_DECISION_OUT/dist.sha256"; then sha256sum --check "$GP_DECISION_OUT/dist.sha256" > "$GP_DECISION_OUT/dist-hold.log"; fi
          if test -f "$GP_DECISION_OUT/font-files.sha256"; then sha256sum --check "$GP_DECISION_OUT/font-files.sha256" > "$GP_DECISION_OUT/font-hold.log"; fi
          if test -f "$GP_DECISION_OUT/cache-adapter.sha256"; then sha256sum --check "$GP_DECISION_OUT/cache-adapter.sha256" > "$GP_DECISION_OUT/cache-adapter-hold.log"; fi
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          const out=process.env.GP_DECISION_OUT,r=JSON.parse(fs.readFileSync(out+'/installed.json'));
          for(const row of r.installed)assert.equal(JSON.parse(fs.readFileSync(row.path+'/package.json')).version,row.version,row.path);
          const cache='node_modules/.vite',rows=[];
          if(fs.existsSync(cache)){
            const walk=p=>{const s=fs.lstatSync(p);assert(!s.isSymbolicLink());if(s.isDirectory()){for(const n of fs.readdirSync(p))walk(path.join(p,n));return;}assert(s.isFile());const b=fs.readFileSync(p),rel=path.relative(cache,p),target=path.join(out,'framework-cache',rel);fs.mkdirSync(path.dirname(target),{recursive:true});fs.writeFileSync(target,b);rows.push({path:rel,bytes:b.length,sha256:createHash('sha256').update(b).digest('hex')});};walk(cache);
          }
          fs.writeFileSync(out+'/final-holds.json',JSON.stringify({trackedHashesHeld:true,trackedDiffEmpty:true,installedVersions:r.installed.length,frameworkCache:rows,scope:'No complete dependency binary/member/link or transport census.'},null,2));
          NODE
      - name: Bound retained evidence
        id: evidence
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          const out=process.env.GP_DECISION_OUT,rows=[];
          const walk=p=>{const s=fs.lstatSync(p);assert(!s.isSymbolicLink());if(s.isDirectory()){for(const n of fs.readdirSync(p))walk(path.join(p,n));return;}assert(s.isFile());const b=fs.readFileSync(p);rows.push({path:path.relative(out,p),bytes:b.length,sha256:createHash('sha256').update(b).digest('hex')});};walk(out);
          const bytes=rows.reduce((s,r)=>s+r.bytes,0),manifest=Buffer.from(JSON.stringify({rows,bytes,scope:'Owned raw proof only, manifest-inclusive strict100MB/2000 member ceilings, scoped for new units, twelve original harnesses, actual App evidence and held fonts.'},null,2));
          assert(rows.length>0&&rows.length+1<2000);assert(bytes+manifest.length<100000000);
          fs.writeFileSync(out+'/artifact-members.json',manifest);
          NODE
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always() && steps.evidence.outputs.ready == 'true'
        with:
          name: gp-decision-fixed-${{ github.run_id }}
          path: gp-decision-artifacts/
          include-hidden-files: true
          retention-days: 14
