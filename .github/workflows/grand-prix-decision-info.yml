name: Grand Prix decision information baseline

on:
  push:
    branches: [codex/grand-prix-decision-baseline-v2-20261103]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      CI: '1'
      SIM_NETWORK: offline
      GP_DECISION_PHASE: baseline
      GP_DECISION_OUT: ${{ github.workspace }}/gp-decision-artifacts
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Exact source fence and capture
        run: |
          mkdir -p "$GP_DECISION_OUT"
          echo '127.0.0.1 flawuiqbvjobmkfkauhw.supabase.co' | sudo tee -a /etc/hosts
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          const git=(...a)=>execFileSync('git',a,{encoding:'utf8'}).trimEnd(),parent='d832d7c9573163d029b3542d440c9b484c6cbeff';
          assert.equal(git('rev-parse','HEAD^'),parent);
          assert.equal(git('rev-parse','HEAD^^{tree}'),'30fbf7a40eb9815e394686557bb60d419a63c9fd');
          assert.equal(git('status','--porcelain','--untracked-files=no'),'');
          const expected=['A\t.github/workflows/grand-prix-decision-info.yml','A\tscripts/qa/verifyGrandPrixDecisionUnits.mjs','A\tsrc/test/grandPrixBossDecisionInfo.test.tsx','A\tsrc/test/grandPrixBossRaceTiming.test.tsx'];
          const actual=git('diff','--name-status',parent,'HEAD').split('\n').filter(Boolean).sort();assert.deepEqual(actual,expected.sort());
          fs.writeFileSync(process.env.GP_DECISION_OUT+'/source-fence.json',JSON.stringify({head:git('rev-parse','HEAD'),tree:git('rev-parse','HEAD^{tree}'),parent,changes:actual,phase:'baseline'},null,2));
          NODE
          git ls-files -z | sort -z | xargs -0 sha256sum > "$GP_DECISION_OUT/source-before.sha256"
          cat > "$GP_DECISION_OUT/capture.sh" <<'SH'
          capture() {
            local label="$1"
            shift
            set +e
            "$@" > "$GP_DECISION_OUT/$label.stdout.log" 2> "$GP_DECISION_OUT/$label.stderr.log"
            local code=$?
            set -e
            printf '%s\n' "$code" > "$GP_DECISION_OUT/$label.exit.txt"
            cat "$GP_DECISION_OUT/$label.stdout.log"
            cat "$GP_DECISION_OUT/$label.stderr.log" >&2
            return "$code"
          }
          SH
          mkdir -p "$GP_DECISION_OUT/selected-source"
          cp src/pages/GrandPrixBoss.tsx src/lib/grandPrixBoss.ts src/hooks/useGrandPrixBoss.ts src/test/grandPrixBossDecisionInfo.test.tsx src/test/grandPrixBossRaceTiming.test.tsx scripts/qa/verifyGrandPrixDecisionUnits.mjs .github/workflows/grand-prix-decision-info.yml "$GP_DECISION_OUT/selected-source/"
      - name: Locked application install
        run: |
          source "$GP_DECISION_OUT/capture.sh"
          capture install npm ci
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const lock=JSON.parse(fs.readFileSync('package-lock.json')),installed=[];
          for(const [p,entry] of Object.entries(lock.packages)){
            if(!p.startsWith('node_modules/')||!fs.existsSync(p+'/package.json'))continue;
            const version=JSON.parse(fs.readFileSync(p+'/package.json')).version;
            assert.equal(version,entry.version,p);installed.push({path:p,version});
          }
          assert(installed.length>0);
          fs.writeFileSync(process.env.GP_DECISION_OUT+'/installed.json',JSON.stringify({node:process.versions,installed,scope:'Locked installed VERSION receipts, not complete dependency binary/member custody.'},null,2));
          NODE
      - name: Proper application types and controller syntax
        run: |
          source "$GP_DECISION_OUT/capture.sh"
          capture types env NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node_modules/.bin/tsc --noEmit -p tsconfig.app.json
          capture syntax env NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node --check scripts/qa/verifyGrandPrixDecisionUnits.mjs
      - name: All thirteen original Grand Prix ordinary unit files
        run: |
          source "$GP_DECISION_OUT/capture.sh"
          capture original-units env NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node node_modules/vitest/vitest.mjs run src/test/grandPrixBoss.test.ts src/test/grandPrixBossFocusSave.test.tsx src/test/grandPrixBossHistoryTies.test.ts src/test/grandPrixBossLifecycle.test.ts src/test/grandPrixBossLifecyclePage.test.tsx src/test/grandPrixBossManagementPage.test.tsx src/test/grandPrixBossMarket.test.ts src/test/grandPrixBossMarketSave.test.tsx src/test/grandPrixBossPage.test.tsx src/test/grandPrixBossRollover.test.ts src/test/grandPrixBossRolloverSave.test.tsx src/test/grandPrixBossSave.test.tsx src/test/grandPrixBossStarterBalance.test.ts --reporter=default --reporter=json --outputFile.json="$GP_DECISION_OUT/original-units.json" --maxWorkers=1 --no-file-parallelism
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          const out=process.env.GP_DECISION_OUT,bytes=fs.readFileSync(out+'/original-units.json'),expected=["src/test/grandPrixBoss.test.ts","src/test/grandPrixBossFocusSave.test.tsx","src/test/grandPrixBossHistoryTies.test.ts","src/test/grandPrixBossLifecycle.test.ts","src/test/grandPrixBossLifecyclePage.test.tsx","src/test/grandPrixBossManagementPage.test.tsx","src/test/grandPrixBossMarket.test.ts","src/test/grandPrixBossMarketSave.test.tsx","src/test/grandPrixBossPage.test.tsx","src/test/grandPrixBossRollover.test.ts","src/test/grandPrixBossRolloverSave.test.tsx","src/test/grandPrixBossSave.test.tsx","src/test/grandPrixBossStarterBalance.test.ts"];
          const validate=r=>{
            assert.equal(r.numTotalTests,104,'GP_ORIGINAL_COUNT');assert.equal(r.numPassedTests,104);assert.equal(r.numFailedTests,0);
            assert.equal(r.numPendingTests,0);assert.equal(r.numTodoTests,0);assert.equal(r.success,true);
            assert.equal(r.testResults.length,13);
            assert.deepEqual(r.testResults.map(f=>path.relative(process.cwd(),path.resolve(f.name)).split(path.sep).join('/')).sort(),expected,'GP_ORIGINAL_FILES');
            const rows=r.testResults.flatMap(f=>{assert.equal(f.message||'','');return f.assertionResults;});
            assert.equal(rows.length,104);for(const row of rows){assert.equal(row.status,'passed','GP_ORIGINAL_STATUS');assert.equal(row.failureMessages.length,0);}
            for(const key of ['numUnhandledErrors','numRuntimeErrorTestSuites','numRuntimeErrorTests'])if(r[key]!==undefined&&r[key]!==null){assert.equal(typeof r[key],'number');assert.equal(r[key],0);}
          };
          const actual=JSON.parse(bytes);validate(actual);const controls=[];
          for(const [id,marker,edit] of [
            ['count','GP_ORIGINAL_COUNT',r=>{r.numTotalTests=105;}],
            ['identity','GP_ORIGINAL_FILES',r=>{r.testResults[0].name=path.resolve('src/test/fixture-missing.test.ts');}],
            ['status','GP_ORIGINAL_STATUS',r=>{r.testResults[0].assertionResults[0].status='pending';}],
          ]){
            const copy=JSON.parse(bytes);edit(copy);const changed=Buffer.from(JSON.stringify(copy)),file=out+'/reader-'+id+'.json';
            assert.notEqual(createHash('sha256').update(changed).digest('hex'),createHash('sha256').update(bytes).digest('hex'));
            fs.writeFileSync(file,changed);assert.throws(()=>validate(JSON.parse(fs.readFileSync(file))),e=>e?.name==='AssertionError'&&String(e.message).startsWith(marker));
            fs.writeFileSync(out+'/reader-'+id+'.changed.json',fs.readFileSync(file));fs.writeFileSync(file,bytes);
            assert(fs.readFileSync(file).equals(bytes));validate(JSON.parse(fs.readFileSync(file)));
            controls.push({id,marker,changedSHA256:createHash('sha256').update(changed).digest('hex'),restoredSHA256:createHash('sha256').update(bytes).digest('hex')});
          }
          const text=fs.readFileSync(out+'/original-units.stdout.log','utf8')+'\n'+fs.readFileSync(out+'/original-units.stderr.log','utf8');
          assert.doesNotMatch(text,/\bUnhandled (?:Errors?|Rejections?)\b|\bunhandledRejection\b|\buncaughtException\b|\bUnhandledPromiseRejection(?:Warning|Error)?\b|\bSIM_OFFLINE_BLOCK\b/i);
          const runtime=Object.fromEntries(['numUnhandledErrors','numRuntimeErrorTestSuites','numRuntimeErrorTests'].map(k=>[k,actual[k]===undefined||actual[k]===null?{status:'UNKNOWN',value:null}:{status:'REPORTED_ZERO',value:actual[k]}]));
          fs.writeFileSync(out+'/original-units-admission.json',JSON.stringify({files:13,executed:104,passed:104,pending:0,todo:0,controls,runtime,identities:actual.testResults.flatMap(f=>f.assertionResults.map(r=>({file:f.name,title:r.title,fullName:r.fullName,status:r.status})))},null,2));
          NODE
      - name: Current two-file owned absence proof
        run: |
          source "$GP_DECISION_OUT/capture.sh"
          capture decision-units env NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/qa/verifyGrandPrixDecisionUnits.mjs
      - name: Final tracked-source and installed-version holds
        if: always()
        run: |
          sha256sum --check "$GP_DECISION_OUT/source-before.sha256" > "$GP_DECISION_OUT/source-hold.log"
          git diff --exit-code > "$GP_DECISION_OUT/tracked.diff"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          const out=process.env.GP_DECISION_OUT,r=JSON.parse(fs.readFileSync(out+'/installed.json'));
          for(const row of r.installed)assert.equal(JSON.parse(fs.readFileSync(row.path+'/package.json')).version,row.version,row.path);
          const cache='node_modules/.vite',rows=[];
          if(fs.existsSync(cache)){
            const walk=p=>{const s=fs.lstatSync(p);assert(!s.isSymbolicLink());if(s.isDirectory()){for(const n of fs.readdirSync(p))walk(path.join(p,n));return;}assert(s.isFile());const b=fs.readFileSync(p),rel=path.relative(cache,p),target=path.join(out,'framework-cache',rel);fs.mkdirSync(path.dirname(target),{recursive:true});fs.writeFileSync(target,b);rows.push({path:rel,bytes:b.length,sha256:createHash('sha256').update(b).digest('hex')});};walk(cache);
          }
          fs.writeFileSync(out+'/final-holds.json',JSON.stringify({trackedHashesHeld:true,trackedDiffEmpty:true,installedVersions:r.installed.length,frameworkCache:rows,scope:'No complete dependency binary/member/link or transport census.'},null,2));
          NODE
      - name: Bound retained evidence
        id: evidence
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          const out=process.env.GP_DECISION_OUT,rows=[];
          const walk=p=>{const s=fs.lstatSync(p);assert(!s.isSymbolicLink());if(s.isDirectory()){for(const n of fs.readdirSync(p))walk(path.join(p,n));return;}assert(s.isFile());const b=fs.readFileSync(p);rows.push({path:path.relative(out,p),bytes:b.length,sha256:createHash('sha256').update(b).digest('hex')});};walk(out);
          const bytes=rows.reduce((s,r)=>s+r.bytes,0),manifest=Buffer.from(JSON.stringify({rows,bytes,scope:'Owned raw proof only, manifest-inclusive strict30MB/1000 member ceilings.'},null,2));
          assert(rows.length>0&&rows.length+1<1000);assert(bytes+manifest.length<30000000);
          fs.writeFileSync(out+'/artifact-members.json',manifest);
          NODE
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always() && steps.evidence.outputs.ready == 'true'
        with:
          name: gp-decision-baseline-${{ github.run_id }}
          path: gp-decision-artifacts/
          include-hidden-files: true
          retention-days: 14
