name: Career historical opponent display verification
on:
  push:
    branches: [codex/career-historical-opponent-labels]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      SIM_NETWORK: offline
      ENGINES: chromium
      VITEST_MAX_FORKS: 1
      VITEST_MIN_FORKS: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retain source and capture commands
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = codex/career-historical-opponent-labels
          mkdir historical-opponent-artifacts
          git cat-file -e 4a5f759aeab6d0e7b8d29e55d3cd624c8ad20c54^{commit}
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse '4a5f759aeab6d0e7b8d29e55d3cd624c8ad20c54^{tree}')" = 8f8078136ba98fc07c944553aeaa53c307a68554
          git -c core.autocrlf=false archive --format=zip HEAD > historical-opponent-artifacts/source.zip
          git -c core.autocrlf=false archive --format=zip 4a5f759aeab6d0e7b8d29e55d3cd624c8ad20c54 > historical-opponent-artifacts/base.zip
          git ls-tree -r HEAD > historical-opponent-artifacts/source-inventory.txt
          git ls-tree -r 4a5f759aeab6d0e7b8d29e55d3cd624c8ad20c54 > historical-opponent-artifacts/base-inventory.txt
          sha256sum historical-opponent-artifacts/source.zip historical-opponent-artifacts/base.zip > historical-opponent-artifacts/source-archives.sha256
          node --input-type=module <<'SCOPE'
          import fs from 'node:fs';import assert from 'node:assert/strict';import {execFileSync} from 'node:child_process';
          const base='4a5f759aeab6d0e7b8d29e55d3cd624c8ad20c54',allowed=['scripts/genCareerLeagueSeasons.mjs','src/data/careerHistoricalOpponentDisplay.ts','src/lib/season/historicalOpponentLabels.ts','src/components/soccer-career/SoccerSeasonCentre.tsx','src/test/historicalOpponentLabels.test.ts','scripts/qa/soccerHistoricalOpponentDisplayProof.mjs','scripts/qa/soccerHistoricalOpponentDisplayObserver.tsx','.github/workflows/career-historical-opponent-labels.yml','docs/CAREER-HISTORICAL-OPPONENT-LABELS.md'];
          const changed=execFileSync('git',['diff','--name-only','-z',base,'HEAD']).toString().split('\0').filter(Boolean);
          fs.writeFileSync('historical-opponent-artifacts/source-scope.json',JSON.stringify({base,allowed,changed},null,2));assert.deepEqual([...changed].sort(),[...allowed].sort());
          SCOPE
          node --input-type=module <<'PINS'
          import fs from 'node:fs';import assert from 'node:assert/strict';import {createHash} from 'node:crypto';
          const pins=[["scripts/genCareerLeagueSeasons.mjs",10719,"0e66daf8402796a3e73710138e106a9e564d2f29f2b8e8fc6fa02908cd589ce7"],["src/data/careerHistoricalOpponentDisplay.ts",499,"a3f4b8563daa776d921a1374430a5b2c3efcc0a5a389c97151ed56f34087999b"],["src/lib/season/historicalOpponentLabels.ts",2490,"8c67960342059cbaa1d7860d821afdef8122a92fb33d3bee60d5400bbd7e26dc"],["src/components/soccer-career/SoccerSeasonCentre.tsx",31506,"f65e0f08aa8aa638839f5438923b62d7d69f3197ec0375179eb5a9386cc86635"],["src/test/historicalOpponentLabels.test.ts",6038,"412887e712a58ca91ed56a8ea82ebbecd975a599380abc2726857e53b57d195a"],["scripts/qa/soccerHistoricalOpponentDisplayProof.mjs",26638,"1cff3d79b2887c655a9c17ea2e29622e5a231303931efbee68aa586411f5b2fe"],["scripts/qa/soccerHistoricalOpponentDisplayObserver.tsx",15596,"3600d6012e34ff16153bcbaf7cffeed0e5112754a866ffdf247fb038fd0013fe"],["docs/CAREER-HISTORICAL-OPPONENT-LABELS.md",2074,"e805a5c49368b5edbb8cbd8a7c46575c7743eabeb2e2931dd0f0aada322a21ad"]];
          fs.writeFileSync('historical-opponent-artifacts/expected-source-pins.json',JSON.stringify(pins,null,2));for(const [file,bytes,sha256] of pins){const body=fs.readFileSync(file);assert.equal(body.length,bytes);assert.equal(createHash('sha256').update(body).digest('hex'),sha256);}
          PINS
          git rev-parse HEAD HEAD^{tree} > historical-opponent-artifacts/head-tree.txt
          cp package.json historical-opponent-artifacts/package.before.json
          cp package-lock.json historical-opponent-artifacts/package-lock.before.json
          sha256sum scripts/genCareerLeagueSeasons.mjs src/data/careerHistoricalOpponentDisplay.ts src/lib/season/historicalOpponentLabels.ts src/components/soccer-career/SoccerSeasonCentre.tsx src/test/historicalOpponentLabels.test.ts scripts/qa/soccerHistoricalOpponentDisplayProof.mjs scripts/qa/soccerHistoricalOpponentDisplayObserver.tsx .github/workflows/career-historical-opponent-labels.yml docs/CAREER-HISTORICAL-OPPONENT-LABELS.md src/data/careerLeagueSeasons.ts scripts/data/leagueSeasons/premier-league.json scripts/qa/soccerAgentReviewDependencies.mjs scripts/lib/offlineTransport.cjs scripts/lib/hostLikeServer.mjs > historical-opponent-artifacts/source-hold.sha256
          cat > historical-opponent-artifacts/capture.sh <<'CAPTURE'
          capture() {
            local label="$1"; shift
            printf '%s\0' "$@" > "historical-opponent-artifacts/$label.argv"
            set +e
            "$@" > "historical-opponent-artifacts/$label.stdout" 2> "historical-opponent-artifacts/$label.stderr"
            local code=$?
            set -e
            echo "$code" > "historical-opponent-artifacts/$label.exit"
            cat "historical-opponent-artifacts/$label.stdout"
            cat "historical-opponent-artifacts/$label.stderr" >&2
            return "$code"
          }
          CAPTURE
      - name: Install remote verification dependencies
        id: dependencies
        run: |
          set -euo pipefail
          source historical-opponent-artifacts/capture.sh
          capture npm-ci npm ci
          capture locked-before node scripts/qa/soccerAgentReviewDependencies.mjs before
          cp soccer-agent-review-artifacts/dependencies-before.json historical-opponent-artifacts/dependencies-before.json
          browser_tools="$RUNNER_TEMP/historical-opponent-seo-browser-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$browser_tools"
          printf '{"private":true,"dependencies":{"playwright":"1.64.0"}}\n' > "$browser_tools/package.json"
          capture playwright-package npm install --prefix "$browser_tools" --ignore-scripts --no-audit --no-fund
          test ! -e node_modules/playwright
          test ! -e node_modules/playwright-core
          ln -s "$browser_tools/node_modules/playwright" node_modules/playwright
          ln -s "$browser_tools/node_modules/playwright-core" node_modules/playwright-core
          cp "$browser_tools/package.json" historical-opponent-artifacts/browser-package.json
          cp "$browser_tools/package-lock.json" historical-opponent-artifacts/browser-package-lock.json
          capture chromium node "$browser_tools/node_modules/playwright/cli.js" install --with-deps chromium
          capture locked-after-setup node scripts/qa/soccerAgentReviewDependencies.mjs after
          cp soccer-agent-review-artifacts/dependencies-after.json historical-opponent-artifacts/dependencies-after-setup.json
          node --input-type=module <<'PLAYWRIGHT'
          import fs from 'node:fs';import assert from 'node:assert/strict';for(const name of ['playwright','playwright-core'])assert.equal(JSON.parse(fs.readFileSync('node_modules/'+name+'/package.json')).version,'1.64.0');
          PLAYWRIGHT
          capture fonts python -m pip install fonttools pillow
          cmp package.json historical-opponent-artifacts/package.before.json
          cmp package-lock.json historical-opponent-artifacts/package-lock.before.json
      - name: Actual application type gate
        id: types
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          set -euo pipefail
          source historical-opponent-artifacts/capture.sh
          capture types node_modules/.bin/tsc --noEmit -p tsconfig.app.json
      - name: Retain independent consumer literal part 1
