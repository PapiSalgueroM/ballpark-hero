name: Club Manager retired son original-source RED
on:
  push:
    branches: [codex/cm-retired-son-original-red-20261031]
permissions:
  contents: read
jobs:
  original_red:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
      SIM_NETWORK: offline
      GIT_OPTIONAL_LOCKS: '0'
      EXPECTED_MAIN: 19911f815ac713e8d3718cd0ee8592942a18fd00
      EXPECTED_MAIN_TREE: 91c7f30ce30c9753d5fbdb49a8c0b0152483d73e
      TEST_SHA256: b1c4529a669b5353767af60586420f4dccbdcecdb154b9f9e39f050c987e5ec5
      CONTROLLER_SHA256: 53ffee9caa002817480321bce95493de1bd317d87c939d896b2c5cc736df5f85
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Bind unchanged application and regression source
        run: |
          set -euo pipefail
          runner_temp=$(realpath "$RUNNER_TEMP")
          workspace=$(realpath "$PWD")
          case "$runner_temp/" in "$workspace/"*) exit 1;; esac
          out="$runner_temp/cm-retired-son-red"
          test ! -e "$out"
          mkdir -p "$out/runtime-tmp"
          echo "CM_SON_OUT=$out" >> "$GITHUB_ENV"
          echo "TMPDIR=$out/runtime-tmp" >> "$GITHUB_ENV"
          test "$GITHUB_REF_NAME" = codex/cm-retired-son-original-red-20261031
          test "$(git rev-list --parents -n1 HEAD)" = "$GITHUB_SHA $EXPECTED_MAIN"
          test "$(git rev-parse "$EXPECTED_MAIN^{tree}")" = "$EXPECTED_MAIN_TREE"
          test "$(git ls-files | wc -l)" -eq 5632
          git diff --name-status "$EXPECTED_MAIN" HEAD > "$out/proof.paths"
          printf 'A\t.github/workflows/cm-retired-son-red.yml\nA\tscripts/qa/cmRetiredSonRed.cjs\nA\tsrc/test/clubManagerRetiredSon.test.ts\n' > "$out/expected-proof.paths"
          cmp "$out/proof.paths" "$out/expected-proof.paths"
          test "$(sha256sum src/test/clubManagerRetiredSon.test.ts | cut -d' ' -f1)" = "$TEST_SHA256"
          test "$(sha256sum scripts/qa/cmRetiredSonRed.cjs | cut -d' ' -f1)" = "$CONTROLLER_SHA256"
          test "$(git hash-object src/lib/clubManager.ts)" = f0f0fc12b59e7744da9dcf7194cb89961bd873c6
          test "$(git hash-object src/pages/ClubManager.tsx)" = 7157cc1d2b6a8f17ae86bc174c44c967dd4f066b
          test "$(git hash-object src/components/club-manager/AcademyScreen.tsx)" = 1c71d0fb8400276f1ff9d45c51038d5655891c6c
          test "$(git hash-object src/hooks/useClubManager.ts)" = 7297073ea60b93501df48ea9b7dfc74edd2217de
          git ls-files -z | sort -z > "$out/source-members.initial"
          xargs -0 sha256sum < "$out/source-members.initial" > "$out/source.initial.sha256"
          git ls-files --others --exclude-standard -z | sort -z > "$out/untracked.initial"
          test ! -s "$out/untracked.initial"
          git for-each-ref --format='%(refname) %(objectname)' > "$out/refs.before"
          git rev-parse HEAD > "$out/head.txt"
          git rev-parse 'HEAD^{tree}' > "$out/tree.txt"
          git archive --format=tar HEAD > "$out/source.tar"
          cp scripts/qa/cmRetiredSonRed.cjs "$out/controller.cjs"
          cmp scripts/qa/cmRetiredSonRed.cjs "$out/controller.cjs"
          sha256sum "$out/controller.cjs" > "$out/controller-copy.sha256"
          node --check scripts/qa/cmRetiredSonRed.cjs > "$out/syntax.stdout" 2> "$out/syntax.stderr"
          test ! -s "$out/syntax.stdout"
          test ! -s "$out/syntax.stderr"
      - name: Locked install and actual application types
        run: |
          set -euo pipefail
          out="$CM_SON_OUT"
          raw=0
          env -u NODE_OPTIONS npm ci > "$out/npm-ci.stdout" 2> "$out/npm-ci.stderr" || raw=$?
          printf '%s\n' "$raw" > "$out/npm-ci.exit"
          test "$raw" -eq 0
          raw=0
          : > "$out/types.transport"
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$out/types.transport" timeout --signal=TERM --kill-after=15s 3m node node_modules/typescript/bin/tsc --noEmit -p tsconfig.app.json > "$out/types.stdout" 2> "$out/types.stderr" || raw=$?
          printf '%s\n' "$raw" > "$out/types.exit"
          test "$raw" -eq 0
          test ! -s "$out/types.stdout"
          test ! -s "$out/types.stderr"
          test ! -s "$out/types.transport"
      - name: Actual generated retirement missing-application RED
        run: |
          set -euo pipefail
          out="$CM_SON_OUT"
          raw=0
          : > "$out/red-parent.transport"
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$out/red-parent.transport" timeout --signal=TERM --kill-after=15s 4m node "$out/controller.cjs" > "$out/controller.stdout" 2> "$out/controller.stderr" || raw=$?
          printf '%s\n' "$raw" > "$out/controller.exit"
          test "$raw" -eq 0
          test ! -s "$out/controller.stderr"
          test ! -s "$out/red-parent.transport"
          grep -Fqx 'CM_SON_ORIGINAL_RED: one actual generated-retirement case failed at missing application; five effective copied-report refusals and same-copy restores. No feature qualification.' "$out/controller.stdout"
          test "$(cat "$out/red.raw.exit")" -eq 1
          find node_modules -type f -print0 | sort -z > "$out/dependencies.members.post"
          xargs -0 sha256sum < "$out/dependencies.members.post" > "$out/dependencies.post.sha256"
          find node_modules -type l -printf '%p -> %l\n' | sort > "$out/dependency-links.post"
      - name: Always preserve exact source and evidence
        if: ${{ always() }}
        run: |
          set -euo pipefail
          out="$CM_SON_OUT"
          mkdir -p "$out"
          failed=0
          git ls-files -z | sort -z > "$out/source-members.final"
          cmp "$out/source-members.initial" "$out/source-members.final" || failed=1
          sha256sum -c "$out/source.initial.sha256" > "$out/source-held.log" 2>&1 || failed=1
          git ls-files --others --exclude-standard -z | sort -z > "$out/untracked.final"
          cmp "$out/untracked.initial" "$out/untracked.final" || failed=1
          git diff --exit-code HEAD > "$out/working-source.diff" || failed=1
          git for-each-ref --format='%(refname) %(objectname)' > "$out/refs.after"
          cmp "$out/refs.before" "$out/refs.after" || failed=1
          sha256sum -c "$out/controller-copy.sha256" > "$out/controller-copy-final-held.log" 2>&1 || failed=1
          if test -f "$out/dependencies.post.sha256"; then
            find node_modules -type f -print0 | sort -z > "$out/dependencies.members.final"
            cmp "$out/dependencies.members.post" "$out/dependencies.members.final" || failed=1
            sha256sum -c "$out/dependencies.post.sha256" > "$out/dependencies-final-held.log" 2>&1 || failed=1
            find node_modules -type l -printf '%p -> %l\n' | sort > "$out/dependency-links.final"
            cmp "$out/dependency-links.post" "$out/dependency-links.final" || failed=1
          else
            printf 'POST_TEST_DEPENDENCY_INVENTORY_NOT_CREATED\n' > "$out/dependencies-not-created.txt"
            failed=1
          fi
          printf '%s\n' "$failed" > "$out/final-holds.exit"
          printf '{"scope":"ORIGINAL_SOURCE_GENERATED_RETIREMENT_MISSING_APPLICATION_RED","appChanged":false,"focused":"READ_ACTUAL_OWNED_FAILURE","fullSuite":"UNRUN","build":"UNRUN","browser":"UNRUN","caps":"UNRUN","readers":"UNRUN","featureQualified":false,"dependencyInventoryScope":"POST_TEST_ONLY"}\n' > "$out/SCOPE.json"
          find "$out" -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/cm-retired-son-red-evidence.sha256"
          cp "$RUNNER_TEMP/cm-retired-son-red-evidence.sha256" "$out/evidence.sha256"
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: cm-retired-son-red-${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/cm-retired-son-red
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
