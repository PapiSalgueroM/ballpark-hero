            assert.deepEqual(row.fixtureExpectedSupport, { [labels.older]: band === 'older' ? 370 : 130, [labels.newer]: band === 'newer' ? 370 : 130 });
            const next = row.placement.next;
            assert(marketByName.has(next) && next !== row.target.name && !row.skipped.includes(next));
