name: Player Bingo birth-year clean source and build join
on:
  push:
    branches: [codex/player-bingo-birth-year-clean-join-qa-20261110]
permissions:
  contents: read
  actions: read
jobs:
  closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      TZ: UTC
      SIM_NETWORK: offline
      SIM_OFFLINE_RECEIPT: player-bingo-birth-year-clean-join/offline.log
      PLAYER_BINGO_BIRTH_YEAR_REFERENCE_ARTIFACT: '13766814198'
      PLAYER_BINGO_BIRTH_YEAR_REFERENCE_RUN: '42821117398'
      PLAYER_BINGO_BIRTH_YEAR_REFERENCE_BRANCH: 'codex/player-bingo-birth-year-full-offline-retry-qa-20261110'
      PLAYER_BINGO_BIRTH_YEAR_REFERENCE_JOB: '129846599749'
      PLAYER_BINGO_BIRTH_YEAR_REFERENCE_STEPS: '24'
      PLAYER_BINGO_BIRTH_YEAR_REFERENCE_ZIP: 'ffba57783eccdc6fc5b98067222c19e7ec0b9938c2e59688e0a0c59689aff7de'
      PLAYER_BINGO_BIRTH_YEAR_REFERENCE_TAR: '78d585e2c403e6483efded0903e3eada34a50c9e85fff9f66936e8d186c8560f'
      PLAYER_BINGO_BIRTH_YEAR_REFERENCE_HEAD: 'de0ba3f226664c1d10535e53e735059f517a339d'
      PLAYER_BINGO_BIRTH_YEAR_REFERENCE_TREE: '5e6a5a128f5fb5f2ee71f5a0e26e105ab744ea0f'
      PLAYER_BINGO_BIRTH_YEAR_REFERENCE_ZIP_BYTES: '11020611'
      PLAYER_BINGO_BIRTH_YEAR_REFERENCE_BODY_COUNT: '208'
      PLAYER_BINGO_BIRTH_YEAR_NATIVE_HELPER: '636ea1f9c770d6bf50c2afed7c3687d04d494649'
      PLAYER_BINGO_BIRTH_YEAR_REFERENCE_AUDIT: '0f3ba03c84e9987d85eaa633e7e242f26b6bcd4fc5a495cd93f1cc2bb4965e65'
      PLAYER_BINGO_BIRTH_YEAR_CONTROLS_HEAD: '57e561667aa42f7cbe9bcdd081e29065ef728215'
      PLAYER_BINGO_BIRTH_YEAR_CONTROLS_TREE: '8682b0d81043bb991ea15a903a8b0317d678b992'
      PLAYER_BINGO_BIRTH_YEAR_FIXED_LIB: '885fab96ef9f463d5447245c6f1f4937ce68aafa'
      PLAYER_BINGO_BIRTH_YEAR_FIXED_LOAD_SIM: 'b76c0794a40f87f54e3766111d6a9f9f16eff548'
      PLAYER_BINGO_BIRTH_YEAR_FIXED_TRANSPORT_TEST: '9494d6e391350d9da76aa7a6a1e0f5022df3e62b'
      PLAYER_BINGO_BIRTH_YEAR_FIXED_WC_ALIAS_TEST: 'b6f57a7f4f1b14a95e90912f54cdbcc34cc3491c'
      PLAYER_BINGO_BIRTH_YEAR_QUALIFIED_PLAN_BLOB: '47f7f202eb3fbe75ec5b18307511bff41c78cd42'
      PLAYER_BINGO_BIRTH_YEAR_REFERENCE_DIST_MANIFEST: '40766004142bdebcc677fe3798d73dbcea54706f087002e2407daf4565ea53e2'
      PLAYER_BINGO_BIRTH_YEAR_REFERENCE_WORKFLOW: '20eeaa29576c619317f67a9d2ef0a82a62b45fa2'
      PLAYER_BINGO_BIRTH_YEAR_CLEAN_PRODUCT_BASE: '4ba9773714dfb05418a63ade900e27b1a5b078e7'
      PLAYER_BINGO_BIRTH_YEAR_CLEAN_PRODUCT_BASE_TREE: '6336b32fadad82db8d7f04200ec3c6fdc7e23b87'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Locked dependencies and clean source receipts
        run: |
          set -euo pipefail
          if grep -Eq '__[A-Z][A-Z0-9_]*__' .github/workflows/player-bingo-birth-year-20261110.yml; then echo 'Unresolved clean qualification template binding'; exit 1; fi
          [[ "$PLAYER_BINGO_BIRTH_YEAR_REFERENCE_ARTIFACT" =~ ^[1-9][0-9]*$ ]]
          [[ "$PLAYER_BINGO_BIRTH_YEAR_REFERENCE_RUN" =~ ^[1-9][0-9]*$ ]]
          [[ "$PLAYER_BINGO_BIRTH_YEAR_REFERENCE_BRANCH" =~ ^codex/player-bingo-birth-year-[a-z0-9-]+$ ]]
          [[ "$PLAYER_BINGO_BIRTH_YEAR_REFERENCE_JOB" =~ ^[1-9][0-9]*$ ]]
          [[ "$PLAYER_BINGO_BIRTH_YEAR_REFERENCE_STEPS" =~ ^[1-9][0-9]*$ ]]
          [[ "$PLAYER_BINGO_BIRTH_YEAR_REFERENCE_AUDIT" =~ ^[a-f0-9]{64}$ ]]
          [[ "$PLAYER_BINGO_BIRTH_YEAR_REFERENCE_ZIP" =~ ^[a-f0-9]{64}$ ]]
          [[ "$PLAYER_BINGO_BIRTH_YEAR_REFERENCE_TAR" =~ ^[a-f0-9]{64}$ ]]
          [[ "$PLAYER_BINGO_BIRTH_YEAR_REFERENCE_ZIP_BYTES" =~ ^[1-9][0-9]*$ ]]
          [[ "$PLAYER_BINGO_BIRTH_YEAR_REFERENCE_DIST_MANIFEST" =~ ^[a-f0-9]{64}$ ]]
          for value in "$PLAYER_BINGO_BIRTH_YEAR_REFERENCE_HEAD" "$PLAYER_BINGO_BIRTH_YEAR_REFERENCE_TREE" "$PLAYER_BINGO_BIRTH_YEAR_NATIVE_HELPER" "$PLAYER_BINGO_BIRTH_YEAR_REFERENCE_WORKFLOW" "$PLAYER_BINGO_BIRTH_YEAR_CONTROLS_HEAD" "$PLAYER_BINGO_BIRTH_YEAR_CONTROLS_TREE" "$PLAYER_BINGO_BIRTH_YEAR_FIXED_LIB" "$PLAYER_BINGO_BIRTH_YEAR_FIXED_LOAD_SIM" "$PLAYER_BINGO_BIRTH_YEAR_FIXED_TRANSPORT_TEST" "$PLAYER_BINGO_BIRTH_YEAR_FIXED_WC_ALIAS_TEST" "$PLAYER_BINGO_BIRTH_YEAR_QUALIFIED_PLAN_BLOB" "$PLAYER_BINGO_BIRTH_YEAR_CLEAN_PRODUCT_BASE" "$PLAYER_BINGO_BIRTH_YEAR_CLEAN_PRODUCT_BASE_TREE"; do [[ "$value" =~ ^[a-f0-9]{40}$ ]]; done
          test ! -e player-bingo-birth-year-clean-join
          mkdir player-bingo-birth-year-clean-join
          touch player-bingo-birth-year-clean-join/offline.log
          git rev-parse HEAD > player-bingo-birth-year-clean-join/head.txt
          git rev-parse 'HEAD^{tree}' > player-bingo-birth-year-clean-join/tree.txt
          git ls-files -s > player-bingo-birth-year-clean-join/source-before.txt
          sha256sum package.json package-lock.json > player-bingo-birth-year-clean-join/locks-before.txt
          npm ci 2>&1 | tee player-bingo-birth-year-clean-join/install.log
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const lock=JSON.parse(fs.readFileSync('package-lock.json'));
          const rows=Object.keys(lock.packages).filter(p=>p.startsWith('node_modules/')&&fs.existsSync(p+'/package.json')).map(p=>[p,JSON.parse(fs.readFileSync(p+'/package.json')).version]);
          assert.equal(rows.length,521);for(const[p,v]of rows)assert.equal(v,lock.packages[p].version,p);fs.writeFileSync('player-bingo-birth-year-clean-join/installed-before.json',JSON.stringify(rows));
          NODE
      - name: Proper app types
        run: |
          set -euo pipefail
          node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee player-bingo-birth-year-clean-join/types.log
      - name: Authenticate the completed full reference before extraction
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/PapiSalgueroM/ballpark-hero/actions/runs/$PLAYER_BINGO_BIRTH_YEAR_REFERENCE_RUN" > player-bingo-birth-year-clean-join/reference-run.json
          gh api "repos/PapiSalgueroM/ballpark-hero/actions/runs/$PLAYER_BINGO_BIRTH_YEAR_REFERENCE_RUN/jobs?per_page=100" > player-bingo-birth-year-clean-join/reference-jobs.json
          gh api "repos/PapiSalgueroM/ballpark-hero/actions/artifacts/$PLAYER_BINGO_BIRTH_YEAR_REFERENCE_ARTIFACT" > player-bingo-birth-year-clean-join/reference-artifact.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const env = process.env;
          const read = file => JSON.parse(fs.readFileSync('player-bingo-birth-year-clean-join/' + file));
          const run = read('reference-run.json'), jobs = read('reference-jobs.json').jobs, artifact = read('reference-artifact.json');
          assert.deepEqual(
            [run.id, run.status, run.conclusion, run.event, run.run_attempt, run.path, run.repository.full_name, run.head_sha, run.head_commit.tree_id, run.head_branch],
            [Number(env.PLAYER_BINGO_BIRTH_YEAR_REFERENCE_RUN), 'completed', 'success', 'push', 1, '.github/workflows/player-bingo-birth-year-20261110.yml', 'PapiSalgueroM/ballpark-hero', env.PLAYER_BINGO_BIRTH_YEAR_REFERENCE_HEAD, env.PLAYER_BINGO_BIRTH_YEAR_REFERENCE_TREE, env.PLAYER_BINGO_BIRTH_YEAR_REFERENCE_BRANCH],
          );
          assert.equal(jobs.length, 1);
          const [job] = jobs;
          assert.deepEqual([job.id, job.run_id, job.status, job.conclusion, job.head_sha, job.steps.length],
            [Number(env.PLAYER_BINGO_BIRTH_YEAR_REFERENCE_JOB), run.id, 'completed', 'success', run.head_sha, Number(env.PLAYER_BINGO_BIRTH_YEAR_REFERENCE_STEPS)]);
          assert(job.steps.every(step => step.status === 'completed' && step.conclusion === 'success'));
          assert.deepEqual(
            [artifact.id, artifact.name, artifact.expired, artifact.size_in_bytes, artifact.digest, artifact.workflow_run.id, artifact.workflow_run.head_sha, artifact.workflow_run.head_branch],
            [Number(env.PLAYER_BINGO_BIRTH_YEAR_REFERENCE_ARTIFACT), 'player-bingo-birth-year-full-' + run.id, false, Number(env.PLAYER_BINGO_BIRTH_YEAR_REFERENCE_ZIP_BYTES), 'sha256:' + env.PLAYER_BINGO_BIRTH_YEAR_REFERENCE_ZIP, run.id, run.head_sha, run.head_branch],
          );
          NODE
          git fetch --no-tags --depth=2 origin "$PLAYER_BINGO_BIRTH_YEAR_REFERENCE_HEAD"
          test "$(git rev-parse "$PLAYER_BINGO_BIRTH_YEAR_REFERENCE_HEAD^{tree}")" = "$PLAYER_BINGO_BIRTH_YEAR_REFERENCE_TREE"
          test "$(git rev-parse "$PLAYER_BINGO_BIRTH_YEAR_CONTROLS_HEAD^{tree}")" = "$PLAYER_BINGO_BIRTH_YEAR_CONTROLS_TREE"
          gh api "repos/PapiSalgueroM/ballpark-hero/actions/artifacts/$PLAYER_BINGO_BIRTH_YEAR_REFERENCE_ARTIFACT/zip" > "$RUNNER_TEMP/player-bingo-birth-year-full-reference.zip"
          test "$(wc -c < "$RUNNER_TEMP/player-bingo-birth-year-full-reference.zip")" -eq "$PLAYER_BINGO_BIRTH_YEAR_REFERENCE_ZIP_BYTES"
          echo "$PLAYER_BINGO_BIRTH_YEAR_REFERENCE_ZIP  $RUNNER_TEMP/player-bingo-birth-year-full-reference.zip" | sha256sum --check
          unzip -Z1 "$RUNNER_TEMP/player-bingo-birth-year-full-reference.zip" > player-bingo-birth-year-clean-join/reference-zip-entries.txt
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const names = fs.readFileSync('player-bingo-birth-year-clean-join/reference-zip-entries.txt', 'utf8').trimEnd().split('\n');
          assert.equal(new Set(names).size, names.length, 'Unique admitted ZIP paths');
          assert.equal(names.filter(name=>!name.endsWith('/')).length,Number(process.env.PLAYER_BINGO_BIRTH_YEAR_REFERENCE_BODY_COUNT),'Exact regular ZIP body count');
          for (const name of names) {
            assert(name.length && !name.includes('\\') && !name.startsWith('/'), 'Relative ZIP path');
            assert(name.replace(/\/$/, '').split('/').every(part => part && part !== '.' && part !== '..'), 'Safe ZIP path');
          }
          for (const file of ['head.txt', 'tree.txt', 'admission.json', 'unit-admission.json', 'native-admission.json', 'source-join.json', 'source-before.txt', 'source-after.txt', 'tracked-before.json', 'tracked-after.json', 'locks-before.txt', 'locks-after.txt', 'installed-before.json', 'installed-after.json', 'offline.log', 'browser.transport.log', 'prior-failed-full.json', 'weight-source-proof.json', 'weight-asset-blocks.jsonl', 'types.log', 'dist-before.json', 'dist-after.json', 'dist.tgz']) {
            assert(names.includes(file), file + ' required authenticated body');
          }
          NODE
          python3 - "$RUNNER_TEMP/player-bingo-birth-year-full-reference.zip" <<'PY'
          import stat
          import sys
          import zipfile
          with zipfile.ZipFile(sys.argv[1]) as archive:
              for entry in archive.infolist():
                  allowed = (0, stat.S_IFDIR) if entry.is_dir() else (0, stat.S_IFREG)
                  if stat.S_IFMT(entry.external_attr >> 16) not in allowed:
                      raise ValueError("Unexpected ZIP entry type: " + entry.filename)
          PY
          mkdir "$RUNNER_TEMP/player-bingo-birth-year-full-reference" "$RUNNER_TEMP/player-bingo-birth-year-full-reference-dist"
          unzip -q "$RUNNER_TEMP/player-bingo-birth-year-full-reference.zip" -d "$RUNNER_TEMP/player-bingo-birth-year-full-reference"
          test -z "$(find "$RUNNER_TEMP/player-bingo-birth-year-full-reference" -type l -print -quit)"
          echo "$PLAYER_BINGO_BIRTH_YEAR_REFERENCE_TAR  $RUNNER_TEMP/player-bingo-birth-year-full-reference/dist.tgz" | sha256sum --check
          tar -tzf "$RUNNER_TEMP/player-bingo-birth-year-full-reference/dist.tgz" > player-bingo-birth-year-clean-join/reference-tar-entries.txt
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const names = fs.readFileSync('player-bingo-birth-year-clean-join/reference-tar-entries.txt', 'utf8').trimEnd().split('\n');
          assert.equal(new Set(names).size, names.length, 'Unique admitted dist tar paths');
          for (const name of names) {
            assert(name.startsWith('dist/') && !name.includes('\\'), 'Tar stays under dist');
            assert(name.replace(/\/$/, '').split('/').every(part => part && part !== '.' && part !== '..'), 'Safe tar path');
          }
          NODE
          python3 - "$RUNNER_TEMP/player-bingo-birth-year-full-reference/dist.tgz" <<'PY'
          import sys
          import tarfile
          with tarfile.open(sys.argv[1], "r:gz") as archive:
              for entry in archive:
                  if not (entry.isdir() or entry.isfile()):
                      raise ValueError("Unexpected TAR entry type: " + entry.name)
          PY
          tar -xzf "$RUNNER_TEMP/player-bingo-birth-year-full-reference/dist.tgz" -C "$RUNNER_TEMP/player-bingo-birth-year-full-reference-dist"
          cp "$RUNNER_TEMP/player-bingo-birth-year-full-reference/source-before.txt" player-bingo-birth-year-clean-join/reference-source.txt
      - name: Fresh unchanged product-name fence on clean source
        run: |
          set -euo pipefail
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/simNoRivalNames.mjs 2>&1 | tee player-bingo-birth-year-clean-join/no-rival.log
      - name: Clean production build
        run: |
          set -euo pipefail
          NODE_OPTIONS="--max-old-space-size=6144" npm run build 2>&1 | tee player-bingo-birth-year-clean-join/build.log
      - name: Join exact clean product source and all 850 built files
        id: join
        env:
          PLAYER_BINGO_BIRTH_YEAR_REFERENCE_DIR: ${{ runner.temp }}/player-bingo-birth-year-full-reference
          PLAYER_BINGO_BIRTH_YEAR_REFERENCE_DIST: ${{ runner.temp }}/player-bingo-birth-year-full-reference-dist/dist
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          const env = process.env;
          const out = 'player-bingo-birth-year-clean-join';
          const ref = env.PLAYER_BINGO_BIRTH_YEAR_REFERENCE_DIR;
          const read = file => JSON.parse(fs.readFileSync(path.join(ref, file)));
          const bytes = file => fs.readFileSync(path.join(ref, file));
          const readOutput = file => JSON.parse(fs.readFileSync(path.join(out, file)));
          const sha = bytes => createHash('sha256').update(bytes).digest('hex');
          const blob = bytes => createHash('sha1').update('blob ' + bytes.length + '\0').update(bytes).digest('hex');
          const git = (...args) => execFileSync('git', args, {encoding:'utf8', maxBuffer:16 * 1024 * 1024});
          const workflow = '.github/workflows/player-bingo-birth-year-20261110.yml';
          const helper = 'scripts/qa/playPlayerBingoBirthYear.mjs';
          const lib = 'src/lib/playerBingo.ts';
          const sim = 'scripts/simPlayerBingoLoad.mjs';
          const transportTest = 'src/test/playerBingoTransport.test.ts';
          const aliasTest = 'src/test/playerBingoWorldCupAlias.test.ts';
          const plan = 'docs/plans/2026-11-10-player-bingo-birth-year.md';
          const configs = ['index.html','package.json','package-lock.json','vite.config.ts','tailwind.config.ts','postcss.config.js','tsconfig.json','tsconfig.app.json','tsconfig.node.json','bun.lockb','bun.lock'];
          const sourceScope = file => /^(?:src|public|scripts)\//.test(file);
          const fullOnly = new Set([workflow, helper]);
          const originalProductBlobs = {
            [lib]:'897f538765323a68a86d1d068db4fc182b52d1a5',
            [sim]:'b93fbf4f3a15258a2c88fdc75773593502897b53',
            [transportTest]:'36cb2768a5f2c422fabc22eaf5627b750b2f4682',
            [aliasTest]:'d11c81a71407314c3a5bedc88c27c91a4fe16c81',
          };
          const productPins = {
            [lib]: env.PLAYER_BINGO_BIRTH_YEAR_FIXED_LIB,
            [sim]: env.PLAYER_BINGO_BIRTH_YEAR_FIXED_LOAD_SIM,
            [transportTest]: env.PLAYER_BINGO_BIRTH_YEAR_FIXED_TRANSPORT_TEST,
            [aliasTest]: env.PLAYER_BINGO_BIRTH_YEAR_FIXED_WC_ALIAS_TEST,
          };
          const pins = {
            ...productPins, [plan]: env.PLAYER_BINGO_BIRTH_YEAR_QUALIFIED_PLAN_BLOB,
            'src/App.tsx':'8bfedf7aaa1d076e0f0c8e2216c7e46632cd8a33',
            'src/data/gameRegistry.ts':'f560b40a74d1468ac72dfde4ee6fec6635a9a255',
            'public/player-bingo/index.html':'af701f7f56f498defe0da719fcae5b63c0dd1b91',
            'src/pages/PlayerBingo.tsx':'e26d20a48216f9eb3a1faf62389d561814dcbe99',
            'src/test/playerBingoBirthYear.test.ts':'59fe4931902a6a5ca8798c9083f637418a236759',
            'scripts/lib/offlineTransport.cjs':'0fda542a2649fe5da937c6976fd0f5b6073e74b6',
          };
          const indexRows = (body, separator = '\n') => {
            const rows = body.split(separator).filter(Boolean).map(line => {
              const matched = /^(100(?:644|755)) ([0-9a-f]{40}) 0\t(.+)$/.exec(line);
              assert(matched, 'Actual regular path/mode/blob index tuple');
              return [matched[3], {mode:matched[1], blob:matched[2]}];
            });
            assert.equal(new Set(rows.map(([file]) => file)).size, rows.length, 'Unique index paths');
            return new Map(rows);
          };
          const treeRows = commit => {
            const rows = git('ls-tree', '-r', '-z', commit).split('\0').filter(Boolean).map(line => {
              const matched = /^(100(?:644|755)) blob ([0-9a-f]{40})\t(.+)$/.exec(line);
              assert(matched, 'Actual regular path/mode/blob tree tuple');
              return [matched[3], {mode:matched[1], blob:matched[2]}];
            });
            assert.equal(new Set(rows.map(([file]) => file)).size, rows.length, 'Unique tree paths');
            return new Map(rows);
          };
          const ordered = rows => [...rows].sort(([left],[right]) => left.localeCompare(right));
          const cleanHead = git('rev-parse', 'HEAD').trim(), cleanTree = git('rev-parse', 'HEAD^{tree}').trim();
          assert.deepEqual(git('rev-list', '--parents', '-n', '1', 'HEAD').trim().split(' '), [cleanHead, env.PLAYER_BINGO_BIRTH_YEAR_CLEAN_PRODUCT_BASE], 'Clean QA is the direct PR541 child');
          assert.equal(git('rev-parse', env.PLAYER_BINGO_BIRTH_YEAR_CLEAN_PRODUCT_BASE + '^{tree}').trim(), env.PLAYER_BINGO_BIRTH_YEAR_CLEAN_PRODUCT_BASE_TREE);
          assert.equal(cleanHead, env.GITHUB_SHA);
          assert.equal(fs.readFileSync(out + '/head.txt','utf8').trim(), cleanHead);
          assert.equal(fs.readFileSync(out + '/tree.txt','utf8').trim(), cleanTree);
          const base = treeRows(env.PLAYER_BINGO_BIRTH_YEAR_CLEAN_PRODUCT_BASE);
          const current = indexRows(fs.readFileSync(out + '/source-before.txt', 'utf8'));
          const old = indexRows(fs.readFileSync(out + '/reference-source.txt', 'utf8'));
          assert.deepEqual(ordered(indexRows(git('ls-files','--stage','-z'),'\0')), ordered(current));
          assert.deepEqual(ordered(treeRows(cleanHead)), ordered(current), 'Clean index joins exact committed tree tuples');
          assert.deepEqual([base.size,current.size,old.size],[5800,5802,5803]);
          const allowedClean = [...Object.keys(productPins),plan,workflow];
          const cleanDelta = [...new Set([...base.keys(), ...current.keys()])].filter(file => {
            const before = base.get(file), after = current.get(file);
            return before?.mode !== after?.mode || before?.blob !== after?.blob;
          }).sort();
          assert.deepEqual(cleanDelta,allowedClean.slice().sort(),'Exactly four qualified bodies and two owned new leaves');
          assert.equal(base.size-Object.keys(productPins).length,5796);
          for (const [file,before] of Object.entries(originalProductBlobs)) {
            assert.equal(base.get(file)?.blob,before,file+' exact PR541 original');
            assert.equal(current.get(file)?.mode,base.get(file)?.mode,file+' held mode');
            assert.notEqual(current.get(file)?.blob,before,file+' changed qualified product bytes');
          }
          for (const file of [plan,workflow]) assert(!base.has(file) && current.get(file)?.mode==='100644',file+' exact owned new leaf');
          const fullHead = env.PLAYER_BINGO_BIRTH_YEAR_REFERENCE_HEAD;
          const controlsHead = env.PLAYER_BINGO_BIRTH_YEAR_CONTROLS_HEAD;
          assert.deepEqual(git('rev-list','--parents','-n','1',fullHead).trim().split(' '),[fullHead,controlsHead],'Full QA is the direct controls child');
          assert.equal(git('rev-parse',fullHead+'^{tree}').trim(),env.PLAYER_BINGO_BIRTH_YEAR_REFERENCE_TREE);
          assert.equal(git('rev-parse',controlsHead+'^{tree}').trim(),env.PLAYER_BINGO_BIRTH_YEAR_CONTROLS_TREE);
          const controls = treeRows(controlsHead);
          assert.equal(controls.size,5802);
          assert.deepEqual(ordered(treeRows(fullHead)),ordered(old),'Actual full packet index joins the immutable full commit tree');
          assert.deepEqual(git('diff','--name-status','--no-renames',controlsHead,fullHead).trim().split('\n').sort(),
