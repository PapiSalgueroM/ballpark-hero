name: Player Bingo birth-year boundary controls
on:
  push:
    branches: [codex/player-bingo-birth-year-controls-qa-20261110]
permissions:
  actions: read
  contents: read
jobs:
  controls:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: UTC
      SIM_NETWORK: offline
      SIM_OFFLINE_RECEIPT: player-bingo-birth-year-controls/offline.log
      PLAYER_BINGO_BIRTH_YEAR_RAW: player-bingo-birth-year-controls/public-cases.raw.json
      EVIDENCE: player-bingo-birth-year-controls
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 4
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - name: Authenticate admitted inputs and exact isolated role source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test ! -e "$EVIDENCE"
          if grep -Eq '__[A-Z][A-Z0-9_]*__' .github/workflows/player-bingo-birth-year-20261110.yml; then echo 'Unresolved role binding'; exit 1; fi
          mkdir "$EVIDENCE"
          touch "$SIM_OFFLINE_RECEIPT"
          git rev-parse HEAD > "$EVIDENCE/head.txt"
          git rev-parse 'HEAD^{tree}' > "$EVIDENCE/tree.txt"
          git ls-files -s > "$EVIDENCE/source-before.txt"
          sha256sum package.json package-lock.json > "$EVIDENCE/locks-before.txt"
          git diff --exit-code HEAD -- .
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';

          const out = process.env.EVIDENCE;
          const repo = 'PapiSalgueroM/ballpark-hero';
          const workflow = '.github/workflows/player-bingo-birth-year-20261110.yml';
          const productParent = '4ba9773714dfb05418a63ade900e27b1a5b078e7';
          const productTree = '6336b32fadad82db8d7f04200ec3c6fdc7e23b87';
          const plan = 'docs/plans/2026-11-10-player-bingo-birth-year.md';
          const roles = { original: {"run":42813505581,"job":129820612478,"artifact":13763032974,"steps":12,"zipBytes":1037461,"zipSHA256":"791be9d50c101b6e7e24528ba2e7306c266649a69330884704d1bf31a2ab5c88","head":"d1ff57bf7a6bc611a8bd1f56e28f8dc58f950bbe","tree":"e1ad2d43e06856ea3c49e6819e770ad7f94cd38c","workflow":"4c82704255808f138c20f96be03fed1ad310ffce","branch":"codex/player-bingo-birth-year-original-qa-20261110","auditSHA256":"be83ea9923697a6723b8afc2672066dd30f87d153d2097fd4f41d0e923737251","raw":{"bytes":2142,"sha256":"87b4a2ec7d841e89e5f85638f0e52d4e8706587fa760faee0540985a1d84b637"}}, fixed: {"run":42815490778,"job":129827392210,"artifact":13764890039,"steps":13,"zipBytes":1068682,"zipSHA256":"5bc97eaeb125d42dac19a41597ab4044eaafc80bbf7db90ab5f58d2a8c2aafa3","head":"ce46cdf166331e4bfb079cb3975fdc69dc6c3b54","tree":"a6cc74f18706f26ae868f97b1d7d48e8a8597d6f","workflow":"53f5633a71baadb95a15c46ed59164356344a0b5","branch":"codex/player-bingo-birth-year-fixed-qa-20261110","auditSHA256":"d343d8068996ada563a73324438c0fdaf5a5993103b2964fa7fbf5b94005136a","raw":{"bytes":2174,"sha256":"5747e56b6b64e3c06801475aac72e24d69d2aa43a44d00f9e840b4c2d7925ba0"}} };
          const pins = {"scripts/simPlayerBingoLoad.mjs":{"before":"b93fbf4f3a15258a2c88fdc75773593502897b53","after":"b76c0794a40f87f54e3766111d6a9f9f16eff548"},"src/lib/playerBingo.ts":{"before":"897f538765323a68a86d1d068db4fc182b52d1a5","after":"885fab96ef9f463d5447245c6f1f4937ce68aafa"},"src/test/playerBingoTransport.test.ts":{"before":"8fed620437ee3a544dd5e186b457ad1b2d619343","after":"9494d6e391350d9da76aa7a6a1e0f5022df3e62b"},"src/test/playerBingoWorldCupAlias.test.ts":{"before":"d11c81a71407314c3a5bedc88c27c91a4fe16c81","after":"b6f57a7f4f1b14a95e90912f54cdbcc34cc3491c"}};
          const paths = ['scripts/simPlayerBingoLoad.mjs','src/lib/playerBingo.ts','src/test/playerBingoTransport.test.ts','src/test/playerBingoWorldCupAlias.test.ts'];
          const heldOriginal = {
            'scripts/simPlayerBingoLoad.mjs':'b93fbf4f3a15258a2c88fdc75773593502897b53',
            'src/lib/playerBingo.ts':'897f538765323a68a86d1d068db4fc182b52d1a5',
            'src/test/playerBingoWorldCupAlias.test.ts':'d11c81a71407314c3a5bedc88c27c91a4fe16c81',
          };
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8', maxBuffer: 16 * 1024 * 1024 }).trimEnd();
          const bytes = (...args) => execFileSync('git', args, { maxBuffer: 16 * 1024 * 1024 });
          const hash = (algorithm, body) => createHash(algorithm).update(body).digest('hex');
          const blob = body => hash('sha1', Buffer.concat([Buffer.from('blob ' + body.length + '\0'), body]));
          const head = git('rev-parse','HEAD');
          const tree = ref => git('ls-tree','-r','-z',ref).split('\0').filter(Boolean);
          const at = (ref,file) => git('rev-parse',ref+':'+file);
          const original = roles.original;
          const parent = roles.fixed;
          assert.equal(head, process.env.GITHUB_SHA);
          assert.equal(process.env.GITHUB_REPOSITORY, repo);
          assert.deepEqual(git('rev-list','--parents','-n','1','HEAD').split(' '),[head,parent.head]);
          assert.equal(git('rev-parse', parent.head+'^{tree}'), parent.tree);
          assert.equal(git('rev-parse', productParent+'^{tree}'), productTree);
          assert.deepEqual(git('rev-list','--parents','-n','1',original.head).split(' '),[original.head,productParent]);
          assert.equal(at(original.head,plan),'47f7f202eb3fbe75ec5b18307511bff41c78cd42');
          assert.equal(at('HEAD',plan),at(original.head,plan));
          assert.deepEqual(Object.keys(pins).sort(),paths);
          for (const [file, pair] of Object.entries(pins)) {
            assert.deepEqual(Object.keys(pair).sort(),['after','before']);
            assert.match(pair.before,/^[0-9a-f]{40}$/);
            assert.match(pair.after,/^[0-9a-f]{40}$/);
            assert.notEqual(pair.before,pair.after,file);
            assert.equal(at(original.head,file),pair.before,file);
            if (Object.hasOwn(heldOriginal,file)) assert.equal(pair.before,heldOriginal[file],file);
            assert.equal(at('HEAD',file),pair.after,file);
            assert.equal(blob(fs.readFileSync(file)),pair.after,file);
          }
          const fixedHead = roles.fixed.head;
          const fixedChanges = [...paths,workflow].sort();
          const exactDelta = (base, current, files, heldRows) => {
            assert.deepEqual(git('diff','--name-status','--no-renames',base,current).split('\n').sort(),files.map(file=>'M\t'+file).sort());
            const previous = tree(base), next = tree(current);
            const hold = rows => rows.filter(row => !files.includes(row.split('\t')[1]));
            assert.deepEqual([previous.length,next.length,hold(previous).length],[5802,5802,heldRows]);
            assert.deepEqual(hold(previous),hold(next));
            for (const file of files) {
              for (const rows of [previous,next]) assert(rows.some(row => row.startsWith('100644 blob ') && row.split('\t')[1] === file),file);
            }
          };
          exactDelta(original.head,fixedHead,fixedChanges,5797);
          assert.deepEqual([roles.fixed.head,roles.fixed.tree],['ce46cdf166331e4bfb079cb3975fdc69dc6c3b54','a6cc74f18706f26ae868f97b1d7d48e8a8597d6f']);
          assert.deepEqual(git('rev-list','--parents','-n','1',roles.fixed.head).split(' '),[roles.fixed.head,original.head]);
          exactDelta(roles.fixed.head,'HEAD',[workflow],5801);
          assert.equal(tree('HEAD').filter(row => /^(src|public|scripts)\//.test(row.split('\t')[1])).length,4669);
          const configs = ['index.html','package.json','package-lock.json','vite.config.ts','tailwind.config.ts','postcss.config.js','tsconfig.json','tsconfig.app.json','tsconfig.node.json','bun.lockb','bun.lock'];
          for (const file of configs) assert.equal(at('HEAD',file),at(original.head,file),file);
          assert.equal(at('HEAD','src/pages/PlayerBingo.tsx'),'e26d20a48216f9eb3a1faf62389d561814dcbe99');
          assert.equal(at('HEAD','public/player-bingo/index.html'),'af701f7f56f498defe0da719fcae5b63c0dd1b91');
          const api = process.env.GITHUB_API_URL + '/repos/' + repo;
          const request = async path => {
            const response = await fetch(api+path,{headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+process.env.GH_TOKEN,'X-GitHub-Api-Version':'2022-11-28'},redirect:'error'});
            assert.equal(response.status,200,path);
            return response.json();
          };
          for (const [role,pin] of Object.entries(roles)) {
            for (const value of [pin.run,pin.job,pin.artifact,pin.steps,pin.zipBytes,pin.raw.bytes]) assert(Number.isSafeInteger(value) && value > 0);
            for (const value of [pin.zipSHA256,pin.auditSHA256,pin.raw.sha256]) assert.match(value,/^[0-9a-f]{64}$/);
            assert.equal(git('rev-parse',pin.head+'^{tree}'),pin.tree);
            assert.equal(at(pin.head,workflow),pin.workflow);
            const [run,jobs,artifact] = await Promise.all([
              request('/actions/runs/'+pin.run),request('/actions/runs/'+pin.run+'/jobs?per_page=100'),request('/actions/artifacts/'+pin.artifact),
            ]);
            assert.deepEqual([run.id,run.status,run.conclusion,run.event,run.run_attempt,run.path,run.head_sha,run.head_commit.tree_id,run.head_branch,run.repository.full_name],
              [pin.run,'completed','success','push',1,workflow,pin.head,pin.tree,pin.branch,repo],role);
            assert.equal(jobs.jobs.length,1,role);
            const [job] = jobs.jobs;
            assert.deepEqual([job.id,job.run_id,job.name,job.status,job.conclusion,job.head_sha,job.steps.length],
              [pin.job,pin.run,role,'completed','success',pin.head,pin.steps],role);
            assert(job.steps.every(step => step.status === 'completed' && step.conclusion === 'success'),role);
            assert.deepEqual([artifact.id,artifact.name,artifact.expired,artifact.size_in_bytes,artifact.digest,artifact.workflow_run.id,artifact.workflow_run.head_sha],
              [pin.artifact,'player-bingo-birth-year-'+role+'-'+pin.run,false,pin.zipBytes,'sha256:'+pin.zipSHA256,pin.run,pin.head],role);
          }
          delete process.env.GH_TOKEN;
          const bodies = {};
          for (const file of [...paths,plan,workflow]) {
            for (const [role,ref] of [['original',original.head],['candidate','HEAD']]) {
              const body = bytes('show',ref+':'+file), name = role+'-'+file.slice(file.lastIndexOf('/')+1);
              fs.writeFileSync(out+'/'+name,body);
              bodies[name] = {path:file,bytes:body.length,sha256:hash('sha256',body),blob:blob(body)};
              assert.equal(bodies[name].blob,at(ref,file),file);
            }
          }
          fs.writeFileSync(out+'/source-receipt.json',JSON.stringify({
            status:'passed',head,tree:git('rev-parse','HEAD^{tree}'),parent:parent.head,parentTree:parent.tree,
            productParent,productTree,roles,pins,bodies,ownedWorkflow:at('HEAD',workflow),heldRows:5801,trackedRows:5802,sourceRows:4669,rootConfigurations:11,
            activePreflight:{run:42810749109,job:129811240337,artifact:13761423919,independentAuditSHA256:'ac0c6a780adf38d07c25d18bc5b9455b76581b28726061c0e9b284ae72c14f6c'},
          },null,2));
          NODE
      - name: Install locked dependencies and freeze physical source
        run: |
          set -euo pipefail
          npm ci 2>&1 | tee "$EVIDENCE/install.log"
          cat > "$EVIDENCE/physical.mjs" <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          const stage = process.argv[2];
          assert(['before', 'after'].includes(stage));
          const out = process.env.EVIDENCE;
          const index = execFileSync('git', ['ls-files', '-z'], { encoding: 'utf8' }).split('\0').filter(Boolean);
          const source = index.map(file => {
            const bytes = fs.readFileSync(file);
            return [file, bytes.length, createHash('sha256').update(bytes).digest('hex')];
          });
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const installed = Object.entries(lock.packages).filter(([file]) =>
            file.startsWith('node_modules/') && fs.existsSync(file + '/package.json')
          ).map(([file, entry]) => {
            const version = JSON.parse(fs.readFileSync(file + '/package.json', 'utf8')).version;
            assert.equal(version, entry.version, file);
            return [file, version];
          });
          assert.equal(source.length, 5802);
          assert.equal(installed.length, 521);
          assert.equal(fs.statSync(process.env.SIM_OFFLINE_RECEIPT).size, 0);
          for (const [name, data] of [['tracked', source], ['installed', installed]]) {
            const body = JSON.stringify(data);
            if (stage === 'after') assert.equal(body, fs.readFileSync(out + '/' + name + '-before.json', 'utf8'));
            fs.writeFileSync(out + '/' + name + '-' + stage + '.json', body);
          }
          NODE
          node "$EVIDENCE/physical.mjs" before
      - name: Proper app types
        run: |
          set -euo pipefail
          node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee "$EVIDENCE/types.log"
      - name: Run fixed, three distinct physical controls, and exact restoration
        run: |
          set -euo pipefail
          cat > "$EVIDENCE/control-driver.mjs" <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import { createHash } from 'node:crypto';
          import { execFileSync, spawnSync } from 'node:child_process';

          const { EVIDENCE: out, SIM_OFFLINE_RECEIPT } = process.env;
          const { roles, pins } = JSON.parse(fs.readFileSync(path.join(out,'source-receipt.json')));
          const controls = [{"name":"apply","anchor":"    applyBingoBirthYears(pool, wc.birthDates);","replacement":"    applyBingoBirthYears(pool, new Map());","blob":"e59cb28959b9ce3aca3e5d3d450403bbaa172d34","sha256":"fcab69881ed7758ff50249cbdbc0fbe12f286ad0156dbd0df3dcd43986d3254f"},{"name":"nationality","anchor":"  return name && country ? name + '\\0' + country : '';","replacement":"  return name && country ? name : '';","blob":"7aa2d946e388f18a502df42f337f0f6dc89f3b11","sha256":"5f89f4ed7f0432d6e8c31f0b4308c8da4c120dafd8d68efa447f8f7e547ee86f"},{"name":"conflict","anchor":"        if (previous !== date) birthDates.set(birthKey, previous === undefined ? date : null);","replacement":"        if (previous === undefined) birthDates.set(birthKey, date);","blob":"1d79b3674a990562d332168bd42a6e10224eb01f","sha256":"b6640b70414d155e081afef8108254ae2d4a0ba528749f5f2fb46a3f88b17fca"}];
          const roleOrder = ['fixed','apply','nationality','conflict','restored'];
          assert.deepEqual(controls.map(control => control.name),roleOrder.slice(1,-1));
          const product = 'src/lib/playerBingo.ts';
          const transport = 'src/test/playerBingoTransport.test.ts';
          const suites = { [transport]:12, 'src/test/playerBingoBirthYear.test.ts':2, 'src/test/playerBingoWorldCupAlias.test.ts':9 };
          const heldTransportTitles = ["preserves query predicates row transforms and complete paged output","limits latest-row chunk requests to three while preserving all seven chunks","limits paged history chunk requests to three without truncating seven pages","forwards one owned signal to every existing query kind","starts no reads when the caller already abandoned the load","caller cancellation stops queued latest chunks and never starts history","caller cancellation stops queued history chunks and further pagination","a failed latest request aborts siblings and pending chunks without partial data","a failed history request aborts siblings and pending chunks without partial data","a failed World Cup read cancels other initial pool requests immediately","a just-resolved latest chunk cannot start queued work after cancellation"];
          const title = 'BINGO_SQUAD_BIRTH_YEAR_BAND uses a reliable squad birth date for the correct age tile';
          const marker = 'BINGO_SQUAD_BIRTH_YEAR_BAND';
          const sha = (algorithm,body) => createHash(algorithm).update(body).digest('hex');
          const blob = body => sha('sha1',Buffer.concat([Buffer.from('blob '+body.length+'\0'),body]));
          const rawPin = body => ({bytes:body.length,sha256:sha('sha256',body)});
          const git = (...args) => execFileSync('git',args,{maxBuffer:16*1024*1024});
          const index = fs.readFileSync(path.join(out,'source-before.txt'));
          const held = JSON.parse(fs.readFileSync(path.join(out,'tracked-before.json'))).filter(([file]) => file!==product);
          assert.equal(held.length,5801);
          const verifyHeld = () => {
            assert(git('ls-files','-s').equals(index));
            assert.equal(fs.statSync(SIM_OFFLINE_RECEIPT).size,0);
            for (const [file,bytes,digest] of held) {
              const body = fs.readFileSync(file);
              assert.deepEqual(rawPin(body),{bytes,sha256:digest},file);
            }
          };
          const fixed = fs.readFileSync(product);
          assert.equal(blob(fixed),pins[product].after);
          const fixedText = fixed.toString('utf8');
          assert(Buffer.from(fixedText).equals(fixed));
          const distinct = new Set([blob(fixed),pins[product].before]);
          const changedSources = new Map(controls.map(spec => {
            assert.deepEqual(Object.keys(spec).sort(),['anchor','blob','name','replacement','sha256']);
            assert(typeof spec.anchor === 'string' && spec.anchor.length>0 && typeof spec.replacement === 'string');
            assert.notEqual(spec.anchor,spec.replacement,spec.name);
            const offset = fixedText.indexOf(spec.anchor);
            assert(offset>=0 && fixedText.indexOf(spec.anchor,offset+spec.anchor.length)<0,spec.name+' exact unique source anchor');
            const changed = fixedText.slice(0,offset)+spec.replacement+fixedText.slice(offset+spec.anchor.length);
            const inverse = changed.slice(0,offset)+spec.anchor+changed.slice(offset+spec.replacement.length);
            assert.equal(inverse,fixedText,spec.name+' full inverse');
            const body = Buffer.from(changed);
            assert.equal(blob(body),spec.blob,spec.name);
            assert.equal(sha('sha256',body),spec.sha256,spec.name);
            assert(!distinct.has(spec.blob),spec.name+' must create a distinct full physical source');
            distinct.add(spec.blob);
            return [spec.name,{body,offset:Buffer.byteLength(fixedText.slice(0,offset)),beforeBytes:Buffer.byteLength(spec.anchor),afterBytes:Buffer.byteLength(spec.replacement)}];
          }));
          const older = [false,true,false,false], younger = [false,false,true,false];
          const differences = {
            apply: {'jan1-boundary':[younger,older],'jan27-snapshot-offset':[younger,older]},
            nationality: {'wrong-country':[older,younger]},
            conflict: {'conflicting-dob':[older,younger]},
          };
          const runs = {};
          let fixedRaw, fixedEvidence;
          verifyHeld();
          try {
            for (const role of roleOrder) {
              const red = changedSources.has(role);
              const control = changedSources.get(role);
              const body = red ? control.body : fixed;
              const dir = path.join(out,role);
              fs.mkdirSync(dir);
              if (role !== 'fixed') {
                assert(!fs.readFileSync(product).equals(body),role+' must change physical bytes');
                fs.writeFileSync(product,body);
              }
              assert(fs.readFileSync(product).equals(body),role);
              const diff = () => git('diff','--name-only','HEAD').toString('utf8').trimEnd().split('\n').filter(Boolean);
              assert.deepEqual(diff(),red?[product]:[],role);
              fs.writeFileSync(path.join(dir,'playerBingo.ts'),body);
              const rawPath = path.join(dir,'public-cases.raw.json'), reportPath = path.join(dir,'vitest.json');
              const result = spawnSync(process.execPath,['node_modules/vitest/vitest.mjs','run',...Object.keys(suites),
                '--reporter=default','--reporter=json','--outputFile='+reportPath],{
                env:{...process.env,PLAYER_BINGO_BIRTH_YEAR_RAW:rawPath,NODE_OPTIONS:'--require='+process.cwd()+'/scripts/lib/offlineTransport.cjs'},
                maxBuffer:16*1024*1024,timeout:120000,
              });
              const stdout = result.stdout || Buffer.alloc(0), stderr = result.stderr || Buffer.alloc(0);
              const log = Buffer.concat([stdout,stderr]);
              fs.writeFileSync(path.join(dir,'vitest.log'),log);
              fs.writeFileSync(path.join(dir,'vitest-exit.txt'),String(result.status)+'\n');
              process.stdout.write(stdout);
              process.stderr.write(stderr);
              assert.equal(result.error,undefined,role);
              assert.equal(result.signal,null,role);
              assert.equal(result.status,red?1:0,role);
              assert(!/Unhandled Errors?|Unhandled Rejection|Uncaught Exception|Failed Suites|Worker exited|Test timed out/i.test(log.toString('utf8')),role);
              const report = JSON.parse(fs.readFileSync(reportPath));
              assert.deepEqual([report.numTotalTests,report.numPassedTests,report.numFailedTests,report.numPendingTests,report.numTodoTests,report.success],
                [23,red?22:23,red?1:0,0,0,!red],role);
              assert.equal(report.testResults.length,3,role);
              for (const key of ['errors','unhandledErrors','testExecutionErrors']) if (Object.hasOwn(report,key)) assert.deepEqual(report[key],[]);
              for (const [file,count] of Object.entries(suites)) {
                const matching = report.testResults.filter(suite => suite.name.endsWith('/'+file));
                assert.equal(matching.length,1,file);
                const [suite] = matching;
                const redSuite = red && file===transport;
                assert.deepEqual([suite.status,suite.message,suite.assertionResults.length],[redSuite?'failed':'passed','',count],file);
                if (file===transport) assert.deepEqual(suite.assertionResults.map(row => row.title).sort(),[...heldTransportTitles,title].sort());
                for (const row of suite.assertionResults) {
                  const expectedRed = redSuite && row.title===title;
                  assert.deepEqual([row.status,row.failureMessages.length],[expectedRed?'failed':'passed',expectedRed?1:0],row.fullName);
                  if (expectedRed) assert(row.failureMessages[0].startsWith('AssertionError: '+marker+':'),row.fullName);
                }
              }
              const raw = fs.readFileSync(rawPath);
              const evidence = JSON.parse(raw);
              assert(raw.equals(Buffer.from(JSON.stringify(evidence)+'\n')),role+' exact compact encoding');
              assert.equal(evidence.schema,'player-bingo-squad-birth-year-band-v1');
              assert.equal(evidence.rows.length,10);
              assert.deepEqual(evidence.worldCup,[
                {columns:['player_name','world_cup_year','nationality','date_of_birth'],range:[0,999]},
                {columns:['player_name','world_cup_year','nationality','date_of_birth'],range:[1000,1999]},
              ]);
              if (role==='fixed') {
                assert.deepEqual(rawPin(raw),roles.fixed.raw);
                fixedRaw = raw;
                fixedEvidence = evidence;
              } else if (role==='restored') {
                assert(raw.equals(fixedRaw),'Restored raw bytes exactly equal the fixed run');
              } else {
                const expected = structuredClone(fixedEvidence);
                for (const [id,[before,after]] of Object.entries(differences[role])) {
                  const matches = expected.rows.filter(row => row.id===id);
                  assert.equal(matches.length,1,id);
                  const [row] = matches;
                  assert.deepEqual([row.matches,row.support],[before,before],id);
                  row.matches = after;
                  row.support = after;
                }
                assert.deepEqual(evidence,expected,role+' only changes the exact intended matches and support vectors');
                assert(!raw.equals(fixedRaw),role);
                if (role==='apply') {
                  const originalProjection = structuredClone(evidence);
                  originalProjection.worldCup.forEach(query => {query.columns = query.columns.slice(0,3);});
                  assert.deepEqual(rawPin(Buffer.from(JSON.stringify(originalProjection)+'\n')),roles.original.raw,'Same original behavior apart from the held four-column query');
                }
              }
              assert(fs.readFileSync(product).equals(body),role+' product bytes held through test');
              assert.deepEqual(diff(),red?[product]:[],role);
              verifyHeld();
              runs[role] = {
                cases:23,passes:red?22:23,namedBusinessFailures:red?[marker]:[],changedRows:red?Object.keys(differences[role]):[],
                source:{blob:blob(body),...rawPin(body)},raw:rawPin(raw),
                physicalSpan:red?{offset:control.offset,beforeBytes:control.beforeBytes,afterBytes:control.afterBytes,wholeInverse:true}:null,
              };
            }
            assert.equal(new Set(Object.values(runs).slice(0,4).map(run => run.raw.sha256)).size,4,'All three controls have distinct actual evidence');
          } finally {
            if (!fs.readFileSync(product).equals(fixed)) fs.writeFileSync(product,fixed);
          }
          assert(fs.readFileSync(product).equals(fixed));
          verifyHeld();
          assert.equal(git('diff','--name-only','HEAD').length,0);
          fs.writeFileSync(path.join(out,'admission.json'),JSON.stringify({
            status:'passed',roleOrder,cases:115,passes:112,namedBusinessFailures:3,onlyPhysicalProductPath:product,
            restoredExactFixed:true,fixedRestoredRawLiteral:true,originalBehaviorApartFromProjection:true,runs,
          },null,2)+'\n',{flag:'wx'});
          NODE
          node "$EVIDENCE/control-driver.mjs" 2>&1 | tee "$EVIDENCE/control-driver.log"
      - name: Verify unchanged physical source and locked offline run
        if: always()
        run: |
          set -euo pipefail
          git ls-files -s > "$EVIDENCE/source-after.txt"
          sha256sum package.json package-lock.json > "$EVIDENCE/locks-after.txt"
          cmp "$EVIDENCE/source-before.txt" "$EVIDENCE/source-after.txt"
          cmp "$EVIDENCE/locks-before.txt" "$EVIDENCE/locks-after.txt"
          git diff --exit-code HEAD -- .
          node "$EVIDENCE/physical.mjs" after
          test ! -s "$SIM_OFFLINE_RECEIPT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: player-bingo-birth-year-controls-${{ github.run_id }}
          path: player-bingo-birth-year-controls
          retention-days: 14
          if-no-files-found: error
