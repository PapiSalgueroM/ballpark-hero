            const marketReads = row.fixtureReads.filter(read => read.table === 'player_market_values');
            for (const [kind, count] of [['seed',1],['latest',13],['history',7]]) {
              const reads = marketReads.filter(read => read.kind === kind);
              assert.equal(reads.length, count);
              if (kind !== 'seed') assert.deepEqual(reads.flatMap(read => read.selected).sort(), [...marketByName.keys()].sort());
              for (const read of reads) {
