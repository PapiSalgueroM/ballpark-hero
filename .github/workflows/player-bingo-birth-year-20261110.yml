          assert.equal(src.helperBlob,process.env.BINGO_NATIVE_HELPER_BLOB);
          assert.equal(native.schema,'player-bingo-birth-year-native-admission-v1');
          assert.equal(native.helperSHA256,process.env.BINGO_NATIVE_HELPER_SHA256);
          assert.equal(native.route,'http://127.0.0.1:4174/player-bingo');
          assert.equal(native.cases.length,24);
          assert.equal(native.heldBodies.length,51);
