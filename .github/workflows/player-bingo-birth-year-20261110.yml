            totals.squadPages += pages.length;
            totals.locks += Number(locks);
            totals.adjacentRejections += Number(!locks);
            totals.pngs += 2;
          }
          assert.equal(nonces.size, 24);
          assert.deepEqual(totals, { cases: 24, documents: 24, fixtureGets: 576, squadPages: 48, locks: 21, adjacentRejections: 3, pngs: 48 });
          assert.deepEqual(report.totals, totals);
          assert.equal(heldBodies.length, 51);
          assert.deepEqual(readdirSync(out).sort(), heldBodies.map(row => row.file).sort());
