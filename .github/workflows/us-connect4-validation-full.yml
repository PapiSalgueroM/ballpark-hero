name: US Connect 4 full default suite
on:
  push:
    branches: [codex/us-connect4-validation-qualify-20261030]
permissions:
  contents: read
jobs:
  full-default:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      CI: 'true'
      SIM_NETWORK: offline
      GIT_OPTIONAL_LOCKS: '0'
      EXPECTED_MAIN: 28e7392f38f04a3af6da33e71ec5625ca1e2cd9f
      EXPECTED_PARENT: 30fcb93aa22fe140cf0f785fcee96bc49a5a2d56
      EXPECTED_TREE: 179ff5c59527eb242fd0114cd9450836f125abf7
      TEST_SHA256: ab4d4534ed59b5337b8aa1629edfb628993db95f6f5426b44ce2a6c9d5eaf92d
      CONTROLLER_SHA256: f15d39ef721a97ca99f53ab22d4868643f432a88c6ad0350a2cc2e4644f64370
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Bind fixed product and exact shared qualification source
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/usc4-full"
          test ! -e "$out"
          mkdir -p "$out/runtime-tmp"
          echo "USC4_OUT=$out" >> "$GITHUB_ENV"
          echo "PLACEMENT_OUT=$out" >> "$GITHUB_ENV"
          echo "TMPDIR=$out/runtime-tmp" >> "$GITHUB_ENV"
          test "$GITHUB_REF_NAME" = codex/us-connect4-validation-qualify-20261030
          test "$(git rev-list --parents -n1 HEAD)" = "$GITHUB_SHA $EXPECTED_PARENT"
          test "$(git rev-list --parents -n1 "$EXPECTED_PARENT")" = "$EXPECTED_PARENT $EXPECTED_MAIN"
          test "$(git rev-parse "$EXPECTED_PARENT^{tree}")" = "$EXPECTED_TREE"
          test "$(git ls-files | wc -l)" -eq 5457
          git diff --name-status "$EXPECTED_MAIN" "$EXPECTED_PARENT" > "$out/product.paths"
          printf 'M\tsrc/hooks/useMlbConnect4.ts\nM\tsrc/hooks/useNbaConnect4.ts\nM\tsrc/hooks/useNflConnect4.ts\nM\tsrc/hooks/useNhlConnect4.ts\nM\tsrc/pages/MlbConnect4.tsx\nM\tsrc/pages/NbaConnect4.tsx\nM\tsrc/pages/NflConnect4.tsx\nM\tsrc/pages/NhlConnect4.tsx\nA\tsrc/test/usConnect4ValidationLock.test.tsx\n' > "$out/expected-product.paths"
          cmp "$out/product.paths" "$out/expected-product.paths"
          git diff --name-status "$EXPECTED_PARENT" HEAD > "$out/proof.paths"
          printf 'A\t.github/workflows/us-connect4-validation-full.yml\nA\t.github/workflows/us-connect4-validation-game.yml\nA\tscripts/qa/playUsConnect4ValidationLock.mjs\nA\tscripts/qa/usConnect4FullPositive.cjs\n' > "$out/expected-proof.paths"
          cmp "$out/proof.paths" "$out/expected-proof.paths"
          test "$(sha256sum src/test/usConnect4ValidationLock.test.tsx | cut -d' ' -f1)" = "$TEST_SHA256"
          test "$(sha256sum scripts/qa/usConnect4FullPositive.cjs | cut -d' ' -f1)" = "$CONTROLLER_SHA256"
          test "$(git hash-object src/hooks/useNbaConnect4.ts)" = 708173aba81a7fb5a68113d5bebed38523713aa0
          test "$(git hash-object src/pages/NbaConnect4.tsx)" = 90a1ab7379758268d296939b287f4930414cfe02
          test "$(git hash-object src/hooks/useNflConnect4.ts)" = d5d03522e3a53058f8e4bbf721241e8f93c58a04
          test "$(git hash-object src/pages/NflConnect4.tsx)" = 40127b56b60e50bbfff64b85b64b37e1b7a745a6
          test "$(git hash-object src/hooks/useNhlConnect4.ts)" = 0a64f4ea2c3ec1211a0b10456d04aedf94dea61a
          test "$(git hash-object src/pages/NhlConnect4.tsx)" = 46040748080f86ad2732714627feb773f3bb9468
          test "$(git hash-object src/hooks/useMlbConnect4.ts)" = 1f3695ec3ab5ba994806ab1f830f96b053be81a6
          test "$(git hash-object src/pages/MlbConnect4.tsx)" = 3fc3864882e540ef42e8a7e36c580642148473a2
          test "$(git hash-object scripts/sweepWeight.mjs)" = 084cce2062686259437cd2a334093a561c819c36
          git ls-files -z | sort -z > "$out/source-members.initial"
          xargs -0 sha256sum < "$out/source-members.initial" > "$out/source.initial.sha256"
          git ls-files --others --exclude-standard -z | sort -z > "$out/untracked.initial"
          test ! -s "$out/untracked.initial"
          git for-each-ref --format='%(refname) %(objectname)' > "$out/refs.before"
          git rev-parse HEAD > "$out/head.txt"
          git rev-parse 'HEAD^{tree}' > "$out/tree.txt"
          git archive --format=tar HEAD > "$out/source.tar"
          cp scripts/qa/usConnect4FullPositive.cjs "$out/full-default-controller.cjs"
          cmp scripts/qa/usConnect4FullPositive.cjs "$out/full-default-controller.cjs"
          sha256sum "$out/full-default-controller.cjs" > "$out/controller-copy.sha256"
          raw=0
          node --check scripts/qa/usConnect4FullPositive.cjs > "$out/syntax.stdout" 2> "$out/syntax.stderr" || raw=$?
          printf '%s\n' "$raw" > "$out/syntax.exit"
          test "$raw" -eq 0
          test ! -s "$out/syntax.stdout"
          test ! -s "$out/syntax.stderr"
      - name: Locked dependencies and actual application types
        run: |
          set -euo pipefail
          out="$USC4_OUT"
          raw=0
          env -u NODE_OPTIONS npm ci > "$out/npm-ci.stdout" 2> "$out/npm-ci.stderr" || raw=$?
          printf '%s\n' "$raw" > "$out/npm-ci.exit"
          test "$raw" -eq 0
          raw=0
          : > "$out/types.transport"
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$out/types.transport" timeout --signal=TERM --kill-after=15s 3m node node_modules/typescript/bin/tsc --noEmit -p tsconfig.app.json > "$out/types.stdout" 2> "$out/types.stderr" || raw=$?
          printf '%s\n' "$raw" > "$out/types.exit"
          test "$raw" -eq 0
          test ! -s "$out/types.stdout"
          test ! -s "$out/types.stderr"
          test ! -s "$out/types.transport"
      - name: Actual unfiltered default suite and eight classifier controls
        run: |
          set -euo pipefail
          out="$USC4_OUT"
          raw=0
          : > "$out/red.transport"
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$out/red.transport" timeout --signal=TERM --kill-after=15s 95m node "$out/full-default-controller.cjs" > "$out/red.stdout" 2> "$out/red.stderr" || raw=$?
          printf '%s\n' "$raw" > "$out/red.exit"
          test "$raw" -eq 0
          test ! -s "$out/red.stderr"
          test ! -s "$out/red.transport"
          grep -Fqx 'US_CONNECT4_DEFAULT_GREEN: actual default npm test passed with zero failures/runtime errors, exact58 source-owned optional skips and24 US Connect4 cases;8 copied classifier refusals/restores passed.' "$out/red.stdout"
          test "$(cat "$out/full-suite/raw.exit")" -eq 0
          sha256sum -c "$out/controller-copy.sha256" > "$out/controller-copy-held.log"
          find node_modules -type f -print0 | sort -z > "$out/dependencies.members.post"
          xargs -0 sha256sum < "$out/dependencies.members.post" > "$out/dependencies.post.sha256"
          find node_modules -type l -printf '%p -> %l\n' | sort > "$out/dependency-links.post"
      - name: Always preserve source and qualification evidence
        if: ${{ always() }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/usc4-full"
          mkdir -p "$out"
          failed=0
          git ls-files -z | sort -z > "$out/source-members.final"
          cmp "$out/source-members.initial" "$out/source-members.final" || failed=1
          sha256sum -c "$out/source.initial.sha256" > "$out/source-held.log" 2>&1 || failed=1
          git ls-files --others --exclude-standard -z | sort -z > "$out/untracked.final"
          cmp "$out/untracked.initial" "$out/untracked.final" || failed=1
          git diff --exit-code HEAD > "$out/working-source.diff" || failed=1
          git for-each-ref --format='%(refname) %(objectname)' > "$out/refs.after"
          cmp "$out/refs.before" "$out/refs.after" || failed=1
          sha256sum -c "$out/controller-copy.sha256" > "$out/controller-copy-final-held.log" 2>&1 || failed=1
          if test -f "$out/dependencies.post.sha256"; then
            find node_modules -type f -print0 | sort -z > "$out/dependencies.members.final"
            cmp "$out/dependencies.members.post" "$out/dependencies.members.final" || failed=1
            sha256sum -c "$out/dependencies.post.sha256" > "$out/dependencies-final-held.log" 2>&1 || failed=1
            find node_modules -type l -printf '%p -> %l\n' | sort > "$out/dependency-links.final"
            cmp "$out/dependency-links.post" "$out/dependency-links.final" || failed=1
          else
            printf 'POST_QUALIFICATION_DEPENDENCY_SNAPSHOT_NOT_CREATED\n' > "$out/dependencies-not-created.txt"
            failed=1
          fi
          printf '%s\n' "$failed" > "$out/final-holds.exit"
          printf '{"scope":"ACTUAL_UNFILTERED_DEFAULT_SUITE_ONLY","applicationFix":true,"fullSuite":"READ_ACTUAL_ADMISSION_AND_LITERAL_IDENTITIES","optionalProfilesExecuted":false,"runtimeCallbackErrors":"READ_ACTUAL_CALLBACK","focusedInverseProof":"SEPARATE_FOCUSED_BRANCH","build":"UNRUN","browser":"UNRUN","caps":"UNRUN","builtReaders":"UNRUN","globalSims":"UNRUN","featureReady":false,"dependencyInventoryScope":"POST_QUALIFICATION_ONLY"}\n' > "$out/SCOPE.json"
          find "$out" -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/usc4-full-evidence.sha256"
          cp "$RUNNER_TEMP/usc4-full-evidence.sha256" "$out/evidence.sha256"
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: us-connect4-full-${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/usc4-full
          if-no-files-found: error
          retention-days: 14
