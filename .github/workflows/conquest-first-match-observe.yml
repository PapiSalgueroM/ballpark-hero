        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          out="$CONQUEST_OUT";raw=0
          test ! -e "$out/observation"
          : > "$out/observation.transport"
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$out/observation.transport" CONQUEST_REPORT_OUT="$out/observation" env -u ONLY -u NO_DOUBLE_SWAP timeout --signal=TERM --kill-after=15s 20m node scripts/qa/observeSoccerConquestFirstMatch.mjs > "$out/observation.stdout" 2> "$out/observation.stderr" || raw=$?
          printf '%s\n' "$raw" > "$out/observation.exit"
          tail -n 20 "$out/observation.stdout"
          if test "$raw" -ne 0;then sed -n '1,100p' "$out/observation.stderr";fi
          sha256sum -c "$out/helpers.sha256" > "$out/helpers.post-observation-held.log"
          test "$raw" -eq 0;test ! -s "$out/observation.stderr";test ! -s "$out/observation.transport"
          grep -Eq '^OBSERVATION_COMPLETE: .*; status=OBSERVATION_COMPLETE; no feature qualification\.$' "$out/observation.stdout"
      - name: Always retain source, post-qualification inventories and originals
        if: ${{ always() }}
        run: |
          set -euo pipefail
          runner_temp=$(realpath "$RUNNER_TEMP")
          workspace=$(realpath "$PWD")
          case "$runner_temp/" in "$workspace/"*) exit 1;; esac
          out="$runner_temp/conquest-first-match-observe";mkdir -p "$out";failed=0
          git ls-files -z | sort -z > "$out/source-members.final"
          cmp "$out/source-members.initial" "$out/source-members.final" || failed=1
          xargs -0 sha256sum < "$out/source-members.final" > "$out/source.final.sha256"
          sha256sum -c "$out/source.initial.sha256" > "$out/source-held.log" 2>&1 || failed=1
          git ls-files --others --exclude-standard -z | sort -z > "$out/untracked.final"
          cmp "$out/untracked.initial" "$out/untracked.final" || failed=1
          git diff --exit-code HEAD > "$out/working-source.diff" || failed=1
          git for-each-ref --format='%(refname) %(objectname)' > "$out/refs.after"
          cmp "$out/refs.before" "$out/refs.after" || failed=1
          sha256sum -c "$out/helpers.sha256" > "$out/helpers-held.log" 2>&1 || failed=1
