name: Soccer Conquest first match observation
on:
  push:
    branches: [codex/conquest-first-match-observe-stable-20261031]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: 'true'
      SIM_NETWORK: offline
      GIT_OPTIONAL_LOCKS: '0'
      EXPECTED_MAIN: fa30aafbef0440454ab9c0cddac39a1c2f5c7325
      EXPECTED_PARENT: fa30aafbef0440454ab9c0cddac39a1c2f5c7325
      EXPECTED_TREE: a61b6215bfdcf188d3b8b73940de7fc40a5f489c
      OBSERVER_SHA256: 7eeb6088256f2b4761032fe7e6302292401204be5916363d3054563dc2e7c4c7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Bind unchanged report source and observation-only proof
        run: |
          set -euo pipefail
          runner_temp=$(realpath "$RUNNER_TEMP")
          workspace=$(realpath "$PWD")
          case "$runner_temp/" in "$workspace/"*) exit 1;; esac
          out="$runner_temp/conquest-first-match-observe"
          test ! -e "$out"
          mkdir -p "$out/helpers" "$out/runtime-tmp"
          echo "CONQUEST_OUT=$out" >> "$GITHUB_ENV"
          echo "PLACEMENT_OUT=$out" >> "$GITHUB_ENV"
          echo "FREE_KICK_FONT_CACHE=$out/font-cache" >> "$GITHUB_ENV"
          echo "TMPDIR=$out/runtime-tmp" >> "$GITHUB_ENV"
          test "$GITHUB_REF_NAME" = codex/conquest-first-match-observe-stable-20261031
          test "$(git rev-list --parents -n1 HEAD)" = "$GITHUB_SHA $EXPECTED_PARENT"
          test "$EXPECTED_PARENT" = "$EXPECTED_MAIN"
          test "$(git rev-parse "$EXPECTED_PARENT^{tree}")" = "$EXPECTED_TREE"
          test "$(git ls-files | wc -l)" -eq 5504
          git diff --name-status "$EXPECTED_MAIN" "$EXPECTED_PARENT" > "$out/product.paths"
          : > "$out/expected-product.paths"
          cmp "$out/product.paths" "$out/expected-product.paths"
          git diff --name-status "$EXPECTED_PARENT" HEAD > "$out/proof.paths"
          printf 'A\t.github/workflows/conquest-first-match-observe.yml\nA\tscripts/qa/observeSoccerConquestFirstMatch.mjs\n' > "$out/expected-proof.paths"
          cmp "$out/proof.paths" "$out/expected-proof.paths"
          test "$(sha256sum scripts/qa/observeSoccerConquestFirstMatch.mjs | cut -d' ' -f1)" = "$OBSERVER_SHA256"
          test "$(git hash-object src/pages/SoccerConquest.tsx)" = 661ab723cc81b6484d5298bd62c5bfc2c9ab0820
          test "$(git hash-object src/components/conquest/ImperialismBoardShared.tsx)" = 52f579dbeca9414dfdca2c6410ca9122f2d98544
          test "$(git hash-object src/components/conquest/ImperialismHowToPlay.tsx)" = 5b5a085a13a20052528765d2e18fefc22229625e
          test "$(git hash-object src/lib/imperialismEngine.ts)" = 3da6c79cd604fa92dc99d8ec0af43cfc25fa908f
          test "$(git hash-object src/lib/conquestRun.ts)" = fd155a5f86588c87b39a6241c3e2c1560e28f322
          test "$(git hash-object src/lib/conquestDaily.ts)" = fc09754cfa372fc8627b533594ed492c1231b22b
          test "$(git hash-object src/lib/dailyRecord.ts)" = f24c37aa4e0a8bda34d51f93d1ac44b0257fb3b6
          test "$(git hash-object src/lib/dateUtils.ts)" = 12c9de0ed37b0797492f3e936bcba70bdc03d585
          test "$(git hash-object src/data/soccerConquest.ts)" = 370baf910baca2181b6d5dbe7f50b2722dcdbc27
          test "$(git hash-object src/hooks/useRevealScroll.ts)" = 0cd106080bfb4e0461d9b86f0a973689f717d502
          test "$(git hash-object src/index.css)" = 775df500bd7c9730e5b04aedd3d6b2a1564d49b4
          test "$(git hash-object scripts/lib/hostLikeServer.mjs)" = 21059d5e8114669df61106c125d5272d357b6236
          test "$(git hash-object scripts/lib/playwrightLoader.mjs)" = 4f7739e217e0a47ee82e6bfc8be1c04bed17454a
          test "$(git hash-object scripts/qa/siteMenuNavigationSupport.mjs)" = 7909ce5805171367646e17a468fd919b88ad710e
          test "$(git hash-object scripts/sweepWeight.mjs)" = 58afae7329f0e1a520d7804e670b29583fd2964d
          git ls-files -z | sort -z > "$out/source-members.initial"
          xargs -0 sha256sum < "$out/source-members.initial" > "$out/source.initial.sha256"
          git ls-files --others --exclude-standard -z | sort -z > "$out/untracked.initial"
          test ! -s "$out/untracked.initial"
          git for-each-ref --format='%(refname) %(objectname)' > "$out/refs.before"
          git rev-parse HEAD > "$out/head.txt"
          git rev-parse 'HEAD^{tree}' > "$out/tree.txt"
          git archive --format=tar HEAD > "$out/source.tar"
          cp scripts/qa/observeSoccerConquestFirstMatch.mjs "$out/observer-copy.mjs"
          cmp scripts/qa/observeSoccerConquestFirstMatch.mjs "$out/observer-copy.mjs"
          sha256sum "$out/observer-copy.mjs" > "$out/helpers.sha256"
          raw=0
          node --check scripts/qa/observeSoccerConquestFirstMatch.mjs > "$out/syntax.stdout" 2> "$out/syntax.stderr" || raw=$?
          printf '%s\n' "$raw" > "$out/syntax.exit"
          test "$raw" -eq 0;test ! -s "$out/syntax.stdout";test ! -s "$out/syntax.stderr"
          cat > "$out/helpers/run.sh" <<'RUN'
          run() {
            local id="$1" budget="$2"; shift 2
            local raw=0
            : > "$CONQUEST_OUT/$id.transport"
            { printf '%q ' "$@"; printf '\n'; } > "$CONQUEST_OUT/$id.command"
            NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$CONQUEST_OUT/$id.transport" FORCE_COLOR=0 env -u NO_COLOR timeout --signal=TERM --kill-after=15s "$budget" "$@" > "$CONQUEST_OUT/$id.stdout" 2> "$CONQUEST_OUT/$id.stderr" || raw=$?
            printf '%s\n' "$raw" > "$CONQUEST_OUT/$id.exit"
            test ! -s "$CONQUEST_OUT/$id.transport"
          }
          RUN
          sha256sum "$out/helpers/run.sh" >> "$out/helpers.sha256"
      - name: Locked dependencies and actual application types
        run: |
          set -euo pipefail
          out="$CONQUEST_OUT"
          raw=0
          env -u NODE_OPTIONS npm ci > "$out/npm-ci.stdout" 2> "$out/npm-ci.stderr" || raw=$?
          printf '%s\n' "$raw" > "$out/npm-ci.exit"
          test "$raw" -eq 0
          raw=0
          : > "$out/types.transport"
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$out/types.transport" timeout --signal=TERM --kill-after=15s 3m node node_modules/typescript/bin/tsc --noEmit -p tsconfig.app.json > "$out/types.stdout" 2> "$out/types.stderr" || raw=$?
          printf '%s\n' "$raw" > "$out/types.exit"
          test "$raw" -eq 0
          test ! -s "$out/types.stdout"
          test ! -s "$out/types.stderr"
          test ! -s "$out/types.transport"
      - name: Isolated exact Playwright and real prepared fonts
        run: |
          set -euo pipefail
          out="$CONQUEST_OUT";tools="$RUNNER_TEMP/conquest-first-match-observe-tools";test ! -e "$tools"
          env -u NODE_OPTIONS npm install --prefix "$tools" --no-save --package-lock=false playwright@1.64.0 > "$out/browser-install.log" 2>&1
          test ! -e node_modules/playwright;test ! -e node_modules/playwright-core
          ln -s "$tools/node_modules/playwright" node_modules/playwright;ln -s "$tools/node_modules/playwright-core" node_modules/playwright-core
          export PLAYWRIGHT_BROWSERS_PATH="$tools/browsers"
          echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV";echo "CONQUEST_TOOLS=$tools" >> "$GITHUB_ENV";echo "PLACEMENT_TOOLS=$tools" >> "$GITHUB_ENV"
          executable=$(node -e 'const a=require("node:assert/strict");a.equal(require("playwright/package.json").version,"1.64.0");a.equal(require("playwright-core/package.json").version,"1.64.0");process.stdout.write(require("playwright").chromium.executablePath())')
          if test ! -f "$executable";then env -u NODE_OPTIONS node "$tools/node_modules/playwright/cli.js" install chromium > "$out/chromium-install.log" 2>&1;fi
          test -f "$executable";printf '%s\n' "$executable" > "$out/chromium.path"
          env -u NODE_OPTIONS node scripts/qa/freeKickLab1070.mjs --prefetch-fonts-only > "$out/font-prefetch.log" 2>&1
          sha=$(sha256sum "$FREE_KICK_FONT_CACHE/manifest.json" | cut -d' ' -f1);echo "FONT_CACHE_MANIFEST_SHA256=$sha" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Existing Brand-reader Python tools only
        run: |
          env -u NODE_OPTIONS python -m pip install fonttools pillow > "$CONQUEST_OUT/python-install.log" 2>&1
          python -m pip freeze > "$CONQUEST_OUT/python-packages.initial"
      - name: Actual Vite manifest build and post-build inventories
        id: build
        run: |
          set -euo pipefail
          out="$CONQUEST_OUT";source "$out/helpers/run.sh"
          run build 5m npm run build -- --manifest;test "$(cat "$out/build.exit")" -eq 0
          test -f dist/.vite/manifest.json
          sha256sum -c "$out/source.initial.sha256" > "$out/source.prebrowser-held.log"
          for pair in "deps:node_modules" "tools:$CONQUEST_TOOLS" "fonts:$FREE_KICK_FONT_CACHE" "dist:dist";do
            label="${pair%%:*}";dir="${pair#*:}";find "$dir" -type f -print0 | sort -z > "$out/$label.members";xargs -0 sha256sum < "$out/$label.members" > "$out/$label.sha256"
          done
          find node_modules -type l -printf '%p -> %l\n' | sort > "$out/dependency-links.before"
          tar -cf "$out/dist.tar" -C dist .;tar -cf "$out/font-cache.tar" -C "$FREE_KICK_FONT_CACHE" .
      - name: All fifteen current Main fatal page caps
        id: caps
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          out="$PLACEMENT_OUT";: > "$out/caps-controller.transport";export SIM_OFFLINE_RECEIPT="$out/caps-controller.transport"
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          node <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict'),{createHash}=require('node:crypto'),sha=b=>createHash('sha256').update(b).digest('hex');
          const original="'use strict';\nconst fs = require('node:fs');\nconst path = require('node:path');\nconst assert = require('node:assert/strict');\nconst { createHash } = require('node:crypto');\nconst hash = value => createHash('sha256').update(value).digest('hex');\nif (path.basename(process.argv[1] || '') === 'prerender.mjs') {\n  const cache = process.env.FREE_KICK_FONT_CACHE;\n  const manifestBytes = fs.readFileSync(path.join(cache, 'manifest.json'));\n  assert.match(process.env.FONT_CACHE_MANIFEST_SHA256 || '', /^[a-f0-9]{64}$/);\n  assert.equal(hash(manifestBytes), process.env.FONT_CACHE_MANIFEST_SHA256, 'Prepared font manifest stays exact');\n  const sheet = [...fs.readFileSync('index.html', 'utf8').matchAll(/<link\\s+href=\"(https:\\/\\/fonts\\.googleapis\\.com\\/[^\\\"]+)\"\\s+rel=\"stylesheet\"/g)].map(m => new URL(m[1]).href);\n  assert.equal(sheet.length, 1, 'Use the actual single template stylesheet');\n  const entries = JSON.parse(manifestBytes);\n  assert(Array.isArray(entries) && entries.length > 1);\n  const fonts = new Map();\n  for (const entry of entries) {\n    assert(!fonts.has(entry.url), 'No duplicate font cache URL');\n    const url = new URL(entry.url);\n    assert(['https://fonts.googleapis.com', 'https://fonts.gstatic.com'].includes(url.origin));\n    assert.equal(url.href, entry.url);\n    assert.equal(entry.file, hash(entry.url));\n    assert.match(entry.sha256, /^[a-f0-9]{64}$/);\n    assert.equal(typeof entry.contentType, 'string');\n    const body = fs.readFileSync(path.join(cache, entry.file));\n    assert.equal(hash(body), entry.sha256, 'Prepared font body stays exact');\n    fonts.set(entry.url, { ...entry, body });\n  }\n  assert(fonts.has(sheet[0]), 'Current template stylesheet is cached');\n  const css = fonts.get(sheet[0]);\n  assert.match(css.contentType, /^text\\/css(?:;|$)/);\n  const declared = [...new Set([...css.body.toString('utf8').matchAll(/url\\(\\s*['\"]?(https:\\/\\/[^)'\"\\s]+)/g)].map(m => m[1]))];\n  assert(declared.length > 0);\n  assert.deepEqual([...fonts.keys()].sort(), [sheet[0], ...declared].sort(), 'Only actual stylesheet dependencies are fulfilled');\n  for (const url of declared) assert.equal(new URL(url).origin, 'https://fonts.gstatic.com');\n  const pw = require('playwright-core');\n  let contextId = 0;\n  const originalLaunch = pw.chromium.launch.bind(pw.chromium);\n  pw.chromium.launch = async options => {\n    const browser = await originalLaunch(options);\n    const originalContext = browser.newContext.bind(browser);\n    browser.newContext = async options => {\n      const context = await originalContext(options);\n      const id = ++contextId;\n      await context.route(/^https:\\/\\/(?:fonts\\.googleapis\\.com|fonts\\.gstatic\\.com)\\//, async route => {\n        const request = route.request(), entry = fonts.get(request.url());\n        if (request.method() !== 'GET' || !entry || !['stylesheet', 'font'].includes(request.resourceType())) return route.fallback();\n        await route.fulfill({ status: 200, contentType: entry.contentType, body: entry.body });\n        fs.appendFileSync(process.env.FONT_CACHE_USE_RECEIPT, JSON.stringify({ contextId: id, url: entry.url, sha256: entry.sha256, manifestSha256: hash(manifestBytes), resourceType: request.resourceType() }) + '\\n');\n      });\n      return context;\n    };\n    return browser;\n  };\n}\n";
