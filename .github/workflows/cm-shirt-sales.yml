name: Club Manager shirt sales verification
on:
  push:
    branches: [codex/cm-shirt-sales, codex/cm-shirt-sales-red]
    paths-ignore: ['docs/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cm-shirt-sales-${{ github.sha }}
  cancel-in-progress: false

env:
  SIM_NETWORK: offline
  TZ: UTC
  SHIRT_OUT: shirt-sales-artifacts
  SOURCE_SHA: e13280c8cdab53a96b6b51071f5570fda8a55113

jobs:
  original_outcomes:
    if: github.ref == 'refs/heads/codex/cm-shirt-sales-red'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Hold original product and install locked dependencies
        run: |
          set -euo pipefail
          mkdir "$SHIRT_OUT"
          git fetch --no-tags --depth=1 origin "$SOURCE_SHA" > "$SHIRT_OUT/source-fetch.log" 2>&1
          git rev-parse HEAD > "$SHIRT_OUT/head.txt"
          git rev-parse 'HEAD^{tree}' > "$SHIRT_OUT/tree.txt"
          git diff --exit-code "$SOURCE_SHA" HEAD -- src public scripts supabase package.json package-lock.json ':!src/lib/clubManagerShirtSales.test.ts' ':!src/test/clubManagerShirtSalesScreen.test.tsx' ':!scripts/measureCmShirtSalesBaseline.mjs' > "$SHIRT_OUT/original-product-hold.log"
          sha256sum package.json package-lock.json src/lib/clubManager.ts src/lib/clubManagerFinances.ts src/components/club-manager/FinancesScreen.tsx src/lib/clubManagerCalendar.ts src/lib/clubManagerMeters.ts src/lib/worldOneOffs.ts src/lib/worldNights.ts scripts/simOneOffCups.mjs scripts/playOneOffCups.mjs > "$SHIRT_OUT/source-before.sha256"
          npm ci > "$SHIRT_OUT/install.log" 2>&1
      - name: Real original app type gate
        run: |
          set -euo pipefail
          node_modules/.bin/tsc --noEmit -p tsconfig.app.json > "$SHIRT_OUT/types.log" 2>&1
      - name: Observe all three intended original outcomes before implementation
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          status=0
          timeout --signal=TERM --kill-after=10s 8m node_modules/.bin/vitest run src/lib/clubManagerShirtSales.test.ts src/test/clubManagerShirtSalesScreen.test.tsx --maxWorkers=1 --reporter=verbose --reporter=json --outputFile.json="$SHIRT_OUT/original.json" > "$SHIRT_OUT/original.log" 2>&1 || status=$?
          printf '%s\n' "$status" > "$SHIRT_OUT/original.exit"
          cat "$SHIRT_OUT/original.log"
          test "$status" -eq 1
          node <<'JS'
          const fs = require('node:fs'), assert = require('node:assert/strict');
          const report = JSON.parse(fs.readFileSync(process.env.SHIRT_OUT + '/original.json', 'utf8'));
          assert.equal(report.numTotalTests, 3); assert.equal(report.numFailedTests, 3); assert.equal(report.numPassedTests, 0); assert.equal(report.numPendingTests, 0);
          const cases = report.testResults.flatMap(row => row.assertionResults); assert.equal(cases.length, 3);
          const expected = new Map([
            ['Club Manager shirt sales through the real weekly engine records one retail week and gross sales after an actual charged week', 'SHIRT_ORIGINAL_LEDGER_MISSING'],
            ['Club Manager shirt sales through the real weekly engine exposes paid net cash as one kitty income source after an actual charged week', 'SHIRT_ORIGINAL_INCOME_MISSING'],
            ['the actual Club Manager shirt sales explanation explains simulated shirt sales and costs on the finance desk before advancing', 'SHIRT_ORIGINAL_EXPLANATION_MISSING'],
          ]);
          assert.equal(new Set(cases.map(row => row.fullName)).size, 3);
          for (const row of cases) {
            assert.equal(row.status, 'failed'); assert(expected.has(row.fullName), 'Exact original case title required: ' + row.fullName);
            const failure = row.failureMessages.join('\n');
            assert(failure.includes(expected.get(row.fullName)), 'The missing-feature assertion must fail after its preconditions: ' + row.fullName);
            assert.match(failure, /AssertionError|expect(?:\x1b\[[0-9;]*m)*\(/);
            assert.doesNotMatch(failure, /Cannot find|Failed to resolve|SyntaxError|ReferenceError|TypeError|No test suite found/);
            console.log('INTENDED ORIGINAL RED: ' + row.fullName);
          }
          console.log('SHIRT SALES ORIGINAL: three intended assertion failures, no product changes.');
          JS
      - name: Preserve all source and evidence
        if: always()
        run: |
          set -euo pipefail
          if test -f "$SHIRT_OUT/source-before.sha256"; then sha256sum --check "$SHIRT_OUT/source-before.sha256" > "$SHIRT_OUT/source-hold.log"; fi
          git diff --exit-code HEAD -- src scripts public supabase package.json package-lock.json .github > "$SHIRT_OUT/operator-source-hold.log"
          (cd "$SHIRT_OUT"; find . -type f ! -name evidence.sha256 -print0 | sort -z | xargs -0 sha256sum) > "$SHIRT_OUT/evidence.sha256"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shirt-sales-original-${{ github.run_id }}-${{ github.run_attempt }}
          path: shirt-sales-artifacts/
          if-no-files-found: error
          retention-days: 14

  existing_finance_baseline:
    if: github.ref == 'refs/heads/codex/cm-shirt-sales-red'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Pin original finance source and install
        run: |
          set -euo pipefail
          mkdir "$SHIRT_OUT"
          git rev-parse HEAD > "$SHIRT_OUT/head.txt"
          sha256sum package.json package-lock.json src/lib/clubManager.ts src/lib/clubManagerFinances.ts src/lib/clubManagerMeters.ts scripts/simFinance.mjs scripts/simClubManagerFinances.mjs scripts/simSponsors.mjs scripts/simClubManagerMeters.mjs > "$SHIRT_OUT/source-before.sha256"
          npm ci > "$SHIRT_OUT/install.log" 2>&1
      - name: Retain actual unchanged finance and fan outcomes
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          failed=0
          for name in simFinance simClubManagerFinances simSponsors simClubManagerMeters; do
            status=0
            timeout --signal=TERM --kill-after=10s 7m node "scripts/$name.mjs" > "$SHIRT_OUT/$name.log" 2>&1 || status=$?
            printf '%s\t%s\n' "$name" "$status" >> "$SHIRT_OUT/baseline.tsv"
            cat "$SHIRT_OUT/$name.log"
            if test "$status" -ne 0; then failed=1; fi
          done
          test "$failed" -eq 0
          grep -c $'\t0$' "$SHIRT_OUT/baseline.tsv" | grep -qx '4'
      - name: Preserve source and evidence
        if: always()
        run: |
          set -euo pipefail
          if test -f "$SHIRT_OUT/source-before.sha256"; then sha256sum --check "$SHIRT_OUT/source-before.sha256" > "$SHIRT_OUT/source-hold.log"; fi
          git diff --exit-code HEAD -- src scripts public supabase package.json package-lock.json .github > "$SHIRT_OUT/operator-source-hold.log"
          (cd "$SHIRT_OUT"; find . -type f ! -name evidence.sha256 -print0 | sort -z | xargs -0 sha256sum) > "$SHIRT_OUT/evidence.sha256"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shirt-sales-finance-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: shirt-sales-artifacts/
          if-no-files-found: error
          retention-days: 14

  rate_measurement:
    if: github.ref == 'refs/heads/codex/cm-shirt-sales-red'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Hold source and install
        run: |
          set -euo pipefail
          mkdir "$SHIRT_OUT"
          git rev-parse HEAD > "$SHIRT_OUT/head.txt"
          sha256sum package.json package-lock.json src/lib/clubManager.ts src/lib/clubManagerFinances.ts src/lib/clubManagerMeters.ts scripts/measureCmShirtSalesBaseline.mjs > "$SHIRT_OUT/source-before.sha256"
          npm ci > "$SHIRT_OUT/install.log" 2>&1
      - name: Bounded original-state timing pilot
        env:
          MEASURE_MODE: pilot
          ARTIFACT_DIR: shirt-sales-artifacts/pilot
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          timeout --signal=TERM --kill-after=10s 2m node scripts/measureCmShirtSalesBaseline.mjs > "$SHIRT_OUT/pilot.log" 2>&1
          cat "$SHIRT_OUT/pilot.log"
      - name: Fixed calibration and holdout samples without product changes
        env:
          MEASURE_MODE: full
          ARTIFACT_DIR: shirt-sales-artifacts/measurement
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          status=0
          timeout --signal=TERM --kill-after=10s 9m node scripts/measureCmShirtSalesBaseline.mjs > "$SHIRT_OUT/measurement.log" 2>&1 || status=$?
          printf '%s\n' "$status" > "$SHIRT_OUT/measurement.exit"
          cat "$SHIRT_OUT/measurement.log"
          test "$status" -eq 0
      - name: Preserve all measured evidence
        if: always()
        run: |
          set -euo pipefail
          if test -f "$SHIRT_OUT/source-before.sha256"; then sha256sum --check "$SHIRT_OUT/source-before.sha256" > "$SHIRT_OUT/source-hold.log"; fi
          git diff --exit-code HEAD -- src scripts public supabase package.json package-lock.json .github > "$SHIRT_OUT/operator-source-hold.log"
          (cd "$SHIRT_OUT"; find . -type f ! -name evidence.sha256 -print0 | sort -z | xargs -0 sha256sum) > "$SHIRT_OUT/evidence.sha256"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shirt-sales-measurement-${{ github.run_id }}-${{ github.run_attempt }}
          path: shirt-sales-artifacts/
          if-no-files-found: error
          retention-days: 14

  current_outcomes:
    if: github.ref == 'refs/heads/codex/cm-shirt-sales'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Hold candidate inputs and install locked dependencies
        run: |
          set -euo pipefail
          mkdir "$SHIRT_OUT"
          git rev-parse HEAD > "$SHIRT_OUT/head.txt"
          git rev-parse 'HEAD^{tree}' > "$SHIRT_OUT/tree.txt"
          git ls-files -z -- src scripts public supabase .github package.json package-lock.json | sort -z | xargs -0 sha256sum > "$SHIRT_OUT/source-before.sha256"
          npm ci > "$SHIRT_OUT/install.log" 2>&1
      - name: Real app type gate and all focused outcomes
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          node_modules/.bin/tsc --noEmit -p tsconfig.app.json > "$SHIRT_OUT/types.log" 2>&1
          status=0
          timeout --signal=TERM --kill-after=10s 8m node_modules/.bin/vitest run src/lib/clubManagerShirtSales.test.ts src/test/clubManagerShirtSalesScreen.test.tsx src/test/clubManagerHubLines.test.ts --maxWorkers=1 --no-file-parallelism --reporter=verbose --reporter=json --outputFile.json="$SHIRT_OUT/focused.json" > "$SHIRT_OUT/focused.log" 2>&1 || status=$?
          printf '%s\n' "$status" > "$SHIRT_OUT/focused.exit"
          cat "$SHIRT_OUT/focused.log"
          test "$status" -eq 0
          node <<'JS'
          const fs = require('node:fs'), assert = require('node:assert/strict');
          const report = JSON.parse(fs.readFileSync(process.env.SHIRT_OUT + '/focused.json'));
          const expected = new Map([['src/lib/clubManagerShirtSales.test.ts', 16], ['src/test/clubManagerShirtSalesScreen.test.tsx', 14], ['src/test/clubManagerHubLines.test.ts', 15]]);
          assert.equal(report.success, true); assert.equal(report.numFailedTests, 0); assert.equal(report.numPendingTests, 0);
          assert.equal(Number(report.numTodoTests ?? 0), 0); assert.equal(Number(report.numUnhandledErrors ?? 0), 0);
          assert.equal(report.testResults.length, 3); assert.equal(report.numPassedTests, 45); assert.equal(report.numTotalTests, 45);
          for (const [file, count] of expected) {
            const rows = report.testResults.filter(row => row.name.replaceAll('\\', '/').endsWith('/' + file));
            assert.equal(rows.length, 1, file); assert.equal(rows[0].status, 'passed'); assert.equal(rows[0].assertionResults.length, count);
            assert(rows[0].assertionResults.every(row => row.status === 'passed'), file + ': every actual case passes');
          }
          console.log('SHIRT FOCUSED VERIFIED: 16 library + 14 UI + 15 inherited hub cases; no skips.');
          JS
      - name: All actual accounting cases and effective copied faults
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          mkdir "$SHIRT_OUT/sim"
          for mode in normal no-credit gross-credit drop-pending double-tick backpay hidden-demand night-projection drop-carry unsafe-forecast; do
            control="$mode"; if test "$mode" = normal; then control=''; fi
            status=0
            SOURCE_SHA="$GITHUB_SHA" CM_SHIRT_SALES_CONTROL="$control" ARTIFACT_DIR="$SHIRT_OUT/sim/$mode" timeout --signal=TERM --kill-after=10s 4m node scripts/simCmShirtSales.mjs > "$SHIRT_OUT/sim/$mode.log" 2>&1 || status=$?
            printf '%s\t%s\n' "$mode" "$status" >> "$SHIRT_OUT/sim/results.tsv"
            cat "$SHIRT_OUT/sim/$mode.log"
          done
          node <<'JS'
          const fs = require('node:fs'), path = require('node:path'), assert = require('node:assert/strict'), { createHash } = require('node:crypto');
          const out = path.join(process.env.SHIRT_OUT, 'sim'), hash = value => createHash('sha256').update(value).digest('hex');
          const source = fs.readFileSync('src/lib/clubManagerFinances.ts', 'utf8').replaceAll('\r\n', '\n');
          const rows = fs.readFileSync(path.join(out, 'results.tsv'), 'utf8').trim().split('\n').map(line => line.split('\t'));
          const fault = {
            'no-credit': ['actual-engine-window-cash', 'SHIRT_ENGINE_WINDOW_CASH', 'if (sale && sale.cashPence > 0) state.budget = round2(state.budget + sale.cashPence / SHIRT_PENCE_PER_M);', 'if (sale && sale.cashPence > 0) state.budget = round2(state.budget + 0 / SHIRT_PENCE_PER_M);'],
            'gross-credit': ['actual-engine-window-cash', 'SHIRT_ENGINE_WINDOW_CASH', 'if (sale && sale.cashPence > 0) state.budget = round2(state.budget + sale.cashPence / SHIRT_PENCE_PER_M);', 'if (sale && sale.cashPence > 0) state.budget = round2(state.budget + shirtSalesForWeek(state).grossPence / SHIRT_PENCE_PER_M);'],
            'drop-pending': ['penny-identity', 'SHIRT_PENNY_IDENTITY', 'return ledger.openingPence + ledger.grossPence - ledger.costPence - ledger.paidPence;', 'return 0;'],
            'double-tick': ['one-counter-per-charge', 'SHIRT_WEEK_COUNT', 'weeks: ledger.weeks + weeks, grossPence:', 'weeks: ledger.weeks + weeks * 2, grossPence:'],
            backpay: ['legacy-zero-no-backpay', 'SHIRT_LEGACY_ZERO', 'if (value === undefined) return emptyShirtSales();', 'if (value === undefined) return { ...emptyShirtSales(), grossPence: 10_000_000, paidPence: 10_000_000 };'],
            'hidden-demand': ['displayed-demand-and-era-scale', 'SHIRT_DISPLAYED_DEMAND', 'fanMeter(state).shown / 100', 'booksOf(state).fanMood / 100'],
            'night-projection': ['charged-weeks-projection', 'SHIRT_PROJECTION_CHARGED_ONLY', 'state.calendar.slice(state.week).filter(entry => !entry.night).length', 'state.calendar.slice(state.week).length'],
            'drop-carry': ['same-club-carry-and-moves', 'SHIRT_SAME_CLUB_CARRY', 'season: emptyLedger(shirtPendingPence(readShirtSales(career.books.season.shirts) ?? emptyShirtSales())),', 'season: emptyLedger(),'],
            'unsafe-forecast': ['unsafe-future-keeps-known-paid', 'SHIRT_FORECAST_UNAVAILABLE', 'const retailForecast = retail ? settleShirtSales(retail, quote, retailWeeksLeft) : null;', 'const retailForecast = retail ? { ledger: { ...retail, paidPence: retail.paidPence + Math.floor((shirtPendingPence(retail) + (quote.grossPence - quote.costPence) * retailWeeksLeft) / SHIRT_CASH_PENCE) * SHIRT_CASH_PENCE } } : null;'],
          };
          const names = ['normal', ...Object.keys(fault)]; assert.deepEqual(rows.map(row => row[0]), names); assert.equal(new Set(rows.map(row => row[0])).size, 10);
          const ids = ['penny-identity', 'one-counter-per-charge', 'malformed-and-overflow', 'legacy-zero-no-backpay', 'displayed-demand-and-era-scale', 'small-club-pennies', 'one-net-income-no-board-cost', 'charged-weeks-projection', 'unsafe-future-keeps-known-paid', 'actual-engine-window-cash', 'actual-skipped-night', 'save-load-and-pure-reads', 'same-club-carry-and-moves', 'no-passive-time-or-random-income', 'real-charged-prefixes'];
          for (const [name, exit] of rows) {
            const report = JSON.parse(fs.readFileSync(path.join(out, name, 'report.json')));
            assert.equal(report.source.commit, process.env.GITHUB_SHA); assert.equal(report.observedCases, 15); assert.equal(report.plannedCases, 15);
            assert.deepEqual(report.cases.map(row => row.id), ids); assert.deepEqual(report.errors, []);
            assert.equal(report.networkAttempts, 0); assert.equal(report.randomRestored, true); assert.equal(report.clockRestored, true);
            assert.equal(report.source.unchanged, true); assert.deepEqual(report.source.before, report.source.after);
            for (const [file, expected] of Object.entries(report.source.before)) assert.equal(hash(fs.readFileSync(file)), expected, file + ': actual held source');
            assert(Object.keys(report.source.before).length >= 15);
            assert.equal(hash(fs.readFileSync(path.join(out, name, 'engine.mjs'))), report.source.bundleSha256);
            if (name === 'normal') {
              assert.equal(exit, '0'); assert.equal(report.status, 'passed'); assert.equal(report.passedCases, 15); assert.equal(report.failedCases, 0);
              assert(report.cases.every(row => row.status === 'passed')); assert.equal(report.prefixes.length, 6);
              assert.deepEqual(report.prefixes.map(row => [row.kind, row.seed]), [['modern', 0], ['modern', 8], ['historical', 0], ['historical', 8], ['custom', 0], ['custom', 8]]);
              assert(report.prefixes.every(row => row.chargedWeeks === 12 && row.plannedChargedWeeks === 12 && row.immutabilityChecks === row.entries));
              assert.equal(report.prefixes.reduce((n, row) => n + row.chargedWeeks, 0), 72);
            } else {
              const [id, marker, from, to] = fault[name]; assert.equal(exit, '1'); assert.equal(report.status, 'failed'); assert.equal(report.control, name);
              const target = report.cases.filter(row => row.id === id); assert.equal(target.length, 1); assert.equal(target[0].status, 'failed');
              assert.equal(typeof target[0].error, 'string'); assert(target[0].error.includes(marker));
              assert.doesNotMatch(target[0].error, /TypeError|ReferenceError|SyntaxError|Cannot find|SHIRT_(?:SETUP|PRECONDITION)_/);
              assert.equal(report.fault.detected, true); assert.equal(report.fault.marker, marker); assert.equal(report.fault.replacements, 1);
              assert.equal(source.split(from).length - 1, 1); const expected = source.replace(from, to); assert.notEqual(expected, source);
              const copied = fs.readFileSync(path.join(out, name, 'finance-' + name + '.ts'), 'utf8'); assert.equal(copied, expected);
              assert.equal(hash(source), report.fault.originalHash); assert.equal(hash(copied), report.fault.changedHash);
            }
          }
          console.log('SHIRT SIM VERIFIED: 15 actual cases, 6 prefixes/72 charged weeks, 9 exact copied faults at their intended assertions; held source and zero network.');
          JS
      - name: Preserve complete candidate evidence
        if: always()
        run: |
          set -euo pipefail
          failed=0
          if test -f "$SHIRT_OUT/source-before.sha256"; then sha256sum --check "$SHIRT_OUT/source-before.sha256" > "$SHIRT_OUT/source-hold.log" 2>&1 || failed=1; fi
          git diff --exit-code HEAD -- src scripts public supabase package.json package-lock.json .github > "$SHIRT_OUT/operator-source-hold.log" 2>&1 || failed=1
          (cd "$SHIRT_OUT"; find . -type f ! -name evidence.sha256 -print0 | sort -z | xargs -0 sha256sum) > "$SHIRT_OUT/evidence.sha256"
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shirt-sales-current-${{ github.run_id }}-${{ github.run_attempt }}
          path: shirt-sales-artifacts/
          if-no-files-found: error
          retention-days: 14

  current_finance:
    if: github.ref == 'refs/heads/codex/cm-shirt-sales'
    runs-on: ubuntu-latest
    timeout-minutes: 105
    defaults:
      run:
        shell: bash
    env:
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Hold current finance and all inherited inputs
        run: |
          set -euo pipefail
          mkdir "$SHIRT_OUT"
          git rev-parse HEAD > "$SHIRT_OUT/head.txt"
          git ls-files -z -- src scripts public supabase .github package.json package-lock.json | sort -z | xargs -0 sha256sum > "$SHIRT_OUT/source-before.sha256"
          npm ci > "$SHIRT_OUT/install.log" 2>&1
      - name: Original and current finance copy assertions with effective control
        run: |
          set -euo pipefail
          mkdir "$SHIRT_OUT/copy-compat"
          git fetch --no-tags --depth=1 origin e13280c8cdab53a96b6b51071f5570fda8a55113 > "$SHIRT_OUT/copy-compat/baseline-fetch.log" 2>&1
          before="$RUNNER_TEMP/shirt-copy-original"
          mkdir "$before"
          git archive e13280c8cdab53a96b6b51071f5570fda8a55113 | tar -xf - -C "$before"
          cmp "$before/package-lock.json" package-lock.json
          ln -s "$GITHUB_WORKSPACE/node_modules" "$before/node_modules"
          printf '%s\n' e13280c8cdab53a96b6b51071f5570fda8a55113 > "$SHIRT_OUT/copy-compat/baseline-source.txt"
          echo "SHIRT_COPY_BASELINE=$before" >> "$GITHUB_ENV"
          export SHIRT_COPY_BASELINE="$before"
          (cd "$before"; find src scripts public supabase -type f -print0 | sort -z | xargs -0 sha256sum; sha256sum package.json package-lock.json) > "$SHIRT_OUT/copy-compat/baseline-inputs.sha256"
          export NODE_OPTIONS="--require=$GITHUB_WORKSPACE/scripts/lib/offlineTransport.cjs"
          for arm in original current; do
            for mode in normal finance; do
              control="$mode"; if test "$mode" = normal; then control=''; fi
              status=0
              if test "$arm" = original; then
                (cd "$before"; SOURCE_SHA=e13280c8cdab53a96b6b51071f5570fda8a55113 CM_COPY_ROOT="$before" CM_COPY_CONTROL="$control" timeout --signal=TERM --kill-after=10s 5m node scripts/simCmCopy.mjs --section=5) > "$SHIRT_OUT/copy-compat/$arm-$mode.log" 2>&1 || status=$?
              else
                SOURCE_SHA="$GITHUB_SHA" CM_COPY_ROOT="$GITHUB_WORKSPACE" CM_COPY_CONTROL="$control" timeout --signal=TERM --kill-after=10s 5m node scripts/simCmCopy.mjs --section=5 > "$SHIRT_OUT/copy-compat/$arm-$mode.log" 2>&1 || status=$?
              fi
              printf '%s\t%s\t%s\n' "$arm" "$mode" "$status" >> "$SHIRT_OUT/copy-compat/results.tsv"
              cat "$SHIRT_OUT/copy-compat/$arm-$mode.log"
            done
          done
          (cd "$before"; sha256sum --check "$GITHUB_WORKSPACE/$SHIRT_OUT/copy-compat/baseline-inputs.sha256") > "$SHIRT_OUT/copy-compat/baseline-source-hold.log"
          node <<'JS'
          const fs = require('node:fs'), assert = require('node:assert/strict');
