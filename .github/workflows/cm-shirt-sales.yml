          for (const [fault, message] of Object.entries(intended)) {
            const broken = faults.filter(row => row.fault === fault), back = restored.filter(row => row.restoration === fault);
            assert.equal(broken.length, 1); assert.equal(back.length, 1); assert.equal(broken[0].error.name, 'AssertionError');
            assert(broken[0].error.message.startsWith(message)); assert.equal(broken[0].intendedRejection, message); assert.equal(broken[0].interceptions, 1);
          }
          for (const row of report.cases) { assert.deepEqual(row.errors, []); assert.deepEqual(row.assets, []); assert.equal(row.fulfilledExternal, row.external.length); }
          for (const row of [...positive, ...restored]) { assert(row.loopbackReads > 0); assert.equal(typeof row.save.fixtureSha256, 'string'); assert.equal(row.save.finalSha256, row.save.baselineSha256); assert(row.screenshots.length > 0); }
          for (const row of report.holds) assert.equal(createHash('sha256').update(fs.readFileSync(row.file)).digest('hex'), row.sha256, row.file);
          console.log('SHIRT BROWSER VERIFIED: 7 positives, 3 actual assertion rejections, 3 restorations, held bytes and local-only external fixtures.');
          JS
      - name: Preserve complete generated and runtime evidence
        if: always()
        run: |
          set -euo pipefail
          failed=0
          status=0
          {
            find public scripts/data/lastmod.json scripts/data/guideHeadingsFrozen.json src/data/searchKeywords.json ! -type d ! -type f -print > "$SHIRT_OUT/generated-source-nonregular-after.txt" &&
            test ! -s "$SHIRT_OUT/generated-source-nonregular-after.txt" &&
            find public scripts/data/lastmod.json scripts/data/guideHeadingsFrozen.json src/data/searchKeywords.json -type f -print0 | sort -z | xargs -0 sha256sum > "$SHIRT_OUT/generated-source-after.sha256" &&
            cmp "$SHIRT_OUT/generated-source-before.sha256" "$SHIRT_OUT/generated-source-after.sha256"
          } > "$SHIRT_OUT/generated-output-hold.log" 2>&1 || status=$?
          printf '%s\n' "$status" > "$SHIRT_OUT/generated-output-hold.exit"; test "$status" -eq 0 || failed=1
          status=0
          {
            find dist ! -type d ! -type f -print > "$SHIRT_OUT/dist-nonregular-after.txt" &&
            test ! -s "$SHIRT_OUT/dist-nonregular-after.txt" &&
            find dist -type f -print0 | sort -z | xargs -0 sha256sum > "$SHIRT_OUT/dist-after.sha256" &&
            cmp "$SHIRT_OUT/dist.sha256" "$SHIRT_OUT/dist-after.sha256"
          } > "$SHIRT_OUT/dist-output-hold.log" 2>&1 || status=$?
          printf '%s\n' "$status" > "$SHIRT_OUT/dist-output-hold.exit"; test "$status" -eq 0 || failed=1
          if test -f "$SHIRT_OUT/source-before.sha256"; then sha256sum --check "$SHIRT_OUT/source-before.sha256" > "$SHIRT_OUT/source-hold.log" 2>&1 || failed=1; fi
          if test -f "$SHIRT_OUT/dependencies-cap-before.sha256"; then sha256sum --check "$SHIRT_OUT/dependencies-cap-before.sha256" > "$SHIRT_OUT/dependencies-cap-hold.log" 2>&1 || failed=1; fi
          git diff --exit-code HEAD -- src scripts supabase package.json package-lock.json .github ':!scripts/data/lastmod.json' ':!scripts/data/guideHeadingsFrozen.json' ':!src/data/searchKeywords.json' > "$SHIRT_OUT/operator-source-hold.log" 2>&1 || failed=1
          status=0
          if test -d dist; then tar -czf "$SHIRT_OUT/dist.tar.gz" -C dist . > "$SHIRT_OUT/dist-archive.log" 2>&1 || status=$?; else status=1; fi
          printf '%s\n' "$status" > "$SHIRT_OUT/dist-archive.exit"; test "$status" -eq 0 || failed=1
          printf '%s\n' "$failed" > "$SHIRT_OUT/final-holds.exit"
          (cd "$SHIRT_OUT"; find . -type f ! -path ./evidence.sha256 -print0 | sort -z | xargs -0 sha256sum) > "$SHIRT_OUT/evidence.sha256"
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shirt-sales-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: shirt-sales-artifacts/
          if-no-files-found: error
          retention-days: 14
