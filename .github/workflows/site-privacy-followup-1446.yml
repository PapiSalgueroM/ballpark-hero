name: Site privacy followup1446

on:
  push:
    branches: [codex/site-privacy-followup-1446, codex/site-privacy-followup-1446-green]
    paths-ignore: ['docs/**']
  workflow_dispatch:
    inputs:
      phase:
        description: Original gaps, Green generated candidate, or final fixedpoint qualification
        required: true
        default: original
        type: choice
        options: [original, green, final]

permissions:
  contents: read
concurrency:
  group: site-privacy-followup-1446-${{ github.sha }}-${{ inputs.phase || github.ref_name }}
  cancel-in-progress: false

env:
  BASE_SOURCE: 6d2d7a7d2cb41d25f9c71c24c848af583e804f6a
  PHASE: ${{ inputs.phase || (github.ref == 'refs/heads/codex/site-privacy-followup-1446' && 'original' || 'green') }}
  CI: '1'
  SIM_NETWORK: offline
  TZ: UTC

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      OUT: site-privacy-focused-artifacts
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Exact phase, original product and immutable inputs
        run: |
          set -euo pipefail
          mkdir "$OUT"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD > "$OUT/head.txt"
          printf '%s\n' "$PHASE" > "$OUT/phase.txt"
          if test "$PHASE" = original;then
            test "$GITHUB_REF" = refs/heads/codex/site-privacy-followup-1446
          else
            test "$PHASE" = green || test "$PHASE" = final
            test "$GITHUB_REF" = refs/heads/codex/site-privacy-followup-1446-green
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SOURCE" > "$OUT/base-fetch.log" 2>&1
          if test "$PHASE" = original;then
            git diff --exit-code "$BASE_SOURCE" HEAD -- . ':!docs/ROUND1446.md' ':!docs/PROJECT-STATE.md' ':!docs/WORKBOARD.md' ':!.github/workflows/site-privacy-followup-1446.yml' ':!src/test/profileInitials1446.test.tsx' ':!scripts/playCookiePolicy1446.mjs' > "$OUT/original-product-hold.log"
          fi
          git ls-files -z -- . | sort -z | xargs -0 sha256sum > "$OUT/source-before.sha256"
          npm ci > "$OUT/install.log" 2>&1
      - name: Types,74 unchanged consent cases and existing account/profile suites
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          export SIM_OFFLINE_RECEIPT="$PWD/$OUT/focused.transport"
          : > "$SIM_OFFLINE_RECEIPT"
          node_modules/.bin/tsc --noEmit -p tsconfig.app.json > "$OUT/types.log" 2>&1
          timeout --signal=TERM --kill-after=15s 6m node_modules/.bin/vitest run src/test/consentPurposeGates.test.ts src/test/consentPrivacy1442.test.ts src/test/consentWithdrawal1442.test.ts src/test/consentSynchronization1442.test.tsx src/test/cookieConsentStorage.test.tsx src/test/helpConsentFocus.test.tsx src/test/rulesGateConsentFocus.test.tsx --maxWorkers=1 --reporter=json --outputFile="$OUT/consent.json" > "$OUT/consent.log" 2>&1
          timeout --signal=TERM --kill-after=15s 6m node_modules/.bin/vitest run src/test/profileSecondDevice.test.tsx src/components/profile/AccountPrivacy.test.tsx src/lib/accountPrivacy.test.ts --maxWorkers=1 --reporter=json --outputFile="$OUT/account.json" > "$OUT/account.log" 2>&1
          node --input-type=module <<'JS'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          for(const [file,count,suites] of [['consent',74,7],['account',29,3]]){
            const r=JSON.parse(fs.readFileSync(process.env.OUT+'/'+file+'.json','utf8'));
            assert.equal(r.success,true);assert.equal(r.numTotalTests,count);assert.equal(r.numPassedTests,count);assert.equal(r.numFailedTests,0);assert.equal(r.numPendingTests,0);assert.equal(r.numTodoTests,0);assert.equal(r.testResults.length,suites);
            assert.equal(r.numRuntimeErrorTestSuites??0,0);assert.equal(r.numUnhandledErrors??0,0);assert.deepEqual(r.unhandledErrors??[],[]);assert(r.testResults.every(s=>s.status==='passed'&&s.assertionResults.length>0&&s.assertionResults.every(t=>t.status==='passed')));
          }
          JS
          test ! -s "$SIM_OFFLINE_RECEIPT"
      - name: Existing idle timer oracle and effective controls
        if: env.PHASE != 'original'
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          export SIM_OFFLINE_RECEIPT="$PWD/$OUT/idle-timers.transport";: > "$SIM_OFFLINE_RECEIPT"
          node scripts/simIdleTimers.mjs > "$OUT/idle-timers.log" 2>&1
          node --input-type=module <<'JS'
          import fs from 'node:fs';import path from 'node:path';import assert from 'node:assert/strict';import{createHash}from'node:crypto';
          const hash=b=>createHash('sha256').update(b).digest('hex'),source=fs.readFileSync('scripts/simIdleTimers.mjs');
          assert.equal(source.length,7554);assert.equal(hash(source),'7a8e6f47cb47b5cb34d174fcf4b93f6678a881552ff73ad81bdf9539be8b6864');
          const transformations=[{"before":"const tmp = fs.mkdtempSync(path.join(os.tmpdir(), 'idletimers-'));","after":"const tmp = fs.mkdtempSync(path.join(ROOT, process.env.OUT, 'idletimers-'));","occurrences":1},{"before":"  const text = (r.stdout || '') + (r.stderr || '');","after":"  const text = (r.stdout || '') + (r.stderr || '');\n  const capture = path.join(ROOT, process.env.OUT, 'idle-timers-control');\n  fs.writeFileSync(capture + '.child.log', text);\n  fs.writeFileSync(capture + '.child-process.json', JSON.stringify({status:r.status,signal:r.signal,error:r.error?String(r.error):null,reportExists:fs.existsSync(out)},null,2)+'\\n');\n  if (fs.existsSync(out)) fs.copyFileSync(out, capture + '.child-vitest.json');\n  if (env.OWNED_TIMEOUTS_HOOK) fs.copyFileSync(env.OWNED_TIMEOUTS_HOOK, capture + '.helper.ts');","occurrences":1}];
          let copy=source.toString('utf8');for(const change of transformations){assert.equal(copy.split(change.before).length,2);copy=copy.replace(change.before,change.after);}
          let inverse=copy;for(const change of transformations){assert.equal(inverse.split(change.after).length,2);inverse=inverse.replace(change.after,change.before);}assert(Buffer.from(inverse).equals(source));
          assert.equal(hash(copy),'1d09893502ebc3d50f5cd916ad8c51151799ed83620868b9b008e2fdc8b352f4');assert.notEqual(hash(copy),hash(source));
          const output=path.join(process.env.OUT,'simIdleTimers.resolution-copy.mjs');fs.writeFileSync(output,copy);assert.equal(path.dirname(path.dirname(path.resolve(output))),process.cwd());
          fs.writeFileSync(process.env.OUT+'/idle-timers-copy-method.json',JSON.stringify({sourceBytes:source.length,sourceSha256:hash(source),copyBytes:Buffer.byteLength(copy),copySha256:hash(copy),transforms:transformations.length,wholeInverseExact:true,sourceHeld:fs.readFileSync('scripts/simIdleTimers.mjs').equals(source),conditionalCause:'External temporary importer dependency resolution, adoption requires actual prior raw child cause'},null,2)+'\n');
          JS
          status=0
          IDLE_TIMERS_CONTROL=all node "$OUT/simIdleTimers.resolution-copy.mjs" > "$OUT/idle-timers-controls.log" 2>&1 || status=$?
          printf '%s\n' "$status" > "$OUT/idle-timers-controls.exit"
          CONTROL_STATUS="$status" node --input-type=module <<'JS'
          import fs from 'node:fs';import assert from 'node:assert/strict';import{createHash}from'node:crypto';
          const base=process.env.OUT,read=f=>fs.readFileSync(base+'/'+f,'utf8'),hash=b=>createHash('sha256').update(b).digest('hex');
          assert.equal(Number(process.env.CONTROL_STATUS),0);const child=JSON.parse(read('idle-timers-control.child-process.json'));assert.equal(child.status,1);assert.equal(child.signal,null);assert.equal(child.error,null);assert.equal(child.reportExists,true);
          const report=JSON.parse(read('idle-timers-control.child-vitest.json')),rows=report.testResults.flatMap(s=>s.assertionResults??[]);
          assert.equal(report.success,false);assert.equal(report.numTotalTests,2);assert.equal(report.numPassedTests,0);assert.equal(report.numFailedTests,2);assert.equal(report.numPendingTests,0);assert.equal(report.numTodoTests,0);assert.equal(report.numRuntimeErrorTestSuites??0,0);assert.equal(report.numUnhandledErrors??0,0);assert.deepEqual(report.unhandledErrors??[],[]);assert.equal(report.testResults.length,1);assert.equal(rows.length,2);
          const expected=[['Stadium Tycoon clears every floater timer when the page goes away','Stadium Tycoon'],['Idle Arena clears every floater timer when the page goes away','Idle Arena']];
          for(const[title,game]of expected){const matches=rows.filter(row=>row.fullName==='idle game floaters '+title);assert.equal(matches.length,1);const row=matches[0];assert.equal(row.status,'failed');assert.equal(row.failureMessages.length,1);assert.match(row.failureMessages[0],/AssertionError/);const leak=row.failureMessages[0].match(/(?:^|\s)([1-9]\d*) (Stadium Tycoon|Idle Arena) floater timers kept running after the page unmounted/);assert(leak);assert.equal(leak[2],game);assert.doesNotMatch(row.failureMessages[0],/Cannot find|Failed to resolve|SyntaxError|ReferenceError|TypeError/);}
          assert.doesNotMatch(read('idle-timers-control.child.log'),/Unhandled (?:Errors?|Rejection)|Vitest caught \d+ unhandled|Cannot find|Failed to resolve/);
          const helper=fs.readFileSync('src/hooks/useOwnedTimeouts.ts','utf8').replaceAll('\r\n','\n'),broken=read('idle-timers-control.helper.ts'),clearing='      owned.forEach(clearTimeout);\n',removed='      /* control: never cleared */\n';assert.equal(helper.split(clearing).length,2);assert.equal(broken,helper.replace(clearing,removed));assert.notEqual(hash(broken),hash(helper));assert.equal(broken.split(removed).length,2);assert.equal(broken.replace(removed,clearing),helper);
          const log=read('idle-timers-controls.log');assert(log.includes('CONTROL FIRED: both games red on a helper that never clears'));assert(log.includes('control rawtimer: flagged [src/hooks/useIdleArena.ts]; the same text in a comment flagged []'));assert(log.includes('CONTROL FIRED: the planted raw timer was flagged and the comment was not'));assert(log.includes('simIdleTimers controls: green. Each control turned its own check red and only that one.'));
          fs.writeFileSync(base+'/idle-timers-controls-admission.json',JSON.stringify({complete:true,source:process.env.GITHUB_SHA,outerExit:Number(process.env.CONTROL_STATUS),childExit:child.status,ownedTimerFailures:rows.map(r=>r.fullName),normalOriginalHarnessHeld:true,helperSha256:hash(helper),mutatedHelperSha256:hash(broken),changedHelper:true,wholeHelperInverseExact:true,rawTimerFlaggedExactly:true,commentOnlyClean:true},null,2)+'\n');
          JS
          test ! -s "$SIM_OFFLINE_RECEIPT"
      - name: Actual Profile boundary proof with exact original classification
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          export SIM_OFFLINE_RECEIPT="$PWD/$OUT/focused.transport"
          status=0
          timeout --signal=TERM --kill-after=15s 4m node_modules/.bin/vitest run src/test/profileInitials1446.test.tsx --maxWorkers=1 --reporter=json --outputFile="$OUT/profile.json" > "$OUT/profile.log" 2>&1 || status=$?
          printf '%s\n' "$status" > "$OUT/profile.exit"
          STATUS="$status" node --input-type=module <<'JS'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const r=JSON.parse(fs.readFileSync(process.env.OUT+'/profile.json','utf8')),rows=r.testResults.flatMap(s=>s.assertionResults);
          const expected=[['keeps a stored avatar URL inert on the own profile','PROFILE_INITIALS_1446_STORED_IMAGE'],['keeps the legacy Auth metadata avatar URL inert','PROFILE_INITIALS_1446_METADATA_IMAGE'],['uses the viewed subject initial with a different signed-in viewer','PROFILE_INITIALS_1446_PUBLIC_IMAGE'],['uses the viewed username when its display name is missing','PROFILE_INITIALS_1446_USERNAME_INITIAL'],['uses U when the profile has neither public name nor username','PROFILE_INITIALS_1446_NEUTRAL_INITIAL'],['keeps the existing display-name initial without an avatar URL',null]];
          assert.equal(r.numTotalTests,6);assert.equal(rows.length,6);assert.equal(r.testResults.length,1);assert.equal(r.numPendingTests,0);assert.equal(r.numTodoTests,0);assert.equal(r.numRuntimeErrorTestSuites??0,0);assert.equal(r.numUnhandledErrors??0,0);assert.deepEqual(r.unhandledErrors??[],[]);
          for(const [title,marker] of expected){const found=rows.filter(row=>row.fullName==='Profile initials1446 '+title);assert.equal(found.length,1);const row=found[0];if(process.env.PHASE==='original'&&marker){assert.equal(row.status,'failed');assert.equal(row.failureMessages.length,1);assert(row.failureMessages[0].includes(marker));assert.match(row.failureMessages[0],/AssertionError|expected/);assert.doesNotMatch(row.failureMessages[0],/Cannot find|Failed to resolve|SyntaxError|ReferenceError|TypeError/);}else assert.equal(row.status,'passed');}
          const original=process.env.PHASE==='original';assert.equal(Number(process.env.STATUS),original?1:0);assert.equal(r.success,!original);assert.equal(r.numFailedTests,original?5:0);assert.equal(r.numPassedTests,original?1:6);
          fs.writeFileSync(process.env.OUT+'/profile-admission.json',JSON.stringify({complete:true,source:process.env.GITHUB_SHA,phase:process.env.PHASE,result:original?'INTENDED_RED':'PASS',cases:6,failed:r.numFailedTests,passed:r.numPassedTests},null,2)+'\n');
          JS
          test ! -s "$SIM_OFFLINE_RECEIPT"
      - name: Profile old-source copied control and exact restoration
        if: env.PHASE != 'original'
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          export SIM_OFFLINE_RECEIPT="$PWD/$OUT/focused.transport"
          git show "$BASE_SOURCE:src/pages/Profile.tsx" > "$OUT/Profile.old.tsx"
          cmp_status=0;cmp src/pages/Profile.tsx "$OUT/Profile.old.tsx" > "$OUT/profile-control-difference.log" 2>&1 || cmp_status=$?;test "$cmp_status" -eq 1
          export NO_DOUBLE_SWAP="$(COPY="$PWD/$OUT/Profile.old.tsx" node -e 'console.log(JSON.stringify({"@/pages/Profile":process.env.COPY}))')"
          status=0;timeout --signal=TERM --kill-after=15s 4m node_modules/.bin/vitest run src/test/profileInitials1446.test.tsx --maxWorkers=1 --reporter=json --outputFile="$OUT/profile-fault.json" > "$OUT/profile-fault.log" 2>&1 || status=$?
          STATUS="$status" node --input-type=module <<'JS'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const r=JSON.parse(fs.readFileSync(process.env.OUT+'/profile-fault.json','utf8')),rows=r.testResults.flatMap(s=>s.assertionResults),markers=['STORED_IMAGE','METADATA_IMAGE','PUBLIC_IMAGE','USERNAME_INITIAL','NEUTRAL_INITIAL'];assert.equal(Number(process.env.STATUS),1);assert.equal(r.success,false);assert.equal(r.numTotalTests,6);assert.equal(r.numFailedTests,5);assert.equal(r.numPassedTests,1);assert.equal(r.numPendingTests,0);assert.equal(r.numTodoTests,0);assert.equal(r.numRuntimeErrorTestSuites??0,0);assert.equal(r.numUnhandledErrors??0,0);assert.deepEqual(r.unhandledErrors??[],[]);const failed=rows.filter(row=>row.status==='failed');assert.equal(failed.length,5);for(const marker of markers){const found=failed.filter(row=>row.failureMessages.length===1&&row.failureMessages[0].includes('PROFILE_INITIALS_1446_'+marker));assert.equal(found.length,1);assert.doesNotMatch(found[0].failureMessages[0],/Cannot find|Failed to resolve|SyntaxError|ReferenceError|TypeError/);}assert.equal(rows.filter(row=>row.status==='passed').length,1);
          JS
          unset NO_DOUBLE_SWAP
          timeout --signal=TERM --kill-after=15s 4m node_modules/.bin/vitest run src/test/profileInitials1446.test.tsx --maxWorkers=1 --reporter=json --outputFile="$OUT/profile-restored.json" > "$OUT/profile-restored.log" 2>&1
          node --input-type=module <<'JS'
          import fs from 'node:fs';import assert from 'node:assert/strict';import {createHash} from 'node:crypto';
          const r=JSON.parse(fs.readFileSync(process.env.OUT+'/profile-restored.json','utf8'));assert.equal(r.success,true);assert.equal(r.numPassedTests,6);assert.equal(r.numTotalTests,6);assert.equal(r.numFailedTests,0);assert.equal(r.numRuntimeErrorTestSuites??0,0);assert.equal(r.numUnhandledErrors??0,0);assert.deepEqual(r.unhandledErrors??[],[]);assert(r.testResults.flatMap(s=>s.assertionResults).every(t=>t.status==='passed'));const sha=file=>createHash('sha256').update(fs.readFileSync(file)).digest('hex');fs.writeFileSync(process.env.OUT+'/profile-control-binding.json',JSON.stringify({complete:true,baseline:process.env.BASE_SOURCE,actualSha256:sha('src/pages/Profile.tsx'),copySha256:sha(process.env.OUT+'/Profile.old.tsx'),alias:'@/pages/Profile',faultCases:5,restoredCases:6,sourceNeverModified:true},null,2)+'\n');
          JS
          test ! -s "$SIM_OFFLINE_RECEIPT"
      - name: Always complete source and transport evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$OUT";failed=0
          status=0;sha256sum --check "$OUT/source-before.sha256" > "$OUT/source-hold.log" 2>&1 || status=$?;printf '%s\n' "$status" > "$OUT/source-hold.exit";test "$status" -eq 0 || failed=1
          status=0;git diff --exit-code HEAD -- . > "$OUT/operator-source-hold.log" 2>&1 || status=$?;printf '%s\n' "$status" > "$OUT/operator-source-hold.exit";test "$status" -eq 0 || failed=1
          test -f "$OUT/focused.transport" && test ! -s "$OUT/focused.transport" || failed=1
          printf '%s\n' "$failed" > "$OUT/final-holds.exit"
          (cd "$OUT";find . -type f ! -path ./evidence.sha256 -print0 | sort -z | xargs -0 sha256sum) > "$OUT/evidence.sha256"
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-privacy1446-focused-${{ env.PHASE }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: site-privacy-focused-artifacts/
          if-no-files-found: error
          retention-days: 14

  unit_suite:
    needs: focused
    if: github.ref == 'refs/heads/codex/site-privacy-followup-1446-green' && (inputs.phase == 'green' || inputs.phase == 'final' || github.event_name == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1,2,3,4]
    defaults:
      run:
        shell: bash
    env:
      OUT: site-privacy-unit-artifacts
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Full unit partition and literal result counts
        run: |
          set -euo pipefail
          mkdir "$OUT"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD > "$OUT/head.txt"
          git ls-files -z -- . | sort -z | xargs -0 sha256sum > "$OUT/source-before.sha256"
          npm ci > "$OUT/install.log" 2>&1
          for anchor in 56356be9a5d4d310f1759c09ba8e3811a8a05c1b e8b39ccc39f763351d4439c833b853c2e3ed2188 6b7596d2c009802e6c011492ae1cefa8af29c62a 31a4ec01f13dde6ce5614d371f5aa135e08ef8da 2b7dda2951fb9b63e76a2af66970cb682f312105 0c66a55929dfe8d6493a86aa00a28ef0ed2db25d;do
            git fetch --no-tags --depth=1 origin "$anchor"
            git cat-file -e "$anchor^{commit}"
          done > "$OUT/historical-inputs.log" 2>&1
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          export SIM_OFFLINE_RECEIPT="$PWD/$OUT/unit.transport";: > "$SIM_OFFLINE_RECEIPT"
          status=0;timeout --signal=TERM --kill-after=15s 38m npm test -- --shard=${{ matrix.shard }}/4 --maxWorkers=2 --reporter=json --outputFile="$OUT/unit.json" > "$OUT/unit.log" 2>&1 || status=$?
          printf '%s\n' "$status" > "$OUT/unit.exit";test "$status" -eq 0
          node --input-type=module <<'JS'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const r=JSON.parse(fs.readFileSync(process.env.OUT+'/unit.json','utf8')),rows=r.testResults.flatMap(s=>s.assertionResults);assert.equal(r.success,true);assert.equal(r.numFailedTests,0);assert.equal(r.numRuntimeErrorTestSuites??0,0);assert.equal(r.numUnhandledErrors??0,0);assert.deepEqual(r.unhandledErrors??[],[]);assert(r.testResults.length>0&&r.numTotalTests>0);assert.equal(rows.filter(t=>t.status==='failed').length,0);assert.equal(rows.length,r.numTotalTests);assert.equal(rows.filter(t=>t.status==='passed').length,r.numPassedTests);fs.writeFileSync(process.env.OUT+'/literal-counts.json',JSON.stringify({source:process.env.GITHUB_SHA,files:r.testResults.length,cases:rows.length,passed:r.numPassedTests,pending:r.numPendingTests,todo:r.numTodoTests,failed:0},null,2)+'\n');
          JS
          test ! -s "$SIM_OFFLINE_RECEIPT"
      - name: Always retain partition source and transport evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$OUT";failed=0
          status=0;sha256sum --check "$OUT/source-before.sha256" > "$OUT/source-hold.log" 2>&1 || status=$?;printf '%s\n' "$status" > "$OUT/source-hold.exit";test "$status" -eq 0 || failed=1
          status=0;git diff --exit-code HEAD -- . > "$OUT/operator-source-hold.log" 2>&1 || status=$?;printf '%s\n' "$status" > "$OUT/operator-source-hold.exit";test "$status" -eq 0 || failed=1
          test -f "$OUT/unit.transport" && test ! -s "$OUT/unit.transport" || failed=1
          printf '%s\n' "$failed" > "$OUT/final-holds.exit"
          (cd "$OUT";find . -type f ! -path ./evidence.sha256 -print0 | sort -z | xargs -0 sha256sum) > "$OUT/evidence.sha256"
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-privacy1446-unit-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: site-privacy-unit-artifacts/
          if-no-files-found: error
          retention-days: 14

  build_browser:
    needs: focused
    runs-on: ubuntu-latest
    timeout-minutes: 65
    defaults:
      run:
        shell: bash
    env:
      ENGINES: chromium
      PRERENDER_ONLY: /privacy,/cookie-policy
      OUT: site-privacy-build-artifacts
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact source and complete original baseline protection
        run: |
          set -euo pipefail
          mkdir "$OUT"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD > "$OUT/head.txt"
          printf '%s\n' "$PHASE" > "$OUT/phase.txt"
          git fetch --no-tags --depth=1 origin "$BASE_SOURCE" > "$OUT/base-fetch.log" 2>&1
          git diff --exit-code "$BASE_SOURCE" HEAD -- package.json package-lock.json vitest.config.ts scripts/sweepWeight.mjs scripts/lib/offlineTransport.cjs .github/workflows/consent-analytics-1445.yml .github/workflows/seo-discovery-1444.yml > "$OUT/dependency-cap-historical-hold.log"
