      - name: Always bind source, generated output, completed dist and all evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$OUT";failed=0
          status=0;{
            find public scripts/data/lastmod.json scripts/data/guideHeadingsFrozen.json src/data/searchKeywords.json ! -type d ! -type f -print > "$OUT/generated-source-nonregular-after.txt" &&
            test ! -s "$OUT/generated-source-nonregular-after.txt" &&
            find public scripts/data/lastmod.json scripts/data/guideHeadingsFrozen.json src/data/searchKeywords.json -type f -print0 | sort -z | xargs -0 sha256sum > "$OUT/generated-source-after.sha256" &&
            cmp "$OUT/generated-source-before.sha256" "$OUT/generated-source-after.sha256"
          } > "$OUT/generated-output-hold.log" 2>&1 || status=$?
          printf '%s\n' "$status" > "$OUT/generated-output-hold.exit";test "$status" -eq 0 || failed=1
          status=0;{
            find dist ! -type d ! -type f -print > "$OUT/dist-nonregular-after.txt" &&
            test ! -s "$OUT/dist-nonregular-after.txt" &&
            find dist -type f -print0 | sort -z | xargs -0 sha256sum > "$OUT/dist-after.sha256" &&
            cmp "$OUT/dist.sha256" "$OUT/dist-after.sha256"
          } > "$OUT/dist-output-hold.log" 2>&1 || status=$?
          printf '%s\n' "$status" > "$OUT/dist-output-hold.exit";test "$status" -eq 0 || failed=1
          status=0;sha256sum --check "$OUT/source-before.sha256" > "$OUT/source-hold.log" 2>&1 || status=$?;printf '%s\n' "$status" > "$OUT/source-hold.exit";test "$status" -eq 0 || failed=1
          status=0;sha256sum --check "$OUT/dependencies-cap-before.sha256" > "$OUT/dependencies-cap-hold.log" 2>&1 || status=$?;printf '%s\n' "$status" > "$OUT/dependencies-cap-hold.exit";test "$status" -eq 0 || failed=1
          status=0;git diff --exit-code HEAD -- . ':!public/**' ':!scripts/data/lastmod.json' > "$OUT/operator-source-hold.log" 2>&1 || status=$?;printf '%s\n' "$status" > "$OUT/operator-source-hold.exit";test "$status" -eq 0 || failed=1
          git ls-files --others --exclude-standard -- src scripts supabase .github index.html package.json package-lock.json vitest.config.ts > "$OUT/source-untracked-after.txt"
          test ! -s "$OUT/source-untracked-after.txt" || failed=1
          status=0;sha256sum --check "$OUT/font-inputs.sha256" > "$OUT/font-inputs-hold.log" 2>&1 || status=$?;printf '%s\n' "$status" > "$OUT/font-inputs-hold.exit";test "$status" -eq 0 || failed=1
          status=0;node --input-type=module > "$OUT/transport-hold.log" 2>&1 <<'JS' || status=$?
          import fs from 'node:fs';import path from 'node:path';import assert from 'node:assert/strict';
          const rows=[];function walk(dir){for(const e of fs.readdirSync(dir,{withFileTypes:true})){const file=path.join(dir,e.name);if(e.isDirectory())walk(file);else if(file.endsWith('.transport'))rows.push({file,bytes:fs.statSync(file).size});}}walk(process.env.OUT);fs.writeFileSync(process.env.OUT+'/transport-hold.json',JSON.stringify({complete:true,receipts:rows,zeroActualAttempts:rows.length>0&&rows.every(row=>row.bytes===0)},null,2)+'\n');assert(rows.length>0);assert(rows.every(row=>row.bytes===0),'Offline transport attempted');
          JS
          printf '%s\n' "$status" > "$OUT/transport-hold.exit";test "$status" -eq 0 || failed=1
          printf '%s\n' "$failed" > "$OUT/final-holds.exit"
