      - name: Locked application dependencies and isolated browser tools
        id: setup
        if: ${{ !cancelled() && steps.source.outcome == 'success' && steps.browserconsumer.outcome == 'success' }}
        run: |
          set -euo pipefail
          npm ci 2>&1 | tee nba-retry-artifacts/install.log
          node nba-retry-artifacts/helpers/evidence.mjs dependencies before
          browser_tools="$RUNNER_TEMP/nba-retry-browser-${{ github.run_id }}-${{ github.run_attempt }}"
          mkdir -p "$browser_tools"
          printf '{"private":true,"dependencies":{"playwright":"1.64.0"}}\n' > "$browser_tools/package.json"
          npm install --prefix "$browser_tools" --ignore-scripts --no-audit --no-fund 2>&1 | tee nba-retry-artifacts/browser-install.log
          test ! -e node_modules/playwright
          test ! -e node_modules/playwright-core
          ln -s "$browser_tools/node_modules/playwright" node_modules/playwright
          ln -s "$browser_tools/node_modules/playwright-core" node_modules/playwright-core
          cp "$browser_tools/package.json" nba-retry-artifacts/browser-package.json
          cp "$browser_tools/package-lock.json" nba-retry-artifacts/browser-package-lock.json
          node --input-type=module - <<'JS'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          for(const name of ['playwright','playwright-core'])assert.equal(JSON.parse(fs.readFileSync('node_modules/'+name+'/package.json')).version,'1.64.0');
          JS
          node "$browser_tools/node_modules/playwright/cli.js" install --with-deps chromium 2>&1 | tee nba-retry-artifacts/chromium-install.log
          python -m pip install fonttools pillow 2>&1 | tee nba-retry-artifacts/fonts-install.log
          python -m pip freeze > nba-retry-artifacts/python-packages.txt
          node nba-retry-artifacts/helpers/evidence.mjs dependencies after-setup
          cmp nba-retry-artifacts/dependencies-before.json nba-retry-artifacts/dependencies-after-setup.json
          node nba-retry-artifacts/helpers/evidence.mjs snapshot after-setup
          sha256sum package.json package-lock.json > nba-retry-artifacts/packages-after-setup.txt
          cmp nba-retry-artifacts/packages-before.txt nba-retry-artifacts/packages-after-setup.txt
          git diff --exit-code HEAD -- . > nba-retry-artifacts/setup-source-held.log
