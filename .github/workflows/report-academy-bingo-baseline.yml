name: Report academy and Bingo baselines
on:
  push:
    branches: [codex/report-academy-bingo-baseline-20261101]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        case: [clubManagerAcademyEconomics, playerBingoPalmerRed]
    env:
      CI: '1'
      SIM_NETWORK: offline
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Lock source and dependencies
        run: |
          mkdir evidence
          git rev-parse HEAD | tee evidence/head.txt
          test "$(git hash-object src/lib/clubManager.ts)" = cf378e002c1f253a4cd48a147af66117f982f6b2
          git diff --exit-code cc9a55a2f35b6215d5e6e664cc401d10d7f76291 -- src/lib/playerBingo.ts src/lib/clubManager.ts
          sha256sum package.json package-lock.json src/lib/playerBingo.ts src/lib/clubManager.ts src/test/clubManagerAcademyEconomics.test.ts src/test/playerBingoPalmerRed.test.ts > evidence/holds.txt
          npm ci
      - name: App types
        run: node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee evidence/types.log
      - name: Report outcome regression on original source
        run: node_modules/.bin/vitest run src/test/${{ matrix.case }}.test.ts --reporter=verbose --reporter=json --outputFile=evidence/outcomes.json 2>&1 | tee evidence/outcomes.log
      - name: Source holds
        if: always()
        run: sha256sum --check evidence/holds.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-baseline-${{ matrix.case }}-${{ github.run_id }}
          path: evidence/
          retention-days: 14
