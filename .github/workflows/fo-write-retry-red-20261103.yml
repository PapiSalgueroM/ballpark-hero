name: Front Office refused-save consumer baseline
on:
  push:
    branches: [codex/fo-write-retry-red-20261103]
permissions:
  contents: read
concurrency:
  group: fo-write-retry-red-${{ github.ref }}
  cancel-in-progress: false
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: '1'
      SIM_NETWORK: offline
      TZ: UTC
      PARENT: 7990331788f0d8666f101022f73e26aa88ee9579
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Hold the original Front Office and all other parent source
        run: |
          set -euo pipefail
          export QA_OUT="$RUNNER_TEMP/fo-write-retry-red"
          mkdir -p "$QA_OUT/sources" "$QA_OUT/transport" "$QA_OUT/raw"
          echo "QA_OUT=$QA_OUT" >> "$GITHUB_ENV"
          git rev-parse HEAD HEAD^{tree} > "$QA_OUT/source.txt"
          git diff --name-status "$PARENT" HEAD > "$QA_OUT/changed-paths.txt"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          import crypto from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          const out=process.env.QA_OUT;
          const test='src/test/frontOfficeWriteRetry.test.tsx';
          const workflow='.github/workflows/fo-write-retry-red-20261103.yml';
          const git=(...args)=>execFileSync('git',args,{encoding:'utf8'}).trim();
          const sha=file=>crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          assert.equal(git('rev-parse','HEAD^'),process.env.PARENT);
          assert.equal(git('rev-parse',process.env.PARENT+'^{tree}'),'d8ccde1c5501125209da5afd5c9a33d5e08a2ec6');
          assert.deepEqual(fs.readFileSync(path.join(out,'changed-paths.txt'),'utf8').trim().split('\n').sort(),['A\t'+workflow,'A\t'+test].sort());
          const pins={
            'src/components/front-office/FrontOfficeBoard.tsx':'e1bf0924f9d900ba63646efa32bf78cf36d381c5',
            'src/lib/frontOffice.ts':'bd4991efd3a9f70f38e5c34fd931de5c33ee793c',
            'src/lib/frontOfficeCuts.ts':'d835672cb11b2283270ffdfadf35d17abe78b228',
            'src/lib/frontOfficeSave.ts':'b7f681efaa1526f1c44f757b9e4d5495ce0859aa',
            'src/components/hub/HubTiles.tsx':'9f86af330339de9de032eb8f8009a8c5d7e133ba',
            'src/components/us-career/UsCareerBoard.tsx':'b2f81114f357b4edd17dd3a94c560a213412c817',
            'src/pages/StadiumTycoon.tsx':'d1b78bdd5d5c98c5fae237f590d48d19954eb536',
            'src/components/tycoon/TicketPolicyCard.tsx':'1e54f08a33e0b40624c8ecc73cd423701aee5f2a'
          };
          for(const [file,blob]of Object.entries(pins)){
            assert.equal(git('rev-parse','HEAD:'+file),blob,file);
            assert.equal(git('hash-object',file),blob,file);
          }
          assert.equal(git('rev-parse','HEAD:'+test),'f01d080ceae3c70e0ada3e4f1d21c0dff994be1c');
          assert.equal(sha(test),'7a994aba3f93a38cdfa551b1d9b24bd2eb8fa3caa44376b60617773c1f368bd2');
          const tracked=execFileSync('git',['ls-files','-z'],{encoding:'utf8'}).split('\0').filter(Boolean);
          assert.equal(tracked.length,5677);
          for(const file of [workflow,test,...Object.keys(pins)]){
            const dest=path.join(out,'sources',file);fs.mkdirSync(path.dirname(dest),{recursive:true});fs.copyFileSync(file,dest);
          }
          fs.writeFileSync(path.join(out,'association.json'),JSON.stringify({
            source:git('rev-parse','HEAD'),tree:git('rev-parse','HEAD^{tree}'),parent:process.env.PARENT,
            test,testGit:'f01d080ceae3c70e0ada3e4f1d21c0dff994be1c',
            testSHA:'7a994aba3f93a38cdfa551b1d9b24bd2eb8fa3caa44376b60617773c1f368bd2',
            pins,trackedFiles:tracked.length,
            scope:'Original Front Office storage-write-refusal consumer baseline only. No product, contract-filter, load-recovery, build, browser or full-suite qualification.',
            withdrawn:'The prior Cut warning and contract-view proposals are excluded. The original visible data-cut-block warning stays intact.'
          },null,2)+'\n');
          NODE
          git ls-files -z | sort -z | xargs -0 sha256sum > "$QA_OUT/source-before.sha256"
          test "$(wc -l < "$QA_OUT/source-before.sha256")" -eq 5677
          git status --porcelain=v1 --untracked-files=all > "$QA_OUT/status-before.txt"
          test ! -s "$QA_OUT/status-before.txt"
      - name: Install unchanged locked dependencies
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund > "$QA_OUT/install.log" 2>&1
          git diff --exit-code -- package.json package-lock.json
      - name: Proper original application types
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$GITHUB_WORKSPACE/scripts/lib/offlineTransport.cjs"
          export SIM_OFFLINE_RECEIPT="$QA_OUT/transport/types.log"
          : > "$SIM_OFFLINE_RECEIPT"
          set +e
          node_modules/.bin/tsc --noEmit -p tsconfig.app.json > "$QA_OUT/types.log" 2>&1
          code=$?
          set -e
          printf '%s\n' "$code" > "$QA_OUT/types.exit"
          cat "$QA_OUT/types.log"
          test "$code" -eq 0
          test ! -s "$SIM_OFFLINE_RECEIPT"
      - name: Require two actual refused-write assertion failures and one healthy real Cut
        timeout-minutes: 15
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$GITHUB_WORKSPACE/scripts/lib/offlineTransport.cjs"
          export SIM_OFFLINE_RECEIPT="$QA_OUT/transport/units.log"
          export POPULAR_FO_SAVE_RAW="$QA_OUT/raw"
          : > "$SIM_OFFLINE_RECEIPT"
          unset NO_DOUBLE_SWAP US_BOARD_CONTROL_ALIAS US_BOARD_CONTROL_FILE TYCOON_ROOMS_PAGE
          set +e
          node_modules/.bin/vitest run src/test/frontOfficeWriteRetry.test.tsx --maxWorkers=1 --minWorkers=1 --reporter=verbose --reporter=json --outputFile="$QA_OUT/units.json" > "$QA_OUT/units.log" 2>&1
          unit_code=$?
          set -e
          printf '%s\n' "$unit_code" > "$QA_OUT/units.exit"
          cat "$QA_OUT/units.log"
          export SIM_OFFLINE_RECEIPT="$QA_OUT/transport/classifier.log"
          : > "$SIM_OFFLINE_RECEIPT"
          cat > "$QA_OUT/qualify.mjs" <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          const out=process.env.QA_OUT;
          const read=name=>JSON.parse(fs.readFileSync(path.join(out,name),'utf8'));
          const r=read('units.json'),log=fs.readFileSync(path.join(out,'units.log'),'utf8');
          const declarations=[
            ['NFL Front Office refused save recovery a real Cut reports its refused write and retries the exact pending snapshot until storage accepts it','FO_SAVE_REFUSAL_NOTICE'],
            ['NFL Front Office refused save recovery two real refused Cuts retry the latest complete state rather than overwriting it with the earlier attempt','FO_SAVE_LATEST_NOTICE'],
            ['NFL Front Office refused save recovery a healthy real Cut still writes once with the existing cap cost and no refused-save warning',null]
          ];
          assert.doesNotMatch(log,/Unhandled (?:Error|Rejection)|Vitest caught \d+ unhandled|uncaughtException|unhandledRejection/);
          assert.equal(r.testResults.length,1);
          const file=r.testResults[0],rows=file.assertionResults;
          assert(file.name.replaceAll('\\','/').endsWith('/src/test/frontOfficeWriteRetry.test.tsx'));
          assert(!file.error&&!file.failureMessage&&!file.message,'No collection or setup error');
          assert.equal(rows.length,3);assert.equal(new Set(rows.map(row=>row.fullName)).size,3);
          assert.deepEqual(rows.map(row=>row.fullName).sort(),declarations.map(([name])=>name).sort());
          const strip=value=>String(value).replace(/\u001b\[[0-9;]*m/g,'');
          for(const row of rows){
            const marker=declarations.find(([name])=>name===row.fullName)[1];
            const messages=(row.failureMessages??[]).map(strip);
            assert.equal(row.status,marker?'failed':'passed',row.fullName);
            if(marker){
              assert(messages.length>0);
              assert(messages.every(message=>message.includes(marker)&&message.includes('AssertionError')));
              assert(messages.every(message=>!/(?:SyntaxError|TypeError|ReferenceError|RangeError|Cannot find module|Failed to load|Unhandled (?:Error|Rejection))/.test(message)));
            }else assert.deepEqual(messages,[]);
          }
          assert.equal(r.numTotalTests,3);assert.equal(r.numFailedTests,2);assert.equal(r.numPassedTests,1);
          assert.equal(r.success,false);assert.equal(file.status,'failed');
          assert.equal(fs.readFileSync(path.join(out,'units.exit'),'utf8').trim(),'1');
          const counters={};
          for(const key of ['numRuntimeErrorTestSuites','numUnhandledErrors']){
            counters[key]=Object.hasOwn(r,key)?r[key]:null;
            if(counters[key]!==null){assert.equal(typeof counters[key],'number');assert.equal(counters[key],0);}
          }
          for(const key of ['numPendingTests','numTodoTests','numPendingTestSuites'])if(Object.hasOwn(r,key))assert.equal(r[key],0);
          assert.deepEqual(fs.readdirSync(path.join(out,'raw')).sort(),['healthy.json','latest.json','refused.json']);
          const refused=read('raw/refused.json'),latest=read('raw/latest.json'),healthy=read('raw/healthy.json');
          assert.deepEqual(refused,{
            initialRoster:7,currentRoster:6,diskRoster:7,attempts:1,pendingRoster:6,pendingCap:13,
            diskBytesHeld:true,unrelatedHeld:true,noticeCount:0,afterRetry:null
          });
          assert.deepEqual(latest,{
            initialRoster:8,currentRoster:6,diskRoster:8,attempts:2,attemptedRosters:[7,6],pendingCap:14,
            diskBytesHeld:true,unrelatedHeld:true,noticeCount:0,afterRetry:null
          });
          assert.deepEqual(healthy,{
            initialRoster:7,currentRoster:6,savedRoster:6,attempts:1,exactAttemptWritten:true,cap:13,
            deadCap:[{playerId:'save-retry-fixture-6',name:'Save retry fixture 7',amount:1,seasonsLeft:2}],
            noticeCount:0,unrelatedHeld:true,removals:0
          });
          for(const receipt of ['types.log','units.log','classifier.log'])assert.equal(fs.statSync(path.join(out,'transport',receipt)).size,0);
          fs.writeFileSync(path.join(out,'admission.json'),JSON.stringify({
            status:'ACTUAL_TWO_OWNED_REFUSED_WRITE_ASSERTIONS_AND_ONE_HEALTHY_CUT',
            rows:3,owned:declarations.filter(([,marker])=>marker).map(([name])=>name),
            held:declarations.filter(([,marker])=>!marker).map(([name])=>name),
            rawFiles:['refused.json','latest.json','healthy.json'],counters,absentCounterMeaning:'UNKNOWN',nativeExit:1,
            limits:'Actual original-writer refusal baseline, not a fixed retry, product, load-recovery, build, browser or full-suite pass.'
          },null,2)+'\n');
          console.log('Front Office: two owned refused-write assertions, one healthy real Cut, three exact RAW state/disk vectors.');
          NODE
          set +e
          node "$QA_OUT/qualify.mjs" > "$QA_OUT/classifier.log" 2>&1
          classifier_code=$?
          set -e
          printf '%s\n' "$classifier_code" > "$QA_OUT/classifier.exit"
          cat "$QA_OUT/classifier.log"
          test "$classifier_code" -eq 0
          test ! -s "$SIM_OFFLINE_RECEIPT"
          test "$unit_code" -eq 1
          # Preserve the actual original consumer failure as the baseline job outcome.
          exit "$unit_code"
      - name: Preserve source closure and finite evidence
        id: retain
        if: always()
        run: |
          set -uo pipefail
          git diff --exit-code HEAD > "$QA_OUT/source-diff.txt"
          diff_exit=$?
          git ls-files -z | sort -z | xargs -0 sha256sum > "$QA_OUT/source-after.sha256"
          map_exit=$?
          cmp "$QA_OUT/source-before.sha256" "$QA_OUT/source-after.sha256" > "$QA_OUT/source-compare.log" 2>&1
          compare_exit=$?
          sha256sum --check "$QA_OUT/source-before.sha256" > "$QA_OUT/source-held.log" 2>&1
          held_exit=$?
          git status --porcelain=v1 --untracked-files=all > "$QA_OUT/status-after.txt"
          status_exit=$?
          cmp "$QA_OUT/status-before.txt" "$QA_OUT/status-after.txt" > "$QA_OUT/status-compare.log" 2>&1
          status_compare_exit=$?
          transport_exit=0
          for receipt in "$QA_OUT"/transport/*.log; do
            test -f "$receipt" && test ! -s "$receipt" || transport_exit=1
          done
          printf '{"diff":%s,"map":%s,"compare":%s,"held":%s,"status":%s,"statusCompare":%s,"transport":%s}\n' "$diff_exit" "$map_exit" "$compare_exit" "$held_exit" "$status_exit" "$status_compare_exit" "$transport_exit" > "$QA_OUT/closure.json"
          bytes=$(du -sb "$QA_OUT" | cut -f1)
          printf '%s\n' "$bytes" > "$QA_OUT/artifact-bytes.txt"
          test "$bytes" -lt 150000000 || exit 1
          echo 'artifact_ok=true' >> "$GITHUB_OUTPUT"
          test "$diff_exit" -eq 0 && test "$map_exit" -eq 0 && test "$compare_exit" -eq 0 && test "$held_exit" -eq 0 && test "$status_exit" -eq 0 && test "$status_compare_exit" -eq 0 && test "$transport_exit" -eq 0
      - uses: actions/upload-artifact@v4
        if: always() && steps.retain.outputs.artifact_ok == 'true'
        with:
          name: fo-write-retry-red-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fo-write-retry-red
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
