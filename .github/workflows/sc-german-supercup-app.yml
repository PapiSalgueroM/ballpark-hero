          const changed = fs.readFileSync(out + '/generated-paths.txt', 'utf8').trim().split('\n').filter(Boolean), untracked = fs.readFileSync(out + '/untracked.txt', 'utf8').trim().split('\n').filter(Boolean);
          for (const file of changed) assert(allowed.includes(file), 'Only the three existing generated paths may change: ' + file);
          assert.deepEqual(untracked, []);
          const afterFile = process.env.SC_SHIELD_BUILD_QA ? process.env.SC_SHIELD_BUILD_QA + '/after-manifest.json' : null;
          const after = afterFile && fs.existsSync(afterFile) ? JSON.parse(fs.readFileSync(afterFile, 'utf8')) : null;
