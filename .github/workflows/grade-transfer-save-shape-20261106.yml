      - name: Whole tracked source locks versions and offline held
        if: always()
        run: |
          set -euo pipefail
          git ls-files -s > grade-save-fixed/source-after.txt
          cmp grade-save-fixed/source-before.txt grade-save-fixed/source-after.txt
          git diff --exit-code HEAD -- .
          sha256sum package.json package-lock.json > grade-save-fixed/locks-after.txt
          cmp grade-save-fixed/locks-before.txt grade-save-fixed/locks-after.txt
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';import {execFileSync} from 'node:child_process';import {createHash} from 'node:crypto';
          const out='grade-save-fixed',files=execFileSync('git',['ls-files','-z'],{encoding:'utf8'}).split('\0').filter(Boolean);
          const rows=files.map(file=>{const b=fs.readFileSync(file);return{file,bytes:b.length,sha256:createHash('sha256').update(b).digest('hex')};});
