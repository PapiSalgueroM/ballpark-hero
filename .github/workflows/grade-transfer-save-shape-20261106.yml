      - name: Final whole source locks installed versions dist and offline holds
        if: always()
        run: |
          set -euo pipefail
          mkdir -p grade-save-qualified
          git ls-files -s > grade-save-qualified/source-after.txt
          cmp grade-save-qualified/source-before.txt grade-save-qualified/source-after.txt
          git diff --exit-code HEAD -- .
          sha256sum package.json package-lock.json > grade-save-qualified/locks-after.txt
          cmp grade-save-qualified/locks-before.txt grade-save-qualified/locks-after.txt
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import {execFileSync} from 'node:child_process';import {createHash} from 'node:crypto';import assert from 'node:assert/strict';
          const hash=file=>{const b=fs.readFileSync(file);return {file,bytes:b.length,sha256:createHash('sha256').update(b).digest('hex')};};
          const files=execFileSync('git',['ls-files','-z'],{encoding:'utf8'}).split('\0').filter(Boolean),tracked=files.map(hash);
          fs.writeFileSync('grade-save-qualified/tracked-after.json',JSON.stringify(tracked));assert.deepEqual(tracked,JSON.parse(fs.readFileSync('grade-save-qualified/tracked-before.json')));
          const before=JSON.parse(fs.readFileSync('grade-save-qualified/installed-before.json')),lock=JSON.parse(fs.readFileSync('package-lock.json'));
          const after=Object.keys(lock.packages).filter(p=>p.startsWith('node_modules/')&&fs.existsSync(p+'/package.json')).map(p=>[p,JSON.parse(fs.readFileSync(p+'/package.json')).version]);
          assert.equal(after.length,521);assert.deepEqual(after,before);fs.writeFileSync('grade-save-qualified/installed-final.json',JSON.stringify(after));
          const walk=dir=>fs.readdirSync(dir,{withFileTypes:true}).sort((a,b)=>a.name.localeCompare(b.name)).flatMap(e=>e.isDirectory()?walk(dir+'/'+e.name):e.isFile()?[dir+'/'+e.name]:[]);
          if(fs.existsSync('grade-save-qualified/dist-before.json')){const rows=walk('dist').map(hash);fs.writeFileSync('grade-save-qualified/dist-after.json',JSON.stringify(rows));assert.deepEqual(rows,JSON.parse(fs.readFileSync('grade-save-qualified/dist-before.json')));}
          assert(fs.existsSync('grade-save-qualified/offline.log'));assert.equal(fs.statSync('grade-save-qualified/offline.log').size,0);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grade-save-qualified-${{ github.run_id }}
          path: grade-save-qualified
          retention-days: 14
          if-no-files-found: error
