      - name: Actual fixed eleven cases and complete preservation
        run: |
          set -euo pipefail
          GRADE_TRANSFER_SAVE_RAW="$PWD/grade-save-fixed/raw.json" NODE_OPTIONS="--max-old-space-size=6144 --require=$PWD/scripts/lib/offlineTransport.cjs" node node_modules/vitest/vitest.mjs run src/test/gradeTransferSaveShape.test.tsx --maxWorkers=1 --minWorkers=1 --reporter=default --reporter=json --outputFile=grade-save-fixed/owned.json 2>&1 | tee grade-save-fixed/owned.log
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';import {createHash} from 'node:crypto';
          const out='grade-save-fixed',r=JSON.parse(fs.readFileSync(out+'/owned.json')),raw=JSON.parse(fs.readFileSync(out+'/raw.json')),old=JSON.parse(fs.readFileSync(out+'/original-packet/raw.json')),log=fs.readFileSync(out+'/owned.log','utf8'),rows=r.testResults.flatMap(s=>s.assertionResults);assert.equal(r.numTotalTests,11);assert.equal(r.numPassedTests,11);assert.equal(r.numFailedTests,0);assert.equal(r.numPendingTests,0);assert.equal(rows.length,11);assert(rows.every(r=>r.status==='passed'));for(const k of ['numRuntimeErrorTestSuites','numUnhandledErrors'])if(Object.hasOwn(r,k))assert.equal(r[k],0,k);assert(!/Unhandled Errors|Unhandled Rejection|Uncaught Exception|Failed to resolve import|No test files found|SyntaxError/.test(log));
          assert.deepEqual({...raw,cases:null},{...old,cases:null});assert.deepEqual(Object.keys(raw.cases).sort(),Object.keys(old.cases).sort());let frames=0;for(const[k,c]of Object.entries(raw.cases)){assert.equal(c.title,old.cases[k].title);assert.deepEqual(c.frames.map(f=>f.label),old.cases[k].frames.map(f=>f.label));frames+=c.frames.length;for(const f of c.frames){assert.equal(f.state.rounds.length,5);assert.equal(f.state.loading,false);for(const key of['draws','transport','operationErrors','boundaries','completions'])assert(Array.isArray(f[key]));assert.equal(f.storage['grade-transfer-unrelated'],'held');assert.equal(f.operationErrors.length,0);}}assert.equal(frames,47);
          const preserved=['missing','corrupt','short','partial','revealed','finished'];for(const key of preserved)assert.deepEqual(raw.cases[key],old.cases[key],'Entire original preservation case held: '+key);
          for(const key of ['gradesObject','indexNegative','indexFraction','indexString','gradeItem']){const c=raw.cases[key].frames,before=c[0],after=c[1];assert.equal(before.state.index,0);assert.equal(before.state.current.tc.playerName,before.state.rounds[0].tc.playerName);assert.equal(before.state.status,'grading');assert.equal(before.state.score,0);assert.equal(before.page.gradeButtons.length,5);assert.equal(before.savedBytes,before.boundaries[before.boundaries.length-1].bytes);assert.equal(after.state.status,'revealed');assert.equal(after.state.score,100);assert.equal(after.state.current.userGrade,'A');assert.equal(after.operationErrors.length,0);assert.equal(after.transport.filter(q=>q.steps.some(s=>s.method==='insert')).length,1);}const next=raw.cases.indexString.frames[2];assert.equal(next.state.index,1);assert.equal(next.state.status,'grading');assert.equal(next.page.gradeButtons.length,5);
          const b=fs.readFileSync(out+'/raw.json');fs.writeFileSync(out+'/fixed-admission.json',JSON.stringify({status:'fixed-eleven-passed-six-whole-cases-held',cases:11,rawFrames:frames,preservedCases:preserved,rawBytes:b.length,rawSHA256:createHash('sha256').update(b).digest('hex')},null,2));console.log('PASS actual11 fixed,47RAW,6 complete original preservation cases');
