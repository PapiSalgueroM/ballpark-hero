      - name: Existing Grade the Transfer once-only finished reload
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          NO_DOUBLE_ONLY=grade-transfer NODE_OPTIONS="--max-old-space-size=6144 --require=$PWD/scripts/lib/offlineTransport.cjs" node node_modules/vitest/vitest.mjs run src/test/noDoubleRecord.test.tsx --maxWorkers=1 --minWorkers=1 --reporter=default --reporter=json --outputFile=grade-save-fixed/existing.json 2>&1 | tee grade-save-fixed/existing.log
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';const out='grade-save-fixed',r=JSON.parse(fs.readFileSync(out+'/existing.json')),rows=r.testResults.flatMap(s=>s.assertionResults);assert.equal(r.numTotalTests,3);assert.equal(r.numPassedTests,3);assert.equal(r.numFailedTests,0);assert.equal(r.numPendingTests,0);assert.equal(rows.length,3);assert(rows.every(v=>v.status==='passed'));for(const k of ['numRuntimeErrorTestSuites','numUnhandledErrors'])if(Object.hasOwn(r,k))assert.equal(r[k],0,k);assert(!/Unhandled Errors|Unhandled Rejection|Uncaught Exception|Failed to resolve import|No test files found|SyntaxError/.test(fs.readFileSync(out+'/existing.log','utf8')));fs.writeFileSync(out+'/existing-admission.json',JSON.stringify({status:'passed',actualCases:3,scope:'Unchanged discovery/handshake and Grade the Transfer actual finish plus two finished reloads, selected by NO_DOUBLE_ONLY.'},null,2));console.log('PASS actual3 existing Grade the Transfer completion/reload cases');
