          for(const[file,sha]of Object.entries(pins))assert.equal(at('HEAD',file),sha,file);
          const owned=[hook,test,plan,runner,workflow],tree=ref=>execFileSync('git',['ls-tree','-r','-z',ref],{encoding:'utf8',maxBuffer:16*1024*1024}).split('\0').filter(Boolean),held=rows=>rows.filter(row=>!owned.includes(row.split('\t')[1]));
          assert.deepEqual(held(tree('HEAD')),held(tree(base)),'Every other tracked mode and blob equals clean PR520');assert.equal(at(base,hook),'5e677e844f8af33de27c206673fcf66849ad5930');
