name: Grade the Transfer saved-shape controls
on:
  push:
    branches: [codex/grade-transfer-save-shape-qa-20261106]
permissions:
  contents: read
  actions: read
jobs:
  controls:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      SIM_NETWORK: offline
      SIM_OFFLINE_RECEIPT: grade-save-controls/offline.log
      TZ: UTC
      GRADE_SAVE_FIXED_RUN: '42193192991'
      GRADE_SAVE_FIXED_ARTIFACT: '13490826772'
      GRADE_SAVE_FIXED_ZIP_SHA256: '5607a72130f2974fb1b689bb0b2dde10c1b17435460b7d79b889ec2a05d035b7'
