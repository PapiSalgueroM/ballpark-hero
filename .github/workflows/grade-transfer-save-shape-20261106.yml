name: Grade the Transfer fixed saved-shape proof
on:
  push:
    branches: [codex/grade-transfer-save-shape-qa-20261106]
permissions:
  contents: read
  actions: read
jobs:
  fixed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      SIM_NETWORK: offline
      SIM_OFFLINE_RECEIPT: grade-save-fixed/offline.log
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - name: Exact fixed source and locked install
        run: |
          set -euo pipefail
          test ! -e grade-save-fixed
          mkdir grade-save-fixed
          touch grade-save-fixed/offline.log
          git rev-parse HEAD > grade-save-fixed/head.txt
          git rev-parse 'HEAD^{tree}' > grade-save-fixed/tree.txt
          git ls-files -s > grade-save-fixed/source-before.txt
          sha256sum package.json package-lock.json > grade-save-fixed/locks-before.txt
          git diff --exit-code HEAD -- .
          git fetch --no-tags --depth=1 origin 069d19d994abc8f0f23c2b9edb035188b5a22519
          test "$(git rev-parse '069d19d994abc8f0f23c2b9edb035188b5a22519^{tree}')" = 4b3ec02208ca565468b3e4c4f94ae58fa1873d64
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';import {execFileSync} from 'node:child_process';import {createHash} from 'node:crypto';
          const out='grade-save-fixed',base='069d19d994abc8f0f23c2b9edb035188b5a22519',test='src/test/gradeTransferSaveShape.test.tsx',plan='docs/plans/2026-11-06-grade-transfer-save-shape.md',workflow='.github/workflows/grade-transfer-save-shape-20261106.yml',at=(ref,file)=>execFileSync('git',['rev-parse',ref+':'+file],{encoding:'utf8'}).trim();
          const pins={'src/hooks/useGradeTransfer.ts':'0048c0b04375b5035988dce33ddaa4abba80b74e','src/pages/GradeTransfer.tsx':'518f865c38c043e08048b4270a644baf50c48ce1','src/components/grade-transfer/GradeTransferBoard.tsx':'79d6c0a974bf0f8edb9914edd0ecdcf27eec5af8','src/lib/fetchTransferGrades.ts':'c7e8db542217df61adc4022facb0f2f8ca62423c','src/hooks/useGameCompletion.ts':'b104822551fd5d9b1c5d6ddb14f01c79e5a662b2','src/lib/restoredFinish.ts':'a7707c36eba160b36eb31713039329658eebe51a','src/test/noDoubleRecord.test.tsx':'35f0b55a98dbc9437bdbf4da83c6f015b54fb174',[test]:'c2d3dc2ef4e9d873e7e4a66fdab1c20eda43d585',[plan]:'c15361c0dade1ffa9205ee5ef487783ff36bc5f9','package.json':'2ff64986fb76ebc51b706f2fd24765768874008a','package-lock.json':'97d6f12a052f25f400462938c241789a083f0bfe'};
          assert.equal(at(base,'src/hooks/useGradeTransfer.ts'),'5e677e844f8af33de27c206673fcf66849ad5930');for(const[f,p]of Object.entries(pins))assert.equal(at('HEAD',f),p,f);for(const f of Object.keys(pins).filter(f=>f!==test&&f!==plan&&f!=='src/hooks/useGradeTransfer.ts'))assert.equal(at(base,f),pins[f],f+' base');
          const tree=ref=>execFileSync('git',['ls-tree','-r','-z',ref],{encoding:'utf8',maxBuffer:16*1024*1024}).split('\0').filter(Boolean),owned=[test,plan,workflow,'src/hooks/useGradeTransfer.ts'],held=rows=>rows.filter(row=>!owned.includes(row.split('\t')[1]));assert.deepEqual(held(tree('HEAD')),held(tree(base)),'Every other tracked blob equals clean Connections PR520');fs.writeFileSync(out+'/source-join.json',JSON.stringify({status:'passed',base,baseTree:'4b3ec02208ca565468b3e4c4f94ae58fa1873d64',heldRows:held(tree('HEAD')).length,onlyOwnedLeaves:owned,pins,saveDependenciesHeld:true},null,2));
          const files=execFileSync('git',['ls-files','-z'],{encoding:'utf8'}).split('\0').filter(Boolean),rows=files.map(file=>{const b=fs.readFileSync(file);return{file,bytes:b.length,sha256:createHash('sha256').update(b).digest('hex')};});fs.writeFileSync(out+'/tracked-before.json',JSON.stringify(rows));
          NODE
          npm ci 2>&1 | tee grade-save-fixed/install.log
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';const lock=JSON.parse(fs.readFileSync('package-lock.json')),rows=Object.keys(lock.packages).filter(p=>p.startsWith('node_modules/')&&fs.existsSync(p+'/package.json')).map(p=>[p,JSON.parse(fs.readFileSync(p+'/package.json')).version]);assert.equal(rows.length,521);for(const[p,v]of rows)assert.equal(v,lock.packages[p].version,p);fs.writeFileSync('grade-save-fixed/installed-before.json',JSON.stringify(rows));
          NODE
      - name: Proper App types
        run: |
          set -euo pipefail
          node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee grade-save-fixed/types.log
      - name: Complete textual census and AST code caller audit
        run: |
          set -euo pipefail
          git grep -n -I -e useGradeTransfer -e hooks/useGradeTransfer -- . > grade-save-fixed/caller-grep.txt
          git ls-files '*useGradeTransfer*' > grade-save-fixed/hook-paths.txt
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import path from 'node:path';import assert from 'node:assert/strict';import ts from 'typescript';import {execFileSync} from 'node:child_process';
          const out='grade-save-fixed',hook='src/hooks/useGradeTransfer.ts',page='src/pages/GradeTransfer.tsx',board='src/components/grade-transfer/GradeTransferBoard.tsx',name='useGradeTransfer',files=execFileSync('git',['ls-files','-z'],{encoding:'utf8'}).split('\0').filter(Boolean),hookPaths=files.filter(f=>/(?:^|\/)useGradeTransfer\.[cm]?[jt]sx?$/i.test(f));
          const sourceFiles=files.filter(f=>f.startsWith('src/')&&/\.[cm]?[jt]sx?$/.test(f)),isTest=f=>/^src\/test(?:\/|$)/.test(f)||/(?:^|\/)__tests__\//.test(f)||/\.(test|spec)\.[cm]?[jt]sx?$/.test(f),events=[],unresolved=[],parseErrors=[];
          const target=(specifier,file)=>{let resolved=specifier.startsWith('@/')?'src/'+specifier.slice(2):specifier.startsWith('.')?path.posix.join(path.posix.dirname(file),specifier):specifier;resolved=path.posix.normalize(resolved).replace(/\.[cm]?[jt]sx?$/,'');return resolved==='src/hooks/useGradeTransfer'||specifier===name;};
          for(const file of sourceFiles){
            const text=fs.readFileSync(file,'utf8'),ast=ts.createSourceFile(file,text,ts.ScriptTarget.Latest,true),production=!isTest(file);for(const d of ast.parseDiagnostics)parseErrors.push({file,message:ts.flattenDiagnosticMessageText(d.messageText,' ')});
            const record=(node,kind,module=null)=>{const pos=ast.getLineAndCharacterOfPosition(node.getStart(ast));events.push({file,production,kind,module,line:pos.line+1,column:pos.character+1,code:node.getText(ast)});};
            const visit=node=>{
              if((ts.isImportDeclaration(node)||ts.isExportDeclaration(node))&&node.moduleSpecifier&&ts.isStringLiteralLike(node.moduleSpecifier)&&target(node.moduleSpecifier.text,file))record(node,ts.isImportDeclaration(node)?'import':'reexport',node.moduleSpecifier.text);
              if(ts.isImportTypeNode(node)&&ts.isLiteralTypeNode(node.argument)&&ts.isStringLiteralLike(node.argument.literal)&&target(node.argument.literal.text,file))record(node,'type-import',node.argument.literal.text);
              if(ts.isCallExpression(node)&&(node.expression.kind===ts.SyntaxKind.ImportKeyword||(ts.isIdentifier(node.expression)&&node.expression.text==='require'))){const argument=node.arguments[0],kind=node.expression.kind===ts.SyntaxKind.ImportKeyword?'dynamic-import':'require';if(argument&&ts.isStringLiteralLike(argument)){if(target(argument.text,file))record(node,kind,argument.text);}else{const pos=ast.getLineAndCharacterOfPosition(node.getStart(ast));unresolved.push({file,production,kind,line:pos.line+1,code:node.getText(ast)});}}
              if(ts.isIdentifier(node)&&node.text===name)record(node,'symbol-identifier');ts.forEachChild(node,visit);
            };visit(ast);
          }
          const productionCallers=[...new Set(events.filter(e=>e.production&&e.file!==hook).map(e=>e.file))].sort(),unknownProductionLoads=unresolved.filter(e=>e.production),report={status:'pending-review',typescriptVersion:ts.version,commentPolicy:'TypeScript AST nodes only, never comments/trivia. Complete raw gitgrep retained separately.',scannedFiles:sourceFiles.length,hookPaths,productionCallers,events,unresolvedLoaders:unresolved,parseErrors,limits:'Direct module/symbol census includes imports, reexports, dynamic import and require. Unresolved production loaders refuse automatic admission and require source review. No transitive higher-order callgraph claim.'};
          fs.copyFileSync(hook,out+'/fixed-hook.ts');fs.copyFileSync(page,out+'/original-page.tsx');fs.copyFileSync(board,out+'/original-board.tsx');fs.writeFileSync(out+'/caller-audit.json',JSON.stringify(report,null,2));assert.deepEqual(parseErrors,[]);assert.deepEqual(hookPaths,[hook]);assert.deepEqual(productionCallers,[board],'Only known Grade the Transfer board consumes hook');assert.deepEqual(unknownProductionLoads,[],'Unresolved production loader requires review before an App fix');assert(events.some(e=>e.file===board&&e.kind==='import'));report.status='passed';fs.writeFileSync(out+'/caller-audit.json',JSON.stringify(report,null,2));console.log('PASS code callers: '+JSON.stringify({productionCallers,hookPaths,scannedFiles:sourceFiles.length}));
          NODE
      - name: Pinned completed original malformed-save packet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/PapiSalgueroM/ballpark-hero/actions/runs/42192242514 > grade-save-fixed/original-run.json
          gh api repos/PapiSalgueroM/ballpark-hero/actions/artifacts/13490107684 > grade-save-fixed/original-artifact.json
          gh api repos/PapiSalgueroM/ballpark-hero/actions/artifacts/13490107684/zip > "$RUNNER_TEMP/grade-save-original.zip"
          echo "cfdd786fc42e26ae7d64b33b3585e01a847e92c155858ff4684223192ad6718a  $RUNNER_TEMP/grade-save-original.zip" | sha256sum --check
          mkdir grade-save-fixed/original-packet
          unzip -q "$RUNNER_TEMP/grade-save-original.zip" -d grade-save-fixed/original-packet
          cp grade-save-fixed/original-packet/original-hook.ts grade-save-fixed/original-hook.ts
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';import {createHash} from 'node:crypto';
          const out='grade-save-fixed',read=f=>JSON.parse(fs.readFileSync(out+'/'+f)),run=read('original-run.json'),meta=read('original-artifact.json'),proof=read('original-packet/original-admission.json');assert.equal(run.id,42192242514);assert.equal(run.head_sha,'e836f916398ab487096985eae0e0a274db43ac43');assert.equal(run.status,'completed');assert.equal(run.conclusion,'success');assert.equal(meta.id,13490107684);assert.equal(meta.expired,false);assert.equal(meta.workflow_run.id,run.id);assert.equal(meta.workflow_run.head_sha,run.head_sha);assert.equal(proof.status,'original-five-business-reds-admitted');assert.equal(proof.actualRows,11);assert.equal(proof.rawFrames,47);const old=fs.readFileSync(out+'/original-hook.ts'),blob=createHash('sha1').update(Buffer.concat([Buffer.from('blob '+old.length+'\0'),old])).digest('hex');assert.equal(blob,'5e677e844f8af33de27c206673fcf66849ad5930');assert.equal(createHash('sha256').update(fs.readFileSync(out+'/original-packet/raw.json')).digest('hex'),'acd8e0e981dd522e77084b3d0eb20ba42cd7749afdf9363809bd562e906207ad');console.log('PASS actual original5 business failures/6 preserves/47 RAW with exact original Hook');
