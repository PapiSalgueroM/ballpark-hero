          assert.equal(fs.readFileSync(ref+'/head.txt','utf8').trim(),run.head_sha);assert.equal(fs.readFileSync(ref+'/tree.txt','utf8').trim(),'8278e5c6e7edf0d8c52ae17302c6b0f18645f264');
          for(const[a,b]of[['source-before.txt','source-after.txt'],['tracked-before.json','tracked-after.json'],['locks-before.txt','locks-after.txt'],['installed-before.json','installed-after.json']])assert.deepEqual(fs.readFileSync(path.join(ref,a)),fs.readFileSync(path.join(ref,b)),'Actual fixed physical hold '+a);
