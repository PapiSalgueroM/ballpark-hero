name: Grade the Transfer original saved-shape proof
on:
  push:
    branches: [codex/grade-transfer-save-shape-qa-20261106]
permissions:
  contents: read
jobs:
  original:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      SIM_NETWORK: offline
      SIM_OFFLINE_RECEIPT: grade-save-original/offline.log
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - name: Exact original source and locked install
        run: |
          set -euo pipefail
          test ! -e grade-save-original
          mkdir grade-save-original
          touch grade-save-original/offline.log
          git rev-parse HEAD > grade-save-original/head.txt
          git rev-parse 'HEAD^{tree}' > grade-save-original/tree.txt
          git ls-files -s > grade-save-original/source-before.txt
          sha256sum package.json package-lock.json > grade-save-original/locks-before.txt
          git diff --exit-code HEAD -- .
          git fetch --no-tags --depth=1 origin 069d19d994abc8f0f23c2b9edb035188b5a22519
          test "$(git rev-parse '069d19d994abc8f0f23c2b9edb035188b5a22519^{tree}')" = 4b3ec02208ca565468b3e4c4f94ae58fa1873d64
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';import {execFileSync} from 'node:child_process';import {createHash} from 'node:crypto';
          const out='grade-save-original',base='069d19d994abc8f0f23c2b9edb035188b5a22519',test='src/test/gradeTransferSaveShape.test.tsx',plan='docs/plans/2026-11-06-grade-transfer-save-shape.md',workflow='.github/workflows/grade-transfer-save-shape-20261106.yml',at=(ref,file)=>execFileSync('git',['rev-parse',ref+':'+file],{encoding:'utf8'}).trim();
          const pins={'src/hooks/useGradeTransfer.ts':'5e677e844f8af33de27c206673fcf66849ad5930','src/pages/GradeTransfer.tsx':'518f865c38c043e08048b4270a644baf50c48ce1','src/components/grade-transfer/GradeTransferBoard.tsx':'79d6c0a974bf0f8edb9914edd0ecdcf27eec5af8','src/lib/fetchTransferGrades.ts':'c7e8db542217df61adc4022facb0f2f8ca62423c','src/hooks/useGameCompletion.ts':'b104822551fd5d9b1c5d6ddb14f01c79e5a662b2','src/lib/restoredFinish.ts':'a7707c36eba160b36eb31713039329658eebe51a','src/test/noDoubleRecord.test.tsx':'35f0b55a98dbc9437bdbf4da83c6f015b54fb174',[test]:'c2d3dc2ef4e9d873e7e4a66fdab1c20eda43d585',[plan]:'c15361c0dade1ffa9205ee5ef487783ff36bc5f9','package.json':'2ff64986fb76ebc51b706f2fd24765768874008a','package-lock.json':'97d6f12a052f25f400462938c241789a083f0bfe'};
          for(const[f,p]of Object.entries(pins))assert.equal(at('HEAD',f),p,f);for(const f of Object.keys(pins).filter(f=>f!==test&&f!==plan))assert.equal(at(base,f),pins[f],f+' base');
          const tree=ref=>execFileSync('git',['ls-tree','-r','-z',ref],{encoding:'utf8',maxBuffer:16*1024*1024}).split('\0').filter(Boolean),owned=[test,plan,workflow],held=rows=>rows.filter(row=>!owned.includes(row.split('\t')[1]));assert.deepEqual(held(tree('HEAD')),held(tree(base)),'Every other tracked blob equals clean Connections PR520');fs.writeFileSync(out+'/source-join.json',JSON.stringify({status:'passed',base,baseTree:'4b3ec02208ca565468b3e4c4f94ae58fa1873d64',heldRows:held(tree('HEAD')).length,onlyOwnedLeaves:owned,pins,saveDependenciesHeld:true},null,2));
          const files=execFileSync('git',['ls-files','-z'],{encoding:'utf8'}).split('\0').filter(Boolean),rows=files.map(file=>{const b=fs.readFileSync(file);return{file,bytes:b.length,sha256:createHash('sha256').update(b).digest('hex')};});fs.writeFileSync(out+'/tracked-before.json',JSON.stringify(rows));
          NODE
          npm ci 2>&1 | tee grade-save-original/install.log
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';const lock=JSON.parse(fs.readFileSync('package-lock.json')),rows=Object.keys(lock.packages).filter(p=>p.startsWith('node_modules/')&&fs.existsSync(p+'/package.json')).map(p=>[p,JSON.parse(fs.readFileSync(p+'/package.json')).version]);assert.equal(rows.length,521);for(const[p,v]of rows)assert.equal(v,lock.packages[p].version,p);fs.writeFileSync('grade-save-original/installed-before.json',JSON.stringify(rows));
          NODE
      - name: Proper App types
        run: |
          set -euo pipefail
          node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee grade-save-original/types.log
      - name: Complete textual census and AST code caller audit
        run: |
          set -euo pipefail
          git grep -n -I -e useGradeTransfer -e hooks/useGradeTransfer -- . > grade-save-original/caller-grep.txt
          git ls-files '*useGradeTransfer*' > grade-save-original/hook-paths.txt
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import path from 'node:path';import assert from 'node:assert/strict';import ts from 'typescript';import {execFileSync} from 'node:child_process';
          const out='grade-save-original',hook='src/hooks/useGradeTransfer.ts',page='src/pages/GradeTransfer.tsx',board='src/components/grade-transfer/GradeTransferBoard.tsx',name='useGradeTransfer',files=execFileSync('git',['ls-files','-z'],{encoding:'utf8'}).split('\0').filter(Boolean),hookPaths=files.filter(f=>/(?:^|\/)useGradeTransfer\.[cm]?[jt]sx?$/i.test(f));
          const sourceFiles=files.filter(f=>f.startsWith('src/')&&/\.[cm]?[jt]sx?$/.test(f)),isTest=f=>/^src\/test(?:\/|$)/.test(f)||/(?:^|\/)__tests__\//.test(f)||/\.(test|spec)\.[cm]?[jt]sx?$/.test(f),events=[],unresolved=[],parseErrors=[];
          const target=(specifier,file)=>{let resolved=specifier.startsWith('@/')?'src/'+specifier.slice(2):specifier.startsWith('.')?path.posix.join(path.posix.dirname(file),specifier):specifier;resolved=path.posix.normalize(resolved).replace(/\.[cm]?[jt]sx?$/,'');return resolved==='src/hooks/useGradeTransfer'||specifier===name;};
          for(const file of sourceFiles){
            const text=fs.readFileSync(file,'utf8'),ast=ts.createSourceFile(file,text,ts.ScriptTarget.Latest,true),production=!isTest(file);for(const d of ast.parseDiagnostics)parseErrors.push({file,message:ts.flattenDiagnosticMessageText(d.messageText,' ')});
            const record=(node,kind,module=null)=>{const pos=ast.getLineAndCharacterOfPosition(node.getStart(ast));events.push({file,production,kind,module,line:pos.line+1,column:pos.character+1,code:node.getText(ast)});};
            const visit=node=>{
              if((ts.isImportDeclaration(node)||ts.isExportDeclaration(node))&&node.moduleSpecifier&&ts.isStringLiteralLike(node.moduleSpecifier)&&target(node.moduleSpecifier.text,file))record(node,ts.isImportDeclaration(node)?'import':'reexport',node.moduleSpecifier.text);
              if(ts.isImportTypeNode(node)&&ts.isLiteralTypeNode(node.argument)&&ts.isStringLiteralLike(node.argument.literal)&&target(node.argument.literal.text,file))record(node,'type-import',node.argument.literal.text);
              if(ts.isCallExpression(node)&&(node.expression.kind===ts.SyntaxKind.ImportKeyword||(ts.isIdentifier(node.expression)&&node.expression.text==='require'))){const argument=node.arguments[0],kind=node.expression.kind===ts.SyntaxKind.ImportKeyword?'dynamic-import':'require';if(argument&&ts.isStringLiteralLike(argument)){if(target(argument.text,file))record(node,kind,argument.text);}else{const pos=ast.getLineAndCharacterOfPosition(node.getStart(ast));unresolved.push({file,production,kind,line:pos.line+1,code:node.getText(ast)});}}
              if(ts.isIdentifier(node)&&node.text===name)record(node,'symbol-identifier');ts.forEachChild(node,visit);
            };visit(ast);
          }
          const productionCallers=[...new Set(events.filter(e=>e.production&&e.file!==hook).map(e=>e.file))].sort(),unknownProductionLoads=unresolved.filter(e=>e.production),report={status:'pending-review',typescriptVersion:ts.version,commentPolicy:'TypeScript AST nodes only, never comments/trivia. Complete raw gitgrep retained separately.',scannedFiles:sourceFiles.length,hookPaths,productionCallers,events,unresolvedLoaders:unresolved,parseErrors,limits:'Direct module/symbol census includes imports, reexports, dynamic import and require. Unresolved production loaders refuse automatic admission and require source review. No transitive higher-order callgraph claim.'};
          fs.copyFileSync(hook,out+'/original-hook.ts');fs.copyFileSync(page,out+'/original-page.tsx');fs.copyFileSync(board,out+'/original-board.tsx');fs.writeFileSync(out+'/caller-audit.json',JSON.stringify(report,null,2));assert.deepEqual(parseErrors,[]);assert.deepEqual(hookPaths,[hook]);assert.deepEqual(productionCallers,[board],'Only known Grade the Transfer board consumes hook');assert.deepEqual(unknownProductionLoads,[],'Unresolved production loader requires review before an App fix');assert(events.some(e=>e.file===board&&e.kind==='import'));report.status='passed';fs.writeFileSync(out+'/caller-audit.json',JSON.stringify(report,null,2));console.log('PASS code callers: '+JSON.stringify({productionCallers,hookPaths,scannedFiles:sourceFiles.length}));
          NODE
      - name: Actual original saved-shape business census
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          set +e
          GRADE_TRANSFER_SAVE_RAW="$PWD/grade-save-original/raw.json" NODE_OPTIONS="--max-old-space-size=6144 --require=$PWD/scripts/lib/offlineTransport.cjs" node node_modules/vitest/vitest.mjs run src/test/gradeTransferSaveShape.test.tsx --maxWorkers=1 --minWorkers=1 --reporter=default --reporter=json --outputFile=grade-save-original/owned.json 2>&1 | tee grade-save-original/owned.log
          statuses=("${PIPESTATUS[@]}")
          set -e
          printf '%s\n' "${statuses[0]}" > grade-save-original/owned-exit.txt
          test "${statuses[1]}" = 0
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';import {createHash} from 'node:crypto';
          const out='grade-save-original',r=JSON.parse(fs.readFileSync(out+'/owned.json')),raw=JSON.parse(fs.readFileSync(out+'/raw.json')),log=fs.readFileSync(out+'/owned.log','utf8'),rows=r.testResults.flatMap(s=>s.assertionResults);assert.equal(fs.readFileSync(out+'/owned-exit.txt','utf8').trim(),'1');assert.equal(r.numTotalTests,11);assert.equal(r.numFailedTests,5);assert.equal(r.numPassedTests,6);assert.equal(r.numPendingTests,0);assert.equal(rows.length,11);for(const key of ['numRuntimeErrorTestSuites','numUnhandledErrors'])if(Object.hasOwn(r,key))assert.equal(r[key],0,key);assert(!/Unhandled Errors|Unhandled Rejection|Uncaught Exception|Failed to resolve import|No test files found|SyntaxError/.test(log));
          const fail=["GTT_SAVE_GRADES_OBJECT","GTT_SAVE_INDEX_NEGATIVE","GTT_SAVE_INDEX_FRACTION","GTT_SAVE_INDEX_STRING","GTT_SAVE_GRADE_ITEM"],pass=["GTT_SAVE_MISSING","GTT_SAVE_CORRUPT_JSON","GTT_SAVE_SHORT","GTT_SAVE_PARTIAL","GTT_SAVE_REVEALED","GTT_SAVE_FINISHED"],failed=rows.filter(v=>v.status==='failed'),passed=rows.filter(v=>v.status==='passed'),id=v=>v.title.split(' ')[0];assert.deepEqual(failed.map(id).sort(),[...fail].sort());assert.deepEqual(passed.map(id).sort(),[...pass].sort());for(const row of failed){assert(row.failureMessages.length>0);for(const message of row.failureMessages)assert(message.replace(/\x1b\[[0-9;]*m/g,'').startsWith('AssertionError: '+id(row)+' '),'Actual named business AssertionError');}
          assert.equal(raw.version,1);assert.equal(raw.unitClock,'2026-11-06T12:00:00Z');assert.equal(raw.fictionalPool.length,5);assert.equal(new Set(raw.fictionalPool.map(tc=>tc.playerName)).size,5);assert(raw.fictionalPool.every(tc=>tc.actualGrade==='A'));const labels={"gradesObject":["object-restored","object-grade-attempt","teardown-settled"],"indexNegative":["indexNegative-restored","indexNegative-grade-attempt","teardown-settled"],"indexFraction":["indexFraction-restored","indexFraction-grade-attempt","teardown-settled"],"indexString":["indexString-restored","indexString-after-grade","indexString-after-next","teardown-settled"],"gradeItem":["gradeItem-restored","gradeItem-grade-attempt","teardown-settled"],"missing":["missing-restored","missing-after-grade","missing-after-next","missing-reload-restored","teardown-settled"],"corrupt":["corrupt-restored","corrupt-after-grade","corrupt-after-next","corrupt-reload-restored","teardown-settled"],"short":["short-empty-restored","short-empty-after-grade","short-empty-after-next","short-pair-restored","short-pair-after-grade","short-pair-after-next","teardown-settled"],"partial":["partial-restored","partial-after-grade","partial-after-finish","partial-reload-restored","teardown-settled"],"revealed":["revealed-restored","revealed-ignored-repeat","revealed-after-next","teardown-settled"],"finished":["finished5-restored","finished5-reload-restored","finished7-restored","finished7-reload-restored","teardown-settled"]};assert.deepEqual(Object.keys(raw.cases).sort(),Object.keys(labels).sort());let frames=0;for(const[k,c]of Object.entries(raw.cases)){assert.deepEqual(c.frames.map(f=>f.label),labels[k],k+' all physical labels');frames+=c.frames.length;for(const f of c.frames){assert.equal(f.state.rounds.length,5);for(const key of['draws','transport','operationErrors','boundaries','completions'])assert(Array.isArray(f[key]));assert.equal(f.storage['grade-transfer-unrelated'],'held');assert.equal(f.state.loading,false);assert(f.page&&Array.isArray(f.page.gradeButtons)&&Array.isArray(f.page.transferHeadings));}}assert.equal(frames,47);
          const object=raw.cases.gradesObject.frames;assert.equal(object[1].operationErrors.length,1);assert.equal(object[1].operationErrors[0].name,'TypeError');assert(!object[1].transport.some(q=>q.steps.some(s=>s.method==='insert')));for(const k of ['indexNegative','indexFraction']){const before=raw.cases[k].frames[0];assert.equal(before.state.current,null);assert.deepEqual(before.page.gradeButtons,[]);assert.deepEqual(before.page.transferHeadings,[]);assert.equal(before.state.status,'grading');}const string=raw.cases.indexString.frames;assert.equal(string[0].state.index,'0');assert.equal(string[2].state.index,'01');assert.equal(string[2].state.current,null);assert.deepEqual(string[2].page.gradeButtons,[]);const item=raw.cases.gradeItem.frames[0];assert.equal(item.state.current.userGrade,'Z');assert.equal(item.state.status,'revealed');assert.equal(item.state.score,50);assert.deepEqual(item.page.gradeButtons,[]);
          const files=['owned.json','owned.log','raw.json'].map(file=>{const b=fs.readFileSync(out+'/'+file);return{file,bytes:b.length,sha256:createHash('sha256').update(b).digest('hex')};}),admission={status:'original-five-business-reds-admitted',actualRows:11,failed:failed.map(v=>v.title),passed:passed.map(v=>v.title),rawCases:11,rawFrames:frames,files,runtimeFields:Object.fromEntries(['numRuntimeErrorTestSuites','numUnhandledErrors'].map(k=>[k,{present:Object.hasOwn(r,k),value:r[k]??null}])),limits:'Original malformed-save proof only. Intentional grade callback TypeError is caught and physically captured, never an unhandled/setup exception. Six valid behavior cases and existing finish/reload cases are separate. No fixed/native/full-suite/release credit.'};fs.writeFileSync(out+'/original-admission.json',JSON.stringify(admission,null,2));console.log(JSON.stringify(admission));
          NODE
      - name: Existing Grade the Transfer once-only finished reload
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          NO_DOUBLE_ONLY=grade-transfer NODE_OPTIONS="--max-old-space-size=6144 --require=$PWD/scripts/lib/offlineTransport.cjs" node node_modules/vitest/vitest.mjs run src/test/noDoubleRecord.test.tsx --maxWorkers=1 --minWorkers=1 --reporter=default --reporter=json --outputFile=grade-save-original/existing.json 2>&1 | tee grade-save-original/existing.log
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';const out='grade-save-original',r=JSON.parse(fs.readFileSync(out+'/existing.json')),rows=r.testResults.flatMap(s=>s.assertionResults);assert.equal(r.numTotalTests,3);assert.equal(r.numPassedTests,3);assert.equal(r.numFailedTests,0);assert.equal(r.numPendingTests,0);assert.equal(rows.length,3);assert(rows.every(v=>v.status==='passed'));for(const k of ['numRuntimeErrorTestSuites','numUnhandledErrors'])if(Object.hasOwn(r,k))assert.equal(r[k],0,k);assert(!/Unhandled Errors|Unhandled Rejection|Uncaught Exception|Failed to resolve import|No test files found|SyntaxError/.test(fs.readFileSync(out+'/existing.log','utf8')));fs.writeFileSync(out+'/existing-admission.json',JSON.stringify({status:'passed',actualCases:3,scope:'Unchanged discovery/handshake and Grade the Transfer actual finish plus two finished reloads, selected by NO_DOUBLE_ONLY.'},null,2));console.log('PASS actual3 existing Grade the Transfer completion/reload cases');
          NODE
      - name: Whole tracked source locks versions and offline held
        if: always()
        run: |
          set -euo pipefail
          git ls-files -s > grade-save-original/source-after.txt
          cmp grade-save-original/source-before.txt grade-save-original/source-after.txt
          git diff --exit-code HEAD -- .
          sha256sum package.json package-lock.json > grade-save-original/locks-after.txt
          cmp grade-save-original/locks-before.txt grade-save-original/locks-after.txt
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';import {execFileSync} from 'node:child_process';import {createHash} from 'node:crypto';
          const out='grade-save-original',files=execFileSync('git',['ls-files','-z'],{encoding:'utf8'}).split('\0').filter(Boolean);
          const rows=files.map(file=>{const b=fs.readFileSync(file);return{file,bytes:b.length,sha256:createHash('sha256').update(b).digest('hex')};});
          fs.writeFileSync(out+'/tracked-after.json',JSON.stringify(rows));assert.deepEqual(rows,JSON.parse(fs.readFileSync(out+'/tracked-before.json')));
          const lock=JSON.parse(fs.readFileSync('package-lock.json')),before=JSON.parse(fs.readFileSync(out+'/installed-before.json'));
          const after=Object.keys(lock.packages).filter(p=>p.startsWith('node_modules/')&&fs.existsSync(p+'/package.json')).map(p=>[p,JSON.parse(fs.readFileSync(p+'/package.json')).version]);
          assert.equal(after.length,521);assert.deepEqual(after,before);fs.writeFileSync(out+'/installed-after.json',JSON.stringify(after));
          assert(fs.existsSync(out+'/offline.log'));assert.equal(fs.statSync(out+'/offline.log').size,0);
