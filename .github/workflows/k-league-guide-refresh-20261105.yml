name: Refresh two verified K League guide records with seven source controls
on:
  push:
    branches: [codex/k-league-guide-refresh-20261105]
permissions:
  contents: read
concurrency:
  group: k-league-guide-refresh-${{ github.ref }}
  cancel-in-progress: false
env:
  CI: '1'
  SIM_NETWORK: offline
  TZ: UTC
  PRODUCT: 37b9939ae81819fa36190d08dc7910d8a0a3bd4e
  PRODUCT_TREE: 7712094e269841914aa437b6e5df5123fbf12fc0
jobs:
  derive:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Bind exact source and capture complete checkout
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/k-league-guide-refresh"
          test ! -e "$OUT"
          mkdir -p "$OUT/logs" "$OUT/transport" "$OUT/outputs/originals" "$OUT/controls"
          export OUT
          printf 'OUT=%s\n' "$OUT" >> "$GITHUB_ENV"
          test "$(git rev-parse HEAD^)" = "$PRODUCT"
          test "$(git rev-parse 'HEAD^^{tree}')" = "$PRODUCT_TREE"
          test "$(git diff --name-status --no-renames HEAD^ HEAD)" = $'A\t.github/workflows/k-league-guide-refresh-20261105.yml'
          test "$(git hash-object scripts/simGuideHeadings.mjs)" = fa23f7e6ace62d8e71e3585ab6afbe4dbef0f674
          test "$(git hash-object scripts/data/guideHeadingsFrozen.json)" = 44b69c5931a210d18eb674119eaed8e593db59e5
          test "$(git hash-object src/data/gameContent/guideShape.ts)" = dd02ed74993aa32685a6c892450f7bcbeea8775e
          test "$(git hash-object src/data/gameContent/clubManagement.ts)" = 0e1fa56534a005204a6e53df875d7ed5e7f8692f
          test "$(git hash-object src/data/gameContent/soccer2.ts)" = 7576d973cf9a4a0aa7a9413eeb99130ad81f4f88
          git ls-files -z | sort -z | xargs -0 sha256sum > "$OUT/source-before.sha256"
          git ls-files -s > "$OUT/index-before.txt"
          git ls-files -z > "$OUT/tracked-before.bin"
          git status --porcelain=v1 --untracked-files=all > "$OUT/status-before.txt"
          test ! -s "$OUT/status-before.txt"
          for lock in package.json package-lock.json bun.lock bun.lockb; do if test -f "$lock"; then sha256sum "$lock"; fi; done > "$OUT/locks-before.sha256"
          cp scripts/data/guideHeadingsFrozen.json "$OUT/outputs/before.json"
          cp src/data/gameContent/clubManagement.ts "$OUT/outputs/originals/clubManagement.ts"
          cp src/data/gameContent/soccer2.ts "$OUT/outputs/originals/soccer2.ts"
          cp .github/workflows/k-league-guide-refresh-20261105.yml "$OUT/workflow.yml"
          git rev-parse HEAD 'HEAD^{tree}' HEAD^ > "$OUT/source-identity.txt"
      - name: Install held dependencies
        run: |
          set -euo pipefail
          test "$(bun --version)" = 1.4.4
          bun --version > "$OUT/logs/bun-version.log"
          node --version > "$OUT/logs/node-version.log"
          bun install --frozen-lockfile > "$OUT/logs/bun-install.log" 2>&1
          git diff --exit-code HEAD
      - name: Refresh only the two verified records and exercise seven exact source controls
        run: |
          set -euo pipefail
          export GIT_NO_LAZY_FETCH=1
          export NODE_OPTIONS="--require=$GITHUB_WORKSPACE/scripts/lib/offlineTransport.cjs"
          node --input-type=module <<'DERIVE'
          import fs from 'node:fs';import path from 'node:path';import crypto from 'node:crypto';import assert from 'node:assert/strict';import zlib from 'node:zlib';import ts from 'typescript';import{spawnSync}from'node:child_process';
          const out=process.env.OUT,target='scripts/data/guideHeadingsFrozen.json',reader='scripts/simGuideHeadings.mjs',PARTS=['howToPlay','rules','example','tips'],sectionKey={howToPlay:'howToPlaySections',rules:'ruleSections'},routes=['/club-manager','/soccer-career'];
          const sha=b=>crypto.createHash('sha256').update(b).digest('hex'),blob=b=>crypto.createHash('sha1').update(Buffer.from('blob '+b.length+'\0')).update(b).digest('hex'),commands=[];
          const defs=[{"name":"matrix","filename":"GUIDE-REFRESH-SOURCE-SENTENCE-MATRIX.json","bytes":7839,"sha256":"2c80c847f5cc10911db5b0994f5d109a308e3aa9c1bbca045fa28e4220eb7b09","gzip64":""},{"name":"ordered","filename":"GUIDE-REFRESH-ORDERED-EXPECTED-RECORDS.json","bytes":35626,"sha256":"d2668fdc7830551b7ab6057e8e18ae7cca6086b513f7d0aea896cedcf7fb3ddb","gzip64":""}];
          const data={};for(const d of defs){const bytes=zlib.gunzipSync(Buffer.from(d.gzip64,'base64'));assert.equal(bytes.length,d.bytes);assert.equal(sha(bytes),d.sha256);fs.writeFileSync(out+'/'+d.filename,bytes,{flag:'wx'});data[d.name]=JSON.parse(bytes);}
          const matrix=data.matrix,ordered=data.ordered;assert.equal(ordered.matrixSHA256,defs[0].sha256);assert.equal(ordered.originalFixtureGitBlob,'44b69c5931a210d18eb674119eaed8e593db59e5');assert.equal(matrix.reader.gitBlob,'fa23f7e6ace62d8e71e3585ab6afbe4dbef0f674');
          const sourceRows=[{route:'/club-manager',path:'src/data/gameContent/clubManagement.ts',gitBlob:'0e1fa56534a005204a6e53df875d7ed5e7f8692f',saved:'clubManagement.ts'},{route:'/soccer-career',path:'src/data/gameContent/soccer2.ts',gitBlob:'7576d973cf9a4a0aa7a9413eeb99130ad81f4f88',saved:'soccer2.ts'}];
          const fixtureBefore=fs.readFileSync(out+'/outputs/before.json');assert(fs.readFileSync(target).equals(fixtureBefore));assert.equal(blob(fixtureBefore),ordered.originalFixtureGitBlob);
          const original=JSON.parse(fixtureBefore);assert.equal(Object.keys(original.routes).length,131);assert(Buffer.from(JSON.stringify(original,null,2)+'\n').equals(fixtureBefore),'Original full fixture canonical bytes');
          const sourceBytes=new Map();for(const row of sourceRows){const b=fs.readFileSync(row.path);assert.equal(blob(b),row.gitBlob);assert(b.equals(fs.readFileSync(out+'/outputs/originals/'+row.saved)));sourceBytes.set(row.path,b);}
          const run=(label,command,args,expected)=>{const receipt=out+'/transport/'+label+'.log';fs.writeFileSync(receipt,'');const r=spawnSync(command,args,{encoding:'utf8',maxBuffer:16*1024*1024,env:{...process.env,SIM_OFFLINE_RECEIPT:receipt}});fs.writeFileSync(out+'/logs/'+label+'.stdout.log',r.stdout??'');fs.writeFileSync(out+'/logs/'+label+'.stderr.log',r.stderr??'');const v={label,command:[command,...args],status:r.status,signal:r.signal,error:r.error?String(r.error):null,receiptBytes:fs.statSync(receipt).size};commands.push(v);fs.writeFileSync(out+'/commands.json',JSON.stringify(commands,null,2)+'\n');assert.equal(r.status,expected,label);assert.equal(r.signal,null,label);assert.equal(r.error,undefined,label);assert.equal(v.receiptBytes,0,label);return r;};
          const lines=r=>(r.stdout+r.stderr).split(/\r?\n/).map(s=>s.trim()).filter(Boolean),failures=r=>lines(r).filter(s=>s.startsWith('FAIL:')).map(s=>s.slice(6));
          function sectionCensus(r){let section=null;const got={};for(const line of r.stdout.split(/\r?\n/)){const h=line.match(/^([1-4])\) /);if(h)section=Number(h[1]);if(/^\s+(?:RED|ok)\s/.test(line)){assert(section!==null);assert(!(section in got));got[section]=line.trim().startsWith('RED')?'RED':'ok';}}assert.deepEqual(Object.keys(got),['1','2','3','4'],'K_GUIDE_COMPLETE_SECTION_CENSUS');return got;}
          function owned(r,expected){assert.deepEqual(sectionCensus(r),{1:'RED',2:'ok',3:'ok',4:'ok'},'K_GUIDE_ONLY_EXPECTED_WORD_FINDINGS');assert.deepEqual(failures(r),expected,'K_GUIDE_ONLY_EXPECTED_WORD_FINDINGS');assert.deepEqual(lines(r).filter(s=>s.startsWith('simGuideHeadings:')),['simGuideHeadings: RED, '+expected.length+' failure'+(expected.length===1?'':'s')+' in section 1'],'K_GUIDE_ONLY_EXPECTED_WORD_FINDINGS');}
          function green(r){assert.deepEqual(sectionCensus(r),{1:'ok',2:'ok',3:'ok',4:'ok'});assert.deepEqual(failures(r),[]);const closing=lines(r).filter(s=>s.startsWith('simGuideHeadings:'));assert.equal(closing.length,1);assert.match(closing[0],/^simGuideHeadings: green\. 131 guides carry keyword h2s over h3 and h4 sections with every original sentence intact, and all \d+ blocks render a clean outline\.$/);}
          const readerCall=(label,exit)=>run(label,'node',['--unhandled-rejections=strict',reader],exit);
          const missing=(route,part,s)=>route+': the '+part+' sentence "'+s.slice(0,70)+'..." appears 0 times after the conversion, it must appear once';
          const invented=(route,part,s)=>route+': the '+part+' sentence "'+s.slice(0,70)+'..." is not in the frozen original, so it was invented or edited';
          const expected=JSON.parse(JSON.stringify(original));for(const route of routes){assert(Object.hasOwn(original.routes,route));assert.deepEqual(Object.keys(ordered.expectedRoutes[route]),PARTS);expected.routes[route]=ordered.expectedRoutes[route];for(const p of PARTS)assert.equal(expected.routes[route][p].length,ordered.expectedCounts[route][p]);assert.deepEqual(expected.routes[route].example,original.routes[route].example);assert.deepEqual(expected.routes[route].tips,original.routes[route].tips);}
          assert.deepEqual(Object.keys(expected),Object.keys(original));assert.deepEqual(Object.keys(expected.routes),Object.keys(original.routes));
          for(const route of Object.keys(original.routes))if(!routes.includes(route))assert.deepEqual(expected.routes[route],original.routes[route]);
          const oldFindings=[];for(const route of routes)for(const p of PARTS){const was=original.routes[route][p],now=expected.routes[route][p];for(const s of was)if(!now.includes(s))oldFindings.push(missing(route,p,s));for(const s of now)if(!was.includes(s))oldFindings.push(invented(route,p,s));}assert.equal(oldFindings.length,10);assert.equal(matrix.predictedFindings.total,10);
          const mutations=[...matrix.replacements.map((x,i)=>({...x,id:'replace-'+(i+1),kind:'stale-replacement',sentence:x.after})),...matrix.additions.flatMap(x=>x.sentences.map(sentence=>({route:x.route,part:x.part,sentence,kind:'removed-addition'})))];let added=0;for(const m of mutations)if(m.kind==='removed-addition')m.id='addition-'+(++added);assert.equal(mutations.length,7);assert.equal(added,4);
          for(const m of mutations){const was=original.routes[m.route][m.part],now=expected.routes[m.route][m.part];assert.equal(now.filter(s=>s===m.sentence).length,1);assert.equal(was.filter(s=>s===m.sentence).length,0);if(m.kind==='stale-replacement')assert.equal(was.filter(s=>s===m.before).length,1);}
          const controls=[];let after=null;try{
          run('types-before','node_modules/.bin/tsc',['--noEmit','-p','tsconfig.app.json'],0);
          const stale=readerCall('original-guide-fence',1);owned(stale,oldFindings);
          const copy={stdout:stale.stdout,stderr:stale.stderr+'\n  FAIL: copied unexpected other-route finding\n'};assert.notEqual(copy.stderr,stale.stderr);let classifierError;try{owned(copy,oldFindings);}catch(error){classifierError=error;}assert(classifierError instanceof assert.AssertionError);assert.match(classifierError.message,/K_GUIDE_ONLY_EXPECTED_WORD_FINDINGS/);copy.stderr=stale.stderr;assert.deepEqual(copy,{stdout:stale.stdout,stderr:stale.stderr});
          for(const route of routes)run('refresh-'+route.slice(1),'node',['--unhandled-rejections=strict',reader,'--refresh',route],0);
          after=fs.readFileSync(target);assert(!after.equals(fixtureBefore));const wanted=Buffer.from(JSON.stringify(expected,null,2)+'\n');assert(after.equals(wanted),'K_GUIDE_WHOLE_EXPECTED_FIXTURE_BYTES');fs.writeFileSync(out+'/outputs/after.json',after,{flag:'wx'});const actual=JSON.parse(after);assert.deepEqual(actual.routes['/club-manager'],ordered.expectedRoutes['/club-manager']);assert.deepEqual(actual.routes['/soccer-career'],ordered.expectedRoutes['/soccer-career']);for(const [k,v]of Object.entries(original))if(k!=='routes')assert.deepEqual(actual[k],v);for(const route of Object.keys(original.routes))if(!routes.includes(route))assert.deepEqual(actual.routes[route],original.routes[route]);
          for(const route of routes)run('repeat-refresh-'+route.slice(1),'node',['--unhandled-rejections=strict',reader,'--refresh',route],0);assert(fs.readFileSync(target).equals(after),'K_GUIDE_REPEAT_BOTH_WHOLE_BYTES');green(readerCall('refreshed-normal',0));
          const delta=run('generated-delta','git',['diff','--name-only','--no-renames'],0);assert.equal(delta.stdout.trim(),target);run('generated-full-diff','git',['diff','--no-ext-diff','--no-renames','--',target],0);
          for(const m of mutations){const row=sourceRows.find(x=>x.route===m.route),bytes=sourceBytes.get(row.path),text=bytes.toString('utf8'),sf=ts.createSourceFile(row.path,text,ts.ScriptTarget.Latest,true,ts.ScriptKind.TS),hits=[];function visit(n){if(ts.isStringLiteralLike(n)&&n.text===m.sentence)hits.push(n);ts.forEachChild(n,visit);}visit(sf);assert.equal(hits.length,1,'Unique actual TypeScript literal.text');const node=hits[0],ancestors=[];for(let p=node.parent;p;p=p.parent)if(ts.isPropertyAssignment(p))ancestors.push(p.name.text);assert(ancestors.includes(m.route));assert(ancestors.includes(sectionKey[m.part]));assert(ts.isArrayLiteralExpression(node.parent));const array=node.parent;assert(array.elements.includes(node));let start=node.getStart(sf),end=node.end,replacement;if(m.kind==='stale-replacement')replacement=JSON.stringify(m.before);else{assert.equal(text[end],',','Exact source literal trailing comma');end++;replacement='';assert(array.elements.length>1,'Actual removal leaves the source section nonempty');}
          const beforeSpan=text.slice(start,end),changed=text.slice(0,start)+replacement+text.slice(end);assert.notEqual(changed,text);assert.equal(changed.slice(start,start+replacement.length),replacement);const inverse=changed.slice(0,start)+beforeSpan+changed.slice(start+replacement.length);assert.equal(inverse,text);const changedBytes=Buffer.from(changed);assert(!changedBytes.equals(bytes));const dir=out+'/controls/'+m.id;fs.mkdirSync(dir,{recursive:true});fs.writeFileSync(dir+'/before.ts',bytes,{flag:'wx'});fs.writeFileSync(dir+'/changed.ts',changedBytes,{flag:'wx'});const expectedFailures=[missing(m.route,m.part,m.sentence),...(m.kind==='stale-replacement'?[invented(m.route,m.part,m.before)]:[])];assert.equal(expectedFailures.length,m.kind==='stale-replacement'?2:1);
          let result;try{fs.writeFileSync(row.path,changedBytes);assert(fs.readFileSync(row.path).equals(changedBytes));assert(fs.readFileSync(target).equals(after));const resultDelta=run(m.id+'-source-delta','git',['diff','--name-only','--no-renames'],0);assert.deepEqual(resultDelta.stdout.trim().split('\n').sort(),[target,row.path].sort());run(m.id+'-full-diff','git',['diff','--no-ext-diff','--no-renames','--',row.path],0);const r=readerCall(m.id+'-rejected',1);owned(r,expectedFailures);result={id:m.id,route:m.route,part:m.part,kind:m.kind,path:row.path,actualLiteralText:m.sentence,operation:{offset:start,before:beforeSpan,after:replacement},sourceBefore:{bytes:bytes.length,sha256:sha(bytes),gitBlob:blob(bytes)},sourceChanged:{bytes:changedBytes.length,sha256:sha(changedBytes),gitBlob:blob(changedBytes)},expectedFailures,onlySection1:true,noEmptyItemFindingAllowed:true,wholeSourceInverseExact:true};}finally{fs.writeFileSync(row.path,bytes);assert(fs.readFileSync(row.path).equals(bytes));fs.writeFileSync(dir+'/restored.ts',fs.readFileSync(row.path),{flag:'wx'});assert(fs.readFileSync(target).equals(after));green(readerCall(m.id+'-restored-normal',0));}assert(result);controls.push(result);fs.writeFileSync(dir+'/control.json',JSON.stringify(result,null,2)+'\n');fs.writeFileSync(out+'/controls.json',JSON.stringify(controls,null,2)+'\n');}
          assert.equal(controls.length,7);for(const row of sourceRows)assert(fs.readFileSync(row.path).equals(sourceBytes.get(row.path)));assert(fs.readFileSync(target).equals(after));green(readerCall('final-refreshed-normal',0));run('types-after','node_modules/.bin/tsc',['--noEmit','-p','tsconfig.app.json'],0);const finalDelta=run('final-generated-delta','git',['diff','--name-only','--no-renames'],0);assert.equal(finalDelta.stdout.trim(),target);
          fs.writeFileSync(out+'/generation-admitted.json',JSON.stringify({status:'ACTUAL_TWO_GUIDE_RECORDS_REFRESHED_SEVEN_SOURCE_CONTROLS_NO_BUILD_NATIVE_OR_RELEASE_CREDIT',product:process.env.PRODUCT,tree:process.env.PRODUCT_TREE,unchangedReader:matrix.reader.gitBlob,unchangedFloor:131,path:target,before:{bytes:fixtureBefore.length,sha256:sha(fixtureBefore),gitBlob:blob(fixtureBefore)},after:{bytes:after.length,sha256:sha(after),gitBlob:blob(after)},matrix:{bytes:defs[0].bytes,sha256:defs[0].sha256},orderedExpected:{bytes:defs[1].bytes,sha256:defs[1].sha256},routeCount:131,heldRouteCount:129,metadataHeld:true,orderedTwoRecordsExact:true,expectedCounts:ordered.expectedCounts,examplesTipsWholeHeld:true,repeatBothWholeBytesExact:true,onlyGeneratedPathChanged:true,originalFindings:oldFindings,controls,copiedActualClassifierControl:{changed:true,rejected:true,message:classifierError.message,wholeInverseExact:true},commandCount:commands.length},null,2)+'\n');
          }finally{for(const row of sourceRows){fs.writeFileSync(row.path,sourceBytes.get(row.path));assert(fs.readFileSync(row.path).equals(sourceBytes.get(row.path)));}fs.writeFileSync(target,fixtureBefore);assert(fs.readFileSync(target).equals(fixtureBefore));fs.writeFileSync(out+'/controller-restored.json',JSON.stringify({fixtureBeforeSHA256:sha(fixtureBefore),sourceGuides:sourceRows.map(row=>({path:row.path,sha256:sha(fs.readFileSync(row.path)),gitBlob:blob(fs.readFileSync(row.path))})),allThreeWholeBytesRestored:true},null,2)+'\n');}
          DERIVE
      - name: Always restore and hold complete source
        if: always()
        run: |
          set -euo pipefail
          test -f "$OUT/outputs/before.json"
          cp "$OUT/outputs/before.json" scripts/data/guideHeadingsFrozen.json
          cp "$OUT/outputs/originals/clubManagement.ts" src/data/gameContent/clubManagement.ts
          cp "$OUT/outputs/originals/soccer2.ts" src/data/gameContent/soccer2.ts
          git ls-files -z | sort -z | xargs -0 sha256sum > "$OUT/source-after.sha256"
          git ls-files -s > "$OUT/index-after.txt"
          git ls-files -z > "$OUT/tracked-after.bin"
          git status --porcelain=v1 --untracked-files=all > "$OUT/status-after.txt"
          for lock in package.json package-lock.json bun.lock bun.lockb; do if test -f "$lock"; then sha256sum "$lock"; fi; done > "$OUT/locks-after.sha256"
          cmp "$OUT/source-before.sha256" "$OUT/source-after.sha256"
          cmp "$OUT/index-before.txt" "$OUT/index-after.txt"
          cmp "$OUT/tracked-before.bin" "$OUT/tracked-after.bin"
          cmp "$OUT/locks-before.sha256" "$OUT/locks-after.sha256"
          test ! -s "$OUT/status-after.txt"
          printf '0\n' > "$OUT/final-source-hold.exit"
      - name: Pack bounded complete output or fatal diagnostic
        id: pack
        if: always()
        run: |
          set +e
          set -uo pipefail
          archive="$RUNNER_TEMP/k-league-guide-refresh-evidence.tar.gz"
          tar -czf "$archive" -C "$OUT" . > "$RUNNER_TEMP/k-league-guide-refresh-pack.log" 2>&1
          pack_exit=$?
          printf '%s\n' "$pack_exit" > "$OUT/pack-native.exit" || exit 1
          if [[ "$pack_exit" == 0 && -f "$archive" && "$(stat -c %s "$archive")" -le 50000000 ]]; then
            sha256sum "$archive" > "$archive.sha256" || exit 1
            printf 'archive=%s\n' "$archive" >> "$GITHUB_OUTPUT" || exit 1
            exit 0
          fi
          printf '%s\n' 'DIAGNOSTIC_ONLY_NO_COMPLETE_GENERATION_PROOF: full pack failed or exceeded50000000bytes' > "$OUT/DIAGNOSTIC-ONLY.txt" || exit 1
          cp "$RUNNER_TEMP/k-league-guide-refresh-pack.log" "$OUT/pack.log" || exit 1
          diagnostic="$RUNNER_TEMP/k-league-guide-refresh-diagnostic.tar.gz"
          diagnostic_dir="$RUNNER_TEMP/k-league-guide-refresh-diagnostic"
          mkdir -p "$diagnostic_dir/logs" "$diagnostic_dir/transport" "$diagnostic_dir/raw" || exit 1
          find "$OUT" -maxdepth 1 -type f ! -name '*.tar.gz' ! -name '*.tgz' -exec cp '{}' "$diagnostic_dir/" \; || exit 1
          cp -R "$OUT/logs/." "$diagnostic_dir/logs/" || exit 1
          cp -R "$OUT/transport/." "$diagnostic_dir/transport/" || exit 1
          if test -f "$OUT/raw/closing.json"; then cp "$OUT/raw/closing.json" "$diagnostic_dir/raw/closing.json" || exit 1; fi
          tar -czf "$diagnostic" -C "$diagnostic_dir" . || exit 1
          test "$(stat -c %s "$diagnostic")" -le 50000000 || exit 1
          sha256sum "$diagnostic" > "$diagnostic.sha256" || exit 1
          printf 'archive=%s\n' "$diagnostic" >> "$GITHUB_OUTPUT" || exit 1
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k-league-guide-refresh-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.pack.outputs.archive }}
            ${{ steps.pack.outputs.archive }}.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
