name: Grand Prix Boss lifecycle behavior absence baseline
on:
  push:
    branches: [codex/grand-prix-boss-lifecycle-baseline-20261102]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: '1'
      SIM_NETWORK: offline
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Hold B engine and add only lifecycle test plus this workflow
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/codex/grand-prix-boss-lifecycle-baseline-20261102
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD^)" = d3c74abeff07f99305cff285d0605686e4013f20
          out="$PWD/grand-prix-lifecycle-baseline-artifacts"
          mkdir "$out"
          git rev-parse HEAD HEAD^{tree} > "$out/head-tree.txt"
          git ls-files -z > "$out/source-members.before"
          git ls-files -z | xargs -0 sha256sum > "$out/source.sha256"
          git diff --name-only HEAD^ HEAD > "$out/changed-paths.txt"
          printf '%s\n' '.github/workflows/grand-prix-boss-lifecycle-baseline.yml' 'src/test/grandPrixBossLifecycle.test.ts' > "$out/expected-paths.txt"
          cmp "$out/expected-paths.txt" "$out/changed-paths.txt"
          printf '%s\n' 'cae28d2852bfa6f23ffc5afca171486d017809327caded4cbf63f300f3fd8db0  src/lib/grandPrixBoss.ts' '0771b5574e48ce37ff8e23bda3ec231d4639cc491648da1e0d9831cb22ea0a5c  src/test/grandPrixBossLifecycle.test.ts' '61a671d7bd676c82be16d238928e9413293c2656bdc1562228becc3df32d0516  src/test/grandPrixBossRollover.test.ts' 'a8b9ccdf1ac5f07fb4e87e35a56e3eca1071cee5346b21f604a814057da385c4  src/test/grandPrixBossHistoryTies.test.ts' '8822d2af417739a0164babc5b15d13cd2a5e5c5dd4e263a9e465602798765887  src/test/grandPrixBoss.test.ts' '59a01e6dc561c11013e9e9092b139dd5da5494ff1d1fee7b1976057a94a405c0  src/test/grandPrixBossMarket.test.ts' '5403ebaea1921d8cf85ff1a23d16862bbe398995c52be533434b4af9face11ec  scripts/simGrandPrixBossRollover.mjs' 'dd8b7f4fd26d0037be5b3be25d3ec9938429fae872bca94cec06124d6ae6bff5  scripts/simGrandPrixBoss.mjs' 'b045bf607b02578d10e2c2394f020abef529539be440d7403f363d571b33fe25  scripts/simGrandPrixBossMarket.mjs' | sha256sum -c -
          git diff --exit-code HEAD^ HEAD -- src/lib/grandPrixBoss.ts src/test/grandPrixBoss.test.ts src/test/grandPrixBossMarket.test.ts src/test/grandPrixBossRollover.test.ts src/test/grandPrixBossHistoryTies.test.ts scripts/simGrandPrixBoss.mjs scripts/simGrandPrixBossMarket.mjs scripts/simGrandPrixBossRollover.mjs src/lib/keyedRng.ts package.json package-lock.json vitest.config.ts src/test/setup.ts src/App.tsx src/data/gameRegistry.ts src/integrations/supabase/client.ts
          cat > "$out/capture.sh" <<'CAPTURE'
          capture() {
            local tag="$1"; shift
            local out="$PWD/grand-prix-lifecycle-baseline-artifacts"
            test ! -e "$out/$tag.exit"
            printf '%s\0' "$@" > "$out/$tag.argv"
            : > "$out/$tag.transport"
            set +e
            SIM_OFFLINE_RECEIPT="$out/$tag.transport" "$@" > "$out/$tag.stdout" 2> "$out/$tag.stderr"
            local status=$?
            set -e
            printf '%s\n' "$status" > "$out/$tag.exit"
            tail -n 18 "$out/$tag.stdout"; tail -n 18 "$out/$tag.stderr"
            test ! -s "$out/$tag.transport" || return 1
            return "$status"
          }
          CAPTURE
          source "$out/capture.sh"
          capture install env NODE_OPTIONS='' npm ci
          find node_modules -path node_modules/.vite -prune -o -type f -print0 | sort -z | xargs -0 sha256sum > "$out/dependency-files.sha256"
      - name: Actual app types and all forty existing behavior identities
        run: |
          set -euo pipefail
          out="$PWD/grand-prix-lifecycle-baseline-artifacts"
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          unset GP_BOSS_PAGE_FILE GP_BOSS_HOOK_FILE GP_BOSS_ENGINE_FILE US_BOARD_CONTROL_ALIAS US_BOARD_CONTROL_FILE NO_DOUBLE_SWAP
          source "$out/capture.sh"
          capture types node_modules/.bin/tsc --noEmit -p tsconfig.app.json
          capture preservation node node_modules/vitest/vitest.mjs run src/test/grandPrixBoss.test.ts src/test/grandPrixBossMarket.test.ts src/test/grandPrixBossRollover.test.ts src/test/grandPrixBossHistoryTies.test.ts --maxWorkers=1 --minWorkers=1 --no-file-parallelism --reporter=verbose --reporter=json --outputFile="$out/preservation.vitest.json"
      - name: Admit only fifteen owned missing lifecycle behaviors
        run: |
          set -euo pipefail
          out="$PWD/grand-prix-lifecycle-baseline-artifacts"
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          unset GP_BOSS_PAGE_FILE GP_BOSS_HOOK_FILE GP_BOSS_ENGINE_FILE US_BOARD_CONTROL_ALIAS US_BOARD_CONTROL_FILE NO_DOUBLE_SWAP
          source "$out/capture.sh"
          code=0
          capture baseline node node_modules/vitest/vitest.mjs run src/test/grandPrixBossLifecycle.test.ts --maxWorkers=1 --minWorkers=1 --no-file-parallelism --reporter=verbose --reporter=json --outputFile="$out/baseline.vitest.json" || code=$?
          test "$code" -eq 1
          test ! -s "$out/baseline.transport"
          node --input-type=module <<'CHECK'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const out = process.cwd() + '/grand-prix-lifecycle-baseline-artifacts';
          const existing = new Map([
            ['src/test/grandPrixBoss.test.ts', ['GP_ENGINE_AVAILABLE:', 'GP_WORLD:', 'GP_SEED:', 'GP_UPGRADE:', 'GP_RESERVE:', 'GP_GRID:', 'GP_SETUPS:', 'GP_CLASSIFICATION:', 'GP_SETTLEMENT:', 'GP_DUPLICATE:', 'GP_RESUME:', 'GP_INVALID_SAVE:', 'GP_SCORE:']],
            ['src/test/grandPrixBossMarket.test.ts', ['GP_MARKET_PUBLIC_QUOTES:', 'GP_MARKET_SIGN:', 'GP_MARKET_NEW_WAGES:', 'GP_MARKET_BUYOUT:', 'GP_MARKET_FUNDS:', 'GP_MARKET_REROUND:', 'GP_MARKET_RENEW:', 'GP_MARKET_EXCLUSIVITY:', 'GP_MARKET_WINDOWS:', 'GP_MARKET_REPLAY:', 'GP_MARKET_SAVE:', 'GP_MARKET_HOLDS:']],
            ['src/test/grandPrixBossRollover.test.ts', ['GP_ROLLOVER_COMMIT:', 'GP_ROLLOVER_CONTRACTS:', 'GP_ROLLOVER_PREPAID:', 'GP_ROLLOVER_CHAMPIONS:', 'GP_ROLLOVER_CALENDAR:', 'GP_ROLLOVER_YEAR_TWO:', 'GP_ROLLOVER_TAIL:', 'GP_ROLLOVER_REPLAY:', 'GP_ROLLOVER_PHASE:', 'GP_ROLLOVER_FUNDS:', 'GP_ROLLOVER_LEGACY:', 'GP_ROLLOVER_BAD_LEDGER:', 'GP_ROLLOVER_ARCHIVED_IDENTITIES:']],
            ['src/test/grandPrixBossHistoryTies.test.ts', ['GP_HISTORY_DRIVER_TIE:', 'GP_HISTORY_TEAM_TIE:']],
          ]);
          const missing = new Map([
            ['GP_LIFECYCLE_METADATA:', 'GP_LIFECYCLE_FOCUS_METADATA_MISSING'],
            ['GP_LIFECYCLE_FOCUS:', 'GP_FOCUS_ACTION_MISSING'],
            ['GP_LIFECYCLE_FOCUS_WINDOWS:', 'GP_FOCUS_PHASE_GUARD_MISSING'],
            ['GP_LIFECYCLE_YOUTH:', 'GP_FOCUS_ACTION_MISSING'],
            ['GP_LIFECYCLE_PEAK:', 'GP_FOCUS_ACTION_MISSING'],
            ['GP_LIFECYCLE_VETERAN:', 'GP_FOCUS_ACTION_MISSING'],
            ['GP_LIFECYCLE_POTENTIAL:', 'GP_FOCUS_ACTION_MISSING'],
            ['GP_LIFECYCLE_ONCE:', 'GP_LIFECYCLE_AGE_NOT_SETTLED'],
            ['GP_LIFECYCLE_RETIRE:', 'GP_RETIREMENT_PLAN_MISSING'],
            ['GP_LIFECYCLE_PAID:', 'GP_PAID_OLD_CONTRACT_AGE_NOT_ADVANCED'],
            ['GP_LIFECYCLE_MARKET:', 'GP_RETIRING_FREE_AGENT_OFFER_MUST_BE_ABSENT'],
            ['GP_LIFECYCLE_CARRY:', 'GP_PARTIAL_CARRY_MISSING'],
            ['GP_LIFECYCLE_AI:', 'GP_AI_CAR_INVESTMENT_MISSING'],
            ['GP_LIFECYCLE_SAVE:', 'GP_LEGACY_LIFECYCLE_NORMALIZATION_MISSING'],
            ['GP_LIFECYCLE_PLAN:', 'GP_RETIREMENT_PLAN_MISSING'],
          ]);
          const evidence = [];
          for (const [tag, failed] of [['preservation', false], ['baseline', true]]) {
            const report = JSON.parse(fs.readFileSync(out + '/' + tag + '.vitest.json', 'utf8'));
            const raw = fs.readFileSync(out + '/' + tag + '.stdout', 'utf8') + '\n' + fs.readFileSync(out + '/' + tag + '.stderr', 'utf8');
            const count = failed ? 15 : 40, files = failed ? new Map([['src/test/grandPrixBossLifecycle.test.ts', [...missing.keys()]]]) : existing;
            assert.equal(Number(fs.readFileSync(out + '/' + tag + '.exit', 'utf8')), failed ? 1 : 0);
            assert.equal(report.success, !failed); assert.equal(report.testResults.length, files.size);
            assert.equal(report.numTotalTests, count); assert.equal(report.numPassedTests, failed ? 0 : count);
            assert.equal(report.numFailedTests, failed ? count : 0); assert.equal(report.numPendingTests, 0); assert.equal(report.numTodoTests, 0);
            const filesSeen = new Set();
            for (const suite of report.testResults) {
              const file = [...files.keys()].find(expected => suite.name.endsWith('/' + expected)); assert(file); assert(!filesSeen.has(file)); filesSeen.add(file);
              const ids = files.get(file), seen = new Set(); assert.equal(suite.assertionResults.length, ids.length);
              for (const row of suite.assertionResults) {
                const matches = ids.filter(id => row.title.startsWith(id)); assert.equal(matches.length, 1);
                const id = matches[0]; assert(!seen.has(id)); seen.add(id);
                assert.equal(row.status, failed ? 'failed' : 'passed'); assert.equal(row.failureMessages.length, failed ? 1 : 0);
                if (failed) { assert.match(row.failureMessages[0], /AssertionError:/); assert(row.failureMessages[0].includes(missing.get(id))); }
              }
            }
            const runtimeCounters = { numUnhandledErrors: report.numUnhandledErrors ?? null, numRuntimeErrorTestSuites: report.numRuntimeErrorTestSuites ?? null };
            for (const [key, value] of Object.entries(runtimeCounters)) { if (value === null) continue; assert.equal(typeof value, 'number'); assert.equal(value, 0, key); }
            for (const errors of [report.errors, report.unhandledErrors]) if (Array.isArray(errors)) assert.equal(errors.length, 0);
            const detectedRuntimeError = /(?:Unhandled (?:Errors?|Rejection|Exception)|unhandledRejection|uncaughtException|Vitest caught \d+ unhandled)/i.test(raw);
            assert.equal(detectedRuntimeError, false);
            evidence.push({ tag, passed: failed ? 0 : count, ownedFailures: failed ? count : 0, declaredSkips: 0, runtimeCounters,
              runtimeCounterCompleteness: Object.values(runtimeCounters).some(value => value === null) ? 'UNKNOWN' : 'REPORTED', detectedRuntimeError,
              rawErrors: report.errors ?? null, rawUnhandledErrors: report.unhandledErrors ?? null,
              cases: report.testResults.flatMap(suite => suite.assertionResults.map(row => ({ file: suite.name, title: row.title, status: row.status }))) });
          }
          fs.writeFileSync(out + '/summary.json', JSON.stringify({ scope: 'Lifecycle feature absence only. Existing B and forty behavior identities preserved. No C product or coefficient adoption.', totalExecuted: 55, preservationPasses: 40, ownedAbsenceFailures: 15, declaredSkips: 0, evidence }, null, 2) + '\n');
          console.log('GP_LIFECYCLE_BASELINE: forty existing passes and fifteen exact owned missing-behavior assertions, zero skips.');
          CHECK
      - name: Preserve complete source dependencies and membership
        if: always()
        run: |
          set -euo pipefail
          out="$PWD/grand-prix-lifecycle-baseline-artifacts"
          sha256sum -c "$out/source.sha256" > "$out/source-hold.log"
          if test -f "$out/dependency-files.sha256"; then sha256sum -c "$out/dependency-files.sha256" > "$out/dependency-hold.log"; fi
          git ls-files -z > "$out/source-members.after"
          cmp "$out/source-members.before" "$out/source-members.after"
          git diff --exit-code HEAD > "$out/working-source-hold.log"
          git ls-files --others --exclude-standard > "$out/untracked.txt"
          test ! -s "$out/untracked.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grand-prix-lifecycle-baseline-${{ github.run_id }}
          path: grand-prix-lifecycle-baseline-artifacts/
          retention-days: 14
