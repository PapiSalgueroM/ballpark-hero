name: Four unchanged harnesses in main and joined frames
on:
  push:
    branches: [codex/pr470-four-harness-diagnostic-20261104]
permissions:
  contents: read
jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        include:
          - frame: main-reference
            source: dea549ac59402de3335365226d21e91de4fa447e
            tree: bb1f7280181e9d55d66c5413f0ab42915b7f33bd
            parent: 7412fef3023f94f41de5251f024e227e027920b7
            files: 5647
          - frame: joined
            source: 42ef023a2a36afea43c4b7d4b9e64cac098d95cf
            tree: 7a1a1d72582f366712484f3824ede9e91d6b573b
            parent: cfdbb34b755098a2ee6961a9fc05e61cd7202fdf
            files: 5673
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: '1'
      FRAME: ${{ matrix.frame }}
      FRAME_SOURCE: ${{ matrix.source }}
      FRAME_TREE: ${{ matrix.tree }}
      FRAME_PARENT: ${{ matrix.parent }}
      FRAME_FILES: ${{ matrix.files }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source }}
          fetch-depth: 2
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Bind the exact frame and original harnesses and historical source
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/four-harness-$FRAME"
          mkdir -p "$OUT/logs" "$OUT/exits" "$OUT/raw" "$OUT/transport" "$OUT/executed" "$OUT/inputs"
          echo "QA_OUT=$OUT" >> "$GITHUB_ENV"
          test "$(git rev-parse HEAD)" = "$FRAME_SOURCE"
          test "$(git rev-parse HEAD^{tree})" = "$FRAME_TREE"
          test "$(git rev-parse HEAD^)" = "$FRAME_PARENT"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git rev-parse HEAD HEAD^{tree} HEAD^ > "$OUT/source.txt"
          git ls-files -z | sort -z | xargs -0 sha256sum > "$OUT/source-before.sha256"
          test "$(wc -l < "$OUT/source-before.sha256")" -eq "$FRAME_FILES"
          cat > "$OUT/harnesses.txt" <<'PINS'
          8def88ed0ce89802ed974886932807f149c1817a scripts/simClubManagerGathered.mjs
          482b9bd903eb7fd592ede4fb55cc62a097cf4853 scripts/simCmUnseededWorld.mjs
          3cf89a99f2175c1377b8e425d0518ca0ddc0e278 scripts/simGmDealTableFixture.mjs
          35079bac2fe47256d025823a86faa15da131561a scripts/simSoccerVeteranTalks.mjs
          PINS
          while read -r pin script; do
            test "$(git hash-object "$script")" = "$pin"
            cp "$script" "$OUT/executed/"
          done < "$OUT/harnesses.txt"
          cp scripts/data/cmOldSave1052Fixture.json scripts/data/gmDealTable.fixture.json "$OUT/inputs/"
          for ref in b6eb78e799b12c851e4e8e583e9e926aed117f1c 40f75cd8351ebd28723431a238dbe2467bc39c5c; do
            git fetch --no-tags --depth=1 --filter=blob:none origin "$ref" >> "$OUT/logs/history.log" 2>&1
            git rev-parse "$ref" "$ref^{tree}" >> "$OUT/references.txt"
            git ls-tree -r "$ref" src > "$OUT/$ref-src.txt"
            git ls-tree -r --format='%(objectname)' "$ref" src | sort -u | git cat-file --batch > /dev/null
          done
          test "$(git rev-parse 40f75cd8351ebd28723431a238dbe2467bc39c5c^{tree})" = b63f33b6998ca32d5c245a662988b9f07d659cb6
          git fetch --no-tags --depth=1 --filter=blob:none origin "$GITHUB_SHA" >> "$OUT/logs/history.log" 2>&1
          git show "$GITHUB_SHA:.github/workflows/pr470-four-harness-diagnostic-20261104.yml" > "$OUT/workflow.yml"
      - name: Install the held dependencies
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund > "$QA_OUT/logs/install.log" 2>&1
          git diff --exit-code HEAD -- package.json package-lock.json
      - name: Run exactly four original default commands sequentially
        timeout-minutes: 25
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$GITHUB_WORKSPACE/scripts/lib/offlineTransport.cjs"
          export SIM_NETWORK=offline
          export SOCCER_VETERAN_TALKS_OUT="$QA_OUT/raw/veteran"
          unset GATHERED_CONTROL CM_UNSEEDED_BASE CM_UNSEEDED_CONTROL CM_UNSEEDED_FLEET GM_DEAL_FIXTURE GM_DEAL_FIXTURE_CONTROL
          failed=0
          while read -r pin script; do
            name="$(basename "$script" .mjs)"
            : > "$QA_OUT/transport/$name.log"
            set +e
            SIM_OFFLINE_RECEIPT="$QA_OUT/transport/$name.log" node "$script" > "$QA_OUT/logs/$name.log" 2>&1
            rc=$?
            set -e
            echo "$rc" > "$QA_OUT/exits/$name"
            tail -n 4 "$QA_OUT/logs/$name.log"
            if [ "$rc" != 0 ] || [ -s "$QA_OUT/transport/$name.log" ]; then failed=1; fi
          done < "$QA_OUT/harnesses.txt"
          echo "$failed" > "$QA_OUT/commands.exit"
          test "$failed" = 0
      - name: Always retain all raw evidence and source closure
        if: always()
        run: |
          set -euo pipefail
          test -d "$QA_OUT"
          if [ -d "$QA_OUT/raw/veteran" ]; then
            find "$QA_OUT/raw/veteran" -type f -print0 | sort -z | xargs -0 sha256sum > "$QA_OUT/veteran-expanded.sha256"
            tar -czf "$QA_OUT/veteran-raw.tar.gz" -C "$QA_OUT/raw" veteran
            tar -dzf "$QA_OUT/veteran-raw.tar.gz" -C "$QA_OUT/raw"
            tar -tzf "$QA_OUT/veteran-raw.tar.gz" > "$QA_OUT/veteran-members.txt"
            sha256sum "$QA_OUT/veteran-raw.tar.gz" > "$QA_OUT/veteran-archive.sha256"
            test "$QA_OUT/raw/veteran" = "$RUNNER_TEMP/four-harness-$FRAME/raw/veteran"
            rm -rf -- "$QA_OUT/raw/veteran"
          fi
          git ls-files -z | sort -z | xargs -0 sha256sum > "$QA_OUT/source-after.sha256"
          git diff --binary HEAD > "$QA_OUT/source-diff.txt"
          git status --porcelain=v1 --untracked-files=all > "$QA_OUT/status-after.txt"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import crypto from 'node:crypto';import assert from 'node:assert/strict';
          const out=process.env.QA_OUT,sha=b=>crypto.createHash('sha256').update(b).digest('hex');
          const scripts=fs.readFileSync(out+'/harnesses.txt','utf8').trim().split('\n').map(line=>line.split(' ')[1]);
          const rows=scripts.map(script=>{const name=script.split('/').at(-1).replace(/\.mjs$/,''),p=out+'/logs/'+name+'.log',e=out+'/exits/'+name,t=out+'/transport/'+name+'.log';
            const raw=fs.existsSync(p)?fs.readFileSync(p):null;
            return{script,nativeExit:fs.existsSync(e)?fs.readFileSync(e,'utf8').trim():null,log:raw?{bytes:raw.length,sha256:sha(raw)}:null,transportBytes:fs.existsSync(t)?fs.statSync(t).size:null};});
          fs.writeFileSync(out+'/diagnosis.json',JSON.stringify({frame:process.env.FRAME,source:process.env.FRAME_SOURCE,tree:process.env.FRAME_TREE,rows,scope:'Only the unchanged four default harnesses. A repeated baseline failure does not waive any assertion or establish full-state parity. Complete stdout/stderr is retained in regular files; the Veteran raw directory is losslessly archived.'},null,2)+'\n');
          assert(rows.every(row=>row.nativeExit!==null&&row.log&&row.transportBytes===0),'All four original processes and empty offline receipts must be retained');
          NODE
          cmp "$QA_OUT/source-before.sha256" "$QA_OUT/source-after.sha256"
          test ! -s "$QA_OUT/source-diff.txt"
          test ! -s "$QA_OUT/status-after.txt"
      - name: Bound evidence independently
        id: evidence
        if: always()
        run: |
          set -euo pipefail
          test -d "$QA_OUT"
          test "$(du -sb "$QA_OUT" | cut -f1)" -lt 150000000
          echo ready=true >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.evidence.outputs.ready == 'true' }}
        with:
          name: four-harness-${{ matrix.frame }}-${{ github.run_id }}
          path: ${{ env.QA_OUT }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
