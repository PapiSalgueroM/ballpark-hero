          for value in "$WHO_AM_I_FIXED_HEAD" "$WHO_AM_I_FIXED_TREE" "$WHO_AM_I_FIXED_WORKFLOW" "$WHO_AM_I_TEST" "$WHO_AM_I_PLAN" "$WHO_AM_I_GUESS_OWNERSHIP_PAGE_BLOB" "$WHO_AM_I_HELPER" "$WHO_AM_I_OUTER"; do [[ "$value" =~ ^[a-f0-9]{40}$ ]]; done
          out=who-am-i-guess-ownership-full
          test ! -e "$out"
          mkdir "$out"
          touch "$out/offline.log"
          git rev-parse HEAD > "$out/head.txt"
          git rev-parse 'HEAD^{tree}' > "$out/tree.txt"
          git ls-files -s > "$out/source-before.txt"
          sha256sum package.json package-lock.json > "$out/locks-before.txt"
