          const configs=['index.html','package.json','package-lock.json','vite.config.ts','tailwind.config.ts','postcss.config.js','tsconfig.json','tsconfig.app.json','tsconfig.node.json','bun.lockb','bun.lock'];
          for (const file of configs) pins[file]=at(base,file);
          for (const [file,want] of Object.entries(pins)) {
            assert.equal(at(head,file),want,file);
            if(file!==helper) assert.equal(at(fixed,file),want,file+' held fixed');
          }
