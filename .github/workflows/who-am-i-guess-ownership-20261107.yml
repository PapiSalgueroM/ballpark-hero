          assert.deepEqual([...index].sort(),[...current].sort(),'All actual index tuples equal the committed tree');
          const byFile=new Map(current.map(row=>[fileOf(row),row]));
          for(const file of [page,test,plan,workflow,helper])assert(byFile.get(file).startsWith('100644 blob '),file+' exact source mode');
          const physical=git('ls-files','-z').split('\0').filter(Boolean).map(file=>{
