name: Club Manager market causal baseline only
on:
  push:
    branches: [codex/cm-market-continuity-20261030]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      SIM_NETWORK: offline
      TZ: UTC
      GIT_OPTIONAL_LOCKS: '0'
      EXPECTED_PARENT: c84d003299937a9a4c6bf77303cd1a18b806003e
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Bind unchanged source and retain original archive
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/cm-market-causal-baseline";test ! -e "$out";mkdir -p "$out/fixtures"
          echo "CM_MARKET_BASELINE_OUT=$out" >> "$GITHUB_ENV"
          test "$GITHUB_REF_NAME" = codex/cm-market-continuity-20261030
          test "$(git rev-list --parents -n1 HEAD)" = "$GITHUB_SHA $EXPECTED_PARENT"
          test "$(git ls-tree -r --name-only "$EXPECTED_PARENT" | wc -l)" -eq 5452
          test "$(git ls-files | wc -l)" -eq 5456
          git diff --name-status "$EXPECTED_PARENT" HEAD > "$out/proof-diff.txt"
          printf 'A\t.github/workflows/cm-market-causal-baseline.yml\nA\tscripts/qa/classifyCmMarketBaseline.mjs\nA\tsrc/test/cmFreeAgentContinuity.test.ts\nA\tsrc/test/cmMarketMaxPrice.test.tsx\n' > "$out/expected-proof-diff.txt"
          cmp "$out/proof-diff.txt" "$out/expected-proof-diff.txt"
          git ls-files -z | sort -z > "$out/source-members.initial"
          xargs -0 sha256sum < "$out/source-members.initial" > "$out/source.initial.sha256"
          git ls-files --others --exclude-standard -z | sort -z > "$out/untracked.initial"
          test ! -s "$out/untracked.initial"
          git for-each-ref --format='%(refname) %(objectname)' > "$out/refs.initial"
          git archive --format=tar HEAD > "$out/source.tar"
          printf '{"scope":"CAUSAL_BASELINE_ONLY_NO_PRODUCT_CHANGE","source":"%s","parent":"%s","productFiles":5452,"proofFiles":5456,"unitRawExpected":1,"classifierRawExpected":0,"typesRequired":true,"build":"UNRUN","browser":"UNRUN","fullSEO":"UNRUN","sims":"UNRUN","fullDefaultSuite":"UNRUN_SCOPED_TWO_FILES_ONLY","featureReady":false}\n' "$GITHUB_SHA" "$EXPECTED_PARENT" > "$out/SCOPE.json"
      - name: Early remote syntax before dependencies
        run: |
          set -euo pipefail
          out="$CM_MARKET_BASELINE_OUT";raw=0
          node --check scripts/qa/classifyCmMarketBaseline.mjs > "$out/syntax.stdout.log" 2> "$out/syntax.stderr.log" || raw=$?
          printf '%s\n' "$raw" > "$out/syntax.raw.exit";test "$raw" = 0
      - name: Locked dependencies and identity inventory
        run: |
          set -euo pipefail
          out="$CM_MARKET_BASELINE_OUT"
          npm ci > "$out/npm-ci.stdout.log" 2> "$out/npm-ci.stderr.log"
          find node_modules -type f -print0 | sort -z > "$out/deps.members.initial"
          xargs -0 sha256sum < "$out/deps.members.initial" > "$out/deps.initial.sha256"
          find node_modules -type l -printf '%p -> %l\n' | sort > "$out/deps.links.initial"
      - name: Genuine application types
        run: |
          set -euo pipefail
          out="$CM_MARKET_BASELINE_OUT";mkdir "$out/types";raw=0
          printf 'node_modules/.bin/tsc --noEmit -p tsconfig.app.json\n' > "$out/types/command.txt"
          : > "$out/types/transport.jsonl"
          SIM_OFFLINE_RECEIPT="$out/types/transport.jsonl" NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" timeout --signal=TERM --kill-after=10s 3m node_modules/.bin/tsc --noEmit -p tsconfig.app.json > "$out/types/stdout.log" 2> "$out/types/stderr.log" || raw=$?
          printf '%s\n' "$raw" > "$out/types/raw.exit";test "$raw" = 0;test ! -s "$out/types/transport.jsonl"
      - name: Actual scoped default Vitest and exact causal classifier
        run: |
          set -euo pipefail
          out="$CM_MARKET_BASELINE_OUT";raw=0
          printf 'node scripts/qa/classifyCmMarketBaseline.mjs\n' > "$out/classifier.command.txt"
          : > "$out/units.transport.jsonl"
          SIM_OFFLINE_RECEIPT="$out/units.transport.jsonl" NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" FORCE_COLOR=0 timeout --signal=TERM --kill-after=15s 10m node scripts/qa/classifyCmMarketBaseline.mjs > "$out/classifier.stdout.log" 2> "$out/classifier.stderr.log" || raw=$?
          printf '%s\n' "$raw" > "$out/classifier.raw.exit"
          test "$raw" = 0;test ! -s "$out/units.transport.jsonl"
          test "$(cat "$out/units/raw.exit")" = 1
          test "$(tail -n1 "$out/classifier.stdout.log")" = 'CM_CAUSAL_BASELINE_QUALIFIED: only the exact declared missing-feature assertions failed; every preservation case passed. No product-ready claim.'
      - name: Always retain original outputs and immutable end holds
        if: ${{ always() }}
        run: |
          set -euo pipefail
          out="${CM_MARKET_BASELINE_OUT:-$RUNNER_TEMP/cm-market-causal-baseline}";mkdir -p "$out/fixtures";failed=0
          git ls-files -z | sort -z > "$out/source-members.final"
          xargs -0 sha256sum < "$out/source-members.final" > "$out/source.final.sha256"
          cmp "$out/source-members.initial" "$out/source-members.final" || failed=1
          cmp "$out/source.initial.sha256" "$out/source.final.sha256" || failed=1
          git ls-files --others --exclude-standard -z | sort -z > "$out/untracked.final"
          cmp "$out/untracked.initial" "$out/untracked.final" || failed=1
          git for-each-ref --format='%(refname) %(objectname)' > "$out/refs.final"
          cmp "$out/refs.initial" "$out/refs.final" || failed=1
          if test -f "$out/deps.initial.sha256";then
            find node_modules -type f -print0 | sort -z > "$out/deps.members.final"
            cmp "$out/deps.members.initial" "$out/deps.members.final" || failed=1
            sha256sum -c "$out/deps.initial.sha256" > "$out/deps.final-held.log" 2>&1 || failed=1
            find node_modules -type l -printf '%p -> %l\n' | sort > "$out/deps.links.final"
            cmp "$out/deps.links.initial" "$out/deps.links.final" || failed=1
          fi
          find "$out/fixtures" -type f -print0 | sort -z > "$out/fixture-members.final"
          xargs -0 -r sha256sum < "$out/fixture-members.final" > "$out/fixtures.final.sha256"
          tar -cf "$out/fixtures.tar" -C "$out/fixtures" .
          printf '%s\n' "$failed" > "$out/final-holds.exit"
          status=PARTIAL_OR_FAILED_NO_BASELINE_CREDIT
          if test -f "$out/CAUSAL-BASELINE-ADMISSION.json" && test "$failed" = 0 && test "$(cat "$out/classifier.raw.exit")" = 0;then status=CAUSAL_BASELINE_ONLY_QUALIFIED_NOT_FEATURE_READY;fi
          printf '{"status":"%s","priorJobStatus":"%s","finalHoldsRaw":%s,"productPassCredit":false}\n' "$status" '${{ job.status }}' "$failed" > "$out/QUALIFICATION-STATUS.json"
          find "$out" -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/cm-market-baseline-evidence.sha256"
          cp "$RUNNER_TEMP/cm-market-baseline-evidence.sha256" "$out/evidence.sha256"
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: cm-market-causal-baseline-${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/cm-market-causal-baseline
          if-no-files-found: error
          retention-days: 14