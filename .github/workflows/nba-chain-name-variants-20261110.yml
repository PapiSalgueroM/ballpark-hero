name: NBA Chain name variants fixed
on:
  push:
    branches: [codex/nba-chain-name-variants-fixed-qa-20261110]
permissions:
  actions: read
  contents: read
jobs:
  fixed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: UTC
      SIM_NETWORK: offline
      SIM_OFFLINE_RECEIPT: nba-chain-name-variants-fixed/offline.log
      NBA_CHAIN_NAME_VARIANTS_RAW: nba-chain-name-variants-fixed/public-cases.raw.json
      NBA_CHAIN_NAME_VARIANTS_GUARDS_RAW: nba-chain-name-variants-fixed/guards.raw.json
      BASE_HEAD: '3157171b3e1b28c782a9f8e461490b5388f0cf84'
      BASE_TREE: '18184f081259861ff9c4af92aad5741b5f85d036'
      HELPER_BLOB: '69a08858a97456380f7cc54474fab9407f80769a'
      EDGE_BLOB: '02ad604c9115af575d57eb648bfb7a3e48dbef2d'
      EVIDENCE: nba-chain-name-variants-fixed
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - name: Authenticate admitted original and exact isolated NBA Chain fixed source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test ! -e "$EVIDENCE"
          if grep -Eq '__[A-Z][A-Z0-9_]*__' .github/workflows/nba-chain-name-variants-20261110.yml; then echo 'Unresolved fixed workflow binding'; exit 1; fi
          mkdir "$EVIDENCE"
          touch "$SIM_OFFLINE_RECEIPT"
          git rev-parse HEAD > "$EVIDENCE/head.txt"
          git rev-parse 'HEAD^{tree}' > "$EVIDENCE/tree.txt"
          git ls-files -s > "$EVIDENCE/source-before.txt"
          sha256sum package.json package-lock.json > "$EVIDENCE/locks-before.txt"
          git diff --exit-code HEAD -- .
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          import {execFileSync} from 'node:child_process';

          const {BASE_HEAD,BASE_TREE,HELPER_BLOB,EDGE_BLOB,EVIDENCE:out} = process.env;
          const repo = 'PapiSalgueroM/ballpark-hero';
          const workflow = '.github/workflows/nba-chain-name-variants-20261110.yml';
          const helper = 'scripts/qa/verifyNbaChainNameVariants.mjs';
          const edge = 'supabase/functions/nba-chain-validate/index.ts';
          const plan = 'docs/plans/2026-11-10-nba-chain-name-variants.md';
          const original = {"run":42828680593,"job":129872628739,"artifact":13770282082,"steps":11,"head":"3157171b3e1b28c782a9f8e461490b5388f0cf84","tree":"18184f081259861ff9c4af92aad5741b5f85d036","workflow":"0aba3f95767c0cc993861ab03845a79371b6171f","branch":"codex/nba-chain-name-variants-original-qa-20261110","zipBytes":1012888,"zipSHA256":"cb44f9b334006376d02d34972188fbe76d93cfac10d7d666cab24d9249b025cc","bodies":23,"auditSHA256":"155a562b7a714b1969d8bd399a972a2256a9da975416fb672ce7422a127bcf11","raw":{"bytes":12039,"sha256":"64963e612125e0ed61d8cbebb67e5e905a973d3f31ef966b52f0b2745ec06c07"}};
          const activePreflight = {"run":42826929069,"job":129866574710,"artifact":13768498765,"steps":11,"zipBytes":1014998,"zipSHA256":"b6e53a25acf8551bf683e3424313a4723ec160b5d0ca382886893e791fc4cabc","head":"2ef86924da6f748e2032687d539593ebf2172d62","tree":"b1a7c02e4c05085384c7b821cc4da1c0c3fb36f5","branch":"codex/nba-chain-name-variants-preflight-qa-20261110","workflow":"8d80b3613ff28ca117b106f1e85b1847a591fe35","independentAuditSHA256":"a6de4b0128694c169313e08246e86a4e813abae0d761d006c38a28eeb95b52c8"};
          const held = {"src/App.tsx":"8bfedf7aaa1d076e0f0c8e2216c7e46632cd8a33","src/data/gameRegistry.ts":"f560b40a74d1468ac72dfde4ee6fec6635a9a255","public/nba-chain/index.html":"dacd0541cfcde63e04c1e7c0c1f423937838702d","public/prerender-boot.js":"85939d3b80ef41b26ff6cbefb53a66e383d1a797","src/pages/NbaChain.tsx":"dac563a9781f6202d542f14f402b4ee40abe7602","src/hooks/useNbaChain.ts":"ce40e9a68144cc2b6117a49454e0faf66bc36ed8","src/lib/playerSearch.ts":"0d19f2c23735eb30512dc7fc3a447eacef5e128f","src/test/nbaChainFeedback.test.tsx":"162131a7a359207850fc0257c530317897c0171f","scripts/lib/offlineTransport.cjs":"0fda542a2649fe5da937c6976fd0f5b6073e74b6","scripts/lib/hostLikeServer.mjs":"21059d5e8114669df61106c125d5272d357b6236","index.html":"12598fe720eec4fc88d3d33c53ede612d018150c","package.json":"2ff64986fb76ebc51b706f2fd24765768874008a","package-lock.json":"97d6f12a052f25f400462938c241789a083f0bfe","vite.config.ts":"0112b6ac4f2ad80b2fc04f9ec2f7185300913e7d","tailwind.config.ts":"f83c4f4032d359bc9285828eac3b0961a46c6b17","postcss.config.js":"2aa7205d4b402a1bdfbe07110c61df920b370066","tsconfig.json":"6b68d80b7d92d0c4a5d774897f2bedfa95b42669","tsconfig.app.json":"51f581dd91641b4c1f1219f646788e73cf6bf00c","tsconfig.node.json":"3133162c20350e1741b94b8d2ff77b811bec8363","bun.lockb":"5d9d33a3bf4f45fa099e2aa3014149e034981149","bun.lock":"dff081dcd34a1aa928ddc90d910774a6b855dfe3","docs/plans/2026-11-10-nba-chain-name-variants.md":"75df55aba5a1cf955958338bfeb34df31a74a004"};
          const profile = {"mode":"initials-only","rawBytes":12255,"rawSHA256":"ee81dfa94f68710fbb49a3e6cbce3ef31a90ef06e4ae6c9cd4680c879a8c459a","reads":18,"completion":"PASS exact fictional NBA Chain initials, held suffix rejection, six healthy cases and fifteen guards"};
          assert.deepEqual(Object.keys(profile).sort(),['completion','mode','rawBytes','rawSHA256','reads']);
          assert(['both-variants','initials-only'].includes(profile.mode),'Explicit qualified variant scope');
          assert(Number.isSafeInteger(profile.rawBytes) && profile.rawBytes > 0);
          assert.match(profile.rawSHA256,/^[a-f0-9]{64}$/);
          assert(Number.isSafeInteger(profile.reads) && profile.reads > 0);
          assert.match(profile.completion,/^PASS [\x20-\x7E]+$/);
          assert.equal(process.env.GITHUB_REPOSITORY,repo);
          const api = process.env.GITHUB_API_URL+'/repos/'+repo;
          const request = async path => {
            const response = await fetch(api+path,{headers:{Accept:'application/vnd.github+json',
              Authorization:'Bearer '+process.env.GH_TOKEN,'X-GitHub-Api-Version':'2022-11-28'},redirect:'error'});
            assert.equal(response.status,200,path);
            return response.json();
          };
          const [run,jobs,artifact] = await Promise.all([
            request('/actions/runs/'+original.run),request('/actions/runs/'+original.run+'/jobs?per_page=100'),
            request('/actions/artifacts/'+original.artifact),
          ]);
          assert.deepEqual([run.id,run.status,run.conclusion,run.event,run.run_attempt,run.path,run.head_sha,run.head_commit.tree_id,run.head_branch,run.repository.full_name],
            [original.run,'completed','success','push',1,workflow,BASE_HEAD,BASE_TREE,original.branch,repo]);
          assert.deepEqual([jobs.total_count,jobs.jobs.length],[1,1]);
          const [job] = jobs.jobs;
          assert.deepEqual([job.id,job.run_id,job.name,job.status,job.conclusion,job.head_sha,job.steps.length],
            [original.job,original.run,'original','completed','success',BASE_HEAD,original.steps]);
          assert(job.steps.every(step=>step.status==='completed'&&step.conclusion==='success'));
          assert.deepEqual([artifact.id,artifact.name,artifact.expired,artifact.size_in_bytes,artifact.digest,artifact.workflow_run.id,artifact.workflow_run.head_sha],
            [original.artifact,'nba-chain-name-variants-original-'+original.run,false,original.zipBytes,'sha256:'+original.zipSHA256,original.run,BASE_HEAD]);
          delete process.env.GH_TOKEN;
          const git = (...args) => execFileSync('git',args,{encoding:'utf8',maxBuffer:16*1024*1024}).trimEnd();
          const show = (ref,file) => execFileSync('git',['show',ref+':'+file],{maxBuffer:16*1024*1024});
          const sha = (algorithm,body) => createHash(algorithm).update(body).digest('hex');
          const blob = body => sha('sha1',Buffer.concat([Buffer.from('blob '+body.length+'\0'),body]));
          const head = git('rev-parse','HEAD');
          const productBase = '09f9bfc46b7a3e1d56ea09b1e477d587c4b1d726';
          const productTree = '6a5b0bf5535deeeb81e1d8106fb812b68e95cd48';
          assert.equal(head,process.env.GITHUB_SHA);
          assert.deepEqual([BASE_HEAD,BASE_TREE],[original.head,original.tree]);
          assert.deepEqual(git('rev-list','--parents','-n','1','HEAD').split(' '),[head,BASE_HEAD]);
          assert.deepEqual(git('rev-list','--parents','-n','1',BASE_HEAD).split(' '),[BASE_HEAD,productBase]);
          assert.equal(git('rev-parse',BASE_HEAD+'^{tree}'),BASE_TREE);
          assert.equal(git('rev-parse',productBase+'^{tree}'),productTree);
          assert.equal(git('rev-parse',BASE_HEAD+':'+workflow),original.workflow);
          const originalEdge = 'ae48e575f499f4ad6ca9d4930aae30bd636652b3';
          const originalHelper = '286218947229daf25c92d791325b6fa148e26f88';
          assert.equal(git('rev-parse',BASE_HEAD+':'+edge),originalEdge);
          assert.equal(git('rev-parse',BASE_HEAD+':'+helper),originalHelper);
          assert.notEqual(EDGE_BLOB,originalEdge,'Fixed product handler actually changes');
          const changed = [edge,workflow];
          const helperChanged = HELPER_BLOB !== originalHelper;
          if(helperChanged) changed.push(helper);
          const pins = {...held,[helper]:HELPER_BLOB,[edge]:EDGE_BLOB};
          for(const [file,want] of Object.entries(pins)){
            assert.match(want,/^[0-9a-f]{40}$/);
            assert.equal(git('rev-parse','HEAD:'+file),want,file);
            assert.equal(blob(fs.readFileSync(file)),want,file+' physical bytes');
            if(Object.hasOwn(held,file)) assert.equal(git('rev-parse',BASE_HEAD+':'+file),want,file+' admitted original');
          }
          assert.deepEqual(git('diff','--name-status','--no-renames',BASE_HEAD,'HEAD').split('\n').sort(),changed.map(file=>'M\t'+file).sort());
          const tree = ref => git('ls-tree','-r','-z',ref).split('\0').filter(Boolean);
          const pathOf = row => row.split('\t')[1];
          const previous = tree(BASE_HEAD), current = tree('HEAD');
          const hold = rows => rows.filter(row=>!changed.includes(pathOf(row)));
          assert.deepEqual([previous.length,current.length,hold(previous).length],[5804,5804,helperChanged?5801:5802]);
          assert.deepEqual(hold(current),hold(previous));
          for(const rows of [previous,current]){
            assert(rows.filter(row=>changed.includes(pathOf(row))).every(row=>row.startsWith('100644 blob ')));
          }
          assert.equal(current.filter(row=>/^(src|public|scripts)\//.test(pathOf(row))).length,4670);
          const selected = [
            ['original-edge.ts',edge,show(BASE_HEAD,edge)],['fixed-edge.ts',edge,fs.readFileSync(edge)],
            ['original-helper.mjs',helper,show(BASE_HEAD,helper)],['fixed-helper.mjs',helper,fs.readFileSync(helper)],
            ['candidate-plan.md',plan,fs.readFileSync(plan)],['candidate-workflow.yml',workflow,fs.readFileSync(workflow)],
          ];
          const selectedBodies = selected.map(([file,path,body])=>{
            fs.writeFileSync(out+'/'+file,body);
            return {file,path,bytes:body.length,sha256:sha('sha256',body),blob:blob(body)};
          });
          fs.writeFileSync(out+'/source-receipt.json',JSON.stringify({
            status:'passed',head,tree:git('rev-parse','HEAD^{tree}'),parent:BASE_HEAD,parentTree:BASE_TREE,productBase,productTree,basePR:542,
            activePreflight,original,profile,changed:changed.sort(),helperChanged,originalEdge,originalHelper,pins,selectedBodies,
            heldRows:hold(previous).length,trackedRows:5804,scopedSourceRows:4670,rootConfigurations:11,
          },null,2)+'\n');
          NODE
      - name: Install locked dependencies, freeze physical source, and verify app types
        run: |
          set -euo pipefail
          npm ci 2>&1 | tee "$EVIDENCE/install.log"
          cat > "$EVIDENCE/physical.mjs" <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          const stage = process.argv[2];
          assert(['before', 'after'].includes(stage));
          const out = process.env.EVIDENCE;
          const index = execFileSync('git', ['ls-files', '-z'], { encoding: 'utf8' }).split('\0').filter(Boolean);
          const source = index.map(file => {
            const bytes = fs.readFileSync(file);
            return [file, bytes.length, createHash('sha256').update(bytes).digest('hex')];
          });
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const installed = Object.entries(lock.packages).filter(([file]) =>
            file.startsWith('node_modules/') && fs.existsSync(file + '/package.json')
          ).map(([file, entry]) => {
            const version = JSON.parse(fs.readFileSync(file + '/package.json', 'utf8')).version;
            assert.equal(version, entry.version, file);
            return [file, version];
          });
          assert.equal(source.length, 5804);
          assert.equal(installed.length, 521);
          assert.equal(fs.statSync(process.env.SIM_OFFLINE_RECEIPT).size, 0);
          for (const [name, data] of [['tracked', source], ['installed', installed]]) {
            const body = JSON.stringify(data);
            if (stage === 'after') assert.equal(body, fs.readFileSync(out + '/' + name + '-before.json', 'utf8'));
            fs.writeFileSync(out + '/' + name + '-' + stage + '.json', body);
          }
          NODE
          node "$EVIDENCE/physical.mjs" before
          node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee "$EVIDENCE/types.log"
      - name: Require exactly the qualified NBA Chain fix scope and preserved controls
        run: |
          set -euo pipefail
          test ! -e "$NBA_CHAIN_NAME_VARIANTS_RAW"
          test ! -e "$NBA_CHAIN_NAME_VARIANTS_GUARDS_RAW"
          profile_mode="$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1],"utf8")).profile.mode' "$EVIDENCE/source-receipt.json")"
          result=0
          NBA_CHAIN_NAME_VARIANTS_EDGE_BLOB="$EDGE_BLOB" NBA_CHAIN_NAME_VARIANTS_PROFILE="$profile_mode" \
            NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" timeout --signal=TERM 90s \
            node scripts/qa/verifyNbaChainNameVariants.mjs > "$EVIDENCE/helper.log" 2>&1 || result=$?
          cat "$EVIDENCE/helper.log"
          printf '%s\n' "$result" > "$EVIDENCE/helper-exit.txt"
          test "$result" -eq 0
          test -s "$NBA_CHAIN_NAME_VARIANTS_RAW"
          test -s "$NBA_CHAIN_NAME_VARIANTS_GUARDS_RAW"
          test ! -s "$SIM_OFFLINE_RECEIPT"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';

          const out = process.env.EVIDENCE;
          const source = JSON.parse(fs.readFileSync(out+'/source-receipt.json','utf8'));
          const {profile,original} = source;
          const log = fs.readFileSync(out+'/helper.log','utf8');
          assert.equal(log.trimEnd().split(/\r?\n/).at(-1),profile.completion,'Exact qualified helper completion line');
          assert(!/^[A-Za-z]*Error(?: \[[A-Z_]+\])?:/m.test(log),'No Node exception');
          assert(!/UnhandledPromiseRejection|ERR_MODULE_NOT_FOUND|ERR_UNKNOWN_FILE_EXTENSION|ERR_UNSUPPORTED_TYPESCRIPT_SYNTAX|SIM_OFFLINE_BLOCK/i.test(log),'Unrelated runtime or transport failure');
          const raw = fs.readFileSync(process.env.NBA_CHAIN_NAME_VARIANTS_RAW);
          const rawSHA256 = createHash('sha256').update(raw).digest('hex');
          assert.deepEqual([raw.length,rawSHA256],[profile.rawBytes,profile.rawSHA256],'Exact fresh fixed RAW');
          assert.notEqual(rawSHA256,original.raw.sha256,'Fresh fixed evidence actually differs');
          const evidence = JSON.parse(raw.toString('utf8'));
          assert.equal(raw.toString('utf8'),JSON.stringify(evidence)+'\n','Canonical complete RAW');
          assert.equal(evidence.schema,'nba-chain-name-variants-v1');
          const edge = source.selectedBodies.find(row=>row.file==='fixed-edge.ts');
          assert.deepEqual([evidence.source.path,evidence.source.blob,evidence.source.sha256,evidence.source.typescript],
            [edge.path,edge.blob,edge.sha256,'5.8.3'],'Actual locked synthetic invocation uses the exact fixed Edge body');
          assert.deepEqual(evidence.source.imports,['https://deno.land/std@0.168.0/http/server.ts','https://esm.sh/@supabase/supabase-js@2.45.0']);
          const ids = ['initials-variant','suffix-variant','exact-overlap','no-overlap','explicit-iii-no-jr-overlap',
            'explicit-jr-no-iii-overlap','recent-coverage-gap','fixture-read-failure'];
          assert.deepEqual(evidence.cases.map(row=>row.id),ids,'Exact eight existing case roles');
          assert.deepEqual(evidence.cases.map(row=>row.kind),['variant','variant',...Array(6).fill('control')]);
          assert.equal(evidence.cases.reduce((sum,row)=>sum+row.reads.length,0),profile.reads);
          for(const row of evidence.cases){
            assert.deepEqual([row.envReads,row.clientCalls],[['SUPABASE_URL','SUPABASE_SERVICE_ROLE_KEY'],1],row.id);
            assert.deepEqual([row.outcome.status,row.outcome.contentType,row.outcome.allowOrigin],[200,'application/json','https://douknowball.com'],row.id);
          }
          const [initials,suffix,overlap,disjoint,iii,jr,recent,fault] = evidence.cases;
          const suffixQualified = profile.mode==='both-variants';
          assert.deepEqual([initials.outcome.body.valid,suffix.outcome.body.valid],[true,suffixQualified],'Exactly the selected variant scope');
          if(!suffixQualified) assert.deepEqual(suffix.outcome.body,{
            valid:false,reason:'Fixture Rowan Timber III does not appear in our NBA records (1949-2024).',fullName:'Fixture Rowan Timber III',
          },'Unqualified suffix result stays literally closed');
          assert.deepEqual([overlap,disjoint,iii,jr,recent,fault].map(row=>row.outcome.body.valid),[true,false,false,false,false,false]);
          assert.equal(recent.outcome.body.coverageGap,true);
          assert.equal(fault.outcome.body.unverified,true);
          const checks = (() => {
          assert.deepEqual([evidence.cases[0].request.newPlayer,evidence.cases[0].outcome.body.fullName],['Fixture J.R. Avery','Fixture JR Avery']);
          assert.equal(evidence.cases[0].reads.length,3);
          assert.equal(evidence.cases[0].reads[2].table,'nba_team_codes');
          assert.deepEqual(evidence.cases[0].reads[1].calls[1],['ilike','name_folded','%avery%']);
          assert.deepEqual(evidence.cases[1].reads[1].calls[1],['ilike','name_folded','%iii%']);
          assert.equal(evidence.cases[1].reads[1].data.length,0);
          return {status:'passed',initials:'canonical-accepted',suffix:'held-rejection',mainCases:8,mainReads:18};
          })();
          assert.equal(checks.status,'passed','Independent RAW contract for selected scope');
          const guardsRaw = fs.readFileSync(process.env.NBA_CHAIN_NAME_VARIANTS_GUARDS_RAW);
          const guards = JSON.parse(guardsRaw.toString('utf8'));
          assert.equal(guardsRaw.toString('utf8'),JSON.stringify(guards)+'\n','Canonical complete focused guard evidence');
          const guardChecks = (() => {
          const expected={"file":"fixed-v3-expected-guards.compact.raw.json","sha256":"15af751512a564970c75de203e4233ae192424305ea01e2d006fcbf905cb1307","bytes":121336,"schema":"nba-chain-name-variants-fixed-guards-v1","cases":15,"reads":42};
          assert.deepEqual([guardsRaw.length,createHash('sha256').update(guardsRaw).digest('hex')],[expected.bytes,expected.sha256]);
          assert.equal(guards.schema,expected.schema);
          assert.deepEqual(guards.source,evidence.source);
          assert.equal(guards.cases.length,15);
          assert.equal(guards.cases.reduce((sum,row)=>sum+row.reads.length,0),42);
          const positives=['reverse-compact-input-dotted-row','folded-error-raw-exact-positive','keyed-multiple-stints-reordered'];
          assert.deepEqual(guards.cases.filter(row=>row.outcome.body.valid).map(row=>row.id),positives);
          const uncertain=['ambiguous-dotted-initials','conflicting-person-keys','mixed-keyed-and-unkeyed-stints','blank-person-keys',
            'same-count-changed-stint-tuple','partial-identity-read','failed-identity-read'];
          assert.deepEqual(guards.cases.filter(row=>row.outcome.body.unverified).map(row=>row.id),uncertain);
          for(const row of guards.cases.filter(row=>row.outcome.body.unverified)){
            assert.deepEqual(row.outcome.body,{valid:false,unverified:true,reason:"We couldn't confirm that player's identity. Try another spelling."});
            assert(row.reads.every(read=>read.table==='nba_player_team_stints'));
          }
          const self=guards.cases.find(row=>row.id==='resolved-self-link');
          assert.deepEqual(self.outcome.body,{valid:false,reason:'That is the same player.'});
          assert.equal(self.reads.length,2);
          const keyed=guards.cases.find(row=>row.id==='keyed-multiple-stints-reordered');
          assert.equal(keyed.outcome.body.fullName,'Fixture JR Avery');
          assert(keyed.reads.some(read=>read.calls.some(call=>call[0]==='eq'&&call[1]==='name_folded')));
          return {status:'passed',cases:15,reads:42,positives,uncertain,canonicalSelfLinkRejected:true};
          })();
          assert.equal(guardChecks.status,'passed','Independent focused guard contract');
          fs.writeFileSync(out+'/fixed-result.json',JSON.stringify({
            status:'fixed-nba-chain-name-variants',scope:profile.mode,expectedProcessExit:0,completion:profile.completion,
            qualifiedVariants:suffixQualified?ids.slice(0,2):ids.slice(0,1),heldVariant:suffixQualified?null:suffix.id,
            heldControls:ids.slice(2),cases:8,reads:profile.reads,rawBytes:raw.length,rawSHA256,original:original.raw,checks,
            guards:{bytes:guardsRaw.length,sha256:createHash('sha256').update(guardsRaw).digest('hex'),checks:guardChecks},
          },null,2)+'\n',{flag:'wx'});
          NODE
      - name: Verify unchanged physical source and locked offline run
        if: always()
        run: |
          set -euo pipefail
          git ls-files -s > "$EVIDENCE/source-after.txt"
          sha256sum package.json package-lock.json > "$EVIDENCE/locks-after.txt"
          cmp "$EVIDENCE/source-before.txt" "$EVIDENCE/source-after.txt"
          cmp "$EVIDENCE/locks-before.txt" "$EVIDENCE/locks-after.txt"
          git diff --exit-code HEAD -- .
          node "$EVIDENCE/physical.mjs" after
          test ! -s "$SIM_OFFLINE_RECEIPT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nba-chain-name-variants-fixed-${{ github.run_id }}
          path: nba-chain-name-variants-fixed
          retention-days: 14
          if-no-files-found: error
