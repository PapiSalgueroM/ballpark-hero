name: NBA Chain name variants physical controls
on:
  push:
    branches: [codex/nba-chain-name-variants-controls-qa-20261110]
permissions:
  actions: read
  contents: read
jobs:
  controls:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: UTC
      SIM_NETWORK: offline
      SIM_OFFLINE_RECEIPT: nba-chain-name-variants-controls/offline.log
      NBA_CHAIN_NAME_VARIANTS_RAW: nba-chain-name-variants-controls/public-cases.raw.json
      BASE_HEAD: 'b39737f96baaa8ccd3cf6618823d09f051c3bd1f'
      BASE_TREE: '997cbecad66164a3113756b792f78458c775715f'
      EVIDENCE: nba-chain-name-variants-controls
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 4
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - name: Authenticate admitted fixed and original with exact controls source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test ! -e "$EVIDENCE"
          if grep -Eq '__[A-Z][A-Z0-9_]*__' .github/workflows/nba-chain-name-variants-20261110.yml; then echo 'Unresolved controls workflow binding'; exit 1; fi
          mkdir "$EVIDENCE"
          touch "$SIM_OFFLINE_RECEIPT"
          git rev-parse HEAD > "$EVIDENCE/head.txt"
          git rev-parse 'HEAD^{tree}' > "$EVIDENCE/tree.txt"
          git ls-files -s > "$EVIDENCE/source-before.txt"
          sha256sum package.json package-lock.json > "$EVIDENCE/locks-before.txt"
          git diff --exit-code HEAD -- .
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          import {execFileSync} from 'node:child_process';

          const {EVIDENCE:out,BASE_HEAD,BASE_TREE,GITHUB_SHA:head,GITHUB_REPOSITORY:repo} = process.env;
          const workflow = '.github/workflows/nba-chain-name-variants-20261110.yml';
          const helper = 'scripts/qa/verifyNbaChainNameVariants.mjs';
          const edge = 'supabase/functions/nba-chain-validate/index.ts';
          const plan = 'docs/plans/2026-11-10-nba-chain-name-variants.md';
          const fixed = {"run":42832098036,"job":129884518587,"artifact":13771148572,"steps":11,"head":"b39737f96baaa8ccd3cf6618823d09f051c3bd1f","tree":"997cbecad66164a3113756b792f78458c775715f","workflow":"e2733391e2f32f43dcd8943846f90195e945c3a3","branch":"codex/nba-chain-name-variants-fixed-qa-20261110","zipBytes":1032396,"zipSHA256":"9e2db336ff9e93114eb5832af1906788a0fbb8637a8902078beb704451d7fc1d","auditSHA256":"cf14d1bfb55e295dac570d90869df1325689c2fc522f6a2befb15a8f01548d44","raw":{"bytes":12255,"sha256":"ee81dfa94f68710fbb49a3e6cbce3ef31a90ef06e4ae6c9cd4680c879a8c459a"},"guards":{"bytes":121336,"sha256":"15af751512a564970c75de203e4233ae192424305ea01e2d006fcbf905cb1307"}};
          const original = {"run":42828680593,"job":129872628739,"artifact":13770282082,"steps":11,"head":"3157171b3e1b28c782a9f8e461490b5388f0cf84","tree":"18184f081259861ff9c4af92aad5741b5f85d036","workflow":"0aba3f95767c0cc993861ab03845a79371b6171f","branch":"codex/nba-chain-name-variants-original-qa-20261110","zipBytes":1012888,"zipSHA256":"cb44f9b334006376d02d34972188fbe76d93cfac10d7d666cab24d9249b025cc","auditSHA256":"155a562b7a714b1969d8bd399a972a2256a9da975416fb672ce7422a127bcf11","raw":{"bytes":12039,"sha256":"64963e612125e0ed61d8cbebb67e5e905a973d3f31ef966b52f0b2745ec06c07"}};
          const originalEdge = 'ae48e575f499f4ad6ca9d4930aae30bd636652b3';
          const fixedEdge = '02ad604c9115af575d57eb648bfb7a3e48dbef2d';
          const fixedHelper = '69a08858a97456380f7cc54474fab9407f80769a';
          const product = '09f9bfc46b7a3e1d56ea09b1e477d587c4b1d726';
          const productTree = '6a5b0bf5535deeeb81e1d8106fb812b68e95cd48';
          const git = (...args) => execFileSync('git',args,{encoding:'utf8',maxBuffer:16*1024*1024}).trimEnd();
          const hash = (algorithm,body) => createHash(algorithm).update(body).digest('hex');
          const blob = body => hash('sha1',Buffer.concat([Buffer.from('blob '+body.length+'\0'),body]));
          assert.equal(repo,'PapiSalgueroM/ballpark-hero');
          assert.equal(git('rev-parse','HEAD'),head);
          assert.deepEqual([fixed.head,fixed.tree],[BASE_HEAD,BASE_TREE]);
          assert.deepEqual([original.head,original.tree],['3157171b3e1b28c782a9f8e461490b5388f0cf84','18184f081259861ff9c4af92aad5741b5f85d036']);
          assert.deepEqual(git('rev-list','--parents','-n','1',head).split(' '),[head,fixed.head]);
          assert.deepEqual(git('rev-list','--parents','-n','1',fixed.head).split(' '),[fixed.head,original.head]);
          assert.deepEqual(git('rev-list','--parents','-n','1',original.head).split(' '),[original.head,product]);
          assert.equal(git('rev-parse',product+'^{tree}'),productTree);
          const api = process.env.GITHUB_API_URL+'/repos/'+repo;
          const request = async path => {
            const response = await fetch(api+path,{headers:{Accept:'application/vnd.github+json',
              Authorization:'Bearer '+process.env.GH_TOKEN,'X-GitHub-Api-Version':'2022-11-28'},redirect:'error'});
            assert.equal(response.status,200,path);
            return response.json();
          };
          for(const [role,pin] of [['original',original],['fixed',fixed]]){
            for(const field of ['run','job','artifact','steps','zipBytes']) assert(Number.isSafeInteger(pin[field])&&pin[field]>0,role+' '+field);
            assert.match(pin.auditSHA256,/^[0-9a-f]{64}$/);
            assert.equal(git('rev-parse',pin.head+'^{tree}'),pin.tree);
            assert.equal(git('rev-parse',pin.head+':'+workflow),pin.workflow);
            const [run,jobs,artifact] = await Promise.all([
              request('/actions/runs/'+pin.run),request('/actions/runs/'+pin.run+'/jobs?per_page=100'),request('/actions/artifacts/'+pin.artifact),
            ]);
            assert.deepEqual([run.id,run.status,run.conclusion,run.event,run.run_attempt,run.path,run.head_sha,run.head_commit.tree_id,run.head_branch,run.repository.full_name],
              [pin.run,'completed','success','push',1,workflow,pin.head,pin.tree,pin.branch,repo]);
            assert.deepEqual([jobs.total_count,jobs.jobs.length],[1,1]);
            const [job] = jobs.jobs;
            assert.deepEqual([job.id,job.run_id,job.name,job.status,job.conclusion,job.head_sha,job.steps.length],
              [pin.job,pin.run,role,'completed','success',pin.head,pin.steps]);
            assert(job.steps.every(step=>step.status==='completed'&&step.conclusion==='success'));
            assert.deepEqual([artifact.id,artifact.name,artifact.expired,artifact.size_in_bytes,artifact.digest,artifact.workflow_run.id,artifact.workflow_run.head_sha],
              [pin.artifact,'nba-chain-name-variants-'+role+'-'+pin.run,false,pin.zipBytes,'sha256:'+pin.zipSHA256,pin.run,pin.head]);
          }
          delete process.env.GH_TOKEN;
          assert.deepEqual(original.raw,{bytes:12039,sha256:'64963e612125e0ed61d8cbebb67e5e905a973d3f31ef966b52f0b2745ec06c07'});
          assert.deepEqual(fixed.raw,{bytes:12255,sha256:'ee81dfa94f68710fbb49a3e6cbce3ef31a90ef06e4ae6c9cd4680c879a8c459a'});
          assert.deepEqual(fixed.guards,{bytes:121336,sha256:'15af751512a564970c75de203e4233ae192424305ea01e2d006fcbf905cb1307'});
          assert.deepEqual(git('diff','--name-status','--no-renames',fixed.head,head).split('\n'),['M\t'+workflow]);
          const tree = ref => git('ls-tree','-r','-z',ref).split('\0').filter(Boolean);
          const pathOf = row => row.split('\t')[1];
          const held = rows => rows.filter(row=>pathOf(row)!==workflow);
          const parentRows=tree(fixed.head),currentRows=tree(head);
          assert.deepEqual([parentRows.length,currentRows.length,held(parentRows).length],[5804,5804,5803]);
          assert.deepEqual(held(currentRows),held(parentRows));
          assert.equal(currentRows.filter(row=>/^(src|public|scripts)\//.test(pathOf(row))).length,4670);
          assert.equal(git('rev-parse','HEAD:'+plan),'75df55aba5a1cf955958338bfeb34df31a74a004');
          assert.equal(git('rev-parse','HEAD:'+helper),fixedHelper);
          assert.equal(git('rev-parse','HEAD:'+edge),fixedEdge);
          assert.equal(git('rev-parse',original.head+':'+edge),originalEdge);
          const originalBody=execFileSync('git',['show',original.head+':'+edge]);
          const files={
            'held-original-edge.ts':originalBody,'held-fixed-edge.ts':fs.readFileSync(edge),
            'held-fixed-helper.mjs':fs.readFileSync(helper),'candidate-workflow.yml':fs.readFileSync(workflow),
          };
          assert.deepEqual([blob(files['held-original-edge.ts']),blob(files['held-fixed-edge.ts']),blob(files['held-fixed-helper.mjs'])],
            [originalEdge,fixedEdge,fixedHelper]);
          const selectedBodies=Object.entries(files).map(([file,body])=>{
            fs.writeFileSync(out+'/'+file,body);
            return {file,bytes:body.length,sha256:hash('sha256',body),blob:blob(body)};
          });
          fs.writeFileSync(out+'/source-receipt.json',JSON.stringify({
            status:'passed',head,tree:git('rev-parse','HEAD^{tree}'),parent:fixed.head,parentTree:fixed.tree,product,productTree,
            workflow:git('rev-parse','HEAD:'+workflow),fixed,original,edge,helper,fixedEdge,originalEdge,fixedHelper,selectedBodies,
            trackedRows:5804,heldRows:5803,scopedSourceRows:4670,rootConfigurations:11,
          },null,2)+'\n');
          NODE
      - name: Install locked dependencies, freeze physical source, and verify app types
        run: |
          set -euo pipefail
          npm ci 2>&1 | tee "$EVIDENCE/install.log"
          cat > "$EVIDENCE/physical.mjs" <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          const stage = process.argv[2];
          assert(['before', 'after'].includes(stage));
          const out = process.env.EVIDENCE;
          const index = execFileSync('git', ['ls-files', '-z'], { encoding: 'utf8' }).split('\0').filter(Boolean);
          const source = index.map(file => {
            const bytes = fs.readFileSync(file);
            return [file, bytes.length, createHash('sha256').update(bytes).digest('hex')];
          });
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const installed = Object.entries(lock.packages).filter(([file]) =>
            file.startsWith('node_modules/') && fs.existsSync(file + '/package.json')
          ).map(([file, entry]) => {
            const version = JSON.parse(fs.readFileSync(file + '/package.json', 'utf8')).version;
            assert.equal(version, entry.version, file);
            return [file, version];
          });
          assert.equal(source.length, 5804);
          assert.equal(installed.length, 521);
          assert.equal(fs.statSync(process.env.SIM_OFFLINE_RECEIPT).size, 0);
          for (const [name, data] of [['tracked', source], ['installed', installed]]) {
            const body = JSON.stringify(data);
            if (stage === 'after') assert.equal(body, fs.readFileSync(out + '/' + name + '-before.json', 'utf8'));
            fs.writeFileSync(out + '/' + name + '-' + stage + '.json', body);
          }
          NODE
          node "$EVIDENCE/physical.mjs" before
          node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee "$EVIDENCE/types.log"
      - name: Run fixed Edge, three physical controls and exact restoration
        run: |
          set -euo pipefail
          cat > "$EVIDENCE/control-driver.mjs" <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import {createHash} from 'node:crypto';
          import {execFileSync,spawnSync} from 'node:child_process';

          const {EVIDENCE:out,SIM_OFFLINE_RECEIPT} = process.env;
          const source = JSON.parse(fs.readFileSync(path.join(out,'source-receipt.json')));
          const {fixed,original,edge,helper} = source;
          const mutations = [{"name":"identity-key","anchor":"confirmed.some((r) => r.person_key !== personKey) || ","replacement":"","blob":"d31636b67cfc5d8bd054b1df1dac3fd4b0c47ac3","sha256":"bb80b799419a1666ed08802f712e7d1375637f39c4bcb939fdab2dfa244a8d66"},{"name":"stint-multiset","anchor":"stintKeys(confirmed) !== stintKeys(alternate)","replacement":"false","blob":"af40db3798444fabe669815c1346dabb412b3a1e","sha256":"5428d8379e6a7c114e60b0df78bc9aba25df43d9244c08a54570638c881c7c95"}];
          const roleOrder = ['fixed','original','identity-key','stint-multiset','restored'];
          assert.deepEqual(mutations.map(row=>row.name),roleOrder.slice(2,4));
          const hash = (algorithm,body) => createHash(algorithm).update(body).digest('hex');
          const blob = body => hash('sha1',Buffer.concat([Buffer.from('blob '+body.length+'\0'),body]));
          const pin = body => ({bytes:body.length,sha256:hash('sha256',body)});
          const git = (...args) => execFileSync('git',args,{maxBuffer:16*1024*1024});
          const index = fs.readFileSync(path.join(out,'source-before.txt'));
          const held = JSON.parse(fs.readFileSync(path.join(out,'tracked-before.json'))).filter(([file])=>file!==edge);
          assert.equal(held.length,5803);
          const verifyHeld = () => {
            assert(git('ls-files','-s').equals(index));
            assert.equal(fs.statSync(SIM_OFFLINE_RECEIPT).size,0);
            for(const [file,bytes,sha256] of held) assert.deepEqual(pin(fs.readFileSync(file)),{bytes,sha256},file);
          };
          const fixedBody = fs.readFileSync(edge);
          const originalBody = fs.readFileSync(path.join(out,'held-original-edge.ts'));
          assert.deepEqual([blob(fixedBody),blob(originalBody)],[source.fixedEdge,source.originalEdge]);
          assert(!originalBody.equals(fixedBody));
          const text = fixedBody.toString('utf8');
          assert(Buffer.from(text).equals(fixedBody));
          const changed = new Map();
          const distinct = new Set([source.fixedEdge,source.originalEdge]);
          for(const row of mutations){
            assert.deepEqual(Object.keys(row).sort(),['anchor','blob','name','replacement','sha256']);
            assert(typeof row.anchor==='string'&&row.anchor.length>0&&typeof row.replacement==='string');
            assert.notEqual(row.anchor,row.replacement,row.name);
            const index = text.indexOf(row.anchor);
            assert(index>=0&&text.indexOf(row.anchor,index+row.anchor.length)<0,row.name+' unique source anchor');
            const patched = text.slice(0,index)+row.replacement+text.slice(index+row.anchor.length);
            assert.equal(patched.slice(0,index)+row.anchor+patched.slice(index+row.replacement.length),text,row.name+' whole inverse');
            const body = Buffer.from(patched);
            assert.deepEqual([blob(body),pin(body).sha256],[row.blob,row.sha256],row.name+' full changed source fingerprints');
            assert(!distinct.has(row.blob),row.name+' distinct changed source');
            distinct.add(row.blob);
            changed.set(row.name,{body,span:{offset:Buffer.byteLength(text.slice(0,index)),beforeBytes:Buffer.byteLength(row.anchor),afterBytes:Buffer.byteLength(row.replacement),wholeInverse:true}});
          }
          const named = {
            original:'NBA_CHAIN_NAME_VARIANTS: dotted initials resolve and an unproven suffix stays distinct',
            'identity-key':'conflicting-person-keys',
            'stint-multiset':'same-count-changed-stint-tuple',
          };
          const prefix = 'AssertionError [ERR_ASSERTION]: ';
          const completion = 'PASS exact fictional NBA Chain initials, held suffix rejection, six healthy cases and fifteen guards';
          const roleReads = {fixed:[18,42],original:[17,33],'identity-key':[18,44],'stint-multiset':[18,43],restored:[18,42]};
          const readJson = (bytes,label) => {
            const value=JSON.parse(bytes.toString('utf8'));
            assert.equal(bytes.toString('utf8'),JSON.stringify(value)+'\n',label+' exact compact JSON');
            return value;
          };
          const runs = {};
          let fixedRaw,fixedGuardsRaw,fixedEvidence,fixedGuards;
          verifyHeld();
          try{
            for(const role of roleOrder){
              const red = Object.hasOwn(named,role);
              const mutation = changed.get(role);
              const body = role==='original'?originalBody:mutation?.body??fixedBody;
              const dir=path.join(out,role);
              fs.mkdirSync(dir);
              if(role!=='fixed'){
                assert(!fs.readFileSync(edge).equals(body),role+' actual physical source change');
                fs.writeFileSync(edge,body);
              }
              assert(fs.readFileSync(edge).equals(body),role);
              const diff=()=>git('diff','--name-only','HEAD').toString('utf8').trimEnd().split('\n').filter(Boolean);
              assert.deepEqual(diff(),red?[edge]:[],role);
              fs.writeFileSync(path.join(dir,'edge.ts'),body);
              const main=path.join(dir,'public-cases.raw.json'),focused=path.join(dir,'guards.raw.json');
              const result=spawnSync(process.execPath,[helper],{
                env:{...process.env,NBA_CHAIN_NAME_VARIANTS_EDGE_BLOB:blob(body),NBA_CHAIN_NAME_VARIANTS_PROFILE:'initials-only',
                  NBA_CHAIN_NAME_VARIANTS_RAW:main,NBA_CHAIN_NAME_VARIANTS_GUARDS_RAW:focused,
                  NODE_OPTIONS:'--require='+process.cwd()+'/scripts/lib/offlineTransport.cjs'},
                timeout:90000,maxBuffer:16*1024*1024,
              });
              const stdout=result.stdout||Buffer.alloc(0),stderr=result.stderr||Buffer.alloc(0);
              const output=Buffer.concat([stdout,stderr]);
              fs.writeFileSync(path.join(dir,'helper.log'),output);
              fs.writeFileSync(path.join(dir,'helper-exit.txt'),String(result.status)+'\n');
              process.stdout.write(stdout);process.stderr.write(stderr);
              assert.equal(result.error,undefined,role);
              assert.equal(result.signal,null,role);
              assert.equal(result.status,red?1:0,role);
              const log=output.toString('utf8');
              const lines=log.trimEnd().split(/\r?\n/);
              const errors=lines.filter(line=>/^[A-Za-z]*Error(?: \[[A-Z_]+\])?:/.test(line));
              assert.deepEqual(errors,red?[prefix+named[role]]:[],role+' only expected actual exception');
              if(red) assert(/scripts\/qa\/verifyNbaChainNameVariants\.mjs:\d+:\d+/.test(log),role+' reaches actual helper stack');
              else assert.equal(lines.at(-1),completion,role+' exact complete positive');
              assert(!/UnhandledPromiseRejection|ERR_MODULE_NOT_FOUND|ERR_UNKNOWN_FILE_EXTENSION|ERR_UNSUPPORTED_TYPESCRIPT_SYNTAX|SIM_OFFLINE_BLOCK/i.test(log),role+' no unrelated runtime failure');
              const raw=fs.readFileSync(main),guardsRaw=fs.readFileSync(focused);
              const evidence=readJson(raw,role+' main'),guards=readJson(guardsRaw,role+' guards');
              assert.deepEqual([evidence.schema,guards.schema,evidence.cases.length,guards.cases.length],
                ['nba-chain-name-variants-v1','nba-chain-name-variants-fixed-guards-v1',8,15],role);
              assert.deepEqual(evidence.source,guards.source,role+' exact same physical product source in both receipts');
              assert.deepEqual([evidence.source.path,evidence.source.blob,evidence.source.sha256,evidence.source.typescript],
                [edge,blob(body),pin(body).sha256,'5.8.3'],role);
              assert.deepEqual([evidence.cases,guards.cases].map(cases=>cases.reduce((sum,row)=>sum+row.reads.length,0)),roleReads[role],role+' exact bounded reads');
              for(const row of [...evidence.cases,...guards.cases]){
                assert.deepEqual([row.envReads,row.clientCalls],[['SUPABASE_URL','SUPABASE_SERVICE_ROLE_KEY'],1],role+' '+row.id);
                assert.deepEqual([row.outcome.status,row.outcome.contentType,row.outcome.allowOrigin],[200,'application/json','https://douknowball.com'],role+' '+row.id);
              }
              if(role==='fixed'){
                assert.deepEqual([pin(raw),pin(guardsRaw)],[fixed.raw,fixed.guards]);
                fixedRaw=raw;fixedGuardsRaw=guardsRaw;fixedEvidence=evidence;fixedGuards=guards;
              }else if(role==='restored'){
                assert(raw.equals(fixedRaw)&&guardsRaw.equals(fixedGuardsRaw),'Exact complete restored fixed RAW bodies');
              }else if(role==='original'){
                assert.deepEqual(pin(raw),original.raw,'Original Edge rollback exactly rejoins admitted original main RAW');
              }else{
                assert.deepEqual({...evidence,source:fixedEvidence.source},fixedEvidence,role+' all main case outcomes and reads held');
              }
              const checks = (() => {
              const expectations = [{"name":"identity-key","raw":{"bytes":12255,"sha256":"6c44eed4eab8f56831403ddf225d4262a34a8557365d79e685e4d42bf10a8f96","reads":18},"guards":{"bytes":121798,"sha256":"8b40a75c8ca3db6d71afb05a3f0c841130dd0989cd7d5c949b7fcffca758da74","reads":44},"changed":["conflicting-person-keys","mixed-keyed-and-unkeyed-stints"],"expectedOutcomes":[{"id":"conflicting-person-keys","fullName":"Fixture JR Avery","valid":true},{"id":"mixed-keyed-and-unkeyed-stints","fullName":"Fixture JR Avery","valid":true}]},{"name":"stint-multiset","raw":{"bytes":12255,"sha256":"30c5efd8b1ad531476628fe7e4338bef1df5a545137730db962dd0a1e9ac8fe6","reads":18},"guards":{"bytes":121567,"sha256":"b51f2e7a28d1343d60714c18bfc7fd5e5ad77b771a6d3062cfa636173b18336c","reads":43},"changed":["same-count-changed-stint-tuple"],"expectedOutcomes":[{"id":"same-count-changed-stint-tuple","fullName":"Fixture JR Avery","valid":true}]}];
              const assertPin = (bytes, expected, name) => {
                const actual = pin(bytes);
                assert.equal(actual.bytes, expected.bytes, name + " byte count");
                assert.equal(actual.sha256, expected.sha256, name + " SHA256");
              };
              const heldIds = fixedEvidence.cases.map((entry) => entry.id);
              assert.deepEqual(evidence.cases.map((entry) => entry.id), heldIds);
              assert.deepEqual(guards.cases.map((entry) => entry.id), fixedGuards.cases.map((entry) => entry.id));
              const nameCase = (id) => evidence.cases.find((entry) => entry.id === id);
              assert.equal(nameCase("suffix-variant").outcome.body.valid, false);
              if (role === "fixed" || role === "restored") {
                assertPin(raw, fixed.raw, role + " main");
                assertPin(guardsRaw, fixed.guards, role + " guards");
                assert.equal(nameCase("initials-variant").outcome.body.fullName, "Fixture JR Avery");
                assert.deepEqual(raw, fixedRaw);
                assert.deepEqual(guardsRaw, fixedGuardsRaw);
                return { status: "passed", variant: "initials-variant", changedGuards: [], exactFixedReceipts: true };
              }
              if (role === "original") {
                assertPin(raw, original.raw, role + " main");
                assert.deepEqual(body, originalBody);
                assert.equal(nameCase("initials-variant").outcome.body.valid, false);
                const differing = evidence.cases.filter((entry, index) =>
                  JSON.stringify(entry) !== JSON.stringify(fixedEvidence.cases[index]));
                assert.deepEqual(differing.map((entry) => entry.id), ["initials-variant"]);
                return { status: "passed", variant: "initials-variant", changedGuards: [], exactOriginalMainReceipt: true };
              }
              const expected = expectations.find((entry) => entry.name === role);
              assert.ok(expected, "Bound mutation role");
              assertPin(raw, expected.raw, role + " main");
              assertPin(guardsRaw, expected.guards, role + " guards");
              assert.deepEqual(evidence.cases, fixedEvidence.cases);
              const changes = guards.cases.filter((entry, index) =>
                JSON.stringify(entry) !== JSON.stringify(fixedGuards.cases[index]));
              assert.deepEqual(changes.map((entry) => entry.id), expected.changed);
              const proven = fixedGuards.cases.find((entry) => entry.id === "keyed-multiple-stints-reordered");
              for (const entry of changes) {
                const held = fixedGuards.cases.find((item) => item.id === entry.id);
                assert.equal(held.outcome.body.valid, false);
                assert.equal(held.outcome.body.unverified, true);
                assert.equal(Object.hasOwn(held.outcome.body, "fullName"), false);
                assert.deepEqual(entry.outcome, proven.outcome);
                assert.deepEqual(entry.reads, [...held.reads, proven.reads.at(-1)]);
                assert.deepEqual({ ...entry, reads: held.reads, outcome: held.outcome }, held);
              }
              return { status: "passed", unchangedMain: true, changedGuards: expected.expectedOutcomes };
              })();
              assert.equal(checks.status,'passed',role+' independent per-role RAW contract');
              assert(fs.readFileSync(edge).equals(body),role+' physical Edge held through helper');
              assert.deepEqual(diff(),red?[edge]:[],role);
              verifyHeld();
              runs[role]={edge:{blob:blob(body),...pin(body)},physicalSpan:mutation?.span??null,
                main:{...pin(raw),cases:evidence.cases.length,reads:roleReads[role][0]},
                guards:{...pin(guardsRaw),cases:guards.cases.length,reads:roleReads[role][1]},
                exit:result.status,namedRed:red?named[role]:null,checks};
            }
          }finally{
            if(!fs.readFileSync(edge).equals(fixedBody))fs.writeFileSync(edge,fixedBody);
          }
          assert(fs.readFileSync(edge).equals(fixedBody));
          verifyHeld();
          assert.equal(git('diff','--name-only','HEAD').length,0);
          assert.equal(new Set(Object.values(runs).slice(0,4).map(row=>row.guards.sha256)).size,4);
          fs.writeFileSync(path.join(out,'admission.json'),JSON.stringify({
            status:'passed',roleOrder,cases:115,mainCases:40,guardCases:75,namedReds:3,onlyPhysicalProductPath:edge,
            exactOriginalMainRaw:true,exactRestoredFixedEdgeAndBothRaw:true,runs,
          },null,2)+'\n',{flag:'wx'});
          NODE
          node "$EVIDENCE/control-driver.mjs" 2>&1 | tee "$EVIDENCE/control-driver.log"
      - name: Verify unchanged physical source and locked offline run
        if: always()
        run: |
          set -euo pipefail
          git ls-files -s > "$EVIDENCE/source-after.txt"
          sha256sum package.json package-lock.json > "$EVIDENCE/locks-after.txt"
          cmp "$EVIDENCE/source-before.txt" "$EVIDENCE/source-after.txt"
          cmp "$EVIDENCE/locks-before.txt" "$EVIDENCE/locks-after.txt"
          git diff --exit-code HEAD -- .
          node "$EVIDENCE/physical.mjs" after
          test ! -s "$SIM_OFFLINE_RECEIPT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nba-chain-name-variants-controls-${{ github.run_id }}
          path: nba-chain-name-variants-controls
          retention-days: 14
          if-no-files-found: error
