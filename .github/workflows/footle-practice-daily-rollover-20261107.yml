            const report = json(reportName);
            assert.deepEqual([report.numTotalTests, report.numPassedTests, report.numFailedTests, report.numPendingTests, report.numTodoTests, report.success],
              [54, wantOriginal ? 53 : 54, wantOriginal ? 1 : 0, 0, 0, !wantOriginal]);
            for (const key of ['errors', 'unhandledErrors', 'testExecutionErrors']) if (Object.hasOwn(report, key)) assert.deepEqual(report[key], []);
            assert.equal(report.testResults.length, 8);
            for (const [file, count] of Object.entries({...heldCases, [test]: markers.size})) {
              const matches = report.testResults.filter(suite => suite.name.endsWith('/' + file));
              assert.equal(matches.length, 1, file);
              const [suite] = matches;
              const isFresh = file === test;
