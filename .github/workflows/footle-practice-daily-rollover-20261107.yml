          const refs = {"original":{"run":42372278434,"job":128402686625,"steps":12,"artifact":13574116606,"name":"footle-practice-daily-rollover-original-42372278434","head":"88ea45f429e44fb7174fa3f591bccea29a6647d6","tree":"d7a4261b66840811c85d961f4b75133a30157e80","workflow":"0c85d16199094da0e93872c2596db1c9a9e77c84","zipBytes":1012534,"zipSHA256":"f3324359cdbf179319cdd56ba3d14094115015367801971791e02886bf42f56b","bodies":20,"files":{"head.txt":"7b6f1c7e49de44b9dd2aeb348bb3b06bbd6097a24da9b790e812508afb4d13f6","tree.txt":"86a218f5635bdfaef64d95fd3681982930259de8c3f8cb2aa76b2411d845a144","source-receipt.json":"49e877ce618eb4edb80b14794bf3cd1bc5776a336ec5b811e8afa79a126ee2cb","original-result.json":"4aa97e369df279403ab110a79ba19f92e1fe58aff2fc402d2b42ee3fa09e29de","public-cases.raw.json":"f4cf10f6244c8ad9ce66df7c1be66334b07e9e52e7db18286a5ece4372b0ce0f","vitest.json":"2d0a6c81e840072774e709cdf2e6d3a88381df2d5a3fa5357a34e44e1163268f","vitest-exit.txt":"4355a46b19d348dc2f57c046f8ef63d4538ebb936000f3c9ee954a27460dd865","source-before.txt":"9afa47fddf7adb4268d23c8b5cd327675230aa35c1938705f6e86df4bedcad28","source-after.txt":"9afa47fddf7adb4268d23c8b5cd327675230aa35c1938705f6e86df4bedcad28","locks-before.txt":"d316e23dae0f11f4fabcf8edd97204c9b780c6da8a0f6307c86940cbdd28e3d7","locks-after.txt":"d316e23dae0f11f4fabcf8edd97204c9b780c6da8a0f6307c86940cbdd28e3d7","offline.log":"e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855","types.log":"e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"},"independentAuditSHA256":"6ef4bc42d276d5dfcc7071f8fe46292aafd63a417a07294720ce8ff8fad439d5"},"fixed":{"run":42762361123,"job":129650819535,"steps":12,"artifact":13738475972,"name":"footle-practice-daily-rollover-fixed-42762361123","head":"8182fa2db6e7ae1b36e95b9fcf187d7173a382a9","tree":"dc1eca03ab8a7f543f6413a6b0700c574cc585bf","workflow":"37c388584d13014d691c82c42b18d7387ef39a22","zipBytes":2027497,"zipSHA256":"14f5421845e706302280d44f268558a297fde19b5e692