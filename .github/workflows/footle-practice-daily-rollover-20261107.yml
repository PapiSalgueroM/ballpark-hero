              }
              assert.notEqual(old.html, fixed.html, label + ' effective protection');
              old.html = fixed.html;
              old.practiceFeedback = null;
              old.search = false;
              old.giveUp = false;
              old.confirm = false;
            }
            const lost = by(rollover, 'collision-give-up-settled');
            const oldLost = JSON.parse(lost.storage[practiceKey]);
            assert.deepEqual([oldLost.active, oldLost.rounds[0].status], [true, 'lost']);
            lost.storage[practiceKey] = save;
            for (const label of ['new-daily-returned', 'after-teardown']) {
              const previous = by(rollover, label);
              assert.deepEqual([JSON.parse(previous.storage[practiceKey]).active, JSON.parse(previous.storage[practiceKey]).rounds[0].status], [false, 'lost']);
              previous.storage[practiceKey] = parked;
            }
            for (const label of ['collision-give-up-open', 'collision-give-up-confirm']) {
              const entry = rollover.actions.find(action => action.label === label);
              assert.equal(entry.status, 'performed');
              entry.status = 'unavailable';
            }
            const collapse = rows => rows.filter((row, i) => i === 0 || JSON.stringify(row) !== JSON.stringify(rows[i - 1]));
            for (const key of ['rolloverCollision', 'sameDayPractice']) {
              const old = expected.cases[key];
              const fixed = raw.cases[key];
              assert(fixed.closed && old.closed);
              assert(fixed.completionCalls.length > 0 && fixed.completionCalls.every(call => JSON.stringify(call.args) === '["footle",false,0]'));
              assert.deepEqual(collapse(fixed.completionCalls), collapse(old.completionCalls), key + ' same completion observations');
