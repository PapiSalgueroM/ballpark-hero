          const options = { maxBuffer: 64 * 1024 * 1024 };
          const cmd = (program, args) => execFileSync(program, args, options);
          const git = (...args) => cmd('git', args).toString('utf8');
          const hash = (algorithm, bytes) => createHash(algorithm).update(bytes).digest('hex');
          const sha = bytes => hash('sha256', bytes);
