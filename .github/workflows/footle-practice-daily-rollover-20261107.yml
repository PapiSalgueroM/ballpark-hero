                assert.equal(doc.querySelector('[role="combobox"], [data-footle-clue-desk], [data-footle-clue-empty]'), null, label);
                assert(![...doc.querySelectorAll('button')].some(button => ['Give up', 'Yes, reveal it'].includes(button.textContent.trim())), label);
                assert(!doc.body.textContent.includes(original.fixture.newTarget), label + ' no Daily answer');
              } finally {
