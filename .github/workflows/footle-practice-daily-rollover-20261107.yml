          const save = (file, value) => write(file, JSON.stringify(value, null, 2) + '\n');
          const sorted = rows => [...rows].sort();
          const tree = ref => new Map(git('ls-tree', '-r', '-z', ref).split('\0').filter(Boolean).map(row => {
            const match = /^(100(?:644|755)) blob ([a-f0-9]{40})\t(.+)$/.exec(row);
            assert(match, row);
            return [match[3], [match[1], match[2]]];
          }));
          const source = () => ({
            head: git('rev-parse', 'HEAD').trim(), tree: git('rev-parse', 'HEAD^{tree}').trim(), parent, parentTree,
