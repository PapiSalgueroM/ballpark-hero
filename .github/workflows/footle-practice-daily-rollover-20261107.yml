            save('source-receipt.json', { ...source(), pins: { [page]: fixedPage, [hook]: fixedHook, [test]: testBlob, [plan]: planBlob }, owned, references: refs });
          }
          
          const heldCases = {"src/test/footlePractice.test.tsx":11,"src/test/footleUnlimitedSession.test.tsx":10,"src/hooks/useGame.test.ts":2,"src/lib/footlePracticeRun.test.ts":12,"src/test/footleClueDesk.test.tsx":8,"src/test/footleResultCurrency.test.tsx":5,"src/lib/fetchFootlePlayerPool.test.ts":4};
          const markers = new Map([["keeps the new Daily answer hidden when a saved practice run crosses Eastern midnight","FOOTLE_PRACTICE_REVEALS_CURRENT_DAILY"],["restores a same-day practice run and keeps Daily and Unlimited progress separate",null]]);
          const { JSDOM } = process.argv[2] === 'qualify' ? await import('jsdom') : {};
          
          function compareRaw(raw, original) {
            assert.equal(raw.schema, 'footle-practice-daily-rollover-v1');
