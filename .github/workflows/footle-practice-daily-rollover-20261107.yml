          mkdir footle-practice-daily-rollover-active-preflight
          touch footle-practice-daily-rollover-active-preflight/offline.log
          git rev-parse HEAD > footle-practice-daily-rollover-active-preflight/head.txt
          git rev-parse 'HEAD^{tree}' > footle-practice-daily-rollover-active-preflight/tree.txt
          git ls-files -s > footle-practice-daily-rollover-active-preflight/source-before.txt
          sha256sum package.json package-lock.json > footle-practice-daily-rollover-active-preflight/locks-before.txt
          git diff --exit-code HEAD -- .
