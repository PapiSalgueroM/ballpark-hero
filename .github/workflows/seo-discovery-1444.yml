          assert.equal(r.faults.length, 3); assert(r.faults.every(x => x.status === 'passed' && x.detected));
          assert.equal(r.restorations.length, 3); assert(r.restorations.every(x => x.status === 'passed'));
          assert.equal(r.remoteTransport, 0); assert(r.staticReadRequests > 0);
          for (const row of r.positives) {
