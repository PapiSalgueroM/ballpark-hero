            assert.match(row.beforeSha256, /^[0-9a-f]{64}$/); assert.match(row.afterSha256, /^[0-9a-f]{64}$/);
            assert.notEqual(row.beforeSha256, row.afterSha256);
            const failed = row.checks.filter(x => x.status === 'failed');
            assert.equal(failed.length, 1); assert.equal(failed[0].marker, row.expectedMarker);
            assert.equal(failed[0].errorType, 'AssertionError'); assert(failed[0].error.includes(row.expectedMarker));
