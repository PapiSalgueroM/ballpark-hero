name: Shield annual Press promise compatibility
on:
  push:
    branches: [codex/sc-shield-press-compat-20261102]
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: '1'
      SIM_NETWORK: offline
      BEFORE: ${{ github.event.before }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Bind the actual causal parent and exactly five paths
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/sc-shield-press-compat"
          export OUT
          printf 'OUT=%s\n' "$OUT" >> "$GITHUB_ENV"
          mkdir "$OUT"
          test "$GITHUB_REF" = refs/heads/codex/sc-shield-press-compat-20261102
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$BEFORE" = 0000000000000000000000000000000000000000
          test "$(git rev-parse HEAD^)" = 6c772324d855c39dc1c5e7361c0a046fe8c9dae5
          test "$(git rev-parse 'HEAD^^{tree}')" = 062bab4cae88009bf984ef0f6333a7ed5d4bc68b
          git rev-parse HEAD HEAD^{tree} > "$OUT/head-tree.txt"
          git diff --name-status HEAD^ HEAD > "$OUT/changed-paths.txt"
          cat > "$OUT/expected-paths.txt" <<'PATHS'
          A	.github/workflows/sc-shield-press-compat.yml
          A	scripts/simSoccerShieldPress.mjs
          M	src/components/soccer-career/PressRoom.tsx
          M	src/lib/soccerCareerPress.ts
          A	src/test/soccerShieldPress.test.ts
          PATHS
          cmp "$OUT/expected-paths.txt" "$OUT/changed-paths.txt"
          cat > "$OUT/input-pins.txt" <<'PINS'
          src/lib/soccerCareerPress.ts 08b91f6cae1d239ee2ac52ecaf80fd81a66cda8b
          src/test/soccerShieldPress.test.ts 60faec8ee37a88ed4ecfafc53172b0212907014b
          src/components/soccer-career/PressRoom.tsx 19790caba42083109732c5cf2127d2b7636b00fb
          scripts/simSoccerShieldPress.mjs 967de754af1c8e1118257255695cc5fdc7ecb95e
          src/test/soccerPressRoomReadAsAbsent.test.tsx 9b00b67863c3c730146382307abe1b354482dd11
          src/lib/soccerCareerEngine.ts 53c57e31c4796e8ea4934d133cc1d82baa6ec34b
          src/lib/soccerCareerExtraCups.ts ac6158ec8a272780da6a6776bdec2f785f0e3c5b
          src/test/setup.ts df00cdf5c54e8c8efc71e46d7585ae76acb4fc8d
          vitest.config.ts ed2a9dc677f77dfe95c061064eeff5782b856864
          package.json 2ff64986fb76ebc51b706f2fd24765768874008a
          package-lock.json 97d6f12a052f25f400462938c241789a083f0bfe
          tsconfig.app.json 51f581dd91641b4c1f1219f646788e73cf6bf00c
          scripts/lib/offlineTransport.cjs 0fda542a2649fe5da937c6976fd0f5b6073e74b6
          scripts/simHarnessAnchors.mjs 1cb32d353c317aacd32fd51f25f7ba000ac24e8d
          PINS
          while read -r file blob; do test "$(git rev-parse "HEAD:$file")" = "$blob"; done < "$OUT/input-pins.txt"
          git ls-files -z > "$OUT/source-members.before"
          git ls-files -z | xargs -0 sha256sum > "$OUT/source.sha256"
          cat > "$OUT/capture.sh" <<'CAPTURE'
          capture() {
            local tag="$1"; shift
            test ! -e "$OUT/$tag.exit"
            printf '%s\0' "$@" > "$OUT/$tag.argv"; : > "$OUT/$tag.transport"
            set +e
            SIM_OFFLINE_RECEIPT="$OUT/$tag.transport" "$@" > "$OUT/$tag.stdout" 2> "$OUT/$tag.stderr"
            local code=$?
            set -e
            printf '%s\n' "$code" > "$OUT/$tag.exit"
            tail -n 12 "$OUT/$tag.stdout"; tail -n 12 "$OUT/$tag.stderr"
            test ! -s "$OUT/$tag.transport" || return 1
            return "$code"
          }
          CAPTURE
      - name: Locked online install separate from offline qualification
        id: install
        run: |
          set -euo pipefail
          code=0; NODE_OPTIONS='' npm ci > "$OUT/install.stdout" 2> "$OUT/install.stderr" || code=$?
          printf '%s\n' "$code" > "$OUT/install.exit"; test "$code" -eq 0
          find node_modules -path node_modules/.vite -prune -o -type f -print0 | sort -z | xargs -0 sha256sum > "$OUT/dependency-files.sha256"
      - name: Proper joined app types and permanent wrapper syntax
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          source "$OUT/capture.sh"
          capture syntax node --check scripts/simSoccerShieldPress.mjs
          capture types node_modules/.bin/tsc --noEmit -p tsconfig.app.json
      - name: Original 19 cases focused nine and meaningful physical controls
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          export SC_SHIELD_PRESS_OUT="$PWD/tmp/sc-shield-press-$GITHUB_RUN_ID"
          printf 'SC_SHIELD_PRESS_OUT=%s\n' "$SC_SHIELD_PRESS_OUT" >> "$GITHUB_ENV"
          test ! -e "$SC_SHIELD_PRESS_OUT"
          source "$OUT/capture.sh"
          capture press node scripts/simSoccerShieldPress.mjs
      - name: Independently bind original raw reports and all source restoration receipts
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          source "$OUT/capture.sh"
          cat > "$OUT/verify.mjs" <<'VERIFY'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import { createHash } from 'node:crypto';
          const out = process.env.OUT, dir = process.env.SC_SHIELD_PRESS_OUT;
          const sha = body => createHash('sha256').update(body).digest('hex');
          const read = file => JSON.parse(fs.readFileSync(path.join(dir, file), 'utf8'));
          const summary = read('summary.json'), receipt = read('receipt.json');
          assert.equal(receipt.completed, true); assert.equal(receipt.primary, null); assert.deepEqual(receipt.secondary, []);
          assert.equal(receipt.children, 9); assert.equal(receipt.removedSourceCopy, true);
          assert.equal(summary.children, 9); assert.equal(summary.results.length, 9); assert.equal(summary.physicalControls, 6);
          assert.deepEqual(summary.totals, { passed: 47, ownedFailures: 13, declaredUnselectedSkips: 40, executed: 60 });
          const faults = ['omit-forward-grade', 'trust-unverified-result', 'omit-positive-annual-apps', 'use-final-outcome', 'project-answer-snapshot'];
          const names = ['ordinary', 'healthy-copy', 'old-source', ...faults, 'restored-copy'];
          assert.deepEqual(summary.results.map(row => row.name), names);
          const expected = [[28,0,0],[9,0,0],[1,8,0],...[1,2,3,4,5].map(() => [0,1,8]),[9,0,0]];
          const current = fs.readFileSync('src/lib/soccerCareerPress.ts'), canonical = current.toString('utf8').replace(/\r\n/g, '\n');
          assert.equal(sha(Buffer.from(canonical)), '9cefc68c7cdea6f3f94e383f199cf46bdecdc0152fc7a199d260aa99f794a352');
          const encode = (body, ending) => Buffer.from(ending === 'CRLF' ? body.replace(/\n/g, '\r\n') : body);
          const old = fs.readFileSync(path.join(dir, 'old-source.ts')), oldEdit = read('old-source.edit.json');
          assert.equal(sha(old), oldEdit.changedSha256); assert.notEqual(oldEdit.changedSha256, oldEdit.originalSha256);
          assert.equal(oldEdit.originalSha256, sha(current)); assert.equal(oldEdit.inverseSha256, sha(current)); assert.equal(oldEdit.physicalRestoreSha256, sha(current));
          assert.equal(oldEdit.canonicalOldSha256, '196441a89d900140c05aeb9671f72e6b454cfd75eafd0264eb81083765b0fcff');
          let oldInverse = old.toString('utf8').replace(/\r\n/g, '\n');
          assert.equal(sha(Buffer.from(oldInverse)), oldEdit.canonicalOldSha256);
          for (const edit of [...oldEdit.edits].reverse()) {
            assert.equal(oldInverse.slice(edit.offset, edit.offset + edit.after.length), edit.after);
            oldInverse = oldInverse.slice(0, edit.offset) + edit.before + oldInverse.slice(edit.offset + edit.after.length);
          }
          assert.deepEqual(encode(oldInverse, oldEdit.lineEnding), current);
          for (const id of faults) {
            const edit = read(id + '.edit.json'), body = fs.readFileSync(path.join(dir, id + '.source.ts'));
            assert.equal(edit.id, id); assert.equal(body.length, edit.changed.bytes); assert.equal(sha(body), edit.changed.sha256);
            assert.notEqual(edit.changed.sha256, edit.original.sha256); assert.equal(edit.original.sha256, sha(current));
            assert.equal(edit.inverse.sha256, sha(current)); assert.equal(edit.physicalRestoreSha256, sha(current));
            const normalized = body.toString('utf8').replace(/\r\n/g, '\n');
            assert.equal(normalized.slice(edit.offset, edit.offset + edit.after.length), edit.after);
            const inverse = normalized.slice(0, edit.offset) + edit.before + normalized.slice(edit.offset + edit.after.length);
            assert.deepEqual(encode(inverse, edit.lineEnding), current);
            assert.equal(summary.results.find(row => row.name === id).sourceCopySha256, edit.changed.sha256);
          }
          const rawChildren = [];
          for (let i = 0; i < names.length; i++) {
            const name = names[i], result = summary.results[i], [passed, failed, skipped] = expected[i];
            const body = fs.readFileSync(path.join(dir, name + '.vitest.json')), report = JSON.parse(body);
            assert.equal(sha(body), result.rawReportSha256); assert.equal(report.success, failed === 0);
            assert.equal(Number(fs.readFileSync(path.join(dir, name + '.exit'), 'utf8')), failed ? 1 : 0);
            const processReceipt = read(name + '.process.json'); assert.equal(processReceipt.status, failed ? 1 : 0);
            assert.equal(processReceipt.error, null); assert.equal(processReceipt.signal, null);
            assert.equal(fs.statSync(path.join(dir, name + '.transport')).size, 0);
            for (const [key, value] of Object.entries({ numTotalTests: passed + failed + skipped, numPassedTests: passed,
              numFailedTests: failed, numPendingTests: skipped, numTodoTests: 0 })) assert.equal(report[key], value, name + ' ' + key);
            assert.equal(report.testResults.length, name === 'ordinary' ? 2 : 1);
            const counters = Object.fromEntries(['numUnhandledErrors', 'numRuntimeErrorTestSuites', 'numRuntimeErrorTests'].map(key => [key, report[key] ?? null]));
            assert.deepEqual(result.counters, counters); for (const value of Object.values(counters)) if (value !== null) assert.equal(value, 0);
            assert.equal(result.runtimeCounterCompleteness, Object.values(counters).some(value => value === null) ? 'UNKNOWN' : 'REPORTED');
            assert.equal(result.detectedRuntimeError, false);
            const failingRows = report.testResults.flatMap(suite => suite.assertionResults).filter(row => row.status === 'failed');
            assert.equal(failingRows.length, failed);
            for (const row of failingRows) {
              const marker = row.title.split(/[ :]/)[0], first = row.failureMessages[0].replace(/\x1b\[[0-9;]*m/g, '').split(/\r?\n/).find(line => line.trim())?.trim();
              assert.equal(first?.startsWith('AssertionError: ' + marker + ':'), true);
            }
            rawChildren.push({ name, passed, primaryOwned: failed, declaredUnselected: skipped, rawReportSha256: sha(body),
              runtimeCounters: counters, runtimeCounterCompleteness: result.runtimeCounterCompleteness });
          }
          assert.deepEqual(read('source-after.json'), read('source-before.json'));
          fs.writeFileSync(path.join(out, 'qualification-summary.json'), JSON.stringify({ scope: summary.scope, children: 9,
            totals: summary.totals, physicalControls: 6, restored: true, rawChildren,
            limits: 'Actual original19 and focused9 only. No full-unit, build/browser or release credit.' }, null, 2) + '\n');
          VERIFY
          capture verify node "$OUT/verify.mjs"
      - name: Admit the permanent wrapper to the existing source-anchor fence
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          unset ANCHOR_CONTROL
          source "$OUT/capture.sh"
          capture anchor-fence node scripts/simHarnessAnchors.mjs
      - name: Actual stripped-normalizer control and anchor ownership
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          source "$OUT/capture.sh"
          capture anchor-strip env ANCHOR_CONTROL=strip node scripts/simHarnessAnchors.mjs
          cat > "$OUT/verify-anchors.mjs" <<'ANCHORS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          const dir = process.env.OUT, sha = body => createHash('sha256').update(body).digest('hex');
          const records = [];
          for (const name of ['anchor-fence', 'anchor-strip']) {
            assert.equal(Number(fs.readFileSync(dir + '/' + name + '.exit', 'utf8')), 0);
            assert.equal(fs.statSync(dir + '/' + name + '.transport').size, 0);
            const stdout = fs.readFileSync(dir + '/' + name + '.stdout', 'utf8'), stderr = fs.readFileSync(dir + '/' + name + '.stderr', 'utf8');
            assert.equal(/Unhandled (?:Errors?|Rejection|Exception)|unhandledRejection|uncaughtException|ERR_MODULE_NOT_FOUND|SyntaxError:|ReferenceError:|TypeError:/i.test(stdout + '\n' + stderr), false);
            const failures = (stdout + '\n' + stderr).split(/\r?\n/).map(line => line.trim()).filter(line => line.startsWith('FAIL '));
            if (name === 'anchor-fence') {
              assert.deepEqual(failures, []);
              assert.equal(stdout.split(/\r?\n/).filter(line => line === 'simHarnessAnchors: green. Every harness parses and none carries an unmatchable anchor.').length, 1);
            } else {
              assert.equal(failures.length, 1); assert.equal(failures[0].startsWith('FAIL simFightCareer.mjs reads '), true);
              assert.equal(stdout.includes('[control strip applied to a copy of simFightCareer.mjs]'), true);
              assert.equal(stdout.split(/\r?\n/).filter(line => line === 'control "strip": the planted fault in simFightCareer.mjs was named and nothing else was, the check works').length, 1);
            }
            records.push({ name, rawExit: 0, stdoutSha256: sha(Buffer.from(stdout)), stderrSha256: sha(Buffer.from(stderr)), failures,
              runtimeCounters: null, runtimeCounterCompleteness: 'UNKNOWN' });
          }
          fs.writeFileSync(dir + '/anchor-summary.json', JSON.stringify({ scope: 'Existing actual anchor checker and its real sole-owner copied negative, no exemption.', records }, null, 2) + '\n');
          ANCHORS
          capture anchor-classify node "$OUT/verify-anchors.mjs"
      - name: Always retain raw reports actual copied sources and restoration evidence
        if: always()
        run: |
          set -euo pipefail
          probe_dir="$(printenv SC_SHIELD_PRESS_OUT || true)"
          if test -n "$probe_dir" && test -d "$probe_dir"; then cp -a -- "$probe_dir" "$OUT/press"; fi
      - name: Always hold all source dependency bytes and membership
        if: always()
        run: |
          set -euo pipefail
          sha256sum --check "$OUT/source.sha256" > "$OUT/source-held.log"
          if test -f "$OUT/dependency-files.sha256"; then sha256sum --check "$OUT/dependency-files.sha256" > "$OUT/dependency-held.log"; fi
          git ls-files -z > "$OUT/source-members.after"; cmp "$OUT/source-members.before" "$OUT/source-members.after"
          git diff --exit-code HEAD > "$OUT/source-diff.log"
          git ls-files --others --exclude-standard > "$OUT/untracked.txt"; test ! -s "$OUT/untracked.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sc-shield-press-compat-${{ github.run_id }}
          path: ${{ runner.temp }}/sc-shield-press-compat/
          retention-days: 14
