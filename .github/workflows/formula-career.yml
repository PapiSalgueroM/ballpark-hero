          FORMULA_RUNNER_DIR=formula-career-artifacts/full-suite-runner node formula-career-artifacts/helpers/check-runner.mjs || failed=1
          node formula-career-artifacts/helpers/check-formula.mjs || failed=1
          exit "$failed"
      - name: All fifteen rebuilt output readers with complete child output
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          failed=0
          for harness in simAdsense simBrand simHeadTags simHiddenPages simHubs simIndexNow simIndexing simInternalLinks simNoRivalNames simPrerender simPrerenderBoot simRetiredRoutes simSchema simSitemap simSnapshotAssets; do
            mkdir -p "formula-career-artifacts/readers/$harness"
            FORMULA_RUNNER_DIR="formula-career-artifacts/readers/$harness" ONLY="$harness" NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node formula-career-artifacts/helpers/observe-runner.mjs --browser 2>&1 | tee "formula-career-artifacts/readers/$harness/runner.log" || failed=1
            FORMULA_RUNNER_DIR="formula-career-artifacts/readers/$harness" node formula-career-artifacts/helpers/check-runner.mjs || failed=1
          done
          exit "$failed"
      - name: Final whole source package dependency and generated-body holds
        if: ${{ !cancelled() }}
        run: |
          failed=0
          git diff --exit-code HEAD -- . ':!public/**' ':!scripts/data/lastmod.json' > formula-career-artifacts/source-held.log || failed=1
          git ls-files --others --exclude-standard -- src scripts .github/workflows > formula-career-artifacts/unexpected-source-files.txt
          test ! -s formula-career-artifacts/unexpected-source-files.txt || failed=1
          sha256sum package.json package-lock.json > formula-career-artifacts/packages-final.txt
          cmp formula-career-artifacts/packages-before.txt formula-career-artifacts/packages-final.txt || failed=1
          DEPENDENCY_OUT=formula-career-artifacts/dependencies-final.json node formula-career-artifacts/helpers/dependencies.mjs || failed=1
          cmp formula-career-artifacts/dependencies-before.json formula-career-artifacts/dependencies-final.json || failed=1
          sha256sum --check formula-career-artifacts/helper-source-sha256.txt || failed=1
          if [ -f formula-career-artifacts/generated-body-inventory.json ]; then node formula-career-artifacts/helpers/generated.mjs --check || failed=1; fi
          if [ -f formula-career-artifacts/generated-archive-sha256.txt ]; then sha256sum --check formula-career-artifacts/generated-archive-sha256.txt || failed=1; fi
          node --input-type=module - <<'JS' || failed=1
          import fs from 'node:fs';import assert from 'node:assert/strict';assert.equal(JSON.parse(fs.readFileSync('node_modules/playwright/package.json','utf8')).version,'1.64.0');console.log('PASS actual final Playwright 1.64.0');
          JS
          du -sb formula-career-artifacts > formula-career-artifacts/artifact-size.log
          find formula-career-artifacts -type f ! -name artifact-member-sha256.txt -print0 | sort -z | xargs -0 sha256sum > formula-career-artifacts/artifact-member-sha256.txt
          test "$(du -sb formula-career-artifacts | cut -f1)" -lt 500000000 || failed=1
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: formula-career-final-${{ github.run_id }}-${{ github.run_attempt }}
          path: formula-career-artifacts/
          include-hidden-files: true
          retention-days: 5
          if-no-files-found: error
