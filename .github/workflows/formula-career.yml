            const index=children.length,base=path.join(out,'children',String(index).padStart(4,'0')+'-'+file),environment=Object.fromEntries(['SIM_NETWORK','ENGINES','TZ','NODE_OPTIONS','BASE','SWEEP_BASE','PORT','ONLY','FORMULA_EVIDENCE_DIR','FORMULA_CAREER_OUT','FORMULA_CAREER_BROWSER_OUT','FORMULA_CAREER_INPUT'].map(key=>[key,options?.env?.[key]??null])),row={file,sourceSha256:discovery.find(row=>row.file===file).sha256,startedAt:Date.now(),closedAt:null,args,cwd:options?.cwd??null,environment,stdout:base+'.stdout.log',stderr:base+'.stderr.log',stdoutBytes:0,stderrBytes:0,chunks:[],exitCode:null,signal:null};children.push(row);fs.writeFileSync(row.stdout,'');fs.writeFileSync(row.stderr,'');
            child.stdout.on('data',data=>{row.chunks.push({stream:'stdout',start:row.stdoutBytes,bytes:data.length});fs.appendFileSync(row.stdout,data);row.stdoutBytes+=data.length;});child.stderr.on('data',data=>{row.chunks.push({stream:'stderr',start:row.stderrBytes,bytes:data.length});fs.appendFileSync(row.stderr,data);row.stderrBytes+=data.length;});child.on('close',(code,signal)=>{row.exitCode=code;row.signal=signal;row.closedAt=Date.now();});
           }return child;
          };syncBuiltinESMExports();process.on('exit',code=>fs.writeFileSync(path.join(out,'process.json'),JSON.stringify({runnerExit:code,children},null,2)));await import(pathToFileURL(path.resolve('scripts/runAllSims.mjs')).href);
          JS
          cat > formula-career-artifacts/helpers/check-runner.mjs <<'JS'
          import fs from 'node:fs';import path from 'node:path';import assert from 'node:assert/strict';import {createHash} from 'node:crypto';
          const out=path.resolve(process.env.FORMULA_RUNNER_DIR),discovery=JSON.parse(fs.readFileSync(path.join(out,'discovery.json'),'utf8')),processes=JSON.parse(fs.readFileSync(path.join(out,'process.json'),'utf8')),text=fs.readFileSync(path.join(out,'runner.log'),'utf8'),classifications=[...text.matchAll(/^\s+(PASS|FAIL|EMPTY|SKIP)\s+([A-Za-z0-9]+\.mjs)\s+[0-9.]+s\s*$/gm)].map(m=>({verdict:m[1],file:m[2]})),omissions=[];
          const hash=b=>createHash('sha256').update(b).digest('hex');for(const row of processes.children){const offsets={stdout:0,stderr:0};for(const key of ['stdout','stderr'])assert.equal(fs.statSync(row[key]).size,row[key+'Bytes']);for(const chunk of row.chunks){assert(['stdout','stderr'].includes(chunk.stream));assert.equal(chunk.start,offsets[chunk.stream]);assert(Number.isInteger(chunk.bytes)&&chunk.bytes>0);offsets[chunk.stream]+=chunk.bytes;}assert.equal(offsets.stdout,row.stdoutBytes);assert.equal(offsets.stderr,row.stderrBytes);const output=fs.readFileSync(row.stdout,'utf8')+'\n'+fs.readFileSync(row.stderr,'utf8');omissions.push({file:row.file,lines:output.split('\n').filter(line=>/\bskip(?:ped|ping)?\b|\bnot (?:run|checked)\b|\blive.only\b/i.test(line)),stdoutSha256:hash(fs.readFileSync(row.stdout)),stderrSha256:hash(fs.readFileSync(row.stderr))});}
          const failures=classifications.filter(x=>x.verdict!=='PASS');fs.writeFileSync(path.join(out,'scope.json'),JSON.stringify({expected:discovery.expected,actual:processes.children.map(x=>x.file),classifications,failures,internalOmissions:omissions,qualification:'Internal omissions are retained and receive no live or database coverage credit.'},null,2));
          assert.equal(discovery.network,'offline');assert.equal(discovery.browser,true);assert.equal(hash(fs.readFileSync('scripts/runAllSims.mjs')),discovery.runnerSha256);assert.deepEqual(processes.children.map(x=>x.file).sort(),[...discovery.expected].sort());assert.deepEqual(classifications.map(x=>x.file).sort(),[...discovery.expected].sort());assert.equal(failures.length,0,'FAIL, EMPTY or SKIP results are unwaived');assert.equal(processes.runnerExit,0);for(const row of processes.children){assert.equal(row.exitCode,0,row.file);assert.equal(row.signal,null,row.file);}
          console.log('PASS exact unchanged runner coverage: '+classifications.length+' named results, with no FAIL, EMPTY or SKIP');
          JS
          cat > formula-career-artifacts/helpers/check-formula.mjs <<'JS'
          import fs from 'node:fs';import path from 'node:path';import assert from 'node:assert/strict';import {createHash} from 'node:crypto';
          const hash=b=>createHash('sha256').update(b).digest('hex'),read=file=>JSON.parse(fs.readFileSync(file,'utf8')),root=path.resolve('formula-career-artifacts'),runner=path.join(root,'full-suite-runner'),discovery=read(path.join(runner,'discovery.json')),processes=read(path.join(runner,'process.json')),scope=read(path.join(runner,'scope.json'));
          assert.deepEqual(discovery.selected,[],'full suite has no ONLY filter');
          const records=[];
          for(const file of ['simFormulaCareer.mjs','playFormulaCareer.mjs']){
           const sources=discovery.discovery.filter(row=>row.file===file),children=processes.children.filter(row=>row.file===file),classified=scope.classifications.filter(row=>row.file===file);
           assert.equal(sources.length,1,file+' exact discovery');assert.equal(children.length,1,file+' invoked exactly once');assert.equal(classified.length,1,file+' classified once');assert.equal(classified[0].verdict,'PASS');
           const child=children[0];assert.equal(child.sourceSha256,sources[0].sha256);assert.equal(child.sourceSha256,hash(fs.readFileSync('scripts/'+file)));assert.deepEqual(child.args,[path.resolve('scripts',file)]);assert.equal(path.resolve(child.cwd),process.cwd());assert.equal(child.exitCode,0);assert.equal(child.signal,null);
           assert.equal(child.environment.ONLY,null);assert.equal(child.environment.FORMULA_EVIDENCE_DIR,null);assert.equal(child.environment.FORMULA_CAREER_OUT,'formula-career-artifacts/proof');assert.equal(child.environment.FORMULA_CAREER_BROWSER_OUT,'formula-career-artifacts/browser');assert.equal(child.environment.FORMULA_CAREER_INPUT,'formula-career-artifacts/proof');assert.equal(child.environment.SIM_NETWORK,'offline');assert.equal(child.environment.ENGINES,'chromium');
           assert(Number.isFinite(child.startedAt)&&Number.isFinite(child.closedAt)&&child.closedAt>=child.startedAt);records.push({file,child,classification:classified[0]});
          }
