name: Formula Career
on:
  push:
    branches: [codex/f1-driver-career]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: formula-career-${{ github.sha }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      SIM_NETWORK: offline
      ENGINES: chromium
      TZ: UTC
      SEO_SPLIT_BASE_REF: HEAD
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact source archives and evidence helpers
        run: |
          mkdir -p formula-career-artifacts/helpers
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git rev-parse 'aa564f16019b9e821981d5c4e3e0262312c73b62^{tree}')" = e3e5332ddf95b79802c82487a03df3c0aca32e75
          git diff --name-status aa564f16019b9e821981d5c4e3e0262312c73b62 HEAD > formula-career-artifacts/changed-source.txt
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';import {execFileSync} from 'node:child_process';import fs from 'node:fs';
          const allowed=new Set(['src/lib/formulaCareer.ts','src/data/formulaCareer2025.ts','src/hooks/useFormulaCareer.ts','src/pages/FormulaCareer.tsx','src/data/gameContent/formulaCareer.ts','src/App.tsx','src/data/gameRegistry.ts','src/data/gameContent/index.ts','src/data/gameContent/loader.ts','src/data/seoMeta.ts','src/pages/WhatsNew.tsx','index.html','src/data/searchKeywords.json','src/data/seoMetaParts/seoMetaPart08.ts','scripts/simFormulaCareer.mjs','scripts/playFormulaCareer.mjs','.github/workflows/formula-career.yml','docs/ROUND1277-1279.md','docs/WORKBOARD.md','docs/PROJECT-STATE.md']);
          const changed=execFileSync('git',['diff','--name-only','-z','aa564f16019b9e821981d5c4e3e0262312c73b62','HEAD']).toString().split('\0').filter(Boolean);
          fs.writeFileSync('formula-career-artifacts/source-scope.json',JSON.stringify({base:'aa564f16019b9e821981d5c4e3e0262312c73b62',allowed:[...allowed],changed},null,2));for(const file of changed)assert(allowed.has(file),'undeclared source change: '+file);
          for(const file of ['package.json','package-lock.json','scripts/runAllSims.mjs','scripts/lib/offlineTransport.cjs'])assert.equal(execFileSync('git',['rev-parse','HEAD:'+file]).toString(),execFileSync('git',['rev-parse','aa564f16019b9e821981d5c4e3e0262312c73b62:'+file]).toString(),file+' baseline hold');
          JS
          git rev-parse HEAD > formula-career-artifacts/source-head.txt
          git rev-parse 'HEAD^{tree}' > formula-career-artifacts/source-tree.txt
          git -c core.autocrlf=false archive --format=zip --output=formula-career-artifacts/source.zip HEAD
          git ls-tree -r HEAD > formula-career-artifacts/source-inventory.txt
          git -c core.autocrlf=false archive --format=zip --output=formula-career-artifacts/base-source.zip aa564f16019b9e821981d5c4e3e0262312c73b62
          git ls-tree -r aa564f16019b9e821981d5c4e3e0262312c73b62 > formula-career-artifacts/base-source-inventory.txt
          sha256sum formula-career-artifacts/source.zip formula-career-artifacts/base-source.zip > formula-career-artifacts/source-archive-sha256.txt
          sha256sum package.json package-lock.json > formula-career-artifacts/packages-before.txt
          cat > formula-career-artifacts/helpers/dependencies.mjs <<'JS'
