name: CM recruitment shortlist early fixed gate
on:
  push:
    branches: [codex/cm-recruitment-shortlist-fixed-20261028]
    paths:
      - src/components/club-manager/RecruitmentBoard.tsx
      - src/components/club-manager/TransferScreen.tsx
      - src/hooks/useClubManager.ts
      - src/lib/clubManagerRecruitment.ts
      - src/pages/ClubManager.tsx
      - src/test/clubManagerRecruitment.test.ts
      - src/test/clubManagerRecruitmentBaseline.test.tsx
      - src/test/clubManagerRecruitmentBoard.test.tsx
      - src/test/clubManagerRecruitmentHook.test.tsx
      - qa/cm-recruitment-shortlist-v1/SOURCE-READY.json
      - scripts/qa/cmRecruitmentFocused.mjs
      - .github/workflows/cm-recruitment-shortlist-fixed.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cm-recruitment-focused-${{ github.sha }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: '1'
      SIM_NETWORK: offline
      CAREER_SEASON_LOCAL_ONLY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Exact selected source and whole tracked archive
        run: |
          set -euo pipefail
          export CM_RECRUITMENT_OUT="$PWD/cm-recruitment-focused-artifacts"
          mkdir -p "$CM_RECRUITMENT_OUT"
          echo "CM_RECRUITMENT_OUT=$CM_RECRUITMENT_OUT" >> "$GITHUB_ENV"
          test "$GITHUB_REF_NAME" = codex/cm-recruitment-shortlist-fixed-20261028
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 14ec28b1cbc82b1abcdf14244dec7acae25d1507
          git rev-parse HEAD HEAD^{tree} > "$CM_RECRUITMENT_OUT/head-tree.txt"
          git archive --format=tar HEAD > "$CM_RECRUITMENT_OUT/source.tar"
          git ls-tree -r HEAD > "$CM_RECRUITMENT_OUT/source-tree.txt"
          git ls-files -z | sort -z | xargs -0 sha256sum > "$CM_RECRUITMENT_OUT/tracked-before.sha256"
          printf '%s  %s\n' dd1de133bfc32ecd5e1f40c4421d28d050378c31e93b6c53d20f385a5ee7bec8 scripts/qa/cmRecruitmentFocused.mjs | sha256sum --check
          node scripts/qa/cmRecruitmentFocused.mjs source 2>&1 | tee "$CM_RECRUITMENT_OUT/source-pins.log"
          echo '127.0.0.1 flawuiqbvjobmkfkauhw.supabase.co' | sudo tee -a /etc/hosts
      - name: Exact lock dependencies
        run: |
          set -euo pipefail
          npm ci 2>&1 | tee "$CM_RECRUITMENT_OUT/npm-ci.log"
      - name: Real application types
        run: |
          set -euo pipefail
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee "$CM_RECRUITMENT_OUT/types.log"
      - name: All37 actual focused cases and strict diagnostic admission
        run: |
          set -euo pipefail
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/qa/cmRecruitmentFocused.mjs run 2>&1 | tee "$CM_RECRUITMENT_OUT/controller.log"
      - name: Every tracked source remains held
        if: always()
        run: |
          set -euo pipefail
          sha256sum --check "$CM_RECRUITMENT_OUT/tracked-before.sha256" > "$CM_RECRUITMENT_OUT/tracked-held.log"
          git status --porcelain --untracked-files=no > "$CM_RECRUITMENT_OUT/tracked-status.txt"
          test ! -s "$CM_RECRUITMENT_OUT/tracked-status.txt"
          git diff --exit-code HEAD
      - name: Retain original early gate including failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cm-recruitment-focused-${{ github.run_id }}-${{ github.run_attempt }}
          path: cm-recruitment-focused-artifacts/
          if-no-files-found: error
          retention-days: 14
