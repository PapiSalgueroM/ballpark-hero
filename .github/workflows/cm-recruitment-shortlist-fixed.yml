name: CM recruitment filled-list intended RED
on:
  push:
    branches: [codex/cm-recruitment-shortlist-tiles-red-20261028]
    paths:
      - src/test/clubManagerRecruitmentBoard.test.tsx
      - qa/cm-recruitment-shortlist-tiles-v1/TEST-FIRST-SOURCE-READY.json
      - scripts/qa/cmRecruitmentTilesBaseline.mjs
      - .github/workflows/cm-recruitment-shortlist-fixed.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cm-recruitment-tiles-red-${{ github.sha }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: '1'
      SIM_NETWORK: offline
      CAREER_SEASON_LOCAL_ONLY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Exact original product and one-test TDD override
        run: |
          set -euo pipefail
          export CM_RECRUITMENT_OUT="$PWD/cm-recruitment-tiles-red-artifacts"
          mkdir -p "$CM_RECRUITMENT_OUT"
          echo "CM_RECRUITMENT_OUT=$CM_RECRUITMENT_OUT" >> "$GITHUB_ENV"
          test "$GITHUB_REF_NAME" = codex/cm-recruitment-shortlist-tiles-red-20261028
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 8e884d528391f0f3375d39ebbef971d0358b96a1
          git rev-parse HEAD HEAD^{tree} > "$CM_RECRUITMENT_OUT/head-tree.txt"
          git archive --format=tar HEAD > "$CM_RECRUITMENT_OUT/source.tar"
          git ls-tree -r HEAD > "$CM_RECRUITMENT_OUT/source-tree.txt"
          git ls-files -z | sort -z | xargs -0 sha256sum > "$CM_RECRUITMENT_OUT/tracked-before.sha256"
          printf '%s  %s\n' 54fe6459823bf0926b6033da5adcb60ba535248fcf2c5995f96943c091e42c64 scripts/qa/cmRecruitmentTilesBaseline.mjs | sha256sum --check
          node scripts/qa/cmRecruitmentTilesBaseline.mjs source 2>&1 | tee "$CM_RECRUITMENT_OUT/source-pins.log"
          echo '127.0.0.1 flawuiqbvjobmkfkauhw.supabase.co' | sudo tee -a /etc/hosts
      - name: Exact lock dependencies
        run: |
          set -euo pipefail
          npm ci 2>&1 | tee "$CM_RECRUITMENT_OUT/npm-ci.log"
      - name: Real application types
        run: |
          set -euo pipefail
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee "$CM_RECRUITMENT_OUT/types.log"
      - name: Actual38 cases with one precise View assertion RED and37 old preservation passes
        run: |
          set -euo pipefail
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/qa/cmRecruitmentTilesBaseline.mjs run 2>&1 | tee "$CM_RECRUITMENT_OUT/controller.log"
      - name: Every tracked source body held
        if: always()
        run: |
          set -euo pipefail
          sha256sum --check "$CM_RECRUITMENT_OUT/tracked-before.sha256" > "$CM_RECRUITMENT_OUT/tracked-held.log"
          git status --porcelain --untracked-files=no > "$CM_RECRUITMENT_OUT/tracked-status.txt"
          test ! -s "$CM_RECRUITMENT_OUT/tracked-status.txt"
          git diff --exit-code HEAD
      - name: Retain original RED evidence including failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cm-recruitment-tiles-red-${{ github.run_id }}-${{ github.run_attempt }}
          path: cm-recruitment-tiles-red-artifacts/
          if-no-files-found: error
          retention-days: 14
