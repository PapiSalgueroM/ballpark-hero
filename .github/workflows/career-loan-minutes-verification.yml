name: Career loan minutes verification
on:
  push:
    branches: [codex/career-loan-minutes]
permissions:
  contents: read
concurrency:
  group: career-loan-minutes-${{ github.sha }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 360
