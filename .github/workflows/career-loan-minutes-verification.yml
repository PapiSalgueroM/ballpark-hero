          for(const file of ['package.json','package-lock.json','scripts/runAllSims.mjs','scripts/lib/offlineTransport.cjs',...['simLoanSpell','simClubVerdict','simContracts','simContractPreview','simSoccerCareerSaveRetry','simSoccerCareerSaveRecovery','simSeasonFamilySummary','simSeasonVerdict'].map(name=>'scripts/'+name+'.mjs')])assert.equal(execFileSync('git',['rev-parse','HEAD:'+file]).toString(),execFileSync('git',['rev-parse',base+':'+file]).toString(),file+' complete baseline hold');
          const relatedRepairs=[
           {"file":"scripts/playSoccerCareerFamily.mjs","from":"    await context.route(/supabase\\.co/, route => route.abort());","to":"    // Recorded-save fixture isolation keeps requests on the existing local host.\n    await context.route('**/*', route => new URL(route.request().url()).origin === new URL(BASE).origin ? route.continue() : route.abort());"},
