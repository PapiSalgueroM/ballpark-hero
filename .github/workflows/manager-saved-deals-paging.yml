name: Manager saved deals paging verification

on:
  push:
    branches: [codex/manager-saved-deals-pagination]
    paths:
      - src/components/club-manager/TransferScreen.tsx
      - src/test/managerSavedDealsPaging.test.tsx
      - src/test/managerOwnTransferLog.test.tsx
      - scripts/qa/*ManagerSavedDealsPaging*.mjs
      - .github/workflows/manager-saved-deals-paging.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    if: github.sha == '5eb5e035832d81a84c2dc02727fdd096de44952d'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CI: '1'
      SIM_NETWORK: offline
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Allocate retained evidence
        run: |
          echo "MSDL_OUT=$RUNNER_TEMP/manager-saved-deals-paging" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/manager-saved-deals-paging"
      - name: Bind original source and locked dependencies
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$MSDL_OUT/head.txt"
          git archive --format=zip HEAD > "$MSDL_OUT/source.zip"
          git status --porcelain --untracked-files=no > "$MSDL_OUT/source-before.txt"
          test ! -s "$MSDL_OUT/source-before.txt"
          git diff --exit-code 6465d9aeac1bc10f37d08fcb1a41b7521a886a1a HEAD -- src scripts public package.json package-lock.json bun.lock bun.lockb ':!src/test/managerSavedDealsPaging.test.tsx' ':!scripts/qa/proveManagerSavedDealsPaging.mjs'
          git ls-files -z | sort -z | xargs -0 sha256sum > "$MSDL_OUT/source-files.sha256"
          npm ci > "$MSDL_OUT/install.log" 2>&1
          cat "$MSDL_OUT/install.log"
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node --input-type=module <<'NODE'
          import fs from 'node:fs'; import assert from 'node:assert/strict';
          const lock = JSON.parse(fs.readFileSync('package-lock.json'));
          const installed = Object.entries(lock.packages).filter(([p]) => p.startsWith('node_modules/') && fs.existsSync(p + '/package.json')).map(([p, entry]) => {
            const version = JSON.parse(fs.readFileSync(p + '/package.json')).version;
            assert.equal(version, entry.version, p); return { path: p, version };
          });
          assert.equal(installed.length, 521);
          fs.writeFileSync(process.env.MSDL_OUT + '/installed-versions.json', JSON.stringify(installed, null, 2) + '\n');
          fs.writeFileSync(process.env.MSDL_OUT + '/node-versions.json', JSON.stringify(process.versions, null, 2) + '\n');
          console.log('All521 installed locked package manifests bound.');
          NODE
          find node_modules -type f -print0 | sort -z | xargs -0 sha256sum > "$MSDL_OUT/installed-files.sha256"
      - name: Actual application types and proof syntax
        run: |
          set -euo pipefail
          SIM_OFFLINE_RECEIPT="$MSDL_OUT/types.transport" NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee "$MSDL_OUT/types.log"
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node --check scripts/qa/proveManagerSavedDealsPaging.mjs
      - name: Six precise baseline cases and unchanged ten own-history cases
        run: |
          set -euo pipefail
          SIM_OFFLINE_RECEIPT="$MSDL_OUT/method.transport" NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/qa/proveManagerSavedDealsPaging.mjs 2>&1 | tee "$MSDL_OUT/baseline.log"
      - name: All source and installed bytes held
        if: always()
        run: |
          set -euo pipefail
          result=0
          sha256sum --check "$MSDL_OUT/source-files.sha256" > "$MSDL_OUT/source-holds.log" 2>&1 || result=1
          sha256sum --check "$MSDL_OUT/installed-files.sha256" > "$MSDL_OUT/installed-holds.log" 2>&1 || result=1
          for receipt in "$MSDL_OUT/"*.transport "$MSDL_OUT/baseline-proof/"*.transport; do test ! -s "$receipt" || result=1; done
          git status --porcelain --untracked-files=no > "$MSDL_OUT/source-after.txt"
          test ! -s "$MSDL_OUT/source-after.txt" || result=1
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manager-saved-deals-paging-baseline-${{ github.sha }}
          path: ${{ env.MSDL_OUT }}
          if-no-files-found: error
          retention-days: 14

  qualify:
    if: github.sha != '5eb5e035832d81a84c2dc02727fdd096de44952d'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CI: '1'
      SIM_NETWORK: offline
      ENGINES: chromium
      TZ: UTC
      PRERENDER_ONLY: /whats-new
      MSDL_BASELINE_RAW_SHA256: c0b46dd052f38f6692a1e766a91b1403eff35444547f350fe69cb047fa037759
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bind actual qualification source
        run: |
          set -euo pipefail
          echo "MSDL_OUT=$RUNNER_TEMP/manager-saved-deals-paging-fixed" >> "$GITHUB_ENV"
          echo "FREE_KICK_FONT_CACHE=$RUNNER_TEMP/manager-saved-deals-paging-fixed/font-cache" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/manager-saved-deals-paging-fixed"
          git rev-parse HEAD > "$RUNNER_TEMP/manager-saved-deals-paging-fixed/head.txt"
          git archive --format=zip HEAD > "$RUNNER_TEMP/manager-saved-deals-paging-fixed/source.zip"
          git merge-base --is-ancestor 5eb5e035832d81a84c2dc02727fdd096de44952d HEAD
          git diff --exit-code 6465d9aeac1bc10f37d08fcb1a41b7521a886a1a HEAD -- src scripts public package.json package-lock.json bun.lock index.html ':!src/components/club-manager/TransferScreen.tsx' ':!src/test/managerSavedDealsPaging.test.tsx' ':!scripts/qa/proveManagerSavedDealsPaging.mjs' ':!scripts/qa/proveManagerSavedDealsPagingFixed.mjs' ':!scripts/qa/playManagerSavedDealsPaging.mjs' ':!scripts/data/lastmod.json' ':!public/sitemap.xml' ':!public/whats-new/index.html'
          git status --porcelain --untracked-files=no > "$RUNNER_TEMP/manager-saved-deals-paging-fixed/source-before.txt"
          test ! -s "$RUNNER_TEMP/manager-saved-deals-paging-fixed/source-before.txt"
          git ls-files -z -- ':!scripts/data/lastmod.json' ':!public/sitemap.xml' ':!public/whats-new/index.html' | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/manager-saved-deals-paging-fixed/source-files.sha256"
      - name: Locked application and isolated browser tools
        run: |
          set -euo pipefail
          npm ci > "$MSDL_OUT/install.log" 2>&1
          node scripts/qa/soccerAgentReviewDependencies.mjs before > "$MSDL_OUT/dependencies-before.log" 2>&1
          browser_tools="$RUNNER_TEMP/saved-deals-browser"
          npm install --prefix "$browser_tools" --no-save --package-lock=false playwright@1.64.0 > "$MSDL_OUT/browser-install.log" 2>&1
          test ! -e node_modules/playwright; test ! -e node_modules/playwright-core
          ln -s "$browser_tools/node_modules/playwright" node_modules/playwright
          ln -s "$browser_tools/node_modules/playwright-core" node_modules/playwright-core
          node scripts/qa/soccerAgentReviewDependencies.mjs after > "$MSDL_OUT/dependencies-after.log" 2>&1
          cp soccer-agent-review-artifacts/dependencies-*.json "$MSDL_OUT/"
          node --input-type=module <<'NODE'
          import fs from 'node:fs'; import assert from 'node:assert/strict';
          const out=process.env.MSDL_OUT, before=JSON.parse(fs.readFileSync(out+'/dependencies-before.json')),after=JSON.parse(fs.readFileSync(out+'/dependencies-after.json'));
          assert.equal(before.packages.length,521); assert.equal(after.packages.length,521);
          assert.deepEqual(after.packages,before.packages); assert.equal(after.addedBrowserPackage,'1.64.0');
          fs.writeFileSync(out+'/node-versions.json',JSON.stringify(process.versions,null,2)+'\n');
          console.log('All521 locked application versions held across isolated Playwright1.64.0 installation.');
          NODE
          node "$browser_tools/node_modules/playwright/cli.js" install --with-deps chromium > "$MSDL_OUT/chromium-install.log" 2>&1
          python -m pip install fonttools pillow > "$MSDL_OUT/fonts-install.log" 2>&1
          python -m pip freeze > "$MSDL_OUT/python-packages.txt"
          node scripts/qa/freeKickLab1070.mjs --prefetch-fonts-only > "$MSDL_OUT/font-prefetch.log" 2>&1
          find node_modules -type f -print0 | sort -z | xargs -0 sha256sum > "$MSDL_OUT/installed-files.sha256"
          find "$browser_tools/node_modules" -type f -print0 | sort -z | xargs -0 sha256sum > "$MSDL_OUT/browser-tool-files.sha256"
      - name: Actual types and method syntax
        run: |
          set -euo pipefail
          SIM_OFFLINE_RECEIPT="$MSDL_OUT/types.transport" NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node_modules/.bin/tsc --noEmit -p tsconfig.app.json > "$MSDL_OUT/types.log" 2>&1
          node --check scripts/qa/proveManagerSavedDealsPagingFixed.mjs
          node --check scripts/qa/playManagerSavedDealsPaging.mjs
      - name: Fixed original and restored paging cases
        run: |
          set -euo pipefail
          SIM_OFFLINE_RECEIPT="$MSDL_OUT/method.transport" NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/qa/proveManagerSavedDealsPagingFixed.mjs 2>&1 | tee "$MSDL_OUT/proof.log"
      - name: Existing transfer history and deal moment cases
        run: |
          set -euo pipefail
          SIM_OFFLINE_RECEIPT="$MSDL_OUT/old.transport" NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node node_modules/vitest/vitest.mjs run src/test/managerOwnTransferLog.test.tsx src/test/clubManagerDealMoment.test.tsx --maxWorkers=1 --minWorkers=1 --reporter=verbose --reporter=json --outputFile.json="$MSDL_OUT/old-units.json" > "$MSDL_OUT/old-units.log" 2>&1
          node --input-type=module <<'NODE'
          import fs from 'node:fs'; import assert from 'node:assert/strict';
          const r=JSON.parse(fs.readFileSync(process.env.MSDL_OUT+'/old-units.json'));
          assert.equal(r.testResults.length,2); assert.equal(r.numTotalTests,15); assert.equal(r.numPassedTests,15); assert.equal(r.numFailedTests,0); assert.equal(r.numPendingTests,0); assert.equal(r.numTodoTests,0); assert.equal(r.success,true);
          const names=['src/test/managerOwnTransferLog.test.tsx','src/test/clubManagerDealMoment.test.tsx'];
          for(const name of names){const files=r.testResults.filter(f=>f.name.replaceAll('\\','/').endsWith('/'+name));assert.equal(files.length,1);assert(!files[0].message);assert(files[0].assertionResults.every(t=>t.status==='passed'&&t.failureMessages.length===0));}
          console.log('All15 unchanged history and deal moment cases passed.');
          NODE
      - name: Production build then every rebuilt-site reader
        run: |
          set -euo pipefail
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" npm run build:seo 2>&1 | tee "$MSDL_OUT/build.log"
          git diff -- public/sitemap.xml public/whats-new/index.html scripts/data/lastmod.json > "$MSDL_OUT/generated.diff"
          python - <<'PY'
          import os, subprocess, zipfile
          out=os.environ['MSDL_OUT']
          files=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          with zipfile.ZipFile(out+'/validated-source.zip','w',zipfile.ZIP_DEFLATED) as archive:
            for file in sorted(filter(None,files)): archive.write(file,file)
          with zipfile.ZipFile(out+'/dist.zip','w',zipfile.ZIP_DEFLATED) as archive:
            for root, dirs, files in os.walk('dist'):
              for name in sorted(files):
                file=os.path.join(root,name); archive.write(file,file)
          PY
          git ls-files -z | sort -z | xargs -0 sha256sum > "$MSDL_OUT/validated-source-files.sha256"
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > "$MSDL_OUT/dist-files.sha256"
          ONLY=simAdsense,simBrand,simHeadTags,simHiddenPages,simHubs,simIndexNow,simIndexing,simInternalLinks,simNoRivalNames,simPrerender,simPrerenderBoot,simRetiredRoutes,simSchema,simSitemap,simSnapshotAssets NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/runAllSims.mjs --browser 2>&1 | tee "$MSDL_OUT/readers.log"
          test "$(grep -c '^All 15 harnesses green\.$' "$MSDL_OUT/readers.log")" = 1
      - name: Served paging at four widths and unchanged route weights
        run: |
          set -euo pipefail
          node scripts/lib/hostLikeServer.mjs dist 4173 > "$MSDL_OUT/server.log" 2>&1 &
          task_server_pid=$!
          trap 'kill "$task_server_pid" 2>/dev/null || true' EXIT
          for attempt in 1 2 3 4 5; do if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi; sleep 1; done
          curl --fail --silent http://127.0.0.1:4173/ > /dev/null
          export BASE=http://127.0.0.1:4173 SWEEP_BASE=http://127.0.0.1:4173 SWEEP_OFFLINE=1
          SIM_OFFLINE_RECEIPT="$MSDL_OUT/browser.transport" NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/qa/playManagerSavedDealsPaging.mjs 2>&1 | tee "$MSDL_OUT/browser.log"
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/sweepWeight.mjs 2>&1 | tee "$MSDL_OUT/weights.log"
      - name: Complete source installed and built byte holds
        if: always()
        run: |
          set -euo pipefail
          result=0
          for kind in source installed browser-tool validated-source dist; do
            file="$MSDL_OUT/$kind-files.sha256"
            if test -f "$file"; then sha256sum --check "$file" > "$MSDL_OUT/$kind-holds.log" 2>&1 || result=1; fi
          done
          git diff --exit-code -- src scripts ':!scripts/data/lastmod.json' package.json package-lock.json bun.lock .github/workflows || result=1
          for receipt in "$MSDL_OUT/"*.transport "$MSDL_OUT/fixed-proof/"*.transport; do test ! -s "$receipt" || result=1; done
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manager-saved-deals-paging-fixed-${{ github.sha }}
          path: ${{ env.MSDL_OUT }}
          if-no-files-found: error
          retention-days: 14
