          function knownRefusal(url, method, noBody) {
            if (method !== 'GET' || !noBody) return null;
            if (url.origin === 'https://fonts.googleapis.com' && url.pathname === '/css2') return 'font';
            if (url.origin === 'https://fonts.gstatic.com' && url.pathname.startsWith('/s/')) return 'font';
            if (url.origin === 'https://flagcdn.com' &&
