          const records=raw.trimEnd().split('\n').map(line=>JSON.parse(line));
          const log=fs.readFileSync(out+'/weight.log','utf8');
          const caps=log.split('\n').map(line=>/^\s+(\/\S*)\s+\d+K gz over/.exec(line)?.[1]).filter(Boolean);
          assert.equal(caps.length,16);
          const fonts=new Set();
          let flags=0;
          for(const item of records){
            const url=new URL(item.url);
            assert(caps.includes(item.route));
            assert.deepEqual([item.method,item.disposition],['GET','aborted-before-network']);
            if(url.origin==='https://fonts.googleapis.com'){
              assert.deepEqual([item.resourceType,url.pathname,[...url.searchParams]],['stylesheet','/css2',[
                ['family','Space Grotesk:wght@400;500;600;700'],
                ['family','Inter:wght@400;500;600;700'],
                ['display','swap'],
              ]]);
              fonts.add(item.route);
            }else{
              assert.deepEqual([item.resourceType,url.origin,url.search],['image','https://flagcdn.com','']);
              assert.match(url.pathname,/^\/w(?:20|40|80|160|320)\/[a-z]{2}(?:-[a-z]{3})?\.png$/);
              flags++;
            }
          }
          assert.deepEqual([...fonts].sort(),[...caps].sort());
          assert(flags>0,'At least one exact Flagcdn image intercepted');
          console.log('PASS explicit offline weight asset blocks across all 16 budget routes');
          NODE
      - name: Admit the focused waiver and unchanged route budget outcomes
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const out=process.env.EVIDENCE,read=f=>fs.readFileSync(out+'/'+f,'utf8'),json=f=>JSON.parse(read(f));
          const unit=json('unit.json'),source=json('source-join.json'),weight=read('weight.log'),dist=json('dist-before.json');
          assert(dist.some(x=>/^dist\/assets\/MoneyApp-[A-Za-z0-9_-]+\.js$/.test(x.file)));
          assert.deepEqual([unit.numTotalTests,unit.numPassedTests,unit.numFailedTests,unit.success],[54,54,0,true]);
          assert.equal(unit.testResults.length,4);
          assert(unit.testResults.every(x=>x.status==='passed'&&x.assertionResults.every(y=>y.status==='passed')));
          assert(weight.includes('sweepWeight: green.'));
          const routes=weight.split('\n').filter(x=>/^\s+\/\S*\s+\d+K gz over/.test(x));
          assert.equal(routes.length,16);
          const nfl=routes.find(x=>x.includes('/nfl-my-career'));
          assert(nfl&&nfl.includes('budget 499K'));
          fs.writeFileSync(out+'/weight-recovery-result.json',JSON.stringify({status:'passed',source:{head:source.head,tree:source.tree,workflow:source.workflow},
            codeConfigRows:4682,distFiles:dist.length,unitPassed:54,routeCaps:16,nfl:nfl.trim(),originalCapUnchanged:true,scope:'Focused recovery build and caps only.'},null,2)+'\n');
          NODE
      - name: Verify unchanged physical source and locked offline run
        if: always()
        run: |
          set -euo pipefail
          git ls-files -s > "$EVIDENCE/source-after.txt"
          sha256sum package.json package-lock.json > "$EVIDENCE/locks-after.txt"
          cmp "$EVIDENCE/source-before.txt" "$EVIDENCE/source-after.txt"
          cmp "$EVIDENCE/locks-before.txt" "$EVIDENCE/locks-after.txt"
          git diff --exit-code HEAD -- .
          node "$EVIDENCE/physical.mjs" after
          test ! -s "$SIM_OFFLINE_RECEIPT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nba-my-career-waiver-weight-recovery-${{ github.run_id }}
          path: nba-my-career-waiver-weight-recovery
          retention-days: 30
          if-no-files-found: error
