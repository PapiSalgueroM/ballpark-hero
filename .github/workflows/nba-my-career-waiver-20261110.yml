6":"bfd62352e14e000463c5ed55c71c091bf44128903732364fe21e21f1fec27a34","blob":"faeda497c62ba6b13eb5a1843018e8b19341a566","priorBytes":87267,"priorSHA256":"2ba4dd6323043fcac73a8c9eabcdf77a09ba827d58b124b077024016519c1987","priorBlob":"c988aaa195da6ab00aa542a28b61c5abd9c107d8"},{"path":"src/components/us-career/USCareerActionConfirm.tsx","file":"us-career-action-confirm-waiver-proposal.tsx","bytes":4025,"sha256":"d90913d4cde42ce2eeaee00604727caf8e319405b9656a2d45ce80984b4e44c4","blob":"9953fffec70daaffd53468cc21a04c099b544919","priorBytes":3755,"priorSHA256":"b8913056e34907801eb03716460ddd2cd0bf0e42bac9b05a55f15aba0c0aabd1","priorBlob":"45b685b271f0f84c612ff68dac0d5f3c39546e80"},{"path":"src/components/us-career/FreeAgencyPanel.tsx","file":"free-agency-panel-waiver-proposal.tsx","bytes":16955,"sha256":"23a9fb770040c2a5f47b45d4d07463404c9cf05411979cd4450fb317691d8823","blob":"a4279900260d508fdec265d0c917ab5357c97a12","priorBytes":16586,"priorSHA256":"340b2eb105c58e103ce096d236d2b3d520e317a963118b94cbafa5b7ac152b79","priorBlob":"1d32d94e38245f2b919a7762f90076991b562a9f"},{"path":"src/components/us-career/UsCareerBoard.tsx","file":"us-career-board-waiver-v3-proposal.tsx","bytes":122212,"sha256":"74f13435b92ba2d4a5a042de1a5fb7f83d0dd398c0112efd056e3bf064218989","blob":"676e8499e28597b89ac0160503a2494aa12bb85c","priorBytes":116143,"priorSHA256":"ada70d72f44aee8685d8c7ec9580c5b85379a028af02e93b09a1d5fb86c1ad41","priorBlob":"09794d5779453495bb92cc02af079d01ce992773"}],"test":{"path":"src/test/nbaCareerWaiver.test.tsx","file":"nba-career-waiver-fixed-test-v3-draft.tsx","bytes":22535,"sha256":"a1fc8d3d7bd5a8949541d7a9d0faac7ae123bfe3a3a1187b8c4dc5562d14327c","blob":"3c711e7fe667d4ef2e9271443ed7ef651cce4266","priorBytes":3985,"priorSHA256":"307cc793fbe2eb8982ff40f22472ea49185a9fc2030d7eeb9e816889845802d2","priorBlob":"2dd64d7ddaa8185abe079f8440defe4caef09e4e","marker":"NBA_WAIVER_REQUEST_MISSING_ELIGIBLE"},"titles":["offers the waiver request on an eligible unhappy NBA season hub","keeps the request off the NBA hub at morale 55","keeps the request off an unhappy NFL hub","restores ordinary NBA free agency with its incumbent offer","cancels a waiver confirmation without a draw or save write and returns focus","keeps the unplayed historical year and record across release, reload and signing","stale hub Play and a stale open confirmation cannot overwrite a newer saved release","does not let a second tab sign a consumed waiver market","retries a refused release save with the exact prepared market and no redraw","cannot retry a refused release over a newer saved release from another tab","refuses a malformed waiver offer and rebuilds only outside offers on deliberate reopen","keeps the last outside offer available after negotiation and restores the spent push","protects a newer signed waiver career from a stale hub initially at morale 55","keeps the exact pending release through a transient read refusal on Retry save","rejects a well-shaped out-of-era waiver offer and recovers historical outside offers"],"heldTests":{"src/test/usCareerMarketBoard.test.tsx":{"blob":"c3ffdbe2f11b4676027a53b0045fed277edaaa23","tests":10},"src/test/usCareerMarketSecondTab.test.tsx":{"blob":"2b323d359d87de80811902f568259bbc6cc8c499","tests":12},"src/test/usCareerMarketUi.test.tsx":{"blob":"4953fa86968708435d8caf114a823f05f3360925","tests":17}}};
          const {base,original,product,test,heldTests}=inputs,out=process.env.EVIDENCE;
          const repo='PapiSalgueroM/ballpark-hero',workflow=original.path;
          const git=(...args)=>execFileSync('git',args,{encoding:'utf8',maxBuffer:16*1024*1024}).trimEnd();
          const sha=body=>createHash('sha256').update(body).digest('hex');
          const blob=body=>createHash('sha1').update(Buffer.from('blob '+body.length+'\0')).update(body).digest('hex');
          const head=git('rev-parse','HEAD'),tree=git('rev-parse','HEAD^{tree}');
          assert.equal(head,process.env.GITHUB_SHA);
          assert.equal(process.env.GITHUB_REPOSITORY,repo);
          assert.deepEqual(git('rev-list','--parents','-n','1',head).split(' '),[head,original.head]);
          assert.equal(git('rev-parse',original.head+'^{tree}'),original.tree);
          assert.equal(git('rev-parse',original.head+'^'),base.head);
          assert.equal(git('rev-parse',base.head+'^{tree}'),base.tree);
          assert.equal(git('rev-parse',original.head+':'+workflow),original.workflow);
          const rows=ref=>git('ls-tree','-r','-z',ref).split('\0').filter(Boolean);
          const path=row=>row.split('\t')[1];
          const owned=[...product.map(p=>p.path),workflow,test.path];
          const prev=rows(original.head),curr=rows(head);
          assert.deepEqual([prev.length,curr.length],[5805,5805]);
          assert.deepEqual(prev.filter(row=>!owned.includes(path(row))),curr.filter(row=>!owned.includes(path(row))));
          assert.equal(curr.filter(row=>/^(src|public|scripts)\//.test(path(row))).length,4670);
          assert.deepEqual(git('diff','--name-status','--no-renames',original.head,head).split('\n').sort(),owned.map(p=>'M\t'+p).sort());
          for(const pin of [...product,test]){
            const bytes=fs.readFileSync(pin.path);
            assert.deepEqual([bytes.length,sha(bytes),blob(bytes)],[pin.bytes,pin.sha256,pin.blob]);
            const held=execFileSync('git',['show',original.head+':'+pin.path],{maxBuffer:4*1024*1024});
            assert.deepEqual([held.length,sha(held),blob(held)],[pin.priorBytes,pin.priorSHA256,pin.priorBlob]);
          }
          for(const [file,pin] of Object.entries(heldTests))assert.equal(blob(fs.readFileSync(file)),pin.blob);
          const api=process.env.GITHUB_API_URL+'/repos/'+repo;
          const get=async suffix=>{
            const r=await fetch(api+suffix,{headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+process.env.GH_TOKEN,
              'X-GitHub-Api-Version':'2022-11-28'},redirect:'error'});
            assert.equal(r.status,200,suffix);
            return r.json();
          };
          const [run,jobs,artifacts]=await Promise.all([get('/actions/runs/'+original.run),get('/actions/runs/'+original.run+'/jobs?per_page=100'),get('/actions/runs/'+original.run+'/artifacts?per_page=100')]);
          assert.deepEqual([run.id,run.status,run.conclusion,run.head_sha,run.head_commit.tree_id,run.path,run.event,run.run_attempt],
            [original.run,'completed','success',original.head,original.tree,workflow,'push',1]);
          assert.deepEqual([jobs.jobs.length,artifacts.artifacts.length],[1,1]);
          const [job]=jobs.jobs,[archive]=artifacts.artifacts;
          assert.deepEqual([job.id,job.steps.length,archive.id,archive.expired,archive.size_in_bytes,archive.digest,archive.workflow_run.id,archive.workflow_run.head_sha],
            [original.job,11,original.artifact,false,original.zipBytes,'sha256:'+original.zipSHA256,original.run,original.head]);
          assert(job.steps.every(s=>s.status==='completed'&&s.conclusion==='success'));
          fs.copyFileSync(test.path,out+'/candidate-test.tsx');
          fs.copyFileSync(workflow,out+'/candidate-workflow.yml');
          fs.writeFileSync(out+'/source-join.json',JSON.stringify({status:'passed',head,tree,parent:original.head,parentTree:original.tree,workflow:git('rev-parse','HEAD:'+workflow),
            trackedRows:5805,heldRows:5805-owned.length,scopedRows:4670,inputs},null,2)+'\n');
          NODE
          original_id=$(node -p "require('./$EVIDENCE/source-join.json').inputs.original.artifact")
          original_len=$(node -p "require('./$EVIDENCE/source-join.json').inputs.original.zipBytes")
          original_sha=$(node -p "require('./$EVIDENCE/source-join.json').inputs.original.zipSHA256")
          original_zip="$RUNNER_TEMP/nba-waiver-original-exact.zip"
          gh api "repos/PapiSalgueroM/ballpark-hero/actions/artifacts/$original_id/zip" > "$original_zip"
          test "$(wc -c < "$original_zip")" -eq "$original_len"
          printf '%s  %s\n' "$original_sha" "$original_zip" | sha256sum -c -
          unzip -p "$original_zip" admission.json > "$EVIDENCE/prior-admission.json"
          unzip -p "$original_zip" vitest-result.json > "$EVIDENCE/prior-vitest-result.json"
      - name: Install locked dependencies, freeze physical source, and verify app types
        run: |
          set -euo pipefail
          npm ci 2>&1 | tee "$EVIDENCE/install.log"
          cat > "$EVIDENCE/physical.mjs" <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          const stage=process.argv[2],out=process.env.EVIDENCE;
          assert(['before','after'].includes(stage));
          const files=execFileSync('git',['ls-files','-z'],{encoding:'utf8'}).split('\0').filter(Boolean);
          const source=files.map(file=>{
            const body=fs.readFileSync(file);
            return [file,body.length,createHash('sha256').update(body).digest('hex')];
          });
          const lock=JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          const installed=Object.entries(lock.packages).filter(([file])=>file.startsWith('node_modules/')&&fs.existsSync(file+'/package.json')).map(([file,entry])=>{
            const version=JSON.parse(fs.readFileSync(file+'/package.json','utf8')).version;
            assert.equal(version,entry.version,file);
            return [file,version];
          });
          assert.deepEqual([source.length,installed.length,fs.statSync(process.env.SIM_OFFLINE_RECEIPT).size],[5805,521,0]);
          for(const [name,data] of [['tracked',source],['installed',installed]]){
            const body=JSON.stringify(data);
            if(stage==='after')assert.equal(body,fs.readFileSync(out+'/'+name+'-before.json','utf8'));
            fs.writeFileSync(out+'/'+name+'-'+stage+'.json',body);
          }
          NODE
          node "$EVIDENCE/physical.mjs" before
          node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee "$EVIDENCE/types.log"
      - name: Exercise fixed, physically restored original, and exact fixed restoration
        run: |
          set -euo pipefail
          cat > "$EVIDENCE/control-driver.mjs" <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          import {execFileSync, spawnSync} from 'node:child_process';
          const out=process.env.EVIDENCE;
          const read=file=>fs.readFileSync(out+'/'+file);
          const json=file=>JSON.parse(read(file));
          const sha=bytes=>createHash('sha256').update(bytes).digest('hex');
          const git=(...args)=>execFileSync('git',args,{maxBuffer:16*1024*1024});
          const source=json('source-join.json'),{original,product,test,heldTests,titles}=source.inputs;
          const prior=json('prior-admission.json'),priorVitest=json('prior-vitest-result.json');
          assert.deepEqual([sha(read('prior-admission.json')),sha(read('prior-vitest-result.json'))],[original.admissionSHA256,original.vitestSHA256]);
          assert.deepEqual([prior.status,prior.total,prior.failed,prior.passed,prior.expectedMarker],['passed',43,1,42,test.marker]);
          assert.deepEqual([priorVitest.numTotalTests,priorVitest.numFailedTests,priorVitest.numPassedTests],[43,1,42]);
          const files=[test.path,...Object.keys(heldTests)];
          const saved=new Map(product.map(pin=>[pin.path,fs.readFileSync(pin.path)]));
          const held=new Map(product.map(pin=>[pin.path,git('show',original.head+':'+pin.path)]));
          const changed=git('ls-files','-z').toString().split('\0').filter(Boolean);
          const frozen=new Map(json('tracked-before.json').map(([p,bytes,digest])=>[p,[bytes,digest]]));
          const own=new Map(product.map(pin=>[pin.path,pin]));
          function verifyPhysical(role){
            const red=role==='original';
            assert.equal(changed.length,5805);
            const pins=changed.map(path=>{
              const body=fs.readFileSync(path),current=[body.length,sha(body)],pin=own.get(path);
              assert.deepEqual(current,red&&pin?[pin.priorBytes,pin.priorSHA256]:frozen.get(path),role+' '+path);
              return [path,...current];
            });
            return {role,tracked:pins.length,held:pins.length-product.length,product:pins.filter(([path])=>own.has(path)),physicalSHA256:sha(JSON.stringify(pins))};
          }
          function run(role){
            const red=role==='original',root=out+'/'+role;
            fs.mkdirSync(root);
            const before=verifyPhysical(role);
            const result=spawnSync('timeout',['--signal=TERM','100s','node_modules/.bin/vitest','run',...files,'--testTimeout=60000',
              '--no-file-parallelism','--reporter=json','--outputFile='+root+'/vitest-result.json'],{
              env:{...process.env,NODE_OPTIONS:'--require='+process.cwd()+'/scripts/lib/offlineTransport.cjs'},encoding:'utf8',maxBuffer:12*1024*1024,
            });
            fs.writeFileSync(root+'/test.log',(result.stdout??'')+(result.stderr??''));
            fs.writeFileSync(root+'/test-exit.txt',String(result.status)+'\n');
            assert.equal(result.error,undefined);
            assert.equal(result.signal,null);
            assert.equal(result.status,red?1:0);
            assert.equal(fs.statSync(process.env.SIM_OFFLINE_RECEIPT).size,0);
            const log=read(role+'/test.log').toString();
            assert(log.includes('/'+root+'/vitest-result.json'));
            assert(!/UnhandledPromiseRejection|ERR_MODULE_NOT_FOUND|ERR_UNKNOWN_FILE_EXTENSION|SIM_OFFLINE_BLOCK|Unhandled Errors/i.test(log));
            const vitest=json(role+'/vitest-result.json');
            assert.deepEqual([vitest.numTotalTests,vitest.numFailedTests,vitest.numPassedTests,vitest.numPendingTests,vitest.numTodoTests,vitest.success],
              [54,red?12:0,red?42:54,0,0,!red]);
            assert.equal(vitest.testResults.length,4);
            const suite=path=>vitest.testResults.find(row=>row.name.endsWith('/'+path));
            const waiver=suite(test.path);
            assert.equal(waiver.status,red?'failed':'passed');
            assert.deepEqual(waiver.assertionResults.map(row=>[row.title,row.status]),titles.map((title,i)=>[title,red&&(i===0||i>=4)?'failed':'passed']));
            if(red){
              assert.deepEqual(waiver.assertionResults.slice(0,4).map(row=>[row.title,row.status]),prior.newCases);
              const [first,...more]=waiver.assertionResults.filter(row=>row.status==='failed');
              assert.equal(first.failureMessages.length,1);
              assert(first.failureMessages[0].includes('AssertionError: '+test.marker));
              assert(more.every(row=>row.failureMessages.length===1&&row.failureMessages[0].includes(
                'TestingLibraryElementError: Unable to find an accessible element with the role "button" and name "Request a waiver"')));
            }
            for(const [path,pin] of Object.entries(heldTests)){
              const result=suite(path);
              assert.equal(result?.status,'passed',path);
              assert.equal(result.assertionResults.length,pin.tests,path);
              assert(result.assertionResults.every(row=>row.status==='passed'),path);
            }
            const after=verifyPhysical(role);
            assert.deepEqual(after,before);
            fs.writeFileSync(root+'/physical.json',JSON.stringify(after,null,2)+'\n');
            const admitted={role,tests:54,failed:red?12:0,passed:red?42:54,exit:result.status,physical:after,
              outcomes:waiver.assertionResults.map(row=>[row.title,row.status])};
            process.stdout.write(JSON.stringify(admitted)+'\n');
            return admitted;
          }
          const fixed=run('fixed');
          let control;
          try {
            for(const [path,body] of held)fs.writeFileSync(path,body);
            control=run('original');
          } finally {
            for(const [path,body] of saved)fs.writeFileSync(path,body);
          }
          const restored=run('restored');
          assert.deepEqual(restored.outcomes,fixed.outcomes);
          assert.equal(restored.physical.physicalSHA256,fixed.physical.physicalSHA256);
          assert.notEqual(control.physical.physicalSHA256,fixed.physical.physicalSHA256);
          assert.equal(git('diff','--name-only','HEAD','--','.').length,0);
          fs.writeFileSync(out+'/admission.json',JSON.stringify({status:'passed',roles:[fixed,control,restored],
            exactlyRestored:true,originalCasesMatchAdmitted:true,ownedProductPaths:product.map(p=>p.path)},null,2)+'\n');
          NODE
          node "$EVIDENCE/control-driver.mjs" 2>&1 | tee "$EVIDENCE/control-driver.log"
      - name: Confirm complete source, index, lock, and offline receipts
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          git diff --exit-code HEAD -- .
          git ls-files -s > "$EVIDENCE/source-after.txt"
          cmp "$EVIDENCE/source-before.txt" "$EVIDENCE/source-after.txt"
          sha256sum package.json package-lock.json > "$EVIDENCE/locks-after.txt"
          cmp "$EVIDENCE/locks-before.txt" "$EVIDENCE/locks-after.txt"
          test ! -s "$SIM_OFFLINE_RECEIPT"
          node "$EVIDENCE/physical.mjs" after
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: nba-my-career-waiver-fixed-controls
          path: nba-my-career-waiver-fixed-controls/
          if-no-files-found: error
