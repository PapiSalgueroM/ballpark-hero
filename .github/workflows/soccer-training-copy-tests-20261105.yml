name: Soccer training copy checks
on:
  push:
    branches:
      - codex/soccer-training-copy-tests-20261105
permissions:
  contents: read
jobs:
  scoped:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        shell: bash
    env:
      SIM_NETWORK: offline
      SIM_OFFLINE_RECEIPT: training-copy-artifacts/offline.log
      ENGINES: chromium
      TZ: UTC
      SEO_SPLIT_BASE_REF: 1acb33005073be70ba5aae0285ece5537f390f9a
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Locked dependencies and source receipt
        run: |
          mkdir -p training-copy-artifacts
          git rev-parse HEAD > training-copy-artifacts/head.txt
          git rev-parse 'HEAD^{tree}' > training-copy-artifacts/tree.txt
          git ls-files -s > training-copy-artifacts/source-before.txt
          sha256sum package.json package-lock.json > training-copy-artifacts/locks-before.txt
          git fetch --no-tags --depth=1 origin 1acb33005073be70ba5aae0285ece5537f390f9a
          npm ci
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const lock=JSON.parse(fs.readFileSync('package-lock.json'));
          const rows=Object.keys(lock.packages).filter(p=>p.startsWith('node_modules/')&&fs.existsSync(p+'/package.json')).map(p=>[p,JSON.parse(fs.readFileSync(p+'/package.json')).version]);
          fs.writeFileSync('training-copy-artifacts/installed-before.json',JSON.stringify(rows));
          NODE
          npm install --prefix "$RUNNER_TEMP/sc11-browser" --no-save --package-lock=false playwright
          test ! -e node_modules/playwright
          ln -s "$RUNNER_TEMP/sc11-browser/node_modules/playwright" node_modules/playwright
          node "$RUNNER_TEMP/sc11-browser/node_modules/playwright/cli.js" install --with-deps chromium
          node --input-type=module <<'NODE'
          import fs from 'node:fs'; import assert from 'node:assert/strict';
          const before=JSON.parse(fs.readFileSync('training-copy-artifacts/installed-before.json'));
          const after=before.map(([p])=>[p,JSON.parse(fs.readFileSync(p+'/package.json')).version]);
          fs.writeFileSync('training-copy-artifacts/installed-after.json',JSON.stringify(after)); assert.deepEqual(after,before);
          console.log('Preserved all '+after.length+' locked installed versions.');
          NODE
          python -m pip install fonttools pillow
      - name: Proper app types
        run: node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee training-copy-artifacts/types.log
      - name: Original fixed real paragraph omission and restored units
        run: |
          NODE_OPTIONS="--max-old-space-size=6144 --require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/qa/trainingCopyCheck.mjs units 2>&1 | tee training-copy-artifacts/units.log
      - name: Normal production build
        if: ${{ !cancelled() }}
        id: build
        run: |
          NODE_OPTIONS="--max-old-space-size=6144" npm run build 2>&1 | tee training-copy-artifacts/build.log
          tar -czf training-copy-artifacts/dist.tgz dist
          sha256sum training-copy-artifacts/dist.tgz > training-copy-artifacts/dist.sha256
      - name: All built output readers
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          export ONLY="simAdsense,simBrand,simHeadTags,simHiddenPages,simHubs,simIndexNow,simIndexing,simInternalLinks,simNoRivalNames,simPrerender,simPrerenderBoot,simRetiredRoutes,simSchema,simSitemap,simSnapshotAssets,simSiteSearch,simGuideHeadings,simSeoMetaSplit,simHomeCopy,simHarnessAnchors"
          node scripts/runAllSims.mjs --browser 2>&1 | tee training-copy-artifacts/readers.log
      - name: Existing route download limits
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          node scripts/lib/hostLikeServer.mjs dist 4173 > training-copy-artifacts/weight-host.log 2>&1 &
          sc_host_pid=$!
          trap 'kill "$sc_host_pid" 2>/dev/null || true' EXIT
          sleep 2
          SWEEP_OFFLINE=1 BASE=http://127.0.0.1:4173 node scripts/sweepWeight.mjs 2>&1 | tee training-copy-artifacts/weight.log
      - name: Fixed original W7 oracle and restored actual browser
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/qa/trainingCopyCheck.mjs browser 2>&1 | tee training-copy-artifacts/browser.log
      - name: Source and lock holds
        if: always()
        run: |
          git ls-files -s > training-copy-artifacts/source-after.txt
          cmp training-copy-artifacts/source-before.txt training-copy-artifacts/source-after.txt
          git diff --exit-code HEAD -- src scripts package.json package-lock.json
          sha256sum package.json package-lock.json > training-copy-artifacts/locks-after.txt
          cmp training-copy-artifacts/locks-before.txt training-copy-artifacts/locks-after.txt
          if test -f training-copy-artifacts/offline.log; then test ! -s training-copy-artifacts/offline.log; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soccer-training-copy-fixed-${{ github.run_id }}
          path: training-copy-artifacts
          retention-days: 7
          if-no-files-found: error
