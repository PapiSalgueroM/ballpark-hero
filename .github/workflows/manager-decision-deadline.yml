name: Club Manager saved reply deadline

on:
  push:
    branches: [codex/manager-decision-deadline]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    defaults:
      run:
        shell: bash
    env:
      CI: '1'
      SIM_NETWORK: offline
      ENGINES: chromium
      CM_LOCAL_ONLY: '1'
      MANAGER_DEADLINE_PHASE: fixed
      MANAGER_DEADLINE_OUT: ${{ github.workspace }}/manager-deadline-artifacts
      MANAGER_DECISION_DEPTH_OUT: ${{ github.workspace }}/manager-deadline-artifacts/prior-decisions
      FREE_KICK_FONT_CACHE: ${{ github.workspace }}/manager-deadline-artifacts/font-cache
      PRERENDER_ONLY: /club-manager
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Block production database transport
        run: echo '127.0.0.1 flawuiqbvjobmkfkauhw.supabase.co' | sudo tee -a /etc/hosts
      - name: Bind held app and locked source
        run: |
          mkdir -p "$MANAGER_DEADLINE_OUT" "$MANAGER_DECISION_DEPTH_OUT"
          git rev-parse HEAD > "$MANAGER_DEADLINE_OUT/source-head.txt"
          git status --porcelain --untracked-files=no > "$MANAGER_DEADLINE_OUT/source-before.txt"
          test ! -s "$MANAGER_DEADLINE_OUT/source-before.txt"
          if test "$MANAGER_DEADLINE_PHASE" = baseline; then
            git diff --exit-code 1ed26406 -- src ':!src/test/clubManagerDecisionDeadline.test.ts' scripts ':!scripts/simClubManagerDecisionDeadline.mjs' ':!scripts/playClubManagerDecisionDeadline.mjs' .github/workflows ':!.github/workflows/manager-decision-deadline.yml' index.html package.json package-lock.json bun.lock
          else
            git diff --exit-code 1ed26406 -- src ':!src/lib/clubManagerDecisions.ts' ':!src/test/clubManagerDecisionDeadline.test.ts' scripts ':!scripts/simClubManagerDecisionDeadline.mjs' ':!scripts/playClubManagerDecisionDeadline.mjs' .github/workflows ':!.github/workflows/manager-decision-deadline.yml' index.html package.json package-lock.json bun.lock
          fi
          sha256sum package.json package-lock.json bun.lock > "$MANAGER_DEADLINE_OUT/package-hashes.txt"
          git ls-files -z src scripts .github/workflows index.html | xargs -0 sha256sum > "$MANAGER_DEADLINE_OUT/source-wide.txt"
          npm ci
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const lock = JSON.parse(fs.readFileSync('package-lock.json'));
          const installed = Object.entries(lock.packages).filter(([path]) => path.startsWith('node_modules/') && fs.existsSync(path + '/package.json')).map(([path, entry]) => {
            const filename = path + '/package.json', bytes = fs.readFileSync(filename);
            const version = JSON.parse(bytes).version; assert.equal(version, entry.version, path);
            return { path, version };
          });
          assert.equal(installed.length, 521);
          fs.writeFileSync(process.env.MANAGER_DEADLINE_OUT + '/installed.json', JSON.stringify(installed, null, 2) + '\n');
          console.log('Bound all521 installed locked versions.');
          NODE
          sha256sum --check "$MANAGER_DEADLINE_OUT/package-hashes.txt"
      - name: Actual application type gate
        run: node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee "$MANAGER_DEADLINE_OUT/types.log"
      - name: Actual kickoff deadline and copied old-behavior control
        run: |
          if test "$MANAGER_DEADLINE_PHASE" = baseline; then
            CM_DEADLINE_EXPECT_RED=1 NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/simClubManagerDecisionDeadline.mjs 2>&1 | tee "$MANAGER_DEADLINE_OUT/baseline.log"
          else
            NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/simClubManagerDecisionDeadline.mjs 2>&1 | tee "$MANAGER_DEADLINE_OUT/fixed.log"
            CM_DEADLINE_CONTROL=late NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/simClubManagerDecisionDeadline.mjs 2>&1 | tee "$MANAGER_DEADLINE_OUT/control-late.log"
          fi
      - name: Preserve all seven recorded-context depth outcomes
        run: NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node_modules/.bin/vitest run src/test/clubManagerDecisionDepth.test.ts --maxWorkers=1 --reporter=verbose --reporter=json --outputFile.json="$MANAGER_DEADLINE_OUT/prior-unit.json" 2>&1 | tee "$MANAGER_DEADLINE_OUT/prior-unit.log"
      - name: Preserve actual decision coverage and effective omission controls
        run: |
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/simClubManagerDecisions.mjs 2>&1 | tee "$MANAGER_DEADLINE_OUT/prior-decisions.log"
          for control in depthcohort presscohort; do
            set +e
            CM_DECISIONS_CONTROL="$control" NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/simClubManagerDecisions.mjs 2>&1 | tee "$MANAGER_DEADLINE_OUT/prior-control-$control.log"
            result=${PIPESTATUS[0]}
            set -e
            CONTROL_EXIT="$result" CONTROL_KIND="$control" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const kind = process.env.CONTROL_KIND;
          const output = fs.readFileSync(process.env.MANAGER_DEADLINE_OUT + '/prior-control-' + kind + '.log', 'utf8');
          assert.equal(Number(process.env.CONTROL_EXIT), 1);
          assert(!/Unhandled (?:Errors?|Rejection)|Uncaught Exception|Failed to load|Failed to resolve import|Cannot find module|Module not found|ERR_MODULE_NOT_FOUND|SyntaxError|ReferenceError|TypeError/i.test(output));
          const cohort = kind === 'depthcohort' ? 'academyStepUp' : 'pressPressure';
          assert.deepEqual(output.split('\n').filter(line => line.startsWith('FAIL ')), [
            'FAIL [4] only 33 of 36 card answers were walked; missing ' + [0, 1, 2].map(index => cohort + '#' + index).join(', '),
          ]);
          assert(output.includes('simClubManagerDecisions (control ' + kind + '): 1 findings'));
          assert(new RegExp('Effective ' + kind + ' source control: [a-f0-9]{64}; one unique actual binding changed; before=[a-f0-9]{64}\\.').test(output));
          console.log('Effective held ' + kind + ': exactly three cohort answers lost, one finding, no setup credit.');
          NODE
          done
      - name: Normal helper discovery without packet output
        if: env.MANAGER_DEADLINE_PHASE == 'fixed'
        run: NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" env -u MANAGER_DEADLINE_OUT ONLY=simClubManagerDecisionDeadline node scripts/runAllSims.mjs 2>&1 | tee "$MANAGER_DEADLINE_OUT/fleet-discovery.log"
      - name: Complete unit suite
        id: full_unit_suite
        if: env.MANAGER_DEADLINE_PHASE == 'fixed'
        continue-on-error: true
        env:
          CM_DEADLINE_ENGINE: ${{ github.workspace }}/manager-deadline-artifacts/fixed/engine.mjs
          CM_DEADLINE_WHISTLE_ENGINE: ${{ github.workspace }}/manager-deadline-artifacts/fixed/engine-whistle.mjs
          CM_DEADLINE_NEUTRAL_ENGINE: ${{ github.workspace }}/manager-deadline-artifacts/fixed/engine-neutral.mjs
          CM_DEADLINE_DECISIONS: ${{ github.workspace }}/manager-deadline-artifacts/fixed/decisions.mjs
        run: NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node_modules/.bin/vitest run --maxWorkers=2 --reporter=verbose --reporter=json --outputFile.json="$MANAGER_DEADLINE_OUT/full-unit.json" 2>&1 | tee "$MANAGER_DEADLINE_OUT/full-unit.log"
      - name: Browser and build tools
        if: env.MANAGER_DEADLINE_PHASE == 'fixed'
        run: |
          npm install --prefix "$RUNNER_TEMP/manager-deadline-browser" --no-save --package-lock=false playwright
          ln -s "$RUNNER_TEMP/manager-deadline-browser/node_modules/playwright" node_modules/playwright
          ln -s "$RUNNER_TEMP/manager-deadline-browser/node_modules/playwright-core" node_modules/playwright-core
          node "$RUNNER_TEMP/manager-deadline-browser/node_modules/playwright/cli.js" install --with-deps chromium
          python -m pip install fonttools pillow
          node scripts/qa/freeKickLab1070.mjs --prefetch-fonts-only 2>&1 | tee "$MANAGER_DEADLINE_OUT/fonts.log"
          sha256sum --check "$MANAGER_DEADLINE_OUT/package-hashes.txt"
      - name: Complete application build and manager snapshot
        if: env.MANAGER_DEADLINE_PHASE == 'fixed'
        run: |
          npm run build:seo 2>&1 | tee "$MANAGER_DEADLINE_OUT/build.log"
          cp scripts/data/lastmod.json "$MANAGER_DEADLINE_OUT/build-lastmod.json"
          git diff -- scripts/data/lastmod.json > "$MANAGER_DEADLINE_OUT/build-lastmod.diff"
      - name: Actual live and pre-match inbox replies on phone and desktop
        if: env.MANAGER_DEADLINE_PHASE == 'fixed'
        run: NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/playClubManagerDecisionDeadline.mjs 2>&1 | tee "$MANAGER_DEADLINE_OUT/browser.log"
      - name: Every applicable rebuilt-site reader
        if: env.MANAGER_DEADLINE_PHASE == 'fixed'
        run: ONLY=simClubManagerMeters,simNoInventedQuotes,simAdsense,simBrand,simHeadTags,simHiddenPages,simHubs,simIndexNow,simIndexing,simInternalLinks,simNoRivalNames,simPrerender,simPrerenderBoot,simRetiredRoutes,simSchema,simSitemap,simSnapshotAssets NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/runAllSims.mjs --browser 2>&1 | tee "$MANAGER_DEADLINE_OUT/related.log"
      - name: Existing page download ceilings
        if: env.MANAGER_DEADLINE_PHASE == 'fixed'
        run: |
          node scripts/lib/hostLikeServer.mjs dist 4173 > "$MANAGER_DEADLINE_OUT/weight-server.log" 2>&1 &
          weight_server_pid=$!
          trap 'kill "$weight_server_pid" 2>/dev/null || true' EXIT
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          BASE=http://127.0.0.1:4173 SWEEP_OFFLINE=1 NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/sweepWeight.mjs 2>&1 | tee "$MANAGER_DEADLINE_OUT/weight.log"
      - name: Require the complete unit outcome
        if: always() && env.MANAGER_DEADLINE_PHASE == 'fixed'
        run: test '${{ steps.full_unit_suite.outcome }}' = success
      - name: Final held source and dependencies
        if: always()
        run: |
          sha256sum --check "$MANAGER_DEADLINE_OUT/package-hashes.txt"
          grep -v '  scripts/data/lastmod.json$' "$MANAGER_DEADLINE_OUT/source-wide.txt" > "$MANAGER_DEADLINE_OUT/source-wide-build-safe.txt"
          sha256sum --check "$MANAGER_DEADLINE_OUT/source-wide-build-safe.txt" > "$MANAGER_DEADLINE_OUT/source-hold.log"
          git diff --exit-code -- src scripts ':!scripts/data/lastmod.json' .github/workflows index.html package.json package-lock.json bun.lock
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const rows = JSON.parse(fs.readFileSync(process.env.MANAGER_DEADLINE_OUT + '/installed.json'));
          assert.equal(rows.length, 521);
          for (const row of rows) assert.equal(JSON.parse(fs.readFileSync(row.path + '/package.json')).version, row.version, row.path);
          console.log('Held all521 installed locked versions.');
          NODE
      - name: Retain complete evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manager-deadline-${{ github.run_id }}
          path: manager-deadline-artifacts/
          retention-days: 14
          if-no-files-found: error
