          assert.equal(held.status,'SOURCE_INDEX_LOCKS_INPUT_AND_DIST_HELD');
          assert.equal(report.schema,'SC_LATER_NATIVE_BROWSER_V1');assert.equal(report.status,'passed');
          for(const key of['sourceHeld','distHeld','fixturesHeld'])assert.equal(report[key],true);
          assert.deepEqual(report.product,manifest.product);
          assert.deepEqual(report.authority,{manifestSHA256:sha(read('input/native-manifest.json')),admissions:manifest.admissions,distDigest:manifest.distDigest});
          for(const name of['syntax-helper','syntax-ready','types','browser','final-source-holds'])assert.equal(read('logs/'+name+'.exit').toString(),'0\n',name);
          const receiptNames=['browser.log','server.log','syntax-helper.log','syntax-ready.log','types.log'];
          assert.deepEqual(fs.readdirSync(path.join(out,'transport')).sort(),receiptNames.slice().sort());
          for(const name of receiptNames)assert.equal(read('transport/'+name).length,0,name);
          const flows=['create-2010','create-2015','fixture-2010','fixture-2015'];
          assert.deepEqual(report.contexts.map(row=>[row.flow,row.width,row.height]),flows.map(flow=>[flow,390,844]));
          const photoLabels={'create-2010':['created-2010'],'create-2015':['created-2015'],'fixture-2010':['entry-mbappe','entry-haaland','entry-bellingham','reloaded-2020'],'fixture-2015':['entry-haaland','entry-bellingham','reloaded-2020']};
          const dist=new Map(manifest.distBefore.map(row=>[row.file,row])),cells=[];
          function actualControl(row,file,marker){
           assert.equal(row.file,file);const control=json('browser/'+file);
           assert.equal(control.changed,true);assert.equal(control.wholeInverse,true);assert.deepEqual(control.before,control.restored);assert.notDeepEqual(control.fault,control.before);
           assert.deepEqual(control.owned,row.owned);assert.equal(control.owned.name,'AssertionError');assert.match(control.owned.message,marker);
          }
          for(const c of report.contexts){
           const year=Number(c.flow.slice(-4)),fixture=c.flow.startsWith('fixture-');assert.equal(c.startYear,year);assert.equal(c.status,'passed');
           assert.equal(c.documentRequests.length,fixture?2:1);assert.equal(c.documentBodies.length,c.documentRequests.length);
           assert.deepEqual(c.photos.map(row=>row.label),photoLabels[c.flow]);
           assert.equal(c.finalNativeCensus.closed,true);assert.equal(c.finalNativeCensus.nonReadonly,0);assert.equal(c.finalNativeCensus.rawNativeNonGETHEAD,c.finalNativeCensus.linkedReadPreflights.length);
           assert.equal(c.methodControls.length,2);for(const row of c.methodControls){assert.equal(row.changed,true);assert.equal(row.wholeInverseExact,true);assert.equal(row.actualHeld,true);}
           const preflights=c.finalNativeCensus.linkedReadPreflights.length;
           assert.equal(c.preflightControls.status,preflights?'ACTUAL_LINKED_READ_PREFLIGHT_CONTROLS_PASSED':'NO_ACTUAL_READ_PREFLIGHT_NO_CONTROL_CREDIT');
           assert.equal(c.preflightControls.controls.length,preflights?4:0);
           for(const row of c.preflightControls.controls){assert.equal(row.changed,true);assert.equal(row.wholeInverseExact,true);assert.equal(row.actualHeld,true);}
           for(const key of['documentControl','assetControls']){assert.equal(c[key].changed,true);assert.equal(c[key].wholeInverseExact,true);assert.equal(c[key].actualHeld,true);}
           for(const key of['unexpectedConsole','unexpectedPageErrors','unexpectedExternalAborts','localHttpErrors','assetErrors'])assert.equal(c[key].length,0,key);
           const frames=new Map();
           for(const row of c.frames){const stored=read('browser/'+row.file),decoded=gunzipSync(stored),frame=JSON.parse(decoded);
            assert.equal(stored.length,row.bytes);assert.equal(sha(stored),row.sha256);assert.equal(decoded.length,row.decodedBytes);assert.equal(sha(decoded),row.decodedSHA256);
            assert.equal(row.sequence,frames.size);assert.equal(frame.sequence,row.sequence);assert.equal(frame.label,row.label);assert.equal(frame.phase,row.phase);assert.equal(frame.writeRequests,0);frames.set(row.sequence,frame);
           }
           assert(frames.size>0&&c.assetBodies.length>0);
           for(const row of [...c.assetBodies,...c.documentBodies]){
            const body=read('browser/'+row.file),owner=dist.get(row.path);assert(owner);assert.equal(row.bytes,owner.bytes);assert.equal(row.sha256,owner.sha256);assert.equal(body.length,row.bytes);assert.equal(sha(body),row.sha256);
           }
           for(const shot of c.photos){assert(frames.has(shot.baselineFrame)&&frames.has(shot.afterFrame));assert.equal(shot.geometry!==null,shot.label!=='reloaded-2020');}
           if(!fixture){
            assert.equal(c.creation.status,'passed');const created=frames.get(c.creation.created.frame),state=created.value.careerState;
            assert.equal(state.phase,'youth');assert.equal(state.seasons[0].year,year);assert.deepEqual(state.historicalArrivals,{version:3,startYear:year,players:[]});
            assert.equal(sha(Buffer.from(created.value.careerRaw)),c.creation.created.rawSHA256);
            actualControl(c.creation.registryControl,'input/'+c.id+'-registry-control.json',/^SC_LATER_NATIVE_REGISTRY/);
           }else{
            const pin=manifest.fixtures.find(row=>row.startYear===year),view=c.fixtureReadout;
            const body=read('browser/input/later-ui-'+year+'.json');assert.equal(body.length,pin.bytes);assert.equal(sha(body),pin.sha256);assert(body.equals(fs.readFileSync(pin.file)));
            const raw=JSON.parse(body).value.repeated.loadedBytes;assert.equal(sha(Buffer.from(raw)),pin.rawSHA256);
            assert.equal(view.status,'passed');assert.deepEqual(view.fixture,pin);assert.deepEqual(view.preload,{kind:'playwright-context-storage-state',rawSHA256:pin.rawSHA256,rawBytes:pin.rawBytes,initialFence:'5',noNavigationScript:true});
            assert.deepEqual(view.documentLoads.map(row=>row.fence),['6','7']);
            for(const row of view.documentLoads){const frame=frames.get(row.frame);assert.equal(frame.value.careerRaw,raw);assert.equal(frame.value.local.soccerCareerSave,raw);assert.equal(frame.value.local['dukb-fence:soccerCareerSave'],row.fence);}
            assert.equal(c.readOnlyActions.length,7);assert.equal(c.traces.length,7);assert.equal(c.traceControl.wholeInverseExact,true);
            for(const row of c.readOnlyActions)for(const key of['before','immediate','raf1','raf2','after'])assert.equal(frames.get(row[key]).value.careerRaw,raw);
            assert.equal(view.cards.length,3);for(const card of view.cards){assert.equal(frames.get(card.frame).value.careerRaw,raw);assert.deepEqual(card.rows,view.cards[0].rows);assert.deepEqual(card.cells,view.cards[0].cells);}
            const ids=view.cards[0].cells.map(row=>row.id);assert.deepEqual(ids,year===2010?['soccer:mbappe','soccer:haaland','soccer:bellingham']:['soccer:haaland','soccer:bellingham']);
            for(const cell of view.cards[0].cells)cells.push({startYear:year,...cell});
            actualControl(view.cardControl,'input/'+c.id+'-card-control.json',/^SC_LATER_NATIVE_ARRIVAL_CARD_ASSOCIATION/);
           }
          }
          assert.equal(cells.length,5);assert.equal(new Set(cells.map(row=>row.id)).size,3);
          assert.deepEqual(report.screenshots,report.contexts.flatMap(c=>c.photos.map(row=>row.file)));assert.equal(report.screenshots.length,9);assert.equal(new Set(report.screenshots).size,9);
          const images=report.screenshots.map(file=>{assert(/^[a-z0-9-]+\.png$/.test(file));const body=read('browser/'+file);assert(body.length>8&&body.subarray(0,8).equals(Buffer.from([137,80,78,71,13,10,26,10])));return{file,bytes:body.length,sha256:sha(body)};});
          fs.writeFileSync(path.join(out,'screenshots.json'),JSON.stringify(images,null,2)+'\n',{flag:'wx'});
          fs.writeFileSync(path.join(out,'native-admission.json'),JSON.stringify({status:'FOUR_SC_CONTEXTS_AND_NINE_ORDINARY_PHOTOS_RETAINED',product:manifest.product,authority:report.authority,sourceHeld:true,distHeld:true,fixturesHeld:true,allContextsPassed:true,genuineUIStarts:[2010,2015],admittedFixtureReadouts:[2010,2015],fixtureEndYear:2020,fixtureReloads:2,cells,ordinaryPhotos:9,visualReview:'PENDING_INDEPENDENT_VIEW_OF_ALL_ACTUAL_IMAGES',sharedSix:'Referenced byte-held qualification records',browserAnnualProgression:false,AppBuilds:0,modelOrFixtureGeneration:false,providerWrites:0,public:false},null,2)+'\n',{flag:'wx'});
          ADMIT
          printf '0\n' > "$QA_OUT/logs/native-admission.exit" || exit 1
      - name: Retain bounded complete native proof or fatal diagnostic
        id: evidence
        if: always()
        shell: bash
        run: |
          set +e
          set -uo pipefail
          archive="$RUNNER_TEMP/sc-later-starts-native.tar.xz"
          tar -I 'xz -9' -cf "$archive" -C "$QA_OUT" . > "$RUNNER_TEMP/sc-later-starts-native-pack.log" 2>&1
          pack_exit=$?
          printf '%s\n' "$pack_exit" > "$QA_OUT/pack-native.exit" || exit 1
          if [[ "$pack_exit" == 0 && -f "$archive" && "$(stat -c %s "$archive")" -le 50000000 ]]; then
            sha256sum "$archive" > "$archive.sha256" || exit 1
            printf 'archive=%s\n' "$archive" >> "$GITHUB_OUTPUT" || exit 1
            exit 0
          fi
          printf '%s\n' 'DIAGNOSTIC_ONLY_NO_COMPLETE_NATIVE_OR_IMAGE_PROOF: full pack failed or exceeded50000000bytes' > "$QA_OUT/DIAGNOSTIC-ONLY.txt" || exit 1
          cp "$RUNNER_TEMP/sc-later-starts-native-pack.log" "$QA_OUT/pack.log" || exit 1
          node --input-type=module <<'DIAGNOSTIC'
          import fs from 'node:fs';import path from 'node:path';import crypto from 'node:crypto';
          const root=process.env.QA_OUT,sha=b=>crypto.createHash('sha256').update(b).digest('hex'),rows=[];
          function walk(rel=''){for(const entry of fs.readdirSync(path.join(root,rel),{withFileTypes:true})){const file=path.posix.join(rel,entry.name);if(entry.isDirectory())walk(file);else if(entry.isFile()){const bytes=fs.readFileSync(path.join(root,file));rows.push({file,bytes:bytes.length,sha256:sha(bytes)});}}}walk();
          fs.writeFileSync(root+'/fatal-full-output-inventory.json',JSON.stringify({status:'DIAGNOSTIC_ONLY',completeNativeProof:false,fullArchive:fs.existsSync(path.join(process.env.RUNNER_TEMP,'sc-later-starts-native.tar.xz'))?{bytes:fs.statSync(path.join(process.env.RUNNER_TEMP,'sc-later-starts-native.tar.xz')).size,sha256:sha(fs.readFileSync(path.join(process.env.RUNNER_TEMP,'sc-later-starts-native.tar.xz')))}:null,fullOutput:rows.sort((a,b)=>a.file<b.file?-1:a.file>b.file?1:0),omittedFromDiagnostic:['browser/frames','browser/bodies','ordinary and failure PNG files'],note:'Successful evidence is never truncated. This diagnostic has no runtime or image qualification.'},null,2)+'\n');
          DIAGNOSTIC
          test "$?" = 0 || exit 1
          diagnostic="$RUNNER_TEMP/sc-later-starts-native-diagnostic.tar.gz"
          diagnostic_dir="$RUNNER_TEMP/sc-later-starts-native-diagnostic"
          mkdir -p "$diagnostic_dir/logs" "$diagnostic_dir/transport" "$diagnostic_dir/input" "$diagnostic_dir/browser" || exit 1
          find "$QA_OUT" -maxdepth 1 -type f -exec cp '{}' "$diagnostic_dir/" \; || exit 1
          cp -R "$QA_OUT/logs/." "$diagnostic_dir/logs/" || exit 1
          cp -R "$QA_OUT/transport/." "$diagnostic_dir/transport/" || exit 1
          cp -R "$QA_OUT/input/." "$diagnostic_dir/input/" || exit 1
          if test -d "$QA_OUT/browser"; then find "$QA_OUT/browser" -maxdepth 1 -type f -name '*.json' -exec cp '{}' "$diagnostic_dir/browser/" \; || exit 1; fi
          tar -czf "$diagnostic" -C "$diagnostic_dir" . || exit 1
          test "$(stat -c %s "$diagnostic")" -le 50000000 || exit 1
          sha256sum "$diagnostic" > "$diagnostic.sha256" || exit 1
          printf 'archive=%s\n' "$diagnostic" >> "$GITHUB_OUTPUT" || exit 1
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sc-later-starts-native
          path: |
            ${{ steps.evidence.outputs.archive }}
            ${{ steps.evidence.outputs.archive }}.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
