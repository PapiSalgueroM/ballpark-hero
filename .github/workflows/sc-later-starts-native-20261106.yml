    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.2'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Bind exactly three native QA additions on the qualified product
        shell: bash
        run: |
          set -euo pipefail
          QA_OUT="$RUNNER_TEMP/sc-later-starts-native"
          QA_REF="$RUNNER_TEMP/sc-later-starts-native-inputs"
          QA_DIST="$RUNNER_TEMP/sc-later-starts-native-dist"
          export QA_OUT QA_REF QA_DIST
          test ! -e "$QA_OUT"
          test ! -e "$QA_REF"
          test ! -e "$QA_DIST"
          mkdir -p "$QA_OUT"/{logs,input,transport} "$QA_REF" "$QA_DIST"
          printf 'QA_OUT=%s\nQA_REF=%s\nQA_DIST=%s\n' "$QA_OUT" "$QA_REF" "$QA_DIST" >> "$GITHUB_ENV"
          node --input-type=module <<'BIND'
          import fs from 'node:fs';import assert from 'node:assert/strict';import{execFileSync}from'node:child_process';
          const e=process.env,git=(...args)=>execFileSync('git',args,{encoding:'utf8'}).trim();
          for(const name of['PRODUCT_CORE','PRODUCT_TREE','BASE_CORE','BASE_TREE','BROWSER_BLOB','READY_BLOB'])assert.match(e[name],/^[a-f0-9]{40}$/,name);
          for(const key of['PRODUCT_FILES','QUALIFICATION_INPUT','CODEC_INPUT'])assert(!e[key].includes('MUST_BIND'),'SC_LATER_NATIVE_ACTUAL_BINDINGS '+key);
          assert.equal(git('rev-parse','HEAD^^'),e.BASE_CORE);assert.equal(git('rev-parse',e.BASE_CORE+'^{tree}'),e.BASE_TREE);
          const files=JSON.parse(e.PRODUCT_FILES);
          assert.deepEqual(files.map(row=>row.path).sort(),["scripts/simSoccerHistoricalArrivals.mjs","src/components/soccer-career/PhonePanel.tsx","src/lib/soccerHistoricalArrivals.ts","src/lib/soccerPhone.ts","src/pages/SoccerCareer.tsx","src/test/soccerHistoricalRealEntry.test.tsx"]);
          for(const row of files){assert.match(row.before,/^[a-f0-9]{40}$/);assert.match(row.after,/^[a-f0-9]{40}$/);assert.notEqual(row.before,row.after);assert.equal(git('rev-parse',e.BASE_CORE+':'+row.path),row.before);assert.equal(git('rev-parse',e.PRODUCT_CORE+':'+row.path),row.after);}
          assert.equal(git('rev-parse','HEAD^'),e.PRODUCT_CORE);assert.equal(git('rev-parse','HEAD^^{tree}'),e.PRODUCT_TREE);
          const expected=JSON.parse(e.NATIVE_ADDITIONS),delta=git('diff','--name-status','--no-renames','HEAD^','HEAD').split('\n').filter(Boolean).map(row=>row.split('\t'));
          assert(delta.every(row=>row.length===2&&row[0]==='A'));assert.deepEqual(delta.map(row=>row[1]).sort(),expected.slice().sort());
          assert.equal(git('hash-object','scripts/qa/soccerHistoricalLaterNativeBrowser.mjs'),e.BROWSER_BLOB);assert.equal(git('hash-object','scripts/qa/nativeScrollReady.mjs'),e.READY_BLOB);
          const vector=object=>Object.fromEntries(git('ls-tree','-r','--full-tree',object).split('\n').filter(Boolean).map(line=>{const m=/^([0-7]{6}) (blob|commit) ([a-f0-9]{40})\t(.+)$/.exec(line);assert(m);return[m[4],{mode:m[1],type:m[2],sha:m[3]}];})),inverse=vector('HEAD'),product=vector(e.PRODUCT_CORE);for(const file of expected){assert.equal(product[file],undefined);assert.equal(inverse[file].mode,'100644');assert.equal(inverse[file].type,'blob');delete inverse[file];}assert.deepEqual(inverse,product,'RUSSIA_NATIVE_THREE_ADDITION_WHOLE_TREE_INVERSE');
          assert.equal(git('status','--porcelain=v1','--untracked-files=all'),'');
          fs.writeFileSync(e.QA_OUT+'/qa-delta.json',JSON.stringify({product:{commit:e.PRODUCT_CORE,tree:e.PRODUCT_TREE},qa:{commit:git('rev-parse','HEAD'),tree:git('rev-parse','HEAD^{tree}')},delta,wholeLeafVectorInverseExact:true,AppBuilds:0},null,2)+'\n',{flag:'wx'});
          fs.copyFileSync(expected[0],e.QA_OUT+'/workflow.yml');
          fs.writeFileSync(e.QA_OUT+'/workflow-source.json',JSON.stringify({path:expected[0],gitBlob:git('hash-object',expected[0]),helper:e.BROWSER_BLOB,scrollReady:e.READY_BLOB})+'\n',{flag:'wx'});
          BIND
          git ls-files -z > "$QA_OUT/tracked-before.bin"
          git ls-files -z | xargs -0 sha256sum > "$QA_OUT/source-before.sha256"
          git ls-files -s > "$QA_OUT/index-before.txt"
          git status --porcelain=v1 --untracked-files=all > "$QA_OUT/status-before.txt"
          test ! -s "$QA_OUT/status-before.txt"
          cp package-lock.json "$QA_OUT/lock-before.json"
          node --input-type=module -e 'import fs from "node:fs";import crypto from "node:crypto";const sha=b=>crypto.createHash("sha256").update(b).digest("hex");fs.writeFileSync(process.env.QA_OUT+"/all-locks-before.json",JSON.stringify(Object.fromEntries(["package.json","package-lock.json","bun.lock","bun.lockb","yarn.lock","pnpm-lock.yaml"].map(p=>[p,fs.existsSync(p)?sha(fs.readFileSync(p)):null])))+"\n");'
          git rev-parse HEAD HEAD^ 'HEAD^{tree}' > "$QA_OUT/source-identity.txt"
      - name: Authenticate completed output and both admitted 2020 saves
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node --input-type=module <<'AUTH'
          import fs from 'node:fs';import path from 'node:path';import crypto from 'node:crypto';import assert from 'node:assert/strict';import{spawnSync}from'node:child_process';
          const e=process.env,out=e.QA_OUT,ref=e.QA_REF,sha=b=>crypto.createHash('sha256').update(b).digest('hex'),blob=b=>crypto.createHash('sha1').update(Buffer.from('blob '+b.length+'\0')).update(b).digest('hex');
          const native=(label,command,args,binary=false)=>{const r=spawnSync(command,args,{encoding:binary?null:'utf8',maxBuffer:128*1024*1024});fs.writeFileSync(path.join(out,'input',label+'.native.json'),JSON.stringify({command:[command,...args],status:r.status,signal:r.signal,error:r.error?String(r.error):null})+'\n');fs.writeFileSync(path.join(out,'input',label+'.stderr.log'),r.stderr??'');if(!binary)fs.writeFileSync(path.join(out,'input',label+'.stdout.log'),r.stdout??'');assert.equal(r.status,0,label);assert.equal(r.signal,null);assert.equal(r.error,undefined);return r.stdout;};
          const api=(label,url)=>JSON.parse(native(label,'gh',['api','repos/PapiSalgueroM/ballpark-hero/'+url]));
          const safe=value=>{assert(typeof value==='string'&&value.length>0&&!value.startsWith('/')&&!/^[a-zA-Z]:/.test(value)&&!value.includes('\\')&&!value.includes('\0'),'RUSSIA_NATIVE_SAFE_PATH');assert(!value.split('/').includes('..'),'RUSSIA_NATIVE_SAFE_PATH');};
          const norm=value=>value.replace(/^\.\//,'').replace(/\/$/,'');
          const inventory=dir=>{const rows=[];function walk(rel=''){for(const entry of fs.readdirSync(path.join(dir,rel),{withFileTypes:true})){const file=path.posix.join(rel,entry.name);if(entry.isDirectory())walk(file);else{assert(entry.isFile());const bytes=fs.readFileSync(path.join(dir,file));rows.push({file,bytes:bytes.length,sha256:sha(bytes)});}}}walk();return rows.sort((a,b)=>a.file<b.file?-1:a.file>b.file?1:0);};
          const hashMap=bytes=>Object.fromEntries(bytes.toString('utf8').trim().split('\n').filter(Boolean).map(line=>{const m=/^([a-f0-9]{64}) [ *](.+)$/.exec(line);assert(m,'RUSSIA_NATIVE_SHA_LEDGER');safe(m[2]);return[m[2],m[1]];}));
          const sourceVector=object=>Object.fromEntries(native('git-vector-'+object,'git',['ls-tree','-r','-z','--full-tree',object]).split('\0').filter(Boolean).map(value=>{const m=/^([0-7]{6}) (blob|commit) ([a-f0-9]{40})\t([\s\S]+)$/.exec(value);assert(m);safe(m[4]);return[m[4],{mode:m[1],type:m[2],sha:m[3]}];}));
          const q=JSON.parse(e.QUALIFICATION_INPUT),required=JSON.parse(e.QUALIFICATION_REQUIRED_FILES),codecDependency=JSON.parse(e.CODEC_INPUT);
          for(const key of['run','job','artifact','attempt','zipBytes','innerBytes','regularFiles','totalRegularBytes','distFiles','distBytes'])assert(Number.isSafeInteger(q[key])&&q[key]>0,key);
          for(const key of['qa','qaTree','workflowBlob'])assert.match(q[key],/^[a-f0-9]{40}$/,key);
          for(const key of['zipSHA256','innerSHA256','independentAdmissionSHA256','rawAdmissionSHA256','distDigest'])assert.match(q[key],/^[a-f0-9]{64}$/,key);
          assert.deepEqual(q.filePins.map(row=>row.file).slice().sort(),required.slice().sort(),'SC_LATER_NATIVE_EXACT_QUALIFICATION_PINS');
          for(const pin of q.filePins){safe(pin.file);assert(Number.isSafeInteger(pin.bytes)&&pin.bytes>=0);assert.match(pin.sha256,/^[a-f0-9]{64}$/);}
          assert.equal(q.artifactName,'sc-later-starts-qualification');assert.equal(q.innerEntry,'sc-later-starts-qualification.tar.gz');
          assert.equal(codecDependency.file,'node_modules/lz-string/libs/lz-string.js');assert(Number.isSafeInteger(codecDependency.bytes)&&codecDependency.bytes>0);
          assert.match(codecDependency.sha256,/^[a-f0-9]{64}$/);assert.match(codecDependency.version,/^\d+\.\d+\.\d+$/);
          function fetchInput(role,pin){
           const run=api(role+'-run','actions/runs/'+pin.run),job=api(role+'-job','actions/jobs/'+pin.job),artifact=api(role+'-artifact','actions/artifacts/'+pin.artifact),commit=api(role+'-commit','git/commits/'+pin.qa);
           assert.equal(run.status,'completed');assert.equal(run.conclusion,'success');assert.equal(run.head_sha,pin.qa);assert.equal(run.head_branch,pin.branch);assert.equal(run.run_attempt,pin.attempt);assert.equal(run.path,pin.workflowPath);
           assert.equal(job.id,pin.job);assert.equal(job.run_id,pin.run);assert.equal(job.run_attempt,pin.attempt);assert.equal(job.conclusion,'success');
