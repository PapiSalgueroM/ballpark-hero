name: Manager transfer edge causal baseline

on:
  push:
    branches: [codex/manager-transfer-edge-proof]

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: 'true'
      SIM_NETWORK: offline
      CAREER_SEASON_LOCAL_ONLY: '1'
      MTE_OUT: ${{ github.workspace }}/manager-transfer-edge-artifacts
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Bind unchanged I1344 application and locked dependencies
        run: |
          echo '127.0.0.1 flawuiqbvjobmkfkauhw.supabase.co' | sudo tee -a /etc/hosts
          mkdir -p "$MTE_OUT"
          git rev-parse HEAD > "$MTE_OUT/head.txt"
          git archive --format=zip HEAD > "$MTE_OUT/source.zip"
          git diff --exit-code 6341f29bb1ce69d6df0f1b3d77fefffa93cdb265 -- . ':!.github/workflows/manager-transfer-edges.yml' ':!scripts/qa/proveManagerTransferEdges.mjs' ':!src/test/managerTransferEdgeCases.test.ts' ':!docs/PROJECT-STATE.md' ':!docs/audits/manager-transfer-edges.md'
          find src scripts .github/workflows -type f -print0 | sort -z | xargs -0 sha256sum > "$MTE_OUT/source-files.sha256"
          sha256sum package.json package-lock.json bun.lock > "$MTE_OUT/packages.sha256"
          npm ci
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const lock = JSON.parse(fs.readFileSync('package-lock.json'));
          const installed = Object.entries(lock.packages).filter(([p]) => p.startsWith('node_modules/') && fs.existsSync(p + '/package.json')).map(([p, entry]) => {
            const version = JSON.parse(fs.readFileSync(p + '/package.json')).version;
            assert.equal(version, entry.version, p); return { path: p, version };
          });
          assert.equal(installed.length, 521);
          fs.writeFileSync(process.env.MTE_OUT + '/installed.json', JSON.stringify(installed, null, 2));
          NODE
          find node_modules -type f -print0 | sort -z | xargs -0 sha256sum > "$MTE_OUT/installed-files.sha256"
      - name: Actual application types and causal proof syntax
        run: |
          node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee "$MTE_OUT/types.log"
          node --check scripts/qa/proveManagerTransferEdges.mjs
      - name: Actual prior-sale and job-move transfer edge outcomes
        run: |
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/qa/proveManagerTransferEdges.mjs 2>&1 | tee "$MTE_OUT/baseline.log"
      - name: Complete source and dependency holds
        if: always()
        run: |
          sha256sum --check "$MTE_OUT/source-files.sha256" > "$MTE_OUT/source-holds.log"
          sha256sum --check "$MTE_OUT/packages.sha256"
          sha256sum --check "$MTE_OUT/installed-files.sha256" > "$MTE_OUT/installed-holds.log"
          git diff --exit-code -- src scripts .github/workflows package.json package-lock.json bun.lock
      - name: Retain complete baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manager-transfer-edges-${{ github.run_id }}
          path: manager-transfer-edge-artifacts/
          retention-days: 14
          if-no-files-found: error
