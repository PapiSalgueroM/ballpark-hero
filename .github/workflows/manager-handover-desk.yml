name: Manager handover desk fixed proof

on:
  workflow_dispatch:
    inputs:
      base:
        description: Exact incoming application base before the two clearing fields
        required: false
        default: d4f2c6f688d656205722ba52bbdb33f03490966a
  push:
    branches: [codex/manager-handover-desk]

permissions:
  contents: read
concurrency:
  group: manager-handover-desk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      SIM_NETWORK: offline
      TZ: UTC
      ENGINES: chromium
      SEO_SPLIT_BASE_REF: HEAD
      HANDOVER_OUT: manager-handover-artifacts
      CM_HANDOVER_OUT: manager-handover-artifacts/proof
      CM_HANDOVER_BASE: ${{ inputs.base || 'd4f2c6f688d656205722ba52bbdb33f03490966a' }}
      SIM_OFFLINE_RECEIPT: manager-handover-artifacts/transport.log
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bind incoming application, frozen method and full source archive
        run: |
          mkdir -p "$HANDOVER_OUT"
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          git rev-parse HEAD > "$HANDOVER_OUT/source-head.txt"
          git rev-parse 'HEAD^{tree}' > "$HANDOVER_OUT/source-tree.txt"
          git rev-parse --verify "${CM_HANDOVER_BASE}^{commit}" > "$HANDOVER_OUT/base-head.txt"
          git status --porcelain --untracked-files=no > "$HANDOVER_OUT/source-before.txt"
          test ! -s "$HANDOVER_OUT/source-before.txt"
          git diff --exit-code "$CM_HANDOVER_BASE" -- src ':!src/lib/clubManagerCalendar.ts' ':!src/test/clubManagerHandoverDesk.test.ts' scripts ':!scripts/simCmHandoverDesk.mjs' .github/workflows ':!.github/workflows/manager-handover-desk.yml' index.html package.json package-lock.json bun.lock vitest.config.ts vite.config.ts tsconfig.json tsconfig.app.json tsconfig.node.json
          test "$(git rev-parse HEAD:src/test/clubManagerHandoverDesk.test.ts)" = "$(git rev-parse 862de03d5e912ecccade0f64d3840f23fa7f6992:src/test/clubManagerHandoverDesk.test.ts)"
          git diff "$CM_HANDOVER_BASE" -- src/lib/clubManagerCalendar.ts > "$HANDOVER_OUT/application.diff"
          git archive HEAD | gzip > "$HANDOVER_OUT/source.tar.gz"
          sha256sum "$HANDOVER_OUT/source.tar.gz" > "$HANDOVER_OUT/archive-sha256.txt"
          git ls-files -z src scripts .github/workflows index.html package.json package-lock.json bun.lock vitest.config.ts vite.config.ts tsconfig.json tsconfig.app.json tsconfig.node.json | xargs -0 sha256sum > "$HANDOVER_OUT/held-sources.sha256"
          npm ci
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8')), rows = [];
          for (const [directory, expected] of Object.entries(lock.packages)) {
            const file = directory + '/package.json';
            if (!directory.startsWith('node_modules/') || !expected.version || !fs.existsSync(file)) continue;
            const bytes = fs.readFileSync(file), actual = JSON.parse(bytes);
            assert.equal(actual.version, expected.version, directory);
            rows.push({ file, version: actual.version, sha256: createHash('sha256').update(bytes).digest('hex') });
          }
          assert.equal(rows.length, 521, 'Complete locked npm ci installation');
          fs.writeFileSync(process.env.HANDOVER_OUT + '/installed.json', JSON.stringify(rows, null, 2));
          JS
      - name: Remote build reader tools
        run: |
          reader_prefix="$RUNNER_TEMP/manager-handover-browser"
          npm install --prefix "$reader_prefix" --no-save --package-lock=false playwright@1.64.0
          test ! -e node_modules/playwright && test ! -L node_modules/playwright
          test ! -e node_modules/playwright-core && test ! -L node_modules/playwright-core
          ln -s "$reader_prefix/node_modules/playwright" node_modules/playwright
          ln -s "$reader_prefix/node_modules/playwright-core" node_modules/playwright-core
          node "$reader_prefix/node_modules/playwright/cli.js" install --with-deps chromium
          python -m pip install fonttools pillow
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          import assert from 'node:assert/strict';
          const rows = ['node_modules/playwright/package.json', 'node_modules/playwright-core/package.json'].map(file => {
            const bytes = fs.readFileSync(file); assert.equal(JSON.parse(bytes).version, '1.64.0', file);
            return { file, version: JSON.parse(bytes).version, sha256: createHash('sha256').update(bytes).digest('hex') };
          });
          fs.writeFileSync(process.env.HANDOVER_OUT + '/reader-tools.json', JSON.stringify(rows, null, 2));
          JS
      - name: Actual application type gate
        run: NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee "$HANDOVER_OUT/types.log"
      - name: Five exact public handover arms and complete state, RNG and size comparisons
        run: NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/simCmHandoverDesk.mjs 2>&1 | tee "$HANDOVER_OUT/proof.log"
      - name: Original 41 desk, depth and deadline regressions
        run: |
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node node_modules/vitest/vitest.mjs run src/test/clubManagerDecisions.test.tsx src/test/clubManagerDecisionDepth.test.ts src/test/clubManagerDecisionDeadline.test.ts --maxWorkers=1 --minWorkers=1 --reporter=verbose --reporter=json --outputFile="$HANDOVER_OUT/original-tests.json" 2>&1 | tee "$HANDOVER_OUT/original-tests.log"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const report = JSON.parse(fs.readFileSync(process.env.HANDOVER_OUT + '/original-tests.json', 'utf8'));
          const output = fs.readFileSync(process.env.HANDOVER_OUT + '/original-tests.log', 'utf8');
          assert.equal(report.success, true); assert.equal(report.numTotalTests, 41); assert.equal(report.numPassedTests, 41);
          assert.equal(report.numFailedTests, 0); assert.equal(report.numPendingTests, 0); assert.equal(report.numTodoTests, 0);
          assert.equal(report.testResults.length, 3);
          assert(report.testResults.every(file => !file.message && file.assertionResults.every(row => row.status === 'passed' && row.failureMessages.length === 0)));
          assert(!/Unhandled (?:Errors?|Rejection|Exception)|Uncaught Exception|SIM_OFFLINE_BLOCK/i.test(output));
          JS
      - name: Existing actual takeover, calendar and application simulations
        run: |
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          node scripts/simMidSeasonStart.mjs 2>&1 | tee "$HANDOVER_OUT/midseason.log"
          MIDSEASON_CONTROL=dirty node scripts/simMidSeasonStart.mjs 2>&1 | tee "$HANDOVER_OUT/midseason-dirty.log"
          grep -F 'CONTROL FIRED: the untidied handover was caught' "$HANDOVER_OUT/midseason-dirty.log"
          node scripts/simClubManagerCalendar.mjs 2>&1 | tee "$HANDOVER_OUT/calendar.log"
          node scripts/simCmApplications.mjs 2>&1 | tee "$HANDOVER_OUT/applications.log"
      - name: Actual production build
        run: NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" npm run build 2>&1 | tee "$HANDOVER_OUT/build.log"
      - name: All fifteen build and snapshot readers
        run: |
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          node scripts/lib/hostLikeServer.mjs dist 4173 > "$HANDOVER_OUT/reader-server.log" 2>&1 &
          reader_server_pid=$!
          trap 'kill "$reader_server_pid" 2>/dev/null || true' EXIT
          reader_ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then reader_ready=1; break; fi
            sleep 1
          done
          test "$reader_ready" = 1
          export BASE=http://127.0.0.1:4173
          export SWEEP_BASE="$BASE"
          failed=0
          for reader in simAdsense simBrand simHeadTags simHiddenPages simHubs simIndexNow simIndexing simInternalLinks simNoRivalNames simPrerender simPrerenderBoot simRetiredRoutes simSchema simSitemap simSnapshotAssets; do
            node "scripts/$reader.mjs" 2>&1 | tee "$HANDOVER_OUT/$reader.log" || failed=1
          done
          exit "$failed"
      - name: Hold tracked source, installed packages, reader tools and offline transport
        if: always()
        run: |
          sha256sum --check "$HANDOVER_OUT/held-sources.sha256" > "$HANDOVER_OUT/source-holds.log"
          git diff --exit-code HEAD -- src scripts .github/workflows index.html package.json package-lock.json bun.lock vitest.config.ts vite.config.ts tsconfig.json tsconfig.app.json tsconfig.node.json
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          const out = process.env.HANDOVER_OUT, rows = JSON.parse(fs.readFileSync(out + '/installed.json', 'utf8'));
          assert.equal(rows.length, 521, 'Complete installed manifest hold');
          const tools = JSON.parse(fs.readFileSync(out + '/reader-tools.json', 'utf8'));
          for (const row of [...rows, ...tools]) {
            const bytes = fs.readFileSync(row.file);
            assert.equal(JSON.parse(bytes).version, row.version, row.file);
            assert.equal(createHash('sha256').update(bytes).digest('hex'), row.sha256, row.file);
          }
          const blocked = process.env.SIM_OFFLINE_RECEIPT;
          assert(!fs.existsSync(blocked) || fs.statSync(blocked).size === 0, 'No denied transport was attempted');
          console.log(`Held ${rows.length} locked manifests, reader tools and all tracked sources. No save cap or historical assertion changed.`);
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manager-handover-desk-${{ github.run_id }}-${{ github.run_attempt }}
          path: manager-handover-artifacts/
          if-no-files-found: error
          retention-days: 14