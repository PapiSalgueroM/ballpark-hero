name: Soccer Career queued money choices

on:
  push:
    branches: [codex/career-pending-money-gates]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CI: '1'
      SIM_NETWORK: offline
      ENGINES: chromium
      CAREER_SEASON_LOCAL_ONLY: '1'
      SC_PENDING_MONEY_PHASE: fixed
      SC_PENDING_MONEY_BASE: 75abee825b73c34b4a7a6d6852de1417a20cc8aa
      SC_PENDING_MONEY_OUT: ${{ github.workspace }}/pending-money-artifacts
      FREE_KICK_FONT_CACHE: ${{ github.workspace }}/pending-money-artifacts/font-cache
      PRERENDER_ONLY: /soccer-career
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Bind source and locked dependencies
        run: |
          echo '127.0.0.1 flawuiqbvjobmkfkauhw.supabase.co' | sudo tee -a /etc/hosts
          mkdir -p "$SC_PENDING_MONEY_OUT"
          git rev-parse HEAD > "$SC_PENDING_MONEY_OUT/source-head.txt"
          git archive --format=zip HEAD > "$SC_PENDING_MONEY_OUT/source.zip"
          git status --porcelain --untracked-files=no > "$SC_PENDING_MONEY_OUT/source-before.txt"
          test ! -s "$SC_PENDING_MONEY_OUT/source-before.txt"
          git diff --exit-code "$SC_PENDING_MONEY_BASE" -- . ':!docs/PROJECT-STATE.md' ':!docs/audits/career-pending-money-gates.md' ':!src/lib/soccerCareerLife.ts' ':!src/test/careerPendingMoneyGates.test.ts' ':!scripts/simCareerPendingMoneyGates.mjs' ':!.github/workflows/career-pending-money-gates.yml'
          git diff --exit-code "$SC_PENDING_MONEY_BASE" -- src scripts package.json package-lock.json bun.lock ':!src/lib/soccerCareerLife.ts' ':!src/test/careerPendingMoneyGates.test.ts' ':!scripts/simCareerPendingMoneyGates.mjs'
          if test "$SC_PENDING_MONEY_PHASE" = baseline; then
            git diff --exit-code "$SC_PENDING_MONEY_BASE" -- src/lib/soccerCareerLife.ts
          fi
          find src scripts .github/workflows public -type f ! -path scripts/data/lastmod.json -print0 | sort -z | xargs -0 sha256sum > "$SC_PENDING_MONEY_OUT/source-hashes.txt"
          sha256sum package.json package-lock.json bun.lock > "$SC_PENDING_MONEY_OUT/package-hashes.txt"
          npm ci
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const lock = JSON.parse(fs.readFileSync('package-lock.json'));
          const installed = Object.entries(lock.packages).filter(([p]) => p.startsWith('node_modules/') && fs.existsSync(p + '/package.json')).map(([p, entry]) => {
            const version = JSON.parse(fs.readFileSync(p + '/package.json')).version;
            assert.equal(version, entry.version, p); return { path: p, version };
          });
          assert.equal(installed.length, 521);
          fs.writeFileSync(process.env.SC_PENDING_MONEY_OUT + '/installed.json', JSON.stringify(installed, null, 2));
          console.log(`Bound ${installed.length} installed locked versions.`);
          NODE
          find node_modules -type f -print0 | sort -z | xargs -0 sha256sum > "$SC_PENDING_MONEY_OUT/installed-files.sha256"
      - name: Actual application type gate
        run: node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee "$SC_PENDING_MONEY_OUT/types.log"
      - name: New method syntax
        run: node --check scripts/simCareerPendingMoneyGates.mjs
      - name: Exact queued-choice baseline or fixed outcomes
        run: NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/simCareerPendingMoneyGates.mjs 2>&1 | tee "$SC_PENDING_MONEY_OUT/$SC_PENDING_MONEY_PHASE.log"
      - name: Original source control and full restoration
        if: env.SC_PENDING_MONEY_PHASE == 'fixed'
        run: |
          SC_PENDING_MONEY_CONTROL=original NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/simCareerPendingMoneyGates.mjs 2>&1 | tee "$SC_PENDING_MONEY_OUT/original.log"
          SC_PENDING_MONEY_RESTORED=1 NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/simCareerPendingMoneyGates.mjs 2>&1 | tee "$SC_PENDING_MONEY_OUT/restored.log"
      - name: Existing saved-choice and followup outcomes
        run: |
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node node_modules/vitest/vitest.mjs run src/test/soccerCareerPendingLife.test.ts src/test/soccerCareerLifeReviews.test.ts src/test/soccerLifeChainPackedSave.test.ts --maxWorkers=1 --reporter=verbose --reporter=json --outputFile.json="$SC_PENDING_MONEY_OUT/prior-units.json" 2>&1 | tee "$SC_PENDING_MONEY_OUT/prior-units.log"
      - name: Frozen PR286 current original and restored outcomes
        env:
          SC_PENDING_POPULARITY_PHASE: fixed
          SC_PENDING_POPULARITY_BASE: d4f2c6f688d656205722ba52bbdb33f03490966a
          SC_PENDING_POPULARITY_OUT: ${{ github.workspace }}/pending-money-artifacts/prior-popularity
        run: |
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/simCareerPendingPopularityGates.mjs 2>&1 | tee "$SC_PENDING_MONEY_OUT/prior-popularity-normal.log"
          SC_PENDING_POPULARITY_CONTROL=original NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/simCareerPendingPopularityGates.mjs 2>&1 | tee "$SC_PENDING_MONEY_OUT/prior-popularity-original.log"
          SC_PENDING_POPULARITY_RESTORED=1 NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/simCareerPendingPopularityGates.mjs 2>&1 | tee "$SC_PENDING_MONEY_OUT/prior-popularity-restored.log"
      - name: Build tools
        if: env.SC_PENDING_MONEY_PHASE == 'fixed'
        run: |
          npm install --prefix "$RUNNER_TEMP/money-build" --no-save --package-lock=false playwright@1.64.0
          ln -s "$RUNNER_TEMP/money-build/node_modules/playwright" node_modules/playwright
          ln -s "$RUNNER_TEMP/money-build/node_modules/playwright-core" node_modules/playwright-core
          node "$RUNNER_TEMP/money-build/node_modules/playwright/cli.js" install --with-deps chromium
          python -m pip install fonttools pillow
          node scripts/qa/freeKickLab1070.mjs --prefetch-fonts-only 2>&1 | tee "$SC_PENDING_MONEY_OUT/fonts.log"
      - name: Complete build and all rebuilt-site readers
        if: env.SC_PENDING_MONEY_PHASE == 'fixed'
        run: |
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" npm run build:seo 2>&1 | tee "$SC_PENDING_MONEY_OUT/build.log"
          cp scripts/data/lastmod.json "$SC_PENDING_MONEY_OUT/build-lastmod.json"
          git diff -- scripts/data/lastmod.json > "$SC_PENDING_MONEY_OUT/build-lastmod.diff"
          ONLY=simAdsense,simBrand,simHeadTags,simHiddenPages,simHubs,simIndexNow,simIndexing,simInternalLinks,simNoRivalNames,simPrerender,simPrerenderBoot,simRetiredRoutes,simSchema,simSitemap,simSnapshotAssets node scripts/runAllSims.mjs --browser 2>&1 | tee "$SC_PENDING_MONEY_OUT/readers.log"
          test "$(grep -c '^All 15 harnesses green\.$' "$SC_PENDING_MONEY_OUT/readers.log")" = 1
      - name: Unchanged full route weights
        if: env.SC_PENDING_MONEY_PHASE == 'fixed'
        run: |
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/lib/hostLikeServer.mjs dist 4173 > "$SC_PENDING_MONEY_OUT/weight-server.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          sleep 2
          BASE=http://127.0.0.1:4173 SWEEP_OFFLINE=1 NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/sweepWeight.mjs 2>&1 | tee "$SC_PENDING_MONEY_OUT/weights.log"
      - name: Full current and restored observations match
        if: env.SC_PENDING_MONEY_PHASE == 'fixed'
        run: cmp "$SC_PENDING_MONEY_OUT/units/normal/raw.json" "$SC_PENDING_MONEY_OUT/units/restored/raw.json"
      - name: Final source and dependency holds
        if: always()
        run: |
          sha256sum --check "$SC_PENDING_MONEY_OUT/source-hashes.txt" > "$SC_PENDING_MONEY_OUT/source-holds.log"
          sha256sum --check "$SC_PENDING_MONEY_OUT/package-hashes.txt"
          sha256sum --check "$SC_PENDING_MONEY_OUT/installed-files.sha256" > "$SC_PENDING_MONEY_OUT/installed-holds.log"
          git diff --exit-code -- src scripts ':!scripts/data/lastmod.json' public package.json package-lock.json bun.lock .github/workflows
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const installed = JSON.parse(fs.readFileSync(process.env.SC_PENDING_MONEY_OUT + '/installed.json'));
          for (const row of installed) assert.equal(JSON.parse(fs.readFileSync(row.path + '/package.json')).version, row.version, row.path);
          console.log(`Held ${installed.length} installed locked versions.`);
          NODE
      - name: Retain complete evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pending-money-${{ github.run_id }}
          path: pending-money-artifacts/
          retention-days: 14
          if-no-files-found: error
