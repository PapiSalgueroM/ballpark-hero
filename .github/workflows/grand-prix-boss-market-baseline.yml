name: Grand Prix Boss paid market absence baseline
on:
  push:
    branches: [codex/grand-prix-boss-market-baseline-20261102]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: '1'
      SIM_NETWORK: offline
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Bind unchanged qualified engine and market test only
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/codex/grand-prix-boss-market-baseline-20261102
          out="$PWD/grand-prix-market-baseline-artifacts"
          mkdir "$out"
          git rev-parse HEAD HEAD^{tree} > "$out/head-tree.txt"
          git ls-files -z > "$out/source-members.before"
          git ls-files -z | xargs -0 sha256sum > "$out/source.sha256"
          git diff --name-only 29bda1687957b226b5e91fb86807c3eec84f9d61 HEAD > "$out/changed-paths.txt"
          printf '%s\n' '.github/workflows/grand-prix-boss-market-baseline.yml' 'src/test/grandPrixBossMarket.test.ts' > "$out/expected-paths.txt"
          cmp "$out/expected-paths.txt" "$out/changed-paths.txt"
          printf '%s\n' 'ec793e9cacb47bf770d599b1677f76ac753d2cafde9c1f85e6bb0cf7dc7bc69b  src/lib/grandPrixBoss.ts' '8822d2af417739a0164babc5b15d13cd2a5e5c5dd4e263a9e465602798765887  src/test/grandPrixBoss.test.ts' 'e4802254a8bad005b6f7b9fa3aba5fd0ac68dae71ee7281499be4a1d14d37000  src/test/grandPrixBossMarket.test.ts' | sha256sum -c -
          cat > "$out/capture.sh" <<'CAPTURE'
          capture() {
            local tag="$1"; shift
            local out="$PWD/grand-prix-market-baseline-artifacts"
            test ! -e "$out/$tag.exit"
            printf '%s\0' "$@" > "$out/$tag.argv"
            : > "$out/$tag.transport"
            set +e
            SIM_OFFLINE_RECEIPT="$out/$tag.transport" "$@" > "$out/$tag.stdout" 2> "$out/$tag.stderr"
            local status=$?
            set -e
            printf '%s\n' "$status" > "$out/$tag.exit"
            cat "$out/$tag.stdout"; cat "$out/$tag.stderr" >&2
            test ! -s "$out/$tag.transport" || return 1
            return "$status"
          }
          CAPTURE
          source "$out/capture.sh"
          capture install env NODE_OPTIONS='' npm ci
          find node_modules -path node_modules/.vite -prune -o -type f -print0 | sort -z | xargs -0 sha256sum > "$out/dependency-files.sha256"
      - name: Actual types original engine preservation and owned market failures
        run: |
          set -euo pipefail
          out="$PWD/grand-prix-market-baseline-artifacts"
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          unset GP_BOSS_HOOK_FILE GP_BOSS_ENGINE_FILE NO_DOUBLE_SWAP
          source "$out/capture.sh"
          capture types node_modules/.bin/tsc --noEmit -p tsconfig.app.json
          capture original node node_modules/vitest/vitest.mjs run src/test/grandPrixBoss.test.ts --maxWorkers=1 --minWorkers=1 --no-file-parallelism --reporter=verbose --reporter=json --outputFile="$out/original.vitest.json"
          code=0
          capture baseline node node_modules/vitest/vitest.mjs run src/test/grandPrixBossMarket.test.ts --maxWorkers=1 --minWorkers=1 --no-file-parallelism --reporter=verbose --reporter=json --outputFile="$out/baseline.vitest.json" || code=$?
          test "$code" -eq 1
          test ! -s "$out/baseline.transport"
          node --input-type=module <<'CHECK'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const out = process.cwd() + '/grand-prix-market-baseline-artifacts';
          const originalIds = ['GP_ENGINE_AVAILABLE:', 'GP_WORLD:', 'GP_SEED:', 'GP_UPGRADE:', 'GP_RESERVE:', 'GP_GRID:', 'GP_SETUPS:', 'GP_CLASSIFICATION:', 'GP_SETTLEMENT:', 'GP_DUPLICATE:', 'GP_RESUME:', 'GP_INVALID_SAVE:', 'GP_SCORE:'];
          // Every held first-engine behavior keeps its exact identity.
          const marketIds = ['GP_MARKET_PUBLIC_QUOTES:', 'GP_MARKET_SIGN:', 'GP_MARKET_NEW_WAGES:', 'GP_MARKET_BUYOUT:', 'GP_MARKET_FUNDS:', 'GP_MARKET_REROUND:', 'GP_MARKET_RENEW:', 'GP_MARKET_EXCLUSIVITY:', 'GP_MARKET_WINDOWS:', 'GP_MARKET_REPLAY:', 'GP_MARKET_SAVE:', 'GP_MARKET_HOLDS:'];
          const reports = [];
          function inspect(tag, file, count, passed, failed) {
            const r = JSON.parse(fs.readFileSync(out + '/' + tag + '.vitest.json', 'utf8'));
            const raw = fs.readFileSync(out + '/' + tag + '.stdout', 'utf8') + '\n' + fs.readFileSync(out + '/' + tag + '.stderr', 'utf8');
            assert.equal(Number(fs.readFileSync(out + '/' + tag + '.exit', 'utf8')), failed ? 1 : 0);
            assert.equal(r.success, failed === 0);
            assert.equal(r.numTotalTests, count);
            assert.equal(r.numPassedTests, passed);
            assert.equal(r.numFailedTests, failed);
            assert.equal(r.numPendingTests, 0);
            assert.equal(r.numTodoTests, 0);
            assert.equal(r.testResults.length, 1);
            assert(r.testResults[0].name.endsWith('/' + file));
            const rows = r.testResults[0].assertionResults;
            assert.equal(rows.length, count);
            const runtimeCounters = { numUnhandledErrors: r.numUnhandledErrors ?? null, numRuntimeErrorTestSuites: r.numRuntimeErrorTestSuites ?? null };
            for (const [name, value] of Object.entries(runtimeCounters)) { if (value === null) continue; assert.equal(typeof value, 'number'); assert.equal(value, 0, name); }
            const detectedRuntimeError = Object.values(runtimeCounters).some(value => typeof value === 'number' && value > 0) || /(?:Unhandled (?:Errors?|Rejection|Exception)|unhandledRejection|uncaughtException|Vitest caught \d+ unhandled)/i.test(raw);
            assert.equal(detectedRuntimeError, false);
            reports.push({ tag, passed, ownedFailures: failed, declaredSkips: 0, runtimeCounters,
              runtimeCounterCompleteness: Object.values(runtimeCounters).some(value => value === null) ? 'UNKNOWN' : 'REPORTED', detectedRuntimeError,
              rawErrors: r.errors ?? null, rawUnhandledErrors: r.unhandledErrors ?? null, cases: rows.map(row => ({ title: row.title, status: row.status })) });
            return rows;
          }
          const original = inspect('original', 'src/test/grandPrixBoss.test.ts', 13, 13, 0);
          const originalSeen = new Set();
          for (const row of original) {
            assert.equal(row.status, 'passed'); assert.equal(row.failureMessages.length, 0);
            const id = row.title.slice(0, row.title.indexOf(':') + 1);
            assert(id.startsWith('GP_')); assert(!originalSeen.has(id)); originalSeen.add(id);
          }
          assert.deepEqual([...originalSeen].sort(), [...originalIds].sort(), 'All thirteen held original behavior identities');
          const baseline = inspect('baseline', 'src/test/grandPrixBossMarket.test.ts', 12, 1, 11);
          const seen = new Set();
          let quoteFailures = 0, phaseFailures = 0;
          for (const row of baseline) {
            const matches = marketIds.filter(id => row.title.startsWith(id));
            assert.equal(matches.length, 1); const id = matches[0]; assert(!seen.has(id)); seen.add(id);
            const preservation = id === 'GP_MARKET_HOLDS:';
            assert.equal(row.status, preservation ? 'passed' : 'failed');
            assert.equal(row.failureMessages.length, preservation ? 0 : 1);
            if (preservation) continue;
            const error = row.failureMessages[0]; assert.match(error, /AssertionError:/);
            if (id === 'GP_MARKET_WINDOWS:') { assert.match(error, /phase/); assert.match(error, /invalid/); phaseFailures += 1; }
            else { assert.match(error, /GP_MARKET_QUOTE_MISSING/); quoteFailures += 1; }
          }
          assert.equal(quoteFailures, 10); assert.equal(phaseFailures, 1);
          fs.writeFileSync(out + '/summary.json', JSON.stringify({
            scope: 'Missing authoritative paid market only. No market economics or rollover behavior passes are claimed.', reports,
            totalExecuted: 25, preservationPasses: 14, ownedAssertionFailures: 11, declaredSkips: 0, quoteAbsenceFailures: quoteFailures, phaseFailures,
          }, null, 2) + '\n');
          console.log('GP_MARKET_BASELINE: original 13 passed, actual seed-one market preservation passed, ten explicit missing-quote assertions and one phase assertion.');
          CHECK
      - name: Preserve complete source dependencies and membership
        if: always()
        run: |
          set -euo pipefail
          out="$PWD/grand-prix-market-baseline-artifacts"
          sha256sum -c "$out/source.sha256" > "$out/source-hold.log"
          if test -f "$out/dependency-files.sha256"; then sha256sum -c "$out/dependency-files.sha256" > "$out/dependency-hold.log"; fi
          git ls-files -z > "$out/source-members.after"
          cmp "$out/source-members.before" "$out/source-members.after"
          git diff --exit-code HEAD > "$out/working-source-hold.log"
          git ls-files --others --exclude-standard > "$out/untracked.txt"
          test ! -s "$out/untracked.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grand-prix-market-baseline-${{ github.run_id }}
          path: grand-prix-market-baseline-artifacts/
          retention-days: 14
