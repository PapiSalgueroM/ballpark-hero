name: Build Your XI Club year guarded generation
on:
  push:
    branches: [codex/build-xi-club-year-20261026]
permissions:
  contents: read
concurrency:
  group: build-xi-club-year-${{ github.ref }}
  cancel-in-progress: false
jobs:
  green:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: true
      SIM_NETWORK: offline
      ENGINES: chromium
      PYTHONDONTWRITEBYTECODE: 1
      EXPECTED_PARENT: a2c2ebda101d01660bccd61df23d57475c1f2515
      BUILD_XI_PHASE: club-year-generation
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bind reviewed Club year source and preserve every other parent path
        id: foundation
        timeout-minutes: 5
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/build-xi-club-year-green"
          test ! -e "$out";test ! -L "$out";mkdir "$out"
          export BUILD_XI_OUT="$out";echo "BUILD_XI_OUT=$out" >> "$GITHUB_ENV"
          tmp="$RUNNER_TEMP/build-xi-club-year-generator-tmp"
          test ! -e "$tmp";test ! -L "$tmp";mkdir "$tmp"
          export BUILD_XI_GENERATOR_TMP="$tmp";echo "BUILD_XI_GENERATOR_TMP=$tmp" >> "$GITHUB_ENV"
          for name in SIM_SEED BYXI_CONTROL BYXI_SEED BYXI_PRINT_DIGEST NODE_OPTIONS NODE_PATH VITEST ONLY BROWSER TYCOON_AWAY_CONTROL COMPLETION_HOOK OWNED_TIMEOUTS_HOOK CONQUEST_NBA_HOOK CONQUEST_NBA_BOARD POLL_FIXTURES US_BOARD_CONTROL_ALIAS US_BOARD_CONTROL_FILE DAILY_RECORD_CONTROL TYCOON_ROOMS_PAGE TYCOON_LOADS_STADIUM_HOOK TYCOON_LOADS_ACADEMY_HOOK TYCOON_LOADS_STADIUM_LIB TYCOON_LOADS_ACADEMY_LIB TYCOON_PITCH_COMPONENT TYCOON_PACKS_REWARDS TYCOON_PACKS_PANEL NO_DOUBLE_SWAP;do test ! -v "$name";done
          test "$GITHUB_REPOSITORY" = PapiSalgueroM/ballpark-hero
          test "$GITHUB_REPOSITORY_ID" = 1195729679
          test "$GITHUB_REF" = refs/heads/codex/build-xi-club-year-20261026
          test "$BUILD_XI_PHASE" = club-year-generation
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git show -s --format=%P HEAD)" = "$EXPECTED_PARENT"
          test "$(git rev-parse "$EXPECTED_PARENT^{tree}")" = a68f434019f451df90b65c41aae8b22437814f4d
          git diff --name-status "$EXPECTED_PARENT" HEAD > "$out/direct-paths.txt"
          printf 'M\t.github/workflows/build-xi-club-year.yml\nM\tdocs/superpowers/plans/2026-10-26-build-xi-club-year.md\nA\tscripts/qa/playBuildXiClubYear.mjs\nM\tsrc/components/game/PlayerAutocomplete.tsx\nM\tsrc/components/lineup/LineupHowToPlay.tsx\nM\tsrc/components/lineup/TeamSpinner.tsx\nM\tsrc/data/gameContent/soccer2.ts\nM\tsrc/hooks/useLineupBuilder.ts\nM\tsrc/pages/LineupBuilder.tsx\nA\tsrc/test/buildXiClubYear.test.tsx\nA\tsrc/test/playerAutocompleteHighlightScroll.test.tsx\nM\tsrc/types/lineupBuilder.ts\n' | cmp - "$out/direct-paths.txt"
          base=cb1c2025a31a7e01ad41ffd5f3a76d9b3ab9ed1f
          git diff --name-status "$base" HEAD > "$out/cumulative-paths.txt"
          printf 'A\t.github/workflows/build-xi-club-year.yml\nA\tdocs/superpowers/plans/2026-10-26-build-xi-club-year.md\nA\tscripts/qa/playBuildXiClubYear.mjs\nM\tsrc/components/game/PlayerAutocomplete.tsx\nM\tsrc/components/lineup/LineupHowToPlay.tsx\nM\tsrc/components/lineup/TeamSpinner.tsx\nM\tsrc/data/gameContent/soccer2.ts\nM\tsrc/hooks/useLineupBuilder.ts\nM\tsrc/pages/LineupBuilder.tsx\nA\tsrc/test/buildXiClubYear.test.tsx\nA\tsrc/test/buildXiClubYearSetup.test.tsx\nA\tsrc/test/playerAutocompleteHighlightScroll.test.tsx\nM\tsrc/types/lineupBuilder.ts\n' | cmp - "$out/cumulative-paths.txt"
          for file in src/test/buildXiClubYear.test.tsx src/test/playerAutocompleteHighlightScroll.test.tsx scripts/qa/playBuildXiClubYear.mjs;do
            if git cat-file -e "$EXPECTED_PARENT:$file" 2>> "$out/new-parent-absence.stderr";then printf 'Unexpected existing parent path: %s\n' "$file";exit 1;fi
          done
          git diff --exit-code "$EXPECTED_PARENT" HEAD -- . ':!.github/workflows/build-xi-club-year.yml' ':!docs/superpowers/plans/2026-10-26-build-xi-club-year.md' ':!scripts/qa/playBuildXiClubYear.mjs' ':!src/components/game/PlayerAutocomplete.tsx' ':!src/components/lineup/LineupHowToPlay.tsx' ':!src/components/lineup/TeamSpinner.tsx' ':!src/data/gameContent/soccer2.ts' ':!src/hooks/useLineupBuilder.ts' ':!src/pages/LineupBuilder.tsx' ':!src/test/buildXiClubYear.test.tsx' ':!src/test/playerAutocompleteHighlightScroll.test.tsx' ':!src/types/lineupBuilder.ts' > "$out/other-parent-source-held.log"
          git ls-tree -r --name-only "$EXPECTED_PARENT" > "$out/parent-members.txt"
          test "$(wc -l < "$out/parent-members.txt")" -eq 5384
          git rev-parse HEAD > "$out/head.txt";git rev-parse 'HEAD^{tree}' > "$out/tree.txt"
          git ls-files -z | sort -z > "$out/source-members.before"
          test "$(tr -cd '\000' < "$out/source-members.before" | wc -c)" -eq 5387
          git ls-files -z | sort -z | xargs -0 sha256sum > "$out/source.sha256"
          git ls-files -z -- . ':!scripts/data/guideHeadingsFrozen.json' ':!src/data/searchKeywords.json' ':!public/build-your-xi/index.html' ':!public/sitemap.xml' ':!scripts/data/lastmod.json' | sort -z > "$out/source-held-members.before"
          test "$(tr -cd '\000' < "$out/source-held-members.before" | wc -c)" -eq 5382
          xargs -0 sha256sum < "$out/source-held-members.before" > "$out/source-held.sha256"
          git diff --exit-code HEAD > "$out/source-clean-before.log"
          git status --porcelain --untracked-files=all > "$out/status-before.txt";test ! -s "$out/status-before.txt"
          git archive --format=tar HEAD > "$out/source.tar"
          printf 'e60ff1534307e449ccef598e3b7470dcba58681b82cea4005cec7319f14f9221  scripts/lib/offlineTransport.cjs\n' | sha256sum -c - > "$out/offline-guard-before.log"
          cat > "$out/helper.payload.gz.b64" <<'HELPER_GZIP_BASE64'
          
          HELPER_GZIP_BASE64
          base64 --decode "$out/helper.payload.gz.b64" | gzip -dc > "$out/build-xi-club-year-green.cjs"
          base64 --decode > "$out/caps-preload.cjs" <<'CAPS_BASE64'
          
          CAPS_BASE64
          base64 --decode > "$out/prerender-fonts.cjs" <<'PRERENDER_BASE64'
          
          PRERENDER_BASE64
          printf '89767472b92c9a29f9b213a7a375f9933d0ae98260d197cf71206c061a2e70f9  %s\nf00bdbf577607029625636b970b5126579c64a5540959cae9bf34559580dbd6e  %s\n9fa5aa86e8763ebdf600594b1c11b8903f5a40b06a26e7e4d3f5ceb81fd1304b  %s\n' "$out/build-xi-club-year-green.cjs" "$out/caps-preload.cjs" "$out/prerender-fonts.cjs" > "$out/generated.sha256"
          printf '0f46bbf98aeddb807afb4ad890f59ac9b9fe7217d1b5e0312868661a29b635c5  %s\n' "$out/helper.payload.gz.b64" > "$out/payload.sha256"
          sha256sum -c "$out/generated.sha256" > "$out/generated-before.log"
          sha256sum -c "$out/payload.sha256" > "$out/payload-before.log"
          : > "$out/foundation.transport";status=0
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$out/foundation.transport" node "$out/build-xi-club-year-green.cjs" source > "$out/foundation.stdout" 2> "$out/foundation.stderr" || status=$?
          printf '%s\n' "$status" > "$out/foundation.exit"
          test "$status" -eq 0;test ! -s "$out/foundation.transport"
      - name: Locked packages and isolated cap tools
        id: install
        timeout-minutes: 20
        run: |
          set -euo pipefail
          out="$BUILD_XI_OUT";status=0
          npm ci > "$out/npm-ci.stdout" 2> "$out/npm-ci.stderr" &
          pid=$!;printf '%s\n' "$pid" > "$out/npm-ci.pid"
          wait "$pid" || status=$?
          printf '%s\n' "$status" > "$out/npm-ci.exit";test "$status" -eq 0
          tools="$RUNNER_TEMP/build-xi-cap-tools";engines="$RUNNER_TEMP/build-xi-cap-engines"
          test ! -e "$tools";test ! -L "$tools";test ! -e "$engines";test ! -L "$engines"
          echo "BUILD_XI_BROWSER_TOOLS=$tools" >> "$GITHUB_ENV";echo "PLAYWRIGHT_BROWSERS_PATH=$engines" >> "$GITHUB_ENV"
          export PLAYWRIGHT_BROWSERS_PATH="$engines"
          status=0;npm install --prefix "$tools" --no-save --package-lock=false playwright@1.64.0 > "$out/playwright-install.stdout" 2> "$out/playwright-install.stderr" &
          pid=$!;printf '%s\n' "$pid" > "$out/playwright-install.pid";wait "$pid" || status=$?
          printf '%s\n' "$status" > "$out/playwright-install.exit";test "$status" -eq 0
          test ! -e node_modules/playwright;test ! -e node_modules/playwright-core
          ln -s "$tools/node_modules/playwright" node_modules/playwright
          ln -s "$tools/node_modules/playwright-core" node_modules/playwright-core
          status=0;node "$tools/node_modules/playwright/cli.js" install --with-deps chromium > "$out/chromium-install.stdout" 2> "$out/chromium-install.stderr" &
          pid=$!;printf '%s\n' "$pid" > "$out/chromium-install.pid";wait "$pid" || status=$?
          printf '%s\n' "$status" > "$out/chromium-install.exit";test "$status" -eq 0
          status=0;python -m pip install fonttools pillow > "$out/python-install.stdout" 2> "$out/python-install.stderr" &
          pid=$!;printf '%s\n' "$pid" > "$out/python-install.pid";wait "$pid" || status=$?
          printf '%s\n' "$status" > "$out/python-install.exit";test "$status" -eq 0
          python -m pip freeze > "$out/python-packages.before"
          python -c "import pathlib,fontTools,PIL;print(pathlib.Path(fontTools.__file__).parent);print(pathlib.Path(PIL.__file__).parent)" > "$out/python-roots.txt"
          while IFS= read -r dir;do find "$dir" -type f -print0;done < "$out/python-roots.txt" | sort -z > "$out/python-tools-members.before"
          xargs -0 sha256sum < "$out/python-tools-members.before" > "$out/python-tools.sha256"
          status=0;FREE_KICK_FONT_CACHE="$out/font-cache" node scripts/qa/freeKickLab1070.mjs --prefetch-fonts-only > "$out/font-prefetch.stdout" 2> "$out/font-prefetch.stderr" &
          pid=$!;printf '%s\n' "$pid" > "$out/font-prefetch.pid";wait "$pid" || status=$?
          printf '%s\n' "$status" > "$out/font-prefetch.exit";test "$status" -eq 0
          echo "FREE_KICK_FONT_CACHE=$out/font-cache" >> "$GITHUB_ENV"
          echo "FONT_CACHE_MANIFEST_SHA256=$(sha256sum "$out/font-cache/manifest.json" | cut -d ' ' -f1)" >> "$GITHUB_ENV"
          find node_modules -type f -print0 | sort -z > "$out/dependency-members.before"
          test "$(tr -cd '\000' < "$out/dependency-members.before" | wc -c)" -eq 24466
          find node_modules -type f -print0 | sort -z | xargs -0 sha256sum > "$out/dependencies.sha256"
          find node_modules -type l -printf '%p\t%l\0' | sort -z > "$out/dependency-links.before"
          find node_modules ! -type d ! -type f ! -type l -print > "$out/dependency-nonregular.before"
          test ! -s "$out/dependency-nonregular.before"
          for name in playwright playwright-core;do readlink -f "node_modules/$name";done > "$out/browser-links.before"
          for pair in "browser-tools:$tools" "browser-engines:$engines" "font-cache:$out/font-cache";do
            name="${pair%%:*}";dir="${pair#*:}"
            find "$dir" -type f -print0 | sort -z > "$out/$name-members.before"
            find "$dir" -type f -print0 | sort -z | xargs -0 sha256sum > "$out/$name.sha256"
            find "$dir" -type l -printf '%p\t%l\0' | sort -z > "$out/$name-links.before"
            find "$dir" ! -type d ! -type f ! -type l -print > "$out/$name-nonregular.before";test ! -s "$out/$name-nonregular.before"
          done
          tar -cf "$out/browser-tools.tar" -C "$tools" .
      - name: Twenty frozen cases both original fit trips five new source trips and original controls
        id: checks
        timeout-minutes: 50
        run: |
          set -euo pipefail
          out="$BUILD_XI_OUT"
          sha256sum -c "$out/generated.sha256" > "$out/generated-pre-consumer.log"
          sha256sum -c "$out/payload.sha256" > "$out/payload-pre-consumer.log"
          : > "$out/orchestrator.transport";status=0
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$out/orchestrator.transport" node "$out/build-xi-club-year-green.cjs" checks > "$out/orchestrator.stdout" 2> "$out/orchestrator.stderr" || status=$?
          printf '%s\n' "$status" > "$out/orchestrator.exit"
          test "$status" -eq 0;test ! -s "$out/orchestrator.transport"
      - name: Normal guide search scoped snapshot and sitemap generation
        id: generation
        timeout-minutes: 50
        run: |
          set -euo pipefail
          out="$BUILD_XI_OUT"
          sha256sum -c "$out/generated.sha256" > "$out/generated-pre-generation.log"
          sha256sum -c "$out/payload.sha256" > "$out/payload-pre-generation.log"
          : > "$out/generation.transport";status=0
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$out/generation.transport" node "$out/build-xi-club-year-green.cjs" generate > "$out/generation.stdout" 2> "$out/generation.stderr" || status=$?
          printf '%s\n' "$status" > "$out/generation.exit"
          test "$status" -eq 0;test ! -s "$out/generation.transport"
      - name: Completed build all eighteen readers unchanged caps and Club year browser
        id: built
        timeout-minutes: 50
        run: |
          set -euo pipefail
          out="$BUILD_XI_OUT";sha256sum -c "$out/generated.sha256" > "$out/generated-pre-built.log"
          sha256sum -c "$out/payload.sha256" > "$out/payload-pre-built.log"
          : > "$out/built.transport";status=0
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$out/built.transport" node "$out/build-xi-club-year-green.cjs" built > "$out/built.stdout" 2> "$out/built.stderr" || status=$?
          printf '%s\n' "$status" > "$out/built.exit"
          test "$status" -eq 0;test ! -s "$out/built.transport"
      - name: Complete source dependency tool font dist generated and process holds
        id: holds
        if: ${{ always() && steps.foundation.outcome != 'skipped' }}
        timeout-minutes: 5
        run: |
          set -euo pipefail
          set +e
          out="$BUILD_XI_OUT";failed=0
          for name in source-held dependencies generated payload browser-tools browser-engines font-cache python-tools dist;do
            if test -f "$out/$name.sha256" && test ! -L "$out/$name.sha256";then sha256sum -c "$out/$name.sha256" > "$out/$name-hold.log" 2>&1 || failed=1;else printf 'Missing required manifest\n' > "$out/$name-hold.log";failed=1;fi
          done
          git ls-files -z | sort -z > "$out/source-members.after"
          cmp "$out/source-members.before" "$out/source-members.after" > "$out/source-members-hold.log" 2>&1 || failed=1
          git ls-files -z -- . ':!scripts/data/guideHeadingsFrozen.json' ':!src/data/searchKeywords.json' ':!public/build-your-xi/index.html' ':!public/sitemap.xml' ':!scripts/data/lastmod.json' | sort -z > "$out/source-held-members.after"
          cmp "$out/source-held-members.before" "$out/source-held-members.after" > "$out/source-held-members-hold.log" 2>&1 || failed=1
          git ls-files -z | sort -z | xargs -0 sha256sum > "$out/source-after.sha256"
          tar --null -T "$out/source-members.after" -cf "$out/source-after.tar" || failed=1
          find node_modules -type f -print0 | sort -z > "$out/dependency-members.after"
          cmp "$out/dependency-members.before" "$out/dependency-members.after" > "$out/dependency-members-hold.log" 2>&1 || failed=1
          find node_modules -type f -print0 | sort -z | xargs -0 sha256sum > "$out/dependencies-after.sha256"
          find node_modules -type l -printf '%p\t%l\0' | sort -z > "$out/dependency-links.after"
          cmp "$out/dependency-links.before" "$out/dependency-links.after" > "$out/dependency-links-hold.log" 2>&1 || failed=1
          find node_modules ! -type d ! -type f ! -type l -print > "$out/dependency-nonregular.after"
          test ! -s "$out/dependency-nonregular.after" || failed=1
          for name in playwright playwright-core;do readlink -f "node_modules/$name" || failed=1;done > "$out/browser-links.after"
          cmp "$out/browser-links.before" "$out/browser-links.after" > "$out/browser-links-hold.log" 2>&1 || failed=1
          for pair in "browser-tools:${BUILD_XI_BROWSER_TOOLS-}" "browser-engines:${PLAYWRIGHT_BROWSERS_PATH-}" "font-cache:$out/font-cache";do
            name="${pair%%:*}";dir="${pair#*:}"
            if ! test -d "$dir";then printf 'Missing owned resource directory\n' > "$out/$name-members-hold.log";failed=1;continue;fi
            find "$dir" -type f -print0 | sort -z > "$out/$name-members.after"
            cmp "$out/$name-members.before" "$out/$name-members.after" > "$out/$name-members-hold.log" 2>&1 || failed=1
            find "$dir" -type l -printf '%p\t%l\0' | sort -z > "$out/$name-links.after"
            cmp "$out/$name-links.before" "$out/$name-links.after" > "$out/$name-links-hold.log" 2>&1 || failed=1
            find "$dir" ! -type d ! -type f ! -type l -print > "$out/$name-nonregular.after";test ! -s "$out/$name-nonregular.after" || failed=1
          done
          python -m pip freeze > "$out/python-packages.after"
          cmp "$out/python-packages.before" "$out/python-packages.after" > "$out/python-packages-hold.log" 2>&1 || failed=1
          while IFS= read -r dir;do find "$dir" -type f -print0;done < "$out/python-roots.txt" | sort -z > "$out/python-tools-members.after"
          cmp "$out/python-tools-members.before" "$out/python-tools-members.after" > "$out/python-tools-members-hold.log" 2>&1 || failed=1
          find dist -type f -print0 | sort -z > "$out/dist-members.after"
          cmp "$out/dist-members.before" "$out/dist-members.after" > "$out/dist-members-hold.log" 2>&1 || failed=1
          git diff --name-status HEAD > "$out/source-dirty-after.log" 2>&1 || failed=1
          git status --porcelain --untracked-files=all > "$out/status-after.txt"
          test -f "$out/status-after.txt" || failed=1
          tmp="${BUILD_XI_GENERATOR_TMP-}"
          if test -d "$tmp" && test ! -L "$tmp";then
            find "$tmp" ! -type d ! -type f -print > "$out/generator-temp-nonregular.txt"
            test ! -s "$out/generator-temp-nonregular.txt" || failed=1
            find "$tmp" -type f -print0 | sort -z > "$out/generator-temp-members.final"
            xargs -0 -r sha256sum < "$out/generator-temp-members.final" > "$out/generator-temp.sha256"
            tar -cf "$out/generator-temp.tar" -C "$tmp" . || failed=1
          else printf 'Missing owned generator temp root\n' > "$out/generator-temp-nonregular.txt";failed=1;fi
          if test -d dist && test ! -L dist;then tar -cf "$out/dist-partial.tar" -C dist . || failed=1;fi
          : > "$out/final.transport";status=0
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$out/final.transport" node "$out/build-xi-club-year-green.cjs" final > "$out/final.stdout" 2> "$out/final.stderr" || status=$?
          printf '%s\n' "$status" > "$out/final.exit";test "$status" -eq 0 || failed=1
          for name in foundation orchestrator generation built final types existing-fit wingback setup club-year scroll classifier caps browser server;do test -f "$out/$name.transport" && test ! -L "$out/$name.transport" && test ! -s "$out/$name.transport" || failed=1;done
          for id in year-admission year-query browse-reopen missing-age-default highlight-scroll;do for role in healthy fault restored;do name="feature-$id-$role";test -f "$out/$name.transport" && test ! -L "$out/$name.transport" && test ! -s "$out/$name.transport" || failed=1;done;done
          for name in guide-refresh search-keywords seo-parts-check routes-only build-first prerender sitemap build-final;do test -f "$out/$name.transport" && test ! -L "$out/$name.transport" && test ! -s "$out/$name.transport" || failed=1;done
          for id in left-back-wingback-penalty right-back-wingback-penalty;do for role in healthy fault restored;do name="source-$id-$role";test -f "$out/$name.transport" && test ! -L "$out/$name.transport" && test ! -s "$out/$name.transport" || failed=1;done;done
          for control in nofit farlinks alias reach nocap tileraw nogate leak oldcrash;do name="harness-$control";test -f "$out/$name.transport" && test ! -L "$out/$name.transport" && test ! -s "$out/$name.transport" || failed=1;done
          for reader in simAdsense simBrand simHeadTags simHiddenPages simHubs simIndexNow simIndexing simInternalLinks simNoRivalNames simPrerender simPrerenderBoot simRetiredRoutes simSchema simSitemap simSnapshotAssets simSiteSearch simGuideHeadings simLegalPages;do test -f "$out/$reader.transport" && test ! -L "$out/$reader.transport" && test ! -s "$out/$reader.transport" || failed=1;done
          for name in npm-ci playwright-install chromium-install python-install font-prefetch;do test "$(cat "$out/$name.exit")" = 0 || failed=1;done
          sha256sum -c "$out/generated.sha256" > "$out/generated-final-hold.log" 2>&1 || failed=1
          sha256sum -c "$out/payload.sha256" > "$out/payload-final-hold.log" 2>&1 || failed=1
          printf '%s\n' "$failed" > "$out/final-holds.exit";exit "$failed"
      - name: Seal retained originals and partial failures
        if: ${{ always() && steps.foundation.outcome != 'skipped' }}
        run: |
          set -euo pipefail
          out="$BUILD_XI_OUT";test -d "$out";cd "$out"
          find . ! -type d ! -type f -print > nonregular.txt
          test ! -s nonregular.txt
          find . -type f ! -name evidence.sha256 -print0 | sort -z | xargs -0 sha256sum > evidence.sha256
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.foundation.outcome != 'skipped' }}
        with:
          name: build-xi-club-year-green-generation-${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ env.BUILD_XI_OUT }}
          if-no-files-found: error
          retention-days: 30
