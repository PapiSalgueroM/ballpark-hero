              assert.equal(row.failureMessages[0].split(needle).length-1,0);assert.equal(row.failureMessages[0].split(replacement).length-1,1);
              return {field:'actual setup owned numeric witness',needle,replacement,beforeSha256:sha(before),afterSha256:sha(row.failureMessages[0]),changed:true};
             },'BUILD_XI_RED_NUMERIC_WITNESS')
