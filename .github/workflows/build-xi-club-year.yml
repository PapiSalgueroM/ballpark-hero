            save('baseline-admission.json',{phase:'club-year-setup-owned-RED',source:process.env.GITHUB_SHA,run:process.env.GITHUB_RUN_ID,attempt:process.env.GITHUB_RUN_ATTEMPT,pid:process.pid,typesExit:0,existingHarness:existing,heldPass:judged.filter(a=>a.status==='passed').map(a=>a.fullName),expectedOwnedFailures:judged.filter(a=>a.status==='failed').map(a=>({fullName:a.fullName,status:a.status,kind:'AssertionError',failureMessages:a.failureMessages})),classifierControls:controls,absentRuntimeCounters:'UNKNOWN',newFeatureImplemented:false,fullSuite:false,browser:false});
            return;
