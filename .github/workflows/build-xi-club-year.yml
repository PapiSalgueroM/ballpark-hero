           if(mode==='final'){
            const before=json('source-binding.json'),now=binding();assert.equal(now.source,process.env.GITHUB_SHA,'BUILD_XI_END_COMMIT');assert.equal(before.source,process.env.GITHUB_SHA,'BUILD_XI_START_COMMIT');assert.deepEqual(now.criticalSources,before.criticalSources,'BUILD_XI_END_SOURCE');
            assert.deepEqual(now.helper,before.helper,'BUILD_XI_END_GENERATED');
            for(const [id,status]of [['types',0],['existing-fit',0],['club-year-setup',1],['classifier',0]])native(id,status);
            for(const name of ['foundation','orchestrator']){assert.equal(regular(output(name+'.transport')).length,0);assert.equal(regular(output(name+'.exit')).toString().trim(),'0');}
            const admission=json('baseline-admission.json');assert.equal(admission.source,process.env.GITHUB_SHA);assert.equal(admission.classifierControls.length,4);assert(admission.classifierControls.every(c=>c.changed&&c.restored&&c.seedSha256===c.restoredSha256));
            assert.equal(admission.heldPass.length,1);assert.equal(admission.expectedOwnedFailures.length,1);
            save('final-binding.json',{pid:process.pid,source:process.env.GITHUB_SHA,run:process.env.GITHUB_RUN_ID,attempt:process.env.GITHUB_RUN_ATTEMPT,phase:admission.phase,sourceHeld:true,generatedHeld:true,heldPass:1,newOwnedFailures:1,existingHarness:admission.existingHarness,qualifiedFeature:false});
