name: Academy filter census targeted proof
on:
  push:
    branches: [codex/academy-filter-census-20261024]
    paths: [.github/workflows/academy-filter-census.yml, scripts/simAcademyFilters.mjs]
permissions:
  contents: read
concurrency:
  group: academy-filter-census-${{ github.sha }}
