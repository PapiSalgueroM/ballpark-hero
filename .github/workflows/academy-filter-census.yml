          printf 'status=%s\n' "$code" >> "$GITHUB_OUTPUT"
          cat "$ACADEMY_OUT/types.stdout.log"
          cat "$ACADEMY_OUT/types.stderr.log" >&2
          exit "$code"
      - name: Actual normal wrapper and native exit
        id: normal
        if: ${{ !cancelled() && steps.types.outputs.status == '0' }}
        timeout-minutes: 3
        run: |
          set -euo pipefail
          while IFS= read -r key; do
            case "$key" in *_CONTROL|CONTROL|ATTRIBUTION|NO_DOUBLE_SWAP|SIM_RUNNER_ARTIFACTS) unset "$key";; esac
          done < <(compgen -e)
          (set -o noclobber; : > "$ACADEMY_OUT/normal.transport")
          printf 'STARTED\n' > "$ACADEMY_OUT/normal.phase"
          set +e
          ACADEMY_FILTER_CONTROL='' NODE_OPTIONS="--require=$GITHUB_WORKSPACE/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$ACADEMY_OUT/normal.transport" \
            node scripts/simAcademyFilters.mjs > "$ACADEMY_OUT/normal.stdout.log" 2> "$ACADEMY_OUT/normal.stderr.log" &
          child=$!
          printf '%s\n' "$child" > "$ACADEMY_OUT/normal.pid"
          wait "$child"
          code=$?
          printf '%s\n' "$code" > "$ACADEMY_OUT/normal.exit"
          printf 'CLOSED\n' > "$ACADEMY_OUT/normal.phase"
          cat "$ACADEMY_OUT/normal.stdout.log"
          cat "$ACADEMY_OUT/normal.stderr.log" >&2
          exit 0
      - name: Actual unfilter wrapper and native exit
        id: unfilter
        if: ${{ !cancelled() && steps.types.outputs.status == '0' }}
        timeout-minutes: 3
        run: |
          set -euo pipefail
          while IFS= read -r key; do
            case "$key" in *_CONTROL|CONTROL|ATTRIBUTION|NO_DOUBLE_SWAP|SIM_RUNNER_ARTIFACTS) unset "$key";; esac
          done < <(compgen -e)
          (set -o noclobber; : > "$ACADEMY_OUT/unfilter.transport")
          printf 'STARTED\n' > "$ACADEMY_OUT/unfilter.phase"
          set +e
          ACADEMY_FILTER_CONTROL='unfilter' NODE_OPTIONS="--require=$GITHUB_WORKSPACE/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$ACADEMY_OUT/unfilter.transport" \
            node scripts/simAcademyFilters.mjs > "$ACADEMY_OUT/unfilter.stdout.log" 2> "$ACADEMY_OUT/unfilter.stderr.log" &
          child=$!
          printf '%s\n' "$child" > "$ACADEMY_OUT/unfilter.pid"
          wait "$child"
          code=$?
          printf '%s\n' "$code" > "$ACADEMY_OUT/unfilter.exit"
          printf 'CLOSED\n' > "$ACADEMY_OUT/unfilter.phase"
          cat "$ACADEMY_OUT/unfilter.stdout.log"
          cat "$ACADEMY_OUT/unfilter.stderr.log" >&2
          exit 0
      - name: Actual restored wrapper and native exit
        id: restored
        if: ${{ !cancelled() && steps.types.outputs.status == '0' }}
        timeout-minutes: 3
        run: |
          set -euo pipefail
          while IFS= read -r key; do
            case "$key" in *_CONTROL|CONTROL|ATTRIBUTION|NO_DOUBLE_SWAP|SIM_RUNNER_ARTIFACTS) unset "$key";; esac
          done < <(compgen -e)
          (set -o noclobber; : > "$ACADEMY_OUT/restored.transport")
          printf 'STARTED\n' > "$ACADEMY_OUT/restored.phase"
          set +e
          ACADEMY_FILTER_CONTROL='' NODE_OPTIONS="--require=$GITHUB_WORKSPACE/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$ACADEMY_OUT/restored.transport" \
            node scripts/simAcademyFilters.mjs > "$ACADEMY_OUT/restored.stdout.log" 2> "$ACADEMY_OUT/restored.stderr.log" &
          child=$!
          printf '%s\n' "$child" > "$ACADEMY_OUT/restored.pid"
          wait "$child"
          code=$?
          printf '%s\n' "$code" > "$ACADEMY_OUT/restored.exit"
          printf 'CLOSED\n' > "$ACADEMY_OUT/restored.phase"
          cat "$ACADEMY_OUT/restored.stdout.log"
          cat "$ACADEMY_OUT/restored.stderr.log" >&2
          exit 0
      - name: Require actual normal, unfilter and restored outcomes
        id: classify
        if: ${{ !cancelled() && steps.types.outputs.status == '0' }}
        run: |
          set -euo pipefail
          (set -o noclobber; : > "$ACADEMY_OUT/classifier.transport")
          set +e
          NODE_OPTIONS="--require=$GITHUB_WORKSPACE/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$ACADEMY_OUT/classifier.transport" \
            node --input-type=module > "$ACADEMY_OUT/classifier.stdout.log" 2> "$ACADEMY_OUT/classifier.stderr.log" <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import { createHash } from 'node:crypto';
          const out=process.env.ACADEMY_OUT,sha=body=>createHash('sha256').update(body).digest('hex');
          const write=(name,value)=>fs.writeFileSync(path.join(out,name),JSON.stringify(value,null,2)+'\n',{flag:'wx'});
          const failedTitles=["combines both filters while keeping the original reported-ceiling order and source list","distinguishes no matches from an empty academy and resets both selections","passes the actual visible prospect ID to sign and release callbacks","keeps signing disabled for budget 4 and squad size 10","keeps signing disabled for budget 10 and squad size 30","retains the selected labels if signing or releasing removes the last match"],unaffectedTitles=["keeps the original intake explanation when there are no prospects","names every Sign him and Let go button after its own prospect, and each one acts on him"];
          const good='simAcademyFilters: eight rendered combination, reset, callback and signing-rule checks passed.';
          const fault='simAcademyFilters control: six rendered outcome checks rejected ignored selections; the empty intake and prospect button name checks stayed green.';
          const read=name=>fs.readFileSync(path.join(out,name),'utf8');
          const rows=['normal','unfilter','restored'].map(arm=>{
            const st=fs.lstatSync(path.join(out,arm+'.transport'));
            return {arm,pid:Number(read(arm+'.pid').trim()),exit:Number(read(arm+'.exit').trim()),phase:read(arm+'.phase').trim(),stdout:read(arm+'.stdout.log'),stderr:read(arm+'.stderr.log'),receipt:{regular:st.isFile(),symlink:st.isSymbolicLink(),bytes:st.size}};
          });
          function judge(values){
            assert.deepEqual(values.map(row=>row.arm),['normal','unfilter','restored'],'ACADEMY_PROOF_THREE_ACTUAL_ARMS');
            assert.equal(new Set(values.map(row=>row.pid)).size,3,'ACADEMY_PROOF_DISTINCT_NATIVE_PIDS');
            for(const row of values){
              assert(Number.isInteger(row.pid)&&row.pid>0&&row.phase==='CLOSED','ACADEMY_PROOF_NATIVE_CLOSED');
              assert.equal(row.exit,0,'ACADEMY_PROOF_NATIVE_EXIT');
              assert(row.receipt.regular&&!row.receipt.symlink&&row.receipt.bytes===0,'ACADEMY_PROOF_TRANSPORT');
              const text=row.stdout+'\n'+row.stderr;
              assert(text.includes('src/test/academyFilters.test.tsx'),'ACADEMY_PROOF_ACTUAL_TEST_FILE');
              assert(!/Unhandled (?:Errors?|Rejections?)|Uncaught Exception|SyntaxError|ReferenceError|Cannot find (?:module|package)|Failed to (?:load|resolve) (?:url|import)/i.test(text),'ACADEMY_PROOF_NO_OBSERVED_SETUP_RUNTIME_ERROR');
              if(row.arm==='unfilter'){
                assert.equal((text.match(/^\s*Test Files\s+1 failed \(1\)\s*$/gm)||[]).length,1,'ACADEMY_PROOF_TEST_CENSUS');
                assert.equal((text.match(/^\s*Tests\s+6 failed \| 2 passed \(8\)\s*$/gm)||[]).length,1,'ACADEMY_PROOF_TEST_CENSUS');
                const names=[...text.matchAll(/^\s*FAIL\s+src\/test\/academyFilters\.test\.tsx > academy position and age filters > (.+)\s*$/gm)].map(match=>match[1].trim()).sort();
                assert.deepEqual(names,[...failedTitles].sort(),'ACADEMY_PROOF_FAILED_CENSUS');
                assert(text.includes('AssertionError'),'ACADEMY_PROOF_ACTUAL_FILTER_OUTCOME_FAILURE');
                assert(row.stdout.trimEnd().endsWith(fault),'ACADEMY_PROOF_WRAPPER_FOOTER');
              }else{
                assert.equal((text.match(/^\s*Test Files\s+1 passed \(1\)\s*$/gm)||[]).length,1,'ACADEMY_PROOF_TEST_CENSUS');
                assert.equal((text.match(/^\s*Tests\s+8 passed \(8\)\s*$/gm)||[]).length,1,'ACADEMY_PROOF_TEST_CENSUS');
                assert(!/^\s*FAIL\s+/m.test(text),'ACADEMY_PROOF_TEST_CENSUS');
                assert(row.stdout.trimEnd().endsWith(good),'ACADEMY_PROOF_WRAPPER_FOOTER');
              }
            }
          }
          judge(rows);
          const original=Buffer.from(JSON.stringify(rows)+'\n');
          fs.writeFileSync(path.join(out,'record-control-foundation.json'),original,{flag:'wx'});
          const controls=[];
          function control(id,mutate,marker){
            const changed=JSON.parse(original);mutate(changed);const body=Buffer.from(JSON.stringify(changed)+'\n'),work=path.join(out,'record-control-'+id+'.work.json');
            assert(!body.equals(original),'ACADEMY_RECORD_CONTROL_CHANGED');fs.writeFileSync(work,body,{flag:'wx'});
