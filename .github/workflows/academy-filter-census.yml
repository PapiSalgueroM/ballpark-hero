","parent":{"bytes":5364,"sha256":"6a68dd2f214dab4a3013eb41bad38eea65d703d61440002710ec246495e1c58a","gitBlob":"ed2a9dc677f77dfe95c061064eeff5782b856864"},"candidate":{"bytes":5364,"sha256":"6a68dd2f214dab4a3013eb41bad38eea65d703d61440002710ec246495e1c58a","gitBlob":"ed2a9dc677f77dfe95c061064eeff5782b856864"},"sourceReference":"Native original54e body exact immutable b55 Git/size matched"}]
          PINS
          sha256sum "$ACADEMY_OUT/critical.expected.json" > "$ACADEMY_OUT/critical.expected.sha256"
          (set -o noclobber; : > "$ACADEMY_OUT/source.transport")
          NODE_OPTIONS="--require=$GITHUB_WORKSPACE/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$ACADEMY_OUT/source.transport" \
            node --input-type=module > "$ACADEMY_OUT/source.stdout.log" 2> "$ACADEMY_OUT/source.stderr.log" <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          const out=process.env.ACADEMY_OUT,head=process.env.GITHUB_SHA,parent=process.env.PARENT,self=process.env.WORKFLOW_PATH;
          const git=(...args)=>execFileSync('git',args,{encoding:'utf8'}),sha=body=>createHash('sha256').update(body).digest('hex');
          assert.match(head,/^[a-f0-9]{40}$/);
          assert.equal(process.env.GITHUB_REF,'refs/heads/codex/academy-filter-census-20261024');
          assert.equal(git('rev-parse','HEAD').trim(),head);
          assert.deepEqual(git('rev-list','--parents','-n','1','HEAD').trim().split(' '),[head,parent]);
          assert.equal(git('rev-parse',parent+'^{tree}').trim(),process.env.PARENT_TREE);
          assert.equal(git('status','--porcelain=v1','--untracked-files=all'),'');
          const direct=git('diff','--name-status','--no-renames',parent,'HEAD').trim().split('\n');
          assert.deepEqual(direct,['A\t'+self,'M\tscripts/simAcademyFilters.mjs']);
          const old=git('ls-tree','-r','--name-only','-z',parent).split('\0').filter(Boolean),now=git('ls-files','-z').split('\0').filter(Boolean);
          assert.equal(old.length,5341);assert.equal(now.length,5342);assert(!old.includes(self)&&now.includes(self));
          assert.deepEqual(now.filter(file=>file!==self).sort(),old.sort());
          const expected=JSON.parse(fs.readFileSync(path.join(out,'critical.expected.json'),'utf8'));
          assert.equal(expected.length,10);assert.equal(new Set(expected.map(row=>row.file)).size,10);
          const pins=expected.map(row=>{
            const body=fs.readFileSync(row.file),actual={bytes:body.length,sha256:sha(body),gitBlob:git('rev-parse','HEAD:'+row.file).trim()};
            assert.deepEqual(actual,row.candidate);assert.equal(git('rev-parse',parent+':'+row.file).trim(),row.parent.gitBlob);
            return {file:row.file,...actual,parentGitBlob:row.parent.gitBlob};
          });
          const body=fs.readFileSync(self),workflow={file:self,bytes:body.length,sha256:sha(body),gitBlob:git('rev-parse','HEAD:'+self).trim()};
          fs.writeFileSync(path.join(out,'source-binding.json'),JSON.stringify({head,parent,parentTree:process.env.PARENT_TREE,tree:git('rev-parse','HEAD^{tree}').trim(),source:5342,parentSource:5341,direct,pins,workflow,applicationQualified:false},null,2)+'\n',{flag:'wx'});
          console.log('Exact two-path Academy source binding complete.');
          NODE
          printf '0\n' > "$ACADEMY_OUT/source.exit"
