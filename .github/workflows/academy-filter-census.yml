          xargs -0 sha256sum < "$ACADEMY_OUT/dependency-members.before" > "$ACADEMY_OUT/dependencies-before.sha256"
          test "$(tr -cd '\0' < "$ACADEMY_OUT/dependency-members.before" | wc -c)" -eq 24466
      - name: Actual app type gate under the original guard
        id: types
