          git rev-parse HEAD > "$ACADEMY_OUT/head.before"
          git status --porcelain=v1 --untracked-files=all > "$ACADEMY_OUT/status.before"
      - name: Locked dependencies and complete before inventory
        id: install
        timeout-minutes: 5
        run: |
          set -euo pipefail
          set +e
          npm ci --ignore-scripts --no-audit --no-fund > "$ACADEMY_OUT/install.stdout.log" 2> "$ACADEMY_OUT/install.stderr.log"
          code=$?
          printf '%s\n' "$code" > "$ACADEMY_OUT/install.exit"
          cat "$ACADEMY_OUT/install.stdout.log"
          cat "$ACADEMY_OUT/install.stderr.log" >&2
          set -e
          test "$code" -eq 0
