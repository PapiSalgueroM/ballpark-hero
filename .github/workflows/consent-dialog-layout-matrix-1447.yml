      - name: Always retain complete source, inputs, generated, dist and transport evidence
        if: always()
        run: |
          set -uo pipefail
          mkdir -p "$OUT";failed=0
          if test -d "$MATRIX_OUT";then status=0;cp -a "$MATRIX_OUT" "$OUT/matrix" > "$OUT/matrix-copy.log" 2>&1 || status=$?;printf '%s\n' "$status" > "$OUT/matrix-copy.exit";test "$status" -eq 0 || failed=1;fi
