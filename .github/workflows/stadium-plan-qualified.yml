            test -f "$out/full-suite/ACTUAL-DEFAULT-FULL-SUITE-ADMISSION.json"
            test -f "$out/stadium-browser/BROWSER-ADMISSION.json"
            test -f "$out/DEFAULT-SIMS-SCOPE.json"
            test -f "$out/REUSED-FULL-SEO-INPUT.json"
