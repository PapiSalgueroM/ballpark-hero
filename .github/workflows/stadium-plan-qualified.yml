          unset ONLY BROWSER DB_PROBE
          export SIM_NETWORK=offline SIM_FULL_OUTPUT=1
          run_gate default-sims-plan 0 '' node scripts/runAllSims.mjs --plan-json
          GATE_TIMEOUT=18000s run_gate default-node-sims 0 '^All [1-9][0-9]* harnesses green(, [1-9][0-9]* skipped above)?\.$' node scripts/runAllSims.mjs
          printf '{"scope":"UNCHANGED_DEFAULT_NODE_SIM_RUNNER","parentRawExit":0,"plan":"gates/default-sims-plan/stdout.log","actualPrintedOutcomes":"gates/default-node-sims/stdout.log","fullChildOutputVerbosity":true,"perChildRawOrDeletedReceiptCustodyClaim":false,"browserGroup":"SOURCE_EXCLUDED_AND_UNRUN_BY_DEFAULT","databaseOnlySkips":"ONLY_ACTUAL_SOURCE_CLASSIFIED_PRINTED_SKIP_ROWS","productionNetworkPermission":false,"noAllBrowserOrAllOptionalProfileClaim":true}\n' > "$PLACEMENT_OUT/DEFAULT-SIMS-SCOPE.json"
