          a.equal(after.about,'Guide text generated before section conversion or explicitly refreshed after a verified gameplay or factual correction. scripts/simGuideHeadings.mjs section 1 requires each sentence exactly once in its original part. Use --freeze /route before conversion, or --refresh /route after a verified change to an existing converted guide. Never edit sentence entries by hand.');
          const was=before.routes[route],now=after.routes[route];a.deepEqual(Object.keys(was),Object.keys(now));a.deepEqual(now.rules,was.rules);a.deepEqual(now.tips,was.tips);
          const diff=part=>({removed:was[part].filter(x=>!now[part].includes(x)),added:now[part].filter(x=>!was[part].includes(x))});const how=diff('howToPlay'),example=diff('example');
