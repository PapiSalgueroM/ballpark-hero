name: Stadium late-match plans, bound source qualification
on:
  push:
    branches: [codex/stadium-plan-qualified-v3-20261030]
permissions:
  contents: read
  actions: read
jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      CI: 'true'
      ENGINES: chromium
      TZ: UTC
      SIM_NETWORK: offline
      EXPECTED_PARENT: 7fc9b3b3f8fe1170531cefc759b25078720d2c52
      EXPECTED_PRODUCT_TREE: 15ba00595f02019e6a0eba8c0e8269d99da0c584
      EXPECTED_MAIN: bd0c07bf72dc0214842202fe2f931b14c65d82dc
      STADIUM_ENGINE_SHA256: bd510c2277e61eef5e7cbcf4f283c07124735c8f25b6503297fc61e477a0c428
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Bind immutable shipping source and matched-copy scope
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/stadium-plan-qualified"; fonts="$RUNNER_TEMP/stadium-plan-qualified-fonts"
          test ! -e "$out"; test ! -e "$fonts"; mkdir -p "$out"
          echo "PLACEMENT_OUT=$out" >> "$GITHUB_ENV"; echo "FREE_KICK_FONT_CACHE=$fonts" >> "$GITHUB_ENV"
          test "$GITHUB_REF_NAME" = codex/stadium-plan-qualified-v3-20261030
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-list --parents -n1 HEAD)" = "$GITHUB_SHA $EXPECTED_PARENT"
          test "$(git rev-parse "$EXPECTED_PARENT^{tree}")" = "$EXPECTED_PRODUCT_TREE"
          printf '%s\n' "$EXPECTED_MAIN" > "$out/main-at-plan.txt"
          private_index="$out/main-bridge.private.index";test ! -e "$private_index"
          default_index=$(git rev-parse --git-path index)
          sha256sum "$default_index" > "$out/default-index.before.sha256"
          git for-each-ref --format='%(refname) %(objectname)' > "$out/refs.before.txt"
          git fetch --no-tags --refmap='' origin refs/heads/main > "$out/main-fetch.stdout.log" 2> "$out/main-fetch.stderr.log"
          actual_main=$(git rev-parse --verify 'FETCH_HEAD^{commit}')
          [[ "$actual_main" =~ ^[a-f0-9]{40}$ ]]
          printf '%s\n' "$actual_main" > "$out/main-at-start.txt"
          echo "ACTUAL_MAIN_AT_START=$actual_main" >> "$GITHUB_ENV"
          GIT_INDEX_FILE="$private_index" git read-tree "$EXPECTED_MAIN^{tree}"
          base_tree=$(GIT_INDEX_FILE="$private_index" git write-tree)
          cp "$private_index" "$out/main-bridge.private.index.before"
          before_index_sha=$(sha256sum "$private_index" | cut -d ' ' -f1)
          inspect_main_trees() {
            local base="$1" candidate="$2" prefix="$3" full_raw outside_raw paths_raw base_board candidate_board
            if GIT_INDEX_FILE="$private_index" git diff --name-status "$base" "$candidate" -- > "$prefix.paths.tsv" 2> "$prefix.paths.stderr.log";then paths_raw=0;else paths_raw=$?;fi
            if GIT_INDEX_FILE="$private_index" git diff --exit-code "$base" "$candidate" -- > "$prefix.full.diff" 2> "$prefix.full.stderr.log";then full_raw=0;else full_raw=$?;fi
            if GIT_INDEX_FILE="$private_index" git diff --exit-code "$base" "$candidate" -- . ':!docs/WORKBOARD.md' > "$prefix.nonboard.diff" 2> "$prefix.nonboard.stderr.log";then outside_raw=0;else outside_raw=$?;fi
            printf '%s\n' "$paths_raw" > "$prefix.paths.raw.exit";printf '%s\n' "$full_raw" > "$prefix.full.raw.exit";printf '%s\n' "$outside_raw" > "$prefix.nonboard.raw.exit"
            test "$paths_raw" -eq 0 || return 2
            [[ "$full_raw" =~ ^[01]$ && "$outside_raw" =~ ^[01]$ ]] || return 2
            GIT_INDEX_FILE="$private_index" git ls-tree "$base" -- docs/WORKBOARD.md > "$prefix.base-board.tsv" || return 2
            GIT_INDEX_FILE="$private_index" git ls-tree "$candidate" -- docs/WORKBOARD.md > "$prefix.candidate-board.tsv" || return 2
            base_board=$(cat "$prefix.base-board.tsv");candidate_board=$(cat "$prefix.candidate-board.tsv")
            [[ "$base_board" =~ ^100644\ blob\ [a-f0-9]{40}$'\t'docs/WORKBOARD.md$ && "$candidate_board" =~ ^100644\ blob\ [a-f0-9]{40}$'\t'docs/WORKBOARD.md$ ]] || { printf 'MENU_MAIN_BOARD_REGULAR_MODE\n' > "$prefix.refusal.txt";return 1; }
            if test "$outside_raw" -ne 0;then printf 'MENU_MAIN_NONBOARD_PATH\n' > "$prefix.refusal.txt";return 1;fi
            if test "$full_raw" -eq 0;then
              test ! -s "$prefix.paths.tsv" || return 2
              printf 'SAME\n' > "$prefix.outcome.txt";return 0
            fi
            if ! printf 'M\tdocs/WORKBOARD.md\n' | cmp - "$prefix.paths.tsv";then printf 'MENU_MAIN_OWNED_BOARD_PATH_ONLY\n' > "$prefix.refusal.txt";return 1;fi
            printf 'BOARD_ONLY\n' > "$prefix.outcome.txt"
          }
          inspect_main_trees "$EXPECTED_MAIN" "$actual_main" "$out/main-actual"
          actual_kind=$(cat "$out/main-actual.outcome.txt")
          for control in board app;do
            if test "$control" = board;then target=docs/WORKBOARD.md;else target=src/App.tsx;fi
            cmp "$private_index" "$out/main-bridge.private.index.before"
            test "$(GIT_INDEX_FILE="$private_index" git write-tree)" = "$base_tree"
            cmp "$private_index" "$out/main-bridge.private.index.before"
            GIT_INDEX_FILE="$private_index" git cat-file blob "$EXPECTED_MAIN:$target" > "$out/control-$control.original.body"
            cp "$out/control-$control.original.body" "$out/control-$control.changed.body"
            printf '\n// QA-only private Git-tree %s control.\n' "$control" >> "$out/control-$control.changed.body"
            original_body_sha=$(sha256sum "$out/control-$control.original.body" | cut -d ' ' -f1)
            changed_body_sha=$(sha256sum "$out/control-$control.changed.body" | cut -d ' ' -f1)
            test "$original_body_sha" != "$changed_body_sha"
            original_blob=$(GIT_INDEX_FILE="$private_index" git rev-parse "$EXPECTED_MAIN:$target")
            changed_blob=$(GIT_INDEX_FILE="$private_index" git hash-object -w "$out/control-$control.changed.body")
            test "$changed_blob" != "$original_blob"
            GIT_INDEX_FILE="$private_index" git update-index --cacheinfo 100644 "$changed_blob" "$target"
            changed_tree=$(GIT_INDEX_FILE="$private_index" git write-tree);test "$changed_tree" != "$base_tree"
            changed_index_sha=$(sha256sum "$private_index" | cut -d ' ' -f1);test "$changed_index_sha" != "$before_index_sha"
            cp "$private_index" "$out/control-$control.changed.index"
            if inspect_main_trees "$base_tree" "$changed_tree" "$out/control-$control";then control_raw=0;else control_raw=$?;fi
            printf '%s\n' "$control_raw" > "$out/control-$control.classifier.raw.exit"
            test "$(cat "$out/control-$control.full.raw.exit")" = 1
            printf 'M\t%s\n' "$target" | cmp - "$out/control-$control.paths.tsv"
            if test "$control" = board;then
              test "$control_raw" = 0;test "$(cat "$out/control-board.nonboard.raw.exit")" = 0;test "$(cat "$out/control-board.outcome.txt")" = BOARD_ONLY
            else
              test "$control_raw" = 1;test "$(cat "$out/control-app.nonboard.raw.exit")" = 1;test "$(cat "$out/control-app.refusal.txt")" = MENU_MAIN_NONBOARD_PATH
            fi
            cp "$out/main-bridge.private.index.before" "$private_index"
            cmp "$private_index" "$out/main-bridge.private.index.before"
            restored_tree=$(GIT_INDEX_FILE="$private_index" git write-tree);test "$restored_tree" = "$base_tree"
            cmp "$private_index" "$out/main-bridge.private.index.before"
            restored_index_sha=$(sha256sum "$private_index" | cut -d ' ' -f1);test "$restored_index_sha" = "$before_index_sha"
            cp "$private_index" "$out/control-$control.restored.index"
            inspect_main_trees "$base_tree" "$restored_tree" "$out/control-$control-restored"
            test "$(cat "$out/control-$control-restored.full.raw.exit")" = 0;test "$(cat "$out/control-$control-restored.nonboard.raw.exit")" = 0;test "$(cat "$out/control-$control-restored.outcome.txt")" = SAME
            printf '{"id":"%s","scope":"REMOTE_PRIVATE_GIT_INDEX_TREE_ONLY","target":"%s","classifierRaw":%s,"fullDiffRaw":1,"outsideBoardDiffRaw":%s,"originalBodySHA256":"%s","changedBodySHA256":"%s","originalBlob":"%s","changedBlob":"%s","beforeTree":"%s","changedTree":"%s","restoredTree":"%s","beforeIndexSHA256":"%s","changedIndexSHA256":"%s","restoredIndexSHA256":"%s","samePrivateIndexBytesAndTreeRestored":true,"workingSourceChanged":false,"refWritten":false}\n' "$control" "$target" "$control_raw" "$(cat "$out/control-$control.nonboard.raw.exit")" "$original_body_sha" "$changed_body_sha" "$original_blob" "$changed_blob" "$base_tree" "$changed_tree" "$restored_tree" "$before_index_sha" "$changed_index_sha" "$restored_index_sha" >> "$out/main-bridge-controls.jsonl"
          done
          GIT_OPTIONAL_LOCKS=0 git diff --exit-code HEAD;test -z "$(GIT_OPTIONAL_LOCKS=0 git status --porcelain --untracked-files=no)"
          sha256sum -c "$out/default-index.before.sha256" > "$out/default-index-held.log"
          git for-each-ref --format='%(refname) %(objectname)' > "$out/refs.after.txt";cmp "$out/refs.before.txt" "$out/refs.after.txt"
          printf '{"schema":1,"status":"ACTUAL_MAIN_SAME_OR_REGULAR_WORKBOARD_ONLY_WITH_PHYSICAL_PRIVATE_TREE_CONTROLS","source":"%s","productParent":"%s","mainAtPlan":"%s","mainAtStart":"%s","compatibility":"%s","nonBoardDiffRaw":0,"positiveBoardControl":true,"negativeAppControl":true,"samePrivateIndexBytesAndTreeRestored":true,"defaultIndexAndRefsHeld":true,"sourceOrRefMutation":false}\n' "$GITHUB_SHA" "$EXPECTED_PARENT" "$EXPECTED_MAIN" "$actual_main" "$actual_kind" > "$out/MAIN-BOARD-COMPATIBILITY-ADMISSION.json"
          origin_main=$(git rev-parse --verify 'origin/main^{commit}')
          inspect_main_trees "$EXPECTED_MAIN" "$origin_main" "$out/main-origin-reference"
          echo "SEO_ORIGIN_MAIN_BASE_SHA=$origin_main" >> "$GITHUB_ENV"
          git diff --name-status "$EXPECTED_PARENT" HEAD > "$out/proof-diff.txt"
          printf 'A\t.github/workflows/stadium-plan-qualified.yml\nA\tscripts/qa/playStadiumLatePlan.mjs\n' > "$out/expected-proof-diff.txt"
          cmp "$out/proof-diff.txt" "$out/expected-proof-diff.txt"
          test "$(git ls-files | wc -l)" -eq 5460
          test "$(git rev-list --parents -n1 "$EXPECTED_PARENT")" = "7fc9b3b3f8fe1170531cefc759b25078720d2c52 95180982947fb734cf54993a58346bc5db5c0566"
          test "$(git rev-parse HEAD:scripts/sweepWeight.mjs)" = 084cce2062686259437cd2a334093a561c819c36
          test "$(sha256sum scripts/qa/playStadiumLatePlan.mjs | cut -d' ' -f1)" = f1d4b7c79dd23b5e66f7cf129a4ebc3c2ceda93b231e7b8950f3cc4816a502ed
          test "$(sha256sum src/lib/stadiumTycoon.ts | cut -d' ' -f1)" = "$STADIUM_ENGINE_SHA256"
          test "$(git rev-parse HEAD:src/lib/stadiumTycoon.ts)" = b01fb7b2555f1528fadb2506c862c5b16eea878f
          cat > "$out/MEASURED-ENGINE-BINDING.json" <<'MODEL_BINDING'
          {"schema":1,"status":"ROOT_ADMITTED_CALIBRATION_FROZEN_SELECTION_APP_QUALIFICATION_ONLY","fullEngineByteIdentity":true,"calibrationAdmitted":true,"selectionFrozen":true,"engineSHA256":"bd510c2277e61eef5e7cbcf4f283c07124735c8f25b6503297fc61e477a0c428","engineGitBlob":"b01fb7b2555f1528fadb2506c862c5b16eea878f","engineBytes":89101,"calibrationAdmissionSHA256":"9c16285fbe15a171fe06f74e41e7154180c2ef52b4be9a5576ed1902aa522b1b","frozenDecisionSHA256":"7124d1cb89215fb1330092d14fdf739c9dbb3ee7c2355879e58a5709f0663e81","sourceControlsAdmitted":false,"sourceControlsAdmissionSHA256":null,"holdoutAdmitted":false,"holdoutAdmissionSHA256":null,"selectedPoints":4,"holdoutRun":"40986510704","finalReady":false}
          MODEL_BINDING
          cat > "$out/expected-product-descriptors.tsv" <<'PRODUCT_DESCRIPTORS'
          M	docs/PROJECT-STATE.md	83805e4ad8e5c95ef83f812a709495c6dc0aef9f	1988690	100644
          A	public/sport-glyphs.svg	b2661a108a193fd86792041eea11e8fec5754a68	3074	100644
          M	scripts/simHomeFront.mjs	4cef66b4ce9abe96b968de2f2c626da76ab128ef	52585	100644
          M	scripts/simResultMoment.mjs	a859e32f726d73c77e9ec5168a1fbb0906552f47	37553	100644
          M	scripts/simSeasonVerdict.mjs	45ee96944cfcc81a39dd71d320b6ca0d877e718f	14686	100644
          M	src/App.tsx	79da1b8cf2de7870ea216703d0a1a56fceb69673	35925	100644
          M	src/components/game/GameNavbar.tsx	9fbcece74a9222bd2a7d1ec5a2e500212ad4cf6d	13258	100644
          M	src/components/game/GameShell.tsx	8f330dabef80aeb8f205de831d4406147cceeb49	6452	100644
          M	src/components/guess-the-nation/GuessTheNationBoard.tsx	fc7d5ed6df710694cd9b2572de6cded9f1f5e849	18758	100644
          M	src/components/guess-year/GuessTheYearBoard.tsx	f14d9af58d3262d7ef5ccf849f088484cdf18640	8997	100644
          M	src/components/hof-or-bust/HofOrBustBoard.tsx	6c2e715606d6c2649a309a58711104d5ce0c2023	8935	100644
          M	src/components/home/SportGlyph.tsx	511b9ec4498e2ff7c0234551681fbde152ed1fee	1288	100644
          M	src/components/layout/Header.tsx	2340ee64d5b3c49ffb89e3c37e54e42c96d239b0	11515	100644
          M	src/components/layout/SiteMenu.tsx	26ecdad990a15f8361f281015311d010b74b7de6	3127	100644
          A	src/components/layout/SiteMenuHost.tsx	a5bdf4e40ae8d5ca3257bef229d98270ce425a3b	2327	100644
          M	src/components/layout/SiteMenuPanel.tsx	cd71514c0d72168f4064c0c8d7b7719095c698e8	5771	100644
          M	src/components/score-predictor/ScorePredictorBoard.tsx	4ab827496ebcf9f28c29e49009fc1851779f7189	8288	100644
          M	src/data/gameContent/stadiumManagement.ts	d0a1b86323f139f63b7472e4197000d51e6fca64	16851	100644
          M	src/data/searchKeywords.json	c5047373cab38b069637f315c96a0e133e3b84ee	10975	100644
          M	src/hooks/useStadiumTycoon.ts	02caf5cb467cf14f30542d2fa89c968648adace0	25982	100644
          M	src/lib/stadiumTycoon.ts	b01fb7b2555f1528fadb2506c862c5b16eea878f	89101	100644
          M	src/pages/StadiumTycoon.tsx	6195b1dcd11ae032eebfad349913de81be504b89	69491	100644
          A	src/test/SiteMenu.finder.test.tsx	dca14996069a9a82edf63f08b8abbf691385f362	15821	100644
          A	src/test/SiteMenu.page-chrome.test.tsx	be4c51b559af62da3544d2a28f7cfc35eb220d6e	8186	100644
          A	src/test/tycoonMatchPlan.test.tsx	e9d9da16e79bc8cdde957a05ce00af4e33c00cb8	15172	100644
          A	src/test/tycoonMatchPlanPage.test.tsx	08c9709ebc6ae4b3cbb5eac5271c24f3fb769df7	8408	100644
          PRODUCT_DESCRIPTORS
          git diff --name-status "$EXPECTED_MAIN" "$EXPECTED_PARENT" > "$out/product-paths.actual.tsv"
          cut -f1,2 "$out/expected-product-descriptors.tsv" > "$out/product-paths.expected.tsv"
          cmp "$out/product-paths.expected.tsv" "$out/product-paths.actual.tsv"
          test "$(git ls-tree -r "$EXPECTED_PARENT" | wc -l)" -eq 5458
          : > "$out/product-descriptors.actual.tsv"
          while IFS=$'\t' read -r status file blob bytes mode;do
            [[ "$status" =~ ^[AM]$ && "$blob" =~ ^[a-f0-9]{40}$ && "$bytes" =~ ^[0-9]+$ && "$mode" =~ ^100(644|755)$ ]]
            test "$(git cat-file -t "$blob")" = blob;test "$(git cat-file -s "$blob")" -eq "$bytes"
            test "$(git ls-tree "$EXPECTED_PARENT" -- "$file")" = "$mode blob $blob"$'\t'"$file"
            test "$(git rev-parse "HEAD:$file")" = "$blob"
            printf '%s\t%s\t%s\t%s\t%s\n' "$status" "$file" "$blob" "$bytes" "$mode" >> "$out/product-descriptors.actual.tsv"
          done < "$out/expected-product-descriptors.tsv"
          cmp "$out/expected-product-descriptors.tsv" "$out/product-descriptors.actual.tsv"
          test "$(wc -l < "$out/product-descriptors.actual.tsv")" -eq 26
          git ls-files -z | sort -z > "$out/source-members.initial"
          xargs -0 sha256sum < "$out/source-members.initial" > "$out/source.initial.sha256"
          git ls-files --others --exclude-standard -z | sort -z > "$out/untracked.initial"
          git archive --format=tar HEAD > "$out/source.tar"
          git rev-parse HEAD HEAD^{tree} "$EXPECTED_PARENT" "$EXPECTED_PRODUCT_TREE" origin/main > "$out/source-refs.txt"
          printf '{"scope":"Stadium late-match plan selected source plus Menu composition","plannedMain":"%s","observedMain":"%s","shippingSourceImmutable":true,"matchedCopyReleaseOutputsUnshipped":true,"sourceRegularFiles":5460,"productRegularFiles":5458,"qaAdditions":2,"fullDefaultVitest":"PENDING_ACTUAL","fullBuildSeo":"PENDING_IMMUTABLE_REUSE_40992998801_A1_PRODUCER_09D3_ONLY","freshRemainder":"REQUIRED","derivedGuideFixture":"PENDING_ROUTE_ONLY_DOUBLE_REFRESH","defaultNodeSims":"PENDING_ACTUAL","browserDefaultRunnerGroup":"EXCLUDED_BY_UNCHANGED_SOURCE","optionalDatabaseProfiles":"NO_LIVE_PERMISSION","engineMeasurementBinding":"MEASURED-ENGINE-BINDING.json","mergeOrPublicationClaim":false}\n' "$EXPECTED_MAIN" "$actual_main" > "$out/SCOPE.json"
      - name: Actual full-history six references and fourteen physical source bodies
        id: history
        run: |
          set -euo pipefail
          out="$PLACEMENT_OUT";set +e
          (
            set -euo pipefail
          mkdir "$out/historical-source"
          cat > "$out/historical-ref-paths.expected.tsv" <<'HISTORICAL_PATHS'
          56356be9	src/lib/frontOffice.ts
          56356be9	src/data/frontOfficePlayers.ts
          56356be9	src/data/frontOfficeDepth.ts
          0c66a559	src/lib/frontOffice.ts
          0c66a559	src/data/frontOfficePlayers.ts
          0c66a559	src/data/frontOfficeDepth.ts
          e8b39ccc	src/lib/nbaFrontOffice.ts
          e8b39ccc	src/lib/nbaSeasonStats.ts
          e8b39ccc	src/lib/nbaRotation.ts
          e8b39ccc	src/data/conquestDataNba.ts
          6b7596d2	src/lib/nhlFrontOffice.ts
          6b7596d2	src/data/nhlFoPlayers.ts
          2b7dda2951fb9b63e76a2af66970cb682f312105	src/lib/cageClash.ts
          31a4ec01	src/lib/cageClash.ts
          HISTORICAL_PATHS
          : > "$out/historical-ref-paths.actual.tsv"
          while IFS=$'\t' read -r ref file;do
            commit=$(git rev-parse --verify "$ref^{commit}");blob=$(git rev-parse --verify "$ref:$file");test "$(git cat-file -t "$blob")" = blob
            saved="$out/historical-source/$ref/$file";mkdir -p "$(dirname "$saved")";git cat-file blob "$blob" > "$saved"
            bytes=$(git cat-file -s "$blob");test "$bytes" -gt 0;test "$(wc -c < "$saved")" -eq "$bytes";bodysha=$(sha256sum "$saved" | cut -d ' ' -f1)
            printf '%s\t%s\t%s\t%s\t%s\t%s\n' "$ref" "$commit" "$file" "$blob" "$bytes" "$bodysha" >> "$out/historical-ref-paths.actual.tsv"
          done < "$out/historical-ref-paths.expected.tsv"
          test "$(wc -l < "$out/historical-ref-paths.actual.tsv")" -eq 14;test "$(cut -f1 "$out/historical-ref-paths.actual.tsv" | sort -u | wc -l)" -eq 6
          find "$out/historical-source" -type f -print0 | sort -z | xargs -0 sha256sum > "$out/historical-source.sha256"
          ) > "$out/history-preflight.stdout.log" 2> "$out/history-preflight.stderr.log"
