            tr '\0' '\n' < "$out/qualified-untracked.final" | grep -Ev '^public/' > "$out/qualified-untracked.nonrelease.final" || true
            cmp "$out/qualified-untracked.nonrelease.initial" "$out/qualified-untracked.nonrelease.final" || failed=1
            node <<'SOURCE_HOLD' || failed=1
          const fs=require('node:fs'),a=require('node:assert/strict'),out=process.env.PLACEMENT_OUT;
          const parse=name=>new Map(fs.readFileSync(out+'/'+name,'utf8').trimEnd().split('\n').map(x=>{a.match(x,/^[a-f0-9]{64}  /);return[x.slice(66),x.slice(0,64)]}));
          const before=parse('qualified.initial.sha256'),after=parse('qualified.final.sha256');a.deepEqual([...before.keys()],[...after.keys()]);
          const changed=[...before].filter(([file,sha])=>after.get(file)!==sha).map(([file])=>file);
          for(const file of changed)a.ok(file.startsWith('public/')||file==='scripts/data/lastmod.json'||file==='scripts/data/guideHeadingsFrozen.json','No app or QA source changes in matched copy: '+file);
          fs.writeFileSync(out+'/QUALIFIED-SOURCE-HOLD.json',JSON.stringify({source:process.env.GITHUB_SHA,head:process.env.EXPECTED_PARENT,mainAtPlan:process.env.EXPECTED_MAIN,mainAtStart:process.env.ACTUAL_MAIN_AT_START,shippingSourceClaim:'immutable',matchedSourceFiles:before.size,allowedChangedFiles:changed,releaseOutputsUnshipped:true,derivedGuideFixtureUnshipped:true,reusedSeoInput:'REUSED-FULL-SEO-INPUT.json',defaultNodeSims:'SEE_ACTUAL_PARENT_SCOPE_AND_PRINTED_EXCLUSIONS',fullDefaultVitest:'SEE_ACTUAL_SOURCE_BOUND_CASE_RECEIPT'},null,2)+'\n',{flag:'wx'});
          SOURCE_HOLD
            if test -f "$out/dist.sha256"; then
              for pair in "deps:$GITHUB_WORKSPACE/node_modules" "browser:$PLACEMENT_TOOLS" "fonts:$FREE_KICK_FONT_CACHE" "dist:dist"; do
                label="${pair%%:*}"; dir="${pair#*:}"
                find "$dir" -type f -print0 | sort -z > "$out/$label.members.final"
                cmp "$out/$label.members" "$out/$label.members.final" || failed=1
                sha256sum -c "$out/$label.sha256" > "$out/$label-held.log" 2>&1 || failed=1
              done
              find "$GITHUB_WORKSPACE/node_modules" -type l -printf '%p -> %l\n' | sort > "$out/dependency-links.final"
              sha256sum -c "$out/generated-helpers.sha256" > "$out/generated-helpers-held.log" 2>&1 || failed=1
              cmp "$out/dependency-links.before" "$out/dependency-links.final" || failed=1
              find public -type f -print0 | sort -z > "$out/qualified-public.members.final"
              cmp "$out/qualified-public.members" "$out/qualified-public.members.final" || failed=1
              sha256sum -c "$out/qualified-public.sha256" > "$out/qualified-public-held.log" 2>&1 || failed=1
              cmp scripts/data/lastmod.json "$out/qualified-lastmod.json" || failed=1
            else
              printf 'UNRUN: admitted prior SEO reuse and complete dist/font archives not available\n' > "$out/BUILD-ARCHIVES-UNRUN.txt"
              if test -d dist; then tar -cf "$out/available-dist.tar" -C dist .; fi
              if test -d "$FREE_KICK_FONT_CACHE"; then tar -cf "$out/font-cache.tar" -C "$FREE_KICK_FONT_CACHE" .; fi
            fi
          else failed=1; fi
          if test -f "$out/helpers.initial.sha256"; then sha256sum -c "$out/helpers.initial.sha256" > "$out/helpers-held.log" 2>&1 || failed=1; else failed=1; fi
          if test -f "$out/historical-source.sha256";then sha256sum -c "$out/historical-source.sha256" > "$out/historical-source.final-held.log" 2>&1 || failed=1;else failed=1;fi
          printf '%s\n' "$failed" > "$out/final-holds.exit"
