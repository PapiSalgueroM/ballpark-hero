            printf '{"status":"PRIOR_IMMUTABLE_FULL_SEO_JOINED_WITH_FRESH_CONTINUATION_GATES_COMPLETE","fullBuildSeo":{"executedInCurrentRun":false,"producer":"09d3e0b2bfad0d93818975af89ad11c0ef55cf4d","run":40992998801,"attempt":1,"originalRawGate":"reused-input/run-40992998801-a1/gates/full-build-seo","originalRunRemainsFailed":true},"freshGateScope":"TYPES_PAGE_CAPS_UNITS_READERS_DEFAULT_SIMS_FULL_CURRENT_SEO_BROWSER_AND_CONTROLS","derivedFixture":"qualified-guideHeadingsFrozen.json","source":"%s","parent":"%s","mainAtPlan":"%s","mainAtStart":"%s","wholeEngineSHA256":"%s","matchedCopyOnlyReleaseOutputs":true,"defaultVitestOptionalProfiles":"EXACT58_SOURCE_SKIPPED_UNRUN","defaultSimBrowserGroup":"SOURCE_EXCLUDED_UNRUN","simDatabaseProfiles":"ONLY_ACTUAL_SOURCE_CLASSIFIED_SKIPS_UNRUN","parentSimOutcomeAndPrintedStatusesOnly":true,"sourceAndOutputHolds":true,"visualOriginalReviewStillOwed":true,"separateEngineHoldoutBindingRequired":true,"noMergeOrPublicationClaim":true}\n' "$GITHUB_SHA" "$EXPECTED_PARENT" "$EXPECTED_MAIN" "$ACTUAL_MAIN_AT_START" "$STADIUM_ENGINE_SHA256" > "$out/QUALIFICATION-STATUS.json"
          else
            printf '{"status":"PARTIAL_OR_FAILED_NO_COMBINED_QUALIFICATION_CREDIT","priorJobStatus":"%s","finalHoldsRaw":%s}\n' "$PRIOR_JOB_STATUS" "$failed" > "$out/QUALIFICATION-STATUS.json"
          fi
