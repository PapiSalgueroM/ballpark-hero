          fs.writeFileSync(out+'/guide-fixture/CONTROL.json',JSON.stringify({schema:1,id:'missing-new-stadium-howToPlay-line',scope:'ACTUAL_GUARD_MATCHED_COPY_FIXTURE_ONLY',source:process.env.GITHUB_SHA,beforeSHA256:sha(before),changedSHA256:sha(changed),restoredSHA256:sha(restored),changedBytes:true,negativeRaw:1,onlySection:1,onlyFailureRows:1,positiveRaw:0,restoredRaw:0,sameCanonicalFixtureRestored:true,featurePassCredit:false},null,2)+'\n',{flag:'wx'});
          NODE
      - name: Actual default Vitest selection, callback errors and exact source-owned skips
        run: |
          set -euo pipefail
          cd "$QUALIFICATION_ROOT"; source "$PLACEMENT_OUT/helpers/run-gate.sh"
          GATE_TIMEOUT=5500s run_gate full-default-vitest 0 '^MENU_PLACEMENT_DEFAULT_SUITE:' node "$PLACEMENT_OUT/helpers/full-suite.cjs"
      - name: Bind complete regenerated dist, installed tools and prepared fonts
        run: |
          set -euo pipefail
          cd "$QUALIFICATION_ROOT"; out="$PLACEMENT_OUT"
          for pair in "deps:$GITHUB_WORKSPACE/node_modules" "browser:$PLACEMENT_TOOLS" "fonts:$FREE_KICK_FONT_CACHE" "dist:dist"; do
            label="${pair%%:*}"; dir="${pair#*:}"
            find "$dir" -type f -print0 | sort -z > "$out/$label.members"
            xargs -0 sha256sum < "$out/$label.members" > "$out/$label.sha256"
          done
          find "$GITHUB_WORKSPACE/node_modules" -type l -printf '%p -> %l\n' | sort > "$out/dependency-links.before"
          tar -cf "$out/dist.tar" -C dist .
          tar -cf "$out/font-cache.tar" -C "$FREE_KICK_FONT_CACHE" .
          sha256sum "$out/helpers/"* "$out/weights-cached-fonts.cjs" > "$out/generated-helpers.sha256"
          find dist/assets -type f -print0 | sort -z > "$out/final-assets.members"
          cmp "$out/early-assets.members" "$out/final-assets.members"
          sha256sum -c "$out/early-assets.sha256" > "$out/cap-code-held-through-full-seo.log"
          sha256sum -c "$out/historical-source.sha256" > "$out/historical-source-held.log"
          git diff --name-only > "$out/qualified-release-diff.initial.txt"
          if grep -Ev '^(public/|scripts/data/lastmod\.json$|scripts/data/guideHeadingsFrozen\.json$)' "$out/qualified-release-diff.initial.txt"; then exit 1; fi
      - name: All saved-site fences, copy readers and real current SEO draw
        run: |
          set -euo pipefail
          cd "$QUALIFICATION_ROOT"; source "$PLACEMENT_OUT/helpers/run-gate.sh"
          out="$PLACEMENT_OUT"; : > "$out/final-server.transport"
          SIM_OFFLINE_RECEIPT="$out/final-server.transport" NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/lib/hostLikeServer.mjs dist 4173 > "$out/final-server.log" 2>&1 & server=$!
          trap 'kill "$server" 2>/dev/null || true; wait "$server" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi; sleep 1; done
          curl --fail --silent http://127.0.0.1:4173/ > /dev/null
          export BASE=http://127.0.0.1:4173 SWEEP_BASE=http://127.0.0.1:4173
          for method in simAdsense simBrand simHeadTags simHiddenPages simHubs simIndexNow simIndexing simInternalLinks simNoRivalNames simPrerender simPrerenderBoot simRetiredRoutes simSchema simSitemap simSnapshotAssets simHomeCopy simHomeFront simSiteSearch simSeoTitles simTrustCopy simGuideHeadings playHomeFold; do
            closing="^$method: green\\."
            case "$method" in
              simNoRivalNames) closing='^No rival product names found\. 0 findings\.$' ;;
              simRetiredRoutes) closing='^simRetiredRoutes: all green' ;;
            esac
            run_gate "$method" 0 "$closing" env RC_OUT="$out/reader-images/$method" node "scripts/$method.mjs"
          done
          unset SEO_SPLIT_ONLY SEO_SPLIT_CONTROL SEO_SPLIT_SETTLE SEO_SPLIT_STATIC SEO_SPLIT_BASE_REF
          run_gate seo-origin-main-static 0 '^   ok  [0-9]+ routes in origin/main.s table;.*0 route\(s\) disagree$' env SEO_SPLIT_STATIC=1 node scripts/simSeoMetaSplit.mjs
          GATE_TIMEOUT=3600s run_gate seo-head-full-current 0 '^simSeoMetaSplit: green\.' env SEO_SPLIT_BASE_REF=HEAD node scripts/simSeoMetaSplit.mjs
          run_gate home-copy-module-control 0 '^simHomeCopy control moduledrift: green\. The planted break was reported by part 6 and nothing else failed\.$' env HOME_COPY_CONTROL=moduledrift node scripts/simHomeCopy.mjs
          test ! -s "$out/final-server.transport"
      - name: Unchanged default node-sim dispatch with full printed child output
        run: |
          set -euo pipefail
