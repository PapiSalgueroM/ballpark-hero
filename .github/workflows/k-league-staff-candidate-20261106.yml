name: K League focused Staff candidate qualification
on:
  push:
    branches: [codex/k-league-staff-candidate-20261106]
permissions:
  contents: read
  actions: read
concurrency:
  group: k-league-staff-candidate-${{ github.ref }}
  cancel-in-progress: false
env:
  CI: '1'
  TZ: UTC
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: qa-source
          fetch-depth: 13
          filter: blob:none
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 3b14650d360b010b25b525de33a5f32f33de2798
          path: source-main
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: a6b0b19c4256d2e8aecd70e774e295d964512ee7
          path: source-current
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Materialize the focused candidate controller
        if: always()
        run: |
          set -euo pipefail
          QA_OUT="$RUNNER_TEMP/k-league-staff-candidate"
          STAFF_CONTROLLER="$RUNNER_TEMP/k-league-staff-candidate-controller.mjs"
          QA_REF="$RUNNER_TEMP/k-league-staff-candidate-reference"
          export QA_OUT STAFF_CONTROLLER QA_REF
          printf 'QA_OUT=%s\nSTAFF_CONTROLLER=%s\nQA_REF=%s\n' "$QA_OUT" "$STAFF_CONTROLLER" "$QA_REF" >> "$GITHUB_ENV"
          test ! -e "$QA_OUT"
          test ! -e "$QA_REF"
