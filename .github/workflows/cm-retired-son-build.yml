name: Club Manager retired son build qualification
on:
  push:
    branches: [codex/cm-retired-son-build-20261031]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: 'true'
      SIM_NETWORK: offline
      GIT_OPTIONAL_LOCKS: '0'
      EXPECTED_MAIN: 19911f815ac713e8d3718cd0ee8592942a18fd00
      EXPECTED_PARENT: 48880a35d508bce9b634a9502927eb3315ca636b
      EXPECTED_TREE: a69d4f81fd421ec618bb5c503647b1efbde91279
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Bind fixed family feature and build-only proof
        run: |
          set -euo pipefail
          runner_temp=$(realpath "$RUNNER_TEMP")
          workspace=$(realpath "$PWD")
          case "$runner_temp/" in "$workspace/"*) exit 1;; esac
          out="$runner_temp/cm-retired-son-build"
          test ! -e "$out"
          mkdir -p "$out/helpers" "$out/runtime-tmp"
          echo "CM_FAMILY_BUILD_OUT=$out" >> "$GITHUB_ENV"
          echo "PLACEMENT_OUT=$out" >> "$GITHUB_ENV"
          echo "FREE_KICK_FONT_CACHE=$out/font-cache" >> "$GITHUB_ENV"
          echo "TMPDIR=$out/runtime-tmp" >> "$GITHUB_ENV"
          test "$GITHUB_REF_NAME" = codex/cm-retired-son-build-20261031
          test "$(git rev-list --parents -n1 HEAD)" = "$GITHUB_SHA $EXPECTED_PARENT"
          test "$(git rev-list --parents -n1 "$EXPECTED_PARENT")" = "$EXPECTED_PARENT $EXPECTED_MAIN"
          test "$(git rev-parse "$EXPECTED_PARENT^{tree}")" = "$EXPECTED_TREE"
          test "$(git ls-files | wc -l)" -eq 5631
          git diff --name-status "$EXPECTED_MAIN" "$EXPECTED_PARENT" > "$out/product.paths"
          printf 'M\tsrc/components/club-manager/AcademyScreen.tsx\nM\tsrc/components/club-manager/ClubManagerHelp.tsx\nM\tsrc/lib/clubManager.ts\nM\tsrc/pages/ClubManager.tsx\nA\tsrc/test/clubManagerRetiredSon.test.ts\n' > "$out/expected-product.paths"
          cmp "$out/product.paths" "$out/expected-product.paths"
          git diff --name-status "$EXPECTED_PARENT" HEAD > "$out/proof.paths"
          printf 'A\t.github/workflows/cm-retired-son-build.yml\n' > "$out/expected-proof.paths"
          cmp "$out/proof.paths" "$out/expected-proof.paths"
          test "$(git hash-object src/lib/clubManager.ts)" = eb08e06ad31762a058688d66e36aabebaec190c3
          test "$(git hash-object src/components/club-manager/AcademyScreen.tsx)" = c6a3c10fae54380d9744387249fc6df74c1e8dee
          test "$(git hash-object src/components/club-manager/ClubManagerHelp.tsx)" = 8d96271103035dbfdb83f6294d840c35175ddddb
          test "$(git hash-object src/pages/ClubManager.tsx)" = d243cedf40a1f2375d01138e27f3a432ba20bd26
          test "$(git hash-object src/test/clubManagerRetiredSon.test.ts)" = 35e576d6f657c8a7b9335e22f4b2009c7a048be6
          test "$(git hash-object src/hooks/useClubManager.ts)" = 7297073ea60b93501df48ea9b7dfc74edd2217de
          test "$(git hash-object src/lib/saveFence.ts)" = 1de45b573fd866433eb0982495af927a5427e8f4
          test "$(git hash-object src/lib/clubManagerSlots.ts)" = cd1a683637ce1fa0444b86b1cff46821aa75127d
          test "$(git hash-object src/lib/keyedRng.ts)" = acfd3a0a410e03ac0950953aa05b82e4c46e004f
          test "$(git hash-object src/lib/clubManagerEras.ts)" = fa604790c580845ed9b91aef407e205383b4012b
          test "$(git hash-object scripts/lib/hostLikeServer.mjs)" = 21059d5e8114669df61106c125d5272d357b6236
          test "$(git hash-object scripts/lib/playwrightLoader.mjs)" = 4f7739e217e0a47ee82e6bfc8be1c04bed17454a
          test "$(git hash-object scripts/qa/siteMenuNavigationSupport.mjs)" = 7909ce5805171367646e17a468fd919b88ad710e
          test "$(git hash-object scripts/sweepWeight.mjs)" = 21d47bdf97c1d7a924dc0d9f6825c09bfbdc0c85
          test "$(git hash-object package.json)" = 2ff64986fb76ebc51b706f2fd24765768874008a
          test "$(git hash-object package-lock.json)" = 97d6f12a052f25f400462938c241789a083f0bfe
          test "$(git hash-object vitest.config.ts)" = ed2a9dc677f77dfe95c061064eeff5782b856864
          git ls-files -z | sort -z > "$out/source-members.initial"
          xargs -0 sha256sum < "$out/source-members.initial" > "$out/source.initial.sha256"
          git ls-files --others --exclude-standard -z | sort -z > "$out/untracked.initial"
          test ! -s "$out/untracked.initial"
          git for-each-ref --format='%(refname) %(objectname)' > "$out/refs.before"
          git rev-parse HEAD > "$out/head.txt"
          git rev-parse 'HEAD^{tree}' > "$out/tree.txt"
          git archive --format=tar HEAD > "$out/source.tar"
          : > "$out/helpers.sha256"
          cat > "$out/helpers/run.sh" <<'RUN'
          run() {
            local id="$1" budget="$2"; shift 2
            local raw=0
            : > "$CM_FAMILY_BUILD_OUT/$id.transport"
            { printf '%q ' "$@"; printf '\n'; } > "$CM_FAMILY_BUILD_OUT/$id.command"
            NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$CM_FAMILY_BUILD_OUT/$id.transport" FORCE_COLOR=0 env -u NO_COLOR timeout --signal=TERM --kill-after=15s "$budget" "$@" > "$CM_FAMILY_BUILD_OUT/$id.stdout" 2> "$CM_FAMILY_BUILD_OUT/$id.stderr" || raw=$?
            printf '%s\n' "$raw" > "$CM_FAMILY_BUILD_OUT/$id.exit"
            test ! -s "$CM_FAMILY_BUILD_OUT/$id.transport"
          }
          RUN
          sha256sum "$out/helpers/run.sh" >> "$out/helpers.sha256"
      - name: Locked dependencies and actual application types
        run: |
          set -euo pipefail
          out="$CM_FAMILY_BUILD_OUT"
          raw=0
          env -u NODE_OPTIONS npm ci > "$out/npm-ci.stdout" 2> "$out/npm-ci.stderr" || raw=$?
          printf '%s\n' "$raw" > "$out/npm-ci.exit"
          test "$raw" -eq 0
          raw=0
          : > "$out/types.transport"
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$out/types.transport" timeout --signal=TERM --kill-after=15s 3m node node_modules/typescript/bin/tsc --noEmit -p tsconfig.app.json > "$out/types.stdout" 2> "$out/types.stderr" || raw=$?
          printf '%s\n' "$raw" > "$out/types.exit"
          test "$raw" -eq 0
          test ! -s "$out/types.stdout"
          test ! -s "$out/types.stderr"
          test ! -s "$out/types.transport"
      - name: Isolated exact Playwright and real prepared fonts
        run: |
          set -euo pipefail
          out="$CM_FAMILY_BUILD_OUT";tools="$RUNNER_TEMP/cm-retired-son-build-tools";test ! -e "$tools"
          env -u NODE_OPTIONS npm install --prefix "$tools" --no-save --package-lock=false playwright@1.64.0 > "$out/browser-install.log" 2>&1
          test ! -e node_modules/playwright;test ! -e node_modules/playwright-core
          ln -s "$tools/node_modules/playwright" node_modules/playwright;ln -s "$tools/node_modules/playwright-core" node_modules/playwright-core
          export PLAYWRIGHT_BROWSERS_PATH="$tools/browsers"
          echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV";echo "CM_FAMILY_BUILD_TOOLS=$tools" >> "$GITHUB_ENV";echo "PLACEMENT_TOOLS=$tools" >> "$GITHUB_ENV"
          executable=$(node -e 'const a=require("node:assert/strict");a.equal(require("playwright/package.json").version,"1.64.0");a.equal(require("playwright-core/package.json").version,"1.64.0");process.stdout.write(require("playwright").chromium.executablePath())')
          if test ! -f "$executable";then env -u NODE_OPTIONS node "$tools/node_modules/playwright/cli.js" install chromium > "$out/chromium-install.log" 2>&1;fi
          test -f "$executable";printf '%s\n' "$executable" > "$out/chromium.path"
          env -u NODE_OPTIONS node scripts/qa/freeKickLab1070.mjs --prefetch-fonts-only > "$out/font-prefetch.log" 2>&1
          sha=$(sha256sum "$FREE_KICK_FONT_CACHE/manifest.json" | cut -d' ' -f1);echo "FONT_CACHE_MANIFEST_SHA256=$sha" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Existing Brand-reader Python tools only
        run: |
          env -u NODE_OPTIONS python -m pip install fonttools pillow > "$CM_FAMILY_BUILD_OUT/python-install.log" 2>&1
          python -m pip freeze > "$CM_FAMILY_BUILD_OUT/python-packages.initial"
      - name: Actual Vite manifest build and post-build inventories
        id: build
        run: |
          set -euo pipefail
          out="$CM_FAMILY_BUILD_OUT";source "$out/helpers/run.sh"
          run build 5m npm run build -- --manifest;test "$(cat "$out/build.exit")" -eq 0
          test -f dist/.vite/manifest.json
          sha256sum -c "$out/source.initial.sha256" > "$out/source.prebrowser-held.log"
          for pair in "deps:node_modules" "tools:$CM_FAMILY_BUILD_TOOLS" "fonts:$FREE_KICK_FONT_CACHE" "dist:dist";do
            label="${pair%%:*}";dir="${pair#*:}";find "$dir" -type f -print0 | sort -z > "$out/$label.members";xargs -0 sha256sum < "$out/$label.members" > "$out/$label.sha256"
          done
          find node_modules -type l -printf '%p -> %l\n' | sort > "$out/dependency-links.before"
          tar -cf "$out/dist.tar" -C dist .;tar -cf "$out/font-cache.tar" -C "$FREE_KICK_FONT_CACHE" .
      - name: All sixteen current Main fatal page caps
        id: caps
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
