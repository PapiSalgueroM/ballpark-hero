name: NBA planning bench verification

on:
  pull_request:
    paths:
      - .github/workflows/nba-planning.yml
      - src/pages/NbaConnections.tsx
      - src/hooks/useNbaConnections.ts
      - src/lib/nbaConnectionDrafts.ts
      - src/components/nba-connections/**
      - src/test/nbaPlanningBench.test.tsx
      - scripts/simNbaPlanningBench.mjs
      - scripts/qa/nbaPlanning1003*

permissions:
  contents: read
concurrency:
  group: nba-planning-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    env:
      SIM_NETWORK: offline
      ENGINES: chromium
      VITEST_MAX_FORKS: 1
      VITEST_MIN_FORKS: 1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verification dependencies
        run: |
          mkdir -p nba-planning-artifacts
          npm ci
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          python -m pip install fonttools pillow
      - name: Type check and build
        id: build
        run: |
          node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee nba-planning-artifacts/types.log
          npm run build 2>&1 | tee nba-planning-artifacts/build.log
      - name: Refresh the release snapshot on the remote runner
        # Remove this one-time refresh once the generated files are committed.
        # The final verification run must check the committed snapshots unchanged.
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          PRERENDER_ONLY=/whats-new node scripts/prerender.mjs 2>&1 | tee nba-planning-artifacts/snapshot.log
          node scripts/genSitemap.mjs 2>&1 | tee nba-planning-artifacts/sitemap-refresh.log
          cp public/sitemap.xml dist/sitemap.xml
          mkdir -p nba-planning-artifacts/generated/public/whats-new nba-planning-artifacts/generated/scripts/data
          cp public/whats-new/index.html nba-planning-artifacts/generated/public/whats-new/index.html
          cp public/sitemap.xml nba-planning-artifacts/generated/public/sitemap.xml
          cp scripts/data/lastmod.json nba-planning-artifacts/generated/scripts/data/lastmod.json
      - name: Planning outcomes and effective controls
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: NBA_PLANNING_CONTROL=all ONLY=simNbaPlanningBench node scripts/runAllSims.mjs 2>&1 | tee nba-planning-artifacts/planning.log
      - name: Existing loss, timer and completion regressions
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          failed=0
          for harness in simConnectionsLoss simConnectionsShake simHarnessAnchors; do
            ONLY="$harness" node scripts/runAllSims.mjs 2>&1 | tee "nba-planning-artifacts/$harness.log" || failed=1
          done
          ONLY=simNoDoubleRecord node scripts/runAllSims.mjs 2>&1 | tee nba-planning-artifacts/simNoDoubleRecord.log || failed=1
          exit "$failed"
      - name: All built readers, search and guide checks
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          failed=0
          for harness in simAdsense simBrand simHeadTags simHiddenPages simHubs simIndexNow simIndexing simInternalLinks simNoRivalNames simPrerender simPrerenderBoot simRetiredRoutes simSchema simSitemap simSnapshotAssets simSiteSearch simGuideHeadings; do
            ONLY="$harness" node scripts/runAllSims.mjs --browser 2>&1 | tee "nba-planning-artifacts/$harness.log" || failed=1
          done
          exit "$failed"
      - name: Phone and desktop planning, reload and completion
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/qa/nbaPlanning1003.mjs 2>&1 | tee nba-planning-artifacts/native.log
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nba-planning-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 1
          path: nba-planning-artifacts/
