name: Combined career release preparation

on:
  push:
    branches: [codex/career-release-compatibility]

permissions:
  contents: read
concurrency:
  group: career-release-compatibility
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      SIM_NETWORK: offline
      ENGINES: chromium
      VITEST_MAX_FORKS: 1
      VITEST_MIN_FORKS: 1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verification dependencies
        run: |
          mkdir -p career-release-artifacts
          npm ci
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          python -m pip install fonttools pillow
      - name: Type check and generate combined pages
        id: build
        run: |
          node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee career-release-artifacts/types.log
          node scripts/genSearchKeywords.mjs 2>&1 | tee career-release-artifacts/keywords.log
          npm run build 2>&1 | tee career-release-artifacts/initial-build.log
          PRERENDER_ONLY=/whats-new,/nba-my-career,/nfl-my-career,/mlb-my-career,/nhl-my-career node scripts/prerender.mjs 2>&1 | tee career-release-artifacts/prerender.log
          node scripts/genSitemap.mjs 2>&1 | tee career-release-artifacts/sitemap.log
          npm run build 2>&1 | tee career-release-artifacts/build.log
          mkdir -p career-release-artifacts/generated
          for file in public/whats-new/index.html public/nba-my-career/index.html public/nfl-my-career/index.html public/mlb-my-career/index.html public/nhl-my-career/index.html public/sitemap.xml scripts/data/lastmod.json src/data/searchKeywords.json; do
            cp --parents "$file" career-release-artifacts/generated/
          done
          (cd career-release-artifacts/generated && find . -type f -print0 | sort -z | xargs -0 sha256sum) > career-release-artifacts/generated-sha256.txt
      - name: Real decisions and effective controls
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: CAREER_DECISION_OUTCOME_CONTROL=all ONLY=simCareerDecisionOutcome node scripts/runAllSims.mjs 2>&1 | tee career-release-artifacts/decisions.log
      - name: Combined careers and built pages
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          failed=0
          for harness in simUsCareerDeckC simUsBoardParity simNbaCareer simNflCareer simMlbCareer simNhlCareer simUsCareerRecovery simUsCareerPractice simCareerInbox simNoDoubleRecord simAdsense simBrand simHeadTags simHiddenPages simHubs simIndexNow simIndexing simInternalLinks simNoRivalNames simPrerender simPrerenderBoot simRetiredRoutes simSchema simSitemap simSnapshotAssets simSiteSearch simGuideHeadings simHarnessAnchors; do
            ONLY="$harness" node scripts/runAllSims.mjs --browser 2>&1 | tee "career-release-artifacts/$harness.log" || failed=1
          done
          exit "$failed"
      - name: Native choices with four input profiles
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/qa/careerDecisionOutcome1009.mjs 2>&1 | tee career-release-artifacts/native.log
      - name: Preserve preparation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: career-release-preparation-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 3
          path: |
            career-release-artifacts/
            career-decision-outcome-artifacts/
