      - name: Locked unchanged dependencies and complete native inventory
        id: install
        timeout-minutes: 8
        run: |
          set -euo pipefail
          out="$OWNER_PROOF_OUT"
          npm ci > "$out/install.stdout.log" 2> "$out/install.stderr.log"
          find node_modules -type f -print0 | sort -z > "$out/dependency-members.before"
          test "$(tr -cd '\000' < "$out/dependency-members.before" | wc -c)" -eq 24466
          xargs -0 sha256sum < "$out/dependency-members.before" > "$out/dependencies-before.sha256"
          sha256sum -c "$out/source-before.sha256" > "$out/source-after-install.log"
      - name: Actual source binding and application TypeScript gate
        id: types
        timeout-minutes: 7
        run: |
          set +e
          set -uo pipefail
          out="$OWNER_PROOF_OUT";: > "$out/source.transport";: > "$out/types.transport"
          sha256sum -c "$out/generated.sha256" > "$out/generated-before-source.log"
          generated_status=$?
          test "$generated_status" -eq 0 || exit "$generated_status"
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$out/source.transport" timeout --signal=TERM --kill-after=15s 90s node "$out/inspector.cjs" source > "$out/source.stdout.log" 2> "$out/source.stderr.log"
          source_status=$?;printf '%s\n' "$source_status" > "$out/source.exit"
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$out/types.transport" timeout --signal=TERM --kill-after=15s 5m node node_modules/typescript/bin/tsc --noEmit -p tsconfig.app.json > "$out/types.stdout.log" 2> "$out/types.stderr.log"
          types_status=$?;printf '%s\n' "$types_status" > "$out/types.exit"
          test "$generated_status" -eq 0 && test "$source_status" -eq 0 && test "$types_status" -eq 0
      - name: Nine native section-five processes with physical copied-source guard faults
        id: capture
        timeout-minutes: 29
        run: |
          set +e
          set -uo pipefail
          out="$OWNER_PROOF_OUT";: > "$out/capture.transport"
          sha256sum -c "$out/generated.sha256" > "$out/generated-before-capture.log"
          generated_status=$?
          test "$generated_status" -eq 0 || exit "$generated_status"
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$out/capture.transport" timeout --signal=TERM --kill-after=15s 28m node "$out/inspector.cjs" run > "$out/capture.stdout.log" 2> "$out/capture.stderr.log"
          status=$?;printf '%s\n' "$status" > "$out/capture.exit"
          test "$generated_status" -eq 0 && test "$status" -eq 0
      - name: Strict twelve-case compatibility and three actual fault groups
        id: admission
        timeout-minutes: 3
        run: |
          set +e
          set -uo pipefail
          out="$OWNER_PROOF_OUT";: > "$out/admission.transport"
          sha256sum -c "$out/generated.sha256" > "$out/generated-before-admission.log"
          generated_status=$?
          test "$generated_status" -eq 0 || exit "$generated_status"
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$out/admission.transport" timeout --signal=TERM --kill-after=15s 90s node "$out/inspector.cjs" admit > "$out/admission.stdout.log" 2> "$out/admission.stderr.log"
          status=$?;printf '%s\n' "$status" > "$out/admission.exit"
          test "$generated_status" -eq 0 && test "$status" -eq 0
      - name: Four physical copied-actual-record classifier controls and full restores
        id: records
        if: ${{ !cancelled() && steps.admission.outcome == 'success' }}
        timeout-minutes: 8
        run: |
          set +e
          set -uo pipefail
          out="$OWNER_PROOF_OUT";: > "$out/records.transport"
          sha256sum -c "$out/generated.sha256" > "$out/generated-before-records.log"
          generated_status=$?
          test "$generated_status" -eq 0 || exit "$generated_status"
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$out/records.transport" timeout --signal=TERM --kill-after=15s 7m node "$out/record-controls.cjs" > "$out/records.stdout.log" 2> "$out/records.stderr.log"
          status=$?;printf '%s\n' "$status" > "$out/records.exit"
          test "$generated_status" -eq 0 && test "$status" -eq 0
      - name: Always retain final binding and native exits before requiring complete holds
        id: holds
        if: always()
