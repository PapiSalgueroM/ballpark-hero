          const fs=require('node:fs'),path=require('node:path'),a=require('node:assert/strict'),cp=require('node:child_process'),{createHash}=require('node:crypto'),out=process.env.OWNER_PROOF_OUT,hash=b=>createHash('sha256').update(b).digest('hex'),read=p=>fs.readFileSync(path.join(out,p)),load=p=>JSON.parse(read(p)),replace=(text,map)=>{a.equal(text.split(map.before).length,2);const changed=text.replace(map.before,()=>map.after);a.equal(hash(text),map.beforeSha256);a.equal(hash(changed),map.afterSha256);a.equal(changed.replace(map.after,()=>map.before),text);return changed;};
          a.equal(cp.execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),process.env.GITHUB_SHA);
          const selected=read('selected-harness.mjs').toString('utf8'),rootMap=load('root-adapter.json'),adapted=replace(selected,rootMap.map);a.equal(rootMap.actualCheckoutRoot,fs.realpathSync(process.cwd()));a.equal(fs.realpathSync(rootMap.nodeModulesLink),fs.realpathSync('node_modules'));a.equal(read('root-adapted-healthy.mjs').toString('utf8'),adapted);
          const binding=replace(adapted,load('binding-fault-map.json')),purchase=replace(adapted,load('purchase-fault-map.json'));a.equal(read('binding-fault.mjs').toString('utf8'),binding);a.equal(read('purchase-fault.mjs').toString('utf8'),purchase);
