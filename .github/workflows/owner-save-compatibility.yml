          const owner=read('oldsave-owner-source.healthy.ts').toString('utf8'),fault=replace(owner,load('oldsave-original-source-control.json').map);a.equal(read('oldsave-owner-source.expected-plugin-fault.ts').toString('utf8'),fault);a.equal(hash(fs.readFileSync('src/lib/soccerCareerOwner.ts')),hash(owner));
          a.equal(load('record-controls-admission.json').controls,4);a.equal(load('section5-admission.json').actualNativeProcesses,9);a.equal(load('section5-admission.json').section6Executed,false);
          fs.writeFileSync(path.join(out,'physical-source-final-binding.json'),JSON.stringify({status:'ACTUAL_EXECUTED_QA_COPIES_AND_INVERSES_HELD',source:process.env.GITHUB_SHA,rootAdapter:true,setupFaults:2,originalOldsaveExpectedPluginCopy:true,productDiskMutation:false,section6Executed:false,fullSuiteExecuted:false},null,2)+'\n',{flag:'wx'});
