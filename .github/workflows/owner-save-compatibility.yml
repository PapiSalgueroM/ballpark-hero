name: Pinned historical owner save compatibility proof
on:
  push:
    branches: [codex/owner-save-compatibility-20261024]
    paths-ignore: ['docs/**']
permissions:
  contents: read
concurrency:
  group: owner-save-compatibility-${{ github.sha }}
  cancel-in-progress: false
env:
  EXPECTED_PARENT: 607d6e7ffa1e9f2f38e613865af4c76625d6d397
  CI: '1'
  SIM_NETWORK: offline
  TZ: UTC
jobs:
  owner_save_compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Fresh outside-checkout evidence
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/owner-save-compatibility-proof";test ! -e "$base";mkdir -m 700 "$base"
          out="$base/evidence";mkdir -m 700 "$out"
          echo "OWNER_PROOF_OUT=$out" >> "$GITHUB_ENV"
          echo "OWNER_PROOF_EXEC_ROOT=$RUNNER_TEMP/owner-save-compatibility-execution-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          printf '%s\n' "$GITHUB_SHA" > "$out/head.txt"
          printf '%s\n' "$GITHUB_RUN_ID" > "$out/run-id.txt"
          printf '%s\n' "$GITHUB_RUN_ATTEMPT" > "$out/run-attempt.txt"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - name: Exact two proof paths and all other Academy parent paths held
        id: foundation
        timeout-minutes: 3
        run: |
          set -euo pipefail
          out="$OWNER_PROOF_OUT"
          test "$GITHUB_REPOSITORY" = PapiSalgueroM/ballpark-hero
          test "$GITHUB_REPOSITORY_ID" = 1195729679
          test "$GITHUB_REF" = refs/heads/codex/owner-save-compatibility-20261024
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git show -s --format=%P HEAD)" = "$EXPECTED_PARENT"
          test "$(git rev-parse "$EXPECTED_PARENT^{tree}")" = 87ff0655cc96f93b89bae553af68d4b87aeeb564
          git diff --name-status "$EXPECTED_PARENT" HEAD > "$out/direct-paths.txt"
          printf 'A\t.github/workflows/owner-save-compatibility.yml\nM\tscripts/simSoccerOwnerTail.mjs\n' | cmp - "$out/direct-paths.txt"
          git diff --exit-code "$EXPECTED_PARENT" HEAD -- . ':!.github/workflows/owner-save-compatibility.yml' ':!scripts/simSoccerOwnerTail.mjs' > "$out/all-other-parent-source-held.log"
          test "$(git rev-parse "$EXPECTED_PARENT:scripts/simSoccerOwnerTail.mjs")" = d03a02f94c805bcb37cbc83a12674393008eeef4
          test "$(git hash-object scripts/simSoccerOwnerTail.mjs)" = b9ecc2d54a4480685050b95818caf5acffcf6eeb
          git rev-parse HEAD^{tree} > "$out/tree.txt"
          git ls-files -z | sort -z > "$out/source-members.before"
          test "$(tr -cd '\000' < "$out/source-members.before" | wc -c)" -eq 5343
          xargs -0 sha256sum < "$out/source-members.before" > "$out/source-before.sha256"
          tar --null --files-from="$out/source-members.before" -czf "$out/current-source.tar.gz"
          git status --porcelain --untracked-files=all > "$out/status-before.txt";test ! -s "$out/status-before.txt"
          for name in NODE_OPTIONS SIM_OWNER_ONLY SIM_OWNER_BASE SIM_OWNER_SALT SIM_OWNER_CONTROL NO_DOUBLE_SWAP ONLY BROWSER;do
            if printenv "$name" > /dev/null;then printf '%s\n' "Inherited application override refused: $name" >&2;exit 1;fi
          done
