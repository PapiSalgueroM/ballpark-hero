name: Player Bingo verified Rodri honour

on:
  push:
    branches: [codex/bingo-rodri-honour]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      CI: '1'
      SIM_NETWORK: offline
      ENGINES: chromium
      PLAYER_BINGO_RODRI_PHASE: fixed
      PLAYER_BINGO_RODRI_OUT: ${{ github.workspace }}/bingo-rodri-artifacts
      FREE_KICK_FONT_CACHE: ${{ github.workspace }}/bingo-rodri-artifacts/font-cache
      PRERENDER_ONLY: /player-bingo
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Block production database transport
        run: echo '127.0.0.1 flawuiqbvjobmkfkauhw.supabase.co' | sudo tee -a /etc/hosts
      - name: Bind source and locked packages
        run: |
          mkdir -p "$PLAYER_BINGO_RODRI_OUT"
          git rev-parse HEAD > "$PLAYER_BINGO_RODRI_OUT/source-head.txt"
          git status --porcelain --untracked-files=no > "$PLAYER_BINGO_RODRI_OUT/source-before.txt"
          test ! -s "$PLAYER_BINGO_RODRI_OUT/source-before.txt"
          if test "$PLAYER_BINGO_RODRI_PHASE" = baseline; then
            git diff --exit-code 5b630266d261b39128e4fb4544783d8e22214ce3 -- src/lib/playerBingo.ts src/pages/PlayerBingo.tsx src/lib/whoAmI.ts src/lib/playerSearch.ts src/test/playerBingoHonours.test.ts scripts/simPlayerBingoHonours.mjs
          fi
          sha256sum src/lib/playerBingo.ts src/pages/PlayerBingo.tsx src/lib/whoAmI.ts src/test/playerBingoRodriHonour.test.ts scripts/simPlayerBingoRodriHonour.mjs src/test/playerBingoTransport.test.ts src/lib/playerSearch.ts src/test/playerBingoHonours.test.ts scripts/simPlayerBingoHonours.mjs vitest.config.ts .github/workflows/player-bingo-rodri-honour.yml > "$PLAYER_BINGO_RODRI_OUT/source-hashes.txt"
          sha256sum package.json package-lock.json bun.lock > "$PLAYER_BINGO_RODRI_OUT/package-hashes.txt"
          npm ci
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const lock = JSON.parse(fs.readFileSync('package-lock.json'));
          const installed = Object.entries(lock.packages).filter(([p]) => p.startsWith('node_modules/') && fs.existsSync(p + '/package.json')).map(([p, entry]) => {
            const version = JSON.parse(fs.readFileSync(p + '/package.json')).version;
            assert.equal(version, entry.version, p);
            return { path: p, version };
          });
          assert(installed.length > 0);
          fs.writeFileSync(process.env.PLAYER_BINGO_RODRI_OUT + '/installed.json', JSON.stringify(installed, null, 2));
          console.log(`Bound ${installed.length} installed locked versions.`);
          NODE
      - name: Application type gate
        run: node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee "$PLAYER_BINGO_RODRI_OUT/types.log"
      - name: Actual UCL criterion outcomes and strict causal controls
        run: NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/simPlayerBingoRodriHonour.mjs 2>&1 | tee "$PLAYER_BINGO_RODRI_OUT/$PLAYER_BINGO_RODRI_PHASE.log"

      - name: Existing Bingo page and engine regressions
        if: env.PLAYER_BINGO_RODRI_PHASE == 'fixed'
        run: |
          for harness in simPlayerBingoHonours simPlayerBingoWorldCupAlias simPlayerBingoLoad simPlayerBingoLineFeedback simSportsBingo simBingoSeats; do
            NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node "scripts/$harness.mjs" 2>&1 | tee "$PLAYER_BINGO_RODRI_OUT/$harness.log"
          done
      - name: Isolated remote build tools
        if: env.PLAYER_BINGO_RODRI_PHASE == 'fixed'
        run: |
          npm install --prefix "$RUNNER_TEMP/bingo-rodri-browser" --no-save --package-lock=false playwright@1.64.0
          ln -s "$RUNNER_TEMP/bingo-rodri-browser/node_modules/playwright" node_modules/playwright
          ln -s "$RUNNER_TEMP/bingo-rodri-browser/node_modules/playwright-core" node_modules/playwright-core
          node "$RUNNER_TEMP/bingo-rodri-browser/node_modules/playwright/cli.js" install --with-deps chromium
          python -m pip install fonttools pillow
          node scripts/qa/freeKickLab1070.mjs --prefetch-fonts-only 2>&1 | tee "$PLAYER_BINGO_RODRI_OUT/fonts.log"
          sha256sum --check "$PLAYER_BINGO_RODRI_OUT/package-hashes.txt"
      - name: Complete build with Bingo snapshot
        if: env.PLAYER_BINGO_RODRI_PHASE == 'fixed'
        run: |
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" npm run build:seo 2>&1 | tee "$PLAYER_BINGO_RODRI_OUT/build.log"
          cp scripts/data/lastmod.json "$PLAYER_BINGO_RODRI_OUT/build-lastmod.json"
          git diff -- scripts/data/lastmod.json > "$PLAYER_BINGO_RODRI_OUT/build-lastmod.diff"
      - name: Every rebuilt-site reader
        if: env.PLAYER_BINGO_RODRI_PHASE == 'fixed'
        run: |
          failed=0
          for harness in simAdsense simBrand simHeadTags simHiddenPages simHubs simIndexNow simIndexing simInternalLinks simNoRivalNames simPrerender simPrerenderBoot simRetiredRoutes simSchema simSitemap simSnapshotAssets; do
            ONLY="$harness" node scripts/runAllSims.mjs --browser 2>&1 | tee "$PLAYER_BINGO_RODRI_OUT/$harness.log" || failed=1
            if grep -E '(^|[[:space:]])(SKIP|EMPTY)([[:space:]]|$)' "$PLAYER_BINGO_RODRI_OUT/$harness.log"; then failed=1; fi
          done
          exit "$failed"
      - name: Final source and package holds
        if: always()
        run: |
          sha256sum --check "$PLAYER_BINGO_RODRI_OUT/source-hashes.txt"
          sha256sum --check "$PLAYER_BINGO_RODRI_OUT/package-hashes.txt"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const installed = JSON.parse(fs.readFileSync(process.env.PLAYER_BINGO_RODRI_OUT + '/installed.json'));
          for (const row of installed) assert.equal(JSON.parse(fs.readFileSync(row.path + '/package.json')).version, row.version, row.path);
          console.log(`All ${installed.length} installed versions held.`);
          NODE
      - name: Retain complete evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bingo-rodri-${{ github.run_id }}
          path: bingo-rodri-artifacts/
          retention-days: 14
