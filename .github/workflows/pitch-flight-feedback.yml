          test "$(git rev-parse "$BASE_SOURCE:src/components/pitch-motion/PitchMotion.tsx")" = 8a907fc247670f7f94276c4174e992643ebf6877
          test "$(git rev-parse "$BASE_SOURCE:src/components/season-centre/MiniPitch.tsx")" = 51cbfc3100c6ebdcbdac7a6608a5ec68154362b0
          for file in src/test/MiniPitch.height.test.tsx vitest.config.ts scripts/lib/offlineTransport.cjs package.json package-lock.json;do
            git show "$BASE_SOURCE:$file" | cmp "$file" -
          done
          test "$(git rev-parse HEAD:vitest.config.ts)" = ed2a9dc677f77dfe95c061064eeff5782b856864
          printf '%s  %s\n' \
            53c4983e70cd48dafd66d5379937e98515288521ff9cdcb618e62cbbd5d2ad30 src/components/pitch-motion/PitchMotion.tsx \
            34b6b132c6ebaf4f2b91e8e28c7e0ec82fed3db74e6a0a2e0a07cbda7f297994 src/components/season-centre/MiniPitch.tsx \
            0696faed3bbcc2f764602e4bb0416db262fe3f3dbbfd87680df81862858e0294 src/test/PitchMotion.build.test.tsx \
            2e7c3d5c14cee4911631b72dfb6af23f2848ec4c960ac4c461c0ea61b140def5 src/test/MiniPitch.height.test.tsx \
            3b9728bb065a0f075a4a81dda2fda263cff4b0f63fc5c0344e447cfaa95a5d24 scripts/qa/runPitchFlightControls.mjs \
