    runs-on: ubuntu-latest
    timeout-minutes: 55
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 32
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Exact parent and sixteen real Pitch browser inputs
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/pitch-flight-styled-release";test ! -e "$out";mkdir "$out"
          export PITCH_STYLE_OUT="$out"
          echo "PITCH_STYLE_OUT=$out" >> "$GITHUB_ENV"
          echo "FREE_KICK_FONT_CACHE=$out/font-cache" >> "$GITHUB_ENV"
          test "$GITHUB_REPOSITORY" = PapiSalgueroM/ballpark-hero
          test "$GITHUB_REPOSITORY_ID" = 1195729679
          test "$GITHUB_REF" = refs/heads/codex/pitch-flight-feedback-20261023
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          git fetch --no-tags --depth=1 origin "$EXPECTED_PARENT" > "$out/parent-fetch.log" 2>&1
          git merge-base --is-ancestor "$EXPECTED_PARENT" "$GITHUB_SHA" > "$out/parent-ancestry.log" 2>&1
          git diff --exit-code "$EXPECTED_PARENT" HEAD -- . ':!docs/**' ':!.github/workflows/pitch-flight-feedback.yml' ':!scripts/qa/fixtures/pitchFlight.entry.tsx' ':!scripts/qa/fixtures/pitchFlight.html' ':!scripts/qa/fixtures/pitchFlight.vite.mjs' ':!scripts/qa/playPitchFlight.mjs' > "$out/protected-current-source.log"
          for file in package.json package-lock.json vitest.config.ts scripts/lib/offlineTransport.cjs scripts/lib/playwrightLoader.mjs scripts/lib/hostLikeServer.mjs scripts/qa/siteMenuNavigationSupport.mjs scripts/qa/freeKickLab1070.mjs scripts/sweepWeight.mjs scripts/playHomeFold.mjs src/components/season-centre/MiniPitch.tsx src/components/pitch-motion/PitchMotion.tsx src/components/season-centre/MatchClock.tsx src/components/pitch-motion/PitchSurface.tsx src/components/pitch-motion/contract.ts src/components/pitch-motion/scene.ts src/components/pitch-motion/motion.tsx src/components/pitch-motion/pitchMotion.css src/index.css;do
            git show "$EXPECTED_PARENT:$file" | cmp "$file" -
          done
          node <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict'),crypto=require('node:crypto'),cp=require('node:child_process');
          const required=["src/components/season-centre/MiniPitch.tsx","src/components/pitch-motion/PitchMotion.tsx","src/components/season-centre/MatchClock.tsx","src/components/pitch-motion/PitchSurface.tsx","src/components/pitch-motion/contract.ts","src/components/pitch-motion/scene.ts","src/components/pitch-motion/motion.tsx","src/components/pitch-motion/pitchMotion.css","src/index.css","scripts/qa/fixtures/pitchFlight.entry.tsx","scripts/qa/fixtures/pitchFlight.html","scripts/qa/fixtures/pitchFlight.vite.mjs","scripts/qa/playPitchFlight.mjs","scripts/qa/siteMenuNavigationSupport.mjs","scripts/lib/hostLikeServer.mjs","scripts/lib/playwrightLoader.mjs"],pins=JSON.parse(process.env.PITCH_EXPECTED_PINS_JSON),hash=b=>crypto.createHash('sha256').update(b).digest('hex'),out=process.env.PITCH_STYLE_OUT;
          assert.deepEqual(Object.keys(pins).sort(),[...required].sort());assert.equal(required.length,16);
          for(const file of required){assert.match(pins[file],/^[a-f0-9]{64}$/);assert.equal(hash(fs.readFileSync(file)),pins[file],'PITCH_BROWSER_INPUT '+file);}
          const names=cp.execFileSync('git',['ls-files','-z'],{encoding:'utf8'}).split('\0');assert.equal(names.pop(),'');assert(names.length>0);assert.equal(new Set(names).size,names.length);
          fs.writeFileSync(out+'/browser-binding.json',JSON.stringify({sourceHead:process.env.GITHUB_SHA,trackedCount:names.length,playwrightVersion:'1.64.0',pins},null,2)+'\n',{flag:'wx'});
          const workflow='.github/workflows/pitch-flight-feedback.yml',blob=cp.execFileSync('git',['rev-parse','HEAD:'+workflow],{encoding:'utf8'}).trim();
          assert.equal(cp.execFileSync('git',['hash-object',workflow],{encoding:'utf8'}).trim(),blob);
          fs.writeFileSync(out+'/source-binding.json',JSON.stringify({phase:'styled-pitch-native-clock',applicationQualified:false,source:process.env.GITHUB_SHA,parent:process.env.EXPECTED_PARENT,run:process.env.GITHUB_RUN_ID,attempt:process.env.GITHUB_RUN_ATTEMPT,tree:cp.execFileSync('git',['rev-parse','HEAD^{tree}'],{encoding:'utf8'}).trim(),workflow:{file:workflow,gitBlobSha1:blob,sha256:hash(fs.readFileSync(workflow))},requiredInputs:16,bindingSha256:hash(fs.readFileSync(out+'/browser-binding.json'))},null,2)+'\n',{flag:'wx'});
