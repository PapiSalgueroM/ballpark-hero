          sha256sum --check "$out/input-pins.sha256" > "$out/input-pins.log"
          git rev-parse HEAD > "$out/head.txt";git rev-parse 'HEAD^{tree}' > "$out/tree.txt"
          git rev-parse HEAD:src/components/pitch-motion/PitchMotion.tsx > "$out/candidate-pitch-motion-blob.txt"
          git rev-parse HEAD:src/components/season-centre/MiniPitch.tsx > "$out/candidate-mini-pitch-blob.txt"
          git rev-parse HEAD:.github/workflows/pitch-flight-feedback.yml > "$out/workflow-blob.txt"
          sha256sum .github/workflows/pitch-flight-feedback.yml > "$out/workflow.sha256"
          git ls-files -z | sort -z > "$out/source-members.before"
          git ls-files -z | sort -z | xargs -0 sha256sum > "$out/source-before.sha256"
          git diff --exit-code HEAD > "$out/source-clean-before.log"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Locked installation and full dependency inventory
        run: |
          set -euo pipefail
          out="$PITCH_FLIGHT_OUT"
          npm ci > "$out/install.log" 2>&1
          find node_modules -path node_modules/.vite -prune -o -type f -print0 | sort -z > "$out/dependency-members.before"
          find node_modules -path node_modules/.vite -prune -o -type f -print0 | sort -z | xargs -0 sha256sum > "$out/dependencies.sha256"
      - name: Actual app types and exact fixed nine-case outcomes
        id: units
        run: |
          set -euo pipefail
          out="$PITCH_FLIGHT_OUT"
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          : > "$out/types.transport";: > "$out/tests.transport";: > "$out/classifier.transport";status=0
          SIM_OFFLINE_RECEIPT="$out/types.transport" timeout --signal=TERM --kill-after=15s 5m node_modules/.bin/tsc --noEmit -p tsconfig.app.json > "$out/types.log" 2>&1 || status=$?
          printf '%s\n' "$status" > "$out/types.exit";test "$status" -eq 0
          status=0
          SIM_OFFLINE_RECEIPT="$out/tests.transport" timeout --signal=TERM --kill-after=15s 5m node_modules/.bin/vitest run src/test/PitchMotion.build.test.tsx src/test/MiniPitch.height.test.tsx --maxWorkers=1 --no-file-parallelism --reporter=json --outputFile="$out/tests.json" > "$out/tests.log" 2>&1 || status=$?
          printf '%s\n' "$status" > "$out/tests.exit";test "$status" -eq 0
          SIM_OFFLINE_RECEIPT="$out/classifier.transport" node <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict'),path=require('node:path'),out=process.env.PITCH_FLIGHT_OUT,r=JSON.parse(fs.readFileSync(out+'/tests.json','utf8'));
          const expected=new Map([
            ['src/test/PitchMotion.build.test.tsx',{ancestor:'Generic PitchMotion optional build wiring',count:6,owned:new Map([
              ['renders the supplied build plan in actual ball and figure positions','PITCH_ROOT_BUILD_REACHES_BALL'],
              ['replans when only build changes while all other prop references and the clock stay held','PITCH_ROOT_BUILD_ONLY_INVALIDATES_MEMO'],
              ['draws the real full-motion free-kick lift when build is supplied','PITCH_ROOT_BUILD_FLIGHT_LIFT'],
            ]),preserves:new Set([
              'keeps a full-motion legacy free kick and a reduced-motion built free kick flat',
              'preserves omitted-build legacy positions across multiple real scene changes',
              'freezes the displayed frame while stopped and resumes on the supplied clock without changing inputs or drawing RNG',
            ])}],
            ['src/test/MiniPitch.height.test.tsx',{ancestor:'Career mini pitch ball height',count:3,owned:new Map([
              ['draws the actual flight height and ground shadow for goals at either end','MINI_REAL_FLIGHT_HEIGHT_VISIBLE'],
            ]),preserves:new Set([
              'keeps instant results and goals already present at mount on a flat terminal frame',
              'holds the exact displayed goal frame while paused and resumes that committed goal',
            ])}],
          ].map(([file,spec])=>[path.resolve(file),spec]));
          assert.equal(r.success,true);assert.equal(r.testResults.length,2);
          assert.equal(r.numTotalTests,9);assert.equal(r.numPassedTests,9);assert.equal(r.numFailedTests,0);assert.equal(r.numPendingTests,0);assert.equal(r.numTodoTests,0);
          const files=new Set(),passes=[];
          for(const suite of r.testResults){
            assert.equal(typeof suite.name,'string');const file=path.resolve(suite.name),spec=expected.get(file);
            assert(spec,'Unexpected actual suite '+file);assert(!files.has(file));files.add(file);
            assert.equal(suite.status,'passed');assert.equal(suite.assertionResults.length,spec.count);if('message'in suite)assert.equal(suite.message,'');
            const titles=new Set([...spec.owned.keys(),...spec.preserves]),seen=new Set();
            for(const row of suite.assertionResults){
              assert(titles.has(row.title)&&!seen.has(row.title));seen.add(row.title);
              assert.equal(row.fullName,spec.ancestor+' '+row.title);assert.equal(row.status,'passed');assert.deepEqual(row.failureMessages,[]);
              passes.push({file,title:row.title,fullName:row.fullName,status:row.status});
            }
            assert.equal(seen.size,spec.count);
          }
          assert.equal(files.size,2);assert.equal(passes.length,9);
          const runtime=['numRuntimeErrorTestSuites','numUnhandledErrors'];for(const key of runtime)if(key in r)assert.equal(r[key],0);if('unhandledErrors'in r)assert.deepEqual(r.unhandledErrors,[]);
          assert.doesNotMatch(fs.readFileSync(out+'/tests.log','utf8'),/Unhandled\s+(?:Errors?|Rejections?)|Uncaught\s+Exceptions?/i);
          fs.writeFileSync(out+'/fixed-nine-admission.json',JSON.stringify({phase:'fixed-pitch-flight-functional',source:process.env.GITHUB_SHA,runId:process.env.GITHUB_RUN_ID,attempt:process.env.GITHUB_RUN_ATTEMPT,passedCases:passes,observedRuntimeCounters:Object.fromEntries(runtime.filter(k=>k in r).map(k=>[k,r[k]])),absentRuntimeCountersUnknown:runtime.filter(k=>!(k in r)),unhandledErrors:'unhandledErrors'in r?r.unhandledErrors:'UNKNOWN_ABSENT',applicationQualified:false,browserQualification:'OWED'},null,2)+'\n',{flag:'wx'});
          NODE
          test ! -s "$out/types.transport";test ! -s "$out/tests.transport";test ! -s "$out/classifier.transport"
      - name: Four real copied-source healthy fault restored controls
        id: controls
        if: ${{ !cancelled() && steps.units.outcome == 'success' }}
        run: |
          set -euo pipefail
          out="$PITCH_FLIGHT_OUT"
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          : > "$out/controls.transport";: > "$out/controls-classifier.transport";status=0
          SIM_OFFLINE_RECEIPT="$out/controls.transport" timeout --signal=TERM --kill-after=15s 18m node scripts/qa/runPitchFlightControls.mjs --out "$out/copied-controls" > "$out/controls.log" 2>&1 || status=$?
          printf '%s\n' "$status" > "$out/controls.exit";test "$status" -eq 0
          SIM_OFFLINE_RECEIPT="$out/controls-classifier.transport" node <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict'),out=process.env.PITCH_FLIGHT_OUT,p=JSON.parse(fs.readFileSync(out+'/copied-controls/proof.json','utf8')),holds=JSON.parse(fs.readFileSync(out+'/copied-controls/input-holds.json','utf8'));
          assert.equal(p.status,'ACTUAL_FIXED_NINE_AND_FOUR_COPIED_SOURCE_CONTROLS_PASS');assert.equal(p.complete,true);assert.equal(p.source,process.env.GITHUB_SHA);assert.equal(p.runId,process.env.GITHUB_RUN_ID);assert.equal(p.attempt,process.env.GITHUB_RUN_ATTEMPT);
          assert.equal(p.runs.length,14);assert.equal(p.controls.length,4);assert.deepEqual(p.errors,[]);assert(p.controls.every(c=>c.healthy&&c.fault&&c.restored&&!c.errors.length));assert.equal(holds.allEqual,true);
          for(const label of ['all-nine-healthy','all-nine-restored']){const row=p.runs.find(x=>x.label===label);assert(row);assert.equal(row.registered,9);assert.equal(row.passed,9);assert.equal(row.failed,0);assert.equal(row.pending,0);}
          NODE
          test ! -s "$out/controls.transport";test ! -s "$out/controls-classifier.transport"
      - name: Always preserve all raw results and physical holds
        if: always()
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/pitch-flight-fixed";mkdir -p "$out";failed=0
          for manifest in source-before dependencies;do
            if test -f "$out/$manifest.sha256";then sha256sum --check "$out/$manifest.sha256" > "$out/final-$manifest-hold.log" 2>&1 || failed=1;else failed=1;fi
          done
          git ls-files -z | sort -z > "$out/source-members.after" || failed=1
          git ls-files -z | sort -z | xargs -0 sha256sum > "$out/source-after.sha256" || failed=1
          if test -f "$out/source-members.before";then cmp "$out/source-members.before" "$out/source-members.after" || failed=1;else failed=1;fi
          if test -f "$out/source-before.sha256";then cmp "$out/source-before.sha256" "$out/source-after.sha256" || failed=1;else failed=1;fi
          if test -d node_modules;then
            find node_modules -path node_modules/.vite -prune -o -type f -print0 | sort -z > "$out/dependency-members.after" || failed=1
            find node_modules -path node_modules/.vite -prune -o -type f -print0 | sort -z | xargs -0 sha256sum > "$out/dependencies-end.sha256" || failed=1
          else failed=1;fi
          if test -f "$out/dependency-members.before";then cmp "$out/dependency-members.before" "$out/dependency-members.after" || failed=1;else failed=1;fi
          if test -f "$out/dependencies.sha256";then cmp "$out/dependencies.sha256" "$out/dependencies-end.sha256" || failed=1;else failed=1;fi
          git rev-parse HEAD > "$out/head-after.txt" || failed=1
