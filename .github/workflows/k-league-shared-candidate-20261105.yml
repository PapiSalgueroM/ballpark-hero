name: K League shared candidate headless fixed four physical faults and restored
on:
  push:
    branches: [codex/k-league-shared-candidate-v4-20261105]
permissions:
  contents: read
  actions: read
concurrency:
  group: k-league-shared-candidate-${{ github.ref }}
  cancel-in-progress: false
env:
  CI: '1'
  SIM_NETWORK: offline
  TZ: UTC
  PRODUCT_CORE: 6b14113cfd5f8eb74c2f0939e58ad6a64df8d6c7
  PRODUCT_TREE: 7a8de8056f36d9d9b98896d7ac7c0d5a57be7b2d
  SPEC_BLOB: ab45cd0d26a6b59325f31c3f01061fed9f32ec0f
jobs:
  outcomes:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 6
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Bind generated product and exact five QA additions
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/k-league-shared-candidate"
          REF="$RUNNER_TEMP/k-league-shared-candidate-reference"
          test ! -e "$OUT"; test ! -e "$REF"
          mkdir -p "$OUT/logs" "$OUT/transport" "$OUT/replay"
          printf 'QA_OUT=%s\nQA_REF=%s\n' "$OUT" "$REF" >> "$GITHUB_ENV"
          export QA_OUT="$OUT" QA_REF="$REF"
          test "$(git rev-parse HEAD^)" = "$PRODUCT_CORE"
          test "$(git rev-parse HEAD^^{tree})" = "$PRODUCT_TREE"
          test "$(git rev-parse HEAD^^)" = 6317a6a535fd7d13502d8fc1cf0158eb761fe903
          test "$(git rev-parse HEAD^^^{tree})" = b50b6ebcb703af2fd5875405973bd845080d499d
          test "$(git rev-parse HEAD^^^)" = 979af4e8e31455ec0a5fcbaa575bc7f28947bc41
          test "$(git rev-parse HEAD^^^^{tree})" = 7d642ef170a5501d6a8f7340a4abffa81efb85cd
          test "$(git rev-parse HEAD^^^^)" = 7fa61db3491eec0830db90bcb47bf35b25c97b71
          test "$(git rev-parse HEAD^^^^^{tree})" = c249186fc75a12eed2c3748cbc57ec7329140417
          git rev-parse HEAD HEAD^{tree} > "$OUT/source.txt"
          git diff --name-status --no-renames HEAD^ HEAD > "$OUT/qa-delta.txt"
          node --input-type=module <<'K_PINS'
          import fs from 'node:fs';import assert from 'node:assert/strict';import crypto from 'node:crypto';
          const specFile='scripts/qa/kLeagueSharedCandidateCases.json',spec=JSON.parse(fs.readFileSync(specFile,'utf8')),out=process.env.QA_OUT;
          const blob=b=>crypto.createHash('sha1').update(Buffer.from('blob '+b.length+'\0')).update(b).digest('hex');
          for(const key of ['PRODUCT_CORE','PRODUCT_TREE','SPEC_BLOB'])assert.match(process.env[key]||'',/^[0-9a-f]{40}$/,key+' actual source binding');
          assert.equal(spec.status,'CANDIDATE_ACTUAL_GENERATED_SOURCE_BOUND');
          assert.equal(spec.candidate.commit,process.env.PRODUCT_CORE);assert.equal(spec.candidate.tree,process.env.PRODUCT_TREE);
          const paths=['.github/workflows/k-league-shared-candidate-20261105.yml',specFile,'scripts/qa/kLeagueSharedCandidateEvidence.mjs','src/test/kLeagueSharedCandidate.test.tsx','src/test/kLeagueSharedBoundaries.test.ts'].sort();
          assert.deepEqual(fs.readFileSync(out+'/qa-delta.txt','utf8').trimEnd().split('\n'),paths.map(file=>'A\t'+file));
          assert.equal(spec.sourcePins.length,33);assert.equal(new Set(spec.sourcePins.map(row=>row.path)).size,33,'Exact unique protected source paths');
          const pins=[...spec.sourcePins,...spec.helperPins,{path:specFile,gitBlob:process.env.SPEC_BLOB},{path:'scripts/lib/offlineTransport.cjs',gitBlob:'0fda542a2649fe5da937c6976fd0f5b6073e74b6'}];
          for(const row of pins){assert.match(row.gitBlob,/^[0-9a-f]{40}$/);assert.equal(blob(fs.readFileSync(row.path)),row.gitBlob,row.path);}
          for(const [arm,fault]of Object.entries(spec.faults)){assert.equal(fault.id,arm);assert.match(fault.afterGitBlob,/^[0-9a-f]{40}$/);assert.match(fault.afterSHA256,/^[0-9a-f]{64}$/);assert(Number.isSafeInteger(fault.afterBytes)&&fault.afterBytes>0);assert(Array.isArray(fault.operations)&&fault.operations.length===1);}
          fs.writeFileSync(out+'/input-pins.json',JSON.stringify({candidate:spec.candidate,original:spec.original,pins,faults:spec.faults},null,2)+'\n');
          fs.copyFileSync('.github/workflows/k-league-shared-candidate-20261105.yml',out+'/workflow.yml');
          K_PINS
          git ls-files -z | sort -z | xargs -0 sha256sum > "$OUT/source-before.sha256"
          git ls-files -s > "$OUT/index-before.txt"
          git ls-files -z > "$OUT/tracked-before.bin"
          for lock in package.json package-lock.json bun.lock bun.lockb; do if test -f "$lock"; then sha256sum "$lock"; fi; done > "$OUT/locks-before.sha256"
          git status --porcelain=v1 --untracked-files=all > "$OUT/status-before.txt"
          test ! -s "$OUT/status-before.txt"
      - name: Authenticate the closed original and all six complete RAW
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
