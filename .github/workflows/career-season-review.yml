name: Career season review verification

on:
  push:
    branches: [codex/career-season-highs-1061]
  pull_request:
    paths:
      - .github/workflows/career-season-review.yml
      - src/components/game/GameHelp.tsx
      - src/pages/NbaMyCareer.tsx
      - src/pages/NflMyCareer.tsx
      - src/pages/MlbMyCareer.tsx
      - src/pages/NhlMyCareer.tsx
      - src/components/us-career/UsCareerBoard.tsx
      - src/components/us-career/CareerSeasonReview.tsx
      - src/components/us-career/CareerSeasonComparison.tsx
      - src/components/us-career/CareerSeasonHighs.tsx
      - src/lib/usCareerSeasonReview.ts
      - src/lib/usCareerSport.ts
      - src/lib/*CareerSport.ts
      - src/test/careerSeasonReview.test.tsx
      - src/test/fixtures/careerSeasonReview1008.ts
      - scripts/simCareerSeasonReview.mjs
      - scripts/qa/careerSeasonReview1008.mjs

permissions:
  contents: read
concurrency:
  group: career-season-review-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      SIM_NETWORK: offline
      ENGINES: chromium
      VITEST_MAX_FORKS: 1
      VITEST_MIN_FORKS: 1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verification dependencies
        run: |
          mkdir -p career-season-review-artifacts
          npm ci
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          python -m pip install fonttools pillow
      - name: Type check and build
        id: build
        run: |
          node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee career-season-review-artifacts/types.log
          npm run build 2>&1 | tee career-season-review-artifacts/build.log
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            PRERENDER_ONLY=/whats-new node scripts/prerender.mjs 2>&1 | tee career-season-review-artifacts/prerender.log
            node scripts/genSitemap.mjs 2>&1 | tee career-season-review-artifacts/sitemap.log
            npm run build 2>&1 | tee career-season-review-artifacts/prepared-build.log
            mkdir -p career-season-review-artifacts/generated
            for file in public/whats-new/index.html public/sitemap.xml scripts/data/lastmod.json; do
              cp --parents "$file" career-season-review-artifacts/generated/
            done
            (cd career-season-review-artifacts/generated && find . -type f -print0 | sort -z | xargs -0 sha256sum) > career-season-review-artifacts/generated-sha256.txt
          fi
      - name: Saved-season outcomes and effective controls
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: CAREER_SEASON_REVIEW_CONTROL=all ONLY=simCareerSeasonReview node scripts/runAllSims.mjs 2>&1 | tee career-season-review-artifacts/review.log
      - name: Existing careers, saves and scoring
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          failed=0
          for harness in simNbaCareer simNflCareer simMlbCareer simNhlCareer simUsCareerRecovery simUsCareerPractice simUsCareerActionConfirm simUsCareerWeight simCareerInbox simNoDoubleRecord simHarnessAnchors; do
            ONLY="$harness" node scripts/runAllSims.mjs 2>&1 | tee "career-season-review-artifacts/$harness.log" || failed=1
          done
          exit "$failed"
      - name: Built pages and search
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          failed=0
          for harness in simAdsense simBrand simHeadTags simHiddenPages simHubs simIndexNow simIndexing simInternalLinks simNoRivalNames simPrerender simPrerenderBoot simRetiredRoutes simSchema simSitemap simSnapshotAssets simSiteSearch; do
            ONLY="$harness" node scripts/runAllSims.mjs --browser 2>&1 | tee "career-season-review-artifacts/$harness.log" || failed=1
          done
          exit "$failed"
      - name: Unapproved inbox cap copy still fails
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set +e
          INBOX_CONTROL=privatecap ONLY=simCareerInbox node scripts/runAllSims.mjs 2>&1 | tee career-season-review-artifacts/privatecap.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 1
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const output = fs.readFileSync('career-season-review-artifacts/privatecap.log', 'utf8');
          assert(output.includes('src/lib/inboxCapNegativeControl.ts carries a private copy of the drop-oldest-answered cap'));
          assert.equal(output.split('\n').filter(line => /^\s*FAIL:/.test(line)).length, 1);
          assert(output.includes('1 harness not green.'));
          console.log('The injected private cap was rejected; the distinct GM week cap remains allowed.');
          NODE
      - name: Native saved-season review across four sports
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/qa/careerSeasonReview1008.mjs 2>&1 | tee career-season-review-artifacts/native.log
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: career-season-review-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 1
          path: career-season-review-artifacts/
