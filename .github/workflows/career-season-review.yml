name: Career season review verification

on:
  pull_request:
    paths:
      - .github/workflows/career-season-review.yml
      - src/components/us-career/UsCareerBoard.tsx
      - src/components/us-career/CareerSeasonReview.tsx
      - src/lib/usCareerSeasonReview.ts
      - src/lib/usCareerSport.ts
      - src/lib/*CareerSport.ts
      - src/test/careerSeasonReview.test.tsx
      - src/test/fixtures/careerSeasonReview1008.ts
      - scripts/simCareerSeasonReview.mjs
      - scripts/qa/careerSeasonReview1008.mjs

permissions:
  contents: read
concurrency:
  group: career-season-review-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      SIM_NETWORK: offline
      ENGINES: chromium
      VITEST_MAX_FORKS: 1
      VITEST_MIN_FORKS: 1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install verification dependencies
        run: |
          mkdir -p career-season-review-artifacts
          npm ci
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Type check and build
        id: build
        run: |
          node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee career-season-review-artifacts/types.log
          npm run build 2>&1 | tee career-season-review-artifacts/build.log
      - name: Generate candidate update snapshot
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          PRERENDER_ONLY=/whats-new node scripts/prerender.mjs 2>&1 | tee career-season-review-artifacts/snapshot.log
          node scripts/genSitemap.mjs 2>&1 | tee career-season-review-artifacts/sitemap-generation.log
          mkdir -p career-season-review-artifacts/generated/public/whats-new career-season-review-artifacts/generated/scripts/data
          cp public/whats-new/index.html career-season-review-artifacts/generated/public/whats-new/
          cp public/sitemap.xml career-season-review-artifacts/generated/public/
          cp scripts/data/lastmod.json career-season-review-artifacts/generated/scripts/data/
          npm run build 2>&1 | tee career-season-review-artifacts/rebuild.log
      - name: Saved-season outcomes and effective controls
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: CAREER_SEASON_REVIEW_CONTROL=all ONLY=simCareerSeasonReview node scripts/runAllSims.mjs 2>&1 | tee career-season-review-artifacts/review.log
      - name: Existing careers, saves and scoring
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          failed=0
          for harness in simNbaCareer simNflCareer simMlbCareer simNhlCareer simUsCareerRecovery simUsCareerPractice simUsCareerActionConfirm simUsCareerWeight simCareerInbox simNoDoubleRecord simHarnessAnchors; do
            ONLY="$harness" node scripts/runAllSims.mjs 2>&1 | tee "career-season-review-artifacts/$harness.log" || failed=1
          done
          exit "$failed"
      - name: Unapproved inbox cap copy still fails
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set +e
          INBOX_CONTROL=privatecap ONLY=simCareerInbox node scripts/runAllSims.mjs 2>&1 | tee career-season-review-artifacts/privatecap.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 1
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const output = fs.readFileSync('career-season-review-artifacts/privatecap.log', 'utf8');
          assert(output.includes('src/lib/inboxCapNegativeControl.ts carries a private copy of the drop-oldest-answered cap'));
          assert(output.includes('simCareerInbox: 1 failure'));
          console.log('The injected private cap was rejected; the distinct GM week cap remains allowed.');
          NODE
      - name: Native saved-season review across four sports
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/qa/careerSeasonReview1008.mjs 2>&1 | tee career-season-review-artifacts/native.log
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: career-season-review-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 1
          path: career-season-review-artifacts/
