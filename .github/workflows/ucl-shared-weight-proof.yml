name: UCL shared body size diagnostic

on:
  push:
    branches: [codex/ucl-shared-weight-proof]

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      CI: '1'
      SIM_NETWORK: offline
      CAREER_SEASON_LOCAL_ONLY: '1'
      ENGINES: chromium
      UCL_SHARED_WEIGHT_OUT: ${{ github.workspace }}/ucl-shared-weight-artifacts
      FREE_KICK_FONT_CACHE: ${{ github.workspace }}/ucl-shared-weight-artifacts/font-cache
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Bind unchanged source and locked packages
        run: |
          echo '127.0.0.1 flawuiqbvjobmkfkauhw.supabase.co' | sudo tee -a /etc/hosts
          mkdir -p "$UCL_SHARED_WEIGHT_OUT"
          git rev-parse HEAD > "$UCL_SHARED_WEIGHT_OUT/head.txt"
          git archive --format=zip HEAD > "$UCL_SHARED_WEIGHT_OUT/source.zip"
          git diff --exit-code 27de596241d8b32fc62cc99552a47cbb43a44410 -- src scripts package.json package-lock.json bun.lock ':!scripts/qa/measureUclSharedWeight.mjs' ':!scripts/fixtures/uclSharedWeight1383'
          find src scripts .github/workflows -type f -print0 | sort -z | xargs -0 sha256sum > "$UCL_SHARED_WEIGHT_OUT/source-hashes.txt"
          sha256sum package.json package-lock.json bun.lock > "$UCL_SHARED_WEIGHT_OUT/package-hashes.txt"
          npm ci
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const lock = JSON.parse(fs.readFileSync('package-lock.json'));
          const installed = Object.entries(lock.packages).filter(([p]) => p.startsWith('node_modules/') && fs.existsSync(p + '/package.json')).map(([p, row]) => {
            const version = JSON.parse(fs.readFileSync(p + '/package.json')).version;
            assert.equal(version, row.version, p); return { path: p, version };
          });
          assert.equal(installed.length, 521);
          fs.writeFileSync(process.env.UCL_SHARED_WEIGHT_OUT + '/installed.json', JSON.stringify(installed, null, 2));
          NODE
          find node_modules -type f -print0 | sort -z | xargs -0 sha256sum > "$UCL_SHARED_WEIGHT_OUT/installed-files.sha256"
      - name: Pinned isolated browser and declared fonts
        run: |
          echo "PW_TOOL_ROOT=$RUNNER_TEMP/ucl-shared-browser" >> "$GITHUB_ENV"
          npm install --prefix "$RUNNER_TEMP/ucl-shared-browser" --no-save --package-lock=false playwright@1.64.0
          ln -s "$RUNNER_TEMP/ucl-shared-browser/node_modules/playwright" node_modules/playwright
          ln -s "$RUNNER_TEMP/ucl-shared-browser/node_modules/playwright-core" node_modules/playwright-core
          node "$RUNNER_TEMP/ucl-shared-browser/node_modules/playwright/cli.js" install --with-deps chromium
          python -m pip install fonttools pillow
          node scripts/qa/freeKickLab1070.mjs --prefetch-fonts-only 2>&1 | tee "$UCL_SHARED_WEIGHT_OUT/fonts.log"
      - name: Diagnostic syntax
        run: node --check scripts/qa/measureUclSharedWeight.mjs
      - name: Three bound builds golden and measured routes
        run: NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/qa/measureUclSharedWeight.mjs 2>&1 | tee "$UCL_SHARED_WEIGHT_OUT/measurement.log"
      - name: Exact primary source and dependency holds
        if: always()
        run: |
          sha256sum --check "$UCL_SHARED_WEIGHT_OUT/source-hashes.txt" > "$UCL_SHARED_WEIGHT_OUT/source-holds.log"
          sha256sum --check "$UCL_SHARED_WEIGHT_OUT/package-hashes.txt" > "$UCL_SHARED_WEIGHT_OUT/package-holds.log"
          sha256sum --check "$UCL_SHARED_WEIGHT_OUT/installed-files.sha256" > "$UCL_SHARED_WEIGHT_OUT/installed-holds.log"
          git diff --exit-code -- src scripts package.json package-lock.json bun.lock .github/workflows public
      - name: Retain every outcome including reader and budget reds
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ucl-shared-weight-${{ github.run_id }}
          path: ucl-shared-weight-artifacts/
          retention-days: 14
          if-no-files-found: error
