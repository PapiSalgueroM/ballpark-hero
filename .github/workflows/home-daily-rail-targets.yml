name: Home control target verification
on:
  push:
    branches:
      - codex/home-daily-rail-targets-20261024
permissions:
  contents: read
concurrency:
  group: home-daily-rail-targets-${{ github.ref }}
  cancel-in-progress: false
jobs:
  home:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EXPECTED_PARENT: 1952a73fcbea94cd1eb02fefeb8365eda0113140
      ENGINES: chromium
      CI: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bind the exact source and preserve all other parent paths
        id: foundation
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/home-daily-rail-targets";test ! -e "$out";mkdir "$out"
          echo "DAILY_OUT=$out" >> "$GITHUB_ENV"
          echo "FREE_KICK_FONT_CACHE=$out/font-cache" >> "$GITHUB_ENV"
          test "$GITHUB_REPOSITORY" = PapiSalgueroM/ballpark-hero
          test "$GITHUB_REPOSITORY_ID" = 1195729679
          test "$GITHUB_REF" = refs/heads/codex/home-daily-rail-targets-20261024
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git show -s --format=%P HEAD)" = "$EXPECTED_PARENT"
          git diff --name-status "$EXPECTED_PARENT" HEAD > "$out/direct-paths.txt"
          printf 'M\t.github/workflows/home-daily-rail-targets.yml\nM\tdocs/PROJECT-STATE.md\nM\tsrc/components/home/FavouriteSport.tsx\n' | cmp - "$out/direct-paths.txt"
          git diff --exit-code "$EXPECTED_PARENT" HEAD -- . ':!.github/workflows/home-daily-rail-targets.yml' ':!docs/PROJECT-STATE.md' ':!src/components/home/FavouriteSport.tsx' > "$out/other-source-held.log"
          git rev-parse HEAD > "$out/head.txt";git rev-parse 'HEAD^{tree}' > "$out/tree.txt"
          git ls-files -z | sort -z > "$out/source-members.before"
          test "$(tr -cd '\000' < "$out/source-members.before" | wc -c)" -eq 5379
          git ls-files -z | sort -z | xargs -0 sha256sum > "$out/source.sha256"
          git diff --exit-code HEAD > "$out/source-clean-before.log"
          test -z "$(git status --porcelain --untracked-files=all)"
          git archive --format=tar HEAD > "$out/source.tar"
          : > "$out/foundation.transport"
          DAILY_OUT="$out" NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$out/foundation.transport" node <<'NODE' > "$out/foundation.log" 2>&1
          const fs=require('node:fs'),cp=require('node:child_process'),assert=require('node:assert/strict'),{createHash}=require('node:crypto'),out=process.env.DAILY_OUT;
          const sha=b=>createHash('sha256').update(b).digest('hex'),blob=b=>createHash('sha1').update(Buffer.from('blob '+b.length+'\0')).update(b).digest('hex');
          const target='src/components/home/FavouriteSport.tsx',before=cp.execFileSync('git',['show',process.env.EXPECTED_PARENT+':'+target]),after=fs.readFileSync(target);
          assert.equal(before.length,2567);assert.equal(sha(before),'40b04c143bace0c9d5cb9b4059b168e54ac6748de8cd8586d0fe70246a1593cc');
          assert.equal(blob(before),'d258e232939118afe33c1b35fa2dede446808898');
          const old="'inline-flex h-9 items-center gap-1.5 whitespace-nowrap rounded-full border px-3 text-xs font-semibold transition-colors'",next=old.replace('h-9','h-11');
          assert.equal(before.toString().split(old).length-1,1);assert.equal(after.toString(),before.toString().split(old).join(next));
          assert.equal(after.length,2568);assert.equal(sha(after),'f137be9c315d28a3fb8fbe5e0a60db31660115b61ca88fe75f192178540233e2');assert.equal(blob(after),'8f1cfc69c333d3fed3c8bb446a59c1adef62a369');
          assert.equal(blob(fs.readFileSync('src/components/home/DailyRail.tsx')),'c635f0cd4716172d67ca3852c5dcfa6932ab7555');
          const doc='docs/PROJECT-STATE.md',prior=cp.execFileSync('git',['show',process.env.EXPECTED_PARENT+':'+doc],{maxBuffer:8*1024*1024}),current=fs.readFileSync(doc);
          assert.equal(blob(prior),'08941eaec115fce991a9edf732d94016bdbadeb1');assert(current.subarray(0,prior.length).equals(prior));assert(current.length>prior.length);assert(current.length-prior.length<4096);
          assert.equal(cp.execFileSync('git',['hash-object','scripts/sweepWeight.mjs'],{encoding:'utf8'}).trim(),'10fa2bd492f37a59f77af9356691d7b1248141de');
          assert.equal(sha(fs.readFileSync('scripts/lib/offlineTransport.cjs')),'e60ff1534307e449ccef598e3b7470dcba58681b82cea4005cec7319f14f9221');
          assert.equal(cp.execFileSync('git',['ls-tree','-r','--name-only',process.env.EXPECTED_PARENT],{encoding:'utf8',maxBuffer:8*1024*1024}).trim().split('\n').length,5379);
          fs.writeFileSync(out+'/source-binding.json',JSON.stringify({source:process.env.GITHUB_SHA,parent:process.env.EXPECTED_PARENT,tree:cp.execFileSync('git',['rev-parse','HEAD^{tree}'],{encoding:'utf8'}).trim(),run:process.env.GITHUB_RUN_ID,attempt:process.env.GITHUB_RUN_ATTEMPT,directPaths:3,parentBlobs:5379,sourceBlobs:5379,product:{target,bytes:after.length,sha256:sha(after),gitBlob:blob(after)},docPrefixHeld:true,protectedGamesAndCapsHeld:true,fullSuite:false,livePublished:false},null,2)+'\n',{flag:'wx'});
          NODE
          test ! -s "$out/foundation.transport"
      - name: Locked packages and isolated browser tools
        id: install
        timeout-minutes: 15
        run: |
          set -euo pipefail
          out="$DAILY_OUT"
          npm ci > "$out/npm-ci.log" 2>&1
          browser_tools="$RUNNER_TEMP/home-daily-rail-tools";test ! -e "$browser_tools"
          echo "DAILY_BROWSER_TOOLS=$browser_tools" >> "$GITHUB_ENV"
          npm install --prefix "$browser_tools" --no-save --package-lock=false playwright@1.64.0 > "$out/playwright-install.log" 2>&1
          test ! -e node_modules/playwright;test ! -e node_modules/playwright-core
          ln -s "$browser_tools/node_modules/playwright" node_modules/playwright
          ln -s "$browser_tools/node_modules/playwright-core" node_modules/playwright-core
          for name in playwright playwright-core;do readlink -f "node_modules/$name";done > "$out/browser-links.before"
          node "$browser_tools/node_modules/playwright/cli.js" install --with-deps chromium > "$out/chromium-install.log" 2>&1
          python -m pip install fonttools pillow > "$out/python-install.log" 2>&1
          FREE_KICK_FONT_CACHE="$out/font-cache" node scripts/qa/freeKickLab1070.mjs --prefetch-fonts-only > "$out/font-prefetch.log" 2>&1
          echo "FONT_CACHE_MANIFEST_SHA256=$(sha256sum "$out/font-cache/manifest.json" | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
          find node_modules -type f -print0 | sort -z > "$out/dependency-members.before"
          find node_modules -type f -print0 | sort -z | xargs -0 sha256sum > "$out/dependencies.sha256"
          find "$browser_tools" -type f -print0 | sort -z > "$out/browser-members.before"
          find "$browser_tools" -type f -print0 | sort -z | xargs -0 sha256sum > "$out/browser-tools.sha256"
          find "$out/font-cache" -type f -print0 | sort -z > "$out/font-members.before"
          find "$out/font-cache" -type f -print0 | sort -z | xargs -0 sha256sum > "$out/font-cache.sha256"
      - name: Types build existing gates and actual browser observations
        id: checks
        run: |
          set -euo pipefail
          out="$DAILY_OUT"
          cat > "$out/capture.template" <<'CAPTURE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { chromium } from 'PLAYWRIGHT_LOADER';
          import { loadFonts, inventory, staticRequest, seed } from 'SITE_SUPPORT';
          const out=process.env.DAILY_OUT, base='http://127.0.0.1:4173';
          const fonts=loadFonts(process.env.FREE_KICK_FONT_CACHE,process.env.FONT_CACHE_MANIFEST_SHA256);
          const files=new Set(inventory('dist').map(row=>'/'+row.file));
          const browser=await chromium.launch();
          const cases=[];
          function sample(){
            const section=document.querySelector('[data-home-dailies]');
            const rail=section.querySelector('div.overflow-x-auto');
            const box=node=>{const r=node.getBoundingClientRect();return {x:r.x,y:r.y,width:r.width,height:r.height,right:r.right,bottom:r.bottom};};
            return {viewport:{width:innerWidth,height:innerHeight,scrollX,scrollY,documentWidth:document.documentElement.scrollWidth},
              reducedMotion:matchMedia('(prefers-reduced-motion: reduce)').matches,
              section:box(section),rail:{...box(rail),left:rail.scrollLeft,width:rail.clientWidth,contentWidth:rail.scrollWidth},
              arrows:[...section.querySelectorAll('button')].map(node=>{const r=box(node),visible=node.getClientRects().length>0&&getComputedStyle(node).visibility!=='hidden';
                return {label:node.getAttribute('aria-label'),...r,visible,focused:document.activeElement===node,centerHit:visible&&node.contains(document.elementFromPoint(r.x+r.width/2,r.y+r.height/2))};}),
              activeLabel:document.activeElement?.getAttribute('aria-label'),fonts:{status:document.fonts.status,inter:document.fonts.check('16px Inter'),display:document.fonts.check('16px "Space Grotesk"')},
              trusted:window.__siteMenuTrusted||[]};
          }
          
          function favouriteSample(){
            const section=document.querySelector('[data-home-fav-sport]');
            const rail=section.querySelector('div.overflow-x-auto');
            const box=node=>{const r=node.getBoundingClientRect();return {x:r.x,y:r.y,width:r.width,height:r.height,right:r.right,bottom:r.bottom};};
            return {viewport:{width:innerWidth,height:innerHeight,scrollX,scrollY,documentWidth:document.documentElement.scrollWidth},
              reducedMotion:matchMedia('(prefers-reduced-motion: reduce)').matches,
              section:{...box(section),documentTop:section.getBoundingClientRect().top+scrollY},
              rail:{...box(rail),left:rail.scrollLeft,width:rail.clientWidth,contentWidth:rail.scrollWidth},
              buttons:[...section.querySelectorAll('button[data-fav-sport]')].map(node=>{
                const r=box(node),visible=node.getClientRects().length>0&&getComputedStyle(node).visibility!=='hidden';
                const inViewport=visible&&r.x>=0&&r.y>=0&&r.right<=innerWidth&&r.bottom<=innerHeight;
                return {sport:node.getAttribute('data-fav-sport'),label:node.textContent.trim(),pressed:node.getAttribute('aria-pressed'),...r,visible,inViewport,
                  focused:document.activeElement===node,centerHit:visible&&node.contains(document.elementFromPoint(r.x+r.width/2,r.y+r.height/2))};
              }),
              stored:localStorage.getItem('dukb-fav-sport'),
              firstSport:document.querySelector('section[data-sport]')?.getAttribute('data-sport')??null,
              activeSport:document.activeElement?.getAttribute('data-fav-sport'),
              activeTag:document.activeElement?.tagName??null,activeIsBody:document.activeElement===document.body,
              fonts:{status:document.fonts.status,inter:document.fonts.check('16px Inter'),display:document.fonts.check('16px "Space Grotesk"')},
              trusted:window.__siteMenuTrusted||[]};
          }
          
          try{
            for(const width of [320,390,430,640,768,1440])for(const motion of ['no-preference','reduce']){
              const id=width+'-'+motion,ctx=await browser.newContext({viewport:{width,height:900},reducedMotion:motion});
              const record={id,width,motion,observations:[],favouriteObservations:[],errors:[],io:[]};
              const page=await ctx.newPage();
              page.on('pageerror',error=>record.errors.push({name:error.name,message:error.message,stack:error.stack}));
              await ctx.addInitScript(seed,{theme:'dark',pending:false});
              await ctx.route('**/*',async route=>{
                const req=route.request(),url=new URL(req.url()),font=fonts.get(req.url());
                if(font&&req.method()==='GET'&&['stylesheet','font'].includes(req.resourceType())){
                  record.io.push({kind:'prepared-font',url:req.url(),sha256:font.sha256});
                  return route.fulfill({status:200,contentType:font.contentType,body:font.body});
                }
                if(url.origin===base){staticRequest(url,req.method(),base,files);return route.continue();}
                record.io.push({kind:'external-abort',url:req.url(),method:req.method(),resourceType:req.resourceType()});
                return route.abort();
              });
              try{
                await page.goto(base+'/',{waitUntil:'domcontentloaded'});
                await page.locator('[data-home-dailies]').waitFor();
                await page.evaluate(()=>document.fonts.ready);
                await page.screenshot({path:path.join(out,id+'-home.png')});
                await page.locator('[data-home-dailies]').scrollIntoViewIfNeeded();
                await page.waitForTimeout(250);
                record.observations.push({name:'before',value:await page.evaluate(sample)});
                if(width>=640){
                  const right=page.getByRole('button',{name:'Scroll the daily puzzles on',exact:true});
                  const left=page.getByRole('button',{name:'Scroll the daily puzzles back',exact:true});
                  const rect=await right.boundingBox();
                  await page.mouse.click(rect.x+rect.width/2,rect.y+rect.height/2);
                  await page.waitForTimeout(800);
                  record.observations.push({name:'pointer-right',value:await page.evaluate(sample)});
                  await left.focus();await left.press('Enter');await page.waitForTimeout(800);
                  record.observations.push({name:'keyboard-enter-left',value:await page.evaluate(sample)});
                  await page.keyboard.press('Tab');
                  record.observations.push({name:'keyboard-tab-right',value:await page.evaluate(sample)});
                  await page.keyboard.press('Space');await page.waitForTimeout(800);
                  record.observations.push({name:'keyboard-space-right',value:await page.evaluate(sample)});
                }
                const favourite=page.locator('[data-home-fav-sport]');
                const golf=page.locator('button[data-fav-sport="golf"]');
                const observeFavourite=async name=>record.favouriteObservations.push({name,value:await page.evaluate(favouriteSample)});
                await observeFavourite('before-preparation');
                await favourite.scrollIntoViewIfNeeded();await golf.scrollIntoViewIfNeeded();
                await page.waitForTimeout(250);await observeFavourite('pointer-ready');
                const golfBox=await golf.boundingBox();
                await page.mouse.click(golfBox.x+golfBox.width/2,golfBox.y+golfBox.height/2);
                await page.waitForTimeout(250);await observeFavourite('pointer-golf');
                await page.keyboard.press('Enter');
                await page.waitForTimeout(250);await observeFavourite('keyboard-enter-clear');
                await page.keyboard.press('Space');
                await page.waitForTimeout(250);await observeFavourite('keyboard-space-golf');
                await page.reload({waitUntil:'domcontentloaded'});
                await favourite.waitFor();await page.evaluate(()=>document.fonts.ready);
                await observeFavourite('after-reload');
                await favourite.scrollIntoViewIfNeeded();await golf.scrollIntoViewIfNeeded();
                await page.waitForTimeout(250);await observeFavourite('after-reload-prepared');
                await page.screenshot({path:path.join(out,id+'-favourite.png')});
                record.complete=true;
              }catch(error){record.failure={name:error.name,message:error.message,stack:error.stack};throw error;}
              finally{cases.push(record);fs.writeFileSync(path.join(out,id+'.json'),JSON.stringify(record,null,2)+'\n',{flag:'wx'});await ctx.close();}
            }
          }finally{
            await browser.close();
            fs.writeFileSync(path.join(out,'browser-observations.json'),JSON.stringify({source:process.env.GITHUB_SHA,run:process.env.GITHUB_RUN_ID,attempt:process.env.GITHUB_RUN_ATTEMPT,observationsOnly:true,pixelsReviewed:false,cases},null,2)+'\n',{flag:'wx'});
          }
          console.log('Retained '+cases.length+' actual browser contexts. Geometry and original pixels require review.');
          CAPTURE
          cat > "$out/run.cjs" <<'RUNNER'
          const fs=require('node:fs'),cp=require('node:child_process'),path=require('node:path');
          const out=process.env.DAILY_OUT,guard=path.resolve('scripts/lib/offlineTransport.cjs'),rows=[],failures=[];
          const save=(name,value)=>fs.writeFileSync(path.join(out,name),JSON.stringify(value,null,2)+'\n',{flag:'wx'});
          const deadlines={types:240000,build:900000,homefront:180000,homefold:240000,'daily-capture':240000,caps:300000};
          async function run(id,command,args=[],extra={}){
            const deadlineMs=deadlines[id]??180000;
            const receipt=path.join(out,id+'.transport');fs.writeFileSync(receipt,'',{flag:'wx'});
            const stdout=fs.openSync(path.join(out,id+'.stdout'),'wx'),stderr=fs.openSync(path.join(out,id+'.stderr'),'wx');
            const record={id,command,args,startedAt:new Date().toISOString(),pid:null,status:null,signal:null,error:null,closed:false,deadlineMs,deadlineExpired:false,signalAttempts:[]};
            const child=cp.spawn(command,args,{detached:true,stdio:['ignore',stdout,stderr],env:{...process.env,NODE_OPTIONS:'--require='+guard,SIM_OFFLINE_RECEIPT:receipt,...extra}});
            record.pid=child.pid??null;save(id+'.start.json',record);
            let termTimer=null,killTimer=null;
            const signalGroup=signal=>{
              const attempt={signal,at:new Date().toISOString(),error:null};
              try{process.kill(-child.pid,signal);}catch(error){attempt.error={name:error.name,message:error.message,code:error.code??null};}
              record.signalAttempts.push(attempt);
            };
            if(child.pid)termTimer=setTimeout(()=>{
              record.deadlineExpired=true;signalGroup('SIGTERM');
              killTimer=setTimeout(()=>{if(!record.closed)signalGroup('SIGKILL');},15000);
            },deadlineMs);
            child.on('error',error=>record.error={name:error.name,message:error.message,code:error.code??null});
            await new Promise(resolve=>child.on('close',(status,signal)=>{record.status=status;record.signal=signal;record.closed=true;record.closedAt=new Date().toISOString();resolve();}));
            if(termTimer)clearTimeout(termTimer);if(killTimer)clearTimeout(killTimer);
            fs.closeSync(stdout);fs.closeSync(stderr);
            record.receiptBytes=fs.statSync(receipt).size;record.stdoutBytes=fs.statSync(path.join(out,id+'.stdout')).size;record.stderrBytes=fs.statSync(path.join(out,id+'.stderr')).size;
            save(id+'.closed.json',record);rows.push(record);
            if(record.deadlineExpired||record.status!==0||record.signal!==null||record.error||record.receiptBytes!==0)failures.push(id);
            return record;
          }
          (async()=>{
            let server=null,serverDone=null;
            try{
              await run('types',process.execPath,['node_modules/typescript/bin/tsc','--noEmit','-p','tsconfig.app.json']);
              const built=await run('build','npm',['run','build']);
              if(built.status!==0)throw Error('Production build failed; browser and completed-dist readers not started');
              cp.execFileSync('bash',['-eu','-o','pipefail','-c','find dist -type f -print0 | sort -z > "$DAILY_OUT/dist-members.before"; find dist -type f -print0 | sort -z | xargs -0 sha256sum > "$DAILY_OUT/dist.sha256"; tar -cf "$DAILY_OUT/dist.tar" -C dist .']);
              await run('homefront',process.execPath,['scripts/simHomeFront.mjs']);
              const readers=['simAdsense','simBrand','simHeadTags','simHiddenPages','simHubs','simIndexNow','simIndexing','simInternalLinks','simNoRivalNames','simPrerender','simPrerenderBoot','simRetiredRoutes','simSchema','simSitemap','simSnapshotAssets','simSiteSearch','simGuideHeadings','simLegalPages'];
              for(const method of readers)await run(method,process.execPath,['scripts/'+method+'.mjs']);
              const receipt=path.join(out,'server.transport');fs.writeFileSync(receipt,'',{flag:'wx'});
              const stdout=fs.openSync(path.join(out,'server.stdout'),'wx'),stderr=fs.openSync(path.join(out,'server.stderr'),'wx');
              const sr={pid:null,status:null,signal:null,error:null,startedAt:new Date().toISOString(),closed:false};
              server=cp.spawn(process.execPath,['scripts/lib/hostLikeServer.mjs','dist','4173'],{stdio:['ignore',stdout,stderr],env:{...process.env,NODE_OPTIONS:'--require='+guard,SIM_OFFLINE_RECEIPT:receipt}});
              sr.pid=server.pid??null;save('server.start.json',sr);
              serverDone=new Promise(resolve=>{server.on('error',e=>sr.error={name:e.name,message:e.message,code:e.code??null});server.on('close',(status,signal)=>{sr.status=status;sr.signal=signal;sr.closed=true;sr.closedAt=new Date().toISOString();fs.closeSync(stdout);fs.closeSync(stderr);save('server.closed.json',sr);resolve();});});
              for(let attempt=0;;attempt++){try{const response=await fetch('http://127.0.0.1:4173/');if(!response.ok)throw Error('Server not ready');await response.arrayBuffer();break;}catch(error){if(attempt===9)throw error;await new Promise(resolve=>setTimeout(resolve,500));}}
              await run('homefold',process.execPath,['scripts/playHomeFold.mjs'],{BASE:'http://127.0.0.1:4173'});
              await run('daily-capture',process.execPath,[path.join(out,'capture.mjs')]);
              await run('caps',process.execPath,['scripts/sweepWeight.mjs'],{BASE:'http://127.0.0.1:4173',SWEEP_BASE:'http://127.0.0.1:4173',SWEEP_OFFLINE:'1',NODE_OPTIONS:'--require='+guard+' --require='+path.join(out,'caps-preload.cjs')});
            }catch(error){save('orchestration-error.json',{name:error.name,message:error.message,stack:error.stack});failures.push('orchestration');}
            finally{
              if(server){server.kill('SIGTERM');await serverDone;}
              save('native-processes.json',{source:process.env.GITHUB_SHA,run:process.env.GITHUB_RUN_ID,attempt:process.env.GITHUB_RUN_ATTEMPT,rows,failures,fullSuite:false,livePublished:false,pixelsReviewed:false});
            }
            process.exitCode=failures.length?1:0;
          })().catch(error=>{console.error(error);process.exitCode=1;});
          RUNNER
          cat > "$out/caps-preload.cjs" <<'PRELOAD'
          'use strict';
          const fs=require('node:fs'),path=require('node:path'),assert=require('node:assert/strict'),{createHash}=require('node:crypto');
          const sha=b=>createHash('sha256').update(b).digest('hex');
          const dir=process.env.FREE_KICK_FONT_CACHE,manifest=fs.readFileSync(path.join(dir,'manifest.json'));
          assert.equal(sha(manifest),process.env.FONT_CACHE_MANIFEST_SHA256);
          const fonts=new Map();
          for(const entry of JSON.parse(manifest)){
            const u=new URL(entry.url);assert(['https://fonts.googleapis.com','https://fonts.gstatic.com'].includes(u.origin));
            assert.equal(entry.file,sha(entry.url));assert(!fonts.has(entry.url));
            const body=fs.readFileSync(path.join(dir,entry.file));assert.equal(sha(body),entry.sha256);fonts.set(entry.url,{...entry,body});
          }
          const pw=require(path.join(process.cwd(),'node_modules/playwright-core')),launch=pw.chromium.launch.bind(pw.chromium);
          pw.chromium.launch=async options=>{
            const browser=await launch(options),newContext=browser.newContext.bind(browser);
            browser.newContext=async options=>{
              const context=await newContext(options);
              await context.route('**/*',async route=>{
                const req=route.request(),u=new URL(req.url()),entry=fonts.get(req.url());
                if(entry&&req.method()==='GET'&&['stylesheet','font'].includes(req.resourceType())){
                  fs.appendFileSync(process.env.DAILY_OUT+'/caps-prepared-io.jsonl',JSON.stringify({kind:'prepared-font',url:req.url(),sha256:entry.sha256})+'\n');
                  return route.fulfill({status:200,contentType:entry.contentType,body:entry.body});
                }
                if(u.origin==='https://flagcdn.com'&&!u.username&&!u.password&&!u.search&&!u.hash&&req.method()==='GET'&&req.resourceType()==='image'&&/^\/(?:w[1-9][0-9]{0,2}\/|h[1-9][0-9]{0,2}\/|[1-9][0-9]{0,2}x[1-9][0-9]{0,2}\/)?[a-z]{2}(?:-[a-z0-9]{1,8})?\.(?:png|webp|svg)$/.test(u.pathname)){
                  fs.appendFileSync(process.env.DAILY_OUT+'/caps-prepared-io.jsonl',JSON.stringify({kind:'flag-abort',url:req.url()})+'\n');
                  return route.abort();
                }
                return route.fallback();
              });
              return context;
            };
            return browser;
          };
          PRELOAD
          : > "$out/payload-prepare.transport";status=0
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$out/payload-prepare.transport" node <<'NODE' > "$out/payload-prepare.stdout" 2> "$out/payload-prepare.stderr" || status=$?
          const fs=require('node:fs'),{pathToFileURL}=require('node:url'),path=require('node:path'),out=process.env.DAILY_OUT;
          const text=fs.readFileSync(out+'/capture.template','utf8').replace('PLAYWRIGHT_LOADER',pathToFileURL(path.resolve('scripts/lib/playwrightLoader.mjs')).href).replace('SITE_SUPPORT',pathToFileURL(path.resolve('scripts/qa/siteMenuNavigationSupport.mjs')).href);
          fs.writeFileSync(out+'/capture.mjs',text,{flag:'wx'});
          NODE
          printf '%s\n' "$status" > "$out/payload-prepare.exit"
          test "$status" -eq 0;test ! -s "$out/payload-prepare.transport"
          find "$out" -maxdepth 1 -type f \( -name '*.cjs' -o -name '*.mjs' -o -name '*.template' \) -print0 | sort -z | xargs -0 sha256sum > "$out/generated.sha256"
          : > "$out/orchestrator.transport";status=0
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$out/orchestrator.transport" node "$out/run.cjs" > "$out/orchestrator.stdout" 2> "$out/orchestrator.stderr" || status=$?
          printf '%s\n' "$status" > "$out/orchestrator.exit"
          test "$status" -eq 0
      - name: Complete source dependency tool font and dist holds
        id: holds
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: |
          set -euo pipefail
          out="$DAILY_OUT";failed=0
          for name in source dependencies browser-tools font-cache generated dist;do
            if test -f "$out/$name.sha256";then sha256sum -c "$out/$name.sha256" > "$out/$name-hold.log" 2>&1 || failed=1;else printf 'Missing required manifest\n' > "$out/$name-hold.log";failed=1;fi
          done
          git ls-files -z | sort -z > "$out/source-members.after"
          cmp "$out/source-members.before" "$out/source-members.after" || failed=1
          find node_modules -type f -print0 | sort -z > "$out/dependency-members.after"
          cmp "$out/dependency-members.before" "$out/dependency-members.after" || failed=1
          find "$DAILY_BROWSER_TOOLS" -type f -print0 | sort -z > "$out/browser-members.after"
          cmp "$out/browser-members.before" "$out/browser-members.after" || failed=1
          find "$out/font-cache" -type f -print0 | sort -z > "$out/font-members.after"
          cmp "$out/font-members.before" "$out/font-members.after" || failed=1
          find dist -type f -print0 | sort -z > "$out/dist-members.after"
          cmp "$out/dist-members.before" "$out/dist-members.after" || failed=1
          for name in playwright playwright-core;do readlink -f "node_modules/$name";done > "$out/browser-links.after"
          cmp "$out/browser-links.before" "$out/browser-links.after" || failed=1
          git diff --exit-code HEAD > "$out/source-clean-after.log" || failed=1
          test -z "$(git status --porcelain --untracked-files=all)" || failed=1
          for name in foundation orchestrator server;do test -f "$out/$name.transport" && test ! -s "$out/$name.transport" || failed=1;done
          printf '%s\n' "$failed" > "$out/final-holds.exit"
          exit "$failed"
      - name: Seal all retained evidence including partial failures
        if: ${{ always() && steps.foundation.outcome != 'skipped' }}
        run: |
          set -euo pipefail
          out="$DAILY_OUT";test -d "$out"
          cd "$out"
          find . ! -type d ! -type f -print > nonregular.txt
          test ! -s nonregular.txt
          find . -type f ! -name evidence.sha256 -print0 | sort -z | xargs -0 sha256sum > evidence.sha256
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.foundation.outcome != 'skipped' }}
        with:
          name: home-daily-rail-targets-${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ env.DAILY_OUT }}
          if-no-files-found: error
          retention-days: 30
