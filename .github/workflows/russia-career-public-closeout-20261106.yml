      - name: Retain bounded complete delivery proof or fatal diagnostic
        id: evidence
        if: always()
        shell: bash
        run: |
          set +e
          set -uo pipefail
          archive="$RUNNER_TEMP/russia-career-public-closeout.tar.xz"
          tar -I 'xz -9' -cf "$archive" -C "$QA_OUT" . > "$RUNNER_TEMP/russia-career-public-closeout-pack.log" 2>&1
          pack_exit=$?
          printf '%s\n' "$pack_exit" > "$QA_OUT/pack-native.exit" || exit 1
          if [[ "$pack_exit" == 0 && -f "$archive" && "$(stat -c %s "$archive")" -le 50000000 ]]; then
            sha256sum "$archive" > "$archive.sha256" || exit 1
            printf 'archive=%s\n' "$archive" >> "$GITHUB_OUTPUT" || exit 1
            exit 0
          fi
          printf '%s\n' 'DIAGNOSTIC_ONLY_NO_COMPLETE_PUBLIC_DELIVERY_PROOF: full pack failed or exceeded50000000bytes' > "$QA_OUT/DIAGNOSTIC-ONLY.txt" || exit 1
          cp "$RUNNER_TEMP/russia-career-public-closeout-pack.log" "$QA_OUT/pack.log" || exit 1
          node --input-type=module <<'DIAGNOSTIC'
          import fs from 'node:fs';import path from 'node:path';import crypto from 'node:crypto';
          const root=process.env.QA_OUT,sha=b=>crypto.createHash('sha256').update(b).digest('hex'),rows=[];
          function walk(rel=''){for(const entry of fs.readdirSync(path.join(root,rel),{withFileTypes:true})){const file=path.posix.join(rel,entry.name);if(entry.isDirectory())walk(file);else if(entry.isFile()){const bytes=fs.readFileSync(path.join(root,file));rows.push({file,bytes:bytes.length,sha256:sha(bytes)});}}}walk();
          fs.writeFileSync(root+'/fatal-full-output-inventory.json',JSON.stringify({status:'DIAGNOSTIC_ONLY',completePublicDeliveryProof:false,fullArchive:fs.existsSync(path.join(process.env.RUNNER_TEMP,'russia-career-public-closeout.tar.xz'))?{bytes:fs.statSync(path.join(process.env.RUNNER_TEMP,'russia-career-public-closeout.tar.xz')).size,sha256:sha(fs.readFileSync(path.join(process.env.RUNNER_TEMP,'russia-career-public-closeout.tar.xz')))}:null,fullOutput:rows.sort((a,b)=>a.file<b.file?-1:a.file>b.file?1:0),omittedFromDiagnostic:['delivered *.body and copied *.html files'],note:'Successful evidence is never truncated. This diagnostic has no delivery, SEO or submission qualification.'},null,2)+'\n');
          DIAGNOSTIC
          test "$?" = 0 || exit 1
          diagnostic="$RUNNER_TEMP/russia-career-public-closeout-diagnostic.tar.gz"
          diagnostic_dir="$RUNNER_TEMP/russia-career-public-closeout-diagnostic"
          mkdir -p "$diagnostic_dir/logs" "$diagnostic_dir/input" || exit 1
          find "$QA_OUT" -maxdepth 1 -type f ! -name '*.body' ! -name '*.html' -exec cp '{}' "$diagnostic_dir/" \; || exit 1
          cp -R "$QA_OUT/logs/." "$diagnostic_dir/logs/" || exit 1
          cp -R "$QA_OUT/input/." "$diagnostic_dir/input/" || exit 1
          tar -czf "$diagnostic" -C "$diagnostic_dir" . || exit 1
          test "$(stat -c %s "$diagnostic")" -le 50000000 || exit 1
          sha256sum "$diagnostic" > "$diagnostic.sha256" || exit 1
          printf 'archive=%s\n' "$diagnostic" >> "$GITHUB_OUTPUT" || exit 1
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: russia-career-public-closeout
          path: |
            ${{ steps.evidence.outputs.archive }}
            ${{ steps.evidence.outputs.archive }}.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
