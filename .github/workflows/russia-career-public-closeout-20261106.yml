      - name: Always hold source index locks complete original inputs and completed output
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git ls-files -z > "$QA_OUT/tracked-after.bin"
          git ls-files -z | xargs -0 sha256sum > "$QA_OUT/source-after.sha256"
          git ls-files -s > "$QA_OUT/index-after.txt"
          git status --porcelain=v1 --untracked-files=all > "$QA_OUT/status-after.txt"
          cp package-lock.json "$QA_OUT/lock-after.json"
          node --input-type=module <<'HOLDS'
          import fs from 'node:fs';import path from 'node:path';import crypto from 'node:crypto';import assert from 'node:assert/strict';
          const out=process.env.QA_OUT,sha=b=>crypto.createHash('sha256').update(b).digest('hex'),errors=[];
          const inventory=dir=>{const rows=[];function walk(rel=''){for(const entry of fs.readdirSync(path.join(dir,rel),{withFileTypes:true})){const file=path.posix.join(rel,entry.name);if(entry.isDirectory())walk(file);else{assert(entry.isFile());const bytes=fs.readFileSync(path.join(dir,file));rows.push({file,bytes:bytes.length,sha256:sha(bytes)});}}}walk();return rows.sort((a,b)=>a.file<b.file?-1:a.file>b.file?1:0);};
          function compare(before,after,label){try{assert(fs.readFileSync(out+'/'+before).equals(fs.readFileSync(out+'/'+after)),label);}catch(error){errors.push({label,error:String(error.stack||error)});}}
          for(const pair of[['tracked-before.bin','tracked-after.bin','tracked'],['source-before.sha256','source-after.sha256','source'],['index-before.txt','index-after.txt','index'],['lock-before.json','lock-after.json','package-lock']])compare(...pair);
          for(const name of['status-before.txt','status-after.txt'])try{assert.equal(fs.readFileSync(out+'/'+name).length,0,name);}catch(error){errors.push({label:name,error:String(error.stack||error)});}
          const locks=Object.fromEntries(['package.json','package-lock.json','bun.lock','bun.lockb','yarn.lock','pnpm-lock.yaml'].map(file=>[file,fs.existsSync(file)?sha(fs.readFileSync(file)):null]));fs.writeFileSync(out+'/all-locks-after.json',JSON.stringify(locks)+'\n');
          try{assert.deepEqual(locks,JSON.parse(fs.readFileSync(out+'/all-locks-before.json')));}catch(error){errors.push({label:'all-locks',error:String(error.stack||error)});}
          for(const [root,before,after,label]of[[process.env.QA_REF,'input-reference-before.json','input-reference-after.json','complete-original-inputs'],[process.env.QA_DIST,'dist-before.json','dist-after.json','completed-dist']]){if(!fs.existsSync(out+'/'+before)){errors.push({label,error:'Input baseline was not prepared; no hold credit.'});continue;}try{const bytes=Buffer.from(JSON.stringify(inventory(root))+'\n');fs.writeFileSync(out+'/'+after,bytes);assert(bytes.equals(fs.readFileSync(out+'/'+before)),label);}catch(error){errors.push({label,error:String(error.stack||error)});}}
          fs.writeFileSync(out+'/source-dist-input-held.json',JSON.stringify({status:errors.length?'HOLD_FAILED':'SOURCE_INDEX_LOCKS_INPUT_AND_DIST_HELD',source:!errors.some(row=>row.label==='source'),index:!errors.some(row=>row.label==='index'),tracked:!errors.some(row=>row.label==='tracked'),locks:!errors.some(row=>/lock/.test(row.label)),completeInputHeld:!errors.some(row=>row.label==='complete-original-inputs'),completedDistHeld:!errors.some(row=>row.label==='completed-dist'),cleanStatus:!errors.some(row=>/status/.test(row.label)),errors,AppBuilds:0,modelOrFixtureGeneration:false,publicAdmission:'Separate public-closeout.json only after delivery, audit and scoped submission succeed.'},null,2)+'\n',{flag:'wx'});
          assert.equal(errors.length,0,'RUSSIA_NATIVE_ALL_SOURCE_INPUT_DIST_HOLDS');
          HOLDS
          printf '0\n' > "$QA_OUT/logs/final-source-holds.exit" || exit 1
      - name: Close only delivery SEO and scoped submission evidence
        shell: bash
        run: |
          set +e
          set -uo pipefail
          node --input-type=module <<'ADMIT'
          import fs from 'node:fs';import assert from 'node:assert/strict';import{createHash}from'node:crypto';
          const e=process.env,out=e.QA_OUT,sha=b=>createHash('sha256').update(b).digest('hex'),read=file=>fs.readFileSync(out+'/'+file),http=JSON.parse(read('HTTP-DELIVERY.json')),held=JSON.parse(read('source-dist-input-held.json')),authority=JSON.parse(read('reference-authority.json'));
          for(const file of['reference-auth','http-delivery','http-tools-install','audit-live','indexnow','final-source-holds'])assert.equal(read('logs/'+file+'.exit').toString(),'0\n',file);
          assert.equal(http.status,'passed');assert.equal(http.controls.length,3);assert.deepEqual(http.controls.map(row=>row.label),['root-module-omission','deployment-mutation','boot-body-mutation']);assert.equal(held.status,'SOURCE_INDEX_LOCKS_INPUT_AND_DIST_HELD');assert.deepEqual(authority.product,http.product);assert.equal(http.main,e.MAIN_CORE);assert.equal(http.deployment,e.DEPLOYMENT);
          for(const row of http.responses.filter(row=>row.file)){const bytes=read(row.file);assert.equal(bytes.length,row.bytes);assert.equal(sha(bytes),row.sha256);}
          fs.writeFileSync(out+'/public-closeout.json',JSON.stringify({status:'DELIVERY_TWO_ROUTE_SEO_AND_SCOPED_INDEXNOW_PASSED',product:http.product,main:e.MAIN_CORE,deployment:e.DEPLOYMENT,qualificationAdmission:authority.qualification.independentAdmissionSHA256,nativeAdmission:authority.native.independentAdmissionSHA256,deliveredAssets:http.bindings.pins,routes:['/soccer-career','/club-manager'],controls:3,sourceHeld:true,inputsHeld:true,completedDistHeld:true,AppBuilds:0,modelCalls:0,browserGameplay:false,publishingActions:0,scope:'Delivered compiled bytes, raw HTML declarations, unchanged two-route SEO audit and two-URL IndexNow acceptance. No indexing guarantee or new public gameplay/protocol claim.'},null,2)+'\n',{flag:'wx'});
          ADMIT
          native_exit=$?
          printf '%s\n' "$native_exit" > "$QA_OUT/logs/public-closeout.exit" || exit 1
