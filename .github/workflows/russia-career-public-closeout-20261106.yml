      QUALIFICATION_REQUIRED_FILES: '["workflow.yml","source-role.json","qualification.json","bridge-source.mjs","bridge/BRIDGE.json","bridge/PHYSICAL-CONTROLS.json","bridge/cases/current-russia-manager-market.json.gz","bridge/cases/catalogue.json.gz","source-before.sha256","source-after.sha256","index-before.txt","index-after.txt","locks-before.sha256","locks-after.sha256","status-before.txt","status-after.txt","baseline-source-before.sha256","baseline-source-after.sha256","baseline-index-before.txt","baseline-index-after.txt","baseline-locks-before.sha256","baseline-locks-after.sha256","baseline-status-before.txt","baseline-status-after.txt","dist-before.sha256","dist-after.sha256","completed-dist.tar.gz","completed-dist.tar.gz.sha256","completed-dist-members.txt","build-passed.json","logs/bridge.exit","logs/bridge-controls.exit","transport/bridge.log","transport/bridge-controls.log","manifest.sha256","types.exit","types-passed.json","logs/types.log","transport/types.log","MODEL-OUTCOMES.json","baseline-regression-admission.json"]'
      NATIVE_REQUIRED_FILES: '["workflow.yml","input/native-manifest.json","browser/report.json","native-admission.json","source-dist-input-held.json","source-before.sha256","source-after.sha256","index-before.txt","index-after.txt","status-before.txt","status-after.txt","all-locks-before.json","all-locks-after.json","logs/native-admission.exit","logs/browser.exit","logs/final-source-holds.exit"]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.2'
      - name: Bind one QA workflow on the actual published merge
        shell: bash
        run: |
          set -euo pipefail
          QA_OUT="$RUNNER_TEMP/russia-career-public-closeout"
          QA_REF="$RUNNER_TEMP/russia-career-public-closeout-inputs"
          QA_DIST="$RUNNER_TEMP/russia-career-public-closeout-dist"
          export QA_OUT QA_REF QA_DIST
          test ! -e "$QA_OUT"
          test ! -e "$QA_REF"
          test ! -e "$QA_DIST"
          mkdir -p "$QA_OUT"/{input,logs} "$QA_REF" "$QA_DIST"
          printf 'QA_OUT=%s\nQA_REF=%s\nQA_DIST=%s\n' "$QA_OUT" "$QA_REF" "$QA_DIST" >> "$GITHUB_ENV"
          node --input-type=module <<'BIND'
          import fs from 'node:fs';import assert from 'node:assert/strict';import{execFileSync}from'node:child_process';
          const e=process.env,git=(...args)=>execFileSync('git',args,{encoding:'utf8'}).trim();
          for(const key of['MAIN_CORE','PRODUCT_CORE','PRODUCT_TREE'])assert.match(e[key],/^[a-f0-9]{40}$/,key);
          assert.match(e.DEPLOYMENT,/^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$/);
          for(const key of['QUALIFICATION_INPUT','NATIVE_INPUT','PRODUCT_FILES','DELIVERY_BINDINGS'])assert(!e[key].includes('MUST_BIND'),'PUBLIC_ALL_ACTUAL_FIELDS_BOUND '+key);
          assert.equal(git('rev-parse','HEAD^'),e.MAIN_CORE);assert.equal(git('rev-parse','HEAD^^{tree}'),e.PRODUCT_TREE);
          assert.equal(git('diff','--name-status','--no-renames','HEAD^','HEAD'),'A\t'+e.PUBLIC_WORKFLOW);
          const vector=object=>Object.fromEntries(git('ls-tree','-r','--full-tree',object).split('\n').filter(Boolean).map(line=>{const m=/^([0-7]{6}) (blob|commit) ([a-f0-9]{40})\t(.+)$/.exec(line);assert(m);return[m[4],{mode:m[1],type:m[2],sha:m[3]}];})),current=vector('HEAD'),parent=vector('HEAD^');
          assert.equal(parent[e.PUBLIC_WORKFLOW],undefined);assert.equal(current[e.PUBLIC_WORKFLOW].mode,'100644');assert.equal(current[e.PUBLIC_WORKFLOW].type,'blob');delete current[e.PUBLIC_WORKFLOW];assert.deepEqual(current,parent,'PUBLIC_SOLE_WORKFLOW_WHOLE_TREE_INVERSE');
          assert.equal(git('status','--porcelain=v1','--untracked-files=all'),'');
          fs.copyFileSync(e.PUBLIC_WORKFLOW,e.QA_OUT+'/workflow.yml');
          fs.writeFileSync(e.QA_OUT+'/qa-delta.json',JSON.stringify({main:e.MAIN_CORE,product:e.PRODUCT_CORE,tree:e.PRODUCT_TREE,qa:{commit:git('rev-parse','HEAD'),tree:git('rev-parse','HEAD^{tree}')},soleAddition:e.PUBLIC_WORKFLOW,workflowBlob:git('hash-object',e.PUBLIC_WORKFLOW),wholeSourceInverse:true,AppBuilds:0,gameplay:false,deployActions:0},null,2)+'\n',{flag:'wx'});
          BIND
          git ls-files -z > "$QA_OUT/tracked-before.bin"
          git ls-files -z | xargs -0 sha256sum > "$QA_OUT/source-before.sha256"
          git ls-files -s > "$QA_OUT/index-before.txt"
          git status --porcelain=v1 --untracked-files=all > "$QA_OUT/status-before.txt"
          test ! -s "$QA_OUT/status-before.txt"
          cp package-lock.json "$QA_OUT/lock-before.json"
          node --input-type=module -e 'import fs from "node:fs";import crypto from "node:crypto";const sha=b=>crypto.createHash("sha256").update(b).digest("hex");fs.writeFileSync(process.env.QA_OUT+"/all-locks-before.json",JSON.stringify(Object.fromEntries(["package.json","package-lock.json","bun.lock","bun.lockb","yarn.lock","pnpm-lock.yaml"].map(p=>[p,fs.existsSync(p)?sha(fs.readFileSync(p)):null])))+"\n");'
      - name: Materialize the pinned scoped qualification function
        shell: bash
        run: |
          set -euo pipefail
          common="$QA_OUT/input/scoped-common-auth.mjs"
          test ! -e "$common"
          cat > "$common" <<'SCOPED_AUTH'
          function admitScopedQualification(root,qualification,product){
           const fail='RUSSIA_SCOPED_MODEL_OUTCOME',receiptFail='RUSSIA_SCOPED_BASELINE_RECEIPT',decisionFail='RUSSIA_SCOPED_BASELINE_DECISION';
           const expectedNames=['bridge','bridge-controls','simCareerClubPool','simCareerFacts','simCareerEras','fallback-local-mode-absent','fallback-control-absent','simCareerFallback','fallback-read-admission','simCareerLeagueFinish','simCareerLeagueSeasons','simCareerLeagueWorld','simCareerDomesticCup','simCareerContinental','simSoccerCareerUcl','simLoanSpell','simCareerTransferBrief','simSoccerCareerSavedLoan','simSoccerLoanBite','simSoccerLoanMinutes','simTransferBriefPageControl','simSaveKeeper','simHomeFront','simHomeFront-output','simSoccerCareerRecords','simSoccerCareerRecords-output','records-admission','records-owned-cleanup','transfer-brief-output-retain'];
           const redNames=['simCareerLeagueFinish','simCareerLeagueSeasons','simCareerLeagueWorld'],zeroNames=expectedNames.filter(name=>!redNames.includes(name));
           const baseline={commit:'636b31efd64b749d4900e3f5773681e0496addf6',tree:'9b6671db9c6f56db7bfd572521cf4e37cf7011a7'};
           const baselineQA={commit:'1cc08ce611872bd4a89281dcf20502585c8a8157',tree:'88da3481338ee90d01263d7d4353e516272efd10',helperRows:[
            {path:'scripts/lib/careerLeagueWorld1175.mjs',mode:'100644',before:'c75128e88071d329b2fe8d973af897fe2207dd91',after:'ebcbe1083dd105732418d417cd86dacbb674daf7'},
            {path:'scripts/lib/careerWorldTruth1329.mjs',mode:'100644',before:'8dc0dce77a13188eb939f78b0eb1850ba81a39f2',after:'e4601cf0e83b356cc61c43f9d6d9ecd51908f66c'}]};
           const specifications=[
            {name:redNames[0],sections:['4'],findings:4,decisions:['FULL_RUSSIA_SOURCE_INVERSE_EQUAL'],evidence:'paired-finish-admission.json',closing:'simCareerLeagueFinish: 4 failure(s) in section(s) 4'},
            {name:redNames[1],sections:['a'],findings:582,decisions:['FULL_ORDERED_BASELINE_LOOKUP_AND_FAILURES_EQUAL'],evidence:'paired-seasons-admission.json',closing:'simCareerLeagueSeasons: 582 failures (sections a)'},
            {name:redNames[2],sections:['A'],findings:1,decisions:['EXACT_PREEXISTING_K_PARTIAL_FORMAT_LIMIT'],evidence:'world-partial-format-admission.json',closing:'simCareerLeagueWorld: 1 failure(s) in section(s) A'}];
           const bytes=file=>{safe(file);return fs.readFileSync(path.join(root,file));};
           function pinned(pin,file){
            assert(pin&&typeof pin==='object',receiptFail);assert.equal(pin.file,file,receiptFail);safe(file);
            assert(Number.isSafeInteger(pin.bytes)&&pin.bytes>=0,receiptFail);assert.match(pin.sha256,/^[a-f0-9]{64}$/,receiptFail);
            const body=bytes(file);assert.equal(body.length,pin.bytes,receiptFail+' '+file);assert.equal(sha(body),pin.sha256,receiptFail+' '+file);return body;
           }
           assert.equal(qualification.status,'SCOPED_RUSSIA_BUILD_AND_BRIDGE_PASSED_WITH_TWO_INHERITED_REDS_AND_ATTRIBUTED_FINISH_CHANGE',receiptFail);assert.equal(qualification.allOriginalOutcomesPassed,false,receiptFail);
           const receiptBytes=pinned(qualification.baselineRegressionAdmission,'baseline-regression-admission.json');
           assert.deepEqual(qualification.baselineRegressionAdmission,q.filePins.find(row=>row.file==='baseline-regression-admission.json'),receiptFail);
           const outcomePin=q.filePins.find(row=>row.file==='MODEL-OUTCOMES.json'),outcomeBytes=pinned(outcomePin,'MODEL-OUTCOMES.json');
           const outcomes=JSON.parse(outcomeBytes),regression=JSON.parse(receiptBytes);
           function validate(models,receipt){
            assert.equal(models.schema,'RUSSIA_COMPLETE_MODEL_OUTCOME_COLLECTION_V1',fail);assert.equal(models.status,'SOURCE_CLEAN_MODEL_OUTCOMES_COLLECTED',fail);
            assert.deepEqual(models.product,product,fail);assert.equal(models.collectorShellSuccessIsNotModelSuccess,true,fail);assert.equal(models.allOriginalOutcomesPassed,false,fail);assert.equal(models.qualification,false,fail);assert.equal(models.modelSourceIndexLocksAndStatusHeld,true,fail);
