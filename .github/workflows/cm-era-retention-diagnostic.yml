name: CM era retention paired diagnostic
on:
  push:
    branches: [codex/cm-era-retention-diagnostic-20261026]
permissions:
  contents: read
concurrency:
  group: cm-era-retention-${{ github.ref }}
  cancel-in-progress: false
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: true
      SIM_NETWORK: offline
      EXPECTED_PARENT: b20ec6664df9d4c58d63ea0596791d33b2a3b8fc
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Bind QA source and prepare detached source copies
        id: foundation
        timeout-minutes: 5
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/cm-era-retention-diagnostic"
          roots="$RUNNER_TEMP/cm-era-retention-source-roots"
          test ! -e "$out";test ! -L "$out";mkdir "$out"
          test ! -e "$roots";test ! -L "$roots"
          export CM_ERA_OUT="$out";echo "CM_ERA_OUT=$out" >> "$GITHUB_ENV"
          export CM_ERA_ROOTS="$roots";echo "CM_ERA_ROOTS=$roots" >> "$GITHUB_ENV"
          for name in SIM_ERAS_CONTROL SIM_SEED CM_ERA_CONTROL NODE_OPTIONS NODE_PATH NO_DOUBLE_SWAP VITEST ONLY;do test ! -v "$name";done
          test "$GITHUB_REPOSITORY" = PapiSalgueroM/ballpark-hero
          test "$GITHUB_REPOSITORY_ID" = 1195729679
          test "$GITHUB_REF" = refs/heads/codex/cm-era-retention-diagnostic-20261026
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git show -s --format=%P HEAD)" = "$EXPECTED_PARENT"
          test "$(git rev-parse "$EXPECTED_PARENT^{tree}")" = 51e0c6a06a6c4fb7d143b4d408eb5a9437737553
          git diff --name-status "$EXPECTED_PARENT" HEAD > "$out/direct-paths.txt"
          printf 'A\t.github/workflows/cm-era-retention-diagnostic.yml\nM\tdocs/PROJECT-STATE.md\nA\tscripts/qa/judgeCmEraRetention.mjs\nA\tscripts/qa/recordCmEraRetention.mjs\n' | cmp - "$out/direct-paths.txt"
          git diff --exit-code "$EXPECTED_PARENT" HEAD -- . ':!.github/workflows/cm-era-retention-diagnostic.yml' ':!docs/PROJECT-STATE.md' ':!scripts/qa/judgeCmEraRetention.mjs' ':!scripts/qa/recordCmEraRetention.mjs' > "$out/all-other-parent-source-held.log"
          git ls-tree -r --name-only "$EXPECTED_PARENT" > "$out/parent-members.txt"
          test "$(wc -l < "$out/parent-members.txt")" -eq 5378
          git rev-parse HEAD > "$out/head.txt";git rev-parse 'HEAD^{tree}' > "$out/tree.txt"
          git ls-files -z | sort -z > "$out/source-members.before"
          test "$(tr -cd '\000' < "$out/source-members.before" | wc -c)" -eq 5381
          xargs -0 sha256sum < "$out/source-members.before" > "$out/source.sha256"
          git status --porcelain --untracked-files=all > "$out/status-before.txt";test ! -s "$out/status-before.txt"
          git diff --exit-code HEAD > "$out/source-clean-before.log"
          git archive --format=tar HEAD > "$out/source.tar"
          printf 'e60ff1534307e449ccef598e3b7470dcba58681b82cea4005cec7319f14f9221  scripts/lib/offlineTransport.cjs\n1150b95459022f847766b934caf2952280554dd07dc4f1697725c520e5d746da  scripts/qa/recordCmEraRetention.mjs\n321099673a9c76377a84229cd5e486d89b67a89b488957a473e16a63196d7894  scripts/qa/judgeCmEraRetention.mjs\n' | sha256sum -c - > "$out/critical-before.log"
