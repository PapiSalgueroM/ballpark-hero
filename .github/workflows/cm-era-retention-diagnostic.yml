          pid=$!;printf '%s\n' "$pid" > "$out/foundation.pid";wait "$pid" || status=$?
          printf '%s\n' "$status" > "$out/foundation.exit";test "$status" -eq 0;test ! -s "$out/foundation.transport"
      - name: Install exact locked packages
        id: install
        timeout-minutes: 20
        run: |
          set -euo pipefail
          out="$CM_ERA_OUT";status=0
          npm ci > "$out/npm-ci.stdout" 2> "$out/npm-ci.stderr" &
          pid=$!;printf '%s\n' "$pid" > "$out/npm-ci.pid";wait "$pid" || status=$?
          printf '%s\n' "$status" > "$out/npm-ci.exit";test "$status" -eq 0
          find node_modules -type f -print0 | sort -z > "$out/dependency-members.before"
          test "$(tr -cd '\000' < "$out/dependency-members.before" | wc -c)" -eq 24466
          xargs -0 sha256sum < "$out/dependency-members.before" > "$out/dependencies.sha256"
          find node_modules -type l -printf '%p\t%l\0' | sort -z > "$out/dependency-links.before"
          find node_modules ! -type d ! -type f ! -type l -print > "$out/dependency-nonregular.before"
          test ! -s "$out/dependency-nonregular.before"
          for arm in baseline candidate;do
            root="$CM_ERA_ROOTS/$arm";test -d "$root";test ! -L "$root"
            ln -s "$PWD/node_modules" "$root/node_modules"
            find "$root" -type f -print0 | sort -z > "$out/$arm-source-members.before"
            test "$(tr -cd '\000' < "$out/$arm-source-members.before" | wc -c)" -eq 23
            xargs -0 sha256sum < "$out/$arm-source-members.before" > "$out/$arm-sources.sha256"
            find "$root" -type l -printf '%p\t%l\0' | sort -z > "$out/$arm-source-links.before"
            find "$root" ! -type d ! -type f ! -type l -print > "$out/$arm-source-nonregular.before";test ! -s "$out/$arm-source-nonregular.before"
          done
      - name: Record both full world arms before the unchanged guard judgment
        id: checks
        timeout-minutes: 27
        run: |
          set -euo pipefail
          out="$CM_ERA_OUT"
          sha256sum -c "$out/generated.sha256" > "$out/generated-pre-consumer.log"
          sha256sum -c "$out/payload.sha256" > "$out/payload-pre-consumer.log"
          : > "$out/orchestrator.transport";status=0
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$out/orchestrator.transport" node "$out/cm-era-retention-native.cjs" checks > "$out/orchestrator.stdout" 2> "$out/orchestrator.stderr" &
          pid=$!;printf '%s\n' "$pid" > "$out/orchestrator.pid";wait "$pid" || status=$?
          printf '%s\n' "$status" > "$out/orchestrator.exit";test "$status" -eq 0;test ! -s "$out/orchestrator.transport"
      - name: Hold canonical and detached sources dependencies and partial evidence
        id: holds
        if: ${{ always() && steps.foundation.outcome != 'skipped' }}
        timeout-minutes: 5
        run: |
          set -euo pipefail
          set +e
          out="$CM_ERA_OUT";failed=0
          for name in source dependencies generated payload baseline-sources candidate-sources;do
            if test -f "$out/$name.sha256" && test ! -L "$out/$name.sha256";then sha256sum -c "$out/$name.sha256" > "$out/$name-hold.log" 2>&1 || failed=1;else printf 'Missing required manifest\n' > "$out/$name-hold.log";failed=1;fi
          done
          git ls-files -z | sort -z > "$out/source-members.after"
          cmp "$out/source-members.before" "$out/source-members.after" > "$out/source-members-hold.log" 2>&1 || failed=1
          xargs -0 sha256sum < "$out/source-members.after" > "$out/source-after.sha256"
          tar --null -T "$out/source-members.after" -cf "$out/source-after.tar" || failed=1
          git diff --exit-code HEAD > "$out/source-dirty-after.log" 2>&1 || failed=1
          git status --porcelain --untracked-files=all > "$out/status-after.txt"
          test -f "$out/status-after.txt" && test ! -s "$out/status-after.txt" && test ! -s "$out/source-dirty-after.log" || failed=1
          find node_modules -type f -print0 | sort -z > "$out/dependency-members.after"
          cmp "$out/dependency-members.before" "$out/dependency-members.after" > "$out/dependency-members-hold.log" 2>&1 || failed=1
          xargs -0 sha256sum < "$out/dependency-members.after" > "$out/dependencies-after.sha256"
          find node_modules -type l -printf '%p\t%l\0' | sort -z > "$out/dependency-links.after"
          cmp "$out/dependency-links.before" "$out/dependency-links.after" > "$out/dependency-links-hold.log" 2>&1 || failed=1
          find node_modules ! -type d ! -type f ! -type l -print > "$out/dependency-nonregular.after";test ! -s "$out/dependency-nonregular.after" || failed=1
          for arm in baseline candidate;do
            root="$CM_ERA_ROOTS/$arm"
            if test -d "$root" && test ! -L "$root";then
              find "$root" -type f -print0 | sort -z > "$out/$arm-source-members.after"
              cmp "$out/$arm-source-members.before" "$out/$arm-source-members.after" > "$out/$arm-source-members-hold.log" 2>&1 || failed=1
              xargs -0 sha256sum < "$out/$arm-source-members.after" > "$out/$arm-sources-after.sha256"
              find "$root" -type l -printf '%p\t%l\0' | sort -z > "$out/$arm-source-links.after"
              cmp "$out/$arm-source-links.before" "$out/$arm-source-links.after" > "$out/$arm-source-links-hold.log" 2>&1 || failed=1
              find "$root" ! -type d ! -type f ! -type l -print > "$out/$arm-source-nonregular.after";test ! -s "$out/$arm-source-nonregular.after" || failed=1
            else printf 'Required source copy missing\n' > "$out/$arm-source-members-hold.log";failed=1;fi
          done
          : > "$out/final.transport";status=0
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$out/final.transport" node "$out/cm-era-retention-native.cjs" final > "$out/final.stdout" 2> "$out/final.stderr" &
          pid=$!;printf '%s\n' "$pid" > "$out/final.pid";wait "$pid" || status=$?
          printf '%s\n' "$status" > "$out/final.exit";test "$status" -eq 0 || failed=1
          for name in foundation orchestrator final;do
            test -f "$out/$name.transport" && test ! -L "$out/$name.transport" && test ! -s "$out/$name.transport" || failed=1
            test -f "$out/$name.exit" && test ! -L "$out/$name.exit" && test "$(cat "$out/$name.exit")" = 0 || failed=1
          done
          for file in source-binding.json candidate-source-edit.json source-copies.expected.json source-copies.initial.json source-copies.before.json source-copies.final.json diagnostic-native-status.json final-binding.json native-selected-processes.json final-admission.json;do test -f "$out/$file" && test ! -L "$out/$file" || failed=1;done
          printf '%s\n' "$failed" > "$out/final-holds.exit";test "$failed" -eq 0
      - name: Seal actual retained regular evidence
        if: ${{ always() }}
        timeout-minutes: 5
        run: |
          set -euo pipefail
          out="$CM_ERA_OUT";test -d "$out";test ! -L "$out"
          find "$out" ! -type d ! -type f -print > "$out/evidence-nonregular.txt";test ! -s "$out/evidence-nonregular.txt"
          find "$out" -type f ! -name evidence.sha256 -print0 | sort -z > "$out/evidence-members.list"
          xargs -0 sha256sum < "$out/evidence-members.list" > "$out/evidence.sha256"
          sha256sum -c "$out/evidence.sha256" > /dev/null
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: cm-era-retention-${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ env.CM_ERA_OUT }}
          if-no-files-found: error
          compression-level: 6
          retention-days: 7
