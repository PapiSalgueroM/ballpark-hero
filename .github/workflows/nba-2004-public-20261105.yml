          fs.writeFileSync(path.join(out,'source-dist-fixture-held.json'),JSON.stringify({source:true,dist:849,declaredFullSaves:5,fixtureFiles:expected.length,allNativePayloadBodiesHeld:true,originalNativeManifestAndLedgerRetained:true,oneWorkflowTwoMapWholeInverseExact:true,exactSevenCloseoutTreeInverseExact:true,readOnlyCodeNoBuild:true})+'\n',{flag:'wx'});
          NODE
          fi
          printf '0\n' > "$QA_OUT/logs/final-source-holds.exit"
      - name: Retain all actual public proof within the unchanged archive bound
        id: evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "$RUNNER_TEMP/nba-2004-public.tar.gz" -C "$QA_OUT" .
          test "$(stat -c %s "$RUNNER_TEMP/nba-2004-public.tar.gz")" -le 50000000
          sha256sum "$RUNNER_TEMP/nba-2004-public.tar.gz" > "$RUNNER_TEMP/nba-2004-public.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        if: always() && steps.evidence.outcome == 'success'
        with:
          name: nba-2004-public
          path: |
            ${{ runner.temp }}/nba-2004-public.tar.gz
            ${{ runner.temp }}/nba-2004-public.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
