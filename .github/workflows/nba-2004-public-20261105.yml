          test "$(git hash-object scripts/qa/nbaHistoricalDraftFixtures.mjs)" = "$FIXTURE_BLOB"
          test "$(git hash-object scripts/qa/nbaHistoricalDraftNative.json)" = "$SPEC_BLOB"
          test "$(git hash-object scripts/qa/nbaHistoricalDraftAssets.mjs)" = "$ASSETS_BLOB"
          test "$(git hash-object scripts/qa/nativeScrollReady.mjs)" = "$READY_BLOB"
          git diff --name-status HEAD^ HEAD > "$QA_OUT/qa-delta.txt"
          node --input-type=module -e 'import fs from "node:fs";import assert from "node:assert/strict";assert.equal(fs.readFileSync(process.env.QA_OUT+"/qa-delta.txt","utf8"),"A\t.github/workflows/nba-2004-public-20261105.yml\n");'
          test ! -s "$QA_OUT/status-before.txt"
      - name: Read exact product merge deployment and completed build source identities
        shell: bash
        run: |
          set -euo pipefail
          for ref in "$PRODUCT" "$PUBLISHED_SOURCE" "$DEPLOY_SOURCE" 1cc6477f2f7ee401385345810b1f283eb67d8d8e 975d8e060045ce9ed4fd52109052d3fc3d1a0651; do
