          for(const key of ['NATIVE_RUN','NATIVE_JOB','NATIVE_ARTIFACT','NATIVE_BYTES','NATIVE_TGZ_BYTES'])assert.match(process.env[key]??'',/^[1-9][0-9]+$/,key+' actual binding');
          for(const key of['NATIVE_SHA256','NATIVE_TGZ_SHA256','NATIVE_MANIFEST_SHA256'])assert.match(process.env[key]??'',/^[a-f0-9]{64}$/,key);
          assert.match(process.env.DEPLOYMENT_ID??'',/^[a-f0-9]{8}-(?:[a-f0-9]{4}-){3}[a-f0-9]{12}$/i);
          assert.equal(process.env.PUBLISHED_SOURCE,process.env.DEPLOY_SOURCE);assert.equal(process.env.PUBLISHED_TREE,process.env.DEPLOY_TREE);
          NODE
