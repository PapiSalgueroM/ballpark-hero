name: Soccer Career development outcomes

on:
  pull_request:
    paths:
      - .github/workflows/career-development.yml
      - src/lib/soccerCareerEngine.ts
      - src/lib/soccerCareerSelection.ts
      - src/lib/soccerClubSquad.ts
      - src/lib/soccerClubSquad.test.ts
      - src/lib/soccerClubSquadSheet.ts
      - src/lib/soccerCareerPreparation.ts
      - src/lib/soccerCareerMentor.ts
      - src/components/soccer-career/**
      - src/pages/SoccerCareer.tsx
      - src/test/soccerCareerDevelopment*
      - scripts/lib/careerDevelopmentAttribution1185.mjs
      - scripts/simCareerAwardsNight.mjs
      - scripts/simCareerLeagueFinish.mjs
      - scripts/simCareerSocialBrands.mjs
      - scripts/simCareerLeagueSeasons.mjs
      - scripts/simSoccerCareerDevelopment.mjs
      - scripts/playSoccerCareerDevelopment.mjs

permissions:
  contents: read
concurrency:
  group: career-development-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    defaults:
      run:
        shell: bash
    env:
      SIM_NETWORK: offline
      SIM_LEAGUE_SEASONS_BASE: 4ab80fa978cf362427bcd024c64c6691e7f83c2a
      ENGINES: chromium
      TZ: UTC
      CAREER_DEVELOPMENT_ARTIFACTS: career-development-artifacts/outcomes
      FREE_KICK_FONT_CACHE: career-development-artifacts/font-cache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare exact source and remote checks
        id: prepare
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p career-development-artifacts
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git rev-parse HEAD > career-development-artifacts/source-head.txt
          git rev-parse HEAD^{tree} > career-development-artifacts/source-tree.txt
          git cat-file -e 4ab80fa978cf362427bcd024c64c6691e7f83c2a^{commit}
          npm ci
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          python -m pip install fonttools pillow
          node scripts/qa/freeKickLab1070.mjs --prefetch-fonts-only 2>&1 | tee career-development-artifacts/fonts.log
      - name: App types then build
        id: build
        run: |
          node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee career-development-artifacts/types.log
          npm run build 2>&1 | tee career-development-artifacts/build.log
      - name: Development outcomes and effective copied defects
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          failed=0
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node node_modules/vitest/vitest.mjs run src/lib/soccerClubSquad.test.ts src/test/soccerCareerDevelopment.test.ts src/test/soccerCareerAmbitions.test.ts src/test/soccerCareerRecords.test.tsx --maxWorkers=1 --minWorkers=1 --reporter=default --reporter=json --outputFile.json=career-development-artifacts/focused-unit.json 2>&1 | tee career-development-artifacts/focused-unit.log || failed=1
          CAREER_DEVELOPMENT_CONTROL=all NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/simSoccerCareerDevelopment.mjs 2>&1 | tee career-development-artifacts/simSoccerCareerDevelopment.log || failed=1
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/simHarnessAnchors.mjs 2>&1 | tee career-development-artifacts/simHarnessAnchors.log || failed=1
          SIM_LEAGUE_SEASONS_ARTIFACTS=career-development-artifacts/league-replay/healthy NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/simCareerLeagueSeasons.mjs 2>&1 | tee career-development-artifacts/simCareerLeagueSeasons.log || failed=1
          SIM_LEAGUE_SEASONS_ARTIFACTS=career-development-artifacts/league-replay/future SIM_LEAGUE_SEASONS_CONTROL=future NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/simCareerLeagueSeasons.mjs 2>&1 | tee career-development-artifacts/simCareerLeagueSeasons-future.log || failed=1
          grep -Fq "CONTROL future: section c went red as it should" career-development-artifacts/simCareerLeagueSeasons-future.log || failed=1
          if grep -Eq "FAIL \[[abd]\]:" career-development-artifacts/simCareerLeagueSeasons-future.log; then failed=1; fi
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node --input-type=module <<'NODE' || failed=1
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const read = arm => JSON.parse(fs.readFileSync(`career-development-artifacts/league-replay/${arm}/report.json`, 'utf8'));
          const healthy = read('healthy'), future = read('future');
          for (const receipt of [healthy, future]) {
            assert.match(receipt.baseCommit, /^[a-f0-9]{40}$/);
            assert.match(receipt.baseTree, /^[a-f0-9]{40}$/);
            assert.equal(receipt.cases.length, 12, 'All twelve historical careers must execute');
            assert.equal(receipt.baseline.careers, 12);
            assert(receipt.baseline.rows >= 300, 'The original twenty-five-row floor per career stays held');
            assert.equal(Object.keys(receipt.sourceBefore).length, 15);
            assert.deepEqual(receipt.sourceAfter, receipt.sourceBefore, 'Historical replay holds every original source byte hash');
          }
          assert.equal(healthy.status, 'passed');
          assert.equal(healthy.baseline.same, 12);
          assert.equal(healthy.baseline.differ, 0);
          assert.equal(healthy.failures, 0);
          assert.deepEqual(healthy.failedSections, []);
          assert.equal(healthy.baseCommit, '4ab80fa978cf362427bcd024c64c6691e7f83c2a');
          assert.equal(future.base, healthy.base);
          assert.equal(future.baseCommit, healthy.baseCommit);
          assert.equal(future.baseTree, healthy.baseTree);
          assert.equal(future.seed, healthy.seed);
          assert.equal(future.control, 'future');
          assert.equal(future.status, 'expected-fault');
          assert.equal(future.controlFired, true);
          assert.equal(future.baseline.same, 0);
          assert.equal(future.baseline.differ, 12);
          assert.equal(future.failures, 12);
          assert.deepEqual(future.failedSections, ['c']);
          assert.deepEqual(future.failureCounts, { c: 12 });
          assert(future.futureEdits.length > 0 && future.futureEdits.every(edit => edit.effective && edit.beforeSha256 !== edit.afterSha256), 'Every future copied edit changes actual source');
          console.log('Historical replay receipt: twelve full healthy careers passed; future defect failed exactly all twelve c cases; original row floors and source bytes held.');
          NODE
          SIM_CAREER_AMBITION_CONTROL=all NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/simSoccerCareerAmbitions.mjs 2>&1 | tee career-development-artifacts/simSoccerCareerAmbitions.log || failed=1
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/simSoccerCareerRecords.mjs 2>&1 | tee career-development-artifacts/simSoccerCareerRecords.log || failed=1
          exit "$failed"
      - name: Historical award, league and sponsor replay contracts
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          failed=0
          SIM_AWARDS_NIGHT_ARTIFACTS=career-development-artifacts/award-replay NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/simCareerAwardsNight.mjs 2>&1 | tee career-development-artifacts/simCareerAwardsNight.log || failed=1
          code=0
          SIM_AWARDS_NIGHT_ARTIFACTS=career-development-artifacts/award-replay SIM_AWARDS_NIGHT_CONTROL=reorderdraw NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/simCareerAwardsNight.mjs 2>&1 | tee career-development-artifacts/simCareerAwardsNight-reorderdraw.log || code=$?
          test "$code" = 1 || failed=1
          SIM_LEAGUE_FINISH_ARTIFACTS=career-development-artifacts/finish-replay NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/simCareerLeagueFinish.mjs 2>&1 | tee career-development-artifacts/simCareerLeagueFinish.log || failed=1
          code=0
          SIM_LEAGUE_FINISH_ARTIFACTS=career-development-artifacts/finish-replay SIM_LEAGUE_FINISH_CONTROL=stream NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/simCareerLeagueFinish.mjs 2>&1 | tee career-development-artifacts/simCareerLeagueFinish-stream.log || code=$?
          test "$code" = 1 || failed=1
          SOCIAL_BRANDS_ARTIFACTS=career-development-artifacts/social-replay/healthy NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/simCareerSocialBrands.mjs 2>&1 | tee career-development-artifacts/simCareerSocialBrands.log || failed=1
          code=0
          SOCIAL_BRANDS_ARTIFACTS=career-development-artifacts/social-replay/reorder SOCIAL_BRANDS_CONTROL=reorder NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/simCareerSocialBrands.mjs 2>&1 | tee career-development-artifacts/simCareerSocialBrands-reorder.log || code=$?
          test "$code" = 1 || failed=1
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node --input-type=module <<'NODE' || failed=1
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const read = path => JSON.parse(fs.readFileSync(`career-development-artifacts/${path}/report.json`, 'utf8'));
          const award = read('award-replay/healthy'), awardFault = read('award-replay/reorderdraw');
          const finish = read('finish-replay/healthy'), finishFault = read('finish-replay/stream');
          const social = read('social-replay/healthy'), socialFault = read('social-replay/reorder');
          for (const receipt of [award, awardFault, finish, finishFault, social, socialFault]) {
            assert(receipt.sourceHeld, 'Every original fixture, product and harness source stays held');
            assert.deepEqual(receipt.sourceAfter, receipt.sourceBefore);
            assert(receipt.originalSources.length > 0, 'An independent actual frozen original must load');
            const inverses = receipt.attribution || receipt.inverses;
            assert.equal(inverses.length, 1);
            assert(inverses.every(row => row.head === '4ab80fa978cf362427bcd024c64c6691e7f83c2a' && row.formAnchors === 1 && row.catalogRestored && row.effective && row.beforeSha256 !== row.afterSha256));
          }
          for (const receipt of [award, awardFault]) assert(receipt.originalFixtureMatches);
          assert.equal(award.status, 'passed');
          assert.deepEqual(award.failedSections, []);
          assert(award.fixtureMatches && award.drawsEqual && award.statesEqual);
          assert.equal(awardFault.status, 'failed');
          assert.deepEqual(awardFault.failedSections, [1]);
          assert(awardFault.controlFired && !awardFault.fixtureMatches && !awardFault.statesEqual);
          assert(awardFault.faultEdits.length > 0 && awardFault.faultEdits.every(row => row.effective && row.beforeSha256 !== row.afterSha256));
          for (const receipt of [finish, finishFault]) {
            assert.equal(receipt.careers.length, 16);
            assert(receipt.careers.every(row => row.originalMatches));
          }
          assert.deepEqual(finish.red, []);
          assert(finish.careers.every(row => row.matches && row.drawEqual));
          assert.deepEqual(finishFault.red, [4]);
          assert(finishFault.careers.every(row => !row.drawEqual), 'The copied stream defect survives every historical inverse');
          for (const receipt of [social, socialFault]) {
            assert.equal(receipt.fixture.careers, 48);
            assert.equal(receipt.fixture.oldSaves, 35);
            assert(receipt.original.matches);
          }
          assert.equal(social.status, 'passed');
          assert(social.attributed.matches);
          assert.deepEqual(social.failedLabels, []);
          assert.equal(social.controlApplications, 0);
          assert.equal(socialFault.status, 'failed');
          assert(!socialFault.attributed.matches);
          assert.equal(socialFault.controlApplications, 2);
          assert.deepEqual(socialFault.failedLabels, ['the probe output differs from the fixture', 'a season with no viral moment draws exactly one random number (2)']);
          console.log('Historical fixture outputs and original whole-state/draw evidence passed. Three effective faults survived the copied attribution and failed only their intended contracts.');
          NODE
          exit "$failed"
      - name: Actual career journeys on phone and desktop
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          failed=0
          for driver in playSoccerCareerDevelopment playSoccerCareerDepth; do
            NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SHOTS="$PWD/career-development-artifacts/native/$driver" node "scripts/$driver.mjs" 2>&1 | tee "career-development-artifacts/$driver.log" || failed=1
          done
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: career-development-early-${{ github.run_id }}-${{ github.run_attempt }}
          path: career-development-artifacts/
          retention-days: 7
      - name: Related existing career outcomes
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          failed=0
          for harness in simCareerSeasonTruth simCareerRecordedStats simCareerStory simClubVerdict simLoanSpell simCareerTraining simNoInventedQuotes simSeasonCentreTable simSeasonCentreNeutral simMatchDetail simMatchScreen; do
            ONLY="$harness" node scripts/runAllSims.mjs --browser 2>&1 | tee "career-development-artifacts/$harness.log" || failed=1
          done
          exit "$failed"
      - name: All fifteen built output readers
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          failed=0
          for harness in simAdsense simBrand simHeadTags simHiddenPages simHubs simIndexNow simIndexing simInternalLinks simNoRivalNames simPrerender simPrerenderBoot simRetiredRoutes simSchema simSitemap simSnapshotAssets; do
            ONLY="$harness" node scripts/runAllSims.mjs --browser 2>&1 | tee "career-development-artifacts/$harness.log" || failed=1
          done
          exit "$failed"
      - name: Authored source unchanged
        if: ${{ !cancelled() }}
        run: git diff --exit-code HEAD -- src scripts .github/workflows
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: career-development-${{ github.run_id }}-${{ github.run_attempt }}
          path: career-development-artifacts/
          retention-days: 7
