          src/test/soccerCommunityShieldAcceptance.test.ts 72cf4787781245c914ebc0b178de5d56b5991687
          src/test/soccerCommunityShieldAnnualRating.test.ts bf4a086302e324ddae02a26d9736d5cd78e11f2c
          src/test/soccerCommunityShieldLegacyReplay.test.tsx ca7e722f27012cd5f0bc362107bd86d84199937c
