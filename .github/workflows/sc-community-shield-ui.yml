          set -euo pipefail
          OUT="$RUNNER_TEMP/sc-community-shield-ui"
          export OUT
          printf 'OUT=%s\n' "$OUT" >> "$GITHUB_ENV"
          mkdir "$OUT" "$OUT/old-leaves"
          test "$GITHUB_REF" = refs/heads/codex/sc-community-shield-ui-20261102
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$BEFORE" = 0000000000000000000000000000000000000000
          test "$(git rev-parse HEAD^)" = 5aad960a2ecb0f8419934dc9308f2ba9ed184422
          test "$(git rev-parse 'HEAD^^{tree}')" = c82bcafcb271b5f3aca5461a15be68a1b5862f62
