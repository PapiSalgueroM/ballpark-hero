            assert.ifError(child.error); assert.equal(child.signal, null); assert.equal(child.status, spec ? 1 : 0);
            assert.equal(fs.statSync(env.SIM_OFFLINE_RECEIPT).size, 0); hold();
            if (file) assert.deepEqual(fs.readFileSync(file), bytesBefore, 'Exact old physical leaf remained held during child');
            const reportBytes = fs.readFileSync(reportFile), report = JSON.parse(reportBytes);
            const result = classify(report, (child.stdout || '') + '\n' + (child.stderr || ''), spec ? 'old' : 'restored', spec);
            assert.equal(result.identities.filter(row => row.status === 'failed').length, spec ? 1 : 0);
            assert.equal(result.identities.filter(row => ['pending', 'skipped'].includes(row.status)).length, spec ? 2 : 0);
            assert.equal(sha(fs.readFileSync(reportFile)), sha(reportBytes));
            const summary = { name, ...result, rawExit: child.status, rawReportSha256: sha(reportBytes), alias: spec?.alias ?? null, copySha256: bytesBefore ? sha(bytesBefore) : null };
            fs.writeFileSync(out + '/' + name + '.summary.json', JSON.stringify(summary, null, 2) + '\n'); results.push(summary);
          }
          let complete = false;
          try {
            for (const spec of specs) {
              assert.equal(expected[uiFile].filter(fullName => fullName.includes(spec.id)).length, 1);
              const bytes = fs.readFileSync(out + '/old-leaves/' + spec.oldFile);
              const blob = crypto.createHash('sha1').update(Buffer.from('blob ' + bytes.length + '\0')).update(bytes).digest('hex'); assert.equal(blob, spec.oldGit);
              assert.notEqual(sha(bytes), sha(held.get(spec.source)), 'The old leaf must differ from the current product leaf');
              const folder = path.dirname(path.join(root, spec.source)), copy = path.join(folder, '__sc_shield_control_' + spec.name + '_' + process.pid + path.extname(spec.source));
              assert.equal(path.dirname(copy), folder); assert.notEqual(copy, path.join(root, spec.source)); assert.equal(fs.existsSync(copy), false);
              copied.add(copy); fs.appendFileSync(out + '/sibling-copies.txt', copy + '\n'); fs.writeFileSync(copy, bytes, { flag: 'wx' });
              assert.deepEqual(fs.readFileSync(copy), bytes);
              fs.writeFileSync(out + '/old-' + spec.name + '.copy.json', JSON.stringify({ source: spec.source, sourceKind: 'HEAD^ immutable leaf', oldGit: blob, bytes: bytes.length, oldSha256: sha(bytes), currentSha256: sha(held.get(spec.source)), copy, alias: spec.alias, changed: true }, null, 2) + '\n');
              try { run('old-' + spec.name, spec, copy); } finally { remove(copy); hold(); }
            }
            for (const copy of copied) assert.equal(fs.existsSync(copy), false);
            run('restored'); hold();
            assert.equal(results.length, 4);
            const totals = results.reduce((sum, row) => ({ passed: sum.passed + row.passed, ownedFailures: sum.ownedFailures + row.ownedFailures, declaredUnselectedSkips: sum.declaredUnselectedSkips + row.declaredUnselectedSkips, executed: sum.executed + row.executed }), { passed: 0, ownedFailures: 0, declaredUnselectedSkips: 0, executed: 0 });
            assert.deepEqual(totals, { passed: 3, ownedFailures: 3, declaredUnselectedSkips: 6, executed: 6 });
            fs.writeFileSync(out + '/controls-summary.json', JSON.stringify({ scope: 'Three separate immutable old leaves on the held three-case UI acceptance file, then healthy actual UI acceptance after cleanup.', results, totals, ordinaryHealthyExecuted: 73, totalVitestExecutions: 79, totalHealthyExecutions: 76, totalOwnedFailures: 3, totalDeclaredUnselectedSkips: 6, vitestChildren: 5 }, null, 2) + '\n');
            complete = true;
            console.log('SC_SHIELD_UI_CONTROLS: three primary-owned old-leaf assertions, six declared unselected skips and restored actual three passes.');
          } finally {
            for (const copy of copied) remove(copy);
            hold(); fs.writeFileSync(out + '/control-source-after.json', JSON.stringify(receipts(), null, 2) + '\n');
            fs.writeFileSync(out + '/controls-status.json', JSON.stringify({ complete, completedChildren: results.length, allSiblingCopiesRemoved: [...copied].every(file => !fs.existsSync(file)) }, null, 2) + '\n');
          }
          CONTROLS
      - name: Proper joined types and all 73 exact healthy cases
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          unset SC_EXTRA_CUPS_ENGINE US_BOARD_CONTROL_ALIAS US_BOARD_CONTROL_FILE NO_DOUBLE_SWAP TYCOON_AWAY_CONTROL COMPLETION_HOOK OWNED_TIMEOUTS_HOOK CONQUEST_NBA_HOOK CONQUEST_NBA_BOARD POLL_FIXTURES DAILY_RECORD_CONTROL TYCOON_ROOMS_PAGE TYCOON_LOADS_STADIUM_HOOK TYCOON_LOADS_ACADEMY_HOOK TYCOON_PITCH_COMPONENT TYCOON_PACKS_REWARDS TYCOON_PACKS_PANEL
          source "$OUT/capture.sh"
          capture types node_modules/.bin/tsc --noEmit -p tsconfig.app.json
          mapfile -t tests < "$OUT/tests.txt"
          test "${#tests[@]}" -eq 8
          capture healthy node node_modules/vitest/vitest.mjs run "${tests[@]}" --maxWorkers=1 --minWorkers=1 --no-file-parallelism --reporter=verbose --reporter=json --outputFile="$OUT/healthy.vitest.json"
          capture classify-healthy node "$OUT/classify.mjs" healthy
      - name: Separate old-leaf controls and restored actual UI acceptance
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          source "$OUT/capture.sh"
          source "$OUT/cleanup.sh"
          trap cleanup_siblings EXIT
          capture controls node "$OUT/old-leaf-controls.mjs"
      - name: Always clean owned sibling copies then hold source dependencies and membership
        if: always()
        run: |
          set -euo pipefail
          source "$OUT/cleanup.sh"
          cleanup_siblings
          sha256sum --check "$OUT/source.sha256" > "$OUT/source-held.log"
          if test -f "$OUT/dependency-files.sha256"; then sha256sum --check "$OUT/dependency-files.sha256" > "$OUT/dependency-held.log"; fi
          git ls-files -z > "$OUT/source-members.after"
          cmp "$OUT/source-members.before" "$OUT/source-members.after"
          git diff --exit-code HEAD > "$OUT/source-diff.log"
          git ls-files --others --exclude-standard > "$OUT/untracked.txt"
          test ! -s "$OUT/untracked.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sc-community-shield-ui-${{ github.run_id }}
          path: ${{ runner.temp }}/sc-community-shield-ui/
          retention-days: 14
