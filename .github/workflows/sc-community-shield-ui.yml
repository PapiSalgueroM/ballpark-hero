name: Soccer Career Community Shield UI qualification
on:
  push:
    branches: [codex/sc-community-shield-ui-20261102]
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: '1'
      SIM_NETWORK: offline
      BEFORE: ${{ github.event.before }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
