name: Club Manager loan-out reason baseline
on:
  push:
    branches: [codex/cm-loan-out-reasons-red-20261103]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: '1'
      SIM_NETWORK: offline
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Hold the parent application and exact new test
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/cm-loan-out-reasons-red"
          mkdir -p "$OUT/raw"
          echo "QA_OUT=$OUT" >> "$GITHUB_ENV"
          git fetch --no-tags --depth=1 origin cc9a55a2f35b6215d5e6e664cc401d10d7f76291
          test "$(git rev-parse cc9a55a2f35b6215d5e6e664cc401d10d7f76291^{tree})" = 90d580e7007917a4959187bd449d054d63191b08
          git rev-parse HEAD HEAD^{tree} > "$OUT/source.txt"
          git diff --name-status cc9a55a2f35b6215d5e6e664cc401d10d7f76291 HEAD > "$OUT/candidate-paths.txt"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          const paths = execFileSync('git', ['diff', '--name-status', 'cc9a55a2f35b6215d5e6e664cc401d10d7f76291', 'HEAD']).toString().trim().split('\n').sort();
          assert.deepEqual(paths, ['A\t.github/workflows/cm-loan-out-reasons-red-20261103.yml', 'A\tsrc/test/cmLoanOutReasons.test.tsx'].sort(), 'Only the new test and baseline workflow may differ from pinned main');
          assert.equal(crypto.createHash('sha256').update(fs.readFileSync('src/test/cmLoanOutReasons.test.tsx')).digest('hex'), 'd125c2711e65d95643a204d1493e2ffd3f5d9f5179963955a39af7d750fc4c00');
          assert.equal(execFileSync('git', ['rev-parse', 'HEAD:src/components/club-manager/TransferScreen.tsx']).toString().trim(), '1157975509a11dc6ce7d75d1d02221787716ad1b');
          NODE
          git ls-files -z | sort -z | xargs -0 sha256sum > "$OUT/source-before.sha256"
          cp src/test/cmLoanOutReasons.test.tsx "$OUT/test-source.tsx"
          npm ci --no-audit --no-fund > "$OUT/install.log" 2>&1
      - name: Actual application types
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          : > "$QA_OUT/types.transport.log"
          set +e
          SIM_OFFLINE_RECEIPT="$QA_OUT/types.transport.log" node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee "$QA_OUT/types.log"
          codes=("${PIPESTATUS[@]}")
          set -e
          printf '%s\n' "${codes[0]}" > "$QA_OUT/types.exit"
          test "${codes[1]}" -eq 0
          test "${codes[0]}" -eq 0
          test ! -s "$QA_OUT/types.transport.log"
      - name: Observe six actual mounted loan-out cases
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          export CM_LOAN_REASONS_RAW="$QA_OUT/raw"
          : > "$QA_OUT/units.transport.log"
          set +e
          SIM_OFFLINE_RECEIPT="$QA_OUT/units.transport.log" node node_modules/vitest/vitest.mjs run src/test/cmLoanOutReasons.test.tsx \
            --maxWorkers=1 --minWorkers=1 --reporter=default --reporter=json --outputFile="$QA_OUT/units.json" 2>&1 | tee "$QA_OUT/units.log"
          codes=("${PIPESTATUS[@]}")
          set -e
          printf '%s\n' "${codes[0]}" > "$QA_OUT/units.exit"
          test "${codes[1]}" -eq 0
          test ! -s "$QA_OUT/units.transport.log"
      - name: Admit only the two owned missing explanations and preserve the RED outcome
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const out = process.env.QA_OUT;
          const report = JSON.parse(fs.readFileSync(out + '/units.json', 'utf8'));
          assert.equal(Number(fs.readFileSync(out + '/units.exit', 'utf8')), 1);
          assert.equal(report.success, false); assert.equal(report.numPassedTests, 4); assert.equal(report.numFailedTests, 2);
          assert.equal(report.testResults.length, 1);
          const suite = report.testResults[0];
          assert.equal(suite.status, 'failed');
          if (Object.hasOwn(suite, 'message')) assert.equal(suite.message, '');
          const expected = {
            'shows the only-keeper refusal beside his disabled loan action': 'CM_LOAN_REASON_VISIBLE_ONLY_KEEPER',
            'shows the agreed-deal refusal beside his disabled loan action': 'CM_LOAN_REASON_VISIBLE_PROMISED',
            'keeps an eligible loan action and its quoted fee working': null,
            'keeps the existing minimum-squad explanation and refusal': null,
            'keeps the existing closed-window explanation and refusal': null,
            'keeps the existing once-a-season explanation and refusal': null,
          };
          const fullNames = Object.fromEntries(Object.entries(expected).map(([title, marker]) => ['Club Manager loan-out refusal visibility ' + title, marker]));
          assert.equal(suite.assertionResults.length, 6);
          for (const row of suite.assertionResults) {
            assert.ok(Object.hasOwn(fullNames, row.fullName), row.fullName);
            const marker = fullNames[row.fullName];
            assert.equal(row.status, marker === null ? 'passed' : 'failed', row.fullName);
            if (marker === null) assert.deepEqual(row.failureMessages, []);
            else { assert.ok(row.failureMessages.length > 0); assert.ok(row.failureMessages.every(message => message.includes(marker)), row.fullName); }
          }
          assert.equal(new Set(suite.assertionResults.map(row => row.fullName)).size, 6);
          const counters = {};
          for (const key of ['numRuntimeErrorTestSuites', 'numPendingTests', 'numTodoTests']) {
            counters[key] = Object.hasOwn(report, key) ? report[key] : null;
            if (counters[key] !== null) assert.equal(counters[key], 0, key);
          }
          const keys = ['only_keeper', 'promised', 'eligible', 'minimum', 'closed', 'used'];
          const rawFiles = fs.readdirSync(out + '/raw').filter(name => name.endsWith('.json')).sort();
          assert.deepEqual(rawFiles, keys.map(key => key + '.json').sort());
          const vectors = [];
          for (const file of rawFiles) {
            const r = JSON.parse(fs.readFileSync(out + '/raw/' + file, 'utf8'));
            assert.equal(file, r.key + '.json');
            assert.ok(keys.includes(r.key));
            assert.equal(r.inputUnchanged, true); assert.deepEqual(r.otherCalls, []);
            assert.equal(r.engineReason, r.expectedReason); assert.equal(r.label, r.expectedLabel);
            assert.ok(Number.isFinite(r.fee) && r.fee >= 0.2);
            assert.equal(r.callbackMatchesEngine, true);
            assert.equal(r.engineAllowed, r.key === 'eligible'); assert.equal(r.disabled, r.key !== 'eligible');
            assert.equal(r.title, r.expectedReason ?? 'Send him out on loan for the rest of the season');
            const callbacks = r.key === 'eligible' ? [r.playerId] : [];
            assert.deepEqual(r.callbackIds, callbacks); assert.deepEqual(r.expectedCallbacks, callbacks);
            if (r.key === 'eligible') {
              assert.equal(r.expectedReason, null); assert.equal(r.nextLoanFee, r.fee); assert.equal(r.budgetDelta, r.fee);
            } else {
              assert.equal(r.nextLoanFee, null); assert.equal(r.budgetDelta, null);
              assert.ok(typeof r.expectedReason === 'string' && r.expectedReason.length > 0);
            }
            if (r.key === 'only_keeper' || r.key === 'promised') {
              assert.ok(r.squadSize > 14); assert.equal(r.visibleReason, false); assert.equal(r.descriptionMatches, false);
            }
            if (r.key === 'minimum') { assert.equal(r.squadSize, 14); assert.equal(r.minimumCaption, true); }
            if (r.key === 'closed') assert.equal(r.closedCaption, true);
            if (r.key === 'used') assert.equal(r.label, 'Loaned out once this season');
            vectors.push({key: r.key, engineReason: r.engineReason, disabled: r.disabled, visibleReason: r.visibleReason, fee: r.fee, callbackIds: r.callbackIds});
          }
          fs.writeFileSync(out + '/owned-red-admission.json', JSON.stringify({
            actualPasses: 4, actualOwnedFailures: 2, fullNames, counters, absentCounterMeaning: 'UNKNOWN', vectors,
            scope: 'Actual mounted TransferScreen loan-out explanations and existing engine refusal/callback/fee preservation. No product, engine or data change, build or simulation suite.',
          }, null, 2) + '\n');
          NODE
          # Actual focused failure remains a failed baseline job.
          test "$(cat "$QA_OUT/units.exit")" -eq 0
      - name: Retain whole source holds
        if: always()
        run: |
          set -euo pipefail
          git diff --exit-code HEAD > "$QA_OUT/source-diff.txt"
          git ls-files -z | sort -z | xargs -0 sha256sum > "$QA_OUT/source-after.sha256"
          cmp "$QA_OUT/source-before.sha256" "$QA_OUT/source-after.sha256"
          sha256sum --check "$QA_OUT/source-before.sha256" > "$QA_OUT/source-held.log"
      - name: Bound evidence
        id: artifact
        if: always()
        run: |
          set -euo pipefail
          test -d "$QA_OUT"
          test "$(du -sb "$QA_OUT" | cut -f1)" -lt 50000000
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.artifact.outputs.ready == 'true' }}
        with:
          name: cm-loan-out-reasons-baseline-${{ github.run_id }}
          path: ${{ runner.temp }}/cm-loan-out-reasons-red
          retention-days: 14
          if-no-files-found: error
