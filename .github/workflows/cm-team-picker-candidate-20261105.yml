name: CM Team-picker candidate fixed eager and restored qualification
on:
  push:
    branches: [codex/cm-team-picker-candidate-20261105]
permissions:
  contents: read
  actions: read
concurrency:
  group: cm-team-picker-candidate-${{ github.ref }}
  cancel-in-progress: false
env:
  CI: '1'
  SIM_NETWORK: offline
  TZ: UTC
  PRODUCT_CORE: 671730c30f67685f070593af7b2464a9cc1f5352
  PRODUCT_TREE: 7080fc953cab1ebbb3f616b7741f022c8b7a8ea0
  BASE_CORE: 3b14650d360b010b25b525de33a5f32f33de2798
  BASE_TREE: d9278a7b5f58395509f6ab937f918c1c2ef31127
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ENGINES: chromium
      SEO_SPLIT_BASE_REF: HEAD
      SWEEP_OFFLINE: '1'
      PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 6
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Bind exact two App paths and five QA additions
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/cm-team-picker-candidate"
          REF="$RUNNER_TEMP/cm-team-picker-candidate-reference"
          test ! -e "$ROOT"; test ! -e "$REF"
          mkdir -p "$ROOT/logs" "$ROOT/transport" "$ROOT/replay"
          printf 'QA_OUT=%s\nQA_ROOT=%s\nQA_REF=%s\n' "$ROOT" "$ROOT" "$REF" >> "$GITHUB_ENV"
          export QA_OUT="$ROOT" QA_ROOT="$ROOT" QA_REF="$REF"
          test "$(git rev-parse HEAD^)" = "$PRODUCT_CORE"
          test "$(git rev-parse HEAD^^{tree})" = "$PRODUCT_TREE"
          test "$(git rev-parse HEAD^^)" = "$BASE_CORE"
          test "$(git rev-parse HEAD^^^{tree})" = "$BASE_TREE"
          git rev-parse HEAD HEAD^{tree} > "$ROOT/source.txt"
          git diff --name-status --no-renames HEAD^ HEAD > "$ROOT/qa-delta.txt"
          git diff --name-status --no-renames HEAD^^ HEAD^ > "$ROOT/product-delta.txt"
          node --input-type=module <<'CM_PINS'
          import assert from 'node:assert/strict';import fs from 'node:fs';import crypto from 'node:crypto';import{execFileSync}from'node:child_process';
          const out=process.env.QA_OUT,spec=JSON.parse(fs.readFileSync('scripts/qa/cmTeamPickerCandidateCases.json','utf8'));
          const paths=['.github/workflows/cm-team-picker-candidate-20261105.yml','scripts/qa/cmTeamPickerCandidateCases.json','scripts/qa/cmTeamPickerCandidateEvidence.mjs','scripts/qa/cmTeamPickerOriginalProbe.mjs','src/test/clubManagerTeamPickerOriginal.test.tsx'].sort();
          assert.deepEqual(fs.readFileSync(out+'/qa-delta.txt','utf8').trimEnd().split('\n'),paths.map(p=>'A\t'+p));
          assert.deepEqual(fs.readFileSync(out+'/product-delta.txt','utf8').trimEnd().split('\n'),['A\tsrc/components/club-manager/ClubManagerTeamPicker.tsx','M\tsrc/pages/ClubManager.tsx']);
          assert.equal(spec.candidate.commit,process.env.PRODUCT_CORE);assert.equal(spec.candidate.tree,process.env.PRODUCT_TREE);
          assert.equal(spec.base.commit,process.env.BASE_CORE);assert.equal(spec.base.tree,process.env.BASE_TREE);
          const blob=b=>crypto.createHash('sha1').update(Buffer.from('blob '+b.length+'\0')).update(b).digest('hex');
          const sources=[...spec.sourcePins,...spec.helperPins,{path:spec.candidate.pagePath,gitBlob:spec.candidate.pageBlob},{path:spec.candidate.leafPath,gitBlob:spec.candidate.leafBlob},{path:'scripts/lib/offlineTransport.cjs',gitBlob:'0fda542a2649fe5da937c6976fd0f5b6073e74b6'}];
          for(const row of sources)assert.equal(blob(fs.readFileSync(row.path)),row.gitBlob,row.path);
          assert.equal(blob(fs.readFileSync('scripts/qa/cmTeamPickerCandidateCases.json')),'72c5c93d4cf2652dc408faad9dd9e49f2e35c9ab');
          assert.equal(execFileSync('git',['rev-parse',spec.base.commit+':src/pages/ClubManager.tsx'],{encoding:'utf8'}).trim(),'978bf575f489228041c278101ca77cfac434d8e3');
          fs.writeFileSync(out+'/input-pins.json',JSON.stringify({sources,original:spec.original,candidate:spec.candidate,fault:spec.fault},null,2)+'\n');
          const page=fs.readFileSync(spec.candidate.pagePath);assert.equal(blob(page),spec.candidate.pageBlob);
          fs.writeFileSync(out+'/fixed-page.tsx',page,{flag:'wx'});
          CM_PINS
          git ls-files -z | sort -z | xargs -0 sha256sum > "$ROOT/source-before.sha256"
          git ls-files -s > "$ROOT/index-before.txt"
          git ls-files -z > "$ROOT/tracked-before.bin"
          for lock in package.json package-lock.json bun.lock bun.lockb; do if test -f "$lock"; then sha256sum "$lock"; fi; done > "$ROOT/locks-before.sha256"
          git status --porcelain=v1 --untracked-files=all > "$ROOT/status-before.txt"
          test ! -s "$ROOT/status-before.txt"
      - name: Authenticate the only admitted original reference
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Online admitted-original authentication only. Run before NODE_OPTIONS/offline/no-lazy.
          # QA_OUT already exists; QA_REF must be a fresh directory outside QA_OUT.
          node --input-type=module <<'ORIGINAL_AUTH'
          import fs from 'node:fs';import path from 'node:path';import assert from 'node:assert/strict';import crypto from 'node:crypto';import{spawnSync}from'node:child_process';import{gunzipSync,gzipSync}from'node:zlib';
          const out=path.resolve(process.env.QA_OUT),ref=path.resolve(process.env.QA_REF),spec=JSON.parse(fs.readFileSync('scripts/qa/cmTeamPickerCandidateCases.json','utf8')),o=spec.original,repo='PapiSalgueroM/ballpark-hero';
          const sha=b=>crypto.createHash('sha256').update(b).digest('hex'),gitBlob=b=>crypto.createHash('sha1').update(Buffer.from('blob '+b.length+'\0')).update(b).digest('hex');
          assert.equal(spec.status,'CANDIDATE_THREE_ARM');assert.equal(o.qa,'f7a13d3e79bd740e898ebde4c2db51bc368546e5');assert.equal(o.artifact,'13449467861');assert.equal(o.independentAdmissionSHA256,'66569142faf341c717c14350fbc0bc3a6b8ddda846449c4d3c325e02fb069d5f');
          assert(ref!==out&&!ref.startsWith(out+path.sep),'Reference remains outside output archive');assert(!fs.existsSync(ref),'Fresh reference directory');assert(fs.statSync(out).isDirectory());
          fs.mkdirSync(ref);fs.mkdirSync(path.join(ref,'archive'));const meta=path.join(out,'original-auth');fs.mkdirSync(meta);
          const command=(label,cmd,args,binary=false)=>{const r=spawnSync(cmd,args,{encoding:binary?null:'utf8',maxBuffer:64*1024*1024});fs.writeFileSync(path.join(meta,label+'.native.json'),JSON.stringify({command:[cmd,...args],status:r.status,signal:r.signal,error:r.error?String(r.error):null})+'\n');fs.writeFileSync(path.join(meta,label+'.stderr.log'),r.stderr??'');if(!binary)fs.writeFileSync(path.join(meta,label+'.stdout.log'),r.stdout??'');assert.equal(r.error,undefined,label);assert.equal(r.signal,null,label);assert.equal(r.status,0,label);return r.stdout;};
          const api=(label,endpoint)=>JSON.parse(command(label,'gh',['api','repos/'+repo+'/'+endpoint]));
          const run=api('run','actions/runs/'+o.run),job=api('job','actions/jobs/'+o.job),artifact=api('artifact','actions/artifacts/'+o.artifact),commit=api('source-commit','git/commits/'+o.qa);
          assert.equal(run.id,Number(o.run));assert.equal(run.status,'completed');assert.equal(run.conclusion,'success');assert.equal(run.head_sha,o.qa);assert.equal(run.head_branch,o.branch);assert.equal(run.path,o.workflow);assert.equal(commit.sha,o.qa);assert.equal(commit.tree.sha,o.qaTree);
          assert.equal(job.id,Number(o.job));assert.equal(job.run_id,Number(o.run));assert.equal(job.status,'completed');assert.equal(job.conclusion,'success');assert.equal(job.head_sha,o.qa);
          assert.equal(artifact.id,Number(o.artifact));assert.equal(artifact.expired,false);assert.equal(artifact.size_in_bytes,o.zipBytes);assert.equal(artifact.workflow_run.id,Number(o.run));assert.equal(artifact.workflow_run.head_sha,o.qa);assert.equal(artifact.name,'cm-team-picker-original-'+o.run+'-'+run.run_attempt);
          const source=api('source-workflow','contents/'+o.workflow+'?ref='+o.qa);assert.equal(source.type,'file');assert.equal(source.sha,o.workflowBlob);assert.equal(source.encoding,'base64');const workflow=Buffer.from(source.content,'base64');assert.equal(gitBlob(workflow),o.workflowBlob);fs.writeFileSync(path.join(meta,'original-workflow.yml'),workflow);
          const zip=command('sole-original-artifact-acquisition','gh',['api','repos/'+repo+'/actions/artifacts/'+o.artifact+'/zip'],true);assert.equal(zip.length,o.zipBytes);assert.equal(sha(zip),o.zipSHA256);
          const zipFile=path.join(ref,'archive','original-'+o.artifact+'.zip');fs.writeFileSync(zipFile,zip,{flag:'wx'});
          const names=command('zip-list','unzip',['-Z1',zipFile]).trimEnd().split('\n');assert.deepEqual(names.slice().sort(),[o.innerTar.name,o.innerTar.name+'.sha256'].sort(),'Exact two original ZIP entries');
          const tgz=command('zip-inner','unzip',['-p',zipFile,o.innerTar.name],true);assert.equal(tgz.length,o.innerTar.bytes);assert.equal(sha(tgz),o.innerTar.sha256);
          const checksum=command('zip-checksum','unzip',['-p',zipFile,o.innerTar.name+'.sha256']);assert.equal(checksum.trim().split(/\s+/)[0],o.innerTar.sha256);fs.writeFileSync(path.join(ref,'archive',o.innerTar.name+'.sha256'),checksum,{flag:'wx'});
          const tgzFile=path.join(ref,'archive',o.innerTar.name);fs.writeFileSync(tgzFile,tgz,{flag:'wx'});
          const safe=name=>{assert(name&&!name.startsWith('/')&&!name.includes('\\')&&!name.includes('\0')&&!name.split('/').includes('..'),'Safe original archive path');return name.replace(/^(\.\/)+/,'');};
          const members=command('tar-list','tar',['-tzf',tgzFile]).trimEnd().split('\n');for(const name of members)safe(name);
          const modes=command('tar-types','tar',['-tvzf',tgzFile]).trimEnd().split('\n');assert.equal(modes.length,members.length);assert(modes.every(v=>v.startsWith('-')||v.startsWith('d')),'Only directories and regular files');
          assert(!members.some(name=>{const rel=safe(name);return rel==='archive'||rel.startsWith('archive/')||rel==='reference-auth.json';}),'Archive cannot replace authentication-owned paths');
          command('tar-extract','tar',['-xzf',tgzFile,'-C',ref]);
          const admissionBytes=fs.readFileSync(path.join(ref,'ORIGINAL-ADMITTED.json'));assert.equal(admissionBytes.length,o.admissionBytes);assert.equal(sha(admissionBytes),o.admissionSHA256);const admission=JSON.parse(admissionBytes.toString('utf8'));
          assert.equal(admission.status,'ADMITTED_ORIGINAL_FOUR_HELD_ONE_EXECUTABLE_OWNED');assert.equal(admission.completeRawCount,5);assert.deepEqual(admission.base,spec.base);assert.deepEqual(admission.caseStatuses.map(v=>v.status),['passed','passed','passed','passed','failed']);assert.deepEqual(admission.rawPins,o.rawPins);
          assert.equal(admission.sourceProof.helperPins.find(v=>v.path===spec.testFile)?.gitBlob,spec.frozen.test);assert.equal(admission.sourceProof.helperPins.find(v=>v.path==='scripts/qa/cmTeamPickerOriginalProbe.mjs')?.gitBlob,spec.frozen.probe);
          const actualRaws=[];for(const row of o.rawPins){safe(row.file);assert(row.storedBytes<=spec.limits.maxStoredPerRaw);assert(row.decodedBytes<=spec.limits.maxDecodedPerRaw);const stored=fs.readFileSync(path.join(ref,row.file));assert.equal(stored.length,row.storedBytes);assert.equal(sha(stored),row.storedSHA256);const decoded=gunzipSync(stored,{maxOutputLength:spec.limits.maxDecodedPerRaw});assert.equal(decoded.length,row.decodedBytes);assert.equal(sha(decoded),row.decodedSHA256);JSON.parse(decoded.toString('utf8'));actualRaws.push({...row,storedHeld:true,decodedHeld:true});}
          assert.equal(actualRaws.length,5);assert.equal(new Set(actualRaws.map(r=>r.file)).size,5);
          const probeBytes=fs.readFileSync(path.join(ref,'built','report.json'));assert.equal(probeBytes.length,o.bodyProbe.bytes);assert.equal(sha(probeBytes),o.bodyProbe.sha256);assert.equal(admission.bodyProbe.bytes,probeBytes.length);assert.equal(admission.bodyProbe.sha256,sha(probeBytes));const probe=JSON.parse(probeBytes.toString('utf8'));assert.equal(probe.status,'MEASURED_ACTUAL_UI_AND_BODIES');for(const key of ['initialGzipBytes','settledGzipBytes','allGzipBytes'])assert.equal(probe[key],o.bodyProbe[key]);
          for(const row of probe.responses){safe(row.file);const body=fs.readFileSync(path.join(ref,'built',row.file));assert.equal(body.length,row.bytes);assert.equal(sha(body),row.sha256);assert.equal(gzipSync(body).length,row.gzipBytes);}
          safe(probe.routeHtml.file);const route=fs.readFileSync(path.join(ref,'built',probe.routeHtml.file));assert.equal(route.length,probe.routeHtml.bytes);assert.equal(sha(route),probe.routeHtml.sha256);
          const auth={artifact:o.artifact,bytes:o.zipBytes,sha256:o.zipSHA256,run:o.run,job:o.job,qa:o.qa,qaTree:o.qaTree,branch:o.branch,workflow:o.workflow,workflowBlob:o.workflowBlob,innerTar:o.innerTar,admissionBytes:admissionBytes.length,admissionSHA256:sha(admissionBytes),independentAdmissionSHA256:o.independentAdmissionSHA256,independentReceiptRole:'Externally admitted metadata binding, not a receipt body in this original ZIP.',rawPins:actualRaws,bodyProbe:{bytes:probeBytes.length,sha256:sha(probeBytes)},soleArtifactAcquisition:true};
          const authBytes=Buffer.from(JSON.stringify(auth,null,2)+'\n');fs.writeFileSync(path.join(ref,'reference-auth.json'),authBytes,{flag:'wx'});fs.writeFileSync(path.join(meta,'reference-auth.json'),authBytes,{flag:'wx'});
          const inventory=[];function walk(rel=''){for(const entry of fs.readdirSync(path.join(ref,rel),{withFileTypes:true})){const file=path.posix.join(rel,entry.name);if(entry.isDirectory())walk(file);else{assert(entry.isFile());const body=fs.readFileSync(path.join(ref,file));inventory.push({file,bytes:body.length,sha256:sha(body)});}}}walk();inventory.sort((a,b)=>a.file<b.file?-1:a.file>b.file?1:0);
          fs.writeFileSync(path.join(out,'reference-before.sha256'),inventory.map(row=>row.sha256+'  '+row.file+'\n').join(''),{flag:'wx'});fs.writeFileSync(path.join(meta,'reference-before.json'),JSON.stringify(inventory,null,2)+'\n',{flag:'wx'});
          fs.writeFileSync(path.join(meta,'AUTHENTICATED-ORIGINAL.json'),JSON.stringify({status:'AUTHENTICATED_ADMITTED_ORIGINAL_REFERENCE',original:o,zipEntries:names,tarEntries:members.length,regularReferenceFiles:inventory.length,allFiveStoredDecodedRawHeld:true,actualBuiltHttpBodyReportHeld:true,wholeReferenceInventoryRetained:true,artifactAcquisitions:1,AppBuilds:0,sourceModified:false},null,2)+'\n',{flag:'wx'});
          ORIGINAL_AUTH
      - name: Install held app and required build tools
        run: |
          set -euo pipefail
          test "$(bun --version)" = 1.4.4
          bun --version > "$QA_OUT/logs/bun-version.log"
          node --version > "$QA_OUT/logs/node-version.log"
          bun install --frozen-lockfile > "$QA_OUT/logs/bun-install.log" 2>&1
          node -p "JSON.stringify({router:require('react-router-dom/package.json').version,vite:require('vite/package.json').version,rollup:JSON.parse(require('fs').readFileSync('node_modules/rollup/package.json','utf8')).version})" > "$QA_OUT/logs/build-versions.json"
          git diff --exit-code HEAD -- package.json package-lock.json bun.lock bun.lockb
          npm install --prefix "$RUNNER_TEMP/cm-team-picker-original-tools" --package-lock=false --no-audit --no-fund playwright@1.64.0 > "$QA_OUT/logs/playwright-install.log" 2>&1
          test ! -e node_modules/playwright
          test ! -e node_modules/playwright-core
          ln -s "$RUNNER_TEMP/cm-team-picker-original-tools/node_modules/playwright" node_modules/playwright
          ln -s "$RUNNER_TEMP/cm-team-picker-original-tools/node_modules/playwright-core" node_modules/playwright-core
          "$RUNNER_TEMP/cm-team-picker-original-tools/node_modules/.bin/playwright" install --with-deps chromium > "$QA_OUT/logs/chromium-install.log" 2>&1
          python3 -m pip install --target "$RUNNER_TEMP/cm-team-picker-original-python" fonttools pillow > "$QA_OUT/logs/python-install.log" 2>&1
          echo "PYTHONPATH=$RUNNER_TEMP/cm-team-picker-original-python" >> "$GITHUB_ENV"
      - name: Fixed physical eager-wire and restored serial full qualification
        timeout-minutes: 80
        run: |
          set -euo pipefail
          export QA_ROOT="$QA_OUT"
          export GIT_NO_LAZY_FETCH=1
          export NODE_OPTIONS="--require=$GITHUB_WORKSPACE/scripts/lib/offlineTransport.cjs"
          restore_page() {
            node --input-type=module <<'CM_RESTORE'
          import fs from 'node:fs';import assert from 'node:assert/strict';import crypto from 'node:crypto';
          const root=process.env.QA_ROOT,spec=JSON.parse(fs.readFileSync('scripts/qa/cmTeamPickerCandidateCases.json','utf8'));
          const bytes=fs.readFileSync(root+'/fixed-page.tsx'),blob=b=>crypto.createHash('sha1').update(Buffer.from('blob '+b.length+'\0')).update(b).digest('hex');
          assert.equal(blob(bytes),spec.candidate.pageBlob);
          fs.writeFileSync(spec.candidate.pagePath,bytes);assert.deepEqual(fs.readFileSync(spec.candidate.pagePath),bytes);
          CM_RESTORE
          }
          trap restore_page EXIT
          cat > "$QA_ROOT/arm-driver.sh" <<'CM_ARM_DRIVER'
          #!/usr/bin/env bash
          set -euo pipefail
          export CM_ARM="$1"
          export QA_OUT="$QA_ROOT/replay/$CM_ARM"
          mkdir -p "$QA_OUT/logs" "$QA_OUT/transport" "$QA_OUT/gates"
          git ls-files -z | sort -z | xargs -0 sha256sum > "$QA_OUT/source-before.sha256"
          git ls-files -s > "$QA_OUT/index-before.txt"
          git ls-files -z > "$QA_OUT/tracked-before.bin"
          for lock in package.json package-lock.json bun.lock bun.lockb; do if test -f "$lock"; then sha256sum "$lock"; fi; done > "$QA_OUT/locks-before.sha256"
          git status --porcelain=v1 --untracked-files=all > "$QA_OUT/status-before.txt"
          if [[ "$CM_ARM" == eager-wire ]]; then
            printf ' M src/pages/ClubManager.tsx\n' > "$QA_OUT/status-expected.txt"
            cmp "$QA_OUT/status-expected.txt" "$QA_OUT/status-before.txt"
          else
            test ! -s "$QA_OUT/status-before.txt"
          fi
          test ! -e .tmp-fx/career-records-tests.json
          test ! -L .tmp-fx/career-records-tests.json
          if [[ -e .tmp-fx || -L .tmp-fx ]]; then test -d .tmp-fx; test ! -L .tmp-fx; fi
          : > "$QA_OUT/records-leaf-owned-before.txt"
          server_pids=()
          hold_arm() {
          set -euo pipefail
          git ls-files -z | sort -z | xargs -0 sha256sum > "$QA_OUT/source-after.sha256"
          cmp "$QA_OUT/source-before.sha256" "$QA_OUT/source-after.sha256"
          git ls-files -s > "$QA_OUT/index-after.txt"
          git ls-files -z > "$QA_OUT/tracked-after.bin"
          for lock in package.json package-lock.json bun.lock bun.lockb; do if test -f "$lock"; then sha256sum "$lock"; fi; done > "$QA_OUT/locks-after.sha256"
          cmp "$QA_OUT/index-before.txt" "$QA_OUT/index-after.txt"
          cmp "$QA_OUT/tracked-before.bin" "$QA_OUT/tracked-after.bin"
          cmp "$QA_OUT/locks-before.sha256" "$QA_OUT/locks-after.sha256"
          set +e
          git diff --exit-code HEAD > "$QA_OUT/source-diff.txt"
          source_diff_exit=$?
          printf '%s\n' "$source_diff_exit" > "$QA_OUT/source-diff.exit" || exit 1
          set -e
          if [[ "$CM_ARM" == eager-wire ]]; then
            test "$source_diff_exit" = 1
            test "$(git diff --name-only HEAD)" = src/pages/ClubManager.tsx
            node --input-type=module <<'CM_EAGER_HELD'
          import fs from 'node:fs';import assert from 'node:assert/strict';import crypto from 'node:crypto';
          const spec=JSON.parse(fs.readFileSync('scripts/qa/cmTeamPickerCandidateCases.json','utf8')),bytes=fs.readFileSync(spec.candidate.pagePath);
          assert.equal(crypto.createHash('sha1').update(Buffer.from('blob '+bytes.length+'\0')).update(bytes).digest('hex'),spec.fault.pageBlob);
          CM_EAGER_HELD
          else
            test "$source_diff_exit" = 0
          fi
          git status --porcelain=v1 --untracked-files=all > "$QA_OUT/status-after.txt"
          cmp "$QA_OUT/status-before.txt" "$QA_OUT/status-after.txt"
          if [[ -f "$QA_OUT/dist-before.sha256" ]]; then
            find dist -type f -print0 | sort -z | xargs -0 sha256sum > "$QA_OUT/dist-after.sha256"
            cmp "$QA_OUT/dist-before.sha256" "$QA_OUT/dist-after.sha256"
            sha256sum --check "$QA_OUT/dist-before.sha256" > "$QA_OUT/dist-held.log"
          fi
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const out=process.env.QA_OUT,rows=fs.readdirSync(out+'/transport').sort().map(file=>{
            const lines=fs.readFileSync(out+'/transport/'+file,'utf8').split('\n').filter(Boolean);
            const permitted=line=>(file==='build.log'&&/^\[SIM_OFFLINE_BLOCK\] external browser route continue https:\/\/fonts\.(googleapis|gstatic)\.com$/.test(line))||(file==='sweep-weight.log'&&(/^\[SIM_OFFLINE_BLOCK\] external browser route continue https:\/\/fonts\.(googleapis|gstatic)\.com$/.test(line)||line==='[SIM_OFFLINE_BLOCK] external browser route continue https://flagcdn.com'));
            assert(lines.every(permitted),'Unexpected transport receipt '+file);
            return{file,blockedAttempts:lines.length,fontBlockedAttempts:lines.filter(line=>line.includes('fonts.googleapis.com')||line.includes('fonts.gstatic.com')).length,flagBlockedAttempts:lines.filter(line=>line.endsWith('https://flagcdn.com')).length};
          });
          fs.writeFileSync(out+'/transport-summary.json',JSON.stringify({receipts:rows,meaning:'Declared blocked font/flag attempts are retained; no provider/font availability claim.'},null,2)+'\n');
          fs.writeFileSync(out+'/source-output-hold.json',JSON.stringify({sourceHeld:true,indexHeld:true,trackedPathsHeld:true,locksHeld:true,status:process.env.CM_ARM==='eager-wire'?'EXACT_CONTROLLED_PAGE_M':'clean',completedDistHeld:fs.existsSync(out+'/dist-before.sha256')},null,2)+'\n');
          NODE
          
          }
          finish_arm() {
            local original_exit=$?
            trap - EXIT
            set +e
            for pid in "${server_pids[@]}"; do kill "$pid" 2>/dev/null || true; done
            hold_arm
            local held=$?
            if [[ "$held" != 0 ]]; then exit 1; fi
            exit "$original_exit"
          }
          trap finish_arm EXIT
          
          set -euo pipefail
          export GIT_NO_LAZY_FETCH=1
          export NODE_OPTIONS="--require=$GITHUB_WORKSPACE/scripts/lib/offlineTransport.cjs"
          : > "$QA_OUT/transport/types.log"
          set +e
          SIM_OFFLINE_RECEIPT="$QA_OUT/transport/types.log" node_modules/.bin/tsc --noEmit -p tsconfig.app.json > "$QA_OUT/logs/types.log" 2>&1
          type_exit=$?
          printf '%s\n' "$type_exit" > "$QA_OUT/types.exit" || exit 1
          test "$type_exit" = 0 || exit "$type_exit"
          set -e
          printf '%s\n' '{"command":"node_modules/.bin/tsc --noEmit -p tsconfig.app.json","exit":0}' > "$QA_OUT/types-passed.json"
