          cmp "$QA_OUT/index-before.txt" "$QA_OUT/index-after.txt"
          cmp "$QA_OUT/tracked-before.bin" "$QA_OUT/tracked-after.bin"
          cmp "$QA_OUT/locks-before.sha256" "$QA_OUT/locks-after.sha256"
          git diff --exit-code HEAD > "$QA_OUT/source-diff.txt"
          git status --porcelain=v1 --untracked-files=all > "$QA_OUT/status-after.txt"
          test ! -s "$QA_OUT/status-after.txt"
          if [[ -f "$QA_OUT/original-auth/reference-before.json" ]]; then
            node --input-type=module <<'CM_REFERENCE_HOLD'
          import fs from 'node:fs';import path from 'node:path';import assert from 'node:assert/strict';import crypto from 'node:crypto';
          const out=process.env.QA_OUT,ref=process.env.QA_REF,before=JSON.parse(fs.readFileSync(out+'/original-auth/reference-before.json','utf8')),rows=[];
          function walk(rel=''){for(const entry of fs.readdirSync(path.join(ref,rel),{withFileTypes:true})){const file=path.posix.join(rel,entry.name);if(entry.isDirectory())walk(file);else{assert(entry.isFile());const bytes=fs.readFileSync(path.join(ref,file));rows.push({file,bytes:bytes.length,sha256:crypto.createHash('sha256').update(bytes).digest('hex')});}}}walk();rows.sort((a,b)=>a.file<b.file?-1:a.file>b.file?1:0);assert.deepEqual(rows,before,'whole original reference inventory, no addition/deletion/body drift');fs.writeFileSync(out+'/original-auth/reference-after.json',JSON.stringify(rows,null,2)+'\n');
          CM_REFERENCE_HOLD
          fi
      - name: Pack bounded complete candidate output or fatal diagnostic
        id: pack
        if: always()
        run: |
          set +e
          set -uo pipefail
          archive="$RUNNER_TEMP/cm-team-picker-candidate-evidence.tar.gz"
          tar -czf "$archive" -C "$QA_OUT" . > "$RUNNER_TEMP/cm-team-picker-candidate-pack.log" 2>&1
          pack_exit=$?
          printf '%s\n' "$pack_exit" > "$QA_OUT/pack-native.exit" || exit 1
          if [[ "$pack_exit" == 0 && -f "$archive" && "$(stat -c %s "$archive")" -le 50000000 ]]; then
            sha256sum "$archive" > "$archive.sha256" || exit 1
            printf 'archive=%s\n' "$archive" >> "$GITHUB_OUTPUT" || exit 1
            exit 0
          fi
          printf '%s\n' 'DIAGNOSTIC_ONLY_NO_COMPLETE_OUTPUT_PROOF: full pack failed or exceeded50000000bytes' > "$QA_OUT/DIAGNOSTIC-ONLY.txt" || exit 1
          diagnostic_dir="$RUNNER_TEMP/cm-team-picker-candidate-diagnostic"
          mkdir -p "$diagnostic_dir" || exit 1
          QA_DIAGNOSTIC="$diagnostic_dir" node --input-type=module <<'CM_DIAGNOSTIC'
          import fs from 'node:fs';import path from 'node:path';
          const source=process.env.QA_OUT,target=process.env.QA_DIAGNOSTIC;
          function walk(rel=''){for(const e of fs.readdirSync(path.join(source,rel),{withFileTypes:true})){const name=path.posix.join(rel,e.name),parts=name.split('/');if(parts.some(p=>p==='raw'||p==='bodies'))continue;if(e.isDirectory())walk(name);else if(e.isFile()&&!/\.(?:tar\.gz|tgz)$/.test(name)){const dst=path.join(target,name);fs.mkdirSync(path.dirname(dst),{recursive:true});fs.copyFileSync(path.join(source,name),dst);}}}walk();
          CM_DIAGNOSTIC
          test "$?" = 0 || exit 1
          diagnostic="$RUNNER_TEMP/cm-team-picker-candidate-diagnostic.tar.gz"
          tar -czf "$diagnostic" -C "$diagnostic_dir" . || exit 1
          test "$(stat -c %s "$diagnostic")" -le 50000000 || exit 1
          sha256sum "$diagnostic" > "$diagnostic.sha256" || exit 1
          printf 'archive=%s\n' "$diagnostic" >> "$GITHUB_OUTPUT" || exit 1
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cm-team-picker-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.pack.outputs.archive }}
            ${{ steps.pack.outputs.archive }}.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
