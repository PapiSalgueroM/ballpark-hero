name: Soccer Connections fixed mode selection proof
on:
  push:
    branches: [codex/soccer-connections-mode-selection-qa-20261106]
permissions:
  contents: read
  actions: read
jobs:
  fixed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      SIM_NETWORK: offline
      SIM_OFFLINE_RECEIPT: soccer-connections-fixed/offline.log
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - name: Exact fixed source and locked install
        run: |
          set -euo pipefail
          test ! -e soccer-connections-fixed
          mkdir soccer-connections-fixed
          touch soccer-connections-fixed/offline.log
          git rev-parse HEAD > soccer-connections-fixed/head.txt
          git rev-parse 'HEAD^{tree}' > soccer-connections-fixed/tree.txt
          git ls-files -s > soccer-connections-fixed/source-before.txt
          sha256sum package.json package-lock.json > soccer-connections-fixed/locks-before.txt
          git diff --exit-code HEAD -- .
          git fetch --no-tags --depth=1 origin f1ce570f140443f161e566e2a6974410e8d92185
          test "$(git rev-parse 'f1ce570f140443f161e566e2a6974410e8d92185^{tree}')" = 46e419a6514473e8e7fffe2ba3f30ba3cede90b3
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';import {execFileSync} from 'node:child_process';import {createHash} from 'node:crypto';
          const out='soccer-connections-fixed',base='f1ce570f140443f161e566e2a6974410e8d92185',test='src/test/connectionsModeSelection.test.tsx',plan='docs/plans/2026-11-06-soccer-connections-mode-selection.md',workflow='.github/workflows/soccer-connections-mode-selection-20261106.yml',at=(ref,file)=>execFileSync('git',['rev-parse',ref+':'+file],{encoding:'utf8'}).trim();
          const pins={'src/hooks/useConnections.ts':'55050eccb78a6574a1524f0cfb7597c789104c73','src/pages/Connections.tsx':'b5bd5aaba7d8877be86cc592ca4ae1616b517a5f','src/hooks/useNbaConnections.ts':'6eb28d73ca73df504a51e03f8ef0583e4902012c','src/hooks/useNflConnections.ts':'8c9baba45217a9f771637001b583f82b0bf357be','src/hooks/useNhlConnections.ts':'3cde7efba8ee4c99a08c5d0e17eacd8a458fa29d','src/hooks/useBaseballConnections.ts':'eee8e7d66819bd6ac2c9c6a1268e0ebd99d02b0f',[test]:'e79ad2f59a671d83fba294e4bc61c400dd2b3037',[plan]:'58f0fd78014cd6508da98f44909942b88409aefe','package.json':'2ff64986fb76ebc51b706f2fd24765768874008a','package-lock.json':'97d6f12a052f25f400462938c241789a083f0bfe'};
          assert.equal(at(base,'src/hooks/useConnections.ts'),'85964ad8462a9b7c60cd3709240c3107bfb47e7f');for(const[f,p]of Object.entries(pins))assert.equal(at('HEAD',f),p,f);for(const f of Object.keys(pins).filter(f=>f!==test&&f!==plan&&f!=='src/hooks/useConnections.ts'))assert.equal(at(base,f),pins[f],f+' base');
          const tree=ref=>execFileSync('git',['ls-tree','-r','-z',ref],{encoding:'utf8',maxBuffer:16*1024*1024}).split('\0').filter(Boolean),owned=[test,plan,workflow,'src/hooks/useConnections.ts'],held=rows=>rows.filter(row=>!owned.includes(row.split('\t')[1]));assert.deepEqual(held(tree('HEAD')),held(tree(base)),'Every other tracked blob equals clean C4 PR519, with only the Soccer hook owned');fs.writeFileSync(out+'/source-join.json',JSON.stringify({status:'passed',base,baseTree:'46e419a6514473e8e7fffe2ba3f30ba3cede90b3',heldRows:held(tree('HEAD')).length,onlyOwnedLeaves:owned,pins,otherFourSportHooksHeld:true},null,2));
          const files=execFileSync('git',['ls-files','-z'],{encoding:'utf8'}).split('\0').filter(Boolean),rows=files.map(file=>{const b=fs.readFileSync(file);return{file,bytes:b.length,sha256:createHash('sha256').update(b).digest('hex')};});fs.writeFileSync(out+'/tracked-before.json',JSON.stringify(rows));
          NODE
          npm ci 2>&1 | tee soccer-connections-fixed/install.log
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';const lock=JSON.parse(fs.readFileSync('package-lock.json')),rows=Object.keys(lock.packages).filter(p=>p.startsWith('node_modules/')&&fs.existsSync(p+'/package.json')).map(p=>[p,JSON.parse(fs.readFileSync(p+'/package.json')).version]);assert.equal(rows.length,521);for(const[p,v]of rows)assert.equal(v,lock.packages[p].version,p);fs.writeFileSync('soccer-connections-fixed/installed-before.json',JSON.stringify(rows));
          NODE
      - name: Proper App types
        run: |
          set -euo pipefail
          node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee soccer-connections-fixed/types.log
      - name: Complete textual census and AST code caller audit
        run: |
          set -euo pipefail
          git grep -n -I -e useConnections -e hooks/useConnections -- . > soccer-connections-fixed/caller-grep.txt
          git ls-files '*useConnections*' > soccer-connections-fixed/hook-paths.txt
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import path from 'node:path';import assert from 'node:assert/strict';import ts from 'typescript';import {execFileSync} from 'node:child_process';
          const out='soccer-connections-fixed',hook='src/hooks/useConnections.ts',page='src/pages/Connections.tsx',name='useConnections',files=execFileSync('git',['ls-files','-z'],{encoding:'utf8'}).split('\0').filter(Boolean),hookPaths=files.filter(f=>/(?:^|\/)useConnections\.[cm]?[jt]sx?$/i.test(f));
          const sourceFiles=files.filter(f=>f.startsWith('src/')&&/\.[cm]?[jt]sx?$/.test(f)),isTest=f=>/^src\/test(?:\/|$)/.test(f)||/(?:^|\/)__tests__\//.test(f)||/\.(test|spec)\.[cm]?[jt]sx?$/.test(f),events=[],unresolved=[],parseErrors=[];
          const target=(specifier,file)=>{let resolved=specifier.startsWith('@/')?'src/'+specifier.slice(2):specifier.startsWith('.')?path.posix.join(path.posix.dirname(file),specifier):specifier;resolved=path.posix.normalize(resolved).replace(/\.[cm]?[jt]sx?$/,'');return resolved==='src/hooks/useConnections'||specifier===name;};
          for(const file of sourceFiles){
            const text=fs.readFileSync(file,'utf8'),ast=ts.createSourceFile(file,text,ts.ScriptTarget.Latest,true),production=!isTest(file);for(const d of ast.parseDiagnostics)parseErrors.push({file,message:ts.flattenDiagnosticMessageText(d.messageText,' ')});
            const record=(node,kind,module=null)=>{const pos=ast.getLineAndCharacterOfPosition(node.getStart(ast));events.push({file,production,kind,module,line:pos.line+1,column:pos.character+1,code:node.getText(ast)});};
            const visit=node=>{
              if((ts.isImportDeclaration(node)||ts.isExportDeclaration(node))&&node.moduleSpecifier&&ts.isStringLiteralLike(node.moduleSpecifier)&&target(node.moduleSpecifier.text,file))record(node,ts.isImportDeclaration(node)?'import':'reexport',node.moduleSpecifier.text);
              if(ts.isImportTypeNode(node)&&ts.isLiteralTypeNode(node.argument)&&ts.isStringLiteralLike(node.argument.literal)&&target(node.argument.literal.text,file))record(node,'type-import',node.argument.literal.text);
              if(ts.isCallExpression(node)&&(node.expression.kind===ts.SyntaxKind.ImportKeyword||(ts.isIdentifier(node.expression)&&node.expression.text==='require'))){const argument=node.arguments[0],kind=node.expression.kind===ts.SyntaxKind.ImportKeyword?'dynamic-import':'require';if(argument&&ts.isStringLiteralLike(argument)){if(target(argument.text,file))record(node,kind,argument.text);}else{const pos=ast.getLineAndCharacterOfPosition(node.getStart(ast));unresolved.push({file,production,kind,line:pos.line+1,code:node.getText(ast)});}}
              if(ts.isIdentifier(node)&&node.text===name)record(node,'symbol-identifier');ts.forEachChild(node,visit);
            };visit(ast);
          }
          const productionCallers=[...new Set(events.filter(e=>e.production&&e.file!==hook).map(e=>e.file))].sort(),unknownProductionLoads=unresolved.filter(e=>e.production),report={status:'pending-review',typescriptVersion:ts.version,commentPolicy:'TypeScript AST nodes only, never comments/trivia. Complete raw gitgrep retained separately.',scannedFiles:sourceFiles.length,hookPaths,productionCallers,events,unresolvedLoaders:unresolved,parseErrors,limits:'Direct module/symbol census includes imports, reexports, dynamic import and require. Unresolved production loaders refuse automatic admission and require source review. No transitive higher-order callgraph claim.'};
          fs.copyFileSync(hook,out+'/fixed-hook.ts');fs.copyFileSync(page,out+'/original-page.tsx');fs.writeFileSync(out+'/caller-audit.json',JSON.stringify(report,null,2));assert.deepEqual(parseErrors,[]);assert.deepEqual(hookPaths,[hook]);assert.deepEqual(productionCallers,[page],'Only known Soccer page consumes hook');assert.deepEqual(unknownProductionLoads,[],'Unresolved production loader requires review before an App fix');assert(events.some(e=>e.file===page&&e.kind==='import'));report.status='passed';fs.writeFileSync(out+'/caller-audit.json',JSON.stringify(report,null,2));console.log('PASS code callers: '+JSON.stringify({productionCallers,hookPaths,scannedFiles:sourceFiles.length}));
          NODE
      - name: Pinned completed original packet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/PapiSalgueroM/ballpark-hero/actions/runs/42186546893 > soccer-connections-fixed/original-run.json
          gh api repos/PapiSalgueroM/ballpark-hero/actions/artifacts/13487104857 > soccer-connections-fixed/original-artifact.json
          gh api repos/PapiSalgueroM/ballpark-hero/actions/artifacts/13487104857/zip > "$RUNNER_TEMP/connections-original.zip"
          echo "7bcae9b3bd144212306f9ed9a6eff1d29607e37a5263366cd6103fcb1ce951c1  $RUNNER_TEMP/connections-original.zip" | sha256sum --check
          mkdir soccer-connections-fixed/original-packet
          unzip -q "$RUNNER_TEMP/connections-original.zip" -d soccer-connections-fixed/original-packet
          cp soccer-connections-fixed/original-packet/original-hook.ts soccer-connections-fixed/original-hook.ts
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';import {createHash} from 'node:crypto';
          const out='soccer-connections-fixed',read=f=>JSON.parse(fs.readFileSync(out+'/'+f)),run=read('original-run.json'),meta=read('original-artifact.json'),proof=read('original-packet/original-admission.json');assert.equal(run.id,42186546893);assert.equal(run.head_sha,'188424675ba9c018be6b969dc40343a6ab4c8946');assert.equal(run.status,'completed');assert.equal(run.conclusion,'success');assert.equal(meta.id,13487104857);assert.equal(meta.expired,false);assert.equal(meta.workflow_run.id,run.id);assert.equal(meta.workflow_run.head_sha,run.head_sha);assert.equal(proof.status,'original-four-business-reds-admitted');assert.equal(proof.actualRows,8);assert.equal(proof.rawFrames,42);const old=fs.readFileSync(out+'/original-hook.ts'),blob=createHash('sha1').update(Buffer.concat([Buffer.from('blob '+old.length+'\0'),old])).digest('hex');assert.equal(blob,'85964ad8462a9b7c60cd3709240c3107bfb47e7f');assert.equal(createHash('sha256').update(fs.readFileSync(out+'/original-packet/raw.json')).digest('hex'),'e2f1c8f5c9a530e52313859cf36d1ff630c6aafe29cdefa98b1862036c6edd5a');console.log('PASS actual original4 business failures/4 preserves/42 RAW with exact original Hook');
