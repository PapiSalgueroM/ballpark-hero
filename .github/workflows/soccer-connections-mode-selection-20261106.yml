      - name: Actual fixed eight cases and whole preservation
        run: |
          set -euo pipefail
          CONNECTIONS_MODE_RAW="$PWD/soccer-connections-fixed/raw.json" NODE_OPTIONS="--max-old-space-size=6144 --require=$PWD/scripts/lib/offlineTransport.cjs" node node_modules/vitest/vitest.mjs run src/test/connectionsModeSelection.test.tsx --maxWorkers=1 --minWorkers=1 --reporter=default --reporter=json --outputFile=soccer-connections-fixed/owned.json 2>&1 | tee soccer-connections-fixed/owned.log
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';import {createHash} from 'node:crypto';
          const out='soccer-connections-fixed',r=JSON.parse(fs.readFileSync(out+'/owned.json')),raw=JSON.parse(fs.readFileSync(out+'/raw.json')),old=JSON.parse(fs.readFileSync(out+'/original-packet/raw.json')),log=fs.readFileSync(out+'/owned.log','utf8'),rows=r.testResults.flatMap(s=>s.assertionResults);assert.equal(r.numTotalTests,8);assert.equal(r.numPassedTests,8);assert.equal(r.numFailedTests,0);assert.equal(r.numPendingTests,0);assert.equal(rows.length,8);assert(rows.every(r=>r.status==='passed'));for(const k of ['numRuntimeErrorTestSuites','numUnhandledErrors'])if(Object.hasOwn(r,k))assert.equal(r[k],0,k);assert(!/Unhandled Errors|Unhandled Rejection|Uncaught Exception|Failed to resolve import|No test files found|SyntaxError/.test(log));
          assert.equal(raw.version,1);assert.equal(raw.unitClock,old.unitClock);assert.deepEqual(raw.fictionalPool,old.fictionalPool);assert.deepEqual(Object.keys(raw.cases).sort(),Object.keys(old.cases).sort());let frames=0;for(const[k,c]of Object.entries(raw.cases)){assert.equal(c.title,old.cases[k].title);assert.deepEqual(c.frames.map(f=>f.label),old.cases[k].frames.map(f=>f.label));frames+=c.frames.length;for(const f of c.frames){assert(f.state&&Array.isArray(f.state.selected));assert(Array.isArray(f.draws)&&Array.isArray(f.transport)&&Array.isArray(f.dailyLog)&&Array.isArray(f.completions));assert.equal(f.storage['connections-unrelated'],'held');}}assert.equal(frames,42);
          for(const key of ['same','progress','daily','unlimited'])assert.deepEqual(raw.cases[key],old.cases[key],'Entire original preservation case held: '+key);
          for(const[k,beforeLabel,afterLabel]of[['forward','unlimited-before-submit','unlimited-after-submit'],['reverse','daily-before-submit','daily-after-submit']]){const c=raw.cases[k].frames,before=c.find(f=>f.label===beforeLabel),after=c.find(f=>f.label===afterLabel);assert.deepEqual(before.state.selected,[]);assert.equal(before.state.lives,4);assert.equal(after.state.lives,4);assert.deepEqual(after.storage,before.storage);assert.deepEqual(after.dailyLog,[]);assert.equal(after.state.solvedGroups.length,0);}assert.equal(raw.cases.forward.frames[2].page.submitDisabled,true);for(const k of ['forwardFeedback','reverseFeedback']){const f=raw.cases[k].frames[2];assert.equal(f.state.oneAway,false);assert.equal(f.state.lastIncorrect,null);assert.equal(f.state.lives,4);}
          const b=fs.readFileSync(out+'/raw.json');fs.writeFileSync(out+'/fixed-admission.json',JSON.stringify({status:'fixed-eight-passed-four-whole-cases-held',cases:8,rawFrames:frames,preservedCases:['same','progress','daily','unlimited'],rawBytes:b.length,rawSHA256:createHash('sha256').update(b).digest('hex')},null,2));console.log('PASS actual8 fixed,42RAW,4 complete original preservation cases');
