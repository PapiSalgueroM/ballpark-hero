name: Soccer Connections mode selection controls
on:
  push:
    branches: [codex/soccer-connections-mode-selection-qa-20261106]
permissions:
  contents: read
  actions: read
jobs:
  controls:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      SIM_NETWORK: offline
      SIM_OFFLINE_RECEIPT: connections-mode-controls/offline.log
      TZ: UTC
      CONNECTIONS_FIXED_RUN: '42187172744'
      CONNECTIONS_FIXED_ARTIFACT: '13487764007'
      CONNECTIONS_FIXED_ZIP_SHA256: 'b747fbac98309f2aba20d9e53879ec990a3ed94dbe44f3a1c898f2bd1479613d'
      CONNECTIONS_FIXED_HEAD: '81db0c9e7bbdf68c89e767b7e3c1fdc95a9f523e'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - name: Exact control source and locked install
        run: |
          set -euo pipefail
          [[ "$CONNECTIONS_FIXED_RUN" =~ ^[0-9]+$ ]]
          [[ "$CONNECTIONS_FIXED_ARTIFACT" =~ ^[0-9]+$ ]]
          [[ "$CONNECTIONS_FIXED_ZIP_SHA256" =~ ^[a-f0-9]{64}$ ]]
          [[ "$CONNECTIONS_FIXED_HEAD" =~ ^[a-f0-9]{40}$ ]]
          test ! -e connections-mode-controls
          mkdir connections-mode-controls
          touch connections-mode-controls/offline.log
          git rev-parse HEAD > connections-mode-controls/head.txt
          git rev-parse 'HEAD^{tree}' > connections-mode-controls/tree.txt
          git ls-files -s > connections-mode-controls/source-before.txt
          sha256sum package.json package-lock.json > connections-mode-controls/locks-before.txt
          git diff --exit-code HEAD -- .
          git fetch --no-tags --depth=1 origin f1ce570f140443f161e566e2a6974410e8d92185
          test "$(git rev-parse 'f1ce570f140443f161e566e2a6974410e8d92185^{tree}')" = 46e419a6514473e8e7fffe2ba3f30ba3cede90b3
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';import {execFileSync} from 'node:child_process';import {createHash} from 'node:crypto';
          const out='connections-mode-controls',base='f1ce570f140443f161e566e2a6974410e8d92185',hook='src/hooks/useConnections.ts',test='src/test/connectionsModeSelection.test.tsx',plan='docs/plans/2026-11-06-soccer-connections-mode-selection.md',runner='scripts/qa/checkConnectionsModeSelection.mjs',workflow='.github/workflows/soccer-connections-mode-selection-20261106.yml',at=(ref,file)=>execFileSync('git',['rev-parse',ref+':'+file],{encoding:'utf8'}).trim();
          const pins={[hook]:'55050eccb78a6574a1524f0cfb7597c789104c73','src/pages/Connections.tsx':'b5bd5aaba7d8877be86cc592ca4ae1616b517a5f',[test]:'e79ad2f59a671d83fba294e4bc61c400dd2b3037',[plan]:'58f0fd78014cd6508da98f44909942b88409aefe',[runner]:'8c54b23981a7f51b30edbf57011d0fd7ba8ba7c6','src/hooks/useNbaConnections.ts':'6eb28d73ca73df504a51e03f8ef0583e4902012c','src/hooks/useNflConnections.ts':'8c9baba45217a9f771637001b583f82b0bf357be','src/hooks/useNhlConnections.ts':'3cde7efba8ee4c99a08c5d0e17eacd8a458fa29d','src/hooks/useBaseballConnections.ts':'eee8e7d66819bd6ac2c9c6a1268e0ebd99d02b0f','package.json':'2ff64986fb76ebc51b706f2fd24765768874008a','package-lock.json':'97d6f12a052f25f400462938c241789a083f0bfe'};
          for(const[file,sha]of Object.entries(pins))assert.equal(at('HEAD',file),sha,file);
          const owned=[hook,test,plan,runner,workflow],tree=ref=>execFileSync('git',['ls-tree','-r','-z',ref],{encoding:'utf8',maxBuffer:16*1024*1024}).split('\0').filter(Boolean),held=rows=>rows.filter(row=>!owned.includes(row.split('\t')[1]));
          assert.deepEqual(held(tree('HEAD')),held(tree(base)),'Every other tracked mode and blob equals clean PR519');assert.equal(at(base,hook),'85964ad8462a9b7c60cd3709240c3107bfb47e7f');
          for(const file of Object.keys(pins).filter(file=>!owned.includes(file)))assert.equal(at(base,file),pins[file],file+' base');
          fs.writeFileSync(out+'/source-join.json',JSON.stringify({status:'passed',base,baseTree:'46e419a6514473e8e7fffe2ba3f30ba3cede90b3',heldRows:held(tree('HEAD')).length,onlyOwnedLeaves:owned,pins,nativeHelperPresent:false},null,2));
          const files=execFileSync('git',['ls-files','-z'],{encoding:'utf8'}).split('\0').filter(Boolean),rows=files.map(file=>{const bytes=fs.readFileSync(file);return{file,bytes:bytes.length,sha256:createHash('sha256').update(bytes).digest('hex')};});fs.writeFileSync(out+'/tracked-before.json',JSON.stringify(rows));
          NODE
          npm ci 2>&1 | tee connections-mode-controls/install.log
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const lock=JSON.parse(fs.readFileSync('package-lock.json')),rows=Object.keys(lock.packages).filter(p=>p.startsWith('node_modules/')&&fs.existsSync(p+'/package.json')).map(p=>[p,JSON.parse(fs.readFileSync(p+'/package.json')).version]);assert.equal(rows.length,521);for(const[p,v]of rows)assert.equal(v,lock.packages[p].version,p);fs.writeFileSync('connections-mode-controls/installed-before.json',JSON.stringify(rows));
          NODE
      - name: Proper App types before controls
        run: |
          set -euo pipefail
          node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee connections-mode-controls/types-before.log
      - name: Pinned completed fixed qualification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/PapiSalgueroM/ballpark-hero/actions/runs/$CONNECTIONS_FIXED_RUN" > connections-mode-controls/fixed-run.json
          gh api "repos/PapiSalgueroM/ballpark-hero/actions/artifacts/$CONNECTIONS_FIXED_ARTIFACT" > connections-mode-controls/fixed-artifact.json
          gh api "repos/PapiSalgueroM/ballpark-hero/actions/artifacts/$CONNECTIONS_FIXED_ARTIFACT/zip" > "$RUNNER_TEMP/connections-fixed.zip"
          echo "$CONNECTIONS_FIXED_ZIP_SHA256  $RUNNER_TEMP/connections-fixed.zip" | sha256sum --check
          mkdir connections-mode-controls/reference-fixed
          unzip -q "$RUNNER_TEMP/connections-fixed.zip" -d connections-mode-controls/reference-fixed
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import path from 'node:path';import assert from 'node:assert/strict';import {createHash} from 'node:crypto';
          const out='connections-mode-controls',ref=out+'/reference-fixed',read=file=>JSON.parse(fs.readFileSync(path.join(ref,file))),hash=bytes=>createHash('sha256').update(bytes).digest('hex'),blob=bytes=>createHash('sha1').update(Buffer.concat([Buffer.from('blob '+bytes.length+'\0'),bytes])).digest('hex');
          const run=JSON.parse(fs.readFileSync(out+'/fixed-run.json')),meta=JSON.parse(fs.readFileSync(out+'/fixed-artifact.json'));
          assert.equal(run.id,Number(process.env.CONNECTIONS_FIXED_RUN));assert.equal(run.head_sha,process.env.CONNECTIONS_FIXED_HEAD);assert.equal(run.status,'completed');assert.equal(run.conclusion,'success');
          assert.equal(meta.id,Number(process.env.CONNECTIONS_FIXED_ARTIFACT));assert.equal(meta.expired,false);assert.equal(meta.workflow_run.id,run.id);assert.equal(meta.workflow_run.head_sha,run.head_sha);assert.equal(meta.digest,'sha256:'+process.env.CONNECTIONS_FIXED_ZIP_SHA256);
          assert.equal(fs.readFileSync(ref+'/head.txt','utf8').trim(),run.head_sha);assert.equal(fs.readFileSync(ref+'/tree.txt','utf8').trim(),'f36edc8ce4d29639c14290ac82cc359c3e87eebb');
          for(const[a,b]of[['source-before.txt','source-after.txt'],['tracked-before.json','tracked-after.json'],['locks-before.txt','locks-after.txt'],['installed-before.json','installed-after.json']])assert.deepEqual(fs.readFileSync(path.join(ref,a)),fs.readFileSync(path.join(ref,b)),'Actual fixed physical hold '+a);
          assert.equal(fs.statSync(ref+'/types.log').size,0);assert.equal(fs.statSync(ref+'/offline.log').size,0);assert.equal(read('installed-before.json').length,521);
          const oldRun=read('original-run.json'),oldMeta=read('original-artifact.json'),original=read('original-packet/original-admission.json'),proof=read('fixed-admission.json');
          assert.equal(oldRun.id,42186546893);assert.equal(oldRun.status,'completed');assert.equal(oldRun.conclusion,'success');assert.equal(oldRun.head_sha,'188424675ba9c018be6b969dc40343a6ab4c8946');assert.equal(oldMeta.id,13487104857);assert.equal(oldMeta.workflow_run.id,oldRun.id);assert.equal(oldMeta.workflow_run.head_sha,oldRun.head_sha);assert.equal(oldMeta.digest,'sha256:7bcae9b3bd144212306f9ed9a6eff1d29607e37a5263366cd6103fcb1ce951c1');assert.equal(original.status,'original-four-business-reds-admitted');assert.equal(original.actualRows,8);assert.equal(original.rawFrames,42);
          assert.equal(proof.status,'fixed-eight-passed-four-whole-cases-held');assert.equal(proof.cases,8);assert.equal(proof.rawFrames,42);assert.deepEqual(proof.preservedCases,['same','progress','daily','unlimited']);
          assert.equal(blob(fs.readFileSync(ref+'/fixed-hook.ts')),'55050eccb78a6574a1524f0cfb7597c789104c73');assert.equal(blob(fs.readFileSync(ref+'/original-page.tsx')),'b5bd5aaba7d8877be86cc592ca4ae1616b517a5f');assert.equal(blob(fs.readFileSync(ref+'/original-packet/original-hook.ts')),'85964ad8462a9b7c60cd3709240c3107bfb47e7f');
          const rawBytes=fs.readFileSync(ref+'/raw.json'),raw=JSON.parse(rawBytes),oldBytes=fs.readFileSync(ref+'/original-packet/raw.json'),old=JSON.parse(oldBytes);assert.equal(hash(oldBytes),'e2f1c8f5c9a530e52313859cf36d1ff630c6aafe29cdefa98b1862036c6edd5a');assert.equal(rawBytes.length,proof.rawBytes);assert.equal(hash(rawBytes),proof.rawSHA256);assert.equal(Object.values(raw.cases).reduce((sum,c)=>sum+c.frames.length,0),42);assert.deepEqual({...raw,cases:null},{...old,cases:null});for(const key of proof.preservedCases)assert.deepEqual(raw.cases[key],old.cases[key],'Actual whole preservation '+key);
          for(const[file,count]of[['owned.json',8],['existing.json',24]]){const r=read(file),rows=r.testResults.flatMap(s=>s.assertionResults);assert.equal(r.numTotalTests,count);assert.equal(r.numPassedTests,count);assert.equal(r.numFailedTests,0);assert.equal(r.numPendingTests,0);assert.equal(rows.length,count);assert(rows.every(row=>row.status==='passed'));for(const field of['numRuntimeErrorTestSuites','numUnhandledErrors'])if(Object.hasOwn(r,field))assert.equal(r[field],0);const log=fs.readFileSync(ref+'/'+file.replace('.json','.log'),'utf8');assert(!/Unhandled Errors|Unhandled Rejection|Uncaught Exception|Failed to resolve import|No test files found|SyntaxError/.test(log));}
          const callers=read('caller-audit.json');assert.equal(callers.status,'passed');assert.deepEqual(callers.productionCallers,['src/pages/Connections.tsx']);assert.deepEqual(callers.parseErrors,[]);assert.deepEqual(callers.unresolvedLoaders.filter(row=>row.production),[]);
          const parseIndex=file=>new Map(fs.readFileSync(file,'utf8').trim().split('\n').map(line=>{const m=/^([0-9]+) ([0-9a-f]{40}) 0\t(.+)$/.exec(line);assert(m,'Actual index row');return[m[3],[m[1],m[2]]];})),oldSource=parseIndex(ref+'/source-before.txt'),current=parseIndex(out+'/source-before.txt'),excluded=new Set(['scripts/qa/checkConnectionsModeSelection.mjs','.github/workflows/soccer-connections-mode-selection-20261106.yml']),held=map=>[...map].filter(([file])=>!excluded.has(file)).sort(([a],[b])=>a.localeCompare(b));
          assert.deepEqual(held(current),held(oldSource),'Every other qualified fixed index path/mode/blob held');assert(!oldSource.has('scripts/qa/checkConnectionsModeSelection.mjs'));assert.equal(current.get('scripts/qa/checkConnectionsModeSelection.mjs')[1],'8c54b23981a7f51b30edbf57011d0fd7ba8ba7c6');assert(!current.has('scripts/qa/playConnectionsModeSelection.mjs'),'Native helper not admitted in this unit control tree');
          const retained=['owned.json','owned.log','existing.json','existing.log','raw.json','fixed-admission.json','source-before.txt','tracked-before.json','caller-audit.json','types.log','offline.log'].map(file=>{const bytes=fs.readFileSync(path.join(ref,file));return{file,bytes:bytes.length,sha256:hash(bytes)};});
          fs.writeFileSync(out+'/fixed-stages-carried.json',JSON.stringify({status:'passed',run:run.id,head:run.head_sha,artifact:meta.id,zipSHA256:process.env.CONNECTIONS_FIXED_ZIP_SHA256,fixedCases:8,otherSportCases:24,qualifiedCases:32,rawFrames:42,originalRun:oldRun.id,wholePreservedCases:proof.preservedCases,rawSHA256:hash(rawBytes),retained,limits:'Completed32-case fixed qualification carried, not rerun as32 here. The control runner reruns only the8 owned cases in each arm. No native,build,weight,full-suite or live backend credit.'},null,2));
          console.log('PASS pinned completed32-case fixed qualification/42RAW/4whole preserves and all fixed-source holds');
          NODE
      - name: Actual seven-arm causal census
        run: |
          set -euo pipefail
          CONNECTIONS_MODE_CONTROL_OUT="$PWD/connections-mode-controls/arms" CONNECTIONS_MODE_FIXED_PACKET="$PWD/connections-mode-controls/reference-fixed" NODE_OPTIONS="--max-old-space-size=6144 --require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/qa/checkConnectionsModeSelection.mjs 2>&1 | tee connections-mode-controls/controls.log
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';import {createHash} from 'node:crypto';
          const out='connections-mode-controls',read=file=>JSON.parse(fs.readFileSync(out+'/'+file)),summary=read('arms/summary.json'),hash=bytes=>createHash('sha256').update(bytes).digest('hex');
          const names=['fixed','original','omit-same-mode-guard','omit-selection-clear','omit-refusal-clear','omit-one-away-clear','restored'],expected=[[],['CONN_MODE_FORWARD','CONN_MODE_REVERSE','CONN_MODE_FORWARD_FEEDBACK','CONN_MODE_REVERSE_FEEDBACK'],['CONN_MODE_SAME'],['CONN_MODE_FORWARD','CONN_MODE_REVERSE'],['CONN_MODE_FORWARD_FEEDBACK','CONN_MODE_REVERSE_FEEDBACK'],['CONN_MODE_FORWARD_FEEDBACK','CONN_MODE_REVERSE_FEEDBACK'],[]];
          assert.equal(summary.status,'passed');assert.equal(summary.error,null);assert.equal(summary.completedArms,7);assert.equal(summary.actualRows,56);assert.equal(summary.actualNamedBusinessReds,11);assert.deepEqual(summary.arms.map(arm=>arm.name),names);
          for(let i=0;i<names.length;i++){const arm=summary.arms[i],admission=read('arms/'+names[i]+'/admission.json');assert.deepEqual(arm,admission);assert.equal(arm.status,'passed');assert.equal(arm.actualRows,8);assert.deepEqual(arm.actualFailed.map(title=>title.split(' ')[0]).sort(),[...expected[i]].sort());assert.equal(arm.actualPassed.length,8-expected[i].length);assert.equal(arm.changed.length,i===0||i===6?0:1);assert(arm.otherTrackedBodiesHeld&&arm.indexHeld&&arm.installed521Held&&arm.offlineHeld);}
          for(const field of['allTrackedRestored','indexHeld','installed521Held','offlineHeld'])assert.equal(summary[field],true);
          const original=fs.readFileSync(out+'/reference-fixed/original-packet/raw.json'),fixed=fs.readFileSync(out+'/reference-fixed/raw.json');assert.equal(summary.originalRawSha256,hash(original));assert.equal(summary.fixedRawSha256,hash(fixed));assert.equal(summary.originalRawBytes,original.length);assert.equal(summary.fixedRawBytes,fixed.length);
          assert.deepEqual(fs.readFileSync(out+'/arms/original/raw.json'),original);for(const arm of['fixed','restored'])assert.deepEqual(fs.readFileSync(out+'/arms/'+arm+'/raw.json'),fixed);assert.deepEqual(fs.readFileSync(out+'/arms/tracked-before.json'),fs.readFileSync(out+'/arms/tracked-after.json'));assert.deepEqual(fs.readFileSync(out+'/arms/index-before.txt'),fs.readFileSync(out+'/arms/index-after.txt'));
          fs.writeFileSync(out+'/controls-admission.json',JSON.stringify({status:'passed',arms:7,actualRows:56,actualNamedBusinessReds:11,redCounts:summary.arms.map(arm=>arm.actualFailed.length),actualPasses:45,originalRawSHA256:hash(original),fixedRestoredRawSHA256:hash(fixed),wholeUnaffectedVectors:summary.arms.reduce((sum,arm)=>sum+arm.wholeUnaffectedCases.length,0),wholePreservationVectors:summary.arms.reduce((sum,arm)=>sum+arm.wholePreservationCases.length,0),allTrackedRestored:true,limits:'Actual source-only controls. The no-same-mode guard arm deliberately fails SAME, all unaffected whole cases remain exact. No24-other-sport rerun/native/build/cap/live credit.'},null,2));console.log('PASS actual7arms/56rows/11namedbusinessreds/45passes, exact matrix and source restoration');
          NODE
      - name: Proper App types after restored controls
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee connections-mode-controls/types-after.log
      - name: Whole tracked source index locks versions and offline held
        if: always()
        run: |
          set -euo pipefail
          git ls-files -s > connections-mode-controls/source-after.txt
          cmp connections-mode-controls/source-before.txt connections-mode-controls/source-after.txt
          git diff --exit-code HEAD -- .
          sha256sum package.json package-lock.json > connections-mode-controls/locks-after.txt
          cmp connections-mode-controls/locks-before.txt connections-mode-controls/locks-after.txt
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';import {execFileSync} from 'node:child_process';import {createHash} from 'node:crypto';
          const out='connections-mode-controls',files=execFileSync('git',['ls-files','-z'],{encoding:'utf8'}).split('\0').filter(Boolean),rows=files.map(file=>{const bytes=fs.readFileSync(file);return{file,bytes:bytes.length,sha256:createHash('sha256').update(bytes).digest('hex')};});fs.writeFileSync(out+'/tracked-after.json',JSON.stringify(rows));assert.deepEqual(rows,JSON.parse(fs.readFileSync(out+'/tracked-before.json')));
          const lock=JSON.parse(fs.readFileSync('package-lock.json')),before=JSON.parse(fs.readFileSync(out+'/installed-before.json')),after=Object.keys(lock.packages).filter(p=>p.startsWith('node_modules/')&&fs.existsSync(p+'/package.json')).map(p=>[p,JSON.parse(fs.readFileSync(p+'/package.json')).version]);assert.equal(after.length,521);assert.deepEqual(after,before);for(const[p,v]of after)assert.equal(v,lock.packages[p].version,p);fs.writeFileSync(out+'/installed-after.json',JSON.stringify(after));assert(fs.existsSync(out+'/offline.log'));assert.equal(fs.statSync(out+'/offline.log').size,0);
