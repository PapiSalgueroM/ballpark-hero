      - name: Final whole source locks installed versions dist and offline holds
        if: always()
        run: |
          set -euo pipefail
          mkdir -p soccer-connections-qualified
          git ls-files -s > soccer-connections-qualified/source-after.txt
          cmp soccer-connections-qualified/source-before.txt soccer-connections-qualified/source-after.txt
          git diff --exit-code HEAD -- .
          sha256sum package.json package-lock.json > soccer-connections-qualified/locks-after.txt
          cmp soccer-connections-qualified/locks-before.txt soccer-connections-qualified/locks-after.txt
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import {execFileSync} from 'node:child_process';import {createHash} from 'node:crypto';import assert from 'node:assert/strict';
          const hash=file=>{const b=fs.readFileSync(file);return {file,bytes:b.length,sha256:createHash('sha256').update(b).digest('hex')};};
          const files=execFileSync('git',['ls-files','-z'],{encoding:'utf8'}).split('\0').filter(Boolean),tracked=files.map(hash);
          fs.writeFileSync('soccer-connections-qualified/tracked-after.json',JSON.stringify(tracked));assert.deepEqual(tracked,JSON.parse(fs.readFileSync('soccer-connections-qualified/tracked-before.json')));
          const before=JSON.parse(fs.readFileSync('soccer-connections-qualified/installed-before.json')),lock=JSON.parse(fs.readFileSync('package-lock.json'));
          const after=Object.keys(lock.packages).filter(p=>p.startsWith('node_modules/')&&fs.existsSync(p+'/package.json')).map(p=>[p,JSON.parse(fs.readFileSync(p+'/package.json')).version]);
          assert.equal(after.length,521);assert.deepEqual(after,before);fs.writeFileSync('soccer-connections-qualified/installed-final.json',JSON.stringify(after));
          const walk=dir=>fs.readdirSync(dir,{withFileTypes:true}).sort((a,b)=>a.name.localeCompare(b.name)).flatMap(e=>e.isDirectory()?walk(dir+'/'+e.name):e.isFile()?[dir+'/'+e.name]:[]);
          if(fs.existsSync('soccer-connections-qualified/dist-before.json')){const rows=walk('dist').map(hash);fs.writeFileSync('soccer-connections-qualified/dist-after.json',JSON.stringify(rows));assert.deepEqual(rows,JSON.parse(fs.readFileSync('soccer-connections-qualified/dist-before.json')));}
          assert(fs.existsSync('soccer-connections-qualified/offline.log'));assert.equal(fs.statSync('soccer-connections-qualified/offline.log').size,0);
          NODE
