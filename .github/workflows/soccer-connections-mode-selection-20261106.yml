          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';const out='soccer-connections-fixed',r=JSON.parse(fs.readFileSync(out+'/existing.json')),rows=r.testResults.flatMap(s=>s.assertionResults);assert.equal(r.numTotalTests,24);assert.equal(r.numPassedTests,24);assert.equal(r.numFailedTests,0);assert.equal(r.numPendingTests,0);assert.equal(rows.length,24);assert(rows.every(v=>v.status==='passed'));for(const k of ['numRuntimeErrorTestSuites','numUnhandledErrors'])if(Object.hasOwn(r,k))assert.equal(r[k],0,k);assert(!/Unhandled Errors|Unhandled Rejection|Uncaught Exception|Failed to resolve import|No test files found|SyntaxError/.test(fs.readFileSync(out+'/existing.log','utf8')));fs.writeFileSync(out+'/existing-admission.json',JSON.stringify({status:'passed',actualCases:24,scope:'Unchanged four US-sport loss/relabel/shake engines, not extra Soccer page coverage.'},null,2));console.log('PASS actual24 existing loss/relabel/shake cases');
