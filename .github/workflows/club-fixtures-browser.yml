name: Club fixtures served display proof

on:
  push:
    branches: [codex/manager-fixtures-browser]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: 'true'
      SIM_NETWORK: offline
      ENGINES: chromium
      CAREER_SEASON_LOCAL_ONLY: '1'
      CLUB_FIXTURES_PHASE: fixed
      CLUB_FIXTURES_OUT: ${{ github.workspace }}/club-fixtures-browser-artifacts/units
      CDF_BROWSER_BASE: 0fd9cbbac389a25dd6c57e23beb46e808f72476f
      CDF_BROWSER_OUT: ${{ github.workspace }}/club-fixtures-browser-artifacts
      FREE_KICK_FONT_CACHE: ${{ github.workspace }}/club-fixtures-browser-artifacts/font-cache
      PRERENDER_ONLY: /club-manager
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Bind unchanged application and locked installed dependencies
        run: |
          echo '127.0.0.1 flawuiqbvjobmkfkauhw.supabase.co' | sudo tee -a /etc/hosts
          mkdir -p "$CDF_BROWSER_OUT"
          git rev-parse HEAD > "$CDF_BROWSER_OUT/head.txt"
          git archive --format=zip HEAD > "$CDF_BROWSER_OUT/source.zip"
          git status --porcelain --untracked-files=no > "$CDF_BROWSER_OUT/source-before.txt"
          test ! -s "$CDF_BROWSER_OUT/source-before.txt"
          git diff --exit-code "$CDF_BROWSER_BASE" -- src scripts package.json package-lock.json bun.lock ':!scripts/playClubDetailFixtures.mjs' ':!scripts/data/clubFixturesBrowser.json'
          find src scripts .github/workflows -type f ! -path scripts/data/lastmod.json -print0 | sort -z | xargs -0 sha256sum > "$CDF_BROWSER_OUT/source-hashes.txt"
          sha256sum package.json package-lock.json bun.lock > "$CDF_BROWSER_OUT/package-hashes.txt"
          npm ci
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const lock = JSON.parse(fs.readFileSync('package-lock.json'));
          const installed = Object.entries(lock.packages).filter(([p]) => p.startsWith('node_modules/') && fs.existsSync(p + '/package.json')).map(([p, entry]) => {
            const version = JSON.parse(fs.readFileSync(p + '/package.json')).version;
            assert.equal(version, entry.version, p); return { path: p, version };
          });
          assert.equal(installed.length, 521);
          fs.writeFileSync(process.env.CDF_BROWSER_OUT + '/installed.json', JSON.stringify(installed, null, 2));
          console.log(`Bound ${installed.length} installed locked versions.`);
          NODE
          find node_modules -type f -print0 | sort -z | xargs -0 sha256sum > "$CDF_BROWSER_OUT/installed-files.sha256"
      - name: Actual types and new browser syntax
        run: |
          node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee "$CDF_BROWSER_OUT/types.log"
          node --check scripts/playClubDetailFixtures.mjs
      - name: Unchanged fixture component outcomes and original control
        run: |
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/simClubDetailFixtures.mjs 2>&1 | tee "$CDF_BROWSER_OUT/fixture-units.log"
      - name: Unchanged old roster source proof and original control
        run: |
          CM_OWN_ROSTER_PHASE=fixed CM_OWN_ROSTER_CORE_REF=HEAD CM_OWN_ROSTER_OUT="$CDF_BROWSER_OUT/old-roster" NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/simClubDetailCurrentRoster.mjs 2>&1 | tee "$CDF_BROWSER_OUT/old-roster-normal.log"
          CM_OWN_ROSTER_PHASE=fixed CM_OWN_ROSTER_CONTROL=original CM_OWN_ROSTER_CORE_REF=HEAD CM_OWN_ROSTER_OUT="$CDF_BROWSER_OUT/old-roster" NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/simClubDetailCurrentRoster.mjs 2>&1 | tee "$CDF_BROWSER_OUT/old-roster-original.log"
      - name: Isolated pinned build and browser tools
        run: |
          npm install --prefix "$RUNNER_TEMP/fixtures-browser-build" --no-save --package-lock=false playwright@1.64.0
          ln -s "$RUNNER_TEMP/fixtures-browser-build/node_modules/playwright" node_modules/playwright
          ln -s "$RUNNER_TEMP/fixtures-browser-build/node_modules/playwright-core" node_modules/playwright-core
          node "$RUNNER_TEMP/fixtures-browser-build/node_modules/playwright/cli.js" install --with-deps chromium
          python -m pip install fonttools pillow
          node scripts/qa/freeKickLab1070.mjs --prefetch-fonts-only 2>&1 | tee "$CDF_BROWSER_OUT/fonts.log"
      - name: Production build and all fifteen rebuilt-site readers
        run: |
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" npm run build:seo 2>&1 | tee "$CDF_BROWSER_OUT/build.log"
          cp scripts/data/lastmod.json "$CDF_BROWSER_OUT/build-lastmod.json"
          git diff -- scripts/data/lastmod.json > "$CDF_BROWSER_OUT/build-lastmod.diff"
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > "$CDF_BROWSER_OUT/dist-hashes.txt"
          ONLY=simAdsense,simBrand,simHeadTags,simHiddenPages,simHubs,simIndexNow,simIndexing,simInternalLinks,simNoRivalNames,simPrerender,simPrerenderBoot,simRetiredRoutes,simSchema,simSitemap,simSnapshotAssets node scripts/runAllSims.mjs --browser 2>&1 | tee "$CDF_BROWSER_OUT/readers.log"
          test "$(grep -c '^All 15 harnesses green\.$' "$CDF_BROWSER_OUT/readers.log")" = 1
      - name: Actual saved-page fixture journeys and unchanged full budgets
        run: |
          node scripts/lib/hostLikeServer.mjs dist 4173 > "$CDF_BROWSER_OUT/server.log" 2>&1 &
          task_server_pid=$!
          trap 'kill "$task_server_pid" 2>/dev/null || true' EXIT
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ > /dev/null
          export BASE=http://127.0.0.1:4173 SWEEP_BASE=http://127.0.0.1:4173
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/playClubDetailFixtures.mjs 2>&1 | tee "$CDF_BROWSER_OUT/browser.log"
          SWEEP_OFFLINE=1 NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/sweepWeight.mjs 2>&1 | tee "$CDF_BROWSER_OUT/weight.log"
      - name: Exact source installed dependency and dist holds
        if: always()
        run: |
          sha256sum --check "$CDF_BROWSER_OUT/source-hashes.txt" > "$CDF_BROWSER_OUT/source-holds.log"
          sha256sum --check "$CDF_BROWSER_OUT/package-hashes.txt"
          sha256sum --check "$CDF_BROWSER_OUT/installed-files.sha256" > "$CDF_BROWSER_OUT/installed-holds.log"
          if test -f "$CDF_BROWSER_OUT/dist-hashes.txt"; then sha256sum --check "$CDF_BROWSER_OUT/dist-hashes.txt" > "$CDF_BROWSER_OUT/dist-holds.log"; fi
          git diff --exit-code -- src scripts ':!scripts/data/lastmod.json' package.json package-lock.json bun.lock .github/workflows
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const installed = JSON.parse(fs.readFileSync(process.env.CDF_BROWSER_OUT + '/installed.json'));
          for (const row of installed) assert.equal(JSON.parse(fs.readFileSync(row.path + '/package.json')).version, row.version, row.path);
          console.log(`Held ${installed.length} installed locked versions.`);
          NODE
      - name: Retain complete evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: club-fixtures-browser-${{ github.run_id }}
          path: club-fixtures-browser-artifacts/
          retention-days: 14
          if-no-files-found: error
