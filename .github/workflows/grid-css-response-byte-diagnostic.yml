# Synthetic HTML and held physical CSS only. No application/backend qualification.
name: WebKit persistent startup native encoding diagnostic
on:
  push:
    branches: [codex/soccer-grid-search-discovery]
    paths: [.github/workflows/grid-css-response-byte-diagnostic.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      CI: '1'
      TZ: UTC
      SIM_NETWORK: offline
      CSS_GZIP_SHA256: bba3c9fd2939c68e921a2eff4503bb899738a91024713560b99c50bf44cf03bc
      CSS_GZIP_BASE64: ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Hold exact source without build or app execution
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/grid-css-response-byte-diagnostic"; test ! -e "$out"; mkdir "$out"
          echo "CSS_DIAGNOSTIC_OUT=$out" >> "$GITHUB_ENV"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 3f0cd0e2ec33f9a3cd9746f91bcb1563684594cd HEAD
          git diff --exit-code 3f0cd0e2ec33f9a3cd9746f91bcb1563684594cd HEAD -- . ':!.github/workflows/grid-css-response-byte-diagnostic.yml' > "$out/source-boundary.log"
          test -f .github/workflows/grid-css-response-byte-diagnostic.yml
          cp .github/workflows/grid-css-response-byte-diagnostic.yml "$out/executed-workflow.yml"
          git rev-parse HEAD > "$out/head.txt"
          git archive --format=zip HEAD > "$out/source.zip"
          git ls-files -z | sort -z > "$out/source-members.before"
          git ls-files -z | sort -z | xargs -0 sha256sum > "$out/source-files.sha256"
          test "$(sha256sum scripts/lib/offlineTransport.cjs | cut -d' ' -f1)" = e60ff1534307e449ccef598e3b7470dcba58681b82cea4005cec7319f14f9221
          git diff --exit-code HEAD > "$out/source-diff.before"
          git status --porcelain=v1 --untracked-files=all > "$out/source-status.before"; test ! -s "$out/source-status.before"
      - name: Isolated pinned browser package and WebKit
        run: |
          set -euo pipefail
          out="$CSS_DIAGNOSTIC_OUT"; browser_tools="$RUNNER_TEMP/grid-css-diagnostic-tools"; test ! -e "$browser_tools"
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/grid-css-diagnostic-browsers"
          echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
          NODE_OPTIONS='' npm install --prefix "$browser_tools" --no-save --package-lock=false playwright@1.64.0 > "$out/browser-install.log" 2>&1
          mkdir -p node_modules; test ! -e node_modules/playwright; test ! -e node_modules/playwright-core
          ln -s "$browser_tools/node_modules/playwright" node_modules/playwright
          ln -s "$browser_tools/node_modules/playwright-core" node_modules/playwright-core
          NODE_OPTIONS='' node "$browser_tools/node_modules/playwright/cli.js" install --with-deps webkit > "$out/webkit-install.log" 2>&1
          find "$browser_tools/node_modules" -type f -print0 | sort -z | xargs -0 sha256sum > "$out/browser-tool-files.sha256"
          find "$browser_tools/node_modules" -type f -print0 | sort -z > "$out/browser-tool-members.before"
          find "$PLAYWRIGHT_BROWSERS_PATH" -type f -print0 | sort -z | xargs -0 sha256sum > "$out/browser-binary-files.sha256"
          find "$PLAYWRIGHT_BROWSERS_PATH" -type f -print0 | sort -z > "$out/browser-binary-members.before"
      - name: Twelve fresh persistent WebKit startup processes
        id: matrix
        timeout-minutes: 12
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          out="$CSS_DIAGNOSTIC_OUT"
          cat > "$out/matrix.mjs" <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import { createHash } from 'node:crypto';
          import { createRequire } from 'node:module';
          import { gunzipSync } from 'node:zlib';
          const ROOT = process.cwd(), OUT = process.env.CSS_DIAGNOSTIC_OUT;
          const require = createRequire(path.join(ROOT, 'package.json'));
          const hash = body => createHash('sha256').update(body).digest('hex');
          assert(require.cache[require.resolve('./scripts/lib/offlineTransport.cjs')], 'Ordinary offline preload is active');
          assert.equal(process.env.SIM_NETWORK, 'offline');
          const coreDir = path.dirname(require.resolve('playwright-core'));
          const packageVersion = JSON.parse(fs.readFileSync(path.join(coreDir, 'package.json'))).version;
          assert.equal(packageVersion, '1.64.0');
          assert.equal(JSON.parse(fs.readFileSync(path.join(path.dirname(require.resolve('playwright')), 'package.json'))).version, '1.64.0');
          const coreBody = fs.readFileSync(path.join(coreDir, 'lib/coreBundle.js'));
          assert.equal(hash(coreBody), '2325ca4c1c83070e89dc49fb82525508f0a68e0cf12e2a624277968da216b7e0');
          fs.writeFileSync(path.join(OUT, 'actual-playwright-coreBundle.js'), coreBody, { flag: 'wx' });
          const browsersBody = fs.readFileSync(path.join(coreDir, 'browsers.json'));
          assert.equal(hash(browsersBody), '2cfd419f71ac6475d81e1301fa86c34cf2a2a6bae2a0da4b5a2b18310216b6bf');
          const webkitEntries = JSON.parse(browsersBody).browsers.filter(entry => entry.name === 'webkit'); assert.equal(webkitEntries.length, 1);
          const webkitInstallation = { entry: webkitEntries[0], browsersJsonSha256: hash(browsersBody), binaryRoot: process.env.PLAYWRIGHT_BROWSERS_PATH };
          fs.writeFileSync(path.join(OUT, 'actual-browsers.json'), browsersBody, { flag: 'wx' });
          const packed = Buffer.from(process.env.CSS_GZIP_BASE64, 'base64');
          assert.equal(packed.length, 33244); assert.equal(hash(packed), process.env.CSS_GZIP_SHA256);
          const physical = gunzipSync(packed), physicalSha = '03900e064964ae11ca37142495837c28c7aa30b0538d8d3d6bd547698a4f0da0';
          assert.equal(physical.length, 200935); assert.equal(hash(physical), physicalSha);
          const cssText = new TextDecoder('utf-8', { fatal: true }).decode(physical);
          assert(Buffer.from(cssText, 'utf8').equals(physical), 'Held physical CSS retains strict UTF-8 input bytes');
          fs.writeFileSync(path.join(OUT, 'physical.css'), physical, { flag: 'wx' });
          const MIME = 'text/css; charset=utf-8', BASE = 'http://127.0.0.1:4199', HEAD_BASE = 'http://127.0.0.1:4198';
          assert(path.isAbsolute(OUT));
          assert(!fs.realpathSync(OUT).startsWith(fs.realpathSync(ROOT) + path.sep), 'Evidence and native profiles are outside the checkout');
          const configFile = path.join(OUT, 'native-utf8-settings.ini'), configBody = Buffer.from('[websettings]\ndefault-charset=UTF-8\n', 'utf8');
          fs.writeFileSync(configFile, configBody, { flag: 'wx' });
          const profileRoot = path.join(OUT, 'profiles'); fs.mkdirSync(profileRoot);
          const variants = [
            { name: 'native-default', nativeUtf8: false, metaUtf8: false, htmlStringBody: false, cssStringBody: false },
            { name: 'native-utf8', nativeUtf8: true, metaUtf8: false, htmlStringBody: false, cssStringBody: false },
          ];
          const report = { version: 2, status: 'incomplete', diagnosticOnly: true, productQualified: false,
            scope: 'Synthetic WebKit persistent startup native-default versus declared UTF8 settings, metadata-free HTML and exact held CSS Buffer, cross-origin headers-only HEAD and trusted input. No application, auth, backend, feature or release qualification.',
            head: fs.readFileSync(path.join(OUT, 'head.txt'), 'utf8').trim(), workflowRef: process.env.GITHUB_WORKFLOW_REF, workflowEventSha: process.env.GITHUB_SHA, packageVersion, coreSha256: hash(coreBody), webkitInstallation,
            startup: { onlyExistingBlankPage: true, localeOptionSupplied: false, configFile, configBytes: configBody.length, configSha256: hash(configBody), profileRoot, browserDebugScope: 'pw:browser', browserLogsFile: 'stderr.log' },
            physical: { member: 'assets/index-Jf4zrVqc.css', bytes: physical.length, sha256: physicalSha, gzipBytes: packed.length, gzipSha256: hash(packed), strictUtf8Roundtrip: true },
            variants, widths: [390, 1280], repeatsPerVariantPerWidth: 3, expectedContexts: 12, browserEngine: 'webkit', browserVersion: null, cases: [], waits: [], cleanupErrors: [], fatalErrors: [] };
          const save = () => fs.writeFileSync(path.join(OUT, 'report.json'), JSON.stringify(report, null, 2) + '\n'); save();
          process.on('unhandledRejection', error => { report.fatalErrors.push('unhandledRejection: ' + String(error?.stack ?? error)); save(); process.exitCode = 1; });
          process.on('uncaughtException', error => { report.fatalErrors.push('uncaughtException: ' + String(error?.stack ?? error)); save(); process.exit(1); });
          const bounded = async (promise, label, timeoutMs, waits) => {
            const wait = { label, timeoutMs, status: 'pending' }; waits.push(wait); save(); let timer;
            try { const result = await Promise.race([promise, new Promise((_, reject) => { timer = setTimeout(() => reject(new Error(label + ' exceeded ' + timeoutMs + 'ms')), timeoutMs); })]); wait.status = 'passed'; return result; }
            catch (error) { wait.status = 'failed'; wait.error = String(error?.stack ?? error); throw error; }
            finally { clearTimeout(timer); save(); }
          };
          const { webkit } = require('playwright');
          webkitInstallation.executablePath = fs.realpathSync(webkit.executablePath());
          assert(webkitInstallation.executablePath.startsWith(fs.realpathSync(webkitInstallation.binaryRoot) + path.sep), 'Default executable belongs to the isolated hashed browser root'); save();
          try {
            for (let repeat = 1; repeat <= 3; repeat++) for (const width of report.widths) for (const variant of variants) {
              const id = width + '-r' + repeat + '-' + variant.name, height = width === 390 ? 844 : 900;
              const row = { id, repeat, variant: variant.name, width, height, status: 'incomplete', errors: [], requests: [], fixtures: [], observers: [], waits: [], pendingBeforeCleanup: null, pendingAfterCleanup: null, pendingRoutesBeforeCleanup: null, pendingRoutesAfterCleanup: null };
              report.cases.push(row); save(); let context, browser, startupPage;
              let resolveContextClosed, resolveBrowserDisconnected;
              const contextClosed = new Promise(resolve => { resolveContextClosed = resolve; }), browserDisconnected = new Promise(resolve => { resolveBrowserDisconnected = resolve; });
              row.lifecycle = { contextCloseEvents: 0, browserDisconnectedEvents: 0, startupPageCloseEvents: 0, additionalPages: 0 };
              const observers = [], routes = [], active = new Set(), activeRoutes = new Set(), ids = new Map();
              const requestRow = request => { if (!ids.has(request)) { const value = { id: ids.size, method: request.method(), url: request.url(), resourceType: request.resourceType(), headers: request.headers(), finishedCount: 0, failures: [] }; ids.set(request, value); row.requests.push(value); save(); } return ids.get(request); };
              const cssUrl = BASE + '/physical.css?context=' + id, headUrl = HEAD_BASE + '/fictional-head-count?context=' + id;
