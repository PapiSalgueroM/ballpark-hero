                page.on('console', message => { if (message.type() === 'error') { row.errors.push('console.error: ' + message.text()); save(); } });
                await bounded(context.route('**/*', route => {
                  const request = route.request(), captured = requestRow(request), url = new URL(request.url());
                  activeRoutes.add(captured.id); save();
                  const task = (async () => {
