                    const fixture = { requestId: captured.id, kind: 'physical-css', status: 200, bodyType: variant.cssStringBody ? 'utf8-string' : 'Buffer', mimePlacement: 'headers', declaredContentType: MIME, bytes: physical.length, sha256: physicalSha, fulfilled: false }; row.fixtures.push(fixture); save();
                    const headers = { 'cache-control': 'no-store', 'content-length': String(physical.length), 'content-type': MIME };
                    const options = { status: 200, headers, body: variant.cssStringBody ? cssText : physical };
