              const htmlBytes = Buffer.from(html, 'utf8'); row.document = { bytes: htmlBytes.length, sha256: hash(htmlBytes), preloadLinks: 0, stylesheetLinks: 2, metaUtf8: variant.metaUtf8, bodyType: variant.htmlStringBody ? 'utf8-string' : 'Buffer' };
              fs.writeFileSync(path.join(OUT, id + '-document.html'), htmlBytes, { flag: 'wx' }); save();
              try {
                const userDataDir = path.join(profileRoot, id), args = variant.nativeUtf8 ? ['--config-file=' + configFile] : [];
                assert(!fs.existsSync(userDataDir), 'Each native profile is absent before its sole launch');
                const options = { headless: true, viewport: { width, height }, isMobile: width === 390, hasTouch: width === 390, args };
                row.launch = { userDataDir, absentBeforeLaunch: true, args, localeOptionSupplied: Object.hasOwn(options, 'locale'), ignoreDefaultArgsSupplied: Object.hasOwn(options, 'ignoreDefaultArgs'), headless: true }; save();
                assert.equal(row.launch.localeOptionSupplied, false); assert.equal(row.launch.ignoreDefaultArgsSupplied, false);
                assert.deepEqual(args, variant.nativeUtf8 ? ['--config-file=' + configFile] : []);
                assert(fs.readFileSync(configFile).equals(configBody), 'Exact settings input is held before every launch');
                context = await bounded(webkit.launchPersistentContext(userDataDir, options), 'webkit.launchPersistentContext', 30000, row.waits);
                context.once('close', () => { row.lifecycle.contextCloseEvents++; resolveContextClosed(); save(); });
                browser = context.browser(); assert(browser, 'Persistent launch exposes its actual browser');
                browser.once('disconnected', () => { row.lifecycle.browserDisconnectedEvents++; resolveBrowserDisconnected(); save(); });
                row.browserVersion = browser.version(); report.browserVersion ??= row.browserVersion; save();
                assert.equal(row.browserVersion, webkitInstallation.entry.browserVersion, 'Actual browser version equals the pinned installed WebKit metadata');
                row.launch.realUserDataDir = fs.realpathSync(userDataDir); assert.equal(row.launch.realUserDataDir, userDataDir);
                const initialPages = context.pages(); row.launch.initialPageCount = initialPages.length; save(); assert.equal(initialPages.length, 1);
                const page = initialPages[0]; startupPage = page; row.launch.initialUrl = page.url(); save(); assert.equal(page.url(), 'about:blank');
                page.once('close', () => { row.lifecycle.startupPageCloseEvents++; save(); });
                context.on('page', () => { row.lifecycle.additionalPages++; row.errors.push('Unexpected extra page in persistent context'); save(); });
                row.startupDocument = await bounded(page.evaluate(() => ({ url: location.href, characterSet: document.characterSet, language: navigator.language, languages: [...navigator.languages] })), 'original startup blank observation', 10000, row.waits); save();
                assert.equal(row.startupDocument.url, 'about:blank');
                page.on('request', requestRow);
                page.on('requestfinished', request => { requestRow(request).finishedCount++; if (request.method() === 'HEAD' && request.url() === headUrl) resolveHeadFinished(); save(); });
                page.on('requestfailed', request => { const error = request.failure()?.errorText ?? 'unknown request failure'; requestRow(request).failures.push(error); row.errors.push('requestfailed: ' + error); save(); });
                page.on('pageerror', error => { row.errors.push('pageerror: ' + String(error?.stack ?? error)); save(); });
