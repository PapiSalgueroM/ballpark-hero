                      const headers = { 'content-type': 'application/json', 'content-length': '0', 'content-range': '0-0/6', 'access-control-allow-origin': BASE, 'access-control-allow-headers': 'authorization, apikey, content-type, x-client-info', 'access-control-allow-methods': 'GET, HEAD, OPTIONS', 'access-control-expose-headers': 'content-range', 'cache-control': 'no-store' };
                      const fixture = { requestId: captured.id, kind: 'fictional-native-head-count', status: 200, headers, bytes: 0, sha256: hash(Buffer.alloc(0)), fulfilled: false }; row.fixtures.push(fixture); save();
                      await bounded(route.fulfill({ status: 200, headers, body: '' }), 'fixture.fulfill HEAD ' + captured.id, 15000, row.waits); fixture.fulfilled = true; save(); return;
                    }
                    assert.equal(url.origin, BASE); assert.equal(request.method(), 'GET');
                    if (url.pathname === '/' && url.search === '?context=' + id) {
                      const fixture = { requestId: captured.id, kind: 'synthetic-document', bodyType: variant.htmlStringBody ? 'utf8-string' : 'Buffer', metaUtf8: variant.metaUtf8, status: 200, declaredContentType: 'text/html; charset=utf-8', bytes: htmlBytes.length, sha256: hash(htmlBytes), fulfilled: false }; row.fixtures.push(fixture); save();
                      await bounded(route.fulfill({ status: 200, contentType: fixture.declaredContentType, headers: { 'cache-control': 'no-store', 'content-length': String(htmlBytes.length) }, body: variant.htmlStringBody ? html : htmlBytes }), 'fixture.fulfill request ' + captured.id, 15000, row.waits); fixture.fulfilled = true; save(); return;
                    }
