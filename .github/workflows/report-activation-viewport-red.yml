      - name: Locked isolated Playwright and cached fonts
        id: install
        timeout-minutes: 12
        run: |
          set -euo pipefail
          out="$CHROME_BROWSER_OUT"
          printf '%s npm-ci\n' "$(date -u +%FT%TZ)" > "$out/setup-progress.log"
          npm ci > "$out/install.log" 2>&1
          browser_tools="$RUNNER_TEMP/site-menu-shared-browser-tools";test ! -e "$browser_tools"
          printf '%s playwright\n' "$(date -u +%FT%TZ)" >> "$out/setup-progress.log"
          npm install --prefix "$browser_tools" --no-save --package-lock=false playwright@1.64.0 > "$out/browser-install.log" 2>&1
          test ! -e node_modules/playwright;test ! -e node_modules/playwright-core
          ln -s "$browser_tools/node_modules/playwright" node_modules/playwright
          ln -s "$browser_tools/node_modules/playwright-core" node_modules/playwright-core
          for link in playwright playwright-core;do readlink -f "node_modules/$link";done > "$out/browser-links.before"
          node "$browser_tools/node_modules/playwright/cli.js" install --with-deps chromium > "$out/chromium-install.log" 2>&1
          python -m pip install fonttools pillow > "$out/python-install.log" 2>&1
          FREE_KICK_FONT_CACHE="$out/font-cache" node scripts/qa/freeKickLab1070.mjs --prefetch-fonts-only > "$out/font-prefetch.log" 2>&1
          manifest_sha=$(sha256sum "$out/font-cache/manifest.json" | cut -d ' ' -f 1)
          echo "FONT_CACHE_MANIFEST_SHA256=$manifest_sha" >> "$GITHUB_ENV"
          find node_modules -path node_modules/.vite -prune -o -type f -print0 | sort -z | xargs -0 sha256sum > "$out/dependencies.sha256"
          find node_modules -path node_modules/.vite -prune -o -type f -print0 | sort -z > "$out/dependency-members.before"
          find "$browser_tools/node_modules" -type f -print0 | sort -z | xargs -0 sha256sum > "$out/browser-tools.sha256"
          find "$browser_tools/node_modules" -type f -print0 | sort -z > "$out/browser-members.before"
          find "$out/font-cache" -type f -print0 | sort -z | xargs -0 sha256sum > "$out/font-cache.sha256"
          find "$out/font-cache" -type f -print0 | sort -z > "$out/font-members.before"
          : > "$out/holds.transport"
          printf '%s ready\n' "$(date -u +%FT%TZ)" >> "$out/setup-progress.log"
      - name: Actual prepared tool and font manifest check under original guard
        id: tools
        timeout-minutes: 2
        run: |
          set -euo pipefail
          out="$VIEWPORT_RED_OUT"
          sha256sum -c "$out/inspector.sha256" > "$out/inspector-after-install.log"
          status=0
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$out/holds.transport" node <<'NODE' > "$out/tools-check.log" 2>&1 || status=$?
          const fs=require('node:fs'),a=require('node:assert/strict'),{createHash}=require('node:crypto');
          a.equal(JSON.parse(fs.readFileSync('node_modules/playwright-core/package.json','utf8')).version,'1.64.0');
          const manifest=fs.readFileSync(process.env.FREE_KICK_FONT_CACHE+'/manifest.json');a.equal(createHash('sha256').update(manifest).digest('hex'),process.env.FONT_CACHE_MANIFEST_SHA256);
          NODE
          printf '%s\n' "$status" > "$out/tools-check.exit";test "$status" -eq 0
          test -f "$out/holds.transport" && test ! -L "$out/holds.transport" && test ! -s "$out/holds.transport"
      - name: Actual app types before any owned RED credit
        id: types
        timeout-minutes: 6
        run: |
          set -euo pipefail
          out="$VIEWPORT_RED_OUT"
          set -o noclobber;: > "$out/types.transport";set +o noclobber
          set +e
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$out/types.transport" timeout --signal=TERM --kill-after=15s 5m node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee "$out/types.log"
          statuses=("${PIPESTATUS[@]}")
          set -e
          printf '%s\n' "${statuses[0]}" > "$out/types.exit";printf '%s\n' "${statuses[1]}" > "$out/types.tee.exit"
          test "${#statuses[@]}" -eq 2;test "${statuses[0]}" -eq 0;test "${statuses[1]}" -eq 0
          test -f "$out/types.transport" && test ! -L "$out/types.transport" && test ! -s "$out/types.transport"
      - name: One completed production build before every browser and reader
        id: build
        timeout-minutes: 15
        run: |
          set -euo pipefail
          out="$CHROME_BROWSER_OUT"
          : > "$out/build.transport";status=0
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$out/build.transport" npm run build > "$out/build.log" 2>&1 || status=$?
          printf '%s\n' "$status" > "$out/build.exit";test "$status" -eq 0;test ! -s "$out/build.transport"
          find dist ! -type d ! -type f -print > "$out/dist-nonregular.before";test ! -s "$out/dist-nonregular.before"
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > "$out/dist.sha256"
          find dist -type f -print0 | sort -z > "$out/dist-members.before"
          tar -cf "$out/dist.tar" -C dist .
      - name: Frozen copied activation driver, expected native viewport refusal
        id: activation
        if: ${{ !cancelled() && steps.tools.outcome == 'success' && steps.types.outcome == 'success' && steps.build.outcome == 'success' }}
        timeout-minutes: 13
        run: |
          set -euo pipefail
          out="$VIEWPORT_RED_OUT"
          sha256sum -c "$out/inspector.sha256" > "$out/inspector-before-activation.log"
          set -o noclobber;: > "$out/server.transport";: > "$out/activation.transport";set +o noclobber
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$out/server.transport" node scripts/lib/hostLikeServer.mjs dist 4173 > "$out/server.log" 2>&1 &
          server=$!
          printf '%s\n' "$server" > "$out/server.pid"
          trap 'kill "$server" 2>/dev/null || true;wait "$server" 2>/dev/null || true' EXIT
          kill -0 "$server"
          set +e
          CI=true NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs --require=$PWD/scripts/qa/sharedChromePreload.cjs" REPORT_FORM_OUT="$out/activation" CHROME_RECIPE_OUT="$out/activation" REPORT_FORM_SITE_DIST="$PWD/dist" REPORT_FORM_BINDING_FILE="$out/driver.binding.json" SIM_OFFLINE_RECEIPT="$out/activation.transport" timeout --signal=TERM --kill-after=15s 12m node scripts/qa/playReportSiteIssueActivationViewport.mjs 2>&1 | tee "$out/activation.log"
          statuses=("${PIPESTATUS[@]}")
          set -e
          printf '%s\n' "${statuses[0]}" > "$out/activation.exit";printf '%s\n' "${statuses[1]}" > "$out/activation.tee.exit"
          test "${#statuses[@]}" -eq 2
          kill -0 "$server"
          kill "$server"
          server_status=0;wait "$server" || server_status=$?
          printf '%s\n' "$server_status" > "$out/server.exit"
          test "$server_status" -eq 0 || test "$server_status" -eq 143
          trap - EXIT
          test "${statuses[0]}" -eq 1;test "${statuses[1]}" -eq 0
          for name in server activation;do test -f "$out/$name.transport" && test ! -L "$out/$name.transport" && test ! -s "$out/$name.transport";done
      - name: Strict actual initial-viewport RED admission, no setup or lookup credit
        id: classifier
        if: ${{ !cancelled() && steps.tools.outcome == 'success' && steps.types.outcome == 'success' && steps.build.outcome == 'success' && steps.activation.outcome == 'success' }}
        timeout-minutes: 2
        run: |
          set -euo pipefail
          out="$VIEWPORT_RED_OUT"
          sha256sum -c "$out/inspector.sha256" > "$out/inspector-before-classifier.log"
          test "$(cat "$out/tools-check.exit")" = 0
          set -o noclobber;: > "$out/classifier.transport";set +o noclobber
          status=0
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$out/classifier.transport" timeout --signal=TERM --kill-after=15s 90s node "$out/viewport-red-inspector.cjs" red > "$out/classifier.stdout.log" 2> "$out/classifier.stderr.log" || status=$?
          printf '%s\n' "$status" > "$out/classifier.exit";test "$status" -eq 0
          test -f "$out/classifier.transport" && test ! -L "$out/classifier.transport" && test ! -s "$out/classifier.transport"
      - name: Always require complete source, dependency, tool, font and dist end holds
        id: final
        if: ${{ always() }}
        timeout-minutes: 3
        run: |
          set -uo pipefail
          out="$VIEWPORT_RED_OUT";failed=0
          sha256sum -c "$out/source-before.sha256" > "$out/final-source-hold.log" 2>&1 || failed=1
          git ls-files -z | sort -z > "$out/source-members.after" || failed=1
          cmp "$out/source-members.before" "$out/source-members.after" > "$out/final-source-members.log" 2>&1 || failed=1
          xargs -0 sha256sum < "$out/source-members.after" > "$out/source-after.sha256" || failed=1
          cmp "$out/source-before.sha256" "$out/source-after.sha256" > "$out/final-source-sha.log" 2>&1 || failed=1
          for family in dependencies browser-tools font-cache dist;do
            sha256sum -c "$out/$family.sha256" > "$out/final-$family-hold.log" 2>&1 || failed=1
          done
          find node_modules -path node_modules/.vite -prune -o -type f -print0 | sort -z > "$out/dependency-members.after"
          cmp "$out/dependency-members.before" "$out/dependency-members.after" > "$out/final-dependency-members.log" 2>&1 || failed=1
          xargs -0 sha256sum < "$out/dependency-members.after" > "$out/dependencies.after.sha256"
          cmp "$out/dependencies.sha256" "$out/dependencies.after.sha256" > "$out/final-dependency-sha.log" 2>&1 || failed=1
          browser_tools="$RUNNER_TEMP/site-menu-shared-browser-tools"
          find "$browser_tools/node_modules" -type f -print0 | sort -z > "$out/browser-members.after"
          cmp "$out/browser-members.before" "$out/browser-members.after" > "$out/final-browser-members.log" 2>&1 || failed=1
          xargs -0 sha256sum < "$out/browser-members.after" > "$out/browser-tools.after.sha256"
          cmp "$out/browser-tools.sha256" "$out/browser-tools.after.sha256" > "$out/final-browser-sha.log" 2>&1 || failed=1
          for link in playwright playwright-core;do readlink -f "node_modules/$link";done > "$out/browser-links.after"
          cmp "$out/browser-links.before" "$out/browser-links.after" > "$out/final-browser-links.log" 2>&1 || failed=1
          find "$out/font-cache" -type f -print0 | sort -z > "$out/font-members.after"
          cmp "$out/font-members.before" "$out/font-members.after" > "$out/final-font-members.log" 2>&1 || failed=1
          xargs -0 sha256sum < "$out/font-members.after" > "$out/font-cache.after.sha256"
          cmp "$out/font-cache.sha256" "$out/font-cache.after.sha256" > "$out/final-font-sha.log" 2>&1 || failed=1
          find dist ! -type d ! -type f -print > "$out/dist-nonregular.after";test ! -s "$out/dist-nonregular.after" || failed=1
          find dist -type f -print0 | sort -z > "$out/dist-members.after"
          cmp "$out/dist-members.before" "$out/dist-members.after" > "$out/final-dist-members.log" 2>&1 || failed=1
          xargs -0 sha256sum < "$out/dist-members.after" > "$out/dist.after.sha256"
          cmp "$out/dist.sha256" "$out/dist.after.sha256" > "$out/final-dist-sha.log" 2>&1 || failed=1
          git rev-parse HEAD > "$out/head.after"
          cmp "$out/head.txt" "$out/head.after" > "$out/final-head.log" 2>&1 || failed=1
          git diff --exit-code HEAD > "$out/final-source-diff.log" 2>&1 || failed=1
          git status --porcelain --untracked-files=all > "$out/final-status.txt";test ! -s "$out/final-status.txt" || failed=1
          sha256sum -c "$out/inspector.sha256" > "$out/final-inspector-before.log" 2>&1 || failed=1
          set -o noclobber;: > "$out/final.transport";set +o noclobber
          final_status=0
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$out/final.transport" node "$out/viewport-red-inspector.cjs" final > "$out/final-binding.stdout.log" 2> "$out/final-binding.stderr.log" || final_status=$?
          printf '%s\n' "$final_status" > "$out/final.exit";test "$final_status" -eq 0 || failed=1
          sha256sum -c "$out/inspector.sha256" > "$out/final-inspector-after.log" 2>&1 || failed=1
          for name in source holds types build server activation classifier final;do test -f "$out/$name.transport" && test ! -L "$out/$name.transport" && test ! -s "$out/$name.transport" || failed=1;done
          for name in source tools-check types types.tee build activation.tee classifier final;do test -f "$out/$name.exit" && test "$(cat "$out/$name.exit")" = 0 || failed=1;done
          test -f "$out/activation.exit" && test "$(cat "$out/activation.exit")" = 1 || failed=1
          while IFS= read -r -d '' file;do test ! -s "$file" || failed=1;done < <(find "$out" -type f -name '*.transport' -print0)
          printf '%s\n' "$failed" > "$out/final-holds.exit";test "$failed" -eq 0
      - name: Always retain original raw failure, partial pixels and honest scope
        if: ${{ always() }}
        run: |
          set -euo pipefail
          out="$VIEWPORT_RED_OUT"
          printf 'phase=owned-initial-report-viewport-red\nsource=%s\nparent=%s\nsourceGate=%s\ntypes=%s\nbuild=%s\ndriverExpectedNative1=%s\nredClassifier=%s\nfinalHolds=%s\nplannedContexts=8\nplannedPNGs=40\nactualPNGs=READ_ORIGINAL_RECORDS\nold14Controls=UNRUN_ONLY_IF_STRICT_RED_ADMITTED_READ_RAW\npostFixViewport6Controls=UNRUN_ONLY_IF_STRICT_RED_ADMITTED_READ_RAW\nnormalSuiteCredit=0\ncapQualified=false\nfullSuiteQualified=false\nproductFixed=false\nlivePublished=false\n' "$GITHUB_SHA" "$EXPECTED_PARENT" '${{ steps.source.outcome }}' '${{ steps.types.outcome }}' '${{ steps.build.outcome }}' '${{ steps.activation.outcome }}' '${{ steps.classifier.outcome }}' '${{ steps.final.outcome }}' > "$out/stages.txt"
          find "$out" ! -type d ! -type f -print > "$out/evidence-nonregular.txt";test ! -s "$out/evidence-nonregular.txt"
          (cd "$out" && find . -type f ! -name evidence.sha256 -print0 | sort -z | xargs -0 sha256sum > evidence.sha256)
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: report-activation-viewport-red-${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ env.VIEWPORT_RED_OUT }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
