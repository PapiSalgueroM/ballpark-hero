name: Report initial failure viewport owned RED
on:
  push:
    branches: [codex/report-activation-viewport-red-20261024]
    paths-ignore: ['docs/**']
permissions:
  contents: read
concurrency:
  group: report-activation-viewport-red-${{ github.sha }}
  cancel-in-progress: false
env:
  EXPECTED_PARENT: 056aa894a222e7593ebb7a5369c95b51f71021ce
  CI: '1'
  SIM_NETWORK: offline
  TZ: UTC
jobs:
  viewport_red:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        shell: bash
    steps:
      - name: Fresh outside-checkout original evidence
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/report-activation-viewport-red";test ! -e "$base";mkdir -m 700 "$base"
          out="$base/evidence";mkdir -m 700 "$out"
          echo "VIEWPORT_RED_OUT=$out" >> "$GITHUB_ENV"
          echo "CHROME_BROWSER_OUT=$out" >> "$GITHUB_ENV"
          echo "FREE_KICK_FONT_CACHE=$out/font-cache" >> "$GITHUB_ENV"
          printf '%s\n' "$GITHUB_SHA" > "$out/head.txt"
          printf '%s\n' "$GITHUB_RUN_ID" > "$out/run-id.txt"
          printf '%s\n' "$GITHUB_RUN_ATTEMPT" > "$out/run-attempt.txt"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - name: Exact two added QA paths with all parent product source held
        id: source
        timeout-minutes: 3
        run: |
          set -euo pipefail
          out="$VIEWPORT_RED_OUT"
          test "$GITHUB_REPOSITORY" = PapiSalgueroM/ballpark-hero
          test "$GITHUB_REPOSITORY_ID" = 1195729679
          test "$GITHUB_REF" = refs/heads/codex/report-activation-viewport-red-20261024
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git show -s --format=%P HEAD)" = "$EXPECTED_PARENT"
          test "$(git rev-parse "$EXPECTED_PARENT^{tree}")" = fecdb05e03f10aebd546c3067f1d4d9154753f40
          git diff --name-status "$EXPECTED_PARENT" HEAD > "$out/direct-paths.txt"
          printf 'A\t.github/workflows/report-activation-viewport-red.yml\nA\tscripts/qa/playReportSiteIssueActivationViewport.mjs\n' | cmp - "$out/direct-paths.txt"
          git diff --exit-code "$EXPECTED_PARENT" HEAD -- . ':!.github/workflows/report-activation-viewport-red.yml' ':!scripts/qa/playReportSiteIssueActivationViewport.mjs' > "$out/all-parent-source-held.log"
          for file in .github/workflows/report-activation-viewport-red.yml scripts/qa/playReportSiteIssueActivationViewport.mjs;do
            if git cat-file -e "$EXPECTED_PARENT:$file" 2> "$out/absence-$(basename "$file").log";then exit 1;fi
          done
          git rev-parse HEAD^{tree} > "$out/tree.txt"
          git ls-files -z | sort -z > "$out/source-members.before"
          test "$(tr -cd '\000' < "$out/source-members.before" | wc -c)" -eq 5343
          xargs -0 sha256sum < "$out/source-members.before" > "$out/source-before.sha256"
          git status --porcelain --untracked-files=all > "$out/status-before.txt";test ! -s "$out/status-before.txt"
          for name in NODE_OPTIONS NO_DOUBLE_SWAP US_BOARD_CONTROL_ALIAS US_BOARD_CONTROL_FILE TYCOON_AWAY_CONTROL COMPLETION_HOOK OWNED_TIMEOUTS_HOOK CONQUEST_NBA_HOOK CONQUEST_NBA_BOARD POLL_FIXTURES DAILY_RECORD_CONTROL TYCOON_ROOMS_PAGE TYCOON_LOADS_STADIUM_HOOK TYCOON_LOADS_ACADEMY_HOOK TYCOON_LOADS_STADIUM_LIB TYCOON_LOADS_ACADEMY_LIB TYCOON_PITCH_COMPONENT TYCOON_PACKS_REWARDS TYCOON_PACKS_PANEL SIM_REPORT_CONTROL REPORT_RELAY_CONTROL REPORT_DRAFT_MODE REPORT_DRAFT_OUT REPORT_FORM_OUT REPORT_FORM_BINDING_FILE CHROME_RECIPE_OUT ONLY BROWSER;do
            if printenv "$name" >/dev/null;then printf '%s\n' "Inherited application override refused: $name" >&2;exit 1;fi
          done
