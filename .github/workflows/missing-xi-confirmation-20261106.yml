          const out='missing-xi-confirmation-controls',ref=out+'/fixed-reference',e=process.env,read=file=>JSON.parse(fs.readFileSync(ref+'/'+file)),run=read('run.json'),jobs=read('jobs.json'),meta=read('artifact.json');
          assert.equal(run.id,Number(e.MISSING_XI_FIXED_RUN));assert.equal(run.status,'completed');assert.equal(run.conclusion,'success');assert.equal(run.event,'push');assert.equal(run.path,'.github/workflows/missing-xi-confirmation-20261106.yml');assert.equal(run.head_sha,e.MISSING_XI_FIXED_HEAD);assert.equal(run.head_commit.tree_id,e.MISSING_XI_FIXED_TREE);assert.equal(run.repository.full_name,'PapiSalgueroM/ballpark-hero');
