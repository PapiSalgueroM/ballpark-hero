name: Soccer Missing XI confirmation active source preflight
on:
  push:
    branches: [codex/soccer-missing-xi-confirmation-preflight-qa-20261106]
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      SIM_NETWORK: offline
      SIM_OFFLINE_RECEIPT: missing-xi-confirmation-active-preflight/offline.log
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - name: Exact PR525 product source and physical before receipts
        run: |
          set -euo pipefail
          test ! -e missing-xi-confirmation-active-preflight
          mkdir missing-xi-confirmation-active-preflight
          touch missing-xi-confirmation-active-preflight/offline.log
          git rev-parse HEAD > missing-xi-confirmation-active-preflight/head.txt
          git rev-parse 'HEAD^{tree}' > missing-xi-confirmation-active-preflight/tree.txt
          git ls-files -s > missing-xi-confirmation-active-preflight/source-before.txt
          sha256sum package.json package-lock.json > missing-xi-confirmation-active-preflight/locks-before.txt
          git diff --exit-code HEAD -- .
          git fetch --no-tags --depth=1 origin a7af7ecd4a7c2ce2df95ce33cc3d03537dcdc836
          test "$(git rev-parse 'a7af7ecd4a7c2ce2df95ce33cc3d03537dcdc836^{tree}')" = fee34832cb8924251f217ed8f77cf225ec5fdc68
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';import {execFileSync} from 'node:child_process';import {createHash} from 'node:crypto';
          const out='missing-xi-confirmation-active-preflight',base='a7af7ecd4a7c2ce2df95ce33cc3d03537dcdc836',workflow='.github/workflows/missing-xi-confirmation-20261106.yml',at=(ref,file)=>execFileSync('git',['rev-parse',ref+':'+file],{encoding:'utf8'}).trim(),sha=bytes=>createHash('sha256').update(bytes).digest('hex');
          const pins={'src/App.tsx':'8bfedf7aaa1d076e0f0c8e2216c7e46632cd8a33','src/data/gameRegistry.ts':'f560b40a74d1468ac72dfde4ee6fec6635a9a255','public/missing-xi/index.html':'e7fe5d02933d73db401c4badb130eb2bb76ed0c3','src/pages/MissingXi.tsx':'8734de7d4ab5b6848538cc079804f10f038b39e1','src/lib/missingXi.ts':'41d645db94fee5dd2fe22d19c353c9b8d2ca739a','src/hooks/useDailyPuzzle.ts':'b8a0d6ba268efe0e728c4ee96fbc6c60fcc73846','src/hooks/useGameCompletion.ts':'b104822551fd5d9b1c5d6ddb14f01c79e5a662b2','src/components/game/GiveUpButton.tsx':'2462260a7b5f1d5d3b70915df2428d5d4397b0a0','package.json':'2ff64986fb76ebc51b706f2fd24765768874008a','package-lock.json':'97d6f12a052f25f400462938c241789a083f0bfe','index.html':'12598fe720eec4fc88d3d33c53ede612d018150c','vite.config.ts':'0112b6ac4f2ad80b2fc04f9ec2f7185300913e7d','tailwind.config.ts':'f83c4f4032d359bc9285828eac3b0961a46c6b17','postcss.config.js':'2aa7205d4b402a1bdfbe07110c61df920b370066','tsconfig.json':'6b68d80b7d92d0c4a5d774897f2bedfa95b42669','tsconfig.app.json':'51f581dd91641b4c1f1219f646788e73cf6bf00c','tsconfig.node.json':'3133162c20350e1741b94b8d2ff77b811bec8363','bun.lockb':'5d9d33a3bf4f45fa099e2aa3014149e034981149','bun.lock':'dff081dcd34a1aa928ddc90d910774a6b855dfe3'};
          const configs=["index.html","package.json","package-lock.json","vite.config.ts","tailwind.config.ts","postcss.config.js","tsconfig.json","tsconfig.app.json","tsconfig.node.json","bun.lockb","bun.lock"];assert.equal(configs.length,11);
          for(const[file,want]of Object.entries(pins)){assert.equal(at('HEAD',file),want,file+' current index');assert.equal(at(base,file),want,file+' PR525 base');const bytes=fs.readFileSync(file);assert.equal(createHash('sha1').update(Buffer.concat([Buffer.from('blob '+bytes.length+'\0'),bytes])).digest('hex'),want,file+' actual physical body');}assert.equal(fs.statSync('public/missing-xi/index.html').size,21382,'Actual UTF-8 snapshot byte count');
          const tree=ref=>execFileSync('git',['ls-tree','-r','-z',ref],{encoding:'utf8',maxBuffer:16*1024*1024}).split('\0').filter(Boolean),held=rows=>rows.filter(row=>row.split('\t')[1]!==workflow),head=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();assert.deepEqual(held(tree('HEAD')),held(tree(base)),'Every tracked product path, mode and blob equals completed clean PR525');assert.equal(tree(base).length,5779,'All actual PR525 base tracked paths');assert.equal(held(tree('HEAD')).length,5779,'Every base path held');assert.equal(tree('HEAD').filter(row=>/^(?:src|public|scripts)\//.test(row.split('\t')[1])).length,4658,'All base scoped source paths held');assert.deepEqual(execFileSync('git',['diff','--name-only',base,'HEAD'],{encoding:'utf8'}).trim().split('\n'),[workflow],'Only owned standalone QA workflow differs from PR525');
          fs.writeFileSync(out+'/source-join.json',JSON.stringify({status:'passed',base,baseTree:'fee34832cb8924251f217ed8f77cf225ec5fdc68',head,heldRows:held(tree('HEAD')).length,baseTrackedRows:5779,trackedRows:5780,baseScopedRows:4658,scopedSourceRows:4658,rootConfigurations:configs.map(file=>({file,blob:pins[file]})),onlyOwnedLeaf:workflow,workflowBlob:at('HEAD',workflow),pins,snapshotBytes:21382,limits:'Preflight-only QA workflow on exact PR525 product source. No new test, App fix, plan or product data change.'},null,2));
          const files=execFileSync('git',['ls-files','-z'],{encoding:'utf8'}).split('\0').filter(Boolean),physical=files.map(file=>{const bytes=fs.readFileSync(file);return{file,bytes:bytes.length,sha256:sha(bytes)};});assert.equal(files.length,5780,'Exact base plus one standalone QA workflow');assert.equal(physical.filter(row=>/^(?:src|public|scripts)\//.test(row.file)).length,4658);fs.writeFileSync(out+'/tracked-before.json',JSON.stringify(physical));assert.equal(fs.statSync(out+'/offline.log').size,0);
          NODE
      - name: Locked dependency install and all521 installed versions
        run: |
          set -euo pipefail
          npm ci 2>&1 | tee missing-xi-confirmation-active-preflight/install.log
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';const lock=JSON.parse(fs.readFileSync('package-lock.json')),rows=Object.keys(lock.packages).filter(p=>p.startsWith('node_modules/')&&fs.existsSync(p+'/package.json')).map(p=>[p,JSON.parse(fs.readFileSync(p+'/package.json')).version]);assert.equal(rows.length,521);for(const[p,v]of rows)assert.equal(v,lock.packages[p].version,p);fs.writeFileSync('missing-xi-confirmation-active-preflight/installed-before.json',JSON.stringify(rows));assert.equal(fs.statSync('missing-xi-confirmation-active-preflight/offline.log').size,0);
