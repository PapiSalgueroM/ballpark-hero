          assert.equal(configs.length,11);for(const file of configs)assert.equal(at('HEAD',file),at(base,file));
          fs.writeFileSync(out+'/source-join.json',JSON.stringify({status:'passed',fixedHead:base,fixedTree:process.env.MISSING_XI_FIXED_TREE,head:git(['rev-parse','HEAD']).trim(),tree:git(['rev-parse','HEAD^{tree}']).trim(),fixedRows:5782,trackedRows:5782,heldRows:5781,scopedSourceRows:4659,rootConfigurations:configs,ownedLeaves:[...owned],workflowBlob:at('HEAD',workflow),untrackedRunnerBlob:process.env.MISSING_XI_CONTROLLER_BLOB,pins,limits:'Controls QA only. Every product source and frozen plan held to completed fixed. Only the QA workflow differs. The embedded runner is emitted untracked. Original arm changes only the physical Page and restores it in finally.'},null,2));
