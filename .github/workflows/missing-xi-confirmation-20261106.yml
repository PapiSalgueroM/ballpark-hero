          const git=args=>execFileSync('git',args,{encoding:'utf8',maxBuffer:128*1024*1024}),at=(ref,file)=>git(['rev-parse',ref+':'+file]).trim(),sha=b=>createHash('sha256').update(b).digest('hex'),blob=b=>createHash('sha1').update(Buffer.from('blob '+b.length+'\0')).update(b).digest('hex');
