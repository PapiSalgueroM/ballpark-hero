        if: always()
        run: |
          set -euo pipefail
          git ls-files -s > missing-xi-confirmation-active-preflight/source-after.txt
          cmp missing-xi-confirmation-active-preflight/source-before.txt missing-xi-confirmation-active-preflight/source-after.txt
          git diff --exit-code HEAD -- .
