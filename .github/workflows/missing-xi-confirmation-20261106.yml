          git fetch --no-tags --depth=1 origin a7af7ecd4a7c2ce2df95ce33cc3d03537dcdc836
          test "$(git rev-parse "$MISSING_XI_FIXED_HEAD^{tree}")" = "$MISSING_XI_FIXED_TREE"
          test "$(git rev-parse 'a7af7ecd4a7c2ce2df95ce33cc3d03537dcdc836^{tree}')" = fee34832cb8924251f217ed8f77cf225ec5fdc68
          node --input-type=module <<'NODE'
