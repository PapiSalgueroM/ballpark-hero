          for(const[file,want]of Object.entries(pins)){assert.equal(at('HEAD',file),want,file+' exact current index');assert.equal(at(base,file),want,file+' exact qualified fixed');assert.equal(blob(fs.readFileSync(file)),want,file+' exact physical body');}
          assert.equal(at('a7af7ecd4a7c2ce2df95ce33cc3d03537dcdc836',page),'8734de7d4ab5b6848538cc079804f10f038b39e1');assert.equal(fs.statSync('public/missing-xi/index.html').size,21382);
          const tree=ref=>git(['ls-tree','-r','-z',ref]).split('\0').filter(Boolean),held=rows=>rows.filter(row=>!owned.has(row.split('\t')[1]));
          assert.equal(tree(base).length,5782);assert.equal(tree('HEAD').length,5782);assert.equal(held(tree('HEAD')).length,5781);assert.deepEqual(held(tree('HEAD')),held(tree(base)),'All other5781 actual path/mode/blob rows held from completed fixed');
          assert.deepEqual(git(['diff','--name-only',base,'HEAD','--','.']).trim().split('\n').sort(),[...owned].sort());
          const files=git(['ls-files','-z']).split('\0').filter(Boolean);assert.equal(files.length,5782);assert.equal(files.filter(file=>/^(?:src|public|scripts)\//.test(file)).length,4659);
          for(const file of['scripts/qa/checkMissingXiConfirmationOwnership.mjs','scripts/qa/playMissingXiConfirmationOwnership.mjs','scripts/qa/admitMissingXiConfirmationOwnership.mjs'])assert(!files.includes(file));
