name: Retired Manager Continue original baseline

on:
  push:
    branches: [codex/retired-manager-continue]

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      CI: '1'
      SIM_NETWORK: offline
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Allocate retained evidence
        run: |
          echo "RETIRED_MANAGER_CONTINUE_OUT=$RUNNER_TEMP/retired-manager-continue" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/retired-manager-continue"
      - name: Exact original source and locked installed versions
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$RETIRED_MANAGER_CONTINUE_OUT/head.txt"
          git archive --format=zip HEAD > "$RETIRED_MANAGER_CONTINUE_OUT/source.zip"
          git status --porcelain --untracked-files=no > "$RETIRED_MANAGER_CONTINUE_OUT/source-before.txt"
          test ! -s "$RETIRED_MANAGER_CONTINUE_OUT/source-before.txt"
          git diff --exit-code d8aaa4cb654e1b59f783625e63b73ce85adf2681 HEAD -- src scripts public package.json package-lock.json bun.lock bun.lockb ':!src/test/retiredManagerContinue.test.tsx' ':!scripts/qa/proveRetiredManagerContinueBaseline.mjs'
          git ls-files -z | sort -z | xargs -0 sha256sum > "$RETIRED_MANAGER_CONTINUE_OUT/source-files.sha256"
          npm ci > "$RETIRED_MANAGER_CONTINUE_OUT/install.log" 2>&1
          cat "$RETIRED_MANAGER_CONTINUE_OUT/install.log"
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node --input-type=module <<'NODE'
          import fs from 'node:fs'; import assert from 'node:assert/strict';
          const lock = JSON.parse(fs.readFileSync('package-lock.json'));
          const installed = Object.entries(lock.packages).filter(([p]) => p.startsWith('node_modules/') && fs.existsSync(p + '/package.json')).map(([p, entry]) => {
            const version = JSON.parse(fs.readFileSync(p + '/package.json')).version;
            assert.equal(version, entry.version, p); return { path: p, version };
          });
          assert.equal(installed.length, 521);
          fs.writeFileSync(process.env.RETIRED_MANAGER_CONTINUE_OUT + '/installed-versions.json', JSON.stringify(installed, null, 2) + '\n');
          fs.writeFileSync(process.env.RETIRED_MANAGER_CONTINUE_OUT + '/node-versions.json', JSON.stringify(process.versions, null, 2) + '\n');
          console.log('Bound all521 installed locked package manifests.');
          NODE
          find node_modules -type f -print0 | sort -z | xargs -0 sha256sum > "$RETIRED_MANAGER_CONTINUE_OUT/installed-files.sha256"
      - name: Actual app types and new proof syntax
        run: |
          set -euo pipefail
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee "$RETIRED_MANAGER_CONTINUE_OUT/types.log"
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node --check scripts/qa/proveRetiredManagerContinueBaseline.mjs
      - name: Exact original metadata faults and unchanged home front
        run: |
          set -euo pipefail
          SIM_OFFLINE_RECEIPT="$RETIRED_MANAGER_CONTINUE_OUT/method.transport" NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/qa/proveRetiredManagerContinueBaseline.mjs 2>&1 | tee "$RETIRED_MANAGER_CONTINUE_OUT/baseline.log"
      - name: Complete source and installed bytes held
        if: always()
        run: |
          set -euo pipefail
          sha256sum --check "$RETIRED_MANAGER_CONTINUE_OUT/source-files.sha256" > "$RETIRED_MANAGER_CONTINUE_OUT/source-holds.log" 2>&1
          sha256sum --check "$RETIRED_MANAGER_CONTINUE_OUT/installed-files.sha256" > "$RETIRED_MANAGER_CONTINUE_OUT/installed-holds.log" 2>&1
          test ! -s "$RETIRED_MANAGER_CONTINUE_OUT/method.transport"
          if test -d "$RETIRED_MANAGER_CONTINUE_OUT/baseline-proof"; then
            for receipt in "$RETIRED_MANAGER_CONTINUE_OUT/baseline-proof/"*.transport; do test ! -s "$receipt"; done
          fi
          git status --porcelain --untracked-files=no > "$RETIRED_MANAGER_CONTINUE_OUT/source-after.txt"
          test ! -s "$RETIRED_MANAGER_CONTINUE_OUT/source-after.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retired-manager-continue-baseline-${{ github.sha }}
          path: ${{ env.RETIRED_MANAGER_CONTINUE_OUT }}
          if-no-files-found: error
          retention-days: 14
