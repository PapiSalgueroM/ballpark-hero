name: Tycoon latest season review

on:
  workflow_dispatch:
  push:
    branches:
      - codex/tycoon-season-review-1095
  pull_request:
    paths:
      - .github/workflows/tycoon-season-review.yml
      - src/pages/StadiumTycoon.tsx
      - scripts/simTycoonSeasonReview.mjs
      - scripts/qa/tycoonSeasonReview1095.mjs

permissions:
  contents: read
concurrency:
  group: tycoon-season-review-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    env:
      SIM_NETWORK: offline
      ENGINES: chromium
      SEO_SPLIT_BASE_REF: HEAD
      TZ: UTC
      SIM_OFFLINE_RECEIPT: tycoon-season-review-artifacts/transport.log
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Hold remote source and dependencies
        run: |
          mkdir -p tycoon-season-review-artifacts/dependencies tycoon-season-review-artifacts/regressions
          git rev-parse HEAD > tycoon-season-review-artifacts/source-head.txt
          git rev-parse 'HEAD^{tree}' > tycoon-season-review-artifacts/source-tree.txt
          git archive HEAD | gzip > tycoon-season-review-artifacts/source.tar.gz
          printf '%s\n' '${{ github.run_id }}' '${{ github.run_attempt }}' '${{ github.job }}' > tycoon-season-review-artifacts/run.txt
          cp package.json package-lock.json tycoon-season-review-artifacts/dependencies/
          npm ci
          node --input-type=module <<'NODE'
          import fs from 'node:fs'; import assert from 'node:assert/strict'; import { createHash } from 'node:crypto';
          const hash=b=>createHash('sha256').update(b).digest('hex'), rows=[];
          for(const [path,entry] of Object.entries(JSON.parse(fs.readFileSync('package-lock.json')).packages)) {
            if(!path.startsWith('node_modules/')||!fs.existsSync(path+'/package.json'))continue;
            const raw=fs.readFileSync(path+'/package.json'), version=JSON.parse(raw).version;
            assert.equal(version,entry.version,path); const sha256=hash(raw);
            fs.writeFileSync('tycoon-season-review-artifacts/dependencies/'+sha256+'.json',raw); rows.push({path,version,sha256});
          }
          assert(rows.length>0);fs.writeFileSync('tycoon-season-review-artifacts/installed-before.json',JSON.stringify(rows,null,2));
          NODE
          npm install --no-save playwright
          node --input-type=module <<'NODE'
          import fs from 'node:fs'; import assert from 'node:assert/strict'; import { createHash } from 'node:crypto';
          const hash=b=>createHash('sha256').update(b).digest('hex');
          const before=JSON.parse(fs.readFileSync('tycoon-season-review-artifacts/installed-before.json'));
          for(const row of before){const raw=fs.readFileSync(row.path+'/package.json');assert.equal(JSON.parse(raw).version,row.version);assert.equal(hash(raw),row.sha256);}
          const versions=['playwright','playwright-core','react','react-dom','esbuild','vite'].map(name=>{const raw=fs.readFileSync('node_modules/'+name+'/package.json');fs.writeFileSync('tycoon-season-review-artifacts/dependencies/'+name+'-package.json',raw);return{name,version:JSON.parse(raw).version,sha256:hash(raw)};});
          fs.writeFileSync('tycoon-season-review-artifacts/dependencies/runtime-packages.json',JSON.stringify(versions,null,2));
          fs.writeFileSync('tycoon-season-review-artifacts/node-versions.json',JSON.stringify(process.versions,null,2));
          console.log(`Held ${before.length} installed manifest bytes before runtime checks.`);
          NODE
          mkdir -p tycoon-season-review-artifacts/runtime
          cp node_modules/playwright-core/lib/coreBundle.js tycoon-season-review-artifacts/runtime/playwright-coreBundle.js
          sha256sum node_modules/playwright-core/lib/coreBundle.js > tycoon-season-review-artifacts/runtime/clock-before.sha256
          npx playwright install --with-deps chromium
          python -m pip install fonttools pillow
      - name: Proper application types and build
        id: build
        run: |
          node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee tycoon-season-review-artifacts/types.log
          npm run build 2>&1 | tee tycoon-season-review-artifacts/build.log
          tar -czf tycoon-season-review-artifacts/build.tar.gz dist
      - name: Cache actual template fonts for the finite season views
        id: assets
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/qa/tycoonSeasonReview1095.mjs --prefetch-assets-only 2>&1 | tee tycoon-season-review-artifacts/assets.log
      - name: Actual recorded season result and continued match save behavior
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.assets.outcome == 'success' }}
        run: NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" timeout --signal=TERM --kill-after=15s 20m node scripts/simTycoonSeasonReview.mjs 2>&1 | tee tycoon-season-review-artifacts/outcomes.log
      - name: Retain native proof promptly
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: tycoon-season-review-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tycoon-season-review-artifacts/native/
            tycoon-season-review-artifacts/asset-cache/
            tycoon-season-review-artifacts/assets.log
            tycoon-season-review-artifacts/outcomes.log
            tycoon-season-review-artifacts/native-process.json
            tycoon-season-review-artifacts/native-stdout.log
            tycoon-season-review-artifacts/native-stderr.log
            tycoon-season-review-artifacts/source-head.txt
            tycoon-season-review-artifacts/source-tree.txt
          retention-days: 7
          if-no-files-found: error
      - name: Original tycoon economy save and presentation gates
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          failed=0
          for harness in simStadiumTycoon simTycoonRooms simTycoonGear simTycoonGearPage simTycoonClock simTycoonHelp simTycoonLoads simTycoonPitch simTycoonPitchRunner simTycoonLeague simTycoonTicketPolicy simTycoonSaleReview; do
            TYCOON_TICKET_POLICY_ARTIFACTS="$PWD/tycoon-season-review-artifacts/originals/ticket-policy" TYCOON_SALE_REVIEW_ARTIFACTS="$PWD/tycoon-season-review-artifacts/originals/sale-review" NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" ONLY="$harness" node scripts/runAllSims.mjs --browser 2>&1 | tee "tycoon-season-review-artifacts/regressions/$harness.log" || failed=1
          done
          exit "$failed"
      - name: All twenty built readers and source anchors
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          failed=0
          for harness in simAdsense simBrand simHeadTags simHiddenPages simHubs simIndexNow simIndexing simInternalLinks simNoRivalNames simPrerender simPrerenderBoot simRetiredRoutes simSchema simSitemap simSnapshotAssets simSiteSearch simGuideHeadings simSeoMetaSplit simHomeCopy simHarnessAnchors; do
            NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" ONLY="$harness" node scripts/runAllSims.mjs --browser 2>&1 | tee "tycoon-season-review-artifacts/regressions/$harness.log" || failed=1
          done
          exit "$failed"
      - name: Original source and installed manifests held
        if: ${{ !cancelled() }}
        run: |
          git diff --exit-code HEAD -- src scripts .github/workflows package.json package-lock.json
          cmp package.json tycoon-season-review-artifacts/dependencies/package.json
          cmp package-lock.json tycoon-season-review-artifacts/dependencies/package-lock.json
          sha256sum --check tycoon-season-review-artifacts/runtime/clock-before.sha256
          node --input-type=module <<'NODE'
          import fs from 'node:fs'; import assert from 'node:assert/strict'; import { execFileSync } from 'node:child_process'; import { createHash } from 'node:crypto';
          const allowed=new Set(['src/pages/StadiumTycoon.tsx','scripts/simTycoonSeasonReview.mjs','scripts/qa/tycoonSeasonReview1095.mjs','.github/workflows/tycoon-season-review.yml','docs/PROJECT-STATE.md']);
          const changed=execFileSync('git',['diff','--name-only','23a540a8dfa5b3335821b94f9ab05134272f85ab','HEAD'],{encoding:'utf8'}).trim().split('\n').filter(Boolean);
          assert(changed.length>0); assert(changed.every(file=>allowed.has(file)),JSON.stringify(changed));
          const before=JSON.parse(fs.readFileSync('tycoon-season-review-artifacts/installed-before.json'));
          const after=before.map(row=>{const raw=fs.readFileSync(row.path+'/package.json');return{path:row.path,version:JSON.parse(raw).version,sha256:createHash('sha256').update(raw).digest('hex')};});
          fs.writeFileSync('tycoon-season-review-artifacts/installed-after.json',JSON.stringify(after,null,2)); assert.deepEqual(after,before);
          console.log(`Held ${after.length} locked manifest bytes and the five-file source scope.`);
          NODE
      - name: Retain complete raw evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: tycoon-season-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: tycoon-season-review-artifacts/
          retention-days: 7
          if-no-files-found: error
