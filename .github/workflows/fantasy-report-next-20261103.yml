name: Next Fantasy and Soccer report focused qualification
on:
  push:
    branches: [codex/fantasy-report-next-qa-retry2-20261104]
permissions:
  contents: read
  actions: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: '1'
      SIM_NETWORK: offline
      CORE: 6194f1dad597a063e490926ee1c295a746f91cf6
      BUILD: 7776ac30bc29e244d4f5838ddb98bc253909e737
      BUILD_TREE: ef3347bfa6451acd1ba0b4ba9ba881fdfb818b0d
      ARTIFACT: 13289027722
      ZIP_SHA: 413e470f02976dbb7566e08d087559ffa0c6aa9fb07db730543c0a0c80ff25ff
      TAR_SHA: aa4162ca2690336c9e4d10152671fbbc6b195328d1ba796c139b292495f7accd
      MANIFEST_SHA: d001c2073b01cfaa57b5fafcb761a12b74b8564a4abcec924480df6c1fe94ff5
      DIST_DIGEST: 1d277297d2d91e06620986f59945cbdab054adf23df55998591cce51160f0abd
      PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
