          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git rev-parse HEAD HEAD^{tree} > "$OUT/source.txt"
          cp .github/workflows/fantasy-report-next-20261103.yml "$OUT/workflow.yml"
          git ls-files -z | sort -z | xargs -0 sha256sum > "$OUT/source-before.sha256"
          test "$(wc -l < "$OUT/source-before.sha256")" -eq 5678
          curl -fLsS --retry 0 -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/PapiSalgueroM/ballpark-hero/actions/artifacts/$ARTIFACT/zip" -o "$RUNNER_TEMP/next-build.zip"
          echo "$ZIP_SHA  $RUNNER_TEMP/next-build.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/next-build.zip" -d "$PRIOR"
