          exit "$failed"
      - name: All fifteen current unchanged fatal page caps
        id: caps
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          out="$SITE_MENU_QUAL_OUT"
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
