          assert.equal(r.complete,true);assert.equal(r.status,'MENU_BROWSER_COMPLETE');assert.equal(r.plannedCases,14);assert.equal(r.actual.completeCases,14);assert.equal(r.controls.length,9);assert.equal(r.holds.unchanged,true);assert.deepEqual(r.errors,[]);
          NODE
          test ! -s "$out/menu-server.transport";test ! -s "$out/menu-browser.transport"
      - name: Unchanged HomeFold oracle and all eighteen built-site readers
        id: readers
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          out="$SITE_MENU_QUAL_OUT"
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          : > "$out/readers-server.transport"
          SIM_OFFLINE_RECEIPT="$out/readers-server.transport" node scripts/lib/hostLikeServer.mjs dist 4173 > "$out/readers-server.log" 2>&1 &
          server=$!;trap 'kill "$server" 2>/dev/null || true' EXIT
          ready=0;for attempt in 1 2 3 4 5;do if curl --fail --silent http://127.0.0.1:4173/ > /dev/null;then ready=1;break;fi;sleep 1;done;test "$ready" -eq 1
          : > "$out/homefold.transport"; status=0
          BASE=http://127.0.0.1:4173 SIM_OFFLINE_RECEIPT="$out/homefold.transport" timeout --signal=TERM --kill-after=15s 4m node scripts/playHomeFold.mjs > "$out/homefold.log" 2>&1 || status=$?
          printf '%s\n' "$status" > "$out/homefold.exit";failed=0;test "$status" -eq 0 || failed=1
          for method in simAdsense simBrand simHeadTags simHiddenPages simHubs simIndexNow simIndexing simInternalLinks simNoRivalNames simPrerender simPrerenderBoot simRetiredRoutes simSchema simSitemap simSnapshotAssets simSiteSearch simGuideHeadings simLegalPages;do
            : > "$out/$method.transport";status=0;SIM_OFFLINE_RECEIPT="$out/$method.transport" BASE=http://127.0.0.1:4173 SWEEP_BASE=http://127.0.0.1:4173 timeout --signal=TERM --kill-after=15s 3m node "scripts/$method.mjs" > "$out/$method.log" 2>&1 || status=$?
            printf '%s\t%s\n' "$method" "$status" >> "$out/readers.tsv";test "$status" -eq 0 || failed=1;test ! -s "$out/$method.transport" || failed=1
