name: Site menu navigation qualification

on:
  push:
    branches: [codex/site-menu-navigation]
    paths-ignore: ['docs/**']

permissions:
  contents: read
concurrency:
  group: site-menu-navigation-${{ github.sha }}
  cancel-in-progress: false

env:
  BASE_SOURCE: 46f7f3f660545d508a6348e8a92b80e02556c6b9
  CI: '1'
  SIM_NETWORK: offline
  ENGINES: chromium
  TZ: UTC

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 32
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact source and protected foundation
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/site-menu-navigation"; test ! -e "$out"; mkdir "$out"
          echo "SITE_MENU_QUAL_OUT=$out" >> "$GITHUB_ENV"
          echo "FREE_KICK_FONT_CACHE=$out/font-cache" >> "$GITHUB_ENV"
          test "$GITHUB_REPOSITORY" = PapiSalgueroM/ballpark-hero
          test "$GITHUB_REPOSITORY_ID" = 1195729679
          test "$GITHUB_REF" = refs/heads/codex/site-menu-navigation
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags --depth=1 origin "$BASE_SOURCE" > "$out/base-fetch.log" 2>&1
          git cat-file -e "$BASE_SOURCE^{commit}"
          git merge-base --is-ancestor "$BASE_SOURCE" "$GITHUB_SHA" > "$out/base-ancestry.log" 2>&1
          git diff --exit-code "$BASE_SOURCE" HEAD -- . ':!docs/**' ':!src/App.tsx' ':!src/components/layout/Header.tsx' ':!src/components/layout/SiteMenu.tsx' ':!src/components/layout/SiteMenuPanel.tsx' ':!src/test/SiteMenu.test.tsx' ':!src/test/SiteMenu.lazy-loading.test.tsx' ':!src/test/SiteMenu.load-failure.test.tsx' ':!scripts/qa/playSiteMenuNavigation.mjs' ':!scripts/qa/siteMenuNavigationSupport.mjs' ':!.github/workflows/site-menu-navigation.yml' > "$out/protected-source.log"
          for file in package.json package-lock.json vitest.config.ts scripts/lib/offlineTransport.cjs scripts/lib/playwrightLoader.mjs scripts/lib/hostLikeServer.mjs scripts/qa/freeKickLab1070.mjs scripts/sweepWeight.mjs scripts/playHomeFold.mjs; do
            git show "$BASE_SOURCE:$file" | cmp "$file" -
          done
          node <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict'),cp=require('node:child_process');
          const pins={"src/components/layout/SiteMenu.tsx":"a2a930b4226c19c0b6bb7af6ec90f71ce7474fae","src/components/layout/SiteMenuPanel.tsx":"d321ff49b9d2a03e0bb1dfc745a86a47861118cd","src/App.tsx":"b988c18c60d3fd7e1a010cb277a39736d07135e8","src/components/layout/Header.tsx":"ea73eb5c4c6652c2684ab302a18381b78ad9cc4d","src/test/SiteMenu.test.tsx":"4523ed1fa241b765d6cbe4f71f5eb14a14db89ad","src/test/SiteMenu.lazy-loading.test.tsx":"ed251b20e28a40fe041f00515c70cbb554968814","src/test/SiteMenu.load-failure.test.tsx":"623c8ebb1839a4f3e21d9520daf5effaee83610a"};
          for(const [file,expected] of Object.entries(pins))assert.equal(cp.execFileSync('git',['hash-object',file],{encoding:'utf8'}).trim(),expected,file);
          fs.writeFileSync(process.env.RUNNER_TEMP+'/site-menu-navigation/source-binding.json',JSON.stringify({source:process.env.GITHUB_SHA,base:process.env.BASE_SOURCE,pins},null,2)+'\n');
          NODE
          git rev-parse HEAD > "$out/head.txt"
          git ls-files -z | sort -z > "$out/source-members.before"
          git ls-files -z | sort -z | xargs -0 sha256sum > "$out/source-before.sha256"
          git diff --exit-code HEAD > "$out/source-clean-before.log"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Locked installation and isolated browser tools
        run: |
          set -euo pipefail
          out="$SITE_MENU_QUAL_OUT"
          npm ci > "$out/install.log" 2>&1
          browser_tools="$RUNNER_TEMP/site-menu-navigation-browser"; test ! -e "$browser_tools"
          npm install --prefix "$browser_tools" --no-save --package-lock=false playwright@1.64.0 > "$out/browser-install.log" 2>&1
          test ! -e node_modules/playwright; test ! -e node_modules/playwright-core
          ln -s "$browser_tools/node_modules/playwright" node_modules/playwright
          ln -s "$browser_tools/node_modules/playwright-core" node_modules/playwright-core
          node "$browser_tools/node_modules/playwright/cli.js" install --with-deps chromium > "$out/chromium-install.log" 2>&1
          python -m pip install fonttools pillow > "$out/python-install.log" 2>&1
          FREE_KICK_FONT_CACHE="$out/font-cache" node scripts/qa/freeKickLab1070.mjs --prefetch-fonts-only > "$out/font-prefetch.log" 2>&1
          manifest_sha=$(sha256sum "$out/font-cache/manifest.json" | cut -d ' ' -f 1)
          echo "FONT_CACHE_MANIFEST_SHA256=$manifest_sha" >> "$GITHUB_ENV"
          find node_modules -path node_modules/.vite -prune -o -type f -print0 | sort -z | xargs -0 sha256sum > "$out/dependencies.sha256"
          find "$browser_tools/node_modules" -type f -print0 | sort -z | xargs -0 sha256sum > "$out/browser-tools.sha256"
          find "$out/font-cache" -type f -print0 | sort -z | xargs -0 sha256sum > "$out/font-cache.sha256"
          find node_modules -path node_modules/.vite -prune -o -type f -print0 | sort -z > "$out/dependency-members.before"
          find "$browser_tools/node_modules" -type f -print0 | sort -z > "$out/browser-members.before"
          find "$out/font-cache" -type f -print0 | sort -z > "$out/font-members.before"
      - name: Actual app types and eight real menu cases first
        id: tests
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          out="$SITE_MENU_QUAL_OUT"
          : > "$out/types.transport"; : > "$out/menu-tests.transport"
          SIM_OFFLINE_RECEIPT="$out/types.transport" node_modules/.bin/tsc --noEmit -p tsconfig.app.json > "$out/types.log" 2>&1
          unset NO_DOUBLE_SWAP
          status=0
          SIM_OFFLINE_RECEIPT="$out/menu-tests.transport" timeout --signal=TERM --kill-after=15s 6m node_modules/.bin/vitest run src/test/SiteMenu.test.tsx src/test/SiteMenu.lazy-loading.test.tsx src/test/SiteMenu.load-failure.test.tsx --maxWorkers=1 --no-file-parallelism --reporter=json --outputFile="$out/menu-tests.json" > "$out/menu-tests.log" 2>&1 || status=$?
          printf '%s\n' "$status" > "$out/menu-tests.exit"
          test "$status" -eq 0
          node <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict'),out=process.env.SITE_MENU_QUAL_OUT;
          const r=JSON.parse(fs.readFileSync(out+'/menu-tests.json','utf8'));
          assert.equal(r.success,true);assert.equal(r.testResults.length,3);assert.equal(r.numTotalTests,8);assert.equal(r.numPassedTests,8);assert.equal(r.numFailedTests,0);assert.equal(r.numPendingTests,0);assert.equal(r.numTodoTests,0);
          for(const [name,count]of [['SiteMenu.test.tsx',6],['SiteMenu.lazy-loading.test.tsx',1],['SiteMenu.load-failure.test.tsx',1]]){const suites=r.testResults.filter(x=>x.name.replaceAll('\\','/').endsWith('/'+name));assert.equal(suites.length,1);assert.equal(suites[0].status,'passed');assert.equal(suites[0].assertionResults.length,count);assert(suites[0].assertionResults.every(x=>x.status==='passed'&&x.failureMessages.length===0));}
          for(const k of ['numRuntimeErrorTestSuites','numUnhandledErrors'])if(k in r)assert.equal(r[k],0);if('unhandledErrors'in r)assert.deepEqual(r.unhandledErrors,[]);
          assert.doesNotMatch(fs.readFileSync(out+'/menu-tests.log','utf8'),/Unhandled\s+(?:Errors?|Rejections?)|Uncaught\s+Exceptions?/i);
          NODE
          test ! -s "$out/types.transport"; test ! -s "$out/menu-tests.transport"
      - name: Seven actual copied-source faults and exact healthy restoration
        id: controls
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          node <<'NODE'
          const fs=require('node:fs'),path=require('node:path'),assert=require('node:assert/strict'),{createHash}=require('node:crypto'),{spawnSync}=require('node:child_process');
          const out=process.env.SITE_MENU_QUAL_OUT,hash=b=>createHash('sha256').update(b).digest('hex'),launcher='src/components/layout/SiteMenu.tsx',panel='src/components/layout/SiteMenuPanel.tsx',files=['src/test/SiteMenu.test.tsx','src/test/SiteMenu.lazy-loading.test.tsx','src/test/SiteMenu.load-failure.test.tsx'],original=new Map([launcher,panel].map(p=>[p,fs.readFileSync(p,'utf8')]));
          const beforeImport="import('./SiteMenuPanel')",afterImport="import('@/components/layout/SiteMenuPanel')";
          assert.equal(original.get(launcher).split(beforeImport).length,2);
          assert(!fs.existsSync('.sim-control/site-menu-navigation'));const copyPins=[];
          const recipes=[{"id":"open","target":"src/components/layout/SiteMenu.tsx","before":"onClick={() => setOpen(true)}","after":"onClick={() => setOpen(false)}","test":"src/test/SiteMenu.test.tsx","title":"opens a named dialog with the real site links and all six lightweight sports hubs","marker":"SITE_MENU_NAMED_DIALOG","lookup":"dialog"},{"id":"route-key-close","target":"src/components/layout/SiteMenu.tsx","before":"useEffect(() => { setOpen(false); }, [key]);","after":"useEffect(() => { setOpen(value => value); }, [key]);","test":"src/test/SiteMenu.test.tsx","title":"closes on external search/hash and history key changes while the normalized path stays the same","marker":"SITE_MENU_EXTERNAL_KEY_CLOSED","lookup":null},{"id":"records-href","target":"src/components/layout/SiteMenuPanel.tsx","before":"['/records', 'Record Books']","after":"['/record-books', 'Record Books']","test":"src/test/SiteMenu.test.tsx","title":"opens a named dialog with the real site links and all six lightweight sports hubs","marker":"SITE_MENU_ACTUAL_HREF_","lookup":null},{"id":"current-route","target":"src/components/layout/SiteMenuPanel.tsx","before":"aria-current={path === to ? 'page' : undefined}","after":"aria-current={path.startsWith(to) ? 'page' : undefined}","test":"src/test/SiteMenu.test.tsx","title":"marks only the normalized current route and closes when that current link is selected","marker":"SITE_MENU_ONLY_ONE_CURRENT","lookup":null},{"id":"escape","target":"src/components/layout/SiteMenuPanel.tsx","before":"<SheetContent side=\"left\" id={id} data-site-chrome=\"\"","after":"<SheetContent side=\"left\" id={id} data-site-chrome=\"\" onEscapeKeyDown={event => event.preventDefault()}","test":"src/test/SiteMenu.test.tsx","title":"lets real Radix Escape dismiss and return focus to the opening trigger","marker":"SITE_MENU_ESCAPE_CLOSED","lookup":null},{"id":"outside","target":"src/components/layout/SiteMenuPanel.tsx","before":"<SheetContent side=\"left\" id={id} data-site-chrome=\"\"","after":"<SheetContent side=\"left\" id={id} data-site-chrome=\"\" onPointerDownOutside={event => event.preventDefault()}","test":"src/test/SiteMenu.test.tsx","title":"dismisses from the actual Sheet overlay and returns focus","marker":"SITE_MENU_OUTSIDE_CLOSED","lookup":null},{"id":"module-failure-ui","target":"src/components/layout/SiteMenu.tsx","before":"() => { if (active) setFailed(true); }","after":"() => { if (active) setFailed(false); }","test":"src/test/SiteMenu.load-failure.test.tsx","title":"shows truthful load failure with Search and Cancel, returns focus and never opens a dialog","marker":"SITE_MENU_IMPORT_FAILURE_DISCLOSED","lookup":"alert"}];
          function run(label,selected,aliases,title){const base=path.join(out,label),env={...process.env,SIM_OFFLINE_RECEIPT:base+'.transport'};fs.writeFileSync(env.SIM_OFFLINE_RECEIPT,'',{flag:'wx'});if(aliases)env.NO_DOUBLE_SWAP=JSON.stringify(aliases);else delete env.NO_DOUBLE_SWAP;
            const args=['node_modules/vitest/vitest.mjs','run',...selected,'--maxWorkers=1','--no-file-parallelism','--reporter=json','--outputFile='+base+'.json'];if(title)args.push('--testNamePattern',title);
            const result=spawnSync(process.execPath,args,{env,encoding:'utf8',timeout:240000,maxBuffer:16*1024*1024});fs.writeFileSync(base+'.log',(result.stdout||'')+(result.stderr||''),{flag:'wx'});fs.writeFileSync(base+'.exit.json',JSON.stringify({status:result.status,signal:result.signal,error:result.error?String(result.error):null},null,2)+'\n',{flag:'wx'});
            assert.equal(result.error,undefined,label);assert.equal(result.signal,null,label);assert.equal(fs.statSync(env.SIM_OFFLINE_RECEIPT).size,0,label+' transport');const r=JSON.parse(fs.readFileSync(base+'.json','utf8'));
            for(const k of ['numRuntimeErrorTestSuites','numUnhandledErrors'])if(k in r)assert.equal(r[k],0,label);if('unhandledErrors'in r)assert.deepEqual(r.unhandledErrors,[],label);
            assert.equal(r.numTodoTests,0,label);assert.doesNotMatch((result.stdout||'')+(result.stderr||''),/Unhandled\s+(?:Errors?|Rejections?)|Uncaught\s+Exceptions?|Cannot find (?:module|package)|Failed to resolve import|SyntaxError:|ReferenceError:|TypeError:/i,label);
            return {result,r,rows:r.testResults.flatMap(x=>x.assertionResults)};}
          function healthy(label,aliases){const v=run(label,files,aliases);assert.equal(v.result.status,0);assert.equal(v.r.success,true);assert.equal(v.r.numTotalTests,8);assert.equal(v.r.numPassedTests,8);assert.equal(v.r.numFailedTests,0);assert.equal(v.r.numPendingTests,0);assert.equal(v.r.testResults.length,3);assert.equal(v.rows.length,8);assert(v.rows.every(x=>x.status==='passed'&&x.failureMessages.length===0));return v;}
          function copies(id,recipe){const dir=path.join(process.cwd(),'.sim-control/site-menu-navigation',id);fs.mkdirSync(dir,{recursive:true});const rows=[];
            for(const target of [launcher,panel]){const source=original.get(target);let mutant=source;if(recipe&&target===recipe.target){assert.equal(source.split(recipe.before).length,2);mutant=source.replace(recipe.before,recipe.after);assert.notEqual(mutant,source);assert.equal(mutant.split(recipe.after).length,2);assert.equal(mutant.replace(recipe.after,recipe.before),source);}
              let copy=target===launcher?mutant.replace(beforeImport,afterImport):mutant;const restoredImport=target===launcher?copy.replace(afterImport,beforeImport):copy;assert.equal(restoredImport,mutant);let inverse=restoredImport;if(recipe&&target===recipe.target)inverse=inverse.replace(recipe.after,recipe.before);assert.equal(inverse,source);
              const file=path.join(dir,path.basename(target));fs.writeFileSync(file,copy,{flag:'wx'});rows.push({target,file,sourceSha256:hash(source),mutatedSha256:hash(mutant),copySha256:hash(copy),fullInverseExact:true});copyPins.push({file,sha256:hash(copy)});}
            fs.writeFileSync(path.join(dir,'derivation.json'),JSON.stringify({id,importAdapter:{before:beforeImport,after:afterImport,occurrences:1},rows},null,2)+'\n',{flag:'wx'});return {'@/components/layout/SiteMenu':path.join(dir,'SiteMenu.tsx'),'@/components/layout/SiteMenuPanel':path.join(dir,'SiteMenuPanel.tsx')};}
          healthy('adapter-healthy',copies('healthy',null));const admissions=[];
          for(const c of recipes){const aliases=copies(c.id,c),v=run('fault-'+c.id,[c.test],aliases,c.title),total=c.test.endsWith('/SiteMenu.test.tsx')?6:1;
            assert.equal(v.result.status,1,c.id);assert.equal(v.r.success,false);assert.equal(v.r.numTotalTests,total);assert.equal(v.r.numPassedTests,0);assert.equal(v.r.numFailedTests,1);assert.equal(v.r.numPendingTests,total-1);assert.equal(v.r.testResults.length,1);assert.equal(v.rows.length,total);
            const owned=v.rows.filter(x=>x.fullName===c.title||x.fullName.endsWith(' '+c.title));assert.equal(owned.length,1);assert.equal(owned[0].status,'failed');assert.equal(owned[0].failureMessages.length,1);assert(v.rows.filter(x=>x!==owned[0]).every(x=>x.status==='pending'||x.status==='skipped'));
            const message=owned[0].failureMessages[0],named=message.includes(c.marker),query=c.lookup==='dialog'?message.includes('Unable to find role="dialog"')&&message.includes('name "Menu"'):c.lookup==='alert'?message.includes('Unable to find role="alert"'):false;
            assert(named||query,'OWNED_MENU_FAULT_'+c.id);admissions.push({id:c.id,exit:1,failedCase:owned[0].fullName,attribution:named?'named assertion':'actual owned async '+c.lookup+' lookup',sourceChanged:true,fullInverseExact:true});}
          healthy('original-restored',null);for(const [file,body]of original)assert.equal(fs.readFileSync(file,'utf8'),body);for(const p of copyPins)assert.equal(hash(fs.readFileSync(p.file)),p.sha256);fs.cpSync('.sim-control/site-menu-navigation',path.join(out,'copied-source-evidence'),{recursive:true,errorOnExist:true,force:false});
          fs.writeFileSync(out+'/source-faults-admission.json',JSON.stringify({complete:true,source:process.env.GITHUB_SHA,originalCases:8,adapterHealthyCases:8,restoredCases:8,ownedFailures:admissions,testsAreRuntimeClaimsOnlyAfterThisExecutes:true},null,2)+'\n',{flag:'wx'});
          NODE
      - name: Serial plain production build
        id: build
        run: |
          set -euo pipefail
          out="$SITE_MENU_QUAL_OUT"
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          : > "$out/build.transport"
          SIM_OFFLINE_RECEIPT="$out/build.transport" npm run build > "$out/build.log" 2>&1
          test ! -s "$out/build.transport"
          find dist ! -type d ! -type f -print > "$out/dist-nonregular.txt"; test ! -s "$out/dist-nonregular.txt"
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > "$out/dist.sha256"
          find dist -type f -print0 | sort -z > "$out/dist-members.before"
          tar -cf "$out/dist.tar" -C dist .
      - name: Real built menu journeys
        id: browser
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          out="$SITE_MENU_QUAL_OUT"
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          : > "$out/menu-server.transport"; : > "$out/menu-browser.transport"
          SIM_OFFLINE_RECEIPT="$out/menu-server.transport" node scripts/lib/hostLikeServer.mjs dist 4173 > "$out/menu-server.log" 2>&1 &
          server=$!;trap 'kill "$server" 2>/dev/null || true' EXIT
          ready=0;for attempt in 1 2 3 4 5;do if curl --fail --silent http://127.0.0.1:4173/ > /dev/null;then ready=1;break;fi;sleep 1;done;test "$ready" -eq 1
          status=0
          BASE=http://127.0.0.1:4173 SOURCE_SHA="$GITHUB_SHA" SITE_MENU_OUT="$out/site-menu-browser" SIM_OFFLINE_RECEIPT="$out/menu-browser.transport" timeout --signal=TERM --kill-after=15s 10m node scripts/qa/playSiteMenuNavigation.mjs > "$out/menu-browser.log" 2>&1 || status=$?
          printf '%s\n' "$status" > "$out/menu-browser.exit"; test "$status" -eq 0
