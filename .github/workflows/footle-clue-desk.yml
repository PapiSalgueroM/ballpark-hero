name: Footle clue desk verification

on:
  pull_request:
    paths:
      - .github/workflows/footle-clue-desk.yml
      - .github/workflows/footle-practice.yml
      - src/components/footle/**
      - src/pages/Footle.tsx
      - src/hooks/useGame*
      - src/lib/footlePracticeRun*
      - src/lib/gameLogic.ts
      - src/types/game.ts
      - src/test/footleClueDesk.test.tsx
      - src/test/fixtures/footlePracticePlayers.ts
      - scripts/simFootleClueDesk.mjs
      - scripts/qa/footleClueDesk1001*
      - scripts/qa/footle995*

permissions:
  contents: read
concurrency:
  group: footle-clue-desk-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      SIM_NETWORK: offline
      ENGINES: chromium
      VITEST_MAX_FORKS: 1
      VITEST_MIN_FORKS: 1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install verification dependencies
        run: |
          mkdir -p footle-clue-desk-artifacts
          npm ci
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Type check and build
        id: build
        run: |
          node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee footle-clue-desk-artifacts/types.log
          npm run build 2>&1 | tee footle-clue-desk-artifacts/build.log
      - name: Clue history, frozen review and effective controls
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: FOOTLE_CLUE_DESK_CONTROL=all ONLY=simFootleClueDesk node scripts/runAllSims.mjs 2>&1 | tee footle-clue-desk-artifacts/clue-desk.log
      - name: Harness anchors
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ONLY=simHarnessAnchors node scripts/runAllSims.mjs 2>&1 | tee footle-clue-desk-artifacts/anchors.log
      - name: Phone and desktop play, review and reload
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/qa/footleClueDesk1001.mjs 2>&1 | tee footle-clue-desk-artifacts/native.log
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: footle-clue-desk-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 1
          path: footle-clue-desk-artifacts/
