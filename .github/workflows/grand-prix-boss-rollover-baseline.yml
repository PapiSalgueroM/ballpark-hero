name: Grand Prix Boss atomic rollover absence baseline
on:
  push:
    branches: [codex/grand-prix-boss-rollover-baseline-20261102]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: '1'
      SIM_NETWORK: offline
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Bind qualified A direct parent and test-only delta
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/codex/grand-prix-boss-rollover-baseline-20261102
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD^)" = b2f98952f1a5de5736a8d1ed4dfda4cc10b81765
          out="$PWD/grand-prix-rollover-baseline-artifacts"
          mkdir "$out"
          git rev-parse HEAD HEAD^{tree} > "$out/head-tree.txt"
          git ls-files -z > "$out/source-members.before"
          git ls-files -z | xargs -0 sha256sum > "$out/source.sha256"
          git diff --name-only b2f98952f1a5de5736a8d1ed4dfda4cc10b81765 HEAD > "$out/changed-paths.txt"
          printf '%s\n' '.github/workflows/grand-prix-boss-rollover-baseline.yml' 'src/test/grandPrixBossRollover.test.ts' > "$out/expected-paths.txt"
          cmp "$out/expected-paths.txt" "$out/changed-paths.txt"
          printf '%s\n' '6d0e754c28f631ea590472b9ea2a1647206db67ec7dc1580bcf054cede74364f  src/lib/grandPrixBoss.ts' '8822d2af417739a0164babc5b15d13cd2a5e5c5dd4e263a9e465602798765887  src/test/grandPrixBoss.test.ts' '59a01e6dc561c11013e9e9092b139dd5da5494ff1d1fee7b1976057a94a405c0  src/test/grandPrixBossMarket.test.ts' '61a671d7bd676c82be16d238928e9413293c2656bdc1562228becc3df32d0516  src/test/grandPrixBossRollover.test.ts' | sha256sum -c -
          cat > "$out/capture.sh" <<'CAPTURE'
          capture() {
            local tag="$1"; shift
            local out="$PWD/grand-prix-rollover-baseline-artifacts"
            test ! -e "$out/$tag.exit"
            printf '%s\0' "$@" > "$out/$tag.argv"
            : > "$out/$tag.transport"
            set +e
            SIM_OFFLINE_RECEIPT="$out/$tag.transport" "$@" > "$out/$tag.stdout" 2> "$out/$tag.stderr"
            local status=$?
            set -e
            printf '%s\n' "$status" > "$out/$tag.exit"
            tail -n 18 "$out/$tag.stdout"; tail -n 18 "$out/$tag.stderr"
            test ! -s "$out/$tag.transport" || return 1
            return "$status"
          }
          CAPTURE
          source "$out/capture.sh"
          capture install env NODE_OPTIONS='' npm ci
          find node_modules -path node_modules/.vite -prune -o -type f -print0 | sort -z | xargs -0 sha256sum > "$out/dependency-files.sha256"
      - name: Actual types and existing twenty-five behaviors
        run: |
          set -euo pipefail
          out="$PWD/grand-prix-rollover-baseline-artifacts"
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          unset GP_BOSS_PAGE_FILE GP_BOSS_HOOK_FILE GP_BOSS_ENGINE_FILE US_BOARD_CONTROL_ALIAS US_BOARD_CONTROL_FILE NO_DOUBLE_SWAP
          source "$out/capture.sh"
          capture types node_modules/.bin/tsc --noEmit -p tsconfig.app.json
          capture preserved node node_modules/vitest/vitest.mjs run src/test/grandPrixBoss.test.ts src/test/grandPrixBossMarket.test.ts --maxWorkers=1 --minWorkers=1 --no-file-parallelism --reporter=verbose --reporter=json --outputFile="$out/preserved.vitest.json"
      - name: Thirteen owned rollover and history absence assertions
        run: |
          set -euo pipefail
          out="$PWD/grand-prix-rollover-baseline-artifacts"
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          unset GP_BOSS_PAGE_FILE GP_BOSS_HOOK_FILE GP_BOSS_ENGINE_FILE US_BOARD_CONTROL_ALIAS US_BOARD_CONTROL_FILE NO_DOUBLE_SWAP
          source "$out/capture.sh"
          code=0
          capture baseline node node_modules/vitest/vitest.mjs run src/test/grandPrixBossRollover.test.ts --maxWorkers=1 --minWorkers=1 --no-file-parallelism --reporter=verbose --reporter=json --outputFile="$out/baseline.vitest.json" || code=$?
          test "$code" -eq 1
          test ! -s "$out/baseline.transport"
          node --input-type=module <<'CHECK'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const out = process.cwd() + '/grand-prix-rollover-baseline-artifacts';
          const coreIds = ['GP_ENGINE_AVAILABLE:', 'GP_WORLD:', 'GP_SEED:', 'GP_UPGRADE:', 'GP_RESERVE:', 'GP_GRID:', 'GP_SETUPS:', 'GP_CLASSIFICATION:', 'GP_SETTLEMENT:', 'GP_DUPLICATE:', 'GP_RESUME:', 'GP_INVALID_SAVE:', 'GP_SCORE:'];
          const marketIds = ['GP_MARKET_PUBLIC_QUOTES:', 'GP_MARKET_SIGN:', 'GP_MARKET_NEW_WAGES:', 'GP_MARKET_BUYOUT:', 'GP_MARKET_FUNDS:', 'GP_MARKET_REROUND:', 'GP_MARKET_RENEW:', 'GP_MARKET_EXCLUSIVITY:', 'GP_MARKET_WINDOWS:', 'GP_MARKET_REPLAY:', 'GP_MARKET_SAVE:', 'GP_MARKET_HOLDS:'];
          const reportRows = [];
          function inspect(tag, count, passed, failed, files) {
            const r = JSON.parse(fs.readFileSync(out + '/' + tag + '.vitest.json', 'utf8'));
            const raw = fs.readFileSync(out + '/' + tag + '.stdout', 'utf8') + '\n' + fs.readFileSync(out + '/' + tag + '.stderr', 'utf8');
            assert.equal(Number(fs.readFileSync(out + '/' + tag + '.exit', 'utf8')), failed ? 1 : 0);
            assert.equal(r.success, failed === 0); assert.equal(r.numTotalTests, count);
            assert.equal(r.numPassedTests, passed); assert.equal(r.numFailedTests, failed);
            assert.equal(r.numPendingTests, 0); assert.equal(r.numTodoTests, 0);
            assert.equal(r.testResults.length, files.length);
            const actualFiles = r.testResults.map(file => files.find(expected => file.name.endsWith('/' + expected)));
            assert(actualFiles.every(Boolean)); assert.equal(new Set(actualFiles).size, files.length);
            const rows = r.testResults.flatMap(file => file.assertionResults); assert.equal(rows.length, count);
            const runtimeCounters = { numUnhandledErrors: r.numUnhandledErrors ?? null, numRuntimeErrorTestSuites: r.numRuntimeErrorTestSuites ?? null };
            for (const [key, value] of Object.entries(runtimeCounters)) { if (value === null) continue; assert.equal(typeof value, 'number'); assert.equal(value, 0, key); }
            for (const errors of [r.errors, r.unhandledErrors]) if (Array.isArray(errors)) assert.equal(errors.length, 0);
            const detectedRuntimeError = /(?:Unhandled (?:Errors?|Rejection|Exception)|unhandledRejection|uncaughtException|Vitest caught \d+ unhandled)/i.test(raw);
            assert.equal(detectedRuntimeError, false);
            reportRows.push({ tag, passed, ownedFailures: failed, declaredSkips: 0, runtimeCounters,
              runtimeCounterCompleteness: Object.values(runtimeCounters).some(value => value === null) ? 'UNKNOWN' : 'REPORTED', detectedRuntimeError,
              rawErrors: r.errors ?? null, rawUnhandledErrors: r.unhandledErrors ?? null,
              cases: rows.map(row => ({ title: row.title, status: row.status })) });
            return rows;
          }
          const preserved = inspect('preserved', 25, 25, 0, ['src/test/grandPrixBoss.test.ts', 'src/test/grandPrixBossMarket.test.ts']);
          const expectedOld = [...coreIds, ...marketIds].sort(), seenOld = [];
          for (const row of preserved) { assert.equal(row.status, 'passed'); assert.equal(row.failureMessages.length, 0); seenOld.push(row.title.slice(0, row.title.indexOf(':') + 1)); }
          assert.deepEqual(seenOld.sort(), expectedOld);
          const expected = new Map([
            ['GP_ROLLOVER_COMMIT:', 'GP_NEXT_SEASON_ACTION_MISSING'],
            ['GP_ROLLOVER_CONTRACTS:', 'GP_NEXT_SEASON_ACTION_MISSING'],
            ['GP_ROLLOVER_PREPAID:', 'GP_NEXT_SEASON_ACTION_MISSING'],
            ['GP_ROLLOVER_CHAMPIONS:', 'GP_NEXT_SEASON_ACTION_MISSING'],
            ['GP_ROLLOVER_CALENDAR:', 'GP_NEXT_SEASON_ACTION_MISSING'],
            ['GP_ROLLOVER_YEAR_TWO:', 'GP_NEXT_SEASON_ACTION_MISSING'],
            ['GP_ROLLOVER_TAIL:', 'GP_NEXT_SEASON_ACTION_MISSING'],
            ['GP_ROLLOVER_REPLAY:', 'GP_NEXT_SEASON_ACTION_MISSING'],
            ['GP_ROLLOVER_PHASE:', 'GP_ROLLOVER_PHASE_GUARD_MISSING'],
            ['GP_ROLLOVER_FUNDS:', 'GP_ROLLOVER_FUNDS_GUARD_MISSING'],
            ['GP_ROLLOVER_LEGACY:', 'GP_HISTORY_LEDGER_MISSING'],
            ['GP_ROLLOVER_BAD_LEDGER:', 'GP_ROLLOVER_INVALID_LEDGER_ACCEPTED'],
            ['GP_ROLLOVER_ARCHIVED_IDENTITIES:', 'GP_NEXT_SEASON_ACTION_MISSING'],
          ]);
          const baseline = inspect('baseline', 13, 0, 13, ['src/test/grandPrixBossRollover.test.ts']), seen = new Set();
          let missingActions = 0;
          for (const row of baseline) {
            const ids = [...expected.keys()].filter(id => row.title.startsWith(id)); assert.equal(ids.length, 1);
            const id = ids[0]; assert(!seen.has(id)); seen.add(id);
            assert.equal(row.status, 'failed'); assert.equal(row.failureMessages.length, 1);
            assert.match(row.failureMessages[0], /AssertionError:/); assert(row.failureMessages[0].includes(expected.get(id)));
            if (expected.get(id) === 'GP_NEXT_SEASON_ACTION_MISSING') missingActions += 1;
          }
          assert.equal(missingActions, 9);
          fs.writeFileSync(out + '/summary.json', JSON.stringify({
            scope: 'Atomic rollover and bounded history absence only. No B product, history economics or rollover behavior pass is claimed.',
            reports: reportRows, totalExecuted: 38, preservationPasses: 25, ownedAssertionFailures: 13, missingActionAssertions: 9,
            phaseAssertions: 1, fundsAssertions: 1, missingHistoryAssertions: 1, malformedHistoryAcceptedAssertions: 1, declaredSkips: 0,
          }, null, 2) + '\n');
          console.log('GP_ROLLOVER_BASELINE: existing 25 passed, nine missing-action plus phase/funds/missing-history/partial-ledger owned assertions, zero skips.');
          CHECK
      - name: Preserve complete source dependencies and membership
        if: always()
        run: |
          set -euo pipefail
          out="$PWD/grand-prix-rollover-baseline-artifacts"
          sha256sum -c "$out/source.sha256" > "$out/source-hold.log"
          if test -f "$out/dependency-files.sha256"; then sha256sum -c "$out/dependency-files.sha256" > "$out/dependency-hold.log"; fi
          git ls-files -z > "$out/source-members.after"
          cmp "$out/source-members.before" "$out/source-members.after"
          git diff --exit-code HEAD > "$out/working-source-hold.log"
          git ls-files --others --exclude-standard > "$out/untracked.txt"
          test ! -s "$out/untracked.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grand-prix-rollover-baseline-${{ github.run_id }}
          path: grand-prix-rollover-baseline-artifacts/
          retention-days: 14
