          test "$(git hash-object scripts/qa/soccerSegundaAssets.mjs)" = "$ASSETS_BLOB"
          git ls-files -z | sort -z | xargs -0 sha256sum > "$OUT/source-before.sha256"
          git status --porcelain=v1 --untracked-files=all > "$OUT/status-before.txt"
          test ! -s "$OUT/status-before.txt"
          git rev-parse HEAD HEAD^{tree} HEAD^ > "$OUT/source.txt"
          cp .github/workflows/soccer-segunda-public-20261105.yml "$OUT/workflow.yml"
          for ref in "$PRODUCT_CORE" "$NATIVE_SOURCE" "$BUILD_SOURCE" "$PUBLISHED_SOURCE" "$DEPLOY_SOURCE"; do
