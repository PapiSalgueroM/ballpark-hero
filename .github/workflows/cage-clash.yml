name: Cage Clash verification

on:
  pull_request:
    paths:
      - .github/workflows/cage-clash.yml
      - src/pages/CageClash.tsx
      - src/components/cage-clash/**
      - src/hooks/useCageClash.ts
      - src/lib/cageClash.ts
      - src/lib/cagePractice.ts
      - src/lib/cageCircuit.ts
      - src/test/cageClash.test.tsx
      - src/test/cagePractice.test.tsx
      - src/test/cageCircuit.test.tsx
      - src/test/cageFightStats.test.tsx
      - src/test/cageStrikeMotion.test.tsx
      - scripts/simCageClash.mjs
      - scripts/simCagePractice.mjs
      - scripts/simCageCircuit.mjs
      - scripts/simCageFightStats.mjs
      - scripts/simCageStrikeMotion.mjs
      - scripts/qa/cageClash1063.mjs
      - src/data/gameContent/moreSports.ts
      - src/data/gameRegistry.ts
      - src/data/seoMeta.ts
      - public/cage-clash/index.html

permissions:
  contents: read
concurrency:
  group: cage-clash-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      SIM_NETWORK: offline
      ENGINES: chromium
      VITEST_MAX_FORKS: 1
      VITEST_MIN_FORKS: 1
      SEO_SPLIT_BASE_REF: HEAD
      CAGE_PRACTICE_ARTIFACTS: cage-clash-artifacts/practice
      CAGE_CIRCUIT_ARTIFACTS: cage-clash-artifacts/circuit
      CAGE_FIGHT_STATS_ARTIFACTS: cage-clash-artifacts/stats
      CAGE_STRIKE_MOTION_ARTIFACTS: cage-clash-artifacts/motion
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verification dependencies
        run: |
          mkdir -p cage-clash-artifacts
          npm ci
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          python -m pip install fonttools pillow
      - name: Harness source and mutation anchors
        run: ONLY=simHarnessAnchors node scripts/runAllSims.mjs 2>&1 | tee cage-clash-artifacts/simHarnessAnchors.log
      - name: Type check and build
        id: build
        run: |
          node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee cage-clash-artifacts/types.log
          npm run build 2>&1 | tee cage-clash-artifacts/build.log
      - name: Combat controller outcomes and effective controls
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: CAGE_CLASH_CONTROL=all ONLY=simCageClash node scripts/runAllSims.mjs 2>&1 | tee cage-clash-artifacts/combat.log
      - name: Practice outcomes and effective controls
        id: practice
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: CAGE_PRACTICE_CONTROL=all ONLY=simCagePractice node scripts/runAllSims.mjs 2>&1 | tee cage-clash-artifacts/practice.log
      - name: Preserve practice failure for immediate diagnosis
        if: ${{ failure() && steps.practice.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: cage-practice-failure-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 1
          path: |
            cage-clash-artifacts/practice/
            cage-clash-artifacts/practice.log
      - name: Circuit outcomes and effective controls
        id: circuit
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: CAGE_CIRCUIT_CONTROL=all ONLY=simCageCircuit node scripts/runAllSims.mjs 2>&1 | tee cage-clash-artifacts/circuit.log
      - name: Preserve circuit failure for immediate diagnosis
        if: ${{ failure() && steps.circuit.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: cage-circuit-failure-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 1
          path: |
            cage-clash-artifacts/circuit/
            cage-clash-artifacts/circuit.log
      - name: Fight stats outcomes and effective controls
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: CAGE_FIGHT_STATS_CONTROL=all ONLY=simCageFightStats node scripts/runAllSims.mjs 2>&1 | tee cage-clash-artifacts/stats.log
      - name: Pixel strike outcomes and effective controls
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: CAGE_STRIKE_MOTION_CONTROL=all ONLY=simCageStrikeMotion node scripts/runAllSims.mjs 2>&1 | tee cage-clash-artifacts/motion.log
      - name: Native pixel combat and input lifecycle
        id: native
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: xvfb-run -a node scripts/qa/cageClash1063.mjs 2>&1 | tee cage-clash-artifacts/native.log
      - name: Preserve native failure for immediate diagnosis
        if: ${{ failure() && steps.native.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: cage-native-failure-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 1
          path: |
            cage-clash-artifacts/native/
            cage-clash-artifacts/native.log
      - name: Existing combat scoring guides and home
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          failed=0
          for harness in simMmaPromotion simFightPromoter simNoDoubleRecord simScoringCoverage simScoreShown simGuideHeadings simSeoTitles simHomeCopy simSeoMetaSplit simInventedNames simRelatedGames; do
            ONLY="$harness" node scripts/runAllSims.mjs --browser 2>&1 | tee "cage-clash-artifacts/$harness.log" || failed=1
          done
          exit "$failed"
      - name: All built pages and search readers
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          failed=0
          for harness in simAdsense simBrand simHeadTags simHiddenPages simHubs simIndexNow simIndexing simInternalLinks simNoRivalNames simPrerender simPrerenderBoot simRetiredRoutes simSchema simSitemap simSnapshotAssets simSiteSearch; do
            ONLY="$harness" node scripts/runAllSims.mjs --browser 2>&1 | tee "cage-clash-artifacts/$harness.log" || failed=1
          done
          exit "$failed"
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cage-clash-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 1
          path: cage-clash-artifacts/
