name: Cage Clash verification

on:
  push:
    branches: [codex/pixel-cage-1063]
  pull_request:
    paths:
      - .github/workflows/cage-clash.yml
      - src/pages/CageClash.tsx
      - src/components/cage-clash/**
      - src/hooks/useCageClash.ts
      - src/lib/cageClash.ts
      - src/test/cageClash.test.tsx
      - scripts/simCageClash.mjs
      - scripts/qa/cageClash1063.mjs
      - src/data/gameContent/moreSports.ts
      - src/data/gameRegistry.ts
      - src/data/seoMeta.ts
      - public/cage-clash/index.html

permissions:
  contents: read
concurrency:
  group: cage-clash-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      SIM_NETWORK: offline
      ENGINES: chromium
      VITEST_MAX_FORKS: 1
      VITEST_MIN_FORKS: 1
      SEO_SPLIT_BASE_REF: HEAD
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verification dependencies
        run: |
          mkdir -p cage-clash-artifacts
          npm ci
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          python -m pip install fonttools pillow
      - name: Prepare generated source
        if: github.event_name == 'push'
        run: |
          node scripts/genSeoMetaParts.mjs 2>&1 | tee cage-clash-artifacts/seo-generation.log
          node scripts/genSearchKeywords.mjs 2>&1 | tee cage-clash-artifacts/search-generation.log
          node scripts/genHomeCopy.mjs 2>&1 | tee cage-clash-artifacts/home-generation.log
          node scripts/genSitemap.mjs --routes-only 2>&1 | tee cage-clash-artifacts/routes-generation.log
      - name: Type check and build
        id: build
        run: |
          node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee cage-clash-artifacts/types.log
          npm run build 2>&1 | tee cage-clash-artifacts/build.log
      - name: Prepare route snapshots and final ledger
        if: github.event_name == 'push' && steps.build.outcome == 'success'
        run: |
          PRERENDER_ONLY=/cage-clash,/whats-new node scripts/prerender.mjs 2>&1 | tee cage-clash-artifacts/prerender.log
          node scripts/genSitemap.mjs 2>&1 | tee cage-clash-artifacts/sitemap.log
          npm run build 2>&1 | tee cage-clash-artifacts/generated-build.log
          files=(index.html public/cage-clash/index.html public/whats-new/index.html public/sitemap.xml scripts/data/lastmod.json src/data/searchKeywords.json src/data/seoMetaParts/seoMetaPart14.ts)
          printf '%s\n' "${files[@]}" | sort > cage-clash-artifacts/allowed-generation.txt
          { git diff --name-only; git ls-files --others --exclude-standard public/cage-clash; } | sort -u > cage-clash-artifacts/changed-generation.txt
          if comm -23 cage-clash-artifacts/changed-generation.txt cage-clash-artifacts/allowed-generation.txt | grep .; then exit 1; fi
          mkdir -p cage-clash-artifacts/generated
          cp --parents "${files[@]}" cage-clash-artifacts/generated/
          printf '%s\n' "$GITHUB_SHA" > cage-clash-artifacts/generated/source-head.txt
          sha256sum "${files[@]}" > cage-clash-artifacts/generated/SHA256SUMS
      - name: Combat controller outcomes and effective controls
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: CAGE_CLASH_CONTROL=all ONLY=simCageClash node scripts/runAllSims.mjs 2>&1 | tee cage-clash-artifacts/combat.log
      - name: Existing combat scoring guides and home
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          failed=0
          for harness in simMmaPromotion simFightPromoter simNoDoubleRecord simScoringCoverage simScoreShown simHarnessAnchors simGuideHeadings simSeoTitles simHomeCopy simSeoMetaSplit simInventedNames; do
            ONLY="$harness" node scripts/runAllSims.mjs --browser 2>&1 | tee "cage-clash-artifacts/$harness.log" || failed=1
          done
          exit "$failed"
      - name: All built pages and search readers
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          failed=0
          for harness in simAdsense simBrand simHeadTags simHiddenPages simHubs simIndexNow simIndexing simInternalLinks simNoRivalNames simPrerender simPrerenderBoot simRetiredRoutes simSchema simSitemap simSnapshotAssets simSiteSearch; do
            ONLY="$harness" node scripts/runAllSims.mjs --browser 2>&1 | tee "cage-clash-artifacts/$harness.log" || failed=1
          done
          exit "$failed"
      - name: Native pixel combat and input lifecycle
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/qa/cageClash1063.mjs 2>&1 | tee cage-clash-artifacts/native.log
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cage-clash-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 1
          path: cage-clash-artifacts/
