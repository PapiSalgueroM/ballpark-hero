name: Club Manager custom positions fixed core and source controls
on:
  push:
    branches: [codex/cm-free-positions-20261023]
    paths-ignore: ['docs/**']
permissions:
  contents: read
concurrency:
  group: cm-free-positions-${{ github.sha }}
  cancel-in-progress: false
env:
  BASE_SOURCE: 3e95583fd8131f3704591cd566677f8774a8e4c3
  EXPECTED_PARENT: 31c9239f54eaf8fb4d3d7133ff86ac3450151a2a
  CI: '1'
  SIM_NETWORK: offline
  TZ: UTC
jobs:
  original_positions:
    runs-on: ubuntu-latest
    timeout-minutes: 105
    defaults:
      run:
        shell: bash
