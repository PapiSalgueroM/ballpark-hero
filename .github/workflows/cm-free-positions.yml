          git show -s --format=%P HEAD > "$out/parents.txt"
          test "$(cat "$out/parents.txt")" = "$EXPECTED_PARENT"
          git diff --exit-code "$EXPECTED_PARENT" HEAD -- . ':!docs/**' ':!.github/workflows/cm-free-positions.yml' ':!src/lib/clubManager.ts' ':!src/test/clubManagerPositionLive.test.ts' ':!scripts/qa/cmPosition.controls.json' ':!scripts/qa/runCmPositionControls.mjs' > "$out/direct-child-scope.log"
          git diff --exit-code "$BASE_SOURCE" HEAD -- . ':!docs/**' ':!.github/workflows/cm-free-positions.yml' ':!src/lib/clubManager.ts' ':!src/test/clubManagerPositionIntegration.test.ts' ':!src/lib/clubManagerPositions.ts' ':!src/test/clubManagerPositions.test.ts' ':!src/test/TacticsScreen.freePositions.test.tsx' ':!src/test/clubManagerPositionLive.test.ts' ':!scripts/qa/cmPosition.controls.json' ':!scripts/qa/runCmPositionControls.mjs' > "$out/original-application.log"
          test "$(git rev-parse HEAD:src/lib/clubManager.ts)" = 5a2f1b3bcc52c2e4f8008859b699fe80d35ed223
          test "$(git rev-parse HEAD:src/components/club-manager/TacticsScreen.tsx)" = 233cd8d7430147fd66182269859548ffe5fdce4f
          test "$(git rev-parse HEAD:src/hooks/useClubManager.ts)" = 65bc9bbb622c67fbbcb25c949038571bbdc8600a
          printf '%s  %s\n' \
            518f9be7ab031e8a4e922d65c4992d2e8e82f5ab0810e19abc6855907fa81f87 src/lib/clubManager.ts \
            494b50ff2e32fb0862340374f3f6182000f44c9aefbea9920b63531e7009a4fa src/components/club-manager/TacticsScreen.tsx \
            5eeafbeaf296adce0343d101d4c5213d12d6550e181a9af55a5dbd154452632c src/hooks/useClubManager.ts \
            d6a8abf9ba8793ba0e87148dc9bf90e3892b4c9055e2820688bcbe9a35b64d77 src/test/clubManagerPositionIntegration.test.ts \
            ba6a2ab6f4a220439dec9373ba3655c7a962abaa640cc8f47c206644df0407a7 src/lib/clubManagerPositions.ts \
            625ee402d0d506d82f03c7f8bb7b8f524b2a7b5a2bf3b83254607b2b6aec6ed3 src/test/clubManagerPositions.test.ts \
            1107a1ec8a496c65fd4c8653ccd239aa2cda2190945c56c6129d3985e59ed97d src/test/TacticsScreen.freePositions.test.tsx \
            f9fdacec90b4190da5405f72524c91f45ad1449ca78e0d0535225638af5d7b00 src/test/clubManagerPositionLive.test.ts \
