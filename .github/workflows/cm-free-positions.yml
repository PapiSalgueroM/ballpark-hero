            assert(/^[a-z0-9-]+$/.test(row.label)&&!labels.has(row.label));labels.add(row.label);
            const fault=row.label.endsWith('-fault'),all=row.label==='all-sixteen-healthy'||row.label==='all-sixteen-restored';
            assert.equal(row.exit,fault?1:0);assert.equal(row.passed,fault?0:all?16:1);assert.equal(row.failed,fault?1:0);assert.equal(row.pending,all?0:15);
            assert.equal(row.owned.length,fault?1:0);
            assert.equal(hash(dir+'/'+row.label+'.report.json'),row.reportSha256);assert.equal(hash(dir+'/'+row.label+'.log'),row.logSha256);assert.equal(hash(dir+'/'+row.label+'.transport'),row.transportSha256);
            assert.equal(fs.statSync(dir+'/'+row.label+'.transport').size,0);
          }
          for(const recipe of recipes)for(const phase of ['healthy','fault','restored'])assert(labels.has(recipe.id+'-'+phase));
          assert(labels.has('all-sixteen-healthy')&&labels.has('all-sixteen-restored'));
          const held=JSON.parse(fs.readFileSync(dir+'/input-holds.json','utf8'));assert.equal(held.allEqual,true);assert.equal(held.copies.length,18);
          fs.writeFileSync(out+'/copied-controls-admission.json',JSON.stringify({source:process.env.GITHUB_SHA,parent:process.env.EXPECTED_PARENT,runId:process.env.GITHUB_RUN_ID,attempt:process.env.GITHUB_RUN_ATTEMPT,processes:53,controls:17,actualRawReportsAndLogsBound:true,markerlessCaseOnly:['kickoff-current-alias','read-career-instead-of-live'],sourceRows:held.sourceRows,dependencyRows:held.dependencyRows,applicationQualified:false,balanceQualified:false,uiIntegrated:false},null,2)+'\n',{flag:'wx'});
          NODE
          printf '%s\n' "$classifier" > "$out/controls-classifier.exit";test "$classifier" -eq 0
          test ! -s "$out/controls.transport";test ! -s "$out/controls-classifier.transport"
      - name: Always preserve all raw results and physical holds
        if: always()
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/cm-free-positions-qualification";mkdir -p "$out";failed=0
          for manifest in source-before dependencies;do
            if test -f "$out/$manifest.sha256";then sha256sum --check "$out/$manifest.sha256" > "$out/final-$manifest-hold.log" 2>&1 || failed=1;else failed=1;fi
          done
          git ls-files -z | sort -z > "$out/source-members.after" || failed=1
          git ls-files -z | sort -z | xargs -0 sha256sum > "$out/source-after.sha256" || failed=1
          if test -f "$out/source-members.before";then cmp "$out/source-members.before" "$out/source-members.after" || failed=1;else failed=1;fi
          if test -f "$out/source-before.sha256";then cmp "$out/source-before.sha256" "$out/source-after.sha256" || failed=1;else failed=1;fi
          if test -d node_modules;then
            find node_modules -path node_modules/.vite -prune -o -type f -print0 | sort -z > "$out/dependency-members.after" || failed=1
            find node_modules -path node_modules/.vite -prune -o -type f -print0 | sort -z | xargs -0 sha256sum > "$out/dependencies-end.sha256" || failed=1
          else failed=1;fi
          if test -f "$out/dependency-members.before";then cmp "$out/dependency-members.before" "$out/dependency-members.after" || failed=1;else failed=1;fi
          if test -f "$out/dependencies.sha256";then cmp "$out/dependencies.sha256" "$out/dependencies-end.sha256" || failed=1;else failed=1;fi
          git rev-parse HEAD > "$out/head-after.txt" || failed=1
          if test -f "$out/head.txt";then cmp "$out/head.txt" "$out/head-after.txt" || failed=1;else failed=1;fi
          git diff --exit-code HEAD > "$out/final-source-diff.log" || failed=1
          git status --porcelain --untracked-files=all > "$out/final-status.txt";test ! -s "$out/final-status.txt" || failed=1
          for transport in types tests tests-classifier profile profile-classifier live live-classifier ui ui-classifier controls controls-classifier;do test -f "$out/$transport.transport" && test ! -s "$out/$transport.transport" || failed=1;done
          while IFS= read -r -d '' file;do test ! -s "$file" || failed=1;done < <(find "$out" -type f -name '*.transport' -print0)
          printf '%s\n' "$failed" > "$out/final-holds.exit"
          (cd "$out";find . -type f ! -path ./evidence.sha256 -print0 | sort -z | xargs -0 sha256sum) > "$out/evidence.sha256"
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cm-free-positions-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cm-free-positions-qualification/
          if-no-files-found: error
          retention-days: 14
