name: NBA existing board startup diagnostic
on:
  push:
    branches: [codex/nba-2004-board-startup-diagnostic-20261105]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Bind unchanged candidate and source
        shell: bash
        run: |
          set -euo pipefail
          QA_OUT="$RUNNER_TEMP/nba-board-startup-diagnostic"
          export QA_OUT
          echo "QA_OUT=$QA_OUT" >> "$GITHUB_ENV"
          mkdir -p "$QA_OUT"
          test "$(git rev-parse HEAD^)" = 4e45ee3605589aeb5a268b2e6a902fb4ff71af92
          test "$(git rev-parse HEAD^^{tree})" = 5ffdee94dc4dac52922a3dc6d893abc317e578c0
          test "$(git diff --name-status HEAD^ HEAD)" = $'A\t.github/workflows/nba-2004-board-startup-diagnostic-20261105.yml'
          git ls-files -z | xargs -0 sha256sum > "$QA_OUT/source-before.sha256"
          git ls-files -s > "$QA_OUT/index-before.txt"
          git status --porcelain=v1 --untracked-files=all > "$QA_OUT/status-before.txt"
          test ! -s "$QA_OUT/status-before.txt"
          cp package-lock.json "$QA_OUT/lock-before.json"
          cat > "$QA_OUT/observeSpawn.cjs" <<'OBSERVER'
          const fs = require('node:fs');
          const path = require('node:path');
          const cp = require('node:child_process');
          const native = cp.spawnSync;
          cp.spawnSync = function (...args) {
            const result = native.apply(this, args);
            const argv = Array.isArray(args[1]) ? args[1] : [];
            if (argv.some(value => String(value).endsWith('usBoardFixture.test.tsx'))) {
              const dir = process.env.QA_OUT;
              const record = { command: args[0], args: argv, status: result.status, signal: result.signal,
                error: result.error ? { name: result.error.name, message: result.error.message } : null };
              fs.writeFileSync(path.join(dir, 'vitest-native.json'), JSON.stringify(record, null, 2) + '\n', { flag: 'wx' });
              fs.writeFileSync(path.join(dir, 'vitest.stdout.log'), result.stdout ?? '', { flag: 'wx' });
              fs.writeFileSync(path.join(dir, 'vitest.stderr.log'), result.stderr ?? '', { flag: 'wx' });
              const option = argv.find(value => String(value).startsWith('--outputFile.json='));
              if (option) {
                const source = String(option).slice('--outputFile.json='.length);
                if (fs.existsSync(source)) fs.writeFileSync(path.join(dir, 'vitest.report.json'), fs.readFileSync(source), { flag: 'wx' });
              }
            }
            return result;
          };
          require('node:module').syncBuiltinESMExports();
          OBSERVER
          node --check "$QA_OUT/observeSpawn.cjs"
      - name: Install held lock
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund > "$QA_OUT/npm-ci.log" 2>&1
      - name: Preserve exact child diagnostics before old harness cleanup
        shell: bash
        run: |
          set +e
          set -uo pipefail
          export SIM_NETWORK=offline GIT_NO_LAZY_FETCH=1
          export NODE_OPTIONS="--require=$GITHUB_WORKSPACE/scripts/lib/offlineTransport.cjs --require=$QA_OUT/observeSpawn.cjs"
          export SIM_OFFLINE_RECEIPT="$QA_OUT/transport.log"
          : > "$SIM_OFFLINE_RECEIPT"
          node --unhandled-rejections=strict scripts/simUsBoardParity.mjs > "$QA_OUT/harness.log" 2>&1
          native_exit=$?
          printf '%s\n' "$native_exit" > "$QA_OUT/harness.exit"
          test -f "$QA_OUT/vitest-native.json" || exit 1
          test ! -s "$SIM_OFFLINE_RECEIPT" || exit 1
          printf '%s\n' 'Startup diagnostic only. No App or golden assertion changed; no legacy parity admission.' > "$QA_OUT/SCOPE.txt"
      - name: Always hold full source index lock and status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git ls-files -z | xargs -0 sha256sum > "$QA_OUT/source-after.sha256"
          git ls-files -s > "$QA_OUT/index-after.txt"
          git status --porcelain=v1 --untracked-files=all > "$QA_OUT/status-after.txt"
          cp package-lock.json "$QA_OUT/lock-after.json"
          cmp "$QA_OUT/source-before.sha256" "$QA_OUT/source-after.sha256"
          cmp "$QA_OUT/index-before.txt" "$QA_OUT/index-after.txt"
          cmp "$QA_OUT/lock-before.json" "$QA_OUT/lock-after.json"
          test ! -s "$QA_OUT/status-after.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nba-board-startup-diagnostic
          path: ${{ env.QA_OUT }}/
          if-no-files-found: error
          retention-days: 14
