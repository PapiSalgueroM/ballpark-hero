name: Report MLB playoff viewer baseline
on:
  push:
    branches: [codex/report-mlb-playoffs-baseline-v2-20261101]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: '1'
      SIM_NETWORK: offline
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Locked dependencies and source
        run: |
          mkdir evidence
          git rev-parse HEAD | tee evidence/head.txt
          test "$(git hash-object src/components/us-career/season/UsSeasonCentre.tsx)" = 5473657a332903ef9e2b5d349481e1242f6b66b4
          sha256sum package.json package-lock.json src/components/us-career/season/UsSeasonCentre.tsx src/test/mlbPlayoffReplay.test.tsx > evidence/holds.txt
          npm ci
      - name: App types
        run: node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee evidence/types.log
      - name: Original playoff viewer outcomes
        run: node_modules/.bin/vitest run src/test/mlbPlayoffReplay.test.tsx --reporter=verbose --reporter=json --outputFile=evidence/playoffs.json 2>&1 | tee evidence/playoffs.log
      - name: Source holds
        if: always()
        run: sha256sum --check evidence/holds.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mlb-playoffs-baseline-${{ github.run_id }}
          path: evidence/
          retention-days: 14
