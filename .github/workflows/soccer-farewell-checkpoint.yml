name: Soccer farewell checkpoint
on:
  push:
    branches: [codex/career-farewell-season]
    paths: [.github/workflows/soccer-farewell-checkpoint.yml, src/lib/soccerCareerFarewell.ts, src/lib/soccerCareerEngine.ts, src/pages/SoccerCareer.tsx, src/components/soccer-career/FarewellSeasonCard.tsx, src/test/soccerCareerFarewell.test.ts, src/test/soccerFarewellUi.test.tsx, src/test/soccerFarewellPage.test.tsx]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node_modules/.bin/tsc --noEmit -p tsconfig.app.json
      - run: node_modules/.bin/vitest run src/test/soccerCareerFarewell.test.ts src/test/soccerFarewellUi.test.tsx src/test/soccerFarewellPage.test.tsx --reporter=verbose
