name: Popular sport hubs fixed consumer verification
on:
  push:
    branches: [codex/popular-hub-fixed-20261103]
permissions:
  contents: read
concurrency:
  group: popular-hub-fixed-${{ github.ref }}
  cancel-in-progress: false
jobs:
  consumers:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: '1'
      SIM_NETWORK: offline
      TZ: UTC
      PARENT: e4ed78187235753ac65d26a69d7c99f44c23d131
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Hold exact Hub, App and two compatibility bodies
        run: |
          set -euo pipefail
          export QA_OUT="$RUNNER_TEMP/popular-hub-fixed"
          mkdir -p "$QA_OUT/sources" "$QA_OUT/transport" "$QA_OUT/arms"
          echo "QA_OUT=$QA_OUT" >> "$GITHUB_ENV"
          git rev-parse HEAD HEAD^{tree} > "$QA_OUT/source.txt"
          git diff --name-status "$PARENT" HEAD > "$QA_OUT/changed-paths.txt"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          import crypto from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          const out=process.env.QA_OUT,git=(...args)=>execFileSync('git',args,{encoding:'utf8'}).trim();
          const sha=file=>crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          const profile={"test":"src/test/hubReturnNavigation.test.tsx","testGit":"51a145157130dace6c0765f28dadd4a80459a3be","testSHA":"1260ed816fbcaf18a60d6d648918070bba6ca98be1d431de35de3b7e1067287d","target":"src/components/hub/HubExperience.tsx","copy":"src/components/hub/__qa_popular_original_HubExperience.tsx","alias":"@/components/hub/HubExperience","originalGit":"d002e000706b70fa88023ca5f8f3bcd99fefdbc8","productGit":"c72effc5697ec0d2812569479a9d465247855720","productSHA":"032caf7f78f3507d57c9ad323303ba8ccc1e4a5de0c2977d3e5a80d1d967471e","cases":[["Sport hub discovery return state opens the selected library from a shared URL on /soccer","HUB_URL_DIRECT_SOCCER"],["Sport hub discovery return state returns from a game to the chosen library on /soccer","HUB_URL_RETURN_SOCCER"],["Sport hub discovery return state opens the selected library from a shared URL on /pro-basketball","HUB_URL_DIRECT_BASKETBALL"],["Sport hub discovery return state returns from a game to the chosen library on /pro-basketball","HUB_URL_RETURN_BASKETBALL"],["Sport hub discovery return state opens the selected library from a shared URL on /pro-football","HUB_URL_DIRECT_FOOTBALL"],["Sport hub discovery return state returns from a game to the chosen library on /pro-football","HUB_URL_RETURN_FOOTBALL"],["Sport hub discovery return state keeps every plain hub catalog and unrelated storage unchanged",null],["Sport hub discovery return state treats an unknown filter as all games without rewriting unrelated URL values",null]],"oldRaw":{"direct-pro-basketball.json":"57b351eb4295e713acc1dcd98823fe292c933b529db997c300ccc2c3eafcdb0c","direct-pro-football.json":"070835006990283eab76e454d9cfaa75df992da603af75706cab3c49d3b339d0","direct-soccer.json":"038b90af1aae900b9826cbe18d82c2220d36246094b7bbfe4c1f343b9e530219","invalid.json":"797aa79a3e7dc8f1d4fbe9056990bbca21e2182ad83ba2db379ebff9eef7fbf6","plain.json":"6e137676f95a4f308120d5909bb7415842bce7b59d9f053baf59fe4898ae8609","return-pro-basketball.json":"968e64c9775dc0804fe780e7417de9fd6bd82ab3efc1c51d69c2d6f1c5ea32b8","return-pro-football.json":"f1276eed728806e4fbbda9111598ed1b02b1503ebd52f49130191850dcf0ccf2","return-soccer.json":"0c32fb2793db441fd10a6c1699c8adb245c7a8466d2acfd36278ecd7a19e5d5e"}};
          const appGit='fe15993fafb4b6cdfa9efa359d47e80600634c08',appSHA='f45984fdd7a50e7915696d6ac1bc48525ccd39fffafddd6971cf55b2f6384401';
          assert(/^[a-f0-9]{40}$/.test(appGit)&&/^[a-f0-9]{64}$/.test(appSHA),'Actual App product must be bound before activation');
          assert.equal(git('rev-parse','HEAD^'),process.env.PARENT);
          assert.equal(git('rev-parse',process.env.PARENT+'^{tree}'),'e8813eda2b927b524ee0804bcaea99136564d0f6');
          const workflow='.github/workflows/popular-hub-fixed-20261103.yml';
          const changed=['A\t'+workflow,'M\tsrc/App.tsx','M\t'+profile.target,'M\tscripts/simHubExperience.mjs','M\tscripts/qa/hubs994.outcomes.tsx'].sort();
          assert.deepEqual(fs.readFileSync(path.join(out,'changed-paths.txt'),'utf8').trim().split('\n').sort(),changed);
          const products={
            [profile.target]:{git:profile.productGit,sha:profile.productSHA},
            'src/App.tsx':{git:appGit,sha:appSHA},
            'scripts/simHubExperience.mjs':{git:'8df3c38e9ba3b634ac9047db5b4d0d0c1ec91926',sha:'6cbd8edd8f137399048563d37dd5a500cd72a440a690e46fbba9391a94c6cecd'},
            'scripts/qa/hubs994.outcomes.tsx':{git:'c3f4d1e392f04bda69e7a8cbed7809884254b89a',sha:'8b566cc128b5d556d74fd9217c1423a47fd8665f7408c48232e75b703bf7e956'}
          };
          const originals={
            [profile.target]:profile.originalGit,'src/App.tsx':'79da1b8cf2de7870ea216703d0a1a56fceb69673',
            'scripts/simHubExperience.mjs':'8c44c3755b9f20d2095dce08b87d9c3a08b2c13f',
            'scripts/qa/hubs994.outcomes.tsx':'419ae6c88dfdcbcc4368cb7cdda795fe28315d23'
          };
          for(const [file,pin]of Object.entries(products)){
            assert.equal(git('rev-parse','HEAD:'+file),pin.git,file);assert.equal(sha(file),pin.sha,file);
            assert.equal(git('rev-parse',process.env.PARENT+':'+file),originals[file],file);
          }
          assert.equal(git('rev-parse','HEAD:'+profile.test),profile.testGit);assert.equal(sha(profile.test),profile.testSHA);
          assert.equal(git('rev-parse','HEAD:vitest.config.ts'),'ed2a9dc677f77dfe95c061064eeff5782b856864');
          assert(!fs.existsSync(profile.copy),'No existing source copy can be replaced');
          assert(!fs.existsSync('sport-hubs-artifacts/behavior'),'No preexisting generated Hub outcomes can be replaced');
          const tracked=execFileSync('git',['ls-files','-z'],{encoding:'utf8'}).split('\0').filter(Boolean);
          assert.equal(tracked.length,5678);
          for(const file of [workflow,profile.test,'vitest.config.ts',...Object.keys(products)]){
            const dest=path.join(out,'sources',file);fs.mkdirSync(path.dirname(dest),{recursive:true});fs.copyFileSync(file,dest);
          }
          fs.writeFileSync(path.join(out,'profile.json'),JSON.stringify(profile,null,2)+'\n');
          fs.writeFileSync(path.join(out,'association.json'),JSON.stringify({
            source:git('rev-parse','HEAD'),tree:git('rev-parse','HEAD^{tree}'),parent:process.env.PARENT,products,originals,
            profile,trackedFiles:tracked.length,
            scope:'Hub component consumer8, exact whole-original6owned/2held, restored8 and existing seven Hub outcomes with eight copied-source controls. App is source-held only; no native App scroll, build, snapshot, browser or full-suite pass.',
            deferredReaders:'simHubs and simHubDepth read public snapshots and are reserved for normal-build qualification.'
          },null,2)+'\n');
          NODE
          git ls-files -z | sort -z | xargs -0 sha256sum > "$QA_OUT/source-before.sha256"
          test "$(wc -l < "$QA_OUT/source-before.sha256")" -eq 5678
          git status --porcelain=v1 --untracked-files=all > "$QA_OUT/status-before.txt"
          test ! -s "$QA_OUT/status-before.txt"
      - name: Install unchanged locked dependencies
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund > "$QA_OUT/install.log" 2>&1
          git diff --exit-code -- package.json package-lock.json
      - name: Proper application types
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$GITHUB_WORKSPACE/scripts/lib/offlineTransport.cjs"
          export SIM_OFFLINE_RECEIPT="$QA_OUT/transport/types.log"
          : > "$SIM_OFFLINE_RECEIPT"
          set +e
          node_modules/.bin/tsc --noEmit -p tsconfig.app.json > "$QA_OUT/types.log" 2>&1
          code=$?
          set -e
          printf '%s\n' "$code" > "$QA_OUT/types.exit"
          cat "$QA_OUT/types.log"
          test "$code" -eq 0
          test ! -s "$SIM_OFFLINE_RECEIPT"
      - name: Fixed, whole-original and restored Hub consumers
        timeout-minutes: 20
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$GITHUB_WORKSPACE/scripts/lib/offlineTransport.cjs"
          export SIM_OFFLINE_RECEIPT="$QA_OUT/transport/consumer-caller.log"
          : > "$SIM_OFFLINE_RECEIPT"
          cat > "$QA_OUT/qualify-consumers.mjs" <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          import crypto from 'node:crypto';
          import { spawnSync,execFileSync } from 'node:child_process';
          const out=process.env.QA_OUT,p=JSON.parse(fs.readFileSync(path.join(out,'profile.json'),'utf8'));
          const hash=bytes=>crypto.createHash('sha256').update(bytes).digest('hex');
          const blob=bytes=>crypto.createHash('sha1').update(Buffer.concat([Buffer.from('blob '+bytes.length+'\0'),bytes])).digest('hex');
          const fixed=fs.readFileSync(p.target),original=execFileSync('git',['show',process.env.PARENT+':'+p.target]);
          assert.equal(hash(fixed),p.productSHA);assert.equal(blob(original),p.originalGit);assert.notDeepEqual(fixed,original);
          fs.writeFileSync(path.join(out,'fixed.tsx'),fixed);fs.writeFileSync(path.join(out,'whole-original.tsx'),original);
          const phases=[];
          function rawChecks(folder,old){
            const dir=path.join(folder,'raw');assert.deepEqual(fs.readdirSync(dir).sort(),Object.keys(p.oldRaw).sort());
            const held={'hub-fixture-unrelated':'{"unchanged":true}'};
            for(const name of Object.keys(p.oldRaw)){
              const bytes=fs.readFileSync(path.join(dir,name)),v=JSON.parse(bytes);
              if(old){assert.equal(hash(bytes),p.oldRaw[name],'Exact admitted original RAW '+name);continue;}
              if(name.startsWith('direct-')){
                assert.equal(v.observed.query,v.expected.query);assert.deepEqual(v.observed.visiblePaths,v.expected.paths);
                assert(v.observed.selectedFilter.startsWith('Daily puzzles'));
                const url=new URL(v.observed.location,'https://fixture.test');
                assert.equal(url.searchParams.get('filter'),'daily');assert.equal(url.searchParams.get('q'),v.expected.query);
                assert.equal(url.searchParams.get('from'),'fixture-menu');assert.deepEqual(v.observed.storage,held);
              }else if(name.startsWith('return-')){
                assert.equal(v.observed.query,v.expectedQuery);assert(v.observed.visiblePaths.includes(v.selected));
                assert(v.observed.selectedFilter.startsWith('Careers & sims'));
                const url=new URL(v.observed.location,'https://fixture.test');
                assert.equal(url.searchParams.get('filter'),'sim');assert.equal(url.searchParams.get('q'),v.expectedQuery);
                assert.deepEqual(url.searchParams.getAll('from'),['menu','second']);assert.deepEqual(v.observed.storage,held);
              }else{
                assert.equal(v.observations.length,3);
                for(const row of v.observations){assert.equal(row.observed.query,'');assert(row.observed.selectedFilter.startsWith('All games'));assert.deepEqual(row.observed.storage,held);}
                assert.equal(hash(bytes),p.oldRaw[name],'Plain and invalid state remain byte-identical');
              }
            }
          }
          function run(phase,old=false){
            const folder=path.join(out,'arms',phase);fs.mkdirSync(path.join(folder,'raw'),{recursive:true});
            const receipt=path.join(out,'transport',phase+'.log');fs.writeFileSync(receipt,'');
            const env={...process.env,HUB_LIBRARY_RAW:path.join(folder,'raw'),SIM_OFFLINE_RECEIPT:receipt};
            for(const key of ['NO_DOUBLE_SWAP','HUB_EXPERIENCE_CONTROL','HUBS_CONTROL','HUBDEPTH_CONTROL'])delete env[key];
            if(old)env.NO_DOUBLE_SWAP=JSON.stringify({[p.alias]:path.resolve(p.copy)});
            fs.writeFileSync(path.join(folder,'source-association.json'),JSON.stringify({
              phase,target:p.target,fixedSHA:hash(fs.readFileSync(p.target)),effectiveLeaf:old?p.copy:p.target,
              effectiveSHA:hash(fs.readFileSync(old?p.copy:p.target)),alias:old?JSON.parse(env.NO_DOUBLE_SWAP):null
            },null,2)+'\n');
            const child=spawnSync('node_modules/.bin/vitest',['run',p.test,'--maxWorkers=1','--minWorkers=1','--reporter=verbose','--reporter=json','--outputFile='+path.join(folder,'units.json')],
              {env,encoding:'utf8',timeout:600000,maxBuffer:16*1024*1024});
            const log=(child.stdout??'')+'\n'+(child.stderr??'');
            fs.writeFileSync(path.join(folder,'units.log'),log);fs.writeFileSync(path.join(folder,'units.exit'),String(child.status)+'\n');
            fs.writeFileSync(path.join(folder,'process.json'),JSON.stringify({status:child.status,signal:child.signal,error:child.error?{name:child.error.name,message:child.error.message}:null},null,2)+'\n');
            assert(!child.error&&!child.signal);assert.equal(fs.statSync(receipt).size,0);
            assert.doesNotMatch(log,/Unhandled (?:Error|Rejection)|Vitest caught \d+ unhandled|uncaughtException|unhandledRejection/);
            const r=JSON.parse(fs.readFileSync(path.join(folder,'units.json'),'utf8'));
            assert.equal(r.testResults.length,1);const file=r.testResults[0],rows=file.assertionResults;
            assert(file.name.replaceAll('\\','/').endsWith('/'+p.test));assert(!file.error&&!file.failureMessage&&!file.message);
            assert.equal(rows.length,8);assert.equal(new Set(rows.map(row=>row.fullName)).size,8);
            assert.deepEqual(rows.map(row=>row.fullName).sort(),p.cases.map(([name])=>name).sort());
            const strip=value=>String(value).replace(/\u001b\[[0-9;]*m/g,'');
            for(const row of rows){
              const marker=old&&p.cases.find(([name])=>name===row.fullName)[1],messages=(row.failureMessages??[]).map(strip);
              assert.equal(row.status,marker?'failed':'passed',row.fullName);
              if(marker){assert(messages.length>0);assert(messages.every(message=>message.includes(marker)&&message.includes('AssertionError')));
                assert(messages.every(message=>!/(?:SyntaxError|TypeError|ReferenceError|RangeError|Cannot find module|Failed to load)/.test(message)));}
              else assert.deepEqual(messages,[]);
            }
            assert.equal(r.numTotalTests,8);assert.equal(r.numFailedTests,old?6:0);assert.equal(r.numPassedTests,old?2:8);
            assert.equal(r.success,!old);assert.equal(child.status,old?1:0);assert.equal(file.status,old?'failed':'passed');
            const counters={};for(const key of ['numRuntimeErrorTestSuites','numUnhandledErrors']){
              counters[key]=Object.hasOwn(r,key)?r[key]:null;if(counters[key]!==null){assert.equal(typeof counters[key],'number');assert.equal(counters[key],0);}}
            for(const key of ['numPendingTests','numTodoTests','numPendingTestSuites'])if(Object.hasOwn(r,key))assert.equal(r[key],0);
            rawChecks(folder,old);assert.deepEqual(fs.readFileSync(p.target),fixed);if(old)assert.deepEqual(fs.readFileSync(p.copy),original);
            const result={phase,rows:8,nativeExit:child.status,passed:rows.filter(row=>row.status==='passed').map(row=>row.fullName),
              failed:rows.filter(row=>row.status==='failed').map(row=>row.fullName),counters,absentCounterMeaning:'UNKNOWN'};
            fs.writeFileSync(path.join(folder,'admission.json'),JSON.stringify(result,null,2)+'\n');phases.push(result);
          }
          run('fixed');assert(!fs.existsSync(p.copy));
          let copied=false;
          try{fs.writeFileSync(p.copy,original,{flag:'wx'});copied=true;assert.equal(blob(fs.readFileSync(p.copy)),p.originalGit);run('whole-original',true);}
          finally{
            if(copied){assert.deepEqual(fs.readFileSync(p.copy),original);fs.unlinkSync(p.copy);}
            assert.deepEqual(fs.readFileSync(p.target),fixed);
            fs.writeFileSync(path.join(out,'source-restoration.json'),JSON.stringify({exactFixed:fs.readFileSync(p.target).equals(fixed),fixedSHA:hash(fs.readFileSync(p.target)),copyAbsent:!fs.existsSync(p.copy)},null,2)+'\n');
          }
          run('restored');
          for(const name of Object.keys(p.oldRaw))assert.deepEqual(fs.readFileSync(path.join(out,'arms/fixed/raw',name)),fs.readFileSync(path.join(out,'arms/restored/raw',name)),'Restored RAW bytes '+name);
          fs.writeFileSync(path.join(out,'consumer-admission.json'),JSON.stringify({status:'ACTUAL_FIXED8_ORIGINAL6OWNED2HELD_RESTORED8',phases,rawFiles:24,
            limits:'Component Router/DOM outcomes only; no native App scroll, game playback, build, browser or full-suite credit.'},null,2)+'\n');
          console.log('Hub consumers: fixed8PASS, whole-original6owned/2held, restored8PASS; all eight restored RAW bytes exact.');
          NODE
          set +e
          node "$QA_OUT/qualify-consumers.mjs" > "$QA_OUT/consumer-caller.log" 2>&1
          code=$?
          set -e
          printf '%s\n' "$code" > "$QA_OUT/consumer-caller.exit"
          cat "$QA_OUT/consumer-caller.log"
          test "$code" -eq 0
          test ! -s "$SIM_OFFLINE_RECEIPT"
      - name: Existing normal Hub outcomes and all eight effective source controls
        timeout-minutes: 15
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$GITHUB_WORKSPACE/scripts/lib/offlineTransport.cjs"
          export SIM_OFFLINE_RECEIPT="$QA_OUT/transport/sim-caller.log"
          : > "$SIM_OFFLINE_RECEIPT"
          cat > "$QA_OUT/qualify-sim.mjs" <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          import crypto from 'node:crypto';
          import { spawnSync } from 'node:child_process';
          const root=process.cwd(),out=process.env.QA_OUT,generated=path.join(root,'sport-hubs-artifacts','behavior');
          assert.equal(path.dirname(generated),path.join(root,'sport-hubs-artifacts'));assert(!fs.existsSync(generated));
          const source=fs.readFileSync('src/components/hub/HubExperience.tsx');
          const expected={normal:[],catalog:[0],daily:[1],sim:[2],search:[3,4,5],reset:[4],random:[5],saves:[6],focus:[3,4]};
          const phases=[];
          for(const [label,mode]of [['normal',''],['all-controls','all']]){
            const folder=path.join(out,'sim-'+label),receipt=path.join(out,'transport','sim-'+label+'.log');
            fs.mkdirSync(folder,{recursive:true});fs.writeFileSync(receipt,'');
            const env={...process.env,HUB_EXPERIENCE_CONTROL:mode,SIM_OFFLINE_RECEIPT:receipt};
            delete env.NO_DOUBLE_SWAP;delete env.HUBS_CONTROL;delete env.HUBDEPTH_CONTROL;
            let child;
            try{
              child=spawnSync(process.execPath,['scripts/simHubExperience.mjs'],{env,encoding:'utf8',timeout:600000,maxBuffer:16*1024*1024});
              fs.writeFileSync(path.join(folder,'stdout.log'),child.stdout??'');fs.writeFileSync(path.join(folder,'stderr.log'),child.stderr??'');
              fs.writeFileSync(path.join(folder,'native.exit'),String(child.status)+'\n');
              fs.writeFileSync(path.join(folder,'process.json'),JSON.stringify({status:child.status,signal:child.signal,error:child.error?{name:child.error.name,message:child.error.message}:null},null,2)+'\n');
              if(fs.existsSync(generated))fs.cpSync(generated,path.join(folder,'outcomes'),{recursive:true,errorOnExist:true,force:false});
              assert(!child.error&&!child.signal);assert.equal(child.status,0);
              assert.equal(fs.statSync(receipt).size,0);
              const log=(child.stdout??'')+'\n'+(child.stderr??'');
              assert.doesNotMatch(log,/SIM_OFFLINE_BLOCK|Unhandled (?:Error|Rejection)|SyntaxError|TypeError|ReferenceError|Cannot find module|not wrapped in act/);
              const summary=JSON.parse(fs.readFileSync(path.join(folder,'outcomes/verified-summary.json'),'utf8'));
              const modes=mode?Object.keys(expected):['normal'];
              assert.deepEqual(summary.outcomes.map(row=>row.mode),modes);
              assert.equal(summary.sourceSha256,crypto.createHash('sha256').update(source).digest('hex'));
              for(const name of modes){
                const report=JSON.parse(fs.readFileSync(path.join(folder,'outcomes',name+'.json'),'utf8'));
                assert.equal(report.total,7);assert.equal(report.rows.length,7);
                assert(report.rows.every(row=>['PASS','FAIL'].includes(row.status)));
                const rejected=report.rows.flatMap((row,i)=>row.status==='FAIL'?[i]:[]);
                assert.deepEqual(rejected,expected[name],name+' exact meaningful rejection vector');
                assert.equal(report.failed,rejected.length);assert.equal(report.passed,7-rejected.length);
                for(const row of report.rows.filter(row=>row.status==='FAIL'))assert.equal(row.error.name,'AssertionError');
                const held=summary.outcomes.find(row=>row.mode===name);
                assert.equal(held.total,7);assert.equal(held.passed,7-rejected.length);assert.deepEqual(held.rejected,expected[name]);assert.deepEqual(held.expected,expected[name]);
              }
              phases.push({phase:label,nativeExit:child.status,modes,exactVectors:expected});
            }finally{
              if(fs.existsSync(generated)){assert.equal(path.dirname(generated),path.join(root,'sport-hubs-artifacts'));fs.rmSync(generated,{recursive:true});}
              assert.deepEqual(fs.readFileSync('src/components/hub/HubExperience.tsx'),source,'Product held after generated outcome cleanup');
            }
          }
          fs.writeFileSync(path.join(out,'sim-admission.json'),JSON.stringify({status:'ACTUAL_NORMAL7_AND_ALL8_EFFECTIVE_SOURCE_CONTROLS',phases,
            limits:'Seven existing component cases across normal and copied-source control modes, not new ordinary test identities, native input, snapshots or built App evidence.'},null,2)+'\n');
          console.log('Hub normal7PASS and all eight source controls rejected exactly their intended outcomes; source and owned cleanup held.');
          NODE
          set +e
          node "$QA_OUT/qualify-sim.mjs" > "$QA_OUT/sim-caller.log" 2>&1
          code=$?
          set -e
          printf '%s\n' "$code" > "$QA_OUT/sim-caller.exit"
          cat "$QA_OUT/sim-caller.log"
          test "$code" -eq 0
          test ! -s "$SIM_OFFLINE_RECEIPT"
      - name: Preserve source bytes, cleanup and finite evidence
        id: retain
        if: always()
        run: |
          set -uo pipefail
          git diff --exit-code HEAD > "$QA_OUT/source-diff.txt"
          diff_exit=$?
          git ls-files -z | sort -z | xargs -0 sha256sum > "$QA_OUT/source-after.sha256"
          map_exit=$?
          cmp "$QA_OUT/source-before.sha256" "$QA_OUT/source-after.sha256" > "$QA_OUT/source-compare.log" 2>&1
          compare_exit=$?
          sha256sum --check "$QA_OUT/source-before.sha256" > "$QA_OUT/source-held.log" 2>&1
          held_exit=$?
          git status --porcelain=v1 --untracked-files=all > "$QA_OUT/status-after.txt"
          status_exit=$?
          cmp "$QA_OUT/status-before.txt" "$QA_OUT/status-after.txt" > "$QA_OUT/status-compare.log" 2>&1
          status_compare_exit=$?
          transport_exit=0
          for receipt in "$QA_OUT"/transport/*.log; do test -f "$receipt" && test ! -s "$receipt" || transport_exit=1; done
          printf '{"diff":%s,"map":%s,"compare":%s,"held":%s,"status":%s,"statusCompare":%s,"transport":%s}\n' "$diff_exit" "$map_exit" "$compare_exit" "$held_exit" "$status_exit" "$status_compare_exit" "$transport_exit" > "$QA_OUT/closure.json"
          bytes=$(du -sb "$QA_OUT" | cut -f1)
          printf '%s\n' "$bytes" > "$QA_OUT/artifact-bytes.txt"
          test "$bytes" -lt 150000000 || exit 1
          echo 'artifact_ok=true' >> "$GITHUB_OUTPUT"
          test "$diff_exit" -eq 0 && test "$map_exit" -eq 0 && test "$compare_exit" -eq 0 && test "$held_exit" -eq 0 && test "$status_exit" -eq 0 && test "$status_compare_exit" -eq 0 && test "$transport_exit" -eq 0
      - uses: actions/upload-artifact@v4
        if: always() && steps.retain.outputs.artifact_ok == 'true'
        with:
          name: popular-hub-fixed-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/popular-hub-fixed
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
