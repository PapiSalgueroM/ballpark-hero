name: Soccer Career loyalty early application gate
on:
  push:
    branches: [codex/soccer-career-loyalty-20261027]
    paths: [.github/workflows/soccer-career-loyalty.yml]
permissions:
  contents: read
concurrency:
  group: soccer-career-loyalty-early-${{ github.ref }}
  cancel-in-progress: false
jobs:
  application-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CI: '1'
      SIM_NETWORK: offline
      OUT: ${{ github.workspace }}/soccer-loyalty-early-artifacts
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Retain exact inputs and install locked dependencies
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          git rev-parse HEAD > "$OUT/source-head.txt"
          git rev-parse HEAD^{tree} > "$OUT/source-tree.txt"
          git ls-files -z -- src scripts .github/workflows index.html package.json package-lock.json tsconfig.app.json | sort -z | xargs -0 sha256sum > "$OUT/source-before.sha256"
          git archive --format=tar HEAD -- scripts/simSoccerCareerLoyalty.mjs src/components/soccer-career/SoccerCareerProgramme.tsx src/components/soccer-career/SoccerOfferReview.tsx src/lib/soccerCareerEngine.ts src/lib/soccerCareerLoyalty.ts src/lib/soccerCareerProgramme.ts src/lib/soccerOfferReview.ts src/pages/SoccerCareer.tsx src/test/soccerCareerLoyalty.engine.test.ts src/test/soccerCareerLoyalty.review.test.tsx src/test/soccerCareerLoyalty.test.ts .github/workflows/soccer-career-loyalty.yml package.json package-lock.json tsconfig.app.json > "$OUT/selected-source.tar"
          npm ci
      - name: Correct application type gate
        run: |
          set -euo pipefail
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee "$OUT/types.log"
      - name: Actual new pure engine and review cases
        run: |
          set -euo pipefail
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" npm test -- --run src/test/soccerCareerLoyalty.test.ts src/test/soccerCareerLoyalty.engine.test.ts src/test/soccerCareerLoyalty.review.test.tsx --maxWorkers=1 --no-file-parallelism --reporter=default --reporter=json --outputFile="$OUT/unit.json" 2>&1 | tee "$OUT/unit.log"
      - name: Always verify tracked source holds
        if: always()
        run: |
          set -euo pipefail
          if test -f "$OUT/source-before.sha256"; then
            sha256sum -c "$OUT/source-before.sha256" > "$OUT/source-held.log"
          fi
          git diff --exit-code HEAD -- src scripts .github/workflows index.html package.json package-lock.json tsconfig.app.json
      - name: Always retain original gate observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soccer-loyalty-early-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          path: soccer-loyalty-early-artifacts/
