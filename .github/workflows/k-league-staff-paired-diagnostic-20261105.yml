      - name: Bind two exact source trees and the sole diagnostic workflow
        run: |
          set -euo pipefail
          node "$STAFF_CONTROLLER" preflight > "$QA_OUT/logs/preflight.stdout.log" 2> "$QA_OUT/logs/preflight.stderr.log"
          cp "$GITHUB_WORKSPACE/qa-source/.github/workflows/k-league-staff-paired-diagnostic-20261105.yml" "$QA_OUT/workflow.yml"
      - name: Install held dependencies separately without changing either source
        run: |
          set -euo pipefail
          test "$(bun --version)" = 1.4.4
          bun --version > "$QA_OUT/logs/bun-version.log"
          node --version > "$QA_OUT/logs/node-version.log"
          for role in main current; do
            (
              cd "$GITHUB_WORKSPACE/source-$role"
              set +e
              bun install --frozen-lockfile > "$QA_OUT/logs/$role-install.stdout.log" 2> "$QA_OUT/logs/$role-install.stderr.log"
              native_exit=$?
              printf '%s\n' "$native_exit" > "$QA_OUT/logs/$role-install.exit" || exit 1
              test "$native_exit" = 0 || exit "$native_exit"
              set -e
              node -p "JSON.stringify({router:require('react-router-dom/package.json').version,vite:require('vite/package.json').version,rollup:JSON.parse(require('fs').readFileSync('node_modules/rollup/package.json','utf8')).version,esbuild:require('esbuild/package.json').version,typescript:require('typescript/package.json').version})" > "$QA_OUT/logs/$role-dependency-versions.json"
              git diff --exit-code HEAD -- package.json package-lock.json bun.lock bun.lockb
            )
          done
      - name: Proper types and exactly four unchanged default staff replays
        run: |
          set -euo pipefail
          set +e
          node "$STAFF_CONTROLLER" run > "$QA_OUT/logs/controller.stdout.log" 2> "$QA_OUT/logs/controller.stderr.log"
          native_exit=$?
          printf '%s\n' "$native_exit" > "$QA_OUT/controller.exit" || exit 1
          exit "$native_exit"
      - name: Hold all three source trees and every existing silent receipt
        if: always()
        run: |
          set -euo pipefail
          set +e
          node "$STAFF_CONTROLLER" hold > "$QA_OUT/logs/hold.stdout.log" 2> "$QA_OUT/logs/hold.stderr.log"
          native_exit=$?
          printf '%s\n' "$native_exit" > "$QA_OUT/hold.exit" || exit 1
          exit "$native_exit"
      - name: Pack bounded complete output or fatal diagnostic
        id: pack
        if: always()
        run: |
          set +e
          set -uo pipefail
          archive="$RUNNER_TEMP/k-league-staff-paired-diagnostic-evidence.tar.gz"
          tar -czf "$archive" -C "$QA_OUT" . > "$RUNNER_TEMP/k-league-staff-paired-diagnostic-pack.log" 2>&1
          pack_exit=$?
          printf '%s\n' "$pack_exit" > "$QA_OUT/pack-native.exit" || exit 1
          if [[ "$pack_exit" == 0 && -f "$archive" && "$(stat -c %s "$archive")" -le 50000000 ]]; then
            sha256sum "$archive" > "$archive.sha256" || exit 1
            printf 'archive=%s\n' "$archive" >> "$GITHUB_OUTPUT" || exit 1
            exit 0
          fi
          printf '%s\n' 'DIAGNOSTIC_ONLY_NO_COMPLETE_OUTPUT_PROOF: full pack failed or exceeded50000000bytes' > "$QA_OUT/DIAGNOSTIC-ONLY.txt" || exit 1
          cp "$RUNNER_TEMP/k-league-staff-paired-diagnostic-pack.log" "$QA_OUT/pack.log" || exit 1
          diagnostic="$RUNNER_TEMP/k-league-staff-paired-diagnostic-diagnostic.tar.gz"
          diagnostic_dir="$RUNNER_TEMP/k-league-staff-paired-diagnostic-diagnostic"
          mkdir -p "$diagnostic_dir/logs" "$diagnostic_dir/transport" || exit 1
          find "$QA_OUT" -maxdepth 1 -type f ! -name '*.tar.gz' ! -name '*.tgz' -exec cp '{}' "$diagnostic_dir/" \; || exit 1
          cp -R "$QA_OUT/logs/." "$diagnostic_dir/logs/" || exit 1
          cp -R "$QA_OUT/transport/." "$diagnostic_dir/transport/" || exit 1
          for folder in roles; do if test -d "$QA_OUT/$folder"; then cp -R "$QA_OUT/$folder" "$diagnostic_dir/" || exit 1; fi; done
          tar -czf "$diagnostic" -C "$diagnostic_dir" . || exit 1
          test "$(stat -c %s "$diagnostic")" -le 50000000 || exit 1
          sha256sum "$diagnostic" > "$diagnostic.sha256" || exit 1
          printf 'archive=%s\n' "$diagnostic" >> "$GITHUB_OUTPUT" || exit 1
          exit 1
