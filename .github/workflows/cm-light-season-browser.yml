name: Club Manager Light season bounded browser
on:
  push:
    branches: [codex/cm-light-season-browser-v2-20261029]
    paths:
      - .github/workflows/cm-light-season-browser.yml
      - src/lib/clubManager.ts
      - src/pages/ClubManager.tsx
      - src/components/club-manager/TrainingScreen.tsx
      - src/components/club-manager/IndividualLightSeason.tsx
      - src/test/clubManagerLightSeason.test.tsx
      - src/test/clubManagerLightSeasonMounted.test.tsx
      - scripts/qa/buildCmLightSeasonFixedObserver.mjs
      - scripts/qa/cmLightSeasonFirstPositive.mjs
      - 'qa/cm-light-season-v1/**'
      - scripts/qa/playCmLightSeason.mjs
permissions:
  contents: read
concurrency:
  group: cm-light-browser-${{ github.sha }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  build-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: '1'
      SIM_NETWORK: offline
      CAREER_SEASON_LOCAL_ONLY: '1'
      CM_LIGHT_FIRST_POSITIVE_OUT: ${{ github.workspace }}/cm-light-browser-artifacts
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Exact PRE-BS family, complete tree and admitted first positive
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = codex/cm-light-season-browser-v2-20261029
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-list --parents -n 1 HEAD | wc -w)" = 2
          test "$(git rev-parse HEAD^)" = 11aa2a6ef34c3cda3d2d88d95b2fd7d41fbbcd9e
          test "$(git rev-parse HEAD^^{tree})" = bf5e6d0a486f81f3310af7932111bae57b241008
          mkdir -p "$CM_LIGHT_FIRST_POSITIVE_OUT/build"
          git rev-parse HEAD HEAD^{tree} > "$CM_LIGHT_FIRST_POSITIVE_OUT/head-tree.txt"
          git archive --format=tar HEAD > "$CM_LIGHT_FIRST_POSITIVE_OUT/source.tar"
          git ls-tree -rl HEAD > "$CM_LIGHT_FIRST_POSITIVE_OUT/source-tree.txt"
          git ls-files -z | sort -z | xargs -0 sha256sum > "$CM_LIGHT_FIRST_POSITIVE_OUT/tracked-before.sha256"
          git ls-remote origin refs/heads/main | cut -f 1 > "$CM_LIGHT_FIRST_POSITIVE_OUT/main-at-start.txt"
          test "$(cat "$CM_LIGHT_FIRST_POSITIVE_OUT/main-at-start.txt")" = 5d1198389d436ddb615c816a1330d57296a6d9d2
          printf '%s  %s\n' 373489b9d75d5e08408904a13e5a0908541b71665e9fa395ef951658d6290ca3 qa/cm-light-season-v1/BUILD-SOURCE.json | sha256sum --check
          node --check scripts/qa/playCmLightSeason.mjs
          node --check scripts/qa/cmLightSeasonFirstPositive.mjs
          node --input-type=module - <<'NODE' > "$CM_LIGHT_FIRST_POSITIVE_OUT/source-pins.log" 2>&1
          import fs from 'node:fs';import assert from 'node:assert/strict';import{createHash}from'node:crypto';import{execFileSync}from'node:child_process';
          const m=JSON.parse(fs.readFileSync('qa/cm-light-season-v1/BUILD-SOURCE.json','utf8'));
          const sha=b=>createHash('sha256').update(b).digest('hex'),git=b=>createHash('sha1').update(Buffer.from('blob '+b.length+'\0')).update(b).digest('hex');
          assert.equal(m.files.length,49);assert.equal(new Set(m.files.map(f=>f.path)).size,49);
          for(const f of m.files){const b=fs.readFileSync(f.path);assert.equal(b.length,f.bytes,'Source bytes '+f.path);assert.equal(sha(b),f.sha256,'Source SHA '+f.path);assert.equal(git(b),f.gitBlob,'Source Git '+f.path);}
          const listing=ref=>new Map(execFileSync('git',['ls-tree','-rlz',ref],{encoding:'utf8'}).split('\0').filter(Boolean).map(row=>{const match=row.match(/^(\d+) (\w+) ([a-f0-9]+)\s+(\d+)\t([\s\S]+)$/);assert(match,'Native tree row');return[match[5],{mode:match[1],type:match[2],gitBlob:match[3],bytes:Number(match[4])}];}));
          const before=listing('HEAD^'),after=listing('HEAD');assert.equal(before.size,5396);assert.equal(after.size,5410);
          const delta=[],held=[];for(const [name,value] of before){assert(after.has(name),'No deleted parent path');const next=after.get(name);if(JSON.stringify(next)===JSON.stringify(value))held.push(name);else delta.push('M\t'+name);}for(const name of after.keys())if(!before.has(name))delta.push('A\t'+name);
          assert.deepEqual(delta.sort(),[...m.allowedDelta].sort(),'Exact17-path delta');assert.equal(held.length,5393);assert.equal(delta.filter(x=>x.startsWith('M\t')).length,3);assert.equal(delta.filter(x=>x.startsWith('A\t')).length,14);assert([...after.values()].every(x=>x.type==='blob'),'Regular file bodies');assert(delta.every(x=>after.get(x.slice(2)).mode==='100644'),'Owned delta file modes');
          const p=m.priorPositivePrerequisite;assert.equal(p.status,'ROOT_ADMITTED_ACTUAL_22_METHOD3_COPIED3_BUILD15_CAPS15','Actual Root prerequisite not bound');assert.match(p.rootAdmissionSHA256||'',/^[a-f0-9]{64}$/);assert.equal(p.custodianAdmissionSHA256,'1dccd733d1d937a8730ceea25739919d1f3dd5324b93d4891d912a62ab40ec58');assert.equal(p.head,'adfe42c1e2e2e460f5d81ce994dc3ac2086fcca0');assert.deepEqual(p.required,{healthy:22,methodWitnesses:3,copiedMethodControls:3,strictHistoryCopied:1,readers:15,roundedCaps:15});assert.deepEqual(m.currentHealthyRequired,{healthyCases:22,methodWitnesses:3,copiedMethodControls:3,strictHistoryCopied:1,rawExit:0,noInfra:true,beforeBuild:true,caseBodiesHeld:true,producerHeld:true});
          fs.writeFileSync(process.env.CM_LIGHT_FIRST_POSITIVE_OUT+'/tree-source-admission.json',JSON.stringify({status:'EXACT_SOURCE_AND_PRIOR_ONLY_ROOT_POSITIVE_BOUND',files:m.files,delta,heldParentBodies:held.length,priorPositivePrerequisite:p,currentHealthyRequired:m.currentHealthyRequired,scope:m.scope},null,2)+'\n');console.log('CM_LIGHT_BROWSER_SOURCE: exact selected bodies,17-path tree and Root actual prerequisite bound');
          NODE
          cat "$CM_LIGHT_FIRST_POSITIVE_OUT/source-pins.log"
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/qa/cmLightSeasonFirstPositive.mjs source > "$CM_LIGHT_FIRST_POSITIVE_OUT/held-positive-source.log" 2>&1
          cat "$CM_LIGHT_FIRST_POSITIVE_OUT/held-positive-source.log"
      - name: Install locked dependencies
        run: |
          set -euo pipefail
          echo '127.0.0.1 flawuiqbvjobmkfkauhw.supabase.co' | sudo tee -a /etc/hosts
          npm ci 2>&1 | tee "$CM_LIGHT_FIRST_POSITIVE_OUT/npm-ci.log"
      - name: Real app types before current healthy tests
        run: |
          set -euo pipefail
          set +e
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node_modules/.bin/tsc --noEmit -p tsconfig.app.json > "$CM_LIGHT_FIRST_POSITIVE_OUT/types.log" 2>&1
          actual_exit=$?
          set -e
          printf '%s\n' "$actual_exit" > "$CM_LIGHT_FIRST_POSITIVE_OUT/types.exit"
          cat "$CM_LIGHT_FIRST_POSITIVE_OUT/types.log"
          test "$actual_exit" = 0
      - name: Current App3 twenty-two healthy cases and method witnesses
        id: healthy
        run: |
          set -euo pipefail
          set +e
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/qa/cmLightSeasonFirstPositive.mjs healthy > "$CM_LIGHT_FIRST_POSITIVE_OUT/healthy-admission.log" 2>&1
          actual_exit=$?
          set -e
          printf '%s\n' "$actual_exit" > "$CM_LIGHT_FIRST_POSITIVE_OUT/healthy-admission.exit"
          cat "$CM_LIGHT_FIRST_POSITIVE_OUT/healthy-admission.log"
          test "$actual_exit" = 0
          grep -Fx 'CM_LIGHT_FIRST_POSITIVE healthy: HEALTHY_22_PASS_FIRST_POSITIVE_ONLY' "$CM_LIGHT_FIRST_POSITIVE_OUT/healthy-admission.log" > /dev/null
          grep -Fx 'CM_LIGHT_METHOD_WITNESSES:3 actual witnesses;3 changed COPIED method observations refused and same-copy readmitted.' "$CM_LIGHT_FIRST_POSITIVE_OUT/healthy-admission.log" > /dev/null
      - name: Detached build tools and compatible retained fonts
        env:
          FREE_KICK_FONT_CACHE: ${{ github.workspace }}/cm-light-browser-artifacts/build/font-cache
        run: |
          set -euo pipefail
          build_root="$RUNNER_TEMP/cm-light-first-positive-build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git worktree add --detach "$build_root" HEAD
          ln -s "$GITHUB_WORKSPACE/node_modules" "$build_root/node_modules"
          echo "CM_LIGHT_BUILD_ROOT=$build_root" >> "$GITHUB_ENV"
          browser_tools="$RUNNER_TEMP/cm-light-first-positive-tools-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$browser_tools"
          printf '{"private":true,"dependencies":{"playwright":"1.64.0"}}\n' > "$browser_tools/package.json"
          npm install --prefix "$browser_tools" --ignore-scripts --no-audit --no-fund 2>&1 | tee "$CM_LIGHT_FIRST_POSITIVE_OUT/build/browser-install.log"
          test ! -e node_modules/playwright
          test ! -e node_modules/playwright-core
          ln -s "$browser_tools/node_modules/playwright" node_modules/playwright
          ln -s "$browser_tools/node_modules/playwright-core" node_modules/playwright-core
          cp "$browser_tools/package.json" "$CM_LIGHT_FIRST_POSITIVE_OUT/build/browser-package.json"
          cp "$browser_tools/package-lock.json" "$CM_LIGHT_FIRST_POSITIVE_OUT/build/browser-package-lock.json"
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/cm-light-first-positive-chromium-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
          node "$browser_tools/node_modules/playwright/cli.js" install --with-deps chromium 2>&1 | tee "$CM_LIGHT_FIRST_POSITIVE_OUT/build/chromium.log"
          python -m pip install fonttools pillow 2>&1 | tee "$CM_LIGHT_FIRST_POSITIVE_OUT/build/python-tools.log"
          node scripts/qa/freeKickLab1070.mjs --prefetch-fonts-only 2>&1 | tee "$CM_LIGHT_FIRST_POSITIVE_OUT/build/font-prefetch.log"
      - name: Actual two-route SEO build after current healthy tests
        env:
          PRERENDER_ONLY: /club-manager,/whats-new
        run: |
          set -euo pipefail
          cd "$CM_LIGHT_BUILD_ROOT"
          mkdir -p "$CM_LIGHT_FIRST_POSITIVE_OUT/build/generation"
          git ls-files -z | sort -z | xargs -0 sha256sum > "$CM_LIGHT_FIRST_POSITIVE_OUT/build/tracked-before.sha256"
          for route in club-manager whats-new; do cp "public/$route/index.html" "$CM_LIGHT_FIRST_POSITIVE_OUT/build/generation/$route.before.html"; done
          cp scripts/data/lastmod.json "$CM_LIGHT_FIRST_POSITIVE_OUT/build/generation/lastmod.before.json"
          retain_generation() {
            git diff -- public scripts/data/lastmod.json > "$CM_LIGHT_FIRST_POSITIVE_OUT/build/generation/full.diff"
            for route in club-manager whats-new; do cp "public/$route/index.html" "$CM_LIGHT_FIRST_POSITIVE_OUT/build/generation/$route.after.html" || true; done
            cp scripts/data/lastmod.json "$CM_LIGHT_FIRST_POSITIVE_OUT/build/generation/lastmod.after.json" || true
          }
          trap retain_generation EXIT
          set +e
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" npm run build:seo > "$CM_LIGHT_FIRST_POSITIVE_OUT/build/build.log" 2>&1
          actual_exit=$?
          set -e
          printf '%s\n' "$actual_exit" > "$CM_LIGHT_FIRST_POSITIVE_OUT/build/build.exit"
          cat "$CM_LIGHT_FIRST_POSITIVE_OUT/build/build.log"
          test "$actual_exit" = 0
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > "$CM_LIGHT_FIRST_POSITIVE_OUT/build/dist.sha256"
      - name: All fifteen unchanged rebuilt-site readers
        run: |
          set -euo pipefail
          cd "$CM_LIGHT_BUILD_ROOT"
          set +e
          ONLY=simAdsense,simBrand,simHeadTags,simHiddenPages,simHubs,simIndexNow,simIndexing,simInternalLinks,simNoRivalNames,simPrerender,simPrerenderBoot,simRetiredRoutes,simSchema,simSitemap,simSnapshotAssets NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/runAllSims.mjs --browser > "$CM_LIGHT_FIRST_POSITIVE_OUT/build/readers.log" 2>&1
          actual_exit=$?
          set -e
          printf '%s\n' "$actual_exit" > "$CM_LIGHT_FIRST_POSITIVE_OUT/build/readers.exit"
          cat "$CM_LIGHT_FIRST_POSITIVE_OUT/build/readers.log"
          node "$GITHUB_WORKSPACE/scripts/qa/cmLightSeasonFirstPositive.mjs" readers 2>&1 | tee "$CM_LIGHT_FIRST_POSITIVE_OUT/build/readers-admission.log"
      - name: All fifteen unchanged rounded fatal caps
        run: |
          set -euo pipefail
          cd "$CM_LIGHT_BUILD_ROOT"
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/lib/hostLikeServer.mjs dist 4173 > "$CM_LIGHT_FIRST_POSITIVE_OUT/build/weight-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in 1 2 3 4 5; do if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi; sleep 1; done
          curl --fail --silent http://127.0.0.1:4173/ > /dev/null
          set +e
          BASE=http://127.0.0.1:4173 SWEEP_OFFLINE=1 NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/sweepWeight.mjs > "$CM_LIGHT_FIRST_POSITIVE_OUT/build/weights.log" 2>&1
          actual_exit=$?
          set -e
          printf '%s\n' "$actual_exit" > "$CM_LIGHT_FIRST_POSITIVE_OUT/build/weights.exit"
          cat "$CM_LIGHT_FIRST_POSITIVE_OUT/build/weights.log"
          node "$GITHUB_WORKSPACE/scripts/qa/cmLightSeasonFirstPositive.mjs" caps 2>&1 | tee "$CM_LIGHT_FIRST_POSITIVE_OUT/build/caps-admission.log"
      - name: Complete immutable browser inputs before actual route journeys
        env:
          FREE_KICK_FONT_CACHE: ${{ github.workspace }}/cm-light-browser-artifacts/build/font-cache
        run: |
          set -euo pipefail
          cd "$CM_LIGHT_BUILD_ROOT"
          test -z "$(find dist "$FREE_KICK_FONT_CACHE" -type l -print -quit)"
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > "$CM_LIGHT_FIRST_POSITIVE_OUT/build/dist-browser-before.sha256"
          (cd "$FREE_KICK_FONT_CACHE" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "$CM_LIGHT_FIRST_POSITIVE_OUT/build/fonts-browser-before.sha256"
          node --input-type=module - <<'NODE' > "$CM_LIGHT_FIRST_POSITIVE_OUT/build/font-manifest-admission.log" 2>&1
          import fs from 'node:fs';import path from 'node:path';import assert from 'node:assert/strict';import{createHash}from'node:crypto';
          const root=process.env.FREE_KICK_FONT_CACHE,rows=JSON.parse(fs.readFileSync(path.join(root,'manifest.json'),'utf8'));assert(Array.isArray(rows)&&rows.length>0);assert.equal(new Set(rows.map(r=>r.url)).size,rows.length);const names=new Set();for(const r of rows){assert(typeof r.file==='string'&&r.file&&!path.isAbsolute(r.file)&&!r.file.split(/[\\/]/).includes('..'));assert(!names.has(r.file));names.add(r.file);assert(typeof r.contentType==='string'&&r.contentType);const b=fs.readFileSync(path.join(root,r.file));assert.equal(createHash('sha256').update(b).digest('hex'),r.sha256);}console.log('CM_LIGHT_BROWSER_FONTS: actual compatible array manifest and every declared cached body admitted');
          NODE
          cat "$CM_LIGHT_FIRST_POSITIVE_OUT/build/font-manifest-admission.log"
      - name: Three real Light-season routes and nine copied detectors
        id: browser
        env:
          FREE_KICK_FONT_CACHE: ${{ github.workspace }}/cm-light-browser-artifacts/build/font-cache
          CM_LIGHT_BROWSER_OUT: ${{ github.workspace }}/cm-light-browser-artifacts/build/browser
        run: |
          set -euo pipefail
          cd "$CM_LIGHT_BUILD_ROOT"
          set +e
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/qa/playCmLightSeason.mjs > "$CM_LIGHT_FIRST_POSITIVE_OUT/build/browser.log" 2>&1
          actual_exit=$?
          set -e
          printf '%s\n' "$actual_exit" > "$CM_LIGHT_FIRST_POSITIVE_OUT/build/browser.exit"
          cat "$CM_LIGHT_FIRST_POSITIVE_OUT/build/browser.log"
          test "$actual_exit" = 0
          grep -Fx 'CM Light browser:3 actual-route profiles;12 normal PNGs;one accepted commitment per profile;9 changed COPIED detector controls restored.' "$CM_LIGHT_FIRST_POSITIVE_OUT/build/browser.log"
          node --input-type=module - <<'NODE' > "$CM_LIGHT_FIRST_POSITIVE_OUT/build/browser-admission.json"
          import fs from 'node:fs';import path from 'node:path';import assert from 'node:assert/strict';import{createHash}from'node:crypto';
          const root=path.join(process.env.CM_LIGHT_FIRST_POSITIVE_OUT,'build/browser'),r=JSON.parse(fs.readFileSync(path.join(root,'report.json'),'utf8'));assert.equal(r.status,'PASSED');assert.equal(r.profiles.length,3);assert.deepEqual(r.profiles.map(x=>x.width),[320,390,1280]);assert.equal(r.controls.length,9);assert.deepEqual(r.controls.map(x=>x.field),['viewport','fonts','visible','target44','focus','rules','position','raw','transition']);assert(r.controls.every(x=>x.effective===true&&x.sameCopyRestored===true));
          const sha=b=>createHash('sha256').update(b).digest('hex');let count=0;for(const row of r.profiles){assert.equal(row.status,'PASSED');for(const name of ['errors','consoleErrors','assetErrors','unknown'])assert.deepEqual(row[name],[]);assert.equal(row.captures.length,4);for(const c of row.captures){assert.equal(c.normal,true);assert.equal(c.route,'/club-manager');assert.equal(sha(fs.readFileSync(path.join(root,c.file))),c.sha256);assert.equal(sha(fs.readFileSync(path.join(root,c.rawFile))),c.rawSHA256);count++;}}assert.equal(count,12);console.log(JSON.stringify({status:'ACTUAL_BROWSER_3_PASS_12_NORMAL_9_COPIED',profiles:3,normalPNGs:count,copied:9,scope:r.scope},null,2));
          NODE
      - name: Complete browser dist and font inventories held including no extras
        if: always()
        env:
          FREE_KICK_FONT_CACHE: ${{ github.workspace }}/cm-light-browser-artifacts/build/font-cache
        run: |
          set -euo pipefail
          if test -f "$CM_LIGHT_FIRST_POSITIVE_OUT/build/dist-browser-before.sha256"; then
            cd "$CM_LIGHT_BUILD_ROOT"
            test -z "$(find dist "$FREE_KICK_FONT_CACHE" -type l -print -quit)"
            find dist -type f -print0 | sort -z | xargs -0 sha256sum > "$CM_LIGHT_FIRST_POSITIVE_OUT/build/dist-browser-after.sha256"
            (cd "$FREE_KICK_FONT_CACHE" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "$CM_LIGHT_FIRST_POSITIVE_OUT/build/fonts-browser-after.sha256"
            diff -u "$CM_LIGHT_FIRST_POSITIVE_OUT/build/dist-browser-before.sha256" "$CM_LIGHT_FIRST_POSITIVE_OUT/build/dist-browser-after.sha256"
            diff -u "$CM_LIGHT_FIRST_POSITIVE_OUT/build/fonts-browser-before.sha256" "$CM_LIGHT_FIRST_POSITIVE_OUT/build/fonts-browser-after.sha256"
            sha256sum --check "$CM_LIGHT_FIRST_POSITIVE_OUT/build/dist-browser-before.sha256" > "$CM_LIGHT_FIRST_POSITIVE_OUT/build/dist-browser-held.log"
            (cd "$FREE_KICK_FONT_CACHE" && sha256sum --check "$CM_LIGHT_FIRST_POSITIVE_OUT/build/fonts-browser-before.sha256") > "$CM_LIGHT_FIRST_POSITIVE_OUT/build/fonts-browser-held.log"
          fi
      - name: Exact built source and distribution held
        if: always()
        run: |
          set -euo pipefail
          if test -n "${CM_LIGHT_BUILD_ROOT:-}"; then
            git -C "$CM_LIGHT_BUILD_ROOT" diff --exit-code HEAD -- src scripts qa .github/workflows docs package.json package-lock.json bun.lock index.html ':!scripts/data/lastmod.json'
            git -C "$CM_LIGHT_BUILD_ROOT" diff --name-only HEAD > "$CM_LIGHT_FIRST_POSITIVE_OUT/build/changed-generated-paths.txt"
            if test -f "$CM_LIGHT_FIRST_POSITIVE_OUT/build/dist.sha256"; then (cd "$CM_LIGHT_BUILD_ROOT" && sha256sum --check "$CM_LIGHT_FIRST_POSITIVE_OUT/build/dist.sha256") > "$CM_LIGHT_FIRST_POSITIVE_OUT/build/dist-held.log"; fi
          fi
      - name: All canonical tracked sources held
        if: always()
        run: |
          set -euo pipefail
          sha256sum --check "$CM_LIGHT_FIRST_POSITIVE_OUT/tracked-before.sha256" > "$CM_LIGHT_FIRST_POSITIVE_OUT/tracked-held.log"
          git status --porcelain --untracked-files=no > "$CM_LIGHT_FIRST_POSITIVE_OUT/tracked-status.txt"
          test ! -s "$CM_LIGHT_FIRST_POSITIVE_OUT/tracked-status.txt"
          git diff --exit-code HEAD
      - name: Retain original evidence including refusals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cm-light-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: cm-light-browser-artifacts/
          if-no-files-found: error
          retention-days: 14
