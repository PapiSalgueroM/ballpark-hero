name: Soccer four entries native same completed build
on:
  push:
    branches: [codex/soccer-four-entries-native-20261105]
permissions:
  contents: read
  actions: read
concurrency:
  group: soccer-four-entries-native-20261105
  cancel-in-progress: false
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      PRODUCT: a9e56ff706ea71a51d3ec60438023ed9ad4d3b01
      PRODUCT_TREE: 316d2084d15d5e24aff38e5a692b639432b3eb98
      BROWSER_BLOB: abb12d2d0b503d25cde4ec392cde67ba03956344
      FIXTURE_BLOB: 3f5a12bb72cf73ffe7b9b0742ee7229d4d4eee65
      SPEC_BLOB: f097d00f3b112e594ffbbab58c6684ba74b1208e
      ASSETS_BLOB: c712011e87f8a863075a7375f3e9f8bae01de74b
      READY_BLOB: 671f460aa088d42b44c435a03594cf26695d6e09
      PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Bind six reviewed QA additions on the frozen UI product
        shell: bash
        run: |
          set -euo pipefail
          QA_OUT="$RUNNER_TEMP/soccer-four-entries-native"
          QA_REF="$RUNNER_TEMP/soccer-four-entries-native-inputs"
          QA_DIST="$RUNNER_TEMP/soccer-four-entries-native-dist"
          export QA_OUT QA_REF QA_DIST
          echo "QA_OUT=$QA_OUT" >> "$GITHUB_ENV"
          echo "QA_REF=$QA_REF" >> "$GITHUB_ENV"
          echo "QA_DIST=$QA_DIST" >> "$GITHUB_ENV"
          mkdir -p "$QA_OUT"/{logs,input,transport} "$QA_REF" "$QA_DIST"
          test "$(git rev-parse HEAD^)" = "$PRODUCT"
          test "$(git rev-parse "$PRODUCT^{tree}")" = "$PRODUCT_TREE"
          test "$(git hash-object scripts/qa/soccerHistoricalFourBrowser.mjs)" = "$BROWSER_BLOB"
          test "$(git hash-object scripts/qa/soccerHistoricalFourFixtures.mjs)" = "$FIXTURE_BLOB"
          test "$(git hash-object scripts/qa/soccerHistoricalFourNative.json)" = "$SPEC_BLOB"
          test "$(git hash-object scripts/qa/soccerHistoricalFourAssets.mjs)" = "$ASSETS_BLOB"
          test "$(git hash-object scripts/qa/nativeScrollReady.mjs)" = "$READY_BLOB"
          git diff --name-status HEAD^ HEAD > "$QA_OUT/qa-delta.txt"
          node --input-type=module -e 'import fs from "node:fs";import assert from "node:assert/strict";const s=JSON.parse(fs.readFileSync("scripts/qa/soccerHistoricalFourNative.json"));const r=fs.readFileSync(process.env.QA_OUT+"/qa-delta.txt","utf8").trim().split("\n").map(x=>x.split("\t"));assert(r.every(x=>x[0]==="A"));assert.deepEqual(r.map(x=>x[1]).sort(),s.qaPaths.slice().sort());'
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          node --check scripts/qa/soccerHistoricalFourBrowser.mjs
          node --check scripts/qa/soccerHistoricalFourFixtures.mjs
          git ls-files -z > "$QA_OUT/tracked-before.bin"
          git ls-files -z | xargs -0 sha256sum > "$QA_OUT/source-before.sha256"
          git ls-files -s > "$QA_OUT/index-before.txt"
          git status --porcelain=v1 --untracked-files=all > "$QA_OUT/status-before.txt"
          cp package-lock.json "$QA_OUT/lock-before.json"
          node --input-type=module -e 'import fs from "node:fs";import crypto from "node:crypto";const sha=b=>crypto.createHash("sha256").update(b).digest("hex");fs.writeFileSync(process.env.QA_OUT+"/all-locks-before.json",JSON.stringify(Object.fromEntries(["package.json","package-lock.json","bun.lock","bun.lockb","yarn.lock","pnpm-lock.yaml"].map(p=>[p,fs.existsSync(p)?sha(fs.readFileSync(p)):null])))+"\n");'
          cp scripts/qa/soccerHistoricalFourNative.json "$QA_OUT/spec.json"
          git rev-parse HEAD HEAD^ 'HEAD^{tree}' > "$QA_OUT/source-identity.txt"
      - name: Reuse exactly the admitted current build and seven-arm restored inputs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import path from 'node:path';import crypto from 'node:crypto';import assert from 'node:assert/strict';import {spawnSync} from 'node:child_process';
          const spec=JSON.parse(fs.readFileSync('scripts/qa/soccerHistoricalFourNative.json')),out=process.env.QA_OUT,ref=process.env.QA_REF;
          const sha=b=>crypto.createHash('sha256').update(b).digest('hex');
          const call=(label,argv,binary=false)=>{const r=spawnSync('gh',argv,{encoding:binary?null:'utf8',maxBuffer:64*1024*1024});fs.writeFileSync(path.join(out,'input',label+'.native.json'),JSON.stringify({command:['gh',...argv],status:r.status,signal:r.signal,error:r.error?String(r.error):null})+'\n');if(!binary)fs.writeFileSync(path.join(out,'input',label+'.json'),r.stdout??'');assert.equal(r.status,0);assert.equal(r.signal,null);assert.equal(r.error,undefined);return binary?r.stdout:JSON.parse(r.stdout);};
          for(const[name,a]of Object.entries(spec.artifacts)){
            assert.match(a.independentAdmissionSHA256,/^[a-f0-9]{64}$/,'Actual independent admission bound');
            const run=call(name+'-run',['api','repos/PapiSalgueroM/ballpark-hero/actions/runs/'+a.run]);
            const job=call(name+'-job',['api','repos/PapiSalgueroM/ballpark-hero/actions/jobs/'+a.job]);
            const artifact=call(name+'-artifact',['api','repos/PapiSalgueroM/ballpark-hero/actions/artifacts/'+a.artifact]);
            assert.equal(run.status,'completed');assert.equal(run.conclusion,'success');assert.equal(run.head_sha,a.qa);assert.equal(job.id,a.job);assert.equal(job.run_id,a.run);assert.equal(job.conclusion,'success');assert.equal(artifact.id,a.artifact);assert.equal(artifact.size_in_bytes,a.zipBytes);assert.equal(artifact.expired,false);assert.equal(artifact.workflow_run.id,a.run);
            const zip=call(name+'-zip',['api','repos/PapiSalgueroM/ballpark-hero/actions/artifacts/'+a.artifact+'/zip'],true);
            assert.equal(zip.length,a.zipBytes);assert.equal(sha(zip),a.zipSHA256);
            const zipFile=path.join(ref,name+'.zip');fs.writeFileSync(zipFile,zip,{flag:'wx'});const dir=path.join(ref,name);fs.mkdirSync(dir);
            const r=spawnSync('unzip',['-p',zipFile,a.tgz],{maxBuffer:64*1024*1024});assert.equal(r.status,0);assert.equal(r.signal,null);assert.equal(r.error,undefined);assert.equal(r.stdout.length,a.tgzBytes);assert.equal(sha(r.stdout),a.tgzSHA256);
            const tgz=path.join(ref,name+'.tar.gz');fs.writeFileSync(tgz,r.stdout,{flag:'wx'});const extracted=spawnSync('tar',['-xzf',tgz,'-C',dir]);assert.equal(extracted.status,0);
            assert(Array.isArray(a.admittedFiles)&&a.admittedFiles.length>0,'Actual admitted file inventory bound');
            for(const row of a.admittedFiles){const bytes=fs.readFileSync(path.join(dir,row.path));assert.equal(bytes.length,row.bytes);assert.equal(sha(bytes),row.sha256,row.path);const copy=path.join(out,'input',name,row.path);fs.mkdirSync(path.dirname(copy),{recursive:true});fs.writeFileSync(copy,bytes,{flag:'wx'});}
            fs.writeFileSync(path.join(out,'input',name+'-authenticated.json'),JSON.stringify({run:a.run,job:a.job,head:a.qa,artifact:a.artifact,bytes:a.zipBytes,sha256:a.zipSHA256,tgzSHA256:a.tgzSHA256,independentAdmissionSHA256:a.independentAdmissionSHA256},null,2)+'\n',{flag:'wx'});
          }
          const build=path.join(ref,'build'),b=spec.artifacts.build;
          const proof=JSON.parse(fs.readFileSync(path.join(build,'build-proof.json')));
          assert.equal(proof.status,'compiled-gates-passed');assert.equal(proof.product,spec.product);assert.equal(proof.productTree,spec.productTree);assert.equal(proof.normalBuilds,1);assert.equal(proof.readersCount,20);assert.equal(proof.allCapsUnchanged,true);assert.equal(proof.extraCmLeagueRules,false);
          const tar=fs.readFileSync(path.join(build,b.tar));assert.equal(tar.length,b.tarBytes);assert.equal(sha(tar),b.tarSHA256);assert.equal(proof.tar.sha256,b.tarSHA256);assert.equal(proof.distInventorySHA256,b.distInventorySHA256);
          const extracted=spawnSync('tar',['-xzf',path.join(build,b.tar),'--strip-components=1','-C',process.env.QA_DIST]);assert.equal(extracted.status,0);
          const outcomes=JSON.parse(fs.readFileSync(path.join(ref,'outcomes','outcomes.json')));
          assert.equal(outcomes.status,'SEVEN_ARMS_ADMITTED_PENDING_WORKFLOW_FINAL_HOLDS');assert.equal(outcomes.candidate.head,spec.product);assert.equal(outcomes.candidate.tree,spec.productTree);assert.equal(outcomes.finalSourceIndexLocksStatusReferenceHeld,true);assert.equal(outcomes.privateForkTapeCaptured,false);
          assert.deepEqual(outcomes.arms.map(r=>[r.arm,r.nativeExit,r.status]),[['fixed',0,'EXPECTED_ARM_ADMITTED'],['reversal',1,'EXPECTED_ARM_ADMITTED'],['missing-new-row',1,'EXPECTED_ARM_ADMITTED'],['wrong-id-fallback',1,'EXPECTED_ARM_ADMITTED'],['unprotected-cache',1,'EXPECTED_ARM_ADMITTED'],['v1-upgrade',1,'EXPECTED_ARM_ADMITTED'],['restored',0,'EXPECTED_ARM_ADMITTED']]);
          assert(outcomes.arms.every(row=>row.allCapturedTapesAndFrameCheckpointsEqualOriginal&&row.sourceHeld&&row.indexHeld&&row.locksHeld&&row.threeSilentReceipts));
          const same=JSON.parse(fs.readFileSync(path.join(ref,'outcomes','fixed-restored.json')));assert.equal(same.allEightStoredAndLiteralBytesExact,true);assert.equal(same.records.length,8);
          const inventory=()=>{const rows=[];function walk(rel=''){for(const e of fs.readdirSync(path.join(ref,rel),{withFileTypes:true})){const file=path.posix.join(rel,e.name);if(e.isDirectory())walk(file);else{assert(e.isFile());const b=fs.readFileSync(path.join(ref,file));rows.push({file,bytes:b.length,sha256:sha(b)});}}}walk();return rows.sort((a,b)=>a.file<b.file?-1:a.file>b.file?1:0);};
          fs.writeFileSync(path.join(out,'input-reference-before.json'),JSON.stringify(inventory())+'\n',{flag:'wx'});
          fs.writeFileSync(path.join(out,'input','reuse-admitted.json'),JSON.stringify({completedCurrentBuildOnly:true,normalBuildsInThisWorkflow:0,sourceProduct:spec.product,twoAuthenticatedInputs:true,authenticV1Preserved:true,modelContinuation:false},null,2)+'\n',{flag:'wx'});
          NODE
      - name: Install held App and browser runtime only
        shell: bash
        run: |
          set -euo pipefail
          test "$(bun --version)" = 1.4.4
          bun --version > "$QA_OUT/logs/bun-version.log"
          node --version > "$QA_OUT/logs/node-version.log"
          bun install --frozen-lockfile > "$QA_OUT/logs/bun-install.log" 2>&1
          git diff --exit-code HEAD -- package.json package-lock.json bun.lock bun.lockb
          npm install --prefix "$RUNNER_TEMP/real-entry-browser-tools" --package-lock=false --no-audit --no-fund playwright@1.64.0 > "$QA_OUT/logs/playwright-install.log" 2>&1
          test ! -e node_modules/playwright
          test ! -e node_modules/playwright-core
          ln -s "$RUNNER_TEMP/real-entry-browser-tools/node_modules/playwright" node_modules/playwright
          ln -s "$RUNNER_TEMP/real-entry-browser-tools/node_modules/playwright-core" node_modules/playwright-core
          "$RUNNER_TEMP/real-entry-browser-tools/node_modules/.bin/playwright" install --with-deps chromium > "$QA_OUT/logs/chromium-install.log" 2>&1
      - name: Proper App types before fixture preparation or browser
        shell: bash
        run: |
          set +e
          set -uo pipefail
          export SIM_NETWORK=offline GIT_NO_LAZY_FETCH=1
          export NODE_OPTIONS="--require=$GITHUB_WORKSPACE/scripts/lib/offlineTransport.cjs"
          export SIM_OFFLINE_RECEIPT="$QA_OUT/transport/types.log"
          : > "$SIM_OFFLINE_RECEIPT"
          node_modules/.bin/tsc --noEmit -p tsconfig.app.json > "$QA_OUT/logs/types.log" 2>&1
          native_exit=$?
          printf '%s\n' "$native_exit" > "$QA_OUT/logs/types.exit" || exit 1
          test "$native_exit" = 0 || exit "$native_exit"
          test ! -s "$SIM_OFFLINE_RECEIPT" || exit 1
      - name: Copy authentic RAW and retain actual Page load normalization
        shell: bash
        run: |
          set +e
          set -uo pipefail
          export SIM_NETWORK=offline GIT_NO_LAZY_FETCH=1
          export NODE_OPTIONS="--require=$GITHUB_WORKSPACE/scripts/lib/offlineTransport.cjs"
          export SIM_OFFLINE_RECEIPT="$QA_OUT/transport/fixtures.log"
          : > "$SIM_OFFLINE_RECEIPT"
          node --unhandled-rejections=strict scripts/qa/soccerHistoricalFourFixtures.mjs --out "$QA_OUT/native-fixtures" --dist "$QA_DIST" --build "$QA_REF/build" --outcomes "$QA_REF/outcomes" --spec scripts/qa/soccerHistoricalFourNative.json > "$QA_OUT/logs/fixtures.log" 2>&1
          native_exit=$?
          printf '%s\n' "$native_exit" > "$QA_OUT/logs/fixtures.exit" || exit 1
          test "$native_exit" = 0 || exit "$native_exit"
          test ! -s "$SIM_OFFLINE_RECEIPT" || exit 1
      - name: Actual localhost asset proof and three finite native contexts
        shell: bash
        run: |
          set +e
          set -uo pipefail
          export SIM_NETWORK=offline GIT_NO_LAZY_FETCH=1
          export NODE_OPTIONS="--require=$GITHUB_WORKSPACE/scripts/lib/offlineTransport.cjs"
          export SIM_OFFLINE_RECEIPT="$QA_OUT/transport/server.log"
          : > "$SIM_OFFLINE_RECEIPT"
          node scripts/lib/hostLikeServer.mjs "$QA_DIST" 4173 > "$QA_OUT/logs/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4173/soccer-career > /dev/null; then ready=1; break; fi
            sleep 0.25
          done
          test "$ready" = 1 || exit 1
          export SIM_OFFLINE_RECEIPT="$QA_OUT/transport/assets-before.log"
          : > "$SIM_OFFLINE_RECEIPT"
          node --unhandled-rejections=strict scripts/qa/soccerHistoricalFourAssets.mjs "$QA_OUT/native-fixtures/manifest.json" "$QA_DIST" "$QA_OUT" http://127.0.0.1:4173 before > "$QA_OUT/logs/assets-before.log" 2>&1
          before_exit=$?
          printf '%s\n' "$before_exit" > "$QA_OUT/logs/assets-before.exit" || exit 1
          test "$before_exit" = 0 || exit "$before_exit"
          test ! -s "$SIM_OFFLINE_RECEIPT" || exit 1
          export SIM_OFFLINE_RECEIPT="$QA_OUT/transport/browser.log"
          : > "$SIM_OFFLINE_RECEIPT"
          node --unhandled-rejections=strict scripts/qa/soccerHistoricalFourBrowser.mjs --fixtures "$QA_OUT/native-fixtures" --dist "$QA_DIST" --out "$QA_OUT/browser" --base-url http://127.0.0.1:4173 > "$QA_OUT/logs/browser.log" 2>&1
          browser_exit=$?
          printf '%s\n' "$browser_exit" > "$QA_OUT/logs/browser.exit" || exit 1
          export SIM_OFFLINE_RECEIPT="$QA_OUT/transport/assets-after.log"
          : > "$SIM_OFFLINE_RECEIPT"
          node --unhandled-rejections=strict scripts/qa/soccerHistoricalFourAssets.mjs "$QA_OUT/native-fixtures/manifest.json" "$QA_DIST" "$QA_OUT" http://127.0.0.1:4173 after > "$QA_OUT/logs/assets-after.log" 2>&1
          after_exit=$?
          printf '%s\n' "$after_exit" > "$QA_OUT/logs/assets-after.exit" || exit 1
          test "$browser_exit" = 0 || exit "$browser_exit"
          test "$after_exit" = 0 || exit "$after_exit"
          for receipt in server assets-before browser assets-after; do test ! -s "$QA_OUT/transport/$receipt.log" || exit 1; done
      - name: Always hold complete source fixtures output and locks
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git ls-files -z > "$QA_OUT/tracked-after.bin"
          git ls-files -z | xargs -0 sha256sum > "$QA_OUT/source-after.sha256"
          git ls-files -s > "$QA_OUT/index-after.txt"
          git status --porcelain=v1 --untracked-files=all > "$QA_OUT/status-after.txt"
          cp package-lock.json "$QA_OUT/lock-after.json"
          cmp "$QA_OUT/tracked-before.bin" "$QA_OUT/tracked-after.bin"
          cmp "$QA_OUT/source-before.sha256" "$QA_OUT/source-after.sha256"
          cmp "$QA_OUT/index-before.txt" "$QA_OUT/index-after.txt"
          cmp "$QA_OUT/lock-before.json" "$QA_OUT/lock-after.json"
          test ! -s "$QA_OUT/status-before.txt"
          test ! -s "$QA_OUT/status-after.txt"
          if test -f "$QA_OUT/native-fixtures/manifest.json"; then
            node --input-type=module <<'NODE'
          import fs from 'node:fs';import path from 'node:path';import crypto from 'node:crypto';import assert from 'node:assert/strict';
          const dir=process.env.QA_OUT+'/native-fixtures',m=JSON.parse(fs.readFileSync(dir+'/manifest.json')),sha=b=>crypto.createHash('sha256').update(b).digest('hex');
          for(const[p,d]of Object.entries(m.sourceAfter))assert.equal(sha(fs.readFileSync(p)),d,p);
          for(const f of Object.values(m.fixtures)){assert.equal(sha(fs.readFileSync(path.join(dir,f.file))),f.sha256);assert.equal(sha(fs.readFileSync(path.join(dir,f.originalFile))),f.originalSHA256);}
          assert.equal(sha(fs.readFileSync(path.join(dir,m.bundle))),m.bundleSHA);assert.equal(sha(fs.readFileSync(path.join(dir,m.entry))),m.entrySHA);assert.equal(sha(fs.readFileSync(path.join(dir,m.preparation.file))),m.preparation.sha256);
          for(const row of m.distBefore){const b=fs.readFileSync(path.join(process.env.QA_DIST,row.file));assert.equal(b.length,row.bytes);assert.equal(sha(b),row.sha256);}
          const locks=Object.fromEntries(['package.json','package-lock.json','bun.lock','bun.lockb','yarn.lock','pnpm-lock.yaml'].map(p=>[p,fs.existsSync(p)?sha(fs.readFileSync(p)):null]));
          fs.writeFileSync(process.env.QA_OUT+'/all-locks-after.json',JSON.stringify(locks)+'\n');
          assert.deepEqual(locks,JSON.parse(fs.readFileSync(process.env.QA_OUT+'/all-locks-before.json')));
          const ref=process.env.QA_REF,rows=[];
          function walk(rel=''){for(const e of fs.readdirSync(path.join(ref,rel),{withFileTypes:true})){const file=path.posix.join(rel,e.name);if(e.isDirectory())walk(file);else{assert(e.isFile());const b=fs.readFileSync(path.join(ref,file));rows.push({file,bytes:b.length,sha256:sha(b)});}}}walk();rows.sort((a,b)=>a.file<b.file?-1:a.file>b.file?1:0);
          const reference=Buffer.from(JSON.stringify(rows)+'\n');fs.writeFileSync(process.env.QA_OUT+'/input-reference-after.json',reference);
          assert(reference.equals(fs.readFileSync(process.env.QA_OUT+'/input-reference-before.json')),'Complete authenticated input files remain byte-held');
          const receipts=fs.readdirSync(process.env.QA_OUT+'/transport').sort();assert.deepEqual(receipts,['assets-after.log','assets-before.log','browser.log','fixtures.log','server.log','types.log']);
          for(const file of receipts)assert.equal(fs.readFileSync(process.env.QA_OUT+'/transport/'+file).length,0,'Silent '+file);
          const report=JSON.parse(fs.readFileSync(process.env.QA_OUT+'/browser/report.json'));
          assert.equal(report.status,'passed');assert.equal(report.sourceHeld,true);assert.equal(report.distHeld,true);assert.equal(report.fixtureHeld,true);
          assert.equal(report.contexts.length,3);assert.equal(report.screenshots.length,15);assert.equal(new Set(report.screenshots).size,15);
          for(const c of report.contexts){assert.equal(c.status,'passed');assert.equal(c.photos.length,5);assert.equal(c.wheelAcknowledgments.length,2);assert(c.wheelAcknowledgments.every(r=>r.status==='passed'));assert.equal(c.actions.filter(r=>r.type==='reload-full-reference').length,3);assert.equal(c.actions.filter(r=>r.type==='read-only-review').length,17);assert.equal(c.sourceCards.length,5);assert.equal(c.photoPreparationControl.actualHeld,true);}
          fs.writeFileSync(process.env.QA_OUT+'/source-dist-fixture-held.json',JSON.stringify({source:true,dist:849,fixtures:2,referenceAndOriginalRawHeld:true,allLockPresenceAndBodiesHeld:true,threeContextsFifteenPhotos:true,modelContinuation:false})+'\n',{flag:'wx'});
          NODE
          fi
          printf '0\n' > "$QA_OUT/logs/final-source-holds.exit" || exit 1
      - name: Retain all native proof within the unchanged archive bound
        id: evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "$RUNNER_TEMP/soccer-four-entries-native.tar.gz" -C "$QA_OUT" .
          test "$(stat -c %s "$RUNNER_TEMP/soccer-four-entries-native.tar.gz")" -le 50000000
          sha256sum "$RUNNER_TEMP/soccer-four-entries-native.tar.gz" > "$RUNNER_TEMP/soccer-four-entries-native.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        if: always() && steps.evidence.outcome == 'success'
        with:
          name: soccer-four-entries-native
          path: |
            ${{ runner.temp }}/soccer-four-entries-native.tar.gz
            ${{ runner.temp }}/soccer-four-entries-native.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
