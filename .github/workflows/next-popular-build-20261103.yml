name: Fantasy Draft and rating report completed build carrier
on:
  push:
    branches: [codex/next-popular-cup-build-20261104]
permissions:
  contents: read
concurrency:
  group: next-popular-build-${{ github.ref }}
  cancel-in-progress: false
env:
  CI: '1'
  SIM_NETWORK: offline
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ENGINES: chromium
      SEO_SPLIT_BASE_REF: HEAD
      SWEEP_OFFLINE: '1'
      PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Hold the exact joined application and source scope
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/next-popular-build"
          mkdir -p "$OUT/logs" "$OUT/units" "$OUT/raw" "$OUT/transport"
          echo "QA_OUT=$OUT" >> "$GITHUB_ENV"
          export QA_OUT="$OUT"
          git rev-parse HEAD HEAD^{tree} > "$OUT/source.txt"
          git diff --name-status 02ecc9672b3f9d69b6e64970cca25e3b5b796eb1 HEAD > "$OUT/changed-paths.txt"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';import {execFileSync} from 'node:child_process';
          const out=process.env.QA_OUT,pins={"public/fantasy-draft/index.html":"c2d51909d1e2f4b50c8b37f504d1cd5fdd0f47f5","public/sitemap.xml":"b37fcc58eeab3af01982518c7e4b0e30f790c1b4","scripts/data/guideHeadingsFrozen.json":"44b69c5931a210d18eb674119eaed8e593db59e5","scripts/data/lastmod.json":"a9d91055a4d148f05681cdf818371ada332cccb1","scripts/simFantasyDraftPool.mjs":"cb4f6c6a8d7cf691b36808c750213d178b943074","src/components/fantasy-draft/PlayerPool.tsx":"08a84d008390d68293482de3e818fada9120c5b3","src/data/gameContent/soccer2.ts":"6b0ddd15dcac750b22a0f7b6a7d5e108ce804095","src/data/searchKeywords.json":"78c07779d2678802f7cdd3a4ab6e8d41af221650","src/data/seoMeta.ts":"cf7a5142e59b97048d27b5ece9a6588a92073728","src/data/seoMetaParts/seoMetaPart18.ts":"2b001936116b87deab882a9e82cac082044e1adf","src/lib/fantasyCriteria.ts":"f6f7d27ee0af80e4386e650a9d7128cd89702f90","src/pages/FantasyDraft.tsx":"2343cadb8ff109230f8ed6d13fe3c70e21c57014","src/test/draftPoolFilters.test.tsx":"b6daf9f4023fe32cc87e55f50132dff5f8aa1295","src/test/fantasyDraftFormation.test.tsx":"4db9e392fdc40f01e2c668342e45eafcf37b79f6","src/test/scoreShown.test.tsx":"13bb3e32f99dbb679dbc1c2192a5070942306d2c","src/components/fantasy-draft/DraftRoster.tsx":"61d938308edcded2adffc810c01b7d9c12fd3a35","src/pages/SoccerCareer.tsx":"1f4d448cc9718bc3fa97b6987be5f14b27496c47","src/test/soccerCareerRatingReport.test.tsx":"796b6f88b9635d938caede4fc421200cfa3249b1","src/pages/ClubManager.tsx":"0fab04040d9555d599aa7dc049488dd368986745","src/components/club-manager/WorldCompScreen.tsx":"84d6736838fa35721d24248bcadea3bd35f713c4","src/test/cmCupsLazySummary.test.tsx":"fa74f783a741fc82cae851c474c3eb9b5e4c7185","scripts/qa/careerTransferBriefKit.mjs":"22af5caac7b55187416a0bf192848f93efaadb7f"},expected=["A\t.github/workflows/next-popular-build-20261103.yml","A\tsrc/test/cmCupsLazySummary.test.tsx","A\tsrc/test/fantasyDraftFormation.test.tsx","A\tsrc/test/soccerCareerRatingReport.test.tsx","M\tpublic/fantasy-draft/index.html","M\tpublic/sitemap.xml","M\tscripts/data/guideHeadingsFrozen.json","M\tscripts/data/lastmod.json","M\tscripts/qa/careerTransferBriefKit.mjs","M\tscripts/simFantasyDraftPool.mjs","M\tsrc/components/club-manager/WorldCompScreen.tsx","M\tsrc/components/fantasy-draft/DraftRoster.tsx","M\tsrc/components/fantasy-draft/PlayerPool.tsx","M\tsrc/data/gameContent/soccer2.ts","M\tsrc/data/searchKeywords.json","M\tsrc/data/seoMeta.ts","M\tsrc/data/seoMetaParts/seoMetaPart18.ts","M\tsrc/lib/fantasyCriteria.ts","M\tsrc/pages/ClubManager.tsx","M\tsrc/pages/FantasyDraft.tsx","M\tsrc/pages/SoccerCareer.tsx","M\tsrc/test/draftPoolFilters.test.tsx","M\tsrc/test/scoreShown.test.tsx"];
          assert.equal(process.env.GITHUB_REPOSITORY,'PapiSalgueroM/ballpark-hero');
          assert.equal(execFileSync('git',['rev-parse','HEAD']).toString().trim(),process.env.GITHUB_SHA);
          assert.equal(execFileSync('git',['rev-parse','HEAD^']).toString().trim(),'6194f1dad597a063e490926ee1c295a746f91cf6');
          assert.equal(execFileSync('git',['rev-parse','HEAD^^{tree}']).toString().trim(),'6d42fb1d9310436ffe60d77c228338d8962dcbcb');
          assert.deepEqual(fs.readFileSync(out+'/changed-paths.txt','utf8').trim().split('\n').sort(),expected);
          for(const [file,git]of Object.entries(pins)){
            assert.equal(execFileSync('git',['rev-parse','HEAD:'+file]).toString().trim(),git,file+' tracked');
            assert.equal(execFileSync('git',['hash-object',file]).toString().trim(),git,file+' actual');
          }
          const config=fs.readFileSync('vitest.config.ts','utf8');
          for(const match of config.matchAll(/process\.env\.([A-Z_]+)/g))assert.ok(!process.env[match[1]],'No inherited alias:'+match[1]);
          fs.writeFileSync(out+'/association.json',JSON.stringify({source:process.env.GITHUB_SHA,releaseCore:'6194f1dad597a063e490926ee1c295a746f91cf6',base:'02ecc9672b3f9d69b6e64970cca25e3b5b796eb1',pins,scope:'Fantasy valid-XI and roster readability, bounded Soccer Career rating diagnostics, unchanged domestic cup summary deferred to the existing Cups panel, and one QA-only Destination adapter. Proper types, normal build, twenty readers and sixteen unchanged page caps. Focused outcomes and native journeys qualify separately.'},null,2)+'\n');
          NODE
          git ls-files -z | sort -z | xargs -0 sha256sum > "$OUT/source-before.sha256"
          test "$(wc -l < "$OUT/source-before.sha256")" -eq 5677
          git status --porcelain=v1 --untracked-files=all > "$OUT/status-before.txt"
          test ! -s "$OUT/status-before.txt"
          cp .github/workflows/next-popular-build-20261103.yml "$OUT/workflow.yml"
      - name: Install held application and existing QA tools
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund 2>&1 | tee "$QA_OUT/logs/npm-ci.log"
          git diff --exit-code -- package.json package-lock.json
          npm install --prefix "$RUNNER_TEMP/flagship-release-tools" --package-lock=false --no-audit --no-fund playwright@1.64.0 2>&1 | tee "$QA_OUT/logs/playwright-install.log"
          test ! -e node_modules/playwright
          test ! -e node_modules/playwright-core
          ln -s "$RUNNER_TEMP/flagship-release-tools/node_modules/playwright" node_modules/playwright
          ln -s "$RUNNER_TEMP/flagship-release-tools/node_modules/playwright-core" node_modules/playwright-core
          "$RUNNER_TEMP/flagship-release-tools/node_modules/.bin/playwright" install --with-deps chromium 2>&1 | tee "$QA_OUT/logs/chromium-install.log"
          python3 -m pip install --target "$RUNNER_TEMP/flagship-release-python" fonttools pillow 2>&1 | tee "$QA_OUT/logs/python-install.log"
          echo "PYTHONPATH=$RUNNER_TEMP/flagship-release-python" >> "$GITHUB_ENV"
      - name: Proper joined application types
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$GITHUB_WORKSPACE/scripts/lib/offlineTransport.cjs"
          : > "$QA_OUT/transport/types.log"
          SIM_OFFLINE_RECEIPT="$QA_OUT/transport/types.log" node_modules/.bin/tsc --noEmit -p tsconfig.app.json > "$QA_OUT/logs/types.log" 2>&1
          test ! -s "$QA_OUT/transport/types.log"
      - name: Normal build, twenty readers and all unchanged page caps
        timeout-minutes: 25
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$GITHUB_WORKSPACE/scripts/lib/offlineTransport.cjs"
          classify_receipt() {
            local name="$1" receipt="$2"
            local allowed='^\[SIM_OFFLINE_BLOCK\] external browser route continue https://fonts\.(googleapis|gstatic)\.com$'
            if [[ "$name" == sweep-weight ]]; then
              allowed="$allowed|^\[SIM_OFFLINE_BLOCK\] external browser route continue https://flagcdn\.com$"
            elif [[ "$name" != build ]]; then
              if [[ -s "$receipt" ]]; then cat "$receipt"; return 1; fi
              return 0
            fi
            local status=0
            grep -Ev "$allowed" "$receipt" || status=$?
            if [[ "$status" == 1 ]]; then return 0; fi
            return 1
          }
          run_gate() {
            local name="$1"
            shift
            local receipt="$QA_OUT/transport/$name.log"
            : > "$receipt"
            SIM_OFFLINE_RECEIPT="$receipt" "$@" 2>&1 | tee "$QA_OUT/logs/$name.log"
            if ! classify_receipt "$name" "$receipt"; then
              echo "Unexpected blocked transport in $name" >&2
              return 1
            fi
            # Every refusal is retained and counted, never credited as zero transport.
            if [[ -s "$receipt" ]]; then
              wc -l "$receipt" | tee "$QA_OUT/logs/$name-blocked-attempts.txt"
            fi
          }
          # First-release guard outcomes are retained separately; this job builds the new source and checks its output.
          run_gate build npm run build
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > "$QA_OUT/dist-before.sha256"
          tar -czf "$QA_OUT/completed-dist.tar.gz" dist
          sha256sum "$QA_OUT/completed-dist.tar.gz" > "$QA_OUT/completed-dist.tar.gz.sha256"
          tar -tzf "$QA_OUT/completed-dist.tar.gz" > "$QA_OUT/completed-dist-members.txt"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import path from 'node:path';import crypto from 'node:crypto';import assert from 'node:assert/strict';
          const out=process.env.QA_OUT,rows=[],root=path.resolve('dist'),hash=bytes=>crypto.createHash('sha256').update(bytes).digest('hex');
          function walk(folder){for(const entry of fs.readdirSync(folder,{withFileTypes:true})){const file=path.join(folder,entry.name);if(entry.isDirectory())walk(file);else{assert(entry.isFile());const bytes=fs.readFileSync(file);rows.push({file:path.relative(root,file).replaceAll('\\','/'),bytes:bytes.length,sha256:hash(bytes)});}}}
          walk(root);rows.sort((a,b)=>a.file<b.file?-1:a.file>b.file?1:0);assert(rows.length>0);
          const source=fs.readFileSync(out+'/source.txt','utf8').trim().split('\n'),tar=fs.readFileSync(out+'/completed-dist.tar.gz');
          fs.writeFileSync(out+'/dist-manifest.json',JSON.stringify(rows,null,2)+'\n');
          fs.writeFileSync(out+'/completed-dist-association.json',JSON.stringify({source:source[0],tree:source[1],applicationCore:'6194f1dad597a063e490926ee1c295a746f91cf6',fileCount:rows.length,distDigest:hash(JSON.stringify(rows)),tarBytes:tar.length,tarSHA256:hash(tar),meaning:'Actual complete payload census, no fixed file count. The normal build completed before archiving; all readers and caps must still pass before this job qualifies.'},null,2)+'\n');
          console.log('Completed dist: '+rows.length+' actual payload files retained with hashes.');
          NODE
          export BASE=http://127.0.0.1:4173
          export SWEEP_BASE="$BASE"
          export SWEEP_OFFLINE=1
          export SIM_OFFLINE_RECEIPT="$QA_OUT/transport/server.log"
          : > "$SIM_OFFLINE_RECEIPT"
          node scripts/lib/hostLikeServer.mjs dist 4173 > "$QA_OUT/logs/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 40); do
            if curl --fail --silent "$BASE/" > /dev/null; then ready=1; break; fi
            kill -0 "$server_pid"
            sleep 1
          done
          test "$ready" = 1
          readers=(
            simAdsense simBrand simHeadTags simHiddenPages simHubs
            simIndexNow simIndexing simInternalLinks simNoRivalNames simPrerender
            simPrerenderBoot simRetiredRoutes simSchema simSitemap simSnapshotAssets
            simSiteSearch simGuideHeadings simHarnessAnchors
          )
          for reader in "${readers[@]}"; do
            run_gate "$reader" node "scripts/$reader.mjs"
          done
          run_gate simSeoTitles node scripts/simSeoTitles.mjs
          run_gate simSeoMetaSplit env SEO_SPLIT_ONLY=/soccer-career node scripts/simSeoMetaSplit.mjs
          run_gate sweep-weight node scripts/sweepWeight.mjs
          test ! -s "$QA_OUT/transport/server.log"
      - name: Retain full source holds and transport evidence
        if: always()
        run: |
          set -euo pipefail
          test -n "$QA_OUT"
          dist_hold=0
          if [[ -f "$QA_OUT/dist-before.sha256" ]]; then
            find dist -type f -print0 | sort -z | xargs -0 sha256sum > "$QA_OUT/dist-after.sha256"
            cmp "$QA_OUT/dist-before.sha256" "$QA_OUT/dist-after.sha256" || dist_hold=$?
            sha256sum --check "$QA_OUT/dist-before.sha256" > "$QA_OUT/dist-held.log" || dist_hold=$?
          else
            echo "No completed-build inventory exists. No dist hold credit." > "$QA_OUT/dist-hold-unknown.txt"
          fi
          git diff --exit-code HEAD > "$QA_OUT/source-diff.txt"
          git ls-files -z | sort -z | xargs -0 sha256sum > "$QA_OUT/source-after.sha256"
          if [[ -f "$QA_OUT/source-before.sha256" ]]; then
            cmp "$QA_OUT/source-before.sha256" "$QA_OUT/source-after.sha256"
            sha256sum --check "$QA_OUT/source-before.sha256" > "$QA_OUT/source-held.log"
          else
            echo "No qualified before inventory was produced." > "$QA_OUT/source-hold-unknown.txt"
            exit 1
          fi
          git status --porcelain=v1 --untracked-files=all > "$QA_OUT/status-after.txt"
          cmp "$QA_OUT/status-before.txt" "$QA_OUT/status-after.txt"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const out=process.env.QA_OUT;
          const rows=fs.existsSync(out+'/transport')?fs.readdirSync(out+'/transport').sort().map(file=>{
            const text=fs.readFileSync(out+'/transport/'+file,'utf8'),lines=text.split('\n').filter(Boolean);
            return {file,blockedAttempts:lines.length,
              fontBlockedAttempts:lines.filter(line=>/^\[SIM_OFFLINE_BLOCK\] external browser route continue https:\/\/fonts\.(googleapis|gstatic)\.com$/.test(line)).length,
              flagBlockedAttempts:lines.filter(line=>line==='[SIM_OFFLINE_BLOCK] external browser route continue https://flagcdn.com').length};
          }):[];
          fs.writeFileSync(out+'/transport-summary.json',JSON.stringify({
            receipts:rows,meaning:'Blocked attempts are retained. Empty Node receipts are not a browser or provider availability claim.'
          },null,2)+'\n');
          NODE
          test "$dist_hold" -eq 0
      - name: Bound retained focused evidence
        id: artifact
        if: always()
        run: |
          set -euo pipefail
          test -d "$QA_OUT"
          test "$(du -sb "$QA_OUT" | cut -f1)" -lt 150000000
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.artifact.outputs.ready == 'true' }}
        with:
          name: next-popular-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/next-popular-build
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
