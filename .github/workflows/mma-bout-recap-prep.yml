name: MMA bout recap preparation

on:
  push:
    branches: [codex/mma-bout-recap-1071]
permissions:
  contents: read
concurrency:
  group: mma-bout-recap-prep
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      SIM_NETWORK: offline
      ENGINES: chromium
      VITEST_MAX_FORKS: 1
      VITEST_MIN_FORKS: 1
      SEO_SPLIT_BASE_REF: HEAD
      MMA_BOUT_RECAP_ARTIFACTS: mma-promotion-artifacts/recap
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verification dependencies
        run: |
          mkdir -p mma-promotion-artifacts
          npm ci
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          python -m pip install fonttools pillow
      - name: Preserve accepted MMA and boxing engines and saves
        run: git diff --exit-code 1c10e7e5c11a3d502afb16070af462086874014d HEAD -- src/lib/mmaPromotion.ts src/hooks/useMmaPromotion.ts src/lib/fightPromoter.ts src/hooks/useFightPromoter.ts
      - name: Type check and refresh pages
        id: build
        run: |
          node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee mma-promotion-artifacts/types.log
          node scripts/genSearchKeywords.mjs 2>&1 | tee mma-promotion-artifacts/search.log
          PRERENDER_ONLY=/free-kick,/fight-promoter,/whats-new npm run build:seo 2>&1 | tee mma-promotion-artifacts/build.log
      - name: MMA mounted outcomes distributions and effective controls
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: MMA_PROMOTION_CONTROL=all ONLY=simMmaPromotion node scripts/runAllSims.mjs 2>&1 | tee mma-promotion-artifacts/mma.log
      - name: Saved bout recap outcomes and effective copied controls
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: MMA_BOUT_RECAP_CONTROL=all ONLY=simMmaBoutRecap node scripts/runAllSims.mjs 2>&1 | tee mma-promotion-artifacts/recap.log
      - name: Existing fight saves careers and scoring
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          failed=0
          for harness in simFightPromoter simFightGym simFightCareer simNbaCareer simNflCareer simMlbCareer simNhlCareer simNoDoubleRecord simScoringCoverage simScoreShown simHarnessAnchors simGuideHeadings simSeoTitles simHomeFront simInventedNames; do
            ONLY="$harness" node scripts/runAllSims.mjs 2>&1 | tee "mma-promotion-artifacts/$harness.log" || failed=1
          done
          exit "$failed"
      - name: All built pages and search readers
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          failed=0
          for harness in simAdsense simBrand simHeadTags simHiddenPages simHubs simIndexNow simIndexing simInternalLinks simNoRivalNames simPrerender simPrerenderBoot simRetiredRoutes simSchema simSitemap simSnapshotAssets simSiteSearch; do
            ONLY="$harness" node scripts/runAllSims.mjs --browser 2>&1 | tee "mma-promotion-artifacts/$harness.log" || failed=1
          done
          exit "$failed"
      - name: Native MMA and saved boxing journeys
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/qa/mmaPromotion1062.mjs 2>&1 | tee mma-promotion-artifacts/native.log
      - name: Package verified page candidates
        if: success()
        run: |
          git rev-parse HEAD > mma-promotion-artifacts/source-head.txt
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          const files = ['public/free-kick/index.html', 'public/fight-promoter/index.html', 'public/whats-new/index.html', 'public/sitemap.xml', 'scripts/data/lastmod.json', 'src/data/searchKeywords.json'];
          const manifest = files.map(file => {
            const target = path.join('mma-promotion-artifacts/generated', file);
            fs.mkdirSync(path.dirname(target), { recursive: true });
            fs.copyFileSync(file, target);
            return { file, sha256: crypto.createHash('sha256').update(fs.readFileSync(target)).digest('hex') };
          });
          fs.writeFileSync('mma-promotion-artifacts/generated-manifest.json', JSON.stringify(manifest, null, 2));
          JS
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mma-bout-recap-prep-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 1
          path: mma-promotion-artifacts/
