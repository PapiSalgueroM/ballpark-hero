name: Soccer Connect4 clean build join
on:
  push:
    branches: [codex/soccer-connect4-clean-join-qa-20261106]
permissions:
  contents: read
  actions: read
jobs:
  closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      SIM_NETWORK: offline
      SIM_OFFLINE_RECEIPT: c4-clean-join/offline.log
      C4_REFERENCE_ARTIFACT: '13486287954'
      C4_REFERENCE_ZIP: 'cc187c517485e48f5a2ccb758fb14a8ee6724bfb3293fff7698fe67337f32c17'
      C4_REFERENCE_TAR: '88e7cfd4239dbebd41a2461e1630878c78c5b6693f79bc3405a32ae7aca7e5e9'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Locked dependencies and clean source receipts
        run: |
          set -euo pipefail
          [[ "$C4_REFERENCE_ARTIFACT" =~ ^[0-9]+$ ]]
          [[ "$C4_REFERENCE_ZIP" =~ ^[a-f0-9]{64}$ ]]
          [[ "$C4_REFERENCE_TAR" =~ ^[a-f0-9]{64}$ ]]
          test ! -e c4-clean-join
          mkdir c4-clean-join
          touch c4-clean-join/offline.log
          git rev-parse HEAD > c4-clean-join/head.txt
          git rev-parse 'HEAD^{tree}' > c4-clean-join/tree.txt
          git ls-files -s > c4-clean-join/source-before.txt
          sha256sum package.json package-lock.json > c4-clean-join/locks-before.txt
          npm ci
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const lock=JSON.parse(fs.readFileSync('package-lock.json'));
          const rows=Object.keys(lock.packages).filter(p=>p.startsWith('node_modules/')&&fs.existsSync(p+'/package.json')).map(p=>[p,JSON.parse(fs.readFileSync(p+'/package.json')).version]);
          assert.equal(rows.length,521);for(const[p,v]of rows)assert.equal(v,lock.packages[p].version,p);fs.writeFileSync('c4-clean-join/installed-before.json',JSON.stringify(rows));
          NODE
      - name: Proper app types
        run: node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee c4-clean-join/types.log
      - name: Pinned reference qualification artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/PapiSalgueroM/ballpark-hero/actions/artifacts/$C4_REFERENCE_ARTIFACT" > c4-clean-join/reference-artifact.json
          gh api "repos/PapiSalgueroM/ballpark-hero/actions/artifacts/$C4_REFERENCE_ARTIFACT/zip" > "$RUNNER_TEMP/c4-reference.zip"
          echo "$C4_REFERENCE_ZIP  $RUNNER_TEMP/c4-reference.zip" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/c4-reference" "$RUNNER_TEMP/c4-reference-dist"
          unzip -q "$RUNNER_TEMP/c4-reference.zip" -d "$RUNNER_TEMP/c4-reference"
          echo "$C4_REFERENCE_TAR  $RUNNER_TEMP/c4-reference/dist.tgz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/c4-reference/dist.tgz" -C "$RUNNER_TEMP/c4-reference-dist"
          cp "$RUNNER_TEMP/c4-reference/source-before.txt" c4-clean-join/reference-source.txt
      - name: Fresh unchanged product-name fence on clean source
        run: node scripts/simNoRivalNames.mjs 2>&1 | tee c4-clean-join/no-rival.log
      - name: Clean production build
        run: NODE_OPTIONS="--max-old-space-size=6144" npm run build 2>&1 | tee c4-clean-join/build.log
      - name: Every product test script and built byte joined to completed native and reader/cap build
        id: join
        env:
          C4_REFERENCE_DIR: ${{ runner.temp }}/c4-reference
          C4_REFERENCE_DIST: ${{ runner.temp }}/c4-reference-dist/dist
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import path from 'node:path';import assert from 'node:assert/strict';import {createHash} from 'node:crypto';
          const sha=bytes=>createHash('sha256').update(bytes).digest('hex');
          const readIndex=file=>new Map(fs.readFileSync(file,'utf8').trim().split('\n').map(line=>{const m=/^[0-9]+ ([0-9a-f]{40}) 0\t(.+)$/.exec(line);assert(m,'Actual source row');return [m[2],m[1]];}));
          const old=readIndex('c4-clean-join/reference-source.txt'),current=readIndex('c4-clean-join/source-before.txt');
          const excluded=new Set(['scripts/qa/playFootballConnect4Ownership.mjs']);
          assert.equal(old.get('scripts/qa/playFootballConnect4Ownership.mjs'),'80a6bd9ac8b9dc1381a12802bfdfc6ded0628e89');
          for(const file of excluded)assert(!current.has(file),'Remote-only evidence helper absent from clean tree: '+file);
          const configs=['index.html','package.json','package-lock.json','vite.config.ts','tailwind.config.ts','postcss.config.js','tsconfig.json','tsconfig.app.json','tsconfig.node.json','bun.lockb','bun.lock'];
          for(const file of configs){assert.equal(current.has(file),old.has(file),'Same root configuration presence: '+file);if(current.has(file))assert.equal(current.get(file),old.get(file),'Exact qualified root configuration: '+file);}
          assert.equal(current.get('src/hooks/useFootballConnect4.ts'),'971dbdfa5a0e3c5adf749f9f301cc0fd994a178f');
          assert.equal(current.get('src/pages/FootballConnect4.tsx'),'634f94cea7810cfd678c3a4a6f470c3039773882');
          assert.equal(current.get('docs/plans/2026-11-06-soccer-connect4-request-ownership.md'),'9f4969d1f8c308d9257d2b5231dab2339c2739db');
          assert.equal(current.get('src/test/footballConnect4RequestOwnership.test.tsx'),'1156a83c6966f4c55bef0ed4c7f7a3288f4e87eb');
          const scoped=map=>[...map].filter(([p])=>/^(?:src|public|scripts)\//.test(p)&&!excluded.has(p)).sort(([a],[b])=>a.localeCompare(b));
          const sourceRows=scoped(current);assert.equal(sourceRows.length,4654);assert.deepEqual(sourceRows,scoped(old),'Every other source/public/script blob held, including exact committed generated files');
          const inventory=dir=>fs.readdirSync(dir,{withFileTypes:true}).sort((a,b)=>a.name.localeCompare(b.name)).flatMap(e=>e.isDirectory()?inventory(path.join(dir,e.name)).map(r=>({...r,path:e.name+'/'+r.path})):[{path:e.name,bytes:fs.statSync(path.join(dir,e.name)).size,sha256:sha(fs.readFileSync(path.join(dir,e.name)))}]);
          const actual=inventory('dist'),reference=inventory(process.env.C4_REFERENCE_DIST);
          assert.equal(actual.length,850);assert.deepEqual(actual,reference,'Every byte of every built file matches the pinned reference build');
          const meta=JSON.parse(fs.readFileSync('c4-clean-join/reference-artifact.json')),referenceHead=fs.readFileSync(path.join(process.env.C4_REFERENCE_DIR,'head.txt'),'utf8').trim();
          assert.equal(meta.id,Number(process.env.C4_REFERENCE_ARTIFACT));assert.equal(meta.expired,false);assert.match(referenceHead,/^[a-f0-9]{40}$/);assert.equal(meta.workflow_run.head_sha,referenceHead);
          const result={status:'passed',referenceRun:meta.workflow_run.id,referenceApp:referenceHead,referenceArtifact:meta.id,referenceZipSHA256:process.env.C4_REFERENCE_ZIP,referenceTarSHA256:process.env.C4_REFERENCE_TAR,sourceRows:sourceRows.length,rootConfigurations:configs.filter(file=>current.has(file)).map(file=>({file,blob:current.get(file)})),remoteOnlyHelpers:[...excluded],generatedPatches:[],distFiles:actual.length,distManifestSHA256:sha(JSON.stringify(actual)),dist:actual,limits:'Clean build join only. No native, reader or cap rerun. Exact source and every built byte bind this clean tree to the reference C4 build. A separately complete successful full/native qualification is required; this join does not admit native behavior. The owned plan blob is pinned, other docs are outside this code join.'};
          fs.writeFileSync('c4-clean-join/reference-build-join.json',JSON.stringify(result,null,2));console.log('PASS all '+sourceRows.length+' source rows and every '+actual.length+' built file held');
          NODE
      - name: Final source locks installed versions and offline holds
        if: always()
        run: |
          git ls-files -s > c4-clean-join/source-after.txt
          cmp c4-clean-join/source-before.txt c4-clean-join/source-after.txt
          git diff --exit-code HEAD -- .
          sha256sum package.json package-lock.json > c4-clean-join/locks-after.txt
          cmp c4-clean-join/locks-before.txt c4-clean-join/locks-after.txt
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const before=JSON.parse(fs.readFileSync('c4-clean-join/installed-before.json'));
          const after=before.map(([p])=>[p,JSON.parse(fs.readFileSync(p+'/package.json')).version]);assert.equal(after.length,521);assert.deepEqual(after,before);
          fs.writeFileSync('c4-clean-join/installed-final.json',JSON.stringify(after));
          assert(fs.existsSync('c4-clean-join/offline.log'));assert.equal(fs.statSync('c4-clean-join/offline.log').size,0);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soccer-connect4-clean-build-join-${{ github.run_id }}
          path: c4-clean-join
          retention-days: 14
          if-no-files-found: error
