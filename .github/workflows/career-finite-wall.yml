name: Career finite wall baseline

on:
  push:
    branches: [codex/career-finite-wall]
    paths-ignore: ['docs/**']

permissions:
  contents: read
concurrency:
  group: career-finite-wall-${{ github.sha }}
  cancel-in-progress: false

env:
  BASE_SOURCE: 179afd13f3e78d767576c3faaf218bcaa36a457f
  CI: '1'
  SIM_NETWORK: offline
  TZ: UTC

jobs:
  original:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 16
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Exact original source and complete inventory
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/career-finite-wall";test ! -e "$out";mkdir "$out"
          echo "CAREER_WALL_OUT=$out" >> "$GITHUB_ENV"
          test "$GITHUB_REPOSITORY" = PapiSalgueroM/ballpark-hero
          test "$GITHUB_REPOSITORY_ID" = 1195729679
          test "$GITHUB_REF" = refs/heads/codex/career-finite-wall
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags --depth=1 origin "$BASE_SOURCE" > "$out/base-fetch.log" 2>&1
          git merge-base --is-ancestor "$BASE_SOURCE" "$GITHUB_SHA"
          git diff --exit-code "$BASE_SOURCE" HEAD -- . ':!docs/**' ':!src/test/careerWallShot.test.ts' ':!src/test/soccerMomentWallRules.test.ts' ':!.github/workflows/career-finite-wall.yml' > "$out/protected-source.log"
          test "$(git hash-object src/lib/careerDrills.ts)" = 6125570ccdf2f037a7debeaa7ad14815e9ed860e
          test "$(git hash-object src/components/soccer-career/DrillBoard.tsx)" = c3c6500b976bce912d3626643269fb1b5388234b
          test "$(git hash-object src/lib/season/momentsSave.ts)" = c1ee578f855d29a107f8d69b71eb1258ed166ca9
          node <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict'),crypto=require('node:crypto');
          const pins={"src/test/careerWallShot.test.ts":"b75993336f618d9dc0322756dd021d71b4a412109bbe0be72f71208b464e54bb","src/test/soccerMomentWallRules.test.ts":"e5e8ca9ffc26e15bdaf51b057e55d34f4bd738c0325f7440f3df71fe8809605d"};
          for(const [file,expected]of Object.entries(pins))assert.equal(crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex'),expected,file);
          fs.writeFileSync(process.env.RUNNER_TEMP+'/career-finite-wall/source-binding.json',JSON.stringify({source:process.env.GITHUB_SHA,base:process.env.BASE_SOURCE,originalCoreBlob:'6125570ccdf2f037a7debeaa7ad14815e9ed860e',originalBoardBlob:'c3c6500b976bce912d3626643269fb1b5388234b',pins},null,2)+'\n',{flag:'wx'});
          NODE
          git rev-parse HEAD > "$out/head.txt"
          git ls-files -z | sort -z > "$out/source-members.before"
          git ls-files -z | sort -z | xargs -0 sha256sum > "$out/source-before.sha256"
          git diff --exit-code HEAD > "$out/source-clean-before.log"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Locked installation
        run: |
          set -euo pipefail
          out="$CAREER_WALL_OUT"
          npm ci > "$out/install.log" 2>&1
          find node_modules -path node_modules/.vite -prune -o -type f -print0 | sort -z > "$out/dependency-members.before"
          find node_modules -path node_modules/.vite -prune -o -type f -print0 | sort -z | xargs -0 sha256sum > "$out/dependencies.sha256"
      - name: Existing legacy drill and moment outcome evidence
        run: |
          set -euo pipefail
          out="$CAREER_WALL_OUT";export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          : > "$out/legacy-drills.transport";: > "$out/legacy-moments.transport"
          SIM_OFFLINE_RECEIPT="$out/legacy-drills.transport" timeout --signal=TERM --kill-after=15s 6m node scripts/simCareerDrills.mjs > "$out/legacy-drills.log" 2>&1
          SIM_OFFLINE_RECEIPT="$out/legacy-moments.transport" timeout --signal=TERM --kill-after=15s 6m node scripts/simSeasonMoments.mjs > "$out/legacy-moments.log" 2>&1
          test ! -s "$out/legacy-drills.transport";test ! -s "$out/legacy-moments.transport"
      - name: Actual types and causal baseline
        run: |
          set -euo pipefail
          out="$CAREER_WALL_OUT";export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          : > "$out/types.transport";: > "$out/tests.transport"
          SIM_OFFLINE_RECEIPT="$out/types.transport" node_modules/.bin/tsc --noEmit -p tsconfig.app.json > "$out/types.log" 2>&1
          status=0
          SIM_OFFLINE_RECEIPT="$out/tests.transport" timeout --signal=TERM --kill-after=15s 6m node_modules/.bin/vitest run src/test/careerWallShot.test.ts --maxWorkers=1 --no-file-parallelism --reporter=json --outputFile="$out/tests.json" > "$out/tests.log" 2>&1 || status=$?
          printf '%s\n' "$status" > "$out/tests.exit";test "$status" -eq 1
          node <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict'),out=process.env.CAREER_WALL_OUT,r=JSON.parse(fs.readFileSync(out+'/tests.json','utf8'));
          assert.equal(r.success,false);assert.equal(r.testResults.length,1);assert.equal(r.numTotalTests,6);assert.equal(r.numPassedTests,4);assert.equal(r.numFailedTests,2);assert.equal(r.numPendingTests,0);assert.equal(r.numTodoTests,0);
          const failures=new Map([['allows a low shot around either end of the rules-2 wall','WALL_V2_FINITE_WINGS_CLEAR'],['allows a high shot above the rules-2 wall even when the old gap is closed','WALL_V2_ABOVE_WALL_CLEAR']]);
          const suite=r.testResults[0];assert.equal(suite.name.replaceAll('\\','/').split('/').pop(),'careerWallShot.test.ts');assert.equal(suite.status,'failed');assert.equal(suite.assertionResults.length,6);
          for(const row of suite.assertionResults){const marker=failures.get(row.title);if(marker){assert.equal(row.status,'failed');assert.equal(row.fullName.trim(),'career Wall Shot finite five-defender rules '+row.title);assert.equal(row.failureMessages.length,1);assert.match(row.failureMessages[0],/AssertionError:/);assert(row.failureMessages[0].includes(marker));}else{assert.equal(row.status,'passed');assert.deepEqual(row.failureMessages,[]);}}
          for(const key of ['numRuntimeErrorTestSuites','numUnhandledErrors'])if(key in r)assert.equal(r[key],0);if('unhandledErrors'in r)assert.deepEqual(r.unhandledErrors,[]);
          assert.doesNotMatch(fs.readFileSync(out+'/tests.log','utf8'),/Unhandled\s+(?:Errors?|Rejections?)|Uncaught\s+Exceptions?/i);
          fs.writeFileSync(out+'/baseline-admission.json',JSON.stringify({source:process.env.GITHUB_SHA,ownedFailures:2,preservedPasses:4,markers:[...failures.values()],rawAbsentRuntimeCountersRemainUnknown:true},null,2)+'\n',{flag:'wx'});
          NODE
          test ! -s "$out/types.transport";test ! -s "$out/tests.transport"
      - name: Actual old ledger persistence baseline
        run: |
          set -euo pipefail
          out="$CAREER_WALL_OUT";export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          : > "$out/moment-tests.transport"
          status=0
          SIM_OFFLINE_RECEIPT="$out/moment-tests.transport" timeout --signal=TERM --kill-after=15s 6m node_modules/.bin/vitest run src/test/soccerMomentWallRules.test.ts --maxWorkers=1 --no-file-parallelism --reporter=json --outputFile="$out/moment-tests.json" > "$out/moment-tests.log" 2>&1 || status=$?
          printf '%s\n' "$status" > "$out/moment-tests.exit";test "$status" -eq 1
          node <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict'),out=process.env.CAREER_WALL_OUT,r=JSON.parse(fs.readFileSync(out+'/moment-tests.json','utf8'));
          assert.equal(r.success,false);assert.equal(r.testResults.length,1);assert.equal(r.numTotalTests,7);assert.equal(r.numPassedTests,3);assert.equal(r.numFailedTests,4);assert.equal(r.numPendingTests,0);assert.equal(r.numTodoTests,0);
          const failures=new Map([['retains every positive safe rule marker with used, settled and banked data on reload','MOMENT_WALL_RULE_READER_RETAINS'],['refuses invalid rule markers instead of silently treating their ledger as legacy','MOMENT_WALL_RULE_READER_REFUSES'],['stamps rule two atomically with a genuinely new used attempt','MOMENT_WALL_NEW_LEDGER_PINNED'],['stamps only the fresh rollover ledger while folding the exact previous tally','MOMENT_WALL_ROLLOVER_PINNED']]);
          const suite=r.testResults[0];assert.equal(suite.name.replaceAll('\\','/').split('/').pop(),'soccerMomentWallRules.test.ts');assert.equal(suite.status,'failed');assert.equal(suite.assertionResults.length,7);
          for(const row of suite.assertionResults){const marker=failures.get(row.title);if(marker){assert.equal(row.status,'failed');assert.equal(row.fullName.trim(),'Soccer moment wall rule persistence '+row.title);assert.equal(row.failureMessages.length,1);assert.match(row.failureMessages[0],/AssertionError:/);assert(row.failureMessages[0].includes(marker));}else{assert.equal(row.status,'passed');assert.deepEqual(row.failureMessages,[]);}}
          for(const key of ['numRuntimeErrorTestSuites','numUnhandledErrors'])if(key in r)assert.equal(r[key],0);if('unhandledErrors'in r)assert.deepEqual(r.unhandledErrors,[]);
          assert.doesNotMatch(fs.readFileSync(out+'/moment-tests.log','utf8'),/Unhandled\s+(?:Errors?|Rejections?)|Uncaught\s+Exceptions?/i);
          fs.writeFileSync(out+'/moment-baseline-admission.json',JSON.stringify({source:process.env.GITHUB_SHA,ownedFailures:4,preservedPasses:3,markers:[...failures.values()],rawAbsentRuntimeCountersRemainUnknown:true},null,2)+'\n',{flag:'wx'});
          NODE
          test ! -s "$out/moment-tests.transport"
      - name: Always retain complete source and dependency holds
        if: always()
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/career-finite-wall";mkdir -p "$out";failed=0
          for manifest in source-before dependencies;do if test -f "$out/$manifest.sha256";then sha256sum --check "$out/$manifest.sha256" > "$out/final-$manifest-hold.log" 2>&1 || failed=1;else failed=1;fi;done
          git ls-files -z | sort -z > "$out/source-members.after";cmp "$out/source-members.before" "$out/source-members.after" || failed=1
          if test -f "$out/dependency-members.before";then find node_modules -path node_modules/.vite -prune -o -type f -print0 | sort -z > "$out/dependency-members.after";cmp "$out/dependency-members.before" "$out/dependency-members.after" || failed=1;fi
          git diff --exit-code HEAD > "$out/final-source-diff.log" || failed=1
          git status --porcelain --untracked-files=all > "$out/final-status.txt";test ! -s "$out/final-status.txt" || failed=1
          while IFS= read -r -d '' file;do test ! -s "$file" || failed=1;done < <(find "$out" -type f -name '*.transport' -print0)
          printf '%s\n' "$failed" > "$out/final-holds.exit"
          (cd "$out";find . -type f ! -path ./evidence.sha256 -print0 | sort -z | xargs -0 sha256sum) > "$out/evidence.sha256"
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: career-finite-wall-original-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/career-finite-wall/
          if-no-files-found: error
          retention-days: 14
