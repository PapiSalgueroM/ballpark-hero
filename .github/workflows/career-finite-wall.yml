# Browser pilot bound to the frozen functional candidate, whose separate ordinary run is retained.
# A completed pilot is styled fixture evidence, not release qualification.
name: Career finite wall full candidate

on:
  push:
    branches: [codex/career-finite-wall]
    paths-ignore: ['docs/**']

permissions:
  contents: read
concurrency:
  group: career-finite-wall-browser-${{ github.sha }}
  cancel-in-progress: false

env:
  BASE_SOURCE: 3affaf38991afd3544e7f0f8c810527596185a2f
  ORIGINAL_BASELINE_SOURCE: 223e1cbe3eef07ace8497c3137744418c6b9c5d0
  WALL_SHOT_EXPECTED_PINS_JSON: '{"src/components/soccer-career/TrainingPanel.tsx":"725e95d14cee44b459fe5c19662ad8b1dc69364d69289b46527081a1c0ab2e61","src/index.css":"ada9cc819db63d0e2eb013bd3c29eec16877e2a30166c390b81901142369fef3","src/hooks/useArcadeFlight.ts":"b622bd7973bdbf59196c580902d1e949c1552ed1724159898c0ccc523c29c465","src/hooks/useRevealScroll.ts":"42ee464df372437ff934b2f6a2b4acafc25493eb4062e0602166bfdd2e7479cd","scripts/qa/siteMenuNavigationSupport.mjs":"c70e3ecc412f16d3322047b13205716c644495f8c74b76eed83852c87f35d303","scripts/lib/hostLikeServer.mjs":"3958c9a3b4d9e49bb60a3b7dd72d81a997bd1caed56e82e4c3bae07e1a918ef0","scripts/lib/playwrightLoader.mjs":"94a07179be7ca6b9562d118b52c2d5d0dff0b6b2e29e49e4fea16fa2defb5a93","src/lib/careerDrills.ts":"a5a66ed166667051d24e0d737f47941587b28edd633a7823c6e6741172db3c74","src/components/soccer-career/DrillBoard.tsx":"23294f3ccbf23a10753c076ea040998565adeaa2ac8a9661c52d20999e8d3f87","scripts/qa/fixtures/wallShotModern.entry.tsx":"ff37d15b5ed44f35b48d5d2c9c5d644afca2a384a9b7c94347c34aecebba5b62","scripts/qa/fixtures/wallShotModern.html":"d2e143920ee39761667b1d488b97d3aa671b980f34e5d7f64a65743bac291b9e","scripts/qa/fixtures/wallShotModern.vite.mjs":"a4e7bb8b09c9210a29e137f3378936a215f27c4ee538fcd23985efbb432bead4","scripts/qa/playWallShotModern.mjs":"8863670b44aed6dd9a0614c65df2e32c3c07653850e97ecf2e5586a7c4c7d7af"}'
  CI: '1'
  SIM_NETWORK: offline
  ENGINES: chromium
  TZ: UTC

jobs:
  browser_pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 32
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Frozen candidate source and thirteen browser inputs
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/wall-shot-browser-pilot";test ! -e "$out";mkdir "$out"
          export WALL_SHOT_PILOT_OUT="$out"
          echo "WALL_SHOT_PILOT_OUT=$out" >> "$GITHUB_ENV"
          echo "FREE_KICK_FONT_CACHE=$out/font-cache" >> "$GITHUB_ENV"
          test "$GITHUB_REPOSITORY" = PapiSalgueroM/ballpark-hero
          test "$GITHUB_REPOSITORY_ID" = 1195729679
          test "$GITHUB_REF" = refs/heads/codex/career-finite-wall
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$BASE_SOURCE" != "$GITHUB_SHA"
          [[ "$BASE_SOURCE" =~ ^[a-f0-9]{40}$ ]]
          git fetch --no-tags --depth=1 origin "$BASE_SOURCE" > "$out/base-fetch.log" 2>&1
          git merge-base --is-ancestor "$BASE_SOURCE" "$GITHUB_SHA" > "$out/base-ancestry.log" 2>&1
          git diff --exit-code "$BASE_SOURCE" HEAD -- . ':!docs/**' ':!.github/workflows/career-finite-wall.yml' ':!scripts/qa/playWallShotModern.mjs' ':!scripts/qa/fixtures/wallShotModern.entry.tsx' ':!scripts/qa/fixtures/wallShotModern.html' ':!scripts/qa/fixtures/wallShotModern.vite.mjs' ':!src/components/soccer-career/DrillBoard.tsx' ':!scripts/qa/runWallShotSourceControls.mjs' ':!scripts/qa/wallShot.manifest.json' ':!scripts/qa/wallShotSourceControls.json' ':!scripts/qa/wallShotMomentControls.json' > "$out/protected-functional-source.log"
          for file in package.json package-lock.json vitest.config.ts scripts/lib/offlineTransport.cjs scripts/lib/playwrightLoader.mjs scripts/lib/hostLikeServer.mjs scripts/qa/siteMenuNavigationSupport.mjs scripts/qa/freeKickLab1070.mjs scripts/sweepWeight.mjs scripts/playHomeFold.mjs;do
            git show "$BASE_SOURCE:$file" | cmp "$file" -
          done
          node <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict'),crypto=require('node:crypto'),cp=require('node:child_process');
          const required=['src/lib/careerDrills.ts','src/components/soccer-career/DrillBoard.tsx','src/components/soccer-career/TrainingPanel.tsx','src/index.css','src/hooks/useArcadeFlight.ts','src/hooks/useRevealScroll.ts','scripts/qa/fixtures/wallShotModern.entry.tsx','scripts/qa/fixtures/wallShotModern.html','scripts/qa/fixtures/wallShotModern.vite.mjs','scripts/qa/playWallShotModern.mjs','scripts/qa/siteMenuNavigationSupport.mjs','scripts/lib/hostLikeServer.mjs','scripts/lib/playwrightLoader.mjs'];
          const pins=JSON.parse(process.env.WALL_SHOT_EXPECTED_PINS_JSON),hash=b=>crypto.createHash('sha256').update(b).digest('hex'),out=process.env.WALL_SHOT_PILOT_OUT;
          assert(pins&&typeof pins==='object'&&!Array.isArray(pins));assert.deepEqual(Object.keys(pins).sort(),[...required].sort());assert.equal(required.length,13);
          for(const file of required){assert.match(pins[file],/^[a-f0-9]{64}$/);assert.equal(hash(fs.readFileSync(file)),pins[file],'WALL_PILOT_INPUT '+file);}
          const names=cp.execFileSync('git',['ls-files','-z'],{encoding:'utf8'}).split('\0');assert.equal(names.pop(),'');assert(names.length>0);assert.equal(new Set(names).size,names.length);
          const binding={sourceHead:process.env.GITHUB_SHA,trackedCount:names.length,playwrightVersion:'1.64.0',pins};
          fs.writeFileSync(out+'/browser-binding.json',JSON.stringify(binding,null,2)+'\n',{flag:'wx'});
          const workflow='.github/workflows/career-finite-wall.yml',blob=cp.execFileSync('git',['rev-parse','HEAD:'+workflow],{encoding:'utf8'}).trim();
          assert.equal(cp.execFileSync('git',['hash-object',workflow],{encoding:'utf8'}).trim(),blob);
          fs.writeFileSync(out+'/source-binding.json',JSON.stringify({phase:'browser-pilot',applicationQualified:false,source:process.env.GITHUB_SHA,base:process.env.BASE_SOURCE,tree:cp.execFileSync('git',['rev-parse','HEAD^{tree}'],{encoding:'utf8'}).trim(),workflow:{file:workflow,gitBlobSha1:blob,sha256:hash(fs.readFileSync(workflow))},requiredInputs:13,bindingSha256:hash(fs.readFileSync(out+'/browser-binding.json'))},null,2)+'\n',{flag:'wx'});
          NODE
          node <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict'),crypto=require('node:crypto');
          const proofPins={"scripts/qa/runWallShotSourceControls.mjs":"cd4032aa107e3d44ddb23593d0e52d43488ea3400fdf781c0b47a196b8a0f9bc","scripts/qa/wallShot.manifest.json":"e72f8819fc3bca9a128d3bdb28202d91a6510495154b16adf23a806b5dd4b4a6","scripts/qa/wallShotSourceControls.json":"2d7199f2a86efa12b618a7f16b4f944b3ed936fa45de558e45acd8c5ca2d1493","scripts/qa/wallShotMomentControls.json":"b04ba053ceed1854dafab35e27f0b81bf7212b9993d2b93fcfdf0a91e4e72eb1"},manifest=JSON.parse(fs.readFileSync('scripts/qa/wallShot.manifest.json','utf8')),hash=b=>crypto.createHash('sha256').update(b).digest('hex');
          assert.equal(manifest.suites.length,12);assert.equal(manifest.suites.reduce((n,s)=>n+s.tests,0),84);assert.equal(Object.keys(manifest.pins).length,18);
          for(const [file,pin] of Object.entries({...proofPins,...manifest.pins}))assert.equal(hash(fs.readFileSync(file)),pin,'WALL_FULL_INPUT '+file);
          NODE
          git rev-parse HEAD > "$out/head.txt"
          git ls-files -z | sort -z > "$out/source-members.before"
          git ls-files -z | sort -z | xargs -0 sha256sum > "$out/source-before.sha256"
          git diff --exit-code HEAD > "$out/source-clean-before.log"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Locked application installation and full dependency inventory
        id: app_dependencies
        timeout-minutes: 10
        run: |
          set -euo pipefail
          out="$WALL_SHOT_PILOT_OUT"
          printf '%s %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" 'setup npm-ci' | tee -a "$out/setup-progress.log"
          npm ci > "$out/install.log" 2>&1
          find node_modules -path node_modules/.vite -prune -o -type f -print0 | sort -z | xargs -0 sha256sum > "$out/dependencies.sha256"
          find node_modules -path node_modules/.vite -prune -o -type f -print0 | sort -z > "$out/dependency-members.before"
      - name: Actual app types
        id: types
        run: |
          set -euo pipefail
          out="$WALL_SHOT_PILOT_OUT"
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          : > "$out/types.transport";status=0
          SIM_OFFLINE_RECEIPT="$out/types.transport" node_modules/.bin/tsc --noEmit -p tsconfig.app.json > "$out/types.log" 2>&1 || status=$?
          printf '%s\n' "$status" > "$out/types.exit";test "$status" -eq 0
          test ! -s "$out/types.transport"
      - name: Existing legacy drill and moment outcome evidence
        id: legacy
        run: |
          set -euo pipefail
          out="$WALL_SHOT_PILOT_OUT";export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          : > "$out/legacy-drills.transport";: > "$out/legacy-moments.transport"
          SIM_OFFLINE_RECEIPT="$out/legacy-drills.transport" timeout --signal=TERM --kill-after=15s 6m node scripts/simCareerDrills.mjs > "$out/legacy-drills.log" 2>&1
          SIM_OFFLINE_RECEIPT="$out/legacy-moments.transport" timeout --signal=TERM --kill-after=15s 6m node scripts/simSeasonMoments.mjs > "$out/legacy-moments.log" 2>&1
          test ! -s "$out/legacy-drills.transport";test ! -s "$out/legacy-moments.transport"
      - name: Exact twelve functional suites and 84 registered cases
        id: functional
        run: |
          set -euo pipefail
          out="$WALL_SHOT_PILOT_OUT";export CAREER_WALL_OUT="$out"
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          cp scripts/qa/wallShot.manifest.json "$out/pilot-manifest.json"
          : > "$out/tests.transport"
          SIM_OFFLINE_RECEIPT="$out/tests.transport" timeout --signal=TERM --kill-after=15s 8m node <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict'),path=require('node:path'),{spawnSync}=require('node:child_process'),out=process.env.CAREER_WALL_OUT;
          const manifest=JSON.parse(fs.readFileSync(out+'/pilot-manifest.json','utf8')),files=manifest.suites.map(s=>s.file);
          const log=fs.openSync(out+'/tests.log','wx');
          let run;try{run=spawnSync('node_modules/.bin/vitest',['run',...files,'--maxWorkers=1','--no-file-parallelism','--reporter=default','--reporter=json','--outputFile='+out+'/tests.json'],{stdio:['ignore',log,log],env:process.env,timeout:360000,killSignal:'SIGTERM'});}finally{fs.closeSync(log);}
          fs.writeFileSync(out+'/tests.exit',run.status===null?'NO_EXIT_CODE\n':String(run.status)+'\n',{flag:'wx'});
          fs.writeFileSync(out+'/tests-process.json',JSON.stringify({status:run.status,signal:run.signal,error:run.error?{name:run.error.name,message:run.error.message,code:run.error.code}:null},null,2)+'\n',{flag:'wx'});
          assert.equal(run.error,undefined,'actual Vitest spawn/timeout error');assert.equal(run.signal,null);assert.equal(run.status,0);
          const r=JSON.parse(fs.readFileSync(out+'/tests.json','utf8')),expected=new Map(manifest.suites.map(s=>[path.resolve(s.file),s.tests])),total=manifest.suites.reduce((n,s)=>n+s.tests,0);
          assert.equal(r.success,true);assert.equal(r.testResults.length,expected.size);assert.equal(r.numTotalTests,total);assert.equal(r.numPassedTests,total);assert.equal(r.numFailedTests,0);assert.equal(r.numPendingTests,0);assert.equal(r.numTodoTests,0);
          const seen=new Set();
          for(const suite of r.testResults){const file=path.resolve(suite.name);assert(expected.has(file),file);assert(!seen.has(file),file);seen.add(file);assert.equal(suite.status,'passed');assert.equal(suite.assertionResults.length,expected.get(file));for(const row of suite.assertionResults){assert.equal(row.status,'passed',row.fullName);assert.deepEqual(row.failureMessages,[]);}}
          assert.equal(seen.size,expected.size);
          const runtimeKeys=['numRuntimeErrorTestSuites','numUnhandledErrors'];for(const key of runtimeKeys)if(key in r)assert.equal(r[key],0);if('unhandledErrors'in r)assert.deepEqual(r.unhandledErrors,[]);
          assert.doesNotMatch(fs.readFileSync(out+'/tests.log','utf8'),/Unhandled\s+(?:Errors?|Rejections?)|Uncaught\s+Exceptions?/i);
          fs.writeFileSync(out+'/functional-pilot-admission.json',JSON.stringify({status:'FUNCTIONAL_PILOT_ONLY',source:process.env.GITHUB_SHA,suites:manifest.suites,passed:total,observedRuntimeCounters:Object.fromEntries(runtimeKeys.filter(k=>k in r).map(k=>[k,r[k]])),absentRuntimeCountersUnknown:runtimeKeys.filter(k=>!(k in r)),applicationQualified:false,scope:'Functional suite step only. Build, browser and copied controls have separate results.'},null,2)+'\n',{flag:'wx'});
          NODE
          test ! -s "$out/tests.transport"
      - name: Twenty-five actual copied-source faults with healthy and restored runs
        id: source_controls
        if: ${{ !cancelled() && steps.functional.outcome == 'success' }}
        run: |
          set -euo pipefail
          out="$WALL_SHOT_PILOT_OUT"
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          git show "$ORIGINAL_BASELINE_SOURCE:src/lib/careerDrills.ts" > "$out/control-core.original.ts"
          : > "$out/copied-controls.transport";status=0
          SIM_OFFLINE_RECEIPT="$out/copied-controls.transport" timeout --signal=TERM --kill-after=15s 19m node scripts/qa/runWallShotSourceControls.mjs --manifest scripts/qa/wallShot.manifest.json --recipes scripts/qa/wallShotSourceControls.json --moment-recipes scripts/qa/wallShotMomentControls.json --core-original "$out/control-core.original.ts" --out "$out/copied-source" > "$out/copied-controls.log" 2>&1 || status=$?
          printf '%s\n' "$status" > "$out/copied-controls.exit";test "$status" -eq 0
          test ! -s "$out/copied-controls.transport"
          node <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict'),r=JSON.parse(fs.readFileSync(process.env.WALL_SHOT_PILOT_OUT+'/copied-source/report.json','utf8'));
          assert.equal(r.status,'WALL_COPIED_SOURCE_CONTROLS_ADMITTED');assert.equal(r.complete,true);assert.equal(r.source,process.env.GITHUB_SHA);assert.equal(r.controlCount,25);assert.equal(r.observedRunCount,77);assert.deepEqual(r.errors,[]);assert.equal(r.applicationQualified,false);
          NODE
      - name: Freeze game-gate feedback before browser provisioning
        id: functional_feedback
        if: ${{ !cancelled() && steps.app_dependencies.outcome == 'success' }}
        run: |
          set -euo pipefail
          out="$WALL_SHOT_PILOT_OUT";snapshot="$RUNNER_TEMP/wall-shot-functional-feedback"
          test ! -e "$snapshot";mkdir "$snapshot";failed=0
          for file in source-binding.json browser-binding.json head.txt base-ancestry.log protected-functional-source.log source-clean-before.log source-before.sha256 source-members.before dependencies.sha256 dependency-members.before install.log setup-progress.log types.log types.exit types.transport legacy-drills.log legacy-moments.log legacy-drills.transport legacy-moments.transport pilot-manifest.json tests.log tests.json tests.exit tests-process.json tests.transport functional-pilot-admission.json copied-controls.log copied-controls.exit copied-controls.transport control-core.original.ts;do
            if test -f "$out/$file";then cp -- "$out/$file" "$snapshot/$file";fi
          done
          if test -f "$out/copied-source/report.json";then cp -- "$out/copied-source/report.json" "$snapshot/copied-source-report.json";fi
          sha256sum --check "$out/source-before.sha256" > "$snapshot/source-hold.log" 2>&1 || failed=1
          sha256sum --check "$out/dependencies.sha256" > "$snapshot/dependency-hold.log" 2>&1 || failed=1
          git ls-files -z | sort -z > "$snapshot/source-members.after"
          cmp "$out/source-members.before" "$snapshot/source-members.after" || failed=1
          find node_modules -path node_modules/.vite -prune -o -type f -print0 | sort -z > "$snapshot/dependency-members.after"
          cmp "$out/dependency-members.before" "$snapshot/dependency-members.after" || failed=1
          printf 'phase=functional-feedback-only\napplicationQualified=false\nsource=%s\ntypes=%s\nlegacy=%s\nfunctional=%s\nsourceControls=%s\nsnapshotHoldsExit=%s\ncopiedControlData=summary-only-full-raw-remains-in-final-artifact\n' "$GITHUB_SHA" '${{ steps.types.outcome }}' '${{ steps.legacy.outcome }}' '${{ steps.functional.outcome }}' '${{ steps.source_controls.outcome }}' "$failed" > "$snapshot/feedback.txt"
          (cd "$snapshot";find . -type f ! -path ./evidence.sha256 -print0 | sort -z | xargs -0 sha256sum) > "$snapshot/evidence.sha256"
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && (steps.functional_feedback.outcome == 'success' || steps.functional_feedback.outcome == 'failure') }}
        with:
          name: career-finite-wall-functional-feedback-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wall-shot-functional-feedback/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/setup-python@v5
        id: browser_python
        if: ${{ !cancelled() && steps.types.outcome == 'success' }}
        with:
          python-version: '3.12'
      - name: Isolated browser tools and font provisioning
        id: browser_provision
        if: ${{ !cancelled() && steps.types.outcome == 'success' && steps.browser_python.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          set -euo pipefail
          out="$WALL_SHOT_PILOT_OUT"
          browser_tools="$RUNNER_TEMP/wall-shot-browser-tools"; test ! -e "$browser_tools"
          printf '%s %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" 'setup playwright-install' | tee -a "$out/setup-progress.log"
          npm install --prefix "$browser_tools" --no-save --package-lock=false playwright@1.64.0 > "$out/browser-install.log" 2>&1
          test ! -e node_modules/playwright; test ! -e node_modules/playwright-core
          ln -s "$browser_tools/node_modules/playwright" node_modules/playwright
          ln -s "$browser_tools/node_modules/playwright-core" node_modules/playwright-core
          printf '%s %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" 'setup chromium-install' | tee -a "$out/setup-progress.log"
          node "$browser_tools/node_modules/playwright/cli.js" install --with-deps chromium > "$out/chromium-install.log" 2>&1
          printf '%s %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" 'setup python-font-tools' | tee -a "$out/setup-progress.log"
          python -m pip install fonttools pillow > "$out/python-install.log" 2>&1
          printf '%s %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" 'setup font-prefetch' | tee -a "$out/setup-progress.log"
          FREE_KICK_FONT_CACHE="$out/font-cache" node scripts/qa/freeKickLab1070.mjs --prefetch-fonts-only > "$out/font-prefetch.log" 2>&1
          manifest_sha=$(sha256sum "$out/font-cache/manifest.json" | cut -d ' ' -f 1)
          echo "FONT_CACHE_MANIFEST_SHA256=$manifest_sha" >> "$GITHUB_ENV"
          printf '%s %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" 'setup inventories' | tee -a "$out/setup-progress.log"
          find "$browser_tools/node_modules" -type f -print0 | sort -z | xargs -0 sha256sum > "$out/browser-tools.sha256"
          find "$out/font-cache" -type f -print0 | sort -z | xargs -0 sha256sum > "$out/font-cache.sha256"
          find "$browser_tools/node_modules" -type f -print0 | sort -z > "$out/browser-members.before"
          find "$out/font-cache" -type f -print0 | sort -z > "$out/font-members.before"
          printf '%s %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" 'setup complete' | tee -a "$out/setup-progress.log"
      - name: Serial plain production build
        id: build
        if: ${{ !cancelled() && steps.types.outcome == 'success' && steps.browser_provision.outcome == 'success' }}
        run: |
          set -euo pipefail
          out="$WALL_SHOT_PILOT_OUT"
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          : > "$out/build.transport"
          status=0;SIM_OFFLINE_RECEIPT="$out/build.transport" npm run build > "$out/build.log" 2>&1 || status=$?
          printf '%s\n' "$status" > "$out/build.exit";test "$status" -eq 0
          test ! -s "$out/build.transport"
          find dist ! -type d ! -type f -print > "$out/dist-nonregular.txt"; test ! -s "$out/dist-nonregular.txt"
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > "$out/dist.sha256"
          find dist -type f -print0 | sort -z > "$out/dist-members.before"
          tar -cf "$out/dist.tar" -C dist .
      - name: Build the styled actual TrainingPanel fixture
        id: fixture
        if: ${{ !cancelled() && steps.types.outcome == 'success' && steps.browser_provision.outcome == 'success' && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          out="$WALL_SHOT_PILOT_OUT";export WALL_SHOT_OUT="$out/wall-shot"
          echo "WALL_SHOT_OUT=$WALL_SHOT_OUT" >> "$GITHUB_ENV"
          test ! -e "$WALL_SHOT_OUT";mkdir "$WALL_SHOT_OUT"
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          : > "$out/fixture-build.transport";status=0
          SIM_OFFLINE_RECEIPT="$out/fixture-build.transport" timeout --signal=TERM --kill-after=15s 5m node_modules/.bin/vite build --config scripts/qa/fixtures/wallShotModern.vite.mjs > "$out/fixture-build.log" 2>&1 || status=$?
          printf '%s\n' "$status" > "$out/fixture-build.exit";test "$status" -eq 0
          test ! -s "$out/fixture-build.transport"
          find "$WALL_SHOT_OUT/fixture-dist" ! -type d ! -type f -print > "$out/fixture-nonregular.txt";test ! -s "$out/fixture-nonregular.txt"
          find "$WALL_SHOT_OUT/fixture-dist" -type f -print0 | sort -z | xargs -0 sha256sum > "$out/fixture-dist.sha256"
          find "$WALL_SHOT_OUT/fixture-dist" -type f -print0 | sort -z > "$out/fixture-members.before"
          tar -cf "$out/fixture-dist.tar" -C "$WALL_SHOT_OUT/fixture-dist" .
      - name: Six real browser contexts and twenty-four Wall Shot attempts
        id: browser
        if: ${{ !cancelled() && steps.types.outcome == 'success' && steps.browser_provision.outcome == 'success' && steps.build.outcome == 'success' && steps.fixture.outcome == 'success' }}
        run: |
          set -euo pipefail
          out="$WALL_SHOT_PILOT_OUT"
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
