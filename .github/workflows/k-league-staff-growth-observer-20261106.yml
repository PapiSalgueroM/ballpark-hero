           if(fs.existsSync(path.join(out,'OBSERVER-ADMITTED.json'))){assert.equal(receipts.length,4);assert(referenceHeld);}
           put('SOURCE-HOLDS.json',{holds,receipts,allReachedReceiptsEmpty:true,fullReferenceHeld:referenceHeld,sourceMutation:false});
          }else throw new Error('Unknown observer phase');
          STAFF_CONTROLLER
          cp "$STAFF_CONTROLLER" "$QA_OUT/controller.mjs"
      - name: Bind two exact source trees and the sole diagnostic workflow
        run: |
          set -euo pipefail
          node "$STAFF_CONTROLLER" preflight > "$QA_OUT/logs/preflight.stdout.log" 2> "$QA_OUT/logs/preflight.stderr.log"
          cp "$GITHUB_WORKSPACE/qa-source/.github/workflows/k-league-staff-growth-observer-20261106.yml" "$QA_OUT/workflow.yml"
      - name: Authenticate the sole full prior Staff V2 original and complete reference
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          set +e
          node "$STAFF_CONTROLLER" auth > "$QA_OUT/logs/auth.stdout.log" 2> "$QA_OUT/logs/auth.stderr.log"
          native_exit=$?
          printf '%s\n' "$native_exit" > "$QA_OUT/auth.exit" || exit 1
          exit "$native_exit"
      - name: Install held dependencies separately without changing either source
        run: |
          set -euo pipefail
          test "$(bun --version)" = 1.4.4
          bun --version > "$QA_OUT/logs/bun-version.log"
          node --version > "$QA_OUT/logs/node-version.log"
          for role in main current; do
            (
              cd "$GITHUB_WORKSPACE/source-$role"
              set +e
              bun install --frozen-lockfile > "$QA_OUT/logs/$role-install.stdout.log" 2> "$QA_OUT/logs/$role-install.stderr.log"
              native_exit=$?
              printf '%s\n' "$native_exit" > "$QA_OUT/logs/$role-install.exit" || exit 1
              test "$native_exit" = 0 || exit "$native_exit"
              set -e
              node -p "JSON.stringify({router:require('react-router-dom/package.json').version,vite:require('vite/package.json').version,rollup:JSON.parse(require('fs').readFileSync('node_modules/rollup/package.json','utf8')).version,esbuild:require('esbuild/package.json').version,typescript:require('typescript/package.json').version})" > "$QA_OUT/logs/$role-dependency-versions.json"
              git diff --exit-code HEAD -- package.json package-lock.json bun.lock bun.lockb
            )
          done
      - name: Proper types and one identity-preserving observed normal per source
        run: |
          set -euo pipefail
          set +e
          node "$STAFF_CONTROLLER" run > "$QA_OUT/logs/controller.stdout.log" 2> "$QA_OUT/logs/controller.stderr.log"
          native_exit=$?
          printf '%s\n' "$native_exit" > "$QA_OUT/controller.exit" || exit 1
          exit "$native_exit"
      - name: Hold all three source trees and every existing silent receipt
        if: always()
        run: |
          set -euo pipefail
          set +e
          node "$STAFF_CONTROLLER" hold > "$QA_OUT/logs/hold.stdout.log" 2> "$QA_OUT/logs/hold.stderr.log"
          native_exit=$?
          printf '%s\n' "$native_exit" > "$QA_OUT/hold.exit" || exit 1
          exit "$native_exit"
      - name: Pack bounded complete output or fatal diagnostic
        id: pack
        if: always()
        run: |
          set +e
          set -uo pipefail
          archive="$RUNNER_TEMP/k-league-staff-growth-observer-evidence.tar.gz"
          tar -czf "$archive" -C "$QA_OUT" . > "$RUNNER_TEMP/k-league-staff-growth-observer-pack.log" 2>&1
          pack_exit=$?
          printf '%s\n' "$pack_exit" > "$QA_OUT/pack-native.exit" || exit 1
          if [[ "$pack_exit" == 0 && -f "$archive" && "$(stat -c %s "$archive")" -le 50000000 ]]; then
            sha256sum "$archive" > "$archive.sha256" || exit 1
            printf 'archive=%s\n' "$archive" >> "$GITHUB_OUTPUT" || exit 1
            exit 0
          fi
          printf '%s\n' 'DIAGNOSTIC_ONLY_NO_COMPLETE_OUTPUT_PROOF: full pack failed or exceeded50000000bytes' > "$QA_OUT/DIAGNOSTIC-ONLY.txt" || exit 1
          cp "$RUNNER_TEMP/k-league-staff-growth-observer-pack.log" "$QA_OUT/pack.log" || exit 1
          diagnostic="$RUNNER_TEMP/k-league-staff-growth-observer-diagnostic.tar.gz"
          diagnostic_dir="$RUNNER_TEMP/k-league-staff-growth-observer-diagnostic"
          mkdir -p "$diagnostic_dir/logs" "$diagnostic_dir/transport" || exit 1
          find "$QA_OUT" -maxdepth 1 -type f ! -name '*.tar.gz' ! -name '*.tgz' -exec cp '{}' "$diagnostic_dir/" \; || exit 1
          cp -R "$QA_OUT/logs/." "$diagnostic_dir/logs/" || exit 1
          cp -R "$QA_OUT/transport/." "$diagnostic_dir/transport/" || exit 1
          for folder in reference reference-auth; do if test -d "$QA_OUT/$folder"; then cp -R "$QA_OUT/$folder" "$diagnostic_dir/" || exit 1; fi; done
          printf '%s\n' 'Full capture files are excluded from this fatal-only archive; no complete capture proof.' > "$diagnostic_dir/OBSERVER-CAPTURE-INCOMPLETE.txt" || exit 1
          for role in qa main current; do
            if test -d "$QA_OUT/roles/$role"; then
              mkdir -p "$diagnostic_dir/roles/$role" || exit 1
              find "$QA_OUT/roles/$role" -maxdepth 1 -type f -exec cp '{}' "$diagnostic_dir/roles/$role/" \; || exit 1
              for kept in before after types observed; do if test -d "$QA_OUT/roles/$role/$kept"; then cp -R "$QA_OUT/roles/$role/$kept" "$diagnostic_dir/roles/$role/" || exit 1; fi; done
            fi
          done
          tar -czf "$diagnostic" -C "$diagnostic_dir" . || exit 1
          test "$(stat -c %s "$diagnostic")" -le 50000000 || exit 1
          sha256sum "$diagnostic" > "$diagnostic.sha256" || exit 1
          printf 'archive=%s\n' "$diagnostic" >> "$GITHUB_OUTPUT" || exit 1
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k-league-staff-growth-observer-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.pack.outputs.archive }}
            ${{ steps.pack.outputs.archive }}.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
