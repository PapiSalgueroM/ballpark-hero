name: Player Bingo World Cup name order original
on:
  push:
    branches: [codex/player-bingo-world-cup-name-order-original-qa-20261110]
permissions:
  actions: read
  contents: read
jobs:
  original:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: UTC
      SIM_NETWORK: offline
      SIM_OFFLINE_RECEIPT: player-bingo-world-cup-name-order-original/offline.log
      PLAYER_BINGO_WORLD_CUP_ORDER_RAW: player-bingo-world-cup-name-order-original/public-cases.raw.json
      BASE_HEAD: '71a7184a1c546767932ec259617d53d60a178901'
      BASE_TREE: '57574165d664a30ba69dad567a412d7b9111ac50'
      HELPER_BLOB: 'e767b5cf8678faa0f5dde9c8f151e67979505815'
      PLAN_BLOB: '9fee7b7ca1c43b7aebbe868e4133b4272b912dd1'
      EVIDENCE: player-bingo-world-cup-name-order-original
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - name: Authenticate admitted active entry and exact original Player Bingo source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test ! -e "$EVIDENCE"
          if grep -Eq '__[A-Z][A-Z0-9_]*__' .github/workflows/player-bingo-world-cup-name-order-20261110.yml; then echo 'Unresolved original workflow binding'; exit 1; fi
          mkdir "$EVIDENCE"
          touch "$SIM_OFFLINE_RECEIPT"
          git rev-parse HEAD > "$EVIDENCE/head.txt"
          git rev-parse 'HEAD^{tree}' > "$EVIDENCE/tree.txt"
          git ls-files -s > "$EVIDENCE/source-before.txt"
          sha256sum package.json package-lock.json > "$EVIDENCE/locks-before.txt"
          git diff --exit-code HEAD -- .
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';

          const { BASE_HEAD, BASE_TREE, HELPER_BLOB, PLAN_BLOB, EVIDENCE: out } = process.env;
          const repo = 'PapiSalgueroM/ballpark-hero';
          const workflow = '.github/workflows/player-bingo-world-cup-name-order-20261110.yml';
          const helper = 'src/test/playerBingoWorldCupOrder.original.test.ts';
          const plan = 'docs/plans/2026-11-10-player-bingo-world-cup-name-order.md';
          const edge = 'src/lib/playerBingo.ts';
          const preflight = {"run":42841603730,"job":129917975922,"artifact":13775812721,"steps":11,"zipBytes":1015350,"zipSHA256":"2faffbbe68c935d6bab25913cc8860e937a2266bbd1baabe74772c00adc637fe","head":"d0ffea35728316598e6f596abf7924151b686a6f","tree":"8ab158d29593659051bd8110efda6e4eefea3c98","branch":"codex/player-bingo-world-cup-name-order-preflight-qa-20261110","workflow":"c3f34a1bb3d0deb68cf2ad98c3b06035c654a1a6","independentAuditSHA256":"35264b7983288d58be22e1c92549fea4019ab66cf32f9ee12291ff07364ebb69"};
          const held = {"src/App.tsx":"8bfedf7aaa1d076e0f0c8e2216c7e46632cd8a33","src/data/gameRegistry.ts":"f560b40a74d1468ac72dfde4ee6fec6635a9a255","public/player-bingo/index.html":"af701f7f56f498defe0da719fcae5b63c0dd1b91","src/pages/PlayerBingo.tsx":"e26d20a48216f9eb3a1faf62389d561814dcbe99","src/lib/playerBingo.ts":"885fab96ef9f463d5447245c6f1f4937ce68aafa","src/test/playerBingoWorldCupAlias.test.ts":"b6f57a7f4f1b14a95e90912f54cdbcc34cc3491c","scripts/lib/offlineTransport.cjs":"0fda542a2649fe5da937c6976fd0f5b6073e74b6","index.html":"12598fe720eec4fc88d3d33c53ede612d018150c","package.json":"2ff64986fb76ebc51b706f2fd24765768874008a","package-lock.json":"97d6f12a052f25f400462938c241789a083f0bfe","vite.config.ts":"0112b6ac4f2ad80b2fc04f9ec2f7185300913e7d","tailwind.config.ts":"f83c4f4032d359bc9285828eac3b0961a46c6b17","postcss.config.js":"2aa7205d4b402a1bdfbe07110c61df920b370066","tsconfig.json":"6b68d80b7d92d0c4a5d774897f2bedfa95b42669","tsconfig.app.json":"51f581dd91641b4c1f1219f646788e73cf6bf00c","tsconfig.node.json":"3133162c20350e1741b94b8d2ff77b811bec8363","bun.lockb":"5d9d33a3bf4f45fa099e2aa3014149e034981149","bun.lock":"dff081dcd34a1aa928ddc90d910774a6b855dfe3","src/lib/whoAmI.ts":"8b6da5c480857fa8b7164d50c322eaccd0f6a8af","src/test/playerBingoTransport.test.ts":"9494d6e391350d9da76aa7a6a1e0f5022df3e62b","scripts/simPlayerBingoLoad.mjs":"b76c0794a40f87f54e3766111d6a9f9f16eff548","supabase/migrations/20260901_round_389_world_cup_2026_squads.sql":"2292b204f63ea2850ca7a8150d9957794617dd02"};
          assert.equal(process.env.GITHUB_REPOSITORY,repo);
          const api = process.env.GITHUB_API_URL + '/repos/' + repo;
          const request = async path => {
            const response = await fetch(api+path,{headers:{
              Accept:'application/vnd.github+json',Authorization:'Bearer '+process.env.GH_TOKEN,
              'X-GitHub-Api-Version':'2022-11-28',
            },redirect:'error'});
            assert.equal(response.status,200,path);
            return response.json();
          };
          const [run,jobs,artifacts] = await Promise.all([
            request('/actions/runs/'+preflight.run),request('/actions/runs/'+preflight.run+'/jobs?per_page=100'),
            request('/actions/runs/'+preflight.run+'/artifacts?per_page=100'),
          ]);
          assert.deepEqual([run.id,run.status,run.conclusion,run.event,run.run_attempt,run.path,run.head_sha,run.head_commit.tree_id,run.head_branch,run.repository.full_name],
            [preflight.run,'completed','success','push',1,workflow,preflight.head,preflight.tree,preflight.branch,repo]);
          assert.equal(jobs.jobs.length,1);
          const [job] = jobs.jobs;
          assert.deepEqual([job.id,job.run_id,job.name,job.status,job.conclusion,job.head_sha,job.steps.length],
            [preflight.job,preflight.run,'preflight','completed','success',preflight.head,preflight.steps]);
          assert(job.steps.every(step => step.status==='completed' && step.conclusion==='success'));
          assert.equal(artifacts.artifacts.length,1);
          const [artifact] = artifacts.artifacts;
          assert.deepEqual([artifact.id,artifact.name,artifact.expired,artifact.size_in_bytes,artifact.digest,artifact.workflow_run.id,artifact.workflow_run.head_sha],
            [preflight.artifact,'player-bingo-world-cup-name-order-active-preflight-'+preflight.run,false,preflight.zipBytes,'sha256:'+preflight.zipSHA256,preflight.run,preflight.head]);
          delete process.env.GH_TOKEN;
          const git = (...args) => execFileSync('git',args,{encoding:'utf8',maxBuffer:16*1024*1024}).trimEnd();
          const sha = (algorithm,body) => createHash(algorithm).update(body).digest('hex');
          const blob = body => sha('sha1',Buffer.concat([Buffer.from('blob '+body.length+'\0'),body]));
          const head = git('rev-parse','HEAD');
          assert.equal(head,process.env.GITHUB_SHA);
          assert.deepEqual(git('rev-list','--parents','-n','1','HEAD').split(' '),[head,BASE_HEAD]);
          assert.equal(git('rev-parse',BASE_HEAD+'^{tree}'),BASE_TREE);
          const pins = {...held,[helper]:HELPER_BLOB,[plan]:PLAN_BLOB};
          for(const [file,want] of Object.entries(pins)){
            assert.match(want,/^[0-9a-f]{40}$/);
            assert.equal(git('rev-parse','HEAD:'+file),want,file);
            assert.equal(blob(fs.readFileSync(file)),want,file+' physical bytes');
            if(Object.hasOwn(held,file)) assert.equal(git('rev-parse',BASE_HEAD+':'+file),want,file+' admitted base');
          }
          const owned = [helper,plan,workflow].sort();
          assert.deepEqual(git('diff','--name-status','--no-renames',BASE_HEAD,'HEAD').split('\n').sort(),owned.map(file=>'A\t'+file).sort());
          const tree = ref => git('ls-tree','-r','-z',ref).split('\0').filter(Boolean);
          const pathOf = row => row.split('\t')[1];
          const previous = tree(BASE_HEAD), current = tree('HEAD');
          assert.deepEqual([previous.length,current.length],[5802,5805]);
          assert.deepEqual(current.filter(row => !owned.includes(pathOf(row))),previous);
          assert.deepEqual(current.filter(row => owned.includes(pathOf(row))).map(row => row.split(' ')[0]),['100644','100644','100644']);
          assert.equal(current.filter(row => /^(src|public|scripts)\//.test(pathOf(row))).length,4670);
          const selected = { 'held-player-bingo-resolver.ts':edge, 'candidate-test.ts':helper, 'candidate-plan.md':plan, 'candidate-workflow.yml':workflow };
          const selectedBodies = Object.entries(selected).map(([file,path]) => {
            const bytes = fs.readFileSync(path);
            fs.writeFileSync(out+'/'+file,bytes);
            return {file,path,bytes:bytes.length,sha256:sha('sha256',bytes),blob:blob(bytes)};
          });
          fs.writeFileSync(out+'/source-receipt.json',JSON.stringify({
            status:'passed',head,tree:git('rev-parse','HEAD^{tree}'),parent:BASE_HEAD,parentTree:BASE_TREE,basePR:543,
            activePreflight:preflight,route:'/player-bingo',category:'Soccer',owned,pins,selectedBodies,
            heldRows:5802,trackedRows:5805,scopedSourceRows:4670,rootConfigurations:11,productUnchanged:true,
          },null,2)+'\n');
          NODE
      - name: Install locked dependencies, freeze physical source, and verify app types
        run: |
          set -euo pipefail
          npm ci 2>&1 | tee "$EVIDENCE/install.log"
          cat > "$EVIDENCE/physical.mjs" <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          const stage = process.argv[2];
          assert(['before', 'after'].includes(stage));
          const out = process.env.EVIDENCE;
          const index = execFileSync('git', ['ls-files', '-z'], { encoding: 'utf8' }).split('\0').filter(Boolean);
          const source = index.map(file => {
            const bytes = fs.readFileSync(file);
            return [file, bytes.length, createHash('sha256').update(bytes).digest('hex')];
          });
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const installed = Object.entries(lock.packages).filter(([file]) =>
            file.startsWith('node_modules/') && fs.existsSync(file + '/package.json')
          ).map(([file, entry]) => {
            const version = JSON.parse(fs.readFileSync(file + '/package.json', 'utf8')).version;
            assert.equal(version, entry.version, file);
            return [file, version];
          });
          assert.equal(source.length, 5805);
          assert.equal(installed.length, 521);
          assert.equal(fs.statSync(process.env.SIM_OFFLINE_RECEIPT).size, 0);
          for (const [name, data] of [['tracked', source], ['installed', installed]]) {
            const body = JSON.stringify(data);
            if (stage === 'after') assert.equal(body, fs.readFileSync(out + '/' + name + '-before.json', 'utf8'));
            fs.writeFileSync(out + '/' + name + '-' + stage + '.json', body);
          }
          NODE
          node "$EVIDENCE/physical.mjs" before
          node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee "$EVIDENCE/types.log"
      - name: Require the original Player Bingo World Cup name-order mismatch
        run: |
          set -euo pipefail
          test ! -e "$PLAYER_BINGO_WORLD_CUP_ORDER_RAW"
          result=0
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" timeout --signal=TERM 90s \
            node_modules/.bin/vitest run src/test/playerBingoWorldCupOrder.original.test.ts --reporter=json --outputFile="$EVIDENCE/vitest-result.json" > "$EVIDENCE/helper.log" 2>&1 || result=$?
          cat "$EVIDENCE/helper.log"
          printf '%s\n' "$result" > "$EVIDENCE/helper-exit.txt"
          test "$result" -eq 1
          test -s "$PLAYER_BINGO_WORLD_CUP_ORDER_RAW"
          test ! -s "$SIM_OFFLINE_RECEIPT"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';

          const out = process.env.EVIDENCE;
          const marker = 'PLAYER_BINGO_WORLD_CUP_NAME_ORDER';
          const log = fs.readFileSync(out+'/helper.log','utf8');
          const vitest = JSON.parse(fs.readFileSync(out+'/vitest-result.json','utf8'));
          assert.deepEqual([vitest.numFailedTestSuites,vitest.numTotalTests,vitest.numFailedTests,vitest.numPassedTests,vitest.success],
            [1,1,1,0,false],'Exactly one actual failed test');
          assert.equal(vitest.testResults.length,1);
          const [suite]=vitest.testResults;
          assert(suite.name.endsWith('/src/test/playerBingoWorldCupOrder.original.test.ts'));
          assert.equal(suite.assertionResults.length,1);
          const [test]=suite.assertionResults;
          assert.equal(test.status,'failed');
          assert.equal(test.failureMessages.length,1);
          const error=test.failureMessages[0].replace(/\x1b\[[0-9;]*m/g,'');
          const named='AssertionError: '+marker+': both World Cup tiles support the same identity in alternate name order';
          assert(error.startsWith(named),'Exact named original assertion');
          assert(!/UnhandledPromiseRejection|ERR_MODULE_NOT_FOUND|ERR_UNKNOWN_FILE_EXTENSION|SIM_OFFLINE_BLOCK|Unhandled Errors/i.test(log+'\n'+error));
          const errors=[named];
          const raw = fs.readFileSync(process.env.PLAYER_BINGO_WORLD_CUP_ORDER_RAW);
          const evidence = JSON.parse(raw.toString('utf8'));
          const checks = (() => {
          assert.equal(test.title,'records original World Cup tile outcomes for one held fictional name-order boundary');
          assert.equal(raw.length,5130);
          assert.equal(createHash('sha256').update(raw).digest('hex'),"119a07557a2a55f299dec098ad9018a23f50af2129ff3b2f12a03d3845d0c619");
          assert.equal(raw.toString('utf8'),JSON.stringify(evidence)+'\n');
          assert.equal(evidence.schema,'player-bingo-world-cup-name-order-v1');
          assert.deepEqual(evidence.source,{"loader":{"path":"src/lib/playerBingo.ts","blob":"885fab96ef9f463d5447245c6f1f4937ce68aafa","sha256":"dd87795e3079ace09572f6ca8e42d511721c60b3a655c7e770555d0d87c14855","bytes":54755},"transportExample":{"path":"src/test/playerBingoWorldCupAlias.test.ts","blob":"b6f57a7f4f1b14a95e90912f54cdbcc34cc3491c","sha256":"537008a3e07d747c7556cd404b15d31a58fe7ae2441a4735ae41e14b9d47baef","bytes":7836}});
          const rows=[["alternate-order-2022","Lumen Arden Vale","Fixture North",2022,false,false],["exact-order-2022","Arden Vale Lumen","Fixture North",2022,true,true],["reverse-wrong-country","Lumen Arden Vale","Fixture South",2022,false,false],["reverse-absent-country","Lumen Arden Vale","",2022,false,false],["exact-order-2026","Arden Vale Lumen","Fixture North",2026,true,false],["unrelated-2022","Ivo Fen Corin","Fixture North",2022,false,false]];
          assert.deepEqual(evidence.cases.map(c=>c.id),rows.map(r=>r[0]));
          const observations=evidence.cases.map((c,i)=>{
            const [id,player_name,nationality,world_cup_year,any,y2022]=rows[i];
            const key=player_name.toLowerCase();
            assert.deepEqual(c.squad,{player_name,nationality,world_cup_year,date_of_birth:'2000-06-12'});
            assert.equal(c.poolSize,101);
            assert.deepEqual(c.selected,{name:'Arden Vale Lumen',nationality:'Fixture North',age:26,year:2026,birthYear:i===1||i===4?2000:null});
            assert.deepEqual(c.keys,{any:[key],y2022:world_cup_year===2022?[key]:[],winner:[]});
            assert.deepEqual(c.criteria,{'wc-any':{test:any,support:any},'wc-2022':{test:y2022,support:y2022}});
            assert.deepEqual(c.transport,{
              counts:{seed:1,latest:3,history:2,worldCup:1,ballonDor:1},sharedLiveSignal:true,fetchCalls:0,
              worldCupQueries:[{table:'world_cup_players',calls:[
                ['select',['player_name, world_cup_year, nationality, date_of_birth']],['gte',['world_cup_year',2010]],
                ['order',['id',{ascending:true}]],['range',[0,999]],
              ]}],
            });
            return {id,any:c.criteria['wc-any'],y2022:c.criteria['wc-2022']};
          });
          return {status:'passed',cases:observations.length,reads:48,worldCupReads:6,realFetches:0,
            originalMismatch:{id:observations[0].id,tiles:['wc-any','wc-2022']},healthyControls:observations.slice(1).map(x=>x.id),observations,
            limits:'Fictional names and mocked reads through the held loader and actual tile rules. Reported sessions remain open.'};
          })();
          assert.equal(checks.status,'passed');
          fs.writeFileSync(out+'/original-result.json',JSON.stringify({
            status:'expected-original-player-bingo-world-cup-name-order-mismatch',marker,expectedProcessExit:1,
            assertion:errors[0],rawBytes:raw.length,rawSHA256:createHash('sha256').update(raw).digest('hex'),checks,
          },null,2)+'\n',{flag:'wx'});
          NODE
      - name: Verify unchanged physical source and locked offline run
        if: always()
        run: |
          set -euo pipefail
          git ls-files -s > "$EVIDENCE/source-after.txt"
          sha256sum package.json package-lock.json > "$EVIDENCE/locks-after.txt"
          cmp "$EVIDENCE/source-before.txt" "$EVIDENCE/source-after.txt"
          cmp "$EVIDENCE/locks-before.txt" "$EVIDENCE/locks-after.txt"
          git diff --exit-code HEAD -- .
          node "$EVIDENCE/physical.mjs" after
          test ! -s "$SIM_OFFLINE_RECEIPT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: player-bingo-world-cup-name-order-original-${{ github.run_id }}
          path: player-bingo-world-cup-name-order-original
          retention-days: 14
          if-no-files-found: error
