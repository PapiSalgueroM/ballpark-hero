name: NBA master-list build and unchanged budgets
on:
  push:
    branches: [codex/nba-fo-market-build-20261104]
permissions:
  contents: read
  actions: read
concurrency:
  group: nba-fo-market-build-${{ github.ref }}
  cancel-in-progress: false
env:
  CI: '1'
  SIM_NETWORK: offline
  QUALIFIED_APPLICATION_CORE: dd7273e4835a8048fc7745e5fe8bdf4de571c9d5
  QUALIFIED_APPLICATION_TREE: e92145c08b3ce3091077818d4c9802c5b7805ea7
  JOINED_QA_CORE: 2e1636291e70d4435a246d5e6d608cdffb2e265f
  JOINED_QA_TREE: 13354de2c75d56901a4b8c28e4cfc677c3d2500e
  JOIN_BASE: 9a2d7527686f878397a7d4bff722d605fa5ce3cd
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ENGINES: chromium
      SEO_SPLIT_BASE_REF: HEAD
      SWEEP_OFFLINE: '1'
      PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Hold the exact top-games feature source
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/nba-fo-market-build"
          mkdir -p "$OUT/logs" "$OUT/units" "$OUT/raw" "$OUT/transport"
          echo "QA_OUT=$OUT" >> "$GITHUB_ENV"
          git rev-parse HEAD HEAD^{tree} > "$OUT/source.txt"
          test "$(git rev-parse HEAD^)" = "$JOINED_QA_CORE"
          test "$(git rev-parse HEAD^^{tree})" = "$JOINED_QA_TREE"
          test "$(git diff --name-status HEAD^ HEAD)" = $'A\t.github/workflows/nba-fo-market-build-20261104.yml'
          git diff --name-status "$JOIN_BASE" HEAD > "$OUT/changed-paths.txt"
          git ls-files -z | sort -z | xargs -0 sha256sum > "$OUT/source-before.sha256"
          cp .github/workflows/nba-fo-market-build-20261104.yml "$OUT/workflow.yml"
          git status --porcelain=v1 --untracked-files=all > "$OUT/status-before.txt"
          test ! -s "$OUT/status-before.txt"
          test "$(git rev-parse "$QUALIFIED_APPLICATION_CORE^{tree}")" = "$QUALIFIED_APPLICATION_TREE"
          git diff --exit-code "$QUALIFIED_APPLICATION_CORE" "$JOINED_QA_CORE" -- src public package.json package-lock.json bun.lock bun.lockb index.html > "$OUT/application-bridge.txt"
          test ! -e .tmp-fx/career-records-tests.json
          test ! -L .tmp-fx/career-records-tests.json
          if [[ -e .tmp-fx || -L .tmp-fx ]]; then test -d .tmp-fx; test ! -L .tmp-fx; fi
          : > "$OUT/records-leaf-owned-before.txt"
          while read -r file pin; do test "$(git rev-parse "HEAD:$file")" = "$pin"; done <<'PINS'
          scripts/qa/nbaFoMarketFixtures.mjs 473594059a1941e20e1816b3f8605cc49cc171c0
          scripts/qa/nbaFoMarketBrowser.mjs 52aa2d850c2737500f1a0ad09ed3f210914325f8
          scripts/qa/nbaFoMarketScrollControl.mjs 721abd49a07377c626ca80c5190c9a8bea1d682d
          scripts/qa/nbaFoMarketAssets.mjs 25abcbb80279d502f4360c3893b9445b07e29fc6
          scripts/qa/nativeScrollReady.mjs 671f460aa088d42b44c435a03594cf26695d6e09
          PINS
          for script in nbaFoMarketFixtures nbaFoMarketBrowser nbaFoMarketScrollControl nbaFoMarketAssets nativeScrollReady; do node --check "scripts/qa/$script.mjs"; done
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Install held application and existing QA tools
        run: |
          set -euo pipefail
          bun --version | tee "$QA_OUT/logs/bun-version.log"
          bun install --frozen-lockfile 2>&1 | tee "$QA_OUT/logs/bun-install.log"
          node -p "JSON.stringify({router:require('react-router-dom/package.json').version,vite:require('vite/package.json').version,rollup:JSON.parse(require('fs').readFileSync('node_modules/rollup/package.json','utf8')).version})" > "$QA_OUT/logs/build-versions.json"
          git diff --exit-code -- package.json package-lock.json
          npm install --prefix "$RUNNER_TEMP/popular-games-tools" --package-lock=false --no-audit --no-fund playwright@1.64.0 2>&1 | tee "$QA_OUT/logs/playwright-install.log"
          test ! -e node_modules/playwright
          test ! -e node_modules/playwright-core
          ln -s "$RUNNER_TEMP/popular-games-tools/node_modules/playwright" node_modules/playwright
          ln -s "$RUNNER_TEMP/popular-games-tools/node_modules/playwright-core" node_modules/playwright-core
          "$RUNNER_TEMP/popular-games-tools/node_modules/.bin/playwright" install --with-deps chromium 2>&1 | tee "$QA_OUT/logs/chromium-install.log"
          python3 -m pip install --target "$RUNNER_TEMP/popular-games-python" fonttools pillow 2>&1 | tee "$QA_OUT/logs/python-install.log"
          echo "PYTHONPATH=$RUNNER_TEMP/popular-games-python" >> "$GITHUB_ENV"
      - name: Proper joined application types
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$GITHUB_WORKSPACE/scripts/lib/offlineTransport.cjs"
          : > "$QA_OUT/transport/types.log"
          SIM_OFFLINE_RECEIPT="$QA_OUT/transport/types.log" node_modules/.bin/tsc --noEmit -p tsconfig.app.json > "$QA_OUT/logs/types.log" 2>&1
          test ! -s "$QA_OUT/transport/types.log"
      - name: Existing save and home guards, normal build, twenty readers and all unchanged page caps
        timeout-minutes: 25
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$GITHUB_WORKSPACE/scripts/lib/offlineTransport.cjs"
          classify_receipt() {
            local name="$1" receipt="$2"
            local allowed='^\[SIM_OFFLINE_BLOCK\] external browser route continue https://fonts\.(googleapis|gstatic)\.com$'
            if [[ "$name" == sweep-weight ]]; then
              allowed="$allowed|^\[SIM_OFFLINE_BLOCK\] external browser route continue https://flagcdn\.com$"
            elif [[ "$name" != build ]]; then
              if [[ -s "$receipt" ]]; then cat "$receipt"; return 1; fi
              return 0
            fi
            local status=0
            grep -Ev "$allowed" "$receipt" || status=$?
            if [[ "$status" == 1 ]]; then return 0; fi
            return 1
          }
          run_gate() {
            local name="$1"
            shift
            local receipt="$QA_OUT/transport/$name.log"
            : > "$receipt"
            SIM_OFFLINE_RECEIPT="$receipt" "$@" 2>&1 | tee "$QA_OUT/logs/$name.log"
            if ! classify_receipt "$name" "$receipt"; then
              echo "Unexpected blocked transport in $name" >&2
              return 1
            fi
            # Every refusal is retained and counted, never credited as zero transport.
            if [[ -s "$receipt" ]]; then
              wc -l "$receipt" | tee "$QA_OUT/logs/$name-blocked-attempts.txt"
            fi
          }
          run_gate simSaveKeeper node scripts/simSaveKeeper.mjs
          run_gate simHomeFront node scripts/simHomeFront.mjs
          grep -F '7) Continue playing:' "$QA_OUT/logs/simHomeFront.log"
          run_gate simSoccerCareerRecords node scripts/simSoccerCareerRecords.mjs

          grep -F 'simSoccerCareerRecords: 12 outcome checks green, three effective controls caught' "$QA_OUT/logs/simSoccerCareerRecords.log"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import path from 'node:path';import crypto from 'node:crypto';import assert from 'node:assert/strict';
          const out=process.env.QA_OUT,leaf=path.resolve('.tmp-fx/career-records-tests.json');
          assert(fs.existsSync(out+'/records-leaf-owned-before.txt'));
          const dir=fs.lstatSync(path.dirname(leaf)),stat=fs.lstatSync(leaf);
          assert(dir.isDirectory()&&!dir.isSymbolicLink());assert(stat.isFile()&&!stat.isSymbolicLink());
          assert.equal(fs.realpathSync(path.dirname(leaf)),path.join(fs.realpathSync('.'),'.tmp-fx'));
          const bytes=fs.readFileSync(leaf),report=JSON.parse(bytes),rows=report.testResults.flatMap(x=>x.assertionResults);
          assert.equal(report.numTotalTests,12);assert.equal(report.numPassedTests,11);assert.equal(report.numFailedTests,1);
          assert.equal(rows.length,12);assert.equal(rows.filter(x=>x.status==='passed').length,11);assert.equal(rows.filter(x=>x.status==='failed').length,1);
          const retained=out+'/records-last-control-tests.json',sha=crypto.createHash('sha256').update(bytes).digest('hex');
          fs.writeFileSync(retained,bytes,{flag:'wx'});assert.deepEqual(fs.readFileSync(retained),bytes);
          fs.unlinkSync(leaf);
          fs.writeFileSync(out+'/records-output-retention.json',JSON.stringify({sourceLeaf:'.tmp-fx/career-records-tests.json',retained:'records-last-control-tests.json',bytes:bytes.length,sha256:sha,nativeSimExit:0,ordinaryNonSymlinkLeaf:true,copyReadBackExact:true,removedOnlyExactLeaf:true,meaning:'Last negative-control report, intentionally 1 failed and 11 passed. Healthy 12 outcomes and three effective controls are in the complete native log.'},null,2)+'\n');
          NODE
          git status --porcelain=v1 --untracked-files=all > "$QA_OUT/status-after-records.txt"
          test ! -s "$QA_OUT/status-after-records.txt"
          run_gate build npm run build
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > "$QA_OUT/dist-before.sha256"
          tar -czf "$QA_OUT/completed-dist.tar.gz" dist
          sha256sum "$QA_OUT/completed-dist.tar.gz" > "$QA_OUT/completed-dist.tar.gz.sha256"
          tar -tzf "$QA_OUT/completed-dist.tar.gz" > "$QA_OUT/completed-dist-members.txt"
          export BASE=http://127.0.0.1:4173
          export SWEEP_BASE="$BASE"
          export SWEEP_OFFLINE=1
          export SIM_OFFLINE_RECEIPT="$QA_OUT/transport/server.log"
          : > "$SIM_OFFLINE_RECEIPT"
          node scripts/lib/hostLikeServer.mjs dist 4173 > "$QA_OUT/logs/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 40); do
            if curl --fail --silent "$BASE/" > /dev/null; then ready=1; break; fi
            kill -0 "$server_pid"
            sleep 1
          done
          test "$ready" = 1
          run_gate sweep-weight node scripts/sweepWeight.mjs
          readers=(
            simAdsense simBrand simHeadTags simHiddenPages simHubs
            simIndexNow simIndexing simInternalLinks simNoRivalNames simPrerender
            simPrerenderBoot simRetiredRoutes simSchema simSitemap simSnapshotAssets
            simSiteSearch simGuideHeadings simHarnessAnchors
          )
          for reader in "${readers[@]}"; do
            run_gate "$reader" node "scripts/$reader.mjs"
          done
          run_gate simSeoTitles node scripts/simSeoTitles.mjs
          run_gate simSeoMetaSplit env SEO_SPLIT_ONLY=/nba-front-office node scripts/simSeoMetaSplit.mjs
          test ! -s "$QA_OUT/transport/server.log"
      - name: Source-held NBA3 native journeys on this completed build
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$GITHUB_WORKSPACE/scripts/lib/offlineTransport.cjs"
          : > "$QA_OUT/transport/nba-fixtures.log"
          SIM_OFFLINE_RECEIPT="$QA_OUT/transport/nba-fixtures.log" node scripts/qa/nbaFoMarketFixtures.mjs --out "$QA_OUT/nba-fixtures" --dist dist --core "$JOINED_QA_CORE" > "$QA_OUT/logs/nba-fixtures.log" 2>&1
          test ! -s "$QA_OUT/transport/nba-fixtures.log"
          find "$QA_OUT/nba-fixtures" -type f -print0 | sort -z | xargs -0 sha256sum > "$QA_OUT/fixture-before.sha256"
          : > "$QA_OUT/transport/native-server.log"
          SIM_OFFLINE_RECEIPT="$QA_OUT/transport/native-server.log" node scripts/lib/hostLikeServer.mjs dist 4174 > "$QA_OUT/logs/native-server.log" 2>&1 &
          native_pid=$!
          trap 'kill "$native_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 40); do if curl --fail --silent http://127.0.0.1:4174/ > /dev/null; then ready=1; break; fi; kill -0 "$native_pid"; sleep 1; done
          test "$ready" = 1
          : > "$QA_OUT/transport/nba-assets-before.log"
          SIM_OFFLINE_RECEIPT="$QA_OUT/transport/nba-assets-before.log" node scripts/qa/nbaFoMarketAssets.mjs "$QA_OUT/nba-fixtures/manifest.json" dist "$QA_OUT/nba-assets" http://127.0.0.1:4174 before > "$QA_OUT/logs/nba-assets-before.log" 2>&1
          test ! -s "$QA_OUT/transport/nba-assets-before.log"
          : > "$QA_OUT/transport/nba-scroll-control.log"
          SIM_OFFLINE_RECEIPT="$QA_OUT/transport/nba-scroll-control.log" node scripts/qa/nbaFoMarketScrollControl.mjs --out "$QA_OUT/nba-scroll-control" --fixtures "$QA_OUT/nba-fixtures" --dist dist --base-url http://127.0.0.1:4174 > "$QA_OUT/logs/nba-scroll-control.log" 2>&1
          test ! -s "$QA_OUT/transport/nba-scroll-control.log"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const r=JSON.parse(fs.readFileSync(process.env.QA_OUT+'/nba-scroll-control/control-report.json'));
          assert.equal(r.status,'admitted');assert.equal(r.child.exit,1);
          assert.equal(r.owned.marker,'NBA_FO_NATIVE_SIGN_DOCUMENT_SCROLL');assert.equal(r.owned.actualVerticalPixels,10);
          assert.equal(r.owned.trustedClicks,1);assert.equal(r.owned.completeSignedFrameEqual,true);assert.equal(r.owned.completeSignedBytesEqual,true);
          for(const key of ['sourceHeld','distHeld','normalHeld','inverseWholeSourceExact'])assert.equal(r[key],true,key);
          NODE
          : > "$QA_OUT/transport/nba-native.log"
          SIM_OFFLINE_RECEIPT="$QA_OUT/transport/nba-native.log" node scripts/qa/nbaFoMarketBrowser.mjs --out "$QA_OUT/nba-native" --fixtures "$QA_OUT/nba-fixtures" --dist dist --base-url http://127.0.0.1:4174 > "$QA_OUT/logs/nba-native.log" 2>&1
          test ! -s "$QA_OUT/transport/nba-native.log"
          : > "$QA_OUT/transport/nba-assets-after.log"
          SIM_OFFLINE_RECEIPT="$QA_OUT/transport/nba-assets-after.log" node scripts/qa/nbaFoMarketAssets.mjs "$QA_OUT/nba-fixtures/manifest.json" dist "$QA_OUT/nba-assets" http://127.0.0.1:4174 after > "$QA_OUT/logs/nba-assets-after.log" 2>&1
          test ! -s "$QA_OUT/transport/nba-assets-after.log"
          test ! -s "$QA_OUT/transport/native-server.log"
          find "$QA_OUT/nba-fixtures" -type f -print0 | sort -z | xargs -0 sha256sum > "$QA_OUT/fixture-after.sha256"
          cmp "$QA_OUT/fixture-before.sha256" "$QA_OUT/fixture-after.sha256"
          sha256sum --check "$QA_OUT/fixture-before.sha256" > "$QA_OUT/fixture-held.log"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';import crypto from 'node:crypto';import{execFileSync}from'node:child_process';
          const out=process.env.QA_OUT,r=JSON.parse(fs.readFileSync(out+'/nba-native/report.json')),m=JSON.parse(fs.readFileSync(out+'/nba-fixtures/manifest.json'));
          assert.equal(r.status,'passed');assert.equal(r.contexts.length,3);assert(r.contexts.every(x=>x.status==='passed'));
          assert.equal(r.screenshots.length,3);assert.equal(new Set(r.screenshots).size,3);
          assert.deepEqual(r.contexts.map(x=>x.width),[320,390,1280]);
          for(const key of ['sourceHeld','distHeld'])assert.equal(r[key],true,key);
          fs.writeFileSync(out+'/native-admission.json',JSON.stringify({status:'passed',contexts:3,photos:3,controlsAdmittedBeforeNormal:true,scope:'NBA320/390/1280:33 visible sorted free agents, row33 evidence, row31 GM-off/on signing and full-save reload, valid preferred rotation and existing tail cap/full15/waiver refusals. Controlled complete fictional saves; no full-fleet or naturally reached career claim.'},null,2)+'\n');
          const git=(...args)=>execFileSync('git',args,{encoding:'utf8'}).trim(),sha=b=>crypto.createHash('sha256').update(b).digest('hex');
          fs.writeFileSync(out+'/build-proof.json',JSON.stringify({status:'native-phase-passed',finalSourceAndOutputHoldsRequired:true,applicationCore:process.env.QUALIFIED_APPLICATION_CORE,applicationTree:process.env.QUALIFIED_APPLICATION_TREE,qaCore:process.env.JOINED_QA_CORE,qaTree:process.env.JOINED_QA_TREE,source:git('rev-parse','HEAD'),tree:git('rev-parse','HEAD^{tree}'),payloadFiles:m.distBefore.length,distDigest:m.distDigest,fixtureManifestSHA256:sha(fs.readFileSync(out+'/nba-fixtures/manifest.json')),completedTarSHA256:sha(fs.readFileSync(out+'/completed-dist.tar.gz')),nativeContexts:3,nativePhotos:3},null,2)+'\n');
          NODE
      - name: Retain full source holds and transport evidence
        if: always()
        run: |
          set +e
          set -uo pipefail
          OUT="$(printenv QA_OUT || true)"
          if [[ -z "$OUT" ]]; then OUT="$RUNNER_TEMP/nba-fo-market-build"; fi
          mkdir -p "$OUT/logs" "$OUT/transport"
          echo "QA_OUT=$OUT" >> "$GITHUB_ENV"
          git ls-files -z | sort -z | xargs -0 sha256sum > "$OUT/source-after.sha256" 2> "$OUT/source-capture-errors.log"
          source_capture=$?
          git diff --exit-code HEAD > "$OUT/source-diff.txt" 2> "$OUT/source-diff-errors.log"
          source_diff=$?
          git status --porcelain=v1 --untracked-files=all > "$OUT/status-after.txt" 2> "$OUT/status-capture-errors.log"
          status_capture=$?
          hold=0
          if [[ "$source_capture" != 0 || "$source_diff" != 0 || "$status_capture" != 0 ]]; then hold=1; fi
          if [[ -f "$OUT/source-before.sha256" ]]; then
            cmp "$OUT/source-before.sha256" "$OUT/source-after.sha256" || hold=1
            sha256sum --check "$OUT/source-before.sha256" > "$OUT/source-held.log" 2>&1 || hold=1
          else
            echo "Before source inventory missing. No source hold credit." > "$OUT/source-hold-unknown.txt"
            hold=1
          fi
          if [[ -f "$OUT/status-before.txt" ]]; then cmp "$OUT/status-before.txt" "$OUT/status-after.txt" || hold=1; else hold=1; fi
          if [[ -s "$OUT/status-after.txt" ]]; then hold=1; fi
          if [[ -f "$OUT/dist-before.sha256" && -d dist ]]; then
            find dist -type f -print0 | sort -z | xargs -0 sha256sum > "$OUT/dist-after.sha256" 2> "$OUT/dist-capture-errors.log"
            if [[ "$?" != 0 ]]; then hold=1; fi
            cmp "$OUT/dist-before.sha256" "$OUT/dist-after.sha256" || hold=1
            sha256sum --check "$OUT/dist-before.sha256" > "$OUT/dist-held.log" 2>&1 || hold=1
          else
            echo "Completed-build inventory missing. No dist hold credit." > "$OUT/dist-hold-unknown.txt"
            hold=1
          fi
          QA_OUT="$OUT" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const out=process.env.QA_OUT,rows=fs.readdirSync(out+'/transport').sort().map(file=>{
            const lines=fs.readFileSync(out+'/transport/'+file,'utf8').split('\n').filter(Boolean);
            return{file,blockedAttempts:lines.length,fontBlockedAttempts:lines.filter(line=>/^\[SIM_OFFLINE_BLOCK\] external browser route continue https:\/\/fonts\.(googleapis|gstatic)\.com$/.test(line)).length,flagBlockedAttempts:lines.filter(line=>line==='[SIM_OFFLINE_BLOCK] external browser route continue https://flagcdn.com').length};
          });
          fs.writeFileSync(out+'/transport-summary.json',JSON.stringify({receipts:rows,meaning:'Blocked attempts retained. Empty Node receipts are not browser or provider availability.'},null,2)+'\n');
          NODE
          if [[ "$?" != 0 ]]; then hold=1; fi
          printf '{"sourceCapture":%s,"sourceDiff":%s,"statusCapture":%s,"holdExit":%s}\n' "$source_capture" "$source_diff" "$status_capture" "$hold" > "$OUT/hold-exits.json"
          test "$hold" = 0
      - name: Bound retained focused evidence
        id: artifact
        if: always()
        run: |
          set -euo pipefail
          test -d "$QA_OUT"
          test "$(du -sb "$QA_OUT" | cut -f1)" -lt 150000000
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.artifact.outputs.ready == 'true' }}
        with:
          name: nba-fo-market-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nba-fo-market-build
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
