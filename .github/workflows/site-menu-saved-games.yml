          function paths(){return git(['ls-files','-z']).toString().split('\0').filter(Boolean).sort();}
          function snapshot(root=ROOT){return paths().map(file=>{const f=path.join(root,file),s=fs.lstatSync(f);assert(s.isFile()&&!s.isSymbolicLink(),'SAVED_MENU_SOURCE_REGULAR '+file);return {file,...pin(fs.readFileSync(f))};});}
