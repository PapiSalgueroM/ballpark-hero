name: Analytics paused status1445

on:
  push:
    branches: [codex/consent-analytics-1445-red, codex/consent-analytics-1445]
    paths-ignore: ['docs/**']
  workflow_dispatch:
    inputs:
      phase:
        description: Original intended RED before product changes, or Green with copied fault
        required: true
        default: original
        type: choice
        options: [original, green]

permissions:
  contents: read
concurrency:
  group: consent-analytics-1445-${{ github.sha }}-${{ inputs.phase || github.ref_name }}
  cancel-in-progress: false

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      CI: '1'
      SIM_NETWORK: offline
      TZ: UTC
      PHASE: ${{ inputs.phase || (github.ref == 'refs/heads/codex/consent-analytics-1445-red' && 'original' || 'green') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Bind exact source and install
        run: |
          set -euo pipefail
          mkdir analytics-status-artifacts
          git rev-parse HEAD > analytics-status-artifacts/head.txt
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf '%s\n' "$PHASE" > analytics-status-artifacts/phase.txt
          test "$PHASE" = original || test "$PHASE" = green
          if [[ "$PHASE" = original ]]; then
            git fetch --no-tags --depth=1 origin bc79b526cb69a4e913416c77c6dba00fe9401a16 > analytics-status-artifacts/baseline-fetch.log 2>&1
            git diff --exit-code bc79b526cb69a4e913416c77c6dba00fe9401a16 -- src scripts supabase public index.html package.json package-lock.json vitest.config.ts ':!src/test/analyticsPausedStatus1445.test.tsx' > analytics-status-artifacts/original-product-hold.log
          fi
          printf '%s\n' 'a7f50b82c4ca1c757ec98b53e30688b91b160e0b3216f0b3ec0b9ee3576ed124  src/lib/consentPreferences.ts' '8106f28dcd5faa8546de50e304af41add45b4fd43a15ccaf009dac809ab6be50  src/lib/consentedScripts.ts' | sha256sum --check > analytics-status-artifacts/tracking-pause-hold.log
          git ls-files -z src scripts supabase public .github index.html package.json package-lock.json vitest.config.ts | xargs -0 sha256sum > analytics-status-artifacts/source-before.sha256
          npm ci > analytics-status-artifacts/install.log 2>&1
      - name: Type gate and unchanged offline consent baselines
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          export SIM_OFFLINE_RECEIPT="$PWD/analytics-status-artifacts/transport.log"
          : > "$SIM_OFFLINE_RECEIPT"
          node_modules/.bin/tsc --noEmit -p tsconfig.app.json > analytics-status-artifacts/types.log 2>&1
          node_modules/.bin/vitest run src/test/consentPurposeGates.test.ts src/test/consentPrivacy1442.test.ts src/test/consentWithdrawal1442.test.ts src/test/consentSynchronization1442.test.tsx src/test/cookieConsentStorage.test.tsx src/test/helpConsentFocus.test.tsx src/test/rulesGateConsentFocus.test.tsx --reporter=json --outputFile=analytics-status-artifacts/baselines.json > analytics-status-artifacts/baselines.log 2>&1
          node --input-type=module <<'NODE'
          import fs from 'node:fs'; import assert from 'node:assert/strict';
          const r=JSON.parse(fs.readFileSync('analytics-status-artifacts/baselines.json','utf8'));
          assert.equal(r.success,true); assert.equal(r.numFailedTests,0); assert.equal(r.numPendingTests,0);
          assert.equal(r.numTodoTests,0); assert.equal(r.numTotalTests,74); assert.equal(r.numPassedTests,74);
          assert.equal(r.numRuntimeErrorTestSuites??0,0); assert.equal(r.numUnhandledErrors??0,0); assert.deepEqual(r.unhandledErrors??[],[]);
          assert.equal(r.testResults.length,7); assert(r.testResults.every(s=>s.status==='passed'&&s.assertionResults.length>0&&s.assertionResults.every(t=>t.status==='passed')));
          NODE
          test ! -s "$SIM_OFFLINE_RECEIPT"
      - name: Actual focused result and strict intended assertion attribution
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          export SIM_OFFLINE_RECEIPT="$PWD/analytics-status-artifacts/transport.log"
          status=0
          node_modules/.bin/vitest run src/test/analyticsPausedStatus1445.test.tsx --reporter=json --outputFile=analytics-status-artifacts/focused.json > analytics-status-artifacts/focused.log 2>&1 || status=$?
          STATUS="$status" node --input-type=module <<'NODE'
          import fs from 'node:fs'; import assert from 'node:assert/strict';
          const r=JSON.parse(fs.readFileSync('analytics-status-artifacts/focused.json','utf8'));
          const rows=r.testResults.flatMap(s=>s.assertionResults), expected='Analytics paused status1445 explains the pause without a dead control and preserves advertising, privacy and focus';
          assert.equal(r.numTotalTests,1); assert.equal(rows.length,1); assert.equal(rows[0].fullName,expected);
          assert.equal(r.numPendingTests,0); assert.equal(r.numTodoTests,0);
          assert.equal(r.testResults.length,1); assert.equal(r.numRuntimeErrorTestSuites??0,0); assert.equal(r.numUnhandledErrors??0,0); assert.deepEqual(r.unhandledErrors??[],[]);
          if(process.env.PHASE==='original') {
            assert.equal(Number(process.env.STATUS),1); assert.equal(r.success,false); assert.equal(r.numFailedTests,1); assert.equal(r.numPassedTests,0); assert.equal(rows[0].status,'failed');
            assert.equal(rows[0].failureMessages.length,1); assert.match(rows[0].failureMessages[0],/ANALYTICS_PAUSED_1445_DEAD_CONTROL/);
            assert.match(rows[0].failureMessages[0],/expected 1 to be \+?0/); assert.doesNotMatch(rows[0].failureMessages[0],/Cannot find|Failed to resolve|SyntaxError|ReferenceError|TypeError/);
          } else { assert.equal(Number(process.env.STATUS),0); assert.equal(r.success,true); assert.equal(r.numFailedTests,0); assert.equal(r.numPassedTests,1); assert.equal(rows[0].status,'passed'); }
          fs.writeFileSync('analytics-status-artifacts/focused-admission.json',JSON.stringify({phase:process.env.PHASE,sourceSha:process.env.GITHUB_SHA,exit:Number(process.env.STATUS),case:expected,result:process.env.PHASE==='original'?'INTENDED_RED':'PASS'},null,2));
          NODE
          test ! -s "$SIM_OFFLINE_RECEIPT"
      - name: Effective copied dead-checkbox fault after Green
        if: env.PHASE == 'green'
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          export SIM_OFFLINE_RECEIPT="$PWD/analytics-status-artifacts/transport.log"
          export FAULT_FILE="$PWD/analytics-status-artifacts/CookieConsent.dead-checkbox.tsx"
          node --input-type=module <<'NODE'
          import fs from 'node:fs'; import assert from 'node:assert/strict'; import {createHash} from 'node:crypto';
          const file='src/components/CookieConsent.tsx', source=fs.readFileSync(file,'utf8');
          const old='          <p data-analytics-paused-status="">\n            <strong>Analytics is paused.</strong> Google Analytics is off while we check its privacy settings.\n          </p>';
          const replacement='          <label className="inline-flex min-h-11 items-center gap-2 text-foreground">\n            <input type="checkbox" checked={false} disabled />\n            Analytics\n          </label>';
          assert.equal(source.split(old).length-1,1,'Expected one real status block'); const pos=source.indexOf(old);
          const copy=source.slice(0,pos)+replacement+source.slice(pos+old.length); assert.notEqual(copy,source);
          assert.equal(copy.slice(0,pos)+old+copy.slice(pos+replacement.length),source,'Whole inverse must match');
          fs.writeFileSync(process.env.FAULT_FILE,copy); const hash=x=>createHash('sha256').update(x).digest('hex');
          fs.writeFileSync('analytics-status-artifacts/fault-binding.json',JSON.stringify({file,copy:process.env.FAULT_FILE,sourceSha256:hash(source),copySha256:hash(copy),old,replacement,occurrences:1,wholeInverseExact:true},null,2));
          NODE
          export NO_DOUBLE_SWAP="$(node -e 'console.log(JSON.stringify({"@/components/CookieConsent":process.env.FAULT_FILE}))')"
          status=0
          node_modules/.bin/vitest run src/test/analyticsPausedStatus1445.test.tsx --reporter=json --outputFile=analytics-status-artifacts/fault.json > analytics-status-artifacts/fault.log 2>&1 || status=$?
          STATUS="$status" node --input-type=module <<'NODE'
          import fs from 'node:fs'; import assert from 'node:assert/strict';
          const r=JSON.parse(fs.readFileSync('analytics-status-artifacts/fault.json','utf8')), rows=r.testResults.flatMap(s=>s.assertionResults);
          assert.equal(Number(process.env.STATUS),1); assert.equal(r.success,false); assert.equal(r.numTotalTests,1); assert.equal(r.numFailedTests,1); assert.equal(r.numPassedTests,0); assert.equal(r.numPendingTests,0); assert.equal(r.numTodoTests,0); assert.equal(rows.length,1);
          assert.equal(r.testResults.length,1); assert.equal(r.numRuntimeErrorTestSuites??0,0); assert.equal(r.numUnhandledErrors??0,0); assert.deepEqual(r.unhandledErrors??[],[]);
          assert.equal(rows[0].fullName,'Analytics paused status1445 explains the pause without a dead control and preserves advertising, privacy and focus'); assert.equal(rows[0].status,'failed'); assert.equal(rows[0].failureMessages.length,1);
          assert.match(rows[0].failureMessages[0],/ANALYTICS_PAUSED_1445_DEAD_CONTROL/); assert.match(rows[0].failureMessages[0],/expected 1 to be \+?0/); assert.doesNotMatch(rows[0].failureMessages[0],/Cannot find|Failed to resolve|SyntaxError|ReferenceError|TypeError/);
          fs.writeFileSync('analytics-status-artifacts/fault-admission.json',JSON.stringify({sourceSha:process.env.GITHUB_SHA,exit:Number(process.env.STATUS),result:'INTENDED_DEAD_CONTROL_REJECTED'},null,2));
          NODE
          test ! -s "$SIM_OFFLINE_RECEIPT"
      - name: Six unchanged consent controls with physical bindings and actual assertions
        if: env.PHASE == 'green'
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          export SIM_OFFLINE_RECEIPT="$PWD/analytics-status-artifacts/transport.log"
          export LEGAL_PRIVACY_OUT="$PWD/analytics-status-artifacts"
          node scripts/simConsentWithdrawal1442.mjs > analytics-status-artifacts/consent-controls.log 2>&1
          node --input-type=module <<'NODE'
          import fs from 'node:fs'; import assert from 'node:assert/strict'; import {createHash} from 'node:crypto';
          const manifest=JSON.parse(fs.readFileSync('src/test/controls/consent1442/manifest.json','utf8'));
          const names=['staleOverlay','blockedRefresh','durableShadow','gpcRestore','expiredDraft','analyticsCollection'];
          assert.deepEqual(manifest.files.map(r=>r.name).sort(),names.sort());
          const hash=x=>createHash('sha256').update(x).digest('hex'), bindings=[];
          const proof=JSON.parse(fs.readFileSync('analytics-status-artifacts/consent-controls/report.json','utf8'));
          assert.equal(proof.complete,true); assert.equal(proof.cases.length,12);
          for(const row of manifest.files){
            const source=fs.readFileSync(row.source,'utf8'), copy=fs.readFileSync(row.copy,'utf8'), pos=source.indexOf(row.old);
            assert.equal(hash(source),row.sourceSha256);assert.equal(hash(copy),row.copySha256);assert.equal(source.split(row.old).length-1,1);
            assert.equal(source.slice(0,pos)+row.new+source.slice(pos+row.old.length),copy);assert.equal(copy.slice(0,pos)+row.old+copy.slice(pos+row.new.length),source);assert.notEqual(source,copy);
            for(const fault of [false,true]){
              const name=row.name+(fault?'-fault':'-actual'), r=JSON.parse(fs.readFileSync('analytics-status-artifacts/consent-controls/'+name+'.json','utf8'));
              const cases=r.testResults.flatMap(s=>s.assertionResults).filter(t=>t.title===row.testName);assert.equal(cases.length,1);assert.equal(cases[0].status,fault?'failed':'passed');assert.equal(r.numFailedTests,fault?1:0);
              assert.equal(r.numRuntimeErrorTestSuites??0,0);assert.equal(r.numUnhandledErrors??0,0);assert.deepEqual(r.unhandledErrors??[],[]);
              if(fault){const messages=cases[0].failureMessages.map(s=>s.replace(/\u001b\[[0-9;]*m/g,''));assert.equal(messages.length,1);assert.match(messages[0],/AssertionError|expected|expect\(element\)\.not\.toBeChecked/i);assert.doesNotMatch(messages[0],/Cannot find|Failed to resolve|SyntaxError|ReferenceError|TypeError/);bindings.push({name,sourceSha256:row.sourceSha256,copySha256:row.copySha256,wholeInverseExact:true,test:row.test,case:cases[0].fullName,actualFailure:messages[0]});}
            }
          }
          fs.writeFileSync('analytics-status-artifacts/consent-control-bindings.json',JSON.stringify(bindings,null,2));
          NODE
          test ! -s "$SIM_OFFLINE_RECEIPT"
      - name: Retain source and complete evidence holds
        if: always()
        run: |
          set -euo pipefail
          sha256sum --check analytics-status-artifacts/source-before.sha256 > analytics-status-artifacts/source-hold.log
          git diff --exit-code HEAD -- src scripts supabase public .github index.html package.json package-lock.json vitest.config.ts > analytics-status-artifacts/tracked-source-hold.log
          test ! -s analytics-status-artifacts/transport.log
          (cd analytics-status-artifacts; find . -type f ! -path ./evidence.sha256 -print0 | sort -z | xargs -0 sha256sum) > analytics-status-artifacts/evidence.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analytics-paused-status1445-${{ env.PHASE }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: analytics-status-artifacts/
          if-no-files-found: error
          retention-days: 7

  build_browser:
    needs: focused
    if: inputs.phase == 'green' || (github.event_name == 'push' && github.ref == 'refs/heads/codex/consent-analytics-1445')
    runs-on: ubuntu-latest
    timeout-minutes: 65
    defaults:
      run:
        shell: bash
    env:
      CI: '1'
      SIM_NETWORK: offline
      ENGINES: chromium
      TZ: UTC
      PRERENDER_ONLY: /privacy
      SEO_SPLIT_BASE_REF: bc79b526cb69a4e913416c77c6dba00fe9401a16
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bind source and protected baseline
        run: |
          set -euo pipefail
          mkdir analytics-build-artifacts
          git rev-parse HEAD > analytics-build-artifacts/head.txt
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags --depth=1 origin "$SEO_SPLIT_BASE_REF" > analytics-build-artifacts/baseline-fetch.log 2>&1
          git diff --exit-code "$SEO_SPLIT_BASE_REF" HEAD -- src scripts supabase public index.html package.json package-lock.json vitest.config.ts ':!src/components/CookieConsent.tsx' ':!src/pages/PrivacyPolicy.tsx' ':!src/test/analyticsPausedStatus1445.test.tsx' ':!src/test/controls/consent1442/expiredDraft.tsx' ':!src/test/controls/consent1442/manifest.json' ':!scripts/playConsentPrivacy1442.mjs' ':!scripts/qa/playAnalyticsStatus1445.mjs' ':!public/privacy/index.html' ':!public/sitemap.xml' ':!scripts/data/lastmod.json' > analytics-build-artifacts/protected-source-hold.log
          cat > analytics-build-artifacts/generated-semantic.py <<'PY'
          import copy
          import datetime
          import hashlib
          import json
          import os
          import pathlib
          import re
          import subprocess
          import sys
          import xml.etree.ElementTree as ET

          base = os.environ['SEO_SPLIT_BASE_REF']
          assert base == 'bc79b526cb69a4e913416c77c6dba00fe9401a16'
          out = pathlib.Path('analytics-build-artifacts')
          phase = sys.argv[1]
          assert phase in ('pre', 'post')
          allowed = {'public/privacy/index.html', 'public/sitemap.xml', 'scripts/data/lastmod.json'}
          changed = subprocess.check_output(['git', 'diff', '--name-only', base, '--', 'public', 'scripts/data/lastmod.json'], text=True).splitlines()
          assert len(changed) == len(set(changed)) <= 3
          assert set(changed) <= allowed, 'GENERATED_PATH_OUTSIDE_PRIVACY'
          prior = lambda name: subprocess.check_output(['git', 'show', base + ':' + name])
          ledger_before = json.loads(prior('scripts/data/lastmod.json'))
          ledger_after = json.loads(pathlib.Path('scripts/data/lastmod.json').read_bytes())

          def ledger_check(before, after):
              assert set(before) == set(after), 'GENERATED_LEDGER_KEYS_CHANGED'
              assert all(before[key] == after[key] for key in before if key != '/privacy'), 'GENERATED_OTHER_LEDGER_CHANGED'
              row = after['/privacy']
              assert isinstance(row, dict) and set(row) == {'hash', 'date'}, 'GENERATED_PRIVACY_LEDGER_SHAPE'
              assert isinstance(row['hash'], str) and re.fullmatch('[a-f0-9]{16}', row['hash']), 'GENERATED_PRIVACY_HASH_SHAPE'
              assert isinstance(row['date'], str) and datetime.date.fromisoformat(row['date']).isoformat() == row['date'], 'GENERATED_PRIVACY_DATE_SHAPE'

          def sitemap_rows(data):
              root = ET.fromstring(data)
              ns = '{http://www.sitemaps.org/schemas/sitemap/0.9}'
              assert root.tag == ns + 'urlset' and not root.attrib
              rows = {}
              for node in root:
                  assert node.tag == ns + 'url' and not node.attrib
                  fields = []
                  for child in node:
                      assert child.tag in [ns + tag for tag in ('loc', 'lastmod', 'changefreq', 'priority')]
                      assert not child.attrib and len(child) == 0
                      fields.append((child.tag[len(ns):], (child.text or '').strip()))
                  assert [key for key, value in fields] == ['loc', 'lastmod', 'changefreq', 'priority']
                  loc = fields[0][1]
                  assert loc.startswith('https://douknowball.com/') and loc not in rows
                  rows[loc] = fields
              assert rows
              return rows

          def sitemap_check(before, after, date):
              privacy = 'https://douknowball.com/privacy'
              assert list(before) == list(after), 'GENERATED_SITEMAP_URLS_CHANGED'
              assert all(before[key] == after[key] for key in before if key != privacy), 'GENERATED_OTHER_SITEMAP_ROW_CHANGED'
              assert [field for field in before[privacy] if field[0] != 'lastmod'] == [field for field in after[privacy] if field[0] != 'lastmod'], 'GENERATED_PRIVACY_SITEMAP_FIELDS_CHANGED'
              assert dict(after[privacy])['lastmod'] == date, 'GENERATED_PRIVACY_LASTMOD_DIFFERS_FROM_LEDGER'

          ledger_check(ledger_before, ledger_after)
          map_before = sitemap_rows(prior('public/sitemap.xml'))
          map_after = sitemap_rows(pathlib.Path('public/sitemap.xml').read_bytes())
          sitemap_check(map_before, map_after, ledger_after['/privacy']['date'])
          other_key = next(key for key in ledger_after if key.startswith('/') and key != '/privacy')
          bad_ledger = copy.deepcopy(ledger_after)
          bad_ledger[other_key]['hash'] = '0' * 16 if bad_ledger[other_key]['hash'] != '0' * 16 else '1' * 16
          assert bad_ledger != ledger_after
          try:
              ledger_check(ledger_before, bad_ledger)
          except AssertionError as error:
              assert str(error) == 'GENERATED_OTHER_LEDGER_CHANGED'
          else:
              raise AssertionError('Other ledger fault was accepted')
          other_url = next(key for key in map_after if key != 'https://douknowball.com/privacy')
          bad_map = copy.deepcopy(map_after)
          bad_map[other_url][1] = ('lastmod', '1900-01-01')
          assert bad_map != map_after
          try:
              sitemap_check(map_before, bad_map, ledger_after['/privacy']['date'])
          except AssertionError as error:
              assert str(error) == 'GENERATED_OTHER_SITEMAP_ROW_CHANGED'
          else:
              raise AssertionError('Other sitemap fault was accepted')
          (out / ('generated-semantic-' + phase + '.json')).write_text(json.dumps({'complete': True, 'baseline': base, 'phase': phase, 'allowedPaths': sorted(allowed), 'changedPaths': changed, 'ledgerEntries': len(ledger_after), 'sitemapRows': len(map_after), 'controls': ['other-ledger-entry', 'other-sitemap-row'], 'privacyLedger': ledger_after['/privacy']}, indent=2) + '\n')
          PY
          python analytics-build-artifacts/generated-semantic.py pre > analytics-build-artifacts/generated-semantic-pre.log 2>&1
          git ls-files -z src scripts supabase .github index.html package.json package-lock.json vitest.config.ts ':!scripts/data/lastmod.json' | xargs -0 sha256sum > analytics-build-artifacts/source-before.sha256
          sha256sum package.json package-lock.json scripts/sweepWeight.mjs > analytics-build-artifacts/dependencies-cap-before.sha256
          npm ci > analytics-build-artifacts/install.log 2>&1
      - name: Isolated Playwright1.64 and verified font cache
        run: |
          set -euo pipefail
          browser_tools="$RUNNER_TEMP/analytics1445-browser"
          npm install --prefix "$browser_tools" --no-save --package-lock=false playwright@1.64.0 > analytics-build-artifacts/browser-install.log 2>&1
          test ! -e node_modules/playwright; test ! -e node_modules/playwright-core
          ln -s "$browser_tools/node_modules/playwright" node_modules/playwright
          ln -s "$browser_tools/node_modules/playwright-core" node_modules/playwright-core
          node "$browser_tools/node_modules/playwright/cli.js" install --with-deps chromium > analytics-build-artifacts/chromium-install.log 2>&1
          python -m pip install fonttools pillow > analytics-build-artifacts/python-install.log 2>&1
          export FREE_KICK_FONT_CACHE="$PWD/analytics-build-artifacts/font-cache"
          node scripts/qa/freeKickLab1070.mjs --prefetch-fonts-only > analytics-build-artifacts/fonts.log 2>&1
          echo "FREE_KICK_FONT_CACHE=$FREE_KICK_FONT_CACHE" >> "$GITHUB_ENV"
          cat > analytics-build-artifacts/cached-fonts.cjs <<'JS'
          'use strict';
          const fs = require('node:fs');
          const path = require('node:path');
          const assert = require('node:assert/strict');
          const { createHash } = require('node:crypto');
          const hash = value => createHash('sha256').update(value).digest('hex');
          if (path.basename(process.argv[1] || '') === 'prerender.mjs') {
            const cache = process.env.FREE_KICK_FONT_CACHE;
            const manifestBytes = fs.readFileSync(path.join(cache, 'manifest.json'));
            assert.match(process.env.FONT_CACHE_MANIFEST_SHA256 || '', /^[a-f0-9]{64}$/);
            assert.equal(hash(manifestBytes), process.env.FONT_CACHE_MANIFEST_SHA256, 'Prepared font manifest stays exact');
            const sheet = [...fs.readFileSync('index.html', 'utf8').matchAll(/<link\s+href="(https:\/\/fonts\.googleapis\.com\/[^\"]+)"\s+rel="stylesheet"/g)].map(m => new URL(m[1]).href);
            assert.equal(sheet.length, 1, 'Use the actual single template stylesheet');
            const entries = JSON.parse(manifestBytes);
            assert(Array.isArray(entries) && entries.length > 1);
            const fonts = new Map();
            for (const entry of entries) {
              assert(!fonts.has(entry.url), 'No duplicate font cache URL');
              const url = new URL(entry.url);
              assert(['https://fonts.googleapis.com', 'https://fonts.gstatic.com'].includes(url.origin));
              assert.equal(url.href, entry.url);
              assert.equal(entry.file, hash(entry.url));
              assert.match(entry.sha256, /^[a-f0-9]{64}$/);
              assert.equal(typeof entry.contentType, 'string');
              const body = fs.readFileSync(path.join(cache, entry.file));
              assert.equal(hash(body), entry.sha256, 'Prepared font body stays exact');
              fonts.set(entry.url, { ...entry, body });
            }
            assert(fonts.has(sheet[0]), 'Current template stylesheet is cached');
            const css = fonts.get(sheet[0]);
            assert.match(css.contentType, /^text\/css(?:;|$)/);
            const declared = [...new Set([...css.body.toString('utf8').matchAll(/url\(\s*['"]?(https:\/\/[^)'"\s]+)/g)].map(m => m[1]))];
            assert(declared.length > 0);
            assert.deepEqual([...fonts.keys()].sort(), [sheet[0], ...declared].sort(), 'Only actual stylesheet dependencies are fulfilled');
            for (const url of declared) assert.equal(new URL(url).origin, 'https://fonts.gstatic.com');
            const pw = require('playwright-core');
            let contextId = 0;
            const originalLaunch = pw.chromium.launch.bind(pw.chromium);
            pw.chromium.launch = async options => {
              const browser = await originalLaunch(options);
              const originalContext = browser.newContext.bind(browser);
              browser.newContext = async options => {
                const context = await originalContext(options);
                const id = ++contextId;
                await context.route(/^https:\/\/(?:fonts\.googleapis\.com|fonts\.gstatic\.com)\//, async route => {
                  const request = route.request(), entry = fonts.get(request.url());
