name: Analytics paused status1445

on:
  push:
    branches: [codex/consent-analytics-1445-red, codex/consent-analytics-1445]
    paths-ignore: ['docs/**']
  workflow_dispatch:
    inputs:
      phase:
        description: Original intended RED before product changes, or Green with copied fault
        required: true
        default: original
        type: choice
        options: [original, green]

permissions:
  contents: read
concurrency:
  group: consent-analytics-1445-${{ github.sha }}-${{ inputs.phase || github.ref_name }}
  cancel-in-progress: false

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      CI: '1'
      SIM_NETWORK: offline
      TZ: UTC
      PHASE: ${{ inputs.phase || (github.ref == 'refs/heads/codex/consent-analytics-1445-red' && 'original' || 'green') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Bind exact source and install
        run: |
          set -euo pipefail
          mkdir analytics-status-artifacts
          git rev-parse HEAD > analytics-status-artifacts/head.txt
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf '%s\n' "$PHASE" > analytics-status-artifacts/phase.txt
          test "$PHASE" = original || test "$PHASE" = green
          if [[ "$PHASE" = original ]]; then
            git fetch --no-tags --depth=1 origin bc79b526cb69a4e913416c77c6dba00fe9401a16 > analytics-status-artifacts/baseline-fetch.log 2>&1
            git diff --exit-code bc79b526cb69a4e913416c77c6dba00fe9401a16 -- src scripts supabase public index.html package.json package-lock.json vitest.config.ts ':!src/test/analyticsPausedStatus1445.test.tsx' > analytics-status-artifacts/original-product-hold.log
          fi
          printf '%s\n' 'a7f50b82c4ca1c757ec98b53e30688b91b160e0b3216f0b3ec0b9ee3576ed124  src/lib/consentPreferences.ts' '8106f28dcd5faa8546de50e304af41add45b4fd43a15ccaf009dac809ab6be50  src/lib/consentedScripts.ts' | sha256sum --check > analytics-status-artifacts/tracking-pause-hold.log
          git ls-files -z src scripts supabase public .github index.html package.json package-lock.json vitest.config.ts | xargs -0 sha256sum > analytics-status-artifacts/source-before.sha256
          npm ci > analytics-status-artifacts/install.log 2>&1
      - name: Type gate and unchanged offline consent baselines
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          export SIM_OFFLINE_RECEIPT="$PWD/analytics-status-artifacts/transport.log"
          : > "$SIM_OFFLINE_RECEIPT"
          node_modules/.bin/tsc --noEmit -p tsconfig.app.json > analytics-status-artifacts/types.log 2>&1
          node_modules/.bin/vitest run src/test/consentPurposeGates.test.ts src/test/consentPrivacy1442.test.ts src/test/consentWithdrawal1442.test.ts src/test/consentSynchronization1442.test.tsx src/test/cookieConsentStorage.test.tsx src/test/helpConsentFocus.test.tsx src/test/rulesGateConsentFocus.test.tsx --reporter=json --outputFile=analytics-status-artifacts/baselines.json > analytics-status-artifacts/baselines.log 2>&1
          node --input-type=module <<'NODE'
          import fs from 'node:fs'; import assert from 'node:assert/strict';
          const r=JSON.parse(fs.readFileSync('analytics-status-artifacts/baselines.json','utf8'));
          assert.equal(r.success,true); assert.equal(r.numFailedTests,0); assert.equal(r.numPendingTests,0);
          assert.equal(r.numTodoTests,0); assert(r.numTotalTests>0); assert.equal(r.numPassedTests,r.numTotalTests);
          assert.equal(r.numRuntimeErrorTestSuites??0,0); assert.equal(r.numUnhandledErrors??0,0); assert.deepEqual(r.unhandledErrors??[],[]);
          assert.equal(r.testResults.length,7); assert(r.testResults.every(s=>s.status==='passed'&&s.assertionResults.length>0&&s.assertionResults.every(t=>t.status==='passed')));
          NODE
          test ! -s "$SIM_OFFLINE_RECEIPT"
      - name: Actual focused result and strict intended assertion attribution
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          export SIM_OFFLINE_RECEIPT="$PWD/analytics-status-artifacts/transport.log"
          status=0
          node_modules/.bin/vitest run src/test/analyticsPausedStatus1445.test.tsx --reporter=json --outputFile=analytics-status-artifacts/focused.json > analytics-status-artifacts/focused.log 2>&1 || status=$?
          STATUS="$status" node --input-type=module <<'NODE'
          import fs from 'node:fs'; import assert from 'node:assert/strict';
          const r=JSON.parse(fs.readFileSync('analytics-status-artifacts/focused.json','utf8'));
          const rows=r.testResults.flatMap(s=>s.assertionResults), expected='Analytics paused status1445 explains the pause without a dead control and preserves advertising, privacy and focus';
          assert.equal(r.numTotalTests,1); assert.equal(rows.length,1); assert.equal(rows[0].fullName,expected);
          assert.equal(r.numPendingTests,0); assert.equal(r.numTodoTests,0);
          assert.equal(r.testResults.length,1); assert.equal(r.numRuntimeErrorTestSuites??0,0); assert.equal(r.numUnhandledErrors??0,0); assert.deepEqual(r.unhandledErrors??[],[]);
          if(process.env.PHASE==='original') {
            assert.equal(Number(process.env.STATUS),1); assert.equal(r.success,false); assert.equal(r.numFailedTests,1); assert.equal(r.numPassedTests,0); assert.equal(rows[0].status,'failed');
            assert.equal(rows[0].failureMessages.length,1); assert.match(rows[0].failureMessages[0],/ANALYTICS_PAUSED_1445_DEAD_CONTROL/);
            assert.match(rows[0].failureMessages[0],/expected 1 to be \+?0/); assert.doesNotMatch(rows[0].failureMessages[0],/Cannot find|Failed to resolve|SyntaxError|ReferenceError|TypeError/);
          } else { assert.equal(Number(process.env.STATUS),0); assert.equal(r.success,true); assert.equal(r.numFailedTests,0); assert.equal(r.numPassedTests,1); assert.equal(rows[0].status,'passed'); }
          fs.writeFileSync('analytics-status-artifacts/focused-admission.json',JSON.stringify({phase:process.env.PHASE,sourceSha:process.env.GITHUB_SHA,exit:Number(process.env.STATUS),case:expected,result:process.env.PHASE==='original'?'INTENDED_RED':'PASS'},null,2));
          NODE
          test ! -s "$SIM_OFFLINE_RECEIPT"
      - name: Effective copied dead-checkbox fault after Green
        if: env.PHASE == 'green'
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          export SIM_OFFLINE_RECEIPT="$PWD/analytics-status-artifacts/transport.log"
          export FAULT_FILE="$PWD/analytics-status-artifacts/CookieConsent.dead-checkbox.tsx"
          node --input-type=module <<'NODE'
          import fs from 'node:fs'; import assert from 'node:assert/strict'; import {createHash} from 'node:crypto';
          const file='src/components/CookieConsent.tsx', source=fs.readFileSync(file,'utf8');
          const old='          <p data-analytics-paused-status="">\n            <strong>Analytics is paused.</strong> Google Analytics is off while we check its privacy settings.\n          </p>';
          const replacement='          <label className="inline-flex min-h-11 items-center gap-2 text-foreground">\n            <input type="checkbox" checked={false} disabled />\n            Analytics\n          </label>';
          assert.equal(source.split(old).length-1,1,'Expected one real status block'); const pos=source.indexOf(old);
          const copy=source.slice(0,pos)+replacement+source.slice(pos+old.length); assert.notEqual(copy,source);
          assert.equal(copy.slice(0,pos)+old+copy.slice(pos+replacement.length),source,'Whole inverse must match');
          fs.writeFileSync(process.env.FAULT_FILE,copy); const hash=x=>createHash('sha256').update(x).digest('hex');
          fs.writeFileSync('analytics-status-artifacts/fault-binding.json',JSON.stringify({file,copy:process.env.FAULT_FILE,sourceSha256:hash(source),copySha256:hash(copy),old,replacement,occurrences:1,wholeInverseExact:true},null,2));
          NODE
          export NO_DOUBLE_SWAP="$(node -e 'console.log(JSON.stringify({"@/components/CookieConsent":process.env.FAULT_FILE}))')"
          status=0
          node_modules/.bin/vitest run src/test/analyticsPausedStatus1445.test.tsx --reporter=json --outputFile=analytics-status-artifacts/fault.json > analytics-status-artifacts/fault.log 2>&1 || status=$?
          STATUS="$status" node --input-type=module <<'NODE'
          import fs from 'node:fs'; import assert from 'node:assert/strict';
          const r=JSON.parse(fs.readFileSync('analytics-status-artifacts/fault.json','utf8')), rows=r.testResults.flatMap(s=>s.assertionResults);
          assert.equal(Number(process.env.STATUS),1); assert.equal(r.success,false); assert.equal(r.numTotalTests,1); assert.equal(r.numFailedTests,1); assert.equal(r.numPassedTests,0); assert.equal(r.numPendingTests,0); assert.equal(r.numTodoTests,0); assert.equal(rows.length,1);
          assert.equal(r.testResults.length,1); assert.equal(r.numRuntimeErrorTestSuites??0,0); assert.equal(r.numUnhandledErrors??0,0); assert.deepEqual(r.unhandledErrors??[],[]);
          assert.equal(rows[0].fullName,'Analytics paused status1445 explains the pause without a dead control and preserves advertising, privacy and focus'); assert.equal(rows[0].status,'failed'); assert.equal(rows[0].failureMessages.length,1);
          assert.match(rows[0].failureMessages[0],/ANALYTICS_PAUSED_1445_DEAD_CONTROL/); assert.match(rows[0].failureMessages[0],/expected 1 to be \+?0/); assert.doesNotMatch(rows[0].failureMessages[0],/Cannot find|Failed to resolve|SyntaxError|ReferenceError|TypeError/);
          fs.writeFileSync('analytics-status-artifacts/fault-admission.json',JSON.stringify({sourceSha:process.env.GITHUB_SHA,exit:Number(process.env.STATUS),result:'INTENDED_DEAD_CONTROL_REJECTED'},null,2));
          NODE
          test ! -s "$SIM_OFFLINE_RECEIPT"
      - name: Retain source and complete evidence holds
        if: always()
        run: |
          set -euo pipefail
          sha256sum --check analytics-status-artifacts/source-before.sha256 > analytics-status-artifacts/source-hold.log
          git diff --exit-code HEAD -- src scripts supabase public .github index.html package.json package-lock.json vitest.config.ts > analytics-status-artifacts/tracked-source-hold.log
          test ! -s analytics-status-artifacts/transport.log
          (cd analytics-status-artifacts; find . -type f ! -name evidence.sha256 -print0 | sort -z | xargs -0 sha256sum) > analytics-status-artifacts/evidence.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analytics-paused-status1445-${{ env.PHASE }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: analytics-status-artifacts/
          if-no-files-found: error
          retention-days: 7
