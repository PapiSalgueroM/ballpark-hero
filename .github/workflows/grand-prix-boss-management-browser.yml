name: Grand Prix Boss management renewal focus qualification
on:
  push:
    branches: [codex/grand-prix-boss-management-focus-fixed-20261102]
permissions:
  contents: read
  actions: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: '1'
      ENGINES: chromium
      GP_BOSS_BROWSER_OUT: ${{ github.workspace }}/tmp/grand-prix-management-browser-artifacts
      FREE_KICK_FONT_CACHE: ${{ github.workspace }}/tmp/grand-prix-management-browser-artifacts/font-cache
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bind the three-span focus fix and three qualification paths
        id: prepare
        run: |
          set -euo pipefail
          out="$GP_BOSS_BROWSER_OUT"; test ! -e "$out"; mkdir -p "$out"
          test "$GITHUB_REF" = refs/heads/codex/grand-prix-boss-management-focus-fixed-20261102
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD^)" = a323116cca3286dd191e0a8de571aefb37bd7e0b
          git rev-parse HEAD HEAD^{tree} > "$out/head-tree.txt"
          git diff --name-only HEAD^ HEAD > "$out/changed-paths.txt"
          printf '%s\n' '.github/workflows/grand-prix-boss-management-browser.yml' 'scripts/qa/playGrandPrixBossManagement.mjs' 'scripts/simGrandPrixBossManagement.mjs' 'src/pages/GrandPrixBoss.tsx' > "$out/expected-paths.txt"
          cmp "$out/expected-paths.txt" "$out/changed-paths.txt"
          git diff --exit-code HEAD^ -- src public scripts/data index.html package.json package-lock.json vitest.config.ts ':!src/pages/GrandPrixBoss.tsx'
          printf '%s\n' \
            '2dbcbdc5db4d7156925cb1451ff0c12dbc8462af032fdecf50595e5fbe6edcb6  scripts/qa/playGrandPrixBossManagement.mjs' \
            'b008f7ece22c001e2b3fc639d9ba9c02a9feae0f651f65265852a3c1e955f158  scripts/qa/fixtures/grandPrixBoss.entry.tsx' \
            'dc6ff548ac9a3fd98afd6c399473807edc6fbd3bc9b6b219a27b9cd647c0f7d2  scripts/simGrandPrixBossManagement.mjs' \
            '1474ae6a5e7c5ca99cc56e43c53502af4a4639ec1345f78af51a1af5588c8fc1  src/pages/GrandPrixBoss.tsx' \
            'f0ec04a26c60db6c4a5b1e4b555a699979a2fdad464e404d0e906f2538b8c23b  src/hooks/useGrandPrixBoss.ts' \
            '9565fb9a17489ae21d0b0451cdadede08509ac5fd8d94fbf71ffd88802895af5  src/lib/grandPrixBoss.ts' | sha256sum --check -
          test "$(git rev-parse HEAD:scripts/sweepWeight.mjs)" = 5a92a68cc0225d5e633c19e041087e7c6c4254e8
          git ls-files -z > "$out/source-members.before"
          git ls-files -z | xargs -0 sha256sum > "$out/source.sha256"
          cat > "$out/capture.sh" <<'CAPTURE'
          online() {
            local tag="$1"; shift
            printf '%s\0' "$@" > "$GP_BOSS_BROWSER_OUT/$tag.argv"
            set +e
            env NODE_OPTIONS='' "$@" > "$GP_BOSS_BROWSER_OUT/$tag.stdout" 2> "$GP_BOSS_BROWSER_OUT/$tag.stderr"
            local code=$?
            set -e
            printf '%s\n' "$code" > "$GP_BOSS_BROWSER_OUT/$tag.exit"
            tail -n 12 "$GP_BOSS_BROWSER_OUT/$tag.stdout"; tail -n 12 "$GP_BOSS_BROWSER_OUT/$tag.stderr"
            return "$code"
          }
          capture() {
            local tag="$1"; shift
            test ! -e "$GP_BOSS_BROWSER_OUT/$tag.exit"
            printf '%s\0' "$@" > "$GP_BOSS_BROWSER_OUT/$tag.argv"
            : > "$GP_BOSS_BROWSER_OUT/$tag.transport"
            set +e
            SIM_OFFLINE_RECEIPT="$GP_BOSS_BROWSER_OUT/$tag.transport" "$@" > "$GP_BOSS_BROWSER_OUT/$tag.stdout" 2> "$GP_BOSS_BROWSER_OUT/$tag.stderr"
            local code=$?
            set -e
            printf '%s\n' "$code" > "$GP_BOSS_BROWSER_OUT/$tag.exit"
            tail -n 18 "$GP_BOSS_BROWSER_OUT/$tag.stdout"; tail -n 18 "$GP_BOSS_BROWSER_OUT/$tag.stderr"
            test ! -s "$GP_BOSS_BROWSER_OUT/$tag.transport" || return 1
            return "$code"
          }
          CAPTURE
      - name: Locked application install and actual types
        id: types
        run: |
          set -euo pipefail
          out="$GP_BOSS_BROWSER_OUT"; source "$out/capture.sh"
          online install npm ci
          find node_modules -path node_modules/.vite -prune -o -type f -print0 | sort -z | xargs -0 sha256sum > "$out/dependency-files.sha256"
          export SIM_NETWORK=offline
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          unset GP_BOSS_PAGE_FILE GP_BOSS_HOOK_FILE GP_BOSS_ENGINE_FILE US_BOARD_CONTROL_ALIAS US_BOARD_CONTROL_FILE NO_DOUBLE_SWAP
          capture driver-syntax node --check scripts/qa/playGrandPrixBossManagement.mjs
          capture wrapper-syntax node --check scripts/simGrandPrixBossManagement.mjs
          capture types node_modules/.bin/tsc --noEmit -p tsconfig.app.json
      - name: All fifty-seven ordinary F1 outcomes in the held seven suites
        if: always() && steps.prepare.outcome == 'success' && steps.types.outcome == 'success'
        run: |
          set -euo pipefail
          out="$GP_BOSS_BROWSER_OUT"
          export SIM_NETWORK=offline
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          unset GP_BOSS_PAGE_FILE GP_BOSS_HOOK_FILE GP_BOSS_ENGINE_FILE US_BOARD_CONTROL_ALIAS US_BOARD_CONTROL_FILE NO_DOUBLE_SWAP
          source "$out/capture.sh"
          capture ordinary node node_modules/vitest/vitest.mjs run src/test/grandPrixBoss.test.ts src/test/grandPrixBossMarket.test.ts src/test/grandPrixBossRollover.test.ts src/test/grandPrixBossHistoryTies.test.ts src/test/grandPrixBossRolloverSave.test.tsx src/test/grandPrixBossPage.test.tsx src/test/grandPrixBossManagementPage.test.tsx --maxWorkers=1 --minWorkers=1 --no-file-parallelism --reporter=verbose --reporter=json --outputFile="$out/ordinary.vitest.json"
          node --input-type=module <<'CHECK'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const out = process.env.GP_BOSS_BROWSER_OUT;
          const r = JSON.parse(fs.readFileSync(out + '/ordinary.vitest.json', 'utf8'));
          const raw = fs.readFileSync(out + '/ordinary.stdout', 'utf8') + '\n' + fs.readFileSync(out + '/ordinary.stderr', 'utf8');
          assert.equal(Number(fs.readFileSync(out + '/ordinary.exit', 'utf8')), 0);
          assert.equal(r.success, true); assert.equal(r.numTotalTests, 57); assert.equal(r.numPassedTests, 57);
          assert.equal(r.numFailedTests, 0); assert.equal(r.numPendingTests, 0); assert.equal(r.numTodoTests, 0);
          const files = new Map([
            ['src/test/grandPrixBoss.test.ts', 13], ['src/test/grandPrixBossMarket.test.ts', 12],
            ['src/test/grandPrixBossRollover.test.ts', 13], ['src/test/grandPrixBossHistoryTies.test.ts', 2],
            ['src/test/grandPrixBossRolloverSave.test.tsx', 2], ['src/test/grandPrixBossPage.test.tsx', 9],
            ['src/test/grandPrixBossManagementPage.test.tsx', 6],
          ]);
          const pageIds = new Map([
            ['src/test/grandPrixBossPage.test.tsx', ['GP_PAGE_AVAILABLE:', 'GP_PAGE_START:', 'GP_PAGE_HUB:', 'GP_PAGE_UPGRADE:', 'GP_PAGE_ORDERS:', 'GP_PAGE_STANDINGS:', 'GP_PAGE_BACK:', 'GP_PAGE_MOVED_EMPTY:', 'GP_PAGE_PROTECTED_SAVE:']],
            ['src/test/grandPrixBossManagementPage.test.tsx', ['GP_MANAGEMENT_SIGN:', 'GP_MANAGEMENT_RENEW:', 'GP_MANAGEMENT_NEXT_YEAR:', 'GP_MANAGEMENT_GUARDS:', 'GP_MANAGEMENT_HISTORY:', 'GP_MANAGEMENT_REVIEW_CARDS:']],
          ]);
          assert.equal(r.testResults.length, 7);
          const seenFiles = new Set(), cases = [];
          for (const file of r.testResults) {
            const normalized = file.name.replaceAll('\\', '/');
            const names = [...files.keys()].filter(name => normalized.endsWith('/' + name));
            assert.equal(names.length, 1); const name = names[0]; assert(!seenFiles.has(name)); seenFiles.add(name);
            assert.equal(file.assertionResults.length, files.get(name));
            const identities = pageIds.get(name), seen = new Set();
            for (const row of file.assertionResults) {
              assert.equal(row.status, 'passed'); assert.equal(row.failureMessages.length, 0);
              if (identities) {
                const ids = identities.filter(id => row.title.startsWith(id)); assert.equal(ids.length, 1);
                assert(!seen.has(ids[0])); seen.add(ids[0]);
              }
              cases.push({ file: name, title: row.title, status: row.status, failureMessages: row.failureMessages });
            }
            if (identities) assert.equal(seen.size, identities.length);
          }
          assert.equal(seenFiles.size, 7); assert.equal(cases.length, 57);
          const runtimeCounters = { numUnhandledErrors: r.numUnhandledErrors ?? null, numRuntimeErrorTestSuites: r.numRuntimeErrorTestSuites ?? null };
          for (const value of Object.values(runtimeCounters)) if (value !== null) { assert.equal(typeof value, 'number'); assert.equal(value, 0); }
          for (const errors of [r.errors, r.unhandledErrors]) if (errors != null) { assert(Array.isArray(errors)); assert.equal(errors.length, 0); }
          const detectedRuntimeError = /(?:Unhandled (?:Errors?|Rejection|Exception)|unhandledRejection|uncaughtException|Vitest caught \d+ unhandled)/i.test(raw);
          assert.equal(detectedRuntimeError, false);
          fs.writeFileSync(out + '/ordinary-summary.json', JSON.stringify({
            scope: 'Seven held F1 engine, rollover-save and page suites only. Original save and market-save suites are absent from this source; no full persistence, build, route or global chrome claim.',
            parent: 'a323116cca3286dd191e0a8de571aefb37bd7e0b', rawExit: 0,
            passed: 57, ownedAssertionFailures: 0, declaredSkips: 0, totalExecuted: 57,
            runtimeCounters, runtimeCounterCompleteness: Object.values(runtimeCounters).some(value => value === null) ? 'UNKNOWN' : 'REPORTED',
            detectedRuntimeError, rawErrors: r.errors ?? null, rawUnhandledErrors: r.unhandledErrors ?? null, cases,
            installNetwork: 'Locked dependency install precedes offline gate; no empty-transport claim for install.',
          }, null, 2) + '\n');
          console.log('GP_MANAGEMENT_UI_ORDINARY:57 passes in seven held suites,zero failures,zero skips.');
          CHECK
      - name: Actual page copies twelve owned faults and restoration
        if: always() && steps.prepare.outcome == 'success' && steps.types.outcome == 'success'
        run: |
          set -euo pipefail
          out="$GP_BOSS_BROWSER_OUT"
          export SIM_NETWORK=offline
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          export GP_BOSS_MANAGEMENT_OUT="$out"
          unset GP_BOSS_PAGE_FILE GP_BOSS_HOOK_FILE GP_BOSS_ENGINE_FILE US_BOARD_CONTROL_ALIAS US_BOARD_CONTROL_FILE NO_DOUBLE_SWAP
          source "$out/capture.sh"
          capture management-controls node scripts/simGrandPrixBossManagement.mjs
          node --input-type=module <<'CHECK'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          const out = process.env.GP_BOSS_BROWSER_OUT;
          const dirs = fs.readdirSync(out).filter(name => name.startsWith('dukb-grand-prix-management-'));
          assert.equal(dirs.length, 1);
          const r = JSON.parse(fs.readFileSync(path.join(out, dirs[0], 'summary.json'), 'utf8'));
          assert.equal(r.childRuns, 15); assert.equal(r.results.length, 15);
          assert.deepEqual(r.totals, { passed: 45, ownedFailures: 12, declaredSkips: 60, totalExecuted: 57 });
          const names = ['current', 'healthy-copy', 'original-entry', 'original-historical-cards', 'sign-revision', 'sign-price',
            'missing-renewal', 'renewed-plan-fee', 'plan-cash', 'sign-moved-guard', 'next-year-affordability',
            'archive-champion', 'legacy-coverage', 'archive-track', 'restored-copy'];
          assert.deepEqual(r.results.map(row => row.name), names);
          for (const row of r.results) {
            assert.equal(row.transportBytes, 0);
            assert.equal(fs.statSync(path.join(out, dirs[0], row.name + '.transport')).size, 0);
          }
          console.log('GP_MANAGEMENT_UI_CAUSAL:45healthy passes,12owned assertions,60declared unselected skips;57executed outcomes.');
          CHECK
      - name: Reuse the previously qualified font artifact
        uses: actions/download-artifact@v4
        with:
          name: grand-prix-boss-page-browser-41443229767
          run-id: 41443229767
          github-token: ${{ github.token }}
          path: ${{ github.workspace }}/tmp/grand-prix-management-browser-artifacts/original-first-proof
      - name: Bind and copy the original font bytes only
        id: cache
        run: |
          set -euo pipefail
          out="$GP_BOSS_BROWSER_OUT"; original="$out/original-first-proof"
          test "$(find "$original" -type f | wc -l)" -eq 203
          cd "$original"
          printf '%s\n' \
            '3171c3241bbb489c22f51489f8b2cd94c880f071dfe9760a5c9aabdf48363d82  font-cache/manifest.json' \
            '6b8c4ca2d64a6917122a9b8d70b42ee074eec46e478e88b1fa4ccd813c00315a  cached-fonts.cjs' \
            'fecf67c26e50dd1cb755412fbd51674ce533444c2f5abaa023eb7550bdc17a35  head-tree.txt' | sha256sum --check -
          cd "$GITHUB_WORKSPACE"
          find "$original" -type f -print0 | sort -z | xargs -0 sha256sum > "$out/original-files.sha256"
          cp -R "$original/font-cache" "$out/font-cache"
          cp "$original/cached-fonts.cjs" "$out/cached-fonts.cjs"
          node --input-type=module <<'FONTS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs'; import path from 'node:path'; import {createHash} from 'node:crypto';
          const out=process.env.GP_BOSS_BROWSER_OUT,sha=bytes=>createHash('sha256').update(bytes).digest('hex');
          const manifest=JSON.parse(fs.readFileSync(path.join(out,'font-cache/manifest.json'),'utf8'));
          assert.equal(manifest.length,9);assert.equal(new Set(manifest.map(row=>row.file)).size,9);
          for(const row of manifest){
            assert(['https://fonts.googleapis.com','https://fonts.gstatic.com'].includes(new URL(row.url).origin));
            assert(/^[a-f0-9]{64}$/.test(row.file));
            assert.equal(sha(fs.readFileSync(path.join(out,'font-cache',row.file))),row.sha256);
          }
          fs.writeFileSync(path.join(out,'font-custody.json'),JSON.stringify({run:41443229767,artifact:13140509319,artifactMembers:203,originalZipSha256:'64a6b759b0ecdfdb68752afe8253f34db0fbbb453f306d6d58bd6dda8e7efdf7',zipHashScope:'Root verified the original ZIP. This job binds downloaded members and the nine held font bodies, not a reconstructed ZIP.',newPublicFontHttp:0},null,2));
          FONTS
          find "$out/font-cache" -type f -print0 | sort -z | xargs -0 sha256sum > "$out/font-files.sha256"
          sha256sum "$out/cached-fonts.cjs" > "$out/cached-fonts.sha256"
      - name: Isolated pinned browser and Python tools
        id: tools
        run: |
          set -euo pipefail
          out="$GP_BOSS_BROWSER_OUT"; source "$out/capture.sh"
          browser_tools="$RUNNER_TEMP/grand-prix-management-browser-tools"
          test ! -e "$browser_tools"; mkdir "$browser_tools"
          printf '{"private":true,"dependencies":{"playwright":"1.64.0"}}\n' > "$browser_tools/package.json"
          online browser-install npm install --prefix "$browser_tools" --ignore-scripts --no-audit --no-fund
          test ! -e node_modules/playwright; test ! -e node_modules/playwright-core
          ln -s "$browser_tools/node_modules/playwright" node_modules/playwright
          ln -s "$browser_tools/node_modules/playwright-core" node_modules/playwright-core
          cp "$browser_tools/package.json" "$out/browser-package.json"; cp "$browser_tools/package-lock.json" "$out/browser-package-lock.json"
          online chromium node "$browser_tools/node_modules/playwright/cli.js" install --with-deps chromium
          python -m venv "$browser_tools/python"
          online python-fonts "$browser_tools/python/bin/python" -m pip install fonttools==4.60.1 Pillow==11.3.0
          "$browser_tools/python/bin/python" -m pip freeze > "$out/python-packages.txt"
          echo "$browser_tools/python/bin" >> "$GITHUB_PATH"
          find "$browser_tools/node_modules" -type f -print0 | sort -z | xargs -0 sha256sum > "$out/browser-files.sha256"
      - name: Ordinary build with held offline fonts
        id: build
        run: |
          set -euo pipefail
          out="$GP_BOSS_BROWSER_OUT"; source "$out/capture.sh"
          export SIM_NETWORK=offline
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs --require=$out/cached-fonts.cjs"
          capture build npm run build
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > "$out/dist.sha256"
      - name: All fifteen completed-build readers and all sixteen unchanged caps
        run: |
          set -euo pipefail
          out="$GP_BOSS_BROWSER_OUT"; source "$out/capture.sh"
          export SIM_NETWORK=offline
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs --require=$out/cached-fonts.cjs"
          node scripts/lib/hostLikeServer.mjs dist 4173 > "$out/readers-server.log" 2>&1 &
          server=$!; trap 'kill "$server" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do if curl -fsS http://127.0.0.1:4173/ > /dev/null; then ready=1; break; fi; sleep 1; done
          test "$ready" -eq 1
          failed=0
          for reader in simAdsense simBrand simHeadTags simHiddenPages simHubs simIndexNow simIndexing simInternalLinks simNoRivalNames simPrerender simPrerenderBoot simRetiredRoutes simSchema simSitemap simSnapshotAssets; do
            code=0; capture "$reader" env BASE=http://127.0.0.1:4173 SWEEP_BASE=http://127.0.0.1:4173 node "scripts/$reader.mjs" || code=$?
            printf '%s\t%s\n' "$reader" "$code" >> "$out/readers.tsv"; test "$code" -eq 0 || failed=1
          done
          test "$(wc -l < "$out/readers.tsv")" -eq 15
          capture caps-rows node --input-type=module <<'CAPS'
          import fs from 'node:fs';import assert from 'node:assert/strict';import{createHash}from'node:crypto';
          const body=fs.readFileSync('scripts/sweepWeight.mjs','utf8'),code=body.replace(/\/\*[\s\S]*?\*\//g,'').replace(/(^|\n)\s*\/\/[^\n]*/g,'$1');
          const start=code.indexOf('const BUDGETS = [');assert(start>=0);const end=code.indexOf('];',start);assert(end>start);
          const budgets=[...code.slice(start,end+2).matchAll(/\[\s*(['"])(\/[^'"]*)\1\s*,\s*(\d+)\s*\]/g)].map(match=>({route:match[2],cap:Number(match[3])}));
          assert.equal(budgets.length,16);assert.equal(new Set(budgets.map(row=>row.route)).size,16);
          fs.writeFileSync(process.env.GP_BOSS_BROWSER_OUT+'/caps16.json',JSON.stringify({sourceSha256:createHash('sha256').update(body).digest('hex'),budgets},null,2));
          CAPS
          code=0; capture all-caps env BASE=http://127.0.0.1:4173 SWEEP_BASE=http://127.0.0.1:4173 SWEEP_OFFLINE=1 node scripts/sweepWeight.mjs || code=$?
          test "$code" -eq 0 || failed=1
          test ! -s "$out/font-cache-misses.jsonl" || failed=1
          exit "$failed"
      - name: Six actual compiled management contexts and native saves
        if: ${{ !cancelled() && steps.types.outcome == 'success' && steps.cache.outcome == 'success' && steps.tools.outcome == 'success' && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          out="$GP_BOSS_BROWSER_OUT"; source "$out/capture.sh"
          export SIM_NETWORK=offline
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          capture actual-management node scripts/qa/playGrandPrixBossManagement.mjs
      - name: Always retain full source dependencies tools fonts and completed build holds
        if: always()
        run: |
          set -euo pipefail
          out="$GP_BOSS_BROWSER_OUT"
          sha256sum --check "$out/source.sha256" > "$out/source-held.log"
          git ls-files -z > "$out/source-members.after"; cmp "$out/source-members.before" "$out/source-members.after"
          git diff --exit-code HEAD > "$out/source-diff.log"
          git ls-files --others --exclude-standard > "$out/untracked.txt"; test ! -s "$out/untracked.txt"
          for list in dependency-files browser-files font-files cached-fonts original-files dist; do if test -f "$out/$list.sha256"; then sha256sum --check "$out/$list.sha256" > "$out/$list-held.log"; fi; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grand-prix-management-browser-${{ github.run_id }}
          path: ${{ github.workspace }}/tmp/grand-prix-management-browser-artifacts/
          retention-days: 14
