      - name: Bind the complete product and sole qualification-only addition
        run: |
          set -euo pipefail
          export QA_OUT="$RUNNER_TEMP/russia-career-qualification-evidence"
          export QA_BASE_SRC="$RUNNER_TEMP/russia-career-qualification-original"
          mkdir -p "$QA_OUT/logs" "$QA_OUT/transport"
          echo "QA_OUT=$QA_OUT" >> "$GITHUB_ENV"
          echo "QA_BASE_SRC=$QA_BASE_SRC" >> "$GITHUB_ENV"
          export QA_BASE_QA_SRC="$RUNNER_TEMP/russia-career-qualification-baseline-qa"
          export QA_RUSSIA_REMOVED_SRC="$RUNNER_TEMP/russia-career-qualification-russia-removed"
          echo "QA_BASE_QA_SRC=$QA_BASE_QA_SRC" >> "$GITHUB_ENV"
          echo "QA_RUSSIA_REMOVED_SRC=$QA_RUSSIA_REMOVED_SRC" >> "$GITHUB_ENV"
          [[ "$PRODUCT_CORE" =~ ^[0-9a-f]{40}$ && "$PRODUCT_TREE" =~ ^[0-9a-f]{40}$ ]]
          cat > "$QA_OUT/transferBriefOutputRetainer.mjs" <<'TRANSFER_RETAINER'
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { fileURLToPath } from 'node:url';
          
          const [mode, flag, ...extra] = process.argv.slice(2);
          assert(['prepare', 'retain'].includes(mode) && extra.length === 0 &&
            (flag === undefined || (mode === 'retain' && flag === '--required')), 'TRANSFER_BRIEF_RETAINER_ARGUMENTS');
          assert(process.env.GITHUB_WORKSPACE && process.env.QA_OUT, 'TRANSFER_BRIEF_RETAINER_PATH_ENV');
          const root = fs.realpathSync(process.env.GITHUB_WORKSPACE), out = fs.realpathSync(process.env.QA_OUT);
          assert.equal(fs.realpathSync('.'), root, 'TRANSFER_BRIEF_RETAINER_REPO_CWD');
          const relativeOut = path.relative(root, out);
          assert(relativeOut === '..' || relativeOut.startsWith('..' + path.sep) || path.isAbsolute(relativeOut), 'TRANSFER_BRIEF_RETAINER_OUTSIDE_REPO');
          const ordinary = file => {
            const stat = fs.lstatSync(file);
            assert(!stat.isSymbolicLink() && (stat.isFile() || stat.isDirectory()), 'TRANSFER_BRIEF_RETAINER_ORDINARY ' + file);
            return stat;
          };
          assert(ordinary(out).isDirectory(), 'TRANSFER_BRIEF_RETAINER_OUT_DIRECTORY');
          const exists = file => { try { fs.lstatSync(file); return true; } catch (e) { if (e.code === 'ENOENT') return false; throw e; } };
          const source = path.join(root, 'career-transfer-brief-artifacts');
          const parent = path.join(out, 'model-artifacts'), target = path.join(parent, 'transfer-brief');
          const preparedFile = path.join(out, 'transfer-brief-owned-before.json');
          const beforeFile = path.join(out, 'transfer-brief-output-census-before.json');
          const receiptFile = path.join(out, 'transfer-brief-output-retention.json');
          const sha = bytes => createHash('sha256').update(bytes).digest('hex');
          const selfSHA256 = sha(fs.readFileSync(fileURLToPath(import.meta.url)));
          const write = (file, value) => fs.writeFileSync(file, JSON.stringify(value, null, 2) + '\n', { flag: 'wx' });
          const read = file => { assert(ordinary(file).isFile()); return JSON.parse(fs.readFileSync(file, 'utf8')); };
          const paths = { root, out, source, target, selfSHA256 };
          const checkPaths = value => { for (const [key, val] of Object.entries(paths)) assert.equal(value[key], val, 'TRANSFER_BRIEF_RETAINER_OWNERSHIP ' + key); };
          function census(base) {
            const rows = [];
            function visit(relative) {
              const file = relative === '.' ? base : path.join(base, ...relative.split('/')), stat = ordinary(file);
              if (stat.isFile()) {
                const bytes = fs.readFileSync(file), row = { path: relative, kind: 'file', bytes: bytes.length, sha256: sha(bytes) };
                rows.push(row); return row;
              }
              const children = fs.readdirSync(file).sort().map(name => {
                const child = visit(relative === '.' ? name : relative + '/' + name);
                return { name, kind: child.kind, ...(child.kind === 'file' ? { bytes: child.bytes } : {}), sha256: child.sha256 };
              });
              const row = { path: relative, kind: 'directory', entries: children.length,
                sha256: sha(Buffer.from(JSON.stringify(children))) };
              rows.push(row); return row;
            }
            assert(ordinary(base).isDirectory(), 'TRANSFER_BRIEF_RETAINER_DIRECTORY');
            visit('.');
            rows.sort((a, b) => a.path < b.path ? -1 : a.path > b.path ? 1 : 0);
            const files = rows.filter(row => row.kind === 'file');
            return { rows, files: files.length, directories: rows.length - files.length,
              bytes: files.reduce((sum, row) => sum + row.bytes, 0) };
          }
          function requiredRaw(value) {
            assert(value.files > 0, 'TRANSFER_BRIEF_RETAINER_REQUIRED_RAW');
            for (const file of ['outcomes.json', 'native-fixtures.json', 'neutral-season-ere-101.json',
              'page-control-baseline.json', 'page-control-fault.json', 'page-control-receipt.json'])
              assert(value.rows.some(row => row.path === file && row.kind === 'file' && row.bytes > 0), 'TRANSFER_BRIEF_RETAINER_REQUIRED_RAW ' + file);
          }
          if (mode === 'prepare') {
            assert(!exists(source) && !exists(target), 'TRANSFER_BRIEF_RETAINER_FRESH_FIXED_DIRECTORY');
            assert(!exists(preparedFile) && !exists(beforeFile) && !exists(receiptFile), 'TRANSFER_BRIEF_RETAINER_FRESH_RECEIPTS');
            if (!exists(parent)) fs.mkdirSync(parent);
            assert(ordinary(parent).isDirectory(), 'TRANSFER_BRIEF_RETAINER_PARENT');
            write(preparedFile, { schema: 'TRANSFER_BRIEF_OUTPUT_OWNERSHIP_V1', ...paths, status: 'FRESH_ABSENCE_CONFIRMED',
              sourceAbsent: true, targetAbsent: true, allGuardSuccessClaimed: false });
            console.log('TransferBrief output: fixed source and target absent before the owned guards.');
          } else {
            const prepared = read(preparedFile); checkPaths(prepared);
            assert.equal(prepared.status, 'FRESH_ABSENCE_CONFIRMED');
            assert(ordinary(parent).isDirectory(), 'TRANSFER_BRIEF_RETAINER_PARENT');
            const required = flag === '--required';
            if (exists(receiptFile)) {
              const receipt = read(receiptFile); checkPaths(receipt);
              assert(!exists(source), 'TRANSFER_BRIEF_RETAINER_SOURCE_STILL_ABSENT');
              if (receipt.status === 'NOT_CREATED_BEFORE_EARLIER_FAILURE') {
                assert(!exists(target), 'TRANSFER_BRIEF_RETAINER_NO_UNOWNED_TARGET');
                assert(!required, 'TRANSFER_BRIEF_RETAINER_REQUIRED_RAW');
              } else {
                assert(['REQUIRED_RAW_DIRECTORY_RETAINED', 'RAW_DIRECTORY_RETAINED_AFTER_EARLIER_FAILURE',
                  'EMPTY_DIRECTORY_RETAINED_AFTER_EARLIER_FAILURE'].includes(receipt.status), 'TRANSFER_BRIEF_RETAINER_KNOWN_STATUS');
                assert.equal(receipt.wholeDirectoryRename, true); assert.equal(receipt.allOrdinary, true);
                assert(exists(target), 'TRANSFER_BRIEF_RETAINER_RETAINED_DIRECTORY');
                assert.deepEqual(census(target), receipt.after, 'TRANSFER_BRIEF_RETAINER_IDEMPOTENT_ALL_BYTES');
                assert.deepEqual(receipt.before, receipt.after, 'TRANSFER_BRIEF_RETAINER_RENAME_ALL_BYTES');
                if (required) requiredRaw(receipt.after);
              }
              console.log('TransferBrief output: prior receipt rechecked, no files changed.');
            } else if (!exists(source)) {
              assert(!exists(target) && !exists(beforeFile), 'TRANSFER_BRIEF_RETAINER_NO_UNOWNED_RETAINED_DIRECTORY');
              assert(!required, 'TRANSFER_BRIEF_RETAINER_REQUIRED_RAW');
              write(receiptFile, { schema: 'TRANSFER_BRIEF_OUTPUT_RETENTION_V1', ...paths,
                status: 'NOT_CREATED_BEFORE_EARLIER_FAILURE', required: false, sourceAbsent: true, targetAbsent: true,
                allGuardSuccessClaimed: false });
              console.log('TransferBrief output: not created before earlier failure; no guard success is claimed.');
            } else {
              assert(!exists(target) && !exists(beforeFile), 'TRANSFER_BRIEF_RETAINER_FRESH_TARGET');
              const before = census(source);
              if (required) requiredRaw(before);
              write(beforeFile, { schema: 'TRANSFER_BRIEF_OUTPUT_CENSUS_V1', ...paths, before });
              assert.equal(fs.statSync(source).dev, fs.statSync(parent).dev, 'TRANSFER_BRIEF_RETAINER_RENAME_FILESYSTEM');
              fs.renameSync(source, target);
              assert(!exists(source), 'TRANSFER_BRIEF_RETAINER_SOURCE_RELOCATED');
              const after = census(target);
              assert.deepEqual(after, before, 'TRANSFER_BRIEF_RETAINER_WHOLE_RENAME_BYTES');
              write(receiptFile, { schema: 'TRANSFER_BRIEF_OUTPUT_RETENTION_V1', ...paths,
                status: required ? 'REQUIRED_RAW_DIRECTORY_RETAINED' : before.files ? 'RAW_DIRECTORY_RETAINED_AFTER_EARLIER_FAILURE' : 'EMPTY_DIRECTORY_RETAINED_AFTER_EARLIER_FAILURE',
                required, before, after, wholeDirectoryRename: true, allOrdinary: true,
                sourceAbsent: true, completeRelativePathsAndBodiesHeld: true, allGuardSuccessClaimed: false });
              console.log('TransferBrief output: whole ordinary directory renamed and every body verified, ' + after.files + ' files.');
            }
          }
          TRANSFER_RETAINER
          set +e
          node "$QA_OUT/transferBriefOutputRetainer.mjs" prepare > "$QA_OUT/logs/transfer-brief-output-prepare.log" 2>&1
          native_exit=$?
          set -e
          printf '%s\n' "$native_exit" > "$QA_OUT/logs/transfer-brief-output-prepare.exit"
          cat "$QA_OUT/logs/transfer-brief-output-prepare.log"
          test "$native_exit" = 0
          test "$(git rev-parse refs/remotes/origin/main)" = "$BASE_CORE"
          test "$(git rev-parse HEAD^)" = "$PRODUCT_CORE"
          test "$(git rev-parse "$PRODUCT_CORE^{tree}")" = "$PRODUCT_TREE"
          test "$(git rev-parse "$BASE_CORE^{tree}")" = "$BASE_TREE"
          git fetch --no-tags origin refs/heads/codex/russia-baseline-qa-role-20261106:refs/remotes/origin/codex/russia-baseline-qa-role-20261106 refs/heads/codex/russia-removed-qa-role-20261106:refs/remotes/origin/codex/russia-removed-qa-role-20261106
          test "$(git rev-parse refs/remotes/origin/codex/russia-baseline-qa-role-20261106)" = "$BASE_QA_CORE"
          test "$(git rev-parse refs/remotes/origin/codex/russia-removed-qa-role-20261106)" = "$RUSSIA_REMOVED_CORE"
          test "$(git rev-parse refs/remotes/origin/main)" = "$BASE_CORE"
          test "$(git rev-parse "$BASE_QA_CORE^{tree}")" = "$BASE_QA_TREE"
          test "$(git rev-parse "$RUSSIA_REMOVED_CORE^{tree}")" = "$RUSSIA_REMOVED_TREE"
          git worktree add --detach "$QA_BASE_SRC" "$BASE_CORE"
          git worktree add --detach "$QA_BASE_QA_SRC" "$BASE_QA_CORE"
          node --input-type=module <<'BIND'
          import fs from 'node:fs';import assert from 'node:assert/strict';import {execFileSync} from 'node:child_process';
          const e=process.env,out=e.QA_OUT,git=(...a)=>execFileSync('git',a,{encoding:'utf8'}).trim();
          const expected=JSON.parse(e.PRODUCT_FILES),workflow='.github/workflows/russia-career-qualify-20261106.yml';
          const delta=git('diff-tree','--no-commit-id','--name-only','-r',e.BASE_CORE,e.PRODUCT_CORE).split('\n').filter(Boolean).sort();
          assert.deepEqual(delta,expected.map(r=>r.path).sort());
          for(const r of expected){if(r.before===null)assert.equal(git('ls-tree',e.BASE_CORE,'--',r.path),'');else assert.equal(git('rev-parse',e.BASE_CORE+':'+r.path),r.before);assert.equal(git('rev-parse',e.PRODUCT_CORE+':'+r.path),r.after);}
          const qaDelta=git('diff-tree','--no-commit-id','--name-only','-r','HEAD').split('\n').filter(Boolean);
          assert.deepEqual(qaDelta,[workflow]);
          assert.equal(expected.length,17);
          const helperRows=JSON.parse(e.BASELINE_QA_FILES),closure=JSON.parse(e.FINISH_SCRIPT_CLOSURE);
          assert.deepEqual(git('rev-list','--parents','-n','1',e.BASE_QA_CORE).split(' '),[e.BASE_QA_CORE,e.BASE_CORE]);
          assert.equal(helperRows.length,2);
          assert.deepEqual(git('diff-tree','--no-commit-id','--name-only','-r',e.BASE_CORE,e.BASE_QA_CORE).split('\n').filter(Boolean).sort(),helperRows.map(r=>r.path).sort());
          for(const row of helperRows)for(const[core,digest]of[[e.BASE_CORE,row.before],[e.BASE_QA_CORE,row.after]])assert.equal(git('ls-tree',core,'--',row.path),row.mode+' blob '+digest+'\t'+row.path);
          assert.equal(git('rev-parse',e.BASE_QA_CORE+':src'),git('rev-parse',e.BASE_CORE+':src'));
          assert.equal(closure.length,18);assert.equal(new Set(closure.map(r=>r.path)).size,18);
          for(const row of closure){
            for(const core of[e.PRODUCT_CORE,e.BASE_QA_CORE,e.RUSSIA_REMOVED_CORE])assert.equal(git('ls-tree',core,'--',row.path),row.mode+' blob '+row.git+'\t'+row.path,'FINISH_EXECUTED_SCRIPT_CLOSURE '+row.path);
