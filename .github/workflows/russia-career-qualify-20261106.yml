          (cd "$QA_BASE_SRC"; git ls-files -z | sort -z | xargs -0 sha256sum) > "$QA_OUT/baseline-source-after.sha256"
          (cd "$QA_BASE_SRC"; git ls-files --stage) > "$QA_OUT/baseline-index-after.txt"
          (cd "$QA_BASE_SRC"; git status --porcelain=v1 --untracked-files=all) > "$QA_OUT/baseline-status-after.txt"
          (cd "$QA_BASE_SRC"; sha256sum package.json package-lock.json bun.lock bun.lockb) > "$QA_OUT/baseline-locks-after.sha256"
          cmp "$QA_OUT/baseline-source-before.sha256" "$QA_OUT/baseline-source-after.sha256"
          cmp "$QA_OUT/baseline-index-before.txt" "$QA_OUT/baseline-index-after.txt"
          cmp "$QA_OUT/baseline-locks-before.sha256" "$QA_OUT/baseline-locks-after.sha256"
          test ! -s "$QA_OUT/baseline-status-after.txt"
          (cd "$QA_BASE_QA_SRC"; git ls-files -z | sort -z | xargs -0 sha256sum) > "$QA_OUT/baseline-qa-source-after.sha256"
          (cd "$QA_BASE_QA_SRC"; git ls-files --stage) > "$QA_OUT/baseline-qa-index-after.txt"
          (cd "$QA_BASE_QA_SRC"; sha256sum package.json package-lock.json bun.lock bun.lockb) > "$QA_OUT/baseline-qa-locks-after.sha256"
          (cd "$QA_BASE_QA_SRC"; git status --porcelain=v1 --untracked-files=all) > "$QA_OUT/baseline-qa-status-after.txt"
          cmp "$QA_OUT/baseline-qa-source-before.sha256" "$QA_OUT/baseline-qa-source-after.sha256"
          cmp "$QA_OUT/baseline-qa-index-before.txt" "$QA_OUT/baseline-qa-index-after.txt"
          cmp "$QA_OUT/baseline-qa-locks-before.sha256" "$QA_OUT/baseline-qa-locks-after.sha256"
          test ! -s "$QA_OUT/baseline-qa-status-after.txt"
          if [[ -d "$QA_RUSSIA_REMOVED_SRC" ]]; then
            node "$QA_OUT/pairedFinishBaseline.mjs" --final-removed-holds
          fi
          printf '0\n' > "$QA_OUT/final-source-holds.exit"
      - name: Close the fresh compiled output
        run: |
          set -euo pipefail
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > "$QA_OUT/dist-after.sha256"
          cmp "$QA_OUT/dist-before.sha256" "$QA_OUT/dist-after.sha256"
          node --input-type=module <<'CLOSE'
          import fs from 'node:fs';import assert from 'node:assert/strict';import crypto from 'node:crypto';
          const collectionOut=process.env.QA_OUT,collection=JSON.parse(fs.readFileSync(collectionOut+'/MODEL-OUTCOMES.json'));
          assert.equal(collection.status,'SOURCE_CLEAN_MODEL_OUTCOMES_COLLECTED');assert.equal(collection.collectorShellSuccessIsNotModelSuccess,true);
          const expectedModelNames=["bridge","bridge-controls","simCareerClubPool","simCareerFacts","simCareerEras","fallback-local-mode-absent","fallback-control-absent","simCareerFallback","fallback-read-admission","simCareerLeagueFinish","simCareerLeagueSeasons","simCareerLeagueWorld","simCareerDomesticCup","simCareerContinental","simSoccerCareerUcl","simLoanSpell","simCareerTransferBrief","simSoccerCareerSavedLoan","simSoccerLoanBite","simSoccerLoanMinutes","simTransferBriefPageControl","simSaveKeeper","simHomeFront","simHomeFront-output","simSoccerCareerRecords","simSoccerCareerRecords-output","records-admission","records-owned-cleanup","transfer-brief-output-retain"];
          assert.deepEqual(collection.rows.map(row=>row.name),expectedModelNames);assert.equal(collection.rows.length,29);
          const redNames=['simCareerLeagueFinish','simCareerLeagueSeasons','simCareerLeagueWorld'];
          const policyFile='baseline-regression-admission.json',policyBody=fs.readFileSync(collectionOut+'/'+policyFile),policy=JSON.parse(policyBody),policySHA=crypto.createHash('sha256').update(policyBody).digest('hex');
          assert.equal(fs.readFileSync(collectionOut+'/logs/scoped-baseline-policy.exit','utf8'),'0\n');assert.equal(fs.readFileSync(collectionOut+'/transport/scoped-baseline-policy.log').length,0);
          assert.equal(policy.schema,'RUSSIA_BASELINE_REGRESSION_ADMISSION_V1');assert.equal(policy.status,'THREE_EXACT_BASELINE_REDS_RETAINED');assert.deepEqual(policy.redOutcomeNames,redNames);
          assert.deepEqual(policy.zeroOutcomeNames,expectedModelNames.filter(name=>!redNames.includes(name)));assert.equal(policy.zeroOutcomeNames.length,26);
          assert.deepEqual(policy.product,{commit:process.env.PRODUCT_CORE,tree:process.env.PRODUCT_TREE});
          for(const row of collection.rows){
           const native=redNames.includes(row.name)?1:0;
           assert.equal(fs.readFileSync(collectionOut+'/'+row.exitFile,'utf8'),String(native)+'\n','SCOPED_ORIGINAL_MODEL_NATIVE '+row.name);
           assert.equal(row.nativeExit,native);assert.equal(row.transport.empty,true);assert.equal(fs.readFileSync(collectionOut+'/'+row.transport.file).length,0,'ORIGINAL_MODEL_TRANSPORT_RED '+row.name);assert.equal(row.passed,native===0);
          }
          assert.equal(collection.allOriginalOutcomesPassed,false);assert.deepEqual(collection.failedOutcomes,redNames);
          assert.equal(fs.readFileSync(collectionOut+'/types.exit','utf8'),'0\n');
          assert.equal(fs.readFileSync(collectionOut+'/final-source-holds.exit','utf8'),'0\n');
          const buildNames=['build','sweep-weight','simAdsense','simBrand','simHeadTags','simHiddenPages','simHubs','simIndexNow','simIndexing','simInternalLinks','simNoRivalNames','simPrerender','simPrerenderBoot','simRetiredRoutes','simSchema','simSitemap','simSnapshotAssets','simSiteSearch','simGuideHeadings','simHarnessAnchors','simSeoTitles','simSeoMetaSplit'];
          for(const name of buildNames)for(const suffix of['.exit','-tee.exit','-transport.exit'])
           assert.equal(fs.readFileSync(collectionOut+'/logs/'+name+suffix,'utf8'),'0\n','ORIGINAL_BUILD_GATE_NOT_ZERO '+name+suffix);
          assert.equal(JSON.parse(fs.readFileSync(collectionOut+'/fallback-read-admitted.json')).status,'FULL_UNCHANGED_FALLBACK_GUARD_LIVE_READ_PASSED');
          assert.equal(JSON.parse(fs.readFileSync(collectionOut+'/records-output-retention.json')).nativeSimExit,0);
          const out=process.env.QA_OUT,bridge=JSON.parse(fs.readFileSync(out+'/bridge/BRIDGE.json')),controls=JSON.parse(fs.readFileSync(out+'/bridge/PHYSICAL-CONTROLS.json'));
          assert.equal(bridge.status,'passed');assert.equal(controls.status,'passed');
          assert.equal(controls.results.length,10);for(const r of controls.results){assert.equal(r.native,1);assert.equal(r.owned,true);}
          const readers=['simAdsense','simBrand','simHeadTags','simHiddenPages','simHubs','simIndexNow','simIndexing','simInternalLinks','simNoRivalNames','simPrerender','simPrerenderBoot','simRetiredRoutes','simSchema','simSitemap','simSnapshotAssets','simSiteSearch','simGuideHeadings','simHarnessAnchors','simSeoTitles','simSeoMetaSplit'];
          fs.writeFileSync(out+'/qualification.json',JSON.stringify({status:'SCOPED_RUSSIA_MODEL_AND_BUILD_PASSED_WITH_UNCHANGED_BASELINE_REDS',allOriginalOutcomesPassed:false,baselineRegressionAdmission:{file:policyFile,bytes:policyBody.length,sha256:policySHA},product:{commit:process.env.PRODUCT_CORE,tree:process.env.PRODUCT_TREE},bridgeCases:bridge.cases.length,physicalControls:10,properTypes:true,normalBuilds:1,readers,unchangedCaps:16,smokes:3,fullSuite:false,browser:false,public:false},null,2)+'\n');
          CLOSE
      - name: Mark any retained completed output without final qualification as diagnostic only
        if: always()
        run: |
          set -euo pipefail
          node --input-type=module <<'DIST_DIAGNOSTIC'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const out=process.env.QA_OUT,hasDist=fs.existsSync(out+'/completed-dist.tar.gz'),qualified=fs.existsSync(out+'/qualification.json');
          if(hasDist&&!qualified){
           const models=fs.existsSync(out+'/MODEL-OUTCOMES.json')?JSON.parse(fs.readFileSync(out+'/MODEL-OUTCOMES.json')):null;
           const exits=fs.readdirSync(out+'/logs').filter(name=>name.endsWith('.exit')).sort().map(file=>({file:'logs/'+file,native:fs.readFileSync(out+'/logs/'+file,'utf8')}));
           fs.writeFileSync(out+'/UNQUALIFIED-COMPLETED-DIST.json',JSON.stringify({status:'DIAGNOSTIC_COMPLETED_DIST_NOT_QUALIFIED',product:{commit:process.env.PRODUCT_CORE,tree:process.env.PRODUCT_TREE},qualification:false,allOriginalModelsPassed:models?.allOriginalOutcomesPassed??false,failedModelOutcomes:models?.failedOutcomes??null,recordedExits:exits,meaning:'Completed output retained for diagnosis only. No missing or red model, admission, transport, source hold, build, reader or cap is waived.'},null,2)+'\n',{flag:'wx'});
          }else if(qualified){assert(hasDist);assert.equal(JSON.parse(fs.readFileSync(out+'/qualification.json')).status,'SCOPED_RUSSIA_MODEL_AND_BUILD_PASSED_WITH_UNCHANGED_BASELINE_REDS');}
          DIST_DIAGNOSTIC
      - name: Retain the complete native packet
        if: always()
        run: |
          set -euo pipefail
          cd "$QA_OUT"
          find . -type f ! -name manifest.sha256 -print0 | sort -z | xargs -0 sha256sum > manifest.sha256
          tar -czf "$RUNNER_TEMP/russia-career-qualification.tar.gz" .
          cd "$RUNNER_TEMP"
          sha256sum russia-career-qualification.tar.gz > russia-career-qualification.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: russia-career-qualification
          path: |
            ${{ runner.temp }}/russia-career-qualification.tar.gz
            ${{ runner.temp }}/russia-career-qualification.tar.gz.sha256
          compression-level: 0
          retention-days: 30
