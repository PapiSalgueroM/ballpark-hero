          assert(native('dist-types','tar',['-tvzf',tarFile]).trimEnd().split('\n').every(x=>x.startsWith('-')||x.startsWith('d')));
          native('dist-extract','tar',['-xzf',tarFile,'--strip-components=1','-C','dist']);
          const dist=inventory('dist');assert.equal(dist.length,852);assert.equal(dist.reduce((n,r)=>n+r.bytes,0),23873460);assert.equal(sha(JSON.stringify(dist)),'ece8c5d78e58fb3934ee7b79d7978e913b5e09a88873fb956bcb50ae2b6eaeb5');assert.equal(fs.statSync(tarFile).size,6997527);assert.equal(sha(fs.readFileSync(tarFile)),'c54a0631611102d3b0599ab94dd7b87a4ee6f020d1e0b4c6d7fb85fc3316e792');assert.deepEqual(Object.fromEntries(dist.map(r=>['dist/'+r.file,r.sha256])),distMap);copy('dist-before.sha256');
          write('DIST-INHERITANCE.json',{original:q,normalBuilds:1,newBuilds:0,wholeAppAndOtherSourceBytesEqual:true,sourceDelta:bridgePath,dist,distDigest:sha(JSON.stringify(dist)),completedTar:{bytes:fs.statSync(tarFile).size,sha256:sha(fs.readFileSync(tarFile))},readersInherited:first17,readersPending:['simHarnessAnchors','simSeoTitles','simSeoMetaSplit']});
          write('ORIGINAL-INPUT-AUTHORITY.json',{original:q,run,job,artifact,commit,sourceDelta:delta,wholeSourceInverse:true,originalQualification:false});
          write('input-original-before.json',inventory(ref));write('input-evidence-before.json',rows);write('dist-native-before.json',dist);
          AUTHENTICATE
          node --check "$QA_OUT/authenticate.mjs"
      - name: Authenticate the failed V12 original and inherit complete evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node "$QA_OUT/authenticate.mjs"
      - name: Install held dependencies and verify the immutable baseline
        run: |
          set -euo pipefail
          test "$(bun --version)" = 1.4.4
          bun install --frozen-lockfile > "$QA_OUT/logs/bun-install.log" 2>&1
          git diff --exit-code HEAD -- package.json package-lock.json bun.lock bun.lockb
          npm install --prefix "$RUNNER_TEMP/russia-bridge-tools" --package-lock=false --no-audit --no-fund playwright@1.64.0 > "$QA_OUT/logs/playwright-install.log" 2>&1
          test ! -e node_modules/playwright
          test ! -e node_modules/playwright-core
          ln -s "$RUNNER_TEMP/russia-bridge-tools/node_modules/playwright" node_modules/playwright
          ln -s "$RUNNER_TEMP/russia-bridge-tools/node_modules/playwright-core" node_modules/playwright-core
          "$RUNNER_TEMP/russia-bridge-tools/node_modules/.bin/playwright" install --with-deps chromium > "$QA_OUT/logs/chromium-install.log" 2>&1
          git worktree add --detach "$QA_BASE_SRC" 636b31efd64b749d4900e3f5773681e0496addf6
          (cd "$QA_BASE_SRC"; git ls-files -z | sort -z | xargs -0 sha256sum) > "$QA_OUT/baseline-source-before-current.sha256"
          (cd "$QA_BASE_SRC"; git ls-files --stage) > "$QA_OUT/baseline-index-before-current.txt"
          (cd "$QA_BASE_SRC"; sha256sum package.json package-lock.json bun.lock bun.lockb) > "$QA_OUT/baseline-locks-before-current.sha256"
          cmp "$QA_OUT/baseline-source-before.sha256" "$QA_OUT/baseline-source-before-current.sha256"
          cmp "$QA_OUT/baseline-index-before.txt" "$QA_OUT/baseline-index-before-current.txt"
          cmp "$QA_OUT/baseline-locks-before.sha256" "$QA_OUT/baseline-locks-before-current.sha256"
          test ! -e "$QA_BASE_SRC/node_modules"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$QA_BASE_SRC/node_modules"
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > "$QA_OUT/dist-after-extraction.sha256"
          cmp "$QA_OUT/dist-before.sha256" "$QA_OUT/dist-after-extraction.sha256"
      - name: Materialize AGGREGATE and check its syntax
        run: |
          set -euo pipefail
          test ! -e "$QA_OUT/aggregate.mjs"
          cat > "$QA_OUT/aggregate.mjs" <<'AGGREGATE'
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          import crypto from 'node:crypto';
          const e=process.env,out=e.QA_OUT,root=path.join(out,'inherited-v12'),sha=b=>crypto.createHash('sha256').update(b).digest('hex');
          const read=f=>fs.readFileSync(path.join(out,f)),json=f=>JSON.parse(read(f)),old=f=>JSON.parse(fs.readFileSync(path.join(root,f)));
          const pin=f=>({file:f,bytes:read(f).length,sha256:sha(read(f))});
          const write=(f,v)=>fs.writeFileSync(path.join(out,f),JSON.stringify(v,null,2)+'\n',{flag:'wx'});
          const q=JSON.parse(e.ORIGINAL_INPUT),product={commit:e.PRODUCT_CORE,tree:e.PRODUCT_TREE},origin={run:q.run,job:q.job,qa:q.qa,qaTree:q.qaTree,workflowBlob:q.workflowBlob,artifact:q.artifact,zipSHA256:q.zipSHA256,independentPartialAdmissionSHA256:q.independentPartialAdmissionSHA256};
          assert.equal(json('CONTINUATION-HOLDS.json').status,'ALL_CURRENT_BASELINE_DIST_AND_ORIGINAL_INPUTS_HELD');
          const before=old('MODEL-OUTCOMES.json'),names=before.rows.map(r=>r.name),red=['simCareerLeagueFinish','simCareerLeagueSeasons','simCareerLeagueWorld'];
          const actual=name=>{
           const exitFile='logs/'+name+'.exit',nativeExit=Number(read(exitFile).toString().trim());
           assert.equal(nativeExit,0);assert.equal(read('transport/'+name+'.log').length,0);
           return{name,nativeExit,exitFile,log:pin('logs/'+name+'.log'),transport:{...pin('transport/'+name+'.log'),empty:true},passed:true,provenance:{kind:'current-continuation',run:Number(e.GITHUB_RUN_ID),attempt:Number(e.GITHUB_RUN_ATTEMPT),qa:e.GITHUB_SHA,product}};
          };
          const rows=before.rows.map(r=>['bridge','bridge-controls'].includes(r.name)?actual(r.name):{...r,provenance:{kind:'inherited-v12',origin,originalProduct:before.product,originalOutcomeFile:{file:'inherited-v12/MODEL-OUTCOMES.json',bytes:read('inherited-v12/MODEL-OUTCOMES.json').length,sha256:sha(read('inherited-v12/MODEL-OUTCOMES.json'))}}});
          for(const r of rows){assert.equal(r.nativeExit,red.includes(r.name)?1:0);assert.equal(r.passed,!red.includes(r.name));assert.equal(read(r.exitFile).toString(),r.nativeExit+'\n');assert.equal(sha(read(r.log.file)),r.log.sha256);assert.equal(read(r.log.file).length,r.log.bytes);assert.equal(read(r.transport.file).length,0);}
          assert.deepEqual(rows.map(r=>r.name),names);assert.equal(rows.length,29);
          const collection={...before,product,rows,failedOutcomes:red,allOriginalOutcomesPassed:false,continuation:{origin,inheritedModelOutcomes:27,currentBridgeOutcomes:2,newSeasonRuns:0,fullAppAndBuildInputsEqual:true}};
          write('MODEL-OUTCOMES.json',collection);
          const policy=old('baseline-regression-admission.json');
          assert.equal(policy.schema,'RUSSIA_BASELINE_REGRESSION_ADMISSION_V2');assert.equal(policy.status,'TWO_INHERITED_REDS_AND_ONE_SOURCE_ATTRIBUTED_CHANGE_RETAINED');assert.deepEqual(policy.redOutcomeNames,red);assert.equal(policy.zeroOutcomeNames.length,26);assert.equal(policy.unclassifiedFailures.length,0);
          assert.equal(policy.noModelOrGoldenChange,true);assert.equal(policy.noNativeRedConvertedToGreen,true);assert.equal(policy.allOriginalOutcomesPassed,false);
          for(const m of policy.models){const b=read(m.evidence.admission.file);assert.equal(b.length,m.evidence.admission.bytes);assert.equal(sha(b),m.evidence.admission.sha256);assert.equal(m.nativeExit,1);assert.equal(m.passed,false);}
          const reissued={...policy,product,originalOutcomeFile:pin('MODEL-OUTCOMES.json'),continuation:{origin,originalPolicy:pin('inherited-v12/baseline-regression-admission.json'),wholeAppAndFinishScriptClosureEqual:true}};
          write('baseline-regression-admission.json',reissued);
          const restored={...reissued,product:policy.product,originalOutcomeFile:policy.originalOutcomeFile};delete restored.continuation;
          assert.deepEqual(restored,policy,'CONTINUATION_POLICY_WHOLE_INVERSE');
          const bridge=json('bridge/BRIDGE.json'),controls=json('bridge/PHYSICAL-CONTROLS.json');assert.equal(bridge.schema,'RUSSIA_CAREER_BRIDGE_V1');assert.equal(bridge.status,'passed');assert.equal(bridge.control,null);assert.deepEqual(bridge.failures,[]);
          assert.equal(controls.status,'passed');assert.equal(controls.results.length,10);for(const r of controls.results){assert.equal(r.native,1);assert.equal(r.owned,true);}
          const first17=json('DIST-INHERITANCE.json').readersInherited,last3=['simHarnessAnchors','simSeoTitles','simSeoMetaSplit'];
          for(const n of['build','sweep-weight',...first17,...last3])for(const s of['.exit','-tee.exit','-transport.exit'])assert.equal(read('logs/'+n+s).toString(),'0\n');
          for(const f of['types.exit','final-source-holds.exit'])assert.equal(read(f).toString(),'0\n');
          assert(read('dist-before.sha256').equals(read('dist-after.sha256')));
          const normalBuildOrigin={origin,completedDist:pin('completed-dist.tar.gz'),buildReceipt:pin('build-passed.json'),AppAndBuildInputsWholeEqual:true,newBuilds:0};
          write('CONTINUATION-ADMISSION.json',{schema:'RUSSIA_INCREMENTAL_QUALIFICATION_CONTINUATION_V1',status:'ORIGINAL_MODELS_AND_BUILD_PLUS_CORRECTED_BRIDGE_AND_FINAL_READERS_ADMITTED',product,origin,originalQualification:false,models:{inherited:27,current:2,total:29,zero:26,native1:red},originalBuild:normalBuildOrigin,readers:{inherited:first17,current:last3},allOriginalBodiesRetainedUnder:'inherited-v12',originalInputInventory:pin('ORIGINAL-V12-INVENTORY.json'),sourceDelta:'scripts/simRussiaCareerBridge.mjs',policyInverseExact:true});
          write('qualification.json',{status:'SCOPED_RUSSIA_BUILD_AND_BRIDGE_PASSED_WITH_TWO_INHERITED_REDS_AND_ATTRIBUTED_FINISH_CHANGE',allOriginalOutcomesPassed:false,baselineRegressionAdmission:pin('baseline-regression-admission.json'),product,bridgeCases:bridge.cases.length,physicalControls:10,properTypes:true,normalBuilds:1,readers:[...first17,...last3],unchangedCaps:16,smokes:3,fullSuite:false,browser:false,public:false,normalBuildOrigin,continuationAdmission:pin('CONTINUATION-ADMISSION.json')});
          console.log('Incremental qualification admitted with one original normal build and exact per-outcome provenance.');
          AGGREGATE
          node --check "$QA_OUT/aggregate.mjs"
      - name: Materialize HOLDS and check its syntax
        run: |
          set -euo pipefail
          test ! -e "$QA_OUT/holds.mjs"
          cat > "$QA_OUT/holds.mjs" <<'HOLDS'
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          import crypto from 'node:crypto';
          const e=process.env,out=e.QA_OUT,sha=b=>crypto.createHash('sha256').update(b).digest('hex'),errors=[];
          const inventory=root=>{const rows=[];function walk(rel=''){for(const d of fs.readdirSync(path.join(root,rel),{withFileTypes:true})){const file=path.posix.join(rel,d.name);if(d.isDirectory())walk(file);else{assert(d.isFile());const b=fs.readFileSync(path.join(root,file));rows.push({file,bytes:b.length,sha256:sha(b)});}}}walk();return rows.sort((a,b)=>a.file<b.file?-1:a.file>b.file?1:0);};
          function pair(a,b){try{assert(fs.readFileSync(out+'/'+a).equals(fs.readFileSync(out+'/'+b)),a);}catch(err){errors.push({name:a,error:String(err.stack??err)});}}
          for(const prefix of['','baseline-'])for(const leaf of['source','index','locks'])pair(prefix+leaf+'-before'+(leaf==='index'?'.txt':'.sha256'),prefix+leaf+'-after'+(leaf==='index'?'.txt':'.sha256'));
          for(const prefix of['','baseline-'])for(const leaf of['status-before.txt','status-after.txt'])try{assert.equal(fs.readFileSync(out+'/'+prefix+leaf).length,0);}catch(err){errors.push({name:prefix+leaf,error:String(err)});}
          for(const [root,before,label]of[[e.QA_REF,'input-original-before.json','originalZIPAndTGZ'],[out+'/inherited-v12','input-evidence-before.json','allOriginalExtractedBodies'],['dist','dist-native-before.json','completedDist']]){
           try{const actual=inventory(root),previous=JSON.parse(fs.readFileSync(out+'/'+before));assert.deepEqual(actual,previous);fs.writeFileSync(out+'/'+label+'-after.json',JSON.stringify(actual)+'\n',{flag:'wx'});}catch(err){errors.push({name:label,error:String(err.stack??err)});}
          }
          pair('dist-before.sha256','dist-after.sha256');
          fs.writeFileSync(out+'/CONTINUATION-HOLDS.json',JSON.stringify({status:errors.length?'HOLD_FAILED':'ALL_CURRENT_BASELINE_DIST_AND_ORIGINAL_INPUTS_HELD',errors,currentAndBaselineSourceHeld:errors.length===0,AppBuilds:0,originalArchivesHeld:!errors.some(r=>r.name==='originalZIPAndTGZ')},null,2)+'\n',{flag:'wx'});
          assert.equal(errors.length,0,'CONTINUATION_SOURCE_AND_INPUT_HOLDS');
          HOLDS
          node --check "$QA_OUT/holds.mjs"
      - name: Corrected Bridge and controls plus the three remaining readers
        run: |
          set -euo pipefail
          export RUSSIA_BASE_ROOT="$QA_BASE_SRC"
          export RUSSIA_EVIDENCE_ROOT="$QA_OUT/bridge"
          export GIT_NO_LAZY_FETCH=1
          export NODE_OPTIONS="--require=$GITHUB_WORKSPACE/scripts/lib/offlineTransport.cjs"
          run_gate() {
            local name="$1"
            shift
            local receipt="$QA_OUT/transport/$name.log"
            : > "$receipt" || exit 1
            set +e
            SIM_OFFLINE_RECEIPT="$receipt" "$@" 2>&1 | tee "$QA_OUT/logs/$name.log"
            local statuses=("${PIPESTATUS[@]}")
            set -e
            printf '%s\n' "${statuses[0]}" > "$QA_OUT/logs/$name.exit"
            printf '%s\n' "${statuses[1]}" > "$QA_OUT/logs/$name-tee.exit"
            test "${statuses[0]}" = 0
            test "${statuses[1]}" = 0
            local transport_exit=0
            test ! -s "$receipt" || transport_exit=1
            printf '%s\n' "$transport_exit" > "$QA_OUT/logs/$name-transport.exit"
            test "$transport_exit" = 0
          }
          run_gate syntax-bridge node --check scripts/simRussiaCareerBridge.mjs
          run_gate bridge node scripts/simRussiaCareerBridge.mjs
          run_gate bridge-controls node scripts/simRussiaCareerBridge.mjs --controls
          run_gate simHarnessAnchors node scripts/simHarnessAnchors.mjs
          run_gate simSeoTitles node scripts/simSeoTitles.mjs
          run_gate simSeoMetaSplit env SEO_SPLIT_ONLY=/soccer-career,/club-manager,/nba-my-career node scripts/simSeoMetaSplit.mjs
      - name: Always hold all source locks dist and original evidence
        if: always()
        run: |
          set -euo pipefail
          git ls-files -z | sort -z | xargs -0 sha256sum > "$QA_OUT/source-after.sha256"
          git ls-files --stage > "$QA_OUT/index-after.txt"
          sha256sum package.json package-lock.json bun.lock bun.lockb > "$QA_OUT/locks-after.sha256"
          git status --porcelain=v1 --untracked-files=all > "$QA_OUT/status-after.txt"
          if test -d "$QA_BASE_SRC"; then
            (cd "$QA_BASE_SRC"; git ls-files -z | sort -z | xargs -0 sha256sum) > "$QA_OUT/baseline-source-after.sha256"
            (cd "$QA_BASE_SRC"; git ls-files --stage) > "$QA_OUT/baseline-index-after.txt"
            (cd "$QA_BASE_SRC"; sha256sum package.json package-lock.json bun.lock bun.lockb) > "$QA_OUT/baseline-locks-after.sha256"
            (cd "$QA_BASE_SRC"; git status --porcelain=v1 --untracked-files=all) > "$QA_OUT/baseline-status-after.txt"
          fi
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > "$QA_OUT/dist-after.sha256"
          node "$QA_OUT/holds.mjs"
          printf '0\n' > "$QA_OUT/final-source-holds.exit"
      - name: Admit the one inherited build and aggregate actual outcomes
        run: |
          set -euo pipefail
          node "$QA_OUT/aggregate.mjs"
      - name: Retain all original and continuation evidence
        if: always()
        run: |
          set -euo pipefail
          cd "$QA_OUT"
          find . -type f ! -path './manifest.sha256' -print0 | sort -z | xargs -0 sha256sum > manifest.sha256
          tar -czf "$RUNNER_TEMP/russia-career-qualification.tar.gz" .
          cd "$RUNNER_TEMP"
          sha256sum russia-career-qualification.tar.gz > russia-career-qualification.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: russia-career-qualification
          path: |
            ${{ runner.temp }}/russia-career-qualification.tar.gz
            ${{ runner.temp }}/russia-career-qualification.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
