            simCareerLeagueFinish simCareerLeagueSeasons simCareerLeagueWorld
            simCareerDomesticCup simCareerContinental simSoccerCareerUcl
            simLoanSpell simCareerTransferBrief simSoccerCareerSavedLoan
            simSoccerLoanBite simSoccerLoanMinutes simTransferBriefPageControl
          )
          for guard in "${guards[@]}"; do
            if [[ "$guard" == simCareerFallback ]]; then
              test -z "${CAREER_FALLBACK_LOCAL_ONLY:-}"
              test -z "${CAREER_CONTROL:-}"
              run_model "$guard" env SIM_NETWORK=live NODE_OPTIONS="--require=$QA_OUT/fallback-read/preload.cjs" node "scripts/$guard.mjs"
              node --input-type=module <<'FALLBACK_READ'
          import fs from 'node:fs';import path from 'node:path';import crypto from 'node:crypto';import assert from 'node:assert/strict';
          const out=path.join(process.env.QA_OUT,'fallback-read'),log=fs.readFileSync(process.env.QA_OUT+'/logs/simCareerFallback.log','utf8');
          const summary=JSON.parse(fs.readFileSync(path.join(out,'summary.json'))),probe=JSON.parse(fs.readFileSync(path.join(out,'probes.json')));
          assert.equal(summary.mode,'EXACT_PUBLIC_GET_ONLY');assert.equal(summary.nativeExit,0);assert.equal(summary.networkWrites,0);assert.equal(summary.headersRetained,false);
          assert.equal(probe.networkDispatches,0);assert.equal(probe.probes.length,9);assert(probe.probes.every(row=>row.changed&&row.rejected&&row.networkDispatches===0));
          assert(!/LIVE SECTIONS SKIPPED|FAIL:|Supabase unreachable/.test(log));
          for(let i=1;i<=6;i++)assert.equal(log.split('\n').filter(line=>line.startsWith(i+') ')).length,1,'FALLBACK_READ_FULL_SECTION_'+i);
          assert(log.includes('read fresh, identical'));assert(/30 players, \d+ season rows compared/.test(log));assert(log.includes('every file club among them'));
          assert.equal(log.split('\n').filter(line=>line==='simCareerFallback: green. The fallback is a byte for byte bake of the live career tables and every row has the shape a real season has.').length,1);
          const rows=summary.requests;assert(rows.length>61);assert(rows.every(row=>row.method==='GET'&&row.origin==='https://flawuiqbvjobmkfkauhw.supabase.co'&&row.complete&&[200,206].includes(row.status)&&row.urlMatched&&!row.hasBody&&!row.hasDispatcher&&!row.error));
          for(const row of rows){const bytes=fs.readFileSync(path.join(out,row.bodyFile));assert.equal(bytes.length,row.bytes);assert.equal(crypto.createHash('sha256').update(bytes).digest('hex'),row.sha256);assert(Array.isArray(JSON.parse(bytes)));}
          const count=(table,key)=>rows.filter(row=>row.path==='/rest/v1/'+table&&row.query.some(([name])=>name===key)).length;
          assert.equal(count('career_players','player_name'),30);assert.equal(count('career_seasons','player_id'),30);
          const bulkPlayers=rows.filter(row=>row.path==='/rest/v1/career_players'&&!row.query.some(([key])=>key==='player_name')),bulkSeasons=rows.filter(row=>row.path==='/rest/v1/career_seasons'&&!row.query.some(([key])=>key==='player_id'));
          assert.equal(bulkPlayers.length,1);assert(bulkSeasons.length>0);assert.equal(rows.length,61+bulkSeasons.length);
          fs.writeFileSync(process.env.QA_OUT+'/fallback-read-admitted.json',JSON.stringify({status:'FULL_UNCHANGED_FALLBACK_GUARD_LIVE_READ_PASSED',requestCount:rows.length,bulkPlayers:1,bulkSeasonPages:bulkSeasons.length,individualPlayerReads:30,individualSeasonReads:30,methods:['GET'],tables:['career_players','career_seasons'],networkWrites:0,allSixSections:true,probeControls:9,allPublicResponseBodiesRetained:true,headersRetained:false})+'\n',{flag:'wx'});
          FALLBACK_READ
            else
              run_model "$guard" node "scripts/$guard.mjs"
            fi
          done
          run_model simSaveKeeper node scripts/simSaveKeeper.mjs
          run_model simHomeFront node scripts/simHomeFront.mjs
