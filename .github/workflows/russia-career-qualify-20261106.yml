          const origin=/SUPABASE_URL\s*=\s*["']([^"']+)["']/.exec(client)?.[1];
          assert.equal(origin,'https://flawuiqbvjobmkfkauhw.supabase.co','FALLBACK_READ_SOURCE_ORIGIN');
          const offline=require(path.join(workspace,'scripts/lib/offlineTransport.cjs')),offlineFetch=globalThis.fetch;
          const paths=new Set(['/rest/v1/career_players','/rest/v1/career_seasons']);
          const queryKeys=new Set(['select','order','offset','limit','player_name','player_id']);
          const sha=b=>crypto.createHash('sha256').update(b).digest('hex');
          function requestGuard(row){
           assert.equal(row.method,'GET','FALLBACK_READ_METHOD');
           assert.equal(row.origin,origin,'FALLBACK_READ_ORIGIN');
           assert(paths.has(row.path),'FALLBACK_READ_TABLE');
           assert.equal(row.hasBody,false,'FALLBACK_READ_BODY');
           assert.equal(row.hasDispatcher,false,'FALLBACK_READ_DISPATCHER');
           assert(row.query.every(([key])=>queryKeys.has(key)),'FALLBACK_READ_QUERY');
          }
          function responseGuard(row){
           assert(![301,302,303,307,308].includes(row.status),'FALLBACK_READ_REDIRECT');
           assert.equal(row.urlMatched,true,'FALLBACK_READ_RESPONSE_URL');
           assert([200,206].includes(row.status),'FALLBACK_READ_HTTP200_OR206');
          }
          const healthy={method:'GET',origin,path:'/rest/v1/career_players',query:[['select','id']],hasBody:false,hasDispatcher:false};
          requestGuard(healthy);responseGuard({status:200,urlMatched:true});responseGuard({status:206,urlMatched:true});
          let probeDispatches=0;
          const probes=[];
          for(const[name,patch,marker,response]of[
           ['post',{method:'POST'},'FALLBACK_READ_METHOD'],
           ['host',{origin:'https://invalid.example'},'FALLBACK_READ_ORIGIN'],
           ['table',{path:'/rest/v1/other_table'},'FALLBACK_READ_TABLE'],
           ['body',{hasBody:true},'FALLBACK_READ_BODY'],
           ['dispatcher',{hasDispatcher:true},'FALLBACK_READ_DISPATCHER'],
           ['query',{query:[['apikey','unlogged-probe']]},'FALLBACK_READ_QUERY'],
           ['redirect',{},'FALLBACK_READ_REDIRECT',{status:302,urlMatched:true}],
           ['response-url',{},'FALLBACK_READ_RESPONSE_URL',{status:200,urlMatched:false}],
           ['http-status',{},'FALLBACK_READ_HTTP200_OR206',{status:503,urlMatched:true}]
          ]){
           const before=JSON.stringify({request:healthy,response:{status:200,urlMatched:true}});
           const fault=JSON.parse(before);Object.assign(fault.request,patch);if(response)fault.response=response;
           assert.notEqual(JSON.stringify(fault),before);let error;
           try{requestGuard(fault.request);responseGuard(fault.response);probeDispatches++;}catch(found){error=found;}
           assert(error instanceof assert.AssertionError);assert(error.message.startsWith(marker));
           probes.push({name,marker,changed:true,rejected:true,networkDispatches:0});
          }
          assert.equal(probeDispatches,0);
          fs.writeFileSync(path.join(out,'probes.json'),JSON.stringify({scope:'Source-shaped data controls before the normal harness, not actual network requests',probes,networkDispatches:probeDispatches})+'\n',{flag:'wx'});
          const rows=[];let sequence=0;
