name: Russia Career bridge, model and unchanged build gates
on:
  push:
    branches: [codex/russia-career-qualify-v6-20261106]
permissions:
  contents: read
concurrency:
  group: russia-career-qualify-20261106
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      BASE_CORE: 636b31efd64b749d4900e3f5773681e0496addf6
      BASE_TREE: 9b6671db9c6f56db7bfd572521cf4e37cf7011a7
      PRODUCT_CORE: e2df71702225be8ac03b253e7cec83264a65aa03
      PRODUCT_TREE: 909c1fa034f951c4bf4c9e847db3c08614b3b9f4
      PRODUCT_FILES: '[{"path":"scripts/data/soccerCareerFacts.json","before":"3020b7ebbc6a17013b3c7ab6a30558b675e35257","after":"59eb8da54e7bc205f78781c7786dd20b02bd82bd"},{"path":"scripts/lib/careerClubPool.mjs","before":"3abec590896605188a4fc0cc7d122fc3be8438c3","after":"f5416cca123c9b3792588182f59350689e7f09e8"},{"path":"scripts/lib/careerWorldTruth1329.mjs","before":"8dc0dce77a13188eb939f78b0eb1850ba81a39f2","after":"9fee9405360ecbbbf30d475f5d3d67e209af1630"},{"path":"scripts/simCareerClubPool.mjs","before":"4f2493986069d7486e05560fbfd021455f27f1f7","after":"17d303564c35ffb5c985db3922f42809bc2c032f"},{"path":"scripts/simRussiaCareerBridge.mjs","before":null,"after":"513cd968a640e5d483e3dc57de7cf460aa315a9c"},{"path":"src/data/leagueFormat.ts","before":"802650466c0c4439f12c741e7d1ae28957280f9b","after":"54d431b2d963d10f0980a1c54d5aaf2b5963ff10"},{"path":"src/data/soccerCareerClubPool.ts","before":"522399403d4a5816680d0d5d2e19e3fda650d71d","after":"50d91e61a50459b60388a8f25551b353192842e5"},{"path":"src/lib/clubManager.ts","before":"a089f29e8f1adee4090927937bac4d50017ae7cf","after":"0735c1eda13393b8a6da605aa3c880fa276090bb"},{"path":"src/lib/soccerCareerContinental.ts","before":"44d4acee04504ac92382a986b3e2cfd5301d4ac1","after":"fe278d5fe50492374206e5846701db0c31fa6b01"},{"path":"src/lib/soccerCareerDerby.ts","before":"e25062b2b6560957feb414fd709b7bbc5b4af7ba","after":"895f15bbd52c3766325664e01da4627e6110d2d9"},{"path":"src/lib/soccerCareerEngine.ts","before":"663eab42df957f156b35e931d81f9f643ea1a7f4","after":"393d2b61b3d59cba721527f3ca47282171729a1f"},{"path":"src/lib/soccerCareerLeague.ts","before":"cf7772161d902d2bb82d7f5cb6b3bdc5d04a9659","after":"009b5c36a28e0f64076c9f6b302cba8af7fd3094"},{"path":"src/lib/soccerCareerTransferBrief.ts","before":"74718f3b76923c77a55c87e5c150c366f0d482ce","after":"fab5f9491750e3615adeed75fbedcd80d700e260"},{"path":"src/pages/SoccerCareer.tsx","before":"08a93b48a2bfcd42883b24c72e8f64f49caec6aa","after":"7a8a81467627be0e1d9d3c2e09c741b7953fec74"}]'
      PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.2'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Bind the complete product and sole qualification-only addition
        run: |
          set -euo pipefail
          export QA_OUT="$RUNNER_TEMP/russia-career-qualification-evidence"
          export QA_BASE_SRC="$RUNNER_TEMP/russia-career-qualification-original"
          mkdir -p "$QA_OUT/logs" "$QA_OUT/transport"
          echo "QA_OUT=$QA_OUT" >> "$GITHUB_ENV"
          echo "QA_BASE_SRC=$QA_BASE_SRC" >> "$GITHUB_ENV"
          cat > "$QA_OUT/transferBriefOutputRetainer.mjs" <<'TRANSFER_RETAINER'
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { fileURLToPath } from 'node:url';
          
          const [mode, flag, ...extra] = process.argv.slice(2);
          assert(['prepare', 'retain'].includes(mode) && extra.length === 0 &&
            (flag === undefined || (mode === 'retain' && flag === '--required')), 'TRANSFER_BRIEF_RETAINER_ARGUMENTS');
          assert(process.env.GITHUB_WORKSPACE && process.env.QA_OUT, 'TRANSFER_BRIEF_RETAINER_PATH_ENV');
          const root = fs.realpathSync(process.env.GITHUB_WORKSPACE), out = fs.realpathSync(process.env.QA_OUT);
          assert.equal(fs.realpathSync('.'), root, 'TRANSFER_BRIEF_RETAINER_REPO_CWD');
          const relativeOut = path.relative(root, out);
          assert(relativeOut === '..' || relativeOut.startsWith('..' + path.sep) || path.isAbsolute(relativeOut), 'TRANSFER_BRIEF_RETAINER_OUTSIDE_REPO');
          const ordinary = file => {
            const stat = fs.lstatSync(file);
            assert(!stat.isSymbolicLink() && (stat.isFile() || stat.isDirectory()), 'TRANSFER_BRIEF_RETAINER_ORDINARY ' + file);
            return stat;
          };
          assert(ordinary(out).isDirectory(), 'TRANSFER_BRIEF_RETAINER_OUT_DIRECTORY');
          const exists = file => { try { fs.lstatSync(file); return true; } catch (e) { if (e.code === 'ENOENT') return false; throw e; } };
          const source = path.join(root, 'career-transfer-brief-artifacts');
          const parent = path.join(out, 'model-artifacts'), target = path.join(parent, 'transfer-brief');
          const preparedFile = path.join(out, 'transfer-brief-owned-before.json');
          const beforeFile = path.join(out, 'transfer-brief-output-census-before.json');
          const receiptFile = path.join(out, 'transfer-brief-output-retention.json');
          const sha = bytes => createHash('sha256').update(bytes).digest('hex');
          const selfSHA256 = sha(fs.readFileSync(fileURLToPath(import.meta.url)));
          const write = (file, value) => fs.writeFileSync(file, JSON.stringify(value, null, 2) + '\n', { flag: 'wx' });
          const read = file => { assert(ordinary(file).isFile()); return JSON.parse(fs.readFileSync(file, 'utf8')); };
          const paths = { root, out, source, target, selfSHA256 };
          const checkPaths = value => { for (const [key, val] of Object.entries(paths)) assert.equal(value[key], val, 'TRANSFER_BRIEF_RETAINER_OWNERSHIP ' + key); };
          function census(base) {
            const rows = [];
            function visit(relative) {
              const file = relative === '.' ? base : path.join(base, ...relative.split('/')), stat = ordinary(file);
              if (stat.isFile()) {
                const bytes = fs.readFileSync(file), row = { path: relative, kind: 'file', bytes: bytes.length, sha256: sha(bytes) };
                rows.push(row); return row;
              }
              const children = fs.readdirSync(file).sort().map(name => {
                const child = visit(relative === '.' ? name : relative + '/' + name);
                return { name, kind: child.kind, ...(child.kind === 'file' ? { bytes: child.bytes } : {}), sha256: child.sha256 };
              });
              const row = { path: relative, kind: 'directory', entries: children.length,
                sha256: sha(Buffer.from(JSON.stringify(children))) };
              rows.push(row); return row;
            }
            assert(ordinary(base).isDirectory(), 'TRANSFER_BRIEF_RETAINER_DIRECTORY');
            visit('.');
            rows.sort((a, b) => a.path < b.path ? -1 : a.path > b.path ? 1 : 0);
            const files = rows.filter(row => row.kind === 'file');
            return { rows, files: files.length, directories: rows.length - files.length,
              bytes: files.reduce((sum, row) => sum + row.bytes, 0) };
          }
          function requiredRaw(value) {
            assert(value.files > 0, 'TRANSFER_BRIEF_RETAINER_REQUIRED_RAW');
            for (const file of ['outcomes.json', 'native-fixtures.json', 'neutral-season-ere-101.json',
              'page-control-baseline.json', 'page-control-fault.json', 'page-control-receipt.json'])
              assert(value.rows.some(row => row.path === file && row.kind === 'file' && row.bytes > 0), 'TRANSFER_BRIEF_RETAINER_REQUIRED_RAW ' + file);
          }
          if (mode === 'prepare') {
            assert(!exists(source) && !exists(target), 'TRANSFER_BRIEF_RETAINER_FRESH_FIXED_DIRECTORY');
            assert(!exists(preparedFile) && !exists(beforeFile) && !exists(receiptFile), 'TRANSFER_BRIEF_RETAINER_FRESH_RECEIPTS');
            if (!exists(parent)) fs.mkdirSync(parent);
            assert(ordinary(parent).isDirectory(), 'TRANSFER_BRIEF_RETAINER_PARENT');
            write(preparedFile, { schema: 'TRANSFER_BRIEF_OUTPUT_OWNERSHIP_V1', ...paths, status: 'FRESH_ABSENCE_CONFIRMED',
              sourceAbsent: true, targetAbsent: true, allGuardSuccessClaimed: false });
            console.log('TransferBrief output: fixed source and target absent before the owned guards.');
          } else {
            const prepared = read(preparedFile); checkPaths(prepared);
            assert.equal(prepared.status, 'FRESH_ABSENCE_CONFIRMED');
            assert(ordinary(parent).isDirectory(), 'TRANSFER_BRIEF_RETAINER_PARENT');
            const required = flag === '--required';
            if (exists(receiptFile)) {
              const receipt = read(receiptFile); checkPaths(receipt);
              assert(!exists(source), 'TRANSFER_BRIEF_RETAINER_SOURCE_STILL_ABSENT');
              if (receipt.status === 'NOT_CREATED_BEFORE_EARLIER_FAILURE') {
                assert(!exists(target), 'TRANSFER_BRIEF_RETAINER_NO_UNOWNED_TARGET');
                assert(!required, 'TRANSFER_BRIEF_RETAINER_REQUIRED_RAW');
              } else {
                assert(['REQUIRED_RAW_DIRECTORY_RETAINED', 'RAW_DIRECTORY_RETAINED_AFTER_EARLIER_FAILURE',
                  'EMPTY_DIRECTORY_RETAINED_AFTER_EARLIER_FAILURE'].includes(receipt.status), 'TRANSFER_BRIEF_RETAINER_KNOWN_STATUS');
                assert.equal(receipt.wholeDirectoryRename, true); assert.equal(receipt.allOrdinary, true);
                assert(exists(target), 'TRANSFER_BRIEF_RETAINER_RETAINED_DIRECTORY');
                assert.deepEqual(census(target), receipt.after, 'TRANSFER_BRIEF_RETAINER_IDEMPOTENT_ALL_BYTES');
                assert.deepEqual(receipt.before, receipt.after, 'TRANSFER_BRIEF_RETAINER_RENAME_ALL_BYTES');
                if (required) requiredRaw(receipt.after);
              }
              console.log('TransferBrief output: prior receipt rechecked, no files changed.');
            } else if (!exists(source)) {
              assert(!exists(target) && !exists(beforeFile), 'TRANSFER_BRIEF_RETAINER_NO_UNOWNED_RETAINED_DIRECTORY');
              assert(!required, 'TRANSFER_BRIEF_RETAINER_REQUIRED_RAW');
              write(receiptFile, { schema: 'TRANSFER_BRIEF_OUTPUT_RETENTION_V1', ...paths,
                status: 'NOT_CREATED_BEFORE_EARLIER_FAILURE', required: false, sourceAbsent: true, targetAbsent: true,
                allGuardSuccessClaimed: false });
              console.log('TransferBrief output: not created before earlier failure; no guard success is claimed.');
            } else {
              assert(!exists(target) && !exists(beforeFile), 'TRANSFER_BRIEF_RETAINER_FRESH_TARGET');
              const before = census(source);
              if (required) requiredRaw(before);
              write(beforeFile, { schema: 'TRANSFER_BRIEF_OUTPUT_CENSUS_V1', ...paths, before });
              assert.equal(fs.statSync(source).dev, fs.statSync(parent).dev, 'TRANSFER_BRIEF_RETAINER_RENAME_FILESYSTEM');
              fs.renameSync(source, target);
              assert(!exists(source), 'TRANSFER_BRIEF_RETAINER_SOURCE_RELOCATED');
              const after = census(target);
              assert.deepEqual(after, before, 'TRANSFER_BRIEF_RETAINER_WHOLE_RENAME_BYTES');
              write(receiptFile, { schema: 'TRANSFER_BRIEF_OUTPUT_RETENTION_V1', ...paths,
                status: required ? 'REQUIRED_RAW_DIRECTORY_RETAINED' : before.files ? 'RAW_DIRECTORY_RETAINED_AFTER_EARLIER_FAILURE' : 'EMPTY_DIRECTORY_RETAINED_AFTER_EARLIER_FAILURE',
                required, before, after, wholeDirectoryRename: true, allOrdinary: true,
                sourceAbsent: true, completeRelativePathsAndBodiesHeld: true, allGuardSuccessClaimed: false });
              console.log('TransferBrief output: whole ordinary directory renamed and every body verified, ' + after.files + ' files.');
            }
          }
          TRANSFER_RETAINER
          set +e
          node "$QA_OUT/transferBriefOutputRetainer.mjs" prepare > "$QA_OUT/logs/transfer-brief-output-prepare.log" 2>&1
          native_exit=$?
          set -e
          printf '%s\n' "$native_exit" > "$QA_OUT/logs/transfer-brief-output-prepare.exit"
          cat "$QA_OUT/logs/transfer-brief-output-prepare.log"
          test "$native_exit" = 0
          test "$(git rev-parse refs/remotes/origin/main)" = "$BASE_CORE"
          test "$(git rev-parse HEAD^)" = "$PRODUCT_CORE"
          test "$(git rev-parse "$PRODUCT_CORE^{tree}")" = "$PRODUCT_TREE"
          test "$(git rev-parse "$BASE_CORE^{tree}")" = "$BASE_TREE"
          git worktree add --detach "$QA_BASE_SRC" "$BASE_CORE"
          node --input-type=module <<'BIND'
          import fs from 'node:fs';import assert from 'node:assert/strict';import {execFileSync} from 'node:child_process';
          const e=process.env,out=e.QA_OUT,git=(...a)=>execFileSync('git',a,{encoding:'utf8'}).trim();
          const expected=JSON.parse(e.PRODUCT_FILES),workflow='.github/workflows/russia-career-qualify-20261106.yml';
          const delta=git('diff-tree','--no-commit-id','--name-only','-r',e.BASE_CORE,e.PRODUCT_CORE).split('\n').filter(Boolean).sort();
          assert.deepEqual(delta,expected.map(r=>r.path).sort());
          for(const r of expected){if(r.before===null)assert.equal(git('ls-tree',e.BASE_CORE,'--',r.path),'');else assert.equal(git('rev-parse',e.BASE_CORE+':'+r.path),r.before);assert.equal(git('rev-parse',e.PRODUCT_CORE+':'+r.path),r.after);}
          const qaDelta=git('diff-tree','--no-commit-id','--name-only','-r','HEAD').split('\n').filter(Boolean);
          assert.deepEqual(qaDelta,[workflow]);
          const leaf='.tmp-fx/career-records-tests.json';assert(!fs.existsSync(leaf));fs.writeFileSync(out+'/records-leaf-owned-before.txt','absent before this owned smoke\n');
          fs.copyFileSync(workflow,out+'/workflow.yml');
          fs.copyFileSync('scripts/simRussiaCareerBridge.mjs',out+'/bridge-source.mjs');
          fs.writeFileSync(out+'/source-role.json',JSON.stringify({base:{commit:e.BASE_CORE,tree:e.BASE_TREE},product:{commit:e.PRODUCT_CORE,tree:e.PRODUCT_TREE,files:expected},qa:{commit:git('rev-parse','HEAD'),tree:git('rev-parse','HEAD^{tree}'),soleAddition:workflow},scope:'Fresh focused model qualification, original comparisons and owned syntax/model controls, proper App types, one normal build,20 output readers,3 smokes and16 unchanged route caps. No new browser or public gameplay claim.'},null,2)+'\n');
          BIND
          git ls-files -z | sort -z | xargs -0 sha256sum > "$QA_OUT/source-before.sha256"
          git ls-files --stage > "$QA_OUT/index-before.txt"
          git status --porcelain=v1 --untracked-files=all > "$QA_OUT/status-before.txt"
          sha256sum package.json package-lock.json bun.lock bun.lockb > "$QA_OUT/locks-before.sha256"
          (cd "$QA_BASE_SRC"; git ls-files -z | sort -z | xargs -0 sha256sum) > "$QA_OUT/baseline-source-before.sha256"
          (cd "$QA_BASE_SRC"; git ls-files --stage) > "$QA_OUT/baseline-index-before.txt"
          (cd "$QA_BASE_SRC"; git status --porcelain=v1 --untracked-files=all) > "$QA_OUT/baseline-status-before.txt"
          (cd "$QA_BASE_SRC"; sha256sum package.json package-lock.json bun.lock bun.lockb) > "$QA_OUT/baseline-locks-before.sha256"
          test ! -s "$QA_OUT/status-before.txt"
          test ! -s "$QA_OUT/baseline-status-before.txt"
      - name: Install held app and required build tools
        run: |
          set -euo pipefail
          test "$(bun --version)" = 1.4.4
          bun --version > "$QA_OUT/logs/bun-version.log"
          node --version > "$QA_OUT/logs/node-version.log"
          bun install --frozen-lockfile > "$QA_OUT/logs/bun-install.log" 2>&1
          node -p "JSON.stringify({router:require('react-router-dom/package.json').version,vite:require('vite/package.json').version,rollup:JSON.parse(require('fs').readFileSync('node_modules/rollup/package.json','utf8')).version})" > "$QA_OUT/logs/build-versions.json"
          git diff --exit-code HEAD -- package.json package-lock.json bun.lock bun.lockb
          npm install --prefix "$RUNNER_TEMP/russia-bridge-tools" --package-lock=false --no-audit --no-fund playwright@1.64.0 > "$QA_OUT/logs/playwright-install.log" 2>&1
          test ! -e node_modules/playwright
          test ! -e node_modules/playwright-core
          ln -s "$RUNNER_TEMP/russia-bridge-tools/node_modules/playwright" node_modules/playwright
          ln -s "$RUNNER_TEMP/russia-bridge-tools/node_modules/playwright-core" node_modules/playwright-core
          "$RUNNER_TEMP/russia-bridge-tools/node_modules/.bin/playwright" install --with-deps chromium > "$QA_OUT/logs/chromium-install.log" 2>&1
          python3 -m pip install --target "$RUNNER_TEMP/russia-bridge-python" fonttools pillow > "$QA_OUT/logs/python-install.log" 2>&1
          echo "PYTHONPATH=$RUNNER_TEMP/russia-bridge-python" >> "$GITHUB_ENV"
      - name: Share held dependencies with the immutable original
        run: |
          set -euo pipefail
          test "$(node --version)" = v24.22.2
          ln -s "$GITHUB_WORKSPACE/node_modules" "$QA_BASE_SRC/node_modules"
      - name: Proper application types
        run: |
          set -euo pipefail
          export GIT_NO_LAZY_FETCH=1
          export NODE_OPTIONS="--require=$GITHUB_WORKSPACE/scripts/lib/offlineTransport.cjs"
          : > "$QA_OUT/transport/types.log"
          set +e
          SIM_OFFLINE_RECEIPT="$QA_OUT/transport/types.log" node_modules/.bin/tsc --noEmit -p tsconfig.app.json > "$QA_OUT/logs/types.log" 2>&1
          native_exit=$?
          printf '%s\n' "$native_exit" > "$QA_OUT/types.exit" || exit 1
          test "$native_exit" = 0 || exit "$native_exit"
          test ! -s "$QA_OUT/transport/types.log" || exit 1
          set -e
          printf '%s\n' '{"command":"node_modules/.bin/tsc --noEmit -p tsconfig.app.json","exit":0}' > "$QA_OUT/types-passed.json"
          test ! -s "$QA_OUT/transport/types.log"
      - name: Focused bridge, owned faults and affected model guards
        timeout-minutes: 25
        run: |
          set -euo pipefail
          export GIT_NO_LAZY_FETCH=1
          export NODE_OPTIONS="--require=$GITHUB_WORKSPACE/scripts/lib/offlineTransport.cjs"
          export RUSSIA_BASE_ROOT="$QA_BASE_SRC"
          export RUSSIA_EVIDENCE_ROOT="$QA_OUT/bridge"
          export SIM_LEAGUE_FINISH_ARTIFACTS="$QA_OUT/model-artifacts/career-league-finish"
          export SOCCER_LOAN_MINUTES_OUT="$QA_OUT/model-artifacts/loan-minutes"
          test ! -e "$QA_OUT/fallback-read"
          mkdir -p "$QA_OUT/fallback-read"
          cat > "$QA_OUT/fallback-read/preload.cjs" <<'FALLBACK_PRELOAD'
          'use strict';
          const fs=require('node:fs'),path=require('node:path'),assert=require('node:assert/strict'),crypto=require('node:crypto');
          const nativeFetch=globalThis.fetch;
          const workspace=process.env.GITHUB_WORKSPACE,out=path.join(process.env.QA_OUT,'fallback-read');
          const client=fs.readFileSync(path.join(workspace,'src/integrations/supabase/client.ts'),'utf8');
          const origin=/SUPABASE_URL\s*=\s*["']([^"']+)["']/.exec(client)?.[1];
          assert.equal(origin,'https://flawuiqbvjobmkfkauhw.supabase.co','FALLBACK_READ_SOURCE_ORIGIN');
          const offline=require(path.join(workspace,'scripts/lib/offlineTransport.cjs')),offlineFetch=globalThis.fetch;
          const paths=new Set(['/rest/v1/career_players','/rest/v1/career_seasons']);
          const queryKeys=new Set(['select','order','offset','limit','player_name','player_id']);
          const sha=b=>crypto.createHash('sha256').update(b).digest('hex');
          function requestGuard(row){
           assert.equal(row.method,'GET','FALLBACK_READ_METHOD');
           assert.equal(row.origin,origin,'FALLBACK_READ_ORIGIN');
           assert(paths.has(row.path),'FALLBACK_READ_TABLE');
           assert.equal(row.hasBody,false,'FALLBACK_READ_BODY');
           assert.equal(row.hasDispatcher,false,'FALLBACK_READ_DISPATCHER');
           assert(row.query.every(([key])=>queryKeys.has(key)),'FALLBACK_READ_QUERY');
          }
          function responseGuard(row){
           assert(![301,302,303,307,308].includes(row.status),'FALLBACK_READ_REDIRECT');
           assert.equal(row.urlMatched,true,'FALLBACK_READ_RESPONSE_URL');
           assert([200,206].includes(row.status),'FALLBACK_READ_HTTP200_OR206');
          }
          const healthy={method:'GET',origin,path:'/rest/v1/career_players',query:[['select','id']],hasBody:false,hasDispatcher:false};
          requestGuard(healthy);responseGuard({status:200,urlMatched:true});responseGuard({status:206,urlMatched:true});
          let probeDispatches=0;
          const probes=[];
          for(const[name,patch,marker,response]of[
           ['post',{method:'POST'},'FALLBACK_READ_METHOD'],
           ['host',{origin:'https://invalid.example'},'FALLBACK_READ_ORIGIN'],
           ['table',{path:'/rest/v1/other_table'},'FALLBACK_READ_TABLE'],
           ['body',{hasBody:true},'FALLBACK_READ_BODY'],
           ['dispatcher',{hasDispatcher:true},'FALLBACK_READ_DISPATCHER'],
           ['query',{query:[['apikey','unlogged-probe']]},'FALLBACK_READ_QUERY'],
           ['redirect',{},'FALLBACK_READ_REDIRECT',{status:302,urlMatched:true}],
           ['response-url',{},'FALLBACK_READ_RESPONSE_URL',{status:200,urlMatched:false}],
           ['http-status',{},'FALLBACK_READ_HTTP200_OR206',{status:503,urlMatched:true}]
          ]){
           const before=JSON.stringify({request:healthy,response:{status:200,urlMatched:true}});
           const fault=JSON.parse(before);Object.assign(fault.request,patch);if(response)fault.response=response;
           assert.notEqual(JSON.stringify(fault),before);let error;
           try{requestGuard(fault.request);responseGuard(fault.response);probeDispatches++;}catch(found){error=found;}
           assert(error instanceof assert.AssertionError);assert(error.message.startsWith(marker));
           probes.push({name,marker,changed:true,rejected:true,networkDispatches:0});
          }
          assert.equal(probeDispatches,0);
          fs.writeFileSync(path.join(out,'probes.json'),JSON.stringify({scope:'Source-shaped data controls before the normal harness, not actual network requests',probes,networkDispatches:probeDispatches})+'\n',{flag:'wx'});
          const rows=[];let sequence=0;
          process.on('exit',nativeExit=>fs.writeFileSync(path.join(out,'summary.json'),JSON.stringify({mode:'EXACT_PUBLIC_GET_ONLY',nativeExit,requests:rows,networkWrites:0,headersRetained:false})+'\n',{flag:'wx'}));
          globalThis.fetch=async(input,options={})=>{
           const request=new Request(input,options),url=new URL(request.url);
           if(offline.isLoopback(request.url))return offlineFetch(input,options);
           const row={sequence:sequence+1,method:request.method,origin:url.origin,path:url.pathname,query:[...url.searchParams],hasBody:request.body!==null,hasDispatcher:options.dispatcher!==undefined};
           try{requestGuard(row);}catch{ return offlineFetch(input,options); }
           sequence++;rows.push(row);
           const tag=String(sequence).padStart(3,'0'),record=path.join(out,'request-'+tag+'.json'),body=path.join(out,'response-'+tag+'.json');
           row.bodyFile='response-'+tag+'.json';row.complete=false;fs.writeFileSync(body,'',{flag:'wx'});
           const save=()=>fs.writeFileSync(record,JSON.stringify(row)+'\n');
           save();
           try{
            const response=await nativeFetch(request,{redirect:'manual'});
            row.status=response.status;row.urlMatched=response.url===request.url;save();
            for await(const chunk of response.clone().body??[])fs.appendFileSync(body,chunk);
            row.complete=true;responseGuard(row);return response;
           }catch(error){row.error={name:error.name,code:error.code??null};throw error;}
           finally{const bytes=fs.readFileSync(body);row.bytes=bytes.length;row.sha256=sha(bytes);save();}
          };
          FALLBACK_PRELOAD
          run_model() {
            local name="$1"
            shift
            local receipt="$QA_OUT/transport/$name.log"
            : > "$receipt"
            set +e
            SIM_OFFLINE_RECEIPT="$receipt" "$@" > "$QA_OUT/logs/$name.log" 2>&1
