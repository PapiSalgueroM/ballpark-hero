name: Soccer intro full-history app units
on:
  push:
    branches: [codex/soccer-intro-history-units-20261027]
    paths: [.github/workflows/soccer-intro-app-units.yml]
permissions:
  contents: read
concurrency:
  group: soccer-intro-history-app-units-${{ github.ref }}
  cancel-in-progress: false
jobs:
  application-units:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CI: '1'
      SIM_NETWORK: offline
      OUT: ${{ github.workspace }}/soccer-intro-history-units
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Pin exact application bodies and original historical fixtures
        run: |
          set -euo pipefail
          mkdir -p "$OUT/baselines"
          git rev-parse HEAD > "$OUT/source-head.txt"
          git rev-parse HEAD^{tree} > "$OUT/source-tree.txt"
          git ls-files -z -- src scripts .github/workflows index.html package.json package-lock.json | sort -z | xargs -0 sha256sum > "$OUT/source-before.sha256"
          sha256sum -c - <<'PINS'
          3d3d29e8fdc7f4d445dbe8b5ea6a6ff2e3e384c53ed2b636b95dd67c0ad8bb59  src/data/gameContent/soccer2.ts
          412b80ff4e5a5fd79c25fea8f6bef2d5b6cc393dbc80456b3f3340444a15e147  src/data/gameContent/types.ts
          23230e28533360d9b0661a6e47c88e63639fed624727ad87e3d5f34210d84212  src/components/seo/GameSeoContent.tsx
          PINS
          while read -r revision file; do
            target="$OUT/baselines/$revision/$file"
            mkdir -p "$(dirname "$target")"
            git rev-parse --verify "$revision^{commit}" >> "$OUT/baseline-commits.txt"
            git show "$revision:$file" > "$target"
            git rev-parse "$revision:$file" >> "$OUT/baseline-blobs.txt"
            sha256sum "$target" >> "$OUT/baseline-bodies.sha256"
          done <<'BASELINES'
          2b7dda2951fb9b63e76a2af66970cb682f312105 src/lib/cageClash.ts
          31a4ec01 src/lib/cageClash.ts
          56356be9 src/lib/frontOffice.ts
          56356be9 src/data/frontOfficePlayers.ts
          56356be9 src/data/frontOfficeDepth.ts
          e8b39ccc src/lib/nbaFrontOffice.ts
          e8b39ccc src/lib/nbaSeasonStats.ts
          e8b39ccc src/lib/nbaRotation.ts
          e8b39ccc src/data/conquestDataNba.ts
          6b7596d2 src/lib/nhlFrontOffice.ts
          6b7596d2 src/data/nhlFoPlayers.ts
          BASELINES
          npm ci
      - name: Correct types and complete current application suite
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee "$OUT/types.log"
          npm test -- --reporter=default --reporter=json --outputFile="$OUT/unit.json" --maxWorkers=2 --no-file-parallelism 2>&1 | tee "$OUT/unit.log"
      - name: Always verify tracked source holds
        if: always()
        run: |
          set -euo pipefail
          if test -f "$OUT/source-before.sha256"; then
            sha256sum -c "$OUT/source-before.sha256" > "$OUT/source-held.log"
          fi
          git diff --exit-code HEAD -- src scripts .github/workflows index.html package.json package-lock.json
      - name: Always preserve original observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soccer-intro-full-history-units-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          path: soccer-intro-history-units/
