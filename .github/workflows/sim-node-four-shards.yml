          ONLY="$(cat "$out/only.txt")" SIM_NETWORK=offline SIM_FULL_OUTPUT=1 SIM_RUNNER_PROGRESS=1 SIM_RUNNER_ARTIFACTS="$out/capture" SIM_LEAGUE_FINISH_ARTIFACTS="$out/writers/league" SIM_WALL_SHOT_REPORT="$out/writers/wall.json" NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$out/runner.transport" timeout --signal=TERM --kill-after=30s 78m node scripts/runAllSims.mjs > "$streams/stdout" 2> "$streams/stderr" || status=$?
          printf '%s\n' "$status" > "$out/runner.exit"
