name: Four node shards, original runner outcomes
on:
  push:
    branches: [codex/sim-node-four-shards-20261024]
    paths: [.github/workflows/sim-node-four-shards.yml, scripts/runAllSims.mjs, scripts/simReportedGamePools.mjs, scripts/simSoccerCareerOpponents.mjs, scripts/simSoccerCareerRecords.mjs, scripts/simSoccerCompetitionNavigation.mjs, scripts/simSoccerDiscipline.mjs, scripts/simSoccerSeasonAvailability.mjs, scripts/simTrophyCabinet.mjs]
permissions:
  contents: read
env:
  EXPECTED_PARENT: e304ef0ec8a04e2b53a25da54f0fc5132521f69b
  EXPECTED_PARENT_TREE: 04dd4ae2042adc5dcc28692f5a14eb8a6216d39e
  NODE_SHARD_SPEC_SHA256: 1cf16e1906ec5a9585c4aac62624171dcc49382e0c86aac59632d6a250692f94
  NODE_SHARD_HELPER_SHA256: 9172c2987ddd8bf1022460a73f75d89dbeb4251db30871093b6f4ea9ac93085e
  ENGINES: chromium
  # Payloads are source-bound data, decoded outside the checkout in each job.
  NODE_SHARD_SPEC_GZIP_BASE64: 
  NODE_SHARD_HELPER_BASE64: 
  NODE_WRITER_HELPER_SHA256: 5929221174d2320d3e48a6198294e1ba3c1267c84e8994b29e4131b941a51b1d
  NODE_WRITER_SPEC_SHA256: de6e69eb61515fee7a92d0ea5b967cedd145fcb4f63186280e716421f2c79f91
  NODE_WRITER_TAR_SHA256: 4ccb15621f4e87b2e3f35c129ef0dfa922e81c8e2c04851c544049cd36654776
  NODE_WRITER_HELPER_BASE64: 
  NODE_WRITER_SPEC_BASE64: 
  NODE_WRITER_TAR_BASE64: 
jobs:
  node_shards:
    runs-on: ubuntu-latest
    timeout-minutes: 160
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    env:
      NODE_SHARD_INDEX: ${{ matrix.shard }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact nine-path writer preservation child and full history
        id: foundation
        timeout-minutes: 5
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/node-shards-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$NODE_SHARD_INDEX";test ! -e "$out";mkdir "$out"
          export NODE_SHARD_OUT="$out" NODE_SHARD_SPEC="$out/shard-spec.json"
          export NODE_WRITER_ROOT="$RUNNER_TEMP/node-shard-writers-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$NODE_SHARD_INDEX"
          printf 'NODE_WRITER_ROOT=%s\n' "$NODE_WRITER_ROOT" >> "$GITHUB_ENV"
          printf 'NODE_SHARD_OUT=%s\nNODE_SHARD_SPEC=%s\n' "$NODE_SHARD_OUT" "$NODE_SHARD_SPEC" >> "$GITHUB_ENV"
          test -z "${NODE_OPTIONS:-}"
          test "$GITHUB_REPOSITORY" = PapiSalgueroM/ballpark-hero
          test "$GITHUB_REPOSITORY_ID" = 1195729679
          test "$GITHUB_REF" = refs/heads/codex/sim-node-four-shards-20261024
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git show -s --format=%P HEAD)" = "$EXPECTED_PARENT"
          test "$(git rev-parse "$EXPECTED_PARENT^{tree}")" = "$EXPECTED_PARENT_TREE"
          git diff --name-status "$EXPECTED_PARENT" HEAD > "$out/direct-paths.txt"
          printf 'M\t.github/workflows/sim-node-four-shards.yml\nM\tscripts/runAllSims.mjs\nM\tscripts/simReportedGamePools.mjs\nM\tscripts/simSoccerCareerOpponents.mjs\nM\tscripts/simSoccerCareerRecords.mjs\nM\tscripts/simSoccerCompetitionNavigation.mjs\nM\tscripts/simSoccerDiscipline.mjs\nM\tscripts/simSoccerSeasonAvailability.mjs\nM\tscripts/simTrophyCabinet.mjs\n' | cmp - "$out/direct-paths.txt"
          git diff --exit-code "$EXPECTED_PARENT" HEAD -- . ':!.github/workflows/sim-node-four-shards.yml' ':!scripts/runAllSims.mjs' ':!scripts/simReportedGamePools.mjs' ':!scripts/simSoccerCareerOpponents.mjs' ':!scripts/simSoccerCareerRecords.mjs' ':!scripts/simSoccerCompetitionNavigation.mjs' ':!scripts/simSoccerDiscipline.mjs' ':!scripts/simSoccerSeasonAvailability.mjs' ':!scripts/simTrophyCabinet.mjs' > "$out/all-other-parent-sources-held.log"
          source_base=9c7d4f15605b115ca4c7a118fa955ae78a00e6dd
          test "$(git rev-parse "$source_base^{tree}")" = 26f6bf55a43dd359354ee0b53826cc7a0b1f168c
          git diff --name-status "$source_base" HEAD > "$out/cumulative-paths.txt"
          printf 'A\t.github/workflows/sim-node-four-shards.yml\nM\tscripts/runAllSims.mjs\nM\tscripts/simReportedGamePools.mjs\nM\tscripts/simSoccerCareerOpponents.mjs\nM\tscripts/simSoccerCareerRecords.mjs\nM\tscripts/simSoccerCompetitionNavigation.mjs\nM\tscripts/simSoccerDiscipline.mjs\nM\tscripts/simSoccerSeasonAvailability.mjs\nM\tscripts/simTrophyCabinet.mjs\n' | cmp - "$out/cumulative-paths.txt"
          git diff --exit-code "$source_base" HEAD -- . ':!.github/workflows/sim-node-four-shards.yml' ':!scripts/runAllSims.mjs' ':!scripts/simReportedGamePools.mjs' ':!scripts/simSoccerCareerOpponents.mjs' ':!scripts/simSoccerCareerRecords.mjs' ':!scripts/simSoccerCompetitionNavigation.mjs' ':!scripts/simSoccerDiscipline.mjs' ':!scripts/simSoccerSeasonAvailability.mjs' ':!scripts/simTrophyCabinet.mjs' > "$out/all-other-base-sources-held.log"
          test "$(git rev-parse "$EXPECTED_PARENT:scripts/runAllSims.mjs")" = 8f1aacf5f43f99b7ce4a1ab1766dc4ea62ab1680
          test "$(git rev-parse "$source_base:scripts/runAllSims.mjs")" = 37f1869f39906c0129473f609fbaee55957171aa
          test "$(git rev-parse "$EXPECTED_PARENT:.github/workflows/sim-node-four-shards.yml")" = 015809815f3069418ea7a62d97479ae1c46f1a2e
          test -z "$(git ls-tree "$source_base" .github/workflows/sim-node-four-shards.yml)"
          test "$(git rev-parse "$EXPECTED_PARENT:scripts/simSoccerCareerRecords.mjs")" = d8d20dc8fed3de3d759f7d8a44d8c74610e2e771
          test "$(git rev-parse "$EXPECTED_PARENT:scripts/simSoccerCompetitionNavigation.mjs")" = 02e65984eed51eba740586633d069ae57153d115
          test "$(git rev-parse "$EXPECTED_PARENT:scripts/simSoccerCareerOpponents.mjs")" = 74672cf8cf5037e04c76450e60ac0f1bcbb60eb3
          test "$(git rev-parse "$EXPECTED_PARENT:scripts/simReportedGamePools.mjs")" = 3fc3c753d263da73802c615b9facd8b38ea3115a
          test "$(git rev-parse "$EXPECTED_PARENT:scripts/simSoccerSeasonAvailability.mjs")" = 68a8570a03723850c8112288fa46d9ab248d72bf
          test "$(git rev-parse "$EXPECTED_PARENT:scripts/simSoccerDiscipline.mjs")" = d1f29866362191525f5e26ea81feccd63e3d3c8b
          test "$(git rev-parse "$EXPECTED_PARENT:scripts/simTrophyCabinet.mjs")" = 83495cd7a77d76dd6c586853dd175aafbf360ffe

          printf '%s' "$NODE_SHARD_SPEC_GZIP_BASE64" | base64 --decode | gzip --decompress > "$NODE_SHARD_SPEC"
          printf '%s' "$NODE_SHARD_HELPER_BASE64" | base64 --decode > "$out/shard-inspector.cjs"
          printf '%s  %s\n' "$NODE_SHARD_SPEC_SHA256" "$NODE_SHARD_SPEC" > "$out/generated-spec.sha256"
          printf '%s  %s\n' "$NODE_SHARD_HELPER_SHA256" "$out/shard-inspector.cjs" > "$out/generated-helper.sha256"
          sha256sum --check "$out/generated-spec.sha256" > "$out/generated-spec.before.log"
          sha256sum --check "$out/generated-helper.sha256" > "$out/generated-helper.before.log"
          printf 'NODE_SHARD_SPEC_GZIP_BASE64=\nNODE_SHARD_HELPER_BASE64=\n' >> "$GITHUB_ENV"
          printf '%s' "$NODE_WRITER_HELPER_BASE64" | base64 --decode > "$out/writer-preserver.cjs"
          printf '%s' "$NODE_WRITER_SPEC_BASE64" | base64 --decode > "$out/writer-spec.json"
          printf '%s' "$NODE_WRITER_TAR_BASE64" | base64 --decode > "$out/writer-tar-inspector.py"
          printf '%s  %s\n' "$NODE_WRITER_HELPER_SHA256" "$out/writer-preserver.cjs" > "$out/generated-writer-helper.sha256"
          printf '%s  %s\n' "$NODE_WRITER_SPEC_SHA256" "$out/writer-spec.json" > "$out/generated-writer-spec.sha256"
          printf '%s  %s\n' "$NODE_WRITER_TAR_SHA256" "$out/writer-tar-inspector.py" > "$out/generated-writer-tar.sha256"
          sha256sum --check "$out/generated-writer-helper.sha256" > "$out/generated-writer-helper.before.log"
          sha256sum --check "$out/generated-writer-spec.sha256" > "$out/generated-writer-spec.before.log"
          sha256sum --check "$out/generated-writer-tar.sha256" > "$out/generated-writer-tar.before.log"
          printf 'NODE_WRITER_HELPER_BASE64=\nNODE_WRITER_SPEC_BASE64=\nNODE_WRITER_TAR_BASE64=\n' >> "$GITHUB_ENV"
          printf '%s\n' "$GITHUB_SHA" > "$out/head.txt";git rev-parse 'HEAD^{tree}' > "$out/tree.txt"
          printf '%s\n' "$GITHUB_RUN_ID" > "$out/run-id.txt";printf '%s\n' "$GITHUB_RUN_ATTEMPT" > "$out/run-attempt.txt"
          git ls-files -z | sort -z > "$out/source-members.before"
          git ls-files -z | sort -z | xargs -0 sha256sum > "$out/source-before.sha256"
          git diff --exit-code HEAD > "$out/source-clean-before.log"
          test -z "$(git status --porcelain --untracked-files=all)"
          printf '%s  %s\n' e60ff1534307e449ccef598e3b7470dcba58681b82cea4005cec7319f14f9221 scripts/lib/offlineTransport.cjs | sha256sum --check > "$out/original-guard.before.log"
          : > "$out/foundation.transport"
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$out/foundation.transport" node <<'NODE' > "$out/foundation.log" 2>&1
          const fs=require('node:fs'),cp=require('node:child_process'),a=require('node:assert/strict'),{createHash}=require('node:crypto'),out=process.env.NODE_SHARD_OUT;
          const hash=b=>createHash('sha256').update(b).digest('hex'),spec=JSON.parse(fs.readFileSync(process.env.NODE_SHARD_SPEC)),names=cp.execFileSync('git',['ls-files','-z']).toString().split('\0').filter(Boolean);
          a.equal(names.length,5341,'SHARD_COMPLETE_SOURCE_COUNT');
          for(const key of ['ONLY','BROWSER','SIM_NETWORK','SIM_FULL_OUTPUT','SIM_RUNNER_PROGRESS','SIM_RUNNER_ARTIFACTS','SIM_LEAGUE_FINISH_ARTIFACTS','SIM_WALL_SHOT_REPORT','SIM_LEAGUE_FINISH_CONTROL','SIM_LEAGUE_FINISH_ATTRIBUTION','NO_DOUBLE_SWAP','US_BOARD_CONTROL_ALIAS','US_BOARD_CONTROL_FILE'])a(!process.env[key],'SHARD_NO_INHERITED_CONTROL_'+key);
          const refs=['4ab80fa978cf362427bcd024c64c6691e7f83c2a','de39ef18d2187ca98ccc57d4ef7ebc33c0f6bd6a','4ae7a534'];
          const history=refs.map(ref=>{const r=cp.spawnSync('git',['rev-parse','--verify',ref+'^{commit}'],{encoding:'utf8'});a.equal(r.status,0,'SHARD_FULL_HISTORY_PREREQUISITE');a.equal(r.signal,null);a(!r.error);return {requested:ref,status:r.status,commit:r.stdout.trim(),stderr:r.stderr};});
          fs.writeFileSync(out+'/history-probes.json',JSON.stringify(history,null,2)+'\n',{flag:'wx'});
          a.equal(hash(fs.readFileSync('scripts/runAllSims.mjs')),spec.runner.sha256,'SHARD_QUALIFIED_RUNNER');
          const workflow='.github/workflows/sim-node-four-shards.yml';a.equal(cp.execFileSync('git',['hash-object',workflow],{encoding:'utf8'}).trim(),cp.execFileSync('git',['rev-parse','HEAD:'+workflow],{encoding:'utf8'}).trim());
          NODE
          test -f "$out/foundation.transport";test ! -s "$out/foundation.transport"
      - name: Qualified locked dependencies, isolated tools, Python and font cache
        id: install
        timeout-minutes: 12
        run: |
          set -euo pipefail
          out="$NODE_SHARD_OUT"
          printf '%s npm-ci\n' "$(date -u +%FT%TZ)" > "$out/setup-progress.log"
          npm ci > "$out/install.log" 2>&1
          browser_tools="$RUNNER_TEMP/node-shard-browser-tools";test ! -e "$browser_tools"
          npm install --prefix "$browser_tools" --no-save --package-lock=false playwright@1.64.0 > "$out/browser-install.log" 2>&1
          test ! -e node_modules/playwright;test ! -e node_modules/playwright-core
          ln -s "$browser_tools/node_modules/playwright" node_modules/playwright
          ln -s "$browser_tools/node_modules/playwright-core" node_modules/playwright-core
          for link in playwright playwright-core;do readlink -f "node_modules/$link";done > "$out/browser-links.before"
          node "$browser_tools/node_modules/playwright/cli.js" install --with-deps chromium > "$out/chromium-install.log" 2>&1
          node "$browser_tools/node_modules/playwright/cli.js" --version > "$out/playwright-version.txt"
          python -m pip install fonttools pillow > "$out/python-install.log" 2>&1
          python -VV > "$out/python-version.txt";python -m pip freeze --all > "$out/python-packages.before"
          FREE_KICK_FONT_CACHE="$out/font-cache" node scripts/qa/freeKickLab1070.mjs --prefetch-fonts-only > "$out/font-prefetch.log" 2>&1
          manifest_sha=$(sha256sum "$out/font-cache/manifest.json" | cut -d ' ' -f 1)
          echo "FONT_CACHE_MANIFEST_SHA256=$manifest_sha" >> "$GITHUB_ENV"
          echo "FREE_KICK_FONT_CACHE=$out/font-cache" >> "$GITHUB_ENV"
          find node_modules -path node_modules/.vite -prune -o -type f -print0 | sort -z | xargs -0 sha256sum > "$out/dependencies.sha256"
          find node_modules -path node_modules/.vite -prune -o -type f -print0 | sort -z > "$out/dependency-members.before"
          test "$(tr -cd '\0' < "$out/dependency-members.before" | wc -c)" -eq 24466
          find "$browser_tools/node_modules" -type f -print0 | sort -z | xargs -0 sha256sum > "$out/browser-tools.sha256"
          find "$browser_tools/node_modules" -type f -print0 | sort -z > "$out/browser-members.before"
          find "$out/font-cache" -type f -print0 | sort -z | xargs -0 sha256sum > "$out/font-cache.sha256"
          find "$out/font-cache" -type f -print0 | sort -z > "$out/font-members.before"
          printf '%s ready\n' "$(date -u +%FT%TZ)" >> "$out/setup-progress.log"
      - name: One completed production build before node harnesses
        id: build
        timeout-minutes: 15
        run: |
          set -euo pipefail
          out="$NODE_SHARD_OUT";: > "$out/build.transport";status=0
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$out/build.transport" npm run build > "$out/build.log" 2>&1 || status=$?
          printf '%s\n' "$status" > "$out/build.exit"
          test "$status" -eq 0;test -f "$out/build.transport";test ! -s "$out/build.transport"
          find dist ! -type d ! -type f -print > "$out/dist-nonregular.before";test ! -s "$out/dist-nonregular.before"
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > "$out/dist.sha256"
          find dist -type f -print0 | sort -z > "$out/dist-members.before"
          tar -cf "$out/dist.tar" -C dist .
      - name: Bind actual shard and preserve default writer locations
        id: prepare
        timeout-minutes: 2
        run: |
          set -euo pipefail
          out="$NODE_SHARD_OUT";: > "$out/prepare.transport"
          sha256sum --check "$out/generated-helper.sha256";sha256sum --check "$out/generated-spec.sha256"
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$out/prepare.transport" node "$out/shard-inspector.cjs" prepare > "$out/prepare.log" 2>&1
          test -f "$out/prepare.transport";test ! -s "$out/prepare.transport"
          : > "$out/writer-prepare.transport";writer_status=0
          sha256sum --check "$out/generated-writer-helper.sha256";sha256sum --check "$out/generated-writer-spec.sha256";sha256sum --check "$out/generated-writer-tar.sha256"
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$out/writer-prepare.transport" node "$out/writer-preserver.cjs" prepare > "$out/writer-prepare.log" 2>&1 || writer_status=$?
          printf '%s\n' "$writer_status" > "$out/writer-prepare.exit"
          test -f "$out/writer-prepare.transport";test ! -s "$out/writer-prepare.transport";test "$writer_status" -eq 0
          cat "$out/writer-env.txt" >> "$GITHUB_ENV"
      - name: Actual unscoped discovery and exact ONLY plan, no capture side effect
        id: plans
        timeout-minutes: 5
        run: |
          set -euo pipefail
          out="$NODE_SHARD_OUT";status=0;: > "$out/full-plan.transport"
          SIM_NETWORK=offline SIM_RUNNER_ARTIFACTS="$out/plan-must-stay-absent" NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$out/full-plan.transport" timeout --signal=TERM --kill-after=30s 1m node scripts/runAllSims.mjs --plan-json > "$out/full-plan.json" 2> "$out/full-plan.stderr.log" || status=$?
          printf '%s\n' "$status" > "$out/full-plan.exit";test "$status" -eq 0
          status=0;: > "$out/shard-plan.transport"
          ONLY="$(cat "$out/only.txt")" SIM_NETWORK=offline SIM_RUNNER_ARTIFACTS="$out/plan-must-stay-absent" NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$out/shard-plan.transport" timeout --signal=TERM --kill-after=30s 1m node scripts/runAllSims.mjs --plan-json > "$out/shard-plan.json" 2> "$out/shard-plan.stderr.log" || status=$?
          printf '%s\n' "$status" > "$out/shard-plan.exit";test "$status" -eq 0
          : > "$out/plans.transport";sha256sum --check "$out/generated-helper.sha256";sha256sum --check "$out/generated-spec.sha256"
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$out/plans.transport" node "$out/shard-inspector.cjs" plans > "$out/plans.log" 2>&1
          for name in full-plan shard-plan plans;do test -f "$out/$name.transport";test ! -s "$out/$name.transport";done
      - name: Original scoped runner, original pool and 78-minute bound
        id: suite
        timeout-minutes: 80
        run: |
          set -euo pipefail
          out="$NODE_SHARD_OUT";streams="$RUNNER_TEMP/node-shard-${{ matrix.shard }}-streams";test ! -e "$streams";mkdir "$streams"
          mkfifo "$streams/stdout" "$streams/stderr"
