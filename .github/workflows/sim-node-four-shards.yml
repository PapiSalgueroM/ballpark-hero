          fs.writeFileSync(out+'/final-aggregate-preservation.json',JSON.stringify({status:'ALL_FOUR_ORIGINALS_NATIVE_ROWS_AND_PHYSICAL_JUDGE_CONTROLS_QUALIFIED',source:b.source,result,actualControls:controls.controls.length,childFaultExecutionCredit:0,browserOrCapsQualified:false},null,2)+'\n',{flag:'wx'});
          NODE
          test -f "$out/holds.transport";test ! -s "$out/holds.transport"
          sha256sum --check "$out/generated-helper.sha256" > "$out/generated-helper.final.log";sha256sum --check "$out/generated-spec.sha256" > "$out/generated-spec.final.log"
          sha256sum --check "$out/generated-writer-helper.sha256" > "$out/generated-writer-helper.final.log"
          sha256sum --check "$out/generated-writer-spec.sha256" > "$out/generated-writer-spec.final.log"
          sha256sum --check "$out/generated-writer-tar.sha256" > "$out/generated-writer-tar.final.log"
      - name: Always keep aggregate stage states and the full artifact index
        if: ${{ always() }}
        run: |
          set -euo pipefail
          out="$NODE_SHARD_OUT";test -d "$out"
          printf '%s\n' 'foundation=${{ steps.foundation.outcome }}' 'aggregate=${{ steps.aggregate.outcome }}' 'controls=${{ steps.controls.outcome }}' 'holds=${{ steps.holds.outcome }}' > "$out/stage-outcomes.txt"
          printf '%s\n' 'writer-aggregate=${{ steps.writer_aggregate.outcome }}' > "$out/writer-stage-outcomes.txt"
          cd "$out";find . -type f ! -name evidence.sha256 -print0 | sort -z | xargs -0 sha256sum > evidence.sha256
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: node-shard-aggregate
          path: ${{ env.NODE_SHARD_OUT }}
          if-no-files-found: error
          retention-days: 14
