          const retained={status:r.success,total:r.numTotalTests,passed:r.numPassedTests,failed:r.numFailedTests,pending:r.numPendingTests,todo:r.numTodoTests,exit,named:results.map(row=>({name:row.fullName,status:row.status})),observationIds:observations.map(row=>row.id),files:['vitest.json','exit.json','observations.json','stdout.log','stderr.log'].map(file=>({file,bytes:fs.statSync(root+file).size,sha256:hash(root+file)})),qualification:'Independent validation of the separate component test process already executed by the actual method with its genuine fixtures. No duplicate test execution.'};fs.writeFileSync('career-award-generations-artifacts/component-test-verification.json',JSON.stringify(retained,null,2));
