        run: |
          npm ci
          DEPENDENCY_OUT=career-award-generations-artifacts/dependencies-before.json node career-award-generations-artifacts/helpers/dependencies.mjs
          npm install --no-save playwright@1.64.0
          npx playwright install --with-deps chromium
          python -m pip install fonttools pillow
          sha256sum package.json package-lock.json > career-award-generations-artifacts/packages-after-setup.txt
          cmp career-award-generations-artifacts/packages-before.txt career-award-generations-artifacts/packages-after-setup.txt
          DEPENDENCY_OUT=career-award-generations-artifacts/dependencies-after-setup.json node career-award-generations-artifacts/helpers/dependencies.mjs
          cmp career-award-generations-artifacts/dependencies-before.json career-award-generations-artifacts/dependencies-after-setup.json
          node --input-type=module - <<'JS'
          import fs from 'node:fs';import assert from 'node:assert/strict';assert.equal(JSON.parse(fs.readFileSync('node_modules/playwright/package.json','utf8')).version,'1.64.0');console.log('PASS existing pinned Playwright 1.64.0');
          JS
      - name: Actual app type gate
        run: NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee career-award-generations-artifacts/types.log
      - name: Full production SEO build
        id: build
        run: NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" npm run build:seo 2>&1 | tee career-award-generations-artifacts/build.log
      - name: Complete build output retention
        if: ${{ !cancelled() }}
        run: |
          node career-award-generations-artifacts/helpers/generated.mjs
          git diff --binary HEAD -- public scripts/data/lastmod.json > career-award-generations-artifacts/generated-public.patch
          tar -czf career-award-generations-artifacts/generated-public-and-lastmod.tar.gz public scripts/data/lastmod.json
          if [ -d dist ]; then tar -czf career-award-generations-artifacts/dist.tar.gz dist; fi
          sha256sum career-award-generations-artifacts/*.tar.gz > career-award-generations-artifacts/generated-archive-sha256.txt
          git diff --exit-code HEAD -- . ':!public/**' ':!scripts/data/lastmod.json' > career-award-generations-artifacts/post-build-source-held.log
      - name: Actual lifecycle careers source controls and component execution
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          failed=0
          AWARD_RUNNER_DIR=career-award-generations-artifacts/method-runner SOCCER_AWARD_GENERATIONS_OUT=career-award-generations-artifacts/proof ONLY=simSoccerAwardGenerations NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node career-award-generations-artifacts/helpers/observe-runner.mjs --browser 2>&1 | tee career-award-generations-artifacts/award-generations.log || failed=1
