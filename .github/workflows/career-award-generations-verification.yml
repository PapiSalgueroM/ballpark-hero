          AWARD_RUNNER_DIR=career-award-generations-artifacts/method-runner node career-award-generations-artifacts/helpers/check-runner.mjs || failed=1
          node --input-type=module - <<'JS' || failed=1
          import fs from 'node:fs';import assert from 'node:assert/strict';import {execFileSync} from 'node:child_process';
          const r=JSON.parse(fs.readFileSync('career-award-generations-artifacts/proof/report.json','utf8'));assert.equal(r.status,'pass');assert.equal(r.head,execFileSync('git',['rev-parse','HEAD']).toString().trim());assert.equal(r.tree,execFileSync('git',['rev-parse','HEAD^{tree}']).toString().trim());assert.equal(r.base,'aa564f16019b9e821981d5c4e3e0262312c73b62');
          const ids=[2010,2025].flatMap(year=>['ST','CM','GK'].flatMap(position=>Array.from({length:8},(_,index)=>year+'-'+position+'-'+(index+1))));assert.deepEqual(r.population.map(row=>row.id),ids);assert.deepEqual(Object.keys(r.natural),['original-plain','original-observed','current-plain','current-observed']);for(const rows of Object.values(r.natural))assert.deepEqual(rows.map(row=>row.descriptor.id),ids);
          assert.deepEqual(r.controls.map(row=>row.id),['new-profile-tuple-alias','wrong-goal-tuple-accepted','frozen-age','missing-retirement','retired-slot-reuse','filler-reroll','previous-pool-mutation','extra-generated-draw','malformed-pool-accepted']);assert.deepEqual(r.observationControls.map(row=>row.id),['retired-name-collision','old-pending-ballot-changed','raw-invalid-save-overwritten']);
          const text=fs.readFileSync('career-award-generations-artifacts/method-runner/children/0000-simSoccerAwardGenerations.mjs.stdout.log','utf8');assert(text.split('\n').includes('PASS simSoccerAwardGenerations: saved generated identities, aging, turnover and raw recovery'));
