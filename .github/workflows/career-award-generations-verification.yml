name: Career award generations verification
on:
  push:
    branches: [codex/career-award-generations]
permissions:
  contents: read
concurrency:
  group: career-award-generations-${{ github.sha }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      SIM_NETWORK: offline
      ENGINES: chromium
      TZ: UTC
      SEO_SPLIT_BASE_REF: HEAD
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Complete exact current and baseline source archives
        run: |
          mkdir -p career-award-generations-artifacts/helpers
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git rev-parse 'aa564f16019b9e821981d5c4e3e0262312c73b62^{tree}')" = e3e5332ddf95b79802c82487a03df3c0aca32e75
          git diff --name-status aa564f16019b9e821981d5c4e3e0262312c73b62 HEAD > career-award-generations-artifacts/changed-source.txt
          node --input-type=module - <<'JS'
          import fs from 'node:fs';import assert from 'node:assert/strict';import {execFileSync} from 'node:child_process';
          const base='aa564f16019b9e821981d5c4e3e0262312c73b62',allowed=['src/lib/soccerCareerEngine.ts','src/lib/soccerCareerSave.ts','scripts/lib/careerAwardsNight1172.mjs','scripts/simSoccerAwardGenerations.mjs','scripts/lib/awardProofStorage.mjs','src/test/soccerCareerAwardGenerations.test.tsx','.github/workflows/career-award-generations-verification.yml','docs/ROUND1280-1282.md','docs/PROJECT-STATE.md','docs/WORKBOARD.md'],changed=execFileSync('git',['diff','--name-only','-z',base,'HEAD']).toString().split('\0').filter(Boolean);
          fs.writeFileSync('career-award-generations-artifacts/source-scope.json',JSON.stringify({base,allowed,changed},null,2));for(const file of changed)assert(allowed.includes(file),'undeclared change '+file);
          for(const file of ['package.json','package-lock.json','scripts/runAllSims.mjs','scripts/lib/offlineTransport.cjs','src/test/soccerCareerSaveRecovery.test.tsx',...['simBallonDorFairness','simCareerAwardsNight','simBallonDorTruth','simCareerEras','simSoccerCareerSaveRetry','simSoccerCareerSaveRecovery'].map(name=>'scripts/'+name+'.mjs')])assert.equal(execFileSync('git',['rev-parse','HEAD:'+file]).toString(),execFileSync('git',['rev-parse',base+':'+file]).toString(),file+' complete baseline hold');
          for(const file of allowed.slice(0,7))assert(execFileSync('git',['cat-file','-s','HEAD:'+file]).toString().trim()>0,file+' committed source is nonempty');
          JS
          git rev-parse HEAD > career-award-generations-artifacts/source-head.txt
          git rev-parse 'HEAD^{tree}' > career-award-generations-artifacts/source-tree.txt
          git -c core.autocrlf=false archive --format=zip --output=career-award-generations-artifacts/source.zip HEAD
          git ls-tree -r HEAD > career-award-generations-artifacts/source-inventory.txt
          git -c core.autocrlf=false archive --format=zip --output=career-award-generations-artifacts/base-source.zip aa564f16019b9e821981d5c4e3e0262312c73b62
          git ls-tree -r aa564f16019b9e821981d5c4e3e0262312c73b62 > career-award-generations-artifacts/base-source-inventory.txt
          sha256sum career-award-generations-artifacts/source.zip career-award-generations-artifacts/base-source.zip > career-award-generations-artifacts/source-archive-sha256.txt
          sha256sum package.json package-lock.json > career-award-generations-artifacts/packages-before.txt
          cat > career-award-generations-artifacts/helpers/dependencies.mjs <<'JS'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const lock=JSON.parse(fs.readFileSync('package-lock.json','utf8')),installed=[],omitted=[];
          const fits=(rules,value)=>!rules||(!rules.some(x=>x==='!'+value)&&(rules.every(x=>x.startsWith('!'))||rules.includes(value)));
          for(const [directory,expected]of Object.entries(lock.packages)){
           if(!directory.startsWith('node_modules/')||!expected.version)continue;
           const name=expected.name??directory.split('node_modules/').at(-1),file=directory+'/package.json';
           if(!fs.existsSync(file)){assert.equal(expected.optional,true,directory+' required dependency missing');assert((expected.os&&!fits(expected.os,process.platform))||(expected.cpu&&!fits(expected.cpu,process.arch)),directory+' omission requires an actual OS or CPU reason');omitted.push({directory,name,version:expected.version,optional:true,os:expected.os??null,cpu:expected.cpu??null});continue;}
           const actual=JSON.parse(fs.readFileSync(file,'utf8'));assert.equal(actual.name,name,directory+' locked name');assert.equal(actual.version,expected.version,directory);installed.push({directory,name:actual.name,version:actual.version});
          }
          fs.writeFileSync(process.env.DEPENDENCY_OUT,JSON.stringify({platform:process.platform,arch:process.arch,installed,omitted},null,2));assert.equal(installed.length,521);assert.equal(omitted.length,78);assert.equal(installed.length+omitted.length,599);
          console.log('PASS complete locked census: 521 installed and 78 platform-qualified optional omissions');
          JS
          cat > career-award-generations-artifacts/helpers/observe-runner.mjs <<'JS'
          import fs from 'node:fs';import path from 'node:path';import cp from 'node:child_process';import {syncBuiltinESMExports} from 'node:module';import {pathToFileURL} from 'node:url';import {createHash} from 'node:crypto';
          const out=path.resolve(process.env.AWARD_RUNNER_DIR),names=fs.readdirSync('scripts').filter(x=>/^(sim|play|sweep)[A-Za-z0-9]*\.mjs$/.test(x)&&x!=='runAllSims.mjs').sort(),selected=(process.env.ONLY||'').split(',').filter(Boolean),expected=selected.length?names.filter(x=>selected.includes(x.replace(/\.mjs$/,''))):names;
          const hash=b=>createHash('sha256').update(b).digest('hex'),nativeSpawn=cp.spawn,children=[];fs.mkdirSync(path.join(out,'children'),{recursive:true});
          const discovery=names.map(file=>({file,bytes:fs.statSync('scripts/'+file).size,sha256:hash(fs.readFileSync('scripts/'+file))}));fs.writeFileSync(path.join(out,'discovery.json'),JSON.stringify({network:process.env.SIM_NETWORK,browser:process.argv.includes('--browser'),selected,expected,discovery,runnerSha256:hash(fs.readFileSync('scripts/runAllSims.mjs'))},null,2));
          cp.spawn=function(command,args,options){
           const child=nativeSpawn.call(this,command,args,options),file=path.basename(args?.[0]??'');
           if(command===process.execPath&&path.dirname(path.resolve(args?.[0]??''))===path.resolve('scripts')&&names.includes(file)){
            const base=path.join(out,'children',String(children.length).padStart(4,'0')+'-'+file),row={file,sourceSha256:discovery.find(row=>row.file===file).sha256,startedAt:Date.now(),closedAt:null,args,cwd:options?.cwd??null,environment:Object.fromEntries(['SIM_NETWORK','ENGINES','TZ','NODE_OPTIONS','BASE','SWEEP_BASE','PORT','ONLY','SOCCER_AWARD_GENERATIONS_OUT'].map(key=>[key,options?.env?.[key]??null])),stdout:base+'.stdout.log',stderr:base+'.stderr.log',stdoutBytes:0,stderrBytes:0,chunks:[],exitCode:null,signal:null};children.push(row);fs.writeFileSync(row.stdout,'');fs.writeFileSync(row.stderr,'');
            child.stdout.on('data',data=>{row.chunks.push({stream:'stdout',start:row.stdoutBytes,bytes:data.length});fs.appendFileSync(row.stdout,data);row.stdoutBytes+=data.length;});child.stderr.on('data',data=>{row.chunks.push({stream:'stderr',start:row.stderrBytes,bytes:data.length});fs.appendFileSync(row.stderr,data);row.stderrBytes+=data.length;});child.on('close',(code,signal)=>{row.exitCode=code;row.signal=signal;row.closedAt=Date.now();});
           }return child;
          };syncBuiltinESMExports();process.on('exit',code=>fs.writeFileSync(path.join(out,'process.json'),JSON.stringify({runnerExit:code,children},null,2)));await import(pathToFileURL(path.resolve('scripts/runAllSims.mjs')).href);
          JS
          cat > career-award-generations-artifacts/helpers/check-runner.mjs <<'JS'
          import fs from 'node:fs';import path from 'node:path';import assert from 'node:assert/strict';import {createHash} from 'node:crypto';
          const out=path.resolve(process.env.AWARD_RUNNER_DIR),discovery=JSON.parse(fs.readFileSync(path.join(out,'discovery.json'),'utf8')),processes=JSON.parse(fs.readFileSync(path.join(out,'process.json'),'utf8')),text=fs.readFileSync(path.join(out,'runner.log'),'utf8'),classifications=[...text.matchAll(/^\s+(PASS|FAIL|EMPTY|SKIP)\s+([A-Za-z0-9]+\.mjs)\s+[0-9.]+s\s*$/gm)].map(m=>({verdict:m[1],file:m[2]})),omissions=[];
          const hash=b=>createHash('sha256').update(b).digest('hex');for(const row of processes.children){const offsets={stdout:0,stderr:0};for(const key of ['stdout','stderr'])assert.equal(fs.statSync(row[key]).size,row[key+'Bytes']);for(const chunk of row.chunks){assert(['stdout','stderr'].includes(chunk.stream));assert.equal(chunk.start,offsets[chunk.stream]);assert(Number.isInteger(chunk.bytes)&&chunk.bytes>0);offsets[chunk.stream]+=chunk.bytes;}assert.equal(offsets.stdout,row.stdoutBytes);assert.equal(offsets.stderr,row.stderrBytes);const output=fs.readFileSync(row.stdout,'utf8')+'\n'+fs.readFileSync(row.stderr,'utf8');omissions.push({file:row.file,lines:output.split('\n').filter(line=>/\bskip(?:ped|ping)?\b|\bnot (?:run|checked)\b|\blive.only\b/i.test(line)),stdoutSha256:hash(fs.readFileSync(row.stdout)),stderrSha256:hash(fs.readFileSync(row.stderr))});}
          const failures=classifications.filter(x=>x.verdict!=='PASS');fs.writeFileSync(path.join(out,'scope.json'),JSON.stringify({expected:discovery.expected,actual:processes.children.map(x=>x.file),classifications,failures,internalOmissions:omissions,qualification:'Internal omissions are retained and receive no live or database coverage credit.'},null,2));
          assert(discovery.selected.length>0,'focused workflow requires an explicit selected scope');assert.deepEqual([...discovery.expected].sort(),discovery.selected.map(name=>name+'.mjs').sort(),'every explicitly selected harness exists');assert.equal(discovery.network,'offline');assert.equal(discovery.browser,true);assert.equal(hash(fs.readFileSync('scripts/runAllSims.mjs')),discovery.runnerSha256);assert.deepEqual(processes.children.map(x=>x.file).sort(),[...discovery.expected].sort());assert.deepEqual(classifications.map(x=>x.file).sort(),[...discovery.expected].sort());assert.equal(failures.length,0,'FAIL, EMPTY and SKIP remain unwaived');assert.equal(processes.runnerExit,0);for(const row of processes.children){assert.equal(row.sourceSha256,discovery.discovery.find(source=>source.file===row.file).sha256);assert.equal(row.exitCode,0,row.file);assert.equal(row.signal,null,row.file);}
          console.log('PASS exact unchanged runner coverage: '+classifications.length+' named results, no FAIL, EMPTY or SKIP');
          JS
          cat > career-award-generations-artifacts/helpers/generated.mjs <<'JS'
          import fs from 'node:fs';import path from 'node:path';import assert from 'node:assert/strict';import {createHash} from 'node:crypto';
          const hash=b=>createHash('sha256').update(b).digest('hex');function rows(root){if(!fs.existsSync(root))return[];const stat=fs.lstatSync(root);assert(!stat.isSymbolicLink(),'symlink '+root);if(stat.isFile())return[{file:root,bytes:stat.size,sha256:hash(fs.readFileSync(root))}];assert(stat.isDirectory(),root);return fs.readdirSync(root).sort().flatMap(name=>rows(path.join(root,name)));}
          const current={public:rows('public'),lastmod:rows('scripts/data/lastmod.json'),dist:rows('dist')},file='career-award-generations-artifacts/generated-body-inventory.json';if(process.argv.includes('--check'))assert.deepEqual(current,JSON.parse(fs.readFileSync(file,'utf8')));else fs.writeFileSync(file,JSON.stringify(current,null,2));console.log('PASS complete generated body inventory: '+current.public.length+' public files, '+current.dist.length+' dist files');
          JS
          sha256sum career-award-generations-artifacts/helpers/*.mjs > career-award-generations-artifacts/helper-source-sha256.txt
      - name: Retain independent persisted storage consumer source
        run: |
