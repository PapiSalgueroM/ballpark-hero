            keys(receipt, ['representation', 'originalRepresentation', 'status', 'complete', 'codec', 'source', 'gear', 'pack', 'chunkLedger', 'objectReferences', 'rawInsertionInventory', 'reconstruction', 'controls', 'errors', 'attemptedObjects', 'completedObjects', 'decodedObjects', 'unreferencedChunks', 'orphanRanges']);
            assert.equal(receipt.originalRepresentation, 'objects.json is former whole-gzip reference metadata only, those individual gzip bodies are not physically retained');
            assert.equal(receipt.representation, 'cdc-byte-pack-v1');
            assert.deepEqual(receipt.codec, { version: 1, min: 512, target: 2048, max: 8192, mask: 2047, gearSeed: 2654435769, gzipLevel: 9 });
            const source = declared(receipt.source, 'storage/codec-source.mjs');
