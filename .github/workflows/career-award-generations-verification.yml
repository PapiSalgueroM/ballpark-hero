            assert.equal(packBytes, receipt.pack.bytes); assert.equal(digest.digest('hex'), receipt.pack.sha256); result.files.push(receipt.pack);
            const chunks = json(declared(receipt.chunkLedger, 'storage/chunk-ledger.json.gz', true));
