name: Game desktop side rails

on:
  pull_request:
    paths:
      - .github/workflows/game-desktop-rails.yml
      - scripts/playGameDesktopRails.mjs
      - src/App.tsx
      - src/components/ads/GameDesktopRails*
      - src/components/StorageNotice.tsx
      - src/components/BrokenSaveRestore.tsx
      - src/components/club-manager/CustomClubForm.tsx
      - src/data/gameRegistry.ts
      - src/pages/ClubManager.tsx
      - src/pages/SoccerCareer.tsx
      - src/pages/WorldCupPredictor.tsx

permissions:
  contents: read

jobs:
  geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install and build
        run: |
          npm ci
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          npm run build
      - name: Check every game and active career with ad traffic blocked
        run: |
          set -euo pipefail
          node scripts/lib/hostLikeServer.mjs dist 4173 > /tmp/game-side-rails-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in {1..40}; do
            if curl -fs -o /dev/null http://127.0.0.1:4173/; then break; fi
            sleep 0.25
          done
          curl -fs -o /dev/null http://127.0.0.1:4173/
          node scripts/playGameDesktopRails.mjs
