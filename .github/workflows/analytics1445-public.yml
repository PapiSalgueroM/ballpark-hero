name: Analytics1445 public readback
on:
  workflow_dispatch:
  push:
    branches: [codex/analytics1445-public-readback]
permissions:
  contents: read
  actions: read
concurrency:
  group: analytics1445-public-readback-${{ github.sha }}
  cancel-in-progress: false
jobs:
  public_operator:
    if: github.ref == 'refs/heads/codex/analytics1445-public-readback'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      OPERATOR_MODE: readback
      READBACK_OUT: analytics1445-public-readback-artifacts
      SOURCE_SHA: 554a3b18641044ec5164bff9acab4d338237078c
      QUALIFIED_BUILD_SHA: 19c907608a31d0cbd454163286d4a6fda7359137
      INPUT_RUN_ID: 39690909464
      INPUT_OPERATOR_SHA: fd03a18fd9d420131cc2f40ba74df1bc59d9efc6
      INPUT_ARTIFACT_ID: 12387923827
      INPUT_ZIP_SHA256: bc2a76e51a653673d6b2a34075c13d0cbe0cd767d35a00a2fa4700b5c7681a9d
      INPUT_WORKFLOW_NAME: Analytics1445 public intake
      EXPECTED_DEPLOYMENT: 8873089e-26a7-4095-b517-fde0ded96092
      OBSERVED_ENTRY: /assets/index-gLwQ_4x3.js
      ASSET_PINS_JSON: '{"entry":{"path":"/assets/index-gLwQ_4x3.js","sha256":"397d2582fb288332afb32b424237c30e2d004723b9379e6931260ee0de38016b"},"cookie":{"path":"/assets/index-gLwQ_4x3.js","sha256":"397d2582fb288332afb32b424237c30e2d004723b9379e6931260ee0de38016b"},"privacy":{"path":"/assets/PrivacyPolicy-Bvg4J1Jq.js","sha256":"83c7d13894a8fb29a9279dc2bd4e2fab0cce24de91e5b861c9912c30ca1d07a3"}}'
      ASSET_PINS_SHA256: aa960238c3c7911c31db217b1dc993c72e6419abf0e1ee4b770bf5ef5aeb449f
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fail closed on manual bindings before downloads or public requests
        run: |
          set -euo pipefail
          mkdir "$READBACK_OUT"
          git rev-parse HEAD > "$READBACK_OUT/operator-head.txt"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node <<'JS'
          const fs=require('node:fs'),assert=require('node:assert/strict'),{createHash}=require('node:crypto');
          for(const key of ['SOURCE_SHA','QUALIFIED_BUILD_SHA','INPUT_OPERATOR_SHA'])assert.match(process.env[key]||'',/^[a-f0-9]{40}$/);
          for(const key of ['INPUT_RUN_ID','INPUT_ARTIFACT_ID'])assert.match(process.env[key]||'',/^[1-9][0-9]+$/);
          assert.match(process.env.INPUT_ZIP_SHA256||'',/^[a-f0-9]{64}$/);assert.match(process.env.EXPECTED_DEPLOYMENT||'',/^[a-f0-9]{8}(?:-[a-f0-9]{4}){3}-[a-f0-9]{12}$/);assert.notEqual(process.env.EXPECTED_DEPLOYMENT,'00000000-0000-0000-0000-000000000000');
          assert(['intake','readback'].includes(process.env.OPERATOR_MODE));
          if(process.env.OPERATOR_MODE==='intake'){assert.equal(process.env.INPUT_OPERATOR_SHA,process.env.QUALIFIED_BUILD_SHA);assert.equal(process.env.INPUT_WORKFLOW_NAME,'Analytics paused status1445');assert.match(process.env.OBSERVED_ENTRY||'',/^\/assets\/index-[A-Za-z0-9_-]{8}\.js$/);}
          else{assert.equal(process.env.INPUT_WORKFLOW_NAME,'Analytics1445 public intake');const pins=JSON.parse(process.env.ASSET_PINS_JSON);assert.deepEqual(Object.keys(pins).sort(),['cookie','entry','privacy']);const hash=value=>createHash('sha256').update(value).digest('hex');assert.match(process.env.ASSET_PINS_SHA256||'',/^[a-f0-9]{64}$/);assert.equal(hash(process.env.ASSET_PINS_JSON),process.env.ASSET_PINS_SHA256);for(const row of Object.values(pins)){assert.deepEqual(Object.keys(row).sort(),['path','sha256']);assert.match(row.path,/^\/assets\/[A-Za-z0-9_.-]+\.js$/);assert.match(row.sha256,/^[a-f0-9]{64}$/);}for(const row of Object.values(pins))for(const other of Object.values(pins))if(row.path===other.path)assert.equal(row.sha256,other.sha256);assert.match(pins.entry.path,/^\/assets\/index-[A-Za-z0-9_-]{8}\.js$/);assert.equal(process.env.OBSERVED_ENTRY,pins.entry.path);}
          fs.writeFileSync(process.env.READBACK_OUT+'/bindings.json',JSON.stringify(Object.fromEntries(['OPERATOR_MODE','SOURCE_SHA','QUALIFIED_BUILD_SHA','INPUT_RUN_ID','INPUT_OPERATOR_SHA','INPUT_ARTIFACT_ID','INPUT_ZIP_SHA256','INPUT_WORKFLOW_NAME','EXPECTED_DEPLOYMENT','OBSERVED_ENTRY','ASSET_PINS_JSON','ASSET_PINS_SHA256'].map(key=>[key,process.env[key]])),null,2)+'\n');
          JS
      - name: Rebind successful input run and download its exact artifact before public guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "/repos/PapiSalgueroM/ballpark-hero/actions/runs/$INPUT_RUN_ID" > "$READBACK_OUT/input-run.json"
          gh api "/repos/PapiSalgueroM/ballpark-hero/actions/runs/$INPUT_RUN_ID/artifacts?per_page=100" > "$READBACK_OUT/input-artifacts.json"
          node <<'JS'
          const fs=require('node:fs'),assert=require('node:assert/strict'),out=process.env.READBACK_OUT;const run=JSON.parse(fs.readFileSync(out+'/input-run.json'));assert.equal(String(run.id),process.env.INPUT_RUN_ID);assert.equal(run.head_sha,process.env.INPUT_OPERATOR_SHA);assert.equal(run.status,'completed');assert.equal(run.conclusion,'success');assert.equal(run.name,process.env.INPUT_WORKFLOW_NAME);assert.equal(run.repository.full_name,'PapiSalgueroM/ballpark-hero');const listed=JSON.parse(fs.readFileSync(out+'/input-artifacts.json'));assert(listed.total_count>0&&listed.total_count<=100);assert.equal(listed.artifacts.length,listed.total_count);const chosen=listed.artifacts.filter(row=>String(row.id)===process.env.INPUT_ARTIFACT_ID);assert.equal(chosen.length,1);assert.equal(chosen[0].expired,false);assert.equal(chosen[0].digest,'sha256:'+process.env.INPUT_ZIP_SHA256);assert.equal(String(chosen[0].workflow_run.id),process.env.INPUT_RUN_ID);assert.equal(chosen[0].workflow_run.head_sha,process.env.INPUT_OPERATOR_SHA);const prefix=process.env.OPERATOR_MODE==='intake'?'analytics1445-build-browser-':'analytics1445-public-intake-';assert(chosen[0].name.startsWith(prefix+process.env.INPUT_RUN_ID+'-'));
          JS
          gh api "/repos/PapiSalgueroM/ballpark-hero/actions/artifacts/$INPUT_ARTIFACT_ID/zip" > "$READBACK_OUT/input.zip"
          printf '%s  %s\n' "$INPUT_ZIP_SHA256" "$READBACK_OUT/input.zip" | sha256sum --check > "$READBACK_OUT/input-zip-hold.log"
          python <<'PY'
          import os,pathlib,zipfile,tarfile,hashlib,json,re,stat
          out=pathlib.Path(os.environ['READBACK_OUT']).resolve();target=out/'input';target.mkdir()
          def safe(name):
              part=pathlib.PurePosixPath(name)
              assert name and not part.is_absolute() and '..' not in part.parts and '\\' not in name and ':' not in name
              return part
          with zipfile.ZipFile(out/'input.zip') as archive:
              names=set()
              for item in archive.infolist():
                  safe(item.filename);assert item.filename not in names;names.add(item.filename);assert not stat.S_ISLNK(item.external_attr>>16)
              archive.extractall(target)
          manifest={}
          for line in (target/'evidence.sha256').read_text().splitlines():
              match=re.fullmatch(r'([a-f0-9]{64})  (?:\./)?(.+)',line);assert match
              name=str(safe(match[2]));assert name not in manifest and name!='evidence.sha256';manifest[name]=match[1]
          actual={str(p.relative_to(target)) for p in target.rglob('*') if p.is_file()}-{'evidence.sha256'}
          assert actual==set(manifest) and actual
          for name,expected in manifest.items():assert hashlib.sha256((target/name).read_bytes()).hexdigest()==expected
          if os.environ['OPERATOR_MODE']=='intake':
              assert (target/'head.txt').read_text().strip()==os.environ['QUALIFIED_BUILD_SHA']
              assert (target/'final-holds.exit').read_text().strip()=='0'
              assert json.loads((target/'transport-hold.json').read_text())['zeroActualAttempts'] is True
              assert all(p.stat().st_size==0 for p in target.rglob('*.transport'))
              dest=out/'input-dist';dest.mkdir()
              with tarfile.open(target/'dist.tar.gz') as archive:
                  for item in archive.getmembers():safe(item.name);assert item.isdir() or item.isfile()
                  archive.extractall(dest,filter='data')
              dist_manifest={}
              for line in (target/'dist.sha256').read_text().splitlines():
                  match=re.fullmatch(r'([a-f0-9]{64})  dist/(.+)',line);assert match
                  name=str(safe(match[2]));assert name not in dist_manifest;dist_manifest[name]=match[1]
              actual_dist={str(p.relative_to(dest)) for p in dest.rglob('*') if p.is_file()}
              assert actual_dist==set(dist_manifest) and actual_dist
              for name,expected in dist_manifest.items():assert hashlib.sha256((dest/name).read_bytes()).hexdigest()==expected
          else:
              prior=json.loads((target/'readback.json').read_text());assert prior['complete'] is True and prior['diagnosticOnly'] is True and prior['mode']=='intake'
              assert prior['operator']==os.environ['INPUT_OPERATOR_SHA'] and str(prior['run'])==os.environ['INPUT_RUN_ID']
              assert prior['source']==os.environ['SOURCE_SHA'] and prior['qualified']==os.environ['QUALIFIED_BUILD_SHA'] and prior['deployment']==os.environ['EXPECTED_DEPLOYMENT']
          (out/'input-provenance.json').write_text(json.dumps({'complete':True,'run':os.environ['INPUT_RUN_ID'],'operator':os.environ['INPUT_OPERATOR_SHA'],'artifact':os.environ['INPUT_ARTIFACT_ID'],'zipSha256':os.environ['INPUT_ZIP_SHA256'],'manifestFiles':len(manifest)},indent=2)+'\n')
          PY
      - name: Hold exact published source and qualified generated patch
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$SOURCE_SHA" > "$READBACK_OUT/source-fetch.log" 2>&1
          git fetch --no-tags --depth=1 origin "$QUALIFIED_BUILD_SHA" >> "$READBACK_OUT/source-fetch.log" 2>&1
          git diff --exit-code "$SOURCE_SHA" HEAD -- src scripts public supabase index.html package.json package-lock.json vitest.config.ts > "$READBACK_OUT/published-source-hold.log"
          git diff --exit-code "$QUALIFIED_BUILD_SHA" "$SOURCE_SHA" -- src scripts public supabase index.html package.json package-lock.json vitest.config.ts ':!public/privacy/index.html' ':!public/sitemap.xml' ':!scripts/data/lastmod.json' > "$READBACK_OUT/qualified-source-hold.log"
          qualified_input="$READBACK_OUT/input";if test "$OPERATOR_MODE" = readback;then qualified_input="$READBACK_OUT/input/input";fi
          test -f "$qualified_input/generated.patch" && test ! -s "$qualified_input/generated.patch"
          test -f "$qualified_input/generated-files.txt" && test ! -s "$qualified_input/generated-files.txt"
          sha256sum "$qualified_input/generated.patch" "$qualified_input/generated-files.txt" > "$READBACK_OUT/qualified-fixed-point.sha256"
          git diff --binary "$QUALIFIED_BUILD_SHA" "$SOURCE_SHA" -- public scripts/data/lastmod.json > "$READBACK_OUT/adopted-generated.patch"
          cmp "$qualified_input/generated.patch" "$READBACK_OUT/adopted-generated.patch" > "$READBACK_OUT/qualified-generated-patch-hold.log"
          sha256sum .github/workflows/legal-ai-privacy-public-readback.yml scripts/auditLive.mjs scripts/lib/liveIndexability.mjs src/lib/consentPreferences.ts src/lib/consentedScripts.ts package.json package-lock.json public/sitemap.xml > "$READBACK_OUT/source-before.sha256"
      - name: Isolated pinned request and parser tools without an app build or browser installation
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/analytics1445-public-tools"
          npm install --prefix "$tools" --no-save --package-lock=false playwright@1.64.0 jsdom@20.0.3 es-module-lexer@1.7.0 acorn@8.15.0 > "$READBACK_OUT/tooling.log" 2>&1
          test ! -e node_modules;mkdir node_modules
          for package in playwright playwright-core jsdom;do ln -s "$tools/node_modules/$package" "node_modules/$package";done
          echo "NODE_PATH=$tools/node_modules" >> "$GITHUB_ENV"
      - name: Narrow the pinned historical public guard without editing it
        run: |
          set -euo pipefail
          node <<'JS'
          const fs=require('node:fs'),assert=require('node:assert/strict'),{createHash}=require('node:crypto');const hash=body=>createHash('sha256').update(body).digest('hex'),out=process.env.READBACK_OUT;
          for(const [file,pin] of Object.entries({'scripts/auditLive.mjs':'26c387c01ba5cb2a993bf5205228d7b451770eed1c4836d052574c9dc5e3f2de','scripts/lib/liveIndexability.mjs':'133365fa307e7548b4367508a91d2629af24d6cca207e127df294c1a3e23ac40'})){const body=fs.readFileSync(file);assert.equal(hash(body),pin);assert.throws(()=>assert.equal(hash(Buffer.concat([body,Buffer.from('\n')])),pin));}
          const source=fs.readFileSync('.github/workflows/legal-ai-privacy-public-readback.yml','utf8'),pin='37d187d3bc4659ebfdda5d010fb157972c4c8e797b4bab2b3fc27d20ddfe15cb';assert.equal(hash(source),pin);assert.throws(()=>assert.equal(hash(source+'\n'),pin));
          const start='          cat > "$READBACK_OUT/read-only.cjs" <<\'JS\'\n',end='\n          JS\n';assert.equal(source.split(start).length,2);const rest=source.split(start)[1],finish=rest.indexOf(end);assert(finish>0);let guard=rest.slice(0,finish).replace(/^          /gm,'');assert(guard.trimEnd().endsWith('module.exports = { ORIGIN, checkedURL };'));
          const from=guard.indexOf('const paths = new Set('),to=guard.indexOf('function checkedURL(');assert(from>=0&&to>from&&guard.slice(from,to).includes("addPublic('public')"));
          const sitemap=fs.readFileSync('public/sitemap.xml','utf8');const routes=[...new Set([...sitemap.matchAll(/<loc>https?:\/\/[^/]+([^<]*)<\/loc>/g)].map(m=>(m[1]||'/').replace(/\/$/,'')||'/'))].filter(route=>route!=='/');const count=Math.min(24,routes.length),sample=Array.from({length:count},(_,i)=>routes[Math.floor(i*routes.length/count)]);assert.equal(count,24);assert(sample.every(route=>/^\/(?:[a-z0-9-]+\/)*[a-z0-9-]+$/.test(route)));const pages=[...new Set(['/', '/privacy',...(process.env.OPERATOR_MODE==='readback'?sample:[])])];assert(!pages.includes('/__analytics1445_unlisted'));
          guard=guard.slice(0,from)+'const paths = new Set('+JSON.stringify(pages)+');\nconst allowedAssets = () => new Set(JSON.parse(fs.readFileSync(path.join(out, "allowed-assets.json"), "utf8")));\n'+guard.slice(to);
          const assetLine=guard.split('\n').filter(line=>line.trim().startsWith('const asset = '));assert.equal(assetLine.length,1);guard=guard.replace(assetLine[0],'  const asset = allowedAssets().has(url.pathname);');
          const requestLine='      const response = await native(input, { ...options, maxRedirects: 0, maxRetries: 0 });';assert.equal(guard.split(requestLine).length,2);guard=guard.replace(requestLine,'      const fresh = checkedURL(typeof input === "string" || input instanceof URL ? input : input.url(), method);\n      fresh.searchParams.set("analytics1445_public_audit", process.env.GITHUB_RUN_ID + "." + process.env.GITHUB_RUN_ATTEMPT);\n      const response = await native(fresh.href, { ...options, maxRedirects: 0, maxRetries: 0 });\n      const header = response.headers()["x-deployment-id"];\n      if (!fresh.pathname.startsWith("/assets/") || header) { const uuid = "[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}"; const match = String(header).match(new RegExp("^("+uuid+")$|^psr2\\\\.("+uuid+")\\\\.[0-9]{10}\\\\.[A-Za-z0-9_-]{43}$", "i")); if (!match || (match[1] || match[2]).toLowerCase() !== process.env.EXPECTED_DEPLOYMENT) throw new Error("Exact deployment header required"); }');
          const assets=process.env.OPERATOR_MODE==='intake'?[process.env.OBSERVED_ENTRY]:[...new Set(Object.values(JSON.parse(process.env.ASSET_PINS_JSON)).map(row=>row.path))];fs.writeFileSync(out+'/allowed-assets.json',JSON.stringify(assets));fs.writeFileSync(out+'/audit-allowed-pages.json',JSON.stringify({audited:['/','/privacy'],chromeSample:process.env.OPERATOR_MODE==='readback'?sample:[],allowed:pages},null,2));fs.writeFileSync(out+'/read-only.cjs',guard);fs.writeFileSync(out+'/preparation.json',JSON.stringify({complete:true,guardSourceSha256:pin,narrowedGuardSha256:hash(guard),changedGuardRejected:1,unchangedAuditPinsHeld:2,source:process.env.SOURCE_SHA,qualified:process.env.QUALIFIED_BUILD_SHA},null,2));
          JS
      - name: Read fixed pages and source reachable status assets with strict diagnostics retained
        run: |
          set -euo pipefail
          cat > "$READBACK_OUT/operator.cjs" <<'JS'
          // Private operator template. Copied into the workflow artifact directory, never app code.
          const fs = require('node:fs'), path = require('node:path'), assert = require('node:assert/strict');
          const { createHash } = require('node:crypto');
          const { spawnSync } = require('node:child_process');
          const { request } = require('playwright-core'), { JSDOM } = require('jsdom');
          const lexer = require('es-module-lexer'), acorn = require('acorn');
          const { ORIGIN, checkedURL } = require('./read-only.cjs');
          const out = process.env.READBACK_OUT, mode = process.env.OPERATOR_MODE;
          const hash = value => createHash('sha256').update(value).digest('hex');
          const rolesRequired = ['cookie', 'entry', 'privacy'];
          const save = (name, value) => fs.writeFileSync(path.join(out, name), typeof value === 'string' || Buffer.isBuffer(value) ? value : JSON.stringify(value, null, 2) + '\n');
          const report = { complete: false, mode, diagnosticOnly: mode === 'intake', source: process.env.SOURCE_SHA, qualified: process.env.QUALIFIED_BUILD_SHA, operator: process.env.GITHUB_SHA, run: process.env.GITHUB_RUN_ID, deployment: process.env.EXPECTED_DEPLOYMENT, pages: [], targets: [], imports: [], controls: {}, scope: 'Published source, bounded renderer semantics and exact observed assets. Whole CI binary equality is not asserted.' };
          const persist = () => save('readback.json', report);
          function walk(node, visit) { if (!node || typeof node !== 'object') return; if (typeof node.type === 'string') visit(node); for (const value of Object.values(node)) if (Array.isArray(value)) value.forEach(child => walk(child, visit)); else if (value && typeof value === 'object') walk(value, visit); }
          const parse = source => acorn.parse(source, { ecmaVersion: 'latest', sourceType: 'module', allowHashBang: true });
          const prop = (object, name) => object?.properties?.find(row => row.type === 'Property' && !row.computed && (row.key.name ?? row.key.value) === name)?.value;
          function jsxCalls(root) { const result = []; walk(root, node => { if (node.type === 'CallExpression' && node.arguments[0]?.type === 'Literal' && typeof node.arguments[0].value === 'string' && node.arguments[1]?.type === 'ObjectExpression') result.push(node); }); return result; }
          function text(root) { const values = []; walk(root, node => { if (node.type === 'Literal' && typeof node.value === 'string') values.push(node.value); }); return values.join(' ').replace(/\s+/g, ' ').trim(); }
          function cookieRenderer(source) {
            const ast = parse(source), calls = jsxCalls(ast);
            const regions = calls.filter(node => prop(node.arguments[1], 'role')?.value === 'region' && prop(node.arguments[1], 'aria-label')?.value === 'Cookie choices');
            assert.equal(regions.length, 1, 'COOKIE_REGION_UNIQUE');
            const nested = jsxCalls(regions[0]);
            const status = nested.filter(node => prop(node.arguments[1], 'data-analytics-paused-status')?.value === '');
            assert.equal(status.length, 1, 'STATUS_MARKER_UNIQUE');
            assert.equal(status[0].arguments[0].value, 'p', 'STATUS_PLAIN_P_REQUIRED');
            const plainProps = (object, keys) => object?.type === 'ObjectExpression'
              && object.properties.length === keys.length
              && object.properties.every(row => row.type === 'Property' && !row.computed && row.kind === 'init' && !row.method && !row.shorthand && keys.includes(row.key.name ?? row.key.value))
              && new Set(object.properties.map(row => row.key.name ?? row.key.value)).size === keys.length;
            const props = status[0].arguments[1], children = prop(props, 'children');
            const strong = children?.elements?.[0], reason = children?.elements?.[1], strongProps = strong?.arguments?.[1];
            assert(status[0].arguments.length === 2
              && plainProps(props, ['data-analytics-paused-status', 'children'])
              && prop(props, 'data-analytics-paused-status')?.type === 'Literal'
              && children?.type === 'ArrayExpression' && children.elements.length === 2
              && strong?.type === 'CallExpression' && strong.arguments.length === 2
              && strong.arguments[0]?.type === 'Literal' && strong.arguments[0].value === 'strong'
              && plainProps(strongProps, ['children'])
              && prop(strongProps, 'children')?.type === 'Literal' && prop(strongProps, 'children').value === 'Analytics is paused.'
              && reason?.type === 'Literal' && typeof reason.value === 'string' && reason.value.trim() === 'Google Analytics is off while we check its privacy settings.'
              && jsxCalls(status[0]).length === 2, 'STATUS_PLAIN_SHAPE_REQUIRED');
            const inputs = nested.filter(node => node.arguments[0].value === 'input');
            assert.equal(inputs.length, 1, 'COOKIE_ONLY_ADVERTISING_INPUT');
            assert.equal(prop(inputs[0].arguments[1], 'type')?.value, 'checkbox', 'COOKIE_ADVERTISING_CHECKBOX');
            const labels = nested.filter(node => node.arguments[0].value === 'label');
            assert.equal(labels.filter(node => /\bAdvertising\b/.test(text(prop(node.arguments[1], 'children')))).length, 1, 'COOKIE_ADVERTISING_LABEL');
            assert.equal(labels.filter(node => /\bAnalytics\b/.test(text(prop(node.arguments[1], 'children')))).length, 0, 'COOKIE_ANALYTICS_LABEL_REFUSED');
            return { statusStart: status[0].start, statusEnd: status[0].end, propsStart: props.start, callee: source.slice(status[0].callee.start, status[0].callee.end) };
          }
          function cookieControl(source) {
            const found = cookieRenderer(source), original = source.slice(found.statusStart, found.statusEnd);
            const replacement = found.callee + '("label",{"data-analytics-paused-status":"",children:[' + found.callee + '("input",{type:"checkbox",checked:false,disabled:true}),"Analytics"]})';
            const changed = source.slice(0, found.statusStart) + replacement + source.slice(found.statusEnd);
            assert.notEqual(changed, source); parse(changed);
            assert.equal(changed.slice(0, found.statusStart) + original + changed.slice(found.statusStart + replacement.length), source);
            assert.throws(() => cookieRenderer(changed), error => error.name === 'AssertionError' && error.message.startsWith('STATUS_PLAIN_P_REQUIRED'));
            const handlerAt = found.propsStart + 1, handler = 'onClick:()=>{},';
            assert.equal(source[found.propsStart], '{');
            const withHandler = source.slice(0, handlerAt) + handler + source.slice(handlerAt);
            assert.notEqual(withHandler, source); parse(withHandler);
            assert.equal(withHandler.slice(0, handlerAt) + withHandler.slice(handlerAt + handler.length), source);
            assert.throws(() => cookieRenderer(withHandler), error => error.name === 'AssertionError' && error.message.startsWith('STATUS_PLAIN_SHAPE_REQUIRED'));
            return { originalSha256: hash(source), changedSha256: hash(changed), occurrences: 1, wholeInverseExact: true, parserAcceptedFault: true, rejection: 'STATUS_PLAIN_P_REQUIRED', handler: { changedSha256: hash(withHandler), occurrences: 1, wholeInverseExact: true, parserAcceptedFault: true, rejection: 'STATUS_PLAIN_SHAPE_REQUIRED' } };
          }
          function deployment(header) {
            assert.equal(typeof header, 'string'); const uuid = '[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}';
            const match = header.match(new RegExp('^(' + uuid + ')$|^psr2\\.(' + uuid + ')\\.[0-9]{10}\\.[A-Za-z0-9_-]{43}$', 'i'));
