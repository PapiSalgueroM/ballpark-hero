name: Soccer Connect 4 browser and build qualification
on:
  push:
    branches: [codex/football-connect4-request-native-repair-20261030]
permissions:
  contents: read
jobs:
  game:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: 'true'
      SIM_NETWORK: offline
      GIT_OPTIONAL_LOCKS: '0'
      EXPECTED_MAIN: 28e7392f38f04a3af6da33e71ec5625ca1e2cd9f
      EXPECTED_PARENT: 75323964cfe472136595b77de0cf4cb27d8bf917
      EXPECTED_TREE: 30482ff935eab193cb4d7b8a65e7cad2524f462a
      TEST_SHA256: 93458e4e466516850528d21cd25e730d09c3d1ea602e9bd97a9b9482849677d8
      CONTROLLER_SHA256: 0df78024c1a38f95bd1e24a02eef9fc1cf086163a2baacb2346c9bc3f468d96b
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Bind fixed product and exact shared qualification source
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/c4-game"
          test ! -e "$out"
          mkdir -p "$out/helpers" "$out/runtime-tmp"
          echo "C4_OUT=$out" >> "$GITHUB_ENV"
          echo "PLACEMENT_OUT=$out" >> "$GITHUB_ENV"
          echo "FREE_KICK_FONT_CACHE=$out/font-cache" >> "$GITHUB_ENV"
          echo "C4_OWNERSHIP_OUT=$out/native" >> "$GITHUB_ENV"
          echo "TMPDIR=$out/runtime-tmp" >> "$GITHUB_ENV"
          test "$GITHUB_REF_NAME" = codex/football-connect4-request-native-repair-20261030
          test "$(git rev-list --parents -n1 HEAD)" = "$GITHUB_SHA $EXPECTED_PARENT"
          test "$(git rev-list --parents -n1 "$EXPECTED_PARENT")" = "$EXPECTED_PARENT $EXPECTED_MAIN"
          test "$(git rev-parse "$EXPECTED_PARENT^{tree}")" = "$EXPECTED_TREE"
          test "$(git ls-files | wc -l)" -eq 5457
          git diff --name-status "$EXPECTED_MAIN" "$EXPECTED_PARENT" > "$out/product.paths"
          printf 'M\tsrc/hooks/useFootballConnect4.ts\nM\tsrc/pages/FootballConnect4.tsx\nA\tsrc/test/footballConnect4RequestOwnership.test.tsx\n' > "$out/expected-product.paths"
          cmp "$out/product.paths" "$out/expected-product.paths"
          git diff --name-status "$EXPECTED_PARENT" HEAD > "$out/proof.paths"
          printf 'A\t.github/workflows/football-connect4-request-full.yml\nA\t.github/workflows/football-connect4-request-game.yml\nA\tscripts/qa/footballConnect4FullPositive.cjs\nA\tscripts/qa/playFootballConnect4RequestOwnership.mjs\n' > "$out/expected-proof.paths"
          cmp "$out/proof.paths" "$out/expected-proof.paths"
          test "$(sha256sum src/test/footballConnect4RequestOwnership.test.tsx | cut -d' ' -f1)" = "$TEST_SHA256"
          test "$(sha256sum scripts/qa/playFootballConnect4RequestOwnership.mjs | cut -d' ' -f1)" = "$CONTROLLER_SHA256"
          test "$(git hash-object src/hooks/useFootballConnect4.ts)" = 5b09be1a883b8289e018647b1189a9a0315268e7
          test "$(git hash-object src/pages/FootballConnect4.tsx)" = 5f69622e41c87e4f15f6ba3ae3dbe45e6f7f9471
          test "$(git hash-object scripts/sweepWeight.mjs)" = 084cce2062686259437cd2a334093a561c819c36
          git ls-files -z | sort -z > "$out/source-members.initial"
          xargs -0 sha256sum < "$out/source-members.initial" > "$out/source.initial.sha256"
          git ls-files --others --exclude-standard -z | sort -z > "$out/untracked.initial"
          test ! -s "$out/untracked.initial"
          git for-each-ref --format='%(refname) %(objectname)' > "$out/refs.before"
          git rev-parse HEAD > "$out/head.txt"
          git rev-parse 'HEAD^{tree}' > "$out/tree.txt"
          git archive --format=tar HEAD > "$out/source.tar"
          cp scripts/qa/playFootballConnect4RequestOwnership.mjs "$out/native-collector.mjs"
          cmp scripts/qa/playFootballConnect4RequestOwnership.mjs "$out/native-collector.mjs"
          sha256sum "$out/native-collector.mjs" > "$out/controller-copy.sha256"
          raw=0
          node --check scripts/qa/playFootballConnect4RequestOwnership.mjs > "$out/syntax.stdout" 2> "$out/syntax.stderr" || raw=$?
          printf '%s\n' "$raw" > "$out/syntax.exit"
          test "$raw" -eq 0
          test ! -s "$out/syntax.stdout"
          test ! -s "$out/syntax.stderr"
          cat > "$out/helpers/run.sh" <<'RUN'
          run() {
            local id="$1" budget="$2"; shift 2
            local raw=0
            : > "$C4_OUT/$id.transport"
            { printf '%q ' "$@"; printf '\n'; } > "$C4_OUT/$id.command"
            NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$C4_OUT/$id.transport" FORCE_COLOR=0 env -u NO_COLOR timeout --signal=TERM --kill-after=15s "$budget" "$@" > "$C4_OUT/$id.stdout" 2> "$C4_OUT/$id.stderr" || raw=$?
            printf '%s\n' "$raw" > "$C4_OUT/$id.exit"
            test ! -s "$C4_OUT/$id.transport"
          }
          RUN
          sha256sum "$out/helpers/run.sh" > "$out/helpers.sha256"
      - name: Locked dependencies and actual application types
        run: |
          set -euo pipefail
          out="$C4_OUT"
          raw=0
          env -u NODE_OPTIONS npm ci > "$out/npm-ci.stdout" 2> "$out/npm-ci.stderr" || raw=$?
          printf '%s\n' "$raw" > "$out/npm-ci.exit"
          test "$raw" -eq 0
          raw=0
          : > "$out/types.transport"
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" SIM_OFFLINE_RECEIPT="$out/types.transport" timeout --signal=TERM --kill-after=15s 3m node node_modules/typescript/bin/tsc --noEmit -p tsconfig.app.json > "$out/types.stdout" 2> "$out/types.stderr" || raw=$?
          printf '%s\n' "$raw" > "$out/types.exit"
          test "$raw" -eq 0
          test ! -s "$out/types.stdout"
          test ! -s "$out/types.stderr"
          test ! -s "$out/types.transport"
      - name: Isolated exact Playwright and real prepared fonts
        run: |
          set -euo pipefail
          out="$C4_OUT";tools="$RUNNER_TEMP/c4-game-tools";test ! -e "$tools"
          env -u NODE_OPTIONS npm install --prefix "$tools" --no-save --package-lock=false playwright@1.64.0 > "$out/browser-install.log" 2>&1
          test ! -e node_modules/playwright;test ! -e node_modules/playwright-core
          ln -s "$tools/node_modules/playwright" node_modules/playwright;ln -s "$tools/node_modules/playwright-core" node_modules/playwright-core
          export PLAYWRIGHT_BROWSERS_PATH="$tools/browsers"
          echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV";echo "C4_TOOLS=$tools" >> "$GITHUB_ENV";echo "PLACEMENT_TOOLS=$tools" >> "$GITHUB_ENV"
          executable=$(node -e 'const a=require("node:assert/strict");a.equal(require("playwright/package.json").version,"1.64.0");a.equal(require("playwright-core/package.json").version,"1.64.0");process.stdout.write(require("playwright").chromium.executablePath())')
          if test ! -f "$executable";then env -u NODE_OPTIONS node "$tools/node_modules/playwright/cli.js" install chromium > "$out/chromium-install.log" 2>&1;fi
          test -f "$executable";printf '%s\n' "$executable" > "$out/chromium.path"
          env -u NODE_OPTIONS node scripts/qa/freeKickLab1070.mjs --prefetch-fonts-only > "$out/font-prefetch.log" 2>&1
          sha=$(sha256sum "$FREE_KICK_FONT_CACHE/manifest.json" | cut -d' ' -f1);echo "FONT_CACHE_MANIFEST_SHA256=$sha" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Existing Brand-reader Python tools only
        run: |
          env -u NODE_OPTIONS python -m pip install fonttools pillow > "$C4_OUT/python-install.log" 2>&1
          python -m pip freeze > "$C4_OUT/python-packages.initial"
      - name: Actual Vite manifest build and post-qualification inventories
        id: build
        run: |
          set -euo pipefail
          out="$C4_OUT";source "$out/helpers/run.sh"
          run build 5m npm run build -- --manifest;test "$(cat "$out/build.exit")" -eq 0
          test -f dist/.vite/manifest.json
          sha256sum -c "$out/source.initial.sha256" > "$out/source.prebrowser-held.log"
          for pair in "deps:node_modules" "tools:$C4_TOOLS" "fonts:$FREE_KICK_FONT_CACHE" "dist:dist";do
            label="${pair%%:*}";dir="${pair#*:}";find "$dir" -type f -print0 | sort -z > "$out/$label.members";xargs -0 sha256sum < "$out/$label.members" > "$out/$label.sha256"
          done
          find node_modules -type l -printf '%p -> %l\n' | sort > "$out/dependency-links.before"
          tar -cf "$out/dist.tar" -C dist .;tar -cf "$out/font-cache.tar" -C "$FREE_KICK_FONT_CACHE" .
      - name: Early all fifteen unchanged current fatal page caps
        id: caps
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          out="$PLACEMENT_OUT";: > "$out/caps-controller.transport";export SIM_OFFLINE_RECEIPT="$out/caps-controller.transport"
          export NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs"
          node <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict'),{createHash}=require('node:crypto'),sha=b=>createHash('sha256').update(b).digest('hex');
          const original="'use strict';\nconst fs = require('node:fs');\nconst path = require('node:path');\nconst assert = require('node:assert/strict');\nconst { createHash } = require('node:crypto');\nconst hash = value => createHash('sha256').update(value).digest('hex');\nif (path.basename(process.argv[1] || '') === 'prerender.mjs') {\n  const cache = process.env.FREE_KICK_FONT_CACHE;\n  const manifestBytes = fs.readFileSync(path.join(cache, 'manifest.json'));\n  assert.match(process.env.FONT_CACHE_MANIFEST_SHA256 || '', /^[a-f0-9]{64}$/);\n  assert.equal(hash(manifestBytes), process.env.FONT_CACHE_MANIFEST_SHA256, 'Prepared font manifest stays exact');\n  const sheet = [...fs.readFileSync('index.html', 'utf8').matchAll(/<link\\s+href=\"(https:\\/\\/fonts\\.googleapis\\.com\\/[^\\\"]+)\"\\s+rel=\"stylesheet\"/g)].map(m => new URL(m[1]).href);\n  assert.equal(sheet.length, 1, 'Use the actual single template stylesheet');\n  const entries = JSON.parse(manifestBytes);\n  assert(Array.isArray(entries) && entries.length > 1);\n  const fonts = new Map();\n  for (const entry of entries) {\n    assert(!fonts.has(entry.url), 'No duplicate font cache URL');\n    const url = new URL(entry.url);\n    assert(['https://fonts.googleapis.com', 'https://fonts.gstatic.com'].includes(url.origin));\n    assert.equal(url.href, entry.url);\n    assert.equal(entry.file, hash(entry.url));\n    assert.match(entry.sha256, /^[a-f0-9]{64}$/);\n    assert.equal(typeof entry.contentType, 'string');\n    const body = fs.readFileSync(path.join(cache, entry.file));\n    assert.equal(hash(body), entry.sha256, 'Prepared font body stays exact');\n    fonts.set(entry.url, { ...entry, body });\n  }\n  assert(fonts.has(sheet[0]), 'Current template stylesheet is cached');\n  const css = fonts.get(sheet[0]);\n  assert.match(css.contentType, /^text\\/css(?:;|$)/);\n  const declared = [...new Set([...css.body.toString('utf8').matchAll(/url\\(\\s*['\"]?(https:\\/\\/[^)'\"\\s]+)/g)].map(m => m[1]))];\n  as