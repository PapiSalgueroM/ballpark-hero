          node <<'RETRY'
          const fs=require('node:fs'),a=require('node:assert/strict'),{createHash}=require('node:crypto'),out=process.env.C4_OUT,hash=b=>createHash('sha256').update(b).digest('hex');
          const original=fs.readFileSync(out+'/weights-cached-fonts.cjs','utf8'),before="path.basename(process.argv[1] || '') === 'sweepWeight.mjs'",after="path.basename(process.argv[1] || '') === 'playFootballConnect4Failures.mjs'";
          a.equal(original.split(before).length,2);const changed=original.replace(before,after);a.notEqual(changed,original);a.equal(changed.replace(after,before),original);
          fs.writeFileSync(out+'/retry-cached-fonts.cjs',changed,{flag:'wx'});
          fs.writeFileSync(out+'/retry-font-binding.json',JSON.stringify({beforeSHA256:hash(original),changedSHA256:hash(changed),wholeInverseExact:true,onlyExistingGateChanged:true},null,2)+'\n',{flag:'wx'});
          RETRY
          sha256sum "$out/retry-cached-fonts.cjs" >> "$out/helpers.sha256"
          for mode in normal control;do
            : > "$out/retry-$mode.transport";: > "$out/retry-$mode.fonts";: > "$out/retry-$mode.contexts";: > "$out/retry-$mode.flags"
            fault="";if test "$mode" = control;then fault=accept-on-error;fi
            raw=0
            NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs --require=$out/retry-cached-fonts.cjs" SIM_OFFLINE_RECEIPT="$out/retry-$mode.transport" FONT_CACHE_USE_RECEIPT="$out/retry-$mode.fonts" SWEEP_CONTEXT_RECEIPT="$out/retry-$mode.contexts" SWEEP_FLAG_RECEIPT="$out/retry-$mode.flags" C4FAIL_CONTROL="$fault" timeout --signal=TERM --kill-after=15s 5m node scripts/playFootballConnect4Failures.mjs > "$out/retry-$mode.stdout" 2> "$out/retry-$mode.stderr" || raw=$?
            printf '%s\n' "$raw" > "$out/retry-$mode.exit";test "$raw" -eq 0;test ! -s "$out/retry-$mode.transport";test ! -s "$out/retry-$mode.stderr"
          done
          grep -Fqx 'playFootballConnect4Failures: green. Failed checks keep the guess and turn; a valid answer alone places the piece.' "$out/retry-normal.stdout"
          grep -Eq '^playFootballConnect4Failures control: green\. Accept-on-error fired and [1-9][0-9]* assertions? caught it\.$' "$out/retry-control.stdout"
          sha256sum -c "$out/source.initial.sha256" > "$out/source.post-retry-held.log"
      - name: Actual source-shell native restart draft and newer-request ownership
        run: |
          set -euo pipefail
          out="$C4_OUT";source "$out/helpers/run.sh"
          run native 5m node scripts/qa/playFootballConnect4RequestOwnership.mjs
          test "$(cat "$out/native.exit")" -eq 0
          test ! -s "$out/native.stderr"
          grep -Fqx 'C4_NATIVE_REQUEST_OWNERSHIP_PASSED: 3 profiles, 10 copied controls; no live backend or publication claim.' "$out/native.stdout"
          sha256sum -c "$out/source.initial.sha256" > "$out/source.post-native-held.log"
      - name: Always retain source, post-qualification inventories and originals
        if: ${{ always() }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/c4-game";mkdir -p "$out";failed=0
          git ls-files -z | sort -z > "$out/source-members.final"
          cmp "$out/source-members.initial" "$out/source-members.final" || failed=1
          xargs -0 sha256sum < "$out/source-members.final" > "$out/source.final.sha256"
          sha256sum -c "$out/source.initial.sha256" > "$out/source-held.log" 2>&1 || failed=1
          git ls-files --others --exclude-standard -z | sort -z > "$out/untracked.final"
          cmp "$out/untracked.initial" "$out/untracked.final" || failed=1
          git diff --exit-code HEAD > "$out/working-source.diff" || failed=1
          git for-each-ref --format='%(refname) %(objectname)' > "$out/refs.after"
          cmp "$out/refs.before" "$out/refs.after" || failed=1
          sha256sum -c "$out/helpers.sha256" > "$out/helpers-held.log" 2>&1 || failed=1
          sha256sum -c "$out/controller-copy.sha256" > "$out/controller-copy-final-held.log" 2>&1 || failed=1
          for pair in "deps:node_modules" "tools:${C4_TOOLS:-}" "fonts:${FREE_KICK_FONT_CACHE:-}" "dist:dist";do
            label="${pair%%:*}";dir="${pair#*:}"
            if test -f "$out/$label.sha256";then
              find "$dir" -type f -print0 | sort -z > "$out/$label.members.final"
              cmp "$out/$label.members" "$out/$label.members.final" || failed=1
              sha256sum -c "$out/$label.sha256" > "$out/$label-held.log" 2>&1 || failed=1
            else printf 'POST_QUALIFICATION_INVENTORY_NOT_CREATED\n' > "$out/$label-not-created.txt";failed=1;fi
          done
          if test -f "$out/dependency-links.before";then
            find node_modules -type l -printf '%p -> %l\n' | sort > "$out/dependency-links.final"
            cmp "$out/dependency-links.before" "$out/dependency-links.final" || failed=1
          else failed=1;fi
          if test -f "$out/python-packages.initial";then python -m pip freeze > "$out/python-packages.final";cmp "$out/python-packages.initial" "$out/python-packages.final" || failed=1;fi
          printf '%s\n' "$failed" > "$out/final-holds.exit"
          printf '{"scope":"C4_GAME_BUILD_BROWSER_QUALIFICATION_ONLY","source":"%s","productParent":"%s","focusedInverseProof":"SEPARATE_FOCUSED_BRANCH","build":"READ_ACTUAL_RAW","caps15":"READ_ACTUAL_RAW_AND_FONT_RECEIPTS","builtReaders15":"READ_ACTUAL_ADMISSION","retryBaselineAndAcceptOnErrorControl":"READ_ACTUAL_RAW_AND_CLOSINGS","native":"THREE_SOURCE_SHELL_VIEWPORTS_SIX_SYNTHETIC_JOURNEYS_ONLY","nativePixelReview":"OWED_ROOT_ORIGINAL9VIEW","fullDefaultSuite":"SEPARATE_FULL_WORKFLOW_NO_CREDIT_HERE","publicSnapshotsRegenerated":false,"fullSEO":"UNRUN","globalSims":"UNRUN","releaseOrPublicationReady":false,"dependencyInventoryScope":"POST_BUILD_ONLY"}\n' "$GITHUB_SHA" "$EXPECTED_PARENT" > "$out/SCOPE.json"
          find "$out" -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/c4-game-evidence.sha256"
          cp "$RUNNER_TEMP/c4-game-evidence.sha256" "$out/evidence.sha256"
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: football-connect4-game-${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/c4-game
          if-no-files-found: error
          retention-days: 14
