name: Tycoon money display

on:
  workflow_dispatch:
  push:
    branches:
      - codex/tycoon-money-display-1092
  pull_request:
    paths:
      - .github/workflows/tycoon-money-display.yml
      - src/lib/wonderkidFactory.ts
      - src/hooks/useWonderkidFactory.ts
      - src/pages/StadiumTycoon.tsx
      - scripts/simTycoonMoneyDisplay.mjs

permissions:
  contents: read
concurrency:
  group: tycoon-money-display-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      SIM_NETWORK: offline
      ENGINES: chromium
      SEO_SPLIT_BASE_REF: HEAD
      TZ: UTC
      SIM_OFFLINE_RECEIPT: tycoon-money-display-artifacts/transport.log
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Hold remote source and dependencies
        run: |
          mkdir -p tycoon-money-display-artifacts/dependencies tycoon-money-display-artifacts/regressions
          git rev-parse HEAD > tycoon-money-display-artifacts/source-head.txt
          git rev-parse 'HEAD^{tree}' > tycoon-money-display-artifacts/source-tree.txt
          git archive HEAD | gzip > tycoon-money-display-artifacts/source.tar.gz
          printf '%s\n' '${{ github.run_id }}' '${{ github.run_attempt }}' '${{ github.job }}' > tycoon-money-display-artifacts/run.txt
          cp package.json package-lock.json tycoon-money-display-artifacts/dependencies/
          npm ci
          node --input-type=module <<'NODE'
          import fs from 'node:fs'; import assert from 'node:assert/strict'; import { createHash } from 'node:crypto';
          const hash=b=>createHash('sha256').update(b).digest('hex'), rows=[];
          for(const [path,entry] of Object.entries(JSON.parse(fs.readFileSync('package-lock.json')).packages)) {
            if(!path.startsWith('node_modules/')||!fs.existsSync(path+'/package.json'))continue;
            const raw=fs.readFileSync(path+'/package.json'), version=JSON.parse(raw).version;
            assert.equal(version,entry.version,path); const sha256=hash(raw);
            fs.writeFileSync('tycoon-money-display-artifacts/dependencies/'+sha256+'.json',raw); rows.push({path,version,sha256});
          }
          assert(rows.length>0);fs.writeFileSync('tycoon-money-display-artifacts/installed-before.json',JSON.stringify(rows,null,2));
          NODE
          npm install --no-save playwright
          node --input-type=module <<'NODE'
          import fs from 'node:fs'; import assert from 'node:assert/strict'; import { createHash } from 'node:crypto';
          const hash=b=>createHash('sha256').update(b).digest('hex');
          const before=JSON.parse(fs.readFileSync('tycoon-money-display-artifacts/installed-before.json'));
          for(const row of before){const raw=fs.readFileSync(row.path+'/package.json');assert.equal(JSON.parse(raw).version,row.version);assert.equal(hash(raw),row.sha256);}
          const versions=['playwright','playwright-core','react','react-dom','esbuild','vite'].map(name=>{const raw=fs.readFileSync('node_modules/'+name+'/package.json');fs.writeFileSync('tycoon-money-display-artifacts/dependencies/'+name+'-package.json',raw);return{name,version:JSON.parse(raw).version,sha256:hash(raw)};});
          fs.writeFileSync('tycoon-money-display-artifacts/dependencies/runtime-packages.json',JSON.stringify(versions,null,2));
          fs.writeFileSync('tycoon-money-display-artifacts/node-versions.json',JSON.stringify(process.versions,null,2));
          console.log(`Held ${before.length} installed manifest bytes before runtime checks.`);
          NODE
          npx playwright install --with-deps chromium
          python -m pip install fonttools pillow
      - name: Proper application types and build
        id: build
        run: |
          node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee tycoon-money-display-artifacts/types.log
          npm run build 2>&1 | tee tycoon-money-display-artifacts/build.log
      - name: Actual display leaves and player sale state
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" timeout --signal=TERM --kill-after=15s 10m node scripts/simTycoonMoneyDisplay.mjs 2>&1 | tee tycoon-money-display-artifacts/outcomes.log
      - name: Retain focused proof promptly
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: tycoon-money-display-outcomes-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tycoon-money-display-artifacts/outcomes/
            tycoon-money-display-artifacts/outcomes.log
            tycoon-money-display-artifacts/source-head.txt
            tycoon-money-display-artifacts/source-tree.txt
          retention-days: 7
          if-no-files-found: error
      - name: Original tycoon economy save and presentation gates
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          failed=0
          for harness in simWonderkid simStadiumTycoon simTycoonRooms simTycoonPacks simTycoonGear simTycoonGearPage simTycoonClock simTycoonHelp simTycoonLoads simNumberFormatting; do
            NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" ONLY="$harness" node scripts/runAllSims.mjs --browser 2>&1 | tee "tycoon-money-display-artifacts/regressions/$harness.log" || failed=1
          done
          exit "$failed"
      - name: All twenty built readers and source anchors
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          failed=0
          for harness in simAdsense simBrand simHeadTags simHiddenPages simHubs simIndexNow simIndexing simInternalLinks simNoRivalNames simPrerender simPrerenderBoot simRetiredRoutes simSchema simSitemap simSnapshotAssets simSiteSearch simGuideHeadings simSeoMetaSplit simHomeCopy simHarnessAnchors; do
            NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" ONLY="$harness" node scripts/runAllSims.mjs --browser 2>&1 | tee "tycoon-money-display-artifacts/regressions/$harness.log" || failed=1
          done
          exit "$failed"
      - name: Original source and installed manifests held
        if: ${{ !cancelled() }}
        run: |
          git diff --exit-code HEAD -- src scripts .github/workflows package.json package-lock.json
          cmp package.json tycoon-money-display-artifacts/dependencies/package.json
          cmp package-lock.json tycoon-money-display-artifacts/dependencies/package-lock.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs'; import assert from 'node:assert/strict'; import { execFileSync } from 'node:child_process'; import { createHash } from 'node:crypto';
          const allowed=new Set(['src/lib/wonderkidFactory.ts','src/hooks/useWonderkidFactory.ts','src/pages/StadiumTycoon.tsx','scripts/simTycoonMoneyDisplay.mjs','.github/workflows/tycoon-money-display.yml','docs/PROJECT-STATE.md']);
          const changed=execFileSync('git',['diff','--name-only','8fe82a4dc1346f7d5b8072f387f3acb34bbaa3c8','HEAD'],{encoding:'utf8'}).trim().split('\n').filter(Boolean);
          assert(changed.length>0); assert(changed.every(file=>allowed.has(file)),JSON.stringify(changed));
          const before=JSON.parse(fs.readFileSync('tycoon-money-display-artifacts/installed-before.json'));
          const after=before.map(row=>{const raw=fs.readFileSync(row.path+'/package.json');return{path:row.path,version:JSON.parse(raw).version,sha256:createHash('sha256').update(raw).digest('hex')};});
          fs.writeFileSync('tycoon-money-display-artifacts/installed-after.json',JSON.stringify(after,null,2)); assert.deepEqual(after,before);
          console.log(`Held ${after.length} locked manifest bytes and the six-file source scope.`);
          NODE
      - name: Retain complete raw evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: tycoon-money-display-${{ github.run_id }}-${{ github.run_attempt }}
          path: tycoon-money-display-artifacts/
          retention-days: 7
          if-no-files-found: error
