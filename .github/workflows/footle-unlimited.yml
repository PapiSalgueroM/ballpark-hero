name: Footle Unlimited session verification

on:
  pull_request:
    paths:
      - .github/workflows/footle-unlimited.yml
      - src/pages/Footle.tsx
      - src/hooks/useGame.ts
      - src/lib/footleUnlimitedSession.ts
      - src/test/footleUnlimitedSession.test.tsx
      - scripts/simFootleUnlimited.mjs
      - scripts/qa/footleUnlimited1006.mjs

permissions:
  contents: read
concurrency:
  group: footle-unlimited-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    env:
      SIM_NETWORK: offline
      ENGINES: chromium
      VITEST_MAX_FORKS: 1
      VITEST_MIN_FORKS: 1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install verification dependencies
        run: |
          mkdir -p footle-unlimited-artifacts
          npm ci
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Type check and build
        id: build
        run: |
          node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee footle-unlimited-artifacts/types.log
          npm run build 2>&1 | tee footle-unlimited-artifacts/build.log
      - name: Unlimited outcomes and effective controls
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: FOOTLE_UNLIMITED_CONTROL=all ONLY=simFootleUnlimited node scripts/runAllSims.mjs 2>&1 | tee footle-unlimited-artifacts/unlimited.log
      - name: Shared scoring and harness anchors
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          failed=0
          for harness in simNoDoubleRecord simHarnessAnchors; do
            ONLY="$harness" node scripts/runAllSims.mjs 2>&1 | tee "footle-unlimited-artifacts/$harness.log" || failed=1
          done
          exit "$failed"
      - name: Native saved puzzles and fresh answers
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/qa/footleUnlimited1006.mjs 2>&1 | tee footle-unlimited-artifacts/native.log
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: footle-unlimited-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 1
          path: footle-unlimited-artifacts/
