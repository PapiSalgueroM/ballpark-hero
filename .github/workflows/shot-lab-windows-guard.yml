name: Shot Lab Windows guard verification

on:
  pull_request:
    paths:
      - .github/workflows/shot-lab-windows-guard.yml
      - scripts/qa/shotLabWindowsGuard.mjs
      - scripts/simBuzzerShotLab.mjs
      - scripts/simHarnessAnchors.mjs
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: shot-lab-windows-guard-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      SIM_NETWORK: offline
      VITEST_MAX_FORKS: 1
      VITEST_MIN_FORKS: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install test dependencies
        run: npm ci
      - name: Original finding and fixed CRLF proof
        run: |
          mkdir -p shot-lab-windows-artifacts
          git rev-parse HEAD | tee shot-lab-windows-artifacts/commit.txt
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/qa/shotLabWindowsGuard.mjs 2>&1 | tee shot-lab-windows-artifacts/proof.log
      - name: Preserve original and fixed evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shot-lab-windows-guard-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          path: shot-lab-windows-artifacts/
