name: K League unchanged original pool harness diagnostic
on:
  push:
    branches: [codex/k-league-original-pool-diagnostic-20261105]
permissions:
  contents: read
concurrency:
  group: k-league-original-pool-diagnostic-${{ github.ref }}
  cancel-in-progress: false
env:
  CI: '1'
  SIM_NETWORK: offline
  TZ: UTC
  PRODUCT_CORE: 671730c30f67685f070593af7b2464a9cc1f5352
  PRODUCT_TREE: 7080fc953cab1ebbb3f616b7741f022c8b7a8ea0
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Bind the exact original pool, unchanged harness and sole diagnostic workflow
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/k-league-original-pool-diagnostic"
          test ! -e "$OUT"
          mkdir -p "$OUT/logs" "$OUT/transport" "$OUT/original"
          printf 'QA_OUT=%s\n' "$OUT" >> "$GITHUB_ENV"
          export QA_OUT="$OUT"
          git rev-parse HEAD HEAD^{tree} > "$OUT/source.txt"
          git diff --name-status --no-renames HEAD^ HEAD > "$OUT/qa-delta.txt"
          git ls-files -z | sort -z | xargs -0 sha256sum > "$OUT/source-before.sha256"
          git ls-files -s > "$OUT/index-before.txt"
          git ls-files -z > "$OUT/tracked-before.bin"
          for lock in package.json package-lock.json bun.lock bun.lockb; do if test -f "$lock"; then sha256sum "$lock"; fi; done > "$OUT/locks-before.sha256"
          git status --porcelain=v1 --untracked-files=all > "$OUT/status-before.txt"
          test ! -s "$OUT/status-before.txt"
          node --input-type=module <<'PINS'
          import fs from 'node:fs';import assert from 'node:assert/strict';import crypto from 'node:crypto';import{execFileSync}from'node:child_process';
          const out=process.env.QA_OUT,wf='.github/workflows/k-league-original-pool-diagnostic-20261105.yml',git=(...a)=>execFileSync('git',a,{encoding:'utf8'}).trim(),blob=b=>crypto.createHash('sha1').update(Buffer.from('blob '+b.length+'\0')).update(b).digest('hex'),sha=b=>crypto.createHash('sha256').update(b).digest('hex');
          assert.equal(process.env.PRODUCT_CORE,'671730c30f67685f070593af7b2464a9cc1f5352');assert.equal(process.env.PRODUCT_TREE,'7080fc953cab1ebbb3f616b7741f022c8b7a8ea0');
          assert.equal(git('rev-parse','HEAD^'),process.env.PRODUCT_CORE);assert.equal(git('rev-parse','HEAD^^{tree}'),process.env.PRODUCT_TREE);
          assert.deepEqual(fs.readFileSync(out+'/qa-delta.txt','utf8').trimEnd().split('\n'),['A\t'+wf]);
          const pins={
           'scripts/simCareerClubPool.mjs':'f88897c263ecf23ab82ef1b0ea93eaa22e942fe3',
           'src/data/soccerCareerClubPool.ts':'9340217fac2ae3a86877ac878fcd677d22c973bd',
           'scripts/genCareerClubPool.mjs':'c6bb0149ee6495ea6c443d172cb77fe45a3d9fd0',
           'scripts/lib/offlineTransport.cjs':'0fda542a2649fe5da937c6976fd0f5b6073e74b6',
           'package.json':'2ff64986fb76ebc51b706f2fd24765768874008a',
           'package-lock.json':'97d6f12a052f25f400462938c241789a083f0bfe',
           'tsconfig.app.json':'51f581dd91641b4c1f1219f646788e73cf6bf00c'
          };
          const rows=Object.entries(pins).map(([path,gitBlob])=>{const b=fs.readFileSync(path);assert.equal(blob(b),gitBlob,path);return{path,gitBlob,bytes:b.length,sha256:sha(b)};});
          for(const source of ['scripts/simCareerClubPool.mjs','src/data/soccerCareerClubPool.ts']){const b=fs.readFileSync(source),leaf=source.split('/').at(-1);fs.writeFileSync(out+'/original/'+leaf,b,{flag:'wx'});assert(fs.readFileSync(out+'/original/'+leaf).equals(b));}
          fs.copyFileSync(wf,out+'/workflow.yml');fs.writeFileSync(out+'/workflow-source.json',JSON.stringify({head:git('rev-parse','HEAD'),tree:git('rev-parse','HEAD^{tree}'),gitBlob:git('hash-object',wf)})+'\n');
          fs.writeFileSync(out+'/input-pins.json',JSON.stringify({role:'UNCHANGED_ORIGINAL_671_POOL_HARNESS_DIAGNOSTIC_NOT_K_FEATURE',product:process.env.PRODUCT_CORE,tree:process.env.PRODUCT_TREE,rows,QAAdditions:[wf],noGeneratorRun:true,noAppMutation:true,noBuildOrBrowser:true},null,2)+'\n');
          PINS
      - name: Install the held app dependencies only
        run: |
          set -euo pipefail
          test "$(bun --version)" = 1.4.4
          bun --version > "$QA_OUT/logs/bun-version.log"
          node --version > "$QA_OUT/logs/node-version.log"
          bun install --frozen-lockfile > "$QA_OUT/logs/bun-install.log" 2>&1
          node -p "JSON.stringify({router:require('react-router-dom/package.json').version,vite:require('vite/package.json').version,rollup:JSON.parse(require('fs').readFileSync('node_modules/rollup/package.json','utf8')).version})" > "$QA_OUT/logs/dependency-versions.json"
          git diff --exit-code HEAD -- package.json package-lock.json bun.lock bun.lockb
      - name: Proper application types on the unchanged original
        run: |
          set -euo pipefail
          export GIT_NO_LAZY_FETCH=1
          export NODE_OPTIONS="--require=$GITHUB_WORKSPACE/scripts/lib/offlineTransport.cjs"
          : > "$QA_OUT/transport/types-before.log"
          set +e
          SIM_OFFLINE_RECEIPT="$QA_OUT/transport/types-before.log" node_modules/.bin/tsc --noEmit -p tsconfig.app.json > "$QA_OUT/logs/types-before.stdout.log" 2> "$QA_OUT/logs/types-before.stderr.log"
          native_exit=$?
          printf '%s\n' "$native_exit" > "$QA_OUT/types-before.exit" || exit 1
          test "$native_exit" = 0 || exit "$native_exit"
          test ! -s "$QA_OUT/transport/types-before.log" || exit 1
          printf '%s\n' '{"command":"node_modules/.bin/tsc --noEmit -p tsconfig.app.json","exit":0}' > "$QA_OUT/types-before-passed.json" || exit 1
      - name: Retain the unchanged original normal pool harness native result
        run: |
          set +e
          set -uo pipefail
          export GIT_NO_LAZY_FETCH=1
          export NODE_OPTIONS="--require=$GITHUB_WORKSPACE/scripts/lib/offlineTransport.cjs"
          test -z "${SIM_CLUB_POOL_CONTROL:-}" || exit 1
          : > "$QA_OUT/transport/pool-harness.log" || exit 1
          SIM_OFFLINE_RECEIPT="$QA_OUT/transport/pool-harness.log" node --unhandled-rejections=strict scripts/simCareerClubPool.mjs > "$QA_OUT/logs/pool-harness.stdout.log" 2> "$QA_OUT/logs/pool-harness.stderr.log"
          native_exit=$?
          printf '%s\n' "$native_exit" > "$QA_OUT/pool-harness.exit" || exit 1
          test ! -s "$QA_OUT/transport/pool-harness.log" || exit 1
          NATIVE_EXIT="$native_exit" node --input-type=module <<'DIAGNOSTIC'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const out=process.env.QA_OUT,nativeExit=Number(process.env.NATIVE_EXIT);assert(Number.isSafeInteger(nativeExit)&&nativeExit>=0);
          fs.writeFileSync(out+'/DIAGNOSTIC-REPLAY.json',JSON.stringify({status:'UNCHANGED_ORIGINAL_NATIVE_RESULT_RETAINED',product:process.env.PRODUCT_CORE,tree:process.env.PRODUCT_TREE,command:'node --unhandled-rejections=strict scripts/simCareerClubPool.mjs',harnessGitBlob:'f88897c263ecf23ab82ef1b0ea93eaa22e942fe3',poolGitBlob:'9340217fac2ae3a86877ac878fcd677d22c973bd',nativeExit,stdout:'logs/pool-harness.stdout.log',stderr:'logs/pool-harness.stderr.log',scope:'Diagnostic attribution only. No assertion, expected rational, seed, guard or source edit. The actual unchanged harness verdict remains native and fatal when nonzero; no K feature, generated-output, build or parity qualification is inferred.'},null,2)+'\n');
          DIAGNOSTIC
          record_exit=$?
          test "$record_exit" = 0 || exit "$record_exit"
          exit "$native_exit"
      - name: Hold all original source, index, paths, locks and receipts
        if: always()
        run: |
          set -euo pipefail
          git ls-files -z | sort -z | xargs -0 sha256sum > "$QA_OUT/source-after.sha256"
          git ls-files -s > "$QA_OUT/index-after.txt"
          git ls-files -z > "$QA_OUT/tracked-after.bin"
          for lock in package.json package-lock.json bun.lock bun.lockb; do if test -f "$lock"; then sha256sum "$lock"; fi; done > "$QA_OUT/locks-after.sha256"
          cmp "$QA_OUT/source-before.sha256" "$QA_OUT/source-after.sha256"
          cmp "$QA_OUT/index-before.txt" "$QA_OUT/index-after.txt"
          cmp "$QA_OUT/tracked-before.bin" "$QA_OUT/tracked-after.bin"
          cmp "$QA_OUT/locks-before.sha256" "$QA_OUT/locks-after.sha256"
          git diff --exit-code HEAD > "$QA_OUT/source-diff.txt"
          git status --porcelain=v1 --untracked-files=all > "$QA_OUT/status-after.txt"
          test ! -s "$QA_OUT/status-after.txt"
          node --input-type=module <<'HELD'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const out=process.env.QA_OUT,receipts=fs.readdirSync(out+'/transport').sort().map(file=>{const b=fs.readFileSync(out+'/transport/'+file);assert.equal(b.length,0,file);return{file,bytes:b.length};});
          if(fs.existsSync(out+'/DIAGNOSTIC-REPLAY.json'))assert.deepEqual(receipts.map(r=>r.file),['pool-harness.log','types-before.log'],'Both actual diagnostic receipts');
          fs.writeFileSync(out+'/source-output-hold.json',JSON.stringify({sourceHeld:true,indexHeld:true,trackedPathsHeld:true,locksHeld:true,status:'clean',noAppMutation:true,receipts},null,2)+'\n');
          HELD
      - name: Pack bounded complete output or fatal diagnostic
        id: pack
        if: always()
        run: |
          set +e
          set -uo pipefail
          archive="$RUNNER_TEMP/k-league-original-pool-diagnostic-evidence.tar.gz"
          tar -czf "$archive" -C "$QA_OUT" . > "$RUNNER_TEMP/k-league-original-pool-diagnostic-pack.log" 2>&1
          pack_exit=$?
          printf '%s\n' "$pack_exit" > "$QA_OUT/pack-native.exit" || exit 1
          if [[ "$pack_exit" == 0 && -f "$archive" && "$(stat -c %s "$archive")" -le 50000000 ]]; then
            sha256sum "$archive" > "$archive.sha256" || exit 1
            printf 'archive=%s\n' "$archive" >> "$GITHUB_OUTPUT" || exit 1
            exit 0
          fi
          printf '%s\n' 'DIAGNOSTIC_ONLY_NO_COMPLETE_OUTPUT_PROOF: full pack failed or exceeded50000000bytes' > "$QA_OUT/DIAGNOSTIC-ONLY.txt" || exit 1
          cp "$RUNNER_TEMP/k-league-original-pool-diagnostic-pack.log" "$QA_OUT/pack.log" || exit 1
          diagnostic="$RUNNER_TEMP/k-league-original-pool-diagnostic-diagnostic.tar.gz"
          diagnostic_dir="$RUNNER_TEMP/k-league-original-pool-diagnostic-diagnostic"
          mkdir -p "$diagnostic_dir/logs" "$diagnostic_dir/transport" || exit 1
          find "$QA_OUT" -maxdepth 1 -type f ! -name '*.tar.gz' ! -name '*.tgz' -exec cp '{}' "$diagnostic_dir/" \; || exit 1
          cp -R "$QA_OUT/logs/." "$diagnostic_dir/logs/" || exit 1
          cp -R "$QA_OUT/transport/." "$diagnostic_dir/transport/" || exit 1
          for folder in original generated reader-controls official-controls commands; do if test -d "$QA_OUT/$folder"; then cp -R "$QA_OUT/$folder" "$diagnostic_dir/" || exit 1; fi; done
          tar -czf "$diagnostic" -C "$diagnostic_dir" . || exit 1
          test "$(stat -c %s "$diagnostic")" -le 50000000 || exit 1
          sha256sum "$diagnostic" > "$diagnostic.sha256" || exit 1
          printf 'archive=%s\n' "$diagnostic" >> "$GITHUB_OUTPUT" || exit 1
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k-league-original-pool-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.pack.outputs.archive }}
            ${{ steps.pack.outputs.archive }}.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
