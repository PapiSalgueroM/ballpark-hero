      - name: Retain every affected normal permanent check without hiding failures
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--require=$GITHUB_WORKSPACE/scripts/lib/offlineTransport.cjs"
          unset SC_EXTRA_CUPS_ENGINE US_BOARD_CONTROL_ALIAS US_BOARD_CONTROL_FILE NO_DOUBLE_SWAP FORCE_COLOR ANCHOR_CONTROL
          capture(){
            local tag="$1"; shift
            test ! -e "$OUT/$tag.exit"
            printf '%s\0' "$@" > "$OUT/$tag.argv"; : > "$OUT/$tag.transport"
            local code=0; SIM_OFFLINE_RECEIPT="$OUT/$tag.transport" "$@" > "$OUT/$tag.stdout" 2> "$OUT/$tag.stderr" || code=$?
            printf '%s\n' "$code" > "$OUT/$tag.exit"
            tail -n 16 "$OUT/$tag.stdout"; tail -n 16 "$OUT/$tag.stderr"
            test ! -s "$OUT/$tag.transport" || return 1
            return "$code"
          }
          mkdir "$OUT/permanent"
          export SC_SHIELD_REPLAY_OUT="$OUT/permanent/replay"
          export SC_SHIELD_MATCH_OUT="$OUT/permanent/match"
          export SC_SHIELD_SEVERE_OUT="$OUT/permanent/severe"
          export SC_SHIELD_PRESS_OUT="$OUT/permanent/press"
          export SC_CENTRE_FOCUS_OUT="$OUT/permanent/focus"
          failed=0
          for name in simSoccerShieldReplay simSoccerCommunityShieldMatch simSoccerCommunityShieldSevere simSoccerShieldPress simSoccerSeasonCentreFocus simCareerStory simSeasonCentreMotion simSeasonCentreAgreement simCareerDerbies simHarnessAnchors; do
            tag="normal-$name"; : > "$OUT/$tag.transport"
            printf '%s\0' node "scripts/$name.mjs" > "$OUT/$tag.argv"
            code=0; SIM_OFFLINE_RECEIPT="$OUT/$tag.transport" node "scripts/$name.mjs" > "$OUT/$tag.stdout" 2> "$OUT/$tag.stderr" || code=$?
            printf '%s\n' "$code" > "$OUT/$tag.exit"
            if test "$code" -ne 0 || test -s "$OUT/$tag.transport"; then failed=1; fi
            tail -n 12 "$OUT/$tag.stdout"; tail -n 12 "$OUT/$tag.stderr"
          done
          capture three-wrapper-admission node --input-type=module <<'WRAPPERS' || failed=1
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import {createHash} from 'node:crypto';
          const out=process.env.OUT, sha=b=>createHash('sha256').update(b).digest('hex');
          const specs=[
            {id:'match',owner:'simSoccerCommunityShieldMatch',children:9,passed:18,ownedFailures:6,declaredUnselectedSkips:30,executed:24,controls:6,complete:'complete',childField:'completedChildren',removed:'removedSourceCopy',restored:'restored-copy'},
            {id:'replay',owner:'simSoccerShieldReplay',children:6,passed:24,ownedFailures:3,declaredUnselectedSkips:21,executed:27,controls:3,complete:'complete',childField:'completedChildren',removed:'removedSourceCopies',restored:'restored-copies'},
            {id:'press',owner:'simSoccerShieldPress',children:9,passed:47,ownedFailures:13,declaredUnselectedSkips:40,executed:60,controls:6,complete:'completed',childField:'children',removed:'removedSourceCopy',restored:'restored-copy'}
          ];
          const observed=[];
          for(const s of specs){
            const dir=path.join(out,'permanent',s.id), read=name=>fs.readFileSync(path.join(dir,name)), json=name=>JSON.parse(read(name));
            assert.equal(Number(fs.readFileSync(path.join(out,'normal-'+s.owner+'.exit'),'utf8')),0,s.owner+' actual normal exit');
            const summary=json('summary.json'),receipt=json('receipt.json');
            observed.push({id:s.id,summary,receipt});
            fs.writeFileSync(path.join(out,'three-wrapper-observations-before-admission.json'),JSON.stringify(observed,null,2)+'\n');
            assert.equal(summary.children,s.children);assert.equal(summary.physicalControls,s.controls);assert.equal(summary.results.length,s.children);
            const wanted={passed:s.passed,ownedFailures:s.ownedFailures,declaredUnselectedSkips:s.declaredUnselectedSkips,executed:s.executed};
            assert.deepEqual(summary.totals,wanted);
            assert.equal(receipt[s.complete],true);assert.equal(receipt[s.childField],s.children);assert.equal(receipt[s.removed],true);
            assert.equal(receipt.primary,null);assert.deepEqual(receipt.secondary,[]);
            assert.deepEqual(json('source-after.json'),json('source-before.json'),'Actual whole input source remains held');
            let passed=0,owned=0,skips=0;
            for(const r of summary.results){
              const bytes=read(r.name+'.vitest.json'),report=JSON.parse(bytes),processRecord=json(r.name+'.process.json');
              assert.equal(sha(bytes),r.rawReportSha256);
              assert.equal(Number(read(r.name+'.exit').toString()),r.rawExit);assert.equal(processRecord.status,r.rawExit);
              assert.equal(processRecord.signal,null);assert.equal(processRecord.error,null);assert.equal(read(r.name+'.transport').length,0);
              const rows=report.testResults.flatMap(suite=>suite.assertionResults);
              const p=rows.filter(row=>row.status==='passed').length,f=rows.filter(row=>row.status==='failed').length,k=rows.filter(row=>['pending','skipped'].includes(row.status)).length;
              assert.equal(rows.length,p+f+k);assert.equal(p,r.passed);assert.equal(f,r.ownedFailures);assert.equal(k,r.declaredUnselectedSkips);
              assert.equal(r.executed,p+f);assert.equal(r.detectedRuntimeError,false);
              assert.equal(r.rawExit,f?1:0);
              for(const value of Object.values(r.counters))if(value!==null)assert.equal(value,0);
              for(const value of Object.values(r.rawErrors))if(value!==null)assert.deepEqual(value,[]);
              passed+=p;owned+=f;skips+=k;
            }
            assert.deepEqual({passed,ownedFailures:owned,declaredUnselectedSkips:skips,executed:passed+owned},wanted);
            assert.equal(summary.results.at(-1).name,s.restored);assert.equal(summary.results.at(-1).ownedFailures,0);
            const edits=fs.readdirSync(dir).filter(name=>name.endsWith('.edit.json')).sort();assert.equal(edits.length,s.controls);
            for(const name of edits){
              const e=json(name),original=e.original?.sha256??e.originalSha256,changed=e.changed?.sha256??e.changedSha256,inverse=e.inverse?.sha256??e.inverseSha256;
              assert.equal(inverse,original);assert.equal(e.physicalRestoreSha256,original);assert.notEqual(changed,original);
              const leaf=name.slice(0,-'.edit.json'.length),source=leaf==='old-source'?'old-source.ts':leaf+'.source.ts';
              assert.equal(sha(read(source)),changed,'Actual changed physical control source held');
              if(s.id==='press'&&leaf==='old-source'){
                assert.equal(e.kind,'old-English counterfactual with strict German branch retained');
                assert.equal(e.canonicalOldSha256,'196441a89d900140c05aeb9671f72e6b454cfd75eafd0264eb81083765b0fcff');
                assert.equal(e.canonicalOldGit,'6a1b88e7797e79835dcfb9195051898dcb4444f5');
                assert.equal(e.provenanceInverseSha256,original);assert.equal(e.provenanceEdits.length,4);assert.equal(e.compositionEdits.length,2);
              }
            }
          }
          fs.writeFileSync(path.join(out,'three-wrapper-admission.json'),JSON.stringify({schemaVersion:1,children:24,healthy:89,ownedFailures:22,declaredUnselectedSkips:91,executed:111,physicalControls:15,observed,runtimeCounters:null,runtimeCounterCompleteness:'UNKNOWN'},null,2)+'\n');
          console.log('GERMAN_EXISTING_WRAPPERS: actual24 children,89 healthy,22 owned,91 unselected,111 executed');
          WRAPPERS
          capture anchor-strip env ANCHOR_CONTROL=strip node scripts/simHarnessAnchors.mjs || failed=1
          capture anchor-classify node --input-type=module <<'ANCHORS' || failed=1
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const dir=process.env.OUT,sha=body=>crypto.createHash('sha256').update(body).digest('hex'),records=[];
          for(const name of ['normal-simHarnessAnchors','anchor-strip']){
            assert.equal(Number(fs.readFileSync(dir+'/'+name+'.exit','utf8')),0);
            assert.equal(fs.statSync(dir+'/'+name+'.transport').size,0);
            const stdout=fs.readFileSync(dir+'/'+name+'.stdout','utf8'),stderr=fs.readFileSync(dir+'/'+name+'.stderr','utf8'),raw=stdout+'\n'+stderr;
            assert.equal(/Unhandled (?:Errors?|Rejection|Exception)|unhandledRejection|uncaughtException|ERR_MODULE_NOT_FOUND|ERR_LOAD_URL|Failed to load url|Cannot find (?:module|package)|SyntaxError:|ReferenceError:|TypeError:/i.test(raw),false);
            const failures=raw.split(/\r?\n/).map(line=>line.trim()).filter(line=>line.startsWith('FAIL '));
            if(name==='normal-simHarnessAnchors'){
              assert.deepEqual(failures,[]);
              assert.equal(stdout.split(/\r?\n/).filter(line=>line==='simHarnessAnchors: green. Every harness parses and none carries an unmatchable anchor.').length,1);
            }else{
              assert.equal(failures.length,1);assert.equal(failures[0].startsWith('FAIL simFightCareer.mjs reads '),true);
              assert.equal(stdout.includes('[control strip applied to a copy of simFightCareer.mjs]'),true);
              assert.equal(stdout.split(/\r?\n/).filter(line=>line==='control "strip": the planted fault in simFightCareer.mjs was named and nothing else was, the check works').length,1);
            }
            records.push({name,rawExit:0,stdoutSha256:sha(Buffer.from(stdout)),stderrSha256:sha(Buffer.from(stderr)),failures,runtimeCounters:null,runtimeCounterCompleteness:'UNKNOWN'});
          }
          fs.writeFileSync(dir+'/anchor-summary.json',JSON.stringify({scope:'Existing actual source-anchor admission and real stripped-normalizer control, no exemption',healthy:true,records},null,2)+'\n');
          ANCHORS
          printf '%s\n' "$failed" > "$OUT/permanent-aggregate.exit"
          exit "$failed"
      - name: Retain complete immutable source and dependency holds
        if: always()
        run: |
          set -euo pipefail
          code=0
          if test -d "$OUT"; then
            if test -f "$OUT/source.sha256"; then sha256sum --check "$OUT/source.sha256" > "$OUT/source-held.log" 2>&1 || code=1; fi
            if test -f "$OUT/dependency.sha256"; then sha256sum --check "$OUT/dependency.sha256" > "$OUT/dependency-held.log" 2>&1 || code=1; fi
            git ls-files -z > "$OUT/source-members.after"
            if test -f "$OUT/source-members.before"; then cmp "$OUT/source-members.before" "$OUT/source-members.after" > "$OUT/source-members.log" 2>&1 || code=1; fi
            if test -d node_modules; then
              find node_modules -path node_modules/.vite -prune -o -type f -print0 | sort -z > "$OUT/dependency-members.after"
              if test -f "$OUT/dependency-members.before"; then cmp "$OUT/dependency-members.before" "$OUT/dependency-members.after" > "$OUT/dependency-members.log" 2>&1 || code=1; fi
            fi
            git diff --exit-code > "$OUT/source-diff.log" 2>&1 || code=1
            git ls-files --others --exclude-standard -z > "$OUT/untracked.after"; test ! -s "$OUT/untracked.after" || code=1
            if find "$OUT" -name '*.transport' -type f ! -size 0 | grep -q .; then code=1; fi
            printf '%s\n' "$code" > "$OUT/holds.exit"
          else code=1; fi
          exit "$code"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sc-german-supercup-focused-fix
          path: |
            ${{ runner.temp }}/sc-german-supercup-focused-fix
            ${{ github.workspace }}/tmp
          if-no-files-found: error
          retention-days: 14
