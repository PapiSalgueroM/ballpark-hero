name: Soccer Career focused diagnosis

on:
  push:
    branches:
      - codex/soccer-career-real-opponents

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      SIM_NETWORK: offline
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Prepare focused remote checks
        id: prepare
        run: |
          mkdir -p career-focused-artifacts
          git rev-parse HEAD > career-focused-artifacts/source-head.txt
          npm ci
      - name: App types
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: node_modules/.bin/tsc --noEmit -p tsconfig.app.json 2>&1 | tee career-focused-artifacts/types.log
      - name: Contract outcomes
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node node_modules/vitest/vitest.mjs run src/test/soccerCareerContracts.test.ts --maxWorkers=1 --minWorkers=1 2>&1 | tee career-focused-artifacts/contracts-tests.log
      - name: Outcome checks and effective copied defects
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: |
          failed=0
          for harness in simSoccerLeagueWorldLookup simSoccerCareerLeagueWorld simSoccerDiscipline simSoccerCompetitionNavigation simSoccerContractMoves; do
            NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node "scripts/$harness.mjs" 2>&1 | tee "career-focused-artifacts/$harness.log" || failed=1
          done
          exit "$failed"
      - name: Earlier expansion outcomes and full saved award fixtures
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: |
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node node_modules/vitest/vitest.mjs run src/test/seasonFamilySummary.test.ts src/test/soccerAwardReveal.test.tsx src/test/soccerSeasonCompetitions.test.tsx src/test/careerWallShotFriendly.test.ts src/test/careerAwardsNightCard.test.tsx --maxWorkers=1 --minWorkers=1 2>&1 | tee career-focused-artifacts/expansion-tests.log
          NODE_OPTIONS="--require=$PWD/scripts/lib/offlineTransport.cjs" node scripts/simCareerAwardsNight.mjs 2>&1 | tee career-focused-artifacts/awards-fixtures.log
      - name: Source unchanged
        if: ${{ !cancelled() }}
        run: git diff --exit-code HEAD -- src scripts .github/workflows
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: career-focused-${{ github.run_id }}-${{ github.run_attempt }}
          path: career-focused-artifacts/
          retention-days: 5
